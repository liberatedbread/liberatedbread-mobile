name: Docs Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per ref, but cancel the IN-PROGRESS run only on pull requests.
#
# On a PR, a new push supersedes the old one: cancelling the stale run saves
# minutes and its outdated result was going to be ignored anyway.
#
# On main, never cancel a run that has started. The group key is per-ref, so
# every push to main shares one group — and a run cancelled by concurrency
# reports neither success nor failure, so if a fast second push killed the
# first run mid-flight, a commit that actually broke a gate would land on main
# with no red check anywhere to show it. Run #55 on main was cancelled exactly
# this way.
#
# With cancel-in-progress false the group still serialises main: the running
# job stays running, later pushes wait pending, and GitHub keeps only the
# newest pending one (an intermediate commit may be superseded before it
# starts, but it has run no gates yet, so nothing red is hidden — and the tip
# commit always gets a full run). Serialising is also what keeps the deploy
# jobs from racing to force-push gh-pages: they never run at the same time, so
# the "cannot lock ref 'refs/heads/gh-pages'" failure that first motivated
# cancel-in-progress cannot happen here without it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # glyphs/ is Git LFS. Without this the working copy has pointer
          # files where the drawings should be, and test_glyphs.py fails on
          # every one of them for a reason that has nothing to do with the
          # change under test.
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint helper scripts
        run: ruff check .
      - name: Run tests
        run: pytest -q

  validate-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git merge-base` below needs real history, not a depth-1 tip.
          fetch-depth: 0
          # glyphs/ is Git LFS; the glyph validation below reads the files.
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate device specs against schema.json
        run: python scripts/validate_specs.py
      # Every glyph a spec points at exists and is in the manifest, every
      # glyph in the store is pointed at by something, and none of them
      # reaches outside itself. The schema can only check the shape of the
      # path string; these are the failures that actually happen.
      - name: Validate instruction glyphs
        run: python scripts/validate_glyphs.py
      # The index is built by the publish-index job, not carried in branches —
      # so what a PR owes is a spec set the generator can index, not a fresh
      # index.json. Build it and throw it away: a spec that trips the generator
      # (or is invalid) still fails here, where it is cheap to fix.
      - name: Build the spec index (result discarded; CI publishes it on main)
        run: python scripts/generate_index.py
      # The whole point of moving the build into CI is that index.json stops
      # appearing in branches — it is one file every parallel spec PR touches,
      # so every pair of them conflicted. A branch that carries it puts that
      # conflict right back.
      - name: Reject a hand-carried index.json
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Against the merge base, not the base tip: main gains index commits
          # of its own, and a branch must not be blamed for those.
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          if git diff --quiet "$base" HEAD -- device-specs/index.json; then
            echo "index.json untouched by this branch — good."
            exit 0
          fi
          msg="device-specs/index.json is generated and committed by CI on main."
          msg="$msg Drop it from this branch:"
          msg="$msg git checkout $base -- device-specs/index.json && git commit -m 'drop generated index'"
          echo "::error file=device-specs/index.json::$msg"
          exit 1

  # device-specs/index.json is generated, and used to be committed by hand in
  # every branch that added a spec. With several spec PRs open at once that is a
  # guaranteed conflict on a 60 kB machine-written file, resolved by
  # regenerating it — work no one should be doing. Build it here instead, once,
  # after the specs have landed. Downstream consumers (the mobile app vendors
  # this repo as a subtree and bundles index.json as an asset) still read a
  # committed file; it is just written by CI now.
  publish-index:
    needs: [lint-and-test, validate-specs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job holds `contents: write` (it pushes the rebuilt index to main),
      # so its actions are pinned to full commit SHAs rather than moving tags —
      # a moving tag can be repointed at malicious code, and here that code
      # would run with push access. The read-only jobs above stay on tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Regenerate device-specs/index.json
        run: python scripts/generate_index.py
      - name: Commit it if the specs moved
        run: |
          if git diff --quiet -- device-specs/index.json; then
            echo "index.json already matches the specs; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add device-specs/index.json
          git commit -m "chore: rebuild device-specs/index.json [skip ci]"
          # A push that lands on main while this job runs rejects ours. Rebase
          # onto it and rebuild rather than retrying the stale commit: the
          # index is a pure function of the specs, so the rebuilt one is right
          # for whatever main now holds.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed the rebuilt index."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on main and rebuilding."
            sleep $((attempt * 4))
            git fetch origin main
            git reset --hard origin/main
            python scripts/generate_index.py
            if git diff --quiet -- device-specs/index.json; then
              echo "Another run already published this index; done."
              exit 0
            fi
            git commit -am "chore: rebuild device-specs/index.json [skip ci]"
          done
          echo "::error::could not push the rebuilt index after 3 attempts" >&2
          exit 1

  build:
    needs: [lint-and-test, validate-specs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify device-spec JSON API is fresh and valid
        run: python scripts/build_index.py --check
      - run: mkdocs build --strict

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job holds `contents: write` (it force-pushes gh-pages), so its
      # actions are pinned to full commit SHAs rather than moving tags — see the
      # note on publish-index. The read-only jobs stay on tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify device-spec JSON API is fresh and valid
        run: python scripts/build_index.py --check
      - run: mkdocs gh-deploy --force
