name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per pull request: a re-push supersedes the previous run, which would
# otherwise keep a 60-minute emulator job (and two multi-GB native builds) on
# the runners for a commit nobody is waiting on any more.
#
# `main` gets a per-RUN group key so post-merge runs never share a group, and
# therefore can never cancel one another — they are the record of what shipped.
# Grouping them together and relying on `cancel-in-progress: false` would NOT
# be enough: GitHub keeps at most one *pending* run per group regardless of
# that setting, so a third push to main would cancel the second while it queued
# behind the first. A unique key sidesteps the queue entirely, which also makes
# `cancel-in-progress` moot for main — nothing is ever in its group to cancel.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'
  # The NDK cargokit actually builds against, shared by every job that compiles
  # the Rust crate for Android. android/app/build.gradle sets
  # `ndkVersion = flutter.ndkVersion`, cargokit's plugin.gradle forwards
  # `android.ndkVersion` to its build tool as CARGOKIT_NDK_VERSION, and Flutter
  # 3.24.5 hardcodes 23.1.7779620 (packages/flutter_tools/gradle/src/main/
  # groovy/flutter.groovy). Installing any other version just means cargokit
  # downloads this one itself, mid-build. Keep in sync with FLUTTER_VERSION.
  FLUTTER_NDK_VERSION: '23.1.7779620'

jobs:
  flutter:
    name: Flutter (test + analyze + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - name: Build host Rust library for FRB
        run: cd rust && cargo build
      - name: Export LD_LIBRARY_PATH for tests
        run: echo "LD_LIBRARY_PATH=${{ github.workspace }}/rust/target/debug" >> $GITHUB_ENV
      - name: Check FRB bindings are up to date
        run: |
          cargo install --locked flutter_rust_bridge_codegen@2.9.0
          flutter_rust_bridge_codegen generate
          git diff --exit-code lib/src/rust/ rust/src/frb_generated.rs
      - run: flutter test --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  rust:
    name: Rust (test + clippy + fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  android-build:
    name: Android build smoke (debug APK, mock mode)
    runs-on: ubuntu-latest
    needs: [flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # cargokit compiles the Rust crate during `flutter build`, so the build
      # jobs need the Rust toolchain, the Android targets, and a matching NDK.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools platforms;android-34 build-tools;34.0.0
            ndk;${{ env.FLUTTER_NDK_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Write android/local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
      - name: Flutter doctor
        run: flutter doctor -v
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=LIBERATED_BREAD_MOCK=true --verbose
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-mock.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  android-integration:
    name: Android integration tests (emulator, mock mode)
    runs-on: ubuntu-latest
    needs: [flutter]
    strategy:
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write android/local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
      - run: flutter pub get
      # cargokit compiles the Rust crate when the integration app is built.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Install only the SDK packages cargokit's native build needs, via the
      # runner's preinstalled sdkmanager. Avoid android-actions/setup-android
      # in this job — it reinstalls platform-tools and disturbed the
      # emulator-runner, leaving the emulator unable to boot. Don't reinstall
      # platform-tools: the runner's adb/emulator are what boot the AVD.
      - name: Install Android SDK packages for the Rust build
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" \
            "ndk;$FLUTTER_NDK_VERSION" \
            > /dev/null
      # Warm up the native build BEFORE the emulator step.
      #
      # This step — not the --timeout flag further down — is what fixes the
      # `loading ...` TimeoutException. `flutter test integration_test` builds
      # the app as part of *loading* the test file, and package:test_core gives
      # that synthetic load suite a hardcoded 12-minute timeout that no flag can
      # raise. On a cold runner the build is ~700s (Gradle bootstrap, cargokit's
      # build_tool pub get, four Rust targets), which ate nearly all of those 12
      # minutes and failed mock_flow_test.dart during loading, with the APK
      # finishing 5 seconds too late. Doing the build here moves it outside the
      # load clock entirely; the emulator step then reuses the warm Gradle/cargo
      # caches and rebuilds in ~2 minutes.
      #
      # This has to be its own step rather than part of the emulator script:
      # the emulator-runner step is what provides the device that `flutter test
      # integration_test` needs, so it cannot also be where the slow build
      # happens without being inside the load window again.
      - name: Warm up Gradle, cargokit and Rust build caches
        run: flutter build apk --debug --dart-define=LIBERATED_BREAD_MOCK=true
      # The Rust toolchain + NDK this job adds (~4 GB), plus the warm-up build
      # output, can starve the emulator of disk and prevent it from booting.
      # Reclaim space from large preinstalled toolchains we don't use before
      # launching the emulator. This runs after the warm-up build so the
      # printed `df -h` reflects what the emulator will actually see.
      - name: Free up disk space for the emulator
        run: |
          # Only remove large toolchains this job doesn't use; keep
          # hostedtoolcache (Java/Flutter live there).
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift 2>/dev/null || true
          # The runner image preinstalls several multi-GB NDKs. The native
          # build is done by now, so every NDK except the one it used is dead
          # weight. Don't touch system-images: the emulator-runner reuses them.
          #
          # Guard on ANDROID_SDK_ROOT being non-empty: unset it and the paths
          # below would expand to /ndk/* and /ndk-bundle, pointing these rm -rf
          # calls at the filesystem root.
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            for ndk in "${ANDROID_SDK_ROOT:?}"/ndk/*; do
              [ -d "$ndk" ] || continue
              if [ "$(basename "$ndk")" != "$FLUTTER_NDK_VERSION" ]; then
                echo "Removing unused NDK $(basename "$ndk")"
                sudo rm -rf "$ndk"
              fi
            done
            sudo rm -rf "${ANDROID_SDK_ROOT:?}/ndk-bundle" 2>/dev/null || true
          else
            echo "ANDROID_SDK_ROOT is unset or empty; skipping NDK cleanup"
          fi
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration tests on emulator
        # Outer bound so a genuinely hung test fails in an hour rather than
        # sitting on the runner for the 6-hour job default — the per-test
        # --timeout below is deliberately generous.
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The e2e walkthrough needs scripts/e2e_shot_server.py on the host
          # and 127.0.0.1 (which on an emulator reaches the emulator, not the
          # host). Run it via scripts/e2e-walkthrough.sh on macOS.
          #
          # --timeout raises the per-test *body* timeout only. It is defence in
          # depth for slow test bodies — an emulator on swiftshader with 2 cores
          # is slow — and it CANNOT extend the load phase, whose 12-minute limit
          # is hardcoded in package:test_core's synthetic load suite. Keeping
          # loading inside that limit is the warm-up build step's job.
          script: flutter test integration_test --exclude-tags=e2e --timeout 1200s --dart-define=LIBERATED_BREAD_MOCK=true

  ios-build:
    name: iOS build smoke (no-codesign, mock mode)
    runs-on: macos-latest
    needs: [flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # cargokit compiles the Rust crate during `flutter build ios`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: flutter pub get
      - name: Build iOS (simulator, no codesign)
        run: flutter build ios --debug --no-codesign --simulator --dart-define=LIBERATED_BREAD_MOCK=true
