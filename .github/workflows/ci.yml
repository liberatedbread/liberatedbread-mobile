name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per pull request: a re-push supersedes the previous run, which would
# otherwise keep a 60-minute emulator job (and two multi-GB native builds) on
# the runners for a commit nobody is waiting on any more.
#
# `main` gets a per-RUN group key so post-merge runs never share a group, and
# therefore can never cancel one another — they are the record of what shipped.
# Grouping them together and relying on `cancel-in-progress: false` would NOT
# be enough: GitHub keeps at most one *pending* run per group regardless of
# that setting, so a third push to main would cancel the second while it queued
# behind the first. A unique key sidesteps the queue entirely, which also makes
# `cancel-in-progress` moot for main — nothing is ever in its group to cancel.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

# THIS FILE IS THE TOOLCHAIN SOURCE OF TRUTH FOR DEV ENVIRONMENTS.
#
# scripts/ci-versions.sh reads the `env:` block below, and scripts/setup.sh plus
# the Claude Code session hook (.claude/hooks/session-start.sh) provision from
# what it reads — so bumping a version here moves every developer environment
# with it, and nothing needs re-pinning.
#
# EVERY PINNED VERSION LIVES IN THAT ONE BLOCK, and each step interpolates it
# rather than repeating the literal. That is a hard rule, and it is what makes
# the parser safe: it reads exactly the top-level `env:` mapping and nothing
# else, so no comment, no prose and no unrelated step can be mistaken for
# configuration.
#
# It was not always so. The parser used to hunt values out of step bodies with
# file-wide greps — the highest `platforms;android-NN` anywhere, the first
# `targets:` line containing "-android", packages scraped from `apt-get install`
# and its line continuations. Every one of those could be tripped by a COMMENT:
# naming an API level in prose really did change what dev machines installed,
# because prose and configuration look identical to a grep. Twice, while editing
# this file, an explanatory comment silently became configuration.
#
# So: if you need a new pinned value, add a key here and reference it with
# ${{ env.KEY }} (or $KEY inside `run:`). Do not inline a version at a use site,
# and do not teach the parser a new place to look.
#
# RUN `./scripts/ci-versions.sh` AFTER ANY CHANGE and check the printed values.
# A missing key falls back to a stale hard-coded default and warns on stderr, so
# a rename fails quietly in dev environments rather than loudly in CI.
#
# Three things it cannot read, which must be updated by hand in the setup
# scripts if they ever matter:
#   * the Android command-line tools build number (android-actions/setup-android
#     resolves "latest" itself) — pinned in .claude/hooks/session-start.sh
#   * the Rust toolchain version (dtolnay/rust-toolchain@stable) — a minimum is
#     pinned in scripts/setup.sh
#   * ANDROID_EMULATOR_API is declared here AND repeated in the android-
#     integration matrix, because GitHub does not expose the `env` context to
#     `strategy:`. A test keeps the two honest — see
#     test/platform/deployment_targets_test.dart.
env:
  FLUTTER_VERSION: '3.44.8'

  # The NDK cargokit actually builds against, shared by every job that compiles
  # the Rust crate for Android. android/app/build.gradle sets
  # `ndkVersion = flutter.ndkVersion`, cargokit's plugin.gradle forwards
  # `android.ndkVersion` to its build tool as CARGOKIT_NDK_VERSION, and the
  # pinned Flutter hardcodes the value. Installing any other version just means
  # cargokit downloads this one itself, mid-build.
  #
  # Keep in sync with FLUTTER_VERSION — re-read it after any bump with:
  #   grep 'val ndkVersion' "$(dirname "$(readlink -f "$(command -v flutter)")")"/../\
  #     packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt
  # (3.44.8 -> 28.2.13676358, checked.)
  FLUTTER_NDK_VERSION: '28.2.13676358'

  # ── Android SDK ────────────────────────────────────────────────────────────
  # The compile SDK: what android/app/build.gradle resolves
  # `flutter.compileSdkVersion` to (36 on Flutter 3.44.8, in the same
  # FlutterExtension.kt as the NDK above) and what rust_builder/android/
  # build.gradle now pins to match.
  ANDROID_API: '36'
  # AGP 8.6's default build-tools. Naming a newer one adds a download instead of
  # replacing one, because AGP fetches its default regardless.
  ANDROID_BUILD_TOOLS: '34.0.0'
  # Required by FLUTTER, not by anything in this repo: its Gradle plugin ships
  # packages/flutter_tools/gradle/src/main/scripts/CMakeLists.txt and wires an
  # externalNativeBuild into :app (the Android 15 16 KB page-size support), so
  # `:app:configureCMakeDebug[<abi>]` runs on every Android build and AGP
  # installs its default CMake when absent. 3.22.1 is that default for AGP 8.6;
  # if a toolchain bump moves it, this pin degrades to a small unused package
  # and Gradle fetches the right one itself. Re-check with:
  #   grep 'Install CMake' <build log>
  ANDROID_CMAKE: '3.22.1'

  # ── Android emulator ───────────────────────────────────────────────────────
  # A separate axis from the compile SDK: nothing requires the AVD to run the
  # API the app compiles against.
  ANDROID_EMULATOR_API: '34'
  # aosp_atd, not google_apis: an Automated Test Device image, which is the
  # variant Google ships for CI. It strips the launcher and the Play Services
  # stack, and that stack is not incidental here — it is what broke the job.
  #
  # Diagnosed from run 31142032906 on main, where this job hung for its full
  # 60-minute timeout with zero Dart output while the same suites passed on
  # Linux/Xvfb and the iOS simulator. Reading that run's logcat against a
  # passing run's:
  #   * `FlutterRenderer: Width is zero. 0,0` appears in BOTH, so it is normal
  #     startup noise and not the graphics failure it looks like.
  #   * The failing run alone logs onDetachedFromActivityForConfigChanges. Four
  #     seconds after the Dart VM service came up, an Android configuration
  #     change destroyed and recreated MainActivity with a fresh FlutterEngine.
  #     flutter_tools had already attached to the first engine's isolate, so it
  #     then waited forever on an isolate that would never run a test — the app
  #     process sat idle for 55 minutes. "Zero Dart output" is exactly what an
  #     orphaned VM-service attach looks like.
  #   * In the 90s before launch: an ANR in nexuslauncher, an ANR in
  #     gms.persistent, long monitor contention in system_server, Play Services
  #     "Scheduling killing of process to refresh configuration", and telephony
  #     bringing up MCC/MNC. The system was still settling when the app started.
  # (Which config field actually changed is not named anywhere in the log, so
  # that last step is inference from what was churning, not a certainty.)
  #
  # android/app/src/main/AndroidManifest.xml already declares the exact
  # configChanges set Flutter 3.44.8's own template does, byte for byte, so
  # there is no missing flag to add on our side — the fix has to be to stop the
  # churn. Removing the launcher and GMS removes what was doing it, and boots
  # faster besides.
  #
  # aosp_atd over google_atd because nothing here needs Google APIs: the app is
  # BLE + local storage, and CI runs it in mock mode. If something ever does,
  # google_atd is the one-word change. scripts/setup.sh and the session hook
  # build the local AVD from this same value, so a developer's
  # `liberated_bread_test` AVD follows — `flutter run` installs and starts the
  # activity directly, so a missing launcher does not affect it.
  ANDROID_EMULATOR_TARGET: 'aosp_atd'
  ANDROID_EMULATOR_ARCH: 'x86_64'
  ANDROID_EMULATOR_PROFILE: 'pixel_6'
  # Per-attempt bound for the emulator test run, below. Two attempts plus the
  # AVD boot have to fit inside that step's timeout-minutes.
  ANDROID_EMULATOR_ATTEMPT_TIMEOUT: '12m'
  # Flutter's spelling of ANDROID_EMULATOR_ARCH, for the warm-up build's
  # --target-platform. A second vocabulary for one fact (x86_64 <-> android-x64),
  # so it is declared here rather than inlined at the use site and
  # test/platform/deployment_targets_test.dart asserts the pair agrees. If they
  # drift, the warm-up populates caches the emulator's build cannot use and the
  # real build lands back inside package:test_core's 12-minute load window.
  ANDROID_WARMUP_TARGET_PLATFORM: 'android-x64'

  # ── Everything else the setup scripts provision ────────────────────────────
  JAVA_VERSION: '17'
  FRB_VERSION: '2.9.0'
  # Comma-separated: the shape dtolnay/rust-toolchain's `targets:` input wants.
  # Android keeps all four even though no CI job builds every one, because a dev
  # machine provisioned from this list should be able to build any ABI.
  RUST_ANDROID_TARGETS: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android'
  # x86_64-apple-ios is the Intel-Mac simulator target: unused by CI (the
  # runners are arm64) but needed by a developer on an Intel Mac.
  RUST_IOS_TARGETS: 'aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios'
  # Space-separated for `apt-get install`. Flutter's own Linux requirements:
  #   clang / cmake / ninja-build / pkg-config  the build system itself
  #   libgtk-3-dev      the GTK 3 shell the runner in linux/ is written against
  #   liblzma-dev       transitively required to link against GTK
  #   libsecret-1-dev   flutter_secure_storage_linux (HA token storage)
  #   libjsoncpp-dev    pulled in by the CMake/plugin toolchain
  #   xvfb              virtual X server, so the app can actually RUN in CI
  LINUX_DESKTOP_PACKAGES: 'clang cmake libgtk-3-dev libjsoncpp-dev liblzma-dev libsecret-1-dev ninja-build pkg-config xvfb'

jobs:
  flutter:
    name: Flutter (test + analyze + format)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - name: Build host Rust library for FRB
        run: cd rust && cargo build
      - name: Export LD_LIBRARY_PATH for tests
        run: echo "LD_LIBRARY_PATH=${{ github.workspace }}/rust/target/debug" >> $GITHUB_ENV
      - name: Check FRB bindings are up to date
        run: |
          cargo install --locked "flutter_rust_bridge_codegen@$FRB_VERSION"
          flutter_rust_bridge_codegen generate
          # `git diff --exit-code` catches edits to tracked generated files but
          # is blind to brand-new (untracked) ones, so also fail on ANY pending
          # change under the generated paths, echoing the status first so the
          # failure is diagnosable. Keep in sync with scripts/test.sh.
          git diff --exit-code lib/src/rust/ rust/src/frb_generated.rs
          drift="$(git status --porcelain --untracked-files=all lib/src/rust rust/src/frb_generated.rs)"
          if [ -n "$drift" ]; then
            echo "FRB generated output is stale (modified or untracked files):"
            echo "$drift"
            exit 1
          fi
      - run: flutter test --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  rust:
    name: Rust (test + clippy + fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  android-build:
    name: Android build smoke (debug + release APK, contents verified)
    runs-on: ubuntu-latest
    # Raised from 45: this job now also does a release build, which re-runs the
    # Dart AOT compiler for three ABIs and makes cargokit compile the crate
    # again under rust/Cargo.toml's release profile (thin LTO, codegen-units=1).
    timeout-minutes: 60
    # Gate on the cheap rust job too — a clippy/test failure in the crate must
    # not let the expensive native builds burn runner minutes.
    needs: [flutter, rust]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # cargokit compiles the Rust crate during `flutter build`, so the build
      # jobs need the Rust toolchain, the Android targets, and a matching NDK.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_ANDROID_TARGETS }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Every SDK package the build needs, installed in ONE visible step. Each
      # version comes from the env block at the top of this file, where it is
      # annotated — deliberately not repeated here, since a second copy is a
      # second thing to forget.
      #
      # This step is about making the build's inputs explicit, NOT about speed.
      # Measured from CI logs, the two mid-build installs it replaces cost 2.5s
      # (SDK platform) and 1.2s (cmake) — worth stating plainly, because "Gradle
      # downloads it mid-build" sounds expensive and is not. What it buys is
      # that Gradle no longer stops partway through to accept a licence and pull
      # a package over the network, where a blip fails the build in a place
      # nothing retries.
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            cmake;${{ env.ANDROID_CMAKE }}
            ndk;${{ env.FLUTTER_NDK_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Write android/local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
      - name: Flutter doctor
        run: flutter doctor -v
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=LIBERATED_BREAD_MOCK=true --verbose
      # A zero exit from `flutter build apk` says nothing about what is INSIDE
      # the APK, and that is where the bugs are. scripts/verify_apk.sh opens the
      # artifact and asserts on it:
      #
      #   * lib/<abi>/libliberated_bread_core.so exists and is not a stub for
      #     every ABI the build produced. A cargokit or Gradle regression that
      #     drops the Rust cdylib packages a perfectly green APK that crashes
      #     with "Failed to lookup symbol" on the first FFI call — this was
      #     previously only ever caught by running `unzip -l` by hand.
      #   * The MERGED manifest still declares INTERNET / BLUETOOTH_SCAN /
      #     BLUETOOTH_CONNECT / ACCESS_FINE_LOCATION and the applicationId is
      #     still ca.pigscanfly.liberatedbread. A plugin upgrade or a merger
      #     conflict that drops a permission produces an APK that installs fine
      #     and fails every BLE scan at runtime.
      #
      # Flutter dropped Android x86 engine builds (3.27 deprecated, removed
      # after), so debug now produces the same three engine ABIs as release;
      # requiring x86 here failed against a toolchain that can no longer
      # emit it. The same script runs locally against a local build — the
      # scripts/test.sh pattern.
      - name: Verify debug APK contents
        run: ./scripts/verify_apk.sh build/app/outputs/flutter-apk/app-debug.apk
          --require-abis arm64-v8a,armeabi-v7a,x86_64
      # Uploaded before the release build so a release-only failure still leaves
      # the debug APK downloadable for triage.
      # Best-effort upload: continue-on-error (deliberate, survives artifact-quota hits) would neutralize if-no-files-found: error anyway, so warn.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-mock.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 1
      # Only debug was ever built, which left two gaps that a release build
      # closes at once — hence one step, deliberately without the mock define:
      #
      #   1. R8. Flutter's Gradle plugin sets minifyEnabled + shrinkResources on
      #      the `release` buildType (flutter_tools/gradle/.../flutter.groovy),
      #      and this project ships no android/app/proguard-rules.pro, so
      #      release runs R8 with Flutter's default rules only. Stripping a
      #      JNI-reachable class or a native library is exactly what happens
      #      there, it is invisible in debug, and it would ship silently.
      #      Release also runs the Dart AOT compiler and packages a different
      #      ABI set (no x86), so its packaging path is genuinely a different
      #      code path, not a rerun of the debug one.
      #      No signing secrets are needed: android/app/build.gradle points the
      #      release buildType at signingConfigs.debug, so `--release` builds
      #      unattended and the `--profile` fallback is unnecessary.
      #
      #   2. The all-mock blind spot. Every other automated path passes
      #      --dart-define=LIBERATED_BREAD_MOCK=true, and
      #      lib/providers/ble_provider.dart reads it via bool.fromEnvironment —
      #      a compile-time const, so the AOT tree shaker drops the untaken
      #      branch outright. RealBleService and its flutter_blue_plus /
      #      permission_handler call sites are therefore never AOT-compiled by
      #      any mock build, and a compile or link error there could hide
      #      behind mock mode indefinitely. Omitting the define compiles the
      #      real path. NOTE: this is compile coverage only. Exercising real
      #      BLE at RUNTIME still needs physical hardware, which no hosted
      #      runner has — see scripts/run-ios-device.sh / run-android.sh.
      #
      # Kept in this job rather than a new one so it reuses the warm Gradle,
      # pub, cargo and Swatinem caches; a separate job would pay that bootstrap
      # again for identical coverage. Deliberately NOT also building an app
      # bundle: `flutter build appbundle` would repeat the same AOT + cargokit
      # work for a third time, and verifying an .aab's payload needs bundletool
      # (its manifest is protobuf, so aapt2 cannot read it) — the release APK
      # already covers the R8 and native-packaging risk that motivates it.
      - name: Build release APK (real BLE path, no mock define)
        run: flutter build apk --release --verbose
      # Identical assertions against the release artifact, so an R8 or
      # packaging regression that only bites release cannot slip through.
      # Release drops the x86 ABI, hence the shorter required set.
      - name: Verify release APK contents
        run: ./scripts/verify_apk.sh build/app/outputs/flutter-apk/app-release.apk
          --require-abis arm64-v8a,armeabi-v7a,x86_64

  android-integration:
    name: Android integration tests (emulator, mock mode)
    runs-on: ubuntu-latest
    # Job-level bound stays above the emulator step's own timeout so the step
    # limit fires first and setup/teardown still get headroom. Both came down
    # (75/60) once the Gradle cache, the x64-only warm-up and the single test
    # cycle landed: the job ran ~10m45s before those, and the emulator step
    # ~3m45s, so 50/30 is still many times the observed cost — loose enough
    # that a cold cache cannot trip it, tight enough that a genuinely hung
    # emulator stops costing an hour.
    timeout-minutes: 60
    needs: [flutter, rust]
    # The one place a pinned value is repeated instead of interpolated:
    # GitHub does not expose the `env` context to `strategy:`, so
    # ANDROID_EMULATOR_API cannot be referenced here. The matrix stays (rather
    # than collapsing to a plain input) because its value is part of this job's
    # check name — "…(34)" — which branch protection may require by name.
    # test/platform/deployment_targets_test.dart asserts the two agree.
    strategy:
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write android/local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
      - run: flutter pub get
      # cargokit compiles the Rust crate when the integration app is built.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_ANDROID_TARGETS }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Install only the SDK packages cargokit's native build needs, via the
      # runner's preinstalled sdkmanager. Avoid android-actions/setup-android
      # in this job — it reinstalls platform-tools and disturbed the
      # emulator-runner, leaving the emulator unable to boot. Don't reinstall
      # platform-tools: the runner's adb/emulator are what boot the AVD.
      # Same package set as android-build, and same reasoning — see the comment
      # there for why cmake is on the list (Flutter's own Gradle plugin wires a
      # CMakeLists into :app) and why this is about explicit inputs rather than
      # saved seconds.
      - name: Install Android SDK packages for the Rust build
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$ANDROID_API" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "cmake;$ANDROID_CMAKE" \
            "ndk;$FLUTTER_NDK_VERSION" \
            > /dev/null
      # Gradle's dependency cache and wrapper distribution, which this job was
      # rebuilding from scratch on every run. android-build has had this since
      # it was written; this job never did, and the gap shows — the SAME
      # `flutter build apk --debug` command takes ~2m40s there and took ~5m40s
      # here. Unlike android-actions/setup-android (deliberately avoided just
      # above), setup-gradle touches only GRADLE_USER_HOME: it does not install
      # or replace platform-tools, so it cannot disturb the adb/emulator setup
      # that made setup-android unusable in this job.
      - uses: gradle/actions/setup-gradle@v4
      # Warm up the native build BEFORE the emulator step.
      #
      # This step — not the --timeout flag further down — is what fixes the
      # `loading ...` TimeoutException. `flutter test integration_test` builds
      # the app as part of *loading* the test file, and package:test_core gives
      # that synthetic load suite a hardcoded 12-minute timeout that no flag can
      # raise. On a cold runner the build is ~700s (Gradle bootstrap, cargokit's
      # build_tool pub get, four Rust targets), which ate nearly all of those 12
      # minutes and failed mock_flow_test.dart during loading, with the APK
      # finishing 5 seconds too late. Doing the build here moves it outside the
      # load clock entirely; the emulator step then reuses the warm Gradle/cargo
      # caches and rebuilds in ~2 minutes.
      #
      # This has to be its own step rather than part of the emulator script:
      # the emulator-runner step is what provides the device that `flutter test
      # integration_test` needs, so it cannot also be where the slow build
      # happens without being inside the load window again.
      #
      # --target-platform android-x64 because the AVD is x86_64 (see arch:
      # below) and a warm-up is only worth the ABIs the real build will use.
      # Without it this step built the crate FOUR times — armv7 (~26s), arm64
      # (~12s), x86_64 (~11s), x86 (~11s) — while the test-phase build that
      # follows compiles exactly x86_64 and x86, which is what the emulator
      # loads. The two arm builds were pure waste, plus the arm engine
      # artifacts and packaging on top.
      - name: Warm up Gradle, cargokit and Rust build caches
        run: |
          flutter build apk --debug --target-platform "$ANDROID_WARMUP_TARGET_PLATFORM" \
            --dart-define=LIBERATED_BREAD_MOCK=true
      # The Rust toolchain + NDK this job adds (~4 GB), plus the warm-up build
      # output, can starve the emulator of disk and prevent it from booting.
      # Reclaim space from large preinstalled toolchains we don't use before
      # launching the emulator. This runs after the warm-up build so the
      # printed `df -h` reflects what the emulator will actually see.
      - name: Free up disk space for the emulator
        run: |
          # Only remove large toolchains this job doesn't use; keep
          # hostedtoolcache (Java/Flutter live there).
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift 2>/dev/null || true
          # The runner image preinstalls several multi-GB NDKs. The native
          # build is done by now, so every NDK except the one it used is dead
          # weight. Don't touch system-images: the emulator-runner reuses them.
          #
          # Guard on ANDROID_SDK_ROOT being non-empty: unset it and the paths
          # below would expand to /ndk/* and /ndk-bundle, pointing these rm -rf
          # calls at the filesystem root.
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            for ndk in "${ANDROID_SDK_ROOT:?}"/ndk/*; do
              [ -d "$ndk" ] || continue
              if [ "$(basename "$ndk")" != "$FLUTTER_NDK_VERSION" ]; then
                echo "Removing unused NDK $(basename "$ndk")"
                sudo rm -rf "$ndk"
              fi
            done
            sudo rm -rf "${ANDROID_SDK_ROOT:?}/ndk-bundle" 2>/dev/null || true
          else
            echo "ANDROID_SDK_ROOT is unset or empty; skipping NDK cleanup"
          fi
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration tests on emulator
        # Outer bound so a genuinely hung test fails promptly rather than
        # sitting on the runner for the 6-hour job default — the per-test
        # --timeout below is deliberately generous. Sized for the TWO attempts
        # the script makes (2 x ANDROID_EMULATOR_ATTEMPT_TIMEOUT) plus the AVD
        # boot, with headroom.
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ env.ANDROID_EMULATOR_TARGET }}
          arch: ${{ env.ANDROID_EMULATOR_ARCH }}
          profile: ${{ env.ANDROID_EMULATOR_PROFILE }}
          # ci_all_test.dart, NOT the integration_test directory: each file is
          # its own device build+install+launch cycle (see the ios-build test
          # step), so the aggregate runs the same suites in one cycle. The e2e
          # walkthrough stays out by omission — it needs scripts/e2e_shot_server.py
          # on the host and 127.0.0.1 (which on an emulator reaches the
          # emulator, not the host); run it via scripts/e2e-walkthrough.sh on
          # macOS. --exclude-tags=e2e is kept as defence in depth: it cannot
          # filter a FILE-level @Tags in an import, but it does filter a group-
          # or test-level `tags:` inside an imported suite.
          #
          # --timeout raises the per-test *body* timeout only. It is defence in
          # depth for slow test bodies — an emulator on swiftshader with 2 cores
          # is slow — and it CANNOT extend the load phase, whose 12-minute limit
          # is hardcoded in package:test_core's synthetic load suite. Keeping
          # loading inside that limit is the warm-up build step's job.
          # Logcat runs in the background for the whole test session and is
          # uploaded on every outcome below: when the harness hangs waiting
          # for the app's VM service (as an engine-level failure at startup
          # does), the step log shows nothing at all — the device log is the
          # only place the actual failure is visible.
          #
          # TWO ATTEMPTS, each bounded by `timeout`. The retry is not
          # superstition, it is aimed at the failure documented on
          # ANDROID_EMULATOR_TARGET above: the app launching into a system that
          # has not finished settling. By the time attempt 1 has burned its
          # budget the emulator is long settled, so attempt 2 starts from the
          # state attempt 1 wanted.
          #
          # `timeout` around each attempt is the load-bearing part, not the
          # `||`. That failure HANGS rather than exiting non-zero, so with only
          # the step's timeout-minutes to stop it there is nothing left to retry
          # with — the step is killed outright. Bounding each attempt is what
          # turns a 60-minute red into a ~12-minute blip plus a green retry.
          #
          # A retry that passes still prints a ::warning:: and keeps both
          # logcats: a flake that leaves no trace is a flake nobody fixes, and
          # this one took a logcat diff against a passing run to explain.
          script: |
            # `set -u`, NOT `set -uo pipefail`. This runs under /usr/bin/sh,
            # which android-emulator-runner execs directly — on the Ubuntu
            # runner that is dash, where `-o pipefail` is not a valid option and
            # the shell exits 2 on line 1, before the emulator is even used.
            # (`run:` blocks elsewhere in this file default to bash and may use
            # it; this input is the exception.) Nothing here pipes anything, so
            # pipefail bought nothing even where it parsed.
            set -u
            # Fail with a name rather than `timeout: invalid time interval ''`
            # if the env key is ever renamed out from under this script.
            : "${ANDROID_EMULATOR_ATTEMPT_TIMEOUT:?must be set in ci.yml's env block}"
            adb logcat -c || true
            adb logcat -v time > emulator-logcat.txt 2>&1 &

            run_tests() {
              timeout "$ANDROID_EMULATOR_ATTEMPT_TIMEOUT" \
                flutter test integration_test/ci_all_test.dart \
                  --exclude-tags=e2e \
                  --timeout 1200s \
                  --dart-define=LIBERATED_BREAD_MOCK=true
            }

            # Capture the status directly, NOT via `if run_tests; then ... fi`
            # followed by `$?`: after a taken-no-branch `if`, `$?` is the IF
            # statement's status (0), not the condition's, so a `timeout` kill
            # reported itself as "exit 0". Getting that wrong here would print
            # a misleading exit code for exactly the hang this retry exists for.
            run_tests
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 124 ]; then
              echo "::warning::Integration tests hit the ${ANDROID_EMULATOR_ATTEMPT_TIMEOUT} attempt timeout with no result — the known symptom of the app launching before the emulator settled. Retrying once."
            else
              echo "::warning::Integration tests failed (exit ${status}). Retrying once."
            fi

            # Keep attempt 1's device log; it is the only place that failure is
            # visible, and attempt 2 would otherwise append over the top of it.
            cp emulator-logcat.txt emulator-logcat-attempt1.txt || true
            run_tests
      # Both logs when a retry happened: emulator-logcat.txt is the attempt that
      # decided the step, emulator-logcat-attempt1.txt the one that failed
      # first. Diagnosing the settling race needed exactly this — a failing
      # device log to diff against a passing one.
      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-api${{ matrix.api-level }}
          path: |
            emulator-logcat.txt
            emulator-logcat-attempt1.txt
          if-no-files-found: warn

  ios-build:
    name: iOS build + bundle verification + simulator integration tests
    runs-on: macos-latest
    # ONE job on purpose. macOS minutes bill at 10x, and the simulator build the
    # smoke test already performs is exactly the build the integration tests
    # need warmed. A separate ios-integration job would repeat that build (Xcode
    # bootstrap, pod install, cargokit compiling the crate for
    # aarch64-apple-ios-sim) on a second 10x runner for zero extra coverage.
    # Merging costs granularity — a flaky test also reddens the build smoke —
    # which is the deliberate trade for roughly halving the macOS spend.
    #
    # Lowered from 75: the simulator now boots concurrently with the build and
    # the integration tests run as a single device cycle (see the aggregate
    # entrypoint below), so even a fully cold-cache run fits comfortably. The
    # test step carries its own tighter timeout below.
    timeout-minutes: 60
    needs: [flutter, rust]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # cargokit compiles the Rust crate during `flutter build ios`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_IOS_TARGETS }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: flutter pub get
      # Newer Flutter enables Swift Package Manager by default, and
      # SPM-capable plugins (flutter_blue_plus_darwin ships a Package.swift)
      # then bypass CocoaPods entirely — vanishing from Podfile.lock and
      # breaking the pod-presence assertions below while still being linked.
      # Pin plugin resolution to CocoaPods so the "every plugin is a pod"
      # invariant those checks encode stays true.
      - name: Use CocoaPods for plugin resolution (disable SPM)
        run: flutter config --no-enable-swift-package-manager
      # Start the boot in the background so it overlaps the build below —
      # booted-and-ready cost ~65 serial seconds when it sat between the build
      # and the tests. `simctl boot` only STARTS the boot (it returns in
      # seconds); the blocking `bootstatus -b` wait is its own step right before
      # the tests, by which point the boot has long finished. A boot failure
      # therefore still surfaces at that wait step, exactly where it did when
      # this was one serial step.
      #
      # Placed HERE rather than right after checkout, which is where it went
      # first. The build is ~2 minutes, so it already covers a ~65s boot twice
      # over; starting any earlier only leaves a booted simulator idling through
      # the SDK restore, rustup and pub get, holding a couple of GB and taking
      # cycles from a 3-core runner during the part of the job that is actually
      # CPU-bound. Overlap enough to hide the boot, not more.
      #
      # The first available iPhone in the runner image is used rather than a
      # pinned model so an Xcode image bump that retires a device name cannot
      # break the job.
      - name: Start booting an iOS simulator (async)
        id: sim
        run: |
          set -euo pipefail
          # `simctl list devices available` prints "    iPhone 15 (UDID) (Shutdown)".
          udid="$(xcrun simctl list devices available | awk -F'[()]' '/^ +iPhone/ { print $2; exit }')"
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator available on this runner image."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Booting simulator $udid in the background"
          xcrun simctl boot "$udid" || true   # non-zero if already booted
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # --target is the point of this step, not an afterthought.
      #
      # This build exists to move the app build OUTSIDE `flutter test`'s loading
      # phase, which package:test_core caps at a hardcoded 12 minutes that no
      # flag can raise. It was building lib/main.dart while the test step built
      # integration_test/ci_all_test.dart — a DIFFERENT Dart entrypoint, so the
      # kernel differed and Xcode relinked. Measured on a warm run: 95.7s here,
      # then another 64.1s inside the load window doing largely the same work.
      # Building the entrypoint the tests actually use makes the second build
      # incremental against the first instead of a near-repeat of it.
      #
      # What that costs: the bundle verified below is the test-harness app
      # rather than the one main() produces. Nothing checked here is affected —
      # Info.plist keys, CFBundleIdentifier and the linked Rust framework all
      # come from the Runner target and the pods, which are identical either
      # way — and lib/main.dart still gets compiled on Android (debug and
      # release) and Linux (debug and release), so no iOS-only compile coverage
      # is lost.
      #
      # --no-pub because the `flutter pub get` step above already ran; without
      # it every invocation re-resolves the whole dependency set.
      - name: Build iOS (simulator, no codesign) — the test entrypoint
        run: |
          flutter build ios --debug --no-codesign --simulator --no-pub \
            --target=integration_test/ci_all_test.dart \
            --dart-define=LIBERATED_BREAD_MOCK=true

      # ── verify the artifact, not just the exit code ─────────────────────────
      # `flutter build ios` running pod install itself means a *failed* pod
      # install fails the build — but a SKIPPED one does not, and a skipped one
      # leaves the plugin pods unlinked while the Runner target still compiles.
      # Podfile.lock is the artifact that proves resolution actually happened,
      # and the pod list proves the plugins the app depends on were part of it.
      # Pod names come from .flutter-plugins-dependencies (they are the
      # federated iOS implementations, not the pub package names).
      - name: Verify CocoaPods resolution happened
        run: |
          if [ ! -f ios/Podfile.lock ]; then
            echo "::error file=ios/Podfile::ios/Podfile.lock is absent after the build — CocoaPods never resolved, so no plugin pod is linked into the app."
            exit 1
          fi
          missing=0
          # The three pods whose absence is silently fatal at runtime. Not
          # asserting integration_test: it is a dev-dependency plugin, newer
          # Flutter versions exclude those from release pod installs, and the
          # simulator test step below is a far better check for it anyway.
          for pod in liberated_bread_core flutter_blue_plus_darwin permission_handler_apple; do
            if grep -qE "^ +- ${pod} \(" ios/Podfile.lock; then
              echo "  ok  pod ${pod}"
            else
              echo "::error file=ios/Podfile::Pod '${pod}' is missing from ios/Podfile.lock — its platform channels would be unavailable at runtime."
              missing=1
            fi
          done
          # Informational, not asserted. This is the exact knob behind the iOS
          # BLE outage: permission_handler_apple compiles each permission
          # strategy out unless the Podfile's post_install hook defines the
          # matching PERMISSION_* macro, and PermissionHandlerEnums.h defaults
          # them all to 0. lib/services/real_ble_service.dart deliberately no
          # longer depends on PERMISSION_BLUETOOTH (CoreBluetooth raises its own
          # prompt), so asserting a value here would encode a requirement the
          # code does not have. Printing the resolved macros instead makes any
          # future flip visible in the log next to the code that would need it.
          xcconfig="ios/Pods/Target Support Files/permission_handler_apple/permission_handler_apple.debug.xcconfig"
          if [ -f "$xcconfig" ]; then
            echo "permission_handler_apple compile-time macros:"
            grep -E 'GCC_PREPROCESSOR_DEFINITIONS' "$xcconfig" | sed 's/^/  /' || true
          fi
          exit $missing
      # Regression this catches: plist changes are invisible to a compiler. The
      # BLE usage strings are what let CoreBluetooth raise the system prompt at
      # all (real_ble_service.dart relies on that instead of permission_handler
      # on iOS), and NSAllowsLocalNetworking is what lets the app reach a
      # plain-http Home Assistant on the LAN. Dropping any of them builds clean
      # and breaks the app on device. Also asserts CFBundleIdentifier, since a
      # bundle-id drift invalidates the ad-hoc provisioning profile.
      #
      # Symbol checking is ON here (no --skip-symbols): this is an unstripped
      # debug bundle, so the flutter_rust_bridge FFI entry points must be
      # present in the linked binary. That is the iOS counterpart of the APK's
      # .so check — see scripts/verify_ios_app.sh for why the linked binary,
      # rather than the .a in the build intermediates, is the thing to assert on.
      - name: Verify built .app bundle (Info.plist + linked Rust library)
        run: ./scripts/verify_ios_app.sh build/ios/iphonesimulator/Runner.app

      # ── integration tests on a simulator ────────────────────────────────────
      # Regression this catches: until now NO integration test had ever run on
      # iOS. android-integration was the only place the flow tests executed on a
      # device, so an iOS-only break in plugin registration, platform channels
      # or FFI initialisation had zero automated coverage.
      #
      # One simulator only — macOS minutes bill at 10x. The boot itself was
      # started right after checkout; this is only the wait, and by now it is
      # normally already terminal.
      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      # ci_all_test.dart, NOT the integration_test directory: on a device every
      # file passed to `flutter test` is its own Dart entrypoint and pays a full
      # kernel-compile → Xcode build → install → launch cycle, ~2 minutes each
      # on this runner with every cache warm. The aggregate bundles the
      # mock-safe suites into one cycle. The linux-desktop job still runs the
      # files individually, so per-process isolation keeps coverage there, and
      # test/platform/integration_aggregate_test.dart fails the cheap job if a
      # suite is missing from the aggregate — or if an e2e one is added to it.
      #
      # --exclude-tags=e2e is defence in depth, and does real work despite what
      # an earlier version of this comment claimed. It is true that a FILE-level
      # @Tags in an imported library is invisible to it (which is why e2e files
      # are kept out by omission), but a group- or test-level `tags:` inside an
      # imported suite IS registered at runtime and IS filtered by this flag.
      # Dropping it left that case running on a device.
      #
      # -d is required, not optional: macos runners also expose the macOS
      # desktop device, and `flutter test` refuses to run with more than one
      # device connected.
      #
      # No separate warm-up step is needed here, unlike android-integration:
      # `flutter test` builds the app during the *loading* phase, which
      # package:test_core caps at a hardcoded 12 minutes that no flag can
      # raise — but the "Build iOS (simulator, no codesign)" step above
      # already populated the Xcode and cargo caches in this same job, so the
      # rebuild inside that window is incremental. That is a third reason these
      # are one job.
      #
      # --timeout raises the per-test body limit only, mirroring the Android
      # job; the step timeout is the outer bound on a genuinely hung test.
      - name: Run integration tests on the simulator (mock mode)
        timeout-minutes: 30
        run: |
          flutter test integration_test/ci_all_test.dart \
            --no-pub \
            --exclude-tags=e2e \
            -d "${{ steps.sim.outputs.udid }}" \
            --timeout 1200s \
            --dart-define=LIBERATED_BREAD_MOCK=true

      # ── root cause of the iOS BLE outage ───────────────────────────────────
      # This project was scaffolded on Linux, where flutter_tools skips
      # CocoaPods setup, so ios/Podfile was never created or committed. On a
      # real iPhone that left permission_handler_apple's Bluetooth strategy
      # compiled out (PERMISSION_BLUETOOTH defaults to 0 in
      # PermissionHandlerEnums.h, which answers every request with
      # PermanentlyDenied), so the OS prompt was never shown and scanning could
      # never start. CI saw none of it: this job is a simulator build and every
      # automated path uses MockBleService.
      #
      # "Does pod install succeed?" is NOT a usable check for this — Flutter
      # auto-generates a Podfile when one is missing, so it succeeds either way
      # and would have passed on the broken repo. The meaningful assertion is
      # whether the Podfile is COMMITTED: a generated one is unreviewed, varies
      # with whichever Flutter version happened to build it, and carries no
      # post_install hook, so any plugin needing a compile-time macro silently
      # gets the default. That is invisible in a diff, which is precisely how
      # this shipped. Hence `git ls-files`, not `test -f` — a Podfile that
      # exists only because Flutter just generated it in the working tree is
      # exactly the state being rejected.
      #
      # Error rather than ::warning:: — a warning is effectively what this repo
      # already had, and it produced a permanently broken feature on device.
      #
      # Deliberately the LAST step: it is a git query costing milliseconds, and
      # putting it first would abort the job before any of the checks above got
      # to report. Late, the job still goes red, but a run also tells you
      # everything else that is (or is not) wrong in the same log.
      - name: Require a committed ios/Podfile
        run: |
          if git ls-files --error-unmatch ios/Podfile >/dev/null 2>&1; then
            echo "ios/Podfile is committed and reviewable."
            exit 0
          fi
          echo "::error file=ios/Podfile::ios/Podfile is not committed. Flutter auto-generates one at build time, so this job still built — but the generated Podfile has no post_install hook, which is how permission_handler's iOS Bluetooth strategy shipped compiled out. Run 'flutter build ios' locally (or copy Flutter's template), add any required post_install macro definitions, and commit ios/Podfile so it is reviewable."
          exit 1

  linux-desktop:
    name: Linux desktop build + bundle verification + headless integration tests
    runs-on: ubuntu-latest
    # Comfortably covers three Flutter builds (release, debug, and the
    # incremental one `flutter test` does) plus cargokit compiling the crate
    # twice — once per Rust profile. Well under the Android jobs' budget: there
    # is no emulator to boot and no NDK to download.
    timeout-minutes: 45
    # Same gating as the other native jobs: a lint/test failure in Dart or Rust
    # must not burn runner minutes on a native build.
    needs: [flutter, rust]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # cargokit compiles the Rust crate during `flutter build linux`. No
      # cross-compilation targets are needed — unlike Android and iOS, the
      # desktop target IS the host (x86_64-unknown-linux-gnu).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The Linux desktop toolchain — the runner image ships none of the -dev
      # packages. The list itself is LINUX_DESKTOP_PACKAGES in the env block at
      # the top of this file, where each entry is annotated; it lives there
      # rather than here so scripts/setup.sh installs exactly what CI does
      # without a parser that has to understand `apt-get install` and its line
      # continuations.
      #
      # Unquoted on purpose: word splitting is what turns the single
      # space-separated value into one argument per package.
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends ${LINUX_DESKTOP_PACKAGES:?LINUX_DESKTOP_PACKAGES is empty — the env key was renamed or removed, and installing nothing here surfaces later as an unrelated CMake/GTK error inside flutter build linux}
      - run: flutter pub get

      # ── release build ───────────────────────────────────────────────────────
      # --target-platform is pinned rather than left to default. linux-x64 IS
      # Flutter's default today, but the flag also accepts linux-arm64, and
      # pinning means a runner-image change to arm64 fails loudly here instead
      # of silently producing an artifact nobody verified on that arch.
      #
      # Deliberately WITHOUT --dart-define=LIBERATED_BREAD_MOCK=true, for the
      # same reason android-build's release step omits it: the mock flag is a
      # compile-time const, so the AOT tree shaker drops the untaken branch and
      # RealBleService is never compiled. Omitting it is what gives the
      # flutter_blue_plus_linux (BlueZ/D-Bus) call sites compile coverage — the
      # ONLY place in CI where the real BLE path is compiled for Linux.
      - name: Build Linux desktop (release, x86-64)
        run: flutter build linux --release --target-platform=linux-x64 --verbose

      # A zero exit from `flutter build linux` says nothing about what landed in
      # the bundle, and this target has a specific, already-real trap.
      #
      # linux/flutter/generated_plugins.cmake bundles an FFI plugin's native
      # output by dereferencing ${<plugin_name>_bundled_libraries}, where
      # <plugin_name> is `liberated_bread_core` (rust_builder/pubspec.yaml).
      # rust_builder/linux/CMakeLists.txt shipped exporting
      # `rust_lib_liberated_bread_mobile_bundled_libraries` instead — cargokit's
      # template name. CMake expands an undefined variable to the empty string
      # rather than erroring, so install() copied nothing, the build stayed
      # green, and the app died on the first FFI call. Verified by hand: with
      # the old name the build still exits 0 and lib/libliberated_bread_core.so
      # is simply absent from the bundle while cargokit's compiled copy sits
      # unused in build/linux/x64/release/plugins/.
      #
      # scripts/verify_linux_bundle.sh opens the bundle and asserts on it — the
      # Linux analogue of scripts/verify_apk.sh:
      #   * lib/libliberated_bread_core.so exists, is a real ELF above a size
      #     floor, and still exports the flutter_rust_bridge dispatcher symbols.
      #   * The executable's RUNPATH includes $ORIGIN/lib. Without it the .so is
      #     in the bundle and STILL unreachable at runtime.
      #   * The Flutter engine and the federated plugin .so files are present,
      #     catching a generated_plugins.cmake regression.
      #   * The mode's Dart payload (lib/libapp.so for release).
      - name: Verify release bundle contents
        run: ./scripts/verify_linux_bundle.sh build/linux/x64/release/bundle

      # ── debug build ─────────────────────────────────────────────────────────
      # Two jobs at once, which is why it follows the release build rather than
      # replacing it:
      #
      #   1. Coverage. Debug is what every developer actually runs locally via
      #      scripts/run-linux.sh, and it is packaged differently — a JIT
      #      kernel_blob.bin inside flutter_assets instead of an AOT
      #      lib/libapp.so — so it exercises a genuinely different install path.
      #   2. It is the warm-up build for the integration step below, and that
      #      step genuinely does not pass without it. `flutter test
      #      integration_test` builds the app during the *loading* phase, which
      #      package:test_core caps at a hardcoded 12 minutes that no flag can
      #      raise (the same trap documented in android-integration). Measured
      #      locally: from cold, loading blew the 12-minute cap and the run came
      #      back "+1 -1"; with this warm-up in place the same load took 20
      #      seconds. Note --concurrency does NOT help — `flutter test` prints
      #      "-j/--concurrency was parsed but will be ignored, this option is
      #      not supported when running Integration Tests".
      #
      # The mock define matches the test step's exactly. It costs nothing here
      # (the .so and the bundle layout are identical either way, so the
      # verification below is just as meaningful), and without it the Dart
      # kernel is compiled for a different configuration and has to be rebuilt
      # inside that 12-minute load window.
      - name: Build Linux desktop (debug, x86-64) and warm the test build cache
        run: |
          flutter build linux --debug --target-platform=linux-x64 \
            --dart-define=LIBERATED_BREAD_MOCK=true
      - name: Verify debug bundle contents
        run: ./scripts/verify_linux_bundle.sh build/linux/x64/debug/bundle

      # ── headless integration tests ──────────────────────────────────────────
      # Regression this catches: this is the FIRST integration coverage in this
      # repo that needs no emulator and no simulator. android-integration boots
      # a 60-minute AVD and ios-build pays 10x macOS minutes; this runs the same
      # flow tests on a plain ubuntu runner in minutes, so a break in widget
      # wiring, provider setup or FFI initialisation is caught by the cheapest
      # job in the matrix instead of the two most expensive ones.
      #
      # xvfb-run supplies the virtual X display the GTK runner needs; -a picks a
      # free display number. Mock mode is required, not a shortcut: BLE on Linux
      # goes through BlueZ over D-Bus and a hosted runner has no Bluetooth
      # adapter, so RealBleService would find nothing.
      #
      # ONE FILE PER `flutter test` INVOCATION, deliberately. Passing the whole
      # integration_test/ directory at once — the way the Android and iOS jobs
      # do — does NOT work on the Linux desktop device. The first file passes,
      # then the tool reuses its VM-service connection for the next one and dies
      # immediately with:
      #
      #   Bad state: Cannot add new events after calling close
      #     dart:async/broadcast_stream_controller.dart 243:24
      #     dart:io-patch/socket_patch.dart 2455:41  _Socket._onData
      #
      # That is flutter_tools closing the observatory socket when the first app
      # exits and then still receiving data on it — a tooling bug, not an app
      # bug. Verified locally: `flutter test integration_test -d linux` reports
      # "+1 -1", while the very same file passes on its own in ~23s. Running
      # each file in its own invocation gives each a fresh connection.
      #
      # A file whose tests are ALL excluded by --exclude-tags=e2e (today:
      # e2e_walkthrough_test.dart, which needs scripts/e2e_shot_server.py and a
      # macOS host) must be skipped, not failed. Two layers, because the first
      # attempt at this got burned: the primary check reads the @Tags(['e2e'])
      # annotation from the file itself, which is the exact mechanism the
      # exclusion acts on — deterministic, no dependency on runner output. The
      # output-grep stays only as a fallback for a file that mixes tagged and
      # untagged tests in a way the annotation scan can't see, and it matches
      # BOTH strings flutter test emits for the nothing-to-run case: the plain
      # runner prints "No tests ran." while the -d linux device runner prints
      # "No tests match the requested tag selectors" — the first CI run of this
      # step misclassified the excluded file as a failure over exactly that
      # wording difference. Any other non-zero exit is a real failure and is
      # collected so one run reports every broken file instead of stopping at
      # the first.
      #
      # --timeout raises the per-test body limit only, exactly as in the Android
      # and iOS jobs; the step timeout is the outer bound on a hung test.
      - name: Run integration tests headlessly (Xvfb, mock mode)
        timeout-minutes: 20
        run: |
          set -uo pipefail
          status=0
          for t in integration_test/*_test.dart; do
            echo "::group::$t"
            # ci_all_test.dart is the device jobs' aggregate of the very files
            # this loop iterates — running it here would execute every suite
            # twice, and in one process, when this loop's whole point is a
            # fresh invocation per file (both for the VM-service bug above and
            # for the process isolation the aggregate gives up).
            if [ "$(basename "$t")" = "ci_all_test.dart" ]; then
              echo "SKIP  $t (device-job aggregate — its imports each run individually here)"
              echo "::endgroup::"
              continue
            fi
            if tr '\n' ' ' < "$t" | grep -qE "@Tags[[:space:]]*\([[:space:]]*(const[[:space:]]*)?(<[^>]*>[[:space:]]*)?\[[^]]*['\"]e2e['\"]"; then
              echo "SKIP  $t (file-level @Tags(['e2e']) — excluded by --exclude-tags=e2e)"
              echo "::endgroup::"
              continue
            fi
            log="$(mktemp)"
            if xvfb-run -a flutter test "$t" \
                 -d linux \
                 --exclude-tags=e2e \
                 --timeout 1200s \
                 --dart-define=LIBERATED_BREAD_MOCK=true 2>&1 | tee "$log"; then
              echo "PASS  $t"
            elif grep -qE 'No tests ran\.|No tests match the requested tag selectors' "$log"; then
              echo "SKIP  $t (every test in it is excluded by --exclude-tags=e2e)"
            else
              echo "::error file=$t::Integration test failed on the Linux desktop."
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
