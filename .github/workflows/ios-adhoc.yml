name: iOS ad-hoc build

# Manually trigger from the GitHub Actions UI or CLI to produce a signed
# profile-mode IPA that can be installed directly on a registered iPhone.
# This is the recommended way to test on-device from a Linux dev environment.
#
# Required repository secrets:
#   IOS_CERTIFICATE_P12      – base64-encoded .p12 export of your signing cert
#   IOS_CERTIFICATE_PASSWORD – password for the .p12
#   IOS_PROVISIONING_PROFILE – base64-encoded .mobileprovision (ad-hoc profile)
#
# Optional:
#   IOS_KEYCHAIN_PASSWORD – password for the ephemeral keychain (any string)
#   IOS_TEAM_ID           – Apple Developer Team ID; substituted for the
#                           YOUR_TEAM_ID placeholder in ios/ExportOptions-adhoc.plist
#                           at build time, so no real team ID has to be committed
#
# Setup guide:
#   1. In Xcode → Signing & Capabilities, set your Team and Bundle ID.
#   2. On developer.apple.com, create an Ad Hoc provisioning profile that
#      includes your test device UDIDs.
#   3. Export your signing certificate as a .p12 and base64-encode both:
#        base64 -i certificate.p12 | pbcopy   # → IOS_CERTIFICATE_P12
#        base64 -i profile.mobileprovision | pbcopy  # → IOS_PROVISIONING_PROFILE
#   4. Add those secrets in the repo Settings → Secrets and variables → Actions.

on:
  workflow_dispatch:
    inputs:
      mock:
        description: 'Enable mock BLE mode'
        type: boolean
        default: false
      ref:
        description: 'Branch or commit to build (default: current branch)'
        type: string
        default: ''

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.24.5'
  KEYCHAIN_NAME: build.keychain

jobs:
  build:
    name: iOS ad-hoc IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: flutter pub get

      # ── detect signing secrets ─────────────────────────────────────────────
      # Secrets cannot be referenced directly in step `if:` conditions, so we
      # probe them in a run step and export a plain output flag instead.
      - name: Detect signing secrets
        id: signing
        env:
          HAS_CERT: ${{ secrets.IOS_CERTIFICATE_P12 }}
          HAS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [[ -n "$HAS_CERT" && -n "$HAS_PROFILE" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::IOS_CERTIFICATE_P12 or IOS_PROVISIONING_PROFILE secret not set — building unsigned simulator bundle instead of a signed IPA."
          fi

      # ── signing setup ──────────────────────────────────────────────────────
      - name: Install signing certificate
        if: steps.signing.outputs.available == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KC_PASS: ${{ secrets.IOS_KEYCHAIN_PASSWORD || 'ci-build-pw' }}
        run: |
          security create-keychain -p "$KC_PASS" "$KEYCHAIN_NAME"
          security default-keychain -s "$KEYCHAIN_NAME"
          # Defensive: some runner images don't put a new keychain on the user
          # search list, and codesign only consults keychains on that list.
          # Keep login.keychain so Apple's intermediate certs stay visible.
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_NAME"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_NAME"

          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN_NAME" \
            -P "$CERT_PASS" -T /usr/bin/codesign
          rm /tmp/cert.p12

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KC_PASS" "$KEYCHAIN_NAME"

      - name: Install provisioning profile
        if: steps.signing.outputs.available == 'true'
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/liberated-bread.mobileprovision

      # ios/ExportOptions-adhoc.plist is committed with a YOUR_TEAM_ID
      # placeholder so no real team ID lives in the repo. When the optional
      # IOS_TEAM_ID secret is set, substitute it into the workspace copy here.
      # Same probe-the-secret-via-env pattern as the signing detection above:
      # `secrets` cannot be referenced in a step-level `if:`, so the emptiness
      # check lives in the shell.
      - name: Inject team ID into ExportOptions plist
        if: steps.signing.outputs.available == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [[ -n "$IOS_TEAM_ID" ]]; then
            sed -i '' "s/YOUR_TEAM_ID/${IOS_TEAM_ID}/" ios/ExportOptions-adhoc.plist
            echo "Substituted IOS_TEAM_ID into ios/ExportOptions-adhoc.plist"
          else
            echo "::warning::IOS_TEAM_ID secret not set — the export will fail unless ios/ExportOptions-adhoc.plist carries a real teamID."
          fi

      # ── build ──────────────────────────────────────────────────────────────
      # Signed IPA uses --profile so the app can launch standalone (debug mode
      # requires a live Dart VM connection and aborts on install without one).
      - name: Build signed IPA (profile mode)
        if: steps.signing.outputs.available == 'true'
        env:
          MOCK_FLAG: ${{ inputs.mock && '--dart-define=LIBERATED_BREAD_MOCK=true' || '' }}
        run: flutter build ipa --profile $MOCK_FLAG
          --export-options-plist=ios/ExportOptions-adhoc.plist

      - name: Build unsigned simulator bundle (no secrets fallback)
        if: steps.signing.outputs.available == 'false'
        env:
          MOCK_FLAG: ${{ inputs.mock && '--dart-define=LIBERATED_BREAD_MOCK=true' || '' }}
        run: flutter build ios --debug --no-codesign --simulator $MOCK_FLAG

      # ── artifact ───────────────────────────────────────────────────────────
      # The signed IPA is this workflow's entire deliverable: a run that ends
      # without one must be red, so no continue-on-error here (even a quota
      # failure should be loud) and missing files are an error.
      - name: Upload IPA
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: liberated-bread-adhoc${{ inputs.mock && '-mock' || '' }}.ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned app bundle (no-secrets fallback)
        if: steps.signing.outputs.available == 'false'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: liberated-bread-unsigned-simulator.app
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: warn
          retention-days: 1

      # ── cleanup ────────────────────────────────────────────────────────────
      - name: Remove ephemeral keychain
        if: always() && steps.signing.outputs.available == 'true'
        run: security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
