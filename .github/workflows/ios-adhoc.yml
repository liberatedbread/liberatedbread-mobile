name: iOS ad-hoc build

# Manually trigger from the GitHub Actions UI or CLI to produce a signed
# profile-mode IPA that can be installed directly on a registered iPhone.
# This is the recommended way to test on-device from a Linux dev environment.
#
# Required repository secrets:
#   IOS_CERTIFICATE_P12      – base64-encoded .p12 export of your signing cert
#   IOS_CERTIFICATE_PASSWORD – password for the .p12
#   IOS_PROVISIONING_PROFILE – base64-encoded .mobileprovision (ad-hoc profile)
#
# The .p12 must contain an **Apple Development** certificate: Flutter's
# identity matcher only recognises "Apple Development"/"iPhone Developer"
# identities, and without a match it never injects DEVELOPMENT_TEAM — so the
# archive step fails with "Signing for 'Runner' requires a development team"
# even though a distribution certificate is present. Export both certificates
# into the one .p12 if you also need the distribution identity for the export.
#
# Optional:
#   IOS_KEYCHAIN_PASSWORD – password for the ephemeral keychain (any string)
#   IOS_TEAM_ID           – Apple Developer Team ID; substituted for the
#                           YOUR_TEAM_ID placeholder in ios/ExportOptions-adhoc.plist
#                           at build time, so no real team ID has to be committed
#   IOS_PROFILE_NAME      – name of your Ad Hoc provisioning profile, exactly as
#                           it appears on developer.apple.com; substituted for
#                           the "Liberated Bread Ad Hoc" placeholder in
#                           ios/ExportOptions-adhoc.plist. Without it,
#                           -exportArchive fails with "No profile matching
#                           'Liberated Bread Ad Hoc' found" unless your profile
#                           happens to carry that exact name.
#
# The profile must carry the MULTICAST entitlement. ios/Runner/Runner.entitlements
# declares com.apple.developer.networking.multicast, which iOS 14+ requires
# before an app may touch a multicast address at all — both halves of the Wi-Fi
# scan use raw sockets, so without it the scan finds nothing. Apple grants that
# entitlement by manual request, not by ticking a box, and a profile generated
# before the grant fails the archive step with "Provisioning profile ... doesn't
# include the com.apple.developer.networking.multicast entitlement". Regenerate
# the profile after the grant and re-upload IOS_PROVISIONING_PROFILE. See
# docs/ios-from-linux.md for the request itself. The no-secrets simulator
# fallback below is unaffected: it does not code-sign, so nothing checks
# entitlements.
#
# Setup guide:
#   1. In Xcode → Signing & Capabilities, set your Team and Bundle ID.
#   2. On developer.apple.com, create an Ad Hoc provisioning profile that
#      includes your test device UDIDs and the Multicast Networking capability.
#   3. Export your signing certificate as a .p12 and base64-encode both:
#        base64 -i certificate.p12 | pbcopy   # → IOS_CERTIFICATE_P12
#        base64 -i profile.mobileprovision | pbcopy  # → IOS_PROVISIONING_PROFILE
#   4. Add those secrets in the repo Settings → Secrets and variables → Actions.
#   5. Add IOS_TEAM_ID and IOS_PROFILE_NAME too — the export step needs both.
#
# With no signing secrets set at all the workflow still runs: it falls back to
# building (and uploading) an unsigned simulator .app bundle.

on:
  workflow_dispatch:
    inputs:
      mock:
        description: 'Enable mock BLE mode'
        type: boolean
        default: false
      ref:
        description: 'Branch or commit to build (default: current branch)'
        type: string
        default: ''

permissions:
  contents: read

env:
  KEYCHAIN_NAME: build.keychain

jobs:
  build:
    name: iOS ad-hoc IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # No FLUTTER_VERSION pin in this file, deliberately. It carried its own
      # copy and silently rotted to 3.24.5 while ci.yml moved to 3.44.8 — this
      # workflow was building the shipped IPA with an SDK no other job had
      # tested, which is the one artifact where that matters most. ci.yml is
      # already the declared toolchain source of truth, and
      # scripts/ci-versions.sh is already the parser that dev environments
      # provision from, so read the pins through it here too rather than
      # re-pinning and hoping someone updates both.
      #
      # Read AFTER checkout and therefore from the ref being built: an ad-hoc
      # build of an old commit uses that commit's pins, which is what makes a
      # rebuild of an old tag reproducible.
      #
      # Every value has a fallback, so a parse miss degrades to a stale pin and
      # a stderr warning rather than a failed run — same contract setup.sh gets.
      - name: Resolve toolchain pins from ci.yml
        id: versions
        env:
          # Only used when the checked-out ref predates scripts/ci-versions.sh.
          FALLBACK_FLUTTER: '3.44.8'
          FALLBACK_IOS_TARGETS: 'aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios'
        run: |
          set -euo pipefail
          if [ -r scripts/ci-versions.sh ]; then
            # shellcheck source=/dev/null
            source scripts/ci-versions.sh
            flutter_version="$CI_FLUTTER_VERSION"
            ios_targets="${CI_RUST_IOS_TARGETS// /,}"
          else
            # An older ref genuinely has no such script — see the note above
            # about building historical commits. Warn and carry on with the
            # pins as of this workflow, rather than dying at step two: a stale
            # SDK still produces an IPA, and `set -e` on a missing file would
            # not.
            echo "::warning::scripts/ci-versions.sh is absent from this ref; using the pins baked into this workflow (Flutter ${FALLBACK_FLUTTER})."
            flutter_version="$FALLBACK_FLUTTER"
            ios_targets="$FALLBACK_IOS_TARGETS"
          fi
          echo "flutter=${flutter_version}" >> "$GITHUB_OUTPUT"
          echo "ios-targets=${ios_targets}" >> "$GITHUB_OUTPUT"
          echo "Flutter ${flutter_version}, iOS Rust targets: ${ios_targets}"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: stable
          cache: true

      # The full iOS target list from ci.yml, not just aarch64-apple-ios. The
      # signed path only needs the device target, but the no-secrets fallback
      # below builds a SIMULATOR bundle, and macos-latest is arm64 — so that
      # path needs aarch64-apple-ios-sim. It was not a hard failure only
      # because cargokit installs a missing target itself mid-build
      # (rust_builder/cargokit/build_tool/lib/src/builder.dart), i.e. the cost
      # was paid inside the build instead of in this cached setup step.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.versions.outputs.ios-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: flutter pub get

      # ── detect signing secrets ─────────────────────────────────────────────
      # Secrets cannot be referenced directly in step `if:` conditions, so we
      # probe them in a run step and export a plain output flag instead.
      - name: Detect signing secrets
        id: signing
        env:
          HAS_CERT: ${{ secrets.IOS_CERTIFICATE_P12 }}
          HAS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [[ -n "$HAS_CERT" && -n "$HAS_PROFILE" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::IOS_CERTIFICATE_P12 or IOS_PROVISIONING_PROFILE secret not set — building unsigned simulator bundle instead of a signed IPA."
          fi

      # ── signing setup ──────────────────────────────────────────────────────
      - name: Install signing certificate
        if: steps.signing.outputs.available == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KC_PASS: ${{ secrets.IOS_KEYCHAIN_PASSWORD || 'ci-build-pw' }}
        run: |
          security create-keychain -p "$KC_PASS" "$KEYCHAIN_NAME"
          security default-keychain -s "$KEYCHAIN_NAME"
          # Defensive: some runner images don't put a new keychain on the user
          # search list, and codesign only consults keychains on that list.
          # Keep login.keychain so Apple's intermediate certs stay visible.
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_NAME"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_NAME"

          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN_NAME" \
            -P "$CERT_PASS" -T /usr/bin/codesign
          rm /tmp/cert.p12

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KC_PASS" "$KEYCHAIN_NAME"

      - name: Install provisioning profile
        if: steps.signing.outputs.available == 'true'
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/liberated-bread.mobileprovision

      # ios/ExportOptions-adhoc.plist is committed with YOUR_TEAM_ID and
      # "Liberated Bread Ad Hoc" placeholders so neither a real team ID nor one
      # developer's profile name lives in the repo. When the optional
      # IOS_TEAM_ID / IOS_PROFILE_NAME secrets are set, substitute them into the
      # workspace copy here. Same probe-the-secret-via-env pattern as the
      # signing detection above: `secrets` cannot be referenced in a step-level
      # `if:`, so the emptiness check lives in the shell. `sed -i ''` is the BSD
      # form — this job runs on macos-latest.
      - name: Inject team ID and profile name into ExportOptions plist
        if: steps.signing.outputs.available == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          if [[ -n "$IOS_TEAM_ID" ]]; then
            sed -i '' "s/YOUR_TEAM_ID/${IOS_TEAM_ID}/" ios/ExportOptions-adhoc.plist
            echo "Substituted IOS_TEAM_ID into ios/ExportOptions-adhoc.plist"
          else
            echo "::warning::IOS_TEAM_ID secret not set — the export will fail unless ios/ExportOptions-adhoc.plist carries a real teamID."
          fi

          if [[ -n "$IOS_PROFILE_NAME" ]]; then
            # Profile names are free-form text, unlike the alphanumeric team ID,
            # so the value needs escaping twice before it can be sed'd into an
            # XML plist:
            #   1. XML — a bare & or < would make the plist unparseable, and
            #      xcodebuild would reject it ("R&D Ad Hoc" is a realistic name).
            #   2. sed replacement — \ and the | delimiter must be escaped, and
            #      a bare & there expands to the whole match.
            # Stage 1 must run first; it introduces the &s that stage 2 escapes.
            name_xml=$(printf '%s' "$IOS_PROFILE_NAME" \
              | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
            name_sed=$(printf '%s' "$name_xml" | sed -e 's/[\\|&]/\\&/g')
            sed -i '' "s|Liberated Bread Ad Hoc|${name_sed}|" ios/ExportOptions-adhoc.plist
            echo "Substituted IOS_PROFILE_NAME into ios/ExportOptions-adhoc.plist"
          else
            echo "::warning::IOS_PROFILE_NAME secret not set — -exportArchive will fail with \"No profile matching 'Liberated Bread Ad Hoc' found\" unless your Ad Hoc profile carries that exact name."
          fi

      # ── build ──────────────────────────────────────────────────────────────
      # Signed IPA uses --profile so the app can launch standalone (debug mode
      # requires a live Dart VM connection and aborts on install without one).
      - name: Build signed IPA (profile mode)
        if: steps.signing.outputs.available == 'true'
        env:
          MOCK_FLAG: ${{ inputs.mock && '--dart-define=LIBERATED_BREAD_MOCK=true' || '' }}
        run: flutter build ipa --profile $MOCK_FLAG
          --export-options-plist=ios/ExportOptions-adhoc.plist

      - name: Build unsigned simulator bundle (no secrets fallback)
        if: steps.signing.outputs.available == 'false'
        env:
          MOCK_FLAG: ${{ inputs.mock && '--dart-define=LIBERATED_BREAD_MOCK=true' || '' }}
        run: flutter build ios --debug --no-codesign --simulator $MOCK_FLAG

      # ── verify the artifact ────────────────────────────────────────────────
      # This IPA is the one that gets installed on a real iPhone, which is where
      # the BLE outage actually happened, so it is the most valuable place to
      # assert on the bundle rather than on an exit code. A missing
      # NSBluetoothAlwaysUsageDescription means iOS terminates the app the
      # moment CoreBluetooth is touched; a CFBundleIdentifier that drifted from
      # ca.pigscanfly.liberatedbread means the ad-hoc provisioning profile no
      # longer matches and the install silently fails on the device.
      #
      # It is also the ONLY place the multicast entitlement can be checked.
      # ios/Runner/Runner.entitlements is asserted on Linux by
      # test/platform/ios_entitlements_test.dart, but whether the entitlement
      # survived into the signed binary depends on the provisioning profile
      # this run used, and that is knowable only here. A profile predating the
      # grant produces an installable IPA whose Wi-Fi scan silently finds
      # nothing; the verifier turns that into a red build.
      #
      # --skip-symbols here, unlike the CI simulator build: this is a profile
      # build, and Xcode strips the app binary, so asserting on the Rust FFI
      # symbols in a shipped IPA risks a false failure that cannot be validated
      # without a signed device build. The unstripped debug bundle in ci.yml's
      # ios-build job is where the linked-Rust-library assertion lives; adding
      # an unverifiable variant of it here would be exactly the kind of check
      # that can fail for the wrong reason.
      - name: Verify signed IPA contents
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          ipa="$(find build/ios/ipa -name '*.ipa' -maxdepth 1 | head -1)"
          if [ -z "$ipa" ]; then
            echo "::error::No .ipa produced under build/ios/ipa"
            exit 1
          fi
          ./scripts/verify_ios_app.sh "$ipa" --skip-symbols

      # The fallback bundle is a debug build and is not stripped, so the full
      # check — including the linked Rust library — applies.
      - name: Verify unsigned simulator bundle contents
        if: steps.signing.outputs.available == 'false'
        run: ./scripts/verify_ios_app.sh build/ios/iphonesimulator/Runner.app

      # ── artifact ───────────────────────────────────────────────────────────
      # The signed IPA is this workflow's entire deliverable: a run that ends
      # without one must be red, so no continue-on-error here (even a quota
      # failure should be loud) and missing files are an error.
      - name: Upload IPA
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: liberated-bread-adhoc${{ inputs.mock && '-mock' || '' }}.ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned app bundle (no-secrets fallback)
        if: steps.signing.outputs.available == 'false'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: liberated-bread-unsigned-simulator.app
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: warn
          retention-days: 1

      # ── cleanup ────────────────────────────────────────────────────────────
      - name: Remove ephemeral keychain
        if: always() && steps.signing.outputs.available == 'true'
        run: security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
