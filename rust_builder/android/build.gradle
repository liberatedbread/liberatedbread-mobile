// The Android Gradle Plugin builds the native code with the Android NDK.

group 'ca.pigscanfly.liberatedbread.rust'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    // No `classpath 'com.android.tools.build:gradle:<v>'` here, deliberately.
    // cargokit's template pinned 7.3.0, which was already dead code: the app's
    // android/settings.gradle resolves AGP 8.6.0 through pluginManagement, that
    // class is loaded first, and a parent-first classloader means the 7.3.0
    // declared here could never win. All it did was make Gradle resolve (and
    // fetch) a second, ancient AGP on every cold build, and stand as a version
    // that looked authoritative while having no effect — the worst combination
    // when someone later goes looking for which AGP builds this module.
    // Inheriting it means there is exactly one AGP version in the build, the
    // one in android/settings.gradle.
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'ca.pigscanfly.liberatedbread.rust'
    }

    // Matches android/app/build.gradle's `compileSdk = flutter.compileSdkVersion`
    // (36 for the pinned Flutter 3.44.8 — FlutterExtension.kt). cargokit's
    // template shipped 33, and that single stale number was what made Gradle
    // stop and download SDK Platform 33 partway through EVERY Android CI build:
    // the runner image ships current platforms, so 33 was the only one missing,
    // and this module is the only thing that asked for it.
    //
    // The template's warning that "bumping this requires all clients to bump
    // theirs" is the right instinct pointed backwards: this module is not
    // published, its one client is the app in this repo, and that client
    // already compiles against 36. Being BELOW the app was the hazard.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Matches android/app/build.gradle's literal minSdkVersion 24, which is
        // Flutter 3.44's own floor. 19 came from the cargokit template and was
        // a claim this module cannot honour: the app it links into refuses to
        // install below 24, and the manifest merger takes the highest value
        // anyway, so the only effect of the lower number was to describe an
        // API range nothing ever built or tested.
        minSdkVersion 24
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../rust"
    libname = "liberated_bread_core"
}
