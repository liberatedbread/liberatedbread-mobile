#
# There was no Codecov config, so the project ran on defaults, and the headline
# number those produced was not a number anyone could act on.
#
# WHY THE GENERATED BINDINGS ARE IGNORED
#
# lib/src/rust/ is flutter_rust_bridge output — 1037 of 4426 measured lines,
# 23% of the codebase, sitting at 40% coverage and dragging the reported total
# to 75.2% while the hand-written code was at 85.9%. Those 1037 lines are not
# code anyone writes, reviews or can meaningfully unit-test: they are a
# mechanical projection of rust/src/api/, regenerated by
# `flutter_rust_bridge_codegen generate`.
#
# Ignoring them is NOT dropping them from verification, which is the only
# reason it is defensible. They are checked harder than a coverage percentage
# ever checked them:
#
#   * the `unit-tests` job regenerates the bindings and fails on ANY diff,
#     including untracked files, so they cannot drift from the Rust API;
#   * integration_test/native_core_test.dart loads the bundled native library
#     on an iOS simulator, an Android emulator and the Linux desktop, and calls
#     through the generated dispatch into the real crate — so the generated
#     code is executed on every platform CI builds for, which is more than a
#     host-only line-coverage run was doing for it;
#   * test/services/real_spec_codec_test.dart and friends drive the same
#     bindings against a host build of the crate.
#
# The effect is that the number now tracks the code a change can actually be
# careless with, so a drop in it means something.
ignore:
  - "lib/src/rust/**"       # flutter_rust_bridge output; see above
  - "**/*.g.dart"           # any future build_runner output
  - "**/*.freezed.dart"

coverage:
  status:
    # Blocks a cliff, tolerates noise. `auto` compares against the base commit
    # rather than a fixed target, so the bar rises with the project instead of
    # being a number someone has to remember to raise; the 1% threshold is
    # there because line coverage moves by a few tenths on unrelated changes
    # and a status that cries wolf gets ignored, which is worse than not
    # having one.
    project:
      default:
        target: auto
        threshold: 1%
    # Deliberately INFORMATIONAL: it reports how well a diff's own new lines
    # are covered and never fails the check. Making new code blocking is a
    # policy call for the repo owner, not a side effect of adding a config
    # file — flip `informational` to false to enforce it.
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true      # stay silent on pull requests that move nothing
