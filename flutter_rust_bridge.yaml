# Pasted at the top of every generated Dart file.
#
# `strict-inference` (analysis_options.yaml) flags the generated
# `RustArcStaticData(...)` that every `#[frb(opaque)]` type gets, which is
# code flutter_rust_bridge writes and CI drift-gates — so it can be neither
# hand-fixed nor ignored in place. Silencing exactly that one diagnostic in
# generated files keeps `flutter analyze --fatal-infos` meaningful everywhere
# else, including for the rest of these files.
