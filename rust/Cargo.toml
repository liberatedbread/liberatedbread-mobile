# The package name matches the [lib] name (underscores, no hyphen) so the
# produced library file (libliberated_bread_core.*) matches what cargokit's pod/
# gradle build looks for — cargokit derives the artifact name from the package
# name and does not sanitize hyphens.
[package]
name = "liberated_bread_core"
version = "0.1.0"
edition = "2021"
# setup.sh and the README document 1.82 as the supported floor; declaring it
# here makes cargo enforce that claim instead of leaving it as prose.
rust-version = "1.82"
description = "Shared Rust core for the Liberated Bread BLE companion app"
license = "Apache-2.0"
repository = "https://github.com/liberatedbread/liberatedbread-mobile"
# This crate is consumed only as a cdylib/staticlib linked into the Flutter
# app via cargokit; it is not meant for crates.io.
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "liberated_bread_core"

# `#[frb(...)]` expands to code gated on `cfg(frb_expand)`, a cfg set only by
# flutter_rust_bridge_codegen's own `cargo expand` pass and therefore unknown to
# a normal build. Declare it so rustc's check-cfg lint stops reporting every
# frb-attributed item as an unexpected cfg — which `cargo clippy -D warnings`
# in CI turns into a build failure.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dependencies]
flutter_rust_bridge = "=2.9.0"
serde = { version = "1", features = ["derive"] }
# Spec `commands` and `parameters` are YAML mappings whose *declaration order*
# is meaningful — it is the order the spec author wants the controls listed.
# A HashMap would discard it at parse time (and hand every consumer a different
# order per process); IndexMap preserves insertion order, so serde hands back
# exactly what the document said.
indexmap = { version = "2", features = ["serde"] }
# `serde_yaml` (dtolnay) was archived in early 2024 with no upstream
# parser-bug or CVE fixes. Keep the import name unchanged via Cargo's
# package-rename so call sites stay readable; the actual crate is the
# actively-maintained community fork `serde_yaml_ng`.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
# The HTTP/JSON transport renders hub command bodies and parses state replies.
# `preserve_order` for the same reason `commands` uses IndexMap: an http
# command's example_body is the rendering canon, and the canon is compact JSON
# in declared order — a BTreeMap-backed Map would alphabetize the keys and diff
# against nothing.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
# The Rabbit Air LAN protocol's wire crypto: AES-128-CBC with PKCS7 padding,
# a random IV per message. Pure-Rust RustCrypto crates — the cipher lives here
# under test rather than being re-implemented (and mis-implemented) per client.
aes = "0.8"
# `alloc` for the padded-vec encrypt/decrypt helpers.
cbc = { version = "0.1", features = ["alloc"] }
# OS randomness for the per-message IV; works on every target the app builds
# for, unlike pulling in the whole `rand` stack for one 16-byte fill.
getrandom = "0.2"

# Release profile tuned for the mobile cdylib/staticlib the app ships: the
# library rides inside every APK/IPA download, so binary size wins over the
# last few percent of throughput (the hot path is BLE I/O, not CPU).
#
# panic = "abort" must NEVER be added here: flutter_rust_bridge converts Rust
# panics into catchable Dart exceptions via catch_unwind, which requires
# unwinding. With abort, any Rust panic would kill the entire app process
# instead of surfacing as a Dart-side error.
[profile.release]
# Optimize for size — smallest code the compiler can emit.
opt-level = "z"
# Thin LTO: most of full LTO's dead-code elimination and cross-crate inlining
# at a fraction of the link time.
lto = "thin"
# One codegen unit removes duplicated inline instantiations across units,
# shrinking the binary further (at the cost of parallel codegen).
codegen-units = 1
# Strip symbol tables from the artifact; debug symbols stay available in the
# separate build products for symbolication.
strip = "symbols"
