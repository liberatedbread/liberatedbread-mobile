[package]
name = "opengreeniot-core"
version = "0.1.0"
edition = "2021"
description = "Shared Rust core for the OpenGreenIoT BLE companion app"
license = "Apache-2.0"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "opengreeniot_core"

[dependencies]
flutter_rust_bridge = "=2.9.0"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
byteorder = "1"
log = "0.4"
once_cell = "1"
