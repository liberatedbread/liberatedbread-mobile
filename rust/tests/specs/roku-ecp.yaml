  # The channel picker: a select whose options are whatever the device says
  # it has installed, not a table this file could ever keep current. The two
  # sources use the same tiny XML contract — every element with the item's
  # local name is one entry, the named attribute is the raw value, the
  # element text is the label — and both queries stay readable when the
  # keypress gate is closed, so the list loads even on a TV that refuses
  # control. Selecting an option IS launching it; there is no set-without-
  # switch semantics here.
  - platform: "select"
    name: "Channel"
    icon: "mdi:apps"
    options_source:
      command: "Installed Apps"
      item: "app"
      value: "id"
    state_source:
      command: "Active App"
      item: "app"
      value: "id"
    commands:
      select_option: "launch_app"
    notes: >
      Roku's own UI calls these channels, so the entity does too. On the home
      screen the Active App element has no id attribute — the current
      selection is then simply none of the options, which is the honest
      answer. Launching a channel that is already foreground restarts or
      resumes it, per the device.

  # State surfaces, for a consumer that can read XML. Not bound to controls
  # yet: the topic alone identifies the reading, per the state_topic contract.
  - platform: "sensor"
    name: "Active App"
    state_topic: "/query/active-app"
  - platform: "sensor"
    name: "Media Player"
    state_topic: "/query/media-player"

