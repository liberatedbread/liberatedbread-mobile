device:
  name: "Roku External Control Protocol"
  manufacturer: "Roku / TCL"
  manufacturer_status: "active"
  protocol: "wifi"
  category: "tv"
  transport: "http"
  notes: >
    Roku ECP is a local REST-style HTTP API exposed on port 8060 with no
    authentication. Discovery is two-step: SSDP M-SEARCH for roku:ecp returns
    a LOCATION such as http://<ip>:8060/, then consumers must fetch
    http://<ip>:8060/query/device-info to get XML identity. The same discovered
    host:8060 is used for /query/*, /keypress/*, /launch/*, and /input
    endpoints. AirPlay mDNS can also locate compatible TCL Roku
    TVs but ECP identity comes from /query/device-info.
    Since Roku OS 14.1 the keypress/keydown/keyup, query/icon,
    query/tv-channels and query/tv-active-channel commands additionally
    require Settings > System > Advanced system settings > "Control by
    mobile apps" = Enabled; query endpoints such as device-info remain open.
  openness:
    status: "documented_api"
    reverse_engineered: true
    upstream_docs:
      - url: "https://developer.roku.com/docs/developer-program/dev-tools/external-control-api.md"
        title: "Roku — External Control Protocol (ECP)"
        covers: >
          SSDP discovery, the keypress/keydown/keyup key vocabulary, launch
          and input endpoints, and the OS 12.0 search sunset notice.
      - url: "https://sdkdocs-archive.roku.com/External-Control-API_1611563.html"
        title: "Roku SDK documentation archive — External Control API"
        covers: >
          The older command table, including query endpoints the current doc
          no longer lists.
    notes: >
      Roku publishes ECP and encourages third-party clients, which makes this
      one of the registry's rare documented_api entries. reverse_engineered is
      still true because the published surface is partial: /query/apps and
      /query/active-app were dropped from the current doc's command table yet
      remain live on the observed OS 15.2.4 fleet, and the OS 14.1 "Control by
      mobile apps" gate below is recorded from community reports and live
      behaviour, not from the ECP document.

  identification:
    ssdp_search_targets:
      - "roku:ecp"
    # No mdns_service_type. Roku devices advertise AirPlay, but so does every Apple TV, HomePod and
    # AirPlay-capable speaker or TV. `roku:ecp` (above) is the identifying
    # signal; this one only says "something here speaks AirPlay".
    # The `discovery` block below still records it.
    default_port: 8060
    identity_keys:
      primary: "serial"
      secondary: "device_id"
      display: "user_device_name"

  discovery:
    methods:
      - type: "ssdp"
        ssdp:
          search_targets: ["roku:ecp"]
          query_path: "/query/device-info"
          response_mapping:
            location:
              url: "LOCATION"
              action: "fetch_xml"
              parse:
                device_identity:
                  stable_keys:
                    - source: "xml://device-info/serial-number"
                      key: "serial"
                    - source: "xml://device-info/device-id"
                      key: "device_id"
                  display:
                    source: "xml://device-info/user-device-name"
                  variant:
                    source: "xml://device-info/model-name"
      - type: "mdns"
        mdns:
          service_type: "_airplay._tcp.local."
          identity_mapping:
            stable_keys:
              - source: "txt:deviceid"
            display:
              source: "name"
    identity:
      stable_keys: ["serial", "device_id"]
      display: "user_device_name"
    static_ip_required: false

  setup:
    required: true
    confidence: "high"
    notes: >
      Roku onboarding happens entirely on the device's own screen with the
      remote; there is no app-driven provisioning protocol to reimplement. ECP
      itself needs no pairing — it is open to every host on the LAN once the
      device is online, which is a discovery convenience and a security
      liability at the same time.
    methods:
      - type: "device_ui"
        verified: false
        description: >
          Guided first-run setup on the TV/player: language, network selection,
          passphrase entry with the on-screen keyboard, then a software update
          and (optionally) an account link. The account link gates channel
          installs, not ECP.
        steps:
          - action: "Power on the device and follow the on-screen setup with the remote."
            actor: "user"
          - action: "Select the WiFi network and enter the passphrase on the device itself."
            actor: "user"
            expect: "Device reports a successful connection and checks for updates."
          - action: "Confirm ECP is reachable from the LAN."
            actor: "client"
            request:
              protocol: "http"
              action: "GET /query/device-info"
            expect: "XML identity document on port 8060."
    factory_reset:
      confidence: "high"
      effect: "Clears network credentials, account link, installed channels and settings; the device returns to first-run setup."
      procedures:
        - name: "Menu factory reset"
          steps:
            - action: "Settings > System > Advanced system settings > Factory reset."
              actor: "user"
        - name: "Hardware reset button"
          hold_seconds: 20
          indicator: "Device reboots into the first-run wizard."
          steps:
            - action: "Press and hold the recessed Reset button (pinhole on some models) for about 20 seconds while powered."
              actor: "user"
              notes: "Use this when the screen is unusable; the menu path is preferred otherwise."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Settings > Network > Set up connection re-runs only the network step. A
        factory reset is never needed just to change routers.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "WiFi credentials"
        - "Roku account link token"
      issued_to_client: []
      notes: >
        ECP has no authentication at all. Anything that can route to port 8060
        can drive the device, so treat network reachability as the entire
        access control model. Since Roku OS 14.1 there is also a universal
        on-device gate: Settings > System > Advanced system settings >
        "Control by mobile apps" must be Enabled or keypress/keydown/keyup,
        query/icon, query/tv-channels and query/tv-active-channel are
        rejected.

  variants:
    - model: "C113X"
      name: "TCL 50S525 Roku TV"
      identification:
        model_name: "TCL 50S525"
        roku_model: "C113X"
      characteristics:
        - "Live device Television Boat observed on Ethernet with Roku OS 15.2.4."
    - model: "8116X"
      name: "TCL 32S327 Roku TV"
      identification:
        model_name: "TCL 32S327"
        roku_model: "8116X"
      characteristics:
        - "Live devices Tugboat and HKTV observed on WiFi with Roku OS 15.2.4."
    - model: "G133X"
      name: "TCL 43S45 Roku TV"
      identification:
        model_name: "TCL 43S45"
        roku_model: "G133X"
      characteristics:
        - "Live device Sharting Around the House With Mr. Farts observed on Ethernet with Roku OS 15.2.4."

helpful_urls:
  - title: "Roku External Control Protocol — official developer documentation"
    url: "https://developer.roku.com/docs/developer-program/dev-tools/external-control-api.md"
