remaining_unknowns:
  - >
    The whole print task is reported from niimbluelib, not run here: reply
    timing, whether rows need pacing between writes over BLE, and what the
    printer does if print_end arrives before print_status reports the page.
  - >
    The 0xB3 print-status reply carries an error byte only in its 10-byte
    form, at data offset 6 per niimbluelib's parser; its codes are not
    recorded here.
  - >
    The black-dot "total" count form is emitted by niimbluelib low byte
    first ([0x00][lo][hi]) although every other u16 in the protocol is
    big-endian; whether that is what the printer reads or a quirk nothing
    exercises is not established. The D110 never uses it (its 12-byte rows
    always fit split mode).
  - >
    The Print Data characteristic multiplexes every reply, and the schema
    has no frame selector: the format block is written for the D110's
    17-byte heartbeat reply (0xDD, 10 data bytes) and a consumer has to
    check response_id and data_length itself before using the lid and
    charge offsets.
  - >
    Other models' heartbeat replies put the same facts elsewhere — per
    niimbluelib, a 13-byte data field (B1) carries lid at data byte 9,
    charge at 10, paper-inserted at 11 and RFID-read at 12; a 19-byte field
    has them at 15-18; a 20-byte field carries only paper at 18 and RFID at
    19 — and one offset table cannot hold all four, so the Battery Level and
    Lid entities are scoped to the D110 and the B21 has no bound readings.
  - >
    Paper presence is not in the D110 heartbeat reply at all, so the Paper
    entity has nothing to bind on the namesake model; whether the D110
    reports it through another query is not established.
