#
# Shared TEST fixture: a minimal SmartDawn/Daniao doodle spec, shaped like the
# vendored smartdawn-smart-lights.yaml. Used by both the daniao handler's unit
# tests and device_api's routing tests — one copy, so an edit to the command
# templates or framing cannot leave one test module exercising a stale shape
# while the other passes.
device:
  name: "Pixel Curtain"
  manufacturer: "Daniao"
  manufacturer_status: "active"
  protocol: "ble"
  category: "light"
  identification:
    local_name_prefix: "DN"
    service_uuids: ["00000074-1972-1925-3022-077119514e44"]

protocol_handler: "daniao_ddp"

features:
  - type: "image_upload"
    format: "rgb888"
    max_width: 255
    max_height: 255
    resolution_source: "device_reported"
    resolution_advertisement:
      company_id: 0x61EA
      width_offset: 4
      height_offset: 5
    animation: true
    default_frame_interval_ms: 200
    # The upload choreography and the buffer tag it writes under, stated by
    # the spec rather than assumed by the handler.
    session_open: ["ui_end_sync", "doodle_start"]
    channel_tag: 0x04

services:
  - uuid: "00000074-1972-1925-3022-077119514e44"
    name: "Daniao DDP Service"
    characteristics:
      - uuid: "01020074-1972-1925-3022-077119514e44"
        name: "DDP Write"
        properties: ["write", "write_without_response"]
        framing: { scheme: "daniao_fragment", channel_tag: 0 }
        commands:
          ui_end_sync:
            description: "suspend UI mirror"
            template: [0xF0, 0x04, "{sn}", "{len}", 0x09, 0x6B, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00]
            parameters:
              sn: { type: "uint16", endianness: "big", auto: "sequence" }
              len: { type: "uint16", endianness: "big", auto: "packet_length" }
              cid: { type: "uint32", endianness: "big", default: 0 }
              osn: { type: "uint16", endianness: "big", default: 1 }
              ts: { type: "uint8", default: 0 }
          doodle_start:
            description: "open doodle"
            template: [0xF0, 0x04, "{sn}", "{len}", 0x0A, 0x8D, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00]
            parameters:
              sn: { type: "uint16", endianness: "big", auto: "sequence" }
              len: { type: "uint16", endianness: "big", auto: "packet_length" }
              cid: { type: "uint32", endianness: "big", default: 0 }
              osn: { type: "uint16", endianness: "big", default: 1 }
              ts: { type: "uint8", default: 0 }
      - uuid: "02020074-1972-1925-3022-077119514e44"
        name: "BIN Write"
        properties: ["write", "write_without_response"]
        framing: { scheme: "daniao_fragment", max_chunk_size: 200 }
