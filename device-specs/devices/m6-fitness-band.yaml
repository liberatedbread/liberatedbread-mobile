# M6 Smart Fitness Band — Device Spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Hardware RE: rbaron.net teardown (Telink TLSR8232 SoC, ST7735 TFT LCD)
#   + stock firmware dump (rbaron/m6-reveng dumped/flash.bin, SHA-256
#   674a8b78e6f27fdc61caf5f986d001f7958c211bc955614570b25f811bb1c300)
# Protocol RE: xor.co.za full reverse engineering of the identical LT716
#   platform (FitPro app, NUS transport, 0xCD-framed commands, Telink OTA)
#
# RE-TARGETED 2026-07-31: this spec previously documented the Veryfit 2.0
# (com.veryfit.multi) 0AF0 protocol as the M6's protocol. The M6's own stock
# firmware disproves that attribution: no 0AF0 UUID exists anywhere in the
# 512 kB flash; the on-device GATT table is Nordic UART Service + Telink OTA
# with an LT716_OTA identity. The Veryfit analysis is preserved at the
# bottom as a clearly-labeled mis-attribution note, and promoted to its own
# spec: device-specs/devices/veryfit-2-fitness-band.yaml.

device:
  name: "M6 Smart Fitness Band"
  manufacturer: "Unknown (AliExpress generic / Mi Band clone)"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "ble"
  category: "fitness"
  notes: >
    The M6 Smart Fitness Band is a ~$6 Mi Band clone sold on AliExpress.
    Hardware (rbaron.net teardown): Telink TLSR8232 SoC (16 kB SRAM, 512 kB
    flash, SWS debug), ST7735-driven 0.96" 160x80 color TFT LCD (the ST7735
    is a TFT LCD controller, NOT OLED), vibration motor, ~100 mAh LiPo with
    USB charging, and a (most likely) fake PPG heart-rate sensor.

    The M6 is an LT716-platform device speaking the FitPro protocol — stock
    firmware strings: "LT716(G)" (model string), firmware version V0.0.4.
    The advertised BLE Complete Local Name is "M6" (AD structure 03 09 4d
    36 in the stock firmware; "M6" is also the GAP device-name value);
    "LT716" survives as a model/string artifact and "LT716_OTA" appears
    only in OTA mode. Vendor listings pair the M6 with the FitPro app
    (package xfkj.fitpro). Transport is a Nordic UART Service (NUS)
    variant whose UUIDs end …e50e24dcca9d rather than the stock …dcca9e
    (deliberate, see services): write commands to 6e400002, notify on
    6e400003. Commands
    are 0xCD-prefixed, length-framed packets (e.g. find-me =
    CD000612010B000101), max 20 bytes per write, per the xor.co.za RE of the
    identical platform.

    OTA is the Telink OTA service 00010203-0405-0607-0809-0a0b0c0d1912
    (OTA-mode identity "LT716_OTA"): prepare 0x00FF, start 0x01FF, end
    0x02FF + index/~index + CRC16, 16-byte blocks. CAUTION: issuing
    OTA-start on the wrong handle can soft-brick the band, recoverable only
    via SWS flashing.

    "M6" is a multi-variant marketing name: at least one Alibaba listing
    shows a Phy6222-based "M6", and other M6 clones may differ again. This
    spec covers the TLSR8232/LT716 unit that rbaron tore down and that the
    firmware evidence above comes from.

    Research status: stock firmware GATT table mapped from the flash dump;
    wire protocol taken from xor.co.za's LT716/FitPro RE. Command coverage
    beyond the documented example frames still needs on-wire confirmation.
  identification:
    # No service_uuids: the stock firmware's advertising data carries no
    # service UUID at all (see notes), so listing the NUS UUID here would be
    # a signal the band never sends.
    local_name_prefix: "M6"
    manufacturer_data:
      company_id: 13388
      company_id_hex: "0x344C"
      description: >
        Not an assigned identifier: the stock firmware's advertisement holds
        an AD type 0xFF structure whose first two bytes are 4c 34 ("L4" in
        wire order) followed by six bytes of the band's own Bluetooth
        address, byte-reversed. Probably common to the LT716/FitPro
        platform rather than to the M6; a shape, not a discriminator.
    notes: >
      Read out of the stock firmware (rbaron/m6-reveng flash and RAM
      dumps), not seen on-air by this repo. The live buffers in the RAM
      dump hold a Complete Local Name AD reading "M6" (03 09 4d 36) and an
      advertising packet of flags 0x05, appearance 0x0180 (03 19 80 01) and
      the manufacturer data above; which of the two packets (advertisement
      or scan response) carries the name is not established. In OTA mode
      the name is "LT716_OTA" with the same flags/appearance/manufacturer
      data. The Nordic-UART-style service 6e400001-…-e50e24dcca9d is in the
      GATT table only. Gadgetbridge's FitPro support also recognises the
      family by name alone (M6*, M4*, LH716 and others).

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "M6"
          manufacturer_data:
            company_id: 13388
            description: >
              4c 34 then the band's Bluetooth address byte-reversed (six
              bytes); no fixed payload to match. Firmware-derived.
          notes: >
            The name is the only product-level signal, and "M6" is a short,
            reused marketing name (a Phy6222-based "M6" exists), so confirm
            after connecting: the GATT table carries service
            6e400001-b5a3-f393-e0a9-e50e24dcca9d with the 0xCD-framed
            protocol on 6e400002/6e400003.
    identity:
      stable_keys: ["address"]
      display: "local_name"
      notes: >
        The advertised manufacturer data repeats the address, so the address
        type (public vs random) is worth recording on first scan; not
        established.
    static_ip_required: false

  setup:
    required: false
    confidence: low
    notes: >
      The band needs no provisioning. It advertises as "M6" (no service
      UUID in the advertisement) and accepts commands from any client that connects;
      the FitPro protocol involves no pairing or bonding — none of the
      scanning or commanding requires that anything actually pair (xor.co.za).
    methods:
      - type: ble_direct
        description: >
          Connect over GATT, enable notifications on the NUS RX
          characteristic (6e400003), then write 0xCD-framed command packets
          to the NUS TX characteristic (6e400002).
        verified: false
        ble:
          pairing_required: false
        steps:
          - action: "Wake the band by pressing its touch button so it advertises."
            actor: user
          - action: "Scan for the BLE name M6 (the advertisement carries no service UUID), connect over GATT and find service 6e400001-b5a3-f393-e0a9-e50e24dcca9d."
            actor: client
          - action: "Enable notifications on 6e400003-b5a3-f393-e0a9-e50e24dcca9d via the standard CCCD."
            actor: client
          - action: >
              Write 0xCD-prefixed length-framed command packets (max 20 bytes
              per write) to 6e400002-b5a3-f393-e0a9-e50e24dcca9d.
            actor: client
            expect: "Responses arrive as notifications on 6e400003."
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established over the wire: no factory-reset command is documented
        for the LT716/FitPro platform. The band's own menu offers a restore,
        so something exists — but what it clears, and whether it drops the
        bind state a client cares about, is unknown. CAUTION: the Telink OTA
        path is the dangerous corner — issuing OTA-start (0x01FF) on the wrong
        handle can soft-brick the band, recoverable only via SWS flashing. Not
        stated rather than guessed.
      procedures:
        - name: "Restore factory settings from the band's own menu"
          glyph: "generic/on-screen-menu.svg"
          verified: false
          basis: >
            The V6 heart-rate smart bracelet instruction manual for this
            hardware class. On-device only — it says nothing about what the
            restore clears, and no equivalent BLE command has been identified.
          power_state: "on"
          steps:
            - action: "Swipe to the More screen on the band."
              actor: "user"
            - action: "Select the restore-factory-settings entry and press the touch area to confirm."
              actor: "user"
              expect: "The band restores its factory settings. What that includes is not documented."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The band joins no network. Any client may connect once the previous one
        disconnects.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        BLE-only; no WiFi passphrase crosses the link. No authentication of any
        kind, so health data is readable by anyone in range.

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
services:
  # NOT a typo for the stock NUS UUID (…dcca9e). This firmware's GATT table
  # holds 6e40000{1,2,3}-b5a3-f393-e0a9-e50e24dcca9d and has no …dcca9e UUID
  # anywhere in its 512 kB flash (rbaron/m6-reveng dump, offsets below), and
  # Gadgetbridge's FitPro support (FitProConstants) uses the same …9d
  # UUIDs. A client looking for the stock NUS UUID will not find the band.
  - uuid: "6e400001-b5a3-f393-e0a9-e50e24dcca9d"
    name: "Nordic UART Service (FitPro transport)"
    notes: >
      Nordic-UART-style service with a non-standard last byte (…dcca9d, not
      the stock …dcca9e) — the transport of the FitPro/LT716 protocol,
      confirmed in the stock M6 firmware GATT table (UUIDs found at flash
      offsets 0x1b160 / 0x1ab34 / 0x1ab54). Commands are 0xCD-prefixed,
      length-framed packets, max 20 bytes per write. Full protocol writeup
      for the identical platform: xor.co.za, "Hacking a smartwatch" (2022).
    characteristics:
      - uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9d"
        name: "NUS TX (command write)"
        properties: ["write", "write_without_response"]
        notes: "Command channel: 0xCD-prefixed length-framed packets."
        commands:
          find_me:
            description: "Make the band alert (find-my-band). Documented example frame from the LT716 platform RE."
            locate: "both"
            verification: "reported"
            value: [0xCD, 0x00, 0x06, 0x12, 0x01, 0x0B, 0x00, 0x01, 0x01]
      - uuid: "6e400003-b5a3-f393-e0a9-e50e24dcca9d"
        name: "NUS RX (notify)"
        properties: ["notify"]
        notes: "Responses and notifications from the band."

  - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
    name: "Battery Service"
    notes: "Standard BLE battery service, present in the stock firmware GATT table."
    characteristics:
      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "Battery Level"
        properties: ["read", "notify"]

  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    name: "Device Information Service"
    notes: >
      Standard device information, present in the stock firmware GATT table
      (the DIS region at flash offset ~0x1b174 holds 0x2A28 and 0x2A26 next
      to the "V0.0.4" string; no 0x2A24 Model Number characteristic exists
      in the GATT table).
    characteristics:
      - uuid: "00002a28-0000-1000-8000-00805f9b34fb"
        name: "Software Revision String"
        properties: ["read"]
        notes: "Stock firmware value: \"V0.0.4\"."
      - uuid: "00002a26-0000-1000-8000-00805f9b34fb"
        name: "Firmware Revision String"
        properties: ["read"]

  - uuid: "00001812-0000-1000-8000-00805f9b34fb"
    name: "Human Interface Device Service"
    notes: >
      Standard HID service (0x1812), present in the stock firmware GATT
      table. Purpose on this band is undocumented — likely used by the
      FitPro ecosystem for remote-control features; unverified.

  - uuid: "00010203-0405-0607-0809-0a0b0c0d1912"
    name: "Telink OTA Service"
    notes: >
      Telink OTA service (found at flash offsets 0x1ab78, 0x29218); the band
      reboots into OTA mode under the identity "LT716_OTA". Flow per the
      sibling LT716 platform: prepare 0x00FF, start 0x01FF, end 0x02FF +
      index/~index + CRC16, 16-byte blocks. CAUTION: OTA-start on the wrong
      handle can soft-brick the band; recovery requires SWS flashing
      (rbaron's tlsr82-debugger-client works for this).
    characteristics:
      - uuid: "00010203-0405-0607-0809-0a0b0c0d2b12"
        name: "Telink OTA Data"
        properties: ["write", "write_without_response"]
        notes: >
          OTA data characteristic (found at flash offset 0x1ab1c, stored
          byte-reversed like the rest of the Telink GATT table). Carries
          the 16-byte OTA blocks.

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["telink_ota"]
      transport: "ble"
      services: ["00010203-0405-0607-0809-0a0b0c0d1912"]
      image:
        signing: "unknown"
        source: "unknown"
        notes: >
          No image is known to exist: the FitPro OTA cloud
          (tomato.gulaike.com, tomato.jusonsmart.com) answers data: null for
          M6/m6/M6S/LT716 (checked 2026-07-31). The stock flash dump in
          rbaron/m6-reveng is the only known image. Telink's SDK images are
          unsigned; nothing records whether this firmware checks more than
          the per-packet CRC-16.
      enter:
        how: "unknown"
        notes: >
          The stock firmware reboots into an OTA identity, but which write
          triggers it is not recorded. The known flow, from the sibling
          LT716 platform, is Telink command indexes on 0000…2b12: prepare
          0x00FF, start 0x01FF, end 0x02FF + index/~index + CRC-16, with
          16-byte data blocks. Issuing OTA-start on the wrong handle can
          soft-brick the band.
      dfu_mode:
        local_names: ["LT716_OTA"]
        notes: >
          "LT716_OTA" appears only in OTA mode (a string in the stock
          firmware); it does not collide with the normal "M6" name. The
          update-mode address is not recorded.
      recovery:
        interrupted: "unknown"
        notes: >
          A band soft-bricked by a bad OTA write is recoverable only over
          the TLSR8232's SWS debug pins, e.g. with rbaron's
          tlsr82-debugger-client (see helpful_urls).
      verification: "reported"
      notes: >
        The service, data characteristic and OTA name come from the stock
        firmware dump; the command sequence comes from xor.co.za's RE of the
        identical LT716 platform. Nothing here has been run against a band.

