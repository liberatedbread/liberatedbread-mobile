      - uuid: "00000af7-0000-1000-8000-00805f9b34fb"
        name: "Normal Notify"
        notes: >
          Notify characteristic for receiving command responses from the
          device. Responses are 20-byte frames with same structure as commands:
          byte 0 = command ID, byte 1 = key, bytes 2-19 = response payload.

          Responses are received after enabling notifications on this
          characteristic via the standard CCCD (00002902).
        properties: ["notify"]
        format:
          - offset: 0
            length: 1
            name: "command_id"
            type: "uint8"
          - offset: 1
            length: 1
            name: "key"
            type: "uint8"
          - offset: 2
            length: 18
            name: "payload"
            type: "bytes"

      - uuid: "00000af1-0000-1000-8000-00805f9b34fb"
        name: "Health Write"
        notes: >
          Write characteristic for health data sync commands. Used for
          requesting and controlling bulk health data transfers (step
          history, sleep data, heart rate history, sports data).
          Same 20-byte frame format as Normal Write.
        properties: ["write", "write_without_response"]
        commands:
          health_sync_request:
            description: "Request health data sync from device."
            verification: "hypothesis"
            value: [0x08, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          health_sync_success:
            description: "Acknowledge successful health data sync batch."
            verification: "hypothesis"
            value: [0x08, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          health_data_send_finished:
            description: "Signal end of health data transmission."
            verification: "hypothesis"
            value: [0x08, 0xee, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

      - uuid: "00000af2-0000-1000-8000-00805f9b34fb"
        name: "Health Notify"
        notes: >
          Notify characteristic for receiving health data from the device.
          Health data arrives as multiple 20-byte notification packets.
          Sub-command keys indicate data type:
            0x07 = heart rate details today
            0x08 = heart rate details history
            0x03 = sports details today
            0x04 = sleep details today
            0x05 = sports details history
            0x06 = sleep details history
            0xee = data send finished
            0xff = error

          Real-time data (from GetInfoCmd KEY_REAL_TIME, 0xA0): returns
          12 bytes of data containing total_step, total_calories,
          total_distances, total_active_time, and heart_rate.
          Exact field widths and byte layout TBD — HCI snoop needed.
        properties: ["notify"]
        format:
          - offset: 0
            length: 1
            name: "command_id"
            type: "uint8"
          - offset: 1
            length: 1
            name: "key"
            type: "uint8"
          - offset: 2
            length: 18
            name: "payload"
            type: "bytes"

  - uuid: "00001530-1212-efde-1523-785feabcd123"
    name: "Nordic DFU Service"
    notes: >
      Standard Nordic Semiconductor Device Firmware Update service.
      Handled by the Nordic DFU library (no.nordicsemi.android.dfu).
      Used for over-the-air firmware updates. The DFU service and
      its characteristics follow the standard Nordic DFU protocol.
      Reference: Nordic nRF5 SDK DFU documentation.
    characteristics:
      - uuid: "00001531-1212-efde-1523-785feabcd123"
        name: "DFU Control Point"
        notes: "Standard Nordic DFU control point characteristic."
        properties: ["write", "notify"]
      - uuid: "00001532-1212-efde-1523-785feabcd123"
        name: "DFU Packet"
        notes: "Standard Nordic DFU data packet characteristic."
        properties: ["write_without_response"]
      - uuid: "00001534-1212-efde-1523-785feabcd123"
        name: "DFU Version"
        notes: "Standard Nordic DFU version characteristic."
        properties: ["read"]
