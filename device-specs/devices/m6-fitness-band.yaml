# M6 Smart Fitness Band — Device Spec
# Generated from static analysis of com.veryfit.multi (Veryfit 2.0 APK)
# APK source: APKPure via apkeep
# APK SHA-256: 98fab69b465f77f84b44d7ea859678a115474999691e72b2c814716a8aa6d530
#
# Hardware RE: rbaron.net (Telink TLSR8232 SoC, ST7735 OLED, PPG sensor)
# Software RE: static analysis of decompiled smali from companion APK
#
# NOTE: The companion app package ID for the M6 band is UNCONFIRMED.
# com.veryfit.multi (Veryfit 2.0) is a generic fitness band app compatible
# with many cheap Chinese smart bands. All UUIDs below are recovered from
# the Veryfit 2.0 APK and may apply to the M6 band but are not confirmed
# against hardware.

device:
  name: "M6 Smart Fitness Band"
  manufacturer: "Unknown (AliExpress generic / Mi Band clone)"
  manufacturer_status: "active"
  protocol: "ble"
  notes: >
    The M6 Smart Fitness Band is a ~$6 Mi Band clone sold on AliExpress.
    Hardware uses Telink TLSR8232 SoC with ST7735 OLED display, PPG heart
    rate sensor, and vibration motor. The companion app is unconfirmed;
    com.veryfit.multi (Veryfit 2.0) is a plausible generic fitness app.

    The Veryfit 2.0 app uses a single custom 128-bit BLE service multiplexing
    all device functions through four characteristics (normal write/notify and
    health write/notify). Commands are 20-byte fixed-length frames with a
    command ID at byte 0 and a sub-command key at byte 1.

    BLE connection flow: scan for service 00000AF0, connect, enable
    notifications on NOTIFY_UUID_NORMAL and NOTIFY_UUID_HEALTH, then
    send commands on WRITE_UUID_NORMAL / WRITE_UUID_HEALTH.

    Research status: APK acquired, decompiled to smali. All UUIDs and
    command IDs recovered. Byte-level payload formats are inferred from
    smali field layouts and health data parser logic — HCI snoop needed
    to confirm exact payload encoding.

  identification:
    service_uuids:
      - "00000af0-0000-1000-8000-00805f9b34fb"

  setup:
    required: false
    confidence: low
    notes: >
      The band needs no provisioning. It advertises service 00000AF0 and accepts
      commands from any client that connects; the Veryfit app pairs no keys and
      binds the band to no account.

      Confidence is low throughout: the companion app itself is unconfirmed
      (com.veryfit.multi is a plausible match, not an established one), and the
      payload encoding is inferred from smali rather than observed on the wire.
    methods:
      - type: ble_direct
        description: >
          Connect over GATT, enable notifications on the normal and health
          notify characteristics, then write 20-byte command frames.
        verified: false
        ble:
          pairing_required: false
        steps:
          - action: "Wake the band by pressing its touch button so it advertises."
            actor: user
          - action: "Scan for service 00000AF0 and connect over GATT."
            actor: client
          - action: "Enable notifications on NOTIFY_UUID_NORMAL and NOTIFY_UUID_HEALTH."
            actor: client
          - action: >
              Write 20-byte command frames to WRITE_UUID_NORMAL or
              WRITE_UUID_HEALTH, command ID at byte 0, sub-command at byte 1.
            actor: client
            expect: "A response frame arrives on the matching notify characteristic."
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established. The recovered command set is believed to include a
        reset, but which command ID carries it has not been confirmed, and
        issuing an unverified ID to a device with a firmware-update path is a
        good way to brick a band. Not stated rather than guessed.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The band joins no network. Any client may connect once the previous one
        disconnects.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        BLE-only; no WiFi passphrase crosses the link. No authentication of any
        kind was found, so health data is readable by anyone in range.

services:
  - uuid: "00000af0-0000-1000-8000-00805f9b34fb"
    name: "Veryfit Primary Service"
    notes: >
      Single custom service that multiplexes all device functions.
      Four characteristics: normal channel (commands + responses) and
      health data channel (bulk health data sync + responses).
    characteristics:
      - uuid: "00000af6-0000-1000-8000-00805f9b34fb"
        name: "Normal Write"
        notes: >
          Write-only characteristic for sending commands to the device.
          Commands use 20-byte fixed-length frames: byte 0 = command ID,
          byte 1 = sub-command key, bytes 2-19 = payload.
          Used for: get info, settings, bind/unbind, notify, app control,
          ware update.
        properties: ["write", "write_without_response"]
        commands:
          get_basic_info:
            description: "Request device basic info (battery status, bind flag, current mode)."
            verification: "hypothesis"
            value: [0x02, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          get_battery:
