# wl.smartled / fstart addressable-pixel LED strips (duoCo StripX / Lotus Lantern / Magic Lantern)
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "wl.smartled Addressable Pixel LED Strip (duoCo StripX / Lotus Lantern / Magic Lantern)"
  manufacturer: "Unbranded / various OEMs (fstart 'easylink' platform; duoCo StripX OEM customer: Shenzhen Shuanghongyuan)"
  manufacturer_status: "unsupported"
  testing:
    status: untested
    notes: >
      All facts below come from static analysis of the three vendor apps
      (wl.smartled.duoco.rgb 6.3.7, wl.smartled 6.5.08, wl.smartled.rgb
      6.11.06). No live capture against hardware has been replayed by this
      project yet — see the CONFIDENCE paragraph in notes.
  protocol: "ble"
  category: "light"
  notes: >
    THREE APPS, ONE PROTOCOL. duoCo StripX (wl.smartled.duoco.rgb), Lotus
    Lantern (wl.smartled) and Magic Lantern (wl.smartled.rgb) are channel
    skins of one shared vendor codebase (the "fstart"/easylink LED platform,
    also reskinned as duoCo Strip, EasyLinkLED and others). They speak the
    same BLE protocol to the same controllers; the per-app differences are
    the advertised-name filter and a few variant commands, called out below.
    These are ADDRESSABLE-PIXEL strips (dream-color / "symphony" segments,
    241 built-in effects, per-segment pixel count) — do not confuse them
    with the sibling PWM (single-color) ELK-BLEDOM protocol in
    elk-bledom-led-strip.yaml, which shares characteristic 0xFFF3 and the
    7E…EF envelope but uses byte[1] as a sequence number and notifies
    state on 0xFFF4. The pixel platform documented here has NO notify
    characteristic: 0xFFF3 is write + read only, and state is pulled by
    reading 0xFFF3.

    FRAMING: every command is a fixed 9-byte frame written to 0xFFF3:
      [0] 0x7E header
      [1] per-command constant 0x04-0x08 (looks like a payload-length
          field; the app treats it as a fixed per-command value — copy it
          verbatim, do not compute it)
      [2] opcode (0x01 brightness, 0x02 speed, 0x03 mode/EQ, 0x04
          power/mic/channel-mask, 0x05 color/CCT, 0x21 pixel count,
          0x31 scene, 0x76 countdown, 0x81 RGB pin order, 0x82 timer,
          0x83 system time)
      [3..6] payload, 0xFF = unused pad
      [7] flag/type byte: 0x10 static color, 0x20 music-reactive color,
          0x08 CCT/palette color, 0x01 scene, 0xFF on time frames,
          0x00 most others. Appears to be a routing tag the firmware
          switches on — keep the exact value per command.
      [8] 0xEF trailer
    No checksum, no crypto on GATT writes. Write type: default write with
    response; no MTU negotiation required (Lotus Lantern requests MTU 63
    but the frames are 9 bytes). The app keeps two frame slots and flushes
    them with a 5 ms inter-frame gap on a 100 ms timer, so color +
    brightness pairs per UI gesture are normal; a replacement client
    should space back-to-back writes by >= 5 ms.

    CONNECT SEQUENCE: after GATT connect the app performs a READ of 0xFFF3
    ("connection state" probe — any reply marks the device up; content is
    otherwise ignored) and then pushes a set_system_time frame so the
    on-device scheduler has a clock. Subscribe nothing: notifications are
    never enabled and the app's notification callback discards data.
    Group control is client-side only: the app holds up to 4 concurrent
    GATT connections (LRU) and writes the same frame to each.

    DISCOVERY / NAME GATING (the advertised complete name selects app
    features, so a replacement client should parse it too):
      MELK-*   duoCo StripX / Magic Lantern filter. Suffixes: OC/OT =
               built-in scene tab (group 8); name matching ^MELK-.+CT =
               CCT model; ^MELK-.+W = dedicated white channel; OE/OB/TX =
               no external mic (all others have one); DYDS = extra "Big
               Bang" scene (code 156); TX = remote/transmitter unit.
      ELK- / ELK~ / XSL- / "LED LIGHT STRIP"   Lotus Lantern's GATT filter
               (ELK~ is a wavy-name second hardware revision; XSL- = "new
               strength" models). Magic Lantern accepts only MELK-.
      ELK_*    broadcast/mesh devices driven over BLE advertising instead
               of GATT (see RELAY below).
      ELK-*    encrypted-variant devices (see ENCRYPTED VARIANT below).
      Name containing "INTRO" flips the power-on payload byte from 0x01
               to 0xFF.
    A CLK- filter constant exists in the apps but is unused (likely a
    sibling clock product on the same firmware).

    TIMER READBACK: to query a timer, write a query frame
    7E 08 82 FF FF FF mode weeks EF and then READ 0xFFF3. Valid replies:
    7E 08 82 H M S mode weeks EF (weeks bit7 = timer enabled, low 7 bits
    = weekday mask; mode 0 = on-alarm, 1 = off-alarm) and
    7E 07 83 … FF EF for the system-time readback. Replies arrive via
    readCharacteristic polling, never notifications.

    BROADCAST RELAY (connectionless): for ELK_* mesh devices the PHONE
    itself advertises non-connectable manufacturer-data frames, company
    id 0xBEE8. 25-byte payload: rolling counter, 0xB0 marker, random
    per-app-run 2-byte host id, the embedded 9-byte command frame (zeros
    for heartbeat), and a nibble-compressed list of up to 8 target 2-byte
    device ids. The payload is obfuscated with a single-byte XOR whose
    key derives from the frame counter (the app's fixed key table reduces
    to a constant XORed with the counter — obfuscation grade, not
    security). Device-side relay adverts are parsed symmetrically (mfr
    id 0xBEE8, 0xA0 marker, embedded command, target id). Heartbeat runs
    on an 80 ms scheduler, heartbeat every 12 ticks, command adverts
    repeated 10x.

    ENCRYPTED VARIANT (ELK-* names): for devices whose advertised name
    contains "ELK-*", the apps wrap the 9-byte frame in a 21-byte
    AA…55-framed obfuscation layer (applied only for opcodes 0x01, 0x03,
    0x04): 12 per-frame random bytes generate a keystream that masks the
    9-byte plaintext, and the random bytes themselves are masked with a
    16-byte preset key hardcoded in the app. Inbound status uses a
    28-byte wrapper with a 6-byte 00 01 02 03 04 05 header, a counter
    byte, then payload. This is obfuscation-grade — the keystream derives
    entirely from the transmitted random — and the preset key is
    recoverable from the APK; it is deliberately not reproduced here.
    Whether responses from these devices also require the wrapper needs
    dynamic verification.

    EFFECT MODE TABLE (opcode 0x03 mode command, 241 entries incl. "Auto
    Play" = 0; groups 0-7 use the mode command, group 8 uses the scene
    opcode 0x31 and is hidden unless the name is MELK-OC/-OT):
      group0 "Basic" (47): 0 Auto Play, 1 Magic Forward, 2 Magic Back,
        193 7C Jump, 194 R-G-B Jump, 195 Y-C-P Jump, 196 7C Strobe,
        197 R-G-B Strobe, 198 Y-C-P Strobe, 199 7C Gradual, 200-204
        R-Y/R-P/G-C/G-Y/B-P Gradual, 205-211 Marquee R/G/B/Y/C/P/W,
        77-82 Race (7C, 7C Back, RGB, RGB Back, YCP, YCP Back), 83-88
        Wave (same 6), 181-186 Flush (same 6), 187-192 Flush Close/Open
        (7C/RGB/YCP), 212 7-Color Energy
      group1 "Curtain" (20): 57-58 7C Close/Open, 59-60 RGB, 61-62 YCP,
        63-76 per-color Close/Open R,G,B,Y,C,P,W
      group2 "Trans" (20): 3-8 Trans 7C/7CB/RGB/RGBB/YCP/YCPB, 9-22
        6-Color-to-X (+Back) for X=R,G,B,C,Y,P,W
      group3 "Water" (18): 39-56 Water fwd/back: 7C, RGB, YCP, R-G, G-B,
        Y-B, Y-C, C-P, White
      group4 "Flow" (24): 143-166 W-X-W and X-W-X Flow (+Back),
        X=R,G,B,Y,C,P
      group5 "Tail" (16): 23-38 Tail fwd/back: 7C, R,G,B,Y,C,P,White
      group6 "Run" (34): 89/91/93/95/97/99/101/103/105/107 Running
        R,G,B,Y,C,P,W,7C,RGB,YCP; 109/111 B-P-C-Y/B-G-C-Y; 113-127 X-Dot
        in Y Running; 129-141 7-Color in X; 167-179 more dot variants
      group7 "RunBack" (34): same set +1 (90..142, 168..180)
      group8 "Scenes" (28, opcode 0x31): 1 Sunrise, 2 Sunset, 3 Birthday,
        4 Candlelight, 5 Fireworks, 6 Party, 7 Datiny, 8 Starry sky,
        9 Romantic, 10 Disco, 11 Rainbow, 12 Movie, 13 Christmas,
        14 Flowing, 15 Sleeping, 16 Ocean, 17 Forest, 18 Reading,
        19 Working, 20 Dazzle, 21 Gentle, 22 Wedding, 23 Snow, 24 Fire,
        25 Lightning, 26 Valentine's Day, 27 Hallowmas, 28 Warnning
        (plus 156 "Big Bang" on MELK-DYDS models)

    CHANNEL-SKIN DIFFERENCES found between app builds: Lotus Lantern adds
    a countdown command (opcode 0x76, timestamp = seconds-until x10
    derived from a 2001-01-01 epoch), laser-lamp commands (mode
    7E 05 03 m 08 FF FF FF EF, speed 7E 04 02 s 04 FF FF FF EF, on/off
    7E 05 05 01 v FF FF 10 EF), the RGBW channel-mask command, the INTRO
    power special-case, and the ELK-* encrypted-device layer. Its
    dynamic-mode frame ORs the mode index with 0x80
    (7E 05 03 (mode+0x80) 03 FF FF 00 EF) where duoCo StripX sends the
    bare index with byte[4]=0x06 — both opcode 0x03; treat the duoCo form
    as primary and the 0x80 variant as MEDIUM confidence needing capture.
    Lotus Lantern's CCT payload range reads 0-255 in code vs duoCo's
    0-100 UI scale; firmware clamping unknown.

    NETWORK / OTA: BLE only — no Wi-Fi/UDP/TCP/SSDP/mDNS transport in any
    of the three apps, and NO OTA/DFU path anywhere (no firmware URLs, no
    update code). Network use is privacy-policy pages, a version-check
    JSON on www.elkble.com, an FAQ endpoint, and a device-telemetry
    upload (advertised name/MAC/RSSI/GATT table) to
    lotus.elkled.com:8082, gated by a server-side opt-in flag. A
    replacement client needs none of it.

    CONFIDENCE: HIGH for service/characteristic UUIDs, the 9-byte frame
    layout, no-checksum/no-crypto on GATT writes, the write+read/no-notify
    model, the connect probe + time-push sequence, the name filters and
    model-variant gating, the core opcode set (power 04, brightness 01,
    speed 02, mode 03, color 05, scene 0x31, pin order 0x81, pixel count
    0x21, timer 0x82/0x83 with readback), the relay-advert format and the
    existence/structure of the ELK-* encryption layer — all read directly
    from the decompiled command builders in all three apps. MEDIUM for
    exact payload ranges the firmware accepts (brightness/speed 0-100 are
    UI-side clamps), byte[7] semantics, the 0x80-ORed Lotus mode frame,
    CCT range, countdown timestamp math, and whether ELK-* devices wrap
    responses — confirm via live HCI capture.

  identification:
    service_uuids:
      - "0000fff0-0000-1000-8000-00805f9b34fb"
  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "0000fff0-0000-1000-8000-00805f9b34fb"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning, no account, no bonding. The controller advertises
      when powered and accepts a GATT connection from any central in
      range. The vendor app's only "setup" is the post-connect read of
      0xFFF3 followed by a system-time push — mirror that so the on-device
      timer/scheduler has a clock.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Scan for the 0xFFF0 service UUID (advertised name starts with
          MELK-, ELK-, ELK~, XSL- or is "LED LIGHT STRIP"), connect, read
          0xFFF3 once to confirm the link, write a set_system_time frame,
          then issue 9-byte command frames to 0xFFF3. Space back-to-back
          writes by >= 5 ms. No pairing, no PIN, no login handshake.
        ble:
          pairing_required: false
        steps:
          - action: "Power the strip controller."
            actor: "user"
            request:
              protocol: "ble_gatt"
          - action: >
              Scan for service 0xFFF0 / a matching name prefix and connect.
            actor: "client"
          - action: >
              Read characteristic 0xFFF3 (connection probe), then write a
              set_system_time frame.
            actor: "client"
          - action: "Write 9-byte command frames to characteristic 0xFFF3."
            actor: "client"
    factory_reset:
      confidence: "medium"
      effect: >
        No credential state to clear — nothing on the device binds it to
        a phone or network. Power-cycling drops the current connection,
        which is also the remedy for the common failure mode of the
        single link being held by another central. Timers and the system
        clock persist on-device until overwritten.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove and reapply power."
              actor: "user"
              expect: "Device advertises again and accepts a new connection."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds the device to an owner, so switching controllers is
        just connecting from the new one. If the old phone keeps
        reconnecting and holding the link, remove the device from its OS
        Bluetooth list as well.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        No authentication. Anything within radio range can connect and
        issue commands; physical proximity is the only access control.

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
  variants:
    - model: "MELK- pixel strip (duoCo StripX / Magic Lantern)"
      identification:
        local_name_prefix: "MELK-"
      notes: >
        Addressable-pixel models. Name suffix gates features: OC/OT =
        scene tab, *CT* = CCT, *W* = white channel, DYDS = extra scene
        156, OE/OB/TX = no external mic, TX = remote/transmitter.
    - model: "ELK- pixel strip (Lotus Lantern)"
      identification:
        local_name_prefix: "ELK-"
      notes: >
        Lotus Lantern's primary filter. Same protocol; adds countdown
        (0x76) and laser-lamp commands on some models. Names containing
        "INTRO" flip the power-on payload byte to 0xFF.
    - model: "ELK~ pixel strip (wavy-name revision)"
      identification:
        local_name_prefix: "ELK~"
    - model: "XSL- pixel strip ('new strength')"
      identification:
        local_name_prefix: "XSL-"
    - model: "LED LIGHT STRIP"
      identification:
        local_name_prefix: "LED LIGHT STRIP"
    - model: "ELK_ broadcast/mesh device"
      identification:
        local_name_prefix: "ELK_"
      notes: >
        Driven connectionlessly via phone-advertised relay frames
        (company id 0xBEE8) rather than GATT — see device.notes RELAY
        paragraph. A replacement client can still talk GATT to the same
        hardware when it advertises a connectable name.
    - model: "ELK-* encrypted variant"
      identification:
        local_name_prefix: "ELK-*"
      notes: >
        Same protocol wrapped in the 21-byte AA…55 obfuscation layer
        described in device.notes (ENCRYPTED VARIANT). The hardcoded
        preset key is recoverable from the app and deliberately not
        reproduced here.

services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "wl.smartled Pixel Strip Service"
    notes: >
      Single service, single characteristic 0xFFF3 used for both writes
      (all commands) and reads (connection probe + timer readback). NO
      notify/indicate characteristic exists on this platform — state is
      polled. All frames are 9 bytes: [0x7E][per-command size 0x04-0x08]
      [opcode][4 payload bytes, 0xFF pad][flag][0xEF]. No checksum.
    characteristics:
      - uuid: "0000fff3-0000-1000-8000-00805f9b34fb"
        name: "Command / Readback"
        properties: ["write", "read"]
        notes: >
          All commands are written here as complete 9-byte frames (no
          framing layer needed — each write is one packet). The same
          characteristic is READ for the post-connect probe and for
          timer/system-time readback after a query_timer frame; replies
          match 7E 08 82 H M S mode weeks EF (timer) or 7E 07 83 … FF EF
          (system time). Notifications are not supported/used. Keep
          byte[1] and byte[7] exactly as shown per command — they are
          fixed routing constants, not computed fields.
        commands:
          power_on:
            description: >
              Turn the light on (opcode 0x04). On devices whose name
              contains "INTRO" the two 0x01 payload bytes become 0xFF.
            value: [0x7E, 0x04, 0x04, 0x01, 0x00, 0x01, 0xFF, 0x00, 0xEF]
          power_off:
            description: "Turn the light off (all-zero payload)."
            value: [0x7E, 0x04, 0x04, 0x00, 0x00, 0x00, 0xFF, 0x00, 0xEF]
          set_brightness:
            description: >
              Set brightness 0-100 (opcode 0x01). light_mode selects the
              channel the brightness applies to: 0 = all, 1 = RGB,
              2 = white, 3 = CCT.
            template: [0x7E, 0x04, 0x01, "{brightness}", "{light_mode}", 0xFF, 0xFF, 0x00, 0xEF]
            parameters:
              brightness: { type: "uint8", min: 0, max: 100 }
              light_mode:
                type: "uint8"
                default: 0x00
                values: { "0": "all", "1": "RGB", "2": "white", "3": "CCT" }
          set_effect_speed:
            description: "Set effect change speed 0-100 (opcode 0x02)."
            template: [0x7E, 0x04, 0x02, "{speed}", 0xFF, 0xFF, 0xFF, 0x00, 0xEF]
            parameters:
              speed: { type: "uint8", min: 0, max: 100 }
          set_effect_mode:
            description: >
              Select a built-in dynamic effect (opcode 0x03) by mode code
              from the 241-entry table in device.notes (0 = Auto Play,
              groups 0-7). Note: the Lotus Lantern build ORs the mode
              index with 0x80 and uses byte[4]=0x03 instead of 0x06 —
              MEDIUM confidence, prefer this bare-index form.
            template: [0x7E, 0x05, 0x03, "{mode}", 0x06, 0xFF, 0xFF, 0x00, 0xEF]
            parameters:
              mode: { type: "uint8", min: 0, max: 212 }
          set_scene:
            description: >
              Select a built-in scene (opcode 0x31), codes 1-28 from the
              group-8 table in device.notes; 156 = "Big Bang" on MELK-DYDS
              models. Scene tab is only exposed on MELK-OC / MELK-OT
              devices.
            template: [0x7E, 0x05, 0x31, "{scene}", 0x07, 0xFF, 0xFF, 0x01, 0xEF]
            parameters:
              scene: { type: "uint8", min: 1, max: 156 }
          set_rgb_color:
            description: >
              Set a static RGB color (opcode 0x05, sub 0x03, flag 0x10).
            template: [0x7E, 0x07, 0x05, 0x03, "{red}", "{green}", "{blue}", 0x10, 0xEF]
            parameters:
              red: { type: "uint8", min: 0, max: 255 }
              green: { type: "uint8", min: 0, max: 255 }
              blue: { type: "uint8", min: 0, max: 255 }
          set_music_color:
            description: >
              Music/streaming amplitude color (opcode 0x05, sub 0x03,
              flag 0x20). Same layout as set_rgb_color; the app
              pre-multiplies amplitude into the color and sends the
              sentinel value 0xFF000000 (as R,G,B = FF,00,00 with the
              alpha implicit) to keep the current mode color. Drive this
              at audio rate for phone-mic-reactive effects.
            template: [0x7E, 0x07, 0x05, 0x03, "{red}", "{green}", "{blue}", 0x20, 0xEF]
            parameters:
              red: { type: "uint8", min: 0, max: 255 }
              green: { type: "uint8", min: 0, max: 255 }
              blue: { type: "uint8", min: 0, max: 255 }
          set_single_color:
            description: >
              Set one color from the device's palette by index (opcode
              0x05, sub 0x01, flag 0x08) — the color-dial path in the
              apps.
            template: [0x7E, 0x05, 0x05, 0x01, "{index}", 0xFF, 0xFF, 0x08, 0xEF]
            parameters:
              index: { type: "uint8", min: 0, max: 100 }
          set_color_temperature:
            description: >
              Set CCT warm/cold levels (opcode 0x05, sub 0x02, flag
              0x08), 0-100 each on duoCo/Magic builds (Lotus Lantern's
              code suggests 0-255; firmware clamp unknown — MEDIUM).
              Only on CT models (name matches ^MELK-.+CT).
            template: [0x7E, 0x06, 0x05, 0x02, "{warm}", "{cold}", 0xFF, 0x08, 0xEF]
            parameters:
              warm: { type: "uint8", min: 0, max: 100 }
              cold: { type: "uint8", min: 0, max: 100 }
          set_channel_mask:
            description: >
              RGBW channel on/off mask (opcode 0x04, RGBW models): flags
              byte 0xE0 = RGB on, OR 0x10 = white channel on; mode =
              light mode (0 all / 1 RGB / 2 W / 3 CT); state 1/0.
              Power-on uses flags 0x01, mode 0x00, state 0x01 (see
              power_on).
            template: [0x7E, 0x04, 0x04, "{flags}", "{mode}", "{state}", 0xFF, 0x00, 0xEF]
            parameters:
              flags: { type: "uint8", default: 0xE0 }
              mode: { type: "uint8", min: 0, max: 3 }
              state: { type: "uint8", values: { "0": "off", "1": "on" } }
          set_mic_sensitivity:
            description: "External (on-device) mic sensitivity 0-100 (opcode 0x06). Not on MELK-OE/OB/TX."
            template: [0x7E, 0x04, 0x06, "{sensitivity}", 0xFF, 0xFF, 0xFF, 0x00, 0xEF]
            parameters:
              sensitivity: { type: "uint8", min: 0, max: 100 }
          set_mic_on_off:
            description: "External (on-device) mic on/off (opcode 0x07)."
            template: [0x7E, 0x04, 0x07, "{state}", 0xFF, 0xFF, 0xFF, 0x00, 0xEF]
            parameters:
              state: { type: "uint8", values: { "0": "off", "1": "on" } }
          set_mic_eq_mode:
            description: >
              External-mic EQ mode (opcode 0x03 with the 0x80 bit set):
              eq_code = eq + 0x80 where eq 0-7 covers the ENERGIC /
              RHYTHM / SPECTRUM / ROLLING families (x2).
            template: [0x7E, 0x07, 0x03, "{eq_code}", 0x04, 0xFF, 0xFF, 0x00, 0xEF]
            parameters:
              eq_code: { type: "uint8", min: 128, max: 135 }
          set_rgb_pin_order:
            description: >
              Reprogram the RGB pin/wire order (opcode 0x81). The three
              bytes are a permutation of 01 02 03 (6 orders); default
              01 02 03 = R,G,B. Use when a strip shows swapped colors.
            template: [0x7E, 0x06, 0x81, "{ch1}", "{ch2}", "{ch3}", 0xFF, 0x00, 0xEF]
            parameters:
              ch1: { type: "uint8", default: 0x01, min: 1, max: 3 }
              ch2: { type: "uint8", default: 0x02, min: 1, max: 3 }
              ch3: { type: "uint8", default: 0x03, min: 1, max: 3 }
          set_pixel_count:
            description: >
              Set the total pixel/segment count ("symphony point count",
              opcode 0x21) as a 16-bit LITTLE-ENDIAN value (lo byte
              first). Range limits unknown — MEDIUM, verify on hardware.
            template: [0x7E, 0x07, 0x21, "{count_lo}", "{count_hi}", 0x00, 0xFF, 0x00, 0xEF]
            parameters:
              count_lo: { type: "uint8", min: 0, max: 255 }
              count_hi: { type: "uint8", min: 0, max: 255 }
          set_system_time:
            description: >
              Set the device clock (opcode 0x83): hour, minute, second,
              weekday bitmask. The apps push this right after connect so
              the scheduler has a valid clock — do the same.
            template: [0x7E, 0x07, 0x83, "{hours}", "{minutes}", "{seconds}", "{weekdays}", 0xFF, 0xEF]
            parameters:
              hours: { type: "uint8", min: 0, max: 23 }
              minutes: { type: "uint8", min: 0, max: 59 }
              seconds: { type: "uint8", min: 0, max: 59 }
              weekdays: { type: "uint8" }
          set_timer:
            description: >
              Set a schedule/alarm (opcode 0x82): mode 0 = on-alarm,
              1 = off-alarm; weekdays byte = day bitmask with bit7 =
              timer ENABLED (add 0x80 when enabling).
            template: [0x7E, 0x08, 0x82, "{hours}", "{minutes}", "{seconds}", "{mode}", "{weekdays}", 0xEF]
            parameters:
              hours: { type: "uint8", min: 0, max: 23 }
              minutes: { type: "uint8", min: 0, max: 59 }
              seconds: { type: "uint8", min: 0, max: 59 }
              mode: { type: "uint8", values: { "0": "on-alarm", "1": "off-alarm" } }
              weekdays: { type: "uint8" }
          query_timer:
            description: >
              Query a timer: write this frame with payload 0xFF, then
              READ characteristic 0xFFF3. The reply validates as
              7E 08 82 H M S mode weekdays EF (bit7 of weekdays = timer
              enabled). mode selects which alarm to query (0/1).
            template: [0x7E, 0x08, 0x82, 0xFF, 0xFF, 0xFF, "{mode}", 0xFF, 0xEF]
            parameters:
              mode: { type: "uint8", values: { "0": "on-alarm", "1": "off-alarm" } }
          set_countdown:
            description: >
              Countdown timer (opcode 0x76, Lotus Lantern builds only —
              MEDIUM). The 3 timestamp bytes are seconds-until x10, low
              byte first, derived from a 2001-01-01 UTC epoch in the
              app's time math; mode selects start/stop. Verify the exact
              epoch math against a live capture before relying on it.
            template: [0x7E, 0x07, 0x76, "{ts_lo}", "{ts_mid}", "{ts_hi}", "{mode}", 0xFF, 0xEF]
            parameters:
              ts_lo: { type: "uint8", min: 0, max: 255 }
              ts_mid: { type: "uint8", min: 0, max: 255 }
              ts_hi: { type: "uint8", min: 0, max: 255 }
              mode: { type: "uint8", min: 0, max: 255 }

