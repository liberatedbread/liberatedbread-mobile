# Govee H6001 BLE Smart Bulb — device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Static analysis of com.govee.home APK (jadx 1.5.1)
# Cross-referenced with chvolkmann/govee_btled RE

device:
  name: "Govee H6001 Smart Bulb"
  manufacturer: "Govee (Shenzhen Intellirocks Tech / iHoment)"
  manufacturer_status: "active"
  protocol: "ble"
  category: "light"
  notes: >
    BLE-only smart bulb from Govee's legacy bulb family (H6001, H6005;
    H6101/H6104 are sibling classes with a different GATT profile).
    Protocol uses 20-byte fixed packets with XOR checksum in final byte.
    Command prefixes: 0x33 (control) and 0xAA (ACK/keep-alive — the app
    sends AA 01 00..00 AB every ~2 s while connected). 0xA3 (extended)
    exists in the wider Govee family but has not been captured on H6001.
    The app's internal namespace "com.ihoment.base2app" reveals Govee's
    corporate identity as iHoment/Shenzhen Intellirocks.
    GATT: service 00010203-0405-0607-0809-0a0b0c0d1910, write char …2b11,
    notify char …2b10 — from on-device HCI-snoop RE of a real H6001
    (chvolkmann/govee_btled bluetooth_led.py), the egold555 H6127.md UUID
    table, and the blog.coding.kiwi GATT dump. In the APK, H6001 routes
    via OldBulbUtil + the generic com.govee.rgblight path (00010203
    scheme); the 0xFFE0/0xFFE1 UUIDs belong to the H6101/H6104 BleComm
    classes, not to H6001.
    CONFIDENCE: HIGH for command format and GATT profile (on-device
    captures, corroborated by multiple independent RE efforts); the
    advertised name pattern is unconfirmed (siblings advertise
    ihoment_<model>_<hex>; Minger-branded H6001s exist).

  identification:
    service_uuids:
      - "00010203-0405-0607-0809-0a0b0c0d1910"
    # Advertised name unconfirmed: no source shows "Govee_H6001". Sibling
    # legacy bulbs advertise ihoment_<model>_<hex> (e.g. ihoment_H6005_664B)
    # and Minger-branded H6001s exist — match loosely.
    local_name_prefix: "ihoment_H6001"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "ihoment_H6001"
          service_uuids:
            - "00010203-0405-0607-0809-0a0b0c0d1910"
          manufacturer_data:
            company_id: 60552
            description: >
              Company ID 0xEC88 (= 60552; magic bytes 88 EC in the
              manufacturer-specific AD structure — the APK broadcast
              parser requires them, BleUtil.java:49). Govee parses a
              'goodsType' value from this structure (2 bytes at offset
              +5/+6, BleUtil.parseBleBroadcastPact); the bulb family is
              goodsType=20. A previous revision listed 63678 (0xF8BE),
              which matches nothing in the APK or any public source.
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No pairing or bonding required. Device advertises on power-up and
      accepts open BLE writes from any connected central.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          No provisioning needed. Power on, scan, connect, write.
        ble:
          pairing_required: false
        steps:
          - action: "Power the bulb and scan for BLE advertisements."
            actor: "client"
          - action: "Connect to the device and write control commands."
            actor: "client"
    factory_reset:
      confidence: "medium"
      effect: "Resets to factory defaults (likely power-cycle sequence)."
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Toggle power rapidly 5 times."
              actor: "user"
              expect: "Bulb blinks to confirm reset and re-advertises."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The bulb is BLE-only and joins no network, so there is nothing to
        rejoin. No bond is held: any central may connect once the previous one
        disconnects.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        BLE-only; no WiFi passphrase crosses the link. The bulb accepts open
        writes from any connected central, so control is available to anyone in
        range.

services:
  - uuid: "00010203-0405-0607-0809-0a0b0c0d1910"
    name: "Govee Legacy Bulb Service"
    notes: >
      On-device GATT profile of the H6001 (HCI-snoop confirmed). The
      0xFFE0/0xFFE1 profile listed in earlier revisions belongs to the
      H6101/H6104 classes in the APK, not to H6001.
    characteristics:
      - uuid: "00010203-0405-0607-0809-0a0b0c0d2b11"
        name: "Control Write"
        properties: ["write", "write_without_response"]
        notes: >
          Primary write characteristic for all control commands.
          Commands are 20-byte fixed-length packets with XOR checksum.
          App sends keep-alive AA 01 00..00 AB every ~2 s while connected.
          Additional color-mode sub-commands (H6127.md, explicitly
          deferred to by H6001.md): music 0x01, scene 0x04, DIY 0x0a;
          mic mode 0x06 in govee_btled's LedMode.
        commands:
          power_on:
            description: "Turn bulb on. Packet: [0x33, 0x01, 0x01, 0x00...0x00, <xor>]"
            encoding: "bytes"
            payload:
              bytes: [0x33, 0x01, 0x01]
          power_off:
            description: "Turn bulb off. Packet: [0x33, 0x01, 0x00, 0x00...0x00, <xor>]"
            encoding: "bytes"
            payload:
              bytes: [0x33, 0x01, 0x00]
          set_brightness:
            description: "Set brightness 0-255 (app maps 1%-100% to ~0x14-0xFE). Packet: [0x33, 0x04, <val>, 0x00*17, <xor>]"
            encoding: "bytes"
            payload:
              bytes: [0x33, 0x04, 0x80]
          set_color:
            description: "Set RGB color (mode byte 0x02 = manual). Packet: [0x33, 0x05, 0x02, <R>, <G>, <B>, 0x00*14, <xor>]"
            encoding: "bytes"
            payload:
              bytes: [0x33, 0x05, 0x02, 0xFF, 0xFF, 0xFF]
          set_color_white:
            description: >
              White / color-temperature control via fixed warm/cold shades
              (not arbitrary Kelvin). Packet: [0x33, 0x05, 0x02, 0xFF, 0xFF,
              0xFF, 0x01, <shade R>, <shade G>, <shade B>, 0x00*10, <xor>] —
              the 0x01 flag selects the warm/cold-white LED set
              (govee_btled set_color_white).
            encoding: "bytes"
            payload:
              bytes: [0x33, 0x05, 0x02, 0xFF, 0xFF, 0xFF, 0x01]
          keep_alive:
            description: "Connection keep-alive, sent every ~2 s (H6127.md). Packet: [0xAA, 0x01, 0x00*17, 0xAB]"
            encoding: "bytes"
            payload:
              bytes: [0xAA, 0x01]

      - uuid: "00010203-0405-0607-0809-0a0b0c0d2b10"
        name: "Control Notify"
        properties: ["read", "notify"]
        notes: >
          Read/notify characteristic paired with …2b11 (ACKs and
          responses).

  - uuid: "0000fd00-0000-1000-8000-00805f9b34fb"
    name: "Govee OTA Service"
    notes: >
      Firmware update service. Not needed for control. Present in the APK
      (OtaManagerV1) and H6001 gained OTA capability in newer firmware,
      but no public H6001 GATT dump confirms 0xfd00 on-device — treat as
      unverified.
    characteristics:
      - uuid: "0000fd01-0000-1000-8000-00805f9b34fb"
        name: "OTA Write"
        properties: ["write"]
      - uuid: "0000fd02-0000-1000-8000-00805f9b34fb"
        name: "OTA Notify"
        properties: ["notify"]

features: []
  # light_control omitted — not in schema feature enum.
  # Standard RGB bulb with dimming. White/CT control exists via fixed
  # warm/cold shades (set_color_white command), not arbitrary Kelvin.

entities:
  - platform: "light"
    name: "Bulb"
    features: ["brightness", "color"]
    commands:
      power_on: "power_on"
      power_off: "power_off"
      set_brightness: "set_brightness"
      set_color: "set_color"

references:
  - "https://github.com/chvolkmann/govee_btled"
  - "https://github.com/egold555/Govee-Reverse-Engineering"
  - "https://blog.coding.kiwi/reverse-engineering-govee-smart-lights/"
