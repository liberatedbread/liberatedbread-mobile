device:
  name: "Dyson Air Purifier"
  manufacturer: "Dyson"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "wifi"
  category: "climate"
  transport: "mqtt"
  notes: >
    Dyson connected purifiers advertise a local MQTT broker on port 1883 via
    mDNS. The device is the broker. Local credentials are derived from the
    device serial and WiFi password during/after pairing. Known topics are
    scoped by product type and serial — {productType}/{serial}/status/current
    and {productType}/{serial}/command — and local control does not require
    internet access after pairing. The vendor app bundles 39 purifier
    product-type configs (including letter-suffixed roots such as 438e and
    438k) that all subscribe to the same status topics at QoS 1, so a
    {productType} root may carry a letter suffix.

    Note (2026-07): the original shenxn/libdyson and ha-dyson projects are
    stale; the maintained continuation is libdyson-wg/libdyson-neon (PyPI
    libdyson-neon), and Home Assistant core removed its built-in Dyson
    integration in 2024.1.
  identification:
    mdns_service_type: "_dyson_mqtt._tcp.local."
    default_port: 1883
    identity_keys:
      primary: "serial"
      display: "name"

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_dyson_mqtt._tcp.local."
          port: 1883
          identity_mapping:
            stable_keys:
              # serial is parsed from the mDNS instance name
              # <productType>_<serial>._dyson_mqtt._tcp.local., not from the hostname
              - source: "instance_name"
                key: "serial"
            display:
              source: "name"
    identity:
      stable_keys: ["serial"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      Dyson machines are one of the few devices here whose local credentials
      are printed on the hardware rather than issued by a server. That makes
      them fully recoverable without the vendor cloud — but it also means the
      sticker (and the spare label in the box) is the only copy of the secret.
      Photograph it before mounting the machine somewhere awkward.
    methods:
      - type: "softap_mqtt"
        verified: false
        description: >
          The machine hosts its own WPA-protected access point whose SSID and
          passphrase are printed on the device sticker. The app joins that AP
          and provisions over MQTT, not HTTP: while on the setup AP it connects
          to the machine's OWN local MQTT broker on port 1883 and hands over the
          home network credentials as MQTT messages on the machine's
          initial-connection topic. This is a broker ON the setup AP, not a
          cloud round-trip — while joined to the credential-less DYSON- AP the
          client has no path off-device. For air purifiers (Dyson's "EC" /
          environmental-control machine category) the app addresses that broker
          by the hostname devices.dyson.net, which the machine — the AP's
          gateway and captive DNS server — resolves to itself locally; the app
          builds it as a "BrokerDetailsLocal" and its connection-journey logs
          call it the "machine AP broker" / "local machine broker" (evidence:
          connectivity code j00/t0.java, the MachineCategory.EC branch). Other
          Dyson categories (e.g. robots) instead point at the literal AP gateway
          192.168.60.1:1883; the exact address the purifier's captive DNS
          returns for devices.dyson.net was not captured, so gateway_ip is left
          unset rather than guessed. No HTTP provisioning path exists in the
          current vendor app's connection-journey code.
        softap:
          ssid_prefix: "DYSON-"
          ssid_examples: ["DYSON-XX-XXXXXXXX-475"]
          open_network: false
          passphrase_source: "Printed on the device sticker and on the spare label supplied in the box."
          port: 1883
        steps:
          - action: "Read the product SSID and WiFi password from the sticker on the machine."
            actor: "user"
            notes: "The setup SSID has the form DYSON-<serial segments>-<productType>; the app parses both the serial and the product type out of the SSID itself."
          - action: "Join the machine's access point."
            actor: "user"
          - action: "Connect to the machine's local MQTT broker on the setup AP at port 1883 (EC/purifier machines address it as devices.dyson.net, resolved locally by the machine's own captive DNS; other Dyson categories use the AP gateway 192.168.60.1) and subscribe to {productType}/initialconnection/status at QoS 1."
            actor: "client"
            request:
              protocol: "mqtt"
              action: "subscribe {productType}/initialconnection/status"
          - action: "Publish a JOIN-NETWORK message carrying the home network credentials to {productType}/initialconnection/command."
            actor: "client"
            request:
              protocol: "mqtt"
              action: "JOIN-NETWORK"
              arguments:
                - name: "ssid"
                  required: true
                  description: "Home network SSID."
                - name: "password"
                  required: true
                  description: "Home network passphrase."
                - name: "requestId"
                  description: "Client-generated request identifier."
          - action: "Publish CLOSE-ACCESS-POINT, then AUTHORISE-USER-REQUEST, to {productType}/initialconnection/command."
            actor: "client"
            request:
              protocol: "mqtt"
              action: "CLOSE-ACCESS-POINT / AUTHORISE-USER-REQUEST"
            notes: "AUTHORISE-USER-REQUEST carries the app user id. Message order and topic are app-derived; not yet replayed against hardware."
          - action: "Rejoin the home network and confirm the machine advertises _dyson_mqtt._tcp.local."
            actor: "client"
            timeout_seconds: 120
    factory_reset:
      confidence: "low"
      effect: "Clears the stored WiFi credentials and returns the machine to hosting its setup AP. The sticker credentials are hardware identity and do not change."
      procedures:
        - name: "Standby button held"
          hold_seconds: 20
          indicator: "The display flashes to confirm the WiFi reset."
          steps:
            - action: "With the machine powered on, press and hold the standby button on the unit (not the remote) until the display flashes."
              actor: "user"
              notes: "Hold time varies by model; verify against the model's manual."
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: >
        Re-provisioning goes back through the setup AP, so a router change
        means resetting the machine's WiFi and repeating onboarding. The local
        MQTT credentials are unaffected because they are derived from the
        sticker, not from the network.
    credentials:
      wifi_passphrase_protection: "unknown"
      stored_on_device:
        - "Home network credentials"
      issued_to_client:
        - "Local MQTT username — the device serial number"
        - "Local MQTT password — base64 of the SHA-512 digest of the sticker WiFi password"
      confidence: "medium"
      confidence_notes: >
        App-derived, not exercised on hardware: the hash function was read
        from the current vendor app (SHA-512 over the UTF-8 sticker password,
        base64 of the raw digest, whitespace stripped) and matches the
        long-published libdyson behaviour, but this project has not replayed
        the login against a machine.
      notes: >
        Because the local password is derived from a printed static secret,
        anyone who photographs the sticker keeps local control forever —
        including after a resale.

  variants:
    - model: "F3H"
      name: "Dyson Pure Cool"
      identification:
        mdns_instance_pattern: "<productType>_F3H-*._dyson_mqtt._tcp.local."
      characteristics:
        - "Air purifier and fan with local MQTT broker."
    - model: "PE6"
      name: "Dyson Pure Hot+Cool Link"
      identification:
        mdns_instance_pattern: "<productType>_PE6-*._dyson_mqtt._tcp.local."
      characteristics:
        - "Air purifier, heater, and fan with local MQTT broker (product type 455)."
        - "PREFIX CONFLICT: a 2018 capture shows PE6 with product type 455 (Pure Hot+Cool Link), while this project's own live probe below saw a PE6 unit as a Humidify+Cool. The prefix may be reused across product lines — identify by the MQTT product type, not the serial prefix alone."

evidence:
  live_lan_probe:
    date: "2026-07-16"
    devices:
      - model: "F3H Pure Cool"
        serial: "F3H-US-PFA5664A"
        address: "10.69.194.164"
        mdns_service_type: "_dyson_mqtt._tcp"
        port: 1883
      - model: "PE6 Humidify+Cool"
        serial: "PE6-US-KDA2129A"
        address: "10.69.194.165"
        mdns_service_type: "_dyson_mqtt._tcp"
        port: 1883

mqtt_topics:
  - topic: "{productType}/{serial}/status/current"
    name: "Current Status"
    direction: "subscribe"
    description: "State reports including fan mode, oscillation, air quality, filter state, temperature, humidity, and device mode. Example: 438/F3H-US-PFA5664A/status/current."
    qos: 1
    confidence: "medium"
    confidence_notes: >
      The topic itself is long-established and matches this project's
      live-probed machines; the QoS 1 subscription is app-derived (the
      vendor app's bundled per-product-type configs), not observed on the
      wire.
    payload_format:
      encoding: "json"
  - topic: "{productType}/{serial}/status/connection"
    name: "Connection Status"
    direction: "subscribe"
    description: "Connection announcements: the machine publishes a HELLO message (protocol version, serial number, firmware and hardware versions, reset source) here when it connects. The app subscribes at QoS 1 in all 39 bundled purifier product-type configs."
    qos: 1
    confidence: "medium"
    confidence_notes: >
      App-derived (vendor app subscription lists and its HELLO message
      model), not yet captured from hardware. Older revisions of this spec
      carried this topic without the {productType}/ prefix and marked it
      unverified; the prefixed form is what the app subscribes to.
    payload_format:
      encoding: "json"
  - topic: "{productType}/{serial}/status/software"
    name: "Software Update Status"
    direction: "subscribe"
    description: "Firmware update progress: the machine publishes an UPGRADING-SOFTWARE message (state, code) here during an update. Subscribed at QoS 1 in the app's bundled purifier configs."
    qos: 1
    confidence: "medium"
    confidence_notes: "App-derived (bundled configs and the vendor app's message model), not captured from hardware."
    payload_format:
      encoding: "json"
  - topic: "{productType}/{serial}/status/faults"
    name: "Faults"
    direction: "subscribe"
    description: "Machine fault reports. Subscribed at QoS 1 in the app's bundled purifier configs, which also ship per-product-type fault catalogues."
    qos: 1
    confidence: "medium"
    confidence_notes: "App-derived (bundled configs), not captured from hardware."
    payload_format:
      encoding: "json"
  - topic: "{productType}/{serial}/command"
    name: "Command"
    direction: "publish"
    description: "Command topic for mode, power, fan speed, oscillation, auto mode, and humidifier controls. Messages are a JSON envelope {msg, time, mode-reason, ...}: state changes use msg STATE-SET with a data map of state keys to new values; REQUEST-CURRENT-STATE asks the machine to republish its status."
    qos: 0
    confidence: "medium"
    confidence_notes: >
      The STATE-SET envelope is app-derived (vendor app message models),
      not captured from hardware; the publish QoS is unconfirmed.
    payload_format:
      encoding: "json"

entities:
  - platform: "fan"
    name: "Purifier Fan"
    state_topic: "{productType}/{serial}/status/current"
    commands:
      turn_on: "{productType}/{serial}/command"
      turn_off: "{productType}/{serial}/command"
      set_percentage: "{productType}/{serial}/command"
      set_oscillating: "{productType}/{serial}/command"
  - platform: "sensor"
    name: "Air Quality"
    state_topic: "{productType}/{serial}/status/current"
  - platform: "sensor"
    name: "Filter Life"
    state_topic: "{productType}/{serial}/status/current"

