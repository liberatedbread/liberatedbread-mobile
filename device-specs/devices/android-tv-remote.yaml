# Android TV / Google TV — Android TV Remote Protocol v2 — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Covers every device running Google's Android TV Remote Service (Nvidia
# Shield, Chromecast with Google TV, onn, TCL/Sony/Hisense Android and Google
# TV models): protobuf messages over TLS on TCP 6466, with a one-time pairing
# exchange on TCP 6467. Amazon Fire TV is documented as a variant: it ships no
# Android TV Remote Service, and the local control path there is ADB over TCP
# 5555.
#
# TRANSPORT GAP: the consuming app's only transports today are HTTP (GET/POST,
# empty body) and SOAP. Neither can speak length-prefixed protobuf over a
# mutually-authenticated TLS session, and neither can open an ADB connection.
# This file therefore records the real wire protocol in the
# `androidtv_remote_v2` and `fire_tv_adb` extension blocks and the commands
# below deliberately carry NO transport/method/path: nothing here would work
# if rendered as an HTTP request, and a fake request that cannot work is worse
# than an honest gap. The placeholder `http_endpoints` entry exists only to
# satisfy the schema's one-access-surface rule, exactly as
# lutron-caseta-smart-bridge.yaml does for LEAP.

device:
  name: "Android TV / Google TV (Android TV Remote Protocol v2)"
  manufacturer: "Google (platform); Nvidia, Sony, TCL, Hisense, onn and others (devices)"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "wifi"
  category: "tv"
  transport: "tls-protobuf"
  notes: >
    The same protocol the Google TV mobile app speaks, served by the Android
    TV Remote Service system app preinstalled on Android TV OS devices. Two
    TLS ports: 6467 for one-time pairing (Polo pairing protocol, pairing code
    shown on the TV screen), 6466 for the remote session itself (key injects,
    app-link launches, IME text, voice, pushed power/volume/current-app
    state). Discovery is mDNS _androidtvremote2._tcp.local. No authentication
    token or account is involved after pairing: the client certificate
    presented at pairing time is the credential.
    Amazon Fire TV is the notable exception to the whole file: it ships no
    Android TV Remote Service, sideloading it does not work (per the Home
    Assistant integration docs), and the local control path is ADB on TCP
    5555, enabled by the user in Developer Options and gated by an on-screen
    "Allow USB debugging?" approval.
  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://android.googlesource.com/platform/external/google-tv-pairing-protocol/"
    license: "Apache-2.0"
    upstream_docs:
      - url: "https://android.googlesource.com/platform/external/google-tv-pairing-protocol/"
        title: "AOSP — google-tv-pairing-protocol (Polo)"
        covers: >
          The port-6467 pairing half only: polo.proto's OuterMessage,
          PairingRequest/Ack, Options, Configuration/Ack, Secret/Ack and the
          certificate-bound secret derivation. Google publishes this half; the
          RemoteMessage vocabulary on 6466 has no upstream.
      - url: "https://developer.android.com/reference/android/view/KeyEvent"
        title: "Android Developers — KeyEvent"
        covers: >
          The KEYCODE_* constants RemoteKeyCode mirrors; the authority for
          what each injected key means.
    notes: >
      The pairing half is Google's own open-source Polo implementation, so
      that half is citation, not reconstruction. The session half
      (remotemessage.proto) was recovered by the community — louis49's Node
      implementation first, tronikos' androidtvremote2 (the Home Assistant
      backend) second — by watching the Google TV app; treat field names
      marked 'unknown' in that proto as exactly that.

  identification:
    mdns_service_type: "_androidtvremote2._tcp.local."
    default_port: 6466
    identity_keys:
      primary: "hostname"
      secondary: "model"
      display: "name"

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_androidtvremote2._tcp.local."
          port: 6466
          identity_mapping:
            stable_keys:
              - source: "hostname"
                key: "hostname"
            display:
              source: "name"
    identity:
      stable_keys: ["hostname"]
      display: "name"
    static_ip_required: false
    # The mDNS instance name is the TV's user-facing name ("Living room TV");
    # Home Assistant derives it by stripping the service-type suffix. The
    # SRV hostname is the Android mDNS name (typically Android-<hex>.local),
    # stable until factory reset. Model and vendor are NOT in the
    # advertisement: they arrive inside the session, in the server's
    # RemoteConfigure device_info, so pre-connection identity is the
    # hostname and nothing more.
    # Fire TV variant: no mDNS/SSDP discovery exists for ADB. Finding one is
    # a TCP 5555 port probe or a user-supplied IP; see fire_tv_adb.

  setup:
    required: true
    confidence: "medium"
    notes: >
      Two distinct steps, both on the device itself: joining the network
      (on-screen first-run, nothing to reimplement) and PAIRING each client,
      which is where a client has real work to do. Pairing runs once per
      client on port 6467 (androidtv_remote_v2.pairing has the byte-level
      flow): the client connects over TLS presenting a self-signed RSA
      certificate it generated, sends a PairingRequest, the TV shows a
      6-character hexadecimal code, the user types it into the client, and
      the client proves it saw the code by returning a secret that binds the
      code to both certificates' public keys. Afterwards the client connects
      on 6466 with the same certificate; the TV trusts it because it paired,
      not because any CA signed anything. If pairing loops or errors,
      force-stop Android TV Remote Service and clear its storage (Settings >
      Apps > Show system apps > Android TV Remote Service > Storage > Clear
      storage), which revokes every paired client.
    methods:
      - type: "device_ui"
        verified: false
        description: >
          On-screen first-run: language, WiFi network and passphrase (or
          Ethernet), Google account sign-in. Performed with the bundled IR/
          BLE remote; there is no provisioning protocol for a client to
          reimplement.
        steps:
          - action: "Power on and complete the on-screen setup with the bundled remote, joining the LAN."
            actor: "user"
            expect: "TV on the network; _androidtvremote2._tcp.local. visible to mDNS."
          - action: "Connect TLS to port 6467 presenting the client's self-signed RSA certificate, and send PairingRequest (service_name 'atvremote', client_name shown on TV)."
            actor: "client"
            expect: "PairingRequestAck, then the TV displays a 6-character hex code."
          - action: "Read the code off the TV screen and type it into the client."
            actor: "user"
          - action: "Complete Options/Configuration, then send the Secret derived from both certificates and the code (androidtv_remote_v2.pairing.secret)."
            actor: "client"
            expect: "SecretAck; the client certificate is now trusted for sessions on 6466."
    factory_reset:
      confidence: "low"
      effect: "Clears accounts, installed apps, settings and every paired client certificate; the device returns to first-run setup."
      procedures:
        - name: "Menu factory reset"
          steps:
            - action: "Google TV: Settings > System > About > Reset > Factory data reset. Android TV: Settings > Device Preferences > Reset. Exact menu spelling varies by manufacturer and OS version."
              actor: "user"
              notes: "From generic Android TV documentation, not replayed against hardware; some brands also offer a physical reset pinhole."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Re-joining WiFi is a Settings > Network operation on the TV; paired
        client certificates survive. A client whose TV changed address
        rediscovers by mDNS, not by remembered IP.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "WiFi credentials"
        - "Paired client certificates (Android TV Remote Service storage)"
      issued_to_client: []
      notes: >
        Nothing is issued: the client generates its own RSA-2048 self-signed
        certificate (androidtvremote2 uses CN 'atvremote', 10-year validity)
        and pairing registers THAT certificate with the TV. Revocation is
        clearing the Remote Service's storage on the TV. Fire TV/ADB instead
        stores authorized client RSA public keys under adbd, approved via the
        on-screen dialog (fire_tv_adb.authentication).

  variants:
    - model: "Shield TV (2019)"
      name: "Nvidia Shield TV / Shield TV Pro"
      identification:
        vendor: "NVIDIA"
      characteristics:
        - "Reference device for most community clients; voice input works, with the quirk that RemoteVoicePayload chunks smaller than 8 KB are rejected (androidtvremote2 pads to 8 KB)."
        - "If KEYCODE_POWER cannot wake it, disable Settings > Remotes & accessories > Simplified wake buttons (Home Assistant integration notes)."
    - model: "Chromecast with Google TV"
      name: "Chromecast with Google TV (HD / 4K)"
      identification:
        vendor: "Google"
      characteristics:
        - "Ships Android TV Remote Service; full v2 protocol surface."
    - model: "onn Google TV"
      name: "onn Google TV 4K streaming box (Walmart)"
      characteristics:
        - "Budget Google TV device; same Remote Service protocol."
    - model: "TCL / Sony / Hisense Google TV and Android TV sets"
      name: "Android TV OS televisions"
      characteristics:
        - "Same protocol on the TV class of device; TV-class keycodes (TV_POWER, TV_INPUT_*, CHANNEL_*) are meaningful here."
        - "Some TCL sets leave the network in standby unless Settings > System > Power and energy > Screenless service is enabled (Home Assistant integration notes); some Xiaomi boxes drop off entirely and cannot be woken over the network."
    - model: "Fire TV (Stick / Cube / Omni / Insignia)"
      name: "Amazon Fire TV family (Fire OS)"
      identification:
        vendor: "Amazon"
      characteristics:
        - "NO Android TV Remote Service: ports 6466/6467 stay closed and sideloading the service does not work (Home Assistant androidtv_remote docs)."
        - "Local control is ADB over TCP 5555 after the user enables Settings > My Fire TV > Developer Options > ADB Debugging; see fire_tv_adb."
        - "On Fire TV Edition sets (Insignia/Toshiba) Developer Options may not appear until an Amazon account is signed in (Home Assistant androidtv docs)."

