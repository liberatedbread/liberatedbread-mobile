evidence:
  research:
    date: "2026-08-11"
    method: >
      Documentation and client-source review only; nothing here was replayed
      against live hardware. The byte-level session description comes from
      the Aymkdn wiki (first public write-up), cross-checked against the
      androidtvremote2 source actually running in Home Assistant
      (base.py framing, pairing.py secret derivation, remote.py session
      handling) and the recovered remotemessage.proto; the pairing message
      set is Google's own AOSP Polo source. Fire TV details are Amazon's
      developer documentation plus the androidtv/adb_shell lineage.
    sources:
      - "https://android.googlesource.com/platform/external/google-tv-pairing-protocol/"
      - "https://github.com/Aymkdn/assistant-freebox-cloud/wiki/Google-TV-(aka-Android-TV)-Remote-Control-(v2)"
