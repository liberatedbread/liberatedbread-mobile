# BLE Pulse Oximeter (SP001 / "F7") — Device Spec
# Generated from static analysis of com.wakeup.smartspo (Wearfit BO)
# APK source: apkeep (Google Play mirror)
# APK SHA-256: 82853e9c52db3eb2c8c7808af87bf3067f2e29d3948df034e9535ee75f2abc64
# (37,834,803-byte bare APK)

device:
  name: 'BLE Fingertip Pulse Oximeter (SP001 / "F7")'
  manufacturer: "Manridy (likely ODM)"
  manufacturer_status: "abandoned"
  testing:
    status: untested
  protocol: "ble"
  category: "health"
  notes: >
    Uses standard Nordic UART service. Interaction is POLL-based, not
    subscribe-and-stream: each measurement notification requires a poll write
    AB 00 03 FF 30 80 to UART RX, answered by a single notification on UART TX.
    The measurement payload is 3 bytes at frame offset 6 — [PR bpm, SpO2 %,
    PI x10] — so frames are ~9 bytes, not 20 (the app never requests an MTU
    above the 23-byte ATT default).
    Data parsing via chignon package (BroadcastCommand, BroadcastData, DataPacket).

    Expected measurements: SpO2%, pulse rate (BPM), perfusion index (%).

    Discovery/identification (hardware-observed by OximeterF7Bridge): the
    device advertises BLE name "F7" and advertised service UUID
    6e40f431-b5a3-f393-e0a9-e50e24dcca9e — distinct from the Nordic UART
    service 6e400001 it exposes after connection. Connection quirks: the
    device advertises only at power-up, accepts a single connection attempt,
    and will not reconnect after going out of range without a power cycle.
    Companion apps: "Sapiential SpO2" (Android; display name of
    com.wakeup.smartspo), "Wearfit BO" (iOS).

    OTA/DFU surface (app-derived, not hardware-verified): the app checked a
    vendor firmware API (now dead, verified 2026-07-30) and flashed via
    Nordic DFU (service/DfuService.java), with OTA command characteristic
    0000ff03-0000-1000-8000-00805f9b34fb and ISP command characteristic
    6e40ff03-b5a3-f393-e0a9-e50e24dcca9e referenced in BluetoothLeService.
    A Dallas/Maxim CRC8 (dscrc_table) exists in utils/CRC8.java, most likely
    used for DFU/packet integrity; no public firmware images could be
    obtained.

    Research status: APK acquired, decompiled. Nordic UART service UUIDs
    recovered. Poll/response frame format confirmed by the hardware-tested
    OximeterF7Bridge (github.com/joba-1/OximeterF7Bridge) and the APK's
    CommandManager — a replacement client can be implemented without further
    hardware capture.
    Reference: github.com/jcomas/PulseOximeterSP001 (existing partial implementation).

    Support ecosystem effectively abandoned: the SP001 product page is dead,
    the Wearfit BO app returns 404 on Google Play, and the vendor firmware
    update API no longer responds (all verified 2026-07-30). Generic F7/SP001
    clones remain on sale.

  identification:
    local_name_prefix: "F7"
    service_uuids:
      - "6e40f431-b5a3-f393-e0a9-e50e24dcca9e"

  setup:
    required: false
    confidence: medium
    notes: >
      There is nothing to provision. The oximeter exposes a Nordic UART service
      and answers measurement polls from whichever client connects; it holds no
      account, no network credential and no pairing state. Setup is
      "clip it on and connect".

      Confidence is medium rather than high because this has not been run
      against hardware here — the UUIDs come from a decompiled APK and the
      poll/response frame format from a third-party hardware-tested bridge
      (OximeterF7Bridge).
    methods:
      - type: ble_direct
        description: >
          Connect over GATT and subscribe to notifications on the Nordic UART TX
          characteristic. No pairing, bonding or app account is involved.
        verified: false
        ble:
          pairing_required: false
        steps:
          - action: "Clip the oximeter onto a finger; it powers on and begins advertising."
            actor: user
          - action: 'Scan for the device (BLE name "F7") and connect over GATT. Note: it advertises only at power-up and accepts one connection attempt — after a failed connect or an out-of-range drop, power-cycle it before retrying.'
            actor: client
          - action: "Subscribe to notifications on the UART TX characteristic."
            actor: client
          - action: "Poll a measurement by writing AB 00 03 FF 30 80 to the UART RX characteristic (repeat per reading, e.g. every 1 s)."
            actor: client
            expect: "One ~9-byte notification arrives on TX per poll; the 3-byte payload at frame offset 6 is [PR bpm, SpO2 %, PI x10]."
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established on the F7 itself. The app's CommandManager does
        contain a resetBand command (opcode 0xFF, frame AB 00 03 FF FF 80),
        but it belongs to the shared Wearfit band-family command set and its
        effect on the oximeter is unverified; the device stores no credential
        or binding that a reset would clear, so a reset may not exist at all.
        Power-cycling by removing the batteries is the only state change
        observed, and whether it clears anything is untested.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Not applicable in the usual sense — the device joins no network. Any
        client may connect once the previous one disconnects.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        No credential of any kind crosses the link. The connection is
        unauthenticated and unencrypted, so anyone in range can read
        measurements — a privacy consideration for a medical reading.

services:
  - uuid: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
    name: "Nordic UART Service"
    notes: "Nordic UART service (standard async serial bridge)."
    characteristics:
      - uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
        name: "UART RX"
        notes: >
          RX characteristic (write commands to device). Host-to-device command
          frames are AB 00 <len> FF <cmd> 80 <args...>; recovered commands
          (CommandManager.java): 0x20 = get version, 0x30 = measurement poll,
          0x93 = time sync, 0x25/0x28 = enter bootloader / bootloader MAC,
          0x99 = music control (byte at offset 6: 0=play/pause, 1=prev,
          2=next), 0x7E = weather update (3 arg bytes), 0x86 = body-temp
          measure, 0x87 = switch speed, 0x7D = alarm start (arg 1) / stop
          (arg 0), 0xB1 = motor/vibration text, 0xFF = reset band. Commands
          beyond 0x30 belong to the shared Wearfit band-family set and are
          app-derived, not verified against F7 hardware.
        properties: ["write", "write_without_response"]
        commands:
          poll_measurement:
            description: >
              Poll one measurement. The device answers with a single ~9-byte
              notification on UART TX whose 3-byte payload at frame offset 6 is
              [PR bpm, SpO2 %, PI x10]. Hardware-tested via OximeterF7Bridge;
              identical bytes in the APK's CommandManager.getData().
            value: [0xAB, 0x00, 0x03, 0xFF, 0x30, 0x80]
      - uuid: "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
        name: "UART TX"
        notes: >
          TX characteristic (notifications from device). One notification per
          poll — the device does not stream on subscribe. Measurement payload
          is 3 bytes at frame offset 6: [PR bpm, SpO2 %, PI x10]; frames are
          ~9 bytes. Notification chunks start with 0xAB (or 0x04), command ID
          at byte 4; multi-chunk payloads carry a packet counter and are
          reassembled in-app. Stored-history packets start with 0x51 ('Q'),
          type byte at offset 1: 0x08 = steps/calories/sleep, 0x11 = heart
          rate (value @7), 0x12 = blood oxygen (value @7), 0x14 = blood
          pressure (high @7, low @8).
        properties: ["notify"]

  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "Smart Bracelet Service"
    notes: >
      Referenced-but-probably-absent. fff0/fff4 appear in the APK only in a
      static UUID-to-name table (model/ble/GattAttributes.java, copied from
      Google's BluetoothLeGatt sample); no code path ever reads or writes
      fff4, and the hardware-tested OximeterF7Bridge found only the Nordic
      UART service on a real device.
    characteristics:
      - uuid: "0000fff4-0000-1000-8000-00805f9b34fb"
        name: "Smart Bracelet Measurement"
        properties: ["write", "notify"]

helpful_urls:
  - title: "OximeterF7Bridge"
    url: "https://github.com/joba-1/OximeterF7Bridge"
    description: >-
      Hardware-tested third-party client for the F7 oximeter. Source of this spec's discovery facts
      (advertised name, advertised service UUID, the single-connection and power-cycle quirks) and
      the confirmation of the poll/response frame format against real hardware.
  - title: "PulseOximeterSP001"
    url: "https://github.com/jcomas/PulseOximeterSP001"
    description: >-
      Existing partial implementation for the SP001; a second opinion on the frame layout.
  - title: "Manridy SP001 product page (Internet Archive)"
    url: "https://web.archive.org/web/20220528040458/http://www.manridy.com/en/product-19070-18734-169757.html"
    description: >-
      Archived vendor product page. The live page is dead, so this is what remains of the
      manufacturer's own description of the hardware.
