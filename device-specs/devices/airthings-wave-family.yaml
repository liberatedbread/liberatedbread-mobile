# Airthings Wave Family — Device Spec
# Derived from static analysis of com.airthings.airthings APK
# APK source: apkeep (APKPure mirror) → xapk → extracted APK
# APK SHA-256: 3ab7010d8c9808fee82650b29a8d836012de3a2b0c0f3c78b0c1c23d87de8bc8
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Airthings Wave Family"
  manufacturer: "Airthings ASA"
  manufacturer_status: "active"
  protocol: "ble"
  category: "sensor"
  notes: >
    Family of BLE air quality monitors: Wave (radon), Wave Plus (radon + CO₂ +
    VOC + pressure), Wave Mini (temp/humidity/mold risk), Wave Gen 2, View Plus
    (particulate + display), and Hub (gateway). All devices share a common
    GATT profile architecture (AtGattProfile) with per-model service UUIDs,
    manufacturer ID 820 (0x0334) in advertisement data, and a standardized
    ASR/ASRACP protocol for reading sensor data and controlling the device.

    DISCOVERY: Scan for service UUIDs in advertisement. Manufacturer data
    (company ID 820) carries 4-byte serial number followed by 2-byte flags.
    Device type identified by which service UUID is present in scan response.

    COMMUNICATION: Connect to the air sensor service UUID. Sensor data read
    via two paths:
    1. Standard BLE GATT characteristics (temperature 2A6E, humidity 2A6F,
       pressure 2A6D, dew point 2A7B) — read directly or via notify.
    2. ASR (Air Sensor Read) characteristic — notifications carry packed
       multi-sensor data records. ASRACP (Access Control Point) used to
       request historical data dumps, configure device settings, set time, etc.

    CONFIDENCE: Service/characteristic UUIDs are HIGH — sourced directly
    from decompiled Java/Kotlin code with explicit per-model UUID tables.
    ASRACP opcode protocol is HIGH — full opcode/format tables extracted.
    Sensor data parsing confidence is MEDIUM — format codes and offsets are
    known but actual byte packing needs HCI snoop verification.
    Security is MEDIUM — ATCommandSetFrame suggests optional PIN/challenge
    auth but flow not fully decoded.

  identification:
    manufacturer_data:
      company_id: 820
      description: "Airthings BTSIG manufacturer ID 0x0334. Manufacturer data contains 4-byte serial number at offset 0 and 2-byte flags at offset 4."
      format:
        - offset: 0
          length: 4
          name: "serial_number"
          type: "uint32"
          description: "Device serial number (little-endian — all three official Airthings readers decode LE, e.g. wave-reader struct '<HLH')"
        - offset: 4
          length: 2
          name: "flags"
          type: "uint16"
          description: >
            Bitfield: bit 0 = error, bit 1 = RTC not set, bit 2 = wait,
            bit 3 = wave disabled, bit 5 = ring spinning blue,
            bit 6 = waved in last 5 min, bit 7 = pairing mode,
            bit 8 = new 5-min data, bit 9 = new 60-min data,
            bits 10-11 = ring color (0=auto, 1=white, 2=green, 3=yellow, 4=red),
            bit 15 = POST failed.
    service_uuids:
      - "b42e1f6e-ade7-11e4-89d3-123b93f75cba"
      - "b42e4a8e-ade7-11e4-89d3-123b93f75cba"
      - "b42e1c08-ade7-11e4-89d3-123b93f75cba"
      - "b42e3882-ade7-11e4-89d3-123b93f75cba"
      - "b42e90a2-ade7-11e4-89d3-123b93f75cba"
      - "b42e77de-ade7-11e4-89d3-123b93f75cba"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "b42e1f6e-ade7-11e4-89d3-123b93f75cba"
            - "b42e4a8e-ade7-11e4-89d3-123b93f75cba"
            - "b42e1c08-ade7-11e4-89d3-123b93f75cba"
            - "b42e3882-ade7-11e4-89d3-123b93f75cba"
            - "b42e90a2-ade7-11e4-89d3-123b93f75cba"
            - "b42e77de-ade7-11e4-89d3-123b93f75cba"
          manufacturer_data:
            company_id: 820
            description: "Serial number and status flags in manufacturer data."
    identity:
      stable_keys: ["address", "manufacturer_data.serial_number"]
      display: "manufacturer_data.serial_number"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      No provisioning required. BLE connection only. Device scan filters
      per-model service UUID. No pairing or PIN required for basic sensor
      reads. Optional password/PIN may be used for ASRACP write commands
      (ATCommandSetFrame parsing suggests challenge-response auth path).
    methods:
      - type: "ble_direct"
        # Not run against hardware here: the service map and ASR/ASRACP flow are
        # recovered from the app, which is why the block claims medium and not
        # high confidence.
        verified: false
        description: >
          Scan for Airthings service UUIDs (manufacturer ID 820), connect,
          read standard BLE characteristics for live readings, or use
          ASR/ASRACP for historical data and configuration.
        ble:
          pairing_required: false
        steps:
          - action: "Scan for Airthings devices via manufacturer ID 820 in advertisement data."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Identify device type by service UUID in scan response."
            actor: "client"
          - action: "Connect and read sensor data via standard BLE characteristics or ASR notifications."
            actor: "client"
    factory_reset:
      # The procedure that used to sit here was a guess ("hold the button for
      # 10+ seconds") under a heading that admitted as much. A guess formatted
      # as a procedure reads like a verified one, so it is stated as unknown
      # instead.
      applicable: "unknown"
      confidence: "low"
      effect: >
        Not established. A reset would clear the device's logged sensor history
        and any ASRACP password, but neither the trigger nor its effect was
        recovered from the app, and the family spans six models whose buttons
        differ. Requires hardware testing.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "Unpair from OS Bluetooth settings if bonded, then reconnect."
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: "BLE-only for sensor access. Hub variant adds WiFi but config is done via BLE."

variants:
  - model: "Wave (Gen 1)"
    identification:
      service_uuids:
        - "b42e1f6e-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Radon-only monitor. Sensors: radon 24h avg, radon long-term avg,
      temperature, humidity. Device type code: dTWave=1 in legacy code.
      Sensor indices: 0=radon24h, 2=longTerm, 3=temp, 4=humidity, 5=status.
    sensors: ["radon", "temperature", "humidity"]

  - model: "Wave (Gen 2)"
    identification:
      service_uuids:
        - "b42e4a8e-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Updated Wave with Gen 2 hardware. Different service UUID and
      ASR/ASRACP characteristic UUIDs. Same sensor suite as Gen 1.
      ASR: b42e538a, ASRACP: b42e50d8, Combined: b42e4dcc.
    sensors: ["radon", "temperature", "humidity"]

  - model: "Wave Plus"
    identification:
      service_uuids:
        - "b42e1c08-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Radon + CO₂ + VOC + temperature + humidity + pressure.
      Device type code: dTWavePlus=2 in legacy code.
      ASR: b42e2fc2, ASRACP: b42e2d06, Combined: b42e2a68.
      Includes dew point characteristic (2A7B) and pressure (2A6D).
    sensors: ["radon", "co2", "voc", "temperature", "humidity", "pressure"]

  - model: "Wave Mini"
    identification:
      service_uuids:
        - "b42e3882-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Compact temp/humidity/mold risk monitor. No radon.
      Smallest form factor. Same common GATT profile with ASR/ASRACP.
      The BLE packet on the combined data characteristic (b42e3b98, struct
      "<2B5HLL") also carries pressure and VOC, beyond the temp/humidity the
      marketing description suggests.
    sensors: ["temperature", "humidity", "pressure", "voc"]

  - model: "Wave Mist"
    notes: >
      Humidifier variant. Referenced in Instrument.Type enum
      (WAVE_MIST_GEN_1) but no separate GATT profile found in this
      APK version. May share service UUID with Mini.

  - model: "View Plus"
    identification:
      service_uuids:
        - "b42e90a2-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Air quality monitor with display. Particulate matter (PM) + radon +
      CO₂. Uses Albatross GATT profile with product provisioning service
      b42eb4a6 for WiFi/BLE configuration. Alias: "Albatross" in code.
    sensors: ["radon", "co2", "pm", "temperature", "humidity"]

  - model: "Hub"
    identification:
      service_uuids:
        - "b42e77de-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Gateway/hub device. Bridges sub-devices to cloud.
      Limited sensor data available directly via BLE.

services:
  # === Wave Gen 1 Air Sensor Service ===
  - uuid: "b42e1f6e-ade7-11e4-89d3-123b93f75cba"
    name: "Wave Air Sensor Service"
    variants: ["Wave (Gen 1)"]
    characteristics:
      - uuid: "b42e27ac-ade7-11e4-89d3-123b93f75cba"
        name: "ASR (Air Sensor Read)"
        properties: ["notify"]
        notes: >
          Notification characteristic. Device pushes sensor data records
          via this characteristic. Data format uses ASR record framing:
          [flags byte][sensor count or index byte][record sequence 2 bytes]
          [optional fields based on flags: base time, time offset, dataset index,
          sensor status] followed by packed sensor value bytes.
          Flags indicate which optional fields are present.
        format:
          - offset: 0
            length: 1
            name: "flags"
            type: "uint8"
            notes: "Bit 0=baseTimePresent, bit 1=datasetIndexPresent, bit 2=timeOffsetPresent, bit 3=sensorStatusPresent, bit 4=noData"

      - uuid: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
        name: "ASRACP (Air Sensor Read Access Control Point)"
        properties: ["write", "indicate"]
        notes: >
          Control point for the ASR service. Used to request historical data,
          configure device, set time, trigger readings, etc.
          Opcodes (write): 1=report measurements, 2=delete measurements,
          3=abort operation, 4=count measurements, 248=vendor setup,
          249=vendor readback.
          Indications: 1=report IA, 2=delete IA, 3=status IB, 4=count IC,
          248=vendor status IB, 249=vendor status IW.
        commands:
          report_measurements:
            description: "Request stored measurement records from a sensor dataset."
            template: [0x01, "{operator}", "{flags}", "{sensor_index}", "{dataset_index}", "{min_seq}", "{max_seq}"]
            parameters:
              operator: { type: "uint8", min: 0, max: 6 }
              flags: { type: "uint8", min: 0, max: 15 }
              sensor_index: { type: "uint8", min: 0, max: 13 }
              dataset_index: { type: "uint8", min: 0, max: 255 }
              min_seq: { type: "uint16" }
              max_seq: { type: "uint16" }

          count_measurements:
            description: "Count available measurement records."
            template: [0x04, "{sensor_index}"]
            parameters:
              sensor_index: { type: "uint8", min: 0, max: 13 }

          delete_measurements:
            description: "Delete stored measurement records."
            template: [0x02, "{operator}"]
            parameters:
              operator: { type: "uint8", min: 1, max: 6 }

          set_time:
            description: "Set device RTC time (vendor command)."
            template: [0xF8, 0x0D, "{year_lsb}", "{year_msb}", "{month}", "{day}", "{hours}", "{minutes}", "{seconds}"]
            parameters:
              year_lsb: { type: "uint8" }
              year_msb: { type: "uint8" }
              month: { type: "uint8", min: 1, max: 12 }
              day: { type: "uint8", min: 1, max: 31 }
              hours: { type: "uint8", min: 0, max: 23 }
              minutes: { type: "uint8", min: 0, max: 59 }
              seconds: { type: "uint8", min: 0, max: 59 }

          get_battery_status:
            description: "Read battery status (vendor command 0x0B)."
            value: [0xF8, 0x0B]

          trigger_sensor_read:
            description: "Force an immediate sensor reading (vendor command 0x07)."
            value: [0xF8, 0x07]

          get_diagnostic_info:
            description: "Read diagnostic info (vendor command 0x0C)."
            value: [0xF8, 0x0C]

          set_ring_color:
            description: "Set LED ring color (vendor command 0x06)."
            template: [0xF8, 0x06, "{color}"]
            parameters:
              color: { type: "uint8", min: 0, max: 4, description: "0=auto, 1=white, 2=green, 3=yellow, 4=red" }

          ui_command:
            description: "Send UI command to device (vendor command 0x62)."
            template: [0xF8, 0x62, "{command}"]
            parameters:
              command: { type: "uint8", description: "1=welcome tune, 2=low battery tune, 3=paired tune, 4=radon alert, 5=red ring breathe, 6=green ring breathe, 7=blue ring breathe, 8=measure ref waveform, 9=yellow ring breathe, 10=white breathe, 11=test RGB LEDs, 12=play selected sound, 13=exercise predefined pattern, 14=exercise with RGB components, 15=spin blue to solid" }

      - uuid: "b42e1096-ade7-11e4-89d3-123b93f75cba"
        name: "Combined Sensor Data"
        properties: ["read", "notify"]
        notes: "Packed multi-sensor current readings. Format varies by device model."

      - uuid: "b42e01aa-ade7-11e4-89d3-123b93f75cba"
        name: "Radon 24-Hour Average"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 2
            name: "radon_24h_avg"
            type: "uint16"
            unit: "Bq/m³"

      - uuid: "b42e0a4c-ade7-11e4-89d3-123b93f75cba"
        name: "Radon Long-Term Average"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 2
            name: "radon_longterm_avg"
            type: "uint16"
            unit: "Bq/m³"

      - uuid: "b42e06dc-ade7-11e4-89d3-123b93f75cba"
        name: "Radon 1-Hour Average"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 2
            name: "radon_1h_avg"
            type: "uint16"
            unit: "Bq/m³"

  # === Wave Gen 2 Air Sensor Service ===
  - uuid: "b42e4a8e-ade7-11e4-89d3-123b93f75cba"
    name: "Wave 2 Air Sensor Service"
    variants: ["Wave (Gen 2)"]
    characteristics:
      - uuid: "b42e538a-ade7-11e4-89d3-123b93f75cba"
        name: "ASR (Air Sensor Read)"
        properties: ["notify"]
        notes: "Same ASR protocol as Wave Gen 1. See Wave Gen 1 ASR for frame format."

      - uuid: "b42e50d8-ade7-11e4-89d3-123b93f75cba"
        name: "ASRACP (Air Sensor Read Access Control Point)"
        properties: ["write", "indicate"]
        notes: "Same ASRACP protocol as Wave Gen 1."

      - uuid: "b42e4dcc-ade7-11e4-89d3-123b93f75cba"
        name: "Combined Sensor Data"
        properties: ["read", "notify"]

  # === Wave Plus Air Sensor Service ===
  - uuid: "b42e1c08-ade7-11e4-89d3-123b93f75cba"
    name: "Wave Plus Air Sensor Service"
    variants: ["Wave Plus"]
    characteristics:
      - uuid: "b42e2fc2-ade7-11e4-89d3-123b93f75cba"
        name: "ASR (Air Sensor Read)"
        properties: ["notify"]
        notes: "Same ASR protocol as Wave Gen 1."

      - uuid: "b42e2d06-ade7-11e4-89d3-123b93f75cba"
        name: "ASRACP (Air Sensor Read Access Control Point)"
        properties: ["write", "indicate"]
        notes: "Same ASRACP protocol as Wave Gen 1."

      - uuid: "b42e2a68-ade7-11e4-89d3-123b93f75cba"
        name: "Combined Sensor Data"
        properties: ["read", "notify"]

  # === Wave Mini Air Sensor Service ===
  - uuid: "b42e3882-ade7-11e4-89d3-123b93f75cba"
    name: "Wave Mini Air Sensor Service"
    variants: ["Wave Mini"]
    characteristics:
      - uuid: "b42e3b98-ade7-11e4-89d3-123b93f75cba"
        name: "Combined Sensor Data"
        properties: ["read", "notify"]
        notes: >
          Packed multi-sensor current readings, struct "<2B5HLL": unused,
          temperature, pressure, humidity, VOC, unused x3 — the packet carries
          pressure and VOC in addition to temperature/humidity. Confirmed by
          Airthings/wavemini-reader (CURR_VAL_UUID) and Airthings/airthings-ble
          (CHAR_UUID_WAVEMINI_DATA).

      - uuid: "b42e3ef4-ade7-11e4-89d3-123b93f75cba"
        name: "ASRACP (Air Sensor Read Access Control Point)"
        properties: ["write", "indicate"]
        notes: >
          Access control point. Confirmed by Airthings/airthings-ble
          (COMMAND_UUID_WAVE_MINI) and ESPHome
          (ACCESS_CONTROL_POINT_CHARACTERISTIC_UUID).

      # The Mini also exposes the standard temperature (2A6E) and humidity
      # (2A6F) characteristics. They are declared ONCE, with their full byte
      # layout, under the Environmental Sensing Service (0x181A) below —
      # duplicate bare stubs used to live here and shadowed the real
      # declarations for consumers resolving first match.

  # === View Plus Service ===
  # NOTE: b42e77de-… was previously nested here as a *characteristic*, but it is
  # the Hub/Bridge device's primary SERVICE UUID, not a characteristic of View
  # Plus. It is already recorded machine-readably in
  # device.identification.service_uuids and device.discovery, so the fact is
  # preserved; it is restated here because a service with no recovered
  # characteristics cannot currently be expressed as a `services` entry (the
  # schema makes `characteristics` required with minItems 1).
  - uuid: "b42e90a2-ade7-11e4-89d3-123b93f75cba"
    name: "View Plus Air Sensor Service"
    variants: ["View Plus"]
    notes: >
      Sibling service: b42e77de-ade7-11e4-89d3-123b93f75cba is the Airthings
      Hub/Bridge device's primary service UUID.
      View Plus's own ASR/ASRACP characteristic UUIDs were not extracted from the
      app; the family shares the ASR/ASRACP profile documented on the Wave and
      Wave Plus services above, but the View Plus UUIDs are unconfirmed and are
      deliberately not guessed here.
    # No characteristics: View Plus's own ASR/ASRACP UUIDs were never recovered.
    # This service therefore cannot validate against the current schema, which
    # requires `characteristics` with minItems 1. Left deliberately incomplete
    # rather than populated with guessed or borrowed UUIDs. See the PR body.

  # === Product Provisioning (Albatross) ===
  - uuid: "b42eb4a6-ade7-11e4-89d3-123b93f75cba"
    name: "Product Provisioning Service"
    variants: ["View Plus"]
    notes: >
      WiFi and BLE provisioning for View Plus (Albatross).
      Handles WiFi scanning, region configuration, Smartlink setup,
      connectivity mode switching, and firmware bundle version queries.
    characteristics:
      - uuid: "b42eb73a-ade7-11e4-89d3-123b93f75cba"
        name: "WiFi Scan"
        properties: ["write", "notify"]
        notes: "WiFi network scanning and results."
      - uuid: "b42eb9f6-ade7-11e4-89d3-123b93f75cba"
        name: "WiFi Status / Region"
        properties: ["write", "notify"]
        notes: "WiFi connection status and region configuration."
      - uuid: "b42ebc9e-ade7-11e4-89d3-123b93f75cba"
        name: "Connectivity Mode / TX Power"
        properties: ["write", "notify"]
        notes: "Switch between BLE and WiFi connectivity modes."

  # === Standard BLE Services (all models) ===
  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    name: "Device Information Service"
    characteristics:
      - uuid: "00002a26-0000-1000-8000-00805f9b34fb"
        name: "Firmware Revision String"
        properties: ["read"]
      - uuid: "00002a29-0000-1000-8000-00805f9b34fb"
        name: "Manufacturer Name String"
        properties: ["read"]
      - uuid: "00002a24-0000-1000-8000-00805f9b34fb"
        name: "Model Number String"
        properties: ["read"]
      - uuid: "00002a25-0000-1000-8000-00805f9b34fb"
        name: "Serial Number String"
        properties: ["read"]
      - uuid: "00002a27-0000-1000-8000-00805f9b34fb"
        name: "Hardware Revision String"
        properties: ["read"]
      - uuid: "00002a28-0000-1000-8000-00805f9b34fb"
        name: "Software Revision String"
        properties: ["read"]
      - uuid: "00002a23-0000-1000-8000-00805f9b34fb"
        name: "System ID"
        properties: ["read"]

  - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
    name: "Battery Service"
    characteristics:
      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "Battery Level"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 1
            name: "battery_percent"
            type: "uint8"
            unit: "%"

  # These five were filed directly in `services` although they are
  # characteristics (they carry `properties`/`format`, not `characteristics`).
  # They are re-nested below under the Bluetooth SIG services that define them.
  # NOTE: the two parent service UUIDs are the SIG-standard owners of these
  # characteristic UUIDs, not values observed on the device.
  - uuid: "0000181a-0000-1000-8000-00805f9b34fb"
    name: "Environmental Sensing Service"
    notes: >
      Bluetooth SIG standard Environmental Sensing Service (0x181A), the defined
      owner of the temperature/humidity/pressure/dew-point characteristics below.
      The service UUID is inferred from the SIG assignment rather than captured;
      the characteristic UUIDs themselves came from the decompiled app.
    characteristics:
      - uuid: "00002a6e-0000-1000-8000-00805f9b34fb"
        name: "Temperature Characteristic"
        properties: ["read", "notify"]
        notes: "Standard BLE temperature. Available on most models (including Wave Mini) as individual characteristic. Sole declaration of this UUID."
        format:
          - offset: 0
            length: 2
            name: "temperature"
            type: "int16"
            scale: 0.01
            unit: "°C"

      - uuid: "00002a6f-0000-1000-8000-00805f9b34fb"
        name: "Humidity Characteristic"
        properties: ["read", "notify"]
        notes: "Standard BLE humidity. Available on most models (including Wave Mini). Sole declaration of this UUID."
        format:
          - offset: 0
            length: 2
            name: "humidity"
            type: "uint16"
            scale: 0.01
            unit: "%RH"

      - uuid: "00002a6d-0000-1000-8000-00805f9b34fb"
        name: "Pressure Characteristic"
        properties: ["read", "notify"]
        notes: >
          Standard BLE pressure (SIG: uint32, 0.1 Pa resolution). Available
          on Wave Plus. The scale below yields hPa (= mbar) directly:
          0.1 Pa = 0.001 hPa. This matches the vendor app, which decodes
          this characteristic as uint32 LE / 1000
          (DeviceDataTypes.pressureInSIFromCurrentCharacteristic).
        format:
          - offset: 0
            length: 4
            name: "pressure"
            type: "uint32"
            scale: 0.001
            unit: "hPa"

      - uuid: "00002a7b-0000-1000-8000-00805f9b34fb"
        name: "Dew Point Characteristic"
        properties: ["read", "notify"]
        notes: "Standard BLE dew point. Available on Wave Plus."
        format:
          - offset: 0
            length: 2
            name: "dew_point"
            type: "int16"
            scale: 0.01
            unit: "°C"

  - uuid: "00001805-0000-1000-8000-00805f9b34fb"
    name: "Current Time Service"
    notes: >
      Bluetooth SIG standard Current Time Service (0x1805), the defined owner of
      the Current Time characteristic below. Service UUID inferred from the SIG
      assignment rather than captured.
    characteristics:
      - uuid: "00002a08-0000-1000-8000-00805f9b34fb"
        name: "Current Time"
        properties: ["read", "write"]
        notes: "Device RTC. Write to set device clock."

  # === TI OAD Firmware Update Service ===
  - uuid: "f000ffc0-0451-4000-b000-000000000000"
    name: "TI OAD Firmware Update Service"
    notes: "Texas Instruments Over-the-Air Download service for firmware updates. Available on most models."
    characteristics:
      - uuid: "f000ffc2-0451-4000-b000-000000000000"
        name: "OAD Image Block Request"
        properties: ["write"]
        notes: "Write firmware image blocks."
      - uuid: "f000ffc1-0451-4000-b000-000000000000"
        name: "OAD Image Notify"
        properties: ["notify"]
        notes: "Notification channel for OAD status."
      - uuid: "f000ffc5-0451-4000-b000-000000000000"
        name: "OAD Image Control"
        properties: ["write", "notify"]
        notes: "Control OAD transfer (start, abort, commit)."
      - uuid: "f000ffc3-0451-4000-b000-000000000000"
        name: "OAD Image Count"
        properties: ["read"]
        notes: "Number of firmware images available."

commands:
  # ASRACP commands (common across all models)
  report_measurements:
    description: "Request stored measurement records from a sensor dataset."
    characteristic: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
    format_A:
      - byte: 0
        value: "0x01"
        description: "Opcode: Report Measurements"
      - byte: 1
        name: "operator"
        values:
          - "0x01": "All records"
          - "0x02": "All records below threshold"
          - "0x03": "All records above threshold"
          - "0x04": "All records within range"
          - "0x05": "First record"
          - "0x06": "Last record"
      - byte: 2
        name: "flags"
        description: "Indicate which optional fields to include"
      - byte: 3
        name: "sensor_index"
        description: "Sensor index (0-13 per device)"

  delete_measurements:
    description: "Delete stored measurement records."
    characteristic: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
    value: [0x02, 0x01]

  abort_operation:
    description: "Abort current ASRACP operation."
    characteristic: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
    value: [0x03]

  count_measurements:
    description: "Count available measurement records."
    characteristic: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
    template: [0x04, "{sensor_index}"]
    parameters:
      sensor_index: { type: "uint8", min: 0, max: 13 }

  set_time:
    description: "Set device real-time clock."
    characteristic: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
    template: [0xF8, 0x0D, "{year_lsb}", "{year_msb}", "{month}", "{day}", "{hours}", "{minutes}", "{seconds}"]
    parameters:
      year_lsb: { type: "uint8" }
      year_msb: { type: "uint8" }
      month: { type: "uint8", min: 1, max: 12 }
      day: { type: "uint8", min: 1, max: 31 }
      hours: { type: "uint8", min: 0, max: 23 }
      minutes: { type: "uint8", min: 0, max: 59 }
      seconds: { type: "uint8", min: 0, max: 59 }

security:
  bonding: "optional"
  pairing: "optional"
  encryption: "optional"
  authentication: "unknown"
  notes: >
    Standard BLE GATT connection — no mandatory bonding or pairing for
    reading sensor data. ASRACP write commands may require authentication
    via ATCommandSetFrame challenge-response (AT+CHALLENGE, AT+CMD, etc.).
    This aspect has NOT been confirmed — needs HCI snoop to verify whether
    writes require auth or are plaintext.

timing:
  connect_delay_ms: 500
  connect_timeout_ms: 10000
  scan_timeout_s: 60
  notes: >
    Device samples sensors every 3600 seconds (1 hour) by default.
    5-minute and 60-minute data availability flagged in advertisement.
    Sensor read via BLE is real-time upon connection + notification enable.

