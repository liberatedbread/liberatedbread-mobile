# Airthings Wave Family — Device Spec
# Derived from static analysis of com.airthings.airthings APK
# APK source: apkeep (APKPure mirror) → xapk → extracted APK
# APK SHA-256: 3ab7010d8c9808fee82650b29a8d836012de3a2b0c0f3c78b0c1c23d87de8bc8
# HCI capture: research/airthings/airthings_2950_wave_capture.pcapng (Nordic
# sniffer, Wave Gen 2 serial 2950016244, firmware G-BLE-2.2.3) — used to
# verify advertisement layout, combined-packet format, and the ASRACP
# Griffin command set against live traffic.
# HCI capture 2: research/airthings/
# airthings_2950_long_capture_with_radon_and_alert.pcapng (same sniffer and
# unit, 44 min steady-state, four vendor-app sessions) — adds the first
# observed ASR history notification (230-byte pending-hour block), the
# report-measurements request that triggers it, the advertisement
# "new 5-minute data" flag pulse, and live dataset-info counter behavior.
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Airthings Wave Family"
  manufacturer: "Airthings ASA"
  manufacturer_status: "active"
  protocol: "ble"
  category: "sensor"
  notes: >
    Family of BLE air quality monitors: Wave (radon), Wave Plus (radon + CO₂ +
    VOC + pressure), Wave Mini (temp/humidity/mold risk), Wave Gen 2, View Plus
    (particulate + display), and Hub (gateway). All devices share a common
    GATT profile architecture (AtGattProfile) with per-model service UUIDs,
    manufacturer ID 820 (0x0334) in advertisement data, and a standardized
    ASR/ASRACP protocol for reading sensor data and controlling the device.

    DISCOVERY: Scan for service UUIDs in advertisement. Manufacturer data
    (company ID 820) carries 4-byte serial number followed by 2-byte flags.
    Device type identified by which service UUID is present in the
    advertisement itself (ADV_IND incomplete 128-bit service UUID list) —
    the HCI capture shows the scan response is empty on Wave Gen 2.

    COMMUNICATION: Connect to the air sensor service UUID. Sensor data read
    via two paths:
    1. Standard BLE GATT characteristics (temperature 2A6E, humidity 2A6F,
       pressure 2A6D, dew point 2A7B) — read directly or via notify.
    2. ASR (Air Sensor Read) characteristic — notifications carry packed
       multi-sensor data records. ASRACP (Access Control Point) used to
       request historical data dumps, configure device settings, set time, etc.
       On newer firmware the ASRACP characteristic multiplexes two command
       sets: the legacy ASRACP opcodes (0x01-0x04, 0xF8/0xF9) and the newer
       "Griffin" direct opcodes (0x02 dataset info, 0x66 UI settings, 0x6D
       self check, 0x72-0x74 clock/flash, 0x76-0x79 region), the latter
       confirmed by HCI capture on Wave Gen 2 firmware G-BLE-2.2.3.

    CONFIDENCE: Service/characteristic UUIDs are HIGH — sourced directly
    from decompiled Java/Kotlin code with explicit per-model UUID tables;
    Wave Gen 2 ASR/ASRACP/combined UUIDs additionally exercised in capture.
    Advertisement serial/flags layout is HIGH — capture-verified (serial
    2950016244 matches the LE decode; flag bits match the app's WaveScanResultData
    and legacy DeviceDefines bit tables).
    Combined sensor-data packet format is HIGH on Wave Gen 2 — 20-byte
    record captured and decoded against the app's CurrentValuesParser.
    ASRACP opcode protocol is HIGH — full opcode/format tables extracted
    and the Griffin subset observed live. Note opcode 0x02 is overloaded:
    legacy "delete measurements" vs Griffin "dataset info"; the captured
    firmware answered 0x02 with dataset info.
    ASR notification framing on Griffin firmware is HIGH for Wave Gen 2 —
    the long capture contains a full history readout: a report-measurements
    write on ASRACP answered by ONE 230-byte ASR notification carrying the
    pending hour as twelve 5-minute slots (format on the Wave 2 ASR
    characteristic below), cross-validated slot-by-slot against the
    combined-characteristic reads in the same session. The legacy
    multi-record ASR framing described in the app (flags byte + optional
    fields per record) was NOT what the Griffin firmware sent and remains
    MEDIUM, app-derived only.
    Security is MEDIUM — ATCommandSetFrame suggests optional PIN/challenge
    auth but flow not fully decoded; the captured session ran entirely
    without pairing, bonding, or encryption (no SMP traffic).

  identification:
    manufacturer_data:
      company_id: 820
      description: "Airthings BTSIG manufacturer ID 0x0334. Manufacturer data contains 4-byte serial number at offset 0 and 2-byte flags at offset 4."
      format:
        - offset: 0
          length: 4
          name: "serial_number"
          type: "uint32"
          description: "Device serial number (little-endian — all three official Airthings readers decode LE, e.g. wave-reader struct '<HLH')"
        - offset: 4
          length: 2
          name: "flags"
          type: "uint16"
          description: >
            Bitfield: bit 0 = error, bit 1 = RTC not set, bit 2 = wait,
            bit 3 = wave disabled, bit 5 = ring spinning blue,
            bit 6 = waved in last 5 min, bit 7 = pairing mode,
            bit 8 = new 5-min data, bit 9 = new 60-min data,
            bits 10-11 = ring color (0=auto, 1=white, 2=green, 3=yellow, 4=red),
            bit 12 = hub connected (GriffinScanResultData),
            bit 15 = POST failed.
            Capture-validated: a Wave Gen 2 advertised flags 0x0021 (bits 0+5,
            error + ring spinning blue, seen during device setup).
            Long-capture (44 min steady state, same unit): flags held 0x0009
            with bit 0x0002 additionally raised for ~20 s once every 300 s —
            a beacon that a fresh 5-minute sample was just taken (the pulses
            align with the device's 5-minute sampling tick; clients can scan
            for this bit as a wake-on-new-data signal instead of polling).
            The 0x0009 value is echoed as the last u16 of the Griffin
            self-check response, corroborating the little-endian decode —
            but note the pulsing bit then lands on "RTC not set" and the
            steady bits on "error"/"wave disabled" in the app's table above,
            so the app bit NAMES fit the observed behavior poorly on Griffin
            firmware; treat the pulse timing as capture-fact and the bit
            labels as MEDIUM confidence.
    service_uuids:
      - "b42e1f6e-ade7-11e4-89d3-123b93f75cba"
      - "b42e4a8e-ade7-11e4-89d3-123b93f75cba"
      - "b42e1c08-ade7-11e4-89d3-123b93f75cba"
      - "b42e3882-ade7-11e4-89d3-123b93f75cba"
      - "b42e90a2-ade7-11e4-89d3-123b93f75cba"
      - "b42e77de-ade7-11e4-89d3-123b93f75cba"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "b42e1f6e-ade7-11e4-89d3-123b93f75cba"
            - "b42e4a8e-ade7-11e4-89d3-123b93f75cba"
            - "b42e1c08-ade7-11e4-89d3-123b93f75cba"
            - "b42e3882-ade7-11e4-89d3-123b93f75cba"
            - "b42e90a2-ade7-11e4-89d3-123b93f75cba"
            - "b42e77de-ade7-11e4-89d3-123b93f75cba"
          manufacturer_data:
            company_id: 820
            description: "Serial number and status flags in manufacturer data."
    identity:
      stable_keys: ["address", "manufacturer_data.serial_number"]
      display: "manufacturer_data.serial_number"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning required. BLE connection only. Device scan filters
      per-model service UUID. No pairing or PIN required for sensor reads
      or for the ASRACP writes observed in the HCI capture (no SMP
      traffic). An optional password/PIN path may still exist for other
      operations (ATCommandSetFrame parsing suggests a challenge-response
      auth path, not exercised in the capture).
    methods:
      - type: "ble_direct"
        # HCI capture of a vendor-app session against a Wave Gen 2 (Nordic
        # sniffer, airthings_2950_wave_capture.pcapng): connect, enable
        # ASRACP indications + ASR notifications, read combined sensor data,
        # and exchange ASRACP Griffin commands all succeeded with no pairing
        # or bonding. The ASR notification record format itself was not
        # exercised in the capture window.
        verified: true
        description: >
          Scan for Airthings service UUIDs (manufacturer ID 820), connect,
          read standard BLE characteristics for live readings, or use
          ASR/ASRACP for historical data and configuration.
        ble:
          pairing_required: false
        steps:
          - action: "Scan for Airthings devices via manufacturer ID 820 in advertisement data."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Identify device type by service UUID in scan response."
            actor: "client"
          - action: "Connect and read sensor data via standard BLE characteristics or ASR notifications."
            actor: "client"
    factory_reset:
      # The procedure that used to sit here was a guess ("hold the button for
      # 10+ seconds") under a heading that admitted as much. A guess formatted
      # as a procedure reads like a verified one, so it is stated as unknown
      # instead.
      applicable: "unknown"
      confidence: "low"
      effect: >
        Not established. A reset would clear the device's logged sensor history
        and any ASRACP password, but neither the trigger nor its effect was
        recovered from the app, and the family spans six models whose buttons
        differ. Requires hardware testing.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "Unpair from OS Bluetooth settings if bonded, then reconnect."
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: "BLE-only for sensor access. Hub variant adds WiFi but config is done via BLE."

variants:
  - model: "Wave (Gen 1)"
    identification:
      service_uuids:
        - "b42e1f6e-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Radon-only monitor. Sensors: radon 24h avg, radon long-term avg,
      temperature, humidity. Device type code: dTWave=1 in legacy code.
      Sensor indices: 0=radon24h, 2=longTerm, 3=temp, 4=humidity, 5=status.
    sensors: ["radon", "temperature", "humidity"]

  - model: "Wave (Gen 2)"
    identification:
      service_uuids:
        - "b42e4a8e-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Updated Wave with Gen 2 hardware. Different service UUID and
      ASR/ASRACP characteristic UUIDs. Same sensor suite as Gen 1.
      ASR: b42e538a, ASRACP: b42e50d8, Combined: b42e4dcc.
      Serial number prefix 2950 (InstrumentTypePrefix.WAVE_2); BLE firmware
      is named "G-BLE-x.y.z" (capture: G-BLE-2.2.3-master+0).
      Capture-verified (airthings_2950_wave_capture.pcapng): b42e4a8e is
      advertised in ADV_IND, the combined characteristic returns the
      20-byte packet documented below, and the ASRACP characteristic
      accepts the Griffin command set (self check, dataset info, clock,
      UI settings, external flash version) over write/indicate with no
      pairing. Self-check response byte 6 = device type 0x01 (WAVE2).
      The long capture additionally verified the history readout: ASRACP
      report-measurements → single 230-byte pending-hour block on the ASR
      characteristic (twelve 5-minute slots; format on b42e538a), and the
      advertisement's ~20 s "new 5-minute data" flag pulse every 300 s.
    sensors: ["radon", "temperature", "humidity"]

  - model: "Wave Plus"
    identification:
      service_uuids:
        - "b42e1c08-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Radon + CO₂ + VOC + temperature + humidity + pressure.
      Device type code: dTWavePlus=2 in legacy code.
      ASR: b42e2fc2, ASRACP: b42e2d06, Combined: b42e2a68.
      Includes dew point characteristic (2A7B) and pressure (2A6D).
    sensors: ["radon", "co2", "voc", "temperature", "humidity", "pressure"]

  - model: "Wave Mini"
    identification:
      service_uuids:
        - "b42e3882-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Compact temp/humidity/mold risk monitor. No radon.
      Smallest form factor. Same common GATT profile with ASR/ASRACP.
      The BLE packet on the combined data characteristic (b42e3b98, struct
      "<2B5HLL") also carries pressure and VOC, beyond the temp/humidity the
      marketing description suggests.
    sensors: ["temperature", "humidity", "pressure", "voc"]

  - model: "Wave Mist"
    notes: >
      Humidifier variant. Referenced in Instrument.Type enum
      (WAVE_MIST_GEN_1) but no separate GATT profile found in this
      APK version. May share service UUID with Mini.

  - model: "View Plus"
    identification:
      service_uuids:
        - "b42e90a2-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Air quality monitor with display. Particulate matter (PM) + radon +
      CO₂. Uses Albatross GATT profile with product provisioning service
      b42eb4a6 for WiFi/BLE configuration. Alias: "Albatross" in code.
    sensors: ["radon", "co2", "pm", "temperature", "humidity"]

  - model: "Hub"
    identification:
      service_uuids:
        - "b42e77de-ade7-11e4-89d3-123b93f75cba"
    notes: >
      Gateway/hub device. Bridges sub-devices to cloud.
      Limited sensor data available directly via BLE.

services:
  # === Wave Gen 1 Air Sensor Service ===
  - uuid: "b42e1f6e-ade7-11e4-89d3-123b93f75cba"
    name: "Wave Air Sensor Service"
    variants: ["Wave (Gen 1)"]
    characteristics:
      - uuid: "b42e27ac-ade7-11e4-89d3-123b93f75cba"
        name: "ASR (Air Sensor Read)"
        properties: ["notify"]
        notes: >
          Notification characteristic. Device pushes sensor data records
          via this characteristic. Data format uses ASR record framing:
          [flags byte][sensor count or index byte][record sequence 2 bytes]
          [optional fields based on flags: base time, time offset, dataset index,
          sensor status] followed by packed sensor value bytes.
          Flags indicate which optional fields are present.
        format:
          - offset: 0
            length: 1
            name: "flags"
            type: "uint8"
            notes: "Bit 0=baseTimePresent, bit 1=datasetIndexPresent, bit 2=timeOffsetPresent, bit 3=sensorStatusPresent, bit 4=noData"

      - uuid: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
        name: "ASRACP (Air Sensor Read Access Control Point)"
        properties: ["write", "indicate"]
        notes: >
          Control point for the ASR service. Used to request historical data,
          configure device, set time, trigger readings, etc.
          Opcodes (write): 1=report measurements, 2=delete measurements,
          3=abort operation, 4=count measurements, 248=vendor setup,
          249=vendor readback.
          Indications: 1=report IA, 2=delete IA, 3=status IB, 4=count IC,
          248=vendor status IB, 249=vendor status IW.
        commands:
          report_measurements:
            description: "Request stored measurement records from a sensor dataset."
            template: [0x01, "{operator}", "{flags}", "{sensor_index}", "{dataset_index}", "{min_seq}", "{max_seq}"]
            parameters:
              operator: { type: "uint8", min: 0, max: 6 }
              flags: { type: "uint8", min: 0, max: 15 }
              sensor_index: { type: "uint8", min: 0, max: 13 }
              dataset_index: { type: "uint8", min: 0, max: 255 }
              min_seq: { type: "uint16" }
              max_seq: { type: "uint16" }

          count_measurements:
            description: "Count available measurement records."
            template: [0x04, "{sensor_index}"]
            parameters:
              sensor_index: { type: "uint8", min: 0, max: 13 }

          delete_measurements:
            description: "Delete stored measurement records."
            template: [0x02, "{operator}"]
            parameters:
              operator: { type: "uint8", min: 1, max: 6 }

          set_time:
            description: "Set device RTC time (vendor command)."
            template: [0xF8, 0x0D, "{year_lsb}", "{year_msb}", "{month}", "{day}", "{hours}", "{minutes}", "{seconds}"]
            parameters:
              year_lsb: { type: "uint8" }
              year_msb: { type: "uint8" }
              month: { type: "uint8", min: 1, max: 12 }
              day: { type: "uint8", min: 1, max: 31 }
              hours: { type: "uint8", min: 0, max: 23 }
              minutes: { type: "uint8", min: 0, max: 59 }
              seconds: { type: "uint8", min: 0, max: 59 }

          get_battery_status:
            description: "Read battery status (vendor command 0x0B)."
            value: [0xF8, 0x0B]

          trigger_sensor_read:
            description: "Force an immediate sensor reading (vendor command 0x07)."
            value: [0xF8, 0x07]

          get_diagnostic_info:
            description: "Read diagnostic info (vendor command 0x0C)."
            value: [0xF8, 0x0C]

          set_ring_color:
            description: "Set LED ring color (vendor command 0x06)."
            template: [0xF8, 0x06, "{color}"]
            parameters:
              color: { type: "uint8", min: 0, max: 4, description: "0=auto, 1=white, 2=green, 3=yellow, 4=red" }

          ui_command:
            description: "Send UI command to device (vendor command 0x62)."
            template: [0xF8, 0x62, "{command}"]
            parameters:
              command: { type: "uint8", description: "1=welcome tune, 2=low battery tune, 3=paired tune, 4=radon alert, 5=red ring breathe, 6=green ring breathe, 7=blue ring breathe, 8=measure ref waveform, 9=yellow ring breathe, 10=white breathe, 11=test RGB LEDs, 12=play selected sound, 13=exercise predefined pattern, 14=exercise with RGB components, 15=spin blue to solid" }

      - uuid: "b42e1096-ade7-11e4-89d3-123b93f75cba"
        name: "Combined Sensor Data"
        properties: ["read", "notify"]
        notes: "Packed multi-sensor current readings. Format varies by device model."

      - uuid: "b42e01aa-ade7-11e4-89d3-123b93f75cba"
        name: "Radon 24-Hour Average"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 2
            name: "radon_24h_avg"
            type: "uint16"
            unit: "Bq/m³"

      - uuid: "b42e0a4c-ade7-11e4-89d3-123b93f75cba"
        name: "Radon Long-Term Average"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 2
            name: "radon_longterm_avg"
            type: "uint16"
            unit: "Bq/m³"

      - uuid: "b42e06dc-ade7-11e4-89d3-123b93f75cba"
        name: "Radon 1-Hour Average"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 2
            name: "radon_1h_avg"
            type: "uint16"
            unit: "Bq/m³"

  # === Wave Gen 2 Air Sensor Service ===
  - uuid: "b42e4a8e-ade7-11e4-89d3-123b93f75cba"
    name: "Wave 2 Air Sensor Service"
    variants: ["Wave (Gen 2)"]
    characteristics:
      - uuid: "b42e538a-ade7-11e4-89d3-123b93f75cba"
        name: "ASR (Air Sensor Read)"
        properties: ["notify"]
        notes: >
          On Griffin firmware (capture: G-BLE-2.2.3) a report-measurements
          write on ASRACP (see griffin_report_measurements) is answered by a
          SINGLE 230-byte notification on this characteristic carrying the
          pending hour as twelve 5-minute slots per sensor, oldest first
          (slot 11 matched the combined-characteristic reading taken seconds
          later). Requires a large ATT MTU — the vendor app negotiated 247;
          behavior at the default MTU 23 is unobserved. Slot arrays for
          sensors the model lacks are all-0xFF (Wave 2: the 144-byte region
          at offset 56, sized for six more 12-slot u16 arrays — presumably
          pressure/CO₂/VOC and friends on Wave Plus, unobserved). Layout
          below decoded from the long capture and cross-checked against the
          same session's combined-data reads (radon 26/18 Bq/m³, 22.6 °C,
          53.5 %RH, light 16 all agree). This does NOT follow the legacy
          per-record ASR framing documented on the Wave Gen 1 ASR
          characteristic; that framing remains unobserved on this firmware.
        format:
          - offset: 0
            length: 16
            name: "reserved"
            type: "bytes"
            notes: "All zeros in capture; meaning unknown."
          - offset: 16
            length: 2
            name: "radon_24h_avg"
            type: "uint16"
            unit: "Bq/m³"
            notes: "Snapshot, equals the combined-characteristic value."
          - offset: 18
            length: 2
            name: "radon_longterm_avg"
            type: "uint16"
            unit: "Bq/m³"
            notes: "Snapshot, equals the combined-characteristic value."
          - offset: 20
            length: 24
            name: "temperature_slots"
            type: "bytes"
            notes: >
              12 x uint16 LE, one per 5-minute slot, oldest first, in
              centikelvin: °C = value/100 - 273.15. Capture: 29572-29581 =
              22.57-22.66 °C, tracking the combined reads.
          - offset: 44
            length: 12
            name: "humidity_slots"
            type: "bytes"
            notes: "12 x uint8, 0.5 %RH per count. Capture: 107 = 53.5 %RH."
          - offset: 56
            length: 144
            name: "absent_sensor_slots"
            type: "bytes"
            notes: >
              All 0xFF on Wave 2. Room for six more 12-slot uint16 arrays;
              expected to carry pressure/CO₂/VOC (and unknown others) on
              Wave Plus. Unobserved populated.
          - offset: 200
            length: 12
            name: "ambient_light_slots"
            type: "bytes"
            notes: "12 x uint8 raw ambient light, same scale as combined byte 2. Capture: 11-17."
          - offset: 212
            length: 6
            name: "unknown"
            type: "bytes"
            notes: "00 00 00 20 00 00 in capture; meaning unknown."
          - offset: 218
            length: 4
            name: "base_time"
            type: "uint32"
            notes: >
              Unix seconds, little-endian. Matches dataset-info base_time
              (device epoch — capture value was ~23 h old, agreeing with the
              self-check uptime, i.e. time of boot/reset).
          - offset: 222
            length: 1
            name: "unknown2"
            type: "uint8"
            notes: "0x00 in capture."
          - offset: 223
            length: 1
            name: "dataset_number"
            type: "uint8"
            notes: "Echoes the requested dataset (0x02 in capture, matching dataset info)."
          - offset: 224
            length: 2
            name: "radon_24h_centi"
            type: "uint16"
            scale: 0.01
            unit: "Bq/m³"
            notes: >
              MEDIUM confidence. Capture value 2639 = 26.39, consistent with
              the 26 Bq/m³ 24 h average as a 0.01-scaled value; the same
              u16 appears at bytes 26-27 of the self-check response.
          - offset: 226
            length: 2
            name: "radon_pending_hour_centi"
            type: "uint16"
            scale: 0.01
            unit: "Bq/m³"
            notes: >
              MEDIUM confidence. Capture value 3055 = 30.55, read as the
              in-progress hour's radon at 0.01 Bq/m³ — plausible but
              uncorroborated by a second source.
          - offset: 228
            length: 2
            name: "record_count"
            type: "uint16"
            notes: >
              Little-endian. Capture: 23, one less than the dataset-info
              record_count (24) read seconds earlier — likely counts
              completed hourly records excluding the pending one.

      - uuid: "b42e50d8-ade7-11e4-89d3-123b93f75cba"
        name: "ASRACP (Air Sensor Read Access Control Point)"
        properties: ["write", "indicate"]
        notes: >
          Same ASRACP protocol as Wave Gen 1, multiplexed with the newer
          "Griffin" direct command set on firmware G-BLE >= 1.2.1
          (commands below; older firmware wraps the same operations in the
          0x71 passthrough envelope). Capture-verified on G-BLE-2.2.3:
          writes of 0x6D/0x74/0x02/0x66/0x72 each answered by an
          indication echoing the opcode with a status byte (0x00 = OK).
          History readout (long capture): a 9-byte 0x01 report-measurements
          request sent as ATT Write Command (0x52, no response) triggers one
          230-byte block on the ASR characteristic, then an indication here:
          [0x01, 0x00, 0x01, 0x00, 0x00, 0x00] — opcode echo, status 0x00,
          then likely a u16le count of blocks sent (0x0001) and a trailing
          u16 0x0000. See griffin_report_measurements.

      - uuid: "b42e4dcc-ade7-11e4-89d3-123b93f75cba"
        name: "Combined Sensor Data"
        properties: ["read", "notify"]
        notes: >
          Packed 20-byte multi-sensor current readings (format below).
          Layout from the app's CurrentValuesParser (shared with Wave Plus)
          and validated byte-for-byte against the capture: humidity 53.5 %,
          radon 13/11 Bq/m³, 24.16 °C, pressure/CO₂/VOC null (0xFF) on
          Wave 2, which lacks those sensors. 0xFF (uint8) or 0xFFFF
          (uint16, either byte 0xFF) marks an absent sensor value.
        format:
          - offset: 0
            length: 1
            name: "reserved"
            type: "uint8"
            notes: "Not parsed by the app; 0x01 in capture."
          - offset: 1
            length: 1
            name: "humidity"
            type: "uint8"
            scale: 0.5
            unit: "%RH"
          - offset: 2
            length: 1
            name: "ambient_light"
            type: "uint8"
            notes: "Raw ambient light level (0-255)."
          - offset: 3
            length: 1
            name: "orientation_wavecount"
            type: "uint8"
            notes: "Upper nibble = orientation, lower nibble = wave (gesture) count."
          - offset: 4
            length: 2
            name: "radon_24h_avg"
            type: "uint16"
            unit: "Bq/m³"
          - offset: 6
            length: 2
            name: "radon_longterm_avg"
            type: "uint16"
            unit: "Bq/m³"
          - offset: 8
            length: 2
            name: "temperature"
            type: "uint16"
            scale: 0.01
            unit: "°C"
          - offset: 10
            length: 2
            name: "pressure"
            type: "uint16"
            scale: 2
            unit: "Pa"
            notes: "Wave Plus only; 0xFFFF on Wave 2."
          - offset: 12
            length: 2
            name: "co2"
            type: "uint16"
            unit: "ppm"
            notes: "Wave Plus only; 0xFFFF on Wave 2."
          - offset: 14
            length: 2
            name: "voc"
            type: "uint16"
            unit: "ppb"
            notes: "Wave Plus only; 0xFFFF on Wave 2."
          - offset: 16
            length: 4
            name: "reserved2"
            type: "bytes"
            notes: >
              Not parsed by the app; 01 00 ff ff in the setup capture,
              00 00 ff ff throughout the steady-state long capture — byte
              16 varies (meaning unknown), bytes 18-19 always 0xFFFF.

  # === Wave Plus Air Sensor Service ===
  - uuid: "b42e1c08-ade7-11e4-89d3-123b93f75cba"
    name: "Wave Plus Air Sensor Service"
    variants: ["Wave Plus"]
    characteristics:
      - uuid: "b42e2fc2-ade7-11e4-89d3-123b93f75cba"
        name: "ASR (Air Sensor Read)"
        properties: ["notify"]
        notes: "Same ASR protocol as Wave Gen 1."

      - uuid: "b42e2d06-ade7-11e4-89d3-123b93f75cba"
        name: "ASRACP (Air Sensor Read Access Control Point)"
        properties: ["write", "indicate"]
        notes: "Same ASRACP protocol as Wave Gen 1."

      - uuid: "b42e2a68-ade7-11e4-89d3-123b93f75cba"
        name: "Combined Sensor Data"
        properties: ["read", "notify"]
        notes: >
          Same packed 20-byte layout as the Wave Gen 2 combined
          characteristic (see b42e4dcc) — the app parses both with the
          same CurrentValuesParser, with pressure/CO₂/VOC populated here.
          APK-derived; the capture only exercised the Wave 2 instance.
          The format block below restates that shared layout so the fields
          are machine-readable on this characteristic too — consumers
          resolve a characteristic's byte layout by UUID, and a
          prose-only cross-reference left every Wave Plus reading
          undecodable. Field-level confidence matches the source: layout
          HIGH from the shared parser, Wave Plus values themselves not
          exercised in capture. 0xFF (uint8) or 0xFFFF (uint16) marks an
          absent sensor value.
        format:
          - offset: 0
            length: 1
            name: "reserved"
            type: "uint8"
            notes: "Not parsed by the app."
          - offset: 1
            length: 1
            name: "humidity"
            type: "uint8"
            scale: 0.5
            unit: "%RH"
          - offset: 2
            length: 1
            name: "ambient_light"
            type: "uint8"
            notes: "Raw ambient light level (0-255)."
          - offset: 3
            length: 1
            name: "orientation_wavecount"
            type: "uint8"
            notes: "Upper nibble = orientation, lower nibble = wave (gesture) count."
          - offset: 4
            length: 2
            name: "radon_24h_avg"
            type: "uint16"
            unit: "Bq/m³"
          - offset: 6
            length: 2
            name: "radon_longterm_avg"
            type: "uint16"
            unit: "Bq/m³"
          - offset: 8
            length: 2
            name: "temperature"
            type: "uint16"
            scale: 0.01
            unit: "°C"
          - offset: 10
            length: 2
            name: "pressure"
            type: "uint16"
            scale: 2
            unit: "Pa"
          - offset: 12
            length: 2
            name: "co2"
            type: "uint16"
            unit: "ppm"
          - offset: 14
            length: 2
            name: "voc"
            type: "uint16"
            unit: "ppb"
          - offset: 16
            length: 4
            name: "reserved2"
            type: "bytes"
            notes: "Not parsed by the app."

  # === Wave Mini Air Sensor Service ===
  - uuid: "b42e3882-ade7-11e4-89d3-123b93f75cba"
    name: "Wave Mini Air Sensor Service"
    variants: ["Wave Mini"]
    characteristics:
      - uuid: "b42e3b98-ade7-11e4-89d3-123b93f75cba"
        name: "Combined Sensor Data"
        properties: ["read", "notify"]
        notes: >
          Packed multi-sensor current readings, struct "<2B5HLL": unused,
          temperature, pressure, humidity, VOC, unused x3 — the packet carries
          pressure and VOC in addition to temperature/humidity. Confirmed by
          Airthings/wavemini-reader (CURR_VAL_UUID) and Airthings/airthings-ble
          (CHAR_UUID_WAVEMINI_DATA). Field offsets and transforms below are
          taken from those two readers' decode functions
          (wavemini-reader CurrentValues.from_bytes: temperature =
          u16@2/100 - 273.15, humidity = u16@6/100, voc = u16@8;
          airthings-ble _decode_wave_mini adds pressure = u16@4/50 and
          ambient light from byte 0). MEDIUM confidence: vendor-published
          source code, not verified against live traffic here. NOTE the
          temperature is centikelvin — unlike every other model in this
          family, which reports centidegrees Celsius.
        format:
          - offset: 0
            length: 1
            name: "ambient_light"
            type: "uint8"
            notes: >
              Raw ambient light level; airthings-ble runs it through its
              illuminance converter. Offset 0 is deliberate: of the two
              leading uint8s in "<2B5HLL", _decode_wave_mini reads val[0]
              (the FIRST byte) as illuminance; byte 1 (the second uint8) is
              read by neither vendor decoder. Note this differs from the
              Wave/Wave Plus combined packet, where byte 0 is reserved and
              ambient light sits at byte 2.
          - offset: 2
            length: 2
            name: "temperature"
            type: "uint16"
            scale: 0.01
            value_offset: -273.15
            unit: "°C"
            notes: "Centikelvin on the wire: °C = raw/100 - 273.15 (wavemini-reader)."
          - offset: 4
            length: 2
            name: "pressure"
            type: "uint16"
            scale: 0.02
            unit: "hPa"
            notes: "raw/50 hPa per airthings-ble; wavemini-reader ignores this field."
          - offset: 6
            length: 2
            name: "humidity"
            type: "uint16"
            scale: 0.01
            unit: "%RH"
          - offset: 8
            length: 2
            name: "voc"
            type: "uint16"
            unit: "ppb"
            notes: >
              wavemini-reader's docstring says ppm, but the Airthings app,
              airthings-ble/Home Assistant, and this family's own UI
              thresholds (griffin_ui_settings: VOC yellow/red 250/2000)
              all treat the raw count as ppb.

      - uuid: "b42e3ef4-ade7-11e4-89d3-123b93f75cba"
        name: "ASRACP (Air Sensor Read Access Control Point)"
        properties: ["write", "indicate"]
        notes: >
          Access control point. Confirmed by Airthings/airthings-ble
          (COMMAND_UUID_WAVE_MINI) and ESPHome
          (ACCESS_CONTROL_POINT_CHARACTERISTIC_UUID).

      # The Mini also exposes the standard temperature (2A6E) and humidity
      # (2A6F) characteristics. They are declared ONCE, with their full byte
      # layout, under the Environmental Sensing Service (0x181A) below —
      # duplicate bare stubs used to live here and shadowed the real
      # declarations for consumers resolving first match.

  # === View Plus Service ===
  # NOTE: b42e77de-… was previously nested here as a *characteristic*, but it is
  # the Hub/Bridge device's primary SERVICE UUID, not a characteristic of View
  # Plus. It is already recorded machine-readably in
  # device.identification.service_uuids and device.discovery, so the fact is
  # preserved; it is restated here because a service with no recovered
  # characteristics cannot currently be expressed as a `services` entry (the
  # schema makes `characteristics` required with minItems 1).
  - uuid: "b42e90a2-ade7-11e4-89d3-123b93f75cba"
    name: "View Plus Air Sensor Service"
    variants: ["View Plus"]
    notes: >
      Sibling service: b42e77de-ade7-11e4-89d3-123b93f75cba is the Airthings
      Hub/Bridge device's primary service UUID.
      View Plus's own ASR/ASRACP characteristic UUIDs were not extracted from the
      app; the family shares the ASR/ASRACP profile documented on the Wave and
      Wave Plus services above, but the View Plus UUIDs are unconfirmed and are
      deliberately not guessed here.
    # No characteristics: View Plus's own ASR/ASRACP UUIDs were never recovered.
    # This service therefore cannot validate against the current schema, which
    # requires `characteristics` with minItems 1. Left deliberately incomplete
    # rather than populated with guessed or borrowed UUIDs. See the PR body.

  # === Product Provisioning (Albatross) ===
  - uuid: "b42eb4a6-ade7-11e4-89d3-123b93f75cba"
    name: "Product Provisioning Service"
    variants: ["View Plus"]
    notes: >
      WiFi and BLE provisioning for View Plus (Albatross).
      Handles WiFi scanning, region configuration, Smartlink setup,
      connectivity mode switching, and firmware bundle version queries.
    characteristics:
      - uuid: "b42eb73a-ade7-11e4-89d3-123b93f75cba"
        name: "WiFi Scan"
        properties: ["write", "notify"]
        notes: "WiFi network scanning and results."
      - uuid: "b42eb9f6-ade7-11e4-89d3-123b93f75cba"
        name: "WiFi Status / Region"
        properties: ["write", "notify"]
        notes: "WiFi connection status and region configuration."
      - uuid: "b42ebc9e-ade7-11e4-89d3-123b93f75cba"
        name: "Connectivity Mode / TX Power"
        properties: ["write", "notify"]
        notes: "Switch between BLE and WiFi connectivity modes."

  # === Standard BLE Services (all models) ===
  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    name: "Device Information Service"
    characteristics:
      - uuid: "00002a26-0000-1000-8000-00805f9b34fb"
        name: "Firmware Revision String"
        properties: ["read"]
      - uuid: "00002a29-0000-1000-8000-00805f9b34fb"
        name: "Manufacturer Name String"
        properties: ["read"]
      - uuid: "00002a24-0000-1000-8000-00805f9b34fb"
        name: "Model Number String"
        properties: ["read"]
      - uuid: "00002a25-0000-1000-8000-00805f9b34fb"
        name: "Serial Number String"
        properties: ["read"]
      - uuid: "00002a27-0000-1000-8000-00805f9b34fb"
        name: "Hardware Revision String"
        properties: ["read"]
      - uuid: "00002a28-0000-1000-8000-00805f9b34fb"
        name: "Software Revision String"
        properties: ["read"]
      - uuid: "00002a23-0000-1000-8000-00805f9b34fb"
        name: "System ID"
        properties: ["read"]

  - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
    name: "Battery Service"
    characteristics:
      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "Battery Level"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 1
            name: "battery_percent"
            type: "uint8"
            unit: "%"

  # These five were filed directly in `services` although they are
  # characteristics (they carry `properties`/`format`, not `characteristics`).
  # They are re-nested below under the Bluetooth SIG services that define them.
  # NOTE: the two parent service UUIDs are the SIG-standard owners of these
  # characteristic UUIDs, not values observed on the device.
  - uuid: "0000181a-0000-1000-8000-00805f9b34fb"
    name: "Environmental Sensing Service"
    notes: >
      Bluetooth SIG standard Environmental Sensing Service (0x181A), the defined
      owner of the temperature/humidity/pressure/dew-point characteristics below.
      The service UUID is inferred from the SIG assignment rather than captured;
      the characteristic UUIDs themselves came from the decompiled app.
    characteristics:
      - uuid: "00002a6e-0000-1000-8000-00805f9b34fb"
        name: "Temperature Characteristic"
        properties: ["read", "notify"]
        notes: "Standard BLE temperature. Available on most models (including Wave Mini) as individual characteristic. Sole declaration of this UUID."
        format:
          - offset: 0
            length: 2
            name: "temperature"
            type: "int16"
            scale: 0.01
            unit: "°C"

      - uuid: "00002a6f-0000-1000-8000-00805f9b34fb"
        name: "Humidity Characteristic"
        properties: ["read", "notify"]
        notes: "Standard BLE humidity. Available on most models (including Wave Mini). Sole declaration of this UUID."
        format:
          - offset: 0
            length: 2
            name: "humidity"
            type: "uint16"
            scale: 0.01
            unit: "%RH"

      - uuid: "00002a6d-0000-1000-8000-00805f9b34fb"
        name: "Pressure Characteristic"
        properties: ["read", "notify"]
        notes: >
          Standard BLE pressure (SIG: uint32, 0.1 Pa resolution). Available
          on Wave Plus. The scale below yields hPa (= mbar) directly:
          0.1 Pa = 0.001 hPa. This matches the vendor app, which decodes
          this characteristic as uint32 LE / 1000
          (DeviceDataTypes.pressureInSIFromCurrentCharacteristic).
        format:
          - offset: 0
            length: 4
            name: "pressure"
            type: "uint32"
            scale: 0.001
            unit: "hPa"

      - uuid: "00002a7b-0000-1000-8000-00805f9b34fb"
        name: "Dew Point Characteristic"
        properties: ["read", "notify"]
        notes: "Standard BLE dew point. Available on Wave Plus."
        format:
          - offset: 0
            length: 2
            name: "dew_point"
            type: "int16"
            scale: 0.01
            unit: "°C"

  - uuid: "00001805-0000-1000-8000-00805f9b34fb"
    name: "Current Time Service"
    notes: >
      Bluetooth SIG standard Current Time Service (0x1805), the defined owner of
      the Current Time characteristic below. Service UUID inferred from the SIG
      assignment rather than captured.
    characteristics:
      - uuid: "00002a08-0000-1000-8000-00805f9b34fb"
        name: "Current Time"
        properties: ["read", "write"]
        notes: "Device RTC. Write to set device clock."

  # === TI OAD Firmware Update Service ===
  - uuid: "f000ffc0-0451-4000-b000-000000000000"
    name: "TI OAD Firmware Update Service"
    notes: "Texas Instruments Over-the-Air Download service for firmware updates. Available on most models."
    characteristics:
      - uuid: "f000ffc2-0451-4000-b000-000000000000"
        name: "OAD Image Block Request"
        properties: ["write"]
        notes: "Write firmware image blocks."
      - uuid: "f000ffc1-0451-4000-b000-000000000000"
        name: "OAD Image Notify"
        properties: ["notify"]
        notes: "Notification channel for OAD status."
      - uuid: "f000ffc5-0451-4000-b000-000000000000"
        name: "OAD Image Control"
        properties: ["write", "notify"]
        notes: "Control OAD transfer (start, abort, commit)."
      - uuid: "f000ffc3-0451-4000-b000-000000000000"
        name: "OAD Image Count"
        properties: ["read"]
        notes: "Number of firmware images available."

commands:
  # ASRACP commands (common across all models)
  report_measurements:
    description: "Request stored measurement records from a sensor dataset."
    characteristic: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
    format_A:
      - byte: 0
        value: "0x01"
        description: "Opcode: Report Measurements"
      - byte: 1
        name: "operator"
        values:
          - "0x01": "All records"
          - "0x02": "All records below threshold"
          - "0x03": "All records above threshold"
          - "0x04": "All records within range"
          - "0x05": "First record"
          - "0x06": "Last record"
      - byte: 2
        name: "flags"
        description: "Indicate which optional fields to include"
      - byte: 3
        name: "sensor_index"
        description: "Sensor index (0-13 per device)"

  delete_measurements:
    description: "Delete stored measurement records."
    characteristic: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
    value: [0x02, 0x01]

  abort_operation:
    description: "Abort current ASRACP operation."
    characteristic: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
    value: [0x03]

  count_measurements:
    description: "Count available measurement records."
    characteristic: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
    template: [0x04, "{sensor_index}"]
    parameters:
      sensor_index: { type: "uint8", min: 0, max: 13 }

  set_time:
    description: "Set device real-time clock."
    characteristic: "b42e24fa-ade7-11e4-89d3-123b93f75cba"
    template: [0xF8, 0x0D, "{year_lsb}", "{year_msb}", "{month}", "{day}", "{hours}", "{minutes}", "{seconds}"]
    parameters:
      year_lsb: { type: "uint8" }
      year_msb: { type: "uint8" }
      month: { type: "uint8", min: 1, max: 12 }
      day: { type: "uint8", min: 1, max: 31 }
      hours: { type: "uint8", min: 0, max: 23 }
      minutes: { type: "uint8", min: 0, max: 59 }
      seconds: { type: "uint8", min: 0, max: 59 }

  # === "Griffin" direct command set (Wave Gen 2 / Wave Plus firmware
  # G-BLE >= 1.2.1) ===
  # Multiplexed onto the same ASRACP characteristic (Wave Gen 2: b42e50d8,
  # Wave Plus: b42e2d06) as the legacy opcodes above. Every response is an
  # indication that echoes the opcode at byte 0 followed by a status byte
  # (0x00 = success; ToDataSetInfo surfaces non-zero as "ASRACP error
  # code"). All commands below except region reads were observed in the
  # HCI capture (firmware G-BLE-2.2.3). Firmware older than G-BLE-1.3.0
  # wraps the same operations in a passthrough envelope instead:
  # [0x71, 0x54] for dataset info, [0x71, 0x53, 0x01, 0x00] for clock read,
  # [0x71, 0x52, 0x01, 0x00, 0x00, 0x00, time_u32le x4] for clock set
  # (PassThrough.java; responses carry the same 0x71 header, one byte
  # longer than the direct responses).

  griffin_self_check:
    description: >
      Self check / device info. Response (30 bytes max):
      [0x6D, status, uptime_u32le, device_type, reserved, msp_version (2B),
      ...]. device_type: 0=unknown, 1=Wave 2, 2=Wave Plus, 3=Wave Mini.
      Capture: response byte 6 was 0x01 (WAVE2), uptime ~14 h.
      Long-capture observations on the undocumented tail (all MEDIUM):
      bytes 24-25 u16le incremented across app sessions (45, 46, 47, 49 —
      a connection counter?); bytes 26-27 u16le held 0x0A4F = 2639, the
      same value the ASR history block carries where 0.01-scaled radon
      (26.39 Bq/m³) fits; bytes 28-29 u16le held 0x0009, equal to the
      advertisement flags word.
    characteristic: "b42e50d8-ade7-11e4-89d3-123b93f75cba"
    value: [0x6D]

  griffin_get_dataset_info:
    description: >
      Dataset (history buffer) info. Request carries a dataset offset byte.
      Response after the 2-byte header: base_time u32le (unix seconds;
      all-0xFF = none), dataset_number u8, slot_count u8, session_id u16le,
      then TWO u16le both equal to the record count (23,23 later 24,24 in
      the long capture; possibly record_count plus last-record sequence).
      Long-capture behavior: slot_count is the number of completed 5-minute
      slots in the pending hour — it read 3, then 8 after ~26 more minutes,
      then 11, tracking wall clock at one per 300 s and wrapping each hour
      as record_count increments (records are hourly rollups). base_time
      stayed fixed at the device's boot/reset time. NOTE: opcode 0x02
      collides with the legacy "delete measurements" opcode — on Griffin
      firmware 0x02 means dataset info.
    characteristic: "b42e50d8-ade7-11e4-89d3-123b93f75cba"
    template: [0x02, "{dataset_offset}"]
    parameters:
      dataset_offset: { type: "uint8" }

  griffin_report_measurements:
    description: >
      Fetch the pending-hour history block (capture-verified on
      G-BLE-2.2.3). Same 9-byte shape as the legacy report-measurements
      command, but sent as ATT Write Command (write without response) and,
      on Griffin firmware, byte 1 selects the DATASET rather than a legacy
      operator: the vendor app sent 0x02 immediately after dataset info
      reported dataset_number 2. All remaining bytes zero. The device
      answers with a single 230-byte notification on the ASR
      characteristic (b42e538a — format documented there; needs ATT MTU
      >= 233), followed by an ASRACP indication
      [0x01, 0x00, 0x01, 0x00, 0x00, 0x00] (opcode echo, status,
      likely-block-count u16le, trailing u16 zero). Enable ASR
      notifications and ASRACP indications first.
    characteristic: "b42e50d8-ade7-11e4-89d3-123b93f75cba"
    template: [0x01, "{dataset_number}", 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
    parameters:
      dataset_number: { type: "uint8", description: "Dataset to read; use dataset_number from griffin_get_dataset_info (0x02 in capture)." }

  griffin_get_current_date:
    description: >
      Read device clock. Response is exactly 10 bytes:
      [0x74, status, reserved (4B), unix_time u32le].
    characteristic: "b42e50d8-ade7-11e4-89d3-123b93f75cba"
    value: [0x74]

  griffin_set_current_date:
    description: "Set device clock to unix time (seconds, little-endian)."
    characteristic: "b42e50d8-ade7-11e4-89d3-123b93f75cba"
    template: [0x73, "{time_u32le_b0}", "{time_u32le_b1}", "{time_u32le_b2}", "{time_u32le_b3}"]
    parameters:
      time_u32le_b0: { type: "uint8" }
      time_u32le_b1: { type: "uint8" }
      time_u32le_b2: { type: "uint8" }
      time_u32le_b3: { type: "uint8" }

  griffin_read_external_flash_image_version:
    description: >
      Read external flash firmware image version. Response is 6 bytes:
      [0x72, status, major, minor, patch, build]; version string is
      "major.minor.patch" (0xFF = invalid). Requires G-BLE >= 1.2.1.
      Capture: firmware reported external image 2.3.1 alongside BLE
      firmware G-BLE-2.2.3.
    characteristic: "b42e50d8-ade7-11e4-89d3-123b93f75cba"
    template: [0x72, "{image_type}", 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
    parameters:
      image_type: { type: "uint8", description: "Firmware image selector; 0x01 in capture." }

  griffin_ui_settings:
    description: >
      Read/write UI settings. Sub-command byte: 0=GET, 1=SET,
      2=SET_TO_DEFAULT. GET response after the 2-byte header:
      humidity upper-yellow u8, upper-red u8, lower-yellow u8, lower-red u8
      (%RH), radon yellow/red u16le (Bq/m³), VOC yellow/red u16le (ppb),
      CO₂ yellow/red u16le (ppm), then a settings byte (lower nibble =
      light setting, upper nibble = sound setting) and an indicator byte
      (lower nibble = alive-indicator, upper nibble bit 0 = alarm,
      bit 1 = B2C). Capture GET returned defaults: radon 100/150,
      VOC 250/2000, CO₂ 800/1000, humidity 25/30/60/70.
    characteristic: "b42e50d8-ade7-11e4-89d3-123b93f75cba"
    template: [0x66, "{sub_command}"]
    parameters:
      sub_command: { type: "uint8", min: 0, max: 2 }

  griffin_region:
    description: >
      RF region commands (not exercised in the capture): 0x76 = set region
      null, 0x77 = set EU, 0x78 = set North America, 0x79 = get region.
    characteristic: "b42e50d8-ade7-11e4-89d3-123b93f75cba"
    value: [0x79]

security:
  bonding: "optional"
  pairing: "optional"
  encryption: "optional"
  authentication: "unknown"
  notes: >
    Standard BLE GATT connection — no mandatory bonding or pairing for
    reading sensor data. HCI capture of a full vendor-app session
    (airthings_2950_wave_capture.pcapng) shows no SMP traffic at all:
    combined-data reads, DIS reads, and every ASRACP write (Griffin
    command set, including clock set and UI settings) ran unauthenticated
    over an unencrypted link. The 44-minute long capture (four app
    sessions, including the full history readout) likewise contains zero
    SMP traffic. Whether the legacy ATCommandSetFrame
    challenge-response path (AT+CHALLENGE, AT+CMD) gates any additional
    operations remains unconfirmed — it was not exercised in the capture.

timing:
  connect_delay_ms: 500
  connect_timeout_ms: 10000
  scan_timeout_s: 60
  notes: >
    Capture-observed cadence (Wave Gen 2, G-BLE-2.2.3): environment sensors
    (temperature/humidity/ambient light) sample every 300 seconds; twelve
    5-minute slots roll up into one stored hourly record (dataset
    record_count advanced once per hour, slot counter 0-11 in dataset
    info). For ~20 seconds after each 5-minute sample the advertisement
    raises a flags bit (see identification.manufacturer_data), so a
    passive scanner can wake on new data instead of polling. Radon is
    exposed as 24 h / long-term averages and updates on the hourly tick.
    Sensor read via BLE is real-time upon connection + notification enable.

# Radon entities carry no device_class. Home Assistant has no radon class,
# and the previous claim of `volatile_organic_compounds_parts` was actively
# wrong: radon in Bq/m³ is a radioactivity concentration, not a chemical
# concentration, and a class-driven consumer would band, convert or chart it
# as VOC ppb. The unit plus `mdi:radioactive` say what it is.
#
# One logical reading appears once per variant-specific binding (same display
# name, different `state_characteristic`, disjoint `variants`): the dedicated
# radon characteristics live on the Gen 1 service only, while Wave Gen 2 and
# Wave Plus report radon inside their model-specific combined packet. A
# consumer keyed on discovered characteristics naturally picks the one binding
# the connected unit actually has.
entities:
  - platform: "sensor"
    name: "Radon 24h Average"
    icon: "mdi:radioactive"
    unit: "Bq/m³"
    state_characteristic: "b42e01aa-ade7-11e4-89d3-123b93f75cba"
    variants: ["Wave (Gen 1)"]
    notes: >
      Previously also claimed for Wave Plus, but this characteristic lives on
      the Gen 1 air sensor service (b42e1f6e) and was never confirmed on Plus
      hardware — the vendor app reads Plus radon from the combined packet,
      which the Wave Plus entity below now binds.

  - platform: "sensor"
    name: "Radon Long-Term Average"
    icon: "mdi:radioactive"
    unit: "Bq/m³"
    state_characteristic: "b42e0a4c-ade7-11e4-89d3-123b93f75cba"
    variants: ["Wave (Gen 1)"]

  - platform: "sensor"
