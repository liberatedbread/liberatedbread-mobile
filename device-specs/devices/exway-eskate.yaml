    notes: "Current state is parameter byte 0xc2 (read_parameter_page_12, reply byte 5). Send save_parameters after changing it. The time is set with the standby_time_* commands."
  - platform: "switch"
    name: "Tail Light"
    variants: ["Wave"]
    command_characteristic: "0000f1f1-0000-1000-8000-00805f9b34fb"
