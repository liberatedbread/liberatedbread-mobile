      turn_off: "tail_light_off"
    notes: "Current state is parameter byte 0xd7 (read_parameter_page_13, reply byte 10). Takes effect without a save in the app."
  - platform: "switch"
    name: "Brake Light"
    variants: ["Wave"]
    command_characteristic: "0000f1f1-0000-1000-8000-00805f9b34fb"
    commands:
      turn_on: "brake_light_on"
      turn_off: "brake_light_off"
    notes: "Current state is parameter byte 0xd5 (read_parameter_page_13, reply byte 8)."
  - platform: "switch"
    name: "Safe Mode"
    command_characteristic: "0000f1f1-0000-1000-8000-00805f9b34fb"
    commands:
      turn_on: "safe_mode_on"
      turn_off: "safe_mode_off"
    notes: "Advanced. Current state is parameter byte 0x94 (read_parameter_page_09, reply byte 7); the gear cap is 0x95 (reply byte 8), set with safe_mode_max_gear_*. Send save_parameters after changing it."
  - platform: "switch"
    name: "Cruise Control"
    variants: ["X1 Pro", "X1 Max", "X1 Skate", "Flex SE", "Flex (2022)", "Flex", "Atlas"]
    command_characteristic: "0000f1f1-0000-1000-8000-00805f9b34fb"
    commands:
      turn_on: "cruise_control_on"
      turn_off: "cruise_control_off"
    notes: "Advanced. Current state is parameter byte 0x98 (read_parameter_page_09, reply byte 11). The app hides this for the Wave."
  - platform: "switch"
    name: "Free Mode"
    command_characteristic: "0000f1f1-0000-1000-8000-00805f9b34fb"
    commands:
      turn_on: "free_mode_on"
      turn_off: "free_mode_off"
    notes: "Advanced. Current state is parameter byte 0x97 (read_parameter_page_09, reply byte 10)."
  - platform: "switch"
    name: "Gear Change While Moving"
    command_characteristic: "0000f1f1-0000-1000-8000-00805f9b34fb"
    commands:
      turn_on: "gear_change_while_moving_on"
      turn_off: "gear_change_while_moving_off"
    notes: "Advanced. Current state is parameter byte 0x96 (read_parameter_page_09, reply byte 9)."
  - platform: "button"
    name: "Save Settings"
    command_characteristic: "0000f1f1-0000-1000-8000-00805f9b34fb"
    commands:
      press: "save_parameters"
    notes: "Commits parameter memory to flash, as the app does after a settings change."

protocol_details:
  framing:
    description: >
      Request = [head][arguments][c], c = low byte of CRC-16/MODBUS over
      every preceding byte of the request (reflected polynomial 0xA001,
      init 0xFFFF, no final xor; the check value for ASCII "123456789" is
      0x4B37, so c would be 0x37). All multi-byte values are big-endian.
      Replies end the same way unless reply_lengths says otherwise. The app
      computes the full 16-bit CRC and keeps only its low byte; a client
      that appends both bytes sends a frame one byte too long.
    request_shapes:
      short: "[head][arg high][arg low][c] - 4 bytes. Heads 0xb4, 0x92, 0x90 (arg fixed 0xf0 0x0f), 0xb0 and 0x76 (arg 0x0000), 0xb2 ([0xb2][target][0x00][c])."
      parameter_read: "[0x74][address high][address low][length high][length low][0x00][0x00][c] - 8 bytes. The app reads 16 bytes at a time, pages 0-15 (address = page x 16), 15 ms apart."
      parameter_write_1_byte: "[0x75][address high][address low][value][c] - 5 bytes. Used for single-byte settings."
      parameter_write_2_bytes: "[0x75][address high][address low][value high][value low][c] - 6 bytes. The app uses this width for addresses 146, 154-193, 196 and 199."
      parameter_write_block: "[0x75][address high][address low][16 data bytes][c] - 20 bytes. The app's bulk settings write: 70 bytes from address 148 in 16-byte blocks, each echoed back verbatim, retried up to 20 times 200 ms apart, then a save."
    reply_lengths:
      - heads: [0x91, 0x92, 0xb4, 0x14, 0x54]
        length: 20
        check: "low CRC byte of bytes 0-18 at byte 19 (an 8-byte form with the check at byte 7 is also accepted by the app's splitter)"
      - heads: [0x74, 0x75]
        length: "4 + data length (20 for a 16-byte page)"
        check: "low CRC byte of all preceding bytes, last; byte 1 must be 0x00"
      - heads: [0xb1, 0xb3, 0x76, 0x77, 0x11, 0x12, 0x13, 0x19, 0x1a, 0x51, 0x52, 0x53, 0x59, 0x5a]
        length: 4
        check: "low CRC byte of bytes 0-2 at byte 3"
      - heads: [0x01]
        length: "4 or 13, depending on byte 1"
        check: "ESC pass-through replies (full CRC low then high on the 4-byte form, low CRC byte on the 13-byte form); not used by anything declared here"
      - heads: [0x30]
        length: 5
        check: "full CRC of bytes 0-2, low then high; ESC update path"
      - heads: [0xac]
        length: 25
        check: "full CRC of bytes 0-22, low then high; role unknown, nothing in the app reads it"
    splitter_notes: >
      The app buffers every notification in a ring buffer and cuts frames by
      head and the lengths above, discarding bytes up to the next known head
      when it cannot. When a frame arrives exactly one byte short it
      appends the byte it expected; a client should simply wait for the next
      notification instead.
  heads:
    description: "Head bytes seen in the app, by role. Only the first group is declared as commands."
    declared:
      "0xb0 / 0xb1": "Heartbeat and receiver-mode query / reply."
      "0x90 / 0x91": "Monitor (live telemetry) request / 20-byte reply."
      "0x92": "Battery page request and reply (pages 0 and 1)."
      "0xb4": "Receiver information page request and reply (pages 0-4)."
      "0x74": "Parameter memory read and reply."
      "0x75": "Parameter memory write and echo."
      "0x76": "Save parameters and reply."
      "0xb2 / 0xb3": "Mode change request / reply (only target 0x70 is declared)."
    known_not_declared:
      "0x77": "Restore defaults. Defined and recognised in replies, but this app build never sends it; its \"Restore default\" item rewrites the mileage counter instead."
      "0x10 / 0x11": "Receiver bootloader handshake; 0x11 is also the bootloader's answer to the heartbeat."
      "0x12, 0x13, 0x14, 0x15-0x1a": "Receiver bootloader: success, failure, information, link, image, finish, init."
      "0x50 / 0x51": "Remote handshake (the app sends [0x50, 0xff, 0xff, c] as the remote-mode heartbeat)."
      "0x52-0x5a": "Remote bootloader: success, failure, information (0x54), link, image, finish, init."
      "0x01": "ESC pass-through with a Modbus-like shape and a full two-byte CRC (low byte first). The app uses it on the ESC update path and to read ESC information in 8-byte pages; its request bytes are not reproduced here."
      "0x30, 0x98, 0x99": "ESC image transfer and its success/failure answers."
      "0xa8": "Named for an older \"1.0\" protocol handshake; unused on the paths read."
  mode_change:
    description: >
      [0xb2][target][0x00][c]; reply [0xb3][target][status][c]. The target
      says which part of the board the receiver talks to on the app's
      behalf. Status 0x00 = accepted; 0x01 = a second outcome the app
      returns without naming; anything else = refused. Before switching the
      app heartbeats for up to one second until the receiver answers 0xb1.
      After switching to an ESC it heartbeats that ESC and resets it.
    targets:
      "0x70": "Receiver application (\"setting mode\"): the normal state. Declared as select_setting_mode."
      "0x10": "Receiver bootloader. Not declared."
      "0x50": "Handheld remote (the app reads the remote's information and updates it this way). Not declared."
      "0x31": "ESC 1. Not declared."
      "0x32": "ESC 2 on dual-drive boards. Not declared."
    app_internal_codes: "The app also tracks 0x98 (receiver answered from its bootloader) and 0x99 (not known yet); they are never sent."
  parameter_memory:
    description: >
      256 bytes read in 16-byte pages with 0x74 and written with 0x75. Byte
      values unsigned unless stated; multi-byte values big-endian. "Declared"
      names the commands in this spec; "left out" means documented for
      reading only. Widths of the identifier blocks in the low pages are
      inferred from the spacing between addresses.
    map:
      - {address: 0, width: 1, meaning: "first-initialisation flag", status: "read only"}
      - {address: 1, width: 1, meaning: "launch mode", status: "read only; values not recorded"}
      - {address: 2, width: 1, meaning: "voltage-adjust status", status: "read only"}
      - {address: 3, width: 1, meaning: "voltage-adjust value", status: "read only"}
      - {address: 7, width: 16, meaning: "remote information slot 0 (further slots at 23, 39, 55, 71)", status: "read only; per-unit data"}
      - {address: 87, width: 12, meaning: "hardware code", status: "read only; per-unit data"}
      - {address: 99, width: 12, meaning: "a second unit code", status: "read only; per-unit data"}
      - {address: 111, width: 1, meaning: "activation status", status: "read only"}
      - {address: 112, width: 4, meaning: "factory timestamp", status: "read only"}
      - {address: 116, width: 4, meaning: "activation timestamp", status: "read only"}
      - {address: 120, width: 1, meaning: "remote pairing status", status: "read only"}
      - {address: 121, width: 6, meaning: "paired remote's radio address", status: "read only; per-unit data"}
      - {address: 133, width: 1, meaning: "remote radio frequency or channel", status: "read only"}
      - {address: 145, width: 1, meaning: "pairing count", status: "read only"}
      - {address: 146, width: 2, meaning: "legacy mileage counter, uint16, 0.1 km", status: "read (read_legacy_mileage); writes left out"}
      - {address: 148, width: 1, meaning: "safe mode, 1 = on", status: "declared, advanced"}
      - {address: 149, width: 1, meaning: "safe mode's highest gear, 1-4", status: "declared, advanced"}
      - {address: 150, width: 1, meaning: "gear change while moving, 1 = allowed", status: "declared, advanced"}
      - {address: 151, width: 1, meaning: "free mode (reverse spin), 1 = on", status: "declared, advanced"}
      - {address: 152, width: 1, meaning: "cruise control, 1 = available", status: "declared, advanced"}
      - {address: 153, width: 1, meaning: "advanced mode: 0 default, 1 novice, 2 race, 3 custom (the app writes a preset table into 154-193 for 0-2)", status: "left out"}
      - {address: 154, width: 8, meaning: "speed limit, gears 1-4, four uint16; percent = raw / 20450 x 100", status: "left out"}
      - {address: 162, width: 8, meaning: "acceleration curve, gears 1-4, four uint16; percent = raw / 31000 x 100", status: "left out"}
      - {address: 170, width: 8, meaning: "brake curve, gears 1-4, four uint16; percent = raw / 20400 x 100", status: "left out"}
      - {address: 178, width: 8, meaning: "acceleration current limit, gears 1-4, four uint16; percent = raw / 5120 x 100", status: "left out"}
      - {address: 186, width: 8, meaning: "brake current limit, gears 1-4, four uint16; percent = raw / 5120 x 100", status: "left out"}
      - {address: 194, width: 1, meaning: "standby timer, 1 = on", status: "declared"}
      - {address: 195, width: 1, meaning: "standby time in hours: 2, 24, 48 or 168", status: "declared"}
      - {address: 196, width: 2, meaning: "turbo: bit 0 = on; the app shows raw / 8192 x 100 as a percentage (0-100 in 25 % steps)", status: "left out (the app says it unlocks the top speed limit)"}
      - {address: 198, width: 1, meaning: "wheel size: millimetres (70-200), except on X1 Skate and X1 Pro at or below SE-01.01.10 where it is an index 0/1/2 = 80/83/85 mm", status: "left out (feeds the computed speed)"}
      - {address: 199, width: 2, meaning: "power system: 0 = hub motor, 1 = Riot; the app says to power-cycle after changing it", status: "left out"}
      - {address: 201, width: 1, meaning: "light brightness, 1-20 in the app", status: "read only here (no fixed command; see framing to build one)"}
      - {address: 202, width: 1, meaning: "reserved", status: "read only"}
      - {address: 203, width: 1, meaning: "mileage-counter flag: 0x5a = the 32-bit counter at 204 is in use", status: "read only"}
      - {address: 204, width: 4, meaning: "total mileage counter, uint32, 0.1 km", status: "read (read_total_mileage); writes left out"}
      - {address: 208, width: 1, meaning: "light animation: 0 throttle, 1 comet, 2 breath, 3 colour breath, 4 steady, 5 none", status: "declared"}
      - {address: 209, width: 1, meaning: "light animation speed, 1-20 in the app", status: "read only here"}
      - {address: 210, width: 3, meaning: "light colour, red, green, blue bytes", status: "read only here"}
      - {address: 213, width: 1, meaning: "brake light, 1 = on", status: "declared"}
      - {address: 214, width: 1, meaning: "a third light switch; the app's constants call it the turn light and its light model calls it the headlight", status: "read only"}
      - {address: 215, width: 1, meaning: "tail light, 1 = on", status: "declared"}
      - {address: 216, width: 1, meaning: "drive gear tooth count (10-20 in the app)", status: "left out (feeds the computed speed)"}
      - {address: 217, width: 1, meaning: "wheel pulley tooth count (20-80 in the app)", status: "left out (feeds the computed speed)"}
    example_page_12: >
      74 00 c0 00 00 01 02 00 00 5a 00 01 0a 00 00 00 00 00 00 90 decodes
      as: 0xc2 standby on, 0xc3 = 2 h, 0xc6 wheel size 90 mm, 0xc7-0xc8
      power system 1 (Riot), 0xc9 brightness 10, 0xcb 0x00 (legacy mileage
      counter in use). Synthetic values; check byte computed.
  thermistor:
    description: >
      The monitor frame carries the ESC and motor temperatures as 12-bit
      ADC counts. The app converts each to a resistance,
      R = raw x 10000 / (4095 - raw) ohms, then looks the resistance up in a
      descending per-degree table and reports the lower bound of the matching
      one-degree step, from -11 °C up to 199 °C. When no step matches it
      returns -11, which the app shows as "-".
    fitted_curve: >
      Both tables follow a beta-model NTC with B about 3877 K, referenced to
      24 °C (297.15 K): R_ref = 47.0 kohm for the ESC sensor and 10.0 kohm for
      the motor sensor. So T = 1 / (1/297.15 + ln(R / R_ref) / 3877) - 273.15,
      rounded down, reproduces the app's value within about 1 °C across the
      range. The tables themselves are not reproduced.
    derived_points:
      - "ESC, raw 2048 -> 63 °C in the app (the fitted curve gives 64.0)"
      - "ESC, raw 3000 -> 36 °C (fit 36.8)"
      - "Motor, raw 2048 -> 23 °C (fit 24.0)"
      - "Motor, raw 1000 -> 52 °C (fit 52.2)"
  timing:
    heartbeat_interval_ms: 300
    mileage_poll: "every 50th heartbeat, about 15 s"
    monitor_poll: "back to back while the dashboard is open, one request outstanding; the heartbeat loop stops meanwhile and resumes 100 ms after"
    reply_timeout_ms: 500
    save_timeout_ms: 1500
    page_gap_ms: 15
    notes: "All from the vendor app; none measured on hardware."
  unused_monitor_layout: >
    The app also carries a decoder for a 25-byte monitor frame (head 0x90 or
    0x91) with a different layout (direction, gear, battery percent, two
    per-ESC speeds, voltage, current / 64, ESC and motor temperatures as
    signed degrees, trip, a 24-bit odometer and a status word). Only a
    connection opened in a "monitor" mode reaches it, and this build never
    opens one, so it is recorded as an unused path rather than declared.
  test_vectors:
    crc: "CRC-16/MODBUS(\"123456789\") = 0x4b37; transmitted check byte 0x37."
    requests:
      heartbeat: "b0 00 00 70"
      request_monitor: "90 f0 0f 75"
      read_parameter_page_09: "74 00 90 00 10 00 00 ee"
      select_setting_mode: "b2 70 00 f4"
    monitor_reply:
      frame: "91 48 44 01 40 08 00 08 00 00 7b 00 00 9b 78 4b 00 f5 01 42"
      decodes_to: >
        speed 18.500 km/h; output_raw 320 (10 after the app's /32); ESC ADC
        2048 (63 °C via the app's table); motor ADC 2048 (23 °C); trip 12.3 km;
        unlabelled counter 0; battery 39.800 V; battery 75 %, not charging;
        battery temperature 24.5 °C; pack code 1; check byte 0x42 (full
        CRC 0x7642). Synthetic values, computed check.
    mode_change_reply:
      frame: "b3 70 00 a5"
      decodes_to: "mode change to 0x70 accepted. Synthetic."
  app_defects:
    - "The app's current-mode lookup launches its query in the background and returns before it finishes, so it can start a session believing the mode is unknown. A client should wait for the heartbeat reply before anything else."
    - "As decompiled, after a write retry the app files the echoed data at the offset given by the first data byte instead of the echoed address, so its cached copy of parameter memory can go wrong until the next full read. A client should re-read the page after writing."
    - "The unused 25-byte monitor decoder builds an 11-item array and the page that shows it reads a twelfth item; it would fail if that path were ever reached."

evidence:
  app_static_analysis: >
    Read the connection service, the constants, the CRC helper, the reply
    splitter, the parameter-image helper, the settings list and its adapter,
    the lighting and dashboard pages, and the app class that configures the
    BLE library (service 0000f1f0, write 0000f1f1, notify 0000f1f2, extra
    service 0000f2f0; MTU 150). Many request routines are Kotlin coroutines
    that did not decompile to source; the heartbeat, the command builders,
    the mode change, the info fetch, the reply splitter and the save were
    read from a second decompilation pass that prints the bytecode as
    best-effort code. No AES or other cipher is used anywhere in the app's
    own packages; the 28 AES sites counted earlier sit in bundled
    libraries. No bonding call exists. The library's own OTA helper and its
    default UUIDs are never used by the app.
  documentation_review: >
    Exway's Atlas Carbon manual (power button three seconds, eight-second
    hold for remote pairing mode, two-hour default auto power-off, safety
    warnings), the X1 Riot, Flex (2022)/ER and first-generation Wave
    manuals (image-only), and the ExSkate app guide, which draws the line
    between second-generation boards on the Exway app and third-generation
    hardware (R3 remote, ESC 3.0) on ExSkate.
  open_questions: >
    Whether the board advertises 0000f1f0 and what its default name is.
    What the second monitor distance field, the output field's physical
    unit, the battery "life" and interval fields and the capacity units
    are. Whether a single parameter write takes effect before the save.
    Whether the receiver accepts a second central. What head 0xac carries.
    Which battery each pack code names.
  artifacts:
    - type: "static_analysis"
      artifact: "Exway (com.exway.app) 1.8.1, versionCode 38, Android split APK"
      obtained_via: "third-party APK mirror via apkeep, 2026-09"
      description: >
        Source of every byte fact here. Negative findings: no cipher on the
        frame path, no bonding, no use of the BLE library's OTA helper, and
        the "second ESC service" reading of 0000f2f0 is not supported (it is
        an AT channel).
    - type: "vendor_documentation"
      artifact: "Exway manuals: Atlas Carbon 2WD/4WD, X1 Riot, Flex Hub/Belt (2022) and ER, Wave (first generation); ExSkate app user guide"
      obtained_via: "Exway's Shopify CDN, 2026-09"
      description: "Power button, remote pairing, default standby time, model generations. No protocol content."
    - type: "public_implementation"
      artifact: "aicareles/Android-BLE"
      url: "https://github.com/aicareles/Android-BLE"
      description: "The BLE library under the app; used to separate its default UUIDs from the ones the app configures."

remaining_unknowns:
  - "Whether 0000f1f0 is in the advertisement, and the board's default advertised name."
  - "Physical unit of monitor bytes 3-4 (the app shows it as a percentage of a range constant) and meaning of bytes 11-12."
  - "Units of the battery page's life, charging-interval and capacity fields."
  - "Whether a 0x75 write takes effect immediately, and whether it persists without 0x76."
  - "The reply to save_parameters beyond its head byte (the check routine did not decompile cleanly)."
  - "What status 0x01 in a mode-change reply means."
  - "The firmware update entry sequence, image format and any signature check (left out on purpose, and also not recoverable from the decompile)."
  - "The role of the 25-byte 0xac frame the app's splitter recognises."
  - "Which of 213/214/215 each board model actually has lights on."
  - "Whether the receiver accepts more than one central at a time."
  - "The meaning of launch mode (parameter 1) and voltage adjust (parameters 2-3)."

