      poll: "request_monitor"
  - platform: "sensor"
    name: "Battery"
    device_class: "battery"
    unit: "%"
    state_characteristic: "0000f1f2-0000-1000-8000-00805f9b34fb"
    state_mapping:
      value: "battery_percent"
    commands:
      poll: "request_monitor"
  - platform: "sensor"
    name: "Battery Voltage"
    device_class: "voltage"
    unit: "V"
    state_characteristic: "0000f1f2-0000-1000-8000-00805f9b34fb"
    state_mapping:
      value: "battery_voltage"
    commands:
      poll: "request_monitor"
  - platform: "sensor"
