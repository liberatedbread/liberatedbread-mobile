    # On-air confirmed 2026-08-22 (Govee_<sku>_<mac tail> names, no
    # service UUIDs in the ADV, version-byte-first manufacturer payload):
    - model: "H6076"
      identification: { local_name_prefix: "Govee_H6076" }
    - model: "H607C"
      identification: { local_name_prefix: "Govee_H607C" }
    - model: "H6099"
      identification: { local_name_prefix: "Govee_H6099" }
    # Current SKUs not listed here (H70xx permanent-outdoor generations,
    # H66xx, H1xxx form factors) use the same channel and protocol via the
    # app's generic SKU architecture; add rows as name forms are confirmed.

  setup:
    required: false
    confidence: "high"
    notes: >
      No BLE pairing/bonding for local control. Some units demand the
      application-layer key exchange (AA B1 read 8-byte key — possibly
      only while the physical button is held — then 33 B2 <key> per
      connection); newer firmware may demand the AES session layer
      announced via the BGC-info characteristic (see device notes).
      BLE local control works with no WiFi and no cloud account.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          No provisioning needed for BLE control. Power on, scan, connect,
          write. WiFi onboarding (BLE provisioning frame, command 0x11
          multi-write) is only needed for cloud and LAN-API use.
        ble:
          pairing_required: false
        steps:
          - action: "Power the light and scan for BLE advertisements."
            actor: "client"
          - action: "Connect, enable notifications on …2b11, write commands."
            actor: "client"
          - action: "If writes are ignored, read AA B1 for the device key (hold the physical button if the returned key looks random) and authenticate with 33 B2."
            actor: "client"
    factory_reset:
      applicable: true
      confidence: "low"
      effect: "Clears WiFi credentials and cloud binding (WiFi models) and returns the light to factory defaults."
      description: >
        Not recovered from the app per model. Mains-powered models use the
        near-universal rapid power-cycle pattern; many current models also
        have a physical button hold (typically 5+ seconds until a blink).
        The confirming signal is a self-initiated blink and re-advertising
        as unprovisioned.
      procedures:
        - name: "Power cycle"
          verified: false
          basis: >
            Generic pattern for mains-powered smart lights, consistent with
            Govee's published help text. Not confirmed per model.
          description: >
            Switch the light off and on at the wall in quick succession,
            about a second in each state, watching for a self-initiated
            blink at the end.
          indicator: "Light blinks by itself, then re-advertises as unprovisioned."
          steps:
            - action: "Toggle power rapidly 5 times, roughly one second on and one second off."
              actor: "user"
              expect: >
                Light blinks to confirm reset and re-advertises. If it just
                comes back on unchanged, try three cycles or the physical
                button hold instead.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        BLE control needs no rejoin. WiFi models rejoin the WLAN via the
        BLE provisioning frame; BLE remains usable throughout.
    credentials:
      wifi_passphrase_protection: plaintext
      stored_on_device: ["wifi_credentials"]
      issued_to_client: ["ble_auth_key"]
      notes: >
        On WiFi models the SSID/passphrase travels over the (unbonded) BLE
        link inside the provisioning frame — plaintext at the application
        layer unless the firmware negotiates the AES session layer first.
        BLE-only models exchange no credentials. The optional 8-byte BLE
        auth key is static per device.

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
services:
  - uuid: "00010203-0405-0607-0809-0a0b0c0d1910"
    name: "Govee Light Command Service"
    notes: >
      The shared Govee command profile for every modern light. 20-byte
      fixed packets, byte 19 = XOR of bytes 0-18; multi-packet transfers
      use 0xA3-framed sequences of the same 20-byte packets.
    characteristics:
      - uuid: "00010203-0405-0607-0809-0a0b0c0d2b11"
        name: "Control Write/Notify"
        properties: ["write", "write_without_response", "notify"]
        notes: >
          All command, query, multi-packet and notify traffic. Write ACKs
          echo the command id with payload byte 0 = 0 = OK. Async events
          arrive as 0xEE frames (see device notes). Keep-alive AA 01
          every ~2 s; the heart response also carries battery/charge bits
          on battery models.
        commands:
          power_on:
            description: "Turn on. Packet: [0x33, 0x01, 0x01, 0x00*16, <xor>]"
            encoding: "bytes"
            value: [0x33, 0x01, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x33]
          power_off:
            description: "Turn off. Packet: [0x33, 0x01, 0x00, 0x00*16, <xor>]"
            encoding: "bytes"
            value: [0x33, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x32]
          set_brightness:
            description: "Set brightness 0-100 (percent). Packet: [0x33, 0x04, <val>, 0x00*16, <xor>]"
            encoding: "bytes"
            template: [0x33, 0x04, "{brightness}", 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, "{checksum}"]
            parameters:
              brightness: { type: "uint8", min: 0, max: 100 }
              checksum:
                type: "uint8"
                auto: "xor_checksum"
                checksum_start: 0
                description: "XOR of the preceding 19 frame bytes; encoder-filled, never a control."
          set_color:
            description: >
              Whole-device or masked-segment RGB (sub-mode 0x15).
              Packet: [0x33, 0x05, 0x15, 0x01, <R>, <G>, <B>, 0x00*5,
              <maskLo>, <maskHi>, 0x00*5, <xor>] — the mask sits at
              frame[12..13], five pad bytes after B, exactly where the
              protocol notes' sub-mode 0x15 layout and the kelvin form
              (0x01, FF FF FF, K_hi K_lo, tR tG tB, mask) both place it;
              mask bit n selects segment n; all-ones = whole device. Legacy 15-segment
              hardware uses sub-mode 0x0B: [0x33, 0x05, 0x0B, R, G, B,
              0x00, maskLo, maskHi, …]. Whole-device-only models accept
              sub-mode 0x02: [0x33, 0x05, 0x02, R, G, B, …].
            encoding: "bytes"
            template: [0x33, 0x05, 0x15, 0x01, "{red}", "{green}", "{blue}", 0x00, 0x00, 0x00, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0x00, 0x00, 0x00, "{checksum}"]
            parameters:
              red: { type: "uint8", min: 0, max: 255 }
              green: { type: "uint8", min: 0, max: 255 }
              blue: { type: "uint8", min: 0, max: 255 }
              checksum:
                type: "uint8"
                auto: "xor_checksum"
                checksum_start: 0
                description: "XOR of the preceding 19 frame bytes; encoder-filled, never a control."
          set_color_temperature:
            description: >
              White color temperature in Kelvin (sub-mode 0x15 kelvin
              form). Packet: [0x33, 0x05, 0x15, 0x01, 0xFF, 0xFF, 0xFF,
              <K_hi>, <K_lo>, <tR>, <tG>, <tB>, <mask…>, <xor>] — Kelvin
              big-endian uint16; tR/tG/tB = RGB equivalent of the Kelvin
              value; sub-mode 0x0D is the older whole-device form
              [0x33, 0x05, 0x0D, R, G, B, K_hi, K_lo, Wr, Wg, Wb, …] and
              [0x33, 0x05, 0x15, 0x04, K_hi, K_lo, …] sets Kelvin only.
            encoding: "bytes"
            template: [0x33, 0x05, 0x15, 0x04, "{kelvin_hi}", "{kelvin_lo}", 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, "{checksum}"]
            parameters:
              kelvin_hi:
                type: "uint8"
                min: 0
                max: 255
                notes: "High byte of the big-endian uint16 Kelvin value (app range roughly 2000-9000 K by model)."
              kelvin_lo:
                type: "uint8"
                min: 0
                max: 255
                notes: "Low byte of the Kelvin value."
              checksum:
                type: "uint8"
                auto: "xor_checksum"
                checksum_start: 0
                description: "XOR of the preceding 19 frame bytes; encoder-filled, never a control."
          set_scene:
            description: >
              Apply a built-in scene. Packet: [0x33, 0x05, 0x04, <id_lo>,
              <id_hi>, 0x00*14, <xor>]. Built-ins: 1=sunset, 4=movie,
              5=date, 7=romantic, 8=blinking, 9=candlelight, 10=breath,
              15=snow, 16=dynamic, 21=chase, 22=stream.
            encoding: "bytes"
            template: [0x33, 0x05, 0x04, "{scene_lo}", "{scene_hi}", 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, "{checksum}"]
            parameters:
              scene_lo: { type: "uint8", min: 0, max: 255 }
              scene_hi: { type: "uint8", min: 0, max: 255 }
              checksum:
                type: "uint8"
                auto: "xor_checksum"
                checksum_start: 0
                description: "XOR of the preceding 19 frame bytes; encoder-filled, never a control."
          set_music_mode:
            description: >
              Music mode v1 (sub-mode 0x13). Packet: [0x33, 0x05, 0x13,
              <effect>, <sensitivity>, <dynamic>, <fixedColorFlag>, <R>,
              <G>, <B>, 0x00*8, <xor>]. Effects: 0=rhythmPower,
              1=rhythmSoft, 3=rhythm, 4=spectrum, 5=energy, 6=scroll.
              fixedColorFlag 0 = use the RGB that follows, 1 = auto.
              Library-effect models use sub-mode 0x16: [effectCode_lo,
              effectCode_hi, sensitivity]; oldest hardware uses 0x11.
            encoding: "bytes"
            template: [0x33, 0x05, 0x13, "{effect}", "{sensitivity}", "{dynamic}", 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, "{checksum}"]
            parameters:
              effect: { type: "uint8", min: 0, max: 6 }
              sensitivity: { type: "uint8", min: 0, max: 100 }
              dynamic: { type: "uint8", min: 0, max: 1 }
              checksum:
                type: "uint8"
                auto: "xor_checksum"
                checksum_start: 0
                description: "XOR of the preceding 19 frame bytes; encoder-filled, never a control."
          keep_alive:
            description: "Connection keep-alive, every ~2 s. Packet: [0xAA, 0x01, 0x00*17, 0xAB]. Response payload byte 0 = power; byte 1 carries battery band (bits 4-6), charging (bit 3), low-battery (bit 7) on battery models."
            encoding: "bytes"
            value: [0xAA, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xAB]
          get_brightness:
            description: "Query brightness; response payload byte 0 = 0-100. Packet: [0xAA, 0x04, 0x00*17, <xor>]"
            encoding: "bytes"
            value: [0xAA, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xAE]
          get_mode:
            description: >
              Query the current mode; response payload byte 0 = sub-mode,
              and for the colour sub-modes RGB sits at payload 1-3, Kelvin
              big-endian at 4-5, the temperature-equivalent RGB at 6-8 and
              the segment masks after that. Packet:
              [0xAA, 0x05, 0x00*17, <xor>].
              The rest of the after-connect state sync is separate frames:
              AA 01 (power) is the keep_alive frame above, AA 04 is
              get_brightness, and AA 23 with payload 0xFF returns all four
              timer slots.
            encoding: "bytes"
            value: [0xAA, 0x05, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xAF]

      - uuid: "00010203-0405-0607-0809-0a0b0c0d2b12"
        name: "BGC Info (encryption probe)"
        properties: ["read"]
        notes: >
          On service …1910 this characteristic reports the encryption
          version: response byte 0 = 1 → version at byte 1; byte 0 = 2 →
          extended form (version byte 1, flag byte 2). Absent = plaintext
          protocol. NOTE: the same UUID on service …1912 is a different
          thing entirely — the Telink OTA channel.

  - uuid: "00010203-0405-0607-0809-0a0b0c0d1912"
    name: "Govee Telink OTA Service"
    notes: >
      Firmware update channel on Telink-based units (hardware version
      1.xx.xx): write [0x01, 0xFF] to start, fixed-size packets, end
      frame [0x02, 0xFF, <index LE>, <~index LE>, 0x00, 0x00]. Not needed
      for control. Beken (2.01.xx, F000FFC0-…) and Freqchip (3.xx.xx,
      02f00000-…-fe00) OTA profiles exist on other hardware generations.
    characteristics:
      - uuid: "00010203-0405-0607-0809-0a0b0c0d2b12"
        name: "OTA Data"
        properties: ["write", "write_without_response"]

features: []

entities:
  - platform: "light"
    name: "Light"
    features: ["brightness", "color", "color_temperature"]
    commands:
      turn_on: "power_on"
      turn_off: "power_off"
      set_brightness: "set_brightness"
      set_color: "set_color"
      set_color_temperature: "set_color_temperature"

