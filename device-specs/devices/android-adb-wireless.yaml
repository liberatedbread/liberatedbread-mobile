# Android Wireless-ADB Device (mDNS discovery, identify-only) — Device Spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources: AOSP adb source and its adb_wifi.md developer doc (the mDNS service
# type strings and instance-name format). Standards/source-based signature; NO
# vendor assets. This project has no hardware for this spec — testing.status:
# untested; the signature is from public documentation, not a capture.

device:
  name: "Android Device (Wireless Debugging / ADB over Wi-Fi)"
  manufacturer: "Various (Android 11+)"
  manufacturer_status: "active"
  openness:
    status: "open_by_design"
    reverse_engineered: false
    source_code: "https://android.googlesource.com/platform/packages/modules/adb/"
    upstream_docs:
      - url: "https://android.googlesource.com/platform/packages/modules/adb/+/refs/heads/main/docs/dev/adb_wifi.md"
        title: "AOSP adb — adb_wifi.md"
        covers: "mDNS service types (_adb-tls-connect, _adb-tls-pairing, _adb) and the instance-name format"
  testing:
    status: untested
    notes: >
      No hardware exercised by this project. The discovery signature is taken
      from the public AOSP adb source and its adb_wifi.md developer
      documentation, not from a capture of a specific phone. The service types
      are published by adbd itself and are Android-specific, so identification
      rests on the AOSP definition rather than any one device.
  protocol: "wifi"
  category: "other"
  pictogram: "phone"
  integration: "identify_only"
  notes: >
    Android 11 and later advertise their Wireless Debugging (wireless ADB)
    endpoint over mDNS/DNS-SD when the user enables it in Developer options.
    This project does NOT connect to the debug channel or do anything with it —
    there is no web UI and no control surface here. We DISCOVER the device,
    recognise it as an Android phone/tablet with wireless debugging enabled,
    and draw a phone pictogram. Nothing more.

    DNS-SD service types (published by adbd, per AOSP adb_wifi.md):
      _adb-tls-connect._tcp — the TLS connect server, advertised while wireless
        debugging is active. The connect port is DYNAMIC and discovered here,
        not a fixed 5555.
      _adb-tls-pairing._tcp — the pairing server, advertised only during a
        pairing session.
      _adb._tcp — the legacy cleartext service started by `adb tcpip <port>`.
    The service instance name is "adb-" + the device serial (ro.serialno) plus
    a random suffix added by the mDNS backend (e.g. adb-35121FDJH000R8-xyMD0H);
    a QR pairing instance is "studio-"-prefixed and a code pairing instance is
    guid-prefixed. adb mDNS records carry no meaningful TXT data.

    There is no admin_url: wireless ADB is a debug transport, not a web
    console, so there is nothing to deep-link to. The serial is embedded in the
    instance name but carries a random suffix, so the stable key is the mDNS
    hostname and the display name is the advertised instance name.
  identification:
    mdns_service_type: "_adb-tls-connect._tcp.local."

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_adb-tls-connect._tcp.local."
          identity_mapping:
            stable_keys:
              - source: "hostname"
                key: "hostname"
            display:
              source: "name"
      - type: "mdns"
        mdns:
          service_type: "_adb-tls-pairing._tcp.local."
          identity_mapping:
            stable_keys:
              - source: "hostname"
                key: "hostname"
            display:
              source: "name"
      - type: "mdns"
        mdns:
          service_type: "_adb._tcp.local."
          identity_mapping:
            stable_keys:
              - source: "hostname"
                key: "hostname"
            display:
              source: "name"
    identity:
      stable_keys: ["hostname"]
      display: "name"
    static_ip_required: false

  setup:
    required: false
    confidence: high
    notes: >
      Nothing for this app to provision. Wireless debugging is enabled by the
      user on the phone (Developer options → Wireless debugging); once enabled,
      adbd advertises _adb-tls-connect._tcp and the device is discovered
      passively. This app neither pairs nor connects — it only recognises the
      advertisement.
    methods:
      - type: "none"
        verified: false
        description: >
          No provisioning by this app. The user enables Wireless debugging on
          the Android device; discovery is the passive mDNS advertisement of
          _adb-tls-connect._tcp.
    factory_reset:
      applicable: false
      confidence: high
      effect: >
        Not applicable: there is nothing on this app's side to reset. Turning
        wireless debugging off (or revoking pairings) is done on the phone and
        simply withdraws the mDNS advertisement.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Re-enabling wireless debugging re-advertises the service on whatever
        network the phone is on; identity keys on the mDNS hostname, not IP.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        Identify-only: no credential crosses to this app. ADB's own TLS pairing
        (the 6-digit code or QR) is between the phone and whatever debugging
        host the user chooses — not this app.
  pairing:
    required: true
    confidence: medium
    # Above TLS: a SPAKE2-style shared-secret exchange that ends with the
    # host's RSA public key in the phone's adb_keys trust store.
    security_mode: app_layer
    bonding: none
    pin:
      source: device_screen
      length: 6
      notes: >
        The six-digit pairing code, shown on the phone in the "Pair device
        with pairing code" dialog alongside the IP:port of the pairing
        server, and typed into the host (`adb pair <ip>:<port>`). QR pairing
        reverses the direction: the HOST generates the service name and
        password and shows them as a QR code (WIFI:T:ADB;S:<name>;P:<pw>;;)
        that the phone scans. Either way the secret is fresh per session. What
        persists is the host's public key in the phone's trust store
        (/data/misc/adb/adb_keys), which every later TLS connect checks.
    exclusivity:
      single_connection: false
      single_bond: false
      recovery: >
        Nothing to clear: the phone keeps a list of trusted hosts, and pairing
        another adds to it. If a paired host stops connecting, check that
        Wireless debugging is still on — the phone turns it off when it leaves
        the Wi-Fi network it was enabled on — and rediscover the connect port,
        which changes each time wireless debugging is switched on.
    unpair:
      supported: true
      requires_factory_reset: false
      clears: "One paired host's key (from the Wireless debugging paired-devices list), or every authorised host at once."
      notes: >
        Each paired host is listed on the Wireless debugging screen and can be
        forgotten individually. "Revoke USB debugging authorizations" in
        Developer options removes every authorised host key, USB and wireless
        alike. Turning Wireless debugging off stops the listener without
        removing any trust.
    enter_pairing_mode:
      required: true
      indicator: "The phone shows the pairing code and the pairing server's IP:port; _adb-tls-pairing._tcp is advertised while the dialog is open."
      procedures:
        - name: "Pair device with pairing code"
          verified: false
          basis: >
            AOSP's adb_wifi.md (Pairing, pair and Pair with code sections) and
            the Android Developers adb documentation.
          power_state: "on"
          glyph: "generic/on-screen-menu.svg"
          steps:
            - action: "Enable Developer options, then switch on Settings > System > Developer options > Wireless debugging and allow it on this network."
              actor: user
            - action: "Tap 'Pair device with pairing code' and keep the dialog open."
              actor: user
              expect: "A six-digit code and an IP:port are shown."
            - action: "Run the SPAKE2 pairing exchange against the advertised _adb-tls-pairing._tcp port with the code the user types in."
              actor: client
              expect: "Pairing succeeds; the host then connects to _adb-tls-connect._tcp over TLS."
        - name: "Pair device with QR code"
          verified: false
          basis: "AOSP's adb_wifi.md, Pair with QR code section (the scheme Android Studio uses)."
          power_state: "on"
          glyph: "generic/on-screen-menu.svg"
          steps:
            - action: "Generate a 'studio-' service name and a password, and show them as an ADB Wi-Fi QR code."
              actor: client
            - action: "On the phone, in Wireless debugging, tap 'Pair device with QR code' and scan the host's code."
              actor: user
              expect: "The phone starts a pairing server under the requested studio- instance name."
            - action: "Find that instance over mDNS and pair with the password from the QR code."
              actor: client
      notes: >
        The pairing server exists only while the pairing dialog (or QR
        scanner) is open, so the window is however long the user leaves it
        open; no fixed timeout is documented. The pairing-code instance is
        named adb-<guid> and the QR instance studio-<random>. The legacy
        `adb tcpip` route is different: it is authorised over USB by the
        "Allow USB debugging?" RSA-fingerprint prompt and then runs in
        cleartext with no pairing code.
    notes: >
      Wireless debugging (Android 11+) is gated by a real pairing: the user
      opens a pairing session on the phone, a shared secret (the six-digit
      code, or the host's QR password) bootstraps trust over TLS, and the
      phone stores the host's RSA public key. From then on the host
      authenticates every TLS connection with its private key and needs no
      code, until the user forgets it. Entirely local — no account or cloud
      at any step. This project does not pair (identify-only); the block
      describes what any adb host must do. See `credentials.notes`.

local_access:
  status: native
  summary: >
    The device is locally reachable over wireless ADB by any adb host on the
    LAN once paired — deliberately out of scope here; this project only
    identifies the device and does not open the debug channel.

helpful_urls:
  - url: "https://android.googlesource.com/platform/packages/modules/adb/+/refs/heads/main/docs/dev/adb_wifi.md"
    title: "AOSP adb — adb_wifi.md (wireless debugging design)"
    description: "Authoritative mDNS service types and instance-name format for wireless ADB."
  - url: "https://developer.android.com/tools/adb"
    kind: "vendor_support"
    title: "Android Developers — Android Debug Bridge (adb)"
    description: "User-facing wireless debugging (Android 11+): mDNS discovery, pairing code and the dynamic connect port."
