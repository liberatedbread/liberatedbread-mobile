# Bluetooth LED Name Badge device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Bluetooth LED Name Badge"
  manufacturer: "Generic (multiple OEMs)"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "ble"
  category: "display"
  notes: >
    Monochrome LED dot-matrix name badge. Sold under many brands on AliExpress.
    Matrix height 11, 12, or 16 rows; width is variable per text/image content.
    All three heights are fully supported app-side (its data builder handles
    16 rows, and it bundles 16-row font assets ASC16/HZK16/JPK16/KRK16/TWK16).
    Protocol is write-only in practice (no useful reads). Data is written in
    16-byte chunks: a 64-byte header (4 chunks) followed by stripe-major bitmap
    data — the message is split into 8-column-wide stripes of `height` bytes
    each, and each byte is one row of 8 pixels, MSB = leftmost pixel.
    Writes are ACKNOWLEDGED (writeCharacteristic, NOT write_without_response), with a
    3-second per-write ack timeout, 300 ms delay before the first data chunk and 25 ms
    between subsequent chunks. Up to 8 message slots with per-slot flash and marquee.
    NO CRC/checksum anywhere in the send path, and NO length prefix at the BLE write
    level (raw 16-byte chunks). Device stores messages in flash and persists across
    power cycles. No pairing required. The badge only advertises after the user
    enters BLE transfer mode (press the lower button twice; a Bluetooth icon
    shows on the display). Advertised name is filtered by contains("LS")
    (app-confirmed in its scanner and main presenter).
    The vendor app ecosystem is active; this spec is verified against a full
    static analysis of that app.
    NOTE: AliExpress sellers ship mixed generations under the same listings — a
    newer badge generation uses a different, AES-encrypted protocol
    (github.com/timhodson/ble-led-badge), not this "wang"/LSLED one. An open
    replacement firmware for CH582M-based badges exists
    (fossasia/badgemagic-firmware).
    CONFIDENCE: HIGH (full static analysis of the vendor app; cross-checked
    against Elektor Jan/Feb 2023 sniff, Nilhcem, FOSSASIA and Doridian).
    Evidence, by area of the app: its device constants (name "LS", service
    0000fee0, char 0000fee1); its data builder (the 64-byte header
    byte-for-byte, and per-slot length stored big-endian via byte swap); its
    send mode (64-byte header as 4 chunks, bitmap zero-padded into 16-byte
    chunks); its main presenter (300 ms before the first data chunk, 25 ms
    between chunks, 3 s per-write ack timeout); and its BLE service
    (acknowledged writes — the write type is never set to
    write-without-response).
    No CRC/checksum code anywhere in the app; service 0xFEE7 and
    characteristics 0xFEC7-FEC9 are never referenced by the app.
  identification:
    local_name_prefix: "LS"
    service_uuids:
      - "0000fee0-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "LS"
          service_uuids:
            - "0000fee0-0000-1000-8000-00805f9b34fb"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      No provisioning. These badges are widely reported as finicky to connect:
      they accept one central at a time and often need a power cycle between
      clients. This is user-reported, device-side behavior; the vendor app
      contains no connection-management code that bears on it,
      so there is no app-side evidence either way.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          No provisioning step: the badge advertises only after the user puts
          it in BLE transfer mode (press the lower button twice until the
          Bluetooth icon appears on the display) and then accepts a connection
          from any central. There is no account, no network credential exchange
          and no pairing PIN, so a replacement client only has to scan, connect
          and write.
        ble:
          advertised_name: "LS"
          pairing_required: false
        steps:
          - action: "Power the badge, then press the lower button twice to enter BLE transfer mode (Bluetooth icon shows)."
            actor: "user"
            expect: "Badge starts advertising as LSLED (name prefix LS)."
          - action: "Scan for its advertisement and connect."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect and run the documented initialization sequence, if the spec defines one."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        No credential state to clear. Power-cycling drops the current
        connection, which is the actual remedy for the common failure mode:
        the device already being connected to another central.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "Device advertises again and accepts a new connection."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds this device to a network or an owner, so switching
        controllers is just connecting from the new one. If the old client is
        an Android or iOS phone, remove the device from the OS Bluetooth list
        as well — a cached bond can keep the phone reconnecting automatically
        and holding the single available link.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        Anything within radio range can connect and issue commands. Physical
        proximity is the only access control.
  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    exclusivity:
      single_connection: true
      recovery: >
        Close the vendor app, and any other client holding the device,
        before connecting. Nothing needs clearing afterwards — no bond
        is stored on either side.
    enter_pairing_mode:
      required: false
# Custom consumer-side handler: assembles the 64-byte header + stripe-major
# 1-bit bitmap and drives the acknowledged 16-byte chunked writes. Declarative.
protocol_handler: "ledbadge_bitmap"

# 1-bit monochrome bitmap upload (white pixel -> bit 0, any other color -> bit 1).
# Stripe-major layout: message split into 8-column-wide stripes of `height` bytes,
# each byte = one row of 8 pixels, MSB = leftmost pixel. Height = matrix size
# (11/12/16), width variable.
features:
  - type: "image_upload"
    format: "1bit-bitmap"
    max_height: 16
    # One LED is on or off: two colours.
    max_palette_colors: 2
    # The badge's message flash is 8192 bytes for header AND bitmaps
    # together; the ls32 client refuses to write more because doing so
    # damages the display. Bounds the whole transfer, not one 16-byte write.
    max_payload_bytes: 8192

services:
  - uuid: "0000fee0-0000-1000-8000-00805f9b34fb"
    name: "Badge Service"
    characteristics:
      - uuid: "0000fee1-0000-1000-8000-00805f9b34fb"
        name: "Badge Data"
        properties: ["read", "write", "notify"]
        framing:
          length_prefix: false
          max_chunk_size: 16
        notes: >
          GATT properties are read+write+notify (Elektor Table 1, FOSSASIA
          BadgeBLE.md), but reads/notifications return nothing useful — the
          protocol is write-only in practice.
          checksum OMITTED: the device uses NO CRC/checksum (confirmed absent).
          length_prefix false: raw 16-byte chunks with no BLE-level length prefix.
        commands:
          write_badge_data:
            description: >
              The badge's one write: a 64-byte header followed by the
              stripe-major bitmap, sent as a stream of 16-byte acknowledged
              chunks (framing.max_chunk_size), 300 ms before the first data
              chunk and 25 ms between chunks. The template IS the 64-byte
              header with slot 1 parameterised and slots 2-8 empty, then the
              bitmap bytes; a multi-slot upload fills bytes 9-15 and 18-31
              the same way for its other slots. Header layout: bytes 0-3
              magic "wang"; 4 reserved 0; 5 brightness; 6 flash bits (bit N
              = slot N blinks); 7 marquee bits (bit N = slot N gets the
              animated border); 8-15 one speed+mode byte per slot, upper
              nibble speed 0-7 (slowest-fastest; the app shows it as 1-8),
              lower nibble mode; 16-31 per-slot message length, uint16
              BIG-endian, in 8-pixel-wide stripes (= characters for text;
              Elektor's sniff of the vendor app sends 00 07 for "Welcome");
              32-37 zero; 38-43 date year&0xFF, month, day, hour, minute,
              second; 44-62 zero; 63 zero. Bitmap: the message split into
              8-column stripes of `height` bytes (11/12/16), one byte per
              row, MSB = leftmost pixel, 1 = LED on. Sources: the Elektor
              Jan/Feb 2023 article (decompile + sniff of the same vendor
              app), fossasia/badgemagic-firmware BadgeBLE.md, Nilhcem's and
              Doridian's converters, fossasia/led-name-badge-ls32.
              The one thing the vocabulary cannot say: speed and mode share
              byte 8, so `mode` here is the low nibble with the speed nibble
              at 0 (slowest); a handler composing (speed << 4) | mode takes
              the mode table from this parameter and the speed range from
              this note.
            verification: "reported"
            template: [0x77, 0x61, 0x6E, 0x67, 0x00, "{brightness}", "{flash}", "{marquee}", "{mode}", 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, "{length}", 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, "{year}", "{month}", "{day}", "{hour}", "{minute}", "{second}", 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, "{bitmap}"]
            parameters:
              brightness:
                type: "uint8"
                allowed: [0, 16, 32, 64]
                labels: ["100%", "75%", "50%", "25%"]
                default: 0
                description: "Byte 5. The vendor app always writes 0x00; the ls32 client exercises the other three (0x10/0x20/0x40)."
              flash:
                type: "uint8"
                min: 0
                max: 255
                default: 0
                description: "Byte 6: bit N set = slot N blinks."
              marquee:
                type: "uint8"
                min: 0
                max: 255
                default: 0
                description: "Byte 7: bit N set = slot N shows the animated border."
              mode:
                type: "uint8"
                min: 0
                max: 8
                labels: ["scroll left", "scroll right", "scroll up", "scroll down", "fixed", "animation", "snowflake / drop-down", "picture / curtain", "laser"]
                default: 4
                description: "Byte 8, slot 1's animation (low nibble); the speed nibble is 0 in this template. Table from BadgeBLE.md and ls32's --mode help; Elektor's sniff: speed 8 + scroll right = 0x71."
              length:
                type: "uint16"
                endianness: "big"
                min: 0
                max: 65535
                description: "Bytes 16-17: slot 1's message length in 8-pixel stripes = len(bitmap) / height. BIG-endian (Elektor sniff 00 07; Nilhcem, FOSSASIA, Doridian and BadgeBLE.md agree)."
              year:
                type: "uint8"
                min: 0
                max: 255
                default: 0
                description: "Byte 38: year & 0xFF. Every known client sends the current time; whether the badge cares is unverified (see remaining_unknowns)."
              month:
                type: "uint8"
                min: 0
                max: 12
                default: 0
                description: "Byte 39."
              day:
                type: "uint8"
                min: 0
                max: 31
                default: 0
                description: "Byte 40."
              hour:
                type: "uint8"
                min: 0
                max: 23
                default: 0
                description: "Byte 41."
              minute:
                type: "uint8"
                min: 0
                max: 59
                default: 0
                description: "Byte 42."
              second:
                type: "uint8"
                min: 0
                max: 59
                default: 0
                description: "Byte 43."
              bitmap:
                type: "bytes"
                min_length: 11
                max_length: 8128
                description: "Stripe-major bitmap: `length` stripes of `height` bytes each, MSB = leftmost pixel, 1 = on; zero-padded by the sender to a 16-byte chunk boundary. 8128 = the 8192-byte flash minus the header."

  - uuid: "0000fee7-0000-1000-8000-00805f9b34fb"
    name: "Badge Secondary Service"
    notes: >
      Second service present on the badge (Elektor Jan/Feb 2023, Table 1).
      Undocumented; the vendor app never references it.
    characteristics:
      - uuid: "0000fec7-0000-1000-8000-00805f9b34fb"
        name: "FEC7 (write)"
        properties: ["write"]
      - uuid: "0000fec8-0000-1000-8000-00805f9b34fb"
        name: "FEC8 (indicate)"
        properties: ["indicate"]
      - uuid: "0000fec9-0000-1000-8000-00805f9b34fb"
        name: "FEC9 (read)"
        properties: ["read"]
        notes: "Returns the manufacturer-specific data blob."

entities:
  - platform: "light"
    name: "Badge Display"
    features: ["brightness"]
    notes: >
      No role bindings, deliberately. The badge has exactly one write —
      `write_badge_data`, the 16-byte chunk stream — and it is not a control a
      role can name: the whole display, brightness included, arrives as the
      64-byte header of a bitmap upload, which is what `protocol_handler:
      ledbadge_bitmap` and the `image_upload` feature above describe. This
      entity was bound `set_text: write_badge_data`, a role name no consumer's
      vocabulary contains, pointing at a parameterless chunk write; it resolved
      nothing and drew nothing, while reading as though a text control existed.
      Brightness stays in `features` because the header does carry it — the
      uploader sets it, not a slider on this entity.

remaining_unknowns:
  - "Whether the badge rejects or misbehaves on a zero date (bytes 38-43) is untested — every known client sends the current time, so the `default: 0` on those parameters is a filler value nobody has exercised."
  - "The speed nibble (byte 8 bits 4-7) cannot be declared as its own parameter because it shares a byte with `mode`; the template pins it at 0 (slowest)."
  - "Timing (3 s ack timeout, 300 ms first-chunk delay, 25 ms inter-chunk) is app-derived; Nilhcem/FOSSASIA use 100 ms between chunks and also work."

helpful_urls:
