    url: "https://docs.rs-online.com/07aa/0900766b80c044ee.pdf"
    kind: "manual"
    description: >
      Distributor-hosted manual for the badge platform, covering the PC software path.
  - title: "USB programmable LED badge user manual (Internet Archive)"
    url: "https://web.archive.org/web/20220117171411/http://ipsgproducts.com/products/electronics/support/LED_Badge_driver+manual/Led_Badge_User_Manual.pdf"
    kind: "manual"
    description: >
      Archived copy — the host now returns a server error.
