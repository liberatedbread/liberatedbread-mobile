protocol_details:
  uuid_scheme: >
    Vendor UUIDs are dab9XXXX-b5a1-e29c-b041-bcd562613bde. Service 1435;
    GeneralPlus listen 1382, write 1383; Nordic listen 0756, write 0757;
    RSSI listen 0755; file write 0758; unknown 1440 (notify) and 1441
    (write). The sources print them without dashes.
  frame_rules: >
    One GATT write = one command, 1 to 20 bytes, byte 0 the opcode, no
    length, checksum or encryption. Replies are notifications on the
    matching listen characteristic with the same opcode-first shape. No
    request id: correlate by opcode.
  keep_quiet:
    interval_s: 3
    client_write: "00 on GeneralPlus write (bluefluff, PyFluff)"
    vendor_app_write: "20 06 on GeneralPlus write, answered by 22 ImHereSignal (bluefluff)"
    notes: >
      Without it the Furby behaves as if no app were connected. bluefluff
      also reports the Furby stays awake as long as a connection is held,
      and only really shuts off a few minutes after disconnecting and
      falling asleep.
  action_addressing: >
    Every behaviour is an action sequence (speech + eye animation + body
    movement) addressed by four bytes: input (broad category), index (kind
    within it), subindex (variant), specific (one particular take). Opcodes
    0x10-0x13 fix 1-4 of them and let the Furby pick the rest at random.
    All carry a 0x00 byte after the opcode whose meaning nobody has
    explained. Input 33 index 0 subindex 0 speaks name number <specific>;
    input 75 is DLC content. bluefluff's doc/actionlist.md catalogues
    observed addresses with transcriptions of what the Furby says; that
    catalogue is the toy's content and is not reproduced here, beyond the
    two presets its client ships: giggle 55/2/14/0 and 56/3/15/1.
  names:
    count: 129
    first_syllables: ["Ah", "Bee", "Dah", "Day", "Dee", "Doo", "Kee", "Loo", "May", "Noo", "Tay", "Toh", "Way"]
    second_syllables: ["Bay", "Boh", "Boo", "Dah", "Doh", "Doo", "Kah", "Koh", "Tah", "Toh"]
    rule: >
      Enumerate first syllable (outer) by second syllable (inner) in the
      orders above, joined with a hyphen, and skip "Tay-Tah", which the
      toy does not have. Index 0 is Ah-Bay, 47 Dee-Koh, 107 Tay-Koh,
      108 Tay-Toh, 128 Way-Toh. 13 x 10 - 1 = 129.
    source: "bluefluff doc/names.md; PyFluff pyfluff/protocol.py carries the same table."
  dlc_upload:
    steps:
      - "Optional: cycle_debug_screen to the DLC slot screen (sixth) to watch progress. Each slot shows 0 empty, 1 transfer in progress or failed, 2 downloaded not active, 3 active. bluefluff guesses the slot labels 2M / 1M / .5M are capacities."
      - "Optional: delete_dlc_slot for slots to be reused (bluefluff deletes all first)."
      - "set_packet_ack enabled=1 on Nordic write (09 01 00)."
      - "announce_dlc_upload with size, slot and name. bluefluff always sends slot 2."
      - "Wait for 24 02 on GeneralPlus listen (PyFluff allows 10 s). 24 01 = name already present."
      - "Write the file to file write in 20-byte pieces, the last one shorter, ~5 ms apart, without response. Watch for 09 xx acks; 0a means too fast."
      - "Wait for 24 05 (OK) or 24 06 (error) / 24 03 (timeout). bluefluff: 3-5 minutes; ~4 kB/s at best."
      - "load_dlc slot, then activate_dlc. The slot reads 3; play its content with trigger_action input 75."
    notes: "PyFluff's README warns its port of this path is not fully tested."
  dlc_container: >
    Structure only; no content of any Hasbro DLC is described. A DLC is one
    binary file (Hasbro's carried 8.3 names ending .DLC) holding LCD eye
    animations, audio and the matching movement data. bluefluff did not
    reverse the container layout; what is published: the images use an
    undecoded custom palette, and the audio is GeneralPlus A1800 at 16 kbit/s
    in independent 40-byte blocks of 20 ms each, which GeneralPlus's own
    batch converter produces from 16 kHz WAV. The Furby does no checksum on
    a received file (the vendor app checked), so a modified file of the
    same length loads. No header, index or offset table is documented, so
    a client can transfer a file but cannot build one.
  unexplained_gp_opcodes:
    0x31: "sets 'blue antenna' notifications; reply 20 1b"
    0x46: "reply 20 0d (sequence cancelled), no visible effect"
    0x53: "possibly delete file; reply 53"
    0x54: "possibly get file size; reply 54"
    0x55: "possibly get checksum; reply 55"
    0x56: "reply 56"
    0x57: "reply 57"
    0x58: "reply 58"
    0x70: "reply 56"
    0x71: "reply 57"
    0xbc: "'body cam' on/off with one byte; replies 20 15 / 20 16; seen only as a reference"
    0xe0: "group activation: e0 00 00 00 00 makes later actions fail with 20 19, e0 00 00 00 01 undoes it"
    0xe1: "reply e0"
    0xe2: "reply 20 1a (timed group set)"
    0xe3: "reply e0"
    0xf0: "reply f0"
    0xf2: "one byte; reply f2 00; possibly F2F"
    notes: "From bluefluff's generalplus.md. Not declared as commands: their effect is unknown."
  unexplained_nordic_opcodes:
    0x06: "reply 06 GotTimeStamp"
    0x07: "the Furby disconnects"
    0x08: "reply 08"
    0x0e: "reply 0e 0c 00"
  furby_message_commands: >
    20 xx written to GeneralPlus write uses its own code table (bluefluff):
    20 01 -> 20 05 then 20 01; 20 02 -> 20 02 then 20 04; 20 05, 20 07 and
    20 08 disconnect; 20 06 im_here_poll; 20 0a -> 20 0e; 20 0b -> 20 0d;
    20 0c -> 23 08; 20 0d / 20 0e start/stop sensor stream; 20 0f language;
    20 10 -> FurbiesMet.
  mood_opcode_conflict: >
    bluefluff doc/generalplus.md lists Set Moodmeter as 0x24; bluefluff
    fluffd/fluffaction.js, PyFluff pyfluff/protocol.py and PyFluff's test
    all use 0x23. The code is what a working client sent, so 0x23 is
    declared. Neither is hardware-verified here.
  test_vectors:
    note: "Held by scripts/test_hasbro_furby_connect_spec.py. The DLC name and size are invented."
    antenna_255_128_0: "14 ff 80 00"
    giggle: "13 00 37 02 0e 00"
    set_name_42: "21 2a"
    say_name_42: "13 00 21 00 00 2a"
    set_fullness_75: "23 01 03 4b"
    lcd_on: "cd 01"
    lcd_off: "cd 00"
    packet_ack_on: "09 01 00"
    announce_dlc:
      size: 123456
      slot: 2
      filename: "CUSTOM01.DLC"
      hex: "50 00 01 e2 40 02 43 55 53 54 4f 4d 30 31 2e 44 4c 43 00 00"

evidence:
  artifacts:
    - type: "public_research"
      artifact: "Jeija/bluefluff at 9e865c47326167c2d4e6f47d96321e8e5cfc0e32 (read 2026-11-08): README.md, doc/*.md, fluffd/fluffaction.js, fluffd/fluffcon.js, fluffd/fluffd.js"
      url: "https://github.com/Jeija/bluefluff"
      description: >
        MIT. The original reverse engineering from BLE sniffing, probing and
        reading the vendor app's native library. Source of the GATT tree,
        every opcode table, the DLC upload flow and the debug-screen slot
        states.
    - type: "public_implementation"
      artifact: "martinwoodward/PyFluff at f2df440a331f7124596ed4840d9f36dc7da3f978 (read 2026-11-08): pyfluff/protocol.py, furby.py, dlc.py, models.py, tests/test_protocol.py, docs/f2f-connectivity.md, README.md"
      url: "https://github.com/martinwoodward/PyFluff"
      description: >
        MIT. A Bleak-based Python port of bluefluff. Adds the precise DLC
        announce layout (big-endian size, NUL-padded 12-byte name), unit
        tests for several frames and the F2F advertising note. Its README
        says the port was machine-generated and parts are untested.
  documentation_review: >
    The two sources were compared doc by doc; PyFluff's docs are
    bluefluff's with notes added. Conflicts found: the mood meter opcode
    (doc 0x24 vs code 0x23, resolved to the code) and the DLC announce
    layout (bluefluff's prose puts the 0x00 after the 3-byte size; both
    clients' code sends it before the size, which is what is declared).
    No hardware capture was made.
  open_questions: >
    The 0x21 sensor report layout; the meaning of the 0x00 after action
    opcodes; reply layouts for 0x22, 0x72, 0x73, 0x74, 0xdc; whether the
    upload slot byte is really the slot; the DLC container layout; DFU entry
    and images; advertised data beyond the name; a reset procedure.

remaining_unknowns:
  - "Sensor report (21 + 7 bytes): which bytes carry the joystick direction, tickle/pet sensors and accelerometer axes, and their scaling. No source decodes it; needs captures while moving each input."
  - "Set-mood opcode: 0x23 (both clients' code) vs 0x24 (bluefluff's table). Needs one write against hardware with the mood debug screen showing."
  - "Meaning of the 0x00 byte after opcodes 0x10-0x13 and after 0x50."
  - "announce_dlc_upload: whether byte 5 is really the slot, how the Furby picks a slot otherwise, and the slot capacities (2M/1M/.5M is a guess)."
  - "The DLC container layout (header, index, how animations, audio and movement are tied to action addresses). Only the audio codec and the absence of an on-device checksum are known."
  - "Reply layouts of ImHereSignal (22), CurrentMode (23), FurbiesMet (26), SlotsInfo (72), slot info (73), delete (74) and ReportDLC (dc); the Nordic firmware version encoding; whether comm_test inverts bits or order."
  - "Purpose of characteristics dab91440/dab91441 (suspected Furby-to-Furby) and dab90755 (RSSI)."
  - "DFU: whether the Nordic legacy bootloader is entered by the stack default, what it advertises, whether images are signed, and whether the GeneralPlus MCU can be updated at all. No Hasbro firmware image is public."
  - "Advertisement contents beyond the local name (service UUIDs, manufacturer data, address type, MAC prefix)."
  - "Whether writing Device Name (00002a00-0000-1000-8000-00805f9b34fb) changes the advertised name."
  - "Factory reset: no procedure in either source and no instruction sheet fetched."
  - "Firmware differences between units: bluefluff saw GeneralPlus version 04 and Nordic 19 00 00 00 on one Furby; other versions are unrecorded."

helpful_urls:
  - title: "Jeija/bluefluff (protocol docs and Node.js client)"
    url: "https://github.com/Jeija/bluefluff"
    kind: "protocol_writeup"
    description: >
      The original Furby Connect reverse engineering (MIT): doc/bluetooth.md
      for the GATT tree, doc/generalplus.md and doc/nordic.md for the opcode
      tables, doc/flashdlc.md for the DLC upload.
  - title: "martinwoodward/PyFluff (Python client)"
    url: "https://github.com/martinwoodward/PyFluff"
    kind: "implementation"
    description: >
      MIT Python port of bluefluff using Bleak, with a CLI, web UI and DLC
      manager; pyfluff/protocol.py is a compact table of every UUID and
      opcode it uses.
