        command: "set_port_mode"
        values:
          port: 8
          work_type: 2
      turn_off:
        command: "set_port_mode"
        values:
          port: 8
          work_type: 1
    notes: "Relay outlet 8. No state is bound, because the strip's status stream is not the controller layout. Read it from read_everything item 0x07 or protocol_details.power_strip_stream."

# Bespoke framing, selector tables and stream layouts. Namespaced so the top
# level stays closed; nothing here is a declared contract. `protocol_handler`
# above names the consumer-side code that applies `frame`.
protocol_details:
  frame:
    verification: "confirmed"
    notes: >-
      Upstream brute-forced both CRCs on 579 captured app frames (579/579)
      and checked its encoder against the app's routine on 20,000 random
      inputs. The golden frames in test_vectors reproduce with the algorithm
      below.
    layout:
      "0": "0xa5"
      "1": "0x00 in a client's frame. Replies set it non-zero (see reply_byte_1)"
      "2-3": "payload length, u16 big-endian (payload only; the frame is payload + 12 bytes)"
      "4-5": "sequence number, u16 big-endian"
      "6-7": "CRC-16/CCITT-FALSE over bytes 0-5, big-endian"
      "8": "0x00"
      "9": "opcode"
      "10..n-3": "payload: [selector][length][value] items, then [0xff][port] on multi-port devices"
      "n-2..n-1": "CRC-16/CCITT-FALSE over byte 8 through the last payload byte, big-endian"
    crc:
      algorithm: "CRC-16/CCITT-FALSE"
      polynomial: "0x1021"
      initial: "0xffff"
      reflected: false
      xor_out: "0x0000"
      byte_order: "big"
      check: "0x29b1 over ASCII 123456789"
      notes: >-
        The same value as Python's binascii.crc_hqx(data, 0xffff). The tail
        CRC does not cover the sequence number, so identical payloads carry
        identical tail CRCs.
    sequence: >-
      The app keeps one counter per device, adds 1 per command and wraps
      65535 -> 1 (never 0). It uses a second, separate counter for Wi-Fi
      provisioning. The device only echoes the value, so upstream's clients
      start at 0 on every connection without trouble.
    reply_byte_1: >-
      Seen as 0x13 (hunterjm, a protocol-revision-3 unit), 0x17 (both
      projects' Controller 69 Pro, revision 7) and 0x1c (the power strip).
      hunterjm accepts the whole a5 00 - a5 1f family, as the app's frame
      assembler does. Hypothesis: byte 1 = 0x10 + protocol revision. It fits
      all three, but nobody has confirmed it.
    reply_matching: >-
      The app matches a reply to the command in flight by the echoed
      sequence number alone. hunterjm also checks length, both CRCs and the
      echoed opcode (byte 9), and rejects anything else as stale. Do both.
    acknowledgement: >-
      A write's reply echoes each written selector as a [selector, result]
      pair (result 0 = accepted, 1 = rejected), then ff and the port. The app
      treats any result of 1 as failure. hunterjm demands an explicit 0 for
      every selector it wrote plus the right port, and upstream observed
      `10 00 12 00 ff 01` for an accepted mode-and-level write. The app also
      accepts a reply with 0x66 in byte 9 as an ack whose byte 10 is a
      sub-status (app analysis, never captured).
    reassembly: >-
      Both writes and notifications may be split across ATT packets. A
      frame starting a5 is complete at 12 + (u16 at bytes 2-3) bytes, and a
      status frame starting 1e ff 02 09 at 6 + byte 5. Keep the two
      assembly buffers separate, because status frames keep arriving while a
      reply is pending.
    older_combined_on_write: >-
      Before the separate activate write was understood, clients (and
      hunterjm's early library) turned a port on at a level with one write,
      `10 01 02 12 01 <level> ff <port>`, and off with `10 01 01 11 01 00 ff
      <port>`. The strip accepted it (the acknowledgement above). The
      vendor app sends the two items separately.

  opcodes:
    "0x01":
      meaning: "Read. The payload is a list of bare selectors, then [0xff, port]. The reply carries [selector][length][value] items."
      verification: "confirmed"
    "0x03":
      meaning: "Write. The payload is [selector][length][value] items, then [0xff, port]."
      verification: "confirmed"
    "0x08":
      meaning: "Reset, per the app analysis. Payload not documented, and deliberately not offered as a command."
      verification: "reported"
      advanced: true
      advanced_reason: >-
        Resets the controller. Nobody has exercised it or recorded its
        payload or its effect on stored modes, calibration and the app's
        binding. The physical factory reset (setup.factory_reset) does the
        same job with known consequences.
    "0x11, 0x12, 0x14, 0x15":
      meaning: >-
        History/chart download (captured; 0x15 returned 512 bytes of
        logged sensor records). Out of scope.
      verification: "confirmed"

  port_trailer: >-
    Multi-port devices end every payload with 0xff and the 1-based
    physical port (ff 04 = port 4, confirmed by upstream on ports 2 and 4 of
    the strip), or 0 for the controller itself. The trailer is not an item,
    so do not walk it as one. Single-port controllers omit it. The AI-series
    extended format uses two-byte item lengths (out of scope).

  selectors:
    notes: >-
      One number space shared by reads and writes. "confirmed" means seen in
      upstream's captures of the app, "reported" means from the app analysis
      only, and "hypothesis" means a name nobody has exercised.
    "0x01": {meaning: "Controller clock (see clock).", verification: "confirmed"}
    "0x02": {meaning: "Temperature and trend states (read).", verification: "reported"}
    "0x03": {meaning: "Port realtime: load id, level, run state (read).", verification: "reported"}
    "0x04": {meaning: "The port the screen shows. Also written by the app (`04 05 ...`, layout not recorded).", verification: "confirmed"}
    "0x07": {meaning: "Port list: records of [port][id hi][id lo][state][3 bytes] (7 bytes each on the strip; state 1 on, 0 off).", verification: "confirmed"}
    "0x10": {meaning: "Active mode (work type). The write is set_port_mode. Read back, it can show the output state rather than the programmed mode, so prefer the status stream.", verification: "confirmed"}
    "0x11": {meaning: "OFF level 0-10 (minimum).", verification: "confirmed"}
    "0x12": {meaning: "ON level 0-10 (maximum), packed with the manual level above revision 7.", verification: "confirmed"}
    "0x13": {meaning: "AUTO triggers (auto_block).", verification: "reported"}
    "0x14": {meaning: "Countdown-then-on seconds, u32 BE.", verification: "reported"}
    "0x15": {meaning: "Countdown-then-off seconds, u32 BE.", verification: "reported"}
    "0x16": {meaning: "Cycle: on seconds u32 BE, off seconds u32 BE.", verification: "confirmed"}
    "0x17": {meaning: "Schedule: on hour, on minute, off hour, off minute; 0xff = unset.", verification: "confirmed"}
    "0x18": {meaning: "Time left in the current mode (read).", verification: "reported"}
    "0x20": {meaning: "Display unit, 1 = °C, 0 = °F (bundle only).", verification: "confirmed"}
    "0x21": {meaning: "Brightness [index 1-5, enable 0/1] (bundle only).", verification: "confirmed"}
    "0x22": {meaning: "Transition [temp °F, temp °C, humidity %, VPD tenths kPa]; 3 bytes (no VPD) on some firmware.", verification: "reported"}
    "0x23": {meaning: "Buffer (hysteresis) [temp °F, temp °C, humidity %, VPD tenths kPa]; 3 bytes (no VPD) on some firmware.", verification: "reported"}
    "0x24": {meaning: "Calibration [byte 0 unresolved, temperature offset in the displayed unit, humidity offset %], signed.", verification: "confirmed"}
    "0x25": {meaning: "Leaf temperature offset [°F, °C].", verification: "reported"}
    "0x26": {meaning: "Buffer on/off (revision 5 and later); the app sends it before 0x23.", verification: "reported"}
    "0x28": {meaning: "Named 'timer enable and duration' by the app analysis; in the bundle, meaning unexercised.", verification: "hypothesis"}
    "0x30-0x33": {meaning: "Notification and automation configuration (read by the app; not decoded here).", verification: "reported"}
    "0x50": {meaning: "Named 'port type' by the app analysis; also the app's bulk port-configuration write (`50 01 ...`). In the bundle, meaning unexercised.", verification: "hypothesis"}
    "0x51": {meaning: "VPD block [switches, high, low, target], tenths of a kPa; all revisions.", verification: "confirmed"}
    "0x53": {meaning: "Appended to get_model_data on revision 6+; 6 bytes in the bundle. The app analysis calls it an outside-temperature item. Meaning unexercised.", verification: "hypothesis"}
    "0x60-0x65": {meaning: "CO2, soil-moisture, water-temperature, pH and EC/TDS targets for AI-series sensors. Out of scope.", verification: "reported"}
    "0x61": {meaning: "AI-series multi-sensor blocks (includes VPD targets on those devices). Out of scope. The VPD write on the devices covered here is 0x51, never 0x61.", verification: "reported"}
    "0x70": {meaning: "Named 'port parameter data' by the app analysis; 9 bytes in the bundle. Meaning unexercised.", verification: "hypothesis"}

  work_types:
    notes: >-
      The active-mode numbers written by set_port_mode and reported by the
      status stream's port mode field. The names below are paraphrases.
    "1": "off; runs at the OFF level"
    "2": "on; runs at the ON level"
    "3": "auto; temperature and humidity triggers"
    "4": "countdown, then on"
    "5": "countdown, then off"
    "6": "repeating on/off cycle"
    "7": "daily on/off schedule"
    "8": "VPD triggers"
    "9-17": "AI-series sensor modes (CO2, soil moisture, water temperature, pH, EC/TDS, water detection, standalone temperature and humidity). Out of scope."

  auto_block:
    ten_byte:
      applies_to: "Multi-port controllers at protocol revision 6 or later."
      layout: "[switches][high °F][high °C][low °F][low °C][high RH %][low RH %][target °F][target °C][target RH %]"
      verification: "reported"
      notes: >-
        Positions 1-6 were confirmed by a live write-and-read-back on
        upstream's units, and the whole block round-trips. Positions 7-9
        are named by the app analysis, and a captured block with no target
        set carried 20 00 00 there (32 °F, 0 °C, 0 %). Every temperature
        goes out in both units as whole degrees. The app fills the unit on
        screen and derives the other by rounding (°C->°F: c × 9/5 + 32).
    seven_byte:
      applies_to: "Single-port controllers, and multi-port controllers below revision 6."
      layout: "[switches][high °F][high °C][low °F][low °C][high RH %][low RH %]"
      verification: "reported"
      notes: >-
        Upstream reports that its older client sent this form to a
        revision-7 controller, got success back, and nothing was stored.
        Match the form to the revision.
    switch_bits:
      "0x08": "high temperature trigger enabled"
      "0x04": "low temperature trigger enabled"
      "0x02": "high humidity trigger enabled"
      "0x01": "low humidity trigger enabled"
      "0x10": "AUTO target enabled (10-byte form; app analysis)"
      "0x20": "target humidity enabled (app analysis)"
      "0x40": "target temperature enabled (app analysis)"
    ranges: >-
      The app offers 32-194 °F (0-90 °C) for temperature triggers and 0-100 %
      for humidity. A disabled bound keeps its rail value (194/90, 32/0,
      100, 0) with its bit clear.

  vpd_block:
    layout: "[switches][high][low][target], each one byte in tenths of a kPa (0-99 = 0.0-9.9 kPa)"
    verification: "confirmed"
    switch_bits:
      "0x02": "high VPD trigger enabled"
      "0x01": "low VPD trigger enabled"
      "0x08": "VPD target enabled (app analysis)"
      "0x04": "target-setting mode (app analysis)"
    notes: >-
      Measured VPD in the status stream is hundredths of a kPa, and the
      trigger bytes here are tenths. Writing hundredths (1.4 kPa as 140)
      is the classic mistake.

  on_level_encoding:
    verification: "reported"
    notes: >-
      Selector 0x12. At protocol revision 7 and below the value is the ON
      level, 0-10. Above revision 7 (hunterjm, from the app) the high
      nibble is the manual ON level and the low nibble is the maximum level.
      The power strip's replies show 0x62 and 0x6a, which fits the packed
      form. A client changing the manual level reads 0x12, replaces the high
      nibble and writes the byte back.

  settings_bundle:
    verification: "reported"
    port: 0
    order: ["0x20", "0x21", "0x24", "0x11", "0x12", "0x26", "0x22", "0x23", "0x25", "0x50", "0x53", "0x28", "0x70"]
    items:
      "0x20": "length 1: display unit, 1 = °C, 0 = °F (confirmed on the wire)"
      "0x21": "length 2: [brightness index, enable]. 1-3 captured; 4-5 are the auto-dimming settings, not exercised"
      "0x24": "length 3: [byte 0 unresolved, temperature offset (int8, displayed unit), humidity offset (int8, %)]"
      "0x11": "length 1 at port 0: captured 00; meaning at controller level not established"
      "0x12": "length 1 at port 0: captured 0a; meaning at controller level not established"
      "0x26": "length 1: buffer on/off"
      "0x22": "length 4 (or 3): transition [°F, °C, %, VPD tenths]"
      "0x23": "length 4 (or 3): buffer [°F, °C, %, VPD tenths]. A 3-byte read means no VPD buffer on this firmware; write back the length you read"
      "0x25": "length 2: leaf temperature offset [°F, °C]"
      "0x50": "length 1: captured 00; unexercised"
      "0x53": "length 6: unexercised"
      "0x28": "length 2: unexercised"
      "0x70": "length 9: unexercised"
    example_payload: >-
      Illustrative only, with neutral values and the unexercised items left
      as read-back placeholders (not a frame to send): 20 01 01 | 21 02 03
      01 | 24 03 <byte0 as read> 00 00 | 11 01 00 | 12 01 0a | 26 01 00 |
      22 04 00 00 00 00 | 23 04 00 00 00 00 | 25 02 00 00 | 50 01 00 | 53
      06 <6 bytes as read> | 28 02 <2 bytes as read> | 70 09 <9 bytes as
      read> | ff 00. That is °C display, brightness 3 on, zero calibration
      offsets, no transition, no buffer.
    single_field_writes: >-
      The app never sends one. Upstream captured a °F->°C toggle on its own
      three times and saw no bytes on the air. The unit reached the device
      only inside a bundle sent when another field changed. Upstream also
      reports a lone field write as a silent no-op. Whether the firmware
      would act on a single item sent by another client was never isolated,
      so the safe rule is the bundle, read-modify-write.
    calibration_byte0: >-
      Open. In °C display it tracked round(offset × 9/5 + 32) on two
      samples (offset 1 -> 0x22, 2 -> 0x24), which is the app's absolute
      °C-to-°F conversion applied to an offset. That fits the app
      analysis's description of the field as a °F twin, but it is not a
      usable °F offset. Nothing has been captured in °F display or with a
      unit switch while calibrated. Copy the byte from the read-back.

  controller_stream:
    verification: "confirmed"
    applies_to: "Multi-port controllers, protocol revision 5 or later (the characteristic `format`)."
    layout: >-
      Bytes 0-3 are 1e ff 02 09, 4 is the frame kind, 5 the body length, 6
      the flags (°C display bit 7, trend codes in bits 6-5, 4-3 and 2-1), 7
      the selected port (low nibble), 8-9/10-11/12-13 temperature, humidity
      and VPD (int16 BE, ×0.01), 14-17 the aggregate output record and
      18-21 reserved. Then 8-byte port blocks from byte 22: [load id u16 BE,
      ff ff = empty][run state bits 7-6, level bits 5-2, output on bit 1,
      fault bit 0][overcurrent bit 7, advanced-program bits 6-4, mode bits
      3-0][3 unresolved bytes][load type].
    unresolved_block_bytes: >-
      Port-block bytes 4-6. On a cycling port upstream saw byte 4 go 0x10
      in the off phase and 0x00 in the on phase, and byte 6 count down once
      a second (a countdown in seconds, with byte 5 perhaps its high byte).
      The app analysis instead folds bytes 5-7 into error and
      secondary-function status. Neither reading is confirmed.
    legacy_layout: >-
      Below revision 5: same climate fields, 4-byte port records from byte
      18 ([load id u16 BE][state][level high nibble, mode low nibble]). App
      analysis only.
    constructed_example: >-
      Built for this spec, not captured: 1e ff 02 09 07 30 80 01 08 ca 15
      7c 00 7a 00 00 00 01 00 00 00 00 27 10 da 02 00 00 00 00 2e e0 00 01
      00 00 00 00 ff ff 00 01 00 00 00 00 ff ff 00 01 00 00 00 00 decodes
      as °C display, selected port 1, 22.50 °C, 55.00 %, 1.22 kPa. Port 1
      has load 10000, running, level 6, output on, mode 2 (on). Port 2 has
      load 12000, idle, mode 1 (off). Ports 3 and 4 are empty.

  power_strip_stream:
    verification: "reported"
    applies_to: "UIS power strip (OUTLET AI / AI+) — the AI-family status frame, 139 bytes on the 8-outlet unit."
    header: >-
      Bytes 0-3 are 1e ff 02 09, 4 the frame kind (0x0c observed), 5 the
      body length (frame = 6 + byte 5), and byte 7 low 6 bits the number of
      sensor records. The 139-byte frame uses the expanded header (hunterjm,
      from the app): byte 11 high nibble is the number of port records
      (record 0 is the strip itself), byte 11 low nibble is the selected
      port, and byte 12 low nibble is the number of 3-byte calibration
      records starting at byte 13. Port records follow them. Check:
      frame length = 13 + records × 10 + sensors × 4 + calibration × 3
      (13 + 90 + 24 + 12 = 139 for upstream's capture). In the original
      header form the counts sit in byte 8 and byte 9 instead.
    port_record: >-
      10 bytes: [id u16 BE; 0xff in its first byte = nothing connected][second
      id u16 BE][load type, the same wire codes as the controller's, high bit = outlet-style
      load][state: level bits 5-2, output on bit 1, fault bit 0][mode, low 5
      bits][3 bytes unresolved]. Record N (N >= 1) is outlet N.
    sensor_record: >-
      4 bytes: [sensor id][flags: accuracy in bits 6-5][value int16 BE].
      Scale by accuracy: 0 = ×10, 1 = ×1, 2 = ×0.1, 3 = ×0.01, and -32768
      means no reading. Sensor ids: 0 probe temperature °F, 1 probe
      temperature °C, 2 probe humidity, 3 probe VPD, 4 zone temperature °F,
      5 zone temperature °C, 6 zone humidity, 7 zone VPD. Upstream's strip
      streams id 0 (°F) with accuracy 3, but its A5 query replies carry °C.
    numbering_conflict: >-
      Nyx000's decoder splits the frame on the byte run 3d b8 ff ff and
      numbers each outlet from the next byte as 0x80 + outlet - 1. In the
      layout above those four bytes are a record's two ids, and the next
      byte is its load type. Upstream's own capture decodes under the
      load-type reading to a light on outlet 1, a fan on outlet 2 and a
      humidifier on outlet 5. That matches the outlet assignments upstream
      recorded, while the key reading would put the light on outlet 2.
      Treat record position as the outlet number. Both readings agree on
      the on/off byte.
    honest_relay_state: >-
      Upstream found the query path more trustworthy than the stream for
      automation-driven outlets. read_everything's 0x07 item tracked
      commanded and schedule-driven relay changes exactly.

  advertisement:
    verification: "reported"
    company_id: "0x0902"
    payload_lengths: [17, 27]
    layout: >-
      Offsets are into the manufacturer payload after the two company-ID
      bytes. 0-5 device identity (the address). 6-10 five ASCII characters
      of the unit's name suffix (VPD sensor models use them for VPD data
      instead). 11 protocol revision. 12 device type. 13 flags. The
      27-byte form adds live readings from byte 14: temperature and
      humidity int16 BE ×0.01 at 14 and 16 on controllers, level at 18,
      and on multi-port units from revision 3 the selected port at 19, the
      VPD state at 20 and VPD at 21-22. Other families pack readings
      differently. Use the connected status stream for values.
    device_types:
      "1": "CONTROLLER 67 (CTR67A), single-port"
      "2": "CONTROLLER 76 (CTR76A), single-port outlet controller"
      "7": "CONTROLLER 69 (CTR69A)"
      "8": "CONTROLLER 69 WiFi (CTR69X); Bluetooth may appear only during setup"
      "9": "wall-hang controller (CTR79A)"
      "11": "CONTROLLER 69 PRO (CTR69P)"
      "12": "desktop controller (CTR75A)"
      "16": "wall-hang controller pro (CTR79P)"
      "17": "desktop controller pro (CTR75P)"
      "18": "CONTROLLER 69 PRO+ (CTR69Q)"
      "19": "CONTROLLER AI (not covered)"
      "20": "CONTROLLER AI+ (CTR89Q; not covered at revision 20+)"
      "21": "OUTLET AI (AC-ADA4)"
      "22": "OUTLET AI+ (AC-ADA8)"
      "23": "multi-port controller, name not recorded"
      "51": "CONTROLLER AI 2 (extended format, not covered)"
    notes: >-
      From hunterjm's table, read from the app's device catalogue. Other
      ids are thermo-hygrometers (3-5, 14, 15, 24, 25, 34, 35) and home
      appliances (33, 39, 40, 48-50) with different frame formats, which
      this spec does not cover. Only types 11 and (by upstream's frames) the
      strip have been run.

  clock:
    verification: "reported"
    write: >-
      Selector 0x01, length 7: [year - 2000, month, day, weekday, hour,
      minute, second], big-endian bytes. The app wrote 1a 06 18 03 11 0d 10
      for Wednesday 2026-06-24 17:13:16, so Wednesday = 3. The Sunday value
      is not recorded. The strip's form has length 11 (the same 7 bytes and
      4 undetermined bytes). The app sends it during its connect-time
      sync. Whether it carries the [0xff, port] trailer is not recorded,
      so it is not declared as a command.
    why_it_matters: "Schedule mode runs on the controller's clock (manual). A controller that lost power may need it set."

  other_traffic:
    status_poll: "The app reads selectors 0x20 0x38 about once a second as a heartbeat. The meaning of 0x38 is not established."
    named_profile: "A read of selector 0x44 returns an ASCII profile name."
    unexplained_reads: "0x52, 0x57, 0x36, 0x37, 0x43, 0x47 and 0x48 were seen in reads and not decoded."

  provisioning_service:
    notes: >-
      Wi-Fi+BLE models expose a second service, 0000ffff-0000-1000-8000-00805f9b34fb,
      with write 0000ff01-0000-1000-8000-00805f9b34fb and notify
      0000ff02-0000-1000-8000-00805f9b34fb, which the app uses only for
      Wi-Fi provisioning, with its own sequence counter and 100-500 ms
      pauses between writes. It is out of scope. hunterjm's library falls
      back to that pair for commands when 70d51001/70d51002 are absent.
      Which device, if any, needs that is not recorded.

  ai_series_extended_format:
    notes: >-
      Not covered, and listed so a client can recognise it. Item lengths
      are u16 big-endian (so mode-activate is 10 00 01 <work type> ff
      <port>). Port records carry explicit port ids. Climate targets travel
      as selector 0x61 blocks of 8-byte records [type][flags][high u16
      BE][low u16 BE][target u16 BE], scaled by an accuracy code in the
      flags. It applies to CONTROLLER AI / AI+ at revision 20 or later and
      to CONTROLLER AI 2.

  test_vectors:
    notes: >-
      Full frames. The first three are upstream's captured or golden frames.
      The rest were built for this spec with the CRC above and not
      captured. `inner` is the template span the command declarations carry.
    crc_check: "CRC-16/CCITT-FALSE(\"123456789\") = 0x29b1"
    activate_cycle_port1_seq0: "a5 00 00 05 00 00 47 c9 00 03 10 01 06 ff 01 ec be (upstream golden; inner 00 03 10 01 06 ff 01)"
    get_model_data_port1_seq0: "a5 00 00 0a 00 00 6b f8 00 01 10 11 12 13 14 15 16 17 ff 01 ff 2b (upstream golden)"
    ack_mode_and_level_port1: "a5 1c 00 06 00 00 91 e8 00 03 10 00 12 00 ff 01 16 29 (captured strip reply; head CRC is over the reply's own byte 1)"
    port2_off_seq_0x0102: "a5 00 00 05 01 02 54 ba 00 03 10 01 01 ff 02 59 4d"
    port2_off_seq_0xffff: "a5 00 00 05 ff ff 5a c6 00 03 10 01 01 ff 02 59 4d (same tail CRC: the tail does not cover the sequence)"
    port3_on_seq_0x0103: "a5 00 00 05 01 03 44 9b 00 03 10 01 02 ff 03 10 3c"
    port1_on_level_5_seq_0x0010: "a5 00 00 05 00 10 55 f8 00 03 12 01 05 ff 01 f1 6d"
    port2_vpd_high_1_4_low_0_8_seq_0x0007: "a5 00 00 08 00 07 75 7f 00 03 51 04 03 0e 08 00 ff 02 26 3a"
    port1_auto_high_86F_30C_only_seq_0x0020: "a5 00 00 0e 00 20 93 5a 00 03 13 0a 08 56 1e 20 00 64 00 20 00 00 ff 01 db 7b"
    port4_schedule_0700_on_1900_off_seq_0x0021: "a5 00 00 08 00 21 31 db 00 03 17 04 07 00 13 00 ff 04 fc 56"
    port1_cycle_15min_on_45min_off_seq_0x0022: "a5 00 00 0c 00 22 dd 78 00 03 16 08 00 00 03 84 00 00 0a 8c ff 01 6f 2b"
    port2_countdown_then_off_2h_seq_0x0023: "a5 00 00 08 00 23 11 99 00 03 15 04 00 00 1c 20 ff 02 89 5f"
    get_vpd_settings_port2_seq_0x0024: "a5 00 00 05 00 24 23 2f 00 01 11 12 51 ff 02 a6 e9"

evidence:
  open_source_analysis: >-
    Nyx000/acinfinity-ble (MIT, read at commit 7894096, 2026-07-27) gives
    the frame, CRC, UUIDs, transport behaviour, mode and trigger blocks,
    the settings bundle, the controller status layout and the strip's
    query replies. Its notes name the app's internal classes, and this spec
    does not repeat them. hunterjm/ac-infinity-ble (MIT, read 2026-09-28,
    docs/protocol-validation.md and the telemetry, protocol and
    capabilities modules) gives the advertisement layout, the device-type
    table, the AI-family (strip) status layout, reply acceptance, 20-byte
    write chunking and the packed ON level. Where they overlap they agree,
    except on the strip's outlet numbering (protocol_details.power_strip_stream).
  upstream_captures: >-
    Nyx000 captured the running vendor app's own GATT writes with in-process
    hooks (2026-06-24, 579 frames; 2026-07-22), took HCI snoops, and
    captured query replies and status frames from a Controller 69 Pro
    (revision 7) and the 8-port strip (fixtures dated 2026-06-22). This spec
    marks a fact `confirmed` only where one of those captures shows it.
    Nothing was captured by this project.
  documentation_review: >-
    AC Infinity's CONTROLLER 69 PRO manual (CTR69P2212X1): pairing (port
    button, 5 s), factory reset (mode + up + down, 5 s), AUTO and VPD
    trigger ranges, calibration ranges. The CONTROLLER 69 and 67 manuals
    give the same reset. The OUTLET AI manual (AI2407X1): pairing (power
    button, 5 s, 5-minute window) and reset (15 s). The web guides give
    the brightness levels and the firmware-update note. The Bluetooth SIG
    company registry assigns 0x0902 to TSC Auto-ID Technology.
  open_questions: >-
    Everything under remaining_unknowns. The first things to settle on
    hardware: whether a factory-fresh or Wi-Fi-bound controller advertises
    the control service without the port-button hold; calibration byte 0;
    a single-field settings write sent by a third-party client; and the
    strip's outlet numbering.
  artifacts:
    - type: "public_implementation"
      artifact: "Nyx000/acinfinity-ble, commit 7894096 (2026-07-27)"
      url: "https://github.com/Nyx000/acinfinity-ble"
      description: >-
        TypeScript client plus protocol notes and captured fixtures, MIT.
        The protocol was recovered from app 2.0.4 and re-validated live on a
        Controller 69 Pro and an 8-port AI power strip. It does not cover
        single-port controllers live, and the AUTO threshold-change capture
        is still open.
    - type: "public_implementation"
      artifact: "hunterjm/ac-infinity-ble (main, read 2026-09-28)"
      url: "https://github.com/hunterjm/ac-infinity-ble"
      description: >-
        Python library, MIT, read from app 2.0.8 (versionCode 123) and
        hardware-tested on a Controller 69 Pro (type 11, revision 7). It
        implements manual mode and level control, not schedules, AUTO or VPD
        writes, firmware update or provisioning.
    - type: "static_analysis"
      artifact: "com.eternal.acinfinity 2.0.4 and 2.0.8 (Android), analysed by the two projects above"
      description: >-
        Not examined by this project. Recorded because every `reported`
        fact here traces to one of these two builds.
    - type: "vendor_documentation"
      artifact: "CONTROLLER 69 PRO user manual CTR69P2212X1; CONTROLLER 69 manual CTR692108X2; CONTROLLER 67 manual CTR672109X1; OUTLET AI manual AI2407X1"
      obtained_via: "acinfinity.com/content, 2026-09"

remaining_unknowns:
  - >-
    Whether a factory-fresh controller, or one the app bound over Wi-Fi,
    advertises the 70d51000 service without the 5-second port-button hold.
    Both open clients have only reconnected to units already paired over
    Bluetooth.
  - >-
    Calibration (0x24) byte 0: two samples fit round(offset × 9/5 + 32) in
    °C display. Nothing has been captured in °F display or across a unit
    switch with a non-zero offset.
  - >-
    Whether the firmware ignores a single settings item written by a
    third-party client, or only the app declines to send one. Upstream's
    evidence is that the app never sends one.
  - >-
    The meaning of the settings items 0x11 and 0x12 at port 0, and of 0x50,
    0x53, 0x28 and 0x70. They were captured inside the bundle but never
    exercised.
  - >-
    A clean capture of one AUTO threshold changed on a port already in AUTO,
    and the device-side meaning of AUTO bytes 7-9 (named the AUTO target by
    the app analysis only).
  - >-
    Controller status-block bytes 4-6: cycle phase and countdown per
    upstream's captures, or error and secondary-function status per the app
    analysis.
  - >-
    The power strip's outlet numbering. The load-type reading
    (hunterjm/app) and Nyx000's key reading disagree, and the first matches
    upstream's own fixture. Also which retail model upstream's strip is
    (probably OUTLET AI+, AC-ADA8).
  - >-
    Reply byte 1 (0x13, 0x17, 0x1c seen): 0x10 + protocol revision is a
    hypothesis.
  - >-
    The frame-kind byte 4 of the status stream (0x07 controller, 0x0c
    strip) and the trend-code values in byte 6.
  - >-
    The payload and effect of opcode 0x08 (reset), and the ack form with
    0x66 in byte 9.
  - >-
    Whether the clock write (selector 0x01) carries a [0xff, port]
    trailer, and the Sunday weekday value.
  - >-
    The status frame of an 8-port Controller 69 Pro+ (expected 86 bytes)
    and anything at all from single-port controllers or units below
    revision 6. None has been captured.
  - >-
    The app's upper bounds for countdown and cycle durations, and whether
    the device rejects values past them.
  - >-
    The advertised local name, and whether the controller uses a public or
    random address (upstream keys on the address, which suggests public).

