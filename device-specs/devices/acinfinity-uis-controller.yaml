  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    name: "Device Information (assumed)"
    notes: >-
      The app reads these three revision strings by UUID at connect. The
      parent service is assumed to be the standard Device Information
      service, since nobody has published a GATT dump. hunterjm notes that the
      app handling 00002a26 does not prove every controller exposes it.
      Advertisement byte 11 is a protocol revision, not one of these strings.
    characteristics:
      - uuid: "00002a26-0000-1000-8000-00805f9b34fb"
        name: "Firmware Revision String"
        properties: ["read"]
        notes: "ASCII. Present on some units only (hunterjm)."
      - uuid: "00002a27-0000-1000-8000-00805f9b34fb"
        name: "Hardware Revision String"
        properties: ["read"]
        notes: "ASCII."
      - uuid: "00002a28-0000-1000-8000-00805f9b34fb"
        name: "Software Revision String"
        properties: ["read"]
        notes: "ASCII. The version the app's device-information screen shows. It reads 3.2.56 on hunterjm's Controller 69 Pro."

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["unknown"]
      image:
        signing: "unknown"
        source: "unknown"
      enter:
        how: "unknown"
        notes: >-
          Deliberately not documented. The app offers firmware updates for
          CONTROLLER 69 and later (AC Infinity's app guide; controllers
          released before the 69 get none), and the controller switches
          off briefly while updating. Upstream notes that the app's connect
          sequence also opens an update-status notification and that it has
          a separate chunked bulk-transfer path. Neither is part of this
          spec.
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >-
        Recorded so a reader knows the device takes new firmware and that a
        generic client must stay away from the update path. The mechanism,
        transport and image handling are out of scope.

