    commands:
      poll: "request_global_state"

payload_formats:
  Advertisement:
    description: >
      Manufacturer-specific AD data under company 0x03B6, offsets from the
      first byte AFTER the two company-id bytes. From upstream PR #2 and
      kvdb/gld09-control; both report idle units with firmware 0.3.7.
    fields:
      - index: 0
        name: "magic"
        description: "Bytes 0-1: ASCII \"MB\" (4d 42)."
      - index: 2
        name: "format_version"
        description: "Byte 2: format byte, opaque."
      - index: 3
        name: "connection_state"
        description: "Byte 3: bit 7 = a central is connected, bit 6 = pairing mode, 0x00 = idle. Other combinations not observed."
      - index: 4
        name: "firmware_version"
        description: "Bytes 4..end: firmware version, ASCII (e.g. \"0.3.7\"); stop at a 0x00 if one appears."
    parse_rules:
      - "Require company id 950 and payload bytes 0-1 == 4d 42."
      - "state = payload[3]: connected if bit 7, else pairing if bit 6, else idle if 0."
      - "firmware = payload[4:] decoded as ASCII up to the first 0x00."
      - "The local name is the unit's ten-digit AP number, not a product name."
    example: "4d 42 xx 00 30 2e 33 2e 37  (xx = the format byte, value not recorded; 00 = idle; 30 2e 33 2e 37 = \"0.3.7\")"
  FactoryToken:
    description: "The 192-byte read of 4cea0004. Declared field by field on that characteristic's `format`."
    parse_rules:
      - "Reject a token that is not exactly 192 bytes (upstream PR #2 does)."
      - "device_public_key = token[25:58]; device_salt = token[188:192]."
      - "Optional: verify token[124:188] (r || s) over token[0:124] with ECDSA P-256 / SHA-256 and the manufacturing public key for key id token[65:68]. The vendor key is not reproduced here; the open clients carry it."
  CurrentDate:
    description: "Response 0x13 data: four packed-BCD bytes, hour, minute, second, weekday (0 = Sunday). A running clock, not a calendar date."
    fields:
      - index: 0
        name: "hour"
        description: "Packed BCD 00-23."
      - index: 1
        name: "minute"
        description: "Packed BCD 00-59."
      - index: 2
        name: "second"
        description: "Packed BCD 00-59."
      - index: 3
        name: "weekday"
        description: "0-6, Sunday first."
    example: "23 59 00 03"
  WeeklyTimes:
    description: "Argument of set_sleepy_times / set_r2r_times and data of responses 0x23 / 0x22: fourteen bytes."
    parse_rules:
      - "Seven two-byte entries, Sunday first: [BCD hour, BCD minute]."
      - "FF FF = no time that day. 00 00 is midnight and must not be read as 'none'."
    example: "ff ff 06 45 06 45 06 45 06 45 06 45 06 45"
  WeeklyAlarms:
    description: "Argument of set_r2r_alarms and data of response 0x27: four bytes, eight nibbles, high nibble first."
    parse_rules:
      - "Nibbles 0-6 are Sunday-Saturday: 0 = alarm at the wake time, 1-8 = 15, 30 ... 120 min after it, 9 = no alarm, 10 = 1 min after."
      - "Nibble 7: kvdb/gld09-control sends 0 and reports the unit ignores it; the upstream web client treats it as a reward-sound id 0-15. Send 0."
      - "kvdb/gld09-control reports the green 'OK to wake' star only changes when an audible alarm is armed for that day."
    example: "90 99 99 90"
  DayRoutine:
    description: "Argument of the day-routine SETs and data of responses 0x2B-0x2F, 0x90, 0x91: fourteen bytes."
    parse_rules:
      - "Bytes 0-1: start time [BCD hour, BCD minute], or FF FF for none."
      - "Bytes 2-13: twelve task slots. Slot byte = (step << 4) | task_icon with step 1-12. A slot whose LOW nibble is 0 holds no task, whatever its step nibble: the web client pads with 0x00, and kvdb/gld09-control pads with (position << 4) | 0 (0x40, 0x50 ... 0xc0)."
      - "Task icons: 1 change clothes, 2 wash up, 3 brush teeth, 4 go potty, 5 pack bag, 6 eat, 7 read, 8 clean up, 9-11 the three custom tasks (both open clients draw them as a heart, a swirl/burst and a star/spiral)."
      - "kvdb/gld09-control gives each task its own step (1, 2, 3 ...); the upstream web client lets several tasks share a step. Preserve slot order and step numbers on read-back."
      - "kvdb/gld09-control observed the unit clearing a morning routine's icons on its own some hours after the start time; there is no command to clear them."
    example: "07 00 11 23 36 00 00 00 00 00 00 00 00 00"
  RoutineTaskStatus:
    description: "Data of response 0x94: seven bytes of routine progress (runtime only)."
    parse_rules:
      - "Byte 0: current task position, 1-based; 0 = not started."
      - "Bytes 1-6: twelve nibbles, high first, indexed by task icon 1-12: 0 pending, 1 current, 2 done (kvdb/gld09-control, hardware-observed)."
  MusicPlaylist:
    description: "Argument of set_music_playlist and data of response 0x19: twelve song ids."
    parse_rules:
      - "One byte per slot in play order; 0 = empty."
      - "Song ids 1-12: 1 Sleep Baby Sleep, 2 Hour Glass, 3 Frère Jacques, 4 How Lovely the Evening, 5 Tárrega Lágrima, 6 What's the Matter Dear, 7 Suo Gân, 8 Water Color Dreams, 9 Dance of the Jellyfish, 10 Inside the Bubble, 11 Paper Kites, 12 Crickets in Space."
    example: "01 02 03 00 00 00 00 00 00 00 00 00"
  ClockSettings:
    description: "Data of response 0x99 and argument of set_clock_settings: [display_on, (brightness << 4) | format]."
    example: "01 31"

protocol_details:
  mpid:
    description: >
      The session and framing layer both open clients implement, restated in
      our own words from stramanu/lumalou docs/protocol.md and
      docs/reversing.md and kvdb/gld09-control's README and source. Verified
      against our own invented test vectors below, which both upstream
      implementations reproduce.
    key_agreement:
      curve: "P-256 (secp256r1)"
      device_public_key: "token[25:58], compressed (33 bytes)"
      app_key: "Ephemeral per connection, sent compressed (33 bytes)"
      shared_secret: "ECDH X coordinate, 32 bytes, big-endian"
      app_nonce: "4 random bytes per connection, sent after the app key on 4cea0005"
      device_salt: "token[188:192]"
    key_derivation:
      summary: "session_key = first 16 bytes after 100 in-place AES-128-CTR rounds over the 32-byte shared secret."
      algorithm_steps:
        - "1. state = shared_secret (32 bytes)."
        - "2. For round r = 0 .. 99: key = state[0:16]; iv = 00 00 00 00 || r as uint32 big-endian || 00 6d 61 74 74 65 6c 00 (the ASCII 'mattel' between two zero bytes); state = AES-128-CTR(key, iv, state), all 32 bytes."
        - "3. session_key = state[0:16]."
      notes: >
        CTR increments the whole 16-byte counter block as one big-endian
        integer (standard CTR), so the second block of each round uses the
        IV with its last byte 01. 'mattel' is a fixed protocol constant, not
        a secret. Both sides compute this; nothing about it is per-device.
    frame:
      header: "7e || seq (uint32 BE) || body_len (uint16 BE) || crc8(first 7 bytes). Cleartext, 8 bytes."
      body_len: "Length of the encrypted part = plaintext length + 1 (the body CRC byte)."
      body: "AES-128-CTR(session_key, iv, plaintext || crc8(plaintext))"
      iv_app_to_device: "seq (uint32 BE) || app_nonce (4) || device_salt (4) || 00 00 00 00"
      iv_device_to_app: "seq (uint32 BE) || device_salt (4) || app_nonce (4) || 00 00 00 00"
      crc8: "Polynomial 0x07, initial value 0xFF, no reflection, no final XOR. Check value over ASCII '123456789' is 0xFB. Note this is NOT the schema's `auto: crc8` (init 0x00)."
      sequence: "Client's own counter, starting at 1 for the first frame of a session (ENABLE_RX) and incremented per frame. The device keeps its own counter for notifications."
      max_plaintext: "kvdb/gld09-control states 0x1FF bytes; the largest known command body is 20 bytes."
    body_routes:
      "01 10": "App to device: application command follows as an FE frame. Also seen device-to-app as a short acknowledgement 01 10 XX 00."
      "01 50": "App to device: 01 50 01 is ENABLE_RX. Device to app: application response follows as an FE frame, or a non-FE event the clients ignore."
      "00 7f": "Device to app: acknowledgement event 00 7f 01 XX 00 00 00 00 00 (XX = 03, 06, 07, 12). Not a reply."
    fe_frame: "fe || n || opcode || args || x, n = 1 + len(args), x = n XOR opcode XOR each arg byte."
    encoding_helpers:
      bcd: "Packed BCD: (value // 10) << 4 | value % 10; 0xFF marks 'no value' in schedule times."
      nibble_pack: "Values 0-15 packed two per byte, first value in the high nibble; an odd count gets a leading 0 nibble. In the upstream aggregate command 0x0F means 'leave unchanged'."
    reply_handling: >
      Replies are matched by response opcode. Upstream PR #2 found no proof
      that the device's sequence echoes the request's, and the device pushes
      GLOBAL_STATE, ROUTINE_TASK_STATUS and CURRENT_DATE on its own after
      ENABLE_RX, so a reply of the expected opcode may be unsolicited.
    test_vectors:
      notes: >
        Invented inputs (not from any unit or from the upstream vector file),
        computed with a transcription that imports only a crypto library, and
        reproduced by both stramanu/lumalou 9fa5ecf and kvdb/gld09-control
        6e3aff8.
      crc8:
        input_ascii: "123456789"
        output: "fb"
      key_agreement:
        app_private_scalar: "1111111111111111111111111111111111111111111111111111111111111111"
        device_private_scalar: "2222222222222222222222222222222222222222222222222222222222222222"
        app_public_compressed: "020217e617f0b6443928278f96999e69a23a4f2c152bdf6d6cdf66e5b80282d4ed"
        device_public_compressed: "03d65a93977caa3d1b081852ff57a79e465f1660577304baead505dd3a48589cf3"
        shared_x: "ccfc261f58193c98ca4ad4a53bbac6f0ee29bc4d48438090446908622ca79af6"
        session_key: "ac0ee25389a81249cae457666d29215a"
        session_write_with_nonce_a1a2a3a4: "020217e617f0b6443928278f96999e69a23a4f2c152bdf6d6cdf66e5b80282d4eda1a2a3a4"
      stretch_only:
        shared_x: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
        session_key: "f579f3d6caee3e91f5f9c606e3b4ddcd"
      command_bodies:
        set_light_color_green: "0110fe023c043a"
        set_volume_4: "0110fe02370431"
        request_global_state: "0110fe015352"
        set_current_date_0730_00_monday: "0110fe05300730000103"
        set_r2r_times_sun_none_else_0645: "0110fe0f46ffff06450645064506450645064549"
      frames:
        session_key: "000102030405060708090a0b0c0d0e0f"
        app_nonce: "a1a2a3a4"
        device_salt: "b1b2b3b4"
        tx_seq1_enable_rx: "7e00000001000422f9b2b8ef"
        tx_seq2_set_light_color_green: "7e000000020008bbaeb6896dfb1ccf32"
        tx_seq3_request_global_state: "7e000000030007fde608ee08e41b7e"
        rx_seq9_global_state_frame: "7e00000009001403bf980718dc58e7163ac5d6be2ce1b042be802fed"
        rx_seq9_plaintext: "0150fe0e020110345164001002131010451048"
        rx_seq9_decoded: >
          operation_mode 0 (soother), activity_state 1, music_status 1,
          current_song 3, volume 4, playlist_duration 5 (continuous),
          light_status 1, light_brightness 6, light_color 4 (green),
          nap_status 0, nap_duration 0, r2r_status 1, r2r_alarm_status 0,
          time_prescaler 0, current_stage 2 (settle), clock_display 1,
          clock_brightness 3, clock_format 1 (24-hour),
          routine_music_status 0, task_reward_sfx 1, routine_reward_sfx 0,
          light_duration 4 (continuous), routine_volume 5,
          routine_mode_status 1, alarm_executing 0
  opcodes:
    description: >
      Every application opcode known, hex. `declared` names the command
      above; the rest are listed so nobody re-derives them. Source:
      stramanu/lumalou spec/protocol.json (main), corrected by PR #2 where
      noted, cross-checked with kvdb/gld09-control.
    commands:
      "0x01": "SET_GLOBAL_STATE: eight nibbles [lights_on, brightness, music_on, volume, r2r, r2r_alarm, nap_alarm, routine], 0xF = leave unchanged. Not declared: kvdb/gld09-control reports the unit applies only brightness, volume and r2r from it, which the dedicated commands cover."
      "0x03": "SET_GLOBAL_ON (declared: set_global_on)"
      "0x30": "SET_CURRENT_DATE (declared)"
      "0x31": "REQUEST_CURRENT_DATE (declared)"
      "0x34": "SEND_PAIRING_COMPLETE: the vendor app's end-of-pairing message. Arguments unknown; upstream lists it unsafe. Do not send."
      "0x35": "REQUEST_TOYIC_FW_VERSION (declared)"
      "0x37": "SET_VOLUME (declared)"
      "0x38": "TURN_OFF_AUDIO (declared)"
      "0x39": "REQUEST_VOLUME"
      "0x3A": "SET_LED_BRIGHTNESS (declared)"
      "0x3B": "REQUEST_LED_BRIGHTNESS"
      "0x3C": "SET_LIGHT_COLOR (declared)"
      "0x3D": "REQUEST_LIGHT_COLOR"
      "0x3E": "TURN_OFF_CLOUD_BACKLIGHT (declared: turn_off_night_light)"
      "0x3F": "PLAY_AUDIO (declared)"
      "0x40": "SET_MUSIC_PLAYLIST (declared)"
      "0x41": "REQUEST_MUSIC_PLAYLIST (declared)"
      "0x42": "SET_PLAYLIST_DURATION (declared)"
      "0x43": "REQUEST_PLAYLIST_DURATION"
      "0x44": "SET_R2R_STATUS (declared)"
      "0x45": "REQUEST_R2R_STATUS"
      "0x46": "SET_R2R_TIMES (declared)"
      "0x47": "REQUEST_R2R_TIMES (declared)"
      "0x48": "SET_SLEEPY_TIMES (declared)"
      "0x49": "REQUEST_SLEEPY_TIMES (declared)"
      "0x4A": "SET_R2R_ALARMS (declared)"
      "0x4B": "REQUEST_R2R_ALARM_STATUS (declared)"
      "0x4C": "REQUEST_R2R_ALARMS (declared)"
      "0x4D": "START_NAP_TIME (declared: start_nap)"
      "0x4E": "REQUEST_CURRENT_NAP_TIME_STATUS"
      "0x4F": "SET_NAP_TIME_ALARM: one Alarm-enum byte per the upstream builder. Not declared: kvdb/gld09-control reports it inert on current firmware, and no client or app screen is known to use it."
      "0x50": "REQUEST_NAP_TIME_ALARM_STATUS"
      "0x51": "REQUEST_NAP_TIME_ALARM"
      "0x52": "SET_TIME_PRESCALER (declared, advanced)"
      "0x53": "REQUEST_GLOBAL_STATE (declared)"
      "0x55": "REQUEST_SONG_PLAYING"
      "0x58": "SET_ROUTINE_MODE_STATUS (declared)"
      "0x59": "REQUEST_ROUTINE_MODE_STATUS"
      "0x5A-0x67": "Day routines: SET at 0x5A (Sunday), 0x5C, 0x5E, 0x60, 0x62, 0x64, 0x66 (Saturday); REQUEST at SET + 1 (declared: set_day_routine, request_day_routine)"
      "0x68": "REQUEST_ROUTINE_TASK_STATUS (declared). Named SET_ROUTINE_TASK_STATUS upstream at 9fa5ecf; PR #2 and kvdb/gld09-control use it as a request."
      "0x69": "SET_ROUTINE_MUSIC_STATUS (declared)"
      "0x6A": "REQUEST_ROUTINE_MUSIC_STATUS"
      "0x6B": "ROUTINE_CONTROL_COMMAND (declared: routine_control)"
      "0x6C": "SET_SOOTHER_MODE_LIGHT_DURATION (declared: set_light_duration)"
      "0x6D": "REQUEST_SOOTHER_MODE_LIGHT_DURATION"
      "0x72": "REQUEST_OPERATION_MODE"
      "0x73": "REQUEST_TIME_PRESCALER"
      "0x74": "REQUEST_ACTIVITY_STATE"
      "0x75": "REQUEST_CURRENT_STAGE"
      "0x76": "REQUEST_TRANSMISSION_MODE"
      "0x77": "SET_ROUTINE_MODE_VOLUME (declared: set_routine_volume)"
      "0x78": "REQUEST_ROUTINE_MODE_VOLUME"
      "0x79": "SET_CLOCK_SETTINGS (declared)"
      "0x7A": "REQUEST_CLOCK_SETTINGS (declared)"
      "0x7B": "START_ROUTINE_MODE (declared)"
    responses:
      "0x02": "GLOBAL_STATE (13 bytes; decoded by 4cea0003 format)"
      "0x11": "OTA_COMPLETE"
      "0x12": "TOYIC_FW_VERSION (layout unknown)"
      "0x13": "CURRENT_DATE (payload_formats.CurrentDate)"
      "0x14": "CURRENT_SONG"
      "0x15": "CURRENT_VOLUME"
      "0x16": "LIGHT_STATUS"
      "0x17": "LIGHT_BRIGHTNESS"
      "0x18": "LIGHT_COLOR"
      "0x19": "CURRENT_PLAYLIST (payload_formats.MusicPlaylist)"
      "0x1A": "AUDIO_TIMER_DURATION"
      "0x1B": "TIMER_ABOUT_TO_EXPIRE"
      "0x1C": "NAP_TIME_STATUS"
      "0x1D": "TRANSMISSION_MODE"
      "0x1E": "OPERATION_MODE"
      "0x1F": "ACTIVITY_STATE"
      "0x20": "CURRENT_STAGE"
      "0x21": "READY_TO_RISE_STATUS"
      "0x22": "READY_TO_RISE_TIMES (payload_formats.WeeklyTimes)"
      "0x23": "SLEEPY_TIME_TIMES (payload_formats.WeeklyTimes)"
      "0x24": "NAP_TIME_ALARM_STATUS"
      "0x25": "NAP_TIME_ALARM_TIME"
      "0x26": "READY_TO_RISE_ALARM_STATUS"
      "0x27": "READY_TO_RISE_ALARM_TIMES (payload_formats.WeeklyAlarms)"
      "0x28": "TIME_PRESCALER"
      "0x2B-0x2F": "SUNDAY_ROUTINE .. THURSDAY_ROUTINE (payload_formats.DayRoutine)"
      "0x90": "FRIDAY_ROUTINE"
      "0x91": "SATURDAY_ROUTINE"
      "0x92": "ROUTINE_MODE_STATUS"
      "0x93": "ROUTINE_MUSIC_STATUS (layout unknown)"
      "0x94": "ROUTINE_TASK_STATUS (payload_formats.RoutineTaskStatus)"
      "0x95": "LIGHT_DURATION"
      "0x98": "ROUTINE_VOLUME_LEVEL"
      "0x99": "CLOCK_SETTINGS (payload_formats.ClockSettings)"
    response_layouts_unknown: >
      Only GLOBAL_STATE, CURRENT_DATE, the weekly times and alarms, day
      routines, routine task status, playlist and clock settings have
      established reply layouts. The single-value replies (volume, colour,
      status bytes, ...) are named but their lengths are not established; do
      not guess them from the matching SET argument.
  do_not_write:
    - "Anything on service 00001530-1212-efde-1523-785feabcd123 (Nordic legacy DFU): upstream reports a wrong write bricks the unit."
    - "SEND_PAIRING_COMPLETE (0x34): arguments unknown, listed unsafe upstream."
    - "Any OTA opcode on the MPID channel: none is published; operation mode 5 and response 0x11 show the path exists."

evidence:
  community_implementations: >
    stramanu/lumalou (MIT) main at 9fa5ecf: prose protocol and process
    write-up, the opcode/enum JSON, Python and TypeScript clients, golden
    vectors. The author reports the key stretch and framing were run
    bit-exact against the vendor's native library in an emulator, checked
    against Android HCI captures of the vendor app, and confirmed by
    decrypting real notifications from a unit. PR #2 (open, by a second
    contributor) adds strict decoders, the advertisement and token layout,
    receive-side acknowledgement events, the 0x68 correction and response
    layouts, citing read-only observations of a unit. kvdb/gld09-control
    (MIT) at 6e3aff8 is an independent Python client whose author documents
    live verification of ENABLE_RX, response routes, token fields, advert
    flags, alarm packing, routine encoding, task status and which commands
    are inert. Where the two disagree this spec says so.
  documentation_review: >
    GLD09 owner's manual (Mattel instruction sheet GLD09-0970, 2020): the
    pairing button and 6 ft range, the power-cycle reset, clock loss on power
    failure disabling routines and the sleep trainer, the task list, the
    printed April 2022 digital-service disclaimer, FCC Part 15 Class B and
    ISED statements with no FCC ID printed. Mattel's Smart Connect FAQ: pair
    through the app not phone settings, one controlling phone at a time with
    a 30-second recovery, app-pushed firmware updates.
  identifiers_checked: >
    Company identifier 0x03B6 = "Mattel" in the Bluetooth SIG assigned
    numbers (company_identifiers.yaml, fetched 2026-09-28).
  fcc: >
    No FCC ID is printed in the manual, and the research pass found no GLD09
    grant under Mattel's grantee code PIY. Radio module and chipset are
    therefore unconfirmed (a Nordic nRF5 part is implied by the legacy DFU
    service only).
  open_questions: >
    Whether our own unit accepts every declared command, the reply layouts
    of the single-value requests, the trailing nibble of the weekly alarm
    block, the ranges of routine volume and routine music, what survives a
    power cycle, and whether the Bunny/Whisper share this command set.
  artifacts:
    - type: "public_implementation"
      artifact: "stramanu/lumalou main 9fa5ecfc7f6e82ec02e13d01f00fca7be6852567"
      url: "https://github.com/stramanu/lumalou"
      obtained_via: "git clone, 2026-09-28"
      description: "Protocol write-up, reversing notes, opcode/enum JSON, Python and JS packages. Source of the handshake, framing and opcode table."
    - type: "public_implementation"
      artifact: "stramanu/lumalou pull request #2 head 492c3653dd2ca86d8893b80d560a173357f234a8 (unmerged)"
      url: "https://github.com/stramanu/lumalou/pull/2"
      obtained_via: "git fetch refs/pull/2/head, 2026-09-28"
      description: "Advertisement layout, 192-byte token, acknowledgement events, response layouts, 0x68 as a request. Not yet accepted upstream."
    - type: "public_implementation"
      artifact: "Lumalou web client bundle index-CP__DzxD.js"
      url: "https://lumalou.emanuelestrazzullo.dev/"
      sha256: "30bef51fe4ed6728ccd4a811b7f855368cc587d804a578660da368c2ece70b09"
      obtained_via: "https fetch, 2026-09-28"
      description: "Weekly-times, alarm, day-routine and routine-music builders and their range checks; task and song label order."
    - type: "public_implementation"
      artifact: "kvdb/gld09-control 6e3aff894b0065b760ba44f43a36c7e9988cead9"
      url: "https://github.com/kvdb/gld09-control"
      obtained_via: "git clone, 2026-09-28"
      description: "Independent hardware-tested client: token field map, advertisement flags, unsolicited notifications, alarm and routine encodings, inert commands (0x01 partly, 0x4F)."
    - type: "vendor_documentation"
      artifact: "Mattel instruction sheet GLD09-0970-1102345604-DOM (owner's manual, 28 pp, 2020)"
      url: "https://service.mattel.com/instruction_sheets/GLD09-0970-1102345604-DOM.pdf"
      obtained_via: "vendor site, 2026-09-28"
      description: "Setup, pairing button, reset, clock behaviour, task list. No protocol content, no FCC ID."

remaining_unknowns:
  - "Nothing has been run against a unit by this project. First check: the handshake and a GLOBAL_STATE read."
  - "Reply layouts and lengths of the single-value requests (volume, colour, brightness, playlist duration, status bytes, operation mode, activity state, stage, transmission mode, prescaler, nap alarm, routine music status 0x93) and of TOYIC_FW_VERSION."
  - "Meaning of GLOBAL_STATE activity_state, music_status, nap_status, r2r_alarm_status, routine_music_status, the reward nibbles beyond 0/1, and alarm_executing."
  - "The trailing nibble of the weekly alarm block: ignored padding (kvdb/gld09-control) or a reward-sound id (upstream web client)."
  - "Whether light colour 10 is a documented 'off' (kvdb/gld09-control sends it) or an accident of the firmware."
  - "The real range of routine volume and routine music."
  - "Whether the device salt in the token changes between connections, and what bytes 58-62 of the token hold."
  - "What survives a power cycle besides the clock being lost: schedules, routines, playlist, clock settings, volume."
  - "Whether the device's notification sequence number relates to the request's."
  - "The largest ATT MTU the unit accepts and whether it fragments frames when the MTU is small."
  - "The arguments and effect of SEND_PAIRING_COMPLETE (0x34), and whether SET_NAP_TIME_ALARM (0x4F) does anything on any firmware."
  - "How firmware updates were entered and delivered (Nordic legacy DFU on the BLE module, an OTA path on the MPID channel, or both), and whether an interrupted update bricks the unit. Deliberately not probed."
  - "Radio chipset and FCC ID: no grant found; the legacy DFU service implies a Nordic nRF5 part."
  - "Whether the Bunny (gmn58) and Whisper (ghp38) share the MPID transport, and whether they also advertise the \"MB\" payload that discovery matches on."

