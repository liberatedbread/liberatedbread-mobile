# Xiaomi Mi Band / Amazfit (Huami) — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - Gadgetbridge (Freeyourgadget, GPLv3) — the definitive multi-generation
#     documentation and implementation.
#   - leojrfs Mi Band 2 auth writeup; bgloh Mi Band 1 UUID gist.

device:
  name: "Xiaomi Mi Band / Amazfit (Huami/Zepp) Bands"
  manufacturer: "Xiaomi / Huami (Zepp Health)"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The Mi Band 2+ auth
      characteristic and three-step handshake are from the leojrfs writeup; the
      server-key extraction and per-generation notes are from Gadgetbridge's
      pairing documentation. A public Android HCI capture of a Mi Band 7 and
      the vendor app (Gadgetbridge issue #2753) was reviewed on 2026-11-14;
      it does not exercise the handshake documented here (the Band 7 has no
      00000009 characteristic) and is the source of the Band 7 GATT layout
      and framing under protocol_details.huami_2021_chunked.
  protocol: "ble"
  category: "wearable"
  notes: >
    Xiaomi/Huami (now Zepp) bands and watches — Mi Band 2/3/4/5/6/7 and the
    Amazfit Bip/GTR/GTS/T-Rex family — speak BLE and can be driven locally with
    no cloud once an auth key is known. Gadgetbridge is the definitive
    documentation and implementation (the largest wearable-protocol RE project).

    AUTH: older Mi Band 1/1S/2 pair with a client-chosen key. From ~Mi Band 4 /
    Amazfit Bip Lite onward the auth key is SERVER-generated — it must be
    extracted once from the official app (Mi Fit / Zepp), after which local
    control works offline. Unpairing in the official app invalidates the key.

    GATT (Mi Band 2+): auth characteristic 00000009-0000-3512-2118-0009af100700
    on the custom base 0000xxxx-0000-3512-2118-0009af100700. Three-step
    handshake on the auth characteristic:
      1. send key:      { 0x01, 0x08, <16-byte secret key> }
      2. request random:{ 0x02, 0x08 }
      3. send response: { 0x03, 0x08, <AES-ECB(random) with the key> }
    Encryption is AES/ECB/NoPadding, 16-byte key; success responses are
    { 0x10, <command byte>, 0x01 }.

    MI BAND 7 IS DIFFERENT: a 2022 HCI capture of a Xiaomi Smart Band 7
    (M2129B1) with the vendor app shows NO 00000009 auth characteristic
    anywhere in its GATT table. Auth and most control instead run over a
    chunked, later encrypted, channel on 00000016-/00000017-0000-3512-2118-
    0009af100700 in the FEE0 service, with the auth exchange on endpoint
    0x0082 (protocol_details.huami_2021_chunked). The three-step handshake
    above should therefore not be attempted against a Band 7; which
    generation first made the switch is not established here.

    OLDER Mi Band 1/1S (service FEE0): device info FF01, name FF02, notification
    FF03, user info FF04, control point FF05, realtime steps FF06, activity data
    FF07, battery FF0C.

    Per-generation characteristic maps beyond auth are best taken from
    Gadgetbridge source for the exact model.

  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://codeberg.org/Freeyourgadget/Gadgetbridge"
    license: "GPL-3.0"
    upstream_docs:
      - url: "https://codeberg.org/Freeyourgadget/Gadgetbridge/wiki/Huami-Server-Pairing"
        title: "Gadgetbridge — Huami server pairing"
        covers: "Why newer devices need a server-generated key and how to extract it."
    notes: >
      Not officially documented; Gadgetbridge is the authoritative RE. The
      leojrfs writeup documents the Mi Band 2 auth handshake used here.

  identification:
    service_uuids:
      - "0000fee0-0000-1000-8000-00805f9b34fb"
    local_name_prefixes:
      - "Mi Band"
      - "Amazfit"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "Mi Band"
          service_uuids:
            - "0000fee0-0000-1000-8000-00805f9b34fb"
        notes: >
          Older bands advertise the FEE0 service; the family spans many names
          ("Mi Band", "Amazfit ..."). Gadgetbridge matches per model.
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      Older bands (1/1S/2) pair with a client-chosen key and need no cloud.
      Server-key devices (Mi Band 4/5/6/7, Amazfit Bip Lite, GTR, ...) require a
      one-time extraction of the auth key from the official app, after which
      control is offline. The extraction is an app/data step, not a wire step.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Connect over BLE and run the three-step auth handshake on the auth
          characteristic with the 16-byte key. For server-key devices, extract
          the key once from the official app (e.g. from the app database / logs)
          before connecting.
        ble:
          pairing_required: false
        steps:
          - action: "For server-key bands (Mi Band 4+), pair once in the official app and extract the auth key."
            actor: "user"
          - action: "Connect, send {0x01,0x08,<key>} to the auth characteristic, request a random, and return AES-ECB(random)."
            actor: "client"
            expect: "A {0x10,0x03,0x01} success response authorises the session."
    factory_reset:
      applicable: true
      confidence: medium
      effect: >
        Clears the data held on the band and returns it to factory state, so
        it can be bound again. Activity history synced to the vendor account
        survives in the cloud; only the local copy goes.

        The consequence that matters for local control: unbinding invalidates
        the auth key. A client using an extracted key stops working the moment
        the band is unpaired in the official app, and a fresh key has to be
        extracted from a new binding.
      description: >
        Two routes to the same place. Unpairing in the vendor app (Mi Fitness
        or Zepp Life — the bottom of the device screen) resets the band to
        factory settings as part of unbinding, which is the tidy way. The
        band's own menu carries a factory reset for a band that cannot reach
        its phone.

        Either way, finish by removing the band from the phone's Bluetooth
        settings as well; the OS keeps its own record and a stale one is the
        usual reason a re-bind will not find the band.
      procedures:
        - name: "Unpair from the vendor app"
          verified: false
          basis: >
            Xiaomi's own support documentation on binding and unbinding the
            Smart Band range, which states that unpairing resets the band to
            factory settings.
          power_state: "on"
          glyph: "generic/on-screen-menu.svg"
          steps:
            - action: "In Mi Fitness or Zepp Life, open the Device tab, scroll to the bottom and choose Unpair."
              actor: "user"
              expect: "The band disconnects and returns to factory settings, ready to be set up again."
            - action: "Remove the band from the phone's own Bluetooth settings too."
              actor: "user"
        - name: "Factory reset from the band's own menu"
          verified: false
          basis: "Xiaomi's support documentation for the Smart Band range."
          power_state: "on"
          glyph: "generic/on-screen-menu.svg"
          steps:
            - action: "On the band, open Settings or More, then System, then Factory reset, and confirm."
              actor: "user"
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "No network membership; re-authenticate with the key (or re-extract it after an app unpair)."
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device:
        - "16-byte auth key (client-chosen on old bands, server-generated on newer)"
      issued_to_client:
        - "The auth key (extracted from the official app on server-key devices)"
      notes: >
        The 16-byte auth key gates control; on newer devices it is server-
        generated and must be extracted once from the official app. There is no
        Wi-Fi.

  pairing:
    required: true
    confidence: "medium"
    # The transport bonds with nothing; the three-step handshake on the auth
    # characteristic is what actually authorises a client.
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "vendor_app"
      notes: >
        A 16-byte auth key, not a typed PIN. Bands up to Mi Band 2 let the
        client choose it; from roughly Mi Band 4 and Amazfit Bip Lite onward
        the key is generated server-side and has to be extracted once from Mi
        Fit or Zepp. After that extraction control is entirely offline, which
        is the whole point of recording it.
    exclusivity:
      single_connection: true
      single_bond: false
      recovery: >
        Close the official app before connecting; it reconnects on its own in
        the background and will hold the band.
    unpair:
      supported: true
      requires_factory_reset: false
      clears: >
        The auth key's validity, and with it local control — nothing else on
        the band.
      notes: >
        Unpairing in the official app invalidates the extracted key, so a
        local client that was working stops working with no change on its own
        side. Worth surfacing to a user before they tidy up their phone: the
        key must be extracted again from a fresh pairing.
    enter_pairing_mode:
      required: false
services:
  - uuid: "0000fee0-0000-1000-8000-00805f9b34fb"
    name: "Huami main service (Mi Band 7 chunked channel)"
    notes: >
      As captured on a Mi Band 7 (Gadgetbridge issue #2753; reported, not
      driven by this project). The service also carries 00000001, 00000002,
      00000004 (activity-fetch control: e.g. {0x01, ...<date>} answered by
      {0x10, 0x01, 0x01, ...}), 00000005 (activity data notifications),
      00000006 and 2a2b (Current Time); separate services in the same table
      are 1800, 1801, 1811, 180a, 00001530-0000-3512-2118-0009af100700
      (00001531 control, 00001532 bulk data — the capture shows about 15,000
      writes to 00001532, a file or firmware upload whose content is not
      decoded), 180d heart rate, FEE1 (holding fedd/fede on this band, not
      the auth characteristic), 3802, an unidentified 128-bit service
      cc353442-be58-4ea2-876e-11d8d6976366, 1812 HID and 180f battery.
    characteristics:
      - uuid: "00000016-0000-3512-2118-0009af100700"
        name: "Chunked channel, client to band (Mi Band 7)"
        properties: ["write_without_response", "notify"]
        notes: >
          The client writes its chunked frames here with write-without-
          response; the band notifies its acknowledgements ({0x04, ...}) and
          the session-opening reply here. Framing in
          protocol_details.huami_2021_chunked.
      - uuid: "00000017-0000-3512-2118-0009af100700"
        name: "Chunked channel, band to client (Mi Band 7)"
        properties: ["write_without_response", "notify"]
        notes: >
          The band notifies its chunked frames here; the client writes its
          acknowledgements ({0x04, ...}) back on this characteristic.
  - uuid: "0000fee1-0000-1000-8000-00805f9b34fb"
    name: "Huami vendor service (Mi Band 2+)"
    notes: >
      Auth and control live on the custom base 0000xxxx-0000-3512-2118-
      0009af100700. The auth characteristic below runs the three-step handshake;
      per-model control/notification characteristics are in Gadgetbridge source.
      Not on Mi Band 7: its FEE1 service holds only fedd/fede, and the band
      authenticates over the FEE0 chunked channel above.
    characteristics:
      - uuid: "00000009-0000-3512-2118-0009af100700"
        name: "Auth (Mi Band 2+)"
        properties: ["write", "notify"]
        notes: >
          Three-step handshake: {0x01,0x08,<key>} then {0x02,0x08} then
          {0x03,0x08,AES-ECB(random)}; success is {0x10,<cmd>,0x01}.
        commands:
          auth_send_key:
            description: "Step 1: send the 16-byte key ({0x01,0x08,<key>})."
            encoding: "bytes"
            verification: "reported"
            template: [0x01, 0x08, "{key}"]
            parameters:
              key:
                type: "bytes"
                min_length: 16
                max_length: 16
                description: "The 16-byte auth key (client-chosen on old bands, extracted from the app on new)."
          auth_request_random:
            description: "Step 2: request the random challenge ({0x02,0x08})."
            encoding: "bytes"
            verification: "reported"
            value: [0x02, 0x08]


protocol_details:
  huami_2021_chunked:
    applies_to: "Mi Band 7 (M2129B1), as captured; other generations not checked"
    verification: "reported"
    source: >
      Read off a public Android HCI capture of the vendor app and a Band 7
      (Gadgetbridge issue #2753, 2022-07). The byte positions are what the
      capture shows; field names and flag meanings are this project's
      reading of it. Nothing here was sent to a band by this project.
    channel: >
      Client-to-band frames are write-without-response on 00000016-...;
      band-to-client frames are notifications on 00000017-.... The default
      ATT MTU was in use (no MTU exchange; 20-byte writes).
    session_open: >
      The client first writes the single byte 0x01 to 00000016 and the
      band notifies {0x02, 0x02, 0x01} on the same characteristic. The
      meaning of those bytes is not established.
    frame: >
      Every chunk starts 0x03, <flags>, 0x00, <message handle>, <chunk
      index>. The first chunk of a message (flags bit 0 set) continues with
      a u32 little-endian payload length and a u16 little-endian endpoint,
      then payload; later chunks carry payload only. The length counts
      payload bytes, not the endpoint.
    flags_observed: >
      Bit 0 = first chunk, bit 1 = last chunk (0x03 = a band message in one
      chunk). A sender sets bit 2 on the final chunk to ask for an
      acknowledgement (client 0x06, or 0x07 for a single-chunk message; the
      band occasionally 0x0e) and the receiver then acks. Bit 3 appears on
      most frames after authentication (0x08/0x09/0x0a/0x0c/0x0e) and is
      read as "payload encrypted"; some endpoints stay plain. Encrypted
      payloads are not readable without the session key, and their
      first-chunk layout differs from the plain one and is not decoded
      here.
    ack: >
      {0x04, 0x00, <message handle>, 0x01, <last chunk index>}, sent by the
      receiving side: the band notifies its acks on 00000016, the client
      writes its acks to 00000017.
    endpoints_observed: >
      0x0000 (its reply reads as a list of supported endpoint ids), 0x0082
      (authentication), and some two dozen others, plain or encrypted, after
      authentication.
    auth_exchange_0x0082: >
      Plain (bit 3 clear). Client sends a 51-byte payload {0x02, 0x02,
      0x00, <48 bytes>}, read as its public key for a key agreement; the
      band answers 67 bytes {0x10, 0x02, 0x01, <64 bytes>}, read as a
      16-byte random plus the band's 48-byte public key; the client sends
      65 bytes {0x03, <64 bytes>}, read as its proof; the band answers
      {0x10, 0x03, 0x01} on success — the same {0x10, <command>, 0x01}
      success shape as the older handshake. How the auth key enters the
      exchange, the curve and the session-key derivation are not
      established from the capture (remaining_unknowns). No key material
      from the capture is reproduced here.

entities:
  - platform: "sensor"
    name: "Battery"
    device_class: "battery"
    unit: "%"
    notes: "Battery level (per-model characteristic; see Gadgetbridge)."
  - platform: "sensor"
    name: "Heart Rate"
    unit: "bpm"
    notes: "Heart-rate measurement (standard HR service 0x180D or the vendor characteristic per model)."

helpful_urls:
  - title: "Gadgetbridge (Freeyourgadget)"
    url: "https://codeberg.org/Freeyourgadget/Gadgetbridge"
    description: "GPLv3 — the authoritative multi-generation Mi Band / Amazfit protocol implementation."
  - title: "Gadgetbridge — Huami server pairing"
    url: "https://codeberg.org/Freeyourgadget/Gadgetbridge/wiki/Huami-Server-Pairing"
    description: "Why newer bands need a server-generated key and how it is extracted."
  - title: "leojrfs — Mi Band 2 auth writeup"
    url: "https://leojrfs.github.io/writing/miband2-part1-auth/"
    description: "The three-step AES-ECB auth handshake and the auth characteristic UUID."
  - title: "Xiaomi Smart Band 7 user manual (PDF)"
    url: "https://m.media-amazon.com/images/I/A1np0xcy2RL.pdf"
    kind: "manual"
    description: >
      Vendor manual for the Band 7, including the on-device Settings, System, Factory reset path in this spec.

remaining_unknowns:
  - "Which band generation first replaced the 00000009 three-step handshake with the FEE0 chunked channel; only Mi Band 7 is evidenced here, and the Mi Band 4/5/6 statements rest on Gadgetbridge and the leojrfs writeup."
  - "The Band 7 key agreement: the curve, how the 16-byte auth key enters the exchange, and the session-key and encryption scheme behind the bit-3 frames. Gadgetbridge implements it; it was not transcribed or verified here."
  - "What the Band 7 session-opening {0x01} / {0x02, 0x02, 0x01} exchange negotiates, and the layout of an encrypted first chunk."
  - "What the roughly 15,000 writes to 00001532 in the Band 7 capture were (firmware, watch face or other resource upload), and therefore the Band 7 update path; this spec carries no firmware_update feature."
  - "The Band 7 advertisement: the capture holds no advertising reports, so its advertised name and service UUIDs, and whether the 'Mi Band' prefix matcher finds it, are unverified."
  - "Whether a Band 7 bonds at the link layer; the capture contains ATT traffic only, no HCI events or SMP."

evidence:
  capture_analysis: >
    2026-11-14: the Band 7 capture was parsed locally (ATT reassembly, own
    script) for its GATT table and the framing of the first authentication
    messages. Byte values of key material, user activity data and the
    band's address are deliberately not reproduced.
  artifacts:
    - type: "hci_capture"
      artifact: "mi_band_7.btsnoop_hci.log — Android btsnoop of a Xiaomi Smart Band 7 and the vendor app, attached to Gadgetbridge issue #2753 (opened 2022-07-03), 1,025,614 bytes"
      sha256: "aeab38fada64eca1037578d345a73579314e51326e37b6f50eedbe232839f8a0"
      url: "https://codeberg.org/Freeyourgadget/Gadgetbridge/issues/2753"
      obtained_via: "Public issue attachment, retrieved 2026-09-01"
      description: >
        Full GATT discovery and a vendor-app session. Established: no
        00000009 auth characteristic on Band 7; the FEE0 chunked channel on
        00000016/00000017 (write-without-response + notify); the 0x0082 auth
        exchange framing and its {0x10, cmd, 0x01} success replies; the
        activity-fetch pair 00000004/00000005; a bulk upload on 00001532.
        Negative: no advertising, HCI events or SMP in the file, so nothing
        about the Band 7's advertisement or bonding.
    - type: "fcc_filing"
      artifact: "FCC ID 2AC8UXMSH01HM — Xiaomi Band (Mi Band 1, XMSH01HM), Anhui Huami Information Technology, granted 2014-10-13"
      url: "https://fccid.co/fcc/2AC8UXMSH01HM"
      obtained_via: "fccid.co, 2026-09-26"
      description: "DTS, 2402-2480 MHz, 4.00 mW conducted. Establishes the grantee code; no protocol detail."
    - type: "fcc_filing"
      artifact: "FCC ID 2AC8UXMSH02HM — Mi Band 1S (XMSH02HM), Anhui Huami Information Technology"
      url: "https://fccid.co/fcc/2AC8UXMSH02HM"
      obtained_via: "fccid.co, 2026-09-26"
      description: >
        Second Huami band grant. Negative finding: Mi Band 2 through 7 are not
        indexed under Huami (2AC8U) or Xiaomi Communications (2AFZZ), and the
        Band 3 manual's printed ID 2AC8UXMSH05HM is not on fccid.co.
