device:
  name: OBD-II PID Reference (SAE J1979)
  manufacturer: SAE International
  model: Modes 01-0A (all legislated OBD-II services)
  category: automotive
  type: reference-diagnostic-protocol
  transport: obd2
  # SAE J1979 *is* legislated OBD-II, so 'obd2' is exact, not a compromise.
  protocol: obd2
  # See iso15765-2-can-transport.yaml: 'active' is the schema's label for
  # "still in business, protocol closed/paywalled". Was: standard.
  manufacturer_status: active
  notes: |
    Complete reference for all legislated (emissions-related) OBD-II Parameter IDs.
    Modes 01-0A per SAE J1979 / ISO 15031-5. This is a REFERENCE spec — not a device.
    Every OBD2 vehicle target in this repo leans on these PIDs when its own
    manufacturer-specific functions are unknown.

    All Mode 01 PIDs return data starting at byte 2 (bytes 0-1 are the mode/PID echo).
    Formula: value = (A * 256 + B) unless noted. PIDs beyond 0x4E are manufacturer-
    discretionary and are noted as such. Bit-encoded PIDs list their bit layout.

    MODES:
    - Mode 01: Request current powertrain diagnostic data
    - Mode 02: Request freeze frame data (same PIDs as 01)
    - Mode 03: Request emission-related DTCs
    - Mode 04: Clear/reset emission-related diagnostic information
    - Mode 05: Request oxygen sensor monitoring test results
    - Mode 06: Request on-board monitoring test results for specific monitored systems
    - Mode 07: Request emission-related DTCs detected during current/last driving cycle
    - Mode 08: Request control of on-board system, test, or component
    - Mode 09: Request vehicle information
    - Mode 0A: Request emission-related DTCs with permanent status

obd:
  role: reference
  transport:
    standard: iso15765-4
    bitrate: 500000
    addressing: 11bit
    functional_id: "0x7DF"
    physical_id_base: "0x7E0"
    response_id_base: "0x7E8"

modes:
  - number: "01"
    name: Current Powertrain Data
    description: Live sensor data from the engine and emissions systems
    pids:
      - pid: "00"
        name: PIDs supported [01-20]
        bytes: 4
        description: Bit-encoded. Bit 7 of byte A = PID 01 supported, bit 6 = PID 02, etc.
        formula: bitmask
      - pid: "01"
        name: Monitor status since DTCs cleared
        bytes: 4
        description: Bit-encoded MIL, DTC count, monitor completion status
        formula: bitmask
      - pid: "02"
        name: Freeze frame DTC
        bytes: 2
        description: DTC that triggered the freeze frame
        formula: dtc_decode
      - pid: "03"
        name: Fuel system status
        bytes: 2
        formula: "byte_A=bank1_mode byte_B=bank2_mode"
        values:
          "1": Open loop — insufficient engine temperature
          "2": Closed loop — using oxygen sensor feedback
          "4": Open loop — engine load OR deceleration fuel cut-off
          "8": Open loop — system failure
          "16": Closed loop — but fault in feedback system
      - pid: "04"
        name: Calculated engine load
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
        range: [0, 100]
      - pid: "05"
        name: Engine coolant temperature
        bytes: 1
        formula: "A - 40"
        unit: "°C"
        range: [-40, 215]
      - pid: "06"
        name: Short term fuel trim — Bank 1
        bytes: 1
        formula: "(A - 128) * 100 / 128"
        unit: "%"
        range: [-100, 99.2]
      - pid: "07"
        name: Long term fuel trim — Bank 1
        bytes: 1
        formula: "(A - 128) * 100 / 128"
        unit: "%"
      - pid: "08"
        name: Short term fuel trim — Bank 2
        bytes: 1
        formula: "(A - 128) * 100 / 128"
        unit: "%"
      - pid: "09"
        name: Long term fuel trim — Bank 2
        bytes: 1
        formula: "(A - 128) * 100 / 128"
        unit: "%"
      - pid: "0A"
        name: Fuel pressure (gauge)
        bytes: 1
        formula: "A * 3"
        unit: "kPa"
      - pid: "0B"
        name: Intake manifold absolute pressure
        bytes: 1
        formula: "A"
        unit: "kPa"
      - pid: "0C"
        name: Engine RPM
        bytes: 2
        formula: "(A * 256 + B) / 4"
        unit: "rpm"
      - pid: "0D"
        name: Vehicle speed
        bytes: 1
        formula: "A"
        unit: "km/h"
      - pid: "0E"
        name: Timing advance
        bytes: 1
        formula: "A / 2 - 64"
        unit: "° before TDC"
      - pid: "0F"
        name: Intake air temperature
        bytes: 1
        formula: "A - 40"
        unit: "°C"
      - pid: "10"
        name: MAF air flow rate
        bytes: 2
        formula: "(A * 256 + B) / 100"
        unit: "g/s"
      - pid: "11"
        name: Throttle position
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
      - pid: "12"
        name: Commanded secondary air status
        bytes: 1
        formula: bitmask
      - pid: "13"
        name: Oxygen sensors present (2 banks)
        bytes: 1
        formula: bitmask
        description: "Bit 0-3 = Bank 1 sensors 1-4; Bit 4-7 = Bank 2 sensors 1-4"
      - pid: "14"
        name: Oxygen Sensor 1 — Voltage & Short term fuel trim
        bytes: 4
        formula: "(A/200, (B-128)*100/128 if B!=0xFF else N/A, C/200, (D-128)*100/128 if D!=0xFF else N/A)"
        unit: "V, %"
      - pid: "15"
        name: Oxygen Sensor 2 — Voltage & Short term fuel trim
        bytes: 4
        formula: "(A/200, (B-128)*100/128 if B!=0xFF else N/A, C/200, (D-128)*100/128 if D!=0xFF else N/A)"
      - pid: "16"
        name: Oxygen Sensor 3 — Voltage & Short term fuel trim
        bytes: 4
      - pid: "17"
        name: Oxygen Sensor 4 — Voltage & Short term fuel trim
        bytes: 4
      - pid: "18"
        name: Oxygen Sensor 5 — Voltage & Short term fuel trim
        bytes: 4
      - pid: "19"
        name: Oxygen Sensor 6 — Voltage & Short term fuel trim
        bytes: 4
      - pid: "1A"
        name: Oxygen Sensor 7 — Voltage & Short term fuel trim
        bytes: 4
      - pid: "1B"
        name: Oxygen Sensor 8 — Voltage & Short term fuel trim
        bytes: 4
      - pid: "1C"
        name: OBD standards this vehicle conforms to
        bytes: 1
        formula: bitmask
        values:
          "1": OBD-II (CARB)
          "2": OBD (EPA)
          "4": OBD and OBD-II
          "8": OBD-I
          "16": Not OBD compliant
          "32": EOBD (Europe)
          "64": EOBD and OBD-II
          "128": EOBD and OBD
      - pid: "1D"
        name: Oxygen sensors present (4 banks)
        bytes: 1
        formula: bitmask
      - pid: "1E"
        name: Auxiliary input status
        bytes: 1
        formula: "A ? 'PTO active' : 'PTO inactive'"
      - pid: "1F"
        name: Run time since engine start
        bytes: 2
        formula: "A * 256 + B"
        unit: "seconds"
      - pid: "20"
        name: PIDs supported [21-40]
        bytes: 4
        formula: bitmask
      - pid: "21"
        name: Distance traveled with MIL on
        bytes: 2
        formula: "A * 256 + B"
        unit: "km"
      - pid: "22"
        name: Fuel Rail Pressure (relative to manifold vacuum)
        bytes: 2
        formula: "(A * 256 + B) * 0.079"
        unit: "kPa"
      - pid: "23"
        name: Fuel Rail Gauge Pressure (diesel)
        bytes: 2
        formula: "(A * 256 + B) * 10"
        unit: "kPa"
      - pid: "24"
        name: Oxygen Sensor 1 — Lambda & Voltage
        bytes: 4
        formula: "(A*256+B)*2/65535, (C*256+D)*8/65535"
        description: Wide-band equivalence ratio and voltage
      - pid: "25"
        name: Oxygen Sensor 2 — Lambda & Voltage
        bytes: 4
      - pid: "26"
        name: Oxygen Sensor 3 — Lambda & Voltage
        bytes: 4
      - pid: "27"
        name: Oxygen Sensor 4 — Lambda & Voltage
        bytes: 4
      - pid: "28"
        name: Oxygen Sensor 5 — Lambda & Voltage
        bytes: 4
      - pid: "29"
        name: Oxygen Sensor 6 — Lambda & Voltage
        bytes: 4
      - pid: "2A"
        name: Oxygen Sensor 7 — Lambda & Voltage
        bytes: 4
      - pid: "2B"
        name: Oxygen Sensor 8 — Lambda & Voltage
        bytes: 4
      - pid: "2C"
        name: Commanded EGR
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
      - pid: "2D"
        name: EGR Error
        bytes: 1
        formula: "(A - 128) * 100 / 128"
        unit: "%"
      - pid: "2E"
        name: Commanded evaporative purge
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
      - pid: "2F"
        name: Fuel Tank Level Input
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
      - pid: "30"
        name: Warm-ups since codes cleared
        bytes: 1
        formula: "A"
      - pid: "31"
        name: Distance traveled since codes cleared
        bytes: 2
        formula: "A * 256 + B"
        unit: "km"
      - pid: "32"
        name: Evap. System Vapor Pressure
        bytes: 2
        formula: "(A * 256 + B) / 4 as s16"
        unit: "Pa"
      - pid: "33"
        name: Absolute Barometric Pressure
        bytes: 1
        formula: "A"
        unit: "kPa"
      - pid: "34"
        name: Oxygen Sensor 1 — Lambda & Current
        bytes: 4
        formula: "(A*256+B)*2/65535, (C*256+D)*8/65535 - 128"
      - pid: "35"
        name: Oxygen Sensor 2 — Lambda & Current
        bytes: 4
      - pid: "36"
        name: Oxygen Sensor 3 — Lambda & Current
        bytes: 4
      - pid: "37"
        name: Oxygen Sensor 4 — Lambda & Current
        bytes: 4
      - pid: "38"
        name: Oxygen Sensor 5 — Lambda & Current
        bytes: 4
      - pid: "39"
        name: Oxygen Sensor 6 — Lambda & Current
        bytes: 4
      - pid: "3A"
        name: Oxygen Sensor 7 — Lambda & Current
        bytes: 4
      - pid: "3B"
        name: Oxygen Sensor 8 — Lambda & Current
        bytes: 4
      - pid: "3C"
        name: Catalyst Temperature — Bank 1, Sensor 1
        bytes: 2
        formula: "(A * 256 + B) / 10 - 40"
        unit: "°C"
      - pid: "3D"
        name: Catalyst Temperature — Bank 2, Sensor 1
        bytes: 2
        formula: "(A * 256 + B) / 10 - 40"
        unit: "°C"
      - pid: "3E"
        name: Catalyst Temperature — Bank 1, Sensor 2
        bytes: 2
        formula: "(A * 256 + B) / 10 - 40"
        unit: "°C"
      - pid: "3F"
        name: Catalyst Temperature — Bank 2, Sensor 2
        bytes: 2
        formula: "(A * 256 + B) / 10 - 40"
        unit: "°C"
      - pid: "40"
        name: PIDs supported [41-60]
        bytes: 4
        formula: bitmask
      - pid: "41"
        name: Monitor status this drive cycle
        bytes: 4
        formula: bitmask
      - pid: "42"
        name: Control module voltage
        bytes: 2
        formula: "(A * 256 + B) / 1000"
        unit: "V"
      - pid: "43"
        name: Absolute load value
        bytes: 2
        formula: "(A * 256 + B) * 100 / 255"
        unit: "%"
      - pid: "44"
        name: Commanded Equivalence Ratio
        bytes: 2
        formula: "(A * 256 + B) / 32768"
        unit: "ratio"
      - pid: "45"
        name: Relative throttle position
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
      - pid: "46"
        name: Ambient air temperature
        bytes: 1
        formula: "A - 40"
        unit: "°C"
      - pid: "47"
        name: Absolute throttle position B
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
      - pid: "48"
        name: Absolute throttle position C
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
      - pid: "49"
        name: Accelerator pedal position D
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
      - pid: "4A"
        name: Accelerator pedal position E
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
      - pid: "4B"
        name: Accelerator pedal position F
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
      - pid: "4C"
        name: Commanded throttle actuator
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
      - pid: "4D"
        name: Time run with MIL on
        bytes: 2
        formula: "A * 256 + B"
        unit: "minutes"
      - pid: "4E"
        name: Time since trouble codes cleared
        bytes: 2
        formula: "A * 256 + B"
        unit: "minutes"
      # PIDs 4F-FF are manufacturer-discretionary
      - pid: "4F"
        name: Maximum value for Fuel–Air equivalence ratio, oxygen sensor voltage, oxygen sensor current, and intake manifold absolute pressure
        bytes: 4
        note: manufacturer_discretionary
      - pid: "50"
        name: Maximum value for air flow rate from mass air flow sensor
        bytes: 4
        note: manufacturer_discretionary
      - pid: "51"
        name: Fuel Type
        bytes: 1
        note: manufacturer_discretionary
      - pid: "52"
        name: Ethanol fuel %
        bytes: 1
        formula: "A * 100 / 255"
        unit: "%"
        note: manufacturer_discretionary
      - pid: "5C"
        name: Engine oil temperature
        bytes: 1
        formula: "A - 40"
        unit: "°C"
        note: manufacturer_discretionary

  - number: "03"
    name: Request Emission-Related DTCs
    description: Returns stored diagnostic trouble codes
    response_format:
      - byte: 0
        name: mode_echo
        value: "43"
      - byte: 1
        name: dtc_count
        description: Number of DTCs (divide by 2 for count)
      - byte: 2
        name: dtc_data
        description: "Each DTC = 2 bytes. Byte 1 bit 7-6 = first char (0=P, 1=C, 2=B, 3=U), bit 5-4 = second char (0-3), bits 3-0 = third char MSB. Byte 2 = third char LSB + fourth char."
        repeat: true

  - number: "04"
    name: Clear/Reset Emission-Related Diagnostic Information
    description: Clears DTCs, freeze frame, oxygen sensor test data, and monitor status
    caution: Also resets readiness monitors — will not pass inspection until monitors complete
    response: 'Mode 04 echo: "44" — no data payload (echo, no data)'

  - number: "09"
    name: Request Vehicle Information
    description: Read-only vehicle data — VIN, calibration IDs, CVN, ECU name
    info_types:
      - type: "00"
        name: Info types supported [01-20]
        bytes: 4
        formula: bitmask
      - type: "02"
        name: VIN (Vehicle Identification Number)
        bytes: variable
        formula: ascii
        description: 17-character VIN in ASCII
      - type: "04"
        name: Calibration ID
        bytes: variable
        formula: ascii
      - type: "06"
        name: Calibration Verification Number (CVN)
        bytes: variable
        formula: hex
      - type: "08"
        name: In-use Performance Tracking
        bytes: variable
      - type: "0A"
        name: ECU Name
        bytes: variable
        formula: ascii

source:
  standard: SAE J1979 / ISO 15031-5
  date_spec: "2026-07-28"
