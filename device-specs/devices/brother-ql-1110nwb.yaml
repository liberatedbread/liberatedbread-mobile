    url: "https://github.com/pklaus/brother_ql"
    description: >
      Hardware-tested reference implementation: job builder, per-model
      geometry (raster.py/models.py/labels.py), status decoder, network and
      USB backends. Source of the per-model numbers in this spec.
  - title: "Brother Raster Command Reference (QL series)"
    url: "https://www.jarcomputers.com/images/custom/docs/b471757576aff4ef4eb7f8bd96a113c575133c95_1722315_ql820nwbcyj1_icecat_multimedia_other_digital_assets_2_en_gb-1725017762.pdf"
    description: >
      Brother's own software developer's manual for the raster command set —
      the vendor-authoritative text this spec summarizes.
  - title: "Brother developer FAQ — command printing"
    url: "https://support.brother.com/g/s/es/dev/en/command/faq/index.html?navi=offall"
    description: >
      Network transports for command printing (TCP 9100 / LPR / FTP) and the
      SNMP status OID.
  - title: "QL-1110NWB product page (interfaces, BT profiles)"
    url: "https://www.brother-usa.com/p/desktop-label-printers/QL1110NWB"
    description: >
      Vendor spec sheet: BT 2.1+EDR with SPP/BIP/OPP/HCRP/iAP, Wi-Fi b/g/n,
      Ethernet, Wireless Direct, USB host.
  - title: "QL-1110NWB user manual — reset procedures"
    url: "https://www.manualslib.com/manual/1361694/Brother-Ql-1110nwb.html?page=141"
    description: >
      Button-based reset ladder (Cutter ×2 network / ×4 data+settings /
      ×6 full factory reset) documented in device.setup.factory_reset.
  - url: "https://www.home-assistant.io/integrations/brother/"
    title: "Home Assistant Brother integration"
    description: "HA core integration monitoring Brother network printers over SNMP; covers the QL label-printer family."

  - title: "Brother QL-1110NWB user's guide (PDF)"
    url: "https://www.ptouchdirect.com/content/UMQL1110NWB.pdf"
    kind: "manual"
    description: >
      Full vendor user's guide, including the network setup this spec's raster protocol sits behind.
# Placeholder so the schema's "document at least one access surface" rule is
# satisfied; control is the raw raster stream on TCP 9100, not REST. The Kasa
# and LIFX specs carry the same placeholder for the same reason.
http_endpoints:
  - method: "GET"
    path: "/"
    name: "Web Admin Placeholder"
    status: "placeholder"
    description: >
      Placeholder only. Port 80 serves Brother's web admin UI (network and
      device settings); it is not the control surface. Printing is the raw
      raster byte stream on TCP 9100 / LPR 515 / FTP 21 / Bluetooth Classic
      SPP documented in brother_ql_raster_protocol.

entities:
  - platform: "sensor"
    name: "Media Width"
    notes: >
      mm, from status reply offset 10 (also reveals loaded roll; 0 when no
      media). Bound via the status_request command; there is no GATT
      characteristic on this device.
  - platform: "sensor"
    name: "Printer Errors"
    notes: >
      Bitmask pair at status reply offsets 8-9; decode with the bit tables
      in brother_ql_raster_protocol.status_reply.
