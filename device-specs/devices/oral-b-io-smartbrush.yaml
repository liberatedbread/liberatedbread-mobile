device:
  name: Oral-B iO Smart Brush
  manufacturer: Procter & Gamble
  # iO3 dropped: no source (app SDK, firmware manifests, either RE project)
  # names an iO3 model byte — SonosMetadata.Model starts at M4. iO3 may reuse
  # another type or lack BLE; unverified either way.
  # No per-model protocol difference has been established: the app drives
  # the whole iO line through the same A0F0xxxx service. Listed as variants
  # anyway so a scan result can be matched to one, and so a later finding
  # has somewhere to attach.
  variants:
    - model: "iO Series 4"
    - model: "iO Series 5"
    - model: "iO Series 6"
    - model: "iO Series 7"
    - model: "iO Series 8"
    - model: "iO Series 9"
    - model: "iO Series 10"
  category: personal_care
  type: electric-toothbrush
  transport: "ble-gatt"
  # 'gatt' is not a schema protocol; GATT is the attribute protocol carried over
  # BLE, and the services/characteristics below already say the access is GATT.
  protocol: ble
  # The SIG-assigned company ID, decoded — not the `DC 00` byte pair as it
  # appears little-endian on the wire. 0xDC00 (56320) is unassigned.
  # P&G still ships the iO line; the protocol is simply closed. Per the schema's
  # own guidance that is 'active', not a bespoke 'production'.
  manufacturer_status: active
  testing:
    status: untested
  notes: |
    Extracted by static analysis of the official Oral-B Android app.
    Uses A0F0XXXX-5047-4D53-8208-4F72616C2D42 UUID scheme where XXXX is a
    16-bit short UUID. Suffix "4F72616C2D42" decodes to "Oral-B" in ASCII.
    Manufacturer ID 0x00DC (220) = Procter & Gamble; the advertisement carries
    it little-endian, so the wire bytes read DC 00.
    Protocol versions V001 through V009 across brush generations.
    Discovery uses manufacturer-specific advertisement data (app filters:
    brush >= 5 bytes, charger >= 10; the full brush advertisement is 15 bytes).
    Two device classes: Brush (FFxx UUIDs) and Charger (3Cxx UUIDs).
    Supports OTA firmware updates via dedicated characteristic set. P&G's
    official firmware host fw.iot-dev.alchemy.codes (hardcoded in the app's
    own strings) serves unauthenticated RSA-signed update manifests for model
    bytes 0x0031 (SONOS IO), 0x0034 (iO4), 0x0035 (iO5) and 0x0036 (E-Platform
    = iO6-iO10): E-Platform/iO4/iO5 images are Silicon Labs Gecko Bootloader
    GBL files, legacy SONOS images are TI CC2640 binaries; current firmware is
    E-Platform V82 and iO4/iO5 V36; the legacy SONOS firmware train tops
    out at V50. China is served from a separate S3 host
    (email-assets-271825783008-cn-north-1.s3.cn-north-1.amazonaws.com.cn).

    Transport parameters (app v10.8.0 BLE SDK): the app negotiates a
    515-byte MTU on connect, requests CONNECTION_PRIORITY_HIGH (50 ms
    latency) for active sessions, and serializes commands per UUID — writes
    to the same characteristic are queued, different characteristics
    interleave (RxJava command queue). Session/history data uses FF29 in a
    write-then-notify pattern with timestamp-based sync.

  # No local name prefix and no advertised service UUID: as the setup notes
  # below say, a scanner filtering on services never sees this brush at all.
  # The manufacturer-data company ID is the only pre-connect signal there is.
  identification:
    manufacturer_data:
      company_id: 220
      company_id_hex: "0x00DC"
      description: >
        Procter & Gamble (SIG-assigned 220). The advertisement carries the ID
        little-endian, so the wire bytes read `DC 00` — this field is the
        DECODED value, which is what a scanner compares against, not the bytes
        in advertisement order. Both device classes advertise under it: brush
        payloads are 15 bytes (the app accepts >= 5), chargers >= 10.

  setup:
    required: false
    confidence: medium
    notes: >
      The brush needs no provisioning. It advertises manufacturer-specific data
      under P&G's manufacturer ID (0x00DC) whenever it is switched on, and
      exposes its state and control characteristics to any client that connects.
      The Oral-B app's account is for storing brushing history in P&G's cloud;
      the brush is not bound to it.

      Confidence is medium: the UUID scheme and device classes are recovered
      from the vendor app, but the connect flow has not been exercised
      against hardware here. Note that discovery is by manufacturer data, not by
      service UUID — a scanner filtering on services will not see the brush.
    methods:
      - type: ble_direct
        description: >
          Connect over GATT to a brush (FFxx UUIDs) or its charger (3Cxx UUIDs)
          and read state directly. No pairing or account is involved.
        verified: false
        ble:
          pairing_required: false
        steps:
          - action: "Switch the brush on, or seat it on its charger, so it advertises."
            actor: user
          - action: >
              Scan for manufacturer-specific advertisement data under
              manufacturer ID 0x00DC. The app's brush filter needs at least 5
              payload bytes (charger filter 10); the full brush advertisement
              is 15 bytes.
            actor: client
          - action: "Connect over GATT and discover the A0F0xxxx-5047-4D53-8208-4F72616C2D42 services."
            actor: client
          - action: >
              Read the protocol version characteristic to select the right
              command set — generations differ across V001 to V009.
            actor: client
            expect: "A version string in the V001-V009 range."
    factory_reset:
      applicable: true
      confidence: medium
      effect: >
        Returns the handle to its default settings. What that includes varies
        by route and by model — the app's reset covers brush settings, the
        handle-button reset covers the handle, and the iOsense charger's reset
        covers the charger's own state.
      description: >
        Three different resets that people conflate because the vendor calls
        them all a reset. Pick by what actually needs clearing: brushing modes
        and preferences (app), a handle that has stopped responding (power
        button), or a smart charger that has lost its head (iOsense). Bluetooth
        is switched OFF from the display models' settings menu rather than by
        any of them, which is the thing to reach for when the goal is simply to
        stop a handle talking to a phone.
      procedures:
        - name: "Power button held until the LED flashes"
          verified: false
          basis: >
            Oral-B iO Series user documentation and third-party
            reproductions of it; published hold times vary between about ten
            and fifteen seconds, so watch the LED rather than the clock.
          hold_seconds: 15
          power_state: "on"
          glyph: "generic/hold-button.svg"
          indicator: "The handle's LED flashes."
          indicator_glyph: "generic/led-flashing.svg"
          steps:
            - action: "Press and hold the handle's power button until the LED flashes, then release."
              actor: "user"
        - name: "Factory reset from the handle's own settings menu (display models)"
          verified: false
          basis: "Oral-B iO Series user documentation for the models with an interactive display."
          power_state: "on"
          glyph: "generic/on-screen-menu.svg"
          applies_to: ["iO models with an interactive display"]
          steps:
            - action: "Cycle through the modes on the display until Settings, then choose the factory reset entry."
              actor: "user"
              notes: "The same menu is where Bluetooth can simply be disabled, which is often what is really wanted."
        - name: "iOsense charger reset"
          verified: false
          basis: "Oral-B iO Series user documentation for handles supplied with the iOsense charger."
          power_state: "on"
          applies_to: ["Handles supplied with the iOsense smart charger"]
          glyph: "generic/hold-button.svg"
          indicator: "An orange light on top of the charger, then LEDs spinning orange clockwise."
          steps:
            - action: "Touch and hold the charger's button until an orange light appears on top, then release."
              actor: "user"
            - action: "Tap the button once more while the orange light is showing."
              actor: "user"
              expect: "The charger's LEDs spin orange clockwise to confirm."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The brush joins no network and holds no bond, so any client may connect
        once the previous one disconnects.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        BLE-only; no WiFi passphrase is transferred. The P&G account credential
        is held by the app, not by the brush. The link is unauthenticated, so
        brushing data is readable by anyone in range.

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
services:
  - uuid: "a0f0ff00-5047-4d53-8208-4f72616c2d42"
    name: Oral-B iO Brush Service
    notes: >
      Brush service. The iO Sense charger has its own recovered service,
      a0f03e00-5047-4d53-8208-4f72616c2d42, declared separately below; its 3Cxx
      characteristics do not belong in this brush service. Older (pre-iO)
      brushes additionally expose FF01 DeviceID, FF02 DeviceInfo, FF03 UserID
      and FF2A (purpose unknown), per MatrixEditor/oralb-io and
      Bluetooth-Devices/oralb-ble; app v10 does not reference them.
    characteristics:
      - uuid: "a0f0ff04-5047-4d53-8208-4f72616c2d42"
        name: DeviceState
        properties: ["read"]
        description: >
          Current device state. State enum (from the app's device-state
          model):
          0=UNKNOWN, 1=INIT, 2=IDLE, 3=RUN, 4=CHARGE, 5=SETUP,
          6=FLIGHT_MENU, 7=CHARGE_FORBIDDEN, 8=PRE_RUN, 9=PAUSE,
          10=POST_BRUSHING_STATISTICS, 113=FINAL_TEST, 114=PCB_TEST,
          115=SLEEP, 116=TRANSPORT, 117=CALIBRATION_TEST. Plus SubState
          flags: -1=UNKNOWN, 0=TRANSPORT_DISABLED_DEACTIVATE_TIMER_DISABLED,
          1=TRANSPORT_ENABLED_DEACTIVATE_TIMER_DISABLED,
          3=TRANSPORT_ENABLED_DEACTIVATE_TIMER_ENABLED. Advertising byte 7
          carries the same State value.
      - uuid: "a0f0ff05-5047-4d53-8208-4f72616c2d42"
        name: BatteryLevel
        properties: ["read"]
        notes: >
          Length-gated, little-endian battery record. The older one-byte
          percentage still works. Protocol 6 introduced remaining runtime;
          protocol 8 added the electrical fields. Protocol 6 treats zero
          runtime as unavailable, while later versions can return a genuine
          zero. Runtime 0xffff is unavailable; current -1 is unavailable.
          Do not decode absent electrical fields from a shorter record.
        format:
          - {offset: 0, length: 1, name: "battery_percent", type: "uint8", unit: "%", device_class: "battery"}
          - {offset: 1, length: 2, name: "remaining_brushing_seconds", type: "uint16", endianness: "little", unit: "s", device_class: "duration", notes: "0xffff unavailable; zero is unavailable only on protocol 6."}
          - {offset: 3, length: 2, name: "battery_millivolts", type: "uint16", endianness: "little", unit: "mV", device_class: "voltage"}
          - {offset: 5, length: 2, name: "battery_current", type: "int16", endianness: "little", unit: "mA", device_class: "current", notes: "Signed; -1 unavailable."}
          - {offset: 7, length: 1, name: "battery_temperature", type: "int8", unit: "C", device_class: "temperature"}
      - uuid: "a0f0ff06-5047-4d53-8208-4f72616c2d42"
        name: ButtonState
        properties: ["notify"]
        description: Power and mode button press events
      - uuid: "a0f0ff07-5047-4d53-8208-4f72616c2d42"
        name: BrushingMode
        properties: ["read"]
        description: Current brushing mode (9 modes in the V006 enum; 11 total with the V009 additions)
      - uuid: "a0f0ff08-5047-4d53-8208-4f72616c2d42"
        name: BrushingTime
        properties: ["read"]
        description: "Brushing session duration (2 bytes: min, sec)"
      - uuid: "a0f0ff09-5047-4d53-8208-4f72616c2d42"
        name: ToothbrushQuadrant
        properties: ["read"]
        description: Current quadrant coverage and progress
      - uuid: "a0f0ff0a-5047-4d53-8208-4f72616c2d42"
        name: Smiley
        properties: ["read"]
        description: Brushing quality feedback (1 byte face value)
      - uuid: "a0f0ff0b-5047-4d53-8208-4f72616c2d42"
        name: Pressure
        properties: ["read"]
        description: Pressure sensor reading
      - uuid: "a0f0ff0d-5047-4d53-8208-4f72616c2d42"
        name: SensorData
        properties: ["read"]
        description: Accelerometer/motion sensor data for position tracking
      - uuid: "a0f0ff0e-5047-4d53-8208-4f72616c2d42"
        name: DashboardDataStreamChunk
        properties: ["notify"]
        description: Real-time dashboard data stream chunks
      - uuid: "a0f0ff10-5047-4d53-8208-4f72616c2d42"
        name: AccessControl
        properties: ["write"]
        description: BLE access control and pairing management
      - uuid: "a0f0ff21-5047-4d53-8208-4f72616c2d42"
        name: Configure
        properties: ["write"]
        description: >
          Metadata read/write (device UUID, FW versions, git commit hash).
          Carries the SonosMetadata model: Model M4-M10 (M10 has value 16 —
          no M3/iO3 exists), 19-value Color enum, Language enum,
          GumGuardSetting (OFF/ON/HD), PostBrushingStatisticsConfiguration.
          Metadata length grew 14 to 30 bytes at V008 (see
          protocol_changelog).
      - uuid: "a0f0ff22-5047-4d53-8208-4f72616c2d42"
        name: RTC
        properties: ["write"]
        description: Real-time clock (4 bytes, seconds since 2000-01-01)
      - uuid: "a0f0ff23-5047-4d53-8208-4f72616c2d42"
        name: Timezone
        properties: ["write"]
        description: Timezone offset configuration
      - uuid: "a0f0ff24-5047-4d53-8208-4f72616c2d42"
        name: BrushTimer
        properties: ["read"]
        description: "Timer state flags (bitmask: prof, quad, tongue, timer)"
      - uuid: "a0f0ff25-5047-4d53-8208-4f72616c2d42"
        name: BrushModes
        properties: ["read"]
        description: Available brushing modes bitmap
      - uuid: "a0f0ff26-5047-4d53-8208-4f72616c2d42"
        name: QuadrantTimer
        properties: ["read"]
        description: Per-quadrant timing data
      - uuid: "a0f0ff27-5047-4d53-8208-4f72616c2d42"
        name: TongueTime
        properties: ["read"]
        description: Tongue cleaning timer duration
      - uuid: "a0f0ff28-5047-4d53-8208-4f72616c2d42"
        name: PressureConfiguration
        properties: ["write"]
        description: Pressure sensor config (visual signal, reduced speed)
      - uuid: "a0f0ff29-5047-4d53-8208-4f72616c2d42"
        name: SelectedData
        properties: ["read", "notify"]
        notes: >
          Retained latest-session summary, also readable through the charger's
          0x37 passthrough. Protocol 7/8 uses the 21-byte layout in
          protocol_details.retained_session_ff29; protocol 6 differs. The
          captured direct client reads it after session settlement without an
          FF21 control command.
      - uuid: "a0f0ff2b-5047-4d53-8208-4f72616c2d42"
        name: MyColor
        properties: ["write"]
        description: LED ring colour (RGB)
      - uuid: "a0f0ff2c-5047-4d53-8208-4f72616c2d42"
        name: ConfigureDashboard
        properties: ["write"]
        description: Dashboard display configuration
      - uuid: "a0f0ff2d-5047-4d53-8208-4f72616c2d42"
        name: RefillReminder
        properties: ["write"]
        description: Brush head replacement reminder
      - uuid: "a0f0ff2e-5047-4d53-8208-4f72616c2d42"
        name: PostBrushingStatisticsConfiguration
        properties: ["write"]
        description: Post-brushing statistics screen configuration
      - uuid: "a0f0ff81-5047-4d53-8208-4f72616c2d42"
        name: OTACommand
        properties: ["write"]
        description: Firmware update command
      - uuid: "a0f0ff82-5047-4d53-8208-4f72616c2d42"
        name: OTAPayLoad
        properties: ["write"]
        description: Firmware update data payload
      - uuid: "a0f0ff83-5047-4d53-8208-4f72616c2d42"
        name: OTAVerify
        properties: ["read"]
        description: Firmware payload verification
      - uuid: "a0f0ff84-5047-4d53-8208-4f72616c2d42"
        name: OTAState
        properties: ["notify"]
        description: Firmware update state machine
      - uuid: "a0f0ff85-5047-4d53-8208-4f72616c2d42"
        name: OTATransferSize
        properties: ["read"]
        description: Firmware transfer block size

  - uuid: "a0f03e00-5047-4d53-8208-4f72616c2d42"
    name: "Oral-B iO Sense charger service"
    notes: >
      Independently captured charger service, separate from the brush service.
      Protocol-2 headers are [operation, command]: GET c0, POST c1, EXECUTE c2.
      Every transaction ends with e0 on 3C00. Use the exact sequence in
      protocol_details.charger_bridge rather than issuing an isolated header.
    characteristics:
      - uuid: "a0f03c00-5047-4d53-8208-4f72616c2d42"
        name: "Charger command header and transaction delimiter"
        properties: ["write"]
        role: "command"
        notes: "Carries the [operation, command] header and final e0 delimiter. The captured implementation serializes one complete transaction at a time."
      - uuid: "a0f03c01-5047-4d53-8208-4f72616c2d42"
        name: "Charger returned data"
        properties: ["read", "notify"]
        notes: "Returned data is [command, operation, payload…]. A passthrough brush read returns 37 c1 uuid_lsb uuid_msb operation success length data…."
      - uuid: "a0f03c02-5047-4d53-8208-4f72616c2d42"
        name: "Charger command payload"
        properties: ["write"]
        role: "bulk"
        notes: "Payload for the command named by the 3C00 header. A brush characteristic read uses uuid_lsb uuid_msb 01 00, then e0 on 3C00."
      - uuid: "a0f03c03-5047-4d53-8208-4f72616c2d42"
        name: "Charger command status"
        properties: ["read", "notify"]
        notes: "Status is [command, operation, result], with 01 observed for success. Validate this before accepting returned data."

advertising:
  discovery_method: manufacturer_data
  # Byte map from the app's own advertisement model (15-byte
  # serialization), corroborated field-for-field by MatrixEditor/oralb-io
  # brush.py and Bluetooth-Devices/oralb-ble parser.py. There is no battery
  # byte — battery level comes from the FF05 GATT read.
  manufacturer_data_format:
    - byte_offset: 0
      name: manufacturer_length
      size: 1
      description: Length of the manufacturer data structure
    - byte_offset: 1
      name: ad_type
      size: 1
      description: AD type (manufacturer-specific data)
    - byte_offset: 2
      name: company_id
      size: 2
      description: "0xDC 0x00 little-endian = 0x00DC (Procter & Gamble)"
    - byte_offset: 4
      name: protocol_version
      size: 1
      description: Protocol version (V001-V009)
    - byte_offset: 5
      name: device_type
      size: 1
      description: Brush model variant (iO 4-10; no source names an iO3 byte)
    - byte_offset: 6
      name: software_version
      size: 1
      description: Firmware/software version
    - byte_offset: 7
      name: device_state
      size: 1
      description: Device state — same State enum as the FF04 DeviceState characteristic
    - byte_offset: 8
      name: status
      size: 1
      description: "Bit field: bit 3 = power-button press, bit 2 = mode-button press, bit 7 = high pressure"
    - byte_offset: 9
      name: brush_time_min
      size: 1
      description: Brushing timer minutes
    - byte_offset: 10
      name: brush_time_sec
      size: 1
      description: Brushing timer seconds
    - byte_offset: 11
      name: brush_mode
      size: 1
      description: Current brushing mode
    - byte_offset: 12
      name: brush_progress
      size: 1
      description: Brushing progress — used to derive the smiley
    - byte_offset: 13
      name: quadrant_or_subtype
      size: 1
      description: Quadrant completion (V001-V007) or device sub-type (V008/V009)
    - byte_offset: 14
      name: total_quadrants
      size: 1
      description: Total quadrant count
  minimum_length: 5

entities:
  - platform: "sensor"
    name: "Battery"
    device_class: "battery"
    unit: "%"
    state_characteristic: "a0f0ff05-5047-4d53-8208-4f72616c2d42"
    state_mapping: {value: "battery_percent"}
    notes: "First byte of the length-gated FF05 battery record."
  - platform: "sensor"
    name: "Remaining Brushing Time"
    device_class: "duration"
    unit: "s"
    state_characteristic: "a0f0ff05-5047-4d53-8208-4f72616c2d42"
    state_mapping: {value: "remaining_brushing_seconds"}
    notes: "Protocol 6+ only; 0xffff unavailable, zero unavailable only on protocol 6."
  - platform: "sensor"
    name: "Battery Voltage"
    device_class: "voltage"
    unit: "mV"
    state_characteristic: "a0f0ff05-5047-4d53-8208-4f72616c2d42"
    state_mapping: {value: "battery_millivolts"}
    notes: "Protocol 8+ only; absent on shorter records."
  - platform: "sensor"
    name: "Battery Current"
    device_class: "current"
    unit: "mA"
    state_characteristic: "a0f0ff05-5047-4d53-8208-4f72616c2d42"
    state_mapping: {value: "battery_current"}
    notes: "Signed protocol 8+ field; -1 unavailable. No charge/discharge sign convention is inferred."
  - platform: "sensor"
    name: "Battery Temperature"
    device_class: "temperature"
    unit: "C"
    state_characteristic: "a0f0ff05-5047-4d53-8208-4f72616c2d42"
    state_mapping: {value: "battery_temperature"}
    notes: "Signed protocol 8+ byte; absent on shorter records."

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["vendor_ble"]
      transport: "ble"
      image:
        signing: "unknown"
        algorithm: "unknown"
        source: "public_url"
        format: "Silicon Labs Gecko Bootloader GBL (E-Platform, iO4, iO5); TI CC2640 binary (legacy SONOS)."
        notes: >
          P&G's firmware host https://fw.iot-dev.alchemy.codes serves
          update manifests without authentication for model bytes 0x0031
          (SONOS IO), 0x0034 (iO4), 0x0035 (iO5) and 0x0036 (E-Platform =
          iO6-iO10); China uses a separate S3 host (device.notes). The
          manifests are RSA-signed, and MatrixEditor/oralb-io ships the P&G
          public key that verifies them — that is the app's check. Whether
          the brush's own bootloader verifies the image (a GBL can carry an
          ECDSA signature and AES encryption) is not established.
      enter:
        how: "unknown"
        notes: >
          The update runs over vendor characteristics inside the one brush
          service a0f0ff00-…: OTACommand a0f0ff81 (write), OTAPayLoad
          a0f0ff82 (write), OTAVerify a0f0ff83 (read), OTAState a0f0ff84
          (notify) and OTATransferSize a0f0ff85 (read). The command bytes
          that start an update are not recorded in this spec;
          MatrixEditor/oralb-io ships a working OTA client.
      dfu_mode:
        notes: "No update-mode name, address or advertisement is recorded."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        A vendor protocol carrying another stack's image: the GBL files are
        Silicon Labs format but travel over P&G's own characteristics, not
        the Silicon Labs OTA service. dfu.services is omitted because the
        OTA characteristics share a0f0ff00 with every ordinary brush
        characteristic; a GATT explorer should treat a0f0ff81-a0f0ff85 as
        the update path and never write them.

# Vendor-specific protocol detail this schema does not model. Namespaced so the
# top level can stay closed; nothing here is a declared contract.
protocol_details:
  charger_advertisement:
    full_packet_bytes: 18
    manufacturer_value_bytes: 14
    company_id: 220
    company_id_hex: "0x00DC"
    fields:
      - {offset: 4, name: "protocol_version", type: "uint8"}
      - {offset: 5, name: "device_type", type: "uint8", value: 0xa2, meaning: "Stargate / iO Sense charger"}
      - {offset: 6, name: "software_major_minor_patch", length: 3, type: "bytes"}
      - {offset: 9, name: "server_mode", type: "uint8", notes: "Enumeration not established"}
      - {offset: 10, name: "advertised_ble_mac", length: 6, type: "bytes", notes: "Owner identifier; redact from public fixtures"}
      - {offset: 16, name: "body_color", type: "uint8"}
      - {offset: 17, name: "connection_status", type: "uint8", notes: "Bitfield, not an enum"}
    connection_status_bits:
      0: "Wi-Fi connected"
      1: "Internet connected"
      2: "Cloud connected"
      3: "Brush connected"
      4: "Brush charging"
      5: "Touchpad active"
      6: "Brush paired"
      7: "Demo mode"
    notes: >
      Offsets are in the complete manufacturer AD structure. The 14-byte
      manufacturer value starts at full-packet offset 4. The vendor filter only
      requires length >9, but its builder reads through byte 17, so a robust
      parser requires all 18 bytes before decoding every field. Advertisements
      contain availability, not timer, pressure, zone, score or session data.

  charger_bridge:
    service: "a0f03e00-5047-4d53-8208-4f72616c2d42"
    operations: {get: 0xc0, post: 0xc1, execute: 0xc2, end_transaction: 0xe0}
    transaction: "3C00 [operation, command]; optional 3C02 payload; 3C00 e0; validate 3C03 [command, operation, result] with result 01 before using returned 3C01 data"
    serialization: "One complete transaction at a time; the tested charger rejects batched records. The charger forwards brush reads only while it owns the single brush connection."
    brush_passthrough_read:
      header_hex: "c1 37"
      payload: "uuid_lsb uuid_msb 01 00 on 3C02"
      example: "08 ff 01 00 reads FF08; finish with e0 on 3C00"
      success_status_hex: "37 c1 01"
      returned_data: "37 c1 uuid_lsb uuid_msb operation success length data…"
    native_read_only_commands:
      "03": "device ID"
      "14": "Wi-Fi status"
      "15": "RSSI"
      "16": "IoT status"
      "1a": "internet type"
      "1b": "timezone"
      "1e": "firmware"
      "1f": "uptime"
      "25": "hardware"
      "26": "server mode"
      "30": "brightness"
      "31": "clock mode"
      "33": "brush status"
      "34": "brush connection policy"
      "36": "ring color"
      "37": "brush passthrough"
      "39": "brush data"
      "3a": "session status"
      "3b": "automatic update"
      "3d": "touchpad"
      "3f": "date mode"
      "42": "night light"
      "44": "clock text"
      "46": "brush paired"
    boundaries: >
      These native IDs are read-only observations, not permission for
      POST/EXECUTE. Wi-Fi provisioning credential sequencing, durable upload
      queue enumeration and firmware-container decryption are unknown. The
      charger is an outbound network client, not an inbound HTTP/HTTPS/SSH/
      MQTT management API; authenticated vendor upload is not bypassed.

  battery_record:
    characteristic: "a0f0ff05-5047-4d53-8208-4f72616c2d42"
    endianness: "little"
    older_layout_bytes: 1
    protocol_6: "Adds remaining runtime; zero runtime is unavailable on this generation"
    protocol_8: "Adds millivolts, signed milliamps and temperature; shorter records omit absent fields"
    runtime_unavailable: 0xffff
    current_unavailable: -1

  retained_session_ff29:
    protocol_7_8:
      length_bytes: 21
      endianness: "little"
      fields:
        - {offset: 0, length: 4, name: "brush_clock_start", type: "uint32", unit: "s", notes: "Brush-clock value, not automatically Unix epoch"}
        - {offset: 4, length: 2, name: "packed_session_user", type: "uint16", session_mask: 0x1fff, user_shift: 13, user_mask: 0xe000}
        - {offset: 6, length: 2, name: "packed_target_sectors", type: "uint16", target_mask: 0x1fff, sector_shift: 13, sector_mask: 0xe000, target_unit: "s"}
        - {offset: 8, length: 2, name: "duration", type: "uint16", unit: "s"}
        - {offset: 10, length: 2, name: "high_pressure_duration", type: "uint16", scale: 0.1, unit: "s", wire_unit: "100 ms"}
        - {offset: 12, length: 2, name: "low_pressure_duration", type: "uint16", scale: 0.1, unit: "s", wire_unit: "100 ms"}
        - {offset: 14, length: 1, name: "average_pressure", type: "uint8", scale: 100, unit: "mN", wire_unit: "100 mN"}
        - {offset: 15, length: 1, name: "maximum_pressure", type: "uint8", scale: 100, unit: "mN", wire_unit: "100 mN"}
        - {offset: 16, length: 1, name: "high_pressure_events", type: "uint8", unit: "count"}
        - {offset: 17, length: 1, name: "low_pressure_events", type: "uint8", unit: "count"}
        - {offset: 18, length: 1, name: "power_on_count", type: "uint8", unit: "count"}
        - {offset: 19, length: 1, name: "mode", type: "uint8", notes: "Decode using the packet's protocol version"}
        - {offset: 20, length: 1, name: "ending_battery_percent", type: "uint8", unit: "%", notes: "Present only when <=100"}
    protocol_6: "Different 20-byte layout; do not decode with the protocol_7_8 table"
    protocol_9: "The public implementation registers the protocol_7_8 decoder for compatibility; physical verification remains limited"
    availability: "Latest retained summary can change seconds after a session; anonymous direct read worked in the captured implementation, while charger availability has a settlement window"

  service_data_diagnostics:
    service_data_a:
      length_bytes: 16
      endianness: "little"
      fields:
        - {offset: 0, length: 2, name: "ideal_full_capacity", type: "uint16", notes: "Unit not established"}
        - {offset: 2, length: 2, name: "average_motor_current", type: "uint16", notes: "Unit not established"}
        - {offset: 4, length: 4, name: "total_motor_runtime", type: "uint32", unit: "s"}
        - {offset: 8, length: 4, name: "total_pressure_time", type: "uint32", unit: "s"}
        - {offset: 12, length: 4, name: "total_charge_time", type: "uint32", unit: "s"}
    service_data_b:
      length_bytes: 16
      endianness: "little"
      fields:
        - {offset: 0, length: 2, name: "total_charge_events", type: "uint16", unit: "count"}
        - {offset: 2, length: 2, name: "total_full_charge_events", type: "uint16", unit: "count"}
        - {offset: 4, length: 2, name: "total_over_temp_events", type: "uint16", unit: "count"}
        - {offset: 6, length: 2, name: "total_low_temp_events", type: "uint16", unit: "count"}
        - {offset: 8, length: 2, name: "total_brushing_cycles", type: "uint16", unit: "count"}
        - {offset: 10, length: 2, name: "short_term_motor_current", type: "uint16", notes: "Unit not established"}
        - {offset: 12, length: 2, name: "total_recharge_events", type: "uint16", unit: "count"}
        - {offset: 14, length: 2, name: "total_recharge_time", type: "uint16", unit: "h"}
    notes: "These are 16-byte GATT diagnostic structures, not advertisement content."

  sonos_metadata:
    protocol_7_length_bytes: 14
    protocol_8_plus_length_bytes: 30
    fields:
      - {offset: 0, name: "start_marker", value: 0xff}
      - {offset: 1, name: "model", values: {6: "M4", 5: "M5", 4: "M6", 3: "M7", 2: "M8", 1: "M9", 16: "M10"}}
      - {offset: 2, name: "color", notes: "Enumeration retained from the vendor model"}
      - {offset: 3, name: "language", notes: "Enumeration retained from the vendor model"}
      - {offset: 4, length: 8, name: "available_brushing_modes", notes: "Decode each value using the packet's protocol version"}
      - {offset: 12, name: "position_resolution", notes: "Preserve the raw byte"}
      - {offset: 13, name: "gum_guard", values: {0: "off", 1: "on", 2: "HD", 255: "unavailable"}}
      - {offset: 14, length: 16, name: "post_brushing_statistics", protocol: "V008+"}
    statistics_screen_values:
      1: "smiley"
      2: "pressure default"
      3: "pressure high/low"
      4: "pressure complete"
      5: "battery"
      6: "refill status"
      7: "enable via app"
      8: "session tracker week"
      9: "session tracker day"
      10: "session tracker week bars"
    statistics_markers: {default_available_separator: 0xfe, end: 0xff}

  brushing_modes:
    - id: 0x00
      name: OFF
      protocol: V001-V005
    - id: 0x01
      name: DAILY_CLEAN
      protocol: V001+
    - id: 0x02
      name: SENSITIVE
      protocol: V001+
    - id: 0x03
      name: MASSAGE
      protocol: V001+
    - id: 0x04
