      protocol: V001+
    - id: 0x05
      name: DEEP_CLEAN
      protocol: V001+
    - id: 0x06
      name: TONGUE_CLEAN
      protocol: V001+
    - id: 0x07
      name: PRO_CLEAN
      protocol: V001+
    - id: 0x00
      name: V006_CLEAN
      protocol: V006+
    - id: 0x01
      name: V006_SOFT
      protocol: V006+
    - id: 0x02
      name: V006_MASSAGE
      protocol: V006+
    - id: 0x03
      name: V006_POLISH
      protocol: V006+
    - id: 0x04
      name: V006_TURBO
      protocol: V006+
    - id: 0x05
      name: V006_SOFT_PLUS
      protocol: V006+
    - id: 0x06
      name: V006_TONGUE
      protocol: V006+
    - id: 0x07
      name: V006_OFF
      protocol: V006+
    - id: 0x08
      name: V006_SETTINGS
      protocol: V006+
    - id: 0x0B
      name: SMART_ADAPT_MODE
      protocol: V009+
    - id: 0x0C
      name: GENTLE_WHITE
      protocol: V009+

  charger:
    capabilities:
      - wifi_configuration
      - clock_display
      - night_light
      - ring_color
      - demo_mode
      - auto_update
      - brush_passthrough
      - touchpad
      - iot_status
      - server_mode

  protocol_versions:
    - V001
    - V002
    - V003
    - V004
    - V005
    - V006
    - V007
    - V008
    - V009

  # Per-version deltas from the app's protocol-version and advertisement mappings.
  # Byte layouts change significantly across versions — read the protocol
  # version characteristic (or advertising byte 4) before parsing anything else.
  protocol_changelog:
    V001: "Earliest known layout."
    V002: "Extended sensor data."
    V003: "Added pressure configuration."
    V004: "Extended brushing modes."
    V005: "Added charger passthrough."
    V006: "New brushing-mode enum (CLEAN/SOFT/MASSAGE/POLISH/TURBO/...)."
    V007: "Extended sonos metadata."
    V008: "Extended metadata (14 to 30 bytes); advertising byte 13 becomes device sub-type."
    V009: "Added SMART_ADAPT_MODE (0x0B) and GENTLE_WHITE (0x0C) modes."

