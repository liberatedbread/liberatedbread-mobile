remaining_unknowns:
  - "The exact status string while cooking. circulate says 'running', SousVide's placeholder is 'started', and whether a separate heating state exists is unknown."
  - "Whether 'start time' ever replies (SousVide saw nothing, circulate and pycirculate report an echo)."
  - "Whether a link must be bonded before 0000ffe1-0000-1000-8000-00805f9b34fb answers. Anova's reference client and pycirculate connect unbonded, while SousVide always pairs with PIN 0000."
  - "Whether the cooker accepts only one central at a time, and whether it holds one bond or several."
  - "The reply to an out-of-range 'set temp' (circulate gives the accepted range as 5.0-99.9 °C / 41.0-211.8 °F) and to a non-numeric one."
  - "The maximum 'set timer' value, and what the cooker does when the countdown reaches zero (SousVide's interface says cooking stops, and nothing else confirms it)."
  - "The out-of-box temperature unit, and whether the unit and calibration offset persist across power loss."
  - "What the 800 W model replies to 'get id card', and the reply formats of 'version' and 'clear alarm' on the 900 W model."
  - "Which hardware revisions ship the 0000ffe0-0000-1000-8000-00805f9b34fb serial service and which ship the Nano's 0e140000-0af1-4582-a242-773e63054c68 service, e.g. whether any late 'A3' unit moved to the Nano stack."
  - "Whether the cooker is built on an HM-10-style TI CC254x module (hypothesis from the UUID layout and one TI OUI). Its full GATT table and characteristic properties are unrecorded."
  - "Whether the address is public, which decides whether it is a stable identity key."
  - "The 900 W model's BLE Wi-Fi onboarding commands, and how its passphrase is protected."
  - "Whether either model takes firmware updates. No BLE update path is known. The 900 W model's 'version' command and the vendor cloud's update negotiation suggest cloud updates for Wi-Fi units, unconfirmed."
  - "How long the vendor app keeps supporting these cookers. The 2025 Bluetooth sunset was cancelled on 2025-01-16, and a 2026 store review reports the app reconnecting to an old cooker."

