  - title: "Understand OBDLink Bluetooth Adapter LEDs"
    url: "https://support.obdlink.com/support/solutions/articles/43000722033-understand-obdlink-bluetooth-adapter-leds"
    description: "Button and LED semantics: press to pair (rapid blue blink), hold to factory reset."
  - title: "Restore OBDLink Bluetooth Adapter to Factory Settings"
    url: "https://support.scantool.net/support/solutions/articles/43000714324-restore-obdlink-bluetooth-adapter-to-factory-settings"
    description: "Factory reset procedure: hold button 15 s until POWER LED flashes rapidly."
  - title: "Update OBDLink Adapter Firmware"
    url: "https://support.obdlink.com/support/solutions/articles/43000705180-update-obdlink-adapter-firmware"
