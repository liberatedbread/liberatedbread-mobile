# OBDLink MX+ — Device Specification
# Status: In Progress. Radio-side facts are recovered from static analysis of the
#         vendor Android app (OBDLink 7.4.0) and vendor/community documentation;
#         nothing has been confirmed against hardware yet. See
#         research-notes/obdlink-mx-plus-capture-plan.md for the hardware checklist.
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "OBDLink MX+"
  manufacturer: "OBD Solutions LLC (ScanTool.net)"
  manufacturer_status: "active"
  protocol: "ble"
  category: "vehicle"
  notes: >
    Dual-mode Bluetooth OBD-II adapter on an STN chipset (STN2255 on original
    units — out of production per OBDLink FRPM rev F §3.1; STN2256 on current
    production, reported). Unlike the BLE-only OBDLink CX, the MX+ leads with
    Bluetooth Classic v3.0 (SPP + Apple iAP2, so iOS works over MFi) and also
    exposes a BLE GATT serial pipe — vendor spec sheet lists "Class 1.5
    Bluetooth v3.0, Profiles: SPP, iAP2" and the FRPM documents MX+ BLE
    output. The vendor app carries both a Classic driver and a BLE driver and
    treats the MX+ as dual-mode (BluetoothLEDevice.IsDualMode,
    DualModeRequiresClassicBluetoothException in the app's OCTech.OBD2
    assembly).

    The MX+ is one of only three wireless OBDLink adapters (MX, MX+, EX) that
    reach Ford MS-CAN (J1962 pins 3/11) and GM SW-CAN / GMLAN single-wire CAN
    (pin 1) — the `alt_can_bus` capability. That is what tools like FORScan
    and the vendor's own enhanced diagnostics need for body and chassis
    modules.

    Evidence base: static analysis of the official OBDLink Android app
    (package OCTech.Mobile.Applications.OBDLink, version 7.4.0, a .NET MAUI
    app — AOT assemblies recovered from the libassembly-store.so blob and
    decompiled). All app-derived facts are marked verification: reported
    until replayed against hardware. Nothing here has been captured from a
    live adapter.

    SAFETY: as with any dongle, OBD pin 16 is usually unswitched. The MX+
    has BatterySaver sleep (< 2 mA claimed) and overvoltage protection, so
    the vendor says it can stay plugged in — treat that as a claim, not a
    guarantee, on motorcycles and older vehicles.
  identification:
    local_name_prefix: "OBDLink MX+"
    service_uuids:
      - "0000fff0-0000-1000-8000-00805f9b34fb"
  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "contains"
            value: "OBDLink"
          service_uuids:
            - "0000fff0-0000-1000-8000-00805f9b34fb"
        notes: >
          BLE is the secondary link: the Classic side advertises as
          "OBDLink MX+" (SPP, UUID 00001101) and is primary per the vendor
          spec sheet. The app falls back to Classic when an operation
          requires it (DualModeRequiresClassicBluetoothException).
    identity:
      stable_keys: ["address"]
      display: "local_name"

  setup:
    required: true
    confidence: "medium"
    notes: >
      The MX+ does not accept connections silently: pairing requires physical
      access to the adapter. Pressing the "Connect" button opens a pairing
      window (blue LED blinks rapidly, roughly 2 minutes per vendor pairing
      guides); the user then pairs from the host OS Bluetooth settings. The
      vendor's own description is "Innovative 'Connect' button — requires
      physical access to enable Bluetooth pairing" with "secure 128-bit data
      encryption". The app ships a setup wizard with a dedicated
      press-the-pair-button step (OBDFusion.Pages.Setup.OBDLink.
      SetupWizardPressPairButtonPage, _press_pair_button.gif animation) and
      exposes an adapter-side pairing mode setting, Auto or Manual
      (OCTech.OBD2.Communications.OBDLinkMXPPairingMode, with user-facing
      OBDLinkAutoPairingModeDescriptionText /
      OBDLinkManualPairingModeDescriptionText strings). One app error string
      shows the Classic-first reality on Android: "A compatible OBDLink MX+
      device was not found in the list of connected Bluetooth devices. You
      must pair your OBDLink MX+ in Bluetooth Settings before connecting to
      the adapter."
    methods:
      - type: "button_pairing"
        verified: false
        description: >
          Press the Connect button on the adapter to open the pairing window,
          then pair from the host OS Bluetooth settings. Adapter pairing mode
          is configurable (Auto / Manual) via the vendor app.
        steps:
          - action: "Plug the MX+ into the diagnostic connector and switch the ignition on."
            actor: "user"
            expect: "Green POWER LED on; adapter idle."
          - action: "Press the Connect button on the adapter."
            actor: "user"
            expect: >
              Blue BT LED blinks rapidly; adapter is discoverable for a
              limited window (about 2 minutes per vendor guides).
          - action: "Pair 'OBDLink MX+' from the host OS Bluetooth settings."
            actor: "user"
            notes: >
              On Android this OS-level bond is required before the vendor app
              will connect at all (app error string confirms). On iOS the
              link is MFi Classic (iAP2); BLE is the third-party path.
          - action: "Connect from the client and confirm the command interface with ATI, then STI."
            actor: "client"
            expect: >
              ATI returns the ELM-compatible banner; STI returns the STN
              identification (chip ID and firmware version) — STI is the
              reliable discriminator between STN silicon and ELM327 clones.
    factory_reset:
      confidence: "medium"
      effect: >
        Restores the adapter to factory settings (vendor support article
        43000714324). Clears adapter configuration and bonds; nothing on the
        vehicle is touched.
      procedures:
        - name: "Button hold"
          indicator: "Green POWER LED flashes rapidly."
          steps:
            - action: "Hold the adapter button for 15 seconds, or until the POWER LED flashes rapidly."
              actor: "user"
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Re-pairing is a new button press plus OS pairing. Remove stale bonds
        on the old host first — a phone auto-reconnecting in the background
        is the usual cause of "adapter stopped working".
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Bluetooth bond(s) with paired hosts"
      issued_to_client: []
      notes: >
        Vendor claims encrypted link ("secure 128-bit data encryption"). The
        physical button is the proof of possession; an adapter in pairing
        mode in a public place is pairable by anyone nearby within the
        window.
    # Firmware maintenance (not a schema block of its own):
    # the vendor app performs in-app firmware updates over the existing
    # Classic or BLE serial link — there is no separate BLE OTA/DFU GATT
    # service in the app. Firmware files ("v5" container format, class
    # OBDLinkFirmwareFilev5 with ValidateFile/ReadHeader) are downloaded from
    # https://api.obdlink.com/devices and /devices/{0}/{1} (manifest per
    # device code, Stable/Beta branch, optional private code), then uploaded
    # to the adapter bootloader (OCTech.OBD2.OBDLink.Firmware.*:
    # BootloaderCommunicator, StartUploadCommand/SendChunkCommand in chunks,
    # FirmwareImageDescriptor with a dedicated Validation image type used to
    # verify the flash). InvalidFirmwareImageException and DeviceID gating
    # (enum DeviceID lists OBDLinkMX_1150/1151, OBDLinkLX, OBDLinkCX, ...)
    # show image validation happens client-side before upload. A recovery
    # path exists (OBDLinkFirmwareRecoveryUtility, "Power cycle device,
    # select from list and retry firmware load" strings). Latest MX+ firmware
    # reported in the wild: 5.12.x.

services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "Serial Pipe (BLE)"
    notes: >
      GATT family A of the generic adapter spec — the same service the
      OBDLink CX exposes. All three UUIDs appear as string literals in the
      vendor app (OCTech.OBD2.dll #US heap) beside
      ServiceAndCharacteristicPairs.DefaultServiceUUID /
      DefaultCharacteristicRxUUID / DefaultCharacteristicTxUUID, and the app
      enables notifications via the standard CCCD (0x2902) with a Notify /
      Indicate fallback. Not yet observed on-air from an MX+ — the capture
      plan covers a GATT discovery dump to confirm the MX+ BLE side matches.
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: "Adapter to Host (notify)"
        properties: ["notify"]
      - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
        name: "Host to Adapter (write)"
        properties: ["write", "write_without_response"]
        commands:
          reset:
            description: "ATZ — full reset; returns the firmware banner."
            encoding: "bytes"
            value: [0x41, 0x54, 0x5A, 0x0D]
          identify:
            description: "ATI — ELM327-compatible identification string."
            encoding: "bytes"
            value: [0x41, 0x54, 0x49, 0x0D]
          echo_off:
            description: "ATE0 — echo off; send before scripting anything."
            encoding: "bytes"
            value: [0x41, 0x54, 0x45, 0x30, 0x0D]
          read_voltage:
            description: "ATRV — adapter's estimate of battery voltage."
            encoding: "bytes"
            value: [0x41, 0x54, 0x52, 0x56, 0x0D]
          stn_identify:
            description: >
              STI — STN identification: chip ID and firmware version. The
              discriminator between genuine STN silicon and ELM327 clones.
              Literal "STI" present in the vendor app alongside "Must be an
              STN device to get the STN ID" error strings.
            encoding: "bytes"
            value: [0x53, 0x54, 0x49, 0x0D]

obd:
  role: "adapter"

  adapter_profile:
    class: "advanced-stn"
    capabilities:
      - "single_frame"
      - "multiframe_rx"
      - "multiframe_tx"
      - "flow_control"
      - "custom_headers"
      - "raw_frames"
      - "monitor_all"
      - "alt_can_bus"
    verification: "reported"
    known_limitations:
      - >
        Dual-mode split is firmware- and host-dependent: vendor documentation
        leads with Classic v3.0 (SPP/iAP2), and the app can demand Classic
        for some operations (DualModeRequiresClassicBluetoothException). A
        BLE-only client should treat Classic-only functions as unreachable
        until the capture plan confirms what the BLE GATT pipe carries.
      - >
        Firmware update is in-band over the serial link (vendor bootloader
        protocol), not a BLE OTA service; interrupting an upload forces the
        recovery path (power cycle + retry from the device list).

  connector:
    standard: "sae-j1962"
    location: "vehicle diagnostic socket"
    pins:
      - pin: 1
        signal: "GM SW-CAN / GMLAN single-wire CAN (alt_can_bus)"
        verification: "reported"
      - pin: 3
        signal: "Ford MS-CAN high (alt_can_bus)"
        verification: "reported"
      - pin: 6
        signal: "CAN-H"
        verification: "reported"
      - pin: 7
        signal: "K-line"
        verification: "reported"
      - pin: 11
        signal: "Ford MS-CAN low (alt_can_bus)"
        verification: "reported"
      - pin: 14
        signal: "CAN-L"
        verification: "reported"
      - pin: 16
        signal: "battery +12V (usually unswitched)"
        verification: "reported"

  transport:
    standard: "iso15765-4"
    bitrate: 500000
    addressing: "11bit"
    request_id: "0x7E0"
    response_id: "0x7E8"
    functional_id: "0x7DF"
    verification: "reported"

  adapter_requirements:
    - >
      Everything the advanced-stn tier guarantees (see the generic
      obd2-bluetooth-adapter spec) plus alt_can_bus for Ford MS-CAN and GM
      SW-CAN — the reason vendor tools name the MX+ specifically.
    - >
      ST command set confirmed in use by the vendor app beyond the ELM327
      baseline: STI (STN ID/version), STIM, STMFR, STPBR, STSLCS and the
      STSL* sleep/wake trigger family (STSLVL/STSLVG/STSLU/STSLX and
      variants), plus STNFWv in the firmware-update path. Full STN command
      reference: OBDLink FRPM rev F (scantool.net).

  requests:
    - name: "read_supported_pids"
      description: "Mode 01 PID 00 — safe first liveness check through the adapter."
      command_class: "basic"
      requires: ["single_frame"]
      service: "01"
      request: "01 00"
      expected_response: "41 00 ?? ?? ?? ??"
      writes: false
      verification: "reported"
    - name: "read_vin"
      description: "Mode 09 PID 02 — multi-frame VIN; cheapest ISO-TP reassembly test."
      command_class: "basic"
      requires: ["single_frame", "multiframe_rx"]
      service: "09"
      request: "09 02"
      expected_response: "49 02 ??"
      writes: false
      verification: "reported"

