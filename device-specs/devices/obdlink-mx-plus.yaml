# OBDLink MX+ — Device Specification
# Status: In Progress. Radio-side facts are recovered from static analysis of the
#         vendor Android app (OBDLink 7.4.0) and vendor/community documentation;
#         nothing has been confirmed against hardware yet. See
#         research-notes/obdlink-mx-plus-capture-plan.md for the hardware checklist.
#         2026-08-13: managed DLLs re-extracted from libassembly-store.so (XALZ/LZ4
#         payloads) and the app-side claims below re-verified against the recovered
#         OCTech.OBD2.dll / OCTech.OBDLink.dll / OBDLink.dll string and metadata
#         heaps — app-confirmed, not hardware-tested.
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "OBDLink MX+"
  manufacturer: "OBD Solutions LLC (ScanTool.net)"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "ble"
  category: "vehicle"
  notes: >
    Dual-mode Bluetooth OBD-II adapter on an STN chipset (STN2255 on original
    units — out of production per OBDLink FRPM rev F §3.1; STN2256 on current
    production, reported). Unlike the BLE-only OBDLink CX, the MX+ leads with
    Bluetooth Classic v3.0 (SPP + Apple iAP2, so iOS works over MFi) and also
    exposes a BLE GATT serial pipe — vendor spec sheet lists "Class 1.5
    Bluetooth v3.0, Profiles: SPP, iAP2" and the FRPM documents MX+ BLE
    output. The vendor app carries both a Classic driver and a BLE driver and
    treats the MX+ as dual-mode (a dual-mode flag on its BLE device model,
    and an error it raises when an operation needs the Classic link, both
    in the app's OCTech.OBD2 assembly).

    The MX+ is one of only three wireless OBDLink adapters (MX, MX+, EX) that
    reach Ford MS-CAN (J1962 pins 3/11) and GM SW-CAN / GMLAN single-wire CAN
    (pin 1) — the `alt_can_bus` capability. That is what tools like FORScan
    and the vendor's own enhanced diagnostics need for body and chassis
    modules.

    Evidence base: static analysis of the official OBDLink Android app
    (package OCTech.Mobile.Applications.OBDLink, version 7.4.0, a .NET MAUI
    app — AOT assemblies recovered from the libassembly-store.so blob and
    decompiled). All app-derived facts are marked verification: reported
    until replayed against hardware. Nothing here has been captured from a
    live adapter. 2026-08-13 confirmation pass: the managed-assembly claims
    relied on below (FFF0/FFF1/FFF2 GATT UUIDs, the api.obdlink.com firmware
    endpoints with Stable/Beta branches, the bootloader upload/recovery
    code, the dual-mode and pairing-mode strings, and the ST command
    literals) were all re-verified present in the recovered OCTech.OBD2.dll,
    OCTech.OBDLink.dll and OBDLink.dll — app-confirmed, not hardware-tested.

    SAFETY: as with any dongle, OBD pin 16 is usually unswitched. The MX+
    has BatterySaver sleep (< 2 mA claimed) and overvoltage protection, so
    the vendor says it can stay plugged in — treat that as a claim, not a
    guarantee, on motorcycles and older vehicles.
  identification:
    local_name_prefix: "OBDLink MX+"
  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "contains"
            value: "OBDLink"
        notes: >
          BLE is the secondary link (`bluetooth_classic.ble_role:
          secondary_control`): the Classic side, found by the
          bt_classic_inquiry method below, is primary per the vendor spec
          sheet. The app falls back to Classic when an operation requires
          it (it raises a dedicated needs-Classic error).
      - type: "bt_classic_inquiry"
        bt_classic:
          name:
            match: "prefix"
            value: "OBDLink MX+"
          service_uuids:
            - "00001101-0000-1000-8000-00805f9b34fb"
          requires_discoverable_mode: true
        verification: "reported"
        notes: >
          The Classic (BR/EDR) side, advertised as "OBDLink MX+" with the
          SPP service class. Per the vendor quick start guides the adapter
          is discoverable only for a window after the Connect button is
          pressed (the BT LED switches to a fast blink; about 2 minutes),
          which is the procedure under
          `bluetooth_classic.pairing.enter_pairing_mode`.
          The app also exposes an adapter setting (Auto / Manual) that
          decides whether the MX+ enters Bluetooth pairing mode by itself on
          boot or only on a button press, so an adapter left on Auto may
          answer a cold inquiry. The inquiry name and Class of Device are
          user-writable through ST settings commands, so a renamed unit will
          not match this needle. The SPP UUID alone matches every serial
          module; the name is the discriminator.
    identity:
      stable_keys: ["address"]
      display: "local_name"

  setup:
    required: true
    confidence: "medium"
    notes: >
      The MX+ does not accept connections silently: pairing requires physical
      access to the adapter. Pressing the "Connect" button opens a pairing
      window (blue LED blinks rapidly, roughly 2 minutes per vendor pairing
      guides); the user then pairs from the host OS Bluetooth settings. The
      vendor's own description is "Innovative 'Connect' button — requires
      physical access to enable Bluetooth pairing" with "secure 128-bit data
      encryption". The app ships a setup wizard with a dedicated
      press-the-pair-button page and animation (confirmed in the recovered
      OBDLink.dll app assembly) and exposes an MX+ adapter-side pairing mode
      setting, Auto or Manual, each with its own user-facing description
      (confirmed in the recovered managed DLLs). One app error string shows the Classic-first
      reality on Android (confirmed in OCTech.OBD2.dll): "A compatible
      OBDLink MX+ device was not found in the list of connected Bluetooth
      devices. You must pair your OBDLink MX+ in Bluetooth Settings before
      connecting to the adapter."
    methods:
      - type: "button_pairing"
        verified: false
        description: >
          Press the Connect button on the adapter to open the pairing window,
          then pair from the host OS Bluetooth settings. Adapter pairing mode
          is configurable (Auto / Manual) via the vendor app.
        steps:
          - action: "Plug the MX+ into the diagnostic connector and switch the ignition on."
            actor: "user"
            expect: "Green POWER LED on; adapter idle."
          - action: "Press the Connect button on the adapter."
            actor: "user"
            expect: >
              Blue BT LED blinks rapidly; adapter is discoverable for a
              limited window (about 2 minutes per vendor guides).
          - action: "Pair 'OBDLink MX+' from the host OS Bluetooth settings."
            actor: "user"
            notes: >
              On Android this OS-level bond is required before the vendor app
              will connect at all (app error string confirms). On iOS the
              link is MFi Classic (iAP2); BLE is the third-party path.
          - action: "Connect from the client and confirm the command interface with ATI, then STI."
            actor: "client"
            expect: >
              ATI returns the ELM-compatible banner; STI returns the STN
              identification (chip ID and firmware version) — STI is the
              reliable discriminator between STN silicon and ELM327 clones.
    factory_reset:
      confidence: "medium"
      effect: >
        Restores the adapter to factory settings (vendor support article
        43000714324). Clears adapter configuration and bonds; nothing on the
        vehicle is touched.
      procedures:
        - name: "Button hold"
          indicator: "Green POWER LED flashes rapidly."
          steps:
            - action: "Hold the adapter button for 15 seconds, or until the POWER LED flashes rapidly."
              actor: "user"
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Re-pairing is a new button press plus OS pairing. Remove stale bonds
        on the old host first — a phone auto-reconnecting in the background
        is the usual cause of "adapter stopped working".
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Bluetooth bond(s) with paired hosts"
      issued_to_client: []
      notes: >
        Vendor claims encrypted link ("secure 128-bit data encryption"). The
        physical button is the proof of possession; an adapter in pairing
        mode in a public place is pairable by anyone nearby within the
        window.
    # Firmware maintenance: see features[type: firmware_update].dfu. The
    # vendor app updates over the existing Classic or BLE serial link;
    # there is no separate BLE OTA/DFU GATT service in the app.

  pairing:
    required: "unknown"
    confidence: "low"
    security_mode: "unknown"
    bonding: "unknown"
    notes: >
      Describes the BLE GATT pipe, the link this spec's `protocol: ble` names.
      Whether it demands pairing or a bond is not established: the vendor
      documents only the Classic side (see `bluetooth_classic.pairing`), and
      the spec sheet's "Connect button requires physical access to enable
      Bluetooth pairing" does not say which radio it gates. The capture plan
      covers it.
  host_compatibility:
    - stack: "corebluetooth"
      link: "br_edr"
      status: "incompatible"
      symptom: "no_transport"
      cause:
        missing_api: "rfcomm"
      workaround: "vendor_mfi"
      verification: "reported"
      basis: >
        Vendor spec sheet (profiles SPP and iAP2; the adapter is MFi) and the
        vendor iOS quick start guide, which pairs the MX+ from iOS Settings
        and connects from the vendor's own app. Not run against hardware.
      notes: >
        CoreBluetooth exposes no RFCOMM. iOS reaches the Classic side only
        over MFi iAP2 through the ExternalAccessory framework, which in
        practice means the vendor's own app. macOS is outside this verdict:
        IOBluetooth exposes RFCOMM.
    - stack: "corebluetooth"
      link: "ble"
      status: "degraded"
      verification: "reported"
      basis: >
        Vendor spec sheet (profiles SPP and iAP2; the adapter is MFi) and
        the vendor iOS quick start guide, which pairs the MX+ from iOS
        Settings and connects from the OBDLink app; plus the vendor Android
        app's dual-mode handling (a BLE driver for the FFF0 pipe and a
        dedicated error for operations that need the Classic link). Not
        run against hardware.
      notes: >
        CoreBluetooth exposes no RFCOMM, so an iPhone cannot open the SPP
        socket. iOS reaches the Classic side only over MFi iAP2 (the
        ExternalAccessory framework), which is open to the vendor's own app
        and not to an arbitrary third-party app. A third-party iOS client
        therefore drives the MX+ over the BLE GATT serial pipe (service
        0xFFF0), which CoreBluetooth handles like any other peripheral --
        the degraded part is that any operation the vendor app reserves for
        Classic is out of reach on that path until the capture plan shows
        what the BLE pipe carries. macOS is not covered by this verdict:
        IOBluetooth does expose RFCOMM.
features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["vendor_ble"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "vendor_cloud"
        format: "OBDLink 'v5' firmware file: a header the app reads and validates, then the image."
        notes: >
          The app fetches a per-device-code manifest from
          https://api.obdlink.com/devices and files from /devices/{0}/{1},
          on a Stable or Beta branch, with an optional private code via
          /private/{0}. Validation is known only on the client side: the app
          rejects a file whose header or device-ID gating does not match the
          adapter (its device-ID table lists the MX with codes 1150/1151, the
          LX and the CX, among others) before uploading. Whether the
          bootloader itself verifies a signature is not established.
      enter:
        how: "unknown"
        notes: >
          The app hands the adapter to its bootloader over the ordinary
          serial link and then uploads in chunks (a start-upload command,
          then chunk commands), finishing with a validation image type that
          checks the flash. The ST command STNFWv appears in the
          firmware-update path. The byte-level entry and upload framing are
          not recovered, so no command is declared here.
      recovery:
        interrupted: "unknown"
        notes: >
          An interrupted upload sends the user down the app's recovery path:
          its strings say to power-cycle the adapter and retry the firmware
          load from the device list. Whether the adapter waits in its
          bootloader meanwhile or keeps the old image is not established.
      verification: "reported"
      notes: >
        App-confirmed (managed assemblies of OBDLink 7.4.0 re-verified
        2026-08-13), not hardware-tested. The update is in-band over the
        serial pipe, over Classic SPP or over the BLE service 0xFFF0
        (0000fff0-0000-1000-8000-00805f9b34fb); there is no dedicated
        OTA/DFU GATT service, and the serial pipe carries every ordinary
        command too, so it is not listed under `services`. `vendor_ble`
        names the BLE path; the Classic SPP path is the same vendor
        bootloader protocol. Latest MX+ firmware reported in the wild:
        5.12.x.

bluetooth_classic:
  pairing:
    required: true
    confidence: "medium"
    security_mode: "unknown"
    bonding: "required"
    enter_pairing_mode:
      required: true
      window_seconds: 120
      indicator: "Blue BT LED switches from a slow flash to a fast blink."
      procedures:
        - name: "Press the Connect button"
          verified: false
          basis: >
            Vendor quick start guides (Android and iOS) and the vendor
            spec sheet's "Connect button requires physical access to enable
            Bluetooth pairing"; the app's setup wizard has a matching
            press-the-pair-button page.
          power_state: "on"
          press_count: 1
          description: >
            With the adapter powered from the diagnostic connector (ignition
            on), press the Connect button once. The BT LED switches to a fast
            blink and the adapter is pairable for about 2 minutes; press
            again to restart the window if the host needs more time.
      notes: >
        The adapter-side pairing-mode setting (Auto / Manual, set from the
        vendor app) decides whether the MX+ also enters pairing mode on its
        own at boot; Manual keeps it closed until the button is pressed.
    notes: >
      The Classic side, which is the one the vendor documents: the Android app locates the MX+ only among the host's
      bonded devices and tells the user to pair it in Bluetooth Settings
      first, so the SPP socket needs an OS-level bond made inside the
      Connect-button window. The quick start guides show no PIN entry --
      Android pops a pairing-request dialog the user accepts with OK, iOS
      pairs from Settings under Other Devices -- which points at Secure
      Simple Pairing rather than a legacy PIN, but the association model is
      not established, hence `security_mode: unknown`. The BLE pipe's own
      pairing story is `device.pairing`.
  dual_mode: true
  ble_role: "secondary_control"
  address_shared_with_ble: "unknown"
  profiles:
    - profile: "spp"
      uuid: "00001101-0000-1000-8000-00805f9b34fb"
      role: "control"
      secure: true
      verification: "reported"
      notes: >
        Serial Port Profile; the SPP UUID is a string literal in the vendor
        app's Classic driver. Secure: pairing is gated by the Connect button
        per the vendor spec sheet, and the Android app connects only to a
        host-bonded MX+, so open an authenticated socket to an adapter the
        host has already paired. The app carries both the secure and the
        insecure socket constructors, and which one it uses for the MX+ is
        not recovered; a secure socket to a bonded adapter is the path the
        vendor documents. The RFCOMM channel is resolved by SDP.
    - profile: "iap2"
      role: "undocumented"
      verification: "reported"
      notes: >
        MFi path for iOS (the spec sheet lists iAP2; the adapter is sold as
        iOS-compatible over Classic). Reached through the ExternalAccessory
        framework by the vendor's own app only. Its SDP UUID, the accessory
        protocol string and whether it carries the same ST/AT stream are
        not recovered, so nothing here documents it -- `undocumented` records
        that the profile exists, not that it is idle. See
        `device.host_compatibility`.
  serial:
    profile_uuid: "00001101-0000-1000-8000-00805f9b34fb"
    encoding: "ascii_lines"
    line_terminator: "0d"
    command_terminator: "0d"
    prompt: "3e"
    correlation: "in_order"
    max_in_flight: 1
    commands_from:
      service: "0000fff0-0000-1000-8000-00805f9b34fb"
      characteristic: "0000fff2-0000-1000-8000-00805f9b34fb"
    framing:
      length_prefix: false
      checksum: "none"
      notes: >
        ELM327/STN framing: a reply is complete only when the '>' prompt
        arrives, so buffer across reads until then. Echo is on until ATE0.
    verification: "reported"
    notes: >
      The same ELM327 AT / STN ST command set the BLE pipe carries (the
      commands under the FFF2 characteristic below are byte-for-byte the
      same over SPP); the vendor app runs one ASCII command stream over
      whichever transport is connected. The app raises a dedicated
      needs-Classic error for some operations, so the Classic link is the
      one to use when the BLE pipe refuses something.
  verification: "reported"
  notes: >
    Classic v3.0 per the vendor spec sheet ("Profiles: SPP, iAP2"). The
    device stays `protocol: ble` because the BLE GATT pipe is a complete
    serial path a BLE-only client can drive; this block records the second,
    vendor-primary path. Whether the BR/EDR address equals the BLE address
    has not been checked.

services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "Serial Pipe (BLE)"
    notes: >
      GATT family A of the generic adapter spec — the same service the
      OBDLink CX exposes. All three UUIDs appear as string literals in the
      vendor app (OCTech.OBD2.dll #US heap) as its default service, RX and
      TX characteristic UUIDs (the SPP UUID 00001101 sits in the same
      heap), and the app enables notifications via the standard CCCD
      (0x2902, in OCTech.OBD2.dll) with a Notify / Indicate fallback (log literal
      "RXCharacteristic has Indicate property"). UUIDs, CCCD
      handling and fallback all re-verified in the recovered managed DLLs
      2026-08-13 — app-confirmed, not hardware-tested. Not yet observed
      on-air from an MX+ — the capture plan covers a GATT discovery dump to
      confirm the MX+ BLE side matches.
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: "Adapter to Host (notify)"
        properties: ["notify"]
      - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
        name: "Host to Adapter (write)"
        properties: ["write", "write_without_response"]
        commands:
          reset:
            description: "ATZ — full reset; returns the firmware banner."
            encoding: "bytes"
            value: [0x41, 0x54, 0x5A, 0x0D]
          identify:
            description: "ATI — ELM327-compatible identification string."
            encoding: "bytes"
            value: [0x41, 0x54, 0x49, 0x0D]
          echo_off:
            description: "ATE0 — echo off; send before scripting anything."
            encoding: "bytes"
            value: [0x41, 0x54, 0x45, 0x30, 0x0D]
          read_voltage:
            description: "ATRV — adapter's estimate of battery voltage."
            encoding: "bytes"
            value: [0x41, 0x54, 0x52, 0x56, 0x0D]
          stn_identify:
            description: >
              STI — STN identification: chip ID and firmware version. The
              discriminator between genuine STN silicon and ELM327 clones.
              STN-ID query path confirmed in the vendor app via the "Must be
              an STN device to get the STN ID" / "...to get the STN Version"
              error strings (OCTech.OBD2.dll; app-confirmed, not
              hardware-tested).
            encoding: "bytes"
            value: [0x53, 0x54, 0x49, 0x0D]

obd:
  role: "adapter"

  adapter_profile:
    class: "advanced-stn"
    capabilities:
      - "single_frame"
      - "multiframe_rx"
      - "multiframe_tx"
      - "flow_control"
      - "custom_headers"
      - "raw_frames"
      - "monitor_all"
      - "alt_can_bus"
    verification: "reported"
    known_limitations:
      - >
        Dual-mode split is firmware- and host-dependent: vendor documentation
        leads with Classic v3.0 (SPP/iAP2), and the app can demand Classic
        for some operations (it raises a dedicated needs-Classic error). A
        BLE-only client should treat Classic-only functions as unreachable
        until the capture plan confirms what the BLE GATT pipe carries.
      - >
        Firmware update is in-band over the serial link (vendor bootloader
        protocol), not a BLE OTA service; interrupting an upload forces the
        recovery path (power cycle + retry from the device list).

  connector:
    standard: "sae-j1962"
    location: "vehicle diagnostic socket"
    pins:
      - pin: 1
        signal: "GM SW-CAN / GMLAN single-wire CAN (alt_can_bus)"
        verification: "reported"
      - pin: 3
        signal: "Ford MS-CAN high (alt_can_bus)"
        verification: "reported"
      - pin: 6
        signal: "CAN-H"
        verification: "reported"
      - pin: 7
        signal: "K-line"
        verification: "reported"
      - pin: 11
        signal: "Ford MS-CAN low (alt_can_bus)"
        verification: "reported"
      - pin: 14
        signal: "CAN-L"
        verification: "reported"
      - pin: 16
        signal: "battery +12V (usually unswitched)"
        verification: "reported"

  transport:
    standard: "iso15765-4"
    bitrate: 500000
    addressing: "11bit"
    request_id: "0x7E0"
    response_id: "0x7E8"
    functional_id: "0x7DF"
    verification: "reported"

  adapter_requirements:
    - >
      Everything the advanced-stn tier guarantees (see the generic
      obd2-bluetooth-adapter spec) plus alt_can_bus for Ford MS-CAN and GM
      SW-CAN — the reason vendor tools name the MX+ specifically.
    - >
      ST command set confirmed in use by the vendor app beyond the ELM327
      baseline: STI (STN ID/version), STIM, STMFR, STPBR, STSLCS and the
      STSL* sleep/wake trigger family (STSLVL/STSLVG/STSLU/STSLX and
      variants), plus STNFWv in the firmware-update path — literals
      re-verified in OCTech.OBD2.dll 2026-08-13 (STIM, STMFR, STPBR, STSLCS,
      STSLVL*, STSLVG*, STSLU*, STSLX*, STNFWv present;
      app-confirmed, not hardware-tested). Full STN command
      reference: OBDLink FRPM rev F (scantool.net).

  requests:
    - name: "read_supported_pids"
      description: "Mode 01 PID 00 — safe first liveness check through the adapter."
      command_class: "basic"
      requires: ["single_frame"]
      service: "01"
      request: "01 00"
      expected_response: "41 00 ?? ?? ?? ??"
      writes: false
      verification: "reported"
    - name: "read_vin"
      description: "Mode 09 PID 02 — multi-frame VIN; cheapest ISO-TP reassembly test."
      command_class: "basic"
      requires: ["single_frame", "multiframe_rx"]
      service: "09"
      request: "09 02"
      expected_response: "49 02 ??"
      writes: false
      verification: "reported"

