# OBD-II Bluetooth Adapter (ELM327 / STN) — Device Specification
# Status: Complete for the adapter link layer. The three GATT families below cover
#         most of the market; per-model coverage is open for contribution.
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "OBD-II Bluetooth Adapter (ELM327 / STN)"
  manufacturer: "Generic (ELM327 clones), ScanTool.net, Vgate, LELink"
  manufacturer_status: "unsupported"
  testing:
    status: untested
  protocol: "ble"
  category: "vehicle"
  notes: >
    The dongle every vehicle target in this repo is reached through — the transport under
    the transport. Bluetooth side is a serial pipe (Classic SPP/RFCOMM or BLE GATT)
    carrying an ASCII command set; vehicle side is OBD-II/UDS (see the `obd` block).

    Because the payload is ASCII, a Bluetooth capture of a vendor app driving one of these
    adapters is a plain-text transcript of the vendor's diagnostic protocol. That makes
    this device the cheapest capture path for any OBD target.

    Commands are CR-terminated; replies are complete only when the '>' prompt arrives, so
    a client must buffer across notifications rather than parsing each one. BLE MTU is
    commonly 20 bytes, so multi-notification replies are the norm, not the exception.

    CONFIDENCE: GATT families A and B are cross-referenced against open-source BLE OBD
    clients (verification: confirmed by third-party implementations). Family C is the
    HM-10 pattern and is community-reported. The AT/ST command set is public
    documentation. No pairing, authentication or encryption is used by most BLE
    adapters — but not all: the family-A exemplar OBDLink CX bonds (pairing enabled
    for the first 5 minutes after power-on), uses a legacy pairing PIN of 123456,
    and always encrypts BLE communication (vendor CX adapter notes).

    SAFETY: OBD pin 16 is usually unswitched — a dongle left plugged in will flatten a
    battery, quickly on a motorcycle. Unplug after each session.
  identification:
    local_name_prefixes: ["OBD", "UniCarScan"]
    service_uuids:
      - "000018f0-0000-1000-8000-00805f9b34fb"
    notes: >
      Family B's 18F0 service is an advertised Vgate-class signal. FFE0/FFE1
      is only the HM-10 serial-module layout, shared with unrelated devices;
      use it for post-connect family-C routing, never scan-time identity.
  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "contains"
            values: ["OBD", "UniCarScan"]
          service_uuids:
            - "000018f0-0000-1000-8000-00805f9b34fb"
      - type: "bt_classic_inquiry"
        bt_classic:
          name:
            match: "prefix"
            values: ["OBDII", "OBDII-BT", "V-LINK", "Vgate", "OBDLink LX", "OBDLink MX"]
          service_uuids: ["00001101-0000-1000-8000-00805f9b34fb"]
          requires_discoverable_mode: false
        verification: "reported"
        notes: >
          The Classic SPP members of the family: a BLE scan never sees them, and
          a BR/EDR inquiry never sees the BLE-only members. Classic dongles are
          discoverable whenever they have power from the connector, under a
          fixed name -- no button and no pairing window. The SPP UUID alone
          matches every serial module ever made, so the name list is the
          needle; "OBDLink MX" also covers the dual-mode MX+, whose BLE side
          the ble_scan method above finds more cheaply.
    identity:
      stable_keys: ["address"]
      display: "local_name"
  variants:
    - model: "GATT family A (FFF0/FFF1/FFF2)"
      identification:
        service_uuids: ["0000fff0-0000-1000-8000-00805f9b34fb"]
      notes: "OBDLink CX (STN2310) and a large share of generic adapters. Separate notify and write characteristics. CX exception to the usual no-pairing BLE pattern: it bonds (5-minute window after power-on), legacy PIN 123456, always-encrypted link."
    - model: "GATT family B (18F0/2AF0/2AF1)"
      identification:
        service_uuids: ["000018f0-0000-1000-8000-00805f9b34fb"]
      notes: "Vgate iCar Pro 2S BLE. Separate notify and write characteristics."
    - model: "GATT family C (FFE0/FFE1)"
      identification:
        service_uuids: ["0000ffe0-0000-1000-8000-00805f9b34fb"]
      notes: >
        HM-10 module clones. Single bidirectional characteristic — the same pattern as the
        MoTool Slacker. Community-reported. The LELink / LELink2 dongles belong here, not
        in family B: pbutterworth/py-nissan-leaf-obd-ble (elm327.py, MIT) ships FFE0 with
        FFE1 as both its read and write characteristic as its defaults, which its README
        says match the LeLink OBD BLE dongle, and the Home Assistant community thread for the integration built on
        it is about a LELink 2 (helpful_urls of nissan-leaf-obd2.yaml).
    - model: "UniCarScan UCSI-2100 (WGSoft)"
      identification:
        local_name_prefix: "UniCarScan"
      notes: >
        ARM Cortex-M0, Bluetooth 4.0 (BLE), works from iOS, Android and Windows. ELM327
        command-set compatible but accepts messages up to 255 bytes where a stock ELM327
        stops at 8 — long diagnostic writes become one command instead of a flow-control
        negotiation. Protocols: ISO9141-2, KWP2000 slow and fast init, CAN 11-bit and
        29-bit at 250 and 500 kbit/s, plus the BMW OEM protocols KWP2000, KWP2000*, D-CAN
        and UDS. Field-updatable firmware. The vendor's reference adapter for MotoScan,
        and named by TuneECU and BimmerCode.
    - model: "OBDLink MX Bluetooth"
      identification:
        local_name_prefix: "OBDLink MX"
      notes: >
        STN1170 (reported). Bluetooth Classic v3.0 SPP — NO iOS support. First Bluetooth
        adapter to reach GM SW-CAN and Ford MS-CAN alongside the legislated protocols.
        Backwards compatible with the ELM327 command set plus the ST extensions.
    - model: "OBDLink MX+"
      identification:
        local_name_prefix: "OBDLink MX+"
      notes: >
        STN2255 on original units — now out of production per the OBDLink FRPM rev F
        §3.1 device table; current-production MX+ uses STN2256 (reported). Dual-mode:
        Bluetooth Classic v3.0 with MFi (SPP/iAP2) as primary link, plus a BLE GATT
        pipe. MS-CAN and SW-CAN as well as every legislated protocol — the only
        wireless iOS adapter that reaches those manufacturer buses. Dedicated spec:
        device-specs/devices/obdlink-mx-plus.yaml (GATT UUIDs, button-pairing flow
        and firmware-update mechanism recovered from the vendor app).
    - model: "Bluetooth Classic SPP (no GATT)"
      notes: >
        RFCOMM, usually channel 1, PIN 1234 / 0000 / 6789. Names OBDII, OBDII-BT, V-LINK,
        Vgate, OBDLink LX/MX+. Not reachable from iOS unless MFi-certified; not reachable
        from a BLE-only client at all. Linux: `rfcomm bind 0 <mac> 1` -> /dev/rfcomm0.

  setup:
    required: true
    confidence: "medium"
    notes: >
      The adapter is the one part of an OBD-II stack that does need pairing.
      Bluetooth Classic variants ask for a PIN; BLE variants generally do not.
      Which you have is not always printed on the dongle, and the two are
      frequently sold under the same listing.
    methods:
      - type: "ble_direct"
        name: "BLE dongles: connect, usually with no pairing"
        role: "variant"
        verified: false
        description: >
          BLE variants advertise as soon as they are powered from the connector
          and most accept a connection with no pairing. Identify by the advertised
          name prefix plus one of the serial-service UUIDs. Exception: the
          OBDLink CX bonds (pairing window for the first 5 minutes after
          power-on, legacy PIN 123456) and always encrypts the link.
        ble:
          advertised_name: "OBD"
          pairing_required: false
        steps:
          - action: "Plug the adapter into the diagnostic connector and switch on the ignition."
            actor: "user"
            expect: "Adapter LEDs light and it begins advertising."
          - action: "Scan for the advertised name prefix and a serial-service UUID, then connect."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Confirm the command interface with ATI and record the reported firmware string."
            actor: "client"
            expect: >
              An ELM327 identification string. Cloned firmware reports a
              version it does not implement, so match the adapter_profile class
              rather than trusting this string.
      - type: "bt_classic_pairing"
        name: "Bluetooth Classic dongles: OS pairing, fixed PIN"
        role: "variant"
        verified: false
        description: >
          Bluetooth Classic (SPP/RFCOMM) variants pair with the host operating
          system first, using a fixed PIN. There is no button; the PIN is the
          proof of possession, and it is not a secret. The link-layer facts
          (legacy PIN mode, fixed default, single connection) are in
          `pairing`; the socket and stream parameters are in the top-level
          `bluetooth_classic` block.
        steps:
          - action: "Plug the adapter in and power the ignition."
            actor: "user"
          - action: "Pair from the host's Bluetooth settings, entering the adapter's PIN."
            actor: "user"
            notes: >
              Commonly 1234 or 0000, printed in the manual. Treat it as a
              default rather than a credential — it is identical across
              enormous numbers of dongles.
          - action: "Open the resulting serial port and confirm with ATI."
            actor: "client"
    factory_reset:
      confidence: "medium"
      effect: >
        Clears the adapter's own configuration — protocol selection, echo,
        headers, timeouts and any saved defaults — and returns it to power-on
        state. Nothing about the vehicle is touched.
      procedures:
        - name: "ATZ software reset"
          indicator: "The adapter re-emits its identification string."
          steps:
            - action: "Send ATZ on the command interface."
              actor: "client"
              expect: "Adapter resets and reports its firmware string."
            - action: "Send ATD to restore defaults if settings persist across the reset."
              actor: "client"
        - name: "Power cycle"
          steps:
            - action: "Unplug the adapter from the connector for a few seconds and reinsert it."
              actor: "user"
              notes: >
                Also the remedy when the adapter is wedged, which cloned
                firmware does under multi-frame load.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Pairing with a different host is just pairing again. Remove the old
        bond from the previous host as well — Classic adapters accept one
        connection at a time, and a phone reconnecting in the background is the
        usual cause of an adapter that "stopped working".
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Bluetooth bond with the paired host (Classic variants)"
      issued_to_client: []
      notes: >
        The pairing PIN is a fixed default shared across a whole product
        category, so it identifies nothing and protects nothing. Anyone within
        radio range of a plugged-in adapter can reach the vehicle bus through
        it — worth knowing before leaving one in the connector.

  pairing:
    # This block answers for the BLE GATT families -- the link `protocol: ble`
    # names and the one setup method 'ble_direct' (pairing_required: false)
    # drives. The schema has no per-variant pairing, so the Classic SPP
    # members' answer (required: true, legacy PIN) lives in
    # `bluetooth_classic.pairing`, and the one BLE exception is in the notes.
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    pin:
      source: "fixed_default"
      notes: >
        Only for the BLE exception: the OBDLink CX (GATT family A) asks for a
        fixed passkey of 123456, the same on every unit. Other BLE adapters
        ask for nothing. The Classic SPP members' PINs (commonly 1234, 0000
        or 6789) are under `bluetooth_classic.pairing.pin`. None of these is
        a secret: the PIN is proof that somebody is standing at the car with
        the dongle in reach.
    exclusivity:
      single_connection: true
      recovery: >
        Disconnect, or forget the adapter on, the previous host as well as the
        new one. These adapters serve one client at a time, and a phone
        reconnecting in the background is the usual cause of an adapter that
        "stopped working" after a second device was introduced.
    enter_pairing_mode:
      required: false
      window_seconds: 300
      notes: >
        Most BLE adapters advertise and accept connections whenever they have
        power from the connector. The window applies to the OBDLink CX, which
        is pairable only for the first five minutes after power-on — plug it
        in, then pair, in that order, or cycle the ignition and start again.
    unpair:
      supported: "unknown"
      notes: >
        Every documented route is host-side: forget the adapter in the
        host's Bluetooth settings, on every host that has paired it; the
        adapter is then usually paired again from scratch with the same
        fixed PIN. Adapter-side clearing varies by product and is mostly
        undocumented. Generic ELM327 clones have no control at all beyond
        unplugging them, which power-cycles rather than resets. OBDLink's MX+ and LX
        restore factory settings with a 15-second hold of the pair button
        (see obdlink-mx-plus); OBDLink documents no equivalent for the CX,
        and whether the restore clears stored bonds is not stated.
    notes: >
      Split by transport, because the family spans two radios and the schema
      cannot give each variant its own pairing block. BLE (this block, and
      this spec's primary transport): most adapters take a connection with no
      pairing at all, which is what `required: false` and `security_mode:
      none` state. The exception is family A's OBDLink CX exemplar, which
      bonds with a fixed passkey of 123456, is pairable only for the first
      five minutes after power-on, and always encrypts the link -- a client
      that meets an encrypted characteristic on a family-A adapter should
      fall back to OS-level pairing with that passkey. Bluetooth Classic SPP
      variants always pair: with the host operating system, by legacy PIN,
      before an application can open the socket; that answer is
      `bluetooth_classic.pairing` (required: true).
  host_compatibility:
    - stack: "corebluetooth"
      status: "incompatible"
      link: "br_edr"
      symptom: "no_transport"
      cause:
        missing_api: "rfcomm"
      workaround: "none_known"
      variants:
        - "Bluetooth Classic SPP (no GATT)"
        - "OBDLink MX Bluetooth"
      verification: "reported"
      basis: >
        Vendor comparison table for the OBDLink MX Bluetooth lists iOS as
        unsupported (https://www.obdlink.com/mxbt/); Car Scanner's adapter
        guide states the same for every non-MFi Classic dongle
        (https://www.carscanner.info/choosing-obdii-adapter/).
      notes: >
        Cause: CoreBluetooth exposes no RFCOMM, so an iPhone or iPad has no
        way to open the SPP socket these variants are reached through; the
        device is simply never listed. The vendor iOS path for a Classic
        adapter is MFi (iAP2 through the ExternalAccessory framework) or
        nothing -- the OBDLink MX+ is the MFi case and is scoped out of this
        verdict, and the BLE GATT families are reachable from CoreBluetooth
        like any other BLE peripheral. macOS is not covered by this verdict:
        IOBluetooth does expose RFCOMM. Scoped to the two Classic-only
        variants; a consumer that cannot tell the variant before connecting
        must not read it as the family's.
services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "Serial Pipe (family A)"
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: "Adapter to Host (notify)"
        properties: ["notify"]
      - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
        name: "Host to Adapter (write)"
        properties: ["write", "write_without_response"]
        commands:
          reset:
            description: "ATZ — full reset; returns the firmware banner. Claimed version is not proof of chipset."
            encoding: "bytes"
            value: [0x41, 0x54, 0x5A, 0x0D]
          identify:
            description: "ATI — identify without resetting."
            encoding: "bytes"
            value: [0x41, 0x54, 0x49, 0x0D]
          echo_off:
            description: "ATE0 — echo off; send before scripting anything."
            encoding: "bytes"
            value: [0x41, 0x54, 0x45, 0x30, 0x0D]
          read_voltage:
            description: "ATRV — adapter's estimate of battery voltage (approximate, not from the ECU)."
            encoding: "bytes"
            value: [0x41, 0x54, 0x52, 0x56, 0x0D]
          select_can_500k:
            description: "ATSP6 — select ISO 15765-4 CAN, 11-bit, 500 kbit/s."
            encoding: "bytes"
            value: [0x41, 0x54, 0x53, 0x50, 0x36, 0x0D]
          can_formatting_off:
            description: "ATCAF0 — raw frames; ISO-TP segmentation becomes the client's job. Clone firmware sometimes refuses."
            encoding: "bytes"
            value: [0x41, 0x54, 0x43, 0x41, 0x46, 0x30, 0x0D]
          flow_control_mode_1:
            description: "ATFCSM1 — use client-supplied flow control. If this fails, multi-frame transmit will fail."
            encoding: "bytes"
            value: [0x41, 0x54, 0x46, 0x43, 0x53, 0x4D, 0x31, 0x0D]

  - uuid: "000018f0-0000-1000-8000-00805f9b34fb"
    name: "Serial Pipe (family B)"
    characteristics:
      - uuid: "00002af0-0000-1000-8000-00805f9b34fb"
        name: "Adapter to Host (notify)"
        properties: ["notify"]
      - uuid: "00002af1-0000-1000-8000-00805f9b34fb"
        name: "Host to Adapter (write)"
        properties: ["write", "write_without_response"]

  - uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
    name: "Serial Pipe (family C, HM-10 pattern)"
    characteristics:
      - uuid: "0000ffe1-0000-1000-8000-00805f9b34fb"
        name: "Bidirectional Serial"
        properties: ["read", "write", "write_without_response", "notify"]

bluetooth_classic:
  variants:
    - "Bluetooth Classic SPP (no GATT)"
    - "OBDLink MX Bluetooth"
  pairing:
    required: true
    confidence: "medium"
    security_mode: "legacy_pin"
    bonding: "required"
    pin:
      source: "fixed_default"
      notes: >
        Commonly 1234, 0000 or 6789, printed in the adapter's manual. A
        default shared by enormous numbers of dongles, not a secret; no value
        is stated because the family spans many vendors.
    exclusivity:
      single_connection: true
      recovery: >
        Remove the bond from the previous host as well as the new one. A
        Classic dongle takes one RFCOMM connection at a time, and a phone
        reconnecting in the background is the usual cause of an adapter that
        stopped answering after a second device was introduced.
    enter_pairing_mode:
      required: false
      notes: >
        Classic dongles are discoverable and pairable whenever they have power
        from the connector; there is no button and no window.
    notes: >
      The Classic SPP members pair with the host operating system (a legacy
      PIN) before any application can open the SPP socket. `device.pairing`
      describes the BLE GATT families, which is the link this spec's
      `protocol: ble` names.
  dual_mode: false
  ble_role: "none"
  profiles:
    - profile: "spp"
      uuid: "00001101-0000-1000-8000-00805f9b34fb"
      role: "control"
      secure: true
      verification: "reported"
      notes: >
        Serial Port Profile on one RFCOMM channel, usually 1. Secure socket:
        the dongle demands a legacy PIN bond (see `pairing`), so a client
        opens an authenticated socket to a device the host has already
        paired; an insecure socket to an unpaired dongle is refused.
  serial:
    profile_uuid: "00001101-0000-1000-8000-00805f9b34fb"
    encoding: "ascii_lines"
    line_terminator: "0d"
    command_terminator: "0d"
    prompt: "3e"
    correlation: "in_order"
    max_in_flight: 1
    commands_from:
      service: "0000fff0-0000-1000-8000-00805f9b34fb"
      characteristic: "0000fff2-0000-1000-8000-00805f9b34fb"
    framing:
      length_prefix: false
      checksum: "none"
      notes: >
        Commands are ASCII ended by CR. A response is complete only when the
        ELM327 prompt character '>' arrives; buffer across reads until then,
        because a reply can land in pieces or glued to the previous one.
        Lines inside a reply are separated by CR (CR LF with ATL1). Echo is
        on until ATE0, so the first line of a reply is the command itself.
    verification: "reported"
    notes: >
      Resolve the channel by SDP from the SPP UUID; it is usually 1, but is
      not fixed across the family. Linux: `rfcomm bind 0 aa:bb:cc:dd:ee:ff 1`
      gives /dev/rfcomm0, which any serial library opens. The command set is
      the same ASCII AT/ST vocabulary the family-A write characteristic's
      commands spell out byte for byte -- ATZ, ATI, ATE0 and the rest are
      identical over SPP.
  verification: "reported"
  notes: >
    Describes the Classic-only SPP members of the family -- the "Bluetooth
    Classic SPP (no GATT)" and "OBDLink MX Bluetooth" variants -- which is why
    `dual_mode` is false and `ble_role` is none here. The family as a whole
    has Classic-only, BLE-only (GATT families A/B/C, UniCarScan) and dual-mode
    members; the dual-mode OBDLink MX+ (Classic SPP plus iAP2 for iOS, plus a
    BLE GATT pipe -- `ble_role` would be secondary_control) has its own spec,
    obdlink-mx-plus. This spec stays `protocol: ble` because the BLE GATT pipe
    is the path a BLE-only phone client drives; the Classic path is what
    Android SPP tools such as Torque Pro require, and it is invisible to a
    BLE-only client.

obd:
  role: "adapter"

  # The market splits into four capability tiers. This spec documents the family, so the
  # profile below is the *baseline* every listed adapter meets; the variants above say
  # which physical dongles sit in which tier. A consumer should match a request's
  # `requires` list against the capabilities of the tier actually in hand.
  adapter_profile:
    class: "standards-elm327"
    capabilities:
      - "single_frame"
      - "multiframe_rx"
      - "custom_headers"
    # Per-model capabilities, since the named adapters differ in ways that decide whether
    # a given vendor function will run at all.
    models:
      - name: "UniCarScan UCSI-2100"
        class: "advanced-stn"
        capabilities:
          - "single_frame"
          - "multiframe_rx"
          - "multiframe_tx"
          - "flow_control"
          - "custom_headers"
          - "raw_frames"
        notes: "255-byte message support is how it satisfies multiframe_tx. No SW-CAN/MS-CAN."
        verification: "reported"
      - name: "OBDLink MX Bluetooth"
        class: "advanced-stn"
        capabilities:
          - "single_frame"
          - "multiframe_rx"
          - "multiframe_tx"
          - "flow_control"
          - "custom_headers"
          - "raw_frames"
          - "monitor_all"
          - "alt_can_bus"
        notes: "SW-CAN and MS-CAN capable. Bluetooth Classic only — not reachable from iOS."
        verification: "reported"
      - name: "OBDLink MX+"
        class: "advanced-stn"
        capabilities:
          - "single_frame"
          - "multiframe_rx"
          - "multiframe_tx"
          - "flow_control"
          - "custom_headers"
          - "raw_frames"
          - "monitor_all"
          - "alt_can_bus"
        notes: "As MX, plus MFi so iOS works. The only wireless iOS adapter reaching MS-CAN/SW-CAN."
        verification: "reported"
    known_limitations:
      - >
        basic-clone tier (cloned firmware sold as "ELM327 v2.1"): legislated single-frame
        reads only. Multi-frame transmit, client-supplied flow control and sometimes
        ATCAF0 fail or are silently wrong. TuneECU Lite's own listing states clone v2.1
        adapters do not work and a genuine v1.4/1.5 is required.
      - >
        standards-elm327 tier: reliable for reads and custom headers, but multi-frame
        transmit and tight timing are firmware-dependent — this is the tier where
        maintenance functions become a coin toss.
      - >
        advanced-stn tier (OBDLink LX/MX+/CX): adds dependable multiframe_tx,
        flow_control, raw_frames and the ST command set. This is what vendor tools name
        when a function must work.
      - >
        native-can tier (SocketCAN, PCAN, Kvaser): adds monitor_all and
        non_standard_bitrate. No AT layer, so nothing is hidden — the research tier.
      - >
        alt_can_bus (Ford MS-CAN, GM SW-CAN) cuts across the tiers: only the OBDLink MX,
        MX+ and EX provide it. An otherwise advanced-stn adapter without it cannot run
        FORScan's body and chassis module functions, because those buses sit on
        non-standard pins rather than behind a protocol setting.

  connector:
    standard: "sae-j1962"
    location: "vehicle diagnostic socket"
    pins:
      - pin: 6
        signal: "CAN-H"
        verification: "reported"
      - pin: 14
        signal: "CAN-L"
        verification: "reported"
      - pin: 7
        signal: "K-line"
        verification: "reported"
      - pin: 16
        signal: "battery +12V (usually unswitched)"
        verification: "reported"

  transport:
    standard: "iso15765-4"
    bitrate: 500000
    addressing: "11bit"
    request_id: "0x7E0"
    response_id: "0x7E8"
    functional_id: "0x7DF"
    verification: "reported"

  adapter_requirements:
    - "Single-frame reads (mode 01/03) work on essentially any adapter including clones."
    - >
      Multi-frame ISO-TP transmit and custom request headers need sound firmware
      — an STN
      chipset (OBDLink LX/MX+/CX) in practice. This is the dividing line behind
      vendor
      tools accepting any adapter for reads while naming specific ones for
      maintenance
      functions.

  requests:
    - name: "read_supported_pids"
      description: "Mode 01 PID 00 — bitmask of supported live-data PIDs; a safe first liveness check."
      command_class: "basic"
      requires: ["single_frame"]
      service: "01"
      request: "01 00"
      expected_response: "41 00 ?? ?? ?? ??"
      writes: false
      verification: "reported"
    - name: "read_dtcs"
      description: "Mode 03 — stored diagnostic trouble codes. Single frame, works on clones."
      command_class: "basic"
      requires: ["single_frame"]
      service: "03"
      request: "03"
      expected_response: "43 ??"
      writes: false
      verification: "reported"
    - name: "read_vin"
      description: >
        Mode 09 PID 02 — VIN. Legislated, but the reply is multi-frame, which makes it the
        cheapest test of whether an adapter can reassemble ISO-TP at all.
      command_class: "basic"
      requires: ["single_frame", "multiframe_rx"]
      service: "09"
      request: "09 02"
      expected_response: "49 02 ??"
      writes: false
      verification: "reported"
    - name: "read_vin_uds"
      description: "UDS ReadDataByIdentifier of the standard VIN DID — first step off the legislated path."
      command_class: "advanced"
      requires: ["custom_headers", "multiframe_rx"]
      service: "22"
      request: "22 F1 90"
      expected_response: "62 F1 90 ??"
      writes: false
      verification: "reported"

  data_identifiers:
    - did: "0xF190"
      name: "VIN (standard UDS DID)"
      type: "string"
      verification: "reported"
    - did: "0xF186"
      name: "Active diagnostic session (standard UDS DID)"
      type: "uint8"
      verification: "reported"

