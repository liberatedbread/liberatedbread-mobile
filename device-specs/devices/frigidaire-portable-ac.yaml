# Frigidaire WiFi Portable Air Conditioner — Device Specification
# Status: Cloud-only discovery confirmed by APK static analysis (updated 2026-07-15).
#   App package analyzed: com.electrolux.oneapp.android.frigidaire v1.24, v2.0, v3.6
#   APK/XAPK source: APKPure via apkeep. Older versions below 3.0 were obtained
#   and decompiled; local networking remained provisioning/enrollment only.
#   No steady-state LAN control discovery was found; local networking appears
#   limited to SoftAP/AllJoyn/OCP provisioning and enrollment.
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Frigidaire WiFi Portable Air Conditioner"
  manufacturer: "Frigidaire (Electrolux)"
  manufacturer_status: "unsupported"
  testing:
    status: untested
  protocol: "wifi"
  category: "climate"
  notes: >
    WiFi-connected portable AC units controlled via the Frigidaire app
    (Electrolux platform). Covers FHPC series (8K BTU) and FHPH series
    (13K BTU). Same cloud platform as window AC units but adds Dehumidify
    mode and drain-full indicator.

    DISCOVERY/AUTHENTICATION: this is WiFi cloud control, not a steady-state
    local LAN protocol. APK static analysis of Frigidaire
    com.electrolux.oneapp.android.frigidaire v1.24, v2.0, and v3.6 found OCP
    cloud endpoints and websocket hosts, plus provisioning-only local paths:
    SoftAP SSID hints (AJ, @E, IOT, Air_Conditioner, Dehumidifier), Delta NIU
    TCP/TLS setup, AllJoyn onboarding/enrollment classes, UDP broadcast on port
    3000, a direct setup connection to 192.168.6.1:3002, and in v2.0 a cleartext
    network-security exception for 192.168.0.1. Searches for mDNS/NSD,
    SSDP/UPnP, .local service discovery, local REST/websocket endpoints, LAN
    control feature flags, and AWS Greengrass/local proxy patterns found no
    usable post-pairing LAN discovery/control path for these AC units.

    Discovery for users happens through the Frigidaire/Electrolux app account
    after app-based pairing. The replacement control path must authenticate to
    the Electrolux cloud/OCP account, enumerate appliances assigned to that
    account, then send commands through the cloud API or websocket. An official
    path now exists alongside the reverse-engineered OCP one: the Electrolux
    Developer API (developer.electrolux.one) plus the official Apache-2.0
    Python SDK (electrolux-oss/electrolux-group-developer-sdk), reported to
    work with NA-region Frigidaire 2.0 app credentials.

    Protocol details still need network captures to confirm exact request and
    payload formats, but local device discovery is closed as cloud-only for
    post-pairing control based on the inspected APK.
  identification:
    ssid_prefix: "Air_Conditioner"
    discovery: "Electrolux/Frigidaire app and cloud account enumeration"
    local_discovery: false
    provisioning_local_only:
      softap_ssid_prefixes: ["AJ", "@E", "IOT", "Air_Conditioner", "Dehumidifier"]
      protocols: ["AllJoyn onboarding", "OCP provisioning"]
      setup_endpoint: "192.168.6.1:3002"
      legacy_cleartext_exception: "192.168.0.1"
      udp_broadcast_port: 3000
      legacy_setup_commands:
        - "DELTA_NIU_HTTP_REQUEST"
        - "DELTA_NIU_COOKIE_SIGN"
        - "DELTA_NIU_SET_CLOUD_PASSWORD"
        - "OCP_CLOUD_POST_APPLIANCE"
        - "AJ_NIU_ONBOARD"
        - "LOCAL_ROBOT_PASSWORD"
    cloud_provider: "Electrolux OCP / Frigidaire app"
    cloud_endpoints_observed:
      - "https://api.ocp-dev.electrolux.one"
      - "https://api.ocp-staging.electrolux.one"
      - "https://frigidaire.app.electrolux.one/"
      - "wss://ws.eu.ocp-dev.electrolux.one"
      - "wss://ws.eu.ocp-staging.electrolux.one"
      - "https://api.ocp.electrolux.one (production; regional bases api.us.ocp.electrolux.one for NA, api.eu.ocp.electrolux.one for EU)"
      - "wss://ws.eu.ocp.electrolux.one (production websocket host confirmed in app code; regional wss://ws.us.ocp.electrolux.one)"
      - "/appliance/api/v2/appliances?includeMetadata=true"
      - "/appliance/api/v2/appliances/{applianceId}/command"
      - "/appliance/api/v3/appliances/info"
      - "/remote-control/api/v1/appliances/"

  discovery:
    methods:
      - type: "cloud"
        cloud:
          provider: "electrolux_ocp"
          auth_method: "oauth2"
          device_list_endpoint:
            method: "GET"
            url: "https://api.ocp.electrolux.one/appliance/api/v2/appliances?includeMetadata=true"
            notes: >
              The earlier api.electrolux.com/ocp/v1/appliances URL does not
              resolve (NXDOMAIN) and no OCP client references it. Working path
              on the OCP cloud; NA accounts use the regional base
              https://api.us.ocp.electrolux.one. The official Electrolux
              Developer API exposes the same enumeration at
              https://api.developer.electrolux.one/api/v1/appliances.
            response_mapping:
              stable_keys:
                - source: "json://applianceId"
              display:
                source: "json://name"
    identity:
      stable_keys: ["appliance_id"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "low"
    notes: >
      Onboarding is cloud-mediated and is the reason this appliance has no
      local control story: the unit is bound to an Electrolux account during
      setup, and every documented control path goes back through that account.
      See the local API audit for the evidence that no local endpoint survives
      provisioning.
    methods:
      - type: "cloud_account"
        verified: false
        description: >
          The vendor app puts the appliance into pairing mode, transfers the
          home network credentials, and registers the appliance against an
          Electrolux account. Neither the credential transfer nor the
          registration handshake has been captured here.
        cloud:
          provider: "Electrolux / Frigidaire"
          local_alternative: >
            None found. The local API audit across firmware v1.24, v2.0 and
            v3.6 confirmed there is no local HTTP, SSDP or mDNS control surface
            to fall back on.
        steps:
          - action: "Put the unit into pairing mode from its own control panel."
            actor: "user"
            notes: "Typically holding the WiFi/Connect button until the WiFi indicator blinks; confirm against the model's manual."
          - action: "Complete onboarding in the vendor app, which transfers credentials and registers the appliance."
            actor: "user"
          - action: "Capture this exchange."
            actor: "client"
            notes: "Open gap: the highest-value capture target for this device, since it is the only moment local credentials are in play."
    factory_reset:
      confidence: "high"
      effect: "Clears WiFi credentials and the account binding, returning the unit to pairing mode. Vendor-documented in an official Frigidaire support article (the router-change procedure)."
      procedures:
        - name: "Control panel button sequence"
          steps:
            - action: "Remove the appliance from the Frigidaire 2.0 app."
              actor: "user"
            - action: "Press and hold the Wi-Fi/Connect button for 10 seconds (the unit may beep)."
              actor: "user"
            - action: "Unplug the appliance for 30 seconds, then plug it back in."
              actor: "user"
              notes: "Wait at least 60 seconds after plugging back in before attempting the connection process again."
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: >
        Changing routers means re-running app onboarding. If the vendor cloud
        is retired, that path disappears and the unit cannot be re-bound at
        all — the practical definition of a bricked smart appliance.
    credentials:
      wifi_passphrase_protection: "unknown"
      stored_on_device:
        - "WiFi credentials"
        - "Cloud/account binding for the appliance"
      issued_to_client: []

http_endpoints:
  - method: "GET"
    path: "/appliance/api/v2/appliances?includeMetadata=true"
    name: "Appliance List"
    description: "Cloud account enumeration path; path and GET method confirmed in the app's endpoint enum (GET_APPLIANCES_V2) against the api.ocp.electrolux.one production host."
    response_body:
      content_type: "application/json"

  - method: "GET"
    path: "/appliance/api/v3/appliances/info"
    name: "Appliance Info"
    description: "Fetch appliance metadata for account-enumerated appliances."
    response_body:
      content_type: "application/json"

  - method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    name: "Appliance Command"
    description: >
      Cloud command path; path and PUT method confirmed in the app's endpoint
      enum (PUT_SEND_COMMAND). Payload is a single-property JSON map keyed by an
      OCP attribute name, e.g. {"fanSpeedSetting": "LOW"} or {"executeCommand":
      "ON"}, sent one property per call (medium confidence, app-derived, not
      hardware-verified; exact serialization requires traffic capture).
      This endpoint is the encoding referenced by every entity `commands` value
      in this spec. Those values use two forms: a bare OCP attribute name (e.g.
      set_temperature -> "targetTemperatureC") means "PUT this attribute with the
      value the control supplies", i.e. {"<attribute>": <control value>}; the
      form "<attribute>=<VALUE>" (e.g. turn_on -> "executeCommand=ON") means
      "PUT this attribute with the literal VALUE", i.e. {"<attribute>":
      "<VALUE>"}. There are no separately declared command blocks because OCP
      control is attribute writes, not named commands.
    request_body:
      content_type: "application/json"

  - method: "POST"
    path: "/remote-control/api/v1/appliances/"
    name: "Remote Control"
    description: "String literal present only as a raw dex string in the analyzed APKs; no decompiled call site references it, so the HTTP method (POST shown is a placeholder) and payload are uncorroborated."
    request_body:
      content_type: "application/json"

entities:
  - platform: "climate"
    name: "Portable Air Conditioner"
    features: ["target_temperature", "fan_mode", "hvac_mode"]
    min_temp: 16
    max_temp: 30
    temp_step: 1
    notes: >
      OCP wire names below come from the app's bundled capability profiles
      (ac_daiane_capabilities.json and the ac_emmanuelle_* profiles) and its
      attribute-name enum; medium confidence, app-derived, not verified
      against hardware. targetTemperatureC is readwrite, 16-30 C in steps
      of 1 (the app's attribute enum also maps a targetTemperatureF
      attribute; the bundled profiles declare only the C spelling).
      hvac_mode values are AUTO/COOL/FANONLY/HEAT in the daiane profile;
      the emmanuelle profiles add DRY, matching the Dehumidify mode of
      portable units. Eco is not a mode value but the separate
      energySavingMode attribute. fan_mode values are
      AUTO/HIGH/MIDDLE/LOW/TURBO (the profile's spelling is "MIDDLE", not
      Medium). Power is the write-only executeCommand attribute with
      values ON/OFF.
      Every `commands` value in this and the other entities below is an OCP
      attribute write sent to the "Appliance Command" endpoint (PUT
      .../appliances/{applianceId}/command); see that endpoint's description for
      the encoding — a bare attribute name writes the control's value to that
      attribute, and "attribute=VALUE" writes the literal VALUE.
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      current_temperature: "ambientTemperatureC"
      target_temperature: "targetTemperatureC"
      fan_mode: "fanSpeedSetting"
      hvac_mode: "mode"
    commands:
      set_temperature: "targetTemperatureC"
      set_fan_mode: "fanSpeedSetting"
      set_hvac_mode: "mode"
      turn_on: "executeCommand=ON"
      turn_off: "executeCommand=OFF"

  - platform: "sensor"
    name: "Room Temperature"
    device_class: "temperature"
    unit: "°F"
    notes: "ambientTemperatureC is the wire name in the app's attribute enum, but the bundled daiane profile declares no ambient-temperature attribute; low confidence until a traffic capture confirms it."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "ambientTemperatureC"

  - platform: "binary_sensor"
    name: "Filter Alert"
    device_class: "problem"
    notes: "filterState is a read-only enum (GOOD/CLEAN/CHANGE/BUY); any value other than GOOD is a problem state. cleanFilterAlertReset is a write-only attribute that clears the alert."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "filterState"

  - platform: "binary_sensor"
    name: "Drain Full"
    device_class: "problem"
    notes: "No corresponding attribute appears in the app's bundled AC capability profiles; the wire name is unverified."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "drain_full"

  - platform: "switch"
    name: "Sleep Mode"
    notes: "sleepMode attribute (readwrite, OFF/ON) per the app's attribute enum and the bundled emmanuelle capability profiles. Medium confidence."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "sleepMode"
    commands:
      turn_on: "sleepMode=ON"
      turn_off: "sleepMode=OFF"

  - platform: "switch"
    name: "Display"
    notes: "displayLight is an enum (DISPLAY_LIGHT_0/DISPLAY_LIGHT_100), not a boolean; the daiane profile declares it readwrite."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "displayLight"
    commands:
      turn_on: "displayLight=DISPLAY_LIGHT_100"
      turn_off: "displayLight=DISPLAY_LIGHT_0"

  - platform: "switch"
    name: "Energy Saving (Eco)"
    notes: "energySavingMode attribute (readwrite, OFF/ON) — eco is this separate attribute, not a value of mode. Per the daiane profile's triggers, turning it ON removes TURBO from the allowed fanSpeedSetting values."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "energySavingMode"
    commands:
      turn_on: "energySavingMode=ON"
      turn_off: "energySavingMode=OFF"
