# Frigidaire WiFi Portable Air Conditioner — Device Specification
# Status: Cloud-only discovery confirmed by static analysis of the vendor
#   Android app (updated 2026-07-15). Several releases, current and older,
#   were examined; local networking remained provisioning/enrollment only.
#   No steady-state LAN control discovery was found; local networking appears
#   limited to SoftAP/AllJoyn/OCP provisioning and enrollment.
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Frigidaire WiFi Portable Air Conditioner"
  manufacturer: "Frigidaire (Electrolux)"
  manufacturer_status: "unsupported"
  testing:
    status: untested
  protocol: "wifi"
  category: "climate"
  notes: >
    WiFi-connected portable AC units controlled via the Frigidaire app
    (Electrolux platform). Covers FHPC series (8K BTU) and FHPH series
    (13K BTU). Same cloud platform as window AC units but adds Dehumidify
    mode and drain-full indicator.

    DISCOVERY/AUTHENTICATION: this is WiFi cloud control, not a steady-state
    local LAN protocol. APK static analysis of Frigidaire
    com.electrolux.oneapp.android.frigidaire v1.24, v2.0, and v3.6 found OCP
    cloud endpoints and websocket hosts, plus provisioning-only local paths:
    SoftAP SSID hints (AJ, @E, IOT, Air_Conditioner, Dehumidifier), Delta NIU
    TCP/TLS setup, AllJoyn onboarding/enrollment classes, UDP broadcast on port
    3000, a direct setup connection to 192.168.6.1:3002, and in v2.0 a cleartext
    network-security exception for 192.168.0.1. Searches for mDNS/NSD,
    SSDP/UPnP, .local service discovery, local REST/websocket endpoints, LAN
    control feature flags, and AWS Greengrass/local proxy patterns found no
    usable post-pairing LAN discovery/control path for these AC units.

    Discovery for users happens through the Frigidaire/Electrolux app account
    after app-based pairing. The replacement control path must authenticate to
    the Electrolux cloud/OCP account, enumerate appliances assigned to that
    account, then send commands through the cloud API or websocket. An official
    path now exists alongside the reverse-engineered OCP one: the Electrolux
    Developer API (developer.electrolux.one) plus the official Apache-2.0
    Python SDK (electrolux-oss/electrolux-group-developer-sdk), reported to
    work with NA-region Frigidaire 2.0 app credentials.

    Protocol details still need network captures to confirm exact request and
    payload formats, but local device discovery is closed as cloud-only for
    post-pairing control based on the inspected APK.
  identification:
    ssid_prefix: "Air_Conditioner"
    notes: >
      No local discovery once the unit is on the home network: the
      Electrolux/Frigidaire app enumerates appliances through the cloud
      account, and the SSID prefix above is the only signal a scanner sees
      (setup-time SoftAP). The provisioning-AP details and observed cloud
      endpoints are under protocol_details.

  discovery:
    methods:
      - type: "cloud"
        cloud:
          provider: "electrolux_ocp"
          auth_method: "oauth2"
          device_list_endpoint:
            method: "GET"
            url: "https://api.ocp.electrolux.one/appliance/api/v2/appliances?includeMetadata=true"
            notes: >
              The earlier api.electrolux.com/ocp/v1/appliances URL does not
              resolve (NXDOMAIN) and no OCP client references it. Working path
              on the OCP cloud; NA accounts use the regional base
              https://api.us.ocp.electrolux.one. The official Electrolux
              Developer API exposes the same enumeration at
              https://api.developer.electrolux.one/api/v1/appliances.
            response_mapping:
              stable_keys:
                - source: "json://applianceId"
              display:
                source: "json://name"
    identity:
      stable_keys: ["appliance_id"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "low"
    notes: >
      Onboarding is cloud-mediated and is the reason this appliance has no
      local control story: the unit is bound to an Electrolux account during
      setup, and every documented control path goes back through that account.
      See the local API audit for the evidence that no local endpoint survives
      provisioning.
    methods:
      - type: "cloud_account"
        verified: false
        description: >
          The vendor app puts the appliance into pairing mode, transfers the
          home network credentials, and registers the appliance against an
          Electrolux account. Neither the credential transfer nor the
          registration handshake has been captured here.
        cloud:
          provider: "Electrolux / Frigidaire"
          local_alternative: >
            None found. The local API audit across firmware v1.24, v2.0 and
            v3.6 confirmed there is no local HTTP, SSDP or mDNS control surface
            to fall back on.
        steps:
          - action: "Put the unit into pairing mode from its own control panel."
            actor: "user"
            notes: "Typically holding the WiFi/Connect button until the WiFi indicator blinks; confirm against the model's manual."
          - action: "Complete onboarding in the vendor app, which transfers credentials and registers the appliance."
            actor: "user"
          - action: "Capture this exchange."
            actor: "client"
            notes: "Open gap: the highest-value capture target for this device, since it is the only moment local credentials are in play."
    factory_reset:
      confidence: "high"
      effect: "Clears WiFi credentials and the account binding, returning the unit to pairing mode. Vendor-documented in an official Frigidaire support article (the router-change procedure)."
      procedures:
        - name: "Control panel button sequence"
          steps:
            - action: "Remove the appliance from the Frigidaire 2.0 app."
              actor: "user"
            - action: "Press and hold the Wi-Fi/Connect button for 10 seconds (the unit may beep)."
              actor: "user"
            - action: "Unplug the appliance for 30 seconds, then plug it back in."
              actor: "user"
              notes: "Wait at least 60 seconds after plugging back in before attempting the connection process again."
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: >
        Changing routers means re-running app onboarding. If the vendor cloud
        is retired, that path disappears and the unit cannot be re-bound at
        all — the practical definition of a bricked smart appliance.
    credentials:
      wifi_passphrase_protection: "unknown"
      stored_on_device:
        - "WiFi credentials"
        - "Cloud/account binding for the appliance"
      issued_to_client: []

  pairing:
    required: true
    confidence: "medium"
    # No local control surface exists (see device.notes), so this block
    # describes the only gate there is: the cloud account the unit is bound to.
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "user_chosen"
      notes: >
        The credential a client holds is the owner's Electrolux account, never
        anything issued by the appliance. Either the account's email and
        password, signed in over OAuth2 to the OCP cloud as
        bm1549/home-assistant-frigidaire does, or an API key plus access and
        refresh tokens generated for that account in the Electrolux Developer
        Portal, as electrolux-oss/electrolux-group-developer-sdk expects.
    exclusivity:
      single_connection: false
      single_bond: false
      recovery: >
        Nothing to clear on the appliance: any number of clients can sign in
        to the same account. A unit that does not show up in the appliance
        list is usually bound to a different account. Remove it there, or
        follow setup.factory_reset and onboard it again.
    unpair:
      supported: true
      requires_factory_reset: false
      clears: "That client's account session or developer tokens; the appliance and its account binding are untouched."
      notes: >
        Revocation happens at the account, not the appliance: delete the API
        key in the developer portal, or change the account password (whether
        that also kills refresh tokens already issued is not established).
        Moving the appliance to another account is a different operation.
        Remove it from the app, then reset it per setup.factory_reset.
    enter_pairing_mode:
      required: false
      notes: >
        A new client needs nothing at the hardware. The Wi-Fi/Connect hold
        belongs to onboarding (setup method cloud_account), which binds the
        unit to an account once; it does not authorise individual clients.
    notes: >
      The APK audit in device.notes found only provisioning-time local paths,
      so no LAN or BLE surface exists to authorise against. A client signs in
      to the Electrolux cloud as the account owner, enumerates the appliances
      bound to that account, and sends attribute writes through it. Nothing a
      client stores survives the service: when Electrolux retires it, or the
      account, every client loses control at once. Frigidaire switching off
      its 1.0 Smart App and making owners re-onboard to the 2.0 app is the
      precedent. Confidence is medium because two working open clients
      authenticate this way; this project has not replayed either.

http_endpoints:
  - method: "GET"
    path: "/appliance/api/v2/appliances?includeMetadata=true"
    name: "Appliance List"
    description: "Cloud account enumeration path; path and GET method confirmed in the app's table of cloud endpoints against the api.ocp.electrolux.one production host."
    response_body:
      content_type: "application/json"

  - method: "GET"
    path: "/appliance/api/v3/appliances/info"
    name: "Appliance Info"
    description: "Fetch appliance metadata for account-enumerated appliances."
    response_body:
      content_type: "application/json"

  - method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    name: "Appliance Command"
    description: >
      Cloud command path; path and PUT method confirmed in the app's table
      of cloud endpoints. Payload is a single-property JSON map keyed by an
      OCP attribute name, e.g. {"fanSpeedSetting": "LOW"} or {"executeCommand":
      "ON"}, sent one property per call (medium confidence, app-derived, not
      hardware-verified; exact serialization requires traffic capture).
      Every entry in the top-level `commands:` block is one PUT to this
      endpoint, and its `arguments` map is the JSON body: a `{parameter}`
      value is filled from the control (set_temperature sends
      {"targetTemperatureC": <temperature>}), a literal is sent as written
      (turn_on sends {"executeCommand": "ON"}). Entity `commands` values
      name those entries.
    request_body:
      content_type: "application/json"

  - method: "POST"
    path: "/remote-control/api/v1/appliances/"
    name: "Remote Control"
    status: "unverified"
    description: "String literal present only as a raw string in the analysed app builds; no call site references it, so the HTTP method (POST shown is a placeholder) and payload are uncorroborated."
    request_body:
      content_type: "application/json"

commands:
  # OCP control is attribute writes, and an attribute write with its value
  # already chosen is exactly what a command is — so each one gets a name a
  # role map can point at, instead of the role map carrying the attribute and
  # a convention for reading it. Every entry is one PUT to the Appliance
  # Command endpoint with a single-property JSON body; see that endpoint for
  # the encoding and its confidence.
  #
  # Confidence is uniformly `reported`: the attribute names and value
  # vocabularies come from the app's bundled capability profiles and its
  # attribute-name enum, not from a traffic capture.
  set_temperature:
    description: "Set the target temperature in Celsius."
    transport: "http"
    method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    arguments:
      targetTemperatureC: "{temperature}"
    parameters:
      applianceId:
        type: "string"
        source: "credential:appliance_id"
        description: "The appliance's OCP id, taken from the Appliance List response. Account-scoped rather than secret, but per-device and not guessable — a client without it must fail the send."
      temperature:
        type: "uint8"
        min: 16
        max: 30
        unit: "C"
        description: "16-30 C in steps of 1, per the bundled capability profiles."
    verification: "reported"
  set_fan_mode:
    description: "Set fan speed."
    transport: "http"
    method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    arguments:
      fanSpeedSetting: "{fan_mode}"
    parameters:
      applianceId:
        type: "string"
        source: "credential:appliance_id"
      fan_mode:
        type: "string"
        enum: ["AUTO", "HIGH", "MIDDLE", "LOW", "TURBO"]
        description: "The profile spells the middle step MIDDLE, not Medium. TURBO drops out of the allowed set while energySavingMode is ON."
    verification: "reported"
  set_hvac_mode:
    description: "Set the operating mode."
    transport: "http"
    method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    arguments:
      mode: "{hvac_mode}"
    parameters:
      applianceId:
        type: "string"
        source: "credential:appliance_id"
      hvac_mode:
        type: "string"
        enum: ["AUTO", "COOL", "FANONLY", "HEAT", "DRY"]
        description: "DRY comes from the app's portable-AC capability profiles and is the Dehumidify mode of portable units; its window-AC profile omits it. Eco is NOT a mode value — it is the separate energySavingMode attribute."
    verification: "reported"
  turn_on:
    description: "Power the unit on."
    transport: "http"
    method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    arguments:
      executeCommand: "ON"
    parameters:
      applianceId:
        type: "string"
        source: "credential:appliance_id"
    notes: "executeCommand is write-only; power state reads back from `mode`, not from this attribute."
    verification: "reported"
  turn_off:
    description: "Power the unit off."
    transport: "http"
    method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    arguments:
      executeCommand: "OFF"
    parameters:
      applianceId:
        type: "string"
        source: "credential:appliance_id"
    verification: "reported"
  sleep_mode_on:
    description: "Enable sleep mode."
    transport: "http"
    method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    arguments:
      sleepMode: "ON"
    parameters:
      applianceId:
        type: "string"
        source: "credential:appliance_id"
    verification: "reported"
  sleep_mode_off:
    description: "Disable sleep mode."
    transport: "http"
    method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    arguments:
      sleepMode: "OFF"
    parameters:
      applianceId:
        type: "string"
        source: "credential:appliance_id"
    verification: "reported"
  display_on:
    description: "Turn the panel display to full brightness."
    transport: "http"
    method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    arguments:
      displayLight: "DISPLAY_LIGHT_100"
    parameters:
      applianceId:
        type: "string"
        source: "credential:appliance_id"
    notes: "displayLight is an enum, not a boolean."
    verification: "reported"
  display_off:
    description: "Turn the panel display off."
    transport: "http"
    method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    arguments:
      displayLight: "DISPLAY_LIGHT_0"
    parameters:
      applianceId:
        type: "string"
        source: "credential:appliance_id"
    verification: "reported"
  energy_saving_on:
    description: "Enable energy-saving (eco) mode."
    transport: "http"
    method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    arguments:
      energySavingMode: "ON"
    parameters:
      applianceId:
        type: "string"
        source: "credential:appliance_id"
    notes: "Turning this on removes TURBO from the allowed fanSpeedSetting values, per the profile's triggers."
    verification: "reported"
  energy_saving_off:
    description: "Disable energy-saving (eco) mode."
    transport: "http"
    method: "PUT"
    path: "/appliance/api/v2/appliances/{applianceId}/command"
    arguments:
      energySavingMode: "OFF"
    parameters:
      applianceId:
        type: "string"
        source: "credential:appliance_id"
    verification: "reported"

entities:
  - platform: "climate"
    name: "Portable Air Conditioner"
    features: ["target_temperature", "fan_mode", "hvac_mode"]
    min_temp: 16
    max_temp: 30
    temp_step: 1
    notes: >
      OCP wire names below come from the app's bundled capability profiles
      (its window-AC profile and its portable-AC profiles) and its
      attribute-name enum; medium confidence, app-derived, not verified
      against hardware. targetTemperatureC is readwrite, 16-30 C in steps
      of 1 (the app's attribute enum also maps a targetTemperatureF
      attribute; the bundled profiles declare only the C spelling).
      hvac_mode values are AUTO/COOL/FANONLY/HEAT in the window-AC profile;
      the portable-AC profiles add DRY, matching the Dehumidify mode of
      portable units. Eco is not a mode value but the separate
      energySavingMode attribute. fan_mode values are
      AUTO/HIGH/MIDDLE/LOW/TURBO (the profile's spelling is "MIDDLE", not
      Medium). Power is the write-only executeCommand attribute with
      values ON/OFF.
      Every `commands` value in this and the other entities below names an
      entry in the top-level `commands:` block, each of which is one OCP
      attribute write to the "Appliance Command" endpoint (PUT
      .../appliances/{applianceId}/command).
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      current_temperature: "ambientTemperatureC"
      target_temperature: "targetTemperatureC"
      fan_mode: "fanSpeedSetting"
      hvac_mode: "mode"
    commands:
      set_temperature: "set_temperature"
      set_fan_mode: "set_fan_mode"
      set_hvac_mode: "set_hvac_mode"
      turn_on: "turn_on"
      turn_off: "turn_off"

  - platform: "sensor"
    name: "Room Temperature"
    device_class: "temperature"
    unit: "F"
    notes: "ambientTemperatureC is the wire name in the app's attribute enum, but the bundled window-AC capability profile declares no ambient-temperature attribute; low confidence until a traffic capture confirms it."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "ambientTemperatureC"

  - platform: "binary_sensor"
    name: "Filter Alert"
    device_class: "problem"
    notes: "filterState is a read-only enum (GOOD/CLEAN/CHANGE/BUY); any value other than GOOD is a problem state. cleanFilterAlertReset is a write-only attribute that clears the alert."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "filterState"

  - platform: "binary_sensor"
    name: "Drain Full"
    device_class: "problem"
    notes: "No corresponding attribute appears in the app's bundled AC capability profiles; the wire name is unverified."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "drain_full"

  - platform: "switch"
    name: "Sleep Mode"
    notes: "sleepMode attribute (readwrite, OFF/ON) per the app's attribute enum and its bundled portable-AC capability profiles. Medium confidence."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "sleepMode"
    commands:
      turn_on: "sleep_mode_on"
      turn_off: "sleep_mode_off"

  - platform: "switch"
    name: "Display"
    notes: "displayLight is an enum (DISPLAY_LIGHT_0/DISPLAY_LIGHT_100), not a boolean; the window-AC capability profile declares it readwrite."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "displayLight"
    commands:
      turn_on: "display_on"
      turn_off: "display_off"

  - platform: "switch"
    name: "Energy Saving (Eco)"
    notes: "energySavingMode attribute (readwrite, OFF/ON) — eco is this separate attribute, not a value of mode. Per the window-AC capability profile's triggers, turning it ON removes TURBO from the allowed fanSpeedSetting values."
    state_topic: "appliance/{device_id}/state"
    state_mapping:
      value: "energySavingMode"
    commands:
      turn_on: "energy_saving_on"
      turn_off: "energy_saving_off"

helpful_urls:
  - title: "bm1549/home-assistant-frigidaire (HACS)"
    url: "https://github.com/bm1549/home-assistant-frigidaire"
    description: "HACS custom component for Frigidaire ACs via the Electrolux cloud API; cloud fallback where the local path documented here is unavailable."
  - title: "Frigidaire Gallery FGRC1244T100 use and care manual"
    url: "https://www.manualslib.com/manual/1834955/Frigidaire-Gallery-Fgrc1244t100.html"
    kind: "manual"
    description: >
      Vendor manual for the sibling window unit; the portable range shares the same Wi-Fi module and app flow.

protocol_details:
  # Moved out of device.identification: none of this is a scan-time signal.
  provisioning_local_only:
    softap_ssid_prefixes: ["AJ", "@E", "IOT", "Air_Conditioner", "Dehumidifier"]
    protocols: ["AllJoyn onboarding", "OCP provisioning"]
    setup_endpoint: "192.168.6.1:3002"
    legacy_cleartext_exception: "192.168.0.1"
    udp_broadcast_port: 3000
    legacy_setup_steps: >
      The legacy flow, in the app's order: an HTTP request to the module,
      a cookie-signing exchange, setting the cloud password on the module,
      posting the appliance to the OCP cloud, AllJoyn onboarding, and a
      local password step.
  cloud_provider: "Electrolux OCP / Frigidaire app"
  cloud_endpoints_observed:
    - "https://api.ocp-dev.electrolux.one"
    - "https://api.ocp-staging.electrolux.one"
    - "https://frigidaire.app.electrolux.one/"
    - "wss://ws.eu.ocp-dev.electrolux.one"
    - "wss://ws.eu.ocp-staging.electrolux.one"
    - "https://api.ocp.electrolux.one (production; regional bases api.us.ocp.electrolux.one for NA, api.eu.ocp.electrolux.one for EU)"
    - "wss://ws.eu.ocp.electrolux.one (production websocket host confirmed in app code; regional wss://ws.us.ocp.electrolux.one)"
    - "/appliance/api/v2/appliances?includeMetadata=true"
    - "/appliance/api/v2/appliances/{applianceId}/command"
    - "/appliance/api/v3/appliances/info"
    - "/remote-control/api/v1/appliances/"
