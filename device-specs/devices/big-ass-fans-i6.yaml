evidence:
  artifacts:
    - type: "public_implementation"
      artifact: "jfroy/aiobafi6, main branch as of 2026-08-31"
      url: "https://github.com/jfroy/aiobafi6"
    - type: "public_implementation"
      artifact: "home-assistant/core homeassistant/components/baf (dev branch, 2026-09; requires aiobafi6 0.9.0)"
      url: "https://github.com/home-assistant/core/tree/dev/homeassistant/components/baf"
    - type: "public_implementation"
      artifact: "oogje/homebridge-i6-bigassfans 0.6.1-beta10 (2026-02-23)"
      url: "https://github.com/oogje/homebridge-i6-bigassfans"
    - type: "static_analysis"
      artifact: "Big Ass Fans Android app (package com.baf.i6) v3.3.4 and 3.4.0"
      obtained_via: "third-party APK mirror, 2026-09 and 2026-11"
      description: >
        Version 3.4.0 (versionCode 1467127165), SHA-256
        2d5985ef7cb9b29b2e0543fba0312766343c70e7be1293001c54e02a768a382b,
        preserved the model aliases and both local protocol roles. Seven
        unrelated decompile errors limit coverage; no protocol-selection
        change was found. No fan was contacted.
    - type: "vendor_documentation"
      artifact: "i6 operation and maintenance manual; i6, es6, Haiku, Haiku i and Haiku L installation guides; BAF app and Bluetooth remote support pages"
  app_static_analysis: >
    A targeted check of the vendor app, not a full analysis. It confirms that
    the app browses `_api._tcp` (and `_http._tcp`) with Android NSD, reads the
    TXT keys name, uuid, model and "api version", and opens a plain TCP
    socket to port 31415 with a 10 s connect timeout and keepalive. Its frame
    encoder and decoder are SLIP (0xc0 delimiters, 0xdb 0xdc / 0xdb 0xdd
    escapes). Its query message takes values 0-8, and it sends 0 for a full
    refresh and 3 on a timer. It carries the colour-preset table and filters
    it by the light's warmest and coolest values. It scans BLE for service
    e0fc1000-..., writes 20-byte chunks to e0fc1003-..., takes notifications
    on e0fc1004-..., and requests a 250-byte MTU. It uploads firmware over
    HTTP to port 31416. An earlier note in the research store said the app
    speaks only legacy UDP ASCII. That is wrong for this generation: the
    ASCII vocabulary is also present, for the legacy fans, but the 3.x path
    is the one above.
  documentation_review: >
    Manuals give the reset and remote-pairing procedures. The support pages
    give the onboarding sequence. No FCC ID is printed in the manuals held,
    and no Big Ass Fans / Delta T grantee was found on fccid.co.
  open_questions:
    - "Does the fan accept more than one property in a single commit?"
    - "Humidity scaling: whole percent (aiobafi6) or hundredths (oogje)?"
    - "How many simultaneous TCP clients does the fan serve, and does every connection get pushes?"
    - "Which capability sub-field is the uplight: 6 (aiobafi6) or 11 (oogje)?"
    - "What protobuf message carries the Wi-Fi SSID and passphrase over the BLE channel, and is anything encrypted above the SLIP layer?"
    - "What do query groups 7 and 8 return?"
    - "What is the schedule message format (query group 5, query_result field 3), and do schedules fire with the cloud unreachable?"
    - "Does a provisioned fan keep advertising its BLE service?"
    - "Does the i6 manual's reset apply unchanged to es6 and Haiku, and is there a network-only reset?"

remaining_unknowns:
  - "The Wi-Fi credential message on the BLE channel. Without it onboarding still needs the vendor app."
  - "The schedule and sleep-mode wire formats. Schedules are stored on the device and fetched with query group 5, but no project decodes them."
  - "Whether the fan applies more than one property per commit. Every known client sends one at a time."
  - "Humidity scaling (aiobafi6 and oogje disagree) and the capability bit for the uplight (sub-field 6 or 11)."
  - "The ideal-temperature range the app allows, and the app's own bounds for the motion and return-to-Auto timeouts. The bounds here are Home Assistant's."
  - "What query groups 7 and 8 mean, and the meaning of fields 67 and 109, which oogje logs as 'fan on means auto' and 'light on means auto'."
  - "How the pre-2023 Haiku L 'Wi-Fi' onboarding route works."
  - "Whether a firmware update is prepared by a protobuf message before the HTTP upload on 31416, and what an interrupted update leaves behind. Upload framing is out of scope on purpose."
  - "Whether Matter and the 31415 API run side by side on current smart boards, and from which firmware."
  - "The connection limit, and whether the occasional drops oogje reports are the fan closing idle sockets."
  - "Whether the Turbo6, Mammoth, Bison and Speakeasy model strings in the app's table speak this protocol with the same fields. They are matched by identification but not declared as variants."
  - "Whether the Haiku Switch model string is the Wi-Fi wall control, and what it exposes. It is matched but has no variant or entities."
