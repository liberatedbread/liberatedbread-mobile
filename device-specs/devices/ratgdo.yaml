# ratgdo Garage-Door Controller (ESPHome, local) — Device Spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources: ESPHome ratgdo authoritative config (github.com/ratgdo/esphome-ratgdo
# base.yaml + the static board YAMLs), ESPHome docs (web_server, web-api, api,
# mdns) and the ESPHome sources those docs describe (mdns_component.cpp for the
# TXT records, web_server.cpp for URL matching). ratgdo is the network-facing
# bridge for the Security+ opener protocol documented in
# chamberlain-garage-opener-secplus.yaml.
#
# The ESPHome platform itself — every node that is NOT a ratgdo — is
# esphome-device.yaml. This spec is one product on that platform, and the
# `txt_match` on project_name is what keeps it from claiming the rest.

device:
  name: "ratgdo Garage-Door Controller (ESPHome)"
  manufacturer: "ratgdo (open hardware) / Konnected (blaQ)"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Written from the authoritative ESPHome ratgdo config and ESPHome docs;
      no hardware driven yet (board on order). The control surface is standard
      ESPHome, so the endpoints are well-established, but the ratgdo entity
      names and the default-on web_server should be confirmed on the first real
      board — along with which addressing form that board's firmware accepts
      (see ADDRESSING below). Discovery (_esphomelib._tcp) will be exercised by
      the app's existing mDNS meta-query sweep; the project_name TXT matcher
      that separates a ratgdo from every other ESPHome node is read from the
      published board configs, not yet from a live TXT dump.
  protocol: "wifi"
  category: "other"
  pictogram: "garage-door"
  type: "garage-door-opener"
  transport: "http"
  integration: "supported"
  admin_url: "http://{address}/"
  notes: >
    ratgdo is a small ESP board wired to a Chamberlain/LiftMaster opener's
    wall-control terminals; it speaks the opener's Security+ 1.0/2.0 wire
    protocol (see chamberlain-garage-opener-secplus.yaml for that side) and
    exposes local, cloud-free control on the home network. This spec targets
    the mainstream ESPHome ratgdo firmware.

    NOT EVERY ESPHome NODE IS A ratgdo. ratgdo is one product built on ESPHome,
    and _esphomelib._tcp is the service type of the PLATFORM: a bedroom
    temperature sensor, a bluetooth proxy and a garage-door controller all
    publish it. Identify a ratgdo by the `project_name` TXT record, which the
    board configs set to `ratgdo.<board>` (observed values
    `ratgdo.v25iboard_secplus2`, `ratgdo.v32board_secplus2`,
    `ratgdo.v2board_esp8266_d1_mini_lite`) — hence the `ratgdo.` prefix
    matcher in `identification.mdns_txt_match`. An ESPHome node that does NOT
    match it is esphome-device.yaml's, and rendering it as a garage door is the
    exact failure that matcher exists to prevent. Konnected's blaQ is
    ratgdo-compatible hardware: flashed with mainstream ratgdo firmware it
    matches like any other board, but Konnected's own build sets its own
    project_name, which has not been observed here — so this matcher does not
    claim it, and a blaQ on stock firmware falls to the generic ESPHome spec
    until somebody dumps its TXT records.

    Two interchangeable local transports, both no-cloud, no-broker:
    1. WEB SERVER (HTTP :80) — enabled by default in ratgdo's config. A plain
       REST API plus a Server-Sent-Events state stream, ideal for a phone app:
         POST /cover/Door/open | /close | /stop | /toggle
         POST /cover/Door/set?position=<0.0..1.0>  (Security+ 2.0 only)
         GET  /cover/Door                          -> JSON state
         POST /light/Light/turn_on | /turn_off | /toggle
         POST /lock/Lock%20remotes/lock | /unlock
         GET  /binary_sensor/{Obstruction,Motion,Motor,Button}
         POST /button/Restart/press
         GET  /events  (text/event-stream) -> "state" events with the same
              per-entity JSON, the push channel for door/obstruction/motion.
       JSON state shape per entity, e.g.
         {"id":"cover/Door","state":"OPEN","current_operation":"IDLE","position":1.0}
         {"id":"binary_sensor/Obstruction","value":true,"state":"ON"}
       Default has NO auth; if the user adds web_server auth (basic/digest) the
       app must send it. web_server "version" affects only the built-in UI, not
       these endpoints.
    2. NATIVE API (TCP :6053, protobuf) — always present, what Home Assistant
       uses. Length-delimited protobuf: Hello -> Connect -> ListEntities (match
       the entity to its numeric key) -> SubscribeStates; commands reference the
       entity key. Framing byte 0x00 = plaintext, 0x01 = Noise-encrypted
       (Noise_NNpsk0_25519_ChaChaPoly_SHA256 with the 32-byte base64 PSK from
       `api: encryption: key:`). Efficient and streaming, but heavier to
       implement than the REST/SSE path; prefer the web server for a first cut.
       The legacy `api: password:` was removed in ESPHome 2026.1.0 (deprecated
       since 2022), so a current build is plaintext or Noise, never password.

    ADDRESSING — WHICH NAME GOES IN THE URL. ESPHome changed this, and a client
    that hardcodes one form breaks on half the fleet:
      * ESPHome <= 2025.12: the URL segment is the entity's slugified
        object_id, and the JSON `id` field is `<domain>-<object_id>`
        (`/cover/door`, `{"id":"cover-door"}`).
      * ESPHome 2026.1.0 through 2026.6: URLs match the entity NAME first and
        fall back to object_id with a deprecation warning — both forms work.
        2026.1.3+ also publishes the new-form identifier in a `name_id` field
        alongside the legacy `id`.
      * ESPHome >= 2026.7: the object_id fallback is gone from URL matching.
        URLs are the entity NAME, percent-encoded (`/cover/Door`,
        `/lock/Lock%20remotes/lock`).
      * ESPHome >= 2026.8: the JSON identifier catches up — `id` itself carries
        `<domain>/<name>` and `name_id` is no longer sent. Note this is a
        SECOND, later boundary: on 2026.7 the URL is already name-only while
        `id` is still the legacy `<domain>-<object_id>`, so a client that
        derives the URL from `id` breaks on exactly that release.
    The `path` of every command below is the NAME form, which is what current
    ratgdo firmware needs (its base config requires ESPHome >= 2026.4), and
    each carries the legacy object_id form as `path_fallback` so a board that
    predates the change stays drivable from this file: send `path`, and on a
    404 send `path_fallback`. Entities carry the same pair as `state_topic` /
    `state_topic_fallback`. A client that would rather not probe reads the
    identifier out of /events instead: an `id` containing `/` is the new form,
    anything else is the legacy one. Either way, a wrong form is a 404 and
    never a silent no-op — which is what makes the fallback safe, and why it
    must be gated on the 404 rather than on a timeout.

    ENTITY NAMES (object_id in brackets, for the legacy form): cover `Door`
    [door] (JSON `state` is OPEN or CLOSED only — travel shows up in
    `current_operation` as OPENING/CLOSING/IDLE; actions open/close/stop/
    toggle/set); light `Light` [light]; lock `Lock remotes` [lock_remotes]
    (lock/unlock); read-only binary_sensors `Obstruction`, `Motion`, `Motor`,
    `Button`; sensors `Openings`, `Paired Devices` [paired_devices];
    text_sensor `Firmware Version` [firmware_version]; buttons `Restart`,
    `Toggle door`, `Sync`, `Query status`, `Query openings`; numbers
    `Opening duration`, `Closing duration`, `Rolling code counter`,
    `Client ID`; switch `Learn` (pairing mode). The phone app's core four:
    the cover, the light, the remote lock-out, and the read-only sensors.

    GENERATION CAVEAT: on Security+ 1.0 openers the door has no stop/position
    (the opener does not support it) — expose stop/position only for Sec+ 2.0.

    SAFETY: this opens/closes a heavy motorised door. Treat door commands as
    advanced; gate them on the reported door state and surface obstruction.

    Cloud dependency: none. The native API is a direct device<->app socket; the
    web server is served from the board. No broker, no account.
  identification:
    mdns_service_type: "_esphomelib._tcp.local."
    # _esphomelib._tcp is the ESPHome PLATFORM, not this product. Without this
    # matcher a consumer keying on the service type alone labels every ESPHome
    # node on the LAN a garage-door opener — which is precisely what happened
    # while this was the only spec claiming the service type.
    mdns_txt_match:
      - key: "project_name"
        match: "prefix"
        value: "ratgdo."
        description: >
          ESPHome publishes the firmware's `esphome: project: name:` as the
          project_name TXT record. Every published ratgdo board config sets it
          to `ratgdo.<board>` — v25iboard_secplus2, v32board_secplus2,
          v2board_esp8266_d1_mini_lite — so the prefix matches the family and
          nothing else on the platform.
    default_port: 80
    identity_keys:
      primary: "mac"
      display: "friendly_name"

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_esphomelib._tcp.local."
          port: 6053
          # The full TXT set ESPHome's mdns component publishes on this
          # service; friendly_name is omitted by the device when unset, and
          # api_encryption / api_encryption_supported / api_provisioning depend
          # on how the build was configured.
          txt_record_keys: ["friendly_name", "version", "config_hash", "mac", "platform", "board", "network", "api_encryption", "api_encryption_supported", "api_provisioning", "project_name", "project_version", "package_import_url"]
          txt_match:
            - key: "project_name"
              match: "prefix"
              value: "ratgdo."
              description: >
                `esphome: project: name:` from the ratgdo board configs. A
                node whose project_name does not start `ratgdo.` is some other
                ESPHome device and belongs to esphome-device.yaml.
          identity_mapping:
            stable_keys:
              - source: "txt:mac"
                key: "mac"
            display:
              source: "txt:friendly_name"
    identity:
      stable_keys: ["mac"]
      display: "friendly_name"
    static_ip_required: false

  setup:
    required: true
    confidence: medium
    notes: >
      Two-part setup. HARDWARE: wire the ratgdo board to the opener's
      wall-control terminals and pair it to the opener with the opener's learn
      button (see chamberlain-garage-opener-secplus.yaml). NETWORK: the board
      is an ESPHome device — on first boot it hosts a Wi-Fi provisioning AP (or
      is flashed with credentials); once on the LAN it advertises
      _esphomelib._tcp and answers the web server on :80 and the native API on
      :6053. Confidence medium: standard ESPHome flows, not yet run here.
      Discriminate plaintext vs Noise-encrypted native API by the presence of
      the mDNS `api_encryption` TXT key; the web server has no such gate.
    methods:
      - type: "softap_http"
        verified: false
        description: >
          ESPHome captive-portal / improv provisioning to join Wi-Fi, then
          local HTTP/native-API control. (ratgdo images are flashed via the
          web installer at ratgdo.github.io or Konnected's installer.)
        ble:
          pairing_required: false
        steps:
          - action: "Flash ratgdo ESPHome firmware and wire the board to the opener terminals; pair with the opener's learn button."
            actor: user
          - action: "Join the board to Wi-Fi (ESPHome AP/improv, or flashed credentials)."
            actor: user
          - action: "Discover it via _esphomelib._tcp mDNS; read the project_name TXT to confirm it is a ratgdo (vs any other ESPHome device, which the same service type also finds)."
            actor: client
            expect: "TXT project_name starts `ratgdo.`; the web server answers GET /cover/Door (older firmware: /cover/door) with the door state."
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Re-flashing or an ESPHome factory-reset clears Wi-Fi credentials and
        the ESPHome config; the opener pairing (rolling-code seed) is separate
        and cleared at the opener's learn button. The exact ratgdo reset
        procedure (button hold vs re-flash) is not established here.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Standard ESPHome Wi-Fi rejoin; identity keys on the board MAC (mDNS TXT
        `mac`), not IP, so a DHCP move does not lose it.
    credentials:
      wifi_passphrase_protection: device_encrypted
      stored_on_device:
        - "Home Wi-Fi credentials"
        - "Optional native-API Noise PSK (api: encryption: key)"
        - "Security+ rolling-code counter (opener pairing)"
      issued_to_client:
        - "The native-API Noise PSK, if the user chose an encrypted build, must be shared with the app"
      notes: >
        The web server is unauthenticated by default (add web_server auth to
        change that). The native API is plaintext or Noise-encrypted — the
        legacy `api: password:` was removed in ESPHome 2026.1.0. Detect which
        from the mDNS TXT: `api_encryption` means a PSK is set and Noise is
        required, `api_encryption_supported` means the build can do Noise but
        has no key yet and still accepts plaintext.

local_access:
  status: native
  summary: >
    Fully local control (ESPHome web server REST/SSE on :80 and native
    protobuf API on :6053) with no cloud and no broker. This is the
    network-facing counterpart to the Security+ wired protocol.
  covers:
    - "Open / close / stop / toggle the door"
    - "Garage light on/off; remote lock-out"
    - "Door position/state, obstruction, motion, motor, wall-button status"

http_endpoints:
  # ESPHome web_server (port 80), enabled by default on ratgdo. Unauthenticated
  # unless the user adds web_server auth. Door commands are advanced (they move
  # a real door). Paths are the entity-NAME form current firmware requires; the
  # legacy object_id form each one had on ESPHome <= 2025.12 is in brackets.
  - method: "GET"
    path: "/cover/Door"
    name: "Door State"
    description: "JSON state of the garage door cover: `state` OPEN or CLOSED (any position but fully closed reads OPEN), `current_operation` OPENING/CLOSING/IDLE, `value` a float 0.0..1.0. `position` is present only when the cover supports position — Security+ 2.0 — so its absence is the Sec+ 1.0 case, not an error. Legacy path /cover/door."
  - method: "POST"
    path: "/cover/Door/open"
    name: "Open Door"
    description: "Open the garage door. Siblings: /cover/Door/close, /cover/Door/stop, /cover/Door/toggle. Advanced: moves a heavy motorised door. Legacy path /cover/door/open."
    status: "unverified"
  - method: "POST"
    path: "/cover/Door/set"
    name: "Set Door Position"
    description: "Set door position: query param position=<0.0..1.0>, ESPHome's cover scale (0.0 closed, 1.0 open) — not a percentage. Security+ 2.0 only (Sec+ 1.0 openers have no position/stop), and the device answers 409 if the cover does not support position. Advanced."
    status: "unverified"
  - method: "POST"
    path: "/light/Light/turn_on"
    name: "Light On"
    description: "Turn the garage light on. Siblings: /light/Light/turn_off, /light/Light/toggle. Legacy path /light/light/turn_on."
    status: "unverified"
  - method: "POST"
    path: "/lock/Lock%20remotes/lock"
    name: "Lock Remotes"
    description: "Engage the opener's remote lock-out. Sibling: /lock/Lock%20remotes/unlock. The entity is named 'Lock remotes', so the space is percent-encoded; legacy path /lock/lock_remotes/lock."
    status: "unverified"
  - method: "GET"
    path: "/binary_sensor/Obstruction"
    name: "Obstruction Sensor"
    description: "Obstruction beam state (JSON {value,state}). Read-only. Siblings: /binary_sensor/Motion, /binary_sensor/Motor, /binary_sensor/Button."
  - method: "POST"
    path: "/button/Restart/press"
    name: "Restart Board"
    description: "Reboot the ratgdo board. Does not affect the door. Legacy path /button/restart/press."
    status: "unverified"
  - method: "GET"
    path: "/events"
    name: "State Event Stream (SSE)"
    description: "text/event-stream; emits 'state' events carrying the same per-entity JSON as the REST GETs — the push channel for door/obstruction/motion changes without polling. Also 'ping' and 'log' events. Every entity's current state is sent on connect, which is also how a client learns which addressing form this firmware uses (an `id` containing '/' is the name form; 2026.1.3-2026.7 firmware carries the new form in `name_id` beside a legacy `id`, and on 2026.7 the URL is name-only while `id` is still legacy — read `name_id` first)."

commands:
  # One invocation each, so an entity's role map can name one. `http_endpoints`
  # above catalogues what the board offers; these are the sends. Paths are the
  # ESPHome web_server entity-NAME form (/<domain>/<name>/<action>,
  # percent-encoded) and are fixed for a ratgdo build, so they are stated
  # rather than resolved. On ESPHome <= 2025.12 the segment is the slugified
  # object_id instead, and every command below carries that form as its
  # `path_fallback`: send `path`, and on a 404 — the unambiguous "no such
  # entity" answer, never a timeout — send the fallback. See ADDRESSING in
  # device.notes for which firmware accepts which.
  door_open:
    description: "Open the garage door. Moves a heavy motorised door — gate this behind a deliberate action and check the reported state and obstruction sensor first."
    transport: "http"
    method: "POST"
    path: "/cover/Door/open"
    path_fallback: "/cover/door/open"
    verification: "reported"
  door_close:
    description: "Close the garage door. Same caution as door_open: a closing door is the one that can trap something."
    transport: "http"
    method: "POST"
    path: "/cover/Door/close"
    path_fallback: "/cover/door/close"
    verification: "reported"
  door_stop:
    description: "Halt a door mid-travel. Security+ 2.0 only — Sec+ 1.0 openers have no stop."
    transport: "http"
    method: "POST"
    path: "/cover/Door/stop"
    path_fallback: "/cover/door/stop"
    verification: "reported"
  door_set_position:
    description: "Drive the door to a position, 0.0 closed to 1.0 open. Security+ 2.0 only."
    transport: "http"
    method: "POST"
    path: "/cover/Door/set"
    path_fallback: "/cover/door/set"
    arguments:
      position: "{position}"
    parameters:
      position:
        type: "float"
        min: 0
        max: 1
        scale: 100
        unit: "%"
        description: >
          Target position on ESPHome's cover scale: 0.0 fully closed, 1.0 fully
          open — `min`/`max` bound the RAW wire value. NOT a percentage on the
          wire, so `scale: 100` states the decoded terms: a UI's 0-100% slider
          value divides by 100 to encode (raw = value / scale). The device
          clamps out-of-range values, so sending a raw 50 for "half open"
          drives the door fully open instead.
    notes: >
      The position argument rides the query string
      (`/cover/Door/set?position=0.5`), which is how ESPHome's web_server takes
      it. The board answers 409 if the cover does not support position at all,
      which is the Security+ 1.0 case.
    verification: "reported"
  light_turn_on:
    description: "Turn the opener's light on."
    transport: "http"
    method: "POST"
    path: "/light/Light/turn_on"
    path_fallback: "/light/light/turn_on"
    verification: "reported"
  light_turn_off:
    description: "Turn the opener's light off."
    transport: "http"
    method: "POST"
    path: "/light/Light/turn_off"
    path_fallback: "/light/light/turn_off"
    verification: "reported"
  lock_remotes:
    description: "Engage the opener's remote lock-out, so paired remotes stop working."
    transport: "http"
    method: "POST"
    path: "/lock/Lock%20remotes/lock"
    path_fallback: "/lock/lock_remotes/lock"
    verification: "reported"
  unlock_remotes:
    description: "Release the remote lock-out."
    transport: "http"
    method: "POST"
    path: "/lock/Lock%20remotes/unlock"
    path_fallback: "/lock/lock_remotes/unlock"
    verification: "reported"
  restart_board:
    description: "Reboot the ratgdo board. Does not move the door."
    transport: "http"
    method: "POST"
    path: "/button/Restart/press"
    path_fallback: "/button/restart/press"
    verification: "reported"

entities:
  - platform: "cover"
    name: "Garage Door"
    device_class: "garage"
    commands:
      open_cover: "door_open"
      close_cover: "door_close"
      stop_cover: "door_stop"
      set_cover_position: "door_set_position"
    state_topic: "/cover/Door"
    state_topic_fallback: "/cover/door"
    state_mapping:
      state: "state"
      position: "position"
      current_operation: "current_operation"
    notes: >
      Entity name 'Door' (object_id 'door' on ESPHome <= 2025.12). JSON
      `state` is OPEN or CLOSED; travel is reported separately in
      `current_operation` (OPENING/CLOSING/IDLE). The state_mapping paths
      are the reply fields the JSON-shape example in device.notes shows;
      `position` (0.0..1.0) is absent on Security+ 1.0 covers, which do not
      support position.
  - platform: "light"
    name: "Garage Light"
    commands:
      turn_on: "light_turn_on"
      turn_off: "light_turn_off"
    state_topic: "/light/Light"
    state_topic_fallback: "/light/light"
    state_mapping:
      is_on: "state"
      on_value: "ON"
    notes: >
      The light reply's `state` field is the string "ON" or "OFF" (the same
      state-string convention the binary_sensor example in device.notes
      shows), per the ESPHome Web Server API doc — reported, not yet read
      from hardware.
  - platform: "switch"
    name: "Lock Remotes"
    commands:
      turn_on: "lock_remotes"
      turn_off: "unlock_remotes"
    state_topic: "/lock/Lock%20remotes"
    state_topic_fallback: "/lock/lock_remotes"
    state_mapping:
      is_on: "state"
      on_value: "LOCKED"
    notes: >
      ESPHome exposes this in the `lock` domain (entity name 'Lock remotes',
      lock/unlock); modelled here as a switch (on = remotes locked out) because
      this schema's entity vocabulary has no lock platform. On = the opener
      ignores its RF remotes. The lock reply's `state` field carries the
      lock-domain state string, LOCKED or UNLOCKED, per the ESPHome Web
      Server API doc — reported, not yet read from hardware.
  - platform: "binary_sensor"
    name: "Obstruction"
    device_class: "problem"
    state_topic: "/binary_sensor/Obstruction"
    state_topic_fallback: "/binary_sensor/obstruction"
    state_mapping:
      value: "value"
    notes: >
      The reply's `value` field is JSON true/false (the shape example in
      device.notes: {"value":true,"state":"ON"}), so it needs no
      on_when/on_value — the value IS the on/off.
  - platform: "binary_sensor"
    name: "Motion"
    device_class: "motion"
    state_topic: "/binary_sensor/Motion"
    state_topic_fallback: "/binary_sensor/motion"
    state_mapping:
      value: "value"
  - platform: "sensor"
    name: "Openings"
    state_topic: "/sensor/Openings"
    state_topic_fallback: "/sensor/openings"
    state_mapping:
      value: "value"
    notes: "Cumulative door-open counter (entity name 'Openings'); the reply's numeric `value` field carries the count."

