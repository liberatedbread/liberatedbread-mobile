# XKGlow XKChrome Motorcycle LED Controller device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# UUIDs and GATT profile extracted from decompiled com.xkglow.xkchrome APK
# via smali static analysis. All UUIDs use vendor base 458A7133-xxxx-4E37-A4A4-5D8492586977.
# Command encoding decoded from ColorPayloadManager, MonoColorPayloadManager,
# AnimationPayloadManager, and BluetoothLeService smali.
#
# Source: com.xkglow.xkchrome_decompiled (APK smali disassembly)
# Report: ~/research/motorcycle-ground-effect-lighting/RESEARCH_NOTE_XKGLOW.md

device:
  name: "XKGlow XKChrome Motorcycle LED Controller"
  manufacturer: "XKGlow"
  manufacturer_status: "active"
  protocol: "ble"
  category: "light"
  notes: >
    BLE motorcycle LED controller from XKGlow. Single custom GATT service
    with 7 characteristics (the 8th UUID in the app's attribute table is
    the service itself). Supports RGB color control, mono brightness,
    LED animation sequences, and multi-zone configuration. The controller
    auto-discovers zone count and type (color vs mono) from device config
    on connect.

    FCC ID 2AIKCXK-CHROME (grantee XKGLOW INC, 2016); internal photos show
    a potted PCB silkscreened "RGB Controller V1.0 XKGlow".

    NO FIRMWARE UPDATES: the XKchrome (3rd gen) hardware has no
    firmware-update capability at all — the vendor's own XKchrome-vs-XKmax
    comparison attributes firmware updates only to the 5th-gen XKmax line,
    and the APK contains no OTA code or firmware URLs. Firmware revision is
    only exposed read-only via CONTROLLER_CONFIG byte 2.

    All UUIDs are in the vendor base 458A7133-xxxx-4E37-A4A4-5D8492586977
    with the xxxx suffix encoding the characteristic function.

    WRITE TYPE: All writes to ZONE_COMMAND use WRITE_TYPE_NO_RESPONSE (1).

    ZONE INDEX: 0-based. Zone 1 = byte 0x00, Zone 2 = byte 0x01, etc.
    Zone count is discovered from CONTROLLER_CONFIG byte 1 on connect.

    COLOR WRITE FORMAT: 6-byte payload: [0x00, zone, 0x04, R, G, B].
    Each channel 0-255.

    MONO WRITE FORMAT: 6-byte payload: [0x00, zone, 0x04, B, B, B]
    where all three B bytes are the same brightness value 0-255.

    STOP ANIMATION: 4-byte payload: [0x00, zone, 0x05, 0x00].

    ANIMATION: Payload partitioned into 19-byte chunks sent at 20ms
    intervals. Each chunk prefixed with header byte:
    (total_chunks - 1) << 4 | chunk_index.

    INITIALIZATION SEQUENCE (chained reads):
      1. Read CONTROLLER_NAME → triggers read of ZONE_1_NAME
      2. Read ZONE_1_NAME → triggers read of ZONE_2_NAME
      3. Read ZONE_2_NAME → triggers read of SETTING
      4. Read SETTING → triggers read of CONTROLLER_CONFIG
      5. Read CONTROLLER_CONFIG → device ready

    SCAN FILTER: Advertised service UUID 458A7133-0000-4E37-A4A4-5D8492586977.
    Device name from BLE advertisement.

    CONFIDENCE: HIGH for all UUIDs and primary command formats. Animation
    protocol header byte confirmed; per-LED animation data format is not
    fully decoded (app creates proprietary byte sequences for effects).

  identification:
    service_uuids:
      - "458A7133-0000-4E37-A4A4-5D8492586977"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "458A7133-0000-4E37-A4A4-5D8492586977"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning. Scan for the controller service UUID. Connect,
      discover services, then run the chained initialization read sequence
      (CONTROLLER_NAME → ZONE_1_NAME → ZONE_2_NAME → SETTING →
      CONTROLLER_CONFIG) to enumerate zones and controller type.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Scan for BLE advertisement with service UUID
          458A7133-0000-4E37-A4A4-5D8492586977. Connect, discover services,
          run chained initialization reads to detect zone count and type.
          Write 6-byte color/mono commands to ZONE_COMMAND for lighting
          control. Write animation sequences for effects.
        ble:
          pairing_required: false
        steps:
          - action: "Scan for BLE advertisements with service UUID 458A7133-0000-4E37-A4A4-5D8492586977."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect and discover services."
            actor: "client"
          - action: "Read CONTROLLER_NAME, then chain through ZONE_1_NAME, ZONE_2_NAME, SETTING, CONTROLLER_CONFIG."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: "No credential state. Power-cycle drops the current connection."
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Disconnect power for a few seconds and reconnect."
              actor: "user"
              expect: "Device advertises again and accepts new connections."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: "BLE GATT. No auth or pairing. Anything in radio range can connect and command."

services:
  - uuid: "458a7133-0000-4e37-a4a4-5d8492586977"
    name: "Controller Service"
    notes: >
      Single custom GATT service containing all controller functionality.
      UUID family uses vendor base 458A7133-xxxx-4E37-A4A4-5D8492586977.
    initialization:
      - characteristic: "458a7133-0002-4e37-a4a4-5d8492586977"
        read: true
        notes: "Read controller name; response triggers chain to ZONE_1_NAME."
    characteristics:
      - uuid: "458a7133-0002-4e37-a4a4-5d8492586977"
        name: "Controller Name"
        properties: ["read", "notify", "write"]
        notes: >
          Human-readable controller name. UTF-8 string. Read triggers the
          initialization chain: on receive, app reads ZONE_1_NAME. Also
          writable — EditDeviceInfo renames the controller through the
          app's write chain.

      - uuid: "458a7133-0006-4e37-a4a4-5d8492586977"
        name: "Zone 1 Name"
        properties: ["read", "notify", "write"]
        notes: >
          Human-readable name for zone 1. UTF-8 string. On receive, app
          reads ZONE_2_NAME (if multi-zone) or SETTING. Also writable —
          EditDeviceInfo renames zones (after a zone-1 rename, firmware
          revisions with (fwRev & 0x0F) == 8 trigger a chained settings
          write).

      - uuid: "458a7133-0007-4e37-a4a4-5d8492586977"
        name: "Zone 2 Name"
        properties: ["read", "notify", "write"]
        notes: >
          Human-readable name for zone 2. UTF-8 string. On receive, app
          reads SETTING. Also writable — EditDeviceInfo renames zones.

      - uuid: "458a7133-0003-4e37-a4a4-5d8492586977"
        name: "Settings"
        properties: ["read", "notify", "write"]
        notes: >
          Controller settings. 2+ bytes.
          Byte 0: brake enabled (0=disabled, non-zero=enabled).
          Byte 1: auto-off enabled (0=disabled, non-zero=enabled).
          On receive, app reads CONTROLLER_CONFIG. Also writable —
          EditDeviceInfo writes settings as 7-byte frames containing a
          0x2C byte.
        format:
          - offset: 0
            length: 1
            name: "brake_enabled"
            type: "bool"
          - offset: 1
            length: 1
            name: "auto_off"
            type: "bool"

      - uuid: "458a7133-0001-4e37-a4a4-5d8492586977"
        name: "Controller Config"
        properties: ["read", "notify"]
        notes: >
          Controller configuration. 3+ bytes.
          Byte 0: controller type code (1=color/RGB, other=mono).
          Byte 1: total number of zones.
          Byte 2: firmware revision.
          On receive, app finalizes device setup and marks it ready.
          Byte 2 gates app behavior: (fwRev & 0x0F) == 8 → chained settings
          write after a zone-1 rename; (fwRev & 0x0F) == 9 → ramp-mode
          writes to the Time characteristic (0005); fwRev ∈ {0x10, 0x11,
          0x18} → smart-sensor pattern support.
        format:
          - offset: 0
            length: 1
            name: "controller_type"
            type: "uint8"
          - offset: 1
            length: 1
            name: "total_zones"
            type: "uint8"
          - offset: 2
            length: 1
            name: "firmware_revision"
            type: "uint8"

      - uuid: "458a7133-0009-4e37-a4a4-5d8492586977"
        name: "Zone Command"
        properties: ["write", "write_without_response"]
        notes: >
          Command write characteristic. All writes use WRITE_TYPE_NO_RESPONSE
          (setWriteType(1)). Receives color, mono, animation, and stop commands.
        commands:
          set_rgb_color:
            description: "Set solid RGB color for a zone."
            verification: "reported"
            value: [0x00, 0x00, 0x04, 0xFF, 0x00, 0x00]
            template: [0x00, "{zone}", 0x04, "{red}", "{green}", "{blue}"]
            parameters:
              zone:
                type: "uint8"
                min: 0
                max: 255
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255

          set_mono_brightness:
            description: "Set mono (single-channel) brightness for a zone. Writes the same value to all three color positions."
            verification: "reported"
            template: [0x00, "{zone}", 0x04, "{brightness}", "{brightness}", "{brightness}"]
            parameters:
              zone:
                type: "uint8"
                min: 0
                max: 255
              brightness:
                type: "uint8"
                min: 0
                max: 255

          stop_animation:
            description: "Stop animation on a zone."
            verification: "reported"
            template: [0x00, "{zone}", 0x05, 0x00]
            parameters:
              zone:
                type: "uint8"
                min: 0
                max: 255

          set_default_brightness:
            description: "Set default brightness configuration (10-byte system command). Observed in setBrightnessDefault: writes [0x00, 0x03, 0x06, 0x06, 0x81, 0x9E, 0x06, 0x00, 0xFF, 0x00]."
            verification: "reported"
            value: [0x00, 0x03, 0x06, 0x06, 0x81, 0x9E, 0x06, 0x00, 0xFF, 0x00]

          write_animation:
            description: >
              Write an animation sequence to a zone. Animation payload is
              partitioned into 19-byte chunks. Each chunk is prefixed with
              a header byte encoding (total_chunks - 1) << 4 | chunk_index.
              Chunks are transmitted at 20ms intervals via a timer.
              
              The data stream begins with a 3-byte prefix: [zone, 0x05, 0xFF].
              The remaining bytes are the animation LED data.
            verification: "reported"
            template: ["{header}", "{chunk_data}"]
            parameters:
              header:
                type: "uint8"
                min: 0
                max: 255
              chunk_data:
                type: "bytes"

      - uuid: "458a7133-0005-4e37-a4a4-5d8492586977"
        name: "Time Characteristic"
        properties: ["write"]
        notes: >
          TIME_CHARACTERISTIC in the app. Its only observed use is 4-byte
          ramp-mode control: after a settings write, when
          (firmware_revision & 0x0F) == 9 the app writes
          [0x54, 0x03, 0x00, 0x00] (ramp on) or [0x00, 0x00, 0x00, 0x00]
          (ramp off). A clock-sync use may exist elsewhere but nothing in
          the smali supports the earlier "internal clock" guess, and a read
          property is unverifiable from app code (0005 is not in the
          chained read sequence).

entities:
  - platform: "light"
    name: "XKChrome Motorcycle LEDs"
    features: ["brightness", "color", "effect"]
    state_characteristic: "458a7133-0001-4e37-a4a4-5d8492586977"
    commands:
      turn_on: "set_rgb_color"
      set_color: "set_rgb_color"
      set_brightness: "set_mono_brightness"
      set_effect: "write_animation"
