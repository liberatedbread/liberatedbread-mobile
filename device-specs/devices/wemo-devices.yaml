    - model: "SCCPWM600-V1"
      name: "Crock-Pot Smart Slow Cooker"
      alternate_models: ["SCCPWM600-V2", "F7C045"]
      alternate_models_notes: >
        F7C045 is Belkin's part number for the same appliance ("Crock-Pot
        Smart Slow Cooker with Wemo"); SCCPWM600 is Jarden's. A user reading a
        support article and a user reading the base of their cooker are
        holding the same device.
      identification:
        device_type: "urn:Belkin:device:crockpot:1"
        udn_prefixes: ["uuid:Crockpot"]
        udn_prefix_notes: >
          Spelled exactly as the device sends it: capital C, lowercase p.
          pywemo dispatches on `udn.startswith("uuid:Crockpot")`, which is
          case-SENSITIVE, and our own notes have carried a lowercase
          "uuid:crockpot-1_0-..." guess elsewhere. Match case-insensitively
          and you cannot be wrong either way.
        friendly_name_pattern: "Crock"
        apk_widgets: ["wemo_crockpot"]
      characteristics:
        - "Cooking modes are off=0, warm=50, low=51, high=52 (payload_formats.CrockpotMode)."
        - >
          BinaryState IS NOT THIS DEVICE'S STATE. basicevent#GetBinaryState
          answers 0 whatever the cooker is doing, so on/off comes from
          `mode != 0` in GetCrockpotState. This is the one Wemo where the
          universal switch surface is present and lies.
        - >
          Mode and cook time are set together by one action; there is no
          set-the-mode-alone call. See commands.set_cook_mode.
        - >
          SetCrockpotState is acknowledged, not confirmed. pywemo re-reads
          the state after every write because the cooker does not always take
          the setting.
        - "Control surface is declared in the top-level `commands` and `entities` blocks."
      services:
        basicevent:
          control_url: "/upnp/control/basicevent1"
          event_sub_url: "/upnp/event/basicevent1"
          actions: ["GetCrockpotState", "SetCrockpotState", "GetBinaryState"]
          notes: >
            The appliance actions live HERE, on basicevent — that is where
            pywemo calls them and the only placement with a working
            implementation behind it. The SOAPACTION header is therefore
            "urn:Belkin:service:basicevent:1#SetCrockpotState", not a
            crockpotevent one.
          event_properties: ["BinaryState", "mode", "time", "cookedTime"]
        crockpotevent:
          control_url: "/upnp/control/crockpotevent1"
          event_sub_url: "/upnp/event/crockpotevent1"
          actions: ["GetCrockpotState", "SetCrockpotState", "GetJardenStatus", "SetJardenStatus"]
          verification: "hypothesis"
          notes: >
            Catalogued from the Jarden appliance family's shape, not from a
            Crock-Pot's own setup.xml, and no implementation drives it. Take
            the service list from the device rather than from this entry, and
            send the two state actions to basicevent above.

