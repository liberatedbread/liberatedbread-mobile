evidence:
  artifacts:
    - type: "static_analysis"
      artifact: "com.champion.lock v2.2.1 (versionCode 114), updated 2023-11-09, developer Keyssmart"
      sha256: "ab6084e6b5c66c7d39ca670837427e8833c16e4cc01dfdba11737f2016990a77"
      obtained_via: "third-party APK mirror, 2026-08 (the Play listing was gone; no official download)"
      description: >
        Static analysis of the OEM Android app for this lock family (2026-08).
        Source of every byte-level fact in this spec: the GATT UUIDs and write
        type from its scan/connect layer, the 20-byte frame layout, opcodes and
        checksum from its command builder, the advertised-name patterns from
        its name matcher, the time-derived password and status-byte layout from
        its crypto helper, and the response codes from its error enum. Its
        settings screen is also where the absence of any upgrade/OTA path was
        confirmed.
    - type: "live_capture"
      artifact: "Android HCI snoop (bugreport btsnoop_hci.log) of the vendor app driving one padlock unit, 2026-08-30, ~15 minute session"
      sha256: "e9d63c6dd33fb817bd22011ce44a11b0e3cf98d5763e9379942d0f65fdadef3b"
      obtained_via: "owner's phone, 2026-08; the log stays uncommitted — it contains the owner's identifiers and credentials, only derived facts appear here"
      description: >
        First over-the-air capture for this family. Confirms: bonding is
        enforced (an SMP security request precedes all GATT traffic;
        legacy Just Works, lock IO NoInputNoOutput, full LTK/IRK/CSRK
        distribution); the 20-byte command frame and 0x5A-seed checksum
        (the RegisterAdmin frame verifies, and its time-derived password
        bytes equal the session's wall-clock time); RegisterAdmin (0x80),
        ChangeFactoryPassword (0x8c/0x8d) and GetMac (0xad) dispatched with
        success responses; an unsolicited UpdateStatus (0xff) notification
        at ~1 Hz for the whole connection; the GATT handle map (notify
        0x000e, CCCD 0x000f, write 0x0011). Also shows the vendor app
        crashing before ever sending TimeStamp/OpenLock — unlock remains
        unverified on hardware — and a status-byte sequence (0x13 -> 0x03
        -> 0x01) that contradicts the decompile-derived 'bit 4 =
        registered' reading.
    - type: "fcc_filing"
      url: "https://fcc.report/FCC-ID/2AIKJBL"
      description: "FCC ID 2AIKJ-BL, grantee BIO-KEY: TouchLock BT padlocks BL0509 (XS), BL1209 (XL), BS1609 (TSA)"
    - type: "vendor_store_listing"
      url: "https://play.google.com/store/apps/details?id=com.champion.lock"
      description: "Play Store listing (1,000+ installs as of 2026-08) — app identity, version 2.2.1, developer Keyssmart; no sibling apps found"
