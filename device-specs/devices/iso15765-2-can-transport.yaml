device:
  name: ISO 15765-2 CAN Transport Layer (ISO-TP) Reference
  manufacturer: ISO
  model: ISO 15765-2:2016 (all addressing modes, all frame types)
  category: automotive
  type: reference-transport-protocol
  transport: can
  # Schema `protocol` has no member for a standards document. ISO-TP is a CAN
  # segmentation layer, so 'can' is the accurate bearer; the exact standard is
  # preserved in `model` above and `transport: can` below/above.
  protocol: can
  # Schema `manufacturer_status` has no member for a standards body. 'active'
  # is the schema's own label for "still in business, protocol closed/paywalled",
  # which is exactly ISO's situation. Was: standard.
  manufacturer_status: active
  notes: |
    ISO 15765-2 (ISO-TP) is the segmentation layer between raw CAN frames and
    UDS/KWP2000 application data. Any diagnostic message longer than 7 bytes
    must be segmented by ISO-TP; any message 7 bytes or shorter can be sent as
    a single frame. This is the most common failure point for clone adapters:
    they cannot reassemble multi-frame responses, or they ignore the ECU's
    requested separation time, or they cannot SEND segmented requests at all.

    This is a REFERENCE spec. Vehicle specs reference this instead of
    re-inventing the frame format. Every OBD device in this repo uses ISO-TP
    unless it explicitly says `raw_frames` or `ATCAF0`.

    The frame types below use CAN FD-aware notation where the Data Length Code
    field is the actual data length, not the classic CAN encoding; on classic
    CAN, DLC=8 means "up to 8 bytes" and a single frame can be shorter.

iso_tp:
  frame_types:
    - type: SingleFrame
      nibble: "0"
      description: One frame carries the entire message (7 bytes or fewer)
      format:
        - byte: 0
          bits: [7, 4]
          name: frame_type
          value: "0x0"
        - byte: 0
          bits: [3, 0]
          name: data_length
          description: Payload length (1-7). On classic CAN, DLC=8 means the frame is 8 bytes but data_length may be less; the actual payload ends at data_length.
        - byte_offset: 1
          name: payload
          size: variable
          max: 7
          description: Application-layer data (UDS/KWP2000 service + parameters)
      example:
        raw: "03 22 F1 90 00 00 00 00"
        description: "Single frame, 3 payload bytes: UDS ReadDataByIdentifier(0xF190) = VIN"
      padding: "0xAA, 0x00, or 0x55 depending on ECU"

    - type: FirstFrame
      nibble: "1"
      description: First of a multi-frame message. Carries the total length and first 6 payload bytes.
      format:
        - byte: 0
          bits: [7, 4]
          name: frame_type
          value: "0x1"
        - byte: 0
          bits: [3, 0]
          name: length_hi_nibble
          description: Upper nibble of a 12-bit total message length
        - byte: 1
          bits: [7, 0]
          name: length_lo_byte
          description: Lower byte of the 12-bit total message length
        - byte_offset: 2
          name: payload
          size: 6
          description: First 6 bytes of the application message
      total_length: "(length_hi_nibble << 8) | length_lo_byte"
      max_total_length: 4095
      flow_control_required: true
      example:
        raw: "10 14 62 F1 90 57 42 53"
        description: "First frame, total 20 (0x14) bytes: response 62 F1 90 <VIN...>"
      note: "The first payload byte is the UDS response SID. A consumer can classify the message before the rest arrives."

    - type: FlowControl
      nibble: "3"
      description: Receiver-to-sender flow control. Sent by the ECU after receiving a FirstFrame, or by the tester when an ECU sends a FirstFrame.
      direction: receiver_to_sender
      format:
        - byte: 0
          bits: [7, 4]
          name: frame_type
          value: "0x3"
        - byte: 0
          bits: [3, 0]
          name: flow_status
          description: |
            Flow status: 0 = ClearToSend (continue), 1 = Wait (temporary pause),
            2 = Overflow (abort — receiver cannot handle this message).
            A consumer should abort and retry on Overflow, but the adapters
            people actually own often never send it.
          values:
            "0": CTS (Clear To Send)
            "1": WAIT
            "2": OVFLW (Overflow — abort)
        - byte: 1
          name: block_size
          description: "Number of consecutive frames before the next flow control. 0 = send all remaining without further FC frames."
        - byte: 2
          name: separation_time_min
          description: "Minimum time between consecutive frames. Unit depends on value: 0-127 = ms (STmin in ms), 0xF1-0xF9 = 100-900 µs. Clone adapters frequently ignore STmin below 5ms."
      example:
        raw: "30 00 00 00 00 00 00 00"
        description: "CTS, block size unlimited (send all), STmin=0 (as fast as possible)"
      sticky:
        adapter: "Clone ELM327 adapters frequently ignore STmin values. An advanced-stn adapter (OBDLink, UniCarScan) respects them. If a function works with one adapter and not another at the same STmin, the adapter's flow-control implementation is the variable."

    - type: ConsecutiveFrame
      nibble: "2"
      description: "Payload continuation. After the FirstFrame and a CTS FlowControl, consecutive frames carry the remaining bytes."
      format:
        - byte: 0
          bits: [7, 4]
          name: frame_type
          value: "0x2"
        - byte: 0
          bits: [3, 0]
          name: sequence_number
          description: "Rolling index, 1-15, wrapping to 0 after 15. Each CF increments the SN; a gap means a dropped frame."
        - byte_offset: 1
          name: payload
          size: 7
          description: Next 7 bytes of the application message
      reassembly: "A consumer concatenates the 6 bytes from the FirstFrame with the 7 bytes from each ConsecutiveFrame, truncating to the total_length declared in the FF."
      padding: "Last CF is padded only to the CAN DLC; the actual payload ends at the remaining byte count. Do not hand padding bytes to the UDS parser."

  addressing:
    standard:
      name: Normal (11-bit)
      description: Standard CAN 11-bit identifiers. Used by most OBD-II vehicles and by the Triumph Tiger 900 cluster stack.
      can_id_width: 11
      request_id_example: "0x7E0"
      response_id_example: "0x7E8"
    normal_fixed:
      name: Normal fixed (29-bit)
      description: Extended CAN 29-bit identifiers. Used by the Triumph Tiger 900 engine ECU and BMW D-CAN.
      can_id_width: 29
      request_id_example: "0x18DAD5F1"
      response_id_example: "0x18DAF1D5"
      note: "29-bit CAN IDs encode priority, source, target, and type in the bit layout. 0x18DAxxyy = physical addressing, target xx, source yy."
    extended:
      name: Normal with CAN Extended Addressing
      description: "First payload byte is the target ECU address. Used by BMW D-CAN (ATCEA). All ECUs share the same request ID 0x6F1; the address byte routes the message."
      request_id: "0x6F1"
      response_id: "0x600 + address"
      elm327_command: ATCEA
    mixed:
      name: Mixed addressing
      description: "Some frames on one ID with raw bytes (no ISO-TP), others with ISO-TP on a different ID. Used by the Triumph Tiger 900 immo/ABS stacks."
      note: "ATCAF0 on one stack, ISO-TP formatting on the other. The adapter must be reconfigured between them."

  flow_control_overrides:
    description: |
      ISO-TP receivers normally send FlowControl frames automatically.
      Some functions need the tester to supply its own flow-control
      parameters — e.g., BMW D-CAN where the tester must set the FC
      destination and data to match the target ECU.
    elm327_commands:
      - command: ATFCSH
        description: Set flow-control header (the CAN ID FC frames are sent to)
      - command: ATFCSD
        description: Set flow-control data (block size, STmin)
      - command: ATFCSM
        description: Use our flow-control settings (rather than default)
    bmw_example:
      init: "ATFCSH 6F1, ATFCSD <target> 30 00 08, ATFCSM 1"
      description: Target is the ECU address byte; BS=0 means unlimited consecutive frames.

  practical_notes:
    - item: "Always send ATCAF0 (or equivalent) when researching — raw frames eliminate adapter behavior as a variable."
    - item: "A 7-byte payload is the ISO-TP boundary. 7 or fewer = single frame. 8 or more = FirstFrame + CFs."
    - item: "When an adapter produces 7F 78 (RequestCorrectlyReceived-ResponsePending), the ECU needs more time. Poll 3E 00 every second until the final response arrives."
    - item: "The 12-bit total length in a FirstFrame limits ISO-TP messages to 4095 bytes. In practice, most ECUs cap much lower (255 bytes is common)."
    - item: "On classic CAN with DLC=8, a single frame always occupies 8 bytes on the wire. The data_length field tells you how many are real."

source:
  standard: ISO 15765-2:2016
  date_spec: "2026-07-28"
