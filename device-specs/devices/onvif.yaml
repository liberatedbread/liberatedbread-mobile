# ONVIF (IP camera standard) — Reference Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - onvif-python (PyPI), valkka-examples ONVIF docs, smartrtsp ONVIF guide.
#
# This is a REFERENCE spec: it documents the open ONVIF standard that IP-camera
# device specs (Reolink, Amcrest/Dahua, Hikvision, generic cameras) cite for
# discovery and stream access. It is not a device.

device:
  name: "ONVIF (Open Network Video Interface Forum)"
  manufacturer: "ONVIF (industry consortium)"
  manufacturer_status: "active"
  coverage: "Profiles S / T (streaming), G (recording), A / C (access control)"
  protocol: "wifi"
  category: "reference"
  type: "reference-camera-protocol"
  pictogram: "ip-camera"
  notes: >
    ONVIF is the open standard most IP cameras, doorbells and NVRs implement for
    discovery, device management and video streaming. A concrete camera spec
    should cite this file for the discovery + stream-URI mechanism rather than
    restating it; the device itself carries only its vendor-specific quirks.

    DISCOVERY (WS-Discovery): a Probe is multicast over UDP to the reserved
    address 239.255.255.250:3702; ONVIF devices reply (unicast ProbeMatch) with
    their service endpoint URL, device type and a device UUID.

    DEVICE SERVICE: the Device Management service is at the HTTP subaddress
    /onvif/device_service. SOAP over HTTP; ports are typically 80 (management)
    and 554 (RTSP media).

    WSDL SERVICE NAMESPACES:
      Device Management  http://www.onvif.org/ver10/device/wsdl
      Media              http://www.onvif.org/ver10/media/wsdl
      PTZ                http://www.onvif.org/ver20/ptz/wsdl
      Imaging            http://www.onvif.org/ver20/imaging/wsdl
      Events             http://www.onvif.org/ver10/events/wsdl

    KEY SOAP OPERATIONS: GetDeviceInformation, GetServices / GetCapabilities,
    GetProfiles, GetStreamUri, GetSnapshotUri.

    GETTING A STREAM: call the media service GetStreamUri(ProfileToken=<token>,
    StreamSetup={Stream: RTP-Unicast, Transport: {Protocol: RTSP}}) where the
    profile token comes from GetProfiles. The device returns a device-specific
    RTSP URL (e.g. rtsp://<ip>:554/Streaming/Channels/101). ONVIF defines the
    MECHANISM (GetStreamUri), not a fixed URI — read the URI the device reports.

    AUTH: WS-UsernameToken with Digest is the standard for ONVIF devices.

    PROFILES: S (basic live streaming/PTZ), T (advanced video, H.265, HTTPS,
    metadata), G (edge storage/recording/playback), A (access-control config),
    C (door control). S and T are the camera-streaming ones this registry uses.

  openness:
    status: "open_by_design"
    reverse_engineered: false
    upstream_docs:
      - url: "https://www.onvif.org/specs/srv/media/ONVIF-Media-Service-Spec.pdf"
        title: "ONVIF — Media Service Specification"
        covers: "GetProfiles / GetStreamUri and the media-service operations."
      - url: "https://pypi.org/project/onvif-python/"
        title: "onvif-python (client)"
        covers: "WS-Discovery address/port, the WSDL namespaces, the key operation names and the digest auth."
    notes: >
      Published open standard maintained by the ONVIF forum. The facts here are
      from the onvif-python client documentation and the ONVIF media-service
      spec; nothing was reverse-engineered.

  identification:
    default_port: 80
    # No SSDP target: ONVIF devices do not announce over SSDP at all. The
    # `urn:schemas-onvif-org:service:Media` target four specs used to claim
    # is a WSDL namespace-shaped string that no device answers an M-SEARCH
    # for, so it found nothing and, had anything answered, would have tied
    # every camera spec at once. WS-Discovery below is the real mechanism.

  discovery:
    methods:
      # WS-Discovery, declared as the platform catch-all: every ONVIF Profile
      # S/T device answers this Probe, so a ProbeMatch alone proves "an ONVIF
      # camera", not which one. A vendor spec that can narrow the Scopes
      # declares its own ws_discovery method with `scope_match`; one that
      # cannot (the three in this catalogue today) leaves discovery to this
      # spec and identifies itself by what it volunteers on its own.
      - type: "ws_discovery"
        ws_discovery:
          port: 3702
          multicast_group: "239.255.255.250"
          probe_types:
            - "dn:NetworkVideoTransmitter"
          platform_fallback: true
          identity_mapping:
            stable_keys:
              - source: "probematch:endpoint"
                key: "uuid"
            display:
              source: "probematch:scope:onvif://www.onvif.org/name/"
        notes: >
          A SOAP-over-UDP Probe (WS-Discovery 1.1 envelope, d:Types
          dn:NetworkVideoTransmitter with xmlns:dn=
          "http://www.onvif.org/ver10/network/wsdl") multicast to
          239.255.255.250:3702; each device unicasts a ProbeMatch carrying
          wsa:EndpointReference/wsa:Address (urn:uuid:..., the stable
          identity), d:Types, d:Scopes (onvif://www.onvif.org/name/<model>,
          .../hardware/<model>, .../location/..., .../Profile/Streaming) and
          d:XAddrs (the device-service URL, usually
          http://<ip>/onvif/device_service). Then GetProfiles + GetStreamUri
          on the media service yield the RTSP URL (device.notes). Facts from
          the onvif-python client and the ONVIF Core Specification; not
          replayed by this project.
    identity:
      stable_keys: ["uuid"]
      display: "model"
    static_ip_required: false

helpful_urls:
  - title: "onvif-python (client)"
    url: "https://pypi.org/project/onvif-python/"
    description: "WS-Discovery, the WSDL namespaces, GetProfiles/GetStreamUri, and digest auth."
  - title: "ONVIF — Media Service Specification (PDF)"
    url: "https://www.onvif.org/specs/srv/media/ONVIF-Media-Service-Spec.pdf"
    description: "First-party spec for GetProfiles / GetStreamUri."
  - title: "valkka-examples — ONVIF"
    url: "https://elsampsa.github.io/valkka-examples/_build/html/onvif.html"
    description: "Practical ONVIF walkthrough (device_service path, namespaces, ports)."
