# Bluetooth serial module — possible card-skimmer check — Device Spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# WARNING spec. This does not describe a product to control. It recognises a
# bare, factory-default HC-05/HC-06 serial Bluetooth module — the cheap module
# criminals most often build into credit-card skimmers — and raises a SOFT,
# "worth a look" heads-up, never a connection.
#
# Deliberately conservative (dialled back on purpose). The module NAME alone is
# a weak signal: the same HC-05/HC-06 modules fill innocent hobby electronics.
# The signal that actually separates a skimmer from a hobby module is the skimmer
# FIRMWARE's behaviour — the SparkFun "Skimmer Scanner" connects to a device
# named exactly "HC-05" with the default PIN 1234, sends the byte 'P', and a
# skimmer replies 'M'. That is a Bluetooth CLASSIC (SPP) connect-and-probe; this
# app scans BLE passively and never connects, so it CANNOT perform that check.
# So we no longer flag the whole HC-0x / FREE2MOVE family: we keep only the
# HC-05 / HC-06 module names, drop HC-03 / HC-08 / FREE2MOVE, and down-rank the
# match from "malicious" to a "reported" heads-up that carries the verification
# method — rather than asserting "skimmer" on a name we cannot verify. We match
# the EXACT default name (identification.local_names, whole-string), so a bare
# "HC-05" is flagged but a configured "HC-05Foo" — a hobby module someone
# bothered to set up — is not: leaving the factory default is itself part of the
# skimmer signal.
#
# Sources (public): SparkFun "Skimmer Scanner" (github.com/sparkfunX) and the
# "Gas Pump Skimmers" tutorial (learn.sparkfun.com); Snopes fact check,
# "Can a Mobile Phone's Bluetooth Sensor Be Used to Detect Card Skimmers?".

device:
  name: "Bluetooth serial module (skimmer check)"
  manufacturer: "Unknown"
  manufacturer_status: "unsupported"
  protocol: "ble"
  category: "warning"
  integration: "identify_only"
  testing:
    status: untested
    notes: >
      Heuristic, not hardware-verified. Matches the HC-05 / HC-06 module name
      (we dropped HC-03 / HC-08 / FREE2MOVE). These are Bluetooth Classic
      modules, so whether one surfaces in a BLE scan is module-dependent, and the
      same modules fill innocent hobby projects — so this is a soft heads-up to
      verify, never proof.
  security_advisory:
    severity: "reported"
    summary: >
      A bare Bluetooth serial module left at its factory-default name. Harmless
      in hobby gear, but it is also what card skimmers use — worth a check if it
      is near a card reader.
    detail: >
      Credit-card skimmers hidden in gas pumps, ATMs and card readers often use
      an off-the-shelf serial Bluetooth module (commonly an HC-05 or HC-06) left
      at its factory-default name and PIN, so the criminal's phone can find and
      unlock it. This device is advertising exactly that default name. That does
      NOT make it a skimmer — the same modules fill innocent hobby electronics,
      and the name alone cannot tell them apart. What separates the two is the
      skimmer firmware: the free SparkFun "Skimmer Scanner" app connects to an
      "HC-05" with the default PIN 1234, sends the letter 'P', and a real skimmer
      replies 'M'. This app scans passively over BLE and never connects, so it
      cannot run that check for you. If you see this AT a fuel pump, ATM or
      checkout, treat it with suspicion: don't pay there, verify with the Skimmer
      Scanner, and report it to the station or store operator (in the U.S., your
      state's weights-and-measures or agriculture department).
    advisory_url: "https://learn.sparkfun.com/tutorials/gas-pump-skimmers/"
    mitigation:
      summary: >
        Confirm before you worry: the SparkFun "Skimmer Scanner" app connects to
        the module (default PIN 1234), sends 'P', and flags it only if it replies
        'M' — the skimmer firmware's tell. A bare hobby module will not answer.
      url: "https://github.com/sparkfunX/Skimmer_Scanner"
  setup:
    required: false
    confidence: low
    notes: >
      Nothing to set up: this app never connects to the device. It recognises
      the BLE advertisement and raises a soft heads-up; the match is inferred
      from the advertised name (see testing.notes), hence low confidence.
    methods:
      - type: "none"
        description: "Passive: the device advertises over BLE, we match the exact default name and note it. No connection is made."
        verified: false
    factory_reset:
      applicable: false
      confidence: low
      effect: >
        Not applicable — this app never connects to or configures the device,
        so it has nothing to reset. Any real reset is done at the device.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "Recognised on sight wherever it advertises; nothing is stored."
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: "No credential crosses to this app; it never connects."
  pairing:
    required: true
    confidence: "medium"
    security_mode: "legacy_pin"
    bonding: "required"
    pin:
      source: "fixed_default"
      value: "1234"
      length: 4
      notes: >
        The HC-05 / HC-06 factory default, and the value the SparkFun
        Skimmer Scanner pairs with. Some HC-05 batches ship with 0000
        instead. It is a product-wide constant, not a secret — and leaving
        it unchanged is part of the skimmer tell, because the criminal's
        phone needs to unlock the module without ever touching it again.
    exclusivity:
      single_connection: true
      recovery: >
        Not something this app ever needs: it never connects. For anyone
        verifying with the Skimmer Scanner, a module that is already linked
        to another phone will not answer until that link drops.
      notes: >
        A slave-mode HC-05 / HC-06 serves one SPP link at a time. Whether a
        given module keeps several remembered pairings is firmware-dependent
        and irrelevant to a passive check, so it is not stated.
    enter_pairing_mode:
      required: false
      indicator: "On most HC-05 / HC-06 boards the status LED blinks quickly while unpaired and discoverable."
      notes: >
        A slave-mode module is discoverable and pairable whenever it is
        powered and not connected. There is no button: the only way to
        change the PIN or clear its pairing list is the module's AT command
        mode, which needs a wire to the module itself.
    notes: >
      These are Bluetooth Classic serial (SPP) modules, Bluetooth 2.0-era
      parts that use legacy PIN pairing with no Secure Simple Pairing, so
      pairing happens in the host's Bluetooth settings with the PIN above
      before any serial channel opens. That is the step the SparkFun
      Skimmer Scanner automates: pair with 1234, open the serial channel,
      send 'P', and treat an 'M' reply as the skimmer firmware's tell. This
      spec deliberately does none of it — it matches the advertised name
      passively and never pairs — so this block describes the module class,
      not anything this integration does. Medium confidence rests on the
      SparkFun open-source app and the module family's published defaults;
      this project has not paired with one.
  discovery:
    # Match the HC-05 / HC-06 module name (Classic modules, so BLE visibility is
    # module-dependent). We dropped HC-03 / HC-08 / FREE2MOVE and the "malicious"
    # severity: a bare default-named module is the skimmer tell, but a passive
    # scan cannot confirm it, so this is a soft heads-up, not an alert.
    # identification.local_names carries the same names; the scan matcher keys
    # on that (whole-string, exact), so this regex is anchored at both ends —
    # only a bare "HC-05" / "HC-06", never a configured "HC-05Foo".
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "regex"
            value: "^HC-0[56]$"
    identity:
      stable_keys: ["address"]
      display: "name"
  identification:
    local_names: ["HC-05", "HC-06"]
