# Gocycle G4-family e-bike (GocycleConnect BLE) device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Recovered by static analysis of the official GocycleConnect Android app
# (v9.6.2; clean-room, no app artifacts committed). Gocycle's own product
# manuals and help-centre articles, and Silicon Labs' public BGX13 module
# documentation, fill in around it. What each source contributed:
#   the app           the frame format in both directions, the opcode
#                     numbers, every reply layout below, the riding-mode
#                     presets and how the app selects them, the lights / DRL
#                     / predictive-shifting controls, trip reset, the
#                     BLE-versus-Classic routing and the firmware-update role
#   vendor docs       what the riding modes do, Factory and Delivery State,
#                     the Bluetooth reset, the forced-update button, the
#                     region classes and the beep codes
#   Silicon Labs      what the three GATT characteristics are (the stock
#                     BGX13 Xpress Streaming Service), the Mode values, flow
#                     control and the module's pairing and bond-table defaults
# Nothing here has been run against a bike, and every byte is `reported`.
#
# SAFETY: this spec leaves out the writes for max speed, the on-demand
# (throttle) permission, the miles and time limits, the frame number, the
# factory state, the controller locks and the anti-theft flag, along with
# every firmware-flashing step. They are named by role only, in
# protocol_details.omitted_operations. Riding-mode selection is documented
# but deliberately has no sendable frame. See set_mode_definition.

device:
  name: "Gocycle G4 / G4i / G4i+ e-bike (GocycleConnect BLE)"
  manufacturer: "Karbon Kinetics Ltd (Gocycle)"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "ble"
  category: "vehicle"
  type: "folding-ebike"
  notes: >
    Folding pedelecs from Karbon Kinetics, sold as Gocycle. The G4 family
    (G4, G4i, G4i+, and the "Mk2" builds the app also names) talks to the
    GocycleConnect app over Bluetooth LE. The radio is a Silicon Labs BGX13
    "Bluetooth Xpress" module used as a transparent serial bridge. The app
    writes framed binary commands into the module's Peripheral RX
    characteristic and reads framed replies from its Peripheral TX
    notifications. Behind the module, the bike's junction box and motor
    controller speak a 16-bit opcode protocol that is older than the BLE
    link. The G2, G3, G3+, G3C, GS, GX and GXi bikes carry the same opcode
    set over Bluetooth Classic SPP. That path is summarised in
    protocol_details.classic_legacy_path and not specified in full here.


    WHICH BIKES ARE BLE. The app picks the transport from the bike's cloud
    build record, not from the radio. A model code beginning "G4" goes to
    the BLE scan, and anything else goes to the Classic serial flow. The
    vendor's own articles split the families the same way: firmware 2.x for
    G4/G4i/G4i+ against V8x for GXi/GX/G3/GS/G2, a separate diagnostics flow
    for each, and a Bluetooth-reset article that covers only G4/G4i/G4i+. So
    the GX and GXi are Classic bikes, not BLE ones. The CX/CXi cargo bikes
    appear nowhere in the app, and whether they carry G4-family electronics
    is not established.


    WHAT A CLIENT CAN DO FROM THIS SPEC. Poll the live dash block (battery,
    speed, cadence, gear, odometer, trip, energy, moving time). Read the
    firmware versions, the identity reply and the hardware-type byte. Turn
    the integrated front and rear lights on or off. Set DRL flashing, the DRL
    default mode and the "DRL switch controls lights" selector. Toggle
    predictive shifting, reset the trip, read the riding-mode definitions
    and pull the diagnostic counters. Riding-mode selection (Eco / City /
    Turbo / Demand) is fully documented in protocol_details.riding_modes but
    is not declared as a sendable frame. The record the app writes to select
    a mode also carries that mode's speed ceiling and its
    pedalling-required flag. A client has to copy both from the bike's own
    record rather than send a constant. See set_mode_definition.


    ACCESS CONTROL. There is none above the link layer. Nothing in the app
    signs, encrypts or authenticates a frame. Registration and ownership are
    enforced by the app against the vendor cloud before it lets a user
    connect, not by the bike. The link itself is the BGX module's: Silicon
    Labs documents its streaming service as requiring an encrypted, paired
    link, and the vendor's Bluetooth-reset article implies the bike stores
    bonds (see device.pairing). All of this is inferred from the decompile
    and the module documentation, and none of it has been observed.


    A NEW BIKE. A bike shipped straight from Gocycle is in Factory State,
    with the motor disabled. A dealer-prepared bike is in Delivery State,
    with 60 miles (100 km) of assist. Either stays that way until the owner
    completes Setup in the vendor app. Those state changes are cloud-gated
    writes this spec omits, so it cannot activate a bike. It reads and
    controls a bike that is already activated (see device.setup).


    EVIDENCE BASE. Static analysis of GocycleConnect 9.6.2. It is a
    Capacitor app, and its bike logic ships as plain JavaScript, so the
    frame builder, the notification parser and every screen that sends a
    command were read directly rather than inferred. There is no capture,
    no FCC grant (none found under Gocycle or Karbon Kinetics) and no
    open-source client. The vendor manuals print no FCC ID. See `evidence`.

  identification:
    local_name_prefixes: ["Gocycle", "GOCYCLE"]
    notes: >
      The advertised name is "Gocycle" followed by the bike's six-digit frame
      number. The app takes characters 7 to 12 as the frame number, and some
      units advertise the stem in upper case. When the advertisement carries
      only the seven-letter stem, the app gets the full name another way. It
      reads GAP Device Name (00002a00-0000-1000-8000-00805f9b34fb in
      00001800-0000-1000-8000-00805f9b34fb) after connecting, or reuses the
      frame number it cached for that address. The app filters its scan on
      service 331a36f5-2459-45ea-9d95-6142f0c4b307, so the bike advertises
      that service. It is, however, the stock Silicon Labs BGX13 Xpress
      Streaming Service UUID, shared by every BGX13 product (the BlueDriver
      scanner in this catalogue is another). It is therefore deliberately not
      an identification axis. The app also accepts names beginning "BGX", the
      module's factory-default name. Such a name means "an unconfigured BGX
      module", not "a Gocycle", so it is not an axis either.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            values: ["Gocycle", "GOCYCLE"]
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "low"
    notes: >
      No provisioning: there is no Wi-Fi and no network credential. Talking to
      an activated bike needs only a BLE bond, which the phone's OS makes on
      first contact (see device.pairing), then the per-connection steps in
      `initialization`. The vendor app additionally insists on an account and
      a registered bike before it will connect. That is an app-side gate
      against the vendor cloud. The bike has no knowledge of the account, and
      nothing in the app sends an account credential to the bike.
      A bike that has never been activated (Factory State: motor off;
      Delivery State: 60 miles / 100 km of assist) needs the vendor app's
      Setup flow before it is rideable. That variant is recorded below with
      no local alternative. Confidence is low: the flow is read from the
      app, and nothing has been replayed.
    methods:
      - type: "ble_direct"
        name: "Activated bike: pair on first connect, then poll"
        role: "primary"
        verified: false
        description: >
          Switch the battery on, scan for the "Gocycle" name, connect, and
          open notifications on Peripheral TX. On a phone with no bond yet,
          that first access to the encrypted streaming service makes the OS
          pair (Just Works is expected, with no PIN). Then write framed
          commands to Peripheral RX. No account, button press or PIN is
          involved.
        ble:
          advertised_name: "Gocycle"
          advertised_name_match: "prefix"
          service_uuid: "331a36f5-2459-45ea-9d95-6142f0c4b307"
          write_characteristic: "a9da6040-0823-4995-94ec-9ce41ca28833"
          read_characteristic: "a73e9a10-628f-4494-a099-12efaf72258f"
          pairing_required: true
        steps:
          - action: "Switch the bike's battery on (tap the battery button once). Bluetooth is off while the battery is off."
            actor: "user"
            expect: "The dash lights up and shows the battery level."
            notes: >
              From the G4 product manual. The battery switches itself off
              after about 30 minutes with no motor activity, which drops the
              link.
          - action: "Close the vendor app, and turn Bluetooth off on any other phone that has been connected to this bike."
            actor: "user"
            notes: >
              The vendor's article on connecting several phones says the bike
              may not be visible to a second phone while the first one's
              Bluetooth is on. Treat the bike as one central at a time.
          - action: "Scan for a local name starting 'Gocycle' or 'GOCYCLE' and connect."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Run `initialization`: subscribe to Peripheral TX and leave Peripheral RX notifications off."
            actor: "client"
            request:
              protocol: "ble_gatt"
              service: "331a36f5-2459-45ea-9d95-6142f0c4b307"
              action: "subscribe a73e9a10-628f-4494-a099-12efaf72258f"
            expect: "On a first connection the host pairs and stores a bond. Afterwards notifications are enabled on Peripheral TX."
          - action: "Write read_mc_version, then poll read_dash_data about once a second."
            actor: "client"
            request:
              protocol: "ble_gatt"
              service: "331a36f5-2459-45ea-9d95-6142f0c4b307"
              action: "write a9da6040-0823-4995-94ec-9ce41ca28833 (with response)"
            expect: >
              A 0x40-framed reply with opcode 0x2021 carrying the
              motor-controller version, then one opcode-0x2031 dash frame per
              poll (payload_formats.FrameEnvelope, services Peripheral TX
              format).
        timing:
          dash_poll_interval_ms: 1000
          dash_poll_unanswered_limit: 3
          max_speed_read_delay_ms: 400
          diagnostic_poll_interval_ms: 500
          log_upload_inactivity_timeout_ms: 5000
          notes: >
            All values are the vendor app's own choices, not device limits.
            The bike home screen polls the dash block every 1000 ms. After
            more than three polls with no reply it stops polling (and on a
            Classic bike it disconnects). It sends read_max_speed 400 ms after
            the page opens. The diagnostics screen polls every 500 ms. The log
            upload treats 5 s of silence as the end of the log. An older
            helper in the app also carries a 500 ms dash timer.
        troubleshooting:
          - symptom: "The bike does not appear in a scan"
            causes:
              - "The battery is off, or switched itself off after 30 minutes idle. Tap the battery button."
              - "Another phone is connected, often the vendor app in the background. Close it or turn that phone's Bluetooth off."
              - "On Android, location services or Bluetooth scanning are off. The vendor's German troubleshooting PDF names location services as required for G4 bikes."
          - symptom: "Connects, but pairing fails or the connection drops straight away"
            causes:
              - "The phone holds a bond the bike no longer has, for example after a Bluetooth reset. Forget the bike in the phone's Bluetooth settings and connect again (device.pairing.unpair)."
              - "Firmware older than 2.3 has no bike-side Bluetooth reset, per the vendor."
          - symptom: "Connected and subscribed, but no reply to any command"
            causes:
              - "The frame's 16-bit checksum or opcode byte order is wrong (payload_formats.FrameEnvelope). The opcode goes low byte first, with bit 15 set for the opcodes listed in protocol_details.framing.flagged_opcodes."
              - "Notifications were enabled on Peripheral RX and left on, which puts the BGX module into Fast-Ack flow control (protocol_details.bgx_module). The app disables them again at once."
              - "The reply spans several notifications and the client decoded only the first. Reassemble by the length field before parsing."
          - symptom: "Motor gives no assist even though the app-side commands work"
            causes:
              - "The bike is in Factory State, or has used up its Delivery State miles. The dash LED pattern and the beep codes (5 beeps: Factory State; 3 or 4 beeps: unregistered) say which. Only the vendor app's Setup clears it."
      - type: "cloud_account"
        name: "New bike in Factory or Delivery State: vendor app Setup"
        role: "variant"
        verified: false
        description: >
          Applies only to a bike that has never been activated. The vendor
          app signs in with the email the bike is registered to, checks
          ownership against the cloud build record, updates the firmware if
          it is below the version the app requires (the G4 screen sends
          anything older than 2.8 to the update page), and then writes the
          registration state to the bike. Those registration writes (factory
          state, miles limit, anti-theft flag, review and service flags) are
          omitted from this spec on safety and anti-theft grounds. A dealer's
          pre-delivery inspection does the same from the dealer side and
          leaves the bike in Delivery State.
        cloud:
          provider: "Gocycle (GocycleConnect account and bike registration)"
          local_alternative: >
            None known. The bike, not the app, enforces Factory and Delivery
            State. The writes that clear them exist in the opcode set, but
            this spec deliberately leaves them out.
        steps:
          - action: "In the vendor app, sign in with the email the bike was registered to, press '+', pick the model and follow Setup (assembly steps can be skipped)."
            actor: "user"
            expect: "The app checks and updates the firmware, then reports the bike connected and registered. After that the bike chimes on power-up instead of beeping."
          - action: "For a used bike still registered to someone else, have the previous owner transfer ownership in the app."
            actor: "user"
            notes: "The vendor's Can't Connect to a Gocycle article. The app refuses to connect to a bike registered to another email."
    factory_reset:
      applicable: false
      confidence: "medium"
      effect: >
        No owner-accessible factory reset. Factory State and Delivery State
        are activation states set by the vendor app's dealer and factory
        tooling, not a return to defaults an owner can trigger, and the
        writes behind them are omitted here. The one owner-side reset is the
        Bluetooth reset (boost button or left twist switch held 30 s). It
        clears the bike's stored Bluetooth bonds and is documented under
        device.pairing.unpair, because that is all it does. Riding
        definitions, odometer and registration are not reported to change.
      description: >
        Per the vendor's help-centre articles. Nothing has been run here.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Moving the bike to a new phone or client needs no reset. The BGX
        module keeps a table of up to 14 bonds by Silicon Labs' default, and
        the vendor documents one bike used from several phones. Disconnect the
        old phone (close the app, or turn its Bluetooth off) and pair from the
        new one. A client that cannot reconnect after a bike-side Bluetooth
        reset must forget the bike in the OS and pair again.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "BLE bonding keys for each phone that has paired (the BGX module's bond table; up to 14 entries by module default)"
      issued_to_client:
        - "The BLE bond (link keys), held by the phone's OS rather than the app"
      notes: >
        No application-layer secret exists on the link. The vendor account
        belongs to the app's cloud calls and never reaches the bike.

  pairing:
    required: true
    confidence: "low"
    security_mode: "just_works"
    bonding: "required"
    exclusivity:
      single_connection: true
      single_bond: false
      recovery: >
        Close the vendor app and turn Bluetooth off on any other phone that
        has used the bike. If the phone still will not connect, forget the
        bike in the OS Bluetooth settings. If that fails, do the bike-side
        Bluetooth reset below and forget it again.
      notes: >
        single_connection comes from the vendor's multiple-devices article.
        single_bond: false rests on the BGX module's 14-entry bond table and
        on the same article describing one bike used from several phones.
    enter_pairing_mode:
      required: false
      notes: >
        No pairing mode or button. The bike is connectable whenever its
        battery is on, and the vendor app's "+" flow simply scans. Nothing
        documents a pairing window.
    unpair:
      supported: true
      requires_factory_reset: false
      clears: >
        The bike's stored Bluetooth bonds. Whether it clears all of them or
        only some is not stated. Nothing else is reported to change.
      procedures:
        - name: "Boost button held 30 seconds (G4)"
          verified: false
          basis: >
            Vendor help-centre article "G4 G4i G4i+ Bluetooth Reset" (needs
            firmware 2.3 or later). Not run here.
          applies_to: ["G4"]
          power_state: "on"
          hold_seconds: 30
          description: >
            With the bike switched on and the app closed, hold the red boost
            button until the bike beeps. Then forget the bike on every phone
            that had paired with it.
          steps:
            - action: "Close the vendor app on the phone."
              actor: "user"
            - action: "With the bike on, hold the boost button for 30 seconds until it beeps, then release."
              actor: "user"
              expect: "The bike beeps."
            - action: "Forget the bike in the phone's Bluetooth settings, then pair again from the client."
              actor: "user"
        - name: "Left twist switch held down 30 seconds (G4i, G4i+)"
          verified: false
          basis: >
            Vendor help-centre article "G4 G4i G4i+ Bluetooth Reset" (the
            G4i/G4i+ use the left twist switch in place of the boost button;
            needs firmware 2.3 or later). Not run here.
          applies_to: ["G4i", "G4i+"]
          power_state: "on"
          hold_seconds: 30
          description: >
            Same reset as the G4, on the left twist switch. Twist it down and
            hold until the bike beeps.
          steps:
            - action: "Close the vendor app on the phone."
              actor: "user"
            - action: "With the bike on, twist the left switch down and hold it for 30 seconds until the bike beeps, then release."
              actor: "user"
              expect: "The bike beeps."
            - action: "Forget the bike in the phone's Bluetooth settings, then pair again from the client."
              actor: "user"
      notes: >
        The vendor article's instruction to forget the bike in the phone's
        settings after this reset is the main evidence that the bike stores
        bonds at all.
    notes: >
      Inferred, not observed. Silicon Labs documents the BGX13 Xpress
      Streaming Service as requiring an encrypted link, which means the
      central must pair, and says the module requests bonding by default and
      supports Just Works and passkey pairing. The app never calls a bond
      API, never shows or asks for a PIN, and no Gocycle manual or article
      mentions one. So pairing happens implicitly, on the app's first write
      to a streaming characteristic's CCCD, and Just Works is the expected
      association model. The vendor's Bluetooth-reset article (forget the
      bike after resetting it) fits a bike that stores bonds. Gocycle could
      have reconfigured the module (encryption off, or passkey entry).
      Nothing in the app or its documentation rules that out, and one GATT
      session against a bike would settle it.

  host_compatibility:
    - stack: "android"
      status: "compatible"
      verification: "reported"
      basis: >
        The vendor app's Android build uses the platform GATT client, through
        the open-source Capacitor bluetooth-le plugin, for every G4-family
        bike. The vendor lists Android 7.0 or later, and names some Sony
        Xperia and OnePlus phones as having connection problems.
      notes: >
        The app reads GAP Device Name after connecting on Android when the
        advertised name is short. Store reviews report frequent connection
        failures with the 9.x app. Those look like app-side problems (see
        protocol_details.app_quirks), not a stack incompatibility.
    - stack: "corebluetooth"
      status: "compatible"
      verification: "reported"
      basis: >
        The vendor ships the same app for iOS 13 or later, and it drives
        G4-family bikes over the same BGX streaming service.
      notes: >
        CoreBluetooth has no explicit bond call. Pairing is triggered by the
        first access to the encrypted characteristics. This verdict covers
        only the BLE G4 family. The Classic G2/G3/GS/GX bikes are a separate
        question (protocol_details.classic_legacy_path).

  safety_advisory:
    severity: "warning"
    summary: >-
      Controls a road vehicle's motor assistance and lights. Change settings
      only when the bike is stopped.
    detail: >-
      The vendor manual warns against changing riding mode while in motion.
      Riding modes change when and how hard the motor assists, and that
      alters the bike's speed envelope. Turning the lights off, or setting
      the DRL to a flashing mode where local rules forbid flashing bicycle
      lights (the app itself warns of this), are road-safety and legal
      matters. The riding-mode record also carries the speed ceiling and the
      pedalling-required flag that make the bike an EU EPAC or a US Class 1
      or 2 e-bike. This spec never sets them. A client selecting a mode must
      copy them from the bike's own record. Speed, throttle-permission,
      limit, lock and firmware writes are deliberately absent. This is an
      unofficial client. The manufacturer's manual and local e-bike law
      take precedence.
    acknowledge_required: false
    advisory_url: "https://gocycle.zendesk.com/hc/article_attachments/20875761767965"

  variants:
    - model: "G4"
      notes: >
        Boost button on the handlebar. The app's settings screen shows front
        and rear light control and hides predictive shifting for a G4.
    - model: "G4i"
      notes: >
        Integrated dash, and a left twist switch in place of the boost
        button. The app offers predictive shifting.
    - model: "G4i+"
      notes: >
        As the G4i, with DRL. The app offers DRL, front and rear lights and
        predictive shifting. The per-bike hardware-type byte
        (read_gocycle_type) decides which light controls the app shows.
        Which marketing model each type value is has not been established.

initialization:
  - characteristic: "a73e9a10-628f-4494-a099-12efaf72258f"
    subscribe: true
    notes: >
      Peripheral TX. Every reply arrives here. On a phone with no bond yet,
      this CCCD write is what makes the OS pair. The app first enables and
      then immediately disables notifications on Peripheral RX
      (a9da6040-0823-4995-94ec-9ce41ca28833) before subscribing here. Under
      the BGX flow-control rules, enabling RX notifications switches the
      module to Fast-Ack mode, and leaving them off keeps legacy flow
      control, which is what the app ends up with. A client should simply
      not enable RX notifications. See protocol_details.bgx_module.
      Nothing else is exchanged per connection: no login, no key exchange
      and no clock sync. The app's set-time call is mis-wired and never
      reaches the bike. The G4 home screen then sends read_mc_version, goes
      to the firmware-update page if the version is below 2.8, and otherwise
      sends read_max_speed and starts polling read_dash_data every second.
      On the first poll it also reads the lights state and the custom and
      active mode definitions.

services:
  - uuid: "00001800-0000-1000-8000-00805f9b34fb"
    name: "Generic Access"
    notes: >
      Standard GAP service. The app reads Device Name on Android to recover
      the full "Gocycle<frame number>" name when the advertisement carried
      only the stem.
    characteristics:
      - uuid: "00002a00-0000-1000-8000-00805f9b34fb"
        name: "Device Name"
        properties: ["read"]
        notes: "UTF-8 name, \"Gocycle\" + six-digit frame number."
        format:
          - offset: 0
            length: 13
            name: "device_name"
            type: "string"
            notes: "Characters 7-12 are the frame number. Length assumes a six-digit frame number."

  - uuid: "331a36f5-2459-45ea-9d95-6142f0c4b307"
    name: "Silicon Labs BGX13 Xpress Streaming Service"
    notes: >
      The stock BGX13 serial-bridge service (Silicon Labs Gecko OS BGX
      documentation), carrying the bike's framed opcode protocol. The
      vendor app writes every command to Peripheral RX and parses every
      reply from Peripheral TX. The characteristic properties below are the
      module's documented ones, and no GATT dump of a Gocycle has been
      seen. The app's UUID-to-name table also lists two groups of
      Silicon Labs OTA UUIDs (902ee692-6ef9-48a8-a430-5212eeb3e5a2,
      503a5d70-b443-466e-9aeb-c342802b184e,
      12e868e7-c926-4906-96c8-a7ee81d4b1b3,
      25f05c0a-e917-46e9-b2a5-aa2be1245afe,
      4f4a2368-8cca-451e-bfff-cf0e2ee23e9f,
      4cc07bcf-0868-4b32-9dad-ba4cc41e5316,
      0d77cc11-4ac1-49f2-bfa9-cd96ac7a92f8; and
      b2e7d564-c077-404e-9d29-b547f4512dce,
      48cbe15e-642d-4555-ac66-576209c50c1e,
      db96492d-cf53-4a43-b896-14cbbf3bf4f3,
      ddcc1893-3e58-45a8-b9e5-491b7279d870). The app never reads, writes or
      subscribes to any of them, and whether the bike exposes them is
      unknown (features[].dfu).
    characteristics:
      - uuid: "a9da6040-0823-4995-94ec-9ce41ca28833"
        name: "Peripheral RX (client to bike)"
        properties: ["write", "write_without_response", "notify"]
        role: "command"
        notes: >
          Write every command here as a 0x40 frame
          (payload_formats.FrameEnvelope). The app uses Write with response,
          which is also the BGX legacy flow-control mode. Keep notifications
          on this characteristic OFF: enabling them turns on BGX Fast-Ack
          flow control, whose 3-byte control messages would then arrive
          here (protocol_details.bgx_module). The BGX module accepts 1-250
          bytes per write. Every frame below is well under 20 bytes. The
          app splits frames over 150 bytes into 256-byte writes, which is
          above that limit. Only firmware blocks reach that size.
          All frames are complete, with length, opcode and checksum
          included: write them as they stand. The opcode goes on the wire
          low byte first, and bit 15 is set for the opcodes marked in
          protocol_details.framing.flagged_opcodes.
        commands:
          read_dash_data:
            description: >
              Poll the live dash block (opcode 0x2031, sent flagged as
              0xa031, no payload). The reply is an opcode-0x2031 frame
              decoded by this service's Peripheral TX `format`. The app
              polls it every 1000 ms from the home and live-dash screens.
            value: [0x40, 0x00, 0x00, 0x31, 0xA0, 0xD1, 0x00]
            verification: "reported"
          read_mc_version:
            description: >
              Motor-controller firmware version (opcode 0x2021, flagged).
              The reply carries the same opcode (payload_formats.Version).
              G4-family bikes report 2.x. The app treats anything below 2.8
              as needing an update.
            value: [0x40, 0x00, 0x00, 0x21, 0xA0, 0xC1, 0x00]
            verification: "reported"
          read_jb_version:
            description: >
              Junction-box firmware version (opcode 0x2026, not flagged).
              Same reply layout as read_mc_version (payload_formats.Version).
              The current app sends it only from the Classic update screens,
              so whether a G4 answers is not established.
            value: [0x40, 0x00, 0x00, 0x26, 0x20, 0x46, 0x00]
            verification: "reported"
          read_id:
            description: >
              Identify the unit answering and whether it is running its
              application or its bootloader (opcode 0x1002). The reply is
              opcode 0x1003 (payload_formats.ReadIdReply). The app uses it in
              its firmware updater, and the query itself changes nothing.
            value: [0x40, 0x00, 0x00, 0x02, 0x10, 0x12, 0x00]
            verification: "reported"
          read_gocycle_type:
            description: >
              Hardware-type byte (opcode 0x204b). The reply carries the same
              opcode, and payload byte 0 is the type
              (payload_formats.GocycleType). The app uses it to decide which
              light controls to show and which bundled firmware image fits.
            value: [0x40, 0x00, 0x00, 0x4B, 0x20, 0x6B, 0x00]
            verification: "reported"
          read_mode_definition_active:
            description: >
              Read riding-mode definition 4, the working slot the app writes
              every mode selection into (opcode 0x2035, flagged, payload
              [0x04]). The reply is an opcode-0x2035 frame laid out as
              payload_formats.ModeDefinition. Its pedal-watt pair tells which
              preset is active (protocol_details.riding_modes.presets).
            value: [0x40, 0x01, 0x00, 0x35, 0xA0, 0x04, 0xDA, 0x00]
            verification: "reported"
          read_mode_definition_custom_1:
            description: >
              Read riding-mode definition 2, where a G4 keeps the user's
              Custom 1 mode (payload [0x02]).
              Reply as read_mode_definition_active.
            value: [0x40, 0x01, 0x00, 0x35, 0xA0, 0x02, 0xD8, 0x00]
            verification: "reported"
          read_mode_definition_custom_2:
            description: >
              Read riding-mode definition 3, where a G4 keeps the user's
              Custom 2 mode (payload [0x03]).
              Reply as read_mode_definition_active.
            value: [0x40, 0x01, 0x00, 0x35, 0xA0, 0x03, 0xD9, 0x00]
            verification: "reported"
          set_mode_definition:
            description: >
              Write one riding-mode definition (opcode 0x2036, sent flagged
              as 0xa036), with a 10-byte payload laid out as
              payload_formats.ModeDefinition. This is how the app selects
              Eco, City, Turbo or Demand. It writes the preset's pedal-watt
              pair into definition 4, then sends activate_mode_slot. No
              fixed frame is given, and none can be. Bytes 3-5 of the
              payload hold the pedalling-required flag and the speed
              ceiling. The app fills them from the region on the bike's
              cloud record, and a replacement client must copy them
              unchanged from the bike's own read_mode_definition_active
              reply. The frame also ends in a 16-bit checksum that the
              template vocabulary cannot express (protocol_details.
              schema_gaps). The full recipe is in
              protocol_details.riding_modes.
            advanced: true
            advanced_reason: >
              This record carries the speed ceiling and the
              pedalling-required (throttle) flag as well as the assist curve.
              A value not copied from the bike can take it out of its legal
              class (EU EPAC 25 km/h, or US Class 1 or 2) or change how the
              motor responds mid-ride. Read definition 4 first, change only
              the two pedal-watt fields, and do it with the bike stopped. To
              undo, rewrite the saved record.
            packet_layout:
              "0": "0x40 start byte"
              "1": "payload length, uint16 LE: 0x0a 0x00"
              "3": "opcode 0x2036 with bit 15 set, uint16 LE: 0x36 0xa0"
              "5": "payload byte 0: definition number (the app writes 4; 2 and 3 hold the G4's two custom modes)"
              "6": "payload byte 1: torque-sensing flag, always 0x01 from the app"
              "7": "payload byte 2: boost / power level, 0x00 in every preset; copy it for a custom mode"
              "8": "payload byte 3: 0x00 = pedalling required for assist, 0x01 = assist without pedalling allowed. COPY from the bike"
              "9": "payload bytes 4-5: speed ceiling, mph x 100, uint16 LE. COPY from the bike"
              "11": "payload bytes 6-7: pedal effort at which assist starts, W, uint16 LE"
              "13": "payload bytes 8-9: pedal effort for full assist, W, uint16 LE"
              "15": "checksum: uint16 LE sum of frame bytes 1-14"
            verification: "reported"
          activate_mode_slot:
            description: >
              Select the working mode definition (opcode 0x1009, payload
              [0x03]). The app always sends 3 after writing definition 4, so
              the index is most likely 0-based (3 selects definition 4). The
              expected reply is an ACK frame carrying 0x1009. If the index
              is 0-based it only re-selects whatever definition 4 already
              holds; that is unverified (remaining_unknowns).
            value: [0x40, 0x01, 0x00, 0x09, 0x10, 0x03, 0x1D, 0x00]
            advanced: true
            advanced_reason: >
              Selects which riding-mode definition the motor uses. Whether
              payload 3 means definition 4 or definition 3 (a different
              custom mode with its own speed ceiling and boost) is
              unverified. Send only with the bike stopped, after reading
              both definitions.
            verification: "reported"
          read_lights_enable:
            description: >
              Integrated front and rear lights, on or off (opcode 0x3023). The
              reply carries the same opcode, and payload byte 0 is 0 for off
              and non-zero for on (payload_formats.ByteState).
            value: [0x40, 0x00, 0x00, 0x23, 0x30, 0x53, 0x00]
            verification: "reported"
          lights_on:
            description: >
              Turn the integrated front and rear lights on (opcode 0x3022,
              payload [0x01]). The app's home-screen lights button. Expect
              an ACK carrying 0x3022. The vendor dates app light control to
              G4 firmware 2.59.
            value: [0x40, 0x01, 0x00, 0x22, 0x30, 0x01, 0x54, 0x00]
            verification: "reported"
          lights_off:
            description: "Turn the integrated front and rear lights off (opcode 0x3022, payload [0x00]). Expect an ACK carrying 0x3022."
            value: [0x40, 0x01, 0x00, 0x22, 0x30, 0x00, 0x53, 0x00]
            verification: "reported"
          read_lights_selector:
            description: >
              "DRL switch controls lights" setting (opcode 0x3020). The reply
              carries the same opcode, and payload byte 0 is 0 for disabled
              and non-zero for enabled (payload_formats.ByteState). When
              enabled, turning the DRL off also turns the front and rear
              lights off. The app shows it only for hardware type 5.
            value: [0x40, 0x00, 0x00, 0x20, 0x30, 0x50, 0x00]
            verification: "reported"
          lights_selector_on:
            description: "Enable \"DRL switch controls lights\" (opcode 0x3021, payload [0x01])."
            value: [0x40, 0x01, 0x00, 0x21, 0x30, 0x01, 0x53, 0x00]
            verification: "reported"
          lights_selector_off:
            description: "Disable \"DRL switch controls lights\" (opcode 0x3021, payload [0x00])."
            value: [0x40, 0x01, 0x00, 0x21, 0x30, 0x00, 0x52, 0x00]
            verification: "reported"
          read_drl:
            description: >
              Daytime running light status (opcode 0x103a). The reply is
              opcode 0x103b: DRL on/off, flashing permitted, current DRL
              mode and default DRL mode (payload_formats.DrlStatus). The
              app shows DRL settings for hardware types 3 and 5.
            value: [0x40, 0x00, 0x00, 0x3A, 0x10, 0x4A, 0x00]
            verification: "reported"
          drl_flash_on:
            description: >
              Allow the DRL's flashing modes (opcode 0x103c, payload
              [0xff, 0x01, 0xff, 0xff]; 0xff leaves a field unchanged). The
              app warns that some regions forbid flashing bicycle lights.
              The app's parser takes a short-form ACK for 0x103c.
            value: [0x40, 0x04, 0x00, 0x3C, 0x10, 0xFF, 0x01, 0xFF, 0xFF, 0x4E, 0x03]
            verification: "reported"
          drl_flash_off:
            description: "Disallow DRL flashing (opcode 0x103c, payload [0xff, 0x00, 0xff, 0xff])."
            value: [0x40, 0x04, 0x00, 0x3C, 0x10, 0xFF, 0x00, 0xFF, 0xFF, 0x4D, 0x03]
            verification: "reported"
          drl_default_low:
            description: "DRL default mode \"1 - Low\" (opcode 0x103c, byte 3 = 0x00; other fields 0xff = unchanged)."
            value: [0x40, 0x04, 0x00, 0x3C, 0x10, 0xFF, 0xFF, 0xFF, 0x00, 0x4D, 0x03]
            verification: "reported"
          drl_default_low_flashing:
            description: "DRL default mode \"2 - Low flashing\" (byte 3 = 0x01)."
            value: [0x40, 0x04, 0x00, 0x3C, 0x10, 0xFF, 0xFF, 0xFF, 0x01, 0x4E, 0x03]
            verification: "reported"
          drl_default_high:
            description: "DRL default mode \"3 - High\" (byte 3 = 0x02). The app marks the high modes as for daylight use only."
            value: [0x40, 0x04, 0x00, 0x3C, 0x10, 0xFF, 0xFF, 0xFF, 0x02, 0x4F, 0x03]
            verification: "reported"
          drl_default_high_flashing:
            description: "DRL default mode \"4 - High flashing\" (byte 3 = 0x03). Daylight only, per the app."
            value: [0x40, 0x04, 0x00, 0x3C, 0x10, 0xFF, 0xFF, 0xFF, 0x03, 0x50, 0x03]
            verification: "reported"
          drl_default_off:
            description: >
              DRL default mode "0 - Off" (byte 3 = 0x05). The app writes 5
              for Off, and its status screen shows any value outside 0-3 as
              Off.
            value: [0x40, 0x04, 0x00, 0x3C, 0x10, 0xFF, 0xFF, 0xFF, 0x05, 0x52, 0x03]
            verification: "reported"
          predictive_shifting_on:
            description: >
              Enable predictive (automatic) shifting (opcode 0x3013, payload
              [0x01]). The current state is dash field auto_shift_enabled.
              The app offers it on the G4i and G4i+.
            value: [0x40, 0x01, 0x00, 0x13, 0x30, 0x01, 0x45, 0x00]
            verification: "reported"
          predictive_shifting_off:
            description: "Disable predictive shifting (opcode 0x3013, payload [0x00])."
            value: [0x40, 0x01, 0x00, 0x13, 0x30, 0x00, 0x44, 0x00]
            verification: "reported"
          reset_trip:
            description: >
              Zero the bike's trip counters (opcode 0x203f, flagged, payload
              [0x01, 0x01, 0x01, 0x01, 0x01]). The app sends it when a ride
              is started from the Rides tab. The trip distance, calories,
              moving time and energy fields of the dash block restart from
              zero. The app's four-byte forms of the same opcode, which
              clear single counters, are in protocol_details.opcode_table.
            value: [0x40, 0x05, 0x00, 0x3F, 0xA0, 0x01, 0x01, 0x01, 0x01, 0x01, 0xE9, 0x00]
            verification: "reported"
          read_max_speed:
            description: >
              Read the bike's configured maximum assisted speed (opcode
              0x2047, flagged). The reply carries the same opcode, as mph x
              100 (payload_formats.MaxSpeed). Read-only. The write that sets
              it is omitted from this spec. The app uses the reading to cap
              the custom-mode editor and to label the bike EPAC or US
              Class 1/2.
            value: [0x40, 0x00, 0x00, 0x47, 0xA0, 0xE7, 0x00]
            verification: "reported"
          read_allow_on_demand:
            description: >
              Read whether assist without pedalling (throttle / On Demand) is
              permitted (opcode 0x2049, flagged). The reply carries the same
              opcode (payload_formats.AllowOnDemand). Read-only. The write is
              omitted from this spec.
            value: [0x40, 0x00, 0x00, 0x49, 0xA0, 0xE9, 0x00]
            verification: "reported"
          read_diagnostic_data:
            description: >
              Sensor and switch counters for the app's Diagnostics screen
              (opcode 0x204a). The reply carries the same opcode
              (payload_formats.DiagnosticData). The app polls it every 500
              ms. Read-only. The motor test and calibration actions on that
              screen are omitted.
            value: [0x40, 0x00, 0x00, 0x4A, 0x20, 0x6A, 0x00]
            verification: "reported"
          read_stress_counts:
            description: >
              Ride-stress statistics (opcode 0x3027). The reply carries the
              same opcode as six little-endian float32 values
              (payload_formats.StressCounts). The app shows them only on its
              dealer screen.
            value: [0x40, 0x00, 0x00, 0x27, 0x30, 0x57, 0x00]
            verification: "reported"
          read_frame_number:
            description: >
              Frame number as a uint32 (opcode 0x2022, flagged). The reply
              carries the same opcode (payload_formats.FrameNumber). The
              app's only call site passes its arguments shifted and never
              reaches the bike, so this read is unexercised. The app takes
              the frame number from the advertised name instead.
            value: [0x40, 0x00, 0x00, 0x22, 0xA0, 0xC2, 0x00]
            verification: "hypothesis"

      - uuid: "a73e9a10-628f-4494-a099-12efaf72258f"
        name: "Peripheral TX (bike to client)"
        properties: ["notify", "indicate", "write_without_response"]
        role: "notify"
        format_match:
          offset: 3
          value: 0x31
          notes: >
            Low byte of opcode 0x2031 (dash data). The high byte may arrive
            as 0x20 or 0xa0, since the app masks bit 15 off. Every other
            reply (versions, mode definitions, lights, ACK/NACK) arrives on
            this characteristic too, and is described in payload_formats.
        notes: >
          Every reply is a 0x40 long frame (payload_formats.FrameEnvelope),
          or a 0x21 short frame (payload_formats.ShortFrame). The `format`
          below decodes the dash-data reply, with offsets counted from the
          frame's 0x40 start byte (payload offset + 5). The BGX module is a
          byte-stream bridge. A frame can be split across notifications, or
          several can share one, and the app buffers the stream and parses
          by the length field. A consumer that decodes one notification at a
          time must first reassemble a whole frame and check its checksum.
          Payload length grows with firmware. The app reads the speed, gear
          and cadence fields only when the payload is over 40 bytes, the
          energy, moving-time and predictive-shifting fields only when it is
          over 46, and the review and service flags only when it is over 57.
          Treat a field beyond the frame's end as absent.
        format:
          - offset: 5
            length: 2
            name: "battery_voltage"
            type: "uint16"
            endianness: "little"
            scale: 0.001
            unit: "V"
            device_class: "voltage"
          - offset: 7
            length: 2
            name: "battery_current"
            type: "uint16"
            endianness: "little"
            scale: 0.001
            unit: "A"
            device_class: "current"
            notes: "Read unsigned by the app. Whether charging ever shows as a separate sign or field is not known."
          - offset: 15
            length: 4
            name: "odometer"
            type: "uint32"
            endianness: "little"
            scale: 0.01
            unit: "mi"
            device_class: "distance"
            notes: "Always miles on the wire. The app multiplies by 1.60934 for km display."
          - offset: 21
            length: 1
            name: "battery_level"
            type: "uint8"
            scale: 10
            unit: "%"
            device_class: "battery"
            notes: "Raw 0-10 in tenths. The app clamps the raw value to 0-10 before multiplying by 10."
          - offset: 25
            length: 2
            name: "trip_calories"
            type: "uint16"
            endianness: "little"
            unit: "kcal"
            notes: "The app labels it calories burned. kcal is inferred from its size and use."
          - offset: 27
            length: 4
            name: "trip_distance"
            type: "uint32"
            endianness: "little"
            scale: 0.01
            unit: "mi"
            device_class: "distance"
          - offset: 33
            length: 2
            name: "miles_limit"
            type: "int16"
            endianness: "little"
            unit: "mi"
            values:
              -1: "no limit"
            notes: >
              Odometer reading at which a limited (demo / Delivery State)
              bike stops assisting. The app ignores -1 and -2 and warns once
              the odometer passes any other value. What -2 means is not
              known.
          - offset: 41
            length: 2
            name: "speed"
            type: "uint16"
            endianness: "little"
            scale: 0.03125
            unit: "mph"
            device_class: "speed"
            notes: "Raw / 32 = mph. The app smooths the displayed value across consecutive polls. Present only when the payload length exceeds 40."
          - offset: 43
            length: 2
            name: "gear"
            type: "uint16"
            endianness: "little"
            notes: "Current gear number, shown as is by the app."
          - offset: 45
            length: 2
            name: "cadence"
            type: "uint16"
            endianness: "little"
            scale: 0.1
            unit: "rpm"
          - offset: 47
            length: 4
            name: "pedal_energy"
            type: "uint32"
            endianness: "little"
            unit: "J"
            device_class: "energy"
            notes: >
              Cumulative rider energy since the trip reset, in watt-seconds.
              The app gets pedal watts from its change over 5 s and 20 s, and
              treats a value above 4,000,000,000 as invalid. Present only
              when the payload length exceeds 46.
          - offset: 51
            length: 4
            name: "motor_energy"
            type: "uint32"
            endianness: "little"
            scale: 0.001
            unit: "J"
            device_class: "energy"
            notes: "Cumulative motor energy since the trip reset. Raw is milliwatt-seconds (the app divides by 3.6e6 to get Wh)."
          - offset: 55
            length: 4
            name: "moving_time"
            type: "uint32"
            endianness: "little"
            unit: "ms"
            device_class: "duration"
            notes: "Moving time since the trip reset."
          - offset: 59
            length: 2
            name: "auto_shift_enabled"
            type: "uint16"
            endianness: "little"
            notes: "Non-zero when predictive shifting is on."
          - offset: 61
            length: 1
            name: "review_pending"
            type: "uint8"
            notes: "Non-zero while a dealer service rating is waiting in the app (the vendor's 7-beep code). Present only when the payload length exceeds 57."
          - offset: 63
            length: 2
            name: "service_pending"
            type: "uint16"
            endianness: "little"
            notes: "Non-zero when a service reminder is due."

      - uuid: "75a9f022-af03-4e41-b4bc-9de90a47d50b"
        name: "BGX Mode (module, not bike)"
        properties: ["read", "write", "write_without_response", "notify", "indicate"]
        notes: >
          The BGX module's own mode switch, per Silicon Labs: 1 = streaming
          (normal), 2 = local command mode, 3 = remote command mode, in which
          the central talks to the module's Gecko OS command shell
          (optionally behind a password). The vendor app only ever logs this
          value and never writes it. A client should never write it. Remote
          command mode reconfigures the radio module, not the bike.
        format:
          - offset: 0
            length: 1
            name: "bgx_mode"
            type: "uint8"
            values:
              1: "streaming"
              2: "local command mode"
              3: "remote command mode"

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["vendor_ble"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "bundled_in_app"
        format: "Intel HEX, one image per G4 hardware type (the app picks by the read_gocycle_type byte)"
        notes: >
          For G4-family bikes the app carries the images inside its own
          bundle, as firmware 2.80, 2.86 and 2.87, selected by hardware
          type. It streams them over the same framed opcode channel: begin,
          write block, block acknowledgement and end, with a CRC query and
          application/bootloader switching around them. Nothing in the app
          signs an image. The app checks a CRC, but whether the bootloader
          verifies anything beyond that is not known. The Classic bikes are
          updated over SPP with images the app downloads from the vendor's
          servers (protocol_details.classic_legacy_path). Silicon Labs OTA
          UUIDs appear in the app's name table, but the app never uses them.
          If the bike exposes them, they would update the BGX radio module's
          own firmware, not the bike's.
      enter:
        how: "button"
        notes: >
          The vendor's forced-update procedure ("boost button power-up"):
          switch the bike off, close the app, and power the bike on while
          holding the red boost button (G4) or the left twist switch (G4i),
          then start an update from the app. The app also moves a running
          bike between application and bootloader with in-band opcodes. This
          spec omits those, along with every flashing step, on purpose.
      dfu_mode:
        notes: >
          Not established. Whether the advertised name or services change
          while the bootloader runs is unknown. The vendor describes the
          forced-update dash as every other LED lit (G4i/G4i+), with no
          change on some models.
      recovery:
        interrupted: "unknown"
        notes: >
          The vendor presents the forced update as the fix for a failed
          update, which suggests the bootloader survives an interrupted
          flash. That is not confirmed.
      verification: "reported"
      notes: "From the app's update flow and the vendor's firmware articles. Nothing was flashed or captured."

entities:
  - platform: "sensor"
    name: "Battery"
    device_class: "battery"
    unit: "%"
    state_characteristic: "a73e9a10-628f-4494-a099-12efaf72258f"
    state_command: "read_dash_data"
    state_mapping:
      value: "battery_level"
    precision: 10
    notes: "10 % steps. Poll read_dash_data about once a second; the value arrives in the reply on Peripheral TX."
  - platform: "sensor"
    name: "Battery Voltage"
    device_class: "voltage"
    unit: "V"
    state_characteristic: "a73e9a10-628f-4494-a099-12efaf72258f"
    state_command: "read_dash_data"
    state_mapping:
      value: "battery_voltage"
    precision: 0.1
  - platform: "sensor"
