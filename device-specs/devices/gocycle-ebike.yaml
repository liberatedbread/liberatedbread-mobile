    name: "Pedal Energy"
    device_class: "energy"
    unit: "J"
    state_characteristic: "a73e9a10-628f-4494-a099-12efaf72258f"
    state_command: "read_dash_data"
    state_mapping:
      value: "pedal_energy"
    notes: "Since the last trip reset. Values above 4,000,000,000 are invalid."
  - platform: "sensor"
    name: "Motor Energy"
    device_class: "energy"
    unit: "J"
    state_characteristic: "a73e9a10-628f-4494-a099-12efaf72258f"
    state_command: "read_dash_data"
    state_mapping:
      value: "motor_energy"
    notes: "Since the last trip reset."
  - platform: "switch"
    name: "Predictive Shifting"
    variants: ["G4i", "G4i+"]
    state_characteristic: "a73e9a10-628f-4494-a099-12efaf72258f"
    state_command: "read_dash_data"
    state_mapping:
      value: "auto_shift_enabled"
      on_when: "nonzero"
    commands:
      turn_on: "predictive_shifting_on"
      turn_off: "predictive_shifting_off"
    notes: "The app shows this control for the G4i and G4i+ only (by the model on the cloud record)."
  - platform: "switch"
    name: "Lights"
    state_command: "read_lights_enable"
    commands:
      turn_on: "lights_on"
      turn_off: "lights_off"
    notes: >
      Integrated front and rear lights. The state reply (opcode 0x3023,
      payload byte 0 non-zero = on) arrives on Peripheral TX, but that
      characteristic's `format` decodes only dash frames, so a consumer
      must parse it by hand (payload_formats.ByteState). The app shows this
      control on every G4 with integrated lights. Hardware type 4 has these
      lights but no DRL.
  - platform: "switch"
    name: "DRL Flashing Allowed"
    state_command: "read_drl"
    commands:
      turn_on: "drl_flash_on"
      turn_off: "drl_flash_off"
    notes: >
      Whether the DRL's flashing modes may be used. The state is byte 1 of
      the read_drl reply (payload_formats.DrlStatus). Some regions forbid
      flashing bicycle lights. Only bikes with a DRL (hardware types 3 and 5)
      respond meaningfully.
  - platform: "switch"
    name: "DRL Switch Controls Lights"
    state_command: "read_lights_selector"
    commands:
      turn_on: "lights_selector_on"
      turn_off: "lights_selector_off"
    notes: >
      When on, switching the DRL off also switches the front and rear lights
      off. The app offers it only for hardware type 5. The state is byte 0
      of the read_lights_selector reply.
  - platform: "button"
    name: "Reset Trip"
    commands:
      press: "reset_trip"
    notes: "Zeroes the bike's trip distance, calories, moving time and energy counters, as the app does when a ride starts."

payload_formats:
  FrameEnvelope:
    description: >
      The long frame used in both directions on the BLE path. Offsets from
      the start byte: [0] 0x40; [1-2] payload length N, uint16 LE (payload
      only); [3-4] opcode, uint16 LE, with bit 15 set on the opcodes in
      protocol_details.framing.flagged_opcodes; [5 .. 4+N] payload;
      [5+N .. 6+N] checksum, uint16 LE, the sum of bytes 1 .. 4+N modulo
      65536. Total length N + 7.
    fields:
      - {name: "start", offset: 0, length: 1, type: "uint8", description: "Always 0x40 ('@')."}
      - {name: "payload_length", offset: 1, length: 2, type: "uint16", endianness: "little", description: "Payload bytes only. Excludes start, length, opcode and checksum."}
      - {name: "opcode", offset: 3, length: 2, type: "uint16", endianness: "little", description: "Low byte first. Mask with 0x7fff to compare against the opcode table. The app sets bit 15 on send for some opcodes and masks it off on receive."}
      - {name: "payload", offset: 5, type: "bytes", description: "N bytes, layout per opcode."}
      - {name: "checksum", type: "uint16", endianness: "little", description: "At offset 5+N. Sum of every byte from offset 1 up to the end of the payload, truncated to 16 bits. The start byte is not summed."}
    parse_rules:
      - "Scan the byte stream for 0x40 (long frame) or 0x21 (short frame). The app does not resynchronise cleanly after stray bytes, so a client should discard everything before the start byte itself."
      - "Wait until 7 + N bytes have arrived (N from bytes 1-2), however many notifications that takes."
      - "Verify the checksum. The app drops a frame that fails it and continues with the next."
      - "opcode = u16le(bytes 3-4) & 0x7fff. Replies to a request carry the request's opcode, except the identify request 0x1002 (read_id, reply 0x1003), the DRL status request 0x103a (read_drl, reply 0x103b) and log text (0x1008)."
      - "ACK is opcode 0x0001 and NACK is 0x0000. Either carries the acknowledged opcode as a uint16 LE payload."
      - "When sending, split any frame longer than 150 bytes into writes no larger than the negotiated ATT payload and no larger than 250 bytes. The app uses 256-byte writes, which exceeds the BGX limit. Only firmware blocks are that long."
    example: "40 01 00 35 a0 04 da 00"
  ShortFrame:
    description: >
      A compact reply form the app's parser also accepts: [0] 0x21 ('!');
      [1] length C (at most 100); [2] type; [3 .. 2+C] C data bytes;
      [3+C] checksum, uint8, the sum of bytes 1 .. 2+C modulo 256. Total
      C + 4. The only type the app handles is 0x01 (ACK), whose two data
      bytes are the acknowledged opcode, uint16 LE. It is the form the app
      expects for some firmware-update and DRL acknowledgements. Whether a
      G4 emits it over BLE is not established.
    fields:
      - {name: "start", offset: 0, length: 1, type: "uint8", description: "0x21."}
      - {name: "length", offset: 1, length: 1, type: "uint8", description: "C, the data-byte count after the type byte. The app treats C > 100 as garbage and skips the start byte."}
      - {name: "type", offset: 2, length: 1, type: "uint8", values: {"1": "ACK"}}
      - {name: "acked_opcode", offset: 3, length: 2, type: "uint16", endianness: "little", description: "For type 0x01."}
    example: "21 02 01 3c 10 4f"
  AckNack:
    description: >
      Long-frame ACK (opcode 0x0001) or NACK (opcode 0x0000). The payload is
      the opcode being answered, uint16 LE. The app's log upload also sends
      ACKs the other way (protocol_details.log_upload).
    fields:
      - {name: "answered_opcode", offset: 0, length: 2, type: "uint16", endianness: "little"}
    example: "40 02 00 01 00 22 30 55 00  (ACK for lights on/off, opcode 0x3022)"
  Version:
    description: "Reply to read_mc_version (opcode 0x2021) and read_jb_version (opcode 0x2026). Payload offsets."
    fields:
      - {name: "minor", offset: 0, length: 2, type: "uint16", endianness: "little"}
      - {name: "major", offset: 2, length: 2, type: "uint16", endianness: "little"}
    parse_rules:
      - "Version string = major + '.' + minor (minor 0 gives 'major.0'). A G4 reports 2.x, and the Classic bikes' controllers report 8x.0."
      - "The app stores the result as the motor-controller or junction-box version and compares it with the cloud's current version."
  ReadIdReply:
    description: "Reply to read_id, opcode 0x1003. Payload offsets. Bytes 0-7 and 10-11 are not interpreted by the app."
    fields:
      - {name: "unit_type", offset: 8, length: 2, type: "uint16", endianness: "little", values: {"1": "junction box (older bikes)", "2": "motor controller", "6": "dash", "8": "dash / light bar", "9": "G3 junction box (also treated as light bar)", "10": "G3S junction box", "11": "dash / light bar", "13": "G4 (treated as a dash as well)"}}
      - {name: "image_type", offset: 12, length: 2, type: "uint16", endianness: "little", values: {"1": "bootloader", "2": "application"}}
      - {name: "version_major", offset: 14, length: 2, type: "uint16", endianness: "little"}
      - {name: "version_minor", offset: 16, length: 2, type: "uint16", endianness: "little"}
    parse_rules:
      - "The app treats the reply as valid when unit_type is a junction box or motor controller and image_type is 1 or 2. The labels are the app's own interpretation."
  GocycleType:
    description: "Reply to read_gocycle_type, opcode 0x204b. Payload byte 0."
    fields:
      - {name: "gocycle_type", offset: 0, length: 1, type: "uint8", values: {"1": "G4 hardware type 1", "2": "G4 hardware type 2", "3": "G4 with DRL", "4": "G4 with integrated front/rear lights, no DRL", "5": "G4 with DRL, integrated lights and DRL-switch selector"}}
    parse_rules:
      - "The labels for 3-5 come from which light settings the app shows. 1 and 2 get no light settings. The firmware picker maps 1-3 to its 2.80 image, 4 to 2.87 and 5 to 2.86. Which marketing model each value is has not been established."
  ModeDefinition:
    description: >
      Reply to read_mode_definition_* (opcode 0x2035), the echo of
      set_mode_definition (opcode 0x2036), and the 10-byte payload
      set_mode_definition writes. Payload offsets.
    fields:
      - {name: "definition", offset: 0, length: 1, type: "uint8", description: "1-4. The app writes 4 (working slot). A G4 keeps Custom 1 in 2 and Custom 2 in 3."}
      - {name: "torque_sensing", offset: 1, length: 1, type: "uint8", description: "Non-zero = torque sensing. The app always writes 1."}
      - {name: "boost_level", offset: 2, length: 1, type: "uint8", description: "The app's 'boost' / power value. 0 in every preset. Meaning not established."}
      - {name: "pedalling_required", offset: 3, length: 1, type: "uint8", values: {"0": "pedalling required for assist", "1": "assist without pedalling allowed"}, description: "Region-dependent. Copy it, never set it."}
      - {name: "max_speed", offset: 4, length: 2, type: "uint16", endianness: "little", scale: 0.01, unit: "mph", description: "Speed ceiling for this definition. Region-dependent. Copy it, never set it."}
      - {name: "pedal_watts_start", offset: 6, length: 2, type: "uint16", endianness: "little", unit: "W", description: "Rider pedal effort at which the motor starts to assist."}
      - {name: "pedal_watts_full", offset: 8, length: 2, type: "uint16", endianness: "little", unit: "W", description: "Rider pedal effort for full motor assistance."}
    parse_rules:
      - "The preset in use is identified by the (pedal_watts_start, pedal_watts_full) pair of definition 4. See protocol_details.riding_modes.presets. Equal values mean Demand."
  ByteState:
    description: "Reply to read_lights_enable (opcode 0x3023) and read_lights_selector (opcode 0x3020). Payload byte 0."
    fields:
      - {name: "state", offset: 0, length: 1, type: "uint8", values: {"0": "off / disabled"}, description: "Any non-zero value is on / enabled."}
  DrlStatus:
    description: "Reply to read_drl, opcode 0x103b. Payload offsets. set_drl writes the same four positions, and 0xff leaves a position unchanged."
    fields:
      - {name: "drl_on", offset: 0, length: 1, type: "uint8", description: "Non-zero = DRL on. The app's (unused) direct DRL setter writes 0 here with 0xff in byte 2 for Off."}
      - {name: "flashing_allowed", offset: 1, length: 1, type: "uint8", description: "Non-zero = flashing modes permitted."}
      - {name: "current_mode", offset: 2, length: 1, type: "uint8", values: {"0": "low", "1": "low flashing", "2": "high", "3": "high flashing"}}
      - {name: "default_mode", offset: 3, length: 1, type: "uint8", values: {"0": "low", "1": "low flashing", "2": "high", "3": "high flashing", "5": "off"}, description: "The app shows any value outside 0-3 as Off, and writes 5 for Off."}
  MaxSpeed:
    description: "Reply to read_max_speed, opcode 0x2047. Payload offsets."
    fields:
      - {name: "max_speed", offset: 0, length: 2, type: "uint16", endianness: "little", scale: 0.01, unit: "mph"}
    parse_rules:
      - "The app labels a bike below 17 mph as EU EPAC, and one at 17-20 mph as US Class 1 (or Class 2 when AllowOnDemand is non-zero). The vendor's firmware article defines EPAC as 25 km/h (15.5 mph) with pedalling required, and US Class 1/2 as 20 mph."
  AllowOnDemand:
    description: "Reply to read_allow_on_demand, opcode 0x2049. Payload offsets."
    fields:
      - {name: "allow_on_demand", offset: 0, length: 2, type: "uint16", endianness: "little", values: {"0": "assist requires pedalling"}, description: "Non-zero = assist without pedalling (throttle) permitted."}
  FrameNumber:
    description: "Reply to read_frame_number, opcode 0x2022. Payload offsets. Unexercised by the app."
    fields:
      - {name: "frame_number", offset: 0, length: 4, type: "uint32", endianness: "little"}
  DiagnosticData:
    description: >
      Reply to read_diagnostic_data, opcode 0x204a. Payload offsets. The app
      reads bytes 16-23 only when the payload is over 16 bytes, and bytes
      24-39 only when it is over 24. The labels are the app's, and units
      are given where the app's scaling makes them clear.
    fields:
      - {name: "pedal_sensor_count", offset: 0, length: 4, type: "uint32", endianness: "little", description: "Crank sensor counts. The vendor says 8 per crank revolution. The app differences it as int32."}
      - {name: "wheel_sensor_count", offset: 4, length: 4, type: "uint32", endianness: "little", description: "4 per wheel revolution (vendor)."}
      - {name: "go_button_count", offset: 8, length: 2, type: "uint16", endianness: "little", description: "Boost-button / left-switch presses."}
      - {name: "torque_sensor", offset: 10, length: 2, type: "uint16", endianness: "little", description: "Torque sensor reading. On a G4 the app subtracts 500 as the zero point."}
      - {name: "gear", offset: 14, length: 2, type: "uint16", endianness: "little"}
      - {name: "battery_voltage", offset: 16, length: 2, type: "uint16", endianness: "little", scale: 0.001, unit: "V"}
      - {name: "speed_voltage_raw", offset: 18, length: 2, type: "uint16", endianness: "little", description: "Not shown as a labelled value. The app groups it with motor speed. Meaning and unit unknown."}
      - {name: "controller_temperature", offset: 20, length: 2, type: "int16", endianness: "little", scale: 0.01, unit: "C", description: "The app labels it controller 'degrees'. Temperature is inferred."}
      - {name: "motor_temperature", offset: 22, length: 2, type: "int16", endianness: "little", scale: 0.01, unit: "C", description: "The app labels it motor 'degrees'. Temperature is inferred."}
      - {name: "stator_resistance", offset: 24, length: 2, type: "uint16", endianness: "little", unit: "mΩ"}
      - {name: "stator_inductance", offset: 26, length: 2, type: "uint16", endianness: "little", unit: "µH"}
      - {name: "pedal_sensor_sin", offset: 28, length: 2, type: "uint16", endianness: "little"}
      - {name: "pedal_sensor_cos", offset: 30, length: 2, type: "uint16", endianness: "little"}
      - {name: "torque_sensor_adc", offset: 32, length: 2, type: "uint16", endianness: "little"}
      - {name: "motor_speed", offset: 34, length: 2, type: "uint16", endianness: "little", unit: "rpm"}
      - {name: "phase_current", offset: 38, length: 2, type: "uint16", endianness: "little", description: "Motor phase current by the app's grouping. Scale and unit unknown."}
  StressCounts:
    description: "Reply to read_stress_counts, opcode 0x3027. 24-byte payload of six float32 LE values."
    fields:
      - {name: "start_odometer", offset: 0, length: 4, type: "float32", unit: "mi"}
      - {name: "end_odometer", offset: 4, length: 4, type: "float32", unit: "mi"}
      - {name: "high_torque_events_per_mile", offset: 8, length: 4, type: "float32"}
      - {name: "high_deceleration_events_per_mile", offset: 12, length: 4, type: "float32"}
      - {name: "skids_per_mile", offset: 16, length: 4, type: "float32"}
      - {name: "odometer", offset: 20, length: 4, type: "float32", unit: "mi"}

protocol_details:
  framing:
    description: >
      The BGX module is a transparent serial bridge, so the "protocol" is a
      byte stream of frames in both directions. The client-to-bike direction
      on BLE always uses the 0x40 long frame. The bike-to-client direction
      uses the 0x40 long frame and, in some acknowledgements, the 0x21 short
      frame. See payload_formats.FrameEnvelope and ShortFrame.
    checksum: "uint16 LE, sum of all bytes after the start byte through the end of the payload, modulo 65536"
    opcode_byte_order: >
      Little-endian on the BLE wire. Internally the app holds opcodes as
      big-endian byte pairs, and that is also how it writes them on the
      Classic path, so do not copy byte order between the two transports.
    flagged_opcodes:
      description: >
        On send, the app ORs 0x8000 into these opcodes, and on receive it
        masks bit 15 off every opcode. The documented ones are 0x2021
        (motor-controller version), 0x2022 (frame number), 0x2031 (dash
        data), 0x2035 (get mode definition), 0x2036 (set mode definition),
        0x203f (trip reset), 0x2047 (read max speed) and 0x2049 (read
        on-demand permission). A few omitted writes and one unused read are
        flagged as well. What the bit means is a hypothesis: every flagged
        opcode concerns the motor controller, and the junction-box version
        read is not flagged, so it may route the frame past the junction box
        to the motor controller.
      verification: "hypothesis"
    test_vectors:
      - {frame: "40 00 00 31 a0 d1 00", decodes_to: "opcode 0x2031 (dash data, bit 15 set), empty payload, checksum 0x00d1 = 0x00+0x00+0x31+0xa0"}
      - {frame: "40 01 00 35 a0 04 da 00", decodes_to: "opcode 0x2035, payload [04], checksum 0x00da"}
      - {frame: "40 04 00 3c 10 ff 01 ff ff 4e 03", decodes_to: "opcode 0x103c (set DRL), payload [ff 01 ff ff], checksum 0x034e"}
      - {frame: "21 02 01 3c 10 4f", decodes_to: "short-form ACK of opcode 0x103c, checksum 0x4f = 0x02+0x01+0x3c+0x10"}
  opcode_table:
    description: >
      Opcodes this spec documents, with their role in our own words. "Reply"
      is the opcode the bike answers with. The app also defines opcodes it
      never sends, and those are listed with what little is known. Opcodes
      for omitted operations are deliberately not numbered here (see
      omitted_operations).
    entries:
      - {opcode: "0x0000", role: "NACK (payload: opcode refused)", direction: "bike to client"}
      - {opcode: "0x0001", role: "ACK (payload: opcode acknowledged); also sent by the client during log upload", direction: "both"}
      - {opcode: "0x1002", role: "identify unit (reply 0x1003)", declared_as: "read_id"}
      - {opcode: "0x1008", role: "text block (log upload data)", direction: "bike to client"}
      - {opcode: "0x1009", role: "select active mode definition", declared_as: "activate_mode_slot"}
      - {opcode: "0x100a", role: "get active mode (reply 0x100b, payload byte 0 = mode). Defined, never sent by this app build", direction: "client to bike"}
      - {opcode: "0x103a", role: "get DRL status (reply 0x103b)", declared_as: "read_drl"}
      - {opcode: "0x103c", role: "set DRL fields (0xff = unchanged)", declared_as: "drl_flash_on/off, drl_default_*"}
      - {opcode: "0x2011", role: "log end", direction: "bike to client"}
      - {opcode: "0x2021", role: "motor-controller version (flagged)", declared_as: "read_mc_version"}
      - {opcode: "0x2022", role: "frame number read (flagged)", declared_as: "read_frame_number"}
      - {opcode: "0x2024", role: "battery voltage read (flagged). Defined, never sent by this app build; reply layout unknown"}
      - {opcode: "0x2025", role: "battery LEDs read. Defined, never sent; reply layout unknown"}
      - {opcode: "0x2026", role: "junction-box version", declared_as: "read_jb_version"}
      - {opcode: "0x2031", role: "dash data (flagged)", declared_as: "read_dash_data"}
      - {opcode: "0x2033", role: "log upload response: bytes to expect", direction: "bike to client"}
      - {opcode: "0x2035", role: "get mode definition (flagged)", declared_as: "read_mode_definition_*"}
      - {opcode: "0x2036", role: "set mode definition (flagged). Documented, not framed", declared_as: "set_mode_definition"}
      - {opcode: "0x2037", role: "get mode names. Defined, never sent; layout unknown"}
      - {opcode: "0x203a", role: "start log upload", declared_as: "protocol_details.log_upload"}
      - {opcode: "0x203f", role: "trip reset (flagged)", declared_as: "reset_trip"}
      - {opcode: "0x2047", role: "read max speed (flagged)", declared_as: "read_max_speed"}
      - {opcode: "0x2049", role: "read on-demand permission (flagged)", declared_as: "read_allow_on_demand"}
      - {opcode: "0x204a", role: "diagnostic counters", declared_as: "read_diagnostic_data"}
      - {opcode: "0x204b", role: "hardware type", declared_as: "read_gocycle_type"}
      - {opcode: "0x3013", role: "predictive shifting on/off", declared_as: "predictive_shifting_on/off"}
      - {opcode: "0x3020", role: "get lights selector", declared_as: "read_lights_selector"}
      - {opcode: "0x3021", role: "set lights selector", declared_as: "lights_selector_on/off"}
      - {opcode: "0x3022", role: "set integrated lights", declared_as: "lights_on/off"}
      - {opcode: "0x3023", role: "get integrated lights", declared_as: "read_lights_enable"}
      - {opcode: "0x3027", role: "stress counts", declared_as: "read_stress_counts"}
    trip_reset_variants: >
      Opcode 0x203f takes a flag per counter group. The app sends
      [01 01 01 01 01] to reset the trip, [00 01 00 00] to reset calories,
      [00 00 01 00] to reset moving time, and [00 00 00 01] to reset motor
      energy. Only the first is used by the current screens. Which byte maps
      to which counter in the five-byte form is inferred from the four-byte
      forms.
  omitted_operations:
    description: >
      Defined by the app and deliberately NOT given opcodes or bytes here,
      on safety, legal-classification, anti-theft or bricking grounds. Their
      existence is recorded so nobody mistakes the gap for ignorance.
    entries:
      - "Setting the maximum assisted speed. The app also carries region presets that write it together with the throttle permission."
      - "Setting whether assist without pedalling (throttle / On Demand) is permitted."
      - "Setting a miles limit (the demo / Delivery State limit) and a time limit."
      - "Writing the frame number."
      - "Putting the bike into or out of Factory State."
      - "Locking and unlocking the junction box and the motor controller."
      - "Marking the bike not stolen (the anti-theft flag behind the 9-beep code)."
      - "Setting or clearing the pending dealer-review flag and resetting the service state."
      - "Clearing the bike's log."
      - "Firmware update: begin, write block, block acknowledgement, end, CRC query, run-application, reset and kill-application-and-reset, and the pass-through used to reach a second controller during updates."
      - "Writing the controllers' parameter memory, and reading it raw."
      - "Service actions: motor test, hall-sensor and torque zero calibration, ratio check, lights test, flash test, test slider, stress-count reset, diagnostic LED control."
      - "Sending a command to the Bluetooth module itself (a passthrough to the radio's command shell)."
  riding_modes:
    description: >
      What the app's four mode buttons do. They do not select a numbered
      mode. Each one writes a pedal-power curve into mode definition 4 and
      then activates definition 4. The vendor's firmware notes describe the
      older four-slot layout as Mode 1 City, Mode 2 Eco, Mode 3 On Demand
      and Mode 4 Custom. On a G4 the app uses 4 as its working slot and
      keeps the user's two custom modes in 2 and 3.
    presets:
      - {name: "City", pedal_watts_start: 50, pedal_watts_full: 400, notes: "Classic-path bikes: 0 / 400."}
      - {name: "Eco", pedal_watts_start: 200, pedal_watts_full: 600}
      - {name: "Turbo", pedal_watts_start: 50, pedal_watts_full: 200, notes: "Classic-path bikes: 0 / 150."}
      - {name: "Demand", pedal_watts_start: 600, pedal_watts_full: 600, notes: "The app identifies Demand by the two values being equal."}
    unit: "W"
    app_sequence:
      - "Build the definition-4 payload: [04, 01, 00, pedalling_required, max_speed lo, max_speed hi, start lo, start hi, full lo, full hi]."
      - "The app fills pedalling_required and max_speed from the region on the bike's cloud build record (EU: pedalling required and the 25 km/h EPAC ceiling; elsewhere the 20 mph US ceiling with pedalling not required). It does not read them from the bike."
      - "Send it as opcode 0x2036 (flagged), then send activate_mode_slot (opcode 0x1009, payload [03])."
      - "A custom mode: the G4 writes the same record to definition 2 or 3 as well as 4, carrying the user's own speed, boost and wattages, capped in the editor by read_max_speed."
    safe_client_recipe:
      - "Only with the bike stopped (vendor manual warning)."
      - "Send read_mode_definition_active and keep the whole reply payload."
      - "Replace bytes 6-9 (pedal_watts_start, pedal_watts_full) with the chosen preset. Keep bytes 0-5 exactly as read (definition 4, torque flag, boost, pedalling_required, max_speed)."
      - "Frame it as opcode 0xa036 with the 16-bit checksum and write it. Expect an opcode-0x2036 echo."
      - "Send activate_mode_slot and expect an ACK carrying 0x1009."
      - "Read definition 4 again to confirm."
    verification: "reported"
    notes: >
      The safe recipe differs from the app in one way: it copies the speed
      and pedalling fields from the bike, where the app writes the region
      values from the cloud. If definition 4 held a custom mode with a lower
      user speed, the recipe keeps the lower speed. It can never raise a
      ceiling. The app offers no "Turbo" row in the G4 manual's mode table,
      and City+ (named in the manual) has no button in this app build.
  log_upload:
    description: >
      The bike's sensor and settings log, which the app's Log Upload screen
      pulls over BLE and forwards to Gocycle. It is read-only on the bike
      side, and no declared command covers it, because it needs a
      per-block acknowledgement loop.
    sequence:
      - "Client sends opcode 0x203a with a uint32 LE byte budget. The app sends 200000: frame 40 04 00 3a 20 40 0d 03 00 ae 00."
      - "Bike answers opcode 0x2033 with a uint32 LE count of log bytes to expect."
      - "Bike sends opcode 0x1008 frames, whose payload is ASCII log text. The client acknowledges each with an ACK frame carrying 0x1008: 40 02 00 01 00 08 10 1b 00."
      - "Bike sends opcode 0x2011 at the end. The app also gives up after 5 s without a block."
    verification: "reported"
  bgx_module:
    description: >
      Facts about the Silicon Labs BGX13 radio module that decide client
      behaviour. They come from Silicon Labs' public Gecko OS BGX
      documentation and are module defaults, not confirmed Gocycle settings.
    streaming: "Peripheral RX (write to the bike's serial side), Peripheral TX (notify from it), Mode (1 stream / 2 local command / 3 remote command). 1-250 bytes per characteristic value."
    flow_control: >
      Enabling notifications on Peripheral RX selects Fast-Ack flow control.
      The module then sends 3-byte control messages on RX (0x00 + uint16 LE
      initial buffer size, 0x01 + uint16 LE bytes freed) and expects the
      central to respect the window. Leaving RX notifications off and using
      Write with response selects legacy flow control. That is the state
      the vendor app ends up in.
    security: "The streaming and OTA services require an encrypted link. The module requests bonding by default and stores up to 14 bonds, least recently used first out. Just Works and 6-digit passkey are both supported."
    ota: "The module has its own Silicon Labs OTA service for the module firmware. The vendor app never uses it, and the bike's firmware is updated through the framed opcodes instead."
  classic_legacy_path:
    description: >
      Summary only, not a specification. G2, G3, G3+, G3C, GS, GX and GXi
      bikes (any cloud model code not starting "G4") are reached over
      Bluetooth Classic.
    transport: "SPP, 00001101-0000-1000-8000-00805f9b34fb. On Android the app uses the open-source cordova BluetoothSerial plugin: a secure RFCOMM socket to SPP, falling back to channel 1."
    discovery: "Only from the phone's list of already-paired devices. Pair the bike in the OS Bluetooth settings first. Its name is also 'Gocycle' + frame number."
    host_to_bike: >
      The app writes bare [opcode high byte, opcode low byte, payload ...]:
      big-endian opcode, and no 0x40 start byte, length or checksum. No
      source says whether the bike accepts that form or whether some layer
      adds an envelope. It works for the app, but that is all that is known.
    bike_to_host: "Parsed by the same 0x40 / 0x21 frame parser as the BLE path."
    firmware: "A separate 'Classic Bluetooth' update path, with junction-box and motor-controller images the app downloads from the vendor's servers. Not described further here."
    ios: "Not established. The Android plugin is RFCOMM, and CoreBluetooth exposes no RFCOMM, so whether the iOS app reaches these bikes at all is an open question."
  app_quirks:
    - "The app subscribes to Peripheral RX, then immediately unsubscribes and subscribes to Peripheral TX. A promise is invoked instead of passed, so the three steps race. It works because RX notifications end up off."
    - "The set-time command (Unix time and timezone offset) and the frame-number read are called with their arguments shifted and never reach the bike."
    - "Frames over 150 bytes are split into 256-byte writes, above the BGX 250-byte characteristic limit."
    - "The receive parser does not consume stray bytes before a start byte correctly, so one corrupt notification can desynchronise it until reconnect. That may contribute to the connection complaints in store reviews."
    - "The app builds the speed field of every mode selection from the cloud region, not from the bike, so a bike whose region record is missing gets the EU values."
    - "The app requires sign-in, ownership of the frame number in the cloud, and (for a new bike) registration before it will connect. Store reviews complain of re-registration on reinstall, of failing to connect at all, and of needing to forget and re-pair."
  schema_gaps:
    - "The frame checksum is a 16-bit little-endian additive sum. The BLE `auto` vocabulary has only 8-bit sums and CRCs, so every command here is a precomputed fixed frame, and the mode-definition write cannot be declared as a template. A `sum16_le` role (and a payload-only `packet_length`) would let it be."
    - "A notify characteristic here carries a dozen reply types keyed by a 2-byte opcode. `format_match` takes one byte and a characteristic takes one `format`, so only the dash frame is decodable declaratively. Per-opcode formats would bind the lights, DRL and mode-definition states."
    - "A BLE parameter cannot say 'read this back from the device and send it unchanged' (`source` is credential-only on BLE). The mode-definition write needs exactly that, for its speed and pedalling fields."

evidence:
  app_static_analysis: >
    GocycleConnect (com.gocycle.Gocycle) 9.6.2, a Capacitor app whose bike
    logic is plain JavaScript in the web bundle. Read directly: the frame
    builder (start byte, length, opcode byte order, the bit-15 set, the
    16-bit checksum, >150-byte chunking), the receive parser (both frame
    types, checksum, and every reply layout in payload_formats), the opcode
    table, the scan filter and name parsing, the subscribe sequence, the
    riding-mode buttons and presets, the lights, DRL, lights-selector and
    predictive-shifting screens, the trip reset on ride start, the
    diagnostics screen, the log upload, the firmware updater's structure,
    and the model routing between BLE and the Classic serial plugin. The
    Android native side was checked only to confirm the serial plugin
    (SPP UUID, secure socket) and the Bluetooth permissions.
  documentation_review: >
    Gocycle product manuals (G4 and G4i/G4i+, August 2024; GX 2020; G3/G3+)
    for the riding-mode behaviour, the custom-mode fields, the battery-on
    requirement for Bluetooth and the Factory/Delivery State. Gocycle
    help-centre articles for the Bluetooth reset, connecting several
    phones, Factory and Delivery State, beep codes, app diagnostics, the
    firmware versions (region classes) and the firmware changelog, and the
    forced firmware update. Silicon Labs Gecko OS BGX documentation for
    the streaming service, the Mode values, flow control and pairing
    defaults.
  negative_findings: >
    No Home Assistant "gocycle" integration or other open-source Gocycle
    client could be found. An earlier research note claimed one. No FCC
    grant is indexed under Gocycle or Karbon Kinetics, and no manual prints
    an FCC ID. The app never touches the Silicon Labs OTA UUIDs in its name
    table. The app has no code for the CX/CXi cargo bikes.
  open_questions: >
    Everything here is app-derived and unreplayed. The first GATT session
    against a G4 should confirm the service and characteristic layout, the
    pairing model, whether the dash frame arrives whole in one notification
    at the negotiated MTU, and the dash payload length on current firmware.
    See remaining_unknowns.
  artifacts:
    - type: "static_analysis"
      artifact: "GocycleConnect (com.gocycle.Gocycle) 9.6.2, Android XAPK"
      obtained_via: "third-party APK mirror, 2026-09"
      description: >
        Established the whole BLE surface in this spec. Negative findings:
        no link-layer or application crypto in the app, no use of the
        Silicon Labs OTA service, and no CX model handling.
    - type: "vendor_documentation"
      artifact: "Gocycle G4 and G4i/G4i+ product manuals (EN, August 2024)"
      obtained_via: "Gocycle help-centre attachments, 2026-09"
      description: "Riding modes, custom-mode fields, battery and Bluetooth power, Factory and Delivery State."
    - type: "vendor_documentation"
      artifact: "Gocycle help-centre articles (Bluetooth reset, multiple devices, Factory/Delivery State, beep codes, diagnostics, firmware versions, forced update)"
      obtained_via: "Zendesk Help Center API, 2026-09"
      description: "Pairing behaviour, recovery procedures, region classes and state machine."
    - type: "vendor_documentation"
      artifact: "Silicon Labs Gecko OS BGX13 documentation (BLE services, security)"
      url: "https://docs.silabs.com/gecko-os/1/bgx/latest/ble-services"
      description: "Identified the service as the stock BGX13 Xpress Streaming Service and supplied the module's flow-control and pairing defaults."

remaining_unknowns:
  - "No GATT dump of a Gocycle. The characteristic properties are the BGX module's documented ones, and whether the bike also exposes the Silicon Labs OTA service is unknown."
  - "Pairing: whether Gocycle left the BGX defaults (encryption required, bonding, Just Works) or changed them. The Bluetooth-reset article implies stored bonds, but nothing states the association model."
  - "Whether a dash frame (67 bytes on current firmware, by the app's field offsets) arrives in one notification at the MTU a phone negotiates, and how the BGX module splits it otherwise."
  - "Dash payload bytes 4-9, 14-15, 17-19, 26-27, 30-35 and 57 are not read by the app. The exact payload length per firmware is not known."
  - "Whether battery_current can go negative or reflects charging, and whether trip_calories is kcal."
  - "The meaning of dash miles_limit -2, and of the mode definition's boost byte."
  - "What the 0x8000 opcode flag does (hypothesis: route to the motor controller)."
  - "Whether the activate-mode index is 0-based (3 selects definition 4), and what the bike does if definition 4 is written without re-activating."
  - "What the bike answers to set commands other than lights on/off and set-mode (ACK, NACK, echo or nothing)."
  - "Whether the short 0x21 frame ever appears on the BLE path."
  - "Which marketing model each hardware-type value (1-5) is, and whether G4 'Mk2' builds differ on the wire."
  - "Whether the CX/CXi cargo bikes are G4-family BLE bikes. The app has no code for them."
  - "The 'Lights: Auto' state seen in an older app screenshot has no counterpart in the analysed build, which offers only on/off."
  - "Whether the junction-box version read answers on a G4. The current app sends it only on the Classic path."
  - "Whether the Classic path's bare, un-enveloped writes are really what the older bikes accept."
  - "Whether the bootloader verifies anything beyond a CRC, and what an interrupted G4 update leaves behind."

