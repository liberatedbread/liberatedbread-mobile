# LimitlessLED / Mi-Light WiFi Bridge (legacy v1-v5) — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "LimitlessLED / Mi-Light WiFi Bridge (legacy)"
  manufacturer: "LimitlessLED / Mi-Light (Futlight)"
  manufacturer_status: "abandoned"
  testing:
    status: "verified"
    detail: "minimally-verified"
    notes: >
      Hardware, 2026-08-19, against a live legacy (v1-v5) bridge on the
      research LAN: the UDP 48899 discovery exchange was replayed end to end
      (the "HF-A11ASSISTHREAD" probe returned the ASCII CSV
      `ip,mac,HF-LPB130`) and the TCP 8899 control port was confirmed to
      accept a connection. That is the whole of what was exercised, hence
      "minimally-verified": the byte-level command tables are transcribed
      from public sources (the published LimitlessLED developer
      documentation mirror and python-ledcontroller) and were deliberately
      NOT replayed, because every legacy command is write-only and any probe
      would have toggled the owner's paired lights. The v6/iBox layout is
      unverified — the observed bridge does not answer it.
  protocol: "wifi"
  category: "hub"
  transport: "udp"
  notes: >
    The LimitlessLED/Mi-Light WiFi bridge (sold 2012-2017 under LimitlessLED,
    Mi-Light, Easybulb, applight and other brands) relays LAN commands to
    2.4 GHz RF bulbs (RGB, dual-white, RGBW, RGBW/WW-CW): WiFi -> UART ->
    MCU -> SPI -> PL1176/LT8900-class transceiver. Two LAN generations exist.
    LEGACY (v1-v5, the unit this spec was verified against): control is a
    3-byte command datagram `<cmd> 0x00 0x55` on port 8899 (UDP per the
    published docs; TCP 8899 also listens on the observed unit). V6 ("iBox",
    2016+): control moves to UDP 5987 behind a session handshake with a
    checksummed 22-byte frame; the v6 layout is included under
    limitlessled_protocol.v6 for completeness but the observed bridge does not
    answer it. Discovery for all generations is a UDP 48899 broadcast probe:
    "Link_Wi-Fi" (v1-v5) or "HF-A11ASSISTHREAD" (later firmware, including the
    observed legacy unit); the reply is an ASCII CSV `ip,mac,module`, e.g.
    `192.168.1.194,34EAE7AABBCC,HF-LPB130`. The legacy protocol is write-only
    (no status/read command), so the byte-level command tables are transcribed
    from public sources (the published LimitlessLED developer documentation
    mirror and python-ledcontroller) and were NOT replayed against the user's
    bridge — any probe would toggle its paired lights. Discovery and transport
    (TCP 8899 connect, UDP 48899 discovery exchange) are hardware-verified
    against a live bridge on 2026-08-19; see the evidence block.

  identification:
    # The module OUI is shared across High-Flying-based products, so MAC alone
    # is a weak signal; the strong signal is the discovery reply string below.
    ssid_prefix: "milight"
    ssid_examples: ["milight", "HF-LPB130"]
    default_port: 8899
    identity_keys:
      primary: "mac"
      display: "name"

  discovery:
    methods:
      - type: "udp_broadcast"
        udp_broadcast:
          port: 48899
          broadcast_address: "255.255.255.255"
          # ASCII "HF-A11ASSISTHREAD" — answered by later legacy firmware and
          # by v6 bridges. Hardware-verified against the observed unit.
          probe_hex: "48462D4131314153534953544852454144"
          passive_ok: false
          identity_mapping:
            stable_keys:
              - source: "csv:1"
                key: "mac"
            display:
              source: "csv:2"
        notes: >
          Reply is a single ASCII CSV line from source port 48899:
          `ip,mac,module` — verified live: `192.168.1.194,34EAE7AABBCC,HF-LPB130`.
          Collect replies for ~1 s; each bridge on the segment answers once.
          (The schema's response_format enum has no ASCII-CSV value, so the
          shape is documented here.)
      - type: "udp_broadcast"
        udp_broadcast:
          port: 48899
          broadcast_address: "255.255.255.255"
          # ASCII "Link_Wi-Fi" — the v1-v5 discovery string from the published
          # docs. The observed legacy unit did NOT answer it (its firmware
          # answers only the HF-A11 string above), so treat a silent reply as
          # inconclusive and always try both probes.
          probe_hex: "4C696E6B5F57692D4669"
          passive_ok: false
          identity_mapping:
            stable_keys:
              - source: "csv:1"
                key: "mac"
            display:
              source: "csv:2"
        notes: >
          v1-v5 bridges reply `ip,mac,` (empty name field; two commas always
          present). Unicast to a suspected bridge address also works.
    identity:
      stable_keys: ["mac"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      The bridge must be joined to the home WiFi before LAN control works.
      Public v6 docs describe joining the bridge's own setup AP and driving a
      web UI at 10.10.100.254 (default login admin/admin) to switch the
      module from AP to STA mode and hand over the router SSID/passphrase;
      the same High-Flying module web UI pattern applies to the legacy units.
      Bulbs are paired to the bridge AFTER it is on the LAN: send a zone's ON
      command within ~3 s of powering the bulb (public docs; the v6 docs call
      this the link command 0x3D). Not hardware-verified by this project.
    methods:
      - type: "softap_http"
        verified: false
        description: >
          Join the bridge's setup AP (a milight/HF-module-named open network),
          browse to http://10.10.100.254 (default credentials admin/admin per
          the published docs), set Work Mode to STA, pick the home network,
          enter its passphrase (WPA2PSK/AES), and restart. The bridge drops
          its AP and joins the home network; find it again with the UDP 48899
          discovery probes.
        softap:
          ssid_prefix: "milight"
          ssid_examples: ["milight", "HF-LPB130"]
          open_network: true
          gateway_ip: "10.10.100.254"
          port: 80
          ssid_notes: >
            Setup AP naming varies by module generation (milight* on retail
            units, HF-* on some); treat any open AP whose gateway serves the
            High-Flying web UI at 10.10.100.254 as a candidate.
        steps:
          - action: "Power the bridge and wait for its setup AP."
            actor: "user"
            timeout_seconds: 60
            expect: "An open AP (milight*/HF-*) appears; the bridge sits at 10.10.100.254."
          - action: "Join the setup AP from the provisioning client."
            actor: "user"
            expect: "Client receives an address on the setup subnet."
          - action: "Open http://10.10.100.254, log in (admin/admin), set Work Mode = STA, choose the home SSID, enter its passphrase, save and restart."
            actor: "user"
            request:
              protocol: "http"
              message: "High-Flying module web UI form posts (exact field names not captured)"
            expect: "The setup AP disappears; the bridge joins the home network."
            timeout_seconds: 60
          - action: "Rediscover the bridge on the home LAN."
            actor: "client"
            request:
              protocol: "udp"
              message: "Broadcast 'HF-A11ASSISTHREAD' (and/or 'Link_Wi-Fi') to UDP 48899"
            expect: "A CSV reply `ip,mac,module` from the bridge."
            timeout_seconds: 5
    factory_reset:
      confidence: "low"
      effect: "Returns the bridge's WiFi module to AP mode (clears the home-network credentials); paired-bulb links are stored per-zone and survive in typical reports."
      procedures:
        - name: "Module reset via web UI or RST pad"
          steps:
            - action: "From the module web UI (10.10.100.254 on the setup AP), use the management/restore page, or hold the hardware reset button if the unit exposes one."
              actor: "user"
            - action: "Wait for the setup AP to reappear."
              actor: "device"
              timeout_seconds: 60
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The module web UI can change the STA credentials without a full reset,
        but reaching it requires joining the setup AP — which the module only
        hosts while it cannot see its configured network. If the old network
        is simply renamed/off, power-cycle the bridge and it falls back to AP
        mode; reprovision from there.
    credentials:
      wifi_passphrase_protection: "plaintext"
      stored_on_device:
        - "WiFi credentials"
      issued_to_client: []
      notes: >
        Provisioning sends the router passphrase in plaintext HTTP posts to the
        module web UI (Basic-auth protected only after the default
        admin/admin is changed). Post-setup LAN control is completely
        unauthenticated — anything on the LAN that can reach port 8899 (or
        5987 on v6) can drive every paired light.

protocol_handler: "limitlessled_legacy_8899"

limitlessled_protocol:
  transport: "udp"
  port: 8899
  tcp_also_listens: true
  authentication: "none"
  reply_to_commands: "none — the legacy protocol is write-only"
  legacy_command_frame:
    description: >
      Every legacy (v1-v5) command is exactly 3 bytes: the command byte, the
      argument byte (0x00 for all commands except brightness and color), and
      the constant terminator 0x55. Send to UDP 8899 (TCP 8899 also accepts
      them on the observed unit). Repeat safe commands ~3 times with a
      >=100 ms pause between sends — the bridge-to-bulb RF hop drops packets
      and there is no acknowledgement, so retries-with-pacing is the
      documented reliability strategy (python-ledcontroller defaults).
  rgbw_commands:
    notes: >
      RGBW bulbs (the most common pairing). Zone = the group paired in the
      vendor app; "all" addresses every paired group. Night mode per the
      published docs: send OFF, then ~100 ms later send OFF|0x80 (e.g. zone 1:
      46 00 55 then C6 00 55).
    all_on: "42 00 55"
    all_off: "41 00 55"
    all_white: "C2 00 55"
    all_nightmode: "C1 00 55"
    disco_mode_cycle: "4D 00 55"
    disco_faster: "44 00 55"
    disco_slower: "43 00 55"
    set_brightness: "4E <level> 55 — level 0x02 (min) .. 0x1B (max)"
    set_color: "40 <hue> 55 — hue 0x00=violet .. 0xF0=lavender in 0x10 steps (0xB0 red, 0x60 green, 0x10 royal blue); color wheel starts at violet"
    zone_on: ["45 00 55", "47 00 55", "49 00 55", "4B 00 55"]
    zone_off: ["46 00 55", "48 00 55", "4A 00 55", "4C 00 55"]
    zone_to_white: ["C5 00 55", "C7 00 55", "C9 00 55", "CB 00 55"]
    zone_nightmode: ["C6 00 55", "C8 00 55", "CA 00 55", "CC 00 55"]
  dual_white_commands:
    notes: >
      Dual-white (warm/cool white) bulbs use a different command page.
      Brightness and color-temperature are relative steps, not absolute.
    all_on: "35 00 55"
    all_off: "39 00 55"
    all_full_brightness: "B5 00 55"
    all_nightmode: "B9 00 55"
    warmer: "3E 00 55"
    cooler: "3F 00 55"
    brightness_up: "3C 00 55"
    brightness_down: "34 00 55"
    zone_on: ["38 00 55", "3D 00 55", "37 00 55", "32 00 55"]
    zone_off: ["3B 00 55", "33 00 55", "3A 00 55", "36 00 55"]
    zone_full_brightness: ["B8 00 55", "BD 00 55", "B7 00 55", "B2 00 55"]
    zone_nightmode: ["BB 00 55", "B3 00 55", "BA 00 55", "B6 00 55"]
  pairing:
    notes: >
      Bulbs pair to a bridge zone by powering the bulb and sending that zone's
      ON command within ~3 s (the bulb flashes to confirm). Unlink a zone by
      powering the bulb and sending zone ON five times within the same 3 s
      window. FAQ-level public docs; not hardware-verified by this project.
  v6:
    notes: >
      The v6 ("iBox") generation — included so a consumer can recognize and
      drive it, but the observed legacy bridge does NOT answer any of this
      (verified: no reply to the session init on UDP 5987 or 8899, unicast or
      broadcast, with either published trailer variant D3 E6 / FE F7).
    port: 5987
    session_init: "20 00 00 00 16 02 62 3A D5 ED A3 01 AE 08 2D 46 61 41 A7 F6 DC AF D3 E6 00 00 1E"
    session_init_response: "28 00 00 00 11 00 02 <mac:6> <4 bytes> 00 01 <session_id1> <session_id2> 00 — session ids at bytes 19-20"
    command_frame: "80 00 00 00 11 <wb1> <wb2> 00 <seq> 00 <cmd:9 bytes> <zone 0-4> 00 <checksum>; checksum = sum of the last 11 bytes (cmd + zone + 00) & 0xFF; ack = 88 00 00 00 03 00 <seq> 00"
    keepalive: "D0 00 00 00 02 <wb1> <wb2> every ~5 s; reply D8 00 00 00 07 <mac:6> 01"
    rgbw_ww_cw_command_page: "31 00 00 08 <op> <arg> 00 00 00 (op 04 arg 01=on/02=off/05=night, 05 64=white, 01 hue x4, 02 saturation 00-64, 03 brightness 00-64, 05 kelvin 00-64, 06 mode 01-09); link 3D 00 00 08 00..., unlink 3E ..."
    bridge_lamp_command_page: "31 00 00 00 ... (iBox's own built-in LED)"

payload_formats:
  legacy_command:
    description: >
      The universal legacy 3-byte frame sent to UDP/TCP 8899. All command
      tables under limitlessled_protocol use this frame.
    fields:
      - {name: command, offset: 0, bytes: 1, description: "Command byte; see rgbw_commands / dual_white_commands."}
      - {name: argument, offset: 1, bytes: 1, description: "0x00 except: brightness level (0x02-0x1B) for 0x4E, hue (0x00-0xFF) for 0x40."}
      - {name: terminator, offset: 2, bytes: 1, description: "Always 0x55."}

evidence:
  live_lan_probe:
    date: "2026-08-19"
    devices:
      - address: "192.168.1.194"
        mac: "34:EA:E7:AA:BB:CC"
        mac_oui: "Shanghai High-Flying Electronics"
        wifi_module: "HF-LPB130 (self-reported in discovery reply)"
        discovery: "UDP 48899 'HF-A11ASSISTHREAD' broadcast -> '192.168.1.194,34EAE7AABBCC,HF-LPB130' from :48899"
        discovery_negative: "No reply to 'Link_Wi-Fi' on UDP 48899 (broadcast or unicast)"
        tcp_8899: "Open; connects; no banner (client-speaks-first)"
        v6_negative: "No reply to the 27-byte v6 session init on UDP 5987 or UDP 8899 (unicast and broadcast, both published trailer variants)"
        http: "GET / -> 401, Server: HTTPD, Basic realm 'USER LOGIN', clock stuck at epoch"
    captures: "Probe scripts and transcripts (probe_bridge.py, probe_bridge2.py, probe-results.txt, RESEARCH.md) are held in the maintainers' private research workspace, not committed here."
  public_sources:
    - "LimitlessLED developer documentation mirror: github.com/BKrajancic/LimitlessLED-DevAPI (legacy + v6 protocol, discovery strings, checksum, keepalives)"
    - "python-ledcontroller: github.com/ojarva/python-ledcontroller (legacy RGBW and dual-white byte tables, pacing/retry guidance)"
    - "Home Assistant limitlessled integration (uses the same legacy command set via the ledcontroller library)"

http_endpoints:
  - method: "GET"
    path: "/"
    name: "Web Admin (Basic auth)"
    status: "active"
    description: >
      High-Flying module web UI. Verified to return 401 with Basic realm
      "USER LOGIN"; published default credentials are admin/admin (not tried
      against the user's bridge). Configuration UI only — light control is
      the byte protocol on 8899.

commands:
  turn_on:
    description: "Turn a zone (or all zones) on — legacy RGBW ON frame."
    transport: "udp"
    action: "legacy_command"
    arguments:
      command: "0x42 (all) or 0x45/0x47/0x49/0x4B (zone 1-4)"
      argument: 0
    notes: "Frame: <cmd> 00 55 to port 8899. Use the dual-white page (0x35 / 0x38,0x3D,0x37,0x32) for dual-white bulbs."
    verification: "reported"
  turn_off:
    description: "Turn a zone (or all zones) off."
    transport: "udp"
    action: "legacy_command"
    arguments:
      command: "0x41 (all) or 0x46/0x48/0x4A/0x4C (zone 1-4)"
      argument: 0
    notes: "Dual-white page: 0x39 / 0x3B,0x33,0x3A,0x36."
    verification: "reported"
  set_brightness:
    description: "Set RGBW brightness — command 0x4E with an absolute level."
    transport: "udp"
    action: "legacy_command"
    arguments:
      command: "0x4E"
      argument: "{level}"
    parameters:
      level:
        type: "uint8"
        min: 2
        max: 27
        description: "0x02 dimmest .. 0x1B brightest. Send a zone ON first; the level applies to the most-recently-addressed zone(s)."
    verification: "reported"
  set_color:
    description: "Set RGBW color — command 0x40 with a hue byte."
    transport: "udp"
    action: "legacy_command"
    arguments:
      command: "0x40"
      argument: "{hue}"
    parameters:
      hue:
        type: "uint8"
        min: 0
        max: 255
        description: "Color wheel starting at violet: 0x00 violet, 0x10 royal blue, 0x60 green, 0xB0 red, 0xF0 lavender."
    notes: "Send a zone ON first; hue applies to the most-recently-addressed zone(s)."
    verification: "reported"
  night_mode:
    description: "Very dim white — send OFF then, ~100 ms later, OFF|0x80."
    transport: "udp"
    action: "legacy_command_sequence"
    arguments:
      sequence: "<off_cmd> 00 55, then (<off_cmd>|0x80) 00 55 after 100 ms"
    notes: "Example zone 1 RGBW: 46 00 55 then C6 00 55."
    verification: "reported"

entities:
  - platform: "light"
    name: "Mi-Light RGBW Zone"
    features: ["brightness", "color"]
    state_topic: "udp://{host}:8899"
    commands:
      turn_on: "turn_on"
      turn_off: "turn_off"
      set_color: "set_color"
      set_brightness: "set_brightness"

helpful_urls:
  - url: "https://www.home-assistant.io/integrations/limitlessled/"
    title: "Home Assistant LimitlessLED integration"
    description: "HA core integration driving MiLight/LimitlessLED bridges with the UDP v6 protocol documented here."
