# WeatherFlow Tempest (local UDP) — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - WeatherFlow's own UDP API docs: https://weatherflow.github.io/Tempest/api/udp/v171/

device:
  name: "WeatherFlow Tempest Weather Station"
  manufacturer: "WeatherFlow-Tempest, Inc."
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The UDP port, message types
      and obs_st field order are from WeatherFlow's own published UDP API (v171).
  protocol: "wifi"
  category: "sensor"
  pictogram: "air-quality"
  transport: "udp"
  notes: >
    The WeatherFlow Tempest (and the legacy Air/Sky sensors) is a home weather
    station whose hub broadcasts JSON observation datagrams on the LAN — no cloud
    needed to receive them and no authentication. WeatherFlow publishes the local
    UDP API itself.

    TRANSPORT: JSON over UDP broadcast, port 50222. Passive: a client just
    listens; every message carries hub/device serial numbers.

    MESSAGE TYPES:
      rapid_wind   ~3 s wind speed (m/s) + direction (deg)
      obs_st       the Tempest combined observation (see fields below)
      obs_air / obs_sky   legacy Air / Sky sensor observations
      evt_precip   rain start;  evt_strike   lightning (distance km, energy)
      device_status  per-device health (bit-flag sensor status)
      hub_status     firmware revision, uptime, RSSI
    obs_st observation array (order): wind lull/avg/gust (m/s), wind direction
    (deg), station pressure (mb), air temperature (C), relative humidity (%),
    illuminance (lux), UV index, solar radiation (W/m^2), rain accumulation (mm),
    lightning strike distance/count, battery volts, report interval.

  openness:
    status: "documented_api"
    reverse_engineered: false
    upstream_docs:
      - url: "https://weatherflow.github.io/Tempest/api/udp/v171/"
        title: "WeatherFlow — Tempest UDP API v171"
        covers: "The UDP port, message types and the obs_st / rapid_wind / evt_* field layouts."
    notes: >
      This is the vendor's own local broadcast API, published deliberately for
      third-party clients (weewx, Home Assistant). Nothing here was
      reverse-engineered.

  identification:
    default_port: 50222

  discovery:
    methods:
      - type: "mdns"
        mdns:
          # No mDNS; discovery is passive — just listen on UDP 50222 for the hub
          # broadcasts. Placeholder block.
          service_type: "_http._tcp.local."
          port: 50222
          identity_mapping:
            stable_keys:
              - source: "udp:50222#serial_number"
                key: "serial_number"
            display:
              source: "udp:50222#hub_sn"
        notes: >
          Passive discovery: listen for UDP 50222 broadcasts; every datagram
          carries the hub and device serial numbers.
    identity:
      stable_keys: ["serial_number"]
      display: "serial_number"
    static_ip_required: false

  setup:
    required: true
    confidence: "low"
    notes: >
      The hub's Wi-Fi onboarding is app-driven (not part of the local UDP API);
      once the hub is on the LAN it broadcasts with no further setup and no
      account needed for local reads.
    methods:
      - type: "device_ui"
        verified: false
        description: >
          Onboard the hub onto Wi-Fi with the WeatherFlow app. After it joins the
          LAN it broadcasts observations on UDP 50222 with no further setup.
        steps:
          - action: "Onboard the hub onto Wi-Fi with the WeatherFlow app."
            actor: "user"
            expect: "The hub broadcasts obs_st / rapid_wind datagrams on UDP 50222."
    factory_reset:
      applicable: true
      confidence: medium
      effect: >
        On the hub, clears the saved WiFi connection and returns it to
        onboarding. On a Tempest or SKY sensor, drops its association with the
        hub and puts it back into pairing mode. Neither clears the observation
        history, which lives in the vendor's cloud rather than on the hardware.
      description: >
        Two different pieces of hardware with two different buttons, and it is
        worth being clear which one is being reset: the hub is the thing that
        holds the WiFi credentials and emits the UDP broadcasts this spec
        documents, while the sensors only talk to the hub. A sensor whose
        observations have stopped appearing needs the sensor procedure; a hub
        that needs to move to a new network needs the first one.
      procedures:
        - name: "Hub: clear the saved WiFi connection"
          glyph: "generic/pinhole-reset.svg"
          indicator_glyph: "generic/led-flashing.svg"
          verified: false
          basis: "WeatherFlow's Tempest instruction manual."
          power_state: "on"
          indicator: "The LED flashes."
          steps:
            - action: "With the hub powered, press and hold the reset button on the back using a toothpick or a straightened clip."
              actor: "user"
            - action: "Release when the LED flashes."
              actor: "user"
              expect: "The saved WiFi connection is cleared and the hub returns to onboarding."
        - name: "Hub: radio reset, held while power is applied"
          glyph: "generic/hold-button-while-powering-on.svg"
          indicator_glyph: "generic/led-flashing.svg"
          verified: false
          basis: "WeatherFlow's Tempest instruction manual, listed under sensors not reporting."
          power_state: "booting"
          indicator: "The blue LED on the back of the hub."
          steps:
            - action: "Disconnect the hub from power."
              actor: "user"
            - action: "Using a thin tool, press and hold the reset button on the back."
              actor: "user"
            - action: "Reconnect power while still holding the button."
              actor: "user"
            - action: "Wait for the blue LED on the back, then release."
              actor: "user"
              expect: "Blue LED on the back of the hub."
        - name: "Tempest or SKY sensor: back to pairing mode"
          glyph: "generic/hold-button.svg"
          indicator_glyph: "generic/led-flashing.svg"
          verified: false
          basis: "WeatherFlow's Tempest instruction manual."
          applies_to: ["Tempest", "SKY"]
          hold_seconds: 5
          power_state: "on"
          indicator: "The LED flashes green."
          steps:
            - action: "Press and hold the clear LED button on the base of the unit, next to the battery door, for about five seconds."
              actor: "user"
              notes: >
                On a SKY with the solar panel accessory fitted, reach the same
                button with a thin tool through the slot in the panel rather
                than removing it.
            - action: "Release when the LED flashes green."
              actor: "user"
              expect: "LED flashes green — the device is in pairing mode and can be re-added to the station."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "Wi-Fi is reconfigured through the app; local broadcasts resume once the hub rejoins."
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device:
        - "Wi-Fi credentials"
      issued_to_client: []
      notes: >
        The local UDP broadcast is unauthenticated and read-only; the Wi-Fi
        passphrase is handled by the app's onboarding, not the API documented
        here.

# UDP broadcast receive-only; http_endpoints is a placeholder for the access
# surface (there is no HTTP and no request/response — the client only listens).
http_endpoints:
  - method: "GET"
    path: "/"
    status: "placeholder"
    name: "Local API Placeholder"
    description: >
      Placeholder only. There is no HTTP surface: the hub broadcasts JSON
      observation datagrams on UDP port 50222, which a client passively receives.

payload_formats:
  obs_st:
    description: "Tempest combined observation: the 18-element array in obs[0]. Null means unavailable, not zero."
    fields:
      - {index: 0, name: "timestamp", unit: "s", description: "Observation epoch seconds; distinct from status timestamps."}
      - {index: 1, name: "wind_lull", unit: "m/s", description: "Minimum three-second wind sample."}
      - {index: 2, name: "wind_avg", unit: "m/s", description: "Average wind over the report interval."}
      - {index: 3, name: "wind_gust", unit: "m/s", description: "Maximum three-second wind sample."}
      - {index: 4, name: "wind_direction", unit: "deg"}
      - {index: 5, name: "wind_sample_interval", unit: "s", description: "3/6/60/300 maps to power-save modes 0/1/2/3; other values are unknown."}
      - {index: 6, name: "station_pressure", unit: "mbar", description: "Local station pressure, not sea-level-adjusted pressure."}
      - {index: 7, name: "air_temperature", unit: "C"}
      - {index: 8, name: "relative_humidity", unit: "%"}
      - {index: 9, name: "illuminance", unit: "lux"}
      - {index: 10, name: "uv", unit: "index"}
      - {index: 11, name: "solar_radiation", unit: "W/m2"}
      - {index: 12, name: "rain_previous_minute", unit: "mm", description: "Rain over the previous minute, not cumulative daily rain or rain over the whole report interval."}
      - {index: 13, name: "precipitation_type", description: "0 none, 1 rain, 2 hail, 3 rain+hail (experimental)."}
      - {index: 14, name: "lightning_average_distance", unit: "km", description: "Nullable; absent/no strikes is null."}
      - {index: 15, name: "lightning_strike_count", unit: "count"}
      - {index: 16, name: "battery_voltage", unit: "V", description: "Voltage, not an estimated battery percentage."}
      - {index: 17, name: "report_interval", unit: "min", description: "Zero is a value, not proof of nullness."}
    parse_rules:
      - "Require obs to be an array containing an 18-element observation before indexing it. Reject a short observation instead of raising an index error or inventing fields."
      - "Preserve null measurements as unavailable. Do not replace them with zero."
      - "Index 12 can derive an instantaneous rain rate in mm/h by multiplying by 60; it is not a trustworthy daily total."
      - "Rapid wind is instantaneous and distinct from index 2's report-interval average; do not overwrite one with the other."
      - "Station pressure is local measured pressure. Sea-level pressure requires a separate altitude-aware calculation."

  obs_air:
    description: "Legacy AIR observation: the eight-element array in obs[0]; do not apply obs_st offsets."
    fields:
      - {index: 0, name: "timestamp", unit: "s"}
      - {index: 1, name: "station_pressure", unit: "mbar"}
      - {index: 2, name: "air_temperature", unit: "C"}
      - {index: 3, name: "relative_humidity", unit: "%"}
      - {index: 4, name: "lightning_strike_count", unit: "count"}
      - {index: 5, name: "lightning_average_distance", unit: "km"}
      - {index: 6, name: "battery_voltage", unit: "V", description: "Client model uses volts; the vendor table leaves this unit blank."}
      - {index: 7, name: "report_interval", unit: "min"}
    parse_rules:
      - "Require all eight elements before indexing. AIR does not carry the complete Tempest field set."

  obs_sky:
    description: "Legacy SKY observation: the 14-element array in obs[0]; its rain field differs from Tempest."
    fields:
      - {index: 0, name: "timestamp", unit: "s"}
      - {index: 1, name: "illuminance", unit: "lux"}
      - {index: 2, name: "uv", unit: "index"}
      - {index: 3, name: "rain_previous_minute", unit: "mm"}
      - {index: 4, name: "wind_lull", unit: "m/s"}
      - {index: 5, name: "wind_avg", unit: "m/s"}
      - {index: 6, name: "wind_gust", unit: "m/s"}
      - {index: 7, name: "wind_direction", unit: "deg"}
      - {index: 8, name: "battery_voltage", unit: "V"}
      - {index: 9, name: "report_interval", unit: "min"}
      - {index: 10, name: "solar_radiation", unit: "W/m2"}
      - {index: 11, name: "rain_local_day_accumulation", unit: "mm", description: "Local-day total; unlike obs_st index 12, which is previous-minute rain."}
      - {index: 12, name: "precipitation_type", description: "0 none, 1 rain, 2 hail."}
      - {index: 13, name: "wind_sample_interval", unit: "s"}
    parse_rules:
      - "Require all 14 elements before indexing. Do not substitute local-day accumulation at index 11 for the previous-minute value at index 3."

  rapid_wind:
    description: "Instantaneous wind in the ob array, usually every three seconds unless power saving changes it."
    fields:
      - {index: 0, name: "timestamp", unit: "s"}
      - {index: 1, name: "speed", unit: "m/s"}
      - {index: 2, name: "direction", unit: "deg"}
    parse_rules:
      - "Require three elements and ignore reports older than the latest accepted rapid-wind timestamp."

  evt_strike:
    description: "Lightning event in the evt array. Energy is an opaque number without a documented physical unit."
    fields:
      - {index: 0, name: "timestamp", unit: "s"}
      - {index: 1, name: "distance", unit: "km", description: "Storm-leading-edge estimate, not necessarily the individual strike; 63 means out of range and becomes unavailable."}
      - {index: 2, name: "energy", description: "Opaque integer; clear bit 24 (1 << 24) to work around affected Tempest firmware, not a physical-unit conversion."}
    parse_rules:
      - "Require three elements. Emit only newer events and preserve energy as a number without assigning it a unit."

protocol_details:
  transport:
    port: 50222
    protocol: "UDP broadcast JSON"
    access: "passive receive only after separate app provisioning"
    authenticated: false
    serial_prefixes: {HB: "hub", AR: "AIR", SK: "SKY", ST: "Tempest"}
    identity_rule: "Use serial_number and type; hub_sn links sensors to a hub. Unknown serials or message types remain unknown."
  device_status_bits:
    0x0001: "lightning failed"
    0x0002: "lightning noise"
    0x0004: "lightning disturber"
    0x0008: "pressure failed"
    0x0010: "temperature failed"
    0x0020: "relative-humidity failed"
    0x0040: "wind failed"
    0x0080: "precipitation failed"
    0x0100: "light/UV failed"
    0x0200: "power booster detected"
    0x8000: "power booster depleted"
    0x10000: "power booster shore power"
  hub_status:
    reset_flags: [BOR, PIN, POR, SFT, WDG, WWD, LPW, HRDFLT]
    radio_status: {0: "off", 1: "on", 3: "active", 7: "BLE connected"}
    notes: "Radio/firmware/sequence/internal fields are diagnostics, not weather observations. Unknown status bits are retained for diagnostics but not presented as known faults."
  parser_requirements:
    - "Validate JSON shape and size, serial_number, type, array lengths, numeric ranges, nulls and timestamp ordering before updating state."
    - "A sensor is fully loaded only after both a status update and an observation, not after status alone."
    - "Keep observation timestamps separate from status timestamps and voltage/RSSI separate from derived battery percentage."
    - "Local UDP supplies current observations/events, not cloud history, forecast, calibration or an on-demand history endpoint."
  source_validation: >
    WeatherFlow v171 and the pinned pyweatherflowudp parser at c89fa2ae were
    reviewed on 2026-11-01. Its 49 tests and focused offline parser checks
    passed upstream; no physical station was accessed for this update.

entities:
  - platform: "sensor"
    name: "Temperature"
    device_class: "temperature"
    unit: "C"
  - platform: "sensor"
    name: "Wind Speed"
    unit: "m/s"
  - platform: "sensor"
    name: "Humidity"
    device_class: "humidity"
    unit: "%"
  - platform: "sensor"
    name: "Pressure"
    device_class: "atmospheric_pressure"
    unit: "mbar"

helpful_urls:
  - title: "WeatherFlow — Tempest UDP API v171"
    url: "https://weatherflow.github.io/Tempest/api/udp/v171/"
    description: "The vendor's own local UDP broadcast API (port 50222, message types, field layouts)."
  - title: "WeatherFlow Tempest quick instruction manual"
    url: "https://www.manualslib.com/manual/2595260/Weatherflow-Tempest.html"
    kind: "manual"
    description: >
      Vendor manual covering the hub and sensor resets in this spec, plus the LED status indicators.
