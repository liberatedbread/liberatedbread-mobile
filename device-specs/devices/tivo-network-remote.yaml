evidence:
  documentation_review: >
    openHAB's TiVo binding (README and the Java status provider and
    handler) and McBrine's Network Remote were read on 2026-10-11 and agree
    on the commands, the CR line ending, the single-client limit and the
    reply tokens. The discovery beacon facts are from TiVo's 2003
    TiVoConnect specification, cross-checked against Wireshark's dissector
    and pyTivo. The `_tivo-remote` TXT keys are IANA's registered set plus
    McBrine's use of swversion; the `_tivo-device` keys come from a 2011
    Premiere sample and were not checked on newer boxes.
  open_questions: >
    The vendor PDF was not obtained. Whether a Mini, which has no tuner of
    its own, accepts SETCH; the CH_STATUS padding width per generation; and
    whether TELEPORT SEARCH and NETFLIX are official or later additions.

remaining_unknowns:
  - "TiVo's own protocol PDF was not retrieved (vendor URL 404; the Internet Archive holds a 2008 edition, which this project could not fetch), so the full IRCODE and KEYBOARD tables and any reply strings beyond those the clients handle (INVALID_KEY, MISSING_TELEPORT_NAME are rumoured) are reconstructed from the clients."
  - "TiVo Mini behaviour: whether SETCH/FORCECH work (the Mini borrows a host DVR's tuner) or always answer CH_FAILED. No source covers it."
  - "CH_STATUS channel padding on older generations: every observed line has four digits; parse as an integer regardless."
  - "Line-oriented TCP has no `commands.transport` value in the schema; these commands rely on `device.transport: tcp` and carry their CR terminator in `body`."

