    body: "IRCODE NUM3\r"
    verification: "reported"
  press_num_4:
    description: "Press 4 (NUM4)."
    body: "IRCODE NUM4\r"
    verification: "reported"
  press_num_5:
    description: "Press 5 (NUM5)."
    body: "IRCODE NUM5\r"
    verification: "reported"
  press_num_6:
    description: "Press 6 (NUM6)."
    body: "IRCODE NUM6\r"
    verification: "reported"
  press_num_7:
    description: "Press 7 (NUM7)."
    body: "IRCODE NUM7\r"
    verification: "reported"
  press_num_8:
    description: "Press 8 (NUM8)."
    body: "IRCODE NUM8\r"
    verification: "reported"
  press_num_9:
    description: "Press 9 (NUM9)."
    body: "IRCODE NUM9\r"
    verification: "reported"
  teleport_live_tv:
    description: "Jump straight to Live TV (TELEPORT LIVETV)."
    body: "TELEPORT LIVETV\r"
    verification: "reported"
  teleport_guide:
    description: "Jump straight to Guide (TELEPORT GUIDE)."
    body: "TELEPORT GUIDE\r"
    verification: "reported"
  teleport_my_shows:
    description: "Jump straight to My Shows (TELEPORT NOWPLAYING)."
    body: "TELEPORT NOWPLAYING\r"
    verification: "reported"
  set_channel:
    description: >
      Tune a channel (SETCH). The box must be on Live TV — send
      teleport_live_tv first and wait for LIVETV_READY. The reply is a
      CH_STATUS or CH_FAILED line.
    body: "SETCH {channel}\r"
    parameters:
      channel:
        type: "integer"
        required: true
        min: 1
        max: 9999
        description: "Major channel number."
    verification: "reported"
  set_channel_subchannel:
    description: "Tune an over-the-air subchannel, e.g. 2.1 as SETCH 2 1."
    body: "SETCH {major} {minor}\r"
    parameters:
      major: { type: "integer", required: true, min: 1, max: 9999, description: "Major channel." }
      minor: { type: "integer", required: true, min: 1, max: 999, description: "Subchannel." }
    verification: "reported"
  force_channel:
    description: >
      Tune a channel even if that means cancelling a recording in progress
      (FORCECH). Only differs from set_channel when every tuner is busy.
    body: "FORCECH {channel}\r"
    parameters:
      channel:
        type: "integer"
        required: true
        min: 1
        max: 9999
        description: "Major channel number."
    advanced: true
    advanced_reason: "Can cancel a recording that is in progress."
    verification: "reported"

