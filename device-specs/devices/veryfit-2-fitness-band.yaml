  - title: "M6 Smart Fitness Band spec (mis-attribution history)"
    url: "https://github.com/liberatedbread/liberatedbread-protocol-specs/blob/main/device-specs/devices/m6-fitness-band.yaml"
    description: >-
      Sibling spec whose appendix this analysis was promoted from; documents why the 0xAF0 protocol
