    url: "https://4pda.to/forum/index.php?showtopic=777752"
    description: >-
      Community thread associating the ID107/ID111-class bands with the Veryfit 2.0 app; hardware
      notes (nRF51822, Si1142 sensor) for this band generation.
  - title: "ID107 (Makibes) hardware notes"
    url: "https://saturn.ffzg.hr/rot13/index.cgi?action=unplug"
    description: >-
      Hardware data for a Makibes ID107: Nordic nRF51822, Silicon Labs Si1142 pulse sensor, Kionix
