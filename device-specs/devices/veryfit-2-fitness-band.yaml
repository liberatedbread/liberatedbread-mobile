    description: >-
      BlueZ/bluetoothctl session against a real ID107 HR band: advertises as "ID107 HR" with
      company ID 0x001C manufacturer data carrying the band's own MAC, and exposes exactly the
      00000af0/af6/af7/af1/af2 layout with a 20-byte 02 A0 real-time frame on af7. The hardware
      corroboration for this spec's GATT table.
  - title: "Veryfit 2.0 version history (uptodown)"
    url: "https://veryfit-2-0.en.uptodown.com/android/versions"
    description: >-
