  # State surfaces. state_endpoint + state_command name the RPC the reading
  # comes from, in the shape the schema defines for one-path-POST APIs.
  # TRANSPORT GAP: fetching any of these needs a JSON body POST plus the
  # auth header — not yet sendable by the reference app; they are declared
  # so the contract exists when the transport lands.
  - platform: "sensor"
    name: "Power Status"
    state_endpoint: "/sony/system"
    state_command: "getPowerStatus"
    notes: "Result path: result[0].status — 'active', 'standby', ... A 'not power-on' error on other calls is this reading saying standby."
  - platform: "sensor"
    name: "Now Playing"
    icon: "mdi:television-play"
    state_endpoint: "/sony/avContent"
    state_command: "getPlayingContentInfo"
    notes: "Result path: result[0].title (with .uri/.source for detail). Blind to content inside Android apps — documented limitation, not a parsing bug."
  - platform: "sensor"
    name: "Volume"
    icon: "mdi:volume-high"
    state_endpoint: "/sony/audio"
    state_command: "getVolumeInformation"
    notes: "Result path: result[0][target 'speaker'].volume, 0-100 per maxVolume. authLevel none on Sony's pro reference, so this one may read even before pairing on some models."

  # The app launcher. Same idea as Roku's Channel select: options are
  # whatever the TV reports, never a static table. Two mismatches with the
  # reference app's select contract today, both recorded rather than worked
  # around: the response is a JSON-RPC document (one object per app, 'title'
  # the label, 'uri' the value) where the app's options_source contract
  # reads XML; and there is no expressible select_option command — Set
  # Active App needs a JSON body. Drawn here so the binding exists when the
  # transport does.
  - platform: "select"
    name: "Application"
    icon: "mdi:apps"
    options_source:
      command: "Application List"
      item: "title"
      value: "uri"
    notes: >
      No state_source: Bravia has no current-app query — Playing Content
      Info reports content, and inside an Android app it reports nothing.
      Selecting an option means POST /sony/appControl setActiveApp with
      {"uri": <option value>}; see the Set Active App endpoint.
