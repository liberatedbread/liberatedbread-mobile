      IRCCCode: "AAAAAQAAAAEAAAARAw=="
    verification: "reported"
  press_epg:
    description: "Electronic programme guide — community table ('EPG'); not in the pro table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAAKQAAABbAw=="
