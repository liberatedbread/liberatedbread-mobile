    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAQAAAAEAAAAFAw=="
    verification: "reported"
  press_num7:
    description: "Digit 7 — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAQAAAAEAAAAGAw=="
    verification: "reported"
  press_num8:
    description: "Digit 8 — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
