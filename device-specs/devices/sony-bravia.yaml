    arguments:
      IRCCCode: "AAAAAQAAAAEAAAAIAw=="
    verification: "reported"
  press_dot:
    description: "The '.', separator for digital sub-channels — 'Dot(.)' on Sony's table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAAJcAAAAdAw=="
    verification: "reported"

  # -- Playback transport.
  press_play:
    description: "Play — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAAJcAAAAaAw=="
    verification: "reported"
  press_pause:
    description: "Pause — Sony's published table."
    transport: "soap"
