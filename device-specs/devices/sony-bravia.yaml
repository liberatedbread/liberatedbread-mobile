evidence:
  documentation_review:
    date: "2026-08-11"
    sources:
      - "Sony BRAVIA Professional Displays Knowledge Center: IRCC-IP overview and IRCC code table (pro-bravia.sony.net)."
      - "Sony BRAVIA REST API reference (pro-bravia.sony.net): method-level schemas and auth levels for guide/appControl/audio/avContent."
      - "pybravia client source (client.py, const.py): PIN/PSK auth, actRegister parameters, IRCC quirks, error handling, service inventory."
      - "Home Assistant braviatv integration docs and manifest (SSDP matcher: manufacturer 'Sony Corporation', ST urn:schemas-sony-com:service:ScalarWebAPI:1)."
    notes: >
      No live Bravia was probed for this spec; every command is verification
      "reported" — published by Sony or exercised by pybravia/Home
      Assistant — and nothing here carries "confirmed".

# Everything needed to build a request byte for byte, in the role
# soap_common plays for Wemo. Two wire formats share one host and one auth
# scheme, so both live here.
bravia_common:
  transport: "HTTP POST"
  base_url: "http://<ip>/sony/<service>"
  base_url_notes: >
    Port 80 on every documented model, but resolve per-service base URLs
    from dd.xml's X_ScalarWebAPI_ServiceList when available — the descriptor
    exists precisely because services may move ports. <ip> comes from SSDP.
  authentication:
    description: >
      One of two credentials rides on EVERY request to /sony/*, once IP
      control is enabled on the TV. Which one is a per-client choice made at
      setup time (device.setup). A request with neither, on a TV with
      authentication enabled, answers 401 or 403.
    psk:
      header: "X-Auth-PSK: <pre-shared key>"
      description: >
        The string the user typed into the TV's IP control settings, sent as
        a plain header on every request — SOAP and REST alike. No handshake,
        no expiry.
    pin_registration:
      endpoint: "POST /sony/accessControl"
      description: >
        The no-shared-secret flow. Step 1: POST actRegister with HTTP Basic
        auth (username "", password "0000") — the TV answers 401/403 and
        displays a PIN on screen. Step 2: repeat the identical call with the
        displayed PIN as the Basic-auth password (username still ""). On
        success the TV answers 200 with Set-Cookie: auth=<token>; the client
        sends that cookie on every later request. The pybravia request body:
        {"method": "actRegister", "params": [{"clientid": <client-chosen
        stable id, conventionally "<name>:<uuid>", "nickname": <display
        name>, "level": "private"}, [{"value": "yes", "function": "WOL"}]],
        "id": 1, "version": "1.0"} — the WOL entry asks the TV to accept
        wake-on-LAN from this client. A clientid already registered makes
        the TV refuse to show a new PIN; deregister on the TV first
        (device.setup.credentials).
      cookie_notes: >
        The TV's Set-Cookie spelling is not RFC-compliant (pybravia had to
        add a normalizer, its issue #1) — a strict cookie jar silently drops
        the credential and every later request fails auth. Parse the auth
        value out of the header string if your stack is strict.
  ircc:
    description: >
      The remote-control surface: one SOAP call per key press. POST
      http://<ip>/sony/IRCC with the headers below and an envelope whose
      only variable is the base64 IRCCCode. Success is a bare 200 with an
      empty (or empty-envelope) body; the TV gives no per-key feedback.
    http:
      method: "POST"
      url: "http://<ip>/sony/IRCC"
      headers:
        Content-Type: "text/xml; charset=UTF-8"
        SOAPACTION: "\"urn:schemas-sony-com:service:IRCC:1#X_SendIRCC\"  (literal double quotes, as Wemo)"
        X-Auth-PSK: "<pre-shared key, or omit when using the auth cookie>"
    template: |
      <?xml version="1.0" encoding="utf-8"?>
      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
      <s:Body>
      <u:X_SendIRCC xmlns:u="urn:schemas-sony-com:service:IRCC:1">
      <IRCCCode>{ircc_code}</IRCCCode>
      </u:X_SendIRCC>
      </s:Body>
      </s:Envelope>
    quirks:
      endpoint_case: >
        The path's case differs across models: /sony/IRCC on most, /sony/ircc
        on some — the wrong case answers 404. pybravia detects this by
        probing with an empty IRCCCode and swapping case on
        BraviaNotFound; copy that rather than shipping two configs.
      idle_drop: >
        After roughly 13 minutes of inactivity some TVs silently ignore the
        first IRCC command — no error, just nothing happens. pybravia works
        around it by sending an empty-code request as a wake-up whenever the
        last IRCC call is more than 10 minutes old.
      code_authority: >
        Codes are model-specific in detail. The TV's own
        getRemoteControllerInfo REST call returns its exact name->code list
        and is authoritative; Sony's published table (the one in `commands`)
        is the professional-display set, and community tables disagree with
        it on some keys (Left/Right and Prev are spelled differently in the
        widely-copied community list). A client that can query the TV should
        prefer the TV's list and treat `commands` as the fallback.
  rest:
    description: >
      Every REST service is one POST path carrying a JSON-RPC-flavoured
      document: {"method": "<name>", "params": [...], "id": <n>, "version":
      "1.x"}. params is ALWAYS an array — an empty array when the method
      takes nothing. A successful reply is {"result": [...], "id": <n>}; a
      failure is {"error": [<code>, "<message>"], "id": <n>} — and a TV in
      standby answers control calls with the error string "not power-on",
      which a client should read as "off", not "broken". Method versions
      and auth levels (none / generic / private) are per-method in Sony's
      reference; query a specific TV's actual surface with getSupportedApiInfo
      on /sony/guide, which is itself authLevel none.
    example_request:
      description: "getSystemInformation, as it goes on the wire."
      body: |
        POST /sony/system HTTP/1.1
        Content-Type: application/json
        X-Auth-PSK: <pre-shared key>

        {"method": "getSystemInformation", "params": [], "id": 1, "version": "1.0"}
    example_response: |
      {"result": [{"product": "TV", "region": "XEU", "language": "eng",
      "model": "KD-55X8000G", "serial": "1234567", "macAddr": "aa:bb:cc:dd:ee:ff",
      "name": "Living Room", "generation": "5.2.0", "area": "ESP",
      "cid": "AA00..."}], "id": 1}
    services:
      system: "Identity (getSystemInformation), power (getPowerStatus/setPowerStatus), getRemoteControllerInfo, getWolMode/setWolMode, requestReboot, LED indicator."
      avContent: "What is playing (getPlayingContentInfo), input inventory (getCurrentExternalInputsStatus), content/channel listing (getSchemeList/getSourceList/getContentCount/getContentList), input and channel switching (setPlayContent)."
      appControl: "getApplicationList, setActiveApp, terminateApps, getTextForm/setTextForm (on-screen keyboard)."
      audio: "getVolumeInformation, setAudioVolume (absolute 'N' or relative '+N'/'-N'), setAudioMute, sound settings."
      guide: "getSupportedApiInfo — the per-device API inventory; call it first."
      accessControl: "actRegister — PIN pairing; see authentication.pin_registration."
      video/videoScreen/cec/encryption/notification/recording/browser: >
        Present on various models; catalogued in Sony's reference. Out of
        scope for the controls this spec binds.
  dial:
    description: >
      DIAL (Discovery and Launch) is the second-screen surface YouTube and
      Netflix use to pair a phone with the TV. Discovery is SSDP ST
      urn:dial-multiscreen-org:service:dial:1; the response's
      Application-URL header is the DIAL REST base, against which app
      launch/status requests are made per the DIAL 2.2.1 specification. On
      Bravia the same /DIAL tree hosts app icons (the official
      getApplicationList example returns http://<ip>/DIAL/icon/<uri>.png
      URLs). DIAL needs no PSK or cookie; it also exposes no power, key or
      volume control — it is a discovery plus app-launch channel, and this
      spec binds nothing to it.
  power_on:
    description: >
      Three documented ways to wake a Bravia, in the order pybravia tries
      them: a Wake-on-LAN magic packet (broadcast UDP port 9; requires the
      TV's Remote Start / WoL setting and the MAC from getSystemInformation),
      the REST call setPowerStatus {"status": true}, and the IRCC PowerOn
      code (AAAAAQAAAAEAAAAuAw==). All three presuppose network standby — a
      TV in deep standby or cut at the wall is beyond any network command,
      same caveat as every TV in this registry.

http_endpoints:
  # The SOAP endpoint. One entry: the action never varies, only the code.
  - method: "POST"
    path: "/sony/IRCC"
    name: "Send IRCC"
    service: "urn:schemas-sony-com:service:IRCC:1"
    description: >
      Send one remote-key code. Case-sensitive on some models (/sony/ircc);
      see bravia_common.ircc.quirks. The full request template and headers
      are in bravia_common.ircc. The codes are in `commands` and, per model,
      from the Remote Controller Info call below.
    request_body:
      content_type: "text/xml; charset=UTF-8"

  # The REST surface. One entry per JSON-RPC METHOD, since the path alone
  # does not name the action — /sony/system alone is seven different calls.
  - method: "POST"
    path: "/sony/guide"
    name: "Supported API Info"
    description: >
      getSupportedApiInfo (v1.0, authLevel none): the device's own inventory
      of services, methods, versions and per-method auth levels. Call first;
      it is the difference between probing and knowing.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "getSupportedApiInfo", "params": [{"services": ["system", "avContent", "appControl", "audio"]}], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/system"
    name: "System Information"
    description: >
      getSystemInformation (v1.0): identity — product, model, serial,
      macAddr, name, generation, cid. This spec's identification source.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "getSystemInformation", "params": [], "id": 1, "version": "1.0"}
    response_body:
      content_type: "application/json"
      example: |
        {"result": [{"product": "TV", "region": "XEU", "language": "eng", "model": "KD-55X8000G", "serial": "1234567", "macAddr": "aa:bb:cc:dd:ee:ff", "name": "Living Room", "generation": "5.2.0", "area": "ESP", "cid": "AA00..."}], "id": 1}
  - method: "POST"
    path: "/sony/system"
    name: "Power Status"
    description: >
      getPowerStatus (v1.0): {"result": [{"status": "active"|"standby"|...}]}.
      pybravia polls this on a short timeout as the TV's on/off reading.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "getPowerStatus", "params": [], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/system"
    name: "Set Power Status"
    description: >
      setPowerStatus (v1.0): {"status": true|false} — wake to active or drop
      to standby. One of the three power-on paths (bravia_common.power_on);
      waking only works from network standby.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "setPowerStatus", "params": [{"status": false}], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/system"
    name: "Remote Controller Info"
    description: >
      getRemoteControllerInfo (v1.0): this model's own IRCC key table —
      {"result": [<bundled-remote info>, [{"name": "Power", "value":
      "AAAA..."}, ...]]}. Authoritative over any static table
      (bravia_common.ircc.quirks.code_authority). Absent on pre-2013 sets.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "getRemoteControllerInfo", "params": [], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/system"
    name: "Request Reboot"
    description: >
      requestReboot (v1.0): reboots the TV — the supported recovery when the
      WebApiCore REST service freezes (device.variants).
    request_body:
      content_type: "application/json"
      example: |
        {"method": "requestReboot", "params": [], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/audio"
    name: "Volume Information"
    description: >
      getVolumeInformation (v1.0, authLevel none per Sony's reference):
      per-target volume/mute — {"result": [[{"target": "speaker", "volume":
      25, "mute": false, "minVolume": 0, "maxVolume": 100}, ...]]}.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "getVolumeInformation", "params": [], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/audio"
    name: "Set Audio Volume"
    description: >
      setAudioVolume (v1.0+, authLevel generic): volume as a STRING —
      "25" absolute, "+1"/"-1" relative; target "speaker"|"headphone"|"".
      Error 40801 means out of range.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "setAudioVolume", "params": [{"volume": "+1", "target": "speaker"}], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/audio"
    name: "Set Audio Mute"
    description: >
      setAudioMute (v1.0, authLevel generic): {"status": true|false}. There
      is no toggle — read Volume Information first and send the inverse,
      which is what pybravia's volume_mute does.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "setAudioMute", "params": [{"status": true}], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/avContent"
    name: "Playing Content Info"
    description: >
      getPlayingContentInfo (v1.0, authLevel private): what is on —
      {"result": [{"uri": "extInput:hdmi?port=2", "source": "extInput:hdmi",
      "title": "HDMI 2", ...}]}, or tuner programme details when the TV is
      the source. Knows nothing about content playing INSIDE Android apps
      (a documented limitation; the Home Assistant docs pair the integration
      with Google Cast for that).
    request_body:
      content_type: "application/json"
      example: |
        {"method": "getPlayingContentInfo", "params": [], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/avContent"
    name: "External Inputs Status"
    description: >
      getCurrentExternalInputsStatus (v1.0/v1.1, authLevel none): every
      input with its uri ("extInput:hdmi?port=1"), title, user label,
      connection and signal status. The uri is what Play Content takes —
      this is the input-picker's option list.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "getCurrentExternalInputsStatus", "params": [], "id": 1, "version": "1.1"}
  - method: "POST"
    path: "/sony/avContent"
    name: "Play Content"
    description: >
      setPlayContent (v1.0, authLevel generic): switch to a content uri —
      an input ("extInput:hdmi?port=2") or a channel entry from
      getContentList. This is Bravia's input switching; the IRCC Hdmi1-4
      keys are the key-based alternative.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "setPlayContent", "params": [{"uri": "extInput:hdmi?port=2"}], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/appControl"
    name: "Application List"
    description: >
      getApplicationList (v1.0, authLevel private): installed launchable
      apps — {"result": [[{"title": "YouTube", "uri":
      "com.sony.dtv.com.google...", "icon": "http://<ip>/DIAL/icon/..."},
      ...]]}. The uri is what Set Active App takes.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "getApplicationList", "params": [], "id": 1, "version": "1.0"}
    response_body:
      content_type: "application/json"
      example: |
        {"result": [[{"title": "YouTube", "uri": "com.sony.dtv.com.google.android.youtube.tv.com.google.android.apps.youtube.tv.activity.ShellActivity", "icon": "http://192.168.1.4/DIAL/icon/com.sony.dtv.com.google.android.youtube.tv.com.google.android.apps.youtube.tv.activity.ShellActivity.png"}, {"title": "Screen mirroring", "uri": "com.sony.dtv.screnmirroring.com.screnmirroring.com.StartScreenMirroringHomeActivity", "icon": "http://192.168.1.4/DIAL/icon/com.sony.dtv.screnmirroring.com.screnmirroring.com.StartScreenMirroringHomeActivity.png"}]], "id": 1}
  - method: "POST"
    path: "/sony/appControl"
    name: "Set Active App"
    description: >
      setActiveApp (v1.0, authLevel generic): launch an app by its uri from
      Application List. Errors 41400/41401 mean the TV was busy — retry,
      don't fail the user.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "setActiveApp", "params": [{"uri": "com.sony.dtv.com.google.android.youtube.tv.com.google.android.apps.youtube.tv.activity.ShellActivity"}], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/appControl"
    name: "Terminate Apps"
    description: "terminateApps (v1.0, authLevel generic): kill all running applications."
    request_body:
      content_type: "application/json"
      example: |
        {"method": "terminateApps", "params": [], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/appControl"
    name: "Set Text Form"
    description: >
      setTextForm (v1.0): type a string into the TV's on-screen keyboard —
      Bravia's text entry; there is no Lit_-style per-character IRCC key.
      Error code 7 means no keyboard is on screen.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "setTextForm", "params": ["hello world"], "id": 1, "version": "1.0"}
  - method: "POST"
    path: "/sony/accessControl"
    name: "Register Client"
    description: >
      actRegister (v1.0): PIN pairing. Full flow, including the Basic-auth
      password trick and the cookie, in bravia_common.authentication.
    request_body:
      content_type: "application/json"
      example: |
        {"method": "actRegister", "params": [{"clientid": "OpenGreenIoT:8f4a2c10-0000-4000-8000-000000000000", "nickname": "OpenGreenIoT Remote", "level": "private"}, [{"value": "yes", "function": "WOL"}]], "id": 1, "version": "1.0"}

# One command per remote key, in the shape entities can bind: a `press` role
# needs a command with no caller-supplied blanks, so each key is its own
# command with the code already in its arguments. Every command here is an
# invocation of the Send IRCC endpoint above; the request template and
# headers come from bravia_common.ircc.
#
# Codes are Sony's published professional-display table (pro-bravia.sony.net,
# IRCC Codes) plus six consumer-set codes from pybravia and community tables
# (press_power_on, press_power_off, press_exit, press_rewind, press_forward,
# press_epg) — each says which in its description. The TV's own
# getRemoteControllerInfo answer overrides any code here where they differ.
#
# Verification is "reported" throughout: published by Sony and exercised
# daily by pybravia/Home Assistant, but not replayed against hardware by
# this project.
#
# TRANSPORT GAP: transport "soap" is honest about the envelope but the
# reference app's transports today send no X-Auth-PSK header and no cookie —
# until it grows a per-device auth header slot, these commands are
# documentation, not yet executable by the app.
commands:
  # -- Power. "Power" on Sony's table is the toggle; consumer sets also
  #    expose discrete PowerOn/PowerOff codes (pybravia ships PowerOn for
  #    its wake path). All three wake only from network standby
  #    (bravia_common.power_on).
  press_power:
    description: "Power toggle (standby/wake) — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAQAAAAEAAAAVAw=="
    verification: "reported"
  press_power_on:
    description: "Discrete power-on — pybravia's CODE_POWER_ON; on Sony's consumer key lists, not in the pro table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAQAAAAEAAAAuAw=="
    verification: "reported"
  press_power_off:
    description: "Discrete power-off/standby — community table; not in the pro table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAQAAAAEAAAAvAw=="
    verification: "reported"

  # -- Navigation.
  press_home:
    description: "Home screen — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAQAAAAEAAABgAw=="
    verification: "reported"
  press_back:
    description: "Back/return one screen ('Back' on Sony's table; community tables spell it 'Return')."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAAJcAAAAjAw=="
    verification: "reported"
  press_exit:
    description: "Exit — community table; not in the pro table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAQAAAAEAAABjAw=="
    verification: "reported"
  press_up:
    description: "D-pad up — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAQAAAAEAAAB0Aw=="
    verification: "reported"
  press_down:
    description: "D-pad down — Sony's published table."
    transport: "soap"
