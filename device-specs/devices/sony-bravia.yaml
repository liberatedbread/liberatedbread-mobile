      IRCCCode: "AAAAAQAAAAEAAAABAw=="
    verification: "reported"
  press_num3:
    description: "Digit 3 — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAQAAAAEAAAACAw=="
    verification: "reported"
  press_num4:
    description: "Digit 4 — Sony's published table."
    transport: "soap"
