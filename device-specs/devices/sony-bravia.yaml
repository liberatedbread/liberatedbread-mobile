# Sony Bravia TVs — IRCC-IP and REST API — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Two local control surfaces on one host:
#   1. IRCC-IP — SOAP POSTs to /sony/IRCC carrying base64 remote-key codes;
#      the wire sibling of the infrared remote.
#   2. The Bravia REST API ("Scalar Web API") — JSON-RPC-flavoured POSTs to
#      /sony/<service> (system, avContent, appControl, audio, guide, ...),
#      for identity, power, volume, input/app switching and content listing.
# Both sit behind the same authentication: an X-Auth-PSK header, or an auth
# cookie from PIN registration (actRegister). Neither is usable on a factory
# TV until the user enables IP control on the TV itself.
#
# Transport gap, stated once and referred to throughout: every request here
# is an HTTP POST carrying a BODY (a SOAP envelope, or a JSON-RPC document)
# and an AUTH HEADER (X-Auth-PSK or the auth cookie). The reference app's
# `http` transport today sends GET/POST with an empty body and no per-device
# headers, and its `soap` transport has no header slot either. The `commands`
# block therefore declares only the IRCC keys (transport "soap" — the action
# and arguments are honest and complete), and the REST surface is catalogued
# in `http_endpoints` with literal request bodies but no `commands` entries:
# a JSON-RPC command with no way to send its body would be a control that
# cannot work. What a client must add: SOAP-with-arguments (already the Wemo
# shape) plus a per-device X-Auth-PSK/cookie header, and JSON-POST bodies for
# the REST surface.

device:
  name: "Sony Bravia IRCC-IP / REST API"
  manufacturer: "Sony"
  manufacturer_status: "active"
  protocol: "wifi"
  category: "tv"
  transport: "http"
  notes: >
    Bravia TVs (2013 and newer, including the FW-BZ professional displays)
    expose both surfaces on port 80: IRCC-IP at POST /sony/IRCC (SOAP action
    X_SendIRCC, one base64 key code per call) and the REST API as
    JSON-RPC-style POSTs to /sony/<service> with bodies of the form
    {"method": ..., "params": [...], "id": N, "version": "1.x"}. Discovery is
    SSDP: urn:schemas-sony-com:service:ScalarWebAPI:1 (LOCATION points at
    /sony/webapi/ssdp/dd.xml, which lists every REST service and its base
    URL) and urn:dial-multiscreen-org:service:dial:1 for DIAL second-screen
    discovery. Authentication is mandatory once enabled on the TV: either a
    pre-shared key sent as the X-Auth-PSK header, or a PIN-pairing flow
    (actRegister on /sony/accessControl) that ends in an auth cookie. The
    TV's own getRemoteControllerInfo REST call returns the model's exact
    IRCC key set — the static table in `commands` is Sony's published
    professional-display table plus widely-used community codes, and the
    device wins where they disagree.
  openness:
    status: "documented_api"
    reverse_engineered: true
    upstream_docs:
      - url: "https://pro-bravia.sony.net/develop/integrate/ircc-ip/overview/index.html"
        title: "Sony — BRAVIA Professional Displays Knowledge Center: IRCC-IP overview"
        covers: >
          The IRCC-IP wire format officially: POST /sony/IRCC with the SOAP
          envelope, the SOAPACTION and X-Auth-PSK headers, and a worked
          request example.
      - url: "https://pro-bravia.sony.net/develop/integrate/ircc-ip/ircc-codes/"
        title: "Sony — IRCC Codes"
        covers: >
          Sony's published key-name to base64-code table for professional
          displays, and the note that the same list is available on-device
          via getRemoteControllerInfo.
      - url: "https://pro-bravia.sony.net/remote-display-control/rest-api/reference/"
        title: "Sony — BRAVIA REST API reference"
        covers: >
          Per-service, per-method request/response schemas with
          authentication levels (none/generic/private) and versions —
          getSupportedApiInfo, getApplicationList, setActiveApp,
          getPlayingContentInfo, getCurrentExternalInputsStatus,
          setPlayContent, setAudioVolume, setAudioMute, getVolumeInformation
          and more.
    notes: >
      Sony documents both surfaces for its professional displays, hence
      documented_api. reverse_engineered stays true because the consumer-TV
      behaviour this spec also covers is community-established: the PIN
      registration flow (actRegister, the auth cookie, its non-RFC-compliant
      Set-Cookie spelling), the IRCC endpoint case quirk and idle-drop quirk,
      and the extra consumer key codes (PowerOn, PowerOff, Exit, Rewind,
      Forward) come from pybravia/Home Assistant and community captures, not
      from Sony's pages.

  identification:
    ssdp_search_targets:
      - "urn:schemas-sony-com:service:ScalarWebAPI:1"
      - "urn:dial-multiscreen-org:service:dial:1"
    default_port: 80
    identity_keys:
      primary: "serial"
      secondary: "mac_addr"
      display: "name"

  discovery:
    methods:
      - type: "ssdp"
        ssdp:
          search_targets: ["urn:schemas-sony-com:service:ScalarWebAPI:1"]
          query_path: "/sony/webapi/ssdp/dd.xml"
          response_mapping:
            location:
              url: "LOCATION"
              action: "fetch_xml"
              parse:
                description: >
                  dd.xml is the Scalar Web API device descriptor: its
                  X_ScalarWebAPI_ServiceList lists each REST service by name
                  (system, avContent, appControl, audio, guide, ...) with an
                  X_ScalarWebAPI_BaseURL per service. Resolve service base
                  URLs from here rather than assuming port 80 — a service
                  MAY live on another port. Identity fields (serial, macAddr,
                  model, name) are NOT in dd.xml; they come from the REST
                  call getSystemInformation on /sony/system once the client
                  holds credentials (or immediately, on the models that
                  answer it unauthenticated).
                device_identity:
                  stable_keys:
                    - source: "jsonrpc://system/getSystemInformation/serial"
                      key: "serial"
                    - source: "jsonrpc://system/getSystemInformation/macAddr"
                      key: "mac_addr"
                  display:
                    source: "jsonrpc://system/getSystemInformation/name"
                  variant:
                    source: "jsonrpc://system/getSystemInformation/model"
      - type: "ssdp"
        ssdp:
          search_targets: ["urn:dial-multiscreen-org:service:dial:1"]
          response_mapping:
            location:
              url: "LOCATION"
              action: "fetch_xml"
              parse:
                description: >
                  DIAL's SSDP response is a normal UPnP advertisement plus
                  one extra header: LOCATION points at a UPnP device
                  description (parsed below), and the Application-URL header
                  carries the DIAL REST service base — on Bravia the same
                  /DIAL tree hosts app icons, per the official
                  getApplicationList example's http://<ip>/DIAL/icon/ URLs.
                  The DIAL surface itself is second-screen app launching
                  (YouTube/Netflix pairing), unauthenticated, with no power,
                  key or volume control; it says "a DIAL-speaking Sony TV is
                  here" but its descriptor carries no serial — REST identity
                  (getSystemInformation) remains authoritative.
                device_identity:
                  stable_keys:
                    - source: "xml://device/UDN"
                      key: "udn"
                  display:
                    source: "xml://device/friendlyName"
                  variant:
                    source: "xml://device/modelName"
    identity:
      stable_keys: ["serial", "mac_addr"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      Two separate jobs: getting the TV on the network (done on the TV's own
      UI, nothing to reimplement) and enabling IP control, which is the part
      every client depends on and the part that is OFF until the user turns
      it on. "medium" rather than "high": the flow is documented by Sony and
      exercised daily by pybravia/Home Assistant, but this project has not
      run it against its own hardware. Menu spellings below are the Android
      TV / Google TV ones; pre-Android Bravias put the same items under
      Settings > Network > Home Network Setup > IP Control.
    methods:
      - type: "device_ui"
        verified: false
        description: >
          First-run network onboarding on the TV itself: language, Google
          account (skippable), WiFi selection and passphrase on the
          on-screen keyboard. No app-driven provisioning protocol exists to
          reimplement.
        steps:
          - action: "Power on the TV and follow the on-screen setup with the remote."
            actor: "user"
          - action: "Select the WiFi network and enter the passphrase on the TV itself."
            actor: "user"
            expect: "TV reports a successful connection."
      - type: "device_ui"
        verified: false
        description: >
          Enable IP control and choose authentication. The client cannot do
          any of this remotely — that is the point of the setting.
        steps:
          - action: >
              On the TV: Settings > Network & Internet > Remote device
              settings > Control remotely = On. (Older models: Settings >
              Network > Home Network Setup > IP Control.)
            actor: "user"
          - action: >
              EITHER set a pre-shared key: Remote device settings > IP
              control > Pre-Shared Key, and hand the same string to the
              client, which sends it as the X-Auth-PSK header on every
              request. This is the flow Home Assistant recommends as the
              more reliable one.
            actor: "user"
          - action: >
              OR use PIN pairing: the client POSTs actRegister to
              /sony/accessControl with HTTP Basic auth (empty username,
              password "0000") to make the TV display a PIN, then repeats
              the call with the shown PIN as the Basic-auth password; the
              TV answers 200 with an auth cookie the client sends on every
              later request. See bravia_common.authentication.
            actor: "client"
            expect: "actRegister returns 200 and a Set-Cookie: auth=... header."
          - action: "Confirm the REST API is reachable and authenticated."
            actor: "client"
            request:
              protocol: "http"
              action: "POST /sony/system with getSystemInformation"
            expect: "JSON result with product, model, serial, macAddr, name."
    factory_reset:
      confidence: "medium"
      effect: >
        Clears network credentials, Google account, installed apps, the
        pre-shared key and every registered remote device; the TV returns to
        first-run setup. After a reset, IP control is off again and all
        pairing must be redone.
      procedures:
        - name: "Menu factory reset"
          steps:
            - action: >
                Settings > System > About > Reset > Factory data reset
                (Android TV); Google TV models put Reset under Settings >
                System > About, older pre-Android models under Settings >
                Storage & reset or Customer Support. Menu spelling varies by
                generation — the constant is that it lives under
                About/System, not under Network.
              actor: "user"
        - name: "Forced hardware reset (buttons)"
          steps:
            - action: >
                For Android/Google TV models whose on-screen menu is
                unreachable: unplug the TV, press and hold the Power and
                Volume Down buttons on the TV body (not the remote), plug
                the TV back in while holding, and release when the reset
                screen or LED indication appears. Button count and exact
                combination vary by model — Sony's support pages distinguish
                one-button and three-button chassis; treat this spelling as
                the three-button one.
              actor: "user"
              notes: "Reported from Sony support documentation; not exercised here."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Re-running the network setup from the TV's settings joins a new
        router without touching anything else; the pre-shared key and
        registered-client list survive. A client holding an auth cookie
        keeps working across a network change as long as the TV's
        registration list is intact.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "WiFi credentials"
        - "IP control pre-shared key"
        - "Registered remote devices (clientid/nickname list from PIN pairing)"
      issued_to_client:
        - "auth cookie (PIN pairing only; sent as a Cookie header on every later request)"
      notes: >
        No WiFi passphrase crosses any link this spec documents — it is
        typed into the TV. The shared secret that matters is the PSK (or the
        issued cookie): anything holding it has full control, so the LAN is
        the trust boundary. A TV that will no longer show a PIN has the
        client still registered — remove it via Settings > Network > Remote
        device settings > Deregister remote device (per the Home Assistant
        integration docs), then pair again.

  variants:
    - model: "Bravia 2013+ (consumer)"
      name: "Sony Bravia consumer TVs, 2013 and newer (Linux, Android TV, Google TV generations)"
      identification:
        model_pattern: "KD-*, KDL-*, XBR-*, XR-*"
      characteristics:
        - "Both IRCC-IP and the REST API on port 80; Home Assistant states support for nearly all 2013+ models."
        - "REST service list varies by model and firmware; discover it per-device via getSupportedApiInfo on /sony/guide."
        - "The REST surface is served by the WebApiCore system app, which community reports describe as unstable on long uptimes — a frozen API recovers with a full TV reboot or by clearing WebApiCore's data under Settings > Apps."
    - model: "FW-BZ series (professional)"
      name: "Sony Bravia Professional Displays"
      identification:
        model_pattern: "FW-*BZ*"
      characteristics:
        - "The surfaces Sony itself documents: same IRCC-IP and REST API, plus 'Simple IP Control' (a fixed-format TCP byte-stream control channel) and RS-232C, per Sony's Knowledge Center. Simple IP Control is named here for completeness only; its frame format is in Sony's docs, not in this spec."
        - "Sony's published IRCC code table (used by `commands` below) is written for this family."
    - model: "Bravia pre-2013"
      name: "Sony Bravia TVs before 2013"
      characteristics:
        - "IRCC-IP only: no Scalar Web API, no REST services, no getRemoteControllerInfo — key codes must come from a static table. Out of this spec's tested scope; the Home Assistant docs steer pre-2013 sets to HDMI-CEC or Broadlink instead."

