      IRCCCode: "AAAAAQAAAAEAAAAAAw=="
    verification: "reported"
  press_num2:
    description: "Digit 2 — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
