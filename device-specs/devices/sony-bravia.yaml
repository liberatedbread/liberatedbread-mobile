    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAQAAAAEAAAAQAw=="
    verification: "reported"
  press_channel_down:
    description: "Previous tuner channel — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
