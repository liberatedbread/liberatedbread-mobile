  press_cc:
    description: "Closed captions/subtitles — 'CC' on Sony's table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAAJcAAAAoAw=="
    verification: "reported"

  # -- Colour keys.
  press_red:
    description: "Red colour key — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAAJcAAAAlAw=="
    verification: "reported"
  press_green:
    description: "Green colour key — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAAJcAAAAmAw=="
    verification: "reported"
  press_yellow:
    description: "Yellow colour key — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAAJcAAAAnAw=="
    verification: "reported"
  press_blue:
    description: "Blue colour key — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAAJcAAAAkAw=="
    verification: "reported"

  # -- Inputs. The key-based path; the REST path is Play Content with an
  #    extInput uri. 'Input' cycles; Hdmi1-4 jump directly.
  press_input:
    description: "Cycle through inputs — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAQAAAAEAAAAlAw=="
    verification: "reported"
  press_hdmi1:
    description: "Switch to HDMI 1 — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAABoAAABaAw=="
    verification: "reported"
  press_hdmi2:
    description: "Switch to HDMI 2 — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAABoAAABbAw=="
    verification: "reported"
  press_hdmi3:
    description: "Switch to HDMI 3 — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAABoAAABcAw=="
    verification: "reported"
  press_hdmi4:
    description: "Switch to HDMI 4 — Sony's published table."
    transport: "soap"
    service: "urn:schemas-sony-com:service:IRCC:1"
    action: "X_SendIRCC"
    arguments:
      IRCCCode: "AAAAAgAAABoAAABdAw=="
    verification: "reported"

# The remote, as controls. Declaration order is layout order — power, then
# navigation and D-pad, digits, transport, volume/channel, colour keys, then
# inputs. Buttons bind the IRCC commands; the two sensors and the select
# bind the REST surface and carry the transport gap in their notes.
entities:
  - platform: "button"
    name: "Power"
    icon: "mdi:power"
    commands:
      press: "press_power"
    notes: "Toggle. Discrete on/off exist as press_power_on/press_power_off for consumers that ask the TV for its key list first."
  - platform: "button"
