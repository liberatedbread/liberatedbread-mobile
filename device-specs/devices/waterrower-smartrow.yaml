    description: "Independent SmartRow and LightRing BF local protocol reference."
  - title: "WaterRower Bluetooth ComModule owner's manual (archived PDF)"
    url: "https://web.archive.org/web/20250109115057/https://media2.waterrower.com/service/manuals/WEB_ComModule_Instructions_Commodule-Manual.pdf"
