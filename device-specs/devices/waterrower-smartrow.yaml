    url: "https://github.com/madooroy/smartrow-bridge"
    kind: "implementation"
    description: "Capture-backed V3.10 SmartRow decoder, checksum/keylock tests and full-session replay."
  - title: "inonoob/pirowflo"
    url: "https://github.com/inonoob/pirowflo"
    kind: "implementation"
    description: "Independent SmartRow commands, checksum and telemetry client."
