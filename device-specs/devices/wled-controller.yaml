device:
  name: "WLED Addressable LED Controller"
  manufacturer: "WLED project (Aircoookie and contributors)"
  manufacturer_status: "active"
  protocol: "wifi"
  transport: "http"

  openness:
    status: "open_by_design"
    reverse_engineered: false
    source_code: "https://github.com/wled/WLED"
    license: "EUPL-1.2"
    upstream_docs:
      - url: "https://kno.wled.ge/interfaces/json-api/"
        title: "WLED — JSON API"
        covers: "Endpoint paths, the state/info/effects/palettes objects and their fields."
      - url: "https://kno.wled.ge/interfaces/http-api/"
        title: "WLED — HTTP request API"
        covers: "The legacy /win query-parameter API and its XML response."
      - url: "https://kno.wled.ge/interfaces/udp-realtime/"
        title: "WLED — UDP realtime"
        covers: "WARLS/DRGB/DRGBW/DNRGB packet layouts, the notifier port and Hyperion/TPM2.net."
      - url: "https://kno.wled.ge/interfaces/e1.31-dmx/"
        title: "WLED — E1.31 (sACN) / Art-Net / DDP"
        covers: "DMX modes, universe layout and which realtime protocols are accepted."
      - url: "https://kno.wled.ge/interfaces/mqtt/"
        title: "WLED — MQTT"
        covers: "Subscribed and published topic names, payload formats, default device topic."
      - url: "https://kno.wled.ge/basics/getting-started/"
        title: "WLED — Getting started"
        covers: "First-boot access point, captive portal and WiFi provisioning."
      - url: "https://kno.wled.ge/features/settings/"
        title: "WLED — Settings"
        covers: "AP behaviour, mDNS name, sync port and the Security-page factory reset."
    notes: >
      This entry is the exception in this registry, and it is here to make the
      exception visible rather than to pad the count. Nothing below was
      recovered: WLED publishes its protocol, ships the firmware under a free
      licence, and treats third-party clients as the point rather than as a
      threat. What this file does is normalise that published protocol into the
      registry's shape so a consumer can enumerate it the same way it
      enumerates everything else, and so we have a worked example of what the
      other sixty-odd specs are trying to reconstruct.

      Follow the citations before this file. Every fact here came from upstream
      documentation or from reading WLED's own source; no WLED hardware was in
      the loop, which is why nothing below claims `confirmed`. Where a port or
      a default is quoted, it was read out of the named source file rather than
      remembered — `wled00/const.h` for the access-point defaults and the
      realtime-mode enum, `wled00/src/dependencies/e131/ESPAsyncE131.h` for the
      E1.31/Art-Net/DDP ports, `wled00/wled.cpp` for the mDNS registration.

      The corollary matters for anyone planning work against it: an open
      protocol is a moving one. WLED can and does change its JSON surface
      between releases, and upstream is entitled to. Pin behaviour to the
      `info.ver`/`info.vid` a device reports rather than to this document.

  notes: >
    WLED is open-source firmware for addressable LED strips on ESP8266 and
    ESP32 boards. It is not a product with a manufacturer — the same firmware
    runs on bare dev boards, on purpose-built controllers (QuinLED, Athom,
    Dig-Uno/Dig-Quad) and on retail strips reflashed by their owners, so the
    device this spec describes is the firmware and its network surface, not a
    SKU.

    Two distinct interface families live here and are easy to confuse. The
    control plane — JSON over HTTP, a WebSocket, the legacy /win API and
    optionally MQTT — is how a client sets brightness, effects, segments and
    presets, and is what an app such as WLED+ speaks. The realtime plane —
    E1.31/sACN, Art-Net, DDP, TPM2.net and WLED's own WARLS family — streams
    per-pixel data and bypasses the effect engine entirely. A controller
    receiving realtime data ignores its own effects until the stream stops and
    the timeout expires, so a client that mixes the two planes without
    accounting for that will appear to have its commands ignored.

  identification:
    mdns_service_type: "_wled._tcp.local."
    # WLED also answers _http._tcp, and that is deliberately not recorded as an
    # identification signal: every web-serving device on the network answers it,
    # so matching on it would claim each of them might be a WLED controller.
    # _wled._tcp is the vendor-specific one, and it is the one that identifies.
    # The discovery block below still documents both.
    hostname_pattern: "wled-XXXXXX"
    hostname_notes: >
      Default mDNS name is "wled-" plus the last six hex characters of the
      MAC, set in wled00/wled.cpp when the configured name is still the
      compile-time default. Users can and do change it, so it is a hint for
      display, never an identity key.
    ssid_prefix: "WLED-AP"
    default_port: 80

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_wled._tcp.local."
          port: 80
          txt_record_keys: ["mac"]
          identity_mapping:
            stable_keys:
              - source: "txt:mac"
                key: "mac"
              - source: "hostname"
                key: "hostname"
            display:
              source: "name"
        notes: >
          WLED registers two mDNS services on port 80 — "_wled._tcp" and
          "_http._tcp" — and adds a single TXT record, mac. Browse the WLED
          service type rather than _http._tcp: the latter matches every web
          server on the LAN, including printers and routers.
      - type: "mdns"
        mdns:
          service_type: "_http._tcp.local."
          port: 80
          identity_mapping:
            stable_keys:
              - source: "hostname"
                key: "hostname"
            display:
              source: "name"
        notes: >
          Fallback only, for firmware or forks that do not register the WLED
          service type. Anything found this way must be confirmed by fetching
          /json/info and checking info.brand before it is offered as a WLED
          device.
    identity:
      stable_keys: ["mac", "hostname"]
      display: "name"
    static_ip_required: false
    notes: >
      info.mac from /json/info is the identity key that survives a rename, a
      DHCP lease change and a firmware update. Do not key on IP: these are
      DHCP clients on consumer routers. Do not key on the user-set name
      either — WLED installs commonly run several controllers whose owner has
      named them by room, and names get reused.

  setup:
    required: true
    confidence: "medium"
    notes: >
      A factory-fresh board comes up as its own access point with a captive
      portal, takes the home network's credentials over plain HTTP, and
      reboots onto the LAN. The flow below is from WLED's own getting-started
      guide and settings documentation; it has not been replayed here, hence
      medium rather than high.
    methods:
      - type: "softap_http"
        verified: false
        description: >
          The board hosts an open-to-anyone-who-reads-the-manual WPA2 access
          point named WLED-AP and serves its settings UI on 4.3.2.1, with an
          embedded DNS server answering every name so any browser navigation
          lands on the captive portal.
        softap:
          ssid_prefix: "WLED-AP"
          ssid_examples: ["WLED-AP"]
          open_network: false
          passphrase_source: >
            Compile-time default "wled1234" (DEFAULT_AP_PASS in
            wled00/const.h), published in WLED's own getting-started guide.
            Changeable in WiFi settings and worth changing, but a client
            should assume the documented default.
          gateway_ip: "4.3.2.1"
          port: 80
          credential_encryption:
            algorithm: "none"
            notes: >
              None. The home network passphrase is submitted as a plain HTTP
              form field to 4.3.2.1 over an access point whose own passphrase
              is a published constant. In practice the exposure window is the
              few seconds of the form POST within radio range, but it is a
              real one and a consumer automating this flow should say so
              rather than present provisioning as secure.
        steps:
          - action: "Power the controller with no WiFi configured."
            actor: "device"
            expect: "WLED-AP appears as an access point."
            timeout_seconds: 30
          - action: "Join WLED-AP using the documented passphrase."
            actor: "user"
          - action: "Open http://4.3.2.1/ (or any URL — the captive DNS redirects), then Config → WiFi Setup."
            actor: "client"
            expect: "WLED settings page served on port 80."
          - action: "Submit the home network SSID and passphrase, and optionally set the mDNS name."
            actor: "client"
            request:
              protocol: "http"
              action: "POST /settings/wifi"
              arguments:
                - name: "CS"
                  type: "string"
                  description: "Client SSID — the home network to join."
                  required: true
                - name: "PW0"
                  type: "string"
                  description: >
                    Client passphrase, sent in the clear. Named CP up to
                    v0.14.x; renamed PW0…PWn when multi-WiFi landed in
                    v0.15.0 (wled00/set.cpp).
                  required: true
                - name: "CM"
                  type: "string"
                  description: "mDNS name; the device becomes reachable at <CM>.local."
                  required: false
            notes: >
              Field names are those of WLED's own settings form. Treat them as
              a convenience for automation, not as a stable API: the settings
              pages are UI, and unlike the JSON API they carry no compatibility
              promise across releases. Driving the UI form is the documented
              path today; /json/cfg is the more durable one where the firmware
              build supports it.
          - action: "Save; the controller reboots and joins the home network."
            actor: "device"
            expect: "WLED-AP disappears; the device answers _wled._tcp.local."
            timeout_seconds: 60
      - type: "device_ui"
        verified: false
        description: >
          Vendor-assembled controllers (Athom and similar) ship pre-flashed and
          may be adopted through their own onboarding before WLED's, but the
          WiFi step above is the same one underneath.
        steps:
          - action: "Follow the assembler's quick-start, which lands on the WLED-AP portal above."
            actor: "user"
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: >
        The Security-page reset deletes all custom settings data — passwords,
        configuration, macros and presets. The >12s button hold erases flash,
        which additionally clears WiFi credentials and returns the board to
        first-boot AP mode. The >6s hold is the narrower one worth knowing:
        it resets only the WiFi settings, leaving presets and effects intact.
        (The docs' >6s/>12s carry margin over the code thresholds, which are
        5000 ms and 10000 ms in wled00/button.cpp — holding past the
        documented figures satisfies both.)
      procedures:
        - name: "Hold button 0 for more than 6 seconds (WiFi settings only)"
          hold_seconds: 6
          indicator: "Controller reboots and WLED-AP reappears."
          steps:
            - action: "Hold the button on GPIO 0 for more than 6 seconds and release."
              actor: "user"
              expect: "WiFi settings return to defaults; the setup AP comes back."
        - name: "Hold button 0 for more than 12 seconds (erase flash)"
          hold_seconds: 12
          indicator: "Controller reboots into first-boot state with no presets."
          steps:
            - action: "Hold the button on GPIO 0 for more than 12 seconds and release."
              actor: "user"
              expect: "Flash erased; the device behaves as freshly flashed."
              notes: >
                Presets and segment layout are lost. Export them from
                /presets.json first — on a large install that configuration is
                hours of work and there is no undo.
        - name: "Factory reset from the web UI"
          steps:
            - action: "Open Config → Security & Updates and use the factory reset control."
              actor: "user"
              expect: "All custom settings data is deleted."
              notes: >
                Requires the device to still be reachable, which the button
                holds do not. This is the path when the board is boxed into a
                fixture and its button is not accessible.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        WiFi settings can be rewritten from the settings UI while the device
        is still on the old network, which is the ordinary router-replacement
        path. If the old network is already gone, the recovery AP covers it:
        WLED reopens WLED-AP when it cannot connect, governed by the "AP
        opens" setting. That behaviour can be disabled in Security settings,
        and a controller with the recovery AP disabled and no reachable
        network needs one of the button holds above.
      steps:
        - action: "While still reachable, open Config → WiFi Setup and enter the new SSID and passphrase."
          actor: "client"
        - action: "Save; the controller reboots onto the new network."
          actor: "device"
          timeout_seconds: 60
    credentials:
      wifi_passphrase_protection: "plaintext"
      stored_on_device:
        - "Home network passphrase"
        - "OTA lock passphrase, when OTA lock is enabled (default 'wledota')"
        - "MQTT broker credentials, when MQTT is configured"
      issued_to_client: []
      notes: >
        WLED issues no per-client credential: anything that can reach port 80
        has full control, including the settings pages, unless OTA lock is
        enabled. There is no pairing step, no token and no per-client identity
        to store. For a consumer this cuts both ways — nothing to manage, and
        no way to tell one client from another — and it means network reach is
        the whole of the security model. Treat a WLED controller as trusting
        its LAN completely.

local_access:
  status: "native"
  summary: >
    Local control is the primary interface, not a fallback. WLED has no vendor
    cloud, requires no account, and every function in this spec works with the
    controller and the client on the same LAN and nothing else.
  covers:
    - "Power, brightness, colour, effects, palettes, segments, presets and playlists over the JSON API"
    - "Push state updates over the WebSocket"
    - "Per-pixel realtime streaming over E1.31/sACN, Art-Net, DDP, TPM2.net and the WARLS family"
    - "MQTT against a broker the user runs"
    - "Firmware replacement over OTA or USB"
  not_covered: []
  notes: >
    Optional outbound integrations exist (Alexa emulation, Hue polling,
    Blynk in older builds) but none is required and none carries a function
    that is otherwise unavailable. Nothing stops working if the device never
    reaches the internet.

http_endpoints:
  - method: "GET"
    path: "/json"
    name: "Full API response"
    description: >
      Everything at once: state, info, effects and palettes. Convenient for a
      first contact, wasteful as a poll — effects and palettes are static for
      a given firmware build and can run to tens of kilobytes. Fetch this once
      on discovery, then poll /json/state or take the WebSocket.
    response_body:
      content_type: "application/json"
      fields:
        - name: "state"
          type: "object"
          description: "Current light state; the writable half of the API."
        - name: "info"
          type: "object"
          description: "Read-only device metadata."
        - name: "effects"
          type: "array"
          description: "Effect names, indexed by the seg.fx value that selects them."
        - name: "palettes"
          type: "array"
          description: "Palette names, indexed by the seg.pal value that selects them."
  - method: "GET"
    path: "/json/state"
    name: "Read light state"
    description: "The state object alone — the correct poll target."
    response_body:
      content_type: "application/json"
      fields:
        - name: "on"
          type: "bool"
          description: "Power state."
        - name: "bri"
          type: "int"
          description: "Master brightness, 0-255. bri 0 is not the same as on:false; WLED treats them separately."
        - name: "transition"
          type: "int"
          description: "Crossfade duration in 100ms units, 0-65535."
        - name: "ps"
          type: "int"
          description: "Currently applied preset, -1 to 250. -1 means none."
        - name: "pl"
          type: "int"
          description: "Currently running playlist, -1 to 250. Read-only."
        - name: "nl"
          type: "object"
          description: "Nightlight timer settings."
        - name: "udpn"
          type: "object"
          description: "UDP sync send/receive toggles for this state change."
        - name: "live"
          type: "bool"
          description: "True while a realtime source is driving the LEDs."
        - name: "lor"
          type: "int"
          description: "Live data override: 0 off, 1 until the stream ends, 2 until reboot."
        - name: "seg"
          type: "array"
          description: >
            Segment array. Each entry carries its own start/stop, colours
            (col), effect (fx), speed (sx), intensity (ix) and palette (pal).
            Segments are the unit almost every real control operation acts on.
  - method: "POST"
    path: "/json/state"
    name: "Set light state"
    description: >
      Accepts a partial state object and applies it. Send only the keys being
      changed — a full round-trip of a previously read state will also replay
      fields such as ps and can undo a preset the user just selected.
    request_body:
      content_type: "application/json"
      fields:
        - name: "on"
          type: "bool | string"
          description: "true, false, or the string \"t\" to toggle without knowing the current state."
          required: false
        - name: "bri"
          type: "int"
          description: "Master brightness."
          required: false
          min: 0
          max: 255
        - name: "transition"
          type: "int"
          description: "Crossfade for this change, in 100ms units."
          required: false
        - name: "ps"
          type: "int"
          description: "Preset to apply."
          required: false
        - name: "seg"
          type: "array"
          description: "Per-segment changes; include each segment's id to address it."
          required: false
        - name: "v"
          type: "bool"
          description: "When true, the response body is the full updated state — one round trip instead of a write followed by a read."
          required: false
  - method: "POST"
    path: "/json"
    name: "Set state (alias)"
    description: "Accepts the same state object as /json/state; the JSON API treats them alike for writes."
  - method: "GET"
    path: "/json/info"
    name: "Device information"
    description: "Read-only metadata. This is the endpoint that identifies a device as WLED."
    response_body:
      content_type: "application/json"
      fields:
        - name: "ver"
          type: "string"
          description: "Human-readable firmware version, e.g. \"0.15.0\"."
        - name: "vid"
          type: "int"
          description: "Build ID as a date-derived integer. Compare against this, not against ver, when gating on firmware age."
        - name: "name"
          type: "string"
          description: "User-set friendly name. Display it; never key on it."
        - name: "mac"
          type: "string"
          description: "MAC address, hex, no separators. The stable identity key."
        - name: "ip"
          type: "string"
          description: "Current IP address."
        - name: "arch"
          type: "string"
          description: "Platform, e.g. \"esp8266\" or \"esp32\"."
        - name: "brand"
          type: "string"
          description: "Vendor string, normally \"WLED\". Use it to confirm an _http._tcp hit is really WLED."
        - name: "product"
          type: "string"
          description: "Product string, normally \"FOSS\"."
        - name: "udpport"
          type: "int"
          description: "UDP notifier/sync port this device is listening on. Read it rather than assuming 21324 — it is user-configurable."
        - name: "leds"
          type: "object"
          description: "LED configuration: count, segment capacity, power draw and the lc capability bitfield."
        - name: "fxcount"
          type: "int"
          description: "Number of effects, matching the /json/eff array length."
        - name: "palcount"
          type: "int"
          description: "Number of palettes."
        - name: "uptime"
          type: "int"
          description: "Seconds since boot. A drop signals a reboot, and with it any state a client cached."
        - name: "device_id"
          type: "string"
          description: "MAC-derived unique ID, added in 16.0.0. A better stable key candidate than mac for clients."
        - name: "psram"
          type: "int"
          description: "PSRAM size in bytes, added in 16.0.0 (a psram_free field accompanies it)."
        - name: "repo"
          type: "string"
          description: "Source repository the build came from, added in 16.0.0."
  - method: "GET"
    path: "/json/eff"
    name: "Effect list"
    description: "Effect names as an array; the index is the value written to seg.fx. Build-specific — sound-reactive forks add entries and shift nothing, but a fork may reorder."
  - method: "GET"
    path: "/json/pal"
    name: "Palette list"
    description: "Palette names as an array; the index is the value written to seg.pal."
  - method: "GET"
    path: "/json/fxdata"
    name: "Effect metadata"
    description: "Per-effect parameter metadata — which sliders and colour slots each effect actually uses. This is what lets a UI show the right controls per effect instead of all of them."
  - method: "GET"
    path: "/json/nodes"
    name: "Known WLED nodes"
    description: >
      Other WLED devices this one has seen on the UDP sync channel. A cheap
      second discovery path: find one controller and it will name its peers,
      which catches devices whose mDNS is being dropped by the network.
  - method: "GET"
    path: "/json/cfg"
    name: "Device configuration"
    description: >
      Full configuration document, including WiFi, sync, MQTT and LED
      hardware setup. Writable by POST on builds that permit it, which makes
      it the durable alternative to driving the settings form. Contains
      credentials — treat the response as secret and never log it verbatim.
  - method: "GET"
    path: "/json/si"
    name: "State and info"
    description: "state plus info without the effect and palette arrays — the efficient poll when a client wants both."
  - method: "GET"
    path: "/presets.json"
    name: "Preset store"
    description: >
      All stored presets and playlists as JSON. This is the backup a user
      needs before any factory reset, and the whole of what is lost without
      one.
  - method: "GET"
    path: "/win"
    name: "Legacy HTTP API"
    description: >
      The pre-JSON query-parameter API — /win&T=1 to turn on, &A= for
      brightness, &FX= for effect — answering with XML. Retained for
      compatibility and still the easiest thing to fire from a shell script or
      a button macro. New clients should use the JSON API; this one is
      documented because devices and integrations in the wild still speak it.
  - method: "GET"
    path: "/update"
    name: "OTA firmware update"
    description: >
      ArduinoOTA-style web upload for firmware replacement. Gated by the OTA
      lock passphrase when that is enabled in Security settings. Listed for
      completeness — the ability to replace the firmware is the freedom that
      makes the rest of this spec unnecessary in the first place.

websocket:
  path: "/ws"
  description: >
    Push channel carrying the same state object the JSON API returns, emitted
    on change. This is what a responsive client should use instead of polling
    /json/state: WLED devices are single-core microcontrollers also driving
    the LED bus, and a client polling at UI framerate degrades the very
    animation it is displaying.
  message_format: "json"
  notes: >
    The socket carries state and info in the same shape as /json/si. Sending a
    state object over the socket applies it, so a client need not fall back to
    HTTP for writes. Connection capacity is small — a couple of concurrent
    clients — so an app should hold one socket per device, not one per view.
  verification: "reported"

mqtt_topics:
  - topic: "wled/{mac}"
    name: "Device command topic"
    direction: "subscribe"
    description: >
      Default device topic when none is configured; {mac} is the lowercase MAC
      with no separators. Payload is a brightness value 0-255, or "ON", "OFF"
      or "T" to toggle.
    payload_format:
      encoding: "string"
  - topic: "wled/{mac}/col"
    name: "Device colour topic"
    direction: "subscribe"
    description: "Colour as hex (#RRGGBB or #WWRRGGBB) or as a 32-bit decimal."
    payload_format:
      encoding: "string"
  - topic: "wled/{mac}/api"
    name: "Device API topic"
    direction: "subscribe"
    description: >
      Full API access over MQTT: the payload is either a /win-style query
      string or a JSON state object. Anything the JSON API can do can be done
      here, which also means broker access equals device control.
    payload_format:
      encoding: "json"
  - topic: "wled/{mac}/g"
    name: "Brightness status"
    direction: "publish"
    description: "Current brightness, 0-255."
    payload_format:
      encoding: "string"
  - topic: "wled/{mac}/c"
    name: "Colour status"
    direction: "publish"
    description: "Current primary colour in hex."
    payload_format:
      encoding: "string"
  - topic: "wled/{mac}/v"
    name: "Full state status"
    direction: "publish"
    description: "The XML API response — the same document /win returns."
    payload_format:
      encoding: "string"
  - topic: "wled/{mac}/button/{button_number}"
    name: "Button event"
    direction: "publish"
    description: "Physical button state, for using a controller's button as an input elsewhere."
    payload_format:
      encoding: "string"
  - topic: "wled/{mac}/motion/{button_number}"
    name: "Motion sensor event"
    direction: "publish"
    description: "Motion sensor state on builds wired for one."
    payload_format:
      encoding: "string"

mqtt_configuration:
  optional: true
  default_broker_port: 1883
  default_device_topic: "wled/{mac}"
  group_topic:
    description: >
      An optional second topic, shared by several controllers, carrying the
      same three subscribe paths ({group}, {group}/col, {group}/api). Factory
      default is "wled/all" (mqttGroupTopic in wled00/wled.h, unchanged
      v0.14.4 through v16.0.1); emptying it disables group subscription.
  notes: >
    MQTT is off by default and points at a broker the user runs; there is no
    vendor broker and no account. Available since WLED 0.8.0. The long-
    announced breaking restructuring of the MQTT implementation (tracking
    issue wled/WLED#207) did NOT ship in 16.0.0 or 16.0.1 — the topic layout
    above is unchanged in current source, though the notice remains posted.
    The MQTT change that did land in 16.0.0 is mDNS broker discovery
    (.local broker hostnames are resolved via mDNS), which is additive.
  verification: "reported"

realtime_protocols:
  description: >
    Per-pixel streaming interfaces. All of these bypass the effect engine: the
    controller shows exactly the pixels it is sent, and ignores its own state
    until the stream stops and the timeout lapses. state.live goes true while
    this is happening, and state.lor decides whether a client can take control
    back. A client that sets a colour over the JSON API and sees nothing
    change should check state.live first — the usual cause is another sender
    still holding the device.
  protocols:
    - name: "WLED notifier / sync"
      port: 21324
      port_source: "Default; read info.udpport rather than assuming it."
      description: >
        WLED's own peer-to-peer sync — how one controller mirrors its state to
        others. Also the channel /json/nodes is populated from.
      identifier_byte: 0
      verification: "reported"
    - name: "WARLS"
      port: 21324
      identifier_byte: 1
      max_leds: 255
      description: "Byte 0 = 1, byte 1 = timeout seconds, then 4-byte tuples of LED index plus RGB."
      verification: "reported"
    - name: "DRGB"
      port: 21324
      identifier_byte: 2
      max_leds: 490
      description: "Byte 0 = 2, byte 1 = timeout seconds, then sequential RGB triplets from index 0."
      verification: "reported"
    - name: "DRGBW"
      port: 21324
      identifier_byte: 3
      max_leds: 367
      description: "As DRGB with a fourth white channel per pixel."
      verification: "reported"
    - name: "DNRGB"
      port: 21324
      identifier_byte: 4
      max_leds: 489
      description: >
        Byte 0 = 4, byte 1 = timeout, bytes 2-3 = start index, then sequential
        RGB. The start index is what lifts the 490-pixel ceiling: a sender
        splits a long strip across several packets.
      verification: "reported"
    - name: "DNRGBW"
      port: 21324
      identifier_byte: 5
      description: >
        White-channel variant of DNRGB. Present in current source
        (wled00/udp.cpp) but absent from the upstream docs table as of
        v16.0.1.
      verification: "reported"
    - name: "E1.31 (sACN)"
      port: 5568
      port_source: "E131_DEFAULT_PORT in wled00/src/dependencies/e131/ESPAsyncE131.h"
      description: >
        ANSI E1.31 over multicast or unicast. Up to 9 adjacent universes, 170
        LEDs (510 DMX channels) per universe. The 9-universe figure is the
        ESP8266 limit and the one the docs quote; current const.h allows 12
        universes on ESP32 and 20 on Ethernet builds. The interoperable
        choice — every lighting console and xLights speaks it.
      verification: "reported"
    - name: "Art-Net"
      port: 6454
      port_source: "ARTNET_DEFAULT_PORT in wled00/src/dependencies/e131/ESPAsyncE131.h"
      description: "Accepted since WLED 0.10.0, sharing E1.31's universe and DMX-mode configuration."
      verification: "reported"
    - name: "DDP"
      port: 4048
      port_source: "DDP_DEFAULT_PORT in wled00/src/dependencies/e131/ESPAsyncE131.h"
      description: >
        Distributed Display Protocol, accepted since WLED 0.11.0. 1440
        channels per packet, 10-byte header. Always uses Multi RGB regardless
        of the configured DMX mode, so the DMX-mode setting does not apply.
        The efficient choice for large single-controller installs.
      verification: "reported"
    - name: "TPM2.net"
      port: 65506
      description: "Accepted on its own fixed port, configured in Sync settings."
      verification: "reported"
    - name: "Hyperion"
      port: 19446
      max_leds: 490
      description: "Ambient-lighting protocol, protocol byte 0 on its own port."
      verification: "reported"
    - name: "UDP sound sync (v2)"
      port: 11988
      multicast_group: "239.0.0.1"
      description: >
        Pre-processed audio data for sound-reactive builds — WLED SR and
        MoonModules. Not present in mainline WLED without the sound-reactive
        usermod, which is the practical difference between the firmware
        variants an app has to handle.
      verification: "reported"
  realtime_mode_values:
    description: >
      REALTIME_MODE_* from wled00/const.h — the source that is driving the
      LEDs while state.live is true. Useful for telling a user which sender
      has the device rather than only that something does.
    values:
      0: "inactive"
      1: "generic"
      2: "UDP (WARLS family)"
      3: "Hyperion"
      4: "E1.31"
      5: "Adalight"
      6: "Art-Net"
      7: "TPM2.net"
      8: "DDP"
      9: "DMX"
    verification: "reported"

firmware_variants:
  description: >
    The same JSON and WebSocket API is spoken by several firmware lines, which
    is why a client should feature-detect rather than branch on a version
    string. WLED+ names these as its supported set, and it is a reasonable
    compatibility floor for any new client.
  variants:
    - name: "WLED"
      description: "Mainline, github.com/wled/WLED."
      minimum_supported: "0.13.3"
    - name: "WLED SR (Sound Reactive)"
      description: >
        Sound-reactive fork adding audio-driven effects and the sound-sync UDP
        channel. Extends the effect list, so effect indices are not comparable
        with mainline at the same version.
      minimum_supported: "0.13.3"
    - name: "MoonModules"
      description: >
        Community fork with additional effects and usermods. Broadly
        API-compatible; WLED+ supports it on a best-effort basis.
  notes: >
    Gate on info.vid and on the presence of a field, not on parsing info.ver.
    Fork version strings are not ordered against mainline's and cannot be
    compared numerically.

    Release status (verified 2026-07-31): latest release is v16.0.1
    (2026-07-07); v16.0.0 "Niji" (2026-05-03) was the major one — new ESP-IDF
    major underneath, segment layering, particle-system effects, GIF and
    HUB75 matrix support, DMX input. The official WLED app is now legacy and
    unmaintained; upstream endorses "WLED Native" (Moustachauve) instead.
    ESP8266 is end-of-life — the getting-started guide advises against
    building new setups on it.

entities:
  - platform: "light"
    name: "WLED"
    features: ["brightness", "rgb", "effect", "transition"]
    state_topic: "/json/state"
    state_mapping:
      on: "state.on"
      brightness: "state.bri"
      rgb: "state.seg[0].col[0]"
      effect: "state.seg[0].fx"
    commands:
      turn_on: "POST /json/state {\"on\": true}"
      turn_off: "POST /json/state {\"on\": false}"
      toggle: "POST /json/state {\"on\": \"t\"}"
      set_brightness: "POST /json/state {\"bri\": <0-255>}"
      set_effect: "POST /json/state {\"seg\": [{\"id\": 0, \"fx\": <index>}]}"
  - platform: "binary_sensor"
    name: "Realtime source active"
    device_class: "running"
    state_topic: "/json/state"
    state_mapping:
      state: "state.live"
  - platform: "sensor"
    name: "Uptime"
    unit: "s"
    state_topic: "/json/info"
    state_mapping:
      state: "info.uptime"
