sources:
  - type: "static_analysis"
    artifact: "com.shiningdisplay.shiningdisplay 1.6.4"
    sha256: "202be55006a98db3131a384d25352d03bcb54039651b59b6701ec185024733d3"
    xapk_sha256: "6907fd4a434e714c823495730d35aca4600db4f8d1fdaab0c64498e51de78f50"
    obtained_via: "third-party APK mirror (XAPK), 2026-08-18"
    description: >
      Static analysis of the "Shining Display" Android companion app
      (2026-08-18). It is a React Native build: all protocol logic lives in
      its Hermes bytecode bundle, which was disassembled in full (string
      table plus code) to recover the command builders. The Java side
      contributed the JieLi OTA UUIDs AE00/AE01/AE02 and the OEM's wrapper
      around the JieLi OTA SDK.
  - type: "firmware_image"
