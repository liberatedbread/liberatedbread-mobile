# UREVO walking pad / under-desk treadmill family — Device Spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Protocol source (clean-room): static analysis of the official UREVO app —
#   a Flutter build whose BLE stack lives in a Dart AOT snapshot. The
#   snapshot was parsed and the protocol-relevant functions disassembled:
#   the builders and parsers for both frame families, the checksum and CRC
#   routines, the command builders for prepare/start/stop/pause/resume,
#   set-speed-and-slope and the config and status queries, the response
#   dispatch table (every cmd/sub key mapped to its parser), the
#   unit-conversion helpers, and the per-profile GATT UUID accessors. No
#   vendor code or assets are copied here; only derived protocol facts, and
#   the app's internal names are paraphrased by role rather than quoted.
#   All frame bytes below come from that disassembly, not from on-device captures:
#   nothing here is hardware-confirmed yet (no HCI snoop on a real pad).

device:
  name: "UREVO walking pad family (URTM*/SYWP* under-desk treadmills)"
  manufacturer: "UREVO (urevosports.com)"
  manufacturer_status: "active"
  testing:
    status: untested
  openness:
    status: "undocumented"
  protocol: "ble"
  category: "treadmill"
  type: "treadmill"
  notes: >
    UREVO's walking pads / under-desk treadmills (model numbers seen in the
    app: URTM012, URTM018, URTM022, URTM023, URTM024, URTM029, URTM030,
    URTM041, SYWP006; retail families include SpaceWalk, Strol and CyberPad)
    are controlled over BLE by the official UREVO app. The
    manufacturer is alive and shipping; this is a cloud-independence spec:
    the app ties account, workout history, OTA and per-model metadata to the
    UREVO cloud (service.urevosports.com), while the control plane is local
    BLE GATT. No pairing/bonding or authentication strings exist anywhere in
    the treadmill code paths — control appears to be open to any central in
    range, as with other walking-pad brands.

    The app's BLE layer routes a discovered peripheral to one of several
    protocol handlers. Three of them cover treadmills; the short names FTMS,
    FT and UR below are this spec's own labels for the three wire protocols,
    not the app's:

    1. FTMS — standard Bluetooth Fitness
       Machine Service 0x1826. Selected when the advertisement carries
       0x1826. Characteristic set confirmed by the handler's UUID accessors:
       write 0x2AD9 (Control Point), notify 0x2ACD (Treadmill Data),
       0x2ADA (Fitness Machine Status) and 0x2AD3 (Training Status), plus
       reads of 0x2AD4 (Supported Speed Range) and 0x2AD5 (Supported
       Inclination Range). No vendor pre-amble or private characteristic
       exists in this path — treat it as plain FTMS 1.0.

    2. FT proprietary — private service
       0xFFF0, write 0xFFF2, notify 0xFFF1. Speaks the Frame-A frame
       grammar (below) with command class 0x44. Model-specific subclasses
       exist in the binary (eleven of them, keyed by model) and are
       selected from per-model config.

    3. UR proprietary — UREVO's own treadmill protocol, matched by
       advertised-name prefix URTM* / SYWP* at handler-selection time. Speaks the same Frame-A grammar with
       command class 0x53, plus a second frame family, Frame B,
       (0x5A 0xA5 header, >= 11 bytes) used at least for the controller
       version-info query. NOTA BENE: no GATT service/characteristic UUID
       constants exist in the binary for this class (verified 2026-08-12 by
       full string-table enumeration of the snapshot: the only 16-bit GATT
       UUIDs present are 0x180A, 0x1826, 0x2A23-0x2A29, 0x2ACD/2AD3/2AD4/
       2AD5/2AD9/2ADA, 0xFEE0-0xFEE2, 0xFFF0-0xFFF2) — the app binds the
       UR characteristics by GATT enumeration and/or per-model cloud config.
       The UR service/characteristic UUIDs must be captured
       from hardware (HCI snoop); do not guess them.

    Relationship to KingSmith WalkingPad (see kingsmith-walkingpad.yaml):
    none at the protocol level. The KingSmith WiLink service 0xFE00, the
    ODM characteristic d18d2c10-… and the supplement service 24e2521c-… are
    all ABSENT from the UREVO binary (0 matches), and the UREVO frame
    grammar (02…03 + XOR-0x5A checksum; 5A A5 + CRC-16) shares nothing with
    WiLink (F7…FD + additive checksum). The only overlap is that both
    brands ship newer models speaking standard FTMS 0x1826.

    The same app also drives UREVO recovery massagers (name prefix UCRM*;
    the vendor's own profile; services 0xFFF0 and 0xFEE0 — write
    0xFEE2, notify 0xFEE1 on the V2 generation) and smart scales
    (the hex string 55525753 = ASCII "URWS" appears in the handler
    matcher). Those product lines are out of scope for this spec.

    SAFETY: motorised exercise equipment. The frame grammar carries no
    authentication, so anyone in radio range can issue start/speed commands
    once the frame bytes are confirmed against hardware.

    Cloud dependency: none for control once the GATT endpoints are known.
    The UR class's reliance on cloud per-model config for
    endpoint discovery is the one soft spot — capture the endpoints once
    and the cloud is no longer needed. Cloud surface seen in the binary
    (app-side; nothing the pad itself contacts): API hosts
    service.urevosports.com and urevo.urevosports.com (HTTPS), H5 pages on
    h5.urevosports.com, plus two hardcoded plain-HTTP IP endpoints
    (http://106.52.219.41:8082, http://81.71.103.167 — Tencent Cloud
    ranges, likely legacy/fallback API hosts). OTA metadata comes from
    /product/api/ota/otaCheckVersion (plus getProductAll, addUpdateLog,
    addConnectLog) on the API host; workout/history sync under /data/api/
    and the scale API under /api/service-scale/. All of it is account-
    bound app traffic — the BLE control plane never touches it.
  identification:
    service_uuids:
      - "00001826-0000-1000-8000-00805f9b34fb"   # FTMS models
      - "0000fff0-0000-1000-8000-00805f9b34fb"   # FT proprietary models
    notes: >
      UR-protocol models (URTM*/SYWP* name prefixes) do not expose their
      service UUID as a constant in the app; identify them by advertised
      name prefix and enumerate services after connect. 0x1826 / 0xFFF0
      cover the FTMS and FT classes respectively — 0xFFF0 is attributed to
      the FT proprietary protocol class ONLY. Whether UR-class pads
      advertise 0xFFF0 (or anything else) is unknown; their service and
      characteristic UUIDs must come from hardware capture, not from this
      list.

  setup:
    required: false
    confidence: medium
    notes: >
      No provisioning, pairing or bonding is visible in any treadmill code
      path of the official app: scan, connect over GATT, enable
      notifications and write commands. Confidence medium rather than high:
      this rests on static analysis only — no bonding/pairing API usage
      exists in the treadmill classes, but no hardware capture has confirmed
      the pads accept an unbonded central.
    methods:
      - type: ble_direct
        description: >
          Connect over GATT. FTMS models: standard FTMS flow (subscribe
          0x2ACD/0x2ADA, write Control Point 0x2AD9). FT models: enable
          notify on 0xFFF1, write Frame-A frames to 0xFFF2. UR models
          (URTM*/SYWP*): enumerate services, pick the write + notify
          characteristic pair, speak Frame-A (class 0x53) frames.
        verified: false
        ble:
          pairing_required: false
        steps:
          - action: "Power on the pad so it advertises."
            actor: user
          - action: "Scan: name prefixes URTM* / SYWP* (UR protocol), advertised service 0x1826 (FTMS) or 0xFFF0 (FT proprietary)."
            actor: client
          - action: "Connect over GATT and discover services; pick the protocol class by advertised service UUID (0x1826 / 0xFFF0) or name prefix."
            actor: client
          - action: "Enable notifications (0x2ACD/0x2ADA on FTMS, 0xFFF1 on FT, enumerated notify char on UR), then write commands (0x2AD9 / 0xFFF2 / enumerated write char)."
            actor: client
            expect: "Status notifications arrive; speed commands change belt speed. NOT yet confirmed on hardware."
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        No factory-reset procedure is recoverable from the app binary for
        the treadmills (the massager classes have a
        RestoreFactorySettingsResponse, treadmills do not). The pads hold no
        network credentials and no bonds, so there is nothing to clear for
        local control. Not stated rather than guessed.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The pad joins no network. Any client may connect once the previous
        central disconnects (single-connection peripheral, as typical for
        this device class — not yet confirmed for UREVO hardware).
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        BLE-only control plane; no credentials cross the link and no
        authentication of any kind was found in the treadmill classes.

services:
  # ------------------------------------------------------------- FTMS
  - uuid: "00001826-0000-1000-8000-00805f9b34fb"
    name: "Fitness Machine Service (FTMS-generation models)"
    notes: >
      Standard Bluetooth FTMS, selected when the advertisement carries
      0x1826. The full characteristic set below is confirmed by the
      handler's UUID accessors in the app (each UUID string is referenced by
      the accessor for the corresponding characteristic). No vendor
      extension, pre-amble or private characteristic was found in this
      path — unlike KingSmith's FTMS generation, there is no ODM
      characteristic and no supplement service. Command frames are built in
      code (no constant FTMS frames embedded); assume standard FTMS 1.0
      Control Point semantics (0x00 Request Control, 0x02 Set Target Speed
      with uint16-LE 0.01 km/h, 0x07 Start/Resume, 0x08 Stop/Pause) until
      an HCI snoop confirms the exact opcode set the app emits.
    characteristics:
      - uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
        name: "Treadmill Control Point"
        properties: ["write", "indicate"]
        notes: >
          Write target for FTMS commands; responses parsed as standard
          control-point responses with result codes, per FTMS 1.0. Exact opcodes emitted by the app not
          yet extracted from the Dart AOT code — standard FTMS 1.0 opcode
          set expected (needs HCI snoop).
        commands:
          request_control:
            description: "Standard FTMS Request Control (opcode 0x00). Assumed from FTMS 1.0; not yet confirmed as emitted by the app."
            verification: "hypothesis"
            value: [0x00]
          set_target_speed:
            description: "Standard FTMS Set Target Speed (opcode 0x02), uint16-LE in 0.01 km/h. Assumed from FTMS 1.0; not yet confirmed as emitted by the app."
            verification: "hypothesis"
            template: [0x02, "{speed}"]
            parameters:
              speed:
                type: "uint16"
                scale: 0.01
                unit: "km/h"
                min: 0
                max: 2500
          start_or_resume:
            description: "Standard FTMS Start or Resume (opcode 0x07). Assumed from FTMS 1.0."
            verification: "hypothesis"
            value: [0x07]
          stop_or_pause:
            description: "Standard FTMS Stop or Pause (opcode 0x08, param 0x01 stop / 0x02 pause). Assumed from FTMS 1.0."
            verification: "hypothesis"
            template: [0x08, "{action}"]
            parameters:
              action:
                type: "uint8"
                min: 1
                max: 2
      - uuid: "00002acd-0000-1000-8000-00805f9b34fb"
        name: "Treadmill Data"
        properties: ["notify"]
        notes: "Standard FTMS Treadmill Data; parsed by the app's shared FTMS reader. No vendor flag extensions found in the binary."
      - uuid: "00002ada-0000-1000-8000-00805f9b34fb"
        name: "Fitness Machine Status"
        properties: ["notify"]
        notes: "Standard FTMS status events; in the class's notify-characteristic list."
      - uuid: "00002ad3-0000-1000-8000-00805f9b34fb"
        name: "Training Status"
        properties: ["notify"]
        notes: "In the class's notify-characteristic list (0x2AD3 = Training Status per FTMS 1.0)."
      - uuid: "00002ad4-0000-1000-8000-00805f9b34fb"
        name: "Supported Speed Range"
        properties: ["read"]
        notes: "Read by readSupportSpeedRange after connect; use it to bound speed commands per model."
      - uuid: "00002ad5-0000-1000-8000-00805f9b34fb"
        name: "Supported Inclination Range"
        properties: ["read"]
        notes: "Read by readSupportInclinationRange; relevant on incline-capable models."

  # ------------------------------------------- FT / UR proprietary BLE
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "Proprietary frame service (FT class; UR class endpoint TBD)"
    notes: >
      Private 16-bit service 0xFFF0, write 0xFFF2, notify 0xFFF1 — the
      FT handler's service, write-characteristic and notify-characteristic
      accessors reference exactly these UUIDs. This is the endpoint for the
      FT class, which also covers that family's exercise bikes. The UR class
      (name prefixes URTM*/SYWP*) speaks the SAME frame grammar — identical
      builder and serialiser code — but no UUID constants
      exist in the binary for it, so its GATT endpoints must come from
      hardware capture; the UR command set is documented here because the
      wire grammar is shared.

      Frame A frame grammar (both directions; recovered from
      the frame builder, the frame factory and the checksum helper):

        02 <cmd> <sub> <payload...> <checksum> 03

      - byte 0 = 0x02 (frame start; the frame factory dispatches on
        first == 0x02 AND last == 0x03)
      - byte 1 = command class (0x44 FT equipment, 0x53 UR treadmill,
        0x50 config query, 0x51 status query; 0x40 also exists, purpose
        unidentified)
      - byte 2 = sub-command / action (optional; absent on the 0x51
        status query)
      - payload = zero or more parameter bytes
      - checksum = (cmd + sub + sum(payload bytes)) & 0xFF, then XOR 0x5A
        (disassembly of the checksum helper: additive sum of the command
        class, the sub-command and every payload byte, masked to 8 bits,
        XOR 0x5A)
      - last byte = 0x03 (frame end)

      A second frame family, Frame B, carries version/OTA traffic. Its
      full layout is recovered (the builder, serialiser, parser and CRC helper):

        5A A5 <f1> <f2> <f3> <cmd> <sub> <len u16-LE> <data...> <crc u16-LE>

      - bytes 0-1 = 0x5A 0xA5 (the frame factory dispatches on these)
      - f1/f2/f3 = three 1-byte header fields (0x01 0x03 0x00 in the
        version query; semantics unidentified — possibly
        protocol-version/type constants)
      - cmd/sub = the command key (0x10 0x01 = controller version query;
        answers are dispatched on the same cmd/sub pair, so 0x10 0x01 in
        equals the OTA-major-version report out)
      - len = uint16 little-endian count of data bytes
        (built from a native 16-bit list view, i.e. ARM little-endian)
      - crc = CRC-16/CCITT-FALSE (poly 0x1021, init 0xFFFF, MSB-first, no
        final XOR) over ALL preceding bytes including the 5A A5 header,
        appended little-endian. The inbound parser recomputes it and
        rejects on mismatch; minimum accepted frame length is 11 bytes.

      Frame-B response keys seen in the app's response dispatch:
      1001 -> OTA major version (treadmill and massager V2);
      1002/1003/1004 -> OTA update start / write / exit (massager V2 only —
      no treadmill OTA-push commands exist in this app version).

      Speed/slope encoding: the set-speed-and-slope builder converts the
      display speed via the app's km/h conversion (slope via the symmetric
      inverse), which divide by a per-unit factor read from a runtime
      unit-config map (keys 'kmh' / 'slope', default 1.0 when unset). The
      absolute speed step (0.1 km/h or otherwise) is therefore not a fixed
      constant in the binary — read it from the 0x50 speed-config response
      on hardware.
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: "Status / response notifications"
        properties: ["notify"]
        notes: >
          Inbound proprietary frames. Responses are dispatched on a key
          built from the protocol handler plus the frame's command class and
          sub-command bytes; treadmill answers carry the same cmd class as
          the request. Full treadmill mapping recovered from that dispatch
          table:

            51   (no sub) -> status report
            53 01 -> prepared/ready ack   53 02 -> set-speed-and-slope ack
            53 03 -> stop ack             53 04 -> BLE-link state report
            53 09 -> start ack            53 0A -> pause ack
            50 00 -> version info         50 02 -> speed configuration
            50 03 -> slope configuration
            50 04 -> mileage / odometer
            53 10 -> dot-matrix screen contents  (UR class only)
            53 11 -> dot-matrix screen write ack (UR class only)
            10 01 -> OTA major version            (Frame-B frame)

          The FT and UR treadmill classes share this map: the keys are
          namespaced per handler but resolve to the same parsers. Keys
          50 00 (version info), 50 04 (mileage), 53 04 (BLE-link state),
          and the dot-matrix pair have no matching command builder in the
          UR path — either unsolicited / model-specific, or their builders
          are inlined elsewhere; treat as response-only until a sender is
          confirmed. Per-field offsets inside these responses are not yet
          recovered — parsing lives in the per-handler parse routine; needs
          an HCI snoop or further disassembly.

          Command class 0x40 (previously "purpose unidentified") is a
          different product family: keys 4000-4004 map to parsers for
          light set/get, switch-config get/set and an electrical-usage
          query — a lighting/electrical accessory, not a treadmill.
      - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
        name: "Command write"
        properties: ["write", "write_without_response"]
        notes: >
          All commands below are Frame-A frames; checksums on the
          constant commands are shown resolved per the formula above. Every
          byte sequence here was recovered by disassembling the app's
          command builders — none of it has been
          exercised against real hardware yet.

          The UR class's controller version-info query is a Frame-B frame
          and is now fully recovered — see ur_get_controller_version below.
          CRC-16/CCITT-FALSE over the first 9 bytes is 0x6F8C, appended
          little-endian. The answer is the OTA-major-version report
          (cmd 0x10 sub 0x01), NOT the Frame-A version info that answers
          cmd 0x50 sub 0x00.
        commands:
          # ---- FT class (cmd class 0x44) ----
          ft_prepared:
            description: "FT class: prepare/ready the belt before a workout."
            verification: "reported"
            value: [0x02, 0x44, 0x01, 0x1F, 0x03]
          ft_stop:
            description: "FT class: stop the belt."
            verification: "reported"
            value: [0x02, 0x44, 0x04, 0x12, 0x03]
          # ---- UR treadmill class (cmd class 0x53) ----
          ur_training_prepared:
            description: "UR class: enter prepared/ready state."
            verification: "reported"
            value: [0x02, 0x53, 0x01, 0x0E, 0x03]
          ur_set_speed_and_slope:
            description: "UR class: set target belt speed and slope. Speed and slope are integer counts of the device-reported step (see service notes); slope 0 on flat models."
            verification: "reported"
            template: [0x02, 0x53, 0x02, "{speed}", "{slope}", "{checksum}", 0x03]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
                description: "Target speed in device speed-step counts (display speed / step). Absolute step TBD from the speed-config response."
              slope:
                type: "uint8"
                min: 0
                max: 255
                default: 0
                description: >
                  Target incline in device slope-step counts; 0 on flat walking
                  pads. Defaults to 0 so a speed-only client can drive
                  set-speed without owning an incline it does not have.
              checksum:
                type: "uint8"
                auto: "checksum"
                checksum_xor: 0x5A
          ur_training_stop:
            description: "UR class: stop the belt."
            verification: "reported"
            value: [0x02, 0x53, 0x03, 0x0C, 0x03]
          ur_training_continue:
            description: "UR class: resume after pause."
            verification: "reported"
            value: [0x02, 0x53, 0x09, 0x06, 0x03]
          ur_training_pause:
            description: "UR class: pause, belt holds state."
            verification: "reported"
            value: [0x02, 0x53, 0x0A, 0x07, 0x03]
          # ---- UR treadmill queries ----
          ur_get_speed_config:
            description: "UR class: query speed configuration (range/step) — cmd 0x50 sub 0x02. The answer is the speed-configuration report."
            verification: "reported"
            value: [0x02, 0x50, 0x02, 0x08, 0x03]
          ur_get_slope_config:
            description: "UR class: query slope configuration — cmd 0x50 sub 0x03. The answer is the slope-configuration report."
            verification: "reported"
            value: [0x02, 0x50, 0x03, 0x09, 0x03]
          ur_get_equipment_status:
            description: "UR class: poll current equipment status — cmd 0x51 with NO sub-command byte. The answer is the status report."
            verification: "reported"
            value: [0x02, 0x51, 0x0B, 0x03]
          ur_get_controller_version:
            description: "UR class: query controller (OTA-major) version — a Frame-B frame: header fields 01 03 00, cmd 0x10 sub 0x01, data length 0, CRC-16/CCITT-FALSE over bytes 0-8 appended little-endian. The answer is the OTA-major-version report. The massager V2 handler emits the identical frame."
            verification: "reported"
            value: [0x5A, 0xA5, 0x01, 0x03, 0x00, 0x10, 0x01, 0x00, 0x00, 0x8C, 0x6F]

  # ------------------------------------------------------------- DIS
  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    name: "Device Information Service"
    notes: >
      Standard DIS, parsed by the app's BlueDIS class. Characteristic
      strings 0x2A23-0x2A29 (system ID, model number, serial number,
      firmware revision, hardware revision, software revision,
      manufacturer name) are all referenced by getters. The model-number
      string is the likely per-model key the app feeds into its
      config/factory routing.
    characteristics:
      - uuid: "00002a24-0000-1000-8000-00805f9b34fb"
        name: "Model Number String"
        properties: ["read"]
      - uuid: "00002a26-0000-1000-8000-00805f9b34fb"
        name: "Firmware Revision String"
        properties: ["read"]

helpful_urls:
  - url: "https://www.urevosports.com/"
    title: "UREVO official site"
    description: "Manufacturer status (active, 2026 retail listings)."
  - url: "https://play.google.com/store/apps/details?id=com.urevo.app"
    title: "UREVO app (Google Play)"
    description: "Official companion app — the protocol source for this spec."
