device:
  name: SensorPush HT1 / HTP.xw
  manufacturer: SensorPush
  model: HT1 (temperature + humidity), HTP.xw (temperature + humidity + barometric pressure)
  category: sensor
  type: sensor-temperature-humidity
  transport: ble
  # 'gatt' is not a schema protocol; GATT is the attribute protocol carried over
  # BLE, and the services/characteristics below already say the access is GATT.
  protocol: ble
  # SensorPush still sells these; the protocol is simply closed. Per the schema's
  # own guidance that is 'active', not a bespoke 'production'.
  manufacturer_status: active
  identification:
    service_uuids:
      # V1 (HT1) and V2 (HTP.xw) primary services. Both are advertised for
      # discovery; the vendor Bluetooth API doc pairs the V2 service with the
      # same …aa9 characteristics documented under the V1 service below.
      - "ef090000-11d6-42ba-93b8-9dd7ec090aa9"
      - "ef090000-11d6-42ba-93b8-9dd7ec090ab0"
  notes: |
    Protocol documented via community reverse engineering and now openly by the vendor.
    Primary source: SensorPush Bluetooth API documentation
    (https://www.sensorpush.com/bluetooth-api), which publishes the full 2nd-generation
    GATT table; corroborated by sensorpush-bleak (cryptomcgrath, 5★) and
    sensorpush-ble (Bluetooth-Devices).
    Two hardware generations: HT1 (V1, thermometer + hygrometer) and HTP.xw (V2,
    thermometer + hygrometer + barometer). HT1 is the only model excluded from the
    vendor's open protocol documentation.
    TI CC2540/CC2541 BLE SoC. Uses OAD (Over-the-Air Download) firmware update service.
    Temperature/humidity accessed via write-then-read pattern: write 4-byte trigger, ~110ms delay, then read.
    Values are 4-byte signed int LE in hundredths (vendor doc: "4 Byte Signed Int LE";
    a u16 cannot encode the -40 °C bottom of the HT1 range).
    History data retrieved in bulk notification chunks with 4-byte timestamp header.
    Device reports battery voltage + raw temperature sensor in Battery Info characteristic.
    Uses SensorPush BLE Advertisement Detection: name/address prefix check plus UUID slicing.

  setup:
    required: false
    confidence: medium
    notes: >
      Nothing is provisioned. The sensor advertises continuously and serves
      readings to any client that connects; there is no pairing, bonding or
      account. The SensorPush app's cloud gateway is a separate product, not a
      prerequisite for reading the sensor.

      Which generation you have decides the service UUID — HT1 (V1) ends
      ...090aa9, HTP.xw (V2) ends ...090ab0 — so detection must check both.

      Confidence is medium: the flow comes from two independent community
      implementations (sensorpush-bleak, sensorpush-ble) rather than from a run
      against hardware here.
    methods:
      - type: ble_direct
        description: >
          Connect over GATT and read temperature and humidity with the
          write-then-read pattern: write the 4-byte trigger, wait ~110 ms, then
          read the result.
        verified: false
        ble:
          pairing_required: false
        steps:
          - action: "Insert the battery; the sensor advertises continuously from power-on."
            actor: user
          - action: >
              Scan for the SensorPush name/address prefix and match the primary
              service UUID to identify the generation — ...090aa9 for HT1,
              ...090ab0 for HTP.xw.
            actor: client
          - action: "Connect over GATT. No pairing is requested."
            actor: client
          - action: >
              Write the 4-byte trigger to the measurement characteristic, wait
              110 ms, then read it back.
            actor: client
            expect: "A current temperature and humidity reading (barometric pressure also on HTP.xw via ef090082)."
    factory_reset:
      applicable: false
      confidence: high
      effect: >
        Vendor-documented: there is no factory reset function. Removing and
        replacing the battery resets the firmware; the app separately offers a
        "Clear Data" reset for logged history. The device exposes a TI OAD
        firmware-update service on adjacent handles — guessing at opcodes near
        that is how a sensor ends up in bootloader mode. Battery pull is the
        only safe state change.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The sensor joins no network. Any client may connect once the previous
        one disconnects.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        BLE-only; no WiFi passphrase crosses the link. The connection is
        unauthenticated, so readings and logged history are available to anyone
        in range.

services:
  # The V1 (HT1) and V2 (HTP.xw) primary services differ only in the final UUID
  # byte (…aa9 vs …ab0). The vendor Bluetooth API doc pairs the …ab0 service
  # with the same …aa9 characteristics listed below (e.g. DeviceID
  # ef090001-…-090aa9 lives inside service ef090000-…-090ab0 on V2).
  - uuid: "ef090000-11d6-42ba-93b8-9dd7ec090aa9"
    name: SensorPush Service (V1/HT1)
    description: Primary GATT service for HT1 (temperature + humidity)
    notes: >
      V2/HTP.xw (temperature + humidity + barometric pressure) exposes the
      counterpart service ef090000-11d6-42ba-93b8-9dd7ec090ab0 carrying the
      same …aa9 characteristics (vendor Bluetooth API documentation).
    characteristics:
      - uuid: "ef090001-11d6-42ba-93b8-9dd7ec090aa9"
        name: DeviceID
        properties: ["read"]
        description: Device unique identifier (fixed 4 bytes, uint32, read-only per vendor doc; a write attempt causes immediate disconnection)

      - uuid: "ef090002-11d6-42ba-93b8-9dd7ec090aa9"
        name: RevisionCode
        properties: ["read"]
        description: "7-byte firmware revision: i1_i2.i3_i4.i5_i6.i7 format"

      - uuid: "ef090003-11d6-42ba-93b8-9dd7ec090aa9"
        name: TxPower
        properties: ["read", "write"]
        description: "TX power, read/write (vendor doc): valid -21..+5 dBm; observed value 5 = +5 dBm default"

      - uuid: "ef090004-11d6-42ba-93b8-9dd7ec090aa9"
        name: SampleInterval
        properties: ["read"]
        description: Logging sample interval in seconds (integer)

      - uuid: "ef090005-11d6-42ba-93b8-9dd7ec090aa9"
        name: AdvertisingInterval
        properties: ["read", "write"]
        description: "Advertising interval, uint16 read/write (vendor doc), units of 625 us; observed 0x0808 = 2056 = 1285 ms default; 0xFEEF disables advertising entirely until battery pull"

      - uuid: "ef090007-11d6-42ba-93b8-9dd7ec090aa9"
        name: BatteryInfo
        properties: ["read"]
        description: "4 bytes: [battery_voltage_u16le / 1000 = volts, raw_temp_u16le]"

      - uuid: "ef090008-11d6-42ba-93b8-9dd7ec090aa9"
        name: Timestamp
        # Source spec recorded `type: write` with `access: read_write`; the union
        # of the two is read+write.
        properties: ["read", "write"]
        description: "Device clock (4 bytes, u32le, seconds since Unix epoch)"
        access: read_write

      - uuid: "ef090009-11d6-42ba-93b8-9dd7ec090aa9"
        name: BulkData27
        properties: ["notify"]
        description: Bulk sample data block (timestamp + 4-byte sample records)

      - uuid: "ef09000a-11d6-42ba-93b8-9dd7ec090aa9"
        name: BulkData29
        properties: ["notify"]
        description: Bulk sample data block (remote history retrieval)

      - uuid: "ef09000b-11d6-42ba-93b8-9dd7ec090aa9"
        name: Unknown32
        properties: ["read"]
        description: "Unknown characteristic at handle 32 (vendor V2 table: RESERVED)"

      - uuid: "ef09000c-11d6-42ba-93b8-9dd7ec090aa9"
        name: LEDControl
        properties: ["read", "write"]
        description: "LED control, read/write (vendor doc)"

      - uuid: "ef09000d-11d6-42ba-93b8-9dd7ec090aa9"
        name: MACAddress
        properties: ["read"]
        description: "MAC address, 6 bytes, read-only (vendor doc)"

      - uuid: "ef090080-11d6-42ba-93b8-9dd7ec090aa9"
        name: Temperature
        # write-then-read: the trigger write and the value read are both real
        # accesses, so both properties are listed. `access` keeps the ordering.
        properties: ["read", "write"]
        description: "Temperature in °C. Write 4-byte trigger (0x01000100), wait 110ms, read 4-byte int32le / 100 (vendor doc: 4 Byte Signed Int LE; a u16 cannot encode -40 °C)"
        access: write_read
        trigger_write: "01000100"

      - uuid: "ef090081-11d6-42ba-93b8-9dd7ec090aa9"
        name: Humidity
        properties: ["read", "write"]
        description: "Humidity in %RH. Write 4-byte trigger (0x01000100), wait 110ms, read 4-byte int32le / 100 (vendor doc: 4 Byte Signed Int LE)"
        access: write_read
        trigger_write: "01000100"

      - uuid: "ef090082-11d6-42ba-93b8-9dd7ec090aa9"
        name: BarometricPressure
        properties: ["read", "write"]
        description: "Barometric pressure (station pressure) in hundredths of Pa, 4-byte int32le / 100 (vendor Bluetooth API doc). HTP.xw (V2) only; follows the same write-then-read trigger pattern as temperature/humidity."
        access: write_read
        trigger_write: "01000100"

  # TI CC2540 OAD firmware update service. The three OAD characteristics were
  # recovered without their parent service UUID; f000ffc0-… is the standard TI
  # OAD service that owns f000ffc1/c2/c5 (same UUID used by the Airthings spec).
  - uuid: "f000ffc0-0451-4000-b000-000000000000"
    name: TI OAD Firmware Update Service
    characteristics:
      - uuid: "f000ffc1-0451-4000-b000-000000000000"
        name: OADImageIdentify
        properties: ["write"]
        description: TI OAD firmware image identification
      - uuid: "f000ffc2-0451-4000-b000-000000000000"
        name: OADImageBlock
        properties: ["write"]
        description: TI OAD firmware image block transfer
      - uuid: "f000ffc5-0451-4000-b000-000000000000"
        name: OADControl
        properties: ["write"]
        description: "TI OAD Control characteristic (per TI's canonical OAD map; Image Count is f000ffc3, not present here)"

advertising:
  discovery_method: service_uuid_and_name
  local_name_prefixes:
    - "SensorPush "
    - "s"
  manufacturer_data_format:
    - byte_offset: 0
      name: manufacturer_id
      size: 2
      description: Manufacturer-specific ID prefix
    - byte_offset: 2
      name: payload
      size: variable
      description: Manufacturer-specific payload data

data_format:
  battery:
    encoding: u16le
    scale: 0.001
    unit: V
    byte_offset: 0
    size: 2
    description: Battery voltage
  temperature:
    encoding: int32le
    scale: 0.01
    unit: °C
    byte_offset: 0
    size: 4
    description: Signed 32-bit LE, hundredths of °C (vendor doc; signed matters below 0 °C)
  humidity:
    encoding: int32le
    scale: 0.01
    unit: "%RH"
    byte_offset: 0
    size: 4
    description: Signed 32-bit LE, hundredths of %RH (vendor doc)
  revision:
    encoding: ascii
    format: "{b[0]:03d}_{b[1]:03d}.{b[2]:03d}_{b[3]:03d}.{b[4]:03d}_{b[5]:03d}.{b[6]:03d}"
  bulk_sample:
    description: |
      Each sample is 4 bytes. Bulk data: [4-byte u32le timestamp] + [N × 4-byte sample records].
      All 4 bytes of each sample record are packed payload (encoded temp/humidity fields).
      Stop token: 0xFFFFFFFF marks end of valid data.
      Note: the "65 = standard reading type prefix" in sensorpush-bleak is a hardcoded
      dummy byte that library prepends to select its HT.w (type 65) pack-params —
      it is NOT a per-record type byte on the wire.

source:
  vendor_documentation:
    - "SensorPush Bluetooth API (official 2nd-gen GATT table): https://www.sensorpush.com/bluetooth-api"
  community_libraries:
    - cryptomcgrath/sensorpush-bleak (5★)
    - Bluetooth-Devices/sensorpush-ble
  date_extracted: "2026-07-28"
