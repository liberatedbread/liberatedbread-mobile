    py_nissan_leaf_obd_ble: "Every 10 s with the car on; 5 min when the car looks off (the VCM probe got no reply); 1 h when the adapter is out of BLE range."
    ovms_ze1_seconds_by_state: {car_off: "no polling", car_on_or_driving: "group 01/02 every 60 s, 04 every 180 s, 61 every 900 s", charging: "same, plus group 06 every 60 s"}
