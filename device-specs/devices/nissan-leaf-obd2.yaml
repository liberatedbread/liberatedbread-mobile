        - {name: "capacity_ah", byte_offset: 14, length: 4, divisor: 10000, unit: "Ah", verification: "reported", source: "Battery-Emulator (ZE1 only)"}
    group_62:
      response_length: {ZE0: 118, AZE0: 118, ZE1: 120}
      fields:
