        count: 4
        raw_offset: 2
        temp_offset: 4
        stride: 3
        raw_length: 2
        raw_absent: "0xFFFF -- sensor 3 is absent on 2013+ packs, which have three sensors (Battery-Emulator)"
        temp_unit: "C"
        temp_byte: "Whole degrees Celsius as reported by the LBC; signedness below 0 C not established"
        raw_to_celsius: {scale: -0.102, raw_offset: -710, formula: "-0.102 * (raw - 710)", source: "OVMS (linear approximation; Battery-Emulator uses its own raw-to-F conversion instead)"}
        verification: "reported"
      fields:
        - {name: "sensor_5_temp", byte_offset: 14, length: 1, unit: "C", verification: "reported", source: "OVMS"}
      notes: "ZE1's 31-byte reply is decoded with the same first 16 bytes by OVMS, which calls its own ZE1 capture incomplete; the rest is unmapped."
    group_06:
      response_length: 26
      notes: >
        Balancing-shunt flags for the 96 cells. The layout is disputed. OVMS
        reads 24 bytes (payload[2..25]) at 4 bits per byte: bit 3 = first cell of
        the byte, bit 0 = fourth ("shunt order 8421"). It then inverts the whole
        set. Battery-Emulator reads 12 bytes (payload[2..13]) at 8 bits per byte,
        with bit i of byte n = cell 8n + i. No decode is asserted here.
    group_61:
      response_length: 331
      applies_to: ["ZE1"]
      fields:
        - {name: "hx", byte_offset: 2, length: 2, divisor: 100, unit: "%", verification: "reported", source: "Battery-Emulator (ZE1 takes Hx from here)"}
        - {name: "state_of_health", byte_offset: 4, length: 2, divisor: 100, unit: "%", verification: "reported", source: "OVMS PollReply_BMS_SOH, Battery-Emulator"}
        - {name: "soh_bar_count", byte_offset: 6, length: 1, verification: "reported", source: "Battery-Emulator (reads 0xFF on a pack bench-tested off the car)"}
        - {name: "state_of_health_unfiltered", byte_offset: 7, length: 2, divisor: 100, unit: "%", verification: "reported", source: "Battery-Emulator"}
