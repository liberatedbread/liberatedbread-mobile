        unit: "V"
        invalid: "0xFFFF (Battery-Emulator), or any value >= 5000 mV (OVMS)"
        verification: "reported"
        source: "OVMS PollReply_BMS_Volt, Battery-Emulator, community spreadsheet group 2"
