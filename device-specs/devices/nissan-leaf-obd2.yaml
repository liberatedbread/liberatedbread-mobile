  excluded_services:
    description: >
      Services that the same open sources send and that this read-only spec deliberately
      does not carry as requests. They are named by service only, so a reader
      knows they exist and why they are absent.
    entries:
      - service: "10 C0 to the VCM (0x797)"
        why: >
          py-nissan-leaf-obd-ble sends 02 10 C0 first and calls it a mystery
          command. It treats no reply as "car off" and skips the remaining polls.
          It is a DiagnosticSessionControl into a Nissan-specific session. Battery-Emulator
          uses the same session request on the LBC as the first step of its
          degradation-history reset. Its effect on the VCM is undocumented. A
          read-only client can probe with VCM DID 0x1304 instead; whether that
          works as a wake probe on every generation is a hypothesis.
      - service: "14 (ClearDiagnosticInformation) to the LBC"
        why: "Clears stored battery DTCs (Battery-Emulator). A write."
      - service: "10 / 3E / 27 / 31 sequence to the LBC"
        why: >
          Battery-Emulator's degradation-history (SOH) reset: session control,
          tester present, a SecurityAccess seed/key exchange and RoutineControl. It rewrites
          what the pack reports about its own health. Out of scope.
