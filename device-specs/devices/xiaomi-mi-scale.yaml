# Xiaomi Mi Scale BLE Body Composition Scale
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Xiaomi Mi Scale Body Composition Scale"
  manufacturer: "Xiaomi / Huami"
  manufacturer_status: "unsupported"
  testing:
    status: untested
  protocol: "ble"
  category: "scale"
  notes: >
    Xiaomi Mi Scale v1 and v2 body composition scales. v1 is weight-only;
    v2 adds impedance measurement for body composition (body fat, muscle,
    water, bone mass, visceral fat, BMR). Price $20-30. Body composition is
    computed client-side from the impedance reading; the metric math
    originates from Holtek (the scale's MCU OEM) — Zepp Life ships it as a
    JNI wrapper (a Holtek body-fat class loading a native body-fat
    library) — and openScale's MiScaleLib is the reverse-engineered port.
    A newer Xiaomi Body Composition Scale S400 (MJTZC01YM) exists and is
    handled by openScale's separate MiScaleS400Handler.

    PROTOCOL: uses BLE standard Weight Scale service (0x181D) plus a
    custom Mi vendor service (0x1530) for v2 configuration. Weight readings
    arrive as live 13-byte (v2) or 10-byte (v1) notifications. History data
    is downloaded via a handshake protocol on characteristic 0x2A2F.

    WEIGHT FRAME (10-byte, both variants): [ctrl_byte] [weight_lo]
    [weight_hi] [year_lo] [year_hi] [month] [day] [hour] [min] [sec].
    Control byte bits: Bit0=LBS, Bit4=Jin, Bit5=Stabilized,
    Bit7=WeightRemoved. Valid only when Bit5=1 AND Bit7=0.
    Weight division: /100 for lbs/jin, /200 for kg.
    Weight value 0xFFF0 (65520) is a sentinel (overload / no valid
    reading), not a measurement — Zepp Life's parsers special-case it.

    v2 LIVE FRAME (13-byte): [ctrl0] [ctrl1] [year_lo] [year_hi] [month]
    [day] [hour] [min] [sec] [imp_lo] [imp_hi] [weight_lo] [weight_hi].
    This does NOT extend the 10-byte layout — two control bytes come first
    and weight sits at bytes 11-12, not bytes 1-2. Control byte 0:
    Bit0=LBS. Control byte 1: Bit1=hasImpedance, Bit5=Stabilized,
    Bit6=isCatty, Bit7=WeightRemoved. Impedance at bytes 9-10 (uint16 LE)
    when hasImpedance=1. Zepp Life's v2 frame parser matches this layout
    exactly, including /100 scaling for lbs and jin vs /200 for kg, and
    treats weight 0xFFF0 as an overload sentinel (forced unstabilized).

    HISTORY DOWNLOAD: enable notify on 0x2A2F, then write
    `01 <ts:uint32le>` = "count records since unix timestamp ts" — the
    `01 96 8A BD 62` in older docs is NOT fixed magic, it is this opcode
    with one hardcoded ts (0x62BD8A96). The scale replies
    `01 <count:uint16le>`. Write `02` to trigger the transfer; records
    arrive as concatenated 10-byte (v1) / 13-byte (v2) frames in the
    live-frame layout until a notification of 1 byte or less ends the
    stream. Finish with `03` (also aborts); if exactly `count` records
    arrived, confirm the sync point with `04 <ts:uint32le>`. Decoded
    from Zepp Life's sync profile; app-derived, not hardware-verified.

    UNIT CONFIG: set scale unit via vendor characteristic 0x1542 under
    service 0x1530 with `06 04 00 <unit>` (0=kg/SI, 1=lbs/imperial,
    2=jin/catty — matches Zepp Life's weight-unit enum KG=0/POUND=1/
    JIN=2). The app writes further 0x1542 commands: opcode `06` with
    sub-commands 05, 0A, 0B, 0F, 10, 11, 12 (mode/user management) and,
    on v2, opcode `04` with args 01-04; their semantics are only
    partially understood (medium confidence). Documented on v2; the
    openScale wiki's v1 GATT dump also lists 0x1530 with
    0x1531/0x1532/0x1542/0x1543, so the vendor service is NOT v2-only.

    DISCOVERY: advertised names: "MIBCS", "MIBFS", "MI SCALE2",
    "MI_SCALE_*". Service UUID 0x181D is present on v1 only — v2 (MIBCS)
    exposes 0x181B with 0x2A9C Body Composition Measurement (indicate), not
    0x181D/0x2A9D, so a 0x181D scan filter misses v2. openScale discovers
    by advertised name, which is the robust path. Zepp Life matches names
    by regex (a MI/MIBCS/MIBFS brand rule), so exact advertised strings
    like "MI SCALE2" are NOT confirmed by the app and remain
    community-sourced. v2 broadcasts weight/impedance in its
    advertisements (Service Data, AD type 0x16), enabling passive
    connectionless reading; Zepp Life's advertisement parser also
    handles 0x181D Service Data as v1 10-byte weight frames (plus a
    0xFEE0 service-data variant), so passive reading covers v1 as well.

    CONFIDENCE: HIGH for all UUIDs, weight frame format, control bits,
    history protocol, and v2 impedance frames — sourced from
    github.com/oliexdev/openScale, a production Android app with
    years of real-world use across hundreds of users. The v2 13-byte
    frame layout, unit enum, and service/characteristic bindings
    (0x181D + 0x2A9D/0x2A2B/0x2A2F on v1; 0x181B + 0x2A9C on v2; vendor
    0x1530 with 0x1542/0x1543 and DFU 0x1531/0x1532) are independently
    corroborated by the Zepp Life app (jadx, 2026). Details decoded
    only from the app and not verified on hardware (history-sync
    parameterization, extra 0x1542 sub-commands, 0xFFF0 sentinel,
    advertisement Service Data parsing) are MEDIUM confidence.

  identification:
    service_uuids:
      - "0000181d-0000-1000-8000-00805f9b34fb"
    local_name_prefix: "MI"
    notes: >
      Service UUID 0x181D is present on v1 only; v2 (MIBCS) exposes 0x181B
      instead, so filtering on 0x181D misses v2 scales. Discover by
      advertised name — MIBCS, MIBFS, MI_SCALE — as openScale does.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "MI"
          service_uuids:
            - "0000181d-0000-1000-8000-00805f9b34fb"
          notes: >
            Name-based discovery is primary (MIBCS / MIBFS / MI_SCALE
            prefixes): 0x181D appears only on v1, while v2 advertises 0x181B
            and also broadcasts weight/impedance in advertisement Service
            Data (AD type 0x16), which can be read passively without
            connecting. Zepp Life's advertisement parser handles 0x181B
            and 0xFEE0 Service Data for v2 and 0x181D Service Data as
            v1 10-byte weight frames, so passive reading covers v1 too.
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning. Scale advertises when stepped on or powered.
      For history download, sync current time to 0x2A2B before
      requesting data.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Scan for 0x181D service, connect, subscribe for weight
          notifications. No pairing required for basic reading.
        ble:
          pairing_required: false
        steps:
          - action: "Step on scale to wake it."
            actor: "user"
            request:
              protocol: "ble_gatt"
          - action: >
              Scan for 0x181D Weight Scale service or known name prefixes
              (MIBCS, MIBFS, MI_SCALE) and connect.
            actor: "client"
          - action: >
              Subscribe to notifications on 0x2A9D (weight measurement)
              and/or 0x2A2F (history).
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        Remove battery to clear internal state. No credential storage.
      procedures:
        - name: "Battery removal"
          steps:
            - action: "Remove batteries for 30 seconds and reinsert."
              actor: "user"
              expect: "Scale resets and advertises."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "No bonding. Scale accepts connections from any central."
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: "BLE-only. No auth. Health data — handle with privacy awareness."

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
  variants:
    - model: "Mi Scale v1"
      identification:
        local_name_prefix: "MI_SCALE"
      notes: >
        Weight only, no impedance. Service 0x181D. 10-byte frames.
        History on 0x2A2F under 0x181D. The openScale wiki's v1 GATT dump
        also lists vendor service 0x1530 (0x1531/0x1532/0x1542/0x1543), so
        the vendor service is not v2-only.
    - model: "Mi Body Composition Scale v2"
      identification:
        local_name_prefix: "MIBCS"
      notes: >
        Body composition via impedance. Service 0x181B (primary) + 0x1530
        vendor service. 13-byte live frames with impedance. Unit config
        via 0x1542.
    - model: "Mi Body Composition Scale (MIBFS)"
      identification:
        local_name_prefix: "MIBFS"
      notes: "Same as v2, different advertised name prefix."
    - model: "Mi Scale 2"
      identification:
        local_name_prefix: "MI SCALE2"
      notes: >
        v2 capabilities. The exact advertised name "MI SCALE2" is
        community-sourced only: Zepp Life matches device names by regex
        (a MI/MIBCS/MIBFS brand rule), so the app cannot confirm the
        literal string. Treat the exact name as unverified.

helpful_urls:
  - title: "openScale"
    url: "https://github.com/oliexdev/openScale"
    description: "Production Android app and the cited source for the Mi Scale weight frame, history sync and impedance handling."
  - title: "ESPHome Xiaomi Miscale sensor component"
    url: "https://esphome.io/components/sensor/xiaomi_miscale/"
    description: "ESPHome BLE-tracker component decoding the Mi Scale advertisement frames documented here (XMTZC01/02/04/05)."

  - title: "Xiaomi Mi Body Composition Scale 2 user manual"
    url: "https://www.manualslib.com/manual/3004176/Xiaomi-Mi-Body-Composition-Scale-2.html"
    kind: "manual"
    description: >
      Vendor manual for the v2 scale, whose impedance frame this spec decodes.
services:
  - uuid: "0000181d-0000-1000-8000-00805f9b34fb"
    name: "Weight Scale Service"
    notes: >
      Standard BLE Weight Scale service. Present on v1; the independent v2
      (MIBCS) GATT dump shows NO 0x181D — v2 exposes 0x181B with 0x2A9C
      instead. Carries weight measurement (0x2A9D), weight scale feature
      (0x2A9E), current time (0x2A2B), and Mi history (0x2A2F).
    characteristics:
      - uuid: "00002a9d-0000-1000-8000-00805f9b34fb"
        name: "Weight Measurement"
        properties: ["notify"]
        notes: >
          Standard BLE Weight Measurement characteristic. Often absent
          on Mi scales — weight arrives via 0x2A2F instead. When present,
          carries 10-byte weight frame.
          The frame is the v1 layout in device.notes, NOT the SIG Weight
          Measurement layout (whose flags byte would put a 0.005 kg / 0.01 lb
          weight at the same offsets but with different scaling and no
          timestamp). Layout from openScale's Mi Scale handler and Zepp Life's
          frame parser; reported, not read back by this project. Weight is
          only valid when control bit 5 (stabilised) is set and bit 7
          (weight removed) is clear; raw 0xFFF0 is an overload sentinel.
        format:
          - offset: 0
            length: 1
            name: "control"
            type: "uint8"
            notes: >
              Bit field, not a code: bit 0 = pounds, bit 4 = jin (catty),
              bit 5 = stabilised, bit 7 = weight removed. The two unit bits
              are also declared on their own as unit_flags below.
          - offset: 0
            length: 1
            name: "unit_flags"
            type: "uint8"
            mask: 0x11
            values:
              0: "kg"
              1: "lb"
              16: "jin"
            notes: "Bits 0 and 4 of the control byte: the unit weight_raw is in."
          - offset: 1
            length: 2
            name: "weight_raw"
            type: "uint16"
            scale: 0.005
            unit: "kg"
            unit_source: "device_setting"
            unit_reference: "00002a9d-0000-1000-8000-00805f9b34fb.unit_flags"
            unit_values:
              0: "kg"
              1: "lb"
              16: "jin"
              default: "kg"
            unit_scales:
              kg: 0.005
              lb: 0.01
              jin: 0.01
            device_class: "weight"
            notes: >
              The scale reports in whichever unit it is set to, and changing
              the unit changes the resolution too: kilograms at raw / 200,
              pounds and jin at raw / 100. unit_values and unit_scales state
              both from unit_flags. The 0x1542 unit command selects which
              unit the scale uses.
          - offset: 3
            length: 2
            name: "year"
            type: "uint16"
          - offset: 5
            length: 1
            name: "month"
            type: "uint8"
          - offset: 6
            length: 1
            name: "day"
            type: "uint8"
          - offset: 7
            length: 1
            name: "hour"
            type: "uint8"
          - offset: 8
            length: 1
            name: "minute"
            type: "uint8"
          - offset: 9
            length: 1
            name: "second"
            type: "uint8"

      - uuid: "00002a2f-0000-3512-2118-0009af100700"
        name: "History"
        properties: ["write", "notify"]
        notes: >
          Custom history characteristic. Per Zepp Life's sync profile:
          write `01 <ts:uint32le>` ("count records since unix time ts" —
          the previously documented fixed magic `01 96 8A BD 62` is this
          opcode with ts=0x62BD8A96, not a constant); the scale replies
          `01 <count:uint16le>`. Write `02` to trigger the transfer and
          collect concatenated 10-byte (v1) / 13-byte (v2) records until
          a notification of 1 byte or less ends the stream. Finish with
          `03`; on a complete transfer confirm with `04 <ts:uint32le>`.
          App-derived, not hardware-verified (medium confidence).
          No format block: the notifications are a concatenation of whole
          records (a v1 unit can pack two 10-byte records into one 20-byte
          notification) interleaved with the 1-byte end marker and the
          `01 <count>` reply, so no fixed offset holds across the stream.
          Each record has the 0x2A9D layout on v1 and the 0x2A9C layout on
          v2; a client walks the buffer in record-sized steps.

      - uuid: "00002a2b-0000-1000-8000-00805f9b34fb"
        name: "Current Time"
        properties: ["write"]
        notes: >
          Write current time before history download:
          `[year_lo, year_hi, month, day, hour, min, sec, 0x00, 0x00, 0x01]`

  - uuid: "00001530-0000-3512-2118-0009af100700"
    name: "Mi Vendor Service"
    notes: >
      Present on v2 and — per the openScale wiki's v1 GATT dump — on v1 as
      well, so it is not v2-only. Provides unit configuration via 0x1542,
      a BLE DFU firmware-update channel via 0x1531/0x1532 (OTAs are
      delivered device-bound via the Zepp Life app; no public firmware
      files), and a low-battery characteristic 0x1543. Zepp Life binds
      exactly this layout: its weight profiles attach 0x1542/0x1543
      under 0x1530, and its DFU profile uses service 0x1530 with
      control point 0x1531 and packet 0x1532.
    characteristics:
      - uuid: "00001542-0000-3512-2118-0009af100700"
        name: "Mi Config"
        properties: ["write"]
        notes: >
          Set scale unit: `06 04 00 <unit>` where 0=kg/SI,
          1=lbs/imperial, 2=jin/catty (matches Zepp Life's weight-unit
          enum KG=0/POUND=1/JIN=2). Zepp Life also writes opcode `06`
          with sub-commands 05, 0A, 0B, 0F, 10, 11, 12 and, on v2,
          opcode `04` with args 01-04 (mode/user management; semantics
          only partially understood — medium confidence).
      - uuid: "00001531-0000-3512-2118-0009af100700"
        name: "DFU Control Point"
        properties: ["write", "notify"]
        notes: >
          BLE DFU control point for firmware updates, together with the
          0x1532 DFU Packet characteristic.
      - uuid: "00001532-0000-3512-2118-0009af100700"
        name: "DFU Packet"
        properties: ["write_without_response"]
        notes: "DFU data channel; firmware image is streamed here."
      - uuid: "00001543-0000-3512-2118-0009af100700"
        name: "Low Battery"
        properties: ["read", "write", "notify"]
        notes: "Low-battery indication (uint8; always 0x01 in the ble-in-xiaomi v2 GATT dump)."

  - uuid: "0000181b-0000-1000-8000-00805f9b34fb"
    name: "Body Composition Service (v2 only)"
    notes: >
      v2 primary service. Carries history, current time, and the body
      composition measurement for v2 scales.
    characteristics:
      - uuid: "00002a9c-0000-1000-8000-00805f9b34fb"
        name: "Body Composition Measurement"
        properties: ["indicate"]
        notes: >
          Standard Body Composition Measurement — the v2 GATT dump shows
          0x2A9C with indicate, not the 0x2A9D Weight Measurement.
          What it carries is the 13-byte v2 live frame from device.notes,
          not the SIG Body Composition layout: two control bytes, a
          timestamp, impedance and then weight. Layout from openScale's v2
          handler and Zepp Life's parser (reported, not read back here).
          Weight is valid when control byte 1 bit 5 (stabilised) is set and
          bit 7 (weight removed) is clear; impedance is meaningful only when
          control byte 1 bit 1 is set; raw weight 0xFFF0 is an overload
          sentinel.
        format:
          - offset: 0
            length: 1
            name: "control_0"
            type: "uint8"
            notes: "Bit 0 = pounds."
          - offset: 1
            length: 1
            name: "control_1"
            type: "uint8"
            notes: >
              Bit 1 = impedance present, bit 5 = stabilised, bit 6 = jin
              (catty), bit 7 = weight removed.
          - offset: 0
            length: 2
            name: "unit_flags"
            type: "uint16"
            endianness: "little"
            mask: 0x4001
            values:
              0: "kg"
              1: "lb"
              16384: "jin"
            notes: >
              The two unit bits, read as one little-endian word over both
              control bytes: bit 0 is control_0 bit 0 (pounds) and bit 14 is
              control_1 bit 6 (jin).
          - offset: 2
            length: 2
            name: "year"
            type: "uint16"
          - offset: 4
            length: 1
            name: "month"
            type: "uint8"
          - offset: 5
            length: 1
            name: "day"
            type: "uint8"
          - offset: 6
            length: 1
            name: "hour"
            type: "uint8"
          - offset: 7
            length: 1
            name: "minute"
            type: "uint8"
          - offset: 8
            length: 1
            name: "second"
            type: "uint8"
          - offset: 9
            length: 2
            name: "impedance"
            type: "uint16"
            unit: "ohm"
            notes: >
              Body impedance in ohms, the input to the client-side body
              composition maths. Only meaningful when control_1 bit 1 is
              set; otherwise the scale has not finished measuring.
          - offset: 11
            length: 2
            name: "weight_raw"
            type: "uint16"
            scale: 0.005
            unit: "kg"
            unit_source: "device_setting"
            unit_reference: "00002a9c-0000-1000-8000-00805f9b34fb.unit_flags"
            unit_values:
              0: "kg"
              1: "lb"
              16384: "jin"
              default: "kg"
            unit_scales:
              kg: 0.005
              lb: 0.01
              jin: 0.01
            device_class: "weight"
            notes: >
              Kilograms at raw / 200 when neither unit bit is set; pounds at
              raw / 100 when control_0 bit 0 is set; jin at raw / 100 when
              control_1 bit 6 is set. unit_values and unit_scales state both
              from unit_flags.

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["huami_dfu"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "vendor_cloud"
        notes: >
          OTAs are delivered device-bound through the Zepp Life app; there
          are no public firmware files.
      enter:
        how: "unknown"
        notes: >
          The DFU control point 0x1531 and packet 0x1532 sit in the Mi vendor
          service 0x1530 in normal mode, beside the 0x1542 unit
          configuration. How the app starts an update on them is not
          established.
      dfu_mode:
        notes: "How the scale appears while updating is not established."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        App-derived (Zepp Life's DFU profile binds service 0x1530 with control
        point 0x1531 and packet 0x1532), not hardware-verified. The layout
        mirrors Nordic's legacy DFU (1530/1531/1532) but on the Huami
        0000xxxx-0000-3512-2118-0009af100700 base, not Nordic's
        …-1212-efde-1523-785feabcd123, so a Nordic legacy client will not
        find it, and whether the opcodes match Nordic's is not established
        (hence `huami_dfu`, not nordic_legacy_dfu). dfu.services is omitted because
        0x1530 also carries the unit configuration a client does need to
        write.

entities:
  - platform: "sensor"
    name: "Weight"
    device_class: "weight"
    unit: "kg"
    variants: ["Mi Scale v1"]
    state_characteristic: "00002a9d-0000-1000-8000-00805f9b34fb"
    state_mapping:
      value: "weight_raw"
    notes: >
      v1 only — the body-composition models carry weight in the 0x2A9C frame
      instead (see the second Weight entity). kg is the out-of-box unit. When
      the scale is switched to pounds or jin, the bound field's unit_values
      and unit_scales give the unit and scaling in force.
  - platform: "sensor"
    name: "Weight"
    device_class: "weight"
    unit: "kg"
    variants:
      - "Mi Body Composition Scale v2"
      - "Mi Body Composition Scale (MIBFS)"
      - "Mi Scale 2"
    state_characteristic: "00002a9c-0000-1000-8000-00805f9b34fb"
    state_mapping:
      value: "weight_raw"
    notes: >
      From the 13-byte v2 frame. kg is the out-of-box unit; the bound
      field's unit_values and unit_scales follow this frame's unit_flags.
  - platform: "sensor"
    name: "Impedance"
    unit: "ohm"
    variants:
      - "Mi Body Composition Scale v2"
      - "Mi Body Composition Scale (MIBFS)"
      - "Mi Scale 2"
    state_characteristic: "00002a9c-0000-1000-8000-00805f9b34fb"
    state_mapping:
      value: "impedance"
    notes: >
      Rebound from the 0x2A2F history stream (a concatenation of records
      with no fixed offset) to the live 0x2A9C frame, which is where a
      body-composition scale reports impedance as it measures. Valid only
      while control_1 bit 1 is set. v1 scales have no impedance.
  - platform: "select"
    name: "Unit"
    state_characteristic: "00001542-0000-3512-2118-0009af100700"
    state_mapping:
      "0": "kg"
      "1": "lbs"
      "2": "jin"
    notes: >
      No select_option command is bound because no set command is declared —
      the unit-set frame (06 04 00 <unit>) is documented only in the 0x1542
      characteristic notes, so a binding-only consumer renders this entity
      hidden until that frame is promoted to a command.

remaining_unknowns:
  - >
    The weight fields' unit is a bit field of the same frame (pounds,
    jin or kilograms, each with its own divisor), which `unit_values` —
    a raw-value-to-unit table — cannot express; the format blocks declare
    the kilogram decode and describe the other two in notes, so a consumer
    must test the control bits itself.
  - >
    0x2A2F history notifications concatenate whole records and interleave
    the count reply and the end marker, so they carry no format block; a
    client walks them in record-sized steps using the 0x2A9D (v1) or 0x2A9C
    (v2) layout.
  - >
    Neither frame layout has been read back from a scale by this project;
    both rest on openScale and Zepp Life's parsers.
