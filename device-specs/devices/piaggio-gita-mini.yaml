evidence:
  artifacts:
    - type: "static_analysis"
      artifact: "com.piaggiofastforward.mobile 1.7.4 (Android versionCode 5254323), base APK"
      sha256: "4defe8eebf9350a5f0d53e9eb117733a919cb41f2b74aa234689afc6208376a2"
      obtained_via: "third-party APK mirror, 2026-11-07"
      description: >
        Primary source for model IDs, GATT map, ECDH/AES command transport,
        registration, Wi-Fi, notification IDs, session credential and OTA V2.
        The base and ARM64 signer digests match. JADX reported six errors in
        third-party code; relevant AES, BLE and manifest code was available.
    - type: "static_analysis"
      artifact: "com.piaggiofastforward.mobile 1.7.2"
      obtained_via: "third-party APK mirror, 2026-08-29"
      description: >
        Earlier independent extraction of the same GATT/encryption/command
        model, used as corroboration where the 1.7.4 analysis agrees. The
        newer 1.7.4 findings supersede it on product/version boundaries.
    - type: "vendor_documentation"
      description: >
        Official Mini/Plus manual, Mini quick start, setup/app help, sensor
        overview and release-note index. Establishes visual following,
        registration materials, Wi-Fi and the Mini no-streaming exclusion.
    - type: "public_research"
      artifact: "Bluetooth SIG Assigned Numbers and Mini FCC statement card"
      description: >
        Bluetooth company ID 0x083B maps to PFF. The Mini statement card
        confirms a radar sensing unit but names no specific radar FCC ID;
        2AY6H-101187 remains a candidate only.
    - type: "public_api"
      artifact: "https://api.mygita.com/info/version"
      description: >
        Unauthenticated metadata reported API 1.16.21 and minimum app 1.4.5.
        This is app policy information, not a robot firmware version.
  open_questions: >
    `remaining_unknowns` lists the hardware captures needed first: passive
    advertisements, a normal authenticated connection resolving the native
    crypto-name caveat, offline session reuse, and an owner-approved OTA
    capture. No robot session, firmware image or Pro-specific retail profile
    was obtained.
