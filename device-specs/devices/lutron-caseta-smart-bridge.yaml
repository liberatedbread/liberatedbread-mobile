# Lutron Caséta Smart Bridge 2 — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Lutron Caseta Smart Bridge 2"
  manufacturer: "Lutron"
  manufacturer_status: "active"
  testing:
    status: verified
    detail: minimally-verified
    notes: >
      Probed live 2026-08-14 against the real bridge (same unit as the
      2026-07-16 evidence; firmware has since moved 08.25.17f000 ->
      08.28.11f000 per the _lutron._tcp CODEVER TXT). All four documented
      mDNS services re-observed (_leap 8081, _lap 8083, _lutron 22 with
      MACADDR/CODEVER/SYSTYPE=SmartBridge TXT, _hap 4548). The
      certificate-auth model was exercised to its gate: a TLS handshake on
      8081 (LEAP) reaches the bridge's CertificateRequest (RSA/ECDSA client
      cert types listed) and is aborted by the bridge with a bad-certificate
      alert when no client certificate is presented; 8083 (LAP) behaves the
      same. Cross-check: the LEAP server certificate CN is
      SmartBridgeB894D9AABBCC — the MACADDR from the _lutron TXT record —
      and the LAP server cert chains to "Caseta Local Access Protocol Cert
      Authority". Halted at the physical pairing button (nobody home):
      CSR signing and authenticated LEAP commands remain unexercised by us.
  protocol: "wifi"
  category: "hub"
  transport: "tls"  # LEAP: JSON documents on a TLS socket
  integration: "identify_only"
  notes: >
    Lutron Caseta Smart Bridge 2 advertises multiple local services. LEAP on
    port 8081 is the modern local control protocol: newline-delimited JSON
    over a direct mutual-TLS socket. LAP on
    port 8083 is deprecated for control but is still where certificate
    pairing happens. The _lutron._tcp record exposes stable bridge identity
    including MACADDR, firmware CODEVER, system type, and device class; its
    SRV port 22 is the bridge's SSH, not LEAP. HomeKit HAP is separately
    advertised on port 4548.

    This is the non-Pro bridge (L-BDG2): LEAP only, no LIP/Telnet
    integration. The Smart Bridge PRO (L-BDGPRO2) adds Lutron Integration
    Protocol on Telnet 23 with its own integration IDs, which this spec does
    not document. The bridge talks to Caseta dimmers, switches, shades and
    Picos over Clear Connect Type A (431-437 MHz in North America), not
    Zigbee, Z-Wave or Wi-Fi; a Pico paired directly to a dimmer keeps working
    without the bridge, which is needed for the app, schedules, remote
    access and third-party integration. Community teardowns describe a TI
    AM335x Linux host with an STM32 coprocessor driving the sub-GHz radio
    (reported, not a vendor BOM).

    This project does NOT drive LEAP yet, so the bridge is classified
    integration: identify_only — the app recognises it from its _leap._tcp /
    _lutron._tcp advertisements and hands the user off to Lutron's own app
    rather than claiming control. The full LEAP handshake, certificate pairing
    and command surface below are documented and kept intact for when a LEAP
    transport is implemented; nothing here has been removed. There is no local
    web admin UI to deep-link to (control is the LEAP protocol itself), so no
    admin_url is set.
  identification:
    # Deliberately NO mac_prefixes. The bridge captured below reports
    # b8:94:d9:aa:bb:cc in its _lutron._tcp MACADDR record, but B8:94:D9 is
    # assigned to Texas Instruments -- it identifies TI silicon inside the
    # bridge (community teardowns put a TI AM335x host SoC there, the likely
    # owner of the Ethernet MAC), not Lutron. Listing it would flag every TI-radio device on the
    # network as possibly a Caseta bridge. Lutron's own OUI is 00:0F:E7, but we
    # have never observed a Caseta bridge using it, and guessing from the
    # registry is exactly what the schema tells you not to do.
    mdns_service_type: "_leap._tcp.local."
    default_port: 8081

  discovery:
    # pylutron-caseta and Home Assistant browse _lutron._tcp (HA matches
    # hostnames smartbridge*), not _leap._tcp; a client should accept either
    # rather than require _leap._tcp. The LEAP endpoint is 8081 whatever the
    # _lutron SRV port says, and /server reports it once connected.
    methods:
      - type: "mdns"
        mdns:
          service_type: "_leap._tcp.local."
          port: 8081
          identity_mapping:
            stable_keys:
              - source: "hostname"
            display:
              source: "name"
      - type: "mdns"
        mdns:
          service_type: "_lutron._tcp.local."
          port: 22
          # SERNUM (bridge serial) is reported by current client research; it
          # was not recorded in this project's probe.
          txt_record_keys: ["MACADDR", "CODEVER", "SYSTYPE", "DEVCLASS", "SERNUM"]
          identity_mapping:
            stable_keys:
              - source: "txt:MACADDR"
                key: "mac"
            display:
              source: "name"
    identity:
      stable_keys: ["mac", "hostname"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      The Caseta bridge is Ethernet-only, so there is no WiFi provisioning.
      What does need documenting is the LEAP pairing handshake, because unlike
      most devices here the bridge issues the client a real X.509 certificate
      and refuses anonymous connections afterwards.
    methods:
      - type: "button_pairing"
        name: "Ethernet, then button-held CSR signing"
        role: "primary"
        verified: false
        description: >
          The bridge is Ethernet-only, so there is no wireless
          provisioning; what needs documenting is the LEAP pairing that
          follows, because unlike most devices here the bridge issues the
          client a real X.509 certificate and refuses anonymous
          connections afterwards.
        stages:
          - type: "wired"
            name: "Get the bridge onto the LAN"
            verified: false
            description: "Ethernet to the router; the bridge takes a DHCP lease and advertises _lutron._tcp.local."
            steps:
              - action: "Connect the bridge with Ethernet and apply power."
                actor: "user"
                timeout_seconds: 120
          - type: "button_pairing"
            name: "Sign the client's CSR at the bridge button"
            verified: false
            description: >
              The client generates a key pair and CSR, opens the pairing
              channel, and waits for the bridge to report that its physical
              button is being held; only then does it submit the CSR. The
              bridge signs it and returns the client certificate plus its own
              CA certificate, which the client pins for all later LEAP
              sessions.
            steps:
              - action: "Generate an RSA/EC key pair and a certificate signing request on the client."
                actor: "client"
              - action: "Open a TLS connection to port 8083 presenting the initial LAP client certificate that open LEAP clients ship (public, not reproduced here)."
                actor: "client"
                expect: "The handshake completes; without a client certificate the bridge aborts it with a bad-certificate alert."
                timeout_seconds: 10
              - action: "Press and hold the button on the back of the bridge."
                actor: "user"
              - action: "Wait for the bridge's unsolicited status message granting physical access."
                actor: "device"
                expect: "A JSON line whose Header.ContentType begins 'status;' and whose Body.Status.Permissions contains PhysicalAccess."
                timeout_seconds: 180
              - action: "Submit the CSR to the bridge's pairing service and store the signed certificate, private key and bridge CA."
                actor: "client"
                request:
                  service: "LAP pairing (TLS-JSON on port 8083, not HTTP): Execute /pair with CommandType=CSR and Parameters {CSR, DisplayName, DeviceUID, Role}"
                expect: "Signed client certificate returned in Body.SigningResult.Certificate (with Body.SigningResult.RootCertificate as the bridge CA); later LEAP connections on port 8081 authenticate with it."
                timeout_seconds: 10
              - action: "Reconnect on port 8081 with the new key, certificate and bridge CA and send ReadRequest /server/1/status/ping."
                actor: "client"
                expect: "A ReadResponse whose Body.PingResponse.LEAPVersion names the bridge's LEAP version."
    factory_reset:
      confidence: "medium"
      effect: >
        Network reset only: drops network settings and external integrations
        (including issued client certificates). Per Lutron documentation this
        does NOT delete previously paired devices, scenes or schedules; no
        button procedure wipes the associated-device list.
      procedures:
        - name: "Rear button held 20s (network reset)"
          hold_seconds: 20
          indicator: "Release the button once the light ring begins to blink."
          steps:
            - action: "Press and hold the small black button on the back of the bridge for 20 seconds; release when the light ring begins to blink."
              actor: "user"
              notes: "Vendor-documented network reset; paired devices, scenes and schedules survive. A 40-second hold (LED flashes again at 40s) performs a HomeKit reset."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        A router change is a cable move; issued client certificates survive.
        Clients must rediscover the bridge by TXT MACADDR, not by IP.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Bridge CA private key"
        - "Associated Caseta device list"
      issued_to_client:
        - "Client certificate and private key signed by the bridge CA"
        - "Bridge CA certificate for pinning"
      notes: >
        This is the strongest local auth model of any device documented here:
        no shared secret, no cloud, and a client credential that can be revoked
        by resetting the bridge.

  pairing:
    required: true
    confidence: "high"
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "derived"
      notes: >
        Not a code but a certificate: the client generates its own key pair
        and CSR, and the bridge signs it during the button hold. What the
        client stores afterwards is its signed certificate, its private key
        and the bridge's CA — the last of which it pins for every later LEAP
        session.
    exclusivity:
      single_connection: false
      single_bond: false
      recovery: >
        Nothing to clear before pairing: the bridge signs a certificate for
        each client that asks, so a new controller does not displace an
        existing one.
    enter_pairing_mode:
      required: true
      procedures:
        - name: "Hold the button on the back of the bridge while submitting the CSR"
          glyph: "generic/hold-button.svg"
          verified: false
          basis: >
            The pairing flow implemented by the open LEAP clients this spec
            follows (pylutron-caseta 0.30.1, which Home Assistant uses). Not
            replayed against a bridge here; this project's probe reached only
            the 8083 certificate gate.
          power_state: "on"
          steps:
            - action: "Generate an RSA or EC key pair and a certificate signing request on the client."
              actor: "client"
            - action: "Connect to port 8083 over TLS with the initial LAP client certificate."
              actor: "client"
            - action: "Press and hold the button on the back of the bridge."
              actor: "user"
            - action: "Wait for a status message listing PhysicalAccess in Body.Status.Permissions, then submit the CSR."
              actor: "client"
              timeout_seconds: 180
              expect: "A signed client certificate and the bridge CA in the response."
    notes: >
      Unusually for this repository, the credential is a client certificate
      rather than a token, and the pairing is where the trust in both
      directions is established at once: the bridge learns the client's public
      key, and the client learns the CA it will pin. Losing the private key
      means holding the button again; there is no way to re-download it.
# Vendor-specific protocol detail this schema does not model. Namespaced so the
# top level can stay closed; nothing here is a declared contract.
scheduling:
  supported: true
  mechanism: "on_device_rules"
  confidence: "medium"
  runs_without_a_client: true
  summary: >
    LEAP timeclocks and their events are stored on the bridge and execute
    without the phone. Read /timeclock and /timeclock/{id}/timeclockevent;
    create, update and delete events with the corresponding CommuniqueTypes.
    Enable/disable through the event's status resource rather than deleting
    it, and test through the event's commandprocessor with
    TestThisTimeclockEvent.
  device_clock_dependency: >
    The controller evaluates its own schedule and timezone. Local operation
    continues when the Internet is lost, but WAN-off firing and DST behavior
    still need validation for each controller.
  storage:
    event_model:
      Parent: "Timeclock href"
      ProgrammingModel: "Programmed action href"
      ScheduleType: "DayOfWeek, ByDate, Daily or None in the current enum"
      BeginDate: "Start date for a dated rule"
      EndDate: "Optional end date"
      TimeOfDay: "Hour and Minute"
      weekdays: "Sunday-through-Saturday booleans for weekly rules"
      AstronomicEventType: "Optional solar event and signed offset"
      exceptions: "Recurring/nonrecurring execution and exception date lists"
    astronomic_offset: "Normally ±4 hours; ±12 only with TwelveHourMaxAstronomicOffset"
    notes: "Use ByDate for a specific date. Do not assume every recovered schedule route exists on every processor."
  transfer:
    steps:
      - action: "Read the controller's existing timeclocks and an app-created event before writing."
        actor: "client"
      - action: "Create an event with CreateRequest /timeclock/{id}/timeclockevent and read back its assigned href."
        actor: "client"
      - action: "Update only that event; enable it and the containing timeclock separately, then test it with TestThisTimeclockEvent."
        actor: "client"
  limitations:
    - "LEAP and LIP integration IDs need not match; this Caseta non-Pro spec has no LIP fallback."
    - "Scene, cover and button capabilities vary by controller. Do not invent a position for OpenCloseStop zones."
    - "The vendor app's current enum uses GoToDimmedLevel/GoToSwitchedLevel; third-party GoToLevel is a compatibility command, not proof of a generic SetLevel API."
  open_questions:
    - "Read-back of a newly created third-party event, WAN-off execution and DST/solar-offset behavior on this bridge."
  verification: "reported"

protocol_details:
  leap_protocol:
    transport: "Direct TLS socket with newline-delimited JSON; not ordinary HTTP or a required WebSocket handshake"
    port: 8081
    deprecated_services:
      lap:
        service_type: "_lap._tcp.local."
        port: 8083
    homekit:
      service_type: "_hap._tcp.local."
      port: 4548
    authentication: "certificate-based local pairing"
    # Message envelope and pairing exchanges below verified 2026-08-20 against
    # the vendor app com.lutron.mmw 26.7.0.5 (the current "Lutron App"; the
    # legacy Play package id com.lutron.mmjs is retired and no longer indexed).
    message_envelope: >
      Every LEAP frame is one JSON object:
      {"CommuniqueType": "...", "Header": {"Url": "...", "ClientTag": "..."},
      "Body": {...}}. CommuniqueTypes seen in the app: CreateRequest/Response,
      ReadRequest/Response, UpdateRequest/Response, DeleteRequest/Response,
      SubscribeRequest/Response, UnsubscribeRequest/Response, MetadataRequest/
      Response, ExceptionResponse. Each object is one line terminated by
      CRLF. Replies echo Header.ClientTag for correlation and carry an
      HTTP-style Header.StatusCode; large collections page with
      Header.Paging {Start, Count, Total}. Liveness check: ReadRequest to
      /server/1/status/ping (pylutron-caseta pings every 60 s with a 5 s
      timeout and reconnects on failure; the vendor app uses a 3 s timeout).
      A subscription returns current state and then events; after a
      reconnect, re-subscribe and re-read state. Subscriptions accept a
      ?where= filter, e.g. /zone/status/expanded?where=Level!:0 to list only
      zones that are on.
    resources:
      configuration: ["/device", "/zone", "/area", "/button", "/occupancygroup", "/virtualbutton", "/server"]
      notes: >
        Read configuration dynamically; Caseta is device/zone based (RA3 and
        QSX use areas and /area/{id}/associatedzone instead). Zone commands
        go in Body.Command to /zone/{id}/commandprocessor; scenes are
        activated through the corresponding /virtualbutton/{id}/commandprocessor
        and Pico buttons through /button/{id}/commandprocessor. Further
        vendor-app CommandTypes beyond the entity notes: GoToShadeLevelWithTilt,
        GoToFanSpeed and GoToScene. No generic SetLevel exists. pylutron-caseta
        also reads /device/{id}/status for BatteryStatus.
      verification: "reported"
    events:
      notes: >
        Button, zone and occupancy-group status arrive on subscriptions.
        Home Assistant exposes press, release and multi-tap for supported
        Picos on Caseta; LongHold is confirmed only on HomeWorks QSX, not
        Caseta. Older integration notes that say LEAP has no keypad events
        are out of date.
      verification: "reported"
    lap_pairing:
      notes: >
        Port 8083 speaks LEAP-style JSON lines (not HTTP), but the pairing
        request names its operation in Header.RequestType ("Execute") rather
        than CommuniqueType. The TLS handshake needs a client certificate even
        here: open clients present a publicly distributed initial LAP
        certificate and key (not reproduced), and this project's 2026-08-14
        probe saw the bridge abort a certificate-less handshake. The client
        then waits (pylutron-caseta: up to 180 s) for an unsolicited message
        whose Header.ContentType starts with "status;" and whose
        Body.Status.Permissions lists "PhysicalAccess" -- the button being
        held. Pairing is: Execute /pair with Body.CommandType=CSR and
        Parameters={CSR (PEM), DisplayName, DeviceUID, Role (Admin or
        Installer)}; a 200 reply carries Body.SigningResult.Certificate (the
        signed client cert) and Body.SigningResult.RootCertificate (the bridge
        CA to pin). Supporting exchanges: Read /certificate/root (fetch bridge
        root cert), Read /system/macaddress (stable identity), Execute /pair
        CommandType=Wipe (revoke certs; optional Filter.Subject.Organization),
        Subscribe /system/status/crosssign (cloud cross-sign progress).
        Responses carry an HTTP-style Header.StatusCode ("200 OK",
        "204 No Content", "401 Unauthorized") and the request's ClientTag.
        pylutron-caseta sends DeviceUID "000000000000" and Role "Admin". These
        management exchanges need the pairing channel; they are not an
        unauthenticated route to LEAP, and a network reset is not a shortcut
        around the button.

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["vendor_cloud"]
      transport: "cloud"
      image:
        signing: "unknown"
        encrypted: true
        source: "public_url"
        format: >
          ZIP (stored) holding versionInfo, a sub-device firmware manifest, a
          SHA-256 manifest with a detached PKCS#7 signature, a per-package
          wrapped key + IV, and firmware.tar.enc (AES-128-CBC, OpenSSL salted
          format).
        notes: >
          Seven official "lite-heron" packages, 26.00.05f000 and
          26.00.08f000-26.00.13f000, were fetched unauthenticated from
          https://firmware-downloads.iot.lutron.io/lite-heron/final/<version>/lutron_firmware
          (2026-08-15). 26.00.14f000-26.00.16f000 returned 404 on 2026-11-11,
          which does not prove nothing newer exists. The payload key is
          wrapped for the processor's own private key, which is not public,
          so no rootfs was decrypted. The package is signed; whether the
          bridge refuses an unsigned or altered one is not established.
          Whether these packages target this L-BDG2 at all is open: the
          probed unit reports CODEVER 08.x, and 08.x paths return 404.
      enter:
        how: "automatic"
        notes: >
          Updates are started from the Lutron app and delivered through the
          vendor cloud. No LEAP command that starts or feeds an update is
          recorded, so a replacement client cannot update the bridge.
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        From the project's retained official packages and their analysis;
        nothing was installed. Do not install a package for research.

local_access:
  status: "native"
  summary: >
    LEAP is a cloud-independent local integration as shipped: pair once at
    the bridge button, keep the three resulting files (bridge CA, client
    certificate, client private key), and reuse them for every later LEAP
    session. No replacement cloud is needed. Pairing needs physical access;
    it is not a password reset or a way into somebody else's bridge.
  covers:
    - "Discovery and identity over mDNS."
    - "Zone control, scenes, Pico button and occupancy events over LEAP (documented, not yet driven by this project)."
    - "Reading and editing the bridge's own timeclock schedules (see scheduling)."
  not_covered:
    - "Firmware updates, which go through the Lutron app and cloud."
    - "Remote (off-LAN) access, voice assistants and the Lutron account."
    - "Re-establishing trust after the client key is lost or a network reset drops issued certificates: that means pairing at the button again."

evidence:
  live_lan_probe:
    date: "2026-07-16"
    address: "192.168.1.50"
    hostname: "Lutron-00000000.local"
    firmware: "08.25.17f000"
    accessory_count: 13
    mdns_services:
      - service_type: "_leap._tcp.local."
        port: 8081
      - service_type: "_lap._tcp.local."
        port: 8083
      - service_type: "_lutron._tcp.local."
        port: 22
        SYSTYPE: "SmartBridge"
        MACADDR: "b8:94:d9:aa:bb:cc"
      - service_type: "_hap._tcp.local."
        port: 4548
  artifacts:
    - type: "live_probe"
      artifact: "One L-BDG2 on the project LAN, 2026-07-16 and 2026-08-14 (identifiers placeholdered)"
      description: "mDNS service set and TXT, and the TLS certificate gate on 8081 and 8083; see device.testing."
    - type: "static_analysis"
      artifact: "com.lutron.mmw 26.7.0.5"
      description: "LEAP envelope, pairing-channel exchanges, CommandType names and the timeclock model."
    - type: "static_analysis"
      artifact: "com.lutron.mmw 26.9.1.1 (Play listing dated 2026-11-03)"
      obtained_via: "APKPure, 2026-11-07"
      description: "Re-read for the 2026-11 pass: same timeclock event model and create/update/test paths as 26.7.0.5, command enum unchanged in the parts this spec uses. Decompiled, never executed."
    - type: "public_implementation"
      artifact: "gurumitts/pylutron-caseta v0.30.1, commit 1c25f55bef14adf0bac81c2bba43ea4f7e6826b1"
      description: "Pairing sequence (8083 with the initial LAP certificate, PhysicalAccess wait, /pair CSR, ping on 8081), CRLF framing, ping cadence, and the three reusable credential files."
    - type: "vendor_documentation"
      artifact: "Home Assistant lutron_caseta integration documentation"
      description: "Supported bridges (L-BDG2, L-BDGPRO2, RR-SEL-REP2, RR-PROC3, HQP7), zeroconf matching and per-system button-event coverage."
    - type: "firmware_image"
      artifact: "Seven official lite-heron packages 26.00.05f000 and 26.00.08f000-26.00.13f000"
      obtained_via: "Lutron public firmware CDN, 2026-08-15; 26.00.14f000-26.00.16f000 HEAD-probed 404 on 2026-11-11"
      description: "Package structure and encryption only; payload not decrypted. See features."

remaining_unknowns:
  - "Whether port 8083 accepts a TLS client with no certificate while the button is held; open clients always present the initial LAP certificate, and this project only probed with the button released."
  - "CSR signing, authenticated LEAP reads and every command remain unexercised by this project."
  - "Whether this unit advertises SERNUM in its _lutron._tcp TXT; the probe did not record it."
  - "Which firmware track the L-BDG2 is on: the probed unit reports 08.x CODEVER while the only public packages found are lite-heron 26.00.x."
  - "Whether the bridge enforces the package signature, and its behaviour after an interrupted update."
  - "Pico long-hold events on Caseta (LongHold is confirmed only on QSX) and which button events each Pico model emits."

entities:
  # DESCRIPTIVE DOCUMENTATION, not bindings: this spec is integration:
  # identify_only — nothing drives LEAP yet, and the spec declares no LEAP
  # commands a role could name, so these entities carry the recovered
  # CommandType detail in `notes` rather than a role map pointing at prose.
  # When a LEAP client lands, declare real commands and bind the roles.
  #
  # CommandType spellings verified 2026-08-20 from the vendor app
  # (com.lutron.mmw 26.7.0.5, its LEAP command-name enumeration and its
  # zone-request builder):
  # dimmers take GoToDimmedLevel with Body.Command.DimmedLevelParameter
  # {Level: 0-100}; switches take GoToSwitchedLevel with
  # SwitchedLevelParameter {SwitchedLevel: On|Off}; shades take
  # GoToShadeLevel (tilt GoToTilt); also Raise/Lower/Stop, GoToFanSpeed,
  # GoToScene. Plain "GoToLevel" is NOT in the vendor app's enum; it appears
  # in third-party integrations and may still be accepted by the bridge.
  - platform: "light"
    name: "Caseta Dimmer"
    notes: >
      Unbound (identify_only): a dimmer is driven by a LEAP CreateRequest to
      /zone/{id}/commandprocessor with CommandType GoToDimmedLevel and
      DimmedLevelParameter {Level: 0-100} — Level 100 for on, 0 for off, the
      value in between for brightness. Documented for a future LEAP client;
      no declared command exists to bind.
  - platform: "switch"
    name: "Caseta Switch"
    notes: >
      Unbound (identify_only): a switch is driven by a LEAP CreateRequest to
      /zone/{id}/commandprocessor with CommandType GoToSwitchedLevel and
      SwitchedLevelParameter {SwitchedLevel: On|Off}.
  - platform: "cover"
    name: "Lutron Shade"
    notes: >
      Unbound (identify_only): a shade is driven by a LEAP CreateRequest to
      /zone/{id}/commandprocessor with CommandType GoToShadeLevel (open =
      level 100, closed = 0, position in between); tilt uses GoToTilt, and
      Raise/Lower/Stop exist for jog control.


