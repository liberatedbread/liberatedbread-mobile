device:
  name: "Lutron Caseta Smart Bridge 2"
  manufacturer: "Lutron"
  manufacturer_status: "active"
  testing:
    status: verified
    detail: minimally-verified
    notes: >
      Probed live 2026-08-14 against the real bridge (same unit as the
      2026-07-16 evidence; firmware has since moved 08.25.17f000 ->
      08.28.11f000 per the _lutron._tcp CODEVER TXT). All four documented
      mDNS services re-observed (_leap 8081, _lap 8083, _lutron 22 with
      MACADDR/CODEVER/SYSTYPE=SmartBridge TXT, _hap 4548). The
      certificate-auth model was exercised to its gate: a TLS handshake on
      8081 (LEAP) reaches the bridge's CertificateRequest (RSA/ECDSA client
      cert types listed) and is aborted by the bridge with a bad-certificate
      alert when no client certificate is presented; 8083 (LAP) behaves the
      same. Cross-check: the LEAP server certificate CN is
      SmartBridgeB894D9AABBCC — the MACADDR from the _lutron TXT record —
      and the LAP server cert chains to "Caseta Local Access Protocol Cert
      Authority". Halted at the physical pairing button (nobody home):
      CSR signing and authenticated LEAP commands remain unexercised by us.
  protocol: "wifi"
  category: "hub"
  transport: "tls-json"
  integration: "identify_only"
  notes: >
    Lutron Caseta Smart Bridge 2 advertises multiple local services. LEAP on
    port 8081 is the modern local TLS JSON/WebSocket control protocol. LAP on
    port 8083 is deprecated. The _lutron._tcp status service exposes stable
    bridge identity including MACADDR, firmware CODEVER, system type, and
    device class. HomeKit HAP is separately advertised on port 4548.

    This project does NOT drive LEAP yet, so the bridge is classified
    integration: identify_only — the app recognises it from its _leap._tcp /
    _lutron._tcp advertisements and hands the user off to Lutron's own app
    rather than claiming control. The full LEAP handshake, certificate pairing
    and command surface below are documented and kept intact for when a LEAP
    transport is implemented; nothing here has been removed. There is no local
    web admin UI to deep-link to (control is the LEAP protocol itself), so no
    admin_url is set.
  identification:
    # Deliberately NO mac_prefixes. The bridge captured below reports
    # b8:94:d9:aa:bb:cc in its _lutron._tcp MACADDR record, but B8:94:D9 is
    # assigned to Texas Instruments -- it identifies the radio module inside the
    # bridge, not Lutron. Listing it would flag every TI-radio device on the
    # network as possibly a Caseta bridge. Lutron's own OUI is 00:0F:E7, but we
    # have never observed a Caseta bridge using it, and guessing from the
    # registry is exactly what the schema tells you not to do.
    mdns_service_type: "_leap._tcp.local."
    default_port: 8081
    identity_keys:
      primary: "mac"
      secondary: "hostname"
      display: "name"

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_leap._tcp.local."
          port: 8081
          identity_mapping:
            stable_keys:
              - source: "hostname"
            display:
              source: "name"
      - type: "mdns"
        mdns:
          service_type: "_lutron._tcp.local."
          port: 22
          txt_record_keys: ["MACADDR", "CODEVER", "SYSTYPE", "DEVCLASS"]
          identity_mapping:
            stable_keys:
              - source: "txt:MACADDR"
                key: "mac"
            display:
              source: "name"
    identity:
      stable_keys: ["mac", "hostname"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      The Caseta bridge is Ethernet-only, so there is no WiFi provisioning.
      What does need documenting is the LEAP pairing handshake, because unlike
      most devices here the bridge issues the client a real X.509 certificate
      and refuses anonymous connections afterwards.
    methods:
      - type: "wired"
        verified: false
        description: "Ethernet to the router; the bridge takes a DHCP lease and advertises _lutron._tcp.local."
        steps:
          - action: "Connect the bridge with Ethernet and apply power."
            actor: "user"
            timeout_seconds: 120
      - type: "button_pairing"
        verified: false
        description: >
          The client generates a key pair and CSR, then presents it while the
          physical button on the back of the bridge is held. The bridge signs
          the CSR and returns the client certificate plus its own CA
          certificate, which the client pins for all later LEAP sessions.
        steps:
          - action: "Generate an RSA/EC key pair and a certificate signing request on the client."
            actor: "client"
          - action: "Press and hold the button on the back of the bridge."
            actor: "user"
          - action: "Submit the CSR to the bridge's pairing service and store the signed certificate, private key and bridge CA."
            actor: "client"
            request:
              service: "LAP pairing (TLS-JSON on port 8083, not HTTP): Execute /pair with CommandType=CSR and Parameters {CSR, DisplayName, DeviceUID, Role}"
            expect: "Signed client certificate returned in Body.SigningResult.Certificate (with Body.SigningResult.RootCertificate as the bridge CA); later LEAP connections on port 8081 authenticate with it."
            timeout_seconds: 30
    factory_reset:
      confidence: "medium"
      effect: >
        Network reset only: drops network settings and external integrations
        (including issued client certificates). Per Lutron documentation this
        does NOT delete previously paired devices, scenes or schedules; no
        button procedure wipes the associated-device list.
      procedures:
        - name: "Rear button held 20s (network reset)"
          hold_seconds: 20
          indicator: "Release the button once the light ring begins to blink."
          steps:
            - action: "Press and hold the small black button on the back of the bridge for 20 seconds; release when the light ring begins to blink."
              actor: "user"
              notes: "Vendor-documented network reset; paired devices, scenes and schedules survive. A 40-second hold (LED flashes again at 40s) performs a HomeKit reset."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        A router change is a cable move; issued client certificates survive.
        Clients must rediscover the bridge by TXT MACADDR, not by IP.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Bridge CA private key"
        - "Associated Caseta device list"
      issued_to_client:
        - "Client certificate and private key signed by the bridge CA"
        - "Bridge CA certificate for pinning"
      notes: >
        This is the strongest local auth model of any device documented here:
        no shared secret, no cloud, and a client credential that can be revoked
        by resetting the bridge.

leap_protocol:
  transport: "TLS JSON/WebSocket"
  port: 8081
  deprecated_services:
    lap:
      service_type: "_lap._tcp.local."
      port: 8083
  homekit:
    service_type: "_hap._tcp.local."
    port: 4548
  authentication: "certificate-based local pairing"
  # Message envelope and pairing exchanges below verified 2026-08-20 against
  # the vendor app com.lutron.mmw 26.7.0.5 (the current "Lutron App"; the
  # legacy Play package id com.lutron.mmjs is retired and no longer indexed).
  message_envelope: >
    Every LEAP frame is one JSON object:
    {"CommuniqueType": "...", "Header": {"Url": "...", "ClientTag": "..."},
    "Body": {...}}. CommuniqueTypes seen in the app: CreateRequest/Response,
    ReadRequest/Response, UpdateRequest/Response, DeleteRequest/Response,
    SubscribeRequest/Response, UnsubscribeRequest/Response, MetadataRequest/
    Response, ExceptionResponse. Liveness check: ReadRequest to
    /server/1/status/ping. Subscriptions accept a ?where= filter, e.g.
    /zone/status/expanded?where=Level!:0 to list only zones that are on.
  lap_pairing:
    notes: >
      Port 8083 speaks the same LEAP JSON envelope (not HTTP) and stays
      reachable without a client certificate while the rear button is held.
      Pairing is: Execute /pair with Body.CommandType=CSR and
      Parameters={CSR (PEM), DisplayName, DeviceUID, Role (Admin or
      Installer)}; a 200 reply carries Body.SigningResult.Certificate (the
      signed client cert) and Body.SigningResult.RootCertificate (the bridge
      CA to pin). Supporting exchanges: Read /certificate/root (fetch bridge
      root cert), Read /system/macaddress (stable identity), Execute /pair
      CommandType=Wipe (revoke certs; optional Filter.Subject.Organization),
      Subscribe /system/status/crosssign (cloud cross-sign progress).
      Responses carry an HTTP-style Header.StatusCode ("200 OK",
      "204 No Content", "401 Unauthorized").

evidence:
  live_lan_probe:
    date: "2026-07-16"
    address: "192.168.1.190"
    hostname: "Lutron-083e013d.local"
    firmware: "08.25.17f000"
    accessory_count: 13
    mdns_services:
      - service_type: "_leap._tcp"
        port: 8081
      - service_type: "_lap._tcp"
        port: 8083
      - service_type: "_lutron._tcp"
        port: 22
        SYSTYPE: "SmartBridge"
        MACADDR: "b8:94:d9:aa:bb:cc"
      - service_type: "_hap._tcp"
        port: 4548

http_endpoints:
  - method: "GET"
    path: "/"
    name: "LEAP Service Root"
    description: "Placeholder for the LEAP TLS JSON/WebSocket service on port 8081; control uses LEAP messages rather than plain unauthenticated REST."

entities:
  # DESCRIPTIVE DOCUMENTATION, not bindings: this spec is integration:
  # identify_only — nothing drives LEAP yet, and the spec declares no LEAP
  # commands a role could name, so these entities carry the recovered
  # CommandType detail in `notes` rather than a role map pointing at prose.
  # When a LEAP client lands, declare real commands and bind the roles.
  #
  # CommandType spellings verified 2026-08-20 from the vendor app
  # (com.lutron.mmw 26.7.0.5, leaplib CommandTypeEnum + ZoneRequestCreator):
  # dimmers take GoToDimmedLevel with Body.Command.DimmedLevelParameter
  # {Level: 0-100}; switches take GoToSwitchedLevel with
  # SwitchedLevelParameter {SwitchedLevel: On|Off}; shades take
  # GoToShadeLevel (tilt GoToTilt); also Raise/Lower/Stop, GoToFanSpeed,
  # GoToScene. Plain "GoToLevel" is NOT in the vendor app's enum; it appears
  # in third-party integrations and may still be accepted by the bridge.
  - platform: "light"
    name: "Caseta Dimmer"
    notes: >
      Unbound (identify_only): a dimmer is driven by a LEAP CreateRequest to
      /zone/{id}/commandprocessor with CommandType GoToDimmedLevel and
      DimmedLevelParameter {Level: 0-100} — Level 100 for on, 0 for off, the
      value in between for brightness. Documented for a future LEAP client;
      no declared command exists to bind.
  - platform: "switch"
    name: "Caseta Switch"
    notes: >
      Unbound (identify_only): a switch is driven by a LEAP CreateRequest to
      /zone/{id}/commandprocessor with CommandType GoToSwitchedLevel and
      SwitchedLevelParameter {SwitchedLevel: On|Off}.
  - platform: "cover"
    name: "Lutron Shade"
    notes: >
      Unbound (identify_only): a shade is driven by a LEAP CreateRequest to
      /zone/{id}/commandprocessor with CommandType GoToShadeLevel (open =
      level 100, closed = 0, position in between); tilt uses GoToTilt, and
      Raise/Lower/Stop exist for jog control.


helpful_urls:
  - title: "Home Assistant Lutron Caséta integration"
    url: "https://www.home-assistant.io/integrations/lutron_caseta/"
    description: "HA core integration over the Smart Bridge LEAP/LAP protocol documented here."
