evidence:
  artifacts:
    - type: "public_implementation"
      artifact: "OpenWonderLabs/homebridge-switchbot 5.2.12, commit 28fd83bb8951ee82556a8d94fb203931da9aaa26 (2026-11-06), README section BLE Encryption Support"
      url: "https://github.com/OpenWonderLabs/homebridge-switchbot/blob/28fd83bb8951ee82556a8d94fb203931da9aaa26/README.md#L208-L244"
      obtained_via: "public GitHub clone, read 2026-11-11"
      description: >
        Vendor-organisation documentation of where an encrypted model's key
        lives: the app's Device Settings > Device Info page shows an
        Encryption Key and a Key ID on models that use BLE encryption, and
        nothing on models that do not (or that need a firmware update
        first). Names Lock / Lock Pro, Curtain 3, some updated Curtain 2,
        and some sensors and newer models. Not run against hardware here.
    - type: "public_implementation"
      artifact: "sblibs/pySwitchbot 3.2.1, commit 458335de3c8c191b4988e8b0e82346dd2574841e (2026-11-11): scripts/get_encryption_key.py, README key-retrieval troubleshooting, the encrypted-device base class"
      url: "https://github.com/sblibs/pySwitchbot/tree/458335de3c8c191b4988e8b0e82346dd2574841e"
      obtained_via: "public GitHub clone, read 2026-11-11"
      description: >
        Account-API key retrieval (owner account only; no two-factor
        support), the key ID / key lengths (2 and 32 hex characters), and
        which device classes use encryption: the Lock family and several
        newer lights, fans, humidifiers, the relay switch and others, but not
        Curtain or Curtain 3. Its 1,551 offline tests passed; the key script
        was not run and no owner key was read.
    - type: "firmware_image"
      artifact: "200 vendor firmware images (the newest one or two per file pattern for 26 BLE device directories), 2026-08-15"
      url: "https://s3.amazonaws.com/www.wohand.com/?list-type=2&prefix=version/wocaotech/firmware/"
      obtained_via: "vendor's publicly listable S3 firmware bucket; re-hashed 2026-11-11 (all 200 matched their recorded SHA-256), and WoHand/WoHand_app_V1066.zip re-fetched with HTTP 200"
      sha256: "58b5b39863b41b7f70c3b5d55974abbbf4e6b964632dc6eff45569d8b0620dcd"
      description: >
        Source of the image formats, init-packet signing and per-model
        chipset sets in the firmware_update features. The digest given is
        WoHand_app_V1066.zip (Bot 1.066, Nordic legacy DFU, 53,737 bytes);
        the per-file table is kept with the research notes, not committed.
        No image was flashed and no device was contacted.

remaining_unknowns:
  - "Whether Curtain 3 (and which Curtain 2 firmware) requires the BLE encryption key: homebridge-switchbot says it does, pySwitchbot drives both curtains unencrypted. Resolving it needs a unit whose Device Info page in the app is checked, and an unencrypted command sent to it."
  - "The full list of encrypted models. Neither source enumerates it; the app's Device Info page is the per-unit authority."
  - "The encrypted command framing itself (how the key ID and the AES-CTR key wrap a 0x57 frame) is not transcribed here; pySwitchbot's encrypted-device class is the reference."
  - "Whether a factory reset regenerates the encryption key, so that a key copied before the reset stops working."
