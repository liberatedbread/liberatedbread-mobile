# SwitchBot BLE smart actuator/sensor family
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "SwitchBot BLE Device Family"
  manufacturer: "Wonderlabs, Inc. (SwitchBot)"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "ble"
  category: "switch"
  notes: >
    Family of BLE smart home devices: Bot (button pusher), Meter/TH (temp/humidity),
    Curtain, Motion Sensor, Contact Sensor, Color Bulb, LED Strip Light, Smart Lock,
    Plug Mini, Humidifier, and Meter Plus. Manufacturer publishes an open BLE API at
    github.com/OpenWonderLabs/SwitchBotAPI-BLE — this spec is a clean-room encoding
    of that documentation plus community implementations (sblibs/pySwitchbot,
    formerly Danielhiversen/pySwitchbot).

    SOURCES: the official SwitchBotAPI-BLE repo is stale (last commit 2024-10;
    it documents only 11 device types — no Lock Pro/Lock Ultra, Blind Tilt,
    Roller Shade, Meter Pro or Hub 2/3). pySwitchbot is the living
    specification (~50 models), including AES-CTR command encryption on some
    models. Its per-unit key (a one-byte key ID plus a 16-byte key) is
    obtained once with the owner's SwitchBot account, either from the app's
    Device Info page or from the account API, after which commands work
    fully locally (see setup.methods). That is one-time account
    provisioning, not account-free first setup.

    COMMUNICATION: all devices share the same service UUID and frame format.
    REQ frame (client→device) written to TX char: [0x57 magic][header byte]
    [payload...]. Header bits 7:6 = version (0), bits 5:4 = encryption mode
    (0 = none), bits 3:0 = command. RESP frame (device→client) notified on RX
    char: [status byte][payload...]. Status codes: 0x01 OK, 0x02 ERROR, 0x03 BUSY,
    0x04 protocol incompatible, 0x05 unsupported command, 0x06 low battery,
    0x07 encrypted, 0x08 unencrypted, 0x09 password error, 0x0A unsupported
    encryption, 0x0B mesh failure, 0x0C network failure.

    DISCOVERY: service data UUID 0xFD3D in SCAN_RSP (firmware ≥v6.4), 0x0D00
    (older). The 0x0D00 form is app-confirmed: the vendor app's older
    service-data UUID is 00000d00-0000-1000-8000-00805f9b34fb; the 0x000D
    rendering in some community docs is wrong.
    Company ID 0x0969 (new) / 0x0059 (old) in manufacturer data;
    pySwitchbot's parser additionally accepts 0x02E5 (741).
    Device type in service data byte 0 bits 6:0 (the vendor app masks byte 0
    with 0x7F) — see variants below. The app also
    defines "_ADD" device-type variants that toggle bit 5 (type byte XOR
    0x20), e.g. Meter 0x54/0x74, Meter Pro 0x34/0x14; app-confirmed, not
    hardware-tested.
    Advertised names vary per product: "WoHand" (Bot), "WoSensorTH" (Meter),
    "WoCurtain" (Curtain), etc.

    CONFIDENCE: service/characteristic UUIDs, frame format, magic byte, status
    codes, command IDs and per-device payload encoding are HIGH — sourced from
    the official manufacturer API repo and verified by community implementations.
    Advertised name patterns are community-documented and may vary per firmware
    revision. Broadcast mode (SwitchBot/Simple/iBeacon) is selectable per device.

    APP-CONFIRMED byte-for-byte (static analysis of the vendor app; not
    hardware-tested): service/TX/RX UUIDs (note the app names cba20002 "RX"
    and cba20003 "TX", i.e. device-centric, the reverse of this spec's
    client-centric labels), company ID 0x0969 (its scan matcher looks for
    "FF6909" = AD type 0xFF + little-endian 0x0969), frame magic 0x57,
    header bit layout (encryption-mode field at bit position 4, command in
    the low nibble), Bot frames 0x57 0x01 00/01/02 (press/on/off), and
    type-byte masking (& 0x7F). These stay "reported"
    in the schema's verification enum, which reserves "confirmed" for
    observations on real hardware.

  identification:
    service_uuids:
      - "cba20d00-224d-11e6-9fb8-0002a5d5c51b"
    local_name_prefix: "Wo"
    manufacturer_data:
      company_id: 2409
      company_id_hex: "0x0969"
      description: >
        0x0969 on firmware v6.4+. Older firmware advertises under 0x0059 (89,
        Nordic Semiconductor) and pySwitchbot also parses 0x02E5 (741,
        Espressif) — both recorded here in prose and deliberately NOT in
        `additional_company_ids`, which the schema defines as equivalent to
        `company_id`. Those two are the SoC vendors' own assignments, carried
        by default by an enormous population of unrelated Nordic- and
        ESP32-based products; treating them as equivalent would badge every one
        of them a SwitchBot. Same reasoning as govee-h5075-thermo's exclusion
        of Nokia's 0x0001. A consumer that has already identified a SwitchBot
        some other way may use them to parse the payload.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "cba20d00-224d-11e6-9fb8-0002a5d5c51b"
          service_data:
            - "0000fd3d-0000-1000-8000-00805f9b34fb"
          manufacturer_data:
            company_id: 2409
            description: "SwitchBot company ID 0x0969 (new firmware v6.4+); older: 0x0059 (89); pySwitchbot also parses 0x02E5 (741)"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      The unencrypted models (Bot, Meter and the other sensors in the official
      BLE API) need no provisioning: BLE connection only, plus the optional
      owner-set password where one was set. Encrypted models need a one-time
      key from the owner's account (second method). Which models are
      encrypted is per model and per firmware: OpenWonderLabs'
      homebridge-switchbot names Lock / Lock Pro, Curtain 3, some Curtain 2
      units on updated firmware, and some sensors and newer models, and says
      the app's Device Info page is the authority. pySwitchbot treats the
      Lock family and several newer lights, fans, humidifiers and the relay
      switch as encrypted, but drives Curtain and Curtain 3 without a key —
      the sources disagree on the curtains (see remaining_unknowns).
    methods:
      - type: "ble_direct"
        name: "Connect directly (unencrypted models)"
        role: "variant"
        verified: false
        description: >
          Covers every model whose Device Info page in the SwitchBot app shows
          no Encryption Key / Key ID fields. Scan for the service UUID (0xFD3D
          service data or 0x0969 manufacturer data), connect, and, if the
          owner set a password in the app, send it in the command frames.
        ble:
          pairing_required: false
        steps:
          - action: "Scan for SwitchBot devices via service data UUID 0xFD3D."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect and optionally authenticate with device password."
            actor: "client"
      - type: "cloud_account"
        name: "Copy the BLE encryption key once (encrypted models)"
        role: "variant"
        verified: false
        description: >
          Covers models whose Device Info page in the SwitchBot app shows an
          Encryption Key and a Key ID (per homebridge-switchbot: Lock / Lock
          Pro, Curtain 3, some updated Curtain 2, some sensors and newer
          models). The owner copies both values from the app once; a wrong
          key or key ID makes every BLE exchange with that unit fail. If the
          fields are absent, the unit either needs no encryption or needs a
          firmware update first. A second route is pySwitchbot's
          scripts/get_encryption_key.py, which signs in to the SwitchBot
          account API with the unit's MAC, the account username and the
          password, and prints the key ID and key. It returns keys only to
          the account that owns the device (a shared or family member gets
          an API error, status 190), does not support accounts with
          two-factor authentication, and needs a password set on accounts
          created through Apple or Google sign-in. Neither route was run by
          this project.
        cloud:
          provider: "SwitchBot account (in-app Device Info page, or the account API used by pySwitchbot)"
          local_alternative: >
            None known. Both documented routes need the device-owning account.
            Once copied, the values are reused for every later local session;
            nothing contacts the cloud again.
        issues_credentials:
          key_id:
            user_entered: true
            notes: "One byte, entered as 2 hex characters (pySwitchbot rejects any other length)."
          encryption_key:
            user_entered: true
            notes: >
              16-byte AES key, entered as 32 hex characters. Per unit and a
              live credential: never log or commit it.
        steps:
          - action: "In the SwitchBot app, open the device, then Device Settings (gear icon), then Device Info."
            actor: "user"
            expect: "Encryption Key and Key ID fields are shown on models that use BLE encryption."
          - action: "Copy the Encryption Key and Key ID into the local client."
            actor: "user"
            expect: "A 32-hex-character key and a 2-hex-character key ID stored by the client."
    factory_reset:
      confidence: "medium"
      effect: "Clears pairing info, timer settings, and encryption keys. Hold button for ~5 seconds on most devices."
      procedures:
        - name: "Hold button for 5+ seconds"
          steps:
            - action: "Press and hold the device button until LED flashes."
              actor: "user"
              expect: "LED blinks, device restarts advertising in default mode."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "Unpair from OS Bluetooth settings if previously bonded, then reconnect."
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "BLE encryption key and key ID (encrypted models only)"
        - "Owner-set password, if one was set"
      issued_to_client:
        - "key_id and encryption_key (encrypted models only, from the owner's account)"
      notes: >
        BLE-only. Bot and Meter work with no auth. The encrypted models' key
        ID and key are issued through the owner's account once and then
        reused locally; treat the key like a password.

  pairing:
    required: false
    confidence: "medium"
    # Optional per device: the encrypted models take a password inside the
    # vendor's own frames rather than bonding at the link layer.
    security_mode: "app_layer"
    bonding: "optional"
    pin:
      source: "user_chosen"
      notes: >
        Set by the owner in the SwitchBot app on the models that support it,
        and then required on every command to those models. Not a BLE passkey
        — it is carried in the command frames.
    notes: >
      Bot and Meter accept unencrypted commands from any central, so the
      common case needs no pairing at all. Two separate app-layer mechanisms
      exist. The optional owner-set password (the `pin` above) is carried in
      the command frames. The encrypted models (the Lock family, and per
      homebridge-switchbot Curtain 3, some Curtain 2 on updated firmware and
      some sensors and newer models) instead need the account-issued key ID
      and 16-byte key from setup.methods. Neither is a link-layer bond. A
      client should treat encryption as a per-model property, and the
      presence of the Encryption Key field on the unit's Device Info page in
      the app as the authority, rather than assuming either answer for the
      family.
    enter_pairing_mode:
      required: false
  variants:
    - model: "Bot (WoHand)"
      identification:
        local_name_prefix: "WoHand"
      notes: "Device type 0x48 ('H') in service data. Button-pusher actuator."
    - model: "Meter / MeterTH (WoSensorTH)"
      identification:
        local_name_prefix: "WoSensorTH"
      notes: "Device type 0x54 ('T') in service data. Temperature/humidity sensor."
    - model: "Curtain (WoCurtain)"
      identification:
        local_name_prefix: "WoCurtain"
      notes: "Device type 0x63 ('c') in service data. Curtain motor. homebridge-switchbot says some Curtain 2 units on updated firmware require the BLE encryption key; pySwitchbot drives the Curtain unencrypted. Check the unit's Device Info page in the app."
    - model: "Curtain 3"
      identification:
        local_name_prefix: "WoCurtain"
      notes: "Device type 0x7B ('{') in service data. Curtain 3 variant. homebridge-switchbot lists it as requiring the BLE encryption key and key ID; pySwitchbot drives it with the unencrypted Curtain code. Unresolved; check the unit's Device Info page in the app."
    - model: "Motion Sensor"
      identification:
        local_name_prefix: "WoPresence"
      notes: >
        Device type 0x73 ('s') in service data. PIR motion sensor. Advertises
        as "WoPresence" (pySwitchbot constant; real-world captures agree) —
        "WoMotion" was only a synthetic enum label in node-switchbot, not the
        advertised name.
    - model: "Contact Sensor"
      identification:
        local_name_prefix: "WoContact"
      notes: "Device type 0x64 ('d') in service data. Door/window contact sensor."
    - model: "Color Bulb"
      identification:
        local_name_prefix: "WoBulb"
      notes: "Device type 0x75 ('u') in service data. RGB smart bulb."
    - model: "LED Strip Light"
      identification:
        local_name_prefix: "WoStrip"
      notes: "Device type 0x72 ('r') in service data. LED strip controller."
    - model: "Plug Mini"
      identification:
        local_name_prefix: "WoPlug"
      notes: "Device type 0x67 ('g') in service data. Smart plug."
    - model: "Smart Lock"
      identification:
        local_name_prefix: "WoLock"
      notes: "Device type 0x6F ('o') in service data. Smart door lock. Encrypted: needs the key ID and encryption key (setup.methods); both homebridge-switchbot and pySwitchbot agree, and pySwitchbot's key script is documented for the locks."
    - model: "Humidifier"
      identification:
        local_name_prefix: "WoHumi"
      notes: "Device type 0x65 ('e') in service data."
    - model: "Meter Plus"
      identification:
        local_name_prefix: "WoMeterPlus"
      notes: "Device type 0x69 ('i') in service data. Enhanced temp/humidity with display. Advertises as \"WoMeterPlus\" (pySwitchbot name map); \"WoSensorTH\" is the plain Meter."
    - model: "Meter Pro"
      notes: "Device type 0x34 ('4') in service data; \"_ADD\" variant 0x14. App-confirmed, not hardware-tested. Advertised local name not established."
    - model: "Meter Pro CO2"
      notes: "Device type 0x35 ('5') in service data; \"_ADD\" variant 0x15. App-confirmed, not hardware-tested. Advertised local name not established."

services:
  - uuid: "cba20d00-224d-11e6-9fb8-0002a5d5c51b"
    name: "SwitchBot Communication Service"
    characteristics:
      - uuid: "cba20002-224d-11e6-9fb8-0002a5d5c51b"
        name: "TX (Client → Device)"
        properties: ["write", "write_without_response"]
        notes: >
          Write channel from client to device. Frame format:
          [0x57 magic][header][payload...].
          Header bits: [7:6]=version(0), [5:4]=encryption(0=none), [3:0]=command.
          Commands: 0x1=execute action, 0x2=get info, 0x3=set info,
          0x8=get time, 0x9=set time, 0xF=extended command.
          The static property list above is best-effort: the vendor app reads
          this characteristic's property bits at runtime and picks the write
          type accordingly — write-without-response when
          PROPERTY_WRITE_NO_RESPONSE (0x08) is set, else write-with-response
          — so the bits vary per
          device/firmware.
        commands:
          bot_press:
            description: "Bot: press and release the arm."
            value: [0x57, 0x01, 0x00]
            verification: "reported"
          bot_turn_on:
            description: "Bot: press for 'on' in switch mode."
            value: [0x57, 0x01, 0x01]
            verification: "reported"
          bot_turn_off:
            description: "Bot: press for 'off' in switch mode."
            value: [0x57, 0x01, 0x02]
            verification: "reported"
          find_device:
            description: >
              Find/locate action (action byte 0x03). App-confirmed
              byte-for-byte: the vendor command generator emits this exact
              frame for its find-device function. Not a Bot press variant —
              the Bot defines only actions 0x00/0x01/0x02.
              Not hardware-tested.
            value: [0x57, 0x01, 0x03]
            verification: "reported"
          get_basic_info:
            description: "Get device basic info: battery%, firmware version, mode."
            value: [0x57, 0x02]
            verification: "reported"
          enter_ota:
            description: >
              Reboot into the firmware-update bootloader (command nibble 0x4,
              no payload). This is the vendor app's shared entry step for every
              BLE update stack (Nordic, Realtek, Freqchip). The device comes
              back at its address + 1 (see the firmware_update features). A
              password-protected device takes the password-framed form of
              command 0x4, and an encrypted-protocol device (the Smart Lock)
              takes the encrypted form. Only the plain frame is given here.
              App-derived, not hardware-tested.
            value: [0x57, 0x04]
            advanced: true
            advanced_reason: >
              Takes the device out of service until an image is uploaded or
              its bootloader times out. A Bot or Curtain stops responding, and a
              Smart Lock stops locking or unlocking from the app. Send it only
              as the first step of a firmware update you can complete.
            verification: "reported"
          set_bot_mode:
            description: >
              Set Bot mode. Payload: [strength (always 100=0x64)][mode].
              Mode bits: [7:4]=0=one-button/1=two-state-switch,
              [3:0]=0=press-on-pull-off/1=inverted. Example [0x57,0x03,0x64,0x10]
              sets two-state mode, normal direction.
            template: [0x57, 0x03, 0x64, "{mode}"]
            parameters:
              mode: { type: "uint8", min: 0, max: 255 }
            verification: "reported"
          set_long_press_duration:
            description: "Set long press duration in seconds. Frame: 0x57 0x0F 0x08 [seconds]."
            template: [0x57, 0x0F, 0x08, "{seconds}"]
            parameters:
              seconds: { type: "uint8", min: 1, max: 255 }
            verification: "reported"
          meter_read_sensor:
            description: >
              Meter/MeterTH: read current temperature and humidity via extended
              command 0x31. Send: 0x57 0x0F 0x31. Response payload:
              [fractional_temp_byte][integer_temp_byte][humidity_byte].
            value: [0x57, 0x0F, 0x31]
            verification: "reported"
          meter_set_temperature_mode:
            description: >
              Set Meter temperature display: 0x01=Celsius, 0x02=Fahrenheit.
              Frame: 0x57 0x0F 0x30 [mode].
            template: [0x57, 0x0F, 0x30, "{mode}"]
            parameters:
              mode: { type: "uint8", min: 1, max: 2 }
            verification: "reported"
          meter_read_hardware_version:
            description: "Read Meter hardware version via 0x57 0x0F 0x14."
            value: [0x57, 0x0F, 0x14]
            verification: "reported"

      - uuid: "cba20003-224d-11e6-9fb8-0002a5d5c51b"
        name: "RX (Device → Client)"
        properties: ["notify", "read"]
        notes: >
          Notification channel from device to client. Response frame:
          [status byte][payload...]. Status: 0x01=OK, 0x02=ERROR, 0x03=BUSY,
          0x05=unsupported, 0x06=low battery. For GetBasicInfo (0x02):
          payload = [battery%][fw_version*0.1][strength][ADC_hi][ADC_lo]
          [motor_cal_hi][motor_cal_lo][timer_count][act_mode][hold_times]
          [service_data_byte0][service_data_byte1]. For MeterReadSensor (0x31):
          payload = [temp_frac][temp_int][humidity].
        format:
          - offset: 0
            length: 1
            name: "status"
            type: "uint8"
          - offset: 1
            length: 1
            name: "battery_percent"
            type: "uint8"
          - offset: 2
            length: 1
            name: "firmware_version_raw"
            type: "uint8"

  - uuid: "36000001-0001-0002-0003-010203040506"
    name: "SwitchBot Alternate Communication Service"
    notes: >
      App-confirmed, not hardware-tested: the vendor app falls back to this
      service when cba20d00-... is absent, using 36000002 as the write channel
      and 36000003 for notifications. The same UUID also appears as a
      service-data
      UUID. Which products/firmware expose it is not established.
    characteristics:
      - uuid: "36000002-0001-0002-0003-010203040506"
        name: "Alternate TX (Client → Device)"
        properties: ["write", "write_without_response"]
        notes: "App-confirmed UUID, not hardware-tested."
      - uuid: "36000003-0001-0002-0003-010203040506"
        name: "Alternate RX (Device → Client)"
        properties: ["notify", "read"]
        notes: "App-confirmed UUID, not hardware-tested."

  - uuid: "00001530-1212-efde-1523-785feabcd123"
    name: "Legacy DFU Service (Nordic)"
    notes: >
      App-confirmed UUID, not hardware-tested. Nordic legacy DFU. The vendor
      server's Nordic images for the Bot and Meter are legacy DFU packages
      (dfu_version 0.5, 14-byte CRC16 init packet). The app detects Nordic
      hardware when this UUID or cba20d00-… is among the device's advertised
      UUIDs. Characteristic layout not extracted; the app's bundled Nordic
      DFU library owns it (standard control point + packet).

  - uuid: "0000fe59-0000-1000-8000-00805f9b34fb"
    name: "Secure DFU Service (Nordic)"
    notes: >
      App-confirmed UUID, not hardware-tested. Nordic Secure DFU. The vendor
      server's Nordic images for the Curtain, Smart Lock, Contact Sensor and
      Motion Sensor are Secure DFU packages with ECDSA P-256 signed init
      packets. Characteristic layout not extracted; the app's bundled Nordic
      DFU library owns it.

  - uuid: "0000d0ff-3c17-d293-8e48-14fe2e4da212"
    name: "Realtek OTA Service"
    notes: >
      App-confirmed UUID, not hardware-tested. The vendor app hands this UUID
      to its bundled Realtek DFU SDK as the OTA service. It is the update path
      for Realtek RTL8762C hardware (see the firmware_update features).
      Characteristic layout not extracted; the SDK owns it. foreo-peach-2.yaml
      carries the same UUID, where it is an unused legacy Telink service.

  - uuid: "02f00000-0000-0000-0000-00000000fe00"
    name: "Freqchip OTA Service (Frequency-OTA)"
    notes: >
      App-confirmed, not hardware-tested. It is the OTA transport of the app's
      Freqchip updaters, used on Freqchip hardware (see the firmware_update
      features): write to ...ff01, notify on ...ff02. The app calls it
      "Frequency-OTA"; it is the Freqchip OTA
      profile (govee-rgbic-light.yaml carries the same 02f00000-…-fe00 /
      …ff01 pair on its Freqchip hardware generation).
    characteristics:
      - uuid: "02f00000-0000-0000-0000-00000000ff01"
        name: "Frequency-OTA TX (Client → Device)"
        properties: ["write", "write_without_response"]
        notes: "App-confirmed UUID, not hardware-tested."
      - uuid: "02f00000-0000-0000-0000-00000000ff02"
        name: "Frequency-OTA RX (Device → Client)"
        properties: ["notify"]
        notes: "App-confirmed UUID, not hardware-tested."

  - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
    name: "Battery Service"
    characteristics:
      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "Battery Level"
        properties: ["read"]
        notes: >
          UNVERIFIED — likely absent on most devices. The standard Battery
          Service appears in neither the official BLE API docs nor the two
          reference implementations (pySwitchbot, node-switchbot); all three
          take battery from service-data byte 2 / the GetBasicInfo response.
          The vendor app likewise never references 0x180F/0x2A19 — matches
          appear only inside unrelated bundled SDKs
          (Nordic/Realtek/Telink/Tuya), not in the vendor's own code.
          Do not rely on this characteristic; treat it as a fallback to probe.
        format:
          - offset: 0
            length: 1
            name: "battery_level"
            type: "uint8"
            unit: "%"
            device_class: "battery"
            notes: >
              The SIG-defined layout, declared so a consumer that does find
              the characteristic can decode it. It says nothing about whether
              a given SwitchBot exposes it — see the characteristic notes.

features:
  # How the vendor app picks an update stack. The choice is per unit, not
  # per model: one model has shipped on several SoCs. The app's chipset
  # selector checks, in order:
  #   1. device type + hardware version. Bot, Meter, Meter Plus, Meter Pro,
  #      Meter Pro CO2, Contact and Motion: hw 60-79 -> Freqchip,
  #      hw 20-60 -> Realtek (60 goes to Freqchip). Curtain and Smart Lock:
  #      hw 20-60 -> Realtek. Curtain 3: always Realtek.
  #   2. otherwise, the UUIDs the unit advertises: 00001530-… or cba20d00-…
  #      -> Nordic; 00021530-1212-efde-1523-785feabcd123 or cda20d00-… ->
  #      Realtek; 00031530-… -> Telink; 00041530-… -> Freqchip; none -> Nordic.
  # (A React Native device page can override the choice with a
  # server-supplied mode string.) Which Nordic protocol a unit speaks, legacy
  # or Secure, is decided by the Nordic DFU library from the bootloader's
  # GATT. The per-model stack sets below are the stacks the selector can
  # reach that ALSO have images on the vendor's firmware server. The server
  # names images per chipset (…_app_V<n>.zip Nordic, …_rtl_app_… Realtek,
  # …_freq_app_… Freqchip).
  #
  # Every BLE stack is entered the same way: the app sends enter_ota
  # (0x57 0x04) on the command channel, then scans for the bootloader at
  # the unit's address + 1. It increments the last byte only, so FF wraps to
  # 00 with no carry. The app finds the bootloader by address, so its
  # advertised name is not established.
  - type: "firmware_update"
    variants: ["Bot (WoHand)", "Meter / MeterTH (WoSensorTH)"]
    dfu:
      mechanisms: ["nordic_legacy_dfu", "realtek_ota", "freqchip_ota"]
      transport: "ble"
      services:
        - "00001530-1212-efde-1523-785feabcd123"
        - "0000d0ff-3c17-d293-8e48-14fe2e4da212"
        - "02f00000-0000-0000-0000-00000000fe00"
      image:
        signing: "unknown"
        source: "public_url"
        format: "Per chipset. Nordic: legacy DFU zip (manifest dfu_version 0.5, .bin, 14-byte .dat). Realtek: RTL8762C OTA image (\"GM\" header). Freqchip: raw .bin."
        notes: >
          The Nordic images are unsigned. Their init packet is a 14-byte
          legacy packet with a CRC16 and all-FF device type, revision and
          application version. Signing of the Realtek and Freqchip images is
          not established.

          Public: the vendor serves every image from a world-readable S3
          bucket whose listing is also open
          (https://s3.amazonaws.com/www.wohand.com/?list-type=2&prefix=version/wocaotech/firmware/
          enumerated 5,493 objects across about 100 directories on
          2026-08-15). Images sit under https://s3.amazonaws.com/www.wohand.com/version/wocaotech/firmware/<directory>/,
          here WoHand/ (Bot) and WoMeter/ (Meter). Names follow the chipset:
          <Name>_app_V<n>.zip Nordic, <Name>_rtl_app_V<n>.bin Realtek,
          <Name>_freq_app_V<n>.bin Freqchip, with _LATEST aliases, but many
          directories hold irregular names (other products' files, test and
          un-suffixed images), so enumerate the listing rather than build
          a name, and do not treat a file's directory or alias as proof it
          fits an unidentified unit. Example: WoHand/WoHand_app_V1066.zip
          (Bot 1.066, Nordic) answered HTTP 200 with 53,737 bytes on
          2026-11-11. Public readability is not a vendor signature and does
          not bypass an encrypted model's key provisioning.
      enter:
        how: "command"
        command: "enter_ota"
      dfu_mode:
        address_offset: 1
        notes: "Bootloader at the unit's address + 1 (last byte only). The name is not established."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        Stack choice per unit follows the selector above. A unit with
        hardware version 60-79 takes Freqchip, 20-59 takes Realtek, and any
        other takes the stack its advertised UUIDs name, normally Nordic
        (legacy DFU). The vendor server has all three image kinds for the
        Bot, and Nordic, Realtek and Freqchip images for the Meter. From
        static analysis of the vendor app and the vendor's published images,
        not run on hardware.
  - type: "firmware_update"
    variants: ["Meter Plus"]
    dfu:
      mechanisms: ["realtek_ota", "freqchip_ota"]
      transport: "ble"
      services:
        - "0000d0ff-3c17-d293-8e48-14fe2e4da212"
        - "02f00000-0000-0000-0000-00000000fe00"
      image:
        signing: "unknown"
        source: "public_url"
        format: "Per chipset. Realtek: RTL8762C OTA image (\"GM\" header). Freqchip: raw .bin."
        notes: "Public: the vendor's world-readable, listable firmware bucket, under https://s3.amazonaws.com/www.wohand.com/version/wocaotech/firmware/WoMeterPlus/. See the Bot / Meter entry for naming."
      enter:
        how: "command"
        command: "enter_ota"
      dfu_mode:
        address_offset: 1
        notes: "Bootloader at the unit's address + 1 (last byte only). The name is not established."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        Hardware version 60-79 takes Freqchip and 20-59 takes Realtek. The
        vendor server has only Realtek and Freqchip images for the Meter
        Plus, no Nordic ones. From static analysis of the vendor app and the
        vendor's published images, not run on hardware.
  - type: "firmware_update"
    variants: ["Meter Pro", "Meter Pro CO2"]
    dfu:
      mechanisms: ["freqchip_ota"]
      transport: "ble"
      services: ["02f00000-0000-0000-0000-00000000fe00"]
      image:
        signing: "unknown"
        source: "public_url"
        format: "Raw Freqchip .bin."
        notes: "Public: the vendor's world-readable, listable firmware bucket, under https://s3.amazonaws.com/www.wohand.com/version/wocaotech/firmware/<SKU-coded directory>/ (MeterPro_freq_app_V<n>.bin for the Meter Pro). See the Bot / Meter entry for naming."
      enter:
        how: "command"
        command: "enter_ota"
      dfu_mode:
        address_offset: 1
        notes: "Bootloader at the unit's address + 1 (last byte only). The name is not established."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        The app's selector would route hardware version 20-59 to Realtek,
        but the vendor server has only Freqchip images for both models (its
        Meter Pro and Meter Pro CO2 directories), so Freqchip is the one
        stack with anything to deliver. From static analysis of the vendor
        app and the vendor's published image list, not run on hardware.
  - type: "firmware_update"
    variants: ["Motion Sensor", "Contact Sensor"]
    dfu:
      mechanisms: ["nordic_secure_dfu", "freqchip_ota"]
      transport: "ble"
      services:
        - "0000fe59-0000-1000-8000-00805f9b34fb"
        - "02f00000-0000-0000-0000-00000000fe00"
      image:
        signing: "unknown"
        source: "public_url"
        format: "Per chipset. Nordic: Secure DFU zip (.bin + 140-byte protobuf .dat). Freqchip: raw .bin."
        notes: >
          The Nordic init packets are signed commands with an ECDSA P-256
          signature (signature type 0, 64 bytes), so a Secure DFU bootloader
          checks them against the vendor key. Signing of the Freqchip images
          is not established. Public: the vendor's world-readable, listable firmware bucket, under https://s3.amazonaws.com/www.wohand.com/version/wocaotech/firmware/WoPresence/ and WoContact/. See the Bot / Meter entry for naming.
      enter:
        how: "command"
        command: "enter_ota"
      dfu_mode:
        address_offset: 1
        notes: "Bootloader at the unit's address + 1 (last byte only), which is also what a Secure DFU bootloader without bond sharing does. The name is not established."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        Hardware version 60-79 takes Freqchip, and any other takes the stack
        its advertised UUIDs name, normally Nordic Secure DFU. The selector
        would route 20-59 to Realtek, but the vendor server has no Realtek
        images for these two models. Nordic and Freqchip images exist for
        both. From static analysis of the vendor app and the vendor's
        published images, not run on hardware.
  - type: "firmware_update"
    variants: ["Curtain (WoCurtain)", "Smart Lock"]
    dfu:
      mechanisms: ["nordic_secure_dfu", "realtek_ota"]
      transport: "ble"
      services:
        - "0000fe59-0000-1000-8000-00805f9b34fb"
        - "0000d0ff-3c17-d293-8e48-14fe2e4da212"
      image:
        signing: "unknown"
        source: "public_url"
        format: "Per chipset. Nordic: Secure DFU zip (.bin + 140-byte protobuf .dat). Realtek: RTL8762C OTA image (\"GM\" header)."
        notes: >
          The Nordic init packets are ECDSA P-256 signed. Signing of the
          Realtek images is not established. Public: the vendor's world-readable, listable firmware bucket, under https://s3.amazonaws.com/www.wohand.com/version/wocaotech/firmware/WoCurtain/ and WoLock/ (WoLockPro/ and WoLockLite/ hold other lock models). See the Bot / Meter entry for naming.
      enter:
        how: "command"
        command: "enter_ota"
        notes: "The Smart Lock is one of the app's encrypted-protocol types, so it takes enter_ota in the encrypted framing."
      dfu_mode:
        address_offset: 1
        notes: "Bootloader at the unit's address + 1 (last byte only). The name is not established."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        Hardware version 20-60 takes Realtek, and any other takes the stack
        its advertised UUIDs name, normally Nordic Secure DFU. The vendor
        server has Nordic and Realtek images for both models. From static
        analysis of the vendor app and the vendor's published images, not
        run on hardware.
  - type: "firmware_update"
    variants: ["Curtain 3"]
    dfu:
      mechanisms: ["realtek_ota"]
      transport: "ble"
      services: ["0000d0ff-3c17-d293-8e48-14fe2e4da212"]
      image:
        signing: "unknown"
        source: "public_url"
        format: "Realtek RTL8762C OTA image (\"GM\" header)."
        notes: "Public: the vendor's world-readable, listable firmware bucket, under https://s3.amazonaws.com/www.wohand.com/version/wocaotech/firmware/WoCurtain3/. See the Bot / Meter entry for naming."
      enter:
        how: "command"
        command: "enter_ota"
      dfu_mode:
        address_offset: 1
        notes: "Bootloader at the unit's address + 1 (last byte only). The name is not established."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        The app's selector returns Realtek for this device type
        unconditionally, and the vendor server has only Realtek images for
        it. From static analysis of the vendor app and the vendor's published
        images, not run on hardware.
  - type: "firmware_update"
    variants: ["Color Bulb", "LED Strip Light", "Plug Mini", "Humidifier"]
    dfu:
      mechanisms: ["vendor_cloud"]
      transport: "cloud"
      image:
        signing: "unknown"
        source: "device_pulls"
        format: "ESP32-family image (the Color Bulb's is an ESP-IDF ESP32-C3 image)."
      enter:
        how: "unknown"
        notes: >
          The app has a generic Wi-Fi update step. It sends [0x57, 0x0F, 0x0A,
          0x01, <target version>] on the command channel and polls with
          [0x57, 0x0F, 0x0B]; the unit then downloads the image itself.
          Which of these four models use that step, rather than a
          model-specific one (the app has a separate Plug update step), is
          not traced.
      recovery:
        interrupted: "unknown"
      verification: "hypothesis"
      notes: >
        These are Wi-Fi products. Evidence that they update over Wi-Fi and
        not through a BLE bootloader: the app explicitly skips the BLE
        update check for the Humidifier. The vendor server has no
        chipset-suffixed BLE images for any of the four, only plain Wi-Fi
        images. Public Plug Mini research shows it fetching its image over
        HTTP from the vendor server. The BLE path is not ruled out for the
        Bulb and Strip. The app's selector would fall back to Nordic for
        them if a BLE image were ever listed.

entities:
  - platform: "switch"
    name: "Bot Press"
    state_characteristic: "cba20003-224d-11e6-9fb8-0002a5d5c51b"
    commands:
      turn_on: "bot_turn_on"
      turn_off: "bot_turn_off"
    notes: >
      bot_turn_on / bot_turn_off act only when the Bot is configured in
      two-state switch mode (set_bot_mode); in the default one-button mode
      both perform a plain press.
  - platform: "button"
    name: "Press"
    commands:
      press: "bot_press"
  - platform: "sensor"
    name: "Battery"
    device_class: "battery"
    unit: "%"
    state_characteristic: "00002a19-0000-1000-8000-00805f9b34fb"
    state_mapping:
      value: "battery_level"
    notes: >
      Bound to the standard Battery Level characteristic, which most SwitchBot
      firmware does not expose (see that characteristic's notes); the
      reliable battery source is service-data byte 2 of the advertisement,
      which has no characteristic to bind. Expect this tile to read
      unavailable on most units.

