# ELK-BLEDOM Generic BLE LED Strip Controller
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "ELK-BLEDOM BLE LED Strip Controller"
  manufacturer: "Unbranded / various OEMs (Zhiling/DuoCo etc.)"
  manufacturer_status: "unsupported"
  protocol: "ble"
  category: "light"
  notes: >
    Generic BLE LED strip controllers sold under dozens of brand names:
    JACKYLED, auraLED, HueLite, MELK, LEDBLE, ELK-BULB, ELK-LAMPL, and
    many others. Extremely cheap ($2-15) PWM LED controllers with a common
    BLE protocol. Advertises HID service 0x1812 but does not actually
    implement it — ignore.

    PROTOCOL: fixed 9-byte packets with envelope [0x7E, seq, cmd, p1, p2,
    p3, p4, flag, 0xEF]. Byte 2 is a per-command sequence number (0x00
    works; app uses unique values). Byte 8 is typically 0x00 or 0x10 but
    does not affect functionality. No bonding, no auth. NOT write-only:
    devices send 9-byte 7E…EF state notifications on characteristic
    0xFFF4 (power state 0x23/0xF0/0x01 = on, 0x24/0x00 = off, plus RGB
    and brightness), and a state query command exists
    (7e 00 01 fa 00 00 00 00 ef).

    Commands are grouped: command byte 3 identifies the operation category,
    byte 4 the sub-command. The app distinguishes "data" vs "control"
    messages but they use the same packet format.

    DISCOVERY: service UUID 0xFFF0 is the reliable signal. Advertised names
    vary widely: "ELK-BLEDOM", "MELK", "LEDBLE", "ELK-BULB", "ELK-LAMPL".
    No pairing required — any central in range can connect and write.

    UUID FAMILIES: the 0xFFF0/0xFFF3/0xFFF4 set does not cover every
    advertised name. LEDBLE, JACKYLED, "LED-" and XROCKER variants use
    write 0xFFE1 / notify 0xFFE2; DMRRBA-007 uses the Nordic UART service
    (write 0x6E400002, notify 0x6E400003).

    CONFIDENCE: HIGH for service UUID, characteristic UUID, packet format,
    color/brightness/color-temperature commands — sourced from
    github.com/FergusInLondon/ELK-BLEDOM, a clean-room RE from the Android
    APK. State readback (0xFFF4), the MELK/MODELX login handshake, the
    alternate UUID families and the scheduler/time-sync/mic commands are
    sourced from github.com/dave-code-ruiz/elkbledom (actively maintained
    HACS component). Commands beyond the visual ones (timing, mic
    streaming) are documented but less tested.

  identification:
    service_uuids:
      - "0000fff0-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "0000fff0-0000-1000-8000-00805f9b34fb"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning. Device advertises when powered. No bonding or
      pairing required and no authentication. Not write-only: state
      notifications arrive on 0xFFF4 — subscribe to it for feedback.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Scan for 0xFFF0 service UUID, connect, and write 9-byte packets
          to characteristic 0xFFF3. Classic devices need no initialization
          sequence; newer MELK-*/MODELX firmware disconnects unless a login
          handshake (7e 07 83, then 7e 04 04, about 1 s apart) is written
          immediately after connect.
        ble:
          pairing_required: false
        steps:
          - action: "Power the LED strip controller."
            actor: "user"
            request:
              protocol: "ble_gatt"
          - action: >
              Scan for the 0xFFF0 service UUID (ignore HID 0x1812) and connect.
            actor: "client"
          - action: >
              Write 9-byte command packets to characteristic 0xFFF3.
            actor: "client"
    factory_reset:
      confidence: "high"
      effect: >
        No credential state. Power-cycling resets to default state.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove and reapply power."
              actor: "user"
              expect: "Device powers on in default state."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        No bonding. Any central within range can connect and write.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: "No auth. Physical proximity is the only access control."

  variants:
    - model: "ELK-BLEDOM"
      identification:
        local_name_prefix: "ELK-BLEDOM"
    - model: "MELK"
      identification:
        local_name_prefix: "MELK"
    - model: "LEDBLE"
      identification:
        local_name_prefix: "LEDBLE"
    - model: "ELK-BULB"
      identification:
        local_name_prefix: "ELK-BULB"
    - model: "ELK-LAMPL"
      identification:
        local_name_prefix: "ELK-LAMPL"
    - model: "JACKYLED"
      identification:
        local_name_prefix: "JACKYLED"

services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "ELK-BLEDOM Service"
    notes: >
      Single service with a write characteristic (0xFFF3) and a notify
      characteristic (0xFFF4) that carries state responses. All packets
      use the 9-byte format: [0x7E] [seq] [cmd] [p1] [p2] [p3] [p4]
      [flag] [0xEF].

      Byte 2 (sequence) can be 0x00 for basic operation. Byte 8 (flag)
      is typically 0x00 or 0x10 — both work identically.
    characteristics:
      - uuid: "0000fff3-0000-1000-8000-00805f9b34fb"
        name: "Write"
        properties: ["write"]
        notes: >
          Write characteristic for all commands. No framing declared
          because each 9-byte write is a complete packet. State responses
          and notifications arrive on 0xFFF4.
        commands:
          set_rgb_color:
            description: >
              Set RGB color. Command 0x05, sub-command 0x03.
              Red, green, blue are uint8 values (0-255).
            template: [0x7E, "{seq}", 0x05, 0x03, "{red}", "{green}", "{blue}", "{flag}", 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              red: { type: "uint8", min: 0, max: 255 }
              green: { type: "uint8", min: 0, max: 255 }
              blue: { type: "uint8", min: 0, max: 255 }
              flag: { type: "uint8", default: 0x00 }
          set_brightness:
            description: >
              Set brightness. Command 0x01. Brightness 0-100 (0x64) at the
              app level; light_mode 0-255.
            template: [0x7E, "{seq}", 0x01, "{brightness}", "{light_mode}", 0x00, 0x00, "{flag}", 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              brightness: { type: "uint8", min: 0, max: 100 }
              light_mode: { type: "uint8", default: 0xFF }
              flag: { type: "uint8", default: 0x00 }
          set_color_temperature:
            description: >
              Set color temperature. Command 0x05, sub-command 0x02.
              warm and cold values must total 100.
            template: [0x7E, "{seq}", 0x05, 0x02, "{warm}", "{cold}", 0x00, 0x00, "{flag}", 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              warm: { type: "uint8", min: 0, max: 100 }
              cold: { type: "uint8", min: 0, max: 100 }
              flag: { type: "uint8", default: 0x10 }
          set_single_color:
            description: >
              Set a predefined single color. Command 0x05, sub-command 0x01.
              Color index 0-100 (maps to app's single-color palette).
            template: [0x7E, "{seq}", 0x05, 0x01, "{color}", 0xFF, 0xFF, "{flag}", 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              color: { type: "uint8", min: 0, max: 100 }
              flag: { type: "uint8", default: 0x10 }
          set_light_on_off:
            description: >
              Turn light on or off. Command byte varies by app version.
              On = 0x01, Off = 0x00.
            template: [0x7E, "{seq}", "{cmd}", "{state}", 0xFF, 0xFF, 0xFF, "{flag}", 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              cmd: { type: "uint8" }
              state: { type: "uint8", values: { "0": "off", "1": "on" } }
              flag: { type: "uint8", default: 0x00 }
          set_mode:
            description: >
              Set effect mode. Index 0-255 per app mode list
              (strobe, fade, etc.).
            template: [0x7E, "{seq}", "{cmd}", "{mode}", 0xFF, 0xFF, 0xFF, "{flag}", 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              cmd: { type: "uint8" }
              mode: { type: "uint8", min: 0, max: 255 }
              flag: { type: "uint8", default: 0x00 }
          get_state:
            description: >
              Query device state (command 0x01, sub-command 0xFA). The
              9-byte state response arrives as a notification on 0xFFF4.
            value: [0x7E, 0x00, 0x01, 0xFA, 0x00, 0x00, 0x00, 0x00, 0xEF]
          set_effect_speed:
            description: "Set effect speed. Command 0x02, speed in byte 3."
            template: [0x7E, "{seq}", 0x02, "{speed}", 0x00, 0x00, 0x00, "{flag}", 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              speed: { type: "uint8", min: 0, max: 255 }
              flag: { type: "uint8", default: 0x00 }
          set_scheduler:
            description: >
              Scheduler on/off. Command 0x82: hours, minutes, then 0x00,
              0x00 = schedule on / 0x01 = schedule off, and a days bitmask
              (add 0x80 when the schedule is enabled).
            template: [0x7E, "{seq}", 0x82, "{hours}", "{minutes}", 0x00, "{on_off}", "{days}", 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              hours: { type: "uint8", min: 0, max: 23 }
              minutes: { type: "uint8", min: 0, max: 59 }
              on_off: { type: "uint8", values: { "0": "schedule on", "1": "schedule off" } }
              days: { type: "uint8" }
          sync_time:
            description: >
              Sync the device clock. Command 0x83: hours, minutes, seconds,
              ISO day-of-week (1-7).
            template: [0x7E, "{seq}", 0x83, "{hours}", "{minutes}", "{seconds}", "{day_of_week}", 0x00, 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              hours: { type: "uint8", min: 0, max: 23 }
              minutes: { type: "uint8", min: 0, max: 59 }
              seconds: { type: "uint8", min: 0, max: 59 }
              day_of_week: { type: "uint8", min: 1, max: 7 }
          set_mic_effect:
            description: "Microphone effect mode (command 0x05, sub-command 0x03), value 0x80-0x87."
            template: [0x7E, "{seq}", 0x05, 0x03, "{effect}", 0x04, 0xFF, 0xFF, "{flag}", 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              effect: { type: "uint8", min: 128, max: 135 }
              flag: { type: "uint8", default: 0x00 }
          set_mic_sensitivity:
            description: "Microphone sensitivity 0-100 (command 0x04, sub-command 0x06)."
            template: [0x7E, "{seq}", 0x04, 0x06, "{sensitivity}", 0xFF, 0xFF, 0xFF, "{flag}", 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              sensitivity: { type: "uint8", min: 0, max: 100 }
              flag: { type: "uint8", default: 0x00 }
          set_mic_on_off:
            description: "External microphone on/off (command 0x04, sub-command 0x07). On = 0x01, off = 0x00."
            template: [0x7E, "{seq}", 0x04, 0x07, "{state}", 0xFF, 0xFF, 0xFF, "{flag}", 0xEF]
            parameters:
              seq: { type: "uint8", default: 0x00 }
              state: { type: "uint8", values: { "0": "off", "1": "on" } }
              flag: { type: "uint8", default: 0x00 }

      - uuid: "0000fff4-0000-1000-8000-00805f9b34fb"
        name: "Notify"
        properties: ["notify"]
        notes: >
          State notifications. The device pushes 9-byte 7E…EF packets
          here — power state (0x23/0xF0/0x01 = on, 0x24/0x00 = off),
          RGB values and brightness — including the response to the
          0xFA state query. Subscribe to it for state readback.

entities:
  - platform: "light"
    name: "LED Strip"
    features: ["brightness", "color", "color_temperature", "effect"]
    state_characteristic: "0000fff4-0000-1000-8000-00805f9b34fb"
