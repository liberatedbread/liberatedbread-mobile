# Petronics Mousr — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Clean-room derived facts from the official 1.0.7 app's command builders,
# recovered command vocabulary and bundled user guide. No vendor code or
# firmware is included. Static analysis only; no toy or HCI capture was used.

device:
  name: "Petronics Mousr"
  manufacturer: "Petronics Inc. (consumer product discontinued)"
  manufacturer_status: "abandoned"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The 15-byte envelope,
      command codes and float32 drive-vector layout come from static analysis
      of the recovered official 1.0.7 app. The second code byte of a
      one-digit command code is unresolved (see the command input notes).
      Notification payload layouts, auto-mode offsets and drive-value
      physical scaling remain unverified.
  protocol: "ble"
  transport: "ble-gatt"
  category: "other"
  type: "robot-pet-toy"
  notes: >
    Phone-direct robotic cat toy. Ordinary operation does not require an
    account or cloud service. Nordic UART is the command path. The app also
    references the Nordic Secure DFU service (0000fe59-0000-1000-8000-00805f9b34fb)
    and its bootloader characteristics; see features. An earlier note
    misread the 8ec9000x DFU characteristics as a Laird virtual serial port;
    no Laird VSP UUID (569a1101-…) was recorded for this toy. The app
    bundles recovery firmware, but no update was performed and no firmware
    is shipped in this spec. Movement and tail calibration require a clear
    area and supervision.
  safety_advisory:
    severity: caution
    summary: "Moving robot and tail assembly — supervise use."
    detail: >
      Test the stop command first and use movement only in a clear area away from pets,
      people, cables and edges. The app-derived drive values have no proven
      physical units. Do not attempt DFU until normal control and charging
      state are established.
    acknowledge_required: true
  openness:
    status: "undocumented"
    reverse_engineered: true
    notes: >
      No public protocol implementation was found. Wire facts are derived
      from the recovered official app's packet builders and command metadata,
      not from a live capture.
  identification:
    local_names: ["Mousr"]
    service_uuids:
      - "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
    notes: >
      Name and service are a narrowing pair: treat an advertisement as this
      toy only when the name is exactly "Mousr" AND the Nordic UART service
      is present (advertised, or found on connect before any write). The
      Nordic UART service on its own identifies nothing; many unrelated
      products in this catalogue carry it, and this spec declares movement
      commands. The name is an exact match, not a prefix, so the bootloader
      name "MousrDfu" is excluded here; it is declared in
      features[firmware_update].dfu.dfu_mode, which a consumer checks first.
      The factory name is reported, not observed, and the app lets an owner
      rename the toy. A renamed unit is not auto-matched: the user adds it
      by hand.
  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "exact"
            value: "Mousr"
        notes: >
          Name only, matched exactly so "MousrDfu" (bootloader) does not
          match. The Nordic UART service is deliberately not listed here:
          within a ble_scan method a name and a service are alternatives,
          and the service alone would match every Nordic UART product. After
          connecting, confirm 6e400001-b5a3-f393-e0a9-e50e24dcca9e is present
          before writing anything. A renamed toy is not found by this method;
          the user picks it from a generic scan and adds it by hand.
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false
  setup:
    required: false
    confidence: "low"
    notes: >
      No account or first-run cloud activation was found in the recovered
      app. Connect directly and subscribe before sending commands; this has
      not been replayed on a toy.
    methods:
      - type: "ble_direct"
        name: "Connect and subscribe"
        verified: false
        description: "Connect over Nordic UART, enable notifications, then send documented 15-byte commands."
        ble:
          pairing_required: false
        steps:
          - action: "Charge and wake the toy in a clear area."
            actor: "user"
          - action: "Connect to the Nordic UART service and enable notifications on 6e400003-b5a3-f393-e0a9-e50e24dcca9e."
            actor: "client"
          - action: "Send the stop command before testing any other command, and check that it is accepted (see the code-byte note on the command input characteristic)."
            actor: "client"
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established: whether autonomous-play settings, calibration or
        pairing state are cleared is undocumented. DFU and tail calibration
        are not factory resets.
      description: "No general factory-reset procedure is established. DFU and tail calibration are not resets."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "BLE-only; reconnect after the previous central disconnects."
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: "No account-bound credential was found for ordinary operation."
  pairing:
    required: "unknown"
    confidence: "low"
    security_mode: "unknown"
    bonding: "unknown"
    enter_pairing_mode:
      required: false
    notes: >
      Static analysis found no application-layer authentication for normal
      commands. The guide discusses Bluetooth pairing, but whether a bond is
      required on every firmware/phone combination needs a live check.

initialization:
  - characteristic: "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
    subscribe: true
    when: "connect"
    notes: "Enable the UART notification channel before control."

services:
  - uuid: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
    name: "Nordic UART control"
    characteristics:
      - uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
        name: "Command input"
        properties: ["write"]
        notes: >
          Every declared command is exactly 15 bytes: ASCII 30, a 12-byte
          payload (zero-filled when unused), then the command code in
          offsets 13-14. A two-digit code is its two ASCII digits (18 is
          31 38). For a one-digit code the second byte is UNRESOLVED: the
          static analysis this spec rests on yielded two contradictory
          readings and no capture settles it. Form A is a leading ASCII zero
          then the digit (code 2 is 30 32); form B is the digit then NUL
          (code 2 is 32 00). The declared values below keep the bytes the
          analysis recorded for each command, which mix the two forms (stop
          is form B, the others form A), so every one-digit command is
          marked verification hypothesis and its description gives the other
          form. A client should try stop in both forms and keep whichever the
          toy obeys.
        commands:
          stop:
            description: "Stop movement (command 0). Declared in form B (code bytes 30 00); form A would end 30 30."
            verification: "hypothesis"
            value: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x30, 0x00]
          chirp:
            description: "Play a chirp (command 18)."
            verification: "reported"
            value: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x31, 0x38]
          move:
            description: "Send a raw drive vector (command 2); units and valid ranges are unverified. Declared in form A (code bytes 30 32); form B would end 32 00."
            verification: "hypothesis"
            template: [0x30, "{speed}", "{hold}", "{angle}", 0x30, 0x32]
            parameters:
              speed:
                type: "float32"
                endianness: "little"
                default: 0.0
                description: "Raw app control value, not proven m/s, percent or another physical unit."
              hold:
                type: "float32"
                endianness: "little"
                default: 0.0
                description: "Raw app control value; valid range is unestablished."
              angle:
                type: "float32"
                endianness: "little"
                default: 0.0
                description: "Raw app control value, not proven degrees."
            advanced: true
            advanced_reason: "Drives a moving robot. Use only small values in a clear area after testing the stop command; physical scaling is not established."
          spin:
            description: "Start the spin action (command 1). Declared in form A (code bytes 30 31); form B would end 31 00."
            verification: "hypothesis"
            value: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x30, 0x31]
            advanced: true
            advanced_reason: "Starts movement; use in a clear area after testing the stop command."
          reset_heading:
            description: "Reset the toy's heading reference used by autonomous movement (command 3). Declared in form A (code bytes 30 33); form B would end 33 00."
            verification: "hypothesis"
            value: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x30, 0x33]
          sleep:
            description: "Enter sleep mode until the toy is woken (command 10)."
            verification: "reported"
            value: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x31, 0x30]
          turn_off:
            description: "Power the toy off, ending the session (command 9). Declared in form A (code bytes 30 39); form B would end 39 00."
            verification: "hypothesis"
            value: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x30, 0x39]
      - uuid: "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
        name: "UART notifications"
        properties: ["notify"]
        notes: >
          Notification IDs are recovered, but their complete payload layouts
          are not. Keep the value opaque until a capture confirms the
          envelope rather than presenting guessed battery or pose readings.
  - uuid: "0000fe59-0000-1000-8000-00805f9b34fb"
    name: "Nordic Secure DFU service"
    notes: >
      Firmware-update path, recorded from the app's UUID references, not
      from a GATT dump of a toy. 8ec90001-f315-4f60-9fb8-838830daea50 (DFU
      control point) and 8ec90002-f315-4f60-9fb8-838830daea50 (DFU packet)
      are the stack's bootloader characteristics; they were previously
      mislabelled here as a Laird VSP service. Whether the running
      application exposes the stack's buttonless characteristic is not
      established. A GATT explorer lists this service read-only; see
      features.
    characteristics:
      - uuid: "8ec90001-f315-4f60-9fb8-838830daea50"
        name: "DFU control point (bootloader)"
        properties: []
        notes: "Nordic Secure DFU control point, present in the bootloader. Properties on this unit are not observed; do not write outside a deliberate update."
      - uuid: "8ec90002-f315-4f60-9fb8-838830daea50"
        name: "DFU packet (bootloader)"
        properties: []
        notes: "Nordic Secure DFU packet characteristic, present in the bootloader. Properties on this unit are not observed; do not write outside a deliberate update."

payload_formats:
  CommandPacket:
    description: "The fixed 15-byte Nordic UART command envelope."
    fields:
      - name: "leader"
        description: "Offset 0, ASCII 30."
      - name: "payload"
        description: "Offsets 1-12, zero-filled when unused."
      - name: "decimal_code"
        description: "Offsets 13-14. A two-digit code is two ASCII digits. A one-digit code is unresolved between form A (ASCII 0 then the digit) and form B (the digit then NUL); see the command input notes."
    parse_rules:
      - "Reject packets whose total length is not exactly 15 bytes."
      - "The move command places three little-endian IEEE-754 binary32 values at offsets 1, 5 and 9, then code 2 (form A 30 32 as declared; form B would be 32 00)."
      - "Do not label the drive values as physical speed, degrees or percent without new evidence."
    example: "30 00 00 80 3f 00 00 00 00 00 00 00 00 30 32"
  NotificationVocabulary:
    description: "Recovered notification IDs, not complete payload declarations."
    values:
      15: "auto-mode acknowledgement"
      28: "firmware version"
      29: "hardware version"
      30: "initialization done"
      48: "robot pose"
      50: "tail reset failed (failure detail)"
      64: "stuck: distance sensor"
      95: "crash-log finish"
      96: "crash-log string"
      97: "debug info"
      98: "battery voltage"
      99: "robot stopped"
      100: "stuck while being driven"
      255: "negative acknowledgement"

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["nordic_secure_dfu"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "bundled_in_app"
        format: "nrfutil DFU zips: three application packages and one SoftDevice/bootloader package bundled in the app."
        notes: >
          The images stay in the app; none is shipped here. Whether this
          bootloader enforces the stack's default ECDSA signature check is
          not established.
      enter:
        how: "unknown"
        notes: >
          The command vocabulary has a bootloader-entry code (8), but its
          payload and code-byte form are not established, so it is not
          declared as a command. Whether the running application also
          exposes the stack's buttonless characteristic
          (8ec90003-f315-4f60-9fb8-838830daea50) is not established.
      dfu_mode:
        local_names: ["MousrDfu"]
        notes: >
          Bootloader name recorded from the app, not observed on a unit.
          Address behaviour is not observed; a stock nRF5 SDK bootloader
          without bond sharing would advertise at address+1. A device in
          this mode gets no ordinary controls.
      services: ["0000fe59-0000-1000-8000-00805f9b34fb"]
      recovery:
        interrupted: "unknown"
        notes: >
          The nRF5 SDK defaults (dual-bank where flash allows, 120 s
          inactivity timeout back to a valid application) have not been
          checked on a toy.
      verification: "reported"
      notes: >
        From the app's Nordic DFU library references and bundled packages,
        not from an update performed on hardware. Do not attempt an update
        until ordinary control and charging state are established.

entities: []

protocol_details:
  command_vocabulary:
    0: "stop"
    1: "spin"
    2: "move (drive vector)"
    3: "reset heading"
    4: "request debug log"
    5: "planned spin"
    8: "enter firmware-update (bootloader) mode"
    9: "turn off"
    10: "sleep"
    15: "configure autonomous play mode"
    18: "chirp"
    19: "set sound volume"
    23: "tail flick"
    24: "reverse"
    25: "tail calibration"
    26: "set tail"
    28: "initialize device"
    31: "flip the robot over"
    41: "configure driver assist"
    45: "tutorial step"
    46: "set time"
    100: "invalid command"
  undeclared_controls: >
    Auto-mode byte offsets, debug-log transfer, tail calibration, driver
    assist, tutorial control, set time and bootloader entry (code 8) are not
    declared as commands because their payload, or the code-byte form, is
    not established. They are listed above so the next person can capture
    them, not withheld. No reset or firmware write should be inferred from
    the command number alone.
  one_digit_code_forms:
    note: >
      Both candidate encodings of every one-digit code, as the last two
      bytes of the 15-byte packet. Neither is backed by an observation.
    form_a_ascii_zero_then_digit: "30 3n (code 0 = 30 30, code 2 = 30 32)"
    form_b_digit_then_nul: "3n 00 (code 0 = 30 00, code 2 = 32 00)"
  test_vectors:
    stop_hex: "30 00 00 00 00 00 00 00 00 00 00 00 00 30 00"
    stop_form_a_hex: "30 00 00 00 00 00 00 00 00 00 00 00 00 30 30"
    chirp_hex: "30 00 00 00 00 00 00 00 00 00 00 00 00 31 38"
    move:
      speed: 1.0
      hold: 0.0
      angle: 0.0
      expected_hex: "30 00 00 80 3f 00 00 00 00 00 00 00 00 30 32"
      form_b_hex: "30 00 00 80 3f 00 00 00 00 00 00 00 00 32 00"
    move_fractional:
      speed: 0.5
      hold: 0.25
      angle: -1.5
      expected_hex: "30 00 00 00 3f 00 00 80 3e 00 00 c0 bf 30 32"

evidence:
  artifacts:
    - type: "static_app_analysis"
      artifact: "Recovered official Mousr app 1.0.7, packet builders and command metadata, read 2026-11-01"
      description: >
        Establishes the 15-byte command envelope, decimal command codes,
        float32-LE drive vector, Nordic UART and notification vocabulary.
        These are reported facts from static analysis, not hardware tests.
    - type: "vendor_documentation"
      artifact: "Mousr User Guide v1.2 recovered from that app"
      description: >
        Supports phone-direct operation and supplies movement/tail
        calibration precautions. No firmware compatibility claim is made.
  open_questions: >
    Drive-value ranges and physical units, notification payload layouts,
    auto-mode configuration offsets, bonding requirements, firmware/DFU
    compatibility, the second code byte of one-digit command codes, and
    whether the factory name is exactly "Mousr".

remaining_unknowns:
  - "Drive values are app control values, not established m/s, degrees or percent."
  - "Notification IDs are known but payload layouts are not; no battery or pose decoder is declared."
  - "Auto-mode configuration has a 12-byte payload but its exact offsets are unresolved."
  - "The app carries Nordic DFU packages, but no update sequence or version compatibility was tested."
  - "One-digit command codes (stop 0, spin 1, move 2, reset heading 3, turn off 9) have two contradictory encodings in the analysis: ASCII 0 then the digit, or the digit then NUL. Neither was observed; the declared values mix them. A capture of the app sending stop and move settles it."
  - "The factory advertised name is reported as exactly Mousr but has not been seen on a unit; identification uses it as an exact name."
  - "No hardware capture confirms bonding, command acceptance or connection limits."

helpful_urls:
  - title: "Mousr Kickstarter FAQ"
    url: "https://www.kickstarter.com/projects/525985345/mousr-the-robotic-mouse-that-plays-with-your-cat/faqs"
    kind: "vendor_support"
    description: "Product background and the Bluetooth-direct control model."
