device:
  name: "Omron BLE Blood Pressure Monitors (OMRON connect family)"
  manufacturer: "Omron Healthcare"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "ble"
  category: "health"
  notes: >
    Omron's Bluetooth blood pressure monitors (HEM-7xxx upper-arm and
    HEM-6xxx wrist families; global names M2/M3/M4/M7 Intelli IT, RS2/RS7
    Intelli IT, EVOLV, Complete, Platinum, BP5xxx/BP7xxx) store readings
    in on-device EEPROM and sync them over BLE to the vendor app
    (jp.co.omron.healthcare.omronconnect, "OMRON connect"). The sync
    protocol is local: no cloud account, broker or vendor key is involved
    on the wire.

    Sources (no APK teardown used): userx14/omblepy (Python CLI with a
    per-model support matrix and the message-framing documentation),
    ichernev/omron-rs7-intelli-it (HCI-snoop reverse engineering of the
    RS7 Intelli IT with worked message annotations), eigger/hass-omron
    (Home Assistant integration verifying 12 models against hardware),
    and LazyT's UBPM project (multi-channel reception insight).
    Confidence: hardware-verified by those upstream projects across many
    models; not re-run against a device here.

    TRANSPORT — split-channel GATT. Parent service
    ecbe3980-c9a2-11e1-b1bd-0002a5d5c51b carries four write
    characteristics (device RX channels), four notify characteristics
    (device TX channels) and one unlock characteristic. Each message is
    chopped into 16-byte chunks written in order across the four write
    characteristics; responses arrive likewise split across the four
    notify channels and are reassembled using the message's own length
    byte. (Some newer models use a single wider channel instead — the
    per-model drivers in both omblepy and hass-omron override the UUID
    set; the 4x4 legacy set below is the common case.)

    MESSAGE FRAMING (omblepy README + omblepy.py):
      byte 0:    total message length in bytes (including this byte and CRC)
      bytes 1-2: command/response type
      bytes 3-4: EEPROM address (big-endian)
      byte 5:    payload size
      bytes 6..: payload
      last byte: XOR checksum — all message bytes including the checksum
                 XOR to 0x00
    Request types:  0000 start transmission, 0100 EEPROM read,
                    01c0 EEPROM write, 0f00 end transmission.
    Response types: 8000 / 8100 / 81c0 / 8f00 respectively (request type
                    with the high bit set). The 8f00 end response carries
                    a status byte — non-zero is a device error.
    Start-of-session frame: 08 0000 0000 10 00 18. End: 08 0f00 0000 00 00 07.
    Read example (README): request 08 0100 0260 26 00 4d reads 0x26 bytes
    from EEPROM address 0x0260.

    PAIRING / UNLOCK — the monitor holds ONE client key at a time
    (hardware limit; using the vendor app and a local client together is
    not possible):
      1. Hold the Bluetooth button on the monitor 3-5 s until the display
         shows a blinking "-P-".
      2. Connect and enable notifications on RX channel 0 — this triggers
         an SMP security request, i.e. ordinary OS-level BLE bonding.
      3. Enter key-programming mode: write 02 || 16x00 to the unlock
         characteristic; response starts 8200 on success.
      4. Program a client-chosen 16-byte key: write 00 || key; response
         8000 confirms. (omblepy uses an arbitrary constant — the key is
         not a vendor secret, it is whatever the client chooses.)
      5. Later sessions skip pairing: write 01 || key to the unlock
         characteristic; response 8100 means unlocked.
    After unlock: startTransmission (0000) -> EEPROM reads -> optionally
    writes (unread-counter reset, time sync) -> endTransmission (0f00).

    DATA MODEL — per-user ring buffers in EEPROM plus a settings region.
    Layouts are per-model; the worked example (HEM-7322T / M700 Intelli
    IT, omblepy deviceSpecific/hem-7322t.py):
      - user record regions start at 0x02AC (user 1) and 0x0824 (user 2),
        100 records each, 0x0E bytes per record
      - settings region read at 0x0260, written back at 0x0286
      - unread-record counters: settings bytes 0x00-0x08 (reset by
        writing 0x8000 per user, big-endian)
      - clock: settings bytes 0x14-0x1E, byte order
        [month, year-2000, hour, day, second, minute] followed by a
        0x00 byte and a sum-of-bytes & 0xFF checksum
    RECORD DECODE (HEM-7322T, 14-byte record, bit-packed big-endian):
      bits 0-7   diastolic (mmHg)
      bits 8-15  systolic - 25 (mmHg)
      bits 16-23 year - 2000
      bits 24-31 pulse (bpm)
      bit 32     body-movement flag
      bit 33     irregular-heartbeat flag
      bits 34-37 month, 38-42 day, 43-47 hour, 52-57 minute, 58-63 second
    ichernev's independent RS7 Intelli IT decode of the same 14-byte
    record inside the 8100 response agrees: sys = b[7] + 25, dia = b[6],
    pulse = b[9], flags b[8], packed timestamp b[10:14], and a two-byte
    record checksum where b[18] = 255 - b[19] and
    b[19] = sum(b[6:18]) mod 256.

    WARNING — EEPROM writes can brick calibration. The pressure-sensor
    calibration likely lives in the settings region; the only writes the
    upstream tools perform are the unread-counter reset and the time
    sync, at the model's documented settings write address. Treat every
    other write as dangerous on an unmapped model.

    KNOWN LIMITS: HEM-7196T (M4/X4 Connect AFib) encrypts its traffic and
    is NOT supported by omblepy. HEM-7380T1 (X7 Smart AFib) and
    HEM-7377T1 support readout without the pairing flow. EKG records of
    the HEM-7530T (Complete) are not decoded. Changing batteries can
    reset the device clock — re-run time sync afterwards.

  identification:
    local_name_prefixes: ["HEM-"]
    service_uuids:
      - "ecbe3980-c9a2-11e1-b1bd-0002a5d5c51b"
      - "0000fe4a-0000-1000-8000-00805f9b34fb"
    manufacturer_data:
      company_id: 526
      company_id_hex: "0x020E"
      description: >
        Discovery matchers used in production by hass-omron's manifest:
        manufacturer id 526 (0x020E), the 128-bit parent service UUID,
        the 16-bit service 0xFE4A, or local name prefix "HEM-". Any one
        matches; not every model advertises all of them.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            values: ["HEM-"]
          service_uuids:
            - "ecbe3980-c9a2-11e1-b1bd-0002a5d5c51b"
            - "0000fe4a-0000-1000-8000-00805f9b34fb"
          manufacturer_data:
            company_id: 526
            description: "Omron manufacturer id 0x020E (hass-omron bluetooth matcher)."
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: true
    confidence: "high"
    notes: >
      One-time pairing is required before records can be downloaded: the
      monitor stores a single 16-byte client key, and every later session
      unlocks with it. Confidence high: the flow runs in production in
      omblepy and hass-omron against many hardware models. The monitor
      itself measures without any pairing — only sync needs it.
    methods:
      - type: "button_pairing"
        verified: false
        description: >
          Hold the monitor's Bluetooth button until "-P-" blinks, connect,
          bond at OS level (triggered by enabling RX-channel-0 notify),
          then program a client-chosen 16-byte key through the unlock
          characteristic. Display shows OK when done.
        ble:
          pairing_required: true
        steps:
          - action: "Hold the Bluetooth button 3-5 s until the display shows a blinking -P-."
            actor: user
          - action: "Connect; enable notify on RX channel 0 to trigger the SMP security request and complete OS bonding."
            actor: client
          - action: "Write 02 || 16x00 to the unlock characteristic (b305b680-...); expect a response starting 8200 (key-programming mode)."
            actor: client
          - action: "Write 00 || <16-byte client-chosen key>; expect 8000. The key is now bound to the monitor."
            actor: client
            expect: "Monitor displays OK. Later sessions: write 01 || key, expect 8100, then start transmission (0000) and read EEPROM."
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        No factory-reset procedure is documented in the RE sources. The
        binding is a single overwriteable 16-byte key: putting the monitor
        back into pairing mode and programming a new key replaces it, so
        a reset is not needed to rebind. Stored measurements survive.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Rebind in place: re-enter pairing mode (hold the Bluetooth
        button) and program a new key. Remember the hardware holds only
        ONE key — rebinding evicts the previous client, including the
        vendor app, which must then be unpaired/forgotten at OS level on
        the old host.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device:
        - "One 16-byte client unlock key (client-chosen, overwriteable in pairing mode)"
        - "Measurement records and settings (incl. clock) in EEPROM"
      issued_to_client: []
      notes: >
        No Wi-Fi and no cloud credential on this path. The 16-byte key is
        chosen by the pairing client and is the only secret; the record
        readout itself is unencrypted on models listed as supported
        (HEM-7196T excepted — encrypted, unsupported).

services:
  - uuid: "ecbe3980-c9a2-11e1-b1bd-0002a5d5c51b"
    name: "Omron Sync Service (legacy 4-channel set)"
    notes: >
      Default UUID set from omblepy; per-model drivers in omblepy and
      hass-omron override it for newer hardware (some use a single
      wider channel). Many models also advertise the 16-bit alias
      service 0xFE4A.
    characteristics:
      - uuid: "49123040-aee8-11e1-a74d-0002a5d5c51b"
        name: "device_rx_channel_0"
        properties: ["write"]
        notes: "Client->device write channel 0. Messages are split into 16-byte chunks written in order across channels 0-3."
      - uuid: "4d0bf320-aee8-11e1-a0d9-0002a5d5c51b"
        name: "device_rx_channel_1"
        properties: ["write"]
        notes: "Client->device write channel 1."
      - uuid: "5128ce60-aee8-11e1-b84b-0002a5d5c51b"
        name: "device_rx_channel_2"
        properties: ["write"]
        notes: "Client->device write channel 2."
      - uuid: "560f1420-aee8-11e1-8184-0002a5d5c51b"
        name: "device_rx_channel_3"
        properties: ["write"]
        notes: "Client->device write channel 3."
      - uuid: "db5b55e0-aee7-11e1-965e-0002a5d5c51b"
        name: "device_tx_channel_0"
        properties: ["notify"]
        notes: "Device->client notify channel 0. Byte 0 of the first chunk is the total response length; reassemble channels 0..ceil(len/16)-1 in order."
      - uuid: "e0b8a060-aee7-11e1-92f4-0002a5d5c51b"
        name: "device_tx_channel_1"
        properties: ["notify"]
        notes: "Device->client notify channel 1."
      - uuid: "0ae12b00-aee8-11e1-a192-0002a5d5c51b"
        name: "device_tx_channel_2"
        properties: ["notify"]
        notes: "Device->client notify channel 2."
      - uuid: "10e1ba60-aee8-11e1-89e5-0002a5d5c51b"
        name: "device_tx_channel_3"
        properties: ["notify"]
        notes: "Device->client notify channel 3."
      - uuid: "b305b680-aee7-11e1-a730-0002a5d5c51b"
        name: "unlock"
        properties: ["write", "notify"]
        notes: >
          Pairing/unlock channel. Write 02 || 16x00 to enter
          key-programming mode (response 8200), 00 || <16-byte key> to
          program a new key (response 8000), 01 || <key> to unlock a
          session (response 8100). Ordering is mandatory: pairing runs
          enter_key_programming then program_key (only while the monitor
          shows the blinking -P-); every later session sends only
          unlock_session, and it must succeed before the start-transmission
          frame (0000) is written to the RX channels. Not expressed as an
          `initialization` block because the key bytes are per-client, not
          a fixed sequence.
        commands:
          enter_key_programming:
            description: >
              Enter key-programming mode: 02 followed by 16 zero bytes.
              Only accepted while the monitor shows the blinking -P-
              (pairing mode). Response starts 8200 on success. Must precede
              program_key.
            value: [0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          program_key:
            description: >
              Program a new client key: 00 followed by the new 16-byte
              client-chosen key. Response 8000 on success. Second step of
              pairing, after enter_key_programming; the monitor stores only
              one key, so this evicts any previous client.
            template: [0x00, "{key}"]
            parameters:
              key:
                type: "bytes"
                min_length: 16
                max_length: 16
                description: >
                  Client-chosen 16-byte unlock key. Not a vendor secret —
                  omblepy uses an arbitrary constant.
          unlock_session:
            description: >
              Unlock a session: 01 followed by the stored 16-byte key.
              Response 8100 on success; anything else means wrong key.
              Required at the start of every session before start
              transmission (0000).
            template: [0x01, "{key}"]
            parameters:
              key:
                type: "bytes"
                min_length: 16
                max_length: 16
                description: "The 16-byte key previously bound via program_key."

ble:
  connection_sequence:
    description: >
      Every session: connect -> (first time: pair + program key as in
      setup) -> write 01 || key to unlock char, expect 8100 -> enable
      notify on the four TX channels -> send start transmission
      (08 0000 0000 10 00 18, expect response type 8000) -> EEPROM reads
      (0100) for settings and record regions -> optional writes (01c0:
      unread-counter reset, time sync) -> end transmission
      (08 0f00 0000 00 00 07, expect 8f00 with status byte 0) ->
      disconnect. Failed transmissions are retried by omblepy up to
      5 times before aborting.

model_variants:
  - model: "HEM-7322T (M700 Intelli IT / BP786)"
    status: "readout + pairing verified (omblepy, hass-omron)"
    notes: "Worked EEPROM layout in this spec: users at 0x02AC/0x0824, 100x0x0E records, settings 0x0260/0x0286."
  - model: "HEM-7155T / HEM-7361T / HEM-7600T / HEM-6232T / HEM-7150T / HEM-7342T / HEM-7530T"
    status: "readout + pairing verified upstream"
    notes: "Per-model EEPROM layouts live in omblepy deviceSpecific/*.py; HEM-7530T EKG records not decoded."
  - model: "HEM-6161T / HEM-7142T2 / HEM-7146T2 / HEM-7151T / HEM-716BT2 / HEM-7320T / HEM-7343T"
    status: "verified in hass-omron only"
    notes: "Newer models; UUID set may differ from the legacy 4x4 channels (single-channel drivers)."
  - model: "HEM-7380T1 / HEM-7377T1"
    status: "readout verified; pairing flow not applicable"
    notes: "Work without the key-programming flow."
  - model: "HEM-7196T (M4/X4 Connect AFib)"
    status: "UNSUPPORTED - encrypted traffic"
    notes: "omblepy: pairing and readout both blocked by encryption not yet reverse engineered."

entities:
  - platform: "sensor"
    name: "Systolic pressure"
    device_class: "blood_pressure"
    unit: "mmHg"
    notes: "Record bits 8-15 + 25."
  - platform: "sensor"
    name: "Diastolic pressure"
    device_class: "blood_pressure"
    unit: "mmHg"
    notes: "Record bits 0-7."
  - platform: "sensor"
    name: "Pulse"
    device_class: "heart_rate"
    unit: "bpm"
    notes: "Record bits 24-31."
  - platform: "binary_sensor"
    name: "Body movement"
    notes: "Record bit 32."
  - platform: "binary_sensor"
    name: "Irregular heartbeat"
    notes: "Record bit 33."

