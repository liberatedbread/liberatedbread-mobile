  ioctrl_v2:
    applies_to: ["FB001", "FB002", "FB0025", "MC0010"]
    verification: "reported"
    notes: >-
      The older opcode set, from ha-furbo's reading of the vendor app. Not
      hardware-verified beyond video and the legacy credential path on an
      FB002 (ha-furbo issue 3). Requests are 4 bytes unless noted. V2 has
      no pan.
    opcodes:
      - {opcode: "0x903", name: "set_video_quality", request: "not traced"}
      - {opcode: "0x905", name: "set_night_vision", request: "[mode (0 auto, 1 on, 2 off), 0, 0, 0]"}
      - {opcode: "0x907", name: "get_night_vision", reply: "[0 status, mode]"}
      - {opcode: "0x909", name: "set_barking_sensitivity", request: "[level (1 low, 2 medium, 3 high), 0, 0, 0]"}
      - {opcode: "0x90b", name: "get_barking_sensitivity", reply: "[level, status]: the level comes FIRST here, unlike every other V2 reply"}
      - {opcode: "0x90d", name: "set_speaker_volume", request: "[volume, 0, 0, 0]"}
      - {opcode: "0x90f", name: "get_speaker_volume", request: "[1, 0, 0, 0]", reply: "[0 status, volume, muted]"}
      - {opcode: "0x911", name: "toss_treat", request: "4 x 0x00", notes: "Physical actuator; see the V3 entry."}
      - {opcode: "0x915", name: "get_firmware_versions", request: "[1, 0, 0, 0]", reply: "status, then four 8-byte ASCII fields from offset 2: new firmware, current firmware, new library, library"}
      - {opcode: "0x919", name: "update_firmware", advanced: true, advanced_reason: "Starts a firmware update. Not documented further."}
      - {opcode: "0x91b", name: "set_power", request: "[on (1/0), 0, 0, 0]"}
      - {opcode: "0x91d", name: "get_power", reply: "[0 status, on]"}
      - {opcode: "0x91f", name: "set_time_zone"}
      - {opcode: "0x921", name: "get_time_zone"}
      - {opcode: "0x923", name: "set_treat_sound", request: "NUL-terminated sound URL"}
      - {opcode: "0x925", name: "get_treat_sound", reply: "[0 status, 0 default / 1 custom / 2 mute]"}
      - {opcode: "0x927", name: "reboot", advanced: true, advanced_reason: "Drops every session and takes the camera offline for its boot time."}
      - {opcode: "0x929", name: "get_device_info", request: "[force (1/0), 0, 0, 0]", reply: "JSON"}
      - {opcode: "0x92b", name: "set_device_token", request: "the account's DeviceToken, NUL-terminated; sent once after the AV channel opens"}
      - {opcode: "0x931", name: "get_av_info", reply: "[0 status, first I-frame sent, fps at 1080p, fps at 720p, fps at 360p, resend buffer %, send fps, lost count (uint16 BE at 7-8), -, send kbps (uint16 BE at 10-11), max CPU %, max free memory]"}
      - {opcode: "0x933", name: "video_start_answer", direction: "camera to client", payload: "status; the camera's answer to 0x1ff on both opcode sets"}
      - {opcode: "0x935", name: "notify_service_state", direction: "camera to client"}
      - {opcode: "0x937", name: "get_service_state"}
      - {opcode: "0x93f", name: "set_schedule", request: "JSON"}
      - {opcode: "0x941", name: "get_schedule", request: "[1, 0, 0, 0]", reply: "JSON"}
      - {opcode: "0x943", name: "notify_clear_buffer", direction: "camera to client", payload: "the camera asks the client to flush its buffers"}
      - {opcode: "0x945", name: "play_treat_sound", request: "4 x 0x00"}
      - {opcode: "0x947", name: "get_auto_calm"}

  av_streams:
    verification: "reported"
    video:
      start: "Standard TUTK opcode 0x1ff with a 4-byte little-endian int32 quality number; stop with 0x2ff. The camera answers 0x933."
      quality_numbers_v3: {"0": "1080p", "1": "720p", "2": "360p", "3": "1440p"}
      quality_numbers_v2: {"0": "1440p", "1": "1080p", "2": "720p", "3": "360p"}
      observed_fb0030: >-
        Quality 0 gave H.264 1920x1080 at 25 fps after one 640x360 preview
        frame; qualities 1 to 3 all gave 640x360 (ha-furbo,
        HARDWARE_VERIFICATION.md). The FB0030 serves no 720p.
      frames: "Read with the SDK's frame call; the frame header carries codec id, key-frame flag, frame rate, a millisecond timestamp and the frame number."
    microphone:
      start: "Standard TUTK opcode 0x300 with int32 0; stop 0x301. Frames arrive on a separate queue from video."
      format: >-
        Not established. The FB0030 labels its microphone frames with codec
        id 135, whose meaning lives in the TUTK library; ha-furbo tests each
        stream with a decoder instead of trusting the id.
    talkback:
      format: "G.711 u-law, 16 kHz, mono; 320-byte frames (20 ms), paced in real time."
      open: >-
        Get a free IOTC channel on the session, send standard opcode 0x350
        (speaker start) with [channel as int32 LE, 4 x 0x00], then start an AV
        SERVER on that channel with security mode 3 (DTLS,
        PSK-AES128-CBC-SHA256) and authentication callbacks that accept
        everything, as the app does; set a resend buffer (ha-furbo uses 512
        KiB, since a zero buffer rejects every frame). Close with 0x351 and
        the same payload, then stop the server and turn the channel off.
      frame_header: "16 bytes: codec id (int16 LE, 137 = G.711 u-law), flags (uint8: sample-rate index in bits 2-5 over 8000/11025/12000/16000/22050/24000/32000/44100/48000 Hz, bit 1 set for 16-bit, bit 0 set for stereo; 14 = 16 kHz, 16-bit, mono), camera index (uint8), online count (uint8), 7 reserved bytes, timestamp in ms (uint32 LE)."
      notes: >-
        Verified by ha-furbo at the P2P layer on the FB0030: the camera
        accepts frames. The talkback AV server uses security mode 3 while the
        client channel uses mode 1.

  cloud_credential:
    verification: "reported"
    steps:
      - "POST /v5/account/read/login with Email, EncPassword, MobileId and, if the client has one, the MfaAuthCode from an earlier verification."
      - "If the answer is result code 12101, POST /v4/account/mfa/login/send-code with the MfaAuthCodeCandidate, ask the owner for the emailed code, POST /v4/account/mfa/verify with it, then POST /v2/account/login with the resulting MfaAuthCode. Keep MfaAuthCode and MobileId for next time."
      - "POST /v2/account/{AccountId}/device and pick the camera by Id; note P2PUuid, ProductId and, for legacy cameras, P2PAccessToken."
      - "POST /v5/device/p2p_connection/get with the DeviceId. All three of AuthKey, P2PAccountId, P2PAccountKey present: modern path. All three null: legacy path. Anything in between: refuse rather than guess, as ha-furbo does."
    secrets: >-
      The UID, AuthKey, P2P account id and key, AccountId, CognitoToken,
      MfaAuthCode and DeviceToken are all per-owner secrets. An owner obtains
      their own through the login above; none belongs in a spec, a log or a
      bug report.
    offline_recovery:
      verification: "hypothesis"
      account_export: >
        The UID, AuthKey, P2PAccountId and P2PAccountKey (or the legacy
        account/token pair) can be preserved by the owner. Public hardware
        research also documents on-camera p2p_auth.json state; deleting that
        state causes new credentials on the next cloud setup. These are
        owner-recovery sources, not credential-free adoption or a universal
        password.
      persistence: >
        Expect credentials to survive reboot until reset, re-registration or
        regeneration. A same-LAN session with both the vendor cloud and TUTK
        relays unavailable still requires an owner-authorized capture. Furbo
        2's RTSP Digest credential is a separate secret and cannot be derived
        from these TUTK fields.

  ble_onboarding_v4:
    verification: "reported"
    source: "Static analysis of the vendor app's current-generation BLE setup controller (7.83.1)."
    value_encoding: >-
      Every value is ASCII text. Writes are with response (Android write
      type default), UTF-8 bytes of the string, with no terminator except
      the time zone, which ends in one 0x00. A write with no value sends a
      single 0x00. Reads and indications decode as UTF-8.
    service_uuid: >-
      Not established. The app matches characteristics by UUID across all
      services. It also declares four vendor UUIDs it never references
      (7d7316ab-796b-46de-a6a3-b49d9779789e,
      4ef3767f-1ff0-423a-98ca-aba79f75e0af,
      923b0d97-2131-4d77-9ce9-56ff8998b4e9,
      5650bad3-8798-437f-966e-a5c92c603fe3), which are probably the service
      UUIDs; a hypothesis.
    characteristics:
      - {uuid: "02435612-dc14-423f-bd4f-a6a12e567e90", role: "setup status", use: "read + indicate", value: "ASCII signed integer; see the setup method's payload_formats.Status"}
      - {uuid: "f60a6339-0647-42a4-b709-29a3e620c0af", role: "camera's HTTP return code during registration", use: "read + indicate", value: "ASCII; vocabulary not recorded"}
      - {uuid: "41f21774-cc72-44f2-a002-86bdbedc253d", role: "camera's service error code", use: "read + indicate", value: "ASCII; vocabulary not recorded"}
      - {uuid: "303a469f-7ca4-4cd5-bd79-1203774c719c", role: "Wi-Fi mode", use: "read after status -2", value: "ASCII; vocabulary not recorded"}
      - {uuid: "8518174e-c27c-4b20-8b9c-96a855773795", role: "Wi-Fi error code", use: "read after status -2", value: "ASCII; vocabulary not recorded"}
      - {uuid: "2c259f9c-4a57-4c74-830e-2013e4466c2c", role: "reset setup", use: "write + indicate", value: "write '1' to start a fresh setup, '2' to change Wi-Fi on a bound camera; the camera indicates '0' when done, after which the app refreshes its GATT cache and rediscovers services"}
      - {uuid: "d6f178c9-8137-4d18-8ced-0b62d7e3e7f2", role: "Wi-Fi change ownership proof", use: "write", value: "base64 of the proof, encrypted (see field_encryption)"}
      - {uuid: "3c2c5dea-35aa-4540-94be-0bd5d9e72793", role: "Wi-Fi scan ready", use: "read + indicate + write", value: "reads '1' when a scan result is ready; write '0' to start a new scan"}
      - {uuid: "e92543cb-08c6-4b2b-a395-1824cdbd4417", role: "AP list chunk 1", use: "read", value: "text, part of a JSON array"}
      - {uuid: "a43251f9-1d8c-41d0-9804-879b992d4748", role: "AP list chunk 2", use: "read", value: "text"}
      - {uuid: "325d3a42-5102-4c55-aad6-20c7b1157997", role: "AP list chunk 3", use: "read", value: "text"}
      - {uuid: "76e415d0-9e94-4979-aaa2-54d8489f7456", role: "AP list chunk 4", use: "read", value: "text"}
      - {uuid: "233d5fb2-f565-4fef-832a-983d6c362f36", role: "Wi-Fi SSID", use: "write", value: "lowercase hex of the SSID's UTF-8 bytes"}
      - {uuid: "ac075b73-2424-4e7a-9fe2-62cbf19e7e89", role: "Wi-Fi passphrase, plain", use: "write", value: "lowercase hex of the passphrase's UTF-8 bytes; used only when the encrypted characteristic is absent"}
      - {uuid: "f72deed1-3198-4df6-b0d7-e472cea7885f", role: "Wi-Fi passphrase, encrypted", use: "write", value: "base64 of the lowercase-hex passphrase string, encrypted (see field_encryption)"}
      - {uuid: "2474cee2-379d-4a0c-b630-37dd53965ca2", role: "Wi-Fi details ready", use: "write", value: "'1' after the SSID and passphrase; the app has a '0' form it does not use in the normal flow"}
      - {uuid: "3c1a8fd9-ac74-4062-80cc-b2947cb7a039", role: "account, plain", use: "write", value: "the value the app sends as 'user' (not traced; an account identifier); used only when the encrypted form is absent"}
      - {uuid: "cb04b5ee-4c79-4316-a50e-8cc4a2067840", role: "account, encrypted", use: "write", value: "base64, encrypted (see field_encryption)"}
      - {uuid: "81f6f485-eae6-41cc-8a2f-e11a5844a114", role: "cloud endpoint for registration", use: "write", value: "text from the cloud via the app"}
      - {uuid: "953b64d3-99bd-4434-b050-1c39512f9f95", role: "registration token, plain", use: "write", value: "a short-lived token the app obtains from the cloud; used only when the encrypted form is absent"}
      - {uuid: "e42de30f-a772-43fe-b216-ca5b78db4d82", role: "registration token, encrypted", use: "write", value: "base64, encrypted (see field_encryption)"}
      - {uuid: "fb6dfec1-257c-4d58-9eed-6f79599919f0", role: "registration data ready", use: "write", value: "'1' after the registration fields; '0' when restarting setup"}
      - {uuid: "00002aaf-0000-1000-8000-00805f9b34fb", role: "longitude of the phone (SIG Longitude UUID, used for text)", use: "write", value: "ASCII decimal degrees with seven fractional digits, formatted in the phone's locale (a comma decimal separator is possible and untested)"}
      - {uuid: "00002aae-0000-1000-8000-00805f9b34fb", role: "latitude of the phone (SIG Latitude UUID, used for text)", use: "write", value: "as longitude"}
      - {uuid: "f34375ad-c23c-4bb5-bbfe-13d624741757", role: "country code", use: "write", value: "two-letter region of the phone; for the 360 setup types the app substitutes 'jp' when the region is not on its supported list"}
      - {uuid: "1a19aaae-094a-47aa-aaa3-1d66bd08ab1a", role: "speaker volume", use: "write", value: "the app always writes '60' (percent)"}
      - {uuid: "00002a0e-0000-1000-8000-00805f9b34fb", role: "time zone (SIG Time Zone UUID, used for text)", use: "write", value: "IANA zone name of the phone, e.g. 'Europe/London', plus one 0x00"}
      - {uuid: "3c2fb8ce-49b9-4e1c-848f-8a26740e7c8c", role: "settings ready", use: "write", value: "'1' after the settings fields"}
      - {uuid: "00002a05-0000-1000-8000-00805f9b34fb", role: "Service Changed", use: "indicate", value: "standard; the app only logs it"}
    field_encryption: >-
      AES-256-CBC with PKCS#7 padding. The key is 32 ASCII characters and the
      IV 16 ASCII characters, both constants in the app and identical for
      every install; they are not reproduced here. The ciphertext is sent as
      base64 without line breaks. For the passphrase the plaintext is its
      lowercase-hex string, not the passphrase itself; for the account, the
      token and the ownership proof it is the raw text. The app writes the
      encrypted form whenever the camera exposes the encrypted
      characteristic.
    notification_setup: "The app enables indications (CCCD 0x0002, bytes 02 00), not notifications, on every characteristic it subscribes to."
    excluded_uuids: >-
      A naive UUID search of the app also finds identifiers of its analytics
      SDK (prefixes a029f440-, 46bad1ed-, 383f2407-, 8d9792b7-). They are not
      device UUIDs.

  ble_onboarding_legacy:
    verification: "reported"
    source: "Static analysis of the vendor app's two older BLE setup controllers."
    envelope: >-
      Request: a JSON object with "c" (a four-digit command code as a string)
      and "d" (an object); the first revision also sends "s" with a fixed
      ten-character placeholder. Reply: a JSON object with "r" (integer
      result, 0 success), "c" (the command it answers) and "d" (data), plus
      optional "e", "v", "f", "i", "dt", "md", "hc" (integer; by analogy with
      the current set an HTTP return code), "se" (integer; service error)
      and "we" (integer; Wi-Fi error). The other keys' roles are not
      recorded.
    commands:
      "0001": "Get the AP list. d: {device_id}. The reply's d carries the list (same item keys as the current set's ApList)."
      "0002": "Set Wi-Fi and registration. d: {device_id, ssid, password, accesstoken, user, endpoint}. The first revision passes ssid and password through a text-escaping helper first."
      "0022": "Later revision only. d: {device_id}. Role not traced (polled during setup)."
      "0023": "Later revision only, no data. Role not traced."
    framing: >-
      The app writes the request (write with response), and on write
      success, if the value was not exactly three bytes, writes 'ENM'
      without response as an end marker. Replies are notifications appended
      together until one equals 'ENM'. Both revisions route the JSON
      through the app's native library, which returns base64 text on the
      way out and is applied in reverse on the way in; the transform was
      not analysed, so no byte-exact example exists.
    results_first_revision:
      "-1": "wrong passphrase"
      "-2": "no internet"
      "-3": "registration error"
      "-4": "connecting error"
      "-5": "command error"
      "-6": "access point error"
      "-7": "cloud data error"
    results_later_revision:
      "-1": "wrong passphrase"
      "-2": "could not join the access point"
      "-3": "no IP address"
      "-4": "DNS unavailable"
      "-5": "could not get a streaming host"
      "-6": "base64 encoding failed"
      "-7": "host name lookup failed"
      "-8": "cloud device registration failed"
      "-9": "could not get the device id"
      "-10": "memory allocation failed"
      "-11": "unknown control"

evidence:
  app_static_analysis: >-
    The vendor Android app 7.83.1 was decompiled and read for facts only.
    Its current-generation BLE setup controller gave every characteristic
    UUID above, the role of each (from its use sites and log labels), the
    ASCII value conventions, the status-code table, the per-status timeouts,
    the chunked AP list and its JSON keys, and the fixed-key AES-256-CBC
    wrapping of four fields. Its two older controllers gave the
    77f9a069-2ff9-4ff9-93b7-4db9689f4b53 service, the JSON command envelope,
    the 'ENM' end marker and two result tables. Its BLE manager gave the
    advertised-name rules and the 12-character device id extraction. Its
    P2P command layer (one implementation per opcode set) confirmed the V3
    opcode numbers ha-furbo publishes, the toss and pan request payloads and
    the app's 60/50 degree pan step. An earlier research pass called the
    camera cloud-only; the app in fact carries the ThroughTek TUTK SDK, and
    the local P2P path is ha-furbo's finding. Nothing was replayed.
  open_source_review: >-
    willbeeching/ha-furbo at b2a65be1 (MIT): furbo_p2p.py (session order,
    both opcode tables, reply decoding, talkback header, legacy path),
    furbo_cloud.py (credential flow, result codes), furbo_bridge.py (value
    ranges its API enforces), DOCS.md (single-session rule, LAN mode,
    relay, token lifetime) and HARDWARE_VERIFICATION.md (what was run on the
    FB0030, including the negative cloud treat-toss finding). ha-furbo
    derives from its own decompile of the app, so its agreement with ours on
    opcode numbers is two readings of one source, not independent
    confirmation. AlexxIT/go2rtc pkg/tutk at c245815e (MIT) for the TUTK
    connection stages and the 32761 LAN port.
  documentation_review: >-
    Furbo help-centre articles (read 2026-09-28 through the help centre's
    public article API): hard reset for the original Furbo, the 360 Dog and
    Cat cameras and the Minis; setup for the Furbo and the 360; changing
    Wi-Fi; the light indicator; 'can't find my Wi-Fi network' (the sticker
    model table and the 2.4 GHz rule); WPA3. FCC grant records and label
    exhibits for 2AIBVTFFBV3 (Furbo2.5T, 5 V 2 A) and 2AIBV-MINICAM
    (antenna shared by 2.4 GHz Wi-Fi and Bluetooth). Somerset Recon's three
    posts for the security advisory and the RTSP report.
  open_questions: >-
    See remaining_unknowns. First things to settle with a camera in hand:
    whether a session opened with a stored credential works with the WAN
    cut; whether the camera finishes BLE setup without registering; which
    service holds the current-generation characteristics; what the
    microphone codec 135 is. For the schema: a TUTK/IOCTRL transport (a
    command addressed by a 32-bit opcode on a session's AV channel, with a
    payload template and a reply keyed by opcode plus one) would let the V3
    table become executable `commands` and `entities`; not yet proposed
    in spec-evolution.md.
  artifacts:
    - type: "static_analysis"
      artifact: "Furbo Android app (com.tomofun.furbo) 7.83.1"
      obtained_via: "third-party APK mirror, 2026-09-17"
      description: "BLE onboarding surface and a cross-check of the P2P opcode numbers. No code, key or string beyond short paraphrase is reproduced."
    - type: "public_implementation"
      artifact: "willbeeching/ha-furbo @ b2a65be1 (MIT)"
