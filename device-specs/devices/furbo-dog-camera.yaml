      - {opcode: "0x1002b", name: "get_auto_zoom", request: "4 x 0x00", reply: "[0] status; [1] cruise; [2] live"}
      - {opcode: "0x1002d", name: "set_auto_zoom", request: "[cruise, live, 0, 0], each 1/0", reply: "status"}
      - {opcode: "0x10030", name: "get_auto_calm", request: "4 x 0x00", reply: "status then JSON"}
      - {opcode: "0x10032", name: "set_auto_calm", request: "not traced", reply: "status"}
      - {opcode: "0x10034", name: "play_auto_calm_audio", request: "not traced", reply: "status"}
      - {opcode: "0x10036", name: "get_voice_control", request: "4 x 0x00", reply: "[0] status; [1] 1 on, 0 off"}
      - {opcode: "0x10038", name: "set_voice_control", request: "[on (1/0), 0, 0, 0]", reply: "status"}
      - {opcode: "0x1003c", name: "get_treat_troubleshoot", request: "4 x 0x00", reply: "not recorded"}
      - {opcode: "0x1003e", name: "set_treat_troubleshoot", request: "not traced", reply: "status"}
      - {opcode: "0x10040", name: "get_network_info", request: "4 x 0x00", reply: "not recorded"}
      - {opcode: "0x20001", name: "upgrade_firmware", advanced: true, advanced_reason: "Starts a firmware update; an interrupted update may leave the camera unusable. Not documented further.", request: "-", reply: "-"}
      - {opcode: "0x20003", name: "reboot", advanced: true, advanced_reason: "Drops every session and takes the camera offline for its boot time.", request: "4 x 0x00", reply: "status"}
      - {opcode: "0x20005", name: "upload_logs", advanced: true, advanced_reason: "Sends the camera's logs to the vendor.", request: "4 x 0x00", reply: "status"}
      - {opcode: "0x20007", name: "toss_treat", request: "4 x 0x00", reply: "status; a treat-tossing notification (0x30005) follows", notes: "Physical actuator with a consumable. The app sends one per press, in one path preceded by play_treat_sound. Verified by ha-furbo: one treat dispensed."}
      - {opcode: "0x20009", name: "pan", request: "6 bytes: [direction (1 left, 2 right), degrees (uint8), 0, 0, 0, 0]", reply: "status; a pan notification (0x30007) follows", notes: "Relative. The app turns 60 degrees per press (50 on the Mini 3) and in one case sends 0 degrees, probably a stop. ha-furbo accepts 1-180. The sixth byte is a third argument the app passes as 0. Verified by ha-furbo: moves and returns."}
