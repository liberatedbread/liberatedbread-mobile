device:
  name: "Shining Mask"
  manufacturer: "Shenzhen Shining Bright Technology"
  manufacturer_status: "unsupported"
  testing:
    status: untested
  protocol: "ble"
  category: "display"
  notes: >
    LED face mask with 2074 RGB LEDs, 16-pixel-tall display.
    All commands to the Command characteristic are AES-128 ECB encrypted with the
    fixed key 32672f7974ad43451d9c6c894a0e8764 (published verbatim in four
    independent sources: GoneUp/mask-go, BishopFox/shining-mask,
    BrickCraftDream/Shining-Mask-stuff, Staars' gist). No pairing/authentication.
    Image data to the upload characteristic is sent unencrypted.
    FCC ID: 2AOLN-16.
    Color order for the FC (foreground color) command is R,G,B — confirmed by
    the official app (Agreement.getTextColor emits the channels in argument
    order and TextEditActivity passes Color.red/green/blue into it), matching
    every public implementation (mask-go, tayred06, BrickCraftDream). The
    earlier R,B,G reading rested on a misread of private APK analysis and is
    dead; no hardware A/B test is needed for the ordering question.
    CONFIDENCE: command structure, AES key and FC color order HIGH (official
    app static analysis agrees with the open-source shining-mask
    implementations, package cn.com.heaton.shiningmask).
    Security: Bishop Fox ("Invasion of the Face Changers", 2025-10-30) showed
    anyone within ~10 m can take over a mask; no fix is expected (no
    firmware-update channel). Caveat: the v1.2.6 app bundles a dormant
    Panchip OTA stack (com.cdbwsoft.library.panchip, with its own OTA
    service/characteristic UUIDs in BleManager) — in this build it is only
    used to negotiate MTU on connect and no OTA flow is wired to any UI, so
    whether retail firmware accepts OTA updates is unknown (app-derived,
    unverified).
    Hardware RE (adrihd/ShiningAppMask-ReverseEngineering, 2026-01): Artery
    AT32F415 MCU, Jieli BP27387 BLE SoC, 16 MB PY25Q128HA SPI flash. Decrypted
    OTA firmware images (TR1906R04-*) and a full flash dump are archived in the
    research repo (/home/claude/research/shining-mask/firmware/).

    Enrich-branch evidence: the official Shining Mask Android package
    cn.com.heaton.shiningmask was inspected from APKPure XAPK v1.2.6/versionCode
    126, SHA256 29cc2c088634b28b06b67cab7b17f15bb6551bdb3d422b4e188274c825fbcb94.
    Static analysis and public RE agree on service 0000fff0-0000-1000-8000-00805f9b34fb
    holding the d44bc439 characteristics: command
    d44bc439-abfd-45a2-b575-925416129600, notification
    characteristic d44bc439-abfd-45a2-b575-925416129601, image/text upload
    characteristic d44bc439-abfd-45a2-b575-92541612960a, audio visualizer
    characteristic d44bc439-abfd-45a2-b575-92541612960b, and CCCD
    00002902-0000-1000-8000-00805f9b34fb. Public sources include GoneUp/mask-go,
    BrickCraftDream/Shining-Mask-stuff, BishopFox/shining-mask, the Bishop Fox
    Bluetooth LED mask write-up, and Staars' Shining Mask gist. Text/bitmap
    upload uses an encrypted DATS start command, DATSOK/REOK
    acknowledgements, 98-byte chunks when MTU is set and an 18-byte fallback
    when MTU negotiation has not completed (both chunk sizes confirmed in the
    app's TextAgreement and DiyAgreement), and DATCP/DATCPOK completion — all
    app-confirmed. The local XAPK was re-hashed and matches the SHA-256 above,
    settling the mirror re-signing question.
  identification:
    service_uuids:
      - "0000fff0-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "0000fff0-0000-1000-8000-00805f9b34fb"
      - type: "ble_scan"
        ble:
          manufacturer_data:
            company_id: 21076
            match: "prefix"
            pattern: "5452004e"
            description: >
              Manufacturer-specific advertising data starts with
              0x54 0x52 0x00 0x4E. This is the official app's only scan
              filter (BleConfig.matchProduct matches these four bytes at the
              start of the manufacturer-data AD structure; the app never
              matches on local name). App-derived, not hardware-verified.
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "MASK"
          notes: >
            mask-go discovers masks by local-name prefix "MASK" (names look
            like "MASK-XXXXXX", last 6 MAC-derived) — a secondary discovery
            signal used by open-source clients; the official app does not
            use it (it filters on the manufacturer-data prefix above).
    identity:
      stable_keys: ["address"]
      display: "service_uuid"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      No provisioning. Commands are AES-encrypted with a fixed key, so any
      client that implements the framing can connect straight away.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          No provisioning step: the device advertises as soon as it is powered
          on and accepts a connection from any central. There is no account, no
          network credential exchange and no pairing PIN, so a replacement
          client only has to scan, connect and write.
        ble:
          pairing_required: false
        steps:
          - action: "Power the device and scan for its advertisement."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect and run the documented initialization sequence, if the spec defines one."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        No credential state to clear. Power-cycling drops the current
        connection, which is the actual remedy for the common failure mode:
        the device already being connected to another central.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "Device advertises again and accepts a new connection."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds this device to a network or an owner, so switching
        controllers is just connecting from the new one. If the old client is
        an Android or iOS phone, remove the device from the OS Bluetooth list
        as well — a cached bond can keep the phone reconnecting automatically
        and holding the single available link.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        Anything within radio range can connect and issue commands. Physical
        proximity is the only access control — Bishop Fox (2025-10-30)
        demonstrated unauthenticated takeover within ~10 m, and no fix is
        expected (the device has no firmware-update channel).

helpful_urls:
  - title: "Bishop Fox: Invasion of the Face Changers"
    url: "https://bishopfox.com/blog/invasion-of-the-face-changers-halloween-hijinks-with-bluetooth-led-masks"
    description: "Bluetooth LED mask reverse-engineering write-up cited by the device page."
  - title: "GoneUp/mask-go"
    url: "https://github.com/GoneUp/mask-go"
    description: "Open-source implementation cited by the device page and notes."

# Custom consumer-side handler for the shining-mask AES-128-ECB command framing
# and color encoding. Declarative.
protocol_handler: "shiningmask_ecb"

services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "Shining Mask Service"
    notes: >
      Advertised primary service holding the d44bc439 command/transfer
      characteristics — confirmed by the official app's BleManager UUID
      constants (UUID_SERVICE_TEXT = 0000fff0-... with characteristics
      ...9600/...9601/...960a/...960b and CCCD 00002902), so the earlier
      QPP-style standalone d44bc439-...-9600 service theory is dead; both
      GATT-modeling implementations (GoneUp/mask-go, BishopFox/shining-mask)
      also place them inside 0000fff0. On connect the app negotiates MTU
      103 (requestMtu(100 + 3) via the bundled Panchip OTA manager's MTU
      helper), which is what selects the 98-byte upload chunk size; before
      MTU negotiation completes it falls back to 18-byte chunks.
    characteristics:
      - uuid: "d44bc439-abfd-45a2-b575-925416129600"
        name: "Command"
        properties: ["write"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "static"
          static_key: "32672f7974ad43451d9c6c894a0e8764"
        notes: >
          onEncrypt() AES-128-ECB with a fixed key is applied before every write to
          this characteristic. The key is published verbatim in four independent
          sources (GoneUp/mask-go aes.go, BishopFox code.py, BrickCraftDream
          ble-protocol.md, Staars gist) and is also embedded raw in the official
          app's native crypto library (libAES.so, arm64-v8a split of XAPK
          v1.2.6, key bytes at file offset 0x3008; AES runs in JNI via
          csh.tiro.cc.aes cipher/invCipher). Confidence: HIGH.
          Command frames are 16 bytes; unused tail bytes are random padding
          (Agreement.getRandom()), not zeros — a receiver must not require
          zero padding.
          Additional app commands beyond the ones templated below
          (app-derived, not hardware-verified): BC = set text background
          color (templated below); CHEC = query DIY image count; FACE =
          gesture face-change settings; PLAY = play a list of DIY images;
          DELE = delete DIY images; DIY = show a DIY image; TIME = DIY image
          timestamp sync; LOOA = animation loop toggle; SOUT = exit
          rhythm/music mode; SMVEW = enter/exit DIY mode with save
          sub-commands (the wire bytes really spell "SMVEW" — 53 4D 56 45 57
          — apparently a vendor typo, not "SAVEW"); MANCP = multi-image
          upload completion handshake (DATCPOK → MANCP → MANCPOK).
        commands:
          set_brightness:
            description: "Set brightness (AES encrypted). Plaintext: [0x06, 'LIGHT', brightness]"
            template: [0x06, 0x4C, 0x49, 0x47, 0x48, 0x54, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255
          set_mode:
            description: >
              Set display mode. 0=off, 1=steady, 2=blink, 3=scroll R-to-L,
              4=scroll L-to-R, 5=steady custom. The 1/2/3/4 mapping is
              app-confirmed (TextEditActivity maps its steady/blink/scroll
              UI options onto MODE values 1, 2, 3 and 4).
            template: [0x05, 0x4D, 0x4F, 0x44, 0x45, "{mode}"]
            parameters:
              mode:
                type: "uint8"
                min: 0
                max: 5
          set_speed:
            description: "Set animation speed"
            template: [0x06, 0x53, 0x50, 0x45, 0x45, 0x44, "{speed}"]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
          show_builtin_image:
            description: "Display built-in static image (0x00-0x69, 106 images). Layout [0x05, \"IMAG\", id] app-confirmed (Agreement.getImageCommand)."
            template: [0x05, 0x49, 0x4D, 0x41, 0x47, "{image_id}"]
            parameters:
              image_id:
                type: "uint8"
                min: 0
                max: 105
          play_builtin_animation:
            description: "Play built-in animation (0x00-0x45, 70 animations). Layout [0x05, \"ANIM\", id] app-confirmed (Agreement.getAnimCommand)."
            template: [0x05, 0x41, 0x4E, 0x49, 0x4D, "{anim_id}"]
            parameters:
              anim_id:
                type: "uint8"
                min: 0
                max: 69
          set_foreground_color:
            description: >
              Set text foreground color. Channels are emitted in R,G,B order —
              as the template below states — confirmed by the official app
              (Agreement.getTextColor writes the channels in argument order
              and TextEditActivity passes Color.red/green/blue), matching
              every public implementation (mask-go SetTextFrontColor,
              tayred06 mask_controller.py, BrickCraftDream ble-protocol.md).
              Byte 3 is an enable flag (1 = apply color, 0 = disable).
            template: [0x06, 0x46, 0x43, 0x01, "{red}", "{green}", "{blue}"]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          set_background_color:
            description: >
              Set text background color. The command word is "BC" (0x42 0x43),
              not "BG" — confirmed in the official app
              (Agreement.getTextBgColor). Same layout as FC: length 6,
              enable flag at byte 3, channels in R,G,B order. Note the app
              halves each background channel value (× 0.5) before sending —
              app-derived behavior, not hardware-verified.
            template: [0x06, 0x42, 0x43, 0x01, "{red}", "{green}", "{blue}"]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255

      - uuid: "d44bc439-abfd-45a2-b575-925416129601"
        name: "Notification"
        properties: ["notify"]
        notes: >
          Notification payloads are AES-128-ECB encrypted with the same fixed
          key as the Command characteristic — the official app runs every
          received value through aes.invCipher before parsing
          (Agreement.getDecodeData). Decrypted payloads are the ASCII
          handshake responses (DATSOK, REOK, DATCPOK, ERROR=, FACEOK,
          DELEOK, PLAYOK, TIMEOK/TIMEERR, CHEC count, MANCPOK).

      - uuid: "d44bc439-abfd-45a2-b575-92541612960a"
        name: "Image Upload"
        properties: ["write"]
        notes: >
          Bulk text/bitmap upload channel — written UNENCRYPTED (the app's
          writeCharacteristicBy2 path applies no AES; only the handshake
          commands on the Command characteristic are encrypted).
          App-confirmed upload state machine: client writes encrypted DATS
          [0x09, "DATS", total_len_hi, total_len_lo, ...] on the Command
          characteristic; device replies DATSOK; client streams payload
          chunks here, each framed [chunk_len, chunk_index, payload...]
          with 98-byte payload per chunk once MTU 103 is negotiated (18-byte
          payload fallback before MTU negotiation); device replies REOK per
          chunk; client finishes with encrypted DATCP, device replies
          DATCPOK (ERROR= on failure). Chunk sizes confirmed in the app's
          TextAgreement and DiyAgreement.

      - uuid: "d44bc439-abfd-45a2-b575-92541612960b"
        name: "Audio Visualizer"
        properties: ["write"]

entities:
  - platform: "light"
    name: "Mask Display"
    features: ["brightness", "color"]
    commands:
      set_brightness: "set_brightness"
