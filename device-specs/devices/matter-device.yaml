# Matter Device (DNS-SD discovery, identify-only) — Device Spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources: the Connectivity Standards Alliance Matter specification's
# service-advertising section (the _matter._tcp / _matterc._udp DNS-SD service
# types and their TXT keys) — a published, vendor-neutral standard — plus live
# hardware on the segment. Vendor-neutral signature; no vendor assets.

device:
  name: "Matter Device (Matter-over-Wi-Fi / Thread node)"
  manufacturer: "Various (Connectivity Standards Alliance / Matter)"
  manufacturer_status: "active"
  testing:
    status: verified
    detail: minimally-verified
    notes: >
      Matter discovery verified live 2026-08-16: a real commissioned node
      advertised the operational DNS-SD service _matter._tcp over mDNS on the
      segment, decoded by the standard service types below. Identify-only: this
      project does not join the Matter fabric (commissioning requires the
      device's setup passcode and puts the app on the device's fabric — out of
      scope), so it recognises the device, shows a pictogram, and leaves control
      to the user's existing Matter controller (Home/SmartThings/Alexa/Google).
  protocol: "wifi"
  category: "other"
  pictogram: "smart-device"
  integration: "identify_only"
  notes: >
    Matter is the cross-ecosystem smart-home standard (from the Connectivity
    Standards Alliance) that runs over Wi-Fi/Ethernet and Thread. A Matter
    device advertises itself over mDNS/DNS-SD with two standard, vendor-neutral
    service types:
      _matter._tcp   — an OPERATIONAL node: already commissioned onto at least
                       one fabric. The instance name is
                       <compressed-fabric-id>-<node-id> in hex (not
                       human-friendly). TXT keys are timing hints: SII/SAI/SAT
                       (idle/active/sleep intervals), T (TCP support).
      _matterc._udp  — a COMMISSIONABLE node: advertising that it is ready to be
                       added. Richer TXT: D (discriminator), VP ("vid+pid"),
                       CM (commissioning mode), DT (device type), DN (a friendly
                       device name), PH/PI (pairing hints). Also carried as the
                       _L<longdiscriminator> / _S<shortdiscriminator> and
                       _CM subtypes.
    A Thread-only Matter device is reached through a Thread Border Router and
    is not directly on the IP segment; the ones this spec sees are the
    Matter-over-Wi-Fi/Ethernet nodes (and border routers, which are on Wi-Fi).

    This project does NOT commission or drive Matter devices: commissioning
    needs the device's setup passcode (the 11-digit code / QR) and would enroll
    this app as a fabric admin, and ongoing control speaks the Matter operational
    protocol — both out of scope. We DISCOVER the node, draw a generic
    smart-device pictogram (Matter spans plugs, bulbs, sensors, locks and more,
    and the operational advertisement does not name the type), and leave control
    to whatever Matter controller the user already runs. There is no local web
    admin UI, so no admin_url is offered.

    Display name: a commissionable node's TXT DN is human-friendly; an
    operational node has only its hex instance name, so the mDNS instance name
    is the display fallback. Stable key: the operational instance name (fabric+
    node id) or the hostname.
  identification:
    mdns_service_type: "_matter._tcp.local."
    default_port: 5540
    identity_keys:
      primary: "instance"
      secondary: "hostname"
      display: "name"

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_matter._tcp.local."
          port: 5540
          txt_record_keys: ["SII", "SAI", "SAT", "T"]
          identity_mapping:
            stable_keys:
              - source: "name"
                key: "instance"
              - source: "hostname"
                key: "hostname"
            display:
              source: "name"
      - type: "mdns"
        mdns:
          service_type: "_matterc._udp.local."
          port: 5540
          txt_record_keys: ["D", "VP", "CM", "DT", "DN", "PH", "PI"]
          identity_mapping:
            stable_keys:
              - source: "txt:DN"
                key: "instance"
              - source: "hostname"
                key: "hostname"
            display:
              source: "txt:DN"
    identity:
      stable_keys: ["instance", "hostname"]
      display: "name"
    static_ip_required: false

  setup:
    required: false
    confidence: high
    notes: >
      Nothing for this app to provision: a Matter node advertises itself over
      mDNS. We browse the standard service types, draw the pictogram and leave
      commissioning/control to the user's Matter controller. Confidence high:
      the service types and TXT keys are the CSA standard's, and an operational
      node was seen live.
    methods:
      - type: "none"
        verified: false
        description: >
          No provisioning is performed here. The device is commissioned onto a
          Matter fabric with its setup passcode via a Matter controller (Apple
          Home, Google Home, SmartThings, Alexa, Home Assistant), after which it
          is discovered passively by its _matter._tcp advertisement.
    factory_reset:
      applicable: true
      confidence: medium
      effect: >
        The Matter specification is unusually precise about this, which is the
        advantage of a device that implements a published standard: a factory
        reset SHALL remove from the node all security- and privacy-related data
        and key material created during or after commissioning, except what is
        explicitly required to persist across resets. Operational node
        identifiers go with it, as they do when a fabric is removed. It clears
        nothing this spec's consumers store — this entry only identifies the
        device.
      description: >
        There is no single gesture to transcribe, and that is a property of
        Matter rather than a gap here: the specification says what a reset must
        ACHIEVE and leaves how the user triggers it to the manufacturer, so the
        button, hold time and indicator come from the individual product's
        manual. What a reader gains from this entry is the guarantee about the
        outcome, which is the same on every certified device: after a reset the
        node is commissionable again, and nothing of the previous owner's
        fabric survives on it.

        Removing the device from every fabric through a controller achieves the
        same removal of operational identity without touching the hardware, and
        is the route to prefer when the device is still reachable.
      procedures:
        - name: "The manufacturer's own decommission gesture"
          verified: false
          basis: >
            Matter 1.0 core specification, section 13.4 Factory Reset, which
            mandates the outcome but leaves the trigger to the manufacturer.
            The specific gesture must come from the product's own
            documentation.
          steps:
            - action: "Perform the decommission or factory-reset gesture documented for the specific product."
              actor: "user"
              expect: >
                The node returns to a commissionable state with all
                commissioning-derived key material removed.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The node stays discoverable by its DNS-SD advertisement wherever it sits
        on the LAN; identity keys on the operational instance name (fabric+node
        id) or hostname, not IP.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        Identify-only: no credential crosses to this app. The Matter setup
        passcode is entered by the user in their Matter controller during
        commissioning, never here.

local_access:
  status: native
  summary: >
    Matter is a local-first, cross-vendor standard with no required cloud —
    fully locally controllable through any Matter controller. This project
    deliberately scopes the entry to identify-only and defers control to the
    controller the user already runs.

helpful_urls:
  - url: "https://csa-iot.org/all-solutions/matter/"
    title: "Connectivity Standards Alliance — Matter"
    description: "The cross-ecosystem smart-home standard: Wi-Fi/Thread, local control, multi-admin fabrics."
  - url: "https://github.com/project-chip/connectedhomeip"
    title: "Matter SDK (connectedhomeip)"
    description: "Reference implementation; the DNS-SD service types (_matter._tcp / _matterc._udp) and TXT keys."
  - title: "Matter 1.0 core specification (PDF, CSA-hosted)"
    url: "https://csa-iot.org/wp-content/uploads/2022/11/22-27349-001_Matter-1.0-Core-Specification.pdf"
    kind: "standard"
    description: >
      The normative specification, including section 13.4 on what a factory reset must achieve — the guarantee this spec's reset block rests on.
  - title: "Connectivity Standards Alliance: specification downloads"
    url: "https://csa-iot.org/developer-resource/specifications-download-request/"
    kind: "standard"
    description: >
      Index of current Matter specification versions.
