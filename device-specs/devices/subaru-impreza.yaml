# Subaru Impreza / WRX / STi — Device Specification
# Status: Active — protocol derived from RomRaider source code (GPL-2.0),
#         the canonical open-source Subaru tuning/logging tool. The SSM
#         protocol layer is embedded in RomRaider's
#         src/main/java/com/romraider/io/protocol/ssm/ as two transports
#         (iso9141/K-line and iso15765/CAN) sharing identical command
#         semantics.
#
#         RomRaider commit: cloned 2026-07-28 (HEAD of master; verified
#         current against upstream 2026-07-31)
#         SubaruDefs: 671 ROM definition XML files, cloned 2026-07-28.
#         The repo is frozen (HEAD 2012-08-20) — current defs are
#         distributed via romraider.com forum attachments.
#         FreeSSM: independent C++/Qt open-source implementation
#         (github.com/Comer352L/FreeSSM), used as a cross-check. No
#         FreeSSM copy was available in the research store.
#
#         Confidence: VERY HIGH for the protocol layer. Every byte of
#         the SSM command set is traceable to RomRaider's source.
#         Confidence for parameter addresses is ROM-specific — the
#         spec documents the common subset that appears across most
#         USDM ROM revisions.
#
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Subaru Impreza / WRX / STi"
  manufacturer: "Subaru Corporation"
  manufacturer_status: "active"
  protocol: "obd2"
  notes: >
    Subaru uses SSM (Subaru Select Monitor), a proprietary diagnostic protocol
    layered on top of either ISO 9141-2 K-line (2002–2007) or ISO 15765-4 CAN
    (2008+). SSM exposes roughly 10× more live data than generic OBD-II Mode 01
    PIDs — knock correction, per-cylinder roughness, AVCS cam angles, AF
    Learning by airflow range, boost error, ethanol content, and hundreds of
    ECU-internal parameters.

    Two transports, one protocol:

    K-line (2002–2007) — 4800 baud, 8N1, 5-baud init then SSM framing:
      [0x80, dest, 0xF0, length, COMMAND, payload..., checksum]
      Checksum = Σ bytes (excluding checksum) mod 65536, stored as 1 byte.
      Dest addresses: 0x10=engine, 0x18=transmission, 0x30=ABS.

    CAN (2008+) — 500 kbps, 11-bit IDs:
      Request/response IDs are per-ECU and listed in the `ecus` block below
      (engine 0x7E0/0x7E8, transmission 0x7E1/0x7E9, ABS 0x7E3/0x7EB) — the
      standard ISO 15765-4 diagnostic pairs, response = request + 8. Do NOT
      compute them from the K-line dest address: those addresses (0x10, 0x18,
      0x30) are not contiguous, so an earlier "0x7E0 + (dest - 0x10)" formula
      here was wrong — it mapped the transmission onto 0x7E8 (the engine's
      response ID) and the ABS onto 0x800. Payload after the ID is
      [COMMAND, payload...] on request, [RESPONSE, payload...] on reply.
      No SSM header, no checksum — handled by CAN CRC.

    The protocol is identical: same commands, same parameter addresses.
    Only the framing differs. This is the foundation of RomRaider's portability
    — swap the transport driver, keep the protocol logic.

    SOURCE: RomRaider/src/main/java/com/romraider/io/protocol/ssm/
    - iso9141/SSMProtocol.java      (K-line transport)
    - iso9141/SSMChecksumCalculator.java
    - iso15765/SSMProtocol.java     (CAN transport)
    - iso15765/SSMResponseProcessor.java
    - logger/ecu/comms/query/SSMEcuInit.java

    DTCs are NOT a separate protocol command. They are regular SSM parameters
    stored at memory addresses defined in the logger definition XML. Each DTC is
    a single bit at a (memaddr, bit) location — read that address, check the
    bit, and if set the DTC is active. Clearing a DTC means writing 0x00 to
    its memory address. RomRaider defines DTCs via <dtcode> elements with
    memaddr and bit attributes.

  variants:
    - model: "Impreza / WRX / STi (2002–2007, 16-bit ECU)"
      identification:
        transport: "iso9141-2"
        baud: 4800
        module_addresses:
          engine: "0x10"
      notes: "K-line SSM. 5-baud init wakes the ECU. 68HC16Y5 CPU, 192KB ROM."
    - model: "Impreza / WRX / STi (2008–2014, 32-bit ECU)"
      identification:
        transport: "iso15765-4"
        bitrate: 500000
        request_id: "0x7E0"
        response_id: "0x7E8"
      notes: "CAN SSM, 11-bit IDs. SH72531 CPU."
    - model: "Impreza / WRX / STi / BRZ (2015–2025)"
      identification:
        transport: "iso15765-4"
        bitrate: 500000
        request_id: "0x7E0"
        response_id: "0x7E8"
      notes: "CAN SSM with extended PID set. FA20/FA24 Denso ECU."

  setup:
    required: false
    confidence: "high"
    notes: >
      Plug in an adapter, key on, send ECU init, read the response. No
      provisioning, pairing, or credentials. The green diagnostic connectors
      must be DISCONNECTED for normal reads. Join them for flash writes.
    methods:
      - type: "wired"
        verified: false
        description: >
          Plug an adapter into the OBD-II connector and talk SSM over it. There
          is nothing to provision — the link is physical, so access is granted
          by being in the car. The one setup condition that matters is the pair
          of green diagnostic connectors under the dash: leave them
          DISCONNECTED for reads. Joining them puts the ECU into a mode that
          accepts flash writes, which is not what you want for reading live
          data.
        steps:
          - action: "Locate OBD-II connector under dash, driver's side, above hood release."
            actor: "user"
          - action: "Verify green diagnostic connectors are DISCONNECTED (not joined)."
            actor: "user"
          - action: "Plug in adapter, key ON (engine OFF)."
            actor: "user"
          - action: "Send ECU init and poll live data via SSM read-address."
            actor: "client"
    factory_reset:
      applicable: false
      effect: >
        There is nothing to clear. A car reached over its OBD-II connector holds
        no pairing, credential or client binding — access is physical, and
        unplugging the adapter ends it. The ECU does hold state a tool can
        change (learned fuel trims, stored DTCs, flashed calibrations), but
        clearing any of that is a specific diagnostic operation with its own
        prerequisites and consequences, not a "factory reset", and it must not
        be presented as a routine setup step on a vehicle.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []

obd:
  role: "vehicle"

  connector:
    standard: "sae-j1962"
    location: "under dash, driver's side, above hood-release lever"
    model_years: "2002–2025"
    pins:
      - pin: 16
        signal: "battery +12V"
        verification: "reported"
      - pin: 4
        signal: "chassis ground"
        verification: "reported"
      - pin: 5
        signal: "signal ground"
        verification: "reported"
      - pin: 7
        signal: "K-line (2002–2007, ISO 9141-2)"
        verification: "reported"
      - pin: 6
        signal: "CAN-H (2008+, ISO 15765-4)"
        verification: "reported"
      - pin: 14
        signal: "CAN-L (2008+, ISO 15765-4)"
        verification: "reported"

  transport:
    standard: "iso15765-4"
    bitrate: 500000
    addressing: "11bit"
    request_id: "0x7E0"
    response_id: "0x7E8"
    verification: "reported"
    notes: >
      CAN SSM framing (from RomRaider SSMProtocol.java for iso15765):
      - Request:  [0x7E, 0x00 + offset, COMMAND, payload...]
      - Response: [0x7E, 0x80 + offset, RESPONSE_CODE, data...]
      - No header bytes, no checksum — CAN handles framing and CRC.

      K-line SSM framing (from SSMProtocol.java for iso9141):
      - Request:  [0x80, dest, 0xF0, data_len, COMMAND, payload..., checksum]
      - Response: [0x80, 0xF0, dest, data_len, RESPONSE_CODE, data..., checksum]
      - Checksum = Σ(all preceding bytes) mod 65536, truncated to 1 byte.
      - Checksum from SSMChecksumCalculator.java: total - ((total >>> 16) << 16)

      The COMMAND byte is the same on both transports. Response codes are
      COMMAND | 0x40 (e.g., 0xA8 → 0xE8, 0xB8 → 0xF8).

  adapter_requirements:
    - "CAN: any ELM327 v1.4+ with AT commands and ISO 15765-4 support."
    - "K-line: VAG-COM KKL cable (FT232RL) or Tactrix OpenPort 2.0."
    - "ECU flashing (not covered here): Tactrix OpenPort 2.0 only."

  # ====================================================================
  # SSM Protocol — Command Set
  # ====================================================================
  # All canonical command constants from RomRaider's SSMProtocol.java.
  #
  # Response codes are always COMMAND | 0x40.
  # NRC (negative response code) = 0x7F indicates the ECU rejected the
  # request. NRC byte 5 carries the rejected command, byte 6 is the
  # error code (0x13 = unsupported parameter, 0x22 = address not allowed).
  # ====================================================================

  commands:
    - name: "ECU_INIT"
      code: "0xBF"
      code_can: "0xAA"
      response: "0xFF"
      response_can: "0xEA"
      description: "Initialize SSM session with ECU. Returns ECU ID + supported-parameter bitmask."
      writes: false
      verification: "reported"
      notes: >
        K-line: 0x80 0x10 0xF0 0x01 0xBF 0x40 <cs>
        CAN:    0x7E 0x00 0xAA

        K-line response: 0x80 0xF0 0x10 <len> 0xFF <3 unknown> <5 ECU ID bytes> <params_bitmask...> <cs>
        CAN response:    0x7E 0x80 0xEA <3 unknown> <5 ECU ID bytes> <params_bitmask...>

        The ECU ID is 5 bytes starting at offset 3 in the data portion,
        encoded as hex ASCII. The parameter bitmask starts at offset 8.
        Each bit represents one parameter (ecubyteindex/ecubit in the
        logger XML); if set, the ECU supports that parameter.

    - name: "READ_ADDRESS"
      code: "0xA8"
      response: "0xE8"
      description: "Read parameter values at specific addresses. The workhorse — most tools poll 4–12 addresses per request."
      writes: false
      verification: "reported"
      notes: >
        K-line: 0x80 0x10 0xF0 <len> 0xA8 0x00 <addr1_3bytes> <addr2_3bytes>... <cs>
                0xA8 0x01 for continuous fast-poll (padding byte = 0x01).
        CAN:    0x7E 0x00 0xA8 0x00 <addr1_3bytes> <addr2_3bytes>...

        Each address is 3 bytes big-endian. The ECU returns all values
        concatenated in the response. The client knows each parameter's
        width from the ECU definition (1, 2, or 4 bytes).

    - name: "READ_MEMORY"
      code: "0xA0"
      response: "0xE0"
      description: "Bulk memory read — K-line only. NOT SUPPORTED on CAN."
      writes: false
      verification: "reported"
      notes: >
        K-line: 0x80 0x10 0xF0 <len> 0xA0 0x00 <addr_3bytes> <num_bytes_minus_1> <cs>
        CAN: throws UnsupportedProtocolException. RomRaider only uses read-address on CAN.

    - name: "WRITE_ADDRESS"
      code: "0xB8"
      response: "0xF8"
      description: "Write a single byte value to a 3-byte address."
      writes: true
      verification: "reported"
      notes: >
        K-line: 0x80 0x10 0xF0 <len> 0xB8 <addr_3bytes> <value> <cs>
        CAN:    0x7E 0x00 0xB8 <addr_3bytes> <value>

        Used for: ECU reset (address 0x000060, value 0x40), DTC clear
        (write 0x00 to DTC memory addresses), actuator tests, and tuning
        parameter writes.

    - name: "WRITE_MEMORY"
      code: "0xB0"
      response: "0xF0"
      description: "Bulk memory write — K-line only. NOT SUPPORTED on CAN."
      writes: true
      verification: "reported"

    - name: "ECU_RESET"
      command: "WRITE_ADDRESS"
      address: "0x000060"
      value: "0x40"
      description: "Soft-reset the ECU. Equivalent to pulling battery for 30 minutes."
      writes: true
      verification: "reported"
      notes: >
        Send WRITE_ADDRESS to 0x000060 with value 0x40.
        K-line: 0x80 0x10 0xF0 0x05 0xB8 0x00 0x00 0x60 0x40 <cs>
        CAN:    0x7E 0x00 0xB8 0x00 0x00 0x60 0x40
        Response: 0x7E 0x80 0xF8 0x40

  # ====================================================================
  # SSM Commands — High-Level Operations
  # ====================================================================
  # These are the user-facing operations built on the command primitives
  # above. Each references the underlying SSM command code and address.
  # ====================================================================

  requests:
    - name: "ssm_ecu_init"
      description: "Begin an SSM session and read ECU identity + supported parameters."
      command_class: "basic"
      requires: ["single_frame", "custom_headers"]
      ssm_command: "ECU_INIT"
      writes: false
      verification: "reported"
    - name: "ssm_read_ecu_id"
      description: "Extract ECU ID (CAL ID / ROM revision) from init response. 5 hex bytes at offset 3."
      command_class: "basic"
      ssm_command: "ECU_INIT"
      writes: false
      verification: "reported"
      notes: "The CAL ID is the first 5 data bytes after the 3-byte unknown prefix — e.g. 'A2WC522N'."
    - name: "ssm_read_params"
      description: "Read one or more live-data parameters by address."
      command_class: "basic"
      requires: ["single_frame", "multiframe_rx"]
      ssm_command: "READ_ADDRESS"
      writes: false
      verification: "reported"
      notes: "Send 3-byte addresses concatenated. Each ROM definition file maps parameter names to addresses and byte widths."
    - name: "ssm_read_dtc"
      description: "Read a single DTC bit at a (memaddr, bit) location. DTCs are regular SSM parameters."
      command_class: "basic"
      ssm_command: "READ_ADDRESS"
      writes: false
      verification: "reported"
      notes: "Read the DTC's memaddr via READ_ADDRESS, then check the bit. If 1, the DTC is active."
    - name: "ssm_clear_dtc"
      advanced: true
      description: "Clear a single DTC by writing 0x00 to its memory address."
      command_class: "advanced"
      ssm_command: "WRITE_ADDRESS"
      writes: true
      verification: "reported"
      notes: "Some ECUs also reset AF Learning when clearing DTCs. Check your ROM revision."
    - name: "ssm_ecu_reset"
      advanced: true
      description: "Soft-reset ECU — clears learned parameters without clearing DTCs."
      command_class: "advanced"
      ssm_command: "ECU_RESET"
      writes: true
      verification: "reported"
    - name: "obd2_mode01"
      description: "Standard OBD-II Mode 01 PID read. Available on CAN models (2008+) alongside SSM."
      command_class: "basic"
      requires: ["single_frame"]
      service: "01"
      writes: false
      verification: "reported"
    - name: "obd2_mode03"
      description: "Standard OBD-II Mode 03 DTC read."
      command_class: "basic"
      service: "03"
      writes: false
      verification: "reported"
    - name: "obd2_mode04"
      description: "Standard OBD-II Mode 04 clear DTCs."
      command_class: "basic"
      service: "04"
      writes: true
      verification: "reported"
    - name: "obd2_mode09"
      description: "Standard OBD-II Mode 09 vehicle info (VIN, CAL ID)."
      command_class: "basic"
      requires: ["multiframe_rx"]
      service: "09"
      writes: false
      verification: "reported"
    - name: "ssm_check_support"
      description: "Check if a parameter is supported by checking its bit in the init-response bitmask."
      command_class: "basic"
      writes: false
      verification: "reported"
      notes: >
        Each parameter in the logger XML has ecubyteindex and ecubit.
        After ECU init, check byte[ecubyteindex] & (1 << ecubit) — NO bit
        inversion (RomRaider LoggerDefinitionHandler.isSupportedParameter:
        (bytes[i] & 1 << ecuBit) > 0). If non-zero, the parameter is
        supported. This is how RomRaider dynamically adapts to any ROM
        revision.

  # ====================================================================
  # Live Data Parameter Map (subset — ROM-specific)
  # ====================================================================
  # These are the most common parameters across USDM Subaru ROMs.
  # Addresses from RomRaider's logger/metric/logger.xml.
  # Full parameter list: ~300 per ROM revision, defined in SubaruDefs.
  # ====================================================================

  data_identifiers:
    # NOTE ON SHAPE (see PR): these are Subaru SSM 3-byte read-addresses, not UDS
    # 2-byte ReadDataByIdentifier DIDs. The schema's `did` pattern is
    # ^0x[0-9A-Fa-f]{4}$ ("two-byte data identifier"), which cannot express a
    # 3-byte address. The values below are left at their true width rather than
    # truncated: an SSM read-address command puts three address bytes on the wire,
    # so a 2-byte value would be wrong there.
    #
    # `scale:` was renamed to `formula:` here — the values are decode expressions
    # ("x - 40", "(x - 128) * 0.78125"), not the numeric multiplier the schema's
    # `scale` means. Reducing them to a number would silently drop the offsets.
    # `formula` is the convention already used by obd2-pid-reference.yaml and
    # gerbing-thermogauge.yaml, but it is not yet in the schema, so it is
    # currently unvalidated.
    # Engine vitals
    - did: "0x000007"
      name: "Engine Load (Relative)"
      type: "uint8"
      formula: "x * 100 / 255"
      unit: "%"
      source: "P1, ecubyteindex=8, ecubit=7"
      verification: "reported"
    - did: "0x000008"
      name: "Coolant Temperature"
      type: "uint8"
      formula: "x - 40"
      unit: "°C"
      source: "P2, ecubyteindex=8, ecubit=6"
      verification: "reported"
    - did: "0x000009"
      name: "A/F Correction #1 (short-term fuel trim)"
      type: "uint8"
      formula: "(x - 128) * 0.78125"
      unit: "%"
      source: "P3, ecubyteindex=8, ecubit=5"
      verification: "reported"
    - did: "0x00000A"
      name: "A/F Learning #1 (long-term fuel trim, range A)"
      type: "uint8"
      formula: "(x - 128) * 0.78125"
      unit: "%"
      source: "P4, ecubyteindex=8, ecubit=4"
      verification: "reported"
    - did: "0x00000D"
      name: "Manifold Absolute Pressure"
      type: "uint8"
      formula: "x * 37 / 255"
      unit: "psi"
      source: "P7, ecubyteindex=8, ecubit=1"
      verification: "reported"
    - did: "0x00000E"
      name: "Engine Speed"
      type: "uint16"
      formula: "x * 0.25"
      unit: "rpm"
      source: "P8, length=2, ecubyteindex=8, ecubit=0"
      verification: "reported"
    - did: "0x000010"
      name: "Vehicle Speed"
      type: "uint8"
      formula: "x * 0.621371"
      unit: "mph"
      source: "P9, ecubyteindex=9, ecubit=7"
      verification: "reported"
    - did: "0x000011"
      name: "Ignition Total Timing"
      type: "uint8"
      formula: "(x - 128) * 0.5"
      unit: "° BTDC"
      source: "P10, ecubyteindex=9, ecubit=6"
      verification: "reported"
    - did: "0x000012"
      name: "Intake Air Temperature"
      type: "uint8"
      formula: "x - 40"
      unit: "°C"
      source: "P11, ecubyteindex=9, ecubit=5"
      verification: "reported"
    - did: "0x000013"
      name: "Mass Airflow"
      type: "uint16"
      formula: "x / 100"
      unit: "g/s"
      source: "P12, length=2, ecubyteindex=9, ecubit=4"
      verification: "reported"
    - did: "0x000015"
      name: "Throttle Opening Angle"
      type: "uint8"
      formula: "x * 0.39215686"
      unit: "%"
      source: "P13, ecubyteindex=9, ecubit=3"
      verification: "reported"
    - did: "0x000016"
      name: "Front O2 Sensor #1"
      type: "uint16"
      formula: "x / 200"
      unit: "V"
      source: "P14, length=2, ecubyteindex=9, ecubit=2"
      verification: "reported"
    - did: "0x00001A"
      name: "Front O2 Sensor #2"
      type: "uint16"
      formula: "x / 200"
      unit: "V"
      source: "P16, ecubyteindex=9, ecubit=0"
      verification: "reported"
    - did: "0x00001C"
      name: "Battery Voltage"
      type: "uint8"
      formula: "x * 0.08"
      unit: "V"
      source: "P17, ecubyteindex=10, ecubit=7"
      verification: "reported"

    # NOTE: Target Boost is an extended RomRaider logparam (E21), not a standard
    # SSM parameter. Extended params have no fixed read address -- the address is
    # defined per-ROM in the ECU definition file -- so it cannot be listed here
    # with a `did`. It lives under `extended_parameters` below instead.
    #
    # AF Learning #1 Ranges B/C/D were previously listed here at
    # 0x00001C/0x00001D/0x00001E -- REMOVED: in the SubaruDefs logger.xml those
    # addresses are P17 Battery Voltage, P18 MAF Sensor Voltage and P19
    # Throttle Sensor Voltage. Ranges B-D exist only as per-ROM extended
    # parameters in newer forum-distributed defs, not at fixed standard
    # addresses; resolve them from the matching ECU definition instead.

  # ====================================================================
  # Extended (ROM-specific) logging parameters
  # ====================================================================
  # RomRaider "extended" params are read the same way as standard SSM
  # parameters, but their memory address is not a constant: it is defined
  # per-ROM in the ECU definition file and differs between calibrations.
  # They are listed by logparam id so a consumer can resolve the address
  # from the matching ECU def rather than from a hardcoded value here.
  # ====================================================================
  extended_parameters:
    - logparam: "E21"
      name: "Target Boost"
      type: "uint8"
      formula: "(x * 0.15469416) - 14.6959452"
      unit: "psig"
      source: "16BITBASE ECU definition"
      verification: "reported"

  # ====================================================================
  # ECU Module Map
  # ====================================================================
  # From RomRaider's logger.xml <module> definitions. Each module has
  # an address and tester ID used to construct SSM frames.
  # ====================================================================

  ecus:
    - name: "Engine ECU"
      address: "0x10"
      tester: "0xF0"
      can_request_id: "0x7E0"
      can_response_id: "0x7E8"
      owns:
        - "all SSM live data (read-address)"
        - "DTCs as SSM parameters (read-address + write-address)"
        - "ECU identity (init response)"
        - "learned parameters / ECU reset (write-address 0x000060)"
        - "tuning tables (write-address, ROM-specific addresses)"
        - "actuator tests (write-address, ROM-specific)"
      verification: "reported"
    - name: "Transmission ECU (TCU)"
      address: "0x18"
      tester: "0xF0"
      can_request_id: "0x7E1"
      can_response_id: "0x7E9"
      owns:
        - "transmission fluid temp"
        - "gear position"
        - "TCU DTCs"
        - "solenoid duty / line pressure (auto)"
        - "CVT ratio / belt pressure (CVT)"
      verification: "reported"
    - name: "ABS / VDC Module"
      address: "0x30"
      tester: "0xF0"
      can_request_id: "0x7E3"
      can_response_id: "0x7EB"
      owns:
        - "ABS DTCs"
        - "wheel speed sensors"
        - "VDC yaw/lateral-G"
      verification: "reported"

  # ====================================================================
  # Green Diagnostic Connectors
  # ====================================================================
  # Every OBD-II Subaru has a pair of green single-pin connectors taped
  # together under the dash. When joined, the ECU enters test mode:
  # CEL flashes, fans cycle, fuel pump primes, and the ECU accepts
  # flash writes. DISCONNECT for normal driving.
  # ====================================================================

  test_mode:
    connectors:
      - color: "green"
        pins: 1
        location: "under dash near OBD-II port, taped together"
        function: "test mode / flash mode enable"
        verification: "reported"
      - color: "white"
        pins: 2
        location: "under dash near green connectors (2002–2005 only)"
        function: "flash-write enable (must join with green)"
        verification: "reported"
