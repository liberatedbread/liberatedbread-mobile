    state_mapping:
      value: "core_temp_packed"
    notes: >
      Probe-tip (core) temperature, streamed about every 2 s after the
      challenge reply. The bound field is rotation-PACKED: a consumer must
      run protocol_details.xw2_rotation_packing (protocol_handler
      yummly_xw2_tlv) to get tenths of a degree F, then divide by 10. A
      consumer without that handler must not display this field; shown raw
      it is an obvious nonsense number, not a plausible one. Food safety:
