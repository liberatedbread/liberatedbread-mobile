protocol_details:
  xw2_rotation_packing:
    description: >
      The XW2 generation hides each numeric reading behind a self-describing
      bit rotation. A packed value has a 4-bit SELECTOR in its top nibble
      and a FIELD of W bits below it; the field holds the reading rotated
      RIGHT by selector bits (the selector's worth of the reading's low bits
      have been moved to the top of the field). Decoding is the inverse: a
      left rotation of the field by selector bits within W bits. The
      selector changes from frame to frame (observed values are small), so a
      client cannot treat any bit position as fixed. Restated from the
      source project's transcription of the vendor app; the worked vectors
      marked "computed" were produced from this statement of the algorithm
      and are checked by scripts/test_yummly_smart_thermometer_spec.py.
    algorithm:
      - "Read the packed value little-endian from its bytes: 3 bytes for the core temperature (24 bits, W = 20), 2 bytes for the body temperature (16 bits, W = 12), 1 byte for battery (8 bits, W = 4)."
      - "s = packed >> W (the top four bits; 0 <= s <= 15, and for W = 12 or W = 4 only s < W is meaningful)."
      - "field = packed & ((1 << W) - 1)."
      - "value = ((field << s) | (field >> (W - s))) & ((1 << W) - 1). For s = 0 the field is the value unchanged."
      - "Equivalently, as the vendor app writes it: m = ((1 << s) - 1) << (W - s); value = ((field & ~m) << s) | ((field & m) >> (W - s))."
      - "Core temperature: clamp value to 320..2120, then divide by 10 for degrees F (0.1 F resolution). Body temperature: clamp to 32..572, WHOLE degrees F (do not divide). Battery: value 0..9, map to bars per payload_formats.Xw2Battery."
    fields:
      core_temperature:
        bytes: 3
        field_bits: 20
        selector_bits: 4
        unit_after_decode: "0.1 F"
        clamp: [320, 2120]
      body_temperature:
        bytes: 2
        field_bits: 12
        selector_bits: 4
        unit_after_decode: "F"
        clamp: [32, 572]
      battery:
        bytes: 1
        field_bits: 4
        selector_bits: 4
        unit_after_decode: "gauge 0..9"
    vectors:
      - field: "battery"
        packed_hex: "2d"
        selector: 2
        decoded: 7
        bars: 3
        verification: "reported"
        notes: "Published dock-battery reply 02 15 2d, shown as 3 of 4 bars."
      - field: "battery"
        packed_hex: "33"
        selector: 3
        decoded: 9
        bars: 4
        verification: "reported"
        notes: "Published probe-battery reply (inner type 03, value 33), shown as 4 of 4 bars."
      - field: "battery"
        packed_hex: "07"
        selector: 0
        decoded: 7
        bars: 3
        verification: "hypothesis"
        notes: "Computed: the same gauge as 2d with no rotation."
      - field: "battery"
        packed_hex: "1b"
        selector: 1
        decoded: 7
        bars: 3
        verification: "hypothesis"
        notes: "Computed."
      - field: "core_temperature"
        packed_le_hex: "2c0500"
        packed_int: 0x00052c
        selector: 0
        decoded: 1324
        value: "132.4 F"
        verification: "hypothesis"
        notes: "Computed: unrotated, the field is the tenths-of-F value itself."
      - field: "core_temperature"
        packed_le_hex: "4b0120"
        packed_int: 0x20014b
        selector: 2
        decoded: 1324
        value: "132.4 F"
        verification: "hypothesis"
        notes: "Computed. A full frame carrying it: 07 07 01 53 00 5e 00 00 04 01 4b 01 20 (documentation address 00:00:5e:00:53:01)."
      - field: "core_temperature"
        packed_le_hex: "a50038"
        packed_int: 0x3800a5
        selector: 3
        decoded: 1324
        value: "132.4 F"
        verification: "hypothesis"
        notes: "Computed."
      - field: "core_temperature"
        packed_le_hex: "80a5f0"
        packed_int: 0xf0a580
        selector: 15
        decoded: 1324
        value: "132.4 F"
        verification: "hypothesis"
        notes: "Computed; the largest selector the nibble can hold."
      - field: "core_temperature"
        packed_le_hex: "c70028"
        packed_int: 0x2800c7
        selector: 2
        decoded: 798
        value: "79.8 F"
        verification: "hypothesis"
        notes: "Computed: the room-temperature reading the source project reported (79.8 F), re-packed with selector 2."
      - field: "core_temperature"
        packed_le_hex: "090130"
        packed_int: 0x300109
        selector: 3
        decoded: 2120
        value: "212.0 F"
        verification: "hypothesis"
        notes: "Computed: the upper clamp."
      - field: "body_temperature"
        packed_le_hex: "1301"
        packed_int: 0x0113
        selector: 0
        decoded: 275
        value: "275 F"
        verification: "hypothesis"
        notes: "Computed: unrotated whole degrees."
      - field: "body_temperature"
        packed_le_hex: "8918"
        packed_int: 0x1889
        selector: 1
        decoded: 275
        value: "275 F"
        verification: "hypothesis"
        notes: "Computed. A full frame carrying it: 07 07 01 53 00 5e 00 00 03 02 89 18."
      - field: "body_temperature"
        packed_le_hex: "2236"
        packed_int: 0x3622
        selector: 3
        decoded: 275
        value: "275 F"
        verification: "hypothesis"
        notes: "Computed."
      - field: "body_temperature"
        packed_le_hex: "2718"
        packed_int: 0x1827
        selector: 1
        decoded: 79
        value: "79 F"
        verification: "hypothesis"
        notes: "Computed: the room-temperature body reading the source project reported (79 F)."
      - field: "body_temperature"
        packed_le_hex: "26b2"
        packed_int: 0xb226
        selector: 11
        decoded: 275
        value: "275 F"
        verification: "hypothesis"
        notes: "Computed; the largest selector that is meaningful for a 12-bit field."
  xw2_auth_challenge:
    description: >
      After the client enables notifications, the dock sends 01 ab about
      every 2 s until it receives 02 aa <code> on 6e40aa02. <code> is the
      brand id (2 for Yummly) packed with the same rotation scheme at W = 4:
      code = rotate_right_4(brand_id, s) | (s << 4), for s in 0, 1, 2. The
      vendor app chose s from its clock modulo 3; the dock has no clock and
      accepts all three. The source project saw the pings stop after each.
    brand_id: 2
    vectors:
      - selector: 0
        code: 0x02
        verification: "reported"
      - selector: 1
        code: 0x11
        verification: "reported"
      - selector: 2
        code: 0x28
        verification: "reported"
    reply_frame_example: "02 aa 02"
  xw2_request_reply_types:
    description: >
      Request byte written (as 01 <req> or wrapped) versus the type byte of
      the reply. They differ for every pair but RSSI, and a request sent
      with the reply's byte is ignored. Dock-targeted on the left, probe-
      targeted (wrapped) on the right.
    dock:
      firmware: {request: 0x09, reply: 0x04}
      model: {request: 0x28, reply: 0x27}
      battery: {request: 0x16, reply: 0x15}
      production_date: {request: 0x2c, reply: 0x2b}
      rssi: {request: 0x24, reply: 0x24}
      probe_mac: {request: 0x21, reply: 0x20}
      probe_status: {request: 0x32, reply_inner: 0x1e}
      enter_probe_dfu: {request: 0xac}
    probe:
      firmware: {request: 0x11, reply_inner: 0x12}
      name: {request: 0x23, reply_inner: 0x22}
      model: {request: 0x2a, reply_inner: 0x29}
      production_date: {request: 0x2e, reply_inner: 0x2d}
      battery: {request: 0x0c, reply_inner: 0x03}
      rssi: {request: 0x14, reply_inner: 0x13}
    stream_only:
      core_temperature: {reply_inner: 0x01}
      body_temperature: {reply_inner: 0x02}
    vendor_app_query_order: >
      After the challenge: dock firmware, model, production date, battery,
      probe address, probe status; then, with the address, probe firmware,
      name, model, production date, battery, about 1.5 s apart.
  xw2_published_frames:
    description: "Frames the source project printed from its unit, with the unit's probe address replaced by the documentation address 00:00:5e:00:53:01 (wire 01 53 00 5e 00 00)."
    challenge_ping: "01 ab"
    dock_firmware_reply: "05 04 31 2e 35 33"
    dock_battery_reply: "02 15 2d"
    probe_name_request: "07 07 01 53 00 5e 00 00 01 23"
    probe_name_reply: "07 07 01 53 00 5e 00 00 0b 22 59 75 6d 6d 6c 79 20 50 31 00"
    probe_battery_reply: "07 07 01 53 00 5e 00 00 02 03 33"
    probe_status_reply_observed: "07 07 00 00 00 00 00 00 02 1e 05"
  advertisement_payload:
    description: >
      Manufacturer-specific data as the vendor app's scanner read it, by
      byte offset in the raw advertisement record (not the payload):
      bytes 5-6 company id (0xc702 read big-endian, i.e. SIG 0x02c7 read
      little-endian), bytes 7-8 product id 0xa001 (XW2) or 0xa301 (XW3),
      byte 9 brand id 0x02 (Yummly), bytes 12-13 bond/whitelist flags. The
      product-id byte order is ambiguous in the source, so match on the
      company id and the name, not on these bytes.
    verification: "hypothesis"
  xw3_connection_sequence:
    description: "What the vendor app did on a T3, from the source project's reading; untested."
    steps:
      - "Connect; require the command characteristic and all six f84c... characteristics."
      - "Enable notifications on f84c1001, f84c1002, f84c2000, f84c3001, f84c3002, f84c3003; request a high connection priority."
      - "Write 14, 11, 13, 50 on 6f2f0100 (firmware, model, production date, connected probes)."
      - "On a 0x50 reply with a probe address (or a 0x30 connected status), write the probe commands 11, 13, 14, 15, 16, 17 wrapped as a0 <addr reversed> <cmd>, retrying until all six replies arrive."
      - "Read f84c1002 for the dock battery once the probe address is known."

evidence:
  documentation_review: >
    DavisGoglin/yummly-thermometer read in full on 2026-10-11 (README,
    docs/PROTOCOL.md, docs/NOTES.md, docs/captures/capture.py,
    src/yummly_thermo/thermo.py; MIT). The project recovered the protocol
    from the vendor Android app (v8.7) and ran the XW2 path on one T1 + P1
    on 2026-08-25: challenge, every dock and probe query, and the
    temperature stream, whose core and body decodes (79.8 F and 79 F) matched
    an independent room thermometer. Its raw-frame capture file is referenced
    but was not retrievable (404), so the temperature vectors here are
    computed from the stated algorithm rather than copied from the wire; the
    battery bytes 2d and 33 and the firmware reply are the frames it
    published. The Yummly YTE000W5K manual (ManualsLib) and the archived
    Whirlpool/Amana product-help pages supplied the setup steps, LED and
    specifications. No second implementation, FCC filing or Mastrad
    documentation was found.
  app_static_analysis: >
    Second-hand only: this project did not decompile the app. The XW3
    section, the request/reply byte tables, the rotation algorithm and the
    advertisement layout are the source project's reading of it, restated
    without its internal names.
  open_questions: >
    Whether a P1 probe can be connected directly without the dock; what the
    probe-status 0x05 / zero-address reply means; why model and production
    date come back blank; the advertisement byte order; the XW2 dock's
    bootloader entry and update-mode name; whether the P1's body channel is
    a real sensor; everything about XW3.

remaining_unknowns:
  - "XW3 (T3 + P3) has never been run by anyone known to this project: UUIDs, command bytes, the int16 Celsius layout and the DFU names are all from the app."
  - "The body (channel 2) temperature, the dock battery and the probe battery on XW2 have no entity: they are further frame types on 6e40aa03, which the schema binds to one layout through format_match. payload_formats.Xw2AmbientTemperature and Xw2Battery document them until per-type layouts can be declared."
  - "Whether the P1 probe's body channel is a working sensor. The source project's unit read about 8 F there at room temperature before the 32 F clamp (yet 79 F in another capture), and the vendor app fed the channel into an estimation model rather than showing it; treat it as uncalibrated until someone puts a probe in a known oven."
  - "The probe-status reply (request 0x32) returned 0x05 with an all-zero address while the probe was streaming; whether it reports the radio link or the vendor-app registration is not known."
  - "Dock and probe model and production-date strings came back as twelve NUL bytes on the observed unit; whether a different request or a bond would fill them is unknown."
  - "Whether a phone can connect to a bare P1 probe (it carries its own name 'Yummly P1' in the app's scanner list) and read it without the dock."
  - "The advertisement payload byte order (product id 0xa001/0xa301, brand 0x02) is ambiguous in the source; no manufacturer-data pattern is declared."
  - "How the XW2 dock enters its bootloader and what it advertises there; whether the bundled firmware images are signed; whether any image is still obtainable now the app is gone."
  - "Whether the Mastrad Meat°it app still drives a Yummly dock (one owner report says a 'Meat It 3' app connected; unverified), and which Mastrad model numbers correspond to T1/P1 beyond the 74500-series names in the firmware bundle."
  - "No factory reset or pairing-button procedure is documented anywhere found; the dock's pairing button's function is unknown."
  - "MTU, write chunking and the notification cadence under load (about 2 s per core/body pair at rest)."

