# LG webOS Second Screen Protocol (SSAP) — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# The local control protocol of every LG webOS smart TV (2014+): JSON frames
# over a WebSocket on port 3000 (wss on 3001), a register/pairing handshake
# that yields a client-key once the user accepts an on-screen prompt, and
# SSAP service URIs (ssap://audio/volumeUp, ssap://system/turnOff, ...) for
# every command thereafter.
#
# The access surface is the `websocket:` block below: where the socket is,
# how a client is authorised on it, and how each command becomes a frame.
# There is no REST here at all — the placeholder `http_endpoints` entry this
# file used to carry existed only to name the port, and the websocket block
# names it properly.
#
# The `commands` block declares no `transport:` on each entry — `device.transport`
# names the one they all ride — and carries each invocation's wire spelling in
# `action`, with the frame format in webos_common.
#
# WHAT IS STILL NOT SENDABLE, stated up front: a first pairing. The
# registration manifest's static Connect SDK signature has not been recovered
# by this project (see remaining_unknowns), so a client cannot complete the
# handshake that issues a client-key. Everything after that point — both
# channels, every command — is declared and renderable.
#
# No LG hardware was available to this project. Every command is
# verification "reported": read out of LG's own Connect SDK source and the
# mature open clients — aiowebostv (the library Home Assistant ships),
# bscpylgtv, and openHAB's lgwebos binding.

device:
  name: "LG webOS TV Second Screen Protocol"
  manufacturer: "LG Electronics"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "wifi"
  category: "tv"
  transport: "websocket"
  notes: >
    Control is a WebSocket to port 3000 (ws) with a required fallback to
    3001 (wss, self-signed certificate) — late firmware refuses the plain
    socket entirely. On the socket the client sends a hello frame, then a
    register frame carrying a pairing manifest; on first contact the TV
    shows an accept prompt and answers with a client-key, which
    authenticates every later connection. Commands are JSON request frames
    naming SSAP URIs (ssap://system/turnOff, ssap://audio/volumeUp,
    ssap://tv/channelDown, ssap://system.launcher/launch,
    ssap://com.webos.applicationManager/listApps); remote-button presses go
    over a SECOND WebSocket, the pointer input socket, as plain-text frames
    (type:button\nname:HOME). Discovery is SSDP only:
    ST urn:lge-com:service:webos-second-screen:1 gives a LOCATION whose XML
    carries UDN, serialNumber, friendlyName and modelName. There is no
    power-on command — ssap://system/turnOn was removed from firmware —
    so wake is Wake-on-LAN, gated by an on-TV setting whose name varies by
    model year (Mobile TV On / Turn On Via WiFi / IP control Wake on LAN).
    The TV must have "LG Connect Apps" enabled (Network settings; "Mobile
    App" on older firmware) or pairing never prompts.
  openness:
    status: "undocumented"
    reverse_engineered: true
    upstream_docs:
      - url: "https://github.com/ConnectSDK/Connect-SDK-Android"
        title: "Connect SDK (LG Electronics, Apache-2.0)"
        covers: >
          LG's own reference implementation of the protocol — discovery,
          the pairing manifest, and the SSAP calls. LG never published a
          wire-format document; this source is the closest thing to one.
      - url: "https://github.com/home-assistant-libs/aiowebostv/blob/main/aiowebostv/handshake.py"
        title: "aiowebostv handshake.py — the register payload, byte for byte"
        covers: >
          The exact registration message every open client sends:
          forcePairing, pairingType PROMPT, the manifest's permission list
          and the boilerplate `signed` block (appId com.lge.test, the same
          static RSA signature everywhere) inherited from Connect SDK.
      - url: "https://github.com/chros73/bscpylgtv/blob/master/bscpylgtv/endpoints.py"
        title: "bscpylgtv endpoints.py — the SSAP URI catalogue"
        covers: >
          The full URI list used below, including which URIs firmware has
          since removed (system/turnOn, the webOS <4 screen-power pair, the
          3D pair).
      - url: "https://www.home-assistant.io/integrations/webostv/"
        title: "Home Assistant — LG webOS TV integration"
        covers: >
          The user-side requirements: enabling LG Connect Apps, the ports
          3000/3001 firewall rule, Wake-on-LAN for power-on, and the per
          model-year setting names that gate it.
      - url: "https://www.openhab.org/addons/bindings/lgwebos/"
        title: "openHAB — LG webOS binding"
        covers: >
          The remote-button name vocabulary (LEFT, RIGHT, UP, DOWN, ENTER,
          BACK, EXIT, HOME, 0-9, RED/GREEN/YELLOW/BLUE, PLAY/PAUSE/STOP),
          TLS being required by recent firmware, and WoL power-on.
    notes: >
      LG publishes SDKs (Connect SDK; webOSTV.js for on-TV apps) but no
      protocol document for the second-screen socket, so the status stays
      undocumented even though LG's own open-source client is among the
      sources. The parts reconstructed rather than read from anything LG
      published: the ports and the ws→wss fallback, the hello frame newer
      firmware expects, the pointer-socket text-frame format, and the
      per-firmware gaps (pointer socket inert on webOS 1.x, plain ws
      refused late) — all from community client source.

  identification:
    ssdp_search_targets:
      - "urn:lge-com:service:webos-second-screen:1"
    # No mdns_service_type: the second-screen service advertises over SSDP
    # only. The TV does speak mDNS for unrelated features (AirPlay on 2018+
    # models), but nothing there identifies a webOS TV as controllable.
    default_port: 3000
    identity_keys:
      primary: "udn"
      secondary: "serial"
      display: "friendly_name"

  discovery:
    methods:
      - type: "ssdp"
        ssdp:
          search_targets: ["urn:lge-com:service:webos-second-screen:1"]
          response_mapping:
            location:
              url: "LOCATION"
              action: "fetch_xml"
              # LOCATION points at a standard UPnP device-description XML on
              # the TV's own UPnP HTTP port — NOT 3000; read host from it,
              # but the control port is always 3000/3001. The TV also sends
              # ssdp:byebye for this ST when it powers off, which is the
              # cheapest availability signal there is.
              parse:
                device_identity:
                  stable_keys:
                    - source: "xml://device/UDN"
                      key: "udn"
                    - source: "xml://device/serialNumber"
                      key: "serial"
                  display:
                    source: "xml://device/friendlyName"
                  variant:
                    source: "xml://device/modelName"
    identity:
      stable_keys: ["udn", "serial"]
      display: "friendly_name"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      Onboarding happens on the TV's own screen; no credential crosses any
      protocol this file documents. What a client must survive is PAIRING,
      which is part of the control protocol itself: first register gets an
      on-screen prompt, acceptance returns a client-key, and the TV
      remembers it until the paired-device list is cleared or the TV is
      reset. Confidence is medium: the flow below is what aiowebostv,
      bscpylgtv and openHAB all implement against production TVs, but this
      project has not replayed it.
    methods:
      - type: "device_ui"
        verified: false
        description: >
          First-run wizard on the TV (language, network, passphrase on the
          on-screen keyboard, optional LG account), then an on-TV toggle
          that permits second-screen pairing at all.
        steps:
          - action: "Power on the TV and complete the first-run wizard with the remote: language, then WiFi network and passphrase."
            actor: "user"
            expect: "TV reports a successful network connection."
          - action: "Enable second-screen control: Settings > Network > LG Connect Apps = On (older firmware: Settings > General > Mobile App; the name varies by webOS version)."
            actor: "user"
          - action: "Discover the TV by SSDP and open the control socket (ws://<ip>:3000, falling back to wss://<ip>:3001), then send the hello frame, a ssap://system/getSystemInfo request, and the register frame with pairingType PROMPT and no client-key (wire format per webos_common.handshake)."
            actor: "client"
            expect: "The TV shows an accept/decline prompt for the new device."
          - action: "Accept the pairing prompt on the TV screen."
            actor: "user"
            expect: "The socket delivers a second message of type registered whose payload carries the client-key."
          - action: "Store the client-key and include it in the register payload on every later connection."
            actor: "client"
            expect: "register answers immediately with no prompt."
    factory_reset:
      confidence: "medium"
      effect: "Clears network credentials, the LG account link, installed apps, the paired-device list (every issued client-key) and all settings; the TV returns to the first-run wizard."
      procedures:
        - name: "Menu factory reset"
          steps:
            - action: "Settings > All Settings > General > System > Reset to Initial Settings (menu path varies slightly by webOS version)."
              actor: "user"
              notes: "There is no recessed reset button on the TV; the menu path is the only documented procedure. To revoke one paired client without resetting, remove it from the TV's paired-device list under the LG Connect Apps / device-connection settings."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Settings > Network re-runs only the network step; pairing and
        client-keys survive a router change. A factory reset is never needed
        just to move networks.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "WiFi credentials"
        - "Paired-device list (issued client-keys)"
      issued_to_client:
        - "client-key — 32-hex pairing token returned in the registered message"
      notes: >
        The WiFi passphrase is typed on the TV itself, so no protocol here
        carries it. The secret that matters is the client-key: anything
        holding it has full control until it is revoked on the TV. First
        pairing cannot happen silently — the PROMPT pairing type requires a
        human at the screen — but an accepted client-key is bearer
        credentials from then on.

  # No variants block: this project observed no hardware, so there are no
  # per-model sightings to record. Known per-generation behaviour differences
  # (webOS 1.x pointer socket, ws vs wss enforcement, removed URIs) are noted
  # where they apply instead.

helpful_urls:
  - title: "aiowebostv — the WebSocket client Home Assistant ships (connect, pair, input socket)"
    url: "https://github.com/home-assistant-libs/aiowebostv"
  - title: "bscpylgtv — feature-complete CLI/library, including which firmware dropped which URI"
    url: "https://github.com/chros73/bscpylgtv"
  - title: "Connect SDK — LG's own open-source second-screen client (archived)"
    url: "https://github.com/ConnectSDK/Connect-SDK-Android"
  - title: "Home Assistant LG webOS TV integration"
    url: "https://www.home-assistant.io/integrations/webostv/"
  - title: "openHAB LG webOS binding — button vocabulary and TLS/WoL notes"
    url: "https://www.openhab.org/addons/bindings/lgwebos/"
  - title: "pylgtv — the original Python client (archived 2019); where the open implementations converge"
    url: "https://github.com/TheRealLink/pylgtv"

  - title: "LG webOS TV user manual"
    url: "https://www.manualslib.com/manual/1992790/Lg-Webos-Tv.html"
    kind: "manual"
    description: >
      Vendor manual for the webOS platform this spec's second-screen protocol belongs to.
  - title: "LG OLED TV owner's manual"
    url: "https://www.manualslib.com/manual/2052512/Lg-Oled-Tv.html"
    kind: "manual"
    description: >
      Owner's manual for the OLED sets. On-set, the guide is under All Settings, Support (or Customer Support), User Manual.
# Vendor-specific protocol detail this schema does not model. Namespaced so the
# top level can stay closed; nothing here is a declared contract.
protocol_details:
  # Everything needed to build an SSAP session byte for byte, in the role
  # ecp_common plays for Roku and soap_common for Wemo.
  webos_common:
    transport: "WebSocket"
    transport_gap: >
      NOT SUPPORTED by the reference app today: its command transports are
      "http" and "soap", and webOS control is two persistent WebSockets with a
      user-consent handshake between them. A client must implement RFC 6455
      (including TLS against the self-signed certificate on 3001, which late
      firmware requires), the hello / getSystemInfo / register sequence,
      capture and reuse of the client-key the TV returns only after the viewer
      accepts an on-screen prompt, and then a SECOND socket obtained from
      ssap://com.webos.service.networkinput/getPointerInputSocket carrying
      plain-text key:value frames rather than JSON — which is where every
      button in this catalogue is actually delivered.

      Recorded here so the gap is a documented fact with a shape rather than
      an absence a reader has to infer from commands that never fire. Samsung
      records the same thing at samsung_remote_common.transport_gap; the two
      TVs are waiting on one piece of consumer-side work.
    connection:
      description: >
        One TCP port, two spellings: ws://<ip>:3000 is the original listener
        and what older firmware expects; wss://<ip>:3001 is the TLS listener
        late firmware demands. aiowebostv's rule — try plain ws on 3000, and
        on connection refusal or a rejected upgrade fall back to wss on 3001 —
        is the one to copy. The 3001 certificate is self-signed; clients
        disable verification (aiowebostv passes ssl=False), so TLS here buys
        obfuscation, not authentication — authentication is the client-key.
        WebSocket-level ping/pong heartbeat (~5s) keeps the session up.
      url_plain: "ws://<ip>:3000"
      url_tls: "wss://<ip>:3001"
    handshake:
      description: >
        The first frames on a fresh socket, in aiowebostv's order. (1) hello:
        {"id":"hello","type":"hello","payload":{}} — the TV answers type
        "hello" with protocol metadata (and a deviceUUID). (2) A pre-
        registration ssap://system/getSystemInfo request, which newer webOS
        versions require before registration and older ones simply tolerate.
        (3) register: {"id":"register_0","type":"register","payload":{...}} —
        the payload below, plus "client-key": <stored key> once paired (null
        or absent before). With pairingType PROMPT and no valid key the TV
        shows an on-screen accept prompt; the register first answers type
        "response" echoing the pairingType, then — only if the user accepts —
        a second message of type "registered" whose payload carries the
        client-key. A declined or timed-out prompt answers type "error".
      register_payload:
        description: >
          The exact registration payload every open client sends (aiowebostv
          handshake.py, identical in ancestry to Connect SDK's). The `signed`
          block is boilerplate — the same static appId and RSA signature in
          every client since Connect SDK; the TV does not validate it against
          any store. The permissions list is what the TV enforces later: an
          SSAP call outside it answers "401 insufficient permissions".
        example: |
          {
            "forcePairing": false,
            "pairingType": "PROMPT",
            "manifest": {
              "manifestVersion": 1,
              "appVersion": "1.1",
              "permissions": [
                "LAUNCH", "LAUNCH_WEBAPP", "APP_TO_APP", "CLOSE",
                "TEST_OPEN", "TEST_PROTECTED", "CONTROL_AUDIO",
                "CONTROL_DISPLAY", "CONTROL_INPUT_JOYSTICK",
                "CONTROL_INPUT_MEDIA_RECORDING", "CONTROL_INPUT_MEDIA_PLAYBACK",
                "CONTROL_INPUT_TV", "CONTROL_POWER", "CONTROL_TV_SCREEN",
                "READ_APP_STATUS", "READ_CURRENT_CHANNEL",
                "READ_INPUT_DEVICE_LIST", "READ_NETWORK_STATE",
                "READ_RUNNING_APPS", "READ_TV_CHANNEL_LIST",
                "WRITE_NOTIFICATION_TOAST", "READ_POWER_STATE",
                "READ_COUNTRY_INFO", "CONTROL_INPUT_TEXT",
                "CONTROL_MOUSE_AND_KEYBOARD", "READ_INSTALLED_APPS",
                "READ_SETTINGS"
              ],
              "signed": {
                "appId": "com.lge.test",
                "created": "20140509",
                "vendorId": "com.lge",
                "localizedAppNames": {"": "LG Remote App"},
                "localizedVendorNames": {"": "LG Electronics"},
                "permissions": ["TEST_SECURE", "CONTROL_INPUT_TEXT", "..."],
                "serial": "2f930e2d2cfe083771f68e4fe7bb07"
              },
              "signatures": [{"signatureVersion": 1, "signature": "<static Connect SDK signature; copy from aiowebostv handshake.py>"}]
            }
          }
    request_format:
      description: >
        After registration, every command is one JSON text frame:
        {"id": <int>, "type": "request", "uri": "ssap://<service>/<method>",
        "payload": {...}}. id is a client-chosen integer that matches request
        to response; payload is {} when the URI takes no arguments. type is
        "subscribe" instead of "request" for live state — the TV then keeps
        pushing type "response" frames on the same id until "unsubscribe".
        In `commands` below, `action` is the uri (minus the ssap:// prefix's
        scheme — it is spelled in full anyway) and `arguments` is the payload.
      example: '{"id": 12, "type": "request", "uri": "ssap://audio/volumeUp", "payload": {}}'
    response_format:
      description: >
        Success: {"id": <same>, "type": "response", "payload": {"returnValue":
        true, ...}} with the result fields beside returnValue (volumeUp has
        none; listLaunchPoints adds "launchPoints": [{"id": "netflix",
        "title": "Netflix", ...}]). Failure: type "error" with an error
        string — "404 no such service or method" (URI absent on this
        firmware), "401 insufficient permissions" (outside the manifest),
        "500 Application error". Treat a missing URI as capability absent,
        not as connection failure.
    input_channel:
      description: >
        Remote-button presses do NOT go over SSAP. Request
        ssap://com.webos.service.networkinput/getPointerInputSocket on the
        main socket; the response payload's socketPath is a second WebSocket
        URL on the same ports. Open it and send plain-text frames (not JSON),
        key:value lines terminated by a blank line:
        'type:button\nname:HOME\n\n' for a button,
        'type:move\ndx:5\ndy:0\ndown:0\n\n' for pointer motion,
        'type:click\n\n' and 'type:scroll\ndx:0\ndy:-120\n\n' for the Magic
        Remote's pointer. Known button names (openHAB's list, compiled by
        trial across models): LEFT RIGHT UP DOWN ENTER (the OK button) BACK
        EXIT HOME INFO, the digits 0-9 spelled as themselves, RED GREEN
        YELLOW BLUE, PLAY PAUSE STOP. The socket is accepted but inert on the
        earliest webOS 1.x sets (2014-2015, UF series and earlier) — a
        firmware limitation, not a client bug; on those models only the SSAP
        commands work.
      button_frame_template: 'type:button\nname:{button}\n\n'
    power:
      off: "ssap://system/turnOff — a normal request frame; the TV drops the socket as it shuts down, so do not wait for the response."
      on: >
        There is no network power-on: ssap://system/turnOn is listed by
        bscpylgtv among the URIs firmware removed. Wake is Wake-on-LAN — a
        magic packet to the subnet broadcast — and it is gated on the TV:
        Settings > General > Mobile TV On > Turn On Via WiFi on 2017+
        models, Settings > Support > IP control settings > Wake on LAN on
        2025+ models; it works most reliably over Ethernet. Capture the MAC
        from the SSDP description or the TV's network info while it is on.

# The port marker, in the role lutron-caseta-smart-bridge's "LEAP Service
# Root" plays: the only HTTP this service speaks is the WebSocket upgrade
# GET. Do not catalogue SSAP URIs here as if they were paths — they are
# WebSocket message fields (webos_common.request_format), and a consumer
# that POSTed them would get nothing.
# The WebSocket control surface: where the sockets are, how a client is
# authorised, and how a command becomes a frame. Everything here is
# executable; webos_common above is why it looks like this.
#
# TWO channels, and that is the shape of this device rather than an
# abstraction for its own sake: SSAP requests are JSON on the main socket,
# and remote BUTTONS go to a second socket the TV hands out at runtime,
# carrying plain-text frames.
websocket:
  connect:
    # aiowebostv's rule: try plain ws on 3000, fall back to wss on 3001 when
    # the connection is refused or the upgrade rejected. Late firmware listens
    # on the TLS port only.
    port: 3000
    scheme: "ws"
    path: "/"
    fallback:
      port: 3001
      scheme: "wss"
      path: "/"
    tls:
      self_signed: true
      # aiowebostv passes ssl=False. Recorded as none because that is what
      # clients do: TLS here buys obfuscation, and what authenticates is the
      # client-key.
      verification: "none"
    heartbeat_seconds: 5
  pairing:
    mode: "register_frame"
    credential_name: "webos_client_key"
    issued_at: "payload.client-key"
    prompt_notes: >
      The TV shows an on-screen accept prompt on a first registration
      (pairingType PROMPT with no valid key). The register call answers first
      with a type "response" echoing the pairingType, and only after the
      viewer accepts does a second message of type "registered" carry the
      client-key. A declined or timed-out prompt answers type "error" — say
      "accept the pairing request on the TV", not "the network failed".
    # The payload every open client sends, verbatim except for the one value
    # this project has not recovered (see remaining_unknowns): the static
    # Connect SDK signature. `{credential}` is the stored client-key, absent
    # on a first pairing.
    register_frame:
      id: "register_0"
      type: "register"
      payload:
        forcePairing: false
        pairingType: "PROMPT"
        client-key: "{credential}"
        manifest:
          manifestVersion: 1
          appVersion: "1.1"
          permissions:
            - "LAUNCH"
            - "LAUNCH_WEBAPP"
            - "APP_TO_APP"
            - "CLOSE"
            - "TEST_OPEN"
            - "TEST_PROTECTED"
            - "CONTROL_AUDIO"
            - "CONTROL_DISPLAY"
            - "CONTROL_INPUT_JOYSTICK"
            - "CONTROL_INPUT_MEDIA_RECORDING"
            - "CONTROL_INPUT_MEDIA_PLAYBACK"
            - "CONTROL_INPUT_TV"
            - "CONTROL_POWER"
            - "CONTROL_TV_SCREEN"
            - "READ_APP_STATUS"
            - "READ_CURRENT_CHANNEL"
            - "READ_INPUT_DEVICE_LIST"
            - "READ_NETWORK_STATE"
            - "READ_RUNNING_APPS"
            - "READ_TV_CHANNEL_LIST"
            - "WRITE_NOTIFICATION_TOAST"
            - "READ_POWER_STATE"
            - "READ_COUNTRY_INFO"
            - "CONTROL_INPUT_TEXT"
            - "CONTROL_MOUSE_AND_KEYBOARD"
            - "READ_INSTALLED_APPS"
            - "READ_SETTINGS"
  channels:
    - name: "ssap"
      default: true
      encoding: "json"
      frame:
        id: "{request_id}"
        type: "request"
        uri: "{action}"
        payload: "{arguments}"
      description: >
        The main socket. `id` is a client-chosen integer matching request to
        response; payload is {} when the URI takes no arguments.
    - name: "pointer"
      encoding: "text"
      # Not JSON: key:value lines terminated by a blank line.
      frame_template: "type:button\nname:{action}\n\n"
      obtained_by: "get_pointer_socket"
      address_path: "payload.socketPath"
      description: >
        The remote-button socket, a SECOND WebSocket whose address the TV
        returns from get_pointer_socket. Accepted but inert on the earliest
        webOS 1.x sets (2014-2015): a firmware limitation, not a client bug,
        and on those models only the ssap channel works.

remaining_unknowns:
  - >
    The static Connect SDK signature in the registration manifest's
    `signatures[0].signature`. Every open client ships the same string and the
    TV is reported not to validate it against any store, but this project has
    not recovered the value and has not tested whether registration succeeds
    without the field — so `websocket.pairing.register_frame` omits
    `signatures` entirely rather than carrying a guess. Until that is settled,
    a client cannot complete a first pairing from this spec alone.
# One invocation per remote function, in the shape entities can bind. Every
# command is verification "reported" — the URIs and button names are what
# aiowebostv/bscpylgtv/openHAB ship against production TVs, but nothing here
# was replayed by this project.
#
# NONE OF THESE IS SENDABLE BY THIS PROJECT'S REFERENCE APP TODAY, and that is
# a separate statement from the verification grade above: "reported" says
# nobody here confirmed the command works, while this says nobody here can
# issue it at all. Every command omits `transport` and inherits
# device.transport "websocket", which the app does not implement — see
# webos_common.transport_gap for what a client has to build first. Until then
# a consumer must render these as documentation, not as controls. The entities
# block below states the same thing on its own side, Power included: nothing
# here is reachable yet, and the Power switch's one-way off is one-way for a
# firmware reason ON TOP of being unsendable for a transport reason.
#
# Two delivery channels, told apart by `action`:
#   action: "ssap://..."  — a request frame on the main socket
#                           (webos_common.request_format); `arguments` is
#                           the frame's payload.
#   action: "HOME" etc.   — a pointer-socket button name, sent as the
#                           text frame webos_common.input_channel describes;
#                           inert on webOS 1.x sets.
commands:
  # -- Power. Off is a network command; on is Wake-on-LAN and therefore has
  #    no entry here at all (webos_common.power.on).
  power_off:
    description: "Standby. The socket dies with the TV; don't wait for the reply."
    action: "ssap://system/turnOff"
    verification: "reported"
  screen_off:
    description: "Blank the panel but keep the TV running (audio keeps playing). webOS 4+; older sets used the removed com.webos.service.tv.power/turnOffScreen."
    action: "ssap://com.webos.service.tvpower/power/turnOffScreen"
    verification: "reported"
  screen_on:
    description: "Undo screen_off. webOS 4+, same caveat."
    action: "ssap://com.webos.service.tvpower/power/turnOnScreen"
    verification: "reported"

  # The pointer socket's own address comes from the main one. Declared as a
  # command rather than written into the channel block because it IS one: an
  # ordinary ssap request whose reply happens to carry an address.
  get_pointer_socket:
    description: "Ask for the remote-button socket's address; the reply's payload.socketPath is a second WebSocket URL on the same ports."
    action: "ssap://com.webos.service.networkinput/getPointerInputSocket"
    verification: "reported"

  # -- Navigation (pointer socket).
  press_back:
    description: "Back one screen."
    action: "BACK"
    channel: "pointer"
    verification: "reported"
  press_home:
    description: "Home / launcher."
    action: "HOME"
    channel: "pointer"
    verification: "reported"
  press_exit:
    description: "Exit — leave the current app/overlay."
    action: "EXIT"
    channel: "pointer"
    verification: "reported"
  press_up:
    description: "D-pad up."
    action: "UP"
    channel: "pointer"
    verification: "reported"
  press_down:
    description: "D-pad down."
    action: "DOWN"
    channel: "pointer"
    verification: "reported"
  press_left:
    description: "D-pad left."
    action: "LEFT"
    channel: "pointer"
    verification: "reported"
  press_right:
    description: "D-pad right."
    action: "RIGHT"
    channel: "pointer"
    verification: "reported"
  press_ok:
    description: "OK — activate the focused item. The wire name is ENTER; there is no separate OK."
    action: "ENTER"
    channel: "pointer"
    verification: "reported"
  press_info:
    description: "Info — details for the focused item/channel."
    action: "INFO"
    channel: "pointer"
    verification: "reported"
  # Digit buttons exist too: the name is the digit itself ("0".."9"), same
  # frame — documented once in webos_common.input_channel rather than as
  # ten commands, exactly as Roku's Lit_ keys are.

  # -- Playback transport (SSAP; these act on the foreground app's media).
  media_play:
    description: "Play."
    action: "ssap://media.controls/play"
    verification: "reported"
  media_pause:
    description: "Pause."
    action: "ssap://media.controls/pause"
    verification: "reported"
  media_stop:
    description: "Stop."
    action: "ssap://media.controls/stop"
    verification: "reported"
  media_rewind:
    description: "Rewind."
    action: "ssap://media.controls/rewind"
    verification: "reported"
  media_fast_forward:
    description: "Fast-forward."
    action: "ssap://media.controls/fastForward"
    verification: "reported"

  # -- Volume (SSAP). Absolute set only works against the internal speakers
  #    — with an external amp/ARC, use the step commands (openHAB's note).
  volume_up:
    description: "Volume up one step."
    action: "ssap://audio/volumeUp"
    verification: "reported"
  volume_down:
    description: "Volume down one step."
    action: "ssap://audio/volumeDown"
    verification: "reported"
  set_volume:
    description: "Set absolute volume (internal speakers only)."
    action: "ssap://audio/setVolume"
    arguments:
      volume: "{volume}"
    parameters:
      volume:
        type: "integer"
        required: true
        min: 0
        max: 100
        description: "Percent of the TV's volume scale."
    verification: "reported"
  mute_on:
    description: "Mute. setMute takes an explicit bool, so on and off are separate commands; a toggle reads ssap://audio/getStatus first."
    action: "ssap://audio/setMute"
    arguments:
      mute: true
    verification: "reported"
  mute_off:
    description: "Unmute."
    action: "ssap://audio/setMute"
    arguments:
      mute: false
    verification: "reported"

  # -- Live TV (tuner input active).
  channel_up:
    description: "Next channel in the current channel list."
    action: "ssap://tv/channelUp"
    verification: "reported"
  channel_down:
    description: "Previous channel."
    action: "ssap://tv/channelDown"
    verification: "reported"
  open_channel:
    description: "Tune a channel by id. Ids come from ssap://tv/getChannelList; the current channel from ssap://tv/getCurrentChannel."
    action: "ssap://tv/openChannel"
    arguments:
      channelId: "{channel_id}"
    parameters:
      channel_id:
        type: "string"
        required: true
        description: "channelId from the channel list — opaque, not the channel number."
    verification: "reported"

  # -- Inputs. The external-input list is ssap://tv/getExternalInputList
  #    (response field "devices", each with an "appId" such as
  #    com.webos.app.hdmi1); note inputs are also just apps — launching
  #    com.webos.app.hdmi2 via launch_app switches to it too.
  set_input:
    description: "Switch input by appId."
    action: "ssap://tv/switchInput"
    arguments:
      inputId: "{input_id}"
    parameters:
      input_id:
        type: "string"
        required: true
        description: "appId from getExternalInputList, e.g. \"com.webos.app.hdmi1\"."
    verification: "reported"

  # -- Apps. listLaunchPoints is the launcher-visible list; listApps adds
  #    hidden apps. Foreground app: getForegroundAppInfo (field appId).
  launch_app:
    description: "Launch an installed app by id. Optional payload keys params (object) and contentId (string) deep-link into the app."
    action: "ssap://system.launcher/launch"
    arguments:
      id: "{app_id}"
    parameters:
      app_id:
        type: "string"
        required: true
        description: "id from listLaunchPoints/listApps, e.g. \"netflix\", \"youtube.leanback.v4\", \"com.webos.app.livetv\"."
    verification: "reported"
  close_app:
    description: "Close a running app by id."
    action: "ssap://system.launcher/close"
    arguments:
      id: "{app_id}"
    parameters:
      app_id:
        type: "string"
        required: true
        description: "id of a running app."
    verification: "reported"

  # -- Notifications.
  show_toast:
    description: "Pop a short text message on screen. Optional payload keys iconData/iconExtension attach a base64 icon, which newer firmware silently ignores."
    action: "ssap://system.notifications/createToast"
    arguments:
      message: "{message}"
    parameters:
      message:
        type: "string"
        required: true
        description: "The toast text."
    verification: "reported"

  # -- Text input into focused fields (e.g. a search box): SSAP, not the
  #    pointer socket.
  insert_text:
    description: "Type text into the focused field, replacing the selection."
    action: "ssap://com.webos.service.ime/insertText"
    arguments:
      text: "{text}"
    parameters:
      text:
        type: "string"
        required: true
        description: "UTF-8 text to insert."
    verification: "reported"
  send_enter_key:
    description: "Commit/dismiss the on-screen keyboard."
    action: "ssap://com.webos.service.ime/sendEnterKey"
    verification: "reported"

# The remote, as controls. Declaration order is layout order — power, then
# navigation, transport, volume, live TV, inputs and apps. Buttons bound to
# pointer-socket names say so; they are inert on webOS 1.x (2014-2015)
# hardware (webos_common.input_channel), and every control here awaits a
# WebSocket transport in the consumer (device.notes).
entities:
  # The stateful Power control (spec-evolution P13). Off only:
  # ssap://system/turnOn left the firmware years ago, and the socket is down
  # in standby, so power-on is Wake-on-LAN — which this file has no
  # vocabulary for. No power state is readable; an unreachable socket is the
  # closest thing to "off" webOS offers.
  - platform: "switch"
    name: "Power"
    key: "power"
    icon: "mdi:power"
    commands:
      turn_off: "power_off"
    notes: >
      Off only, and there is no turn_on to add: ssap://system/turnOn left the
      firmware years ago, and the WebSocket is down in standby, so power-on is
      Wake-on-LAN — which this file has no vocabulary for. No power state is
      readable either; an unreachable socket is the closest thing to "off"
      webOS offers. A consumer should render this as a one-way off, not as a
      switch whose on side is broken.
  - platform: "button"
    name: "Power Off"
    key: "power_off"
    icon: "mdi:power"
    commands:
      press: "power_off"
    notes: "Power-on is Wake-on-LAN, not a button this file can offer."
  - platform: "button"
    name: "Screen Off"
    icon: "mdi:television-off"
    commands:
      press: "screen_off"
    notes: "webOS 4+."
  - platform: "button"
    name: "Screen On"
    icon: "mdi:television"
    commands:
      press: "screen_on"
    notes: "webOS 4+."
  - platform: "button"
    name: "Back"
    key: "back"
    icon: "mdi:arrow-u-left-top"
    commands:
      press: "press_back"
    notes: "Pointer-socket button."
  - platform: "button"
    name: "Home"
    key: "home"
    icon: "mdi:home"
    commands:
      press: "press_home"
    notes: "Pointer-socket button."
  - platform: "button"
    name: "Exit"
    key: "exit"
    icon: "mdi:close"
    commands:
      press: "press_exit"
    notes: "Pointer-socket button."
  - platform: "button"
    name: "Up"
    key: "up"
    icon: "mdi:chevron-up"
    commands:
      press: "press_up"
    notes: "Pointer-socket button."
  - platform: "button"
    name: "Left"
    key: "left"
    icon: "mdi:chevron-left"
    commands:
      press: "press_left"
    notes: "Pointer-socket button."
  - platform: "button"
    name: "OK"
    key: "ok"
    commands:
      press: "press_ok"
    notes: "Pointer-socket button; the wire name is ENTER."
  - platform: "button"
    name: "Right"
    key: "right"
    icon: "mdi:chevron-right"
    commands:
      press: "press_right"
    notes: "Pointer-socket button."
  - platform: "button"
    name: "Down"
    key: "down"
    icon: "mdi:chevron-down"
    commands:
      press: "press_down"
    notes: "Pointer-socket button."
  - platform: "button"
    name: "Info"
    key: "info"
    icon: "mdi:information-outline"
    commands:
      press: "press_info"
    notes: "Pointer-socket button."
  - platform: "button"
    name: "Rewind"
    key: "rewind"
    icon: "mdi:rewind"
    commands:
      press: "media_rewind"
  - platform: "button"
    name: "Play"
    icon: "mdi:play"
    commands:
      press: "media_play"
  - platform: "button"
    name: "Pause"
    icon: "mdi:pause"
    commands:
      press: "media_pause"
  - platform: "button"
    name: "Stop"
    icon: "mdi:stop"
    commands:
      press: "media_stop"
  - platform: "button"
    name: "Fast Forward"
    key: "fast_forward"
    icon: "mdi:fast-forward"
    commands:
      press: "media_fast_forward"
  - platform: "button"
    name: "Volume Down"
    key: "volume_down"
    icon: "mdi:volume-minus"
    commands:
      press: "volume_down"
  - platform: "button"
    name: "Volume Up"
    key: "volume_up"
    icon: "mdi:volume-plus"
    commands:
      press: "volume_up"
  - platform: "switch"
    name: "Mute"
    key: "mute"
    icon: "mdi:volume-mute"
    commands:
      turn_on: "mute_on"
      turn_off: "mute_off"
    state_topic: "ssap://audio/getStatus"
    notes: "State field 'mute' (bool); subscribable."
  - platform: "number"
    name: "Volume"
    icon: "mdi:volume-high"
    min: 0
    max: 100
    step: 1
    commands:
      set_value: "set_volume"
    state_topic: "ssap://audio/getVolume"
    notes: "Internal speakers only; with external audio, use the step buttons."
  - platform: "button"
    name: "Channel Up"
    key: "channel_up"
    icon: "mdi:chevron-double-up"
    commands:
      press: "channel_up"
    notes: "Tuner input."
  - platform: "button"
    name: "Channel Down"
    key: "channel_down"
    icon: "mdi:chevron-double-down"
    commands:
      press: "channel_down"
    notes: "Tuner input."
  - platform: "select"
    name: "Input"
    icon: "mdi:video-input-hdmi"
    commands:
      select_option: "set_input"
    notes: >
      Options come from ssap://tv/getExternalInputList (field "devices",
      appId per input); the current input is the foreground app
      (getForegroundAppInfo) when it is a com.webos.app.* input app. Both
      reads are SSAP queries, so this picker awaits the WebSocket transport
      like everything else here.
  - platform: "select"
    name: "App"
    icon: "mdi:apps"
    commands:
      select_option: "launch_app"
    notes: >
      Options come from ssap://com.webos.applicationManager/listLaunchPoints
      (field "launchPoints", id/title per app; listApps adds hidden apps),
      current selection from getForegroundAppInfo.appId. Selecting an option
      IS launching it.
  - platform: "sensor"
    name: "Foreground App"
    state_topic: "ssap://com.webos.applicationManager/getForegroundAppInfo"
    notes: "appId of the foreground app; also the Live TV tell (com.webos.app.livetv)."
  - platform: "sensor"
    name: "Current Channel"
    state_topic: "ssap://tv/getCurrentChannel"
    notes: "Meaningful only while Live TV is foreground."
