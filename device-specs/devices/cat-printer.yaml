# Cat Printer mini thermal printer (GB01/GB02/GB03/GT01/YT01/MX05-10)
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Cat Printer Mini Thermal Printer"
  manufacturer: "Unbranded / Yu Tian (YT01) / various OEMs"
  manufacturer_status: "unsupported"
  testing:
    status: untested
  protocol: "ble"
  category: "printer"
  notes: >
    Cat-shaped (and other shaped) mini thermal printers sold under many
    names: GB01, GB02, GB03, GT01, YT01, MX05, MX06, MX08, MX09, MX10,
    MX11, PD01, SC03h, MXTP. All share the same BLE UART protocol. $15-20.
    No cloud dependency — fully local BLE. The stock vendor app is iPrint
    (com.frogtosea.iprint); its device filter hardcodes GB04 and GT02 in
    addition to the list above — neither is in NaitLee's model registry
    nor verified against hardware.

    PROTOCOL: uses a custom BLE UART service (0xAE30) with TX/RX
    characteristics (0xAE01/0xAE02). Command frames have a fixed header:
    [0x51 0x78 command_id 0x00 payload_length 0x00] [payload] [crc8] [0xFF].
    CRC8 is CRC-8/SMBUS (poly 0x07, init 0x00, no reflection), computed
    over the payload bytes only, via a 256-entry lookup table.
    Responses and flow-control signals arrive as notifications on 0xAE02.
    macOS quirk: CoreBluetooth sometimes surfaces the service as 0xAF30
    instead of 0xAE30 — tolerate both on Apple platforms (rbaron).

    COMMANDS: 0xA0 retract_paper (uint16 LE pixel count), 0xA1 feed_paper
    (uint16 LE pixel count), 0xA2 draw_bitmap, 0xA3 get_device_state,
    0xA4 set_dpi_as_200, 0xA6 lattice markers (see below), 0xA8
    get_device_info (payload 0x00), 0xA9 update_device, 0xAF set_energy,
    0xBD set_speed, 0xBE apply_energy, 0xBF RLE rows (new-kind models).
    Lattice marker fixed payloads (command 0xA6): start = AA 55 17 38 44
    5F 5F 5F 44 38 2C, end = AA 55 17 00 00 00 00 00 00 00 17.

    MODEL FLAGS:
      is_new_kind: GB03 supports compressed data (send 0x12 prefix before
        start-printing command).
      problem_feeding: MX05/MX06/MX08/MX09/MX10 don't handle feed commands
        correctly — use draw_bitmap of blank lines instead.
      paper_width: 384 pixels (48 bytes per row) for all known models.

    PRINTING SEQUENCE:
      1. get_device_state (0xA3) — refresh device state
      2. start_printing (0xA3 0x00 0x01) or start_printing_new (prefixed 0x12)
      3. set_dpi_as_200 (0xA4) — send value 50
      4. set_speed (0xBD) — lower = faster feed, default 32
      5. set_energy (0xAF) — thermal strength, 0x0000-0xFFFF, default ~0x3000
      6. apply_energy (0xBE) — commit energy setting
      7. update_device (0xA9) — apply config
      8. start_lattice (0xA6) — begin print area with marker pattern
      9. draw_bitmap (0xA2) — send row data (48 bytes per row, bits reversed)
      10. end_lattice (0xA6) — end print area
      11. set_speed(8) + feed_paper(128) or blank bitmap workaround
      12. get_device_state

    FLOW CONTROL: device sends pause (0x51 0x78 0xAE 0x01 0x01 0x00 0x10
    0x70 0xFF) and resume (0x51 0x78 0xAE 0x01 0x01 0x00 0x00 0x00 0xFF)
    notifications on 0xAE02. Client must honour pause by waiting.

    BIT REVERSAL: each byte of bitmap data written to draw_bitmap is
    bit-reversed (MSB↔LSB) before transmission. The reverse_bits function
    is applied client-side.

    RLE ROWS (0xBF): the "new kind" compression the is_new_kind flag
    alludes to is per-row RLE — each byte packs a 7-bit run count and a
    1-bit color, runs longer than 0x7F are split — sent as command 0xBF,
    falling back to uncompressed draw_bitmap (0xA2) when the RLE row
    exceeds 48 bytes (implemented in rbaron/catprinter; NaitLee only
    stubs it). Undocumented commands 0xBB (iPrint pre-print frame) and
    0xBC (thermy) have also been observed; purpose unknown.

    CONFIDENCE: HIGH for all UUIDs, frame format, CRC8 algorithm, command
    IDs, model flags, printing sequence, and flow control — sourced from
    github.com/NaitLee/Cat-Printer, a production-quality Python tool with
    cross-platform support (Linux, macOS, Windows, Android, Web). The
    0xAE3A secondary service, 0xBF RLE rows and the 0xBB/0xBC sightings
    come from independent corroborating sources: lisp3r's GT01 captures,
    rbaron/catprinter, mazoqui/thermy and the vendor iPrint APK.

  identification:
    local_name_prefix: "GB"
    service_uuids:
      - "0000ae30-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "GB"
          service_uuids:
            - "0000ae30-0000-1000-8000-00805f9b34fb"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning. Device advertises as soon as powered on. Scan for
      names matching GB01/GB02/GB03/GT01/YT01/MX05 etc. or service UUID
      0xAE30. No pairing or bonding required.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Scan for GB*/GT*/YT*/MX* BLE advertisement with service UUID 0xAE30,
          connect, and follow the printing sequence.
        ble:
          pairing_required: false
        steps:
          - action: "Power the printer and scan for its advertisement."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect and execute the documented printing sequence."
            actor: "client"
    factory_reset:
      confidence: "high"
      effect: "No credential state. Power-cycling resets the connection."
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Turn printer off and on again."
              actor: "user"
              expect: "Printer powers on and advertises."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "No persistent bonding. Any central within range can connect."
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: "BLE-only. No auth. Physical proximity is the only access control."

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
  variants:
    - model: "GB01"
      identification:
        local_name_prefix: "GB01"
    - model: "GB02"
      identification:
        local_name_prefix: "GB02"
    - model: "GB03"
      identification:
        local_name_prefix: "GB03"
      notes: "Supports compressed data. Use start_printing_new (0x12 prefix)."
    - model: "GT01"
      identification:
        local_name_prefix: "GT01"
    - model: "YT01"
      identification:
        local_name_prefix: "YT01"
    - model: "MX05"
      identification:
        local_name_prefix: "MX05"
      notes: "problem_feeding — use blank bitmap workaround instead of feed_paper."
    - model: "MX06"
      identification:
        local_name_prefix: "MX06"
      notes: "problem_feeding."
    - model: "MX08"
      identification:
        local_name_prefix: "MX08"
      notes: "problem_feeding."
    - model: "MX09"
      identification:
        local_name_prefix: "MX09"
      notes: "problem_feeding."
    - model: "MX10"
      identification:
        local_name_prefix: "MX10"
      notes: "problem_feeding."
    - model: "MX11"
      identification:
        local_name_prefix: "MX11"
    - model: "PD01"
      identification:
        local_name_prefix: "PD01"
    - model: "SC03h"
      identification:
        local_name_prefix: "SC03h"
    - model: "MXTP"
      identification:
        local_name_prefix: "MXTP"

features:
  - type: "image_upload"
    max_width: 384
    max_height: 65535
    format: "1bit-bitmap"
    # 1 bit per pixel: the thermal head is on or off. Stated so an editor
    # quantizes to two colours, not to another device's 16-colour ceiling.
    max_palette_colors: 2
  # The upload IS the device: the commands below put rows on paper and
  # resolve no entities. A consumer keeps the printer on this marker instead
  # of dropping it as empty; image_upload above describes the bitmap it takes.
  - type: "raster_print"

protocol_handler: "cat_printer"

services:
  - uuid: "0000ae30-0000-1000-8000-00805f9b34fb"
    name: "Cat Printer UART Service"
    notes: >
      Custom BLE UART service for command/response communication and bulk
      data transfer. Additional characteristics 0xAE03 (write data),
      0xAE04 (notify), 0xAE05 (indicate), 0xAE10 (read/write) exist but
      are not used by the main printing protocol.

      COMMAND FRAME: [0x51 0x78 cmd_id 0x00 payload_len 0x00] [payload] [crc8(payload)] [0xFF]
      CRC8 is CRC-8/SMBUS (poly 0x07, init 0x00) over the payload only,
      via a 256-entry lookup table. Payload length is 1 byte (max 255).

      FLOW CONTROL: device sends pause/resume on 0xAE02 (notify).
      Pause:   0x51 0x78 0xAE 0x01 0x01 0x00 0x10 0x70 0xFF
      Resume:  0x51 0x78 0xAE 0x01 0x01 0x00 0x00 0x00 0xFF
    characteristics:
      - uuid: "0000ae01-0000-1000-8000-00805f9b34fb"
        name: "TX (Client → Printer)"
        properties: ["write", "write_without_response"]
        role: "command"
        notes: >
          Write channel for commands and bitmap data. Bitmap rows are 48 bytes
          (384 pixels / 8) with bits reversed before transmission.
          Every command below is one complete frame,
          [0x51 0x78 cmd 0x00 len 0x00][payload][crc8][0xFF], with the CRC-8
          (poly 0x07, init 0x00, no reflection — `auto: crc8` over the payload,
          `checksum_start: 6`) already in the bytes: the fixed-payload commands
          carry it precomputed in `value`, the parameterised ones compute it.
          Byte values are transcribed from NaitLee/Cat-Printer
          (printer_lib/commander.py) and cross-checked against rbaron/catprinter
          and lisp3r's GT01 captures — `reported`, not run by this project.
          The printing sequence in device.notes names these commands in order;
          honour the pause/resume notifications on 0xAE02 between draw_bitmap
          writes. Not declared as a command: the 0xBF RLE row (rbaron), whose
          payload length varies per row and so needs a payload-length role the
          parameter vocabulary does not have — fall back to draw_bitmap.
        commands:
          get_device_state:
            description: >
              0xA3 with payload 0x00 — refresh device state / apply config;
              step 1 and step 12 of the printing sequence. NaitLee's
              start_printing sends this identical frame (step 2), so one
              command serves both; lisp3r's GT01 capture shows the same bytes
              on the wire.
            verification: "reported"
            value: [0x51, 0x78, 0xA3, 0x00, 0x01, 0x00, 0x00, 0x00, 0xFF]
          start_printing_new:
            description: >
              The is_new_kind (GB03) start-printing frame: a single 0x12 byte
              prefixed to the get_device_state frame. Send instead of the
              plain frame at step 2 on models flagged is_new_kind.
            verification: "reported"
            value: [0x12, 0x51, 0x78, 0xA3, 0x00, 0x01, 0x00, 0x00, 0x00, 0xFF]
          get_device_info:
            description: "0xA8 with payload 0x00 — device info query; reply arrives on 0xAE02 (lisp3r capture 51 78 a8 00 01 00 00 00 ff)."
            verification: "reported"
            value: [0x51, 0x78, 0xA8, 0x00, 0x01, 0x00, 0x00, 0x00, 0xFF]
          set_dpi_as_200:
            description: "0xA4 with the fixed value 50 (0x32) — step 3 of the printing sequence. Purpose beyond 'set 200 dpi' unknown; every client sends exactly this."
            verification: "reported"
            value: [0x51, 0x78, 0xA4, 0x00, 0x01, 0x00, 0x32, 0x9E, 0xFF]
          set_speed:
            description: >
              0xBD — feed/retract speed, ONE byte, lower = faster. Default 32
              for printing (step 4); the sequence's finish sends 8 before
              feed_paper. Values below 4 stall the feed on NaitLee's unit.
              Speed also affects print quality (heat time).
            verification: "reported"
            template: [0x51, 0x78, 0xBD, 0x00, 0x01, 0x00, "{speed}", "{crc}", 0xFF]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
                default: 32
                description: "Feed speed byte; lower is quicker. 32 is the print default, 8 the post-print feed value."
              crc:
                type: "uint8"
                auto: "crc8"
                checksum_start: 6
                description: "CRC-8 (poly 0x07) over the payload byte; encoder-filled."
          set_energy:
            description: >
              0xAF — thermal energy (darkness) as a uint16, 0x0000-0xFFFF,
              LITTLE-endian as NaitLee sends it (int_to_bytes low byte first;
              WerWolv's decompile of the vendor app shows low byte first too).
              rbaron sends the two bytes big-endian and reports it works —
              energy is a threshold, so a swapped value is merely a different
              darkness, not an error. The device-side default is about 0x3000;
              NaitLee's CLI defaults to 0x4000 for images and 0x6000 for text.
              Step 5 of the sequence; follow with apply_energy.
            verification: "reported"
            template: [0x51, 0x78, 0xAF, 0x00, 0x02, 0x00, "{energy}", "{crc}", 0xFF]
            parameters:
              energy:
                type: "uint16"
                endianness: "little"
                min: 0
                max: 65535
                default: 12288
                description: "Thermal energy, 0-65535; 12288 (0x3000) is the device default, higher is darker."
              crc:
                type: "uint8"
                auto: "crc8"
                checksum_start: 6
                description: "CRC-8 (poly 0x07) over the two energy bytes; encoder-filled."
          apply_energy:
            description: "0xBE with payload 0x01 — commit the energy set by set_energy (step 6). The payload byte is 0x01, not 0x00 (NaitLee commander.py)."
            verification: "reported"
            value: [0x51, 0x78, 0xBE, 0x00, 0x01, 0x00, 0x01, 0x07, 0xFF]
          update_device:
            description: "0xA9 with payload 0x00 — apply the configuration sent so far (step 7)."
            verification: "reported"
            value: [0x51, 0x78, 0xA9, 0x00, 0x01, 0x00, 0x00, 0x00, 0xFF]
          start_lattice:
            description: "0xA6 with the fixed 11-byte start marker AA 55 17 38 44 5F 5F 5F 44 38 2C — opens the print area (step 8)."
            verification: "reported"
            value: [0x51, 0x78, 0xA6, 0x00, 0x0B, 0x00, 0xAA, 0x55, 0x17, 0x38, 0x44, 0x5F, 0x5F, 0x5F, 0x44, 0x38, 0x2C, 0xA1, 0xFF]
          end_lattice:
            description: "0xA6 with the fixed 11-byte end marker AA 55 17 00 00 00 00 00 00 00 17 — closes the print area (step 10)."
            verification: "reported"
            value: [0x51, 0x78, 0xA6, 0x00, 0x0B, 0x00, 0xAA, 0x55, 0x17, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x17, 0x11, 0xFF]
          draw_bitmap:
            description: >
              0xA2 — one 384-pixel row, 48 bytes, 1 = black, sent AFTER
              bit-reversing each byte (MSB<->LSB): `row` is the wire bytes,
              so the caller reverses. One row per frame (length byte 0x30) is
              what NaitLee sends; the frame format allows up to 255 payload
              bytes and rbaron packs several rows per write, which this
              template does not express. Wait on a pause notification from
              0xAE02 before the next row (step 9). On problem_feeding models
              (MX05-MX10) 128 blank rows through this command replace
              feed_paper.
            verification: "reported"
            template: [0x51, 0x78, 0xA2, 0x00, 0x30, 0x00, "{row}", "{crc}", 0xFF]
            parameters:
              row:
                type: "bytes"
                min_length: 48
                max_length: 48
                description: "48 bytes = 384 pixels, each byte already bit-reversed, 1 = black."
              crc:
                type: "uint8"
                auto: "crc8"
                checksum_start: 6
                description: "CRC-8 (poly 0x07) over the 48 row bytes; encoder-filled."
          feed_paper:
            description: "0xA1 — feed the paper forward by a uint16 LITTLE-endian count of pixel rows (step 11 sends 128 after set_speed 8). Misbehaves on problem_feeding models; use blank draw_bitmap rows there."
            verification: "reported"
            template: [0x51, 0x78, 0xA1, 0x00, 0x02, 0x00, "{rows}", "{crc}", 0xFF]
            parameters:
              rows:
                type: "uint16"
                endianness: "little"
                min: 0
                max: 65535
                default: 128
                description: "Pixel rows to feed; 128 is the post-print value in the reference sequence."
              crc:
                type: "uint8"
                auto: "crc8"
                checksum_start: 6
                description: "CRC-8 (poly 0x07) over the two count bytes; encoder-filled."
          retract_paper:
            description: "0xA0 — retract the paper by a uint16 LITTLE-endian count of pixel rows."
            verification: "reported"
            template: [0x51, 0x78, 0xA0, 0x00, 0x02, 0x00, "{rows}", "{crc}", 0xFF]
            parameters:
              rows:
                type: "uint16"
                endianness: "little"
                min: 0
                max: 65535
                default: 0
                description: "Pixel rows to retract."
              crc:
                type: "uint8"
                auto: "crc8"
                checksum_start: 6
                description: "CRC-8 (poly 0x07) over the two count bytes; encoder-filled."

      - uuid: "0000ae02-0000-1000-8000-00805f9b34fb"
        name: "RX (Printer → Client)"
        properties: ["notify"]
        role: "notify"
        notes: >
          Notification channel for flow-control signals (pause/resume) and
          responses. Subscribe to notifications before sending commands.

  - uuid: "0000ae3a-0000-1000-8000-00805f9b34fb"
    name: "Secondary Service (GT01)"
    notes: >
      Second BLE service observed on a GT01 (lisp3r's service dump).
      Purpose unknown — possibly config or OTA. Not used by the main
      printing protocol.
    characteristics:
      - uuid: "0000ae3b-0000-1000-8000-00805f9b34fb"
        name: "AE3B"
        properties: ["write_without_response"]
      - uuid: "0000ae3c-0000-1000-8000-00805f9b34fb"
        name: "AE3C"
        properties: ["notify"]

entities:
  - platform: "cover"
    name: "Print Feed"
    state_characteristic: "0000ae02-0000-1000-8000-00805f9b34fb"

remaining_unknowns:
  - "set_energy byte order is declared little-endian on NaitLee's authority (and WerWolv's decompile); rbaron sends big-endian and also prints. Nobody has compared the two on one unit at a fixed darkness, so which the firmware actually reads is unresolved — a threshold value swaps silently rather than failing."
  - "The 0xBF run-length row (rbaron) is not declared as a command: its payload length varies per row and the parameter vocabulary has no payload-length role, only a whole-packet one."
  - "None of the command bytes has been run against hardware by this project; every `verification: reported` rests on the open-source clients and captures named in the TX characteristic notes."

helpful_urls:
  - title: "NaitLee/Cat-Printer"
    url: "https://github.com/NaitLee/Cat-Printer"
    description: >-
      Production-quality Python tool with its own model registry; the primary implementation this
      spec's command set was checked against.
  - title: "rbaron/catprinter"
    url: "https://github.com/rbaron/catprinter"
    description: >-
      Second independent Python implementation. Source of the chunking behaviour for payloads over
      48 bytes and of the alternate 0xAE30 characteristic seen on Apple platforms.
  - title: "lisp3r/bluetooth-thermal-printer"
    url: "https://github.com/lisp3r/bluetooth-thermal-printer"
    description: >-
      GT01 captures and a service dump; the corroborating source for the second BLE service this
      spec records.
  - title: "WerWolv/PythonCatPrinter"
    url: "https://github.com/WerWolv/PythonCatPrinter"
    description: "Another independent Python client for the same printer family."
  - title: "WerWolv: cat printer write-up"
    url: "https://werwolv.net/blog/cat_printer"
    description: "Blog account of the reverse engineering behind that client."

  - title: "PeriPage A6 mini thermal printer manual (Internet Archive)"
    url: "https://web.archive.org/web/20220427083018/https://manuals.plus/peripage/a6-mini-portable-thermal-printer-manual"
    kind: "manual"
    description: >
      Manual for a PeriPage sibling of the cat-printer hardware. Archived because the live host refuses automated requests.
