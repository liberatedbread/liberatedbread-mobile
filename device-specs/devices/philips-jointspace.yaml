# The remote, as controls. Declaration order is layout order — power, then
# navigation and D-pad, transport, volume, channel stepping, digits, colour
# keys, then TV functions — the order the keys sit in the official Philips
# remote apps. Every button is an instance of Send Key; per the transport
# gaps recorded in jointspace_common, none of these renders into a working
# control in the reference app until its HTTP transport can send a JSON body
# (and, on 2016+ models, digest auth over HTTPS).
entities:
  - platform: "button"
    name: "Standby"
    icon: "mdi:power-standby"
    commands:
      press: "press_standby"
  - platform: "button"
    name: "Power On"
    icon: "mdi:power"
    commands:
      press: "press_power_on"
    notes: "Only reaches a TV still listening on the network; see commands.press_power_on."
