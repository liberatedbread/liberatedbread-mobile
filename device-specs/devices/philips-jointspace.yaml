  # State surfaces. Plain GETs with no body, so these are the closest thing
  # here to what the reference app could already read on an OPEN (pre-2016)
  # model — on secured models they still need HTTPS + digest auth, and the
  # payloads are JSON rather than the XML the app's state parsing expects.
  # Recorded for consumers that can parse them.
  - platform: "sensor"
    name: "Power State"
    state_topic: "/{api_version}/powerstate"
    notes: "v6 only, and absent on some firmwares; JSON {\"powerstate\": \"On\"}."
  - platform: "sensor"
    name: "Volume"
    state_topic: "/{api_version}/audio/volume"
    notes: "JSON {min, max, current, muted}; device-scale integers, not percent."
  - platform: "sensor"
    name: "Current Channel"
    state_topic: "/{api_version}/activities/tv"
    notes: "v5+; channel.name plus ccid. On v1 the path is /1/channels/current."
  - platform: "sensor"
    name: "Current Application"
    state_topic: "/{api_version}/activities/current"
    notes: "v6 Android only; an intent object. Broadcast TV reports the PlayTvActivity component, not null."
