device:
  name: "NIU Electric Scooter"
  manufacturer: "Niu Technologies"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "wifi"
  category: "vehicle"
  notes: >
    CLOUD-ONLY. This spec exists to record a dependency, not to offer a control
    surface. The scooter reports over cellular to NIU's servers; the app
    (com.niu.manager) authenticates against NIU's account service and reads
    everything back from those servers. There is no documented local path.

    `cloud.required: true` is the point of this entry. Every documented
    function stops working if NIU retires the service or closes the account --
    no local fallback exists, so a consumer should present this device as
    vendor-tethered rather than quietly offering endpoints that will one day
    return 404.

    LOCAL PATH: `local_access.status` is `replacement_hardware`, and the
    "covers" / "not_covered" split matters more than the headline. Aftermarket
    Bluetooth controllers exist for these scooters, but they replace the MOTOR
    CONTROLLER and give a local BLE link for DRIVE PARAMETERS only. The vendor
    explicitly advertises that the NIU app, dashboard, GPS and alarm keep
    working -- which is another way of saying the cloud stack is untouched.
    Fitting one does not free the scooter; it frees the throttle map.

    STOCK BLE LINK (app-confirmed 2026-08 from a com.niu.manager decompile;
    NOT hardware-tested): the open question above is answered -- the
    proximity BLE link is a full AES-encrypted local control channel, not a
    mere unlock handshake. Frames are hex on the wire: 0x5AA5 header,
    16-bit length, command, data, 8-bit sum checksum, 0x96 tail
    (blesdk/ble/n0.java:271-279). Payloads are AES-128-ECB encrypted under
    per-vehicle keys (blesdk/ble/c0.java:496, AES key and block both 16
    bytes per blesdk/ble/n0.java:756-814), after a two-frame
    password-verify handshake that exchanges random challenges
    (blesdk/ble/t.java:142-214). GATT layout is in `services` below.
    Per-vehicle flags gate whether the ACC switch, alarm sound and cushion
    lock are controllable over BLE, over the cloud, or both
    (cloud/provider/g.java:227-247, isSupport*SwitchByBt / *ByIot).

    THE CATCH: those BLE keys are cloud-issued -- the app fetches them from
    /v5/smart_key/ble_info (e2/a.java:503, fetched at
    cloud/manager/n.java:2643 into BleKeyInfoBean). The local channel is
    real and its framing is now documented, but key provisioning is
    cloud-mediated, so `local_access.status` stays
    `replacement_hardware` until a cloud-free way to obtain or provision a
    key is found. The remaining open question has moved from "is BLE a
    control channel" (yes) to "can keys be provisioned without the cloud"
    (unknown).

    VERIFICATION: `reported` -- hosts and endpoint paths come from maintained
    third-party integrations and independent captures, but none has been
    exercised by us. The original capture work covers DUAL-BATTERY scooters
    only; single-battery response shapes may differ.

    ECU EVIDENCE (2026-07-31): axelmuhr/niu_n1s_ecu is a full Ghidra
    disassembly of an N1S (V1.x) ECU -- STM32F103 + Neoway M590E GSM/GPRS
    modem + u-blox MAX-7Q GPS, RS-485 vehicle bus (9600 8N1, frames starting
    with 0x68), and a persistent ECU-to-cloud TCP link at fk-ecu.niu.com:8888
    executing server-issued remote commands (lock/unlock, GPS on/off). That
    ECU generation has NO BLE hardware, so the app's BLE proximity link is a
    newer-generation feature. The cloud also exposes a remote-command
    endpoint /v5/cmd/creat (seen in Vxider/NiuDataWidget), and on UQi models
    the scooter list returns the serial as sn_id instead of sn.

    NEVER COMMIT: a real token, account identifier or scooter serial. A token
    grants access to the owner's scooter including its live location, and ride
    history is a movement record of a person, not machine telemetry.

  setup:
    required: true
    confidence: "low"
    notes: >
      Onboarding is an account binding, not a network provisioning flow: the
      scooter already has its own cellular link, and the owner registers it to
      a NIU account so the cloud will answer for it. Confidence is low --
      transcribed from third-party integrations, never exercised by us.
    methods:
      - type: "cloud_account"
        description: >
          Register the scooter to a NIU account in the vendor app; the cloud
          then issues tokens that authorise reads for that serial number.
        verified: false
        cloud:
          local_alternative: >
            None known for telemetry. The scooter's own BLE link is now
            documented as a full AES-encrypted control channel (see
            device notes and `services`), but its per-vehicle keys are
            issued by the cloud via /v5/smart_key/ble_info, so it is not
            yet a cloud-free path -- app-confirmed, not hardware-tested.
            The one shipped local route is replacing the motor controller
            with an aftermarket Bluetooth unit, which reaches drive
            parameters only and leaves telemetry, GPS and alarm on the
            cloud.
        steps:
          - actor: "user"
            action: "Create or sign in to a NIU account in the vendor app."
            expect: "Account session established."
          - actor: "user"
            action: "Add the scooter to the account by its serial number."
            expect: "Scooter appears in the account's scooter list."
          - actor: "client"
            action: >
              Obtain a bearer token from the account host, then read the
              scooter list to recover the serial number used by later calls.
            expect: "Token issued and the scooter is listed."
    factory_reset:
      applicable: false
      effect: >
        No owner-accessible factory reset is documented. Unbinding is an
        account-side operation with no on-vehicle procedure: NIU's own
        support documentation describes self-service in-app unbind by the
        currently-bound owner (Me tab -> device -> red "Unbind" button ->
        confirm), which frees the scooter for a new owner. NIU support is
        only needed when the previous owner is unavailable.
    rejoin:
      requires_factory_reset: false
      notes: >
        Not a network binding, so there is no router-replacement question. The
        equivalent concern is transfer of ownership: an account operation, but
        one the currently-bound owner can complete self-service in the app;
        support involvement is only needed when the previous owner is
        unavailable.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      notes: >
        No WiFi passphrase is involved -- the scooter uses its own cellular
        link. The credential that matters is the account password and the
        bearer token it yields, which grants access to the scooter including
        its live location. Never record a real token, account identifier or
        serial in this repository.

cloud:
  required: true
  vendor_service: "NIU cloud"
  hosts:
    - "https://account-fk.niu.com"
    - "https://app-api-fk.niu.com"
  failure_mode: >
    Total loss of documented function. Telemetry, position, battery state and
    ride history are all read from NIU's servers, so a retired service or a
    closed account leaves the app with nothing to show. The scooter still
    rides -- nothing here affects the drivetrain -- but every connected
    feature stops.
  data_leaves_device:
    - "location (live position and ride tracks -- personal data about a person, not machine telemetry)"
    - "battery state and charge history"
    - "odometer and lifetime totals"
  auth:
    type: "oauth2"
    endpoint: "/v3/api/oauth2/token"
    notes: >
      On the account host. Yields a bearer token; most data calls additionally
      need the scooter serial number (sn). Record the shape only -- never a
      real token or serial.
    verification: "reported"
  notes: >
    Hosts appear region-dependent; older captures show app-api.niu.com. Mixed
    versioning (v3 and v5 both live) is the API's real shape, not a
    transcription slip.
  endpoints:
    - path: "/v5/scooter/list"
      method: "GET"
      name: "scooter_list"
      returns: "Scooters on the account, with serial numbers"
      verification: "reported"
    - path: "/v5/scooter/motor_data/index_info"
      method: "GET"
      name: "motor_data_index"
      returns: "Main telemetry: state of charge, position, odometer"
      verification: "reported"
    - path: "/v3/motor_data/battery_info"
      method: "GET"
      name: "battery_info"
      returns: "Battery detail; dual-battery models report per pack"
      verification: "reported"
    - path: "/motoinfo/overallTally"
      method: "POST"
      name: "overall_tally"
      returns: "Lifetime totals (POST with sn in the form body; evcc niu.go, ioBroker.niu)"
      verification: "reported"
      notes: >
        The vendor app itself calls the same data at /v5/motor/overallTally
        (POST with JSON body {sn}; e2/a.java:476, app call at
        cloud/manager/n.java:1245). Both endpoints are live; neither has
        been exercised by us, so this entry keeps its third-party path and
        the v5 variant is listed separately below.
    - path: "/v5/motor/overallTally"
      method: "POST"
      name: "overall_tally_v5"
      returns: "Lifetime totals -- the vendor app's own path for overall_tally (POST with JSON body {sn}; app-confirmed from the decompile, not exercised by us)"
      verification: "reported"
    - path: "/v5/smart_key/ble_info"
      method: "GET"
      name: "ble_key_info"
      returns: "Per-scooter BLE key provisioning data (BLE MACs and key software versions, parsed into BleKeyInfoBean) -- the credentials the stock BLE control channel requires"
      verification: "reported"
      notes: >
        GET with sn as a query parameter (e2/a.java:503, app call at
        cloud/manager/n.java:2643; the helper used there appends params to
        the URL). This is the cloud-mediated key source that keeps the
        stock BLE link out of cloud-free local control. Record the shape
        only -- never a real key, MAC or serial.
    - path: "/v5/track/list/v2"
      method: "POST"
      name: "track_list"
      returns: "Ride/track history, POST with JSON body {sn, index, pagesize} (personal movement data)"
      verification: "reported"

local_access:
  status: "replacement_hardware"
  summary: >
    No cloud-free local path on stock hardware today. The scooter's own BLE
    link is now documented (see `services`) as a full AES-encrypted control
    channel, but its per-vehicle keys are issued by NIU's cloud
    (/v5/smart_key/ble_info), so stock local control still depends on the
    vendor service. The only shipped cloud-free route to local control is
    swapping the motor controller for an aftermarket Bluetooth one -- which
    frees the drive parameters and nothing else.
  covers:
    - "motor drive parameters via the replacement controller's own BLE app: maximum speed, acceleration, per-mode speed limits, current/amperage, battery configuration"
  not_covered:
    - "telemetry, position and ride history -- still read from NIU's cloud"
    - "GPS tracking and the alarm system -- the vendor advertises these as continuing to work unchanged, i.e. still cloud-tethered"
    - "the stock scooter's own BLE control channel, whose framing is documented but whose keys remain cloud-issued, so it is not a cloud-free path (app-confirmed, not hardware-tested)"
  hardware:
    - name: "NIU Bluetooth Controller"
      vendor: "escootparts.com"
      url: "https://escootparts.com/product/niu-bluetooth-controller/"
      role: "replacement_part"
      replaces: "stock motor controller"
      fits: "UQI+, UQIGT, MQI+, NQI/N1S, MQIL (per the live product page; N1, NQi Sport and M+ are no longer listed)"
      reversible: true
      notes: >
        Sold as a performance part -- higher amperage to the motor -- with
        BLE app programming of speed and acceleration. Recorded here as
        documentation of what exists, not as an endorsement: it is a
        third-party commercial listing, we have not tested it, and raising
        current limits on a road vehicle carries the usual thermal and legal
        consequences. The stock controller can be refitted.
      verification: "reported"
  notes: >
    The stock BLE link has turned out to be a full control channel, but its
    keys are cloud-issued, so `replacement_hardware` stands: this device
    moves to `bridge_hardware` or `native` only once a cloud-free way to
    obtain or provision BLE keys is established. That -- not the framing,
    which is documented -- is now the single highest-value experiment for
    this target. Factory reset likewise remains open: the app offers no
    on-vehicle reset procedure (see `device.setup.factory_reset`).

services:
  - uuid: "8ec94e30-f315-4f60-9fb8-838830daea50"
    name: "NIU BLE control (variant ea50, app bleVer 10)"
    notes: >
      Stock scooter control channel. The app probes three service variants
      in order -- ...daea50, ...daea51, ...daea52 -- and labels them bleVer
      10, 20 and 21 respectively (cloud/modules/carble/d.java:46-78,
      probing logic at cloud/modules/carble/p.java:219-264); all three
      share the same characteristic layout, so only the service UUID's last
      byte changes between the entries below. Frames on the write
      characteristic are hex: 0x5AA5 header, 16-bit length, command, data,
      8-bit sum checksum, 0x96 tail (blesdk/ble/n0.java:271-279), with
      AES-128-ECB encrypted payloads after a two-frame random-challenge
      password-verify handshake (blesdk/ble/t.java:142-214). On bleVer >=
      20 an optional HID service 00001812-0000-1000-8000-00805f9b34fb is
      also used (carble/p.java:246). App-confirmed from a com.niu.manager
      decompile, not hardware-tested; keys are cloud-issued via
      /v5/smart_key/ble_info, see device notes.
    characteristics:
      - uuid: "8ec94e31-f315-4f60-9fb8-838830daea50"
        name: "control_notify"
        properties: ["notify"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "device-specific"
        framing:
          checksum: "sum"
      - uuid: "8ec94e32-f315-4f60-9fb8-838830daea50"
        name: "control_write"
        properties: ["write"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "device-specific"
        framing:
          checksum: "sum"
  - uuid: "8ec94e30-f315-4f60-9fb8-838830daea51"
    name: "NIU BLE control (variant ea51, app bleVer 20)"
    notes: >
      Second probed variant -- same layout as the ea50 service above; only
      the last UUID byte differs (cloud/modules/carble/p.java:226-231).
    characteristics:
      - uuid: "8ec94e31-f315-4f60-9fb8-838830daea51"
        name: "control_notify"
        properties: ["notify"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "device-specific"
        framing:
          checksum: "sum"
      - uuid: "8ec94e32-f315-4f60-9fb8-838830daea51"
        name: "control_write"
        properties: ["write"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "device-specific"
        framing:
          checksum: "sum"
  - uuid: "8ec94e30-f315-4f60-9fb8-838830daea52"
    name: "NIU BLE control (variant ea52, app bleVer 21)"
    notes: >
      Third probed variant -- same layout as the ea50 service above; only
      the last UUID byte differs (cloud/modules/carble/p.java:232-238).
    characteristics:
      - uuid: "8ec94e31-f315-4f60-9fb8-838830daea52"
        name: "control_notify"
        properties: ["notify"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "device-specific"
        framing:
          checksum: "sum"
      - uuid: "8ec94e32-f315-4f60-9fb8-838830daea52"
        name: "control_write"
        properties: ["write"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "device-specific"
        framing:
          checksum: "sum"
  - uuid: "00004e30-004b-4f39-4242-4d4e5826574a"
    name: "NIU BLE control (legacy UUID set)"
    notes: >
      An older service/characteristic triplet also present in the app's
      constants: 00004e30/00004e31/00004e32, all under
      -004b-4f39-4242-4d4e5826574a (c0/b.java:95,104,113). No probed usage
      of this set was found in the decompiled connection path, so the
      notify/write roles are not assigned here -- which generation of
      scooter exposes it is an open question.
