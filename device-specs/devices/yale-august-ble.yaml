# Yale Access / August BLE Locks — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - Yale-Libs/yalexs-ble (const.py / session.py / lock.py) — the local BLE
#     implementation Home Assistant uses.
#   - Home Assistant "Yale Access Bluetooth" / august integration docs.

device:
  name: "Yale Access / August Smart Locks"
  manufacturer: "August / Yale (ASSA ABLOY)"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The GATT UUIDs, HAP-derived
      framing, opcodes and AES-CBC (zero-IV) session crypto are from
      Yale-Libs/yalexs-ble; the offline-key requirement from the Home Assistant
      integration docs.
  protocol: "ble"
  category: "lock"
  notes: >
    August / Yale Access smart locks (August Smart Lock, Pro, Wi-Fi Smart Lock,
    Yale Assure with a Yale Access module). There is no official local API — the
    vendor posture is closed — but direct BLE lock/unlock works once a client
    holds the lock's OFFLINE KEY and key slot (index). Those must be pulled from
    an August/Yale account (a cloud login), after which day-to-day unlock is
    fully local. yalexs-ble is the reference local implementation (Home
    Assistant's "Yale Access Bluetooth").

    GATT: primary service 0000fe24-0000-1000-8000-00805f9b34fb; write
    bd4ac611-0b45-11e3-8ffd-0800200c9a66, read bd4ac612-..., secure-write
    bd4ac613-..., secure-read bd4ac614-.... Yale company id 0x01D1 (465).

    FRAMING: HomeKit-derived (HAP). Plaintext frames begin 0x06, encrypted frames
    begin 0x11; responses are a fixed 18-byte frame. Command opcodes: 0x02
    GETSTATUS, 0x03 WRITESETTING, 0x04 READSETTING, 0x0A UNLOCK, 0x0B LOCK, 0x2D
    LOCK_ACTIVITY.

    CRYPTO/AUTH: a secure handshake exchanges two 8-byte halves —
    SEC_LOCK_TO_MOBILE_KEY_EXCHANGE (0x01) then SEC_INITIALIZATION_COMMAND (0x03)
    — which combine into a 16-byte session key; the keyIndex (slot) is submitted
    with the secure-session init. Session payloads are AES-CBC with a 16-byte
    all-zero IV, keyed by the offline key. If the key or slot is wrong the lock
    rejects the exchange. Motor result is read at response byte[15] (0x00
    success; 0x1E-0x23 jam/mechanical failure).

  openness:
    status: "hostile"
    reverse_engineered: true
    source_code: "https://github.com/Yale-Libs/yalexs-ble"
    upstream_docs:
      - url: "https://www.home-assistant.io/integrations/august/"
        title: "Home Assistant — August / Yale integration"
        covers: "The requirement that the account holds the offline keys, and how to sync them from the cloud."
    notes: >
      No published local protocol; local control depends on an offline key the
      vendor cloud holds. The BLE stack was reverse-engineered and is mature
      (in production in Home Assistant). The zero-IV AES-CBC + static offline-key
      design has drawn security scrutiny historically; no fresh advisory URL was
      verified for this spec, so none is asserted here.

  identification:
    service_uuids:
      - "0000fe24-0000-1000-8000-00805f9b34fb"
    manufacturer_data:
      company_id: 465
      company_id_hex: "0x01D1"
      description: "Yale (0x01D1). Locks advertise the 0xFE24 service."

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "0000fe24-0000-1000-8000-00805f9b34fb"
          manufacturer_data:
            company_id: 465
            description: "Yale company id 0x01D1; primary service 0xFE24."
        notes: >
          Match the 0xFE24 service (and Yale company id 0x01D1). The lock is then
          driven over BLE once the offline key + slot are supplied.
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      Enroll the lock in the August/Yale app, then log the account into a client
      that can sync the OFFLINE KEY + key slot from the cloud (this is what Home
      Assistant's august/yalexs integration does; a fresh owner account may be
      needed to force the keys to synchronize). Hand those to a local BLE client
      for offline unlock thereafter.
    methods:
      - type: "cloud_account"
        verified: false
        description: >
          Obtain the lock's offline key + slot from an August/Yale account (a
          one-time cloud step), then run the BLE secure handshake (0x01/0x03) and
          send LOCK (0x0B) / UNLOCK (0x0A) as AES-CBC-encrypted frames.
        cloud:
          local_alternative: >
            Yes for control — once the offline key + slot are synced from the
            cloud, lock/unlock is entirely local over BLE. The offline key itself
            can only be obtained from an August/Yale account; there is no
            documented account-free way to get it.
        steps:
          - action: "Enroll the lock in the August/Yale app and sync the account so it holds the offline keys."
            actor: "user"
          - action: "Extract the offline key + key slot via the account (e.g. the yalexs integration)."
            actor: "client"
          - action: "Run the BLE secure handshake, then send UNLOCK (0x0A) / LOCK (0x0B) as AES-CBC frames."
            actor: "client"
    factory_reset:
      applicable: true
      confidence: medium
      effect: >
        Deletes every user code including the Master code, clears enrolled
        clients and their offline keys, and returns all programming to
        factory defaults. On the Assure models, creating a new Master code is
        the only thing the lock will accept afterwards and must be done before
        anything else.
      description: >
        Read the procedure for the specific model before starting: all three
        families below need the batteries out, and two of them need the
        interior escutcheon off the door to reach a button that is not
        externally accessible. That is deliberate on the vendor's part — a
        reset that could be done from outside would be a way past the lock —
        and it means this is not something to attempt on a door someone needs
        to use in the next ten minutes.

        A lock previously enrolled in a Z-Wave network should be excluded from
        that network as well; a reset clears the lock's side but not the
        controller's.
      procedures:
        - name: "Assure Lock 2 Key Free Deadbolt: reset tool held for one minute"
          glyph: "generic/pinhole-reset.svg"
          verified: false
          basis: "Yale's installation guide for the Assure Lock 2 key-free deadbolt."
          applies_to: ["Yale Assure Lock 2 (key-free deadbolt)"]
          hold_seconds: 60
          power_state: "on"
          steps:
            - action: "Remove the battery cover and take out one battery."
              actor: "user"
            - action: "Press the reset button for one full minute with the reset tool supplied in the hardware box."
              actor: "user"
            - action: "Replace the battery and the cover."
              actor: "user"
        - name: "Assure Lock (Andersen): reset button held across a battery insertion"
          glyph: "generic/hold-button.svg"
          verified: false
          basis: "Yale's installation guide for the Assure Lock for Andersen doors."
          applies_to: ["Yale Assure Lock (Andersen)"]
          power_state: "off"
          steps:
            - action: "Remove the battery cover and all batteries."
              actor: "user"
            - action: "Remove the interior lock body to reach the reset button, which sits above the PCB cable connectors."
              actor: "user"
            - action: "Re-insert three batteries and hold the reset button for three seconds."
              actor: "user"
            - action: "Still holding, insert the fourth battery and hold for a further three seconds, then release."
              actor: "user"
            - action: "Re-install the interior lock on the door."
              actor: "user"
              expect: "The lock accepts only Master PIN code creation until a new Master code is set."
        - name: "Assure Lock SL: reset button held while the batteries go back in"
          glyph: "generic/hold-button.svg"
          verified: false
          basis: "Yale's Assure Lock SL manual."
          applies_to: ["Yale Assure Lock SL"]
          hold_seconds: 3
          power_state: "off"
          steps:
            - action: "Remove the battery cover and all batteries."
              actor: "user"
            - action: "Remove the interior side of the lock to reach the reset button, which sits beside the cable adapter."
              actor: "user"
            - action: "Press and hold the reset button for at least three seconds while reinstalling the batteries, then release."
              actor: "user"
            - action: "Replace the battery cover."
              actor: "user"
              expect: "The lock accepts only Master Entry code creation until a new Master code is set."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "No network membership on the lock; a client with the offline key re-connects independently."
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device:
        - "Offline key material + key slots (enrolled devices)"
      issued_to_client:
        - "The offline key + slot (synced from the August/Yale cloud account)"
      notes: >
        The offline key is the crown jewel: it keys the AES-CBC session and is
        held by the vendor cloud, so obtaining it requires an account. The Wi-Fi
        variants add a separate radio/bridge; the lock core here is BLE.

  pairing:
    required: true
    confidence: "medium"
    # The lock does not bond. It runs its own secure handshake against an
    # offline key that only the vendor account can issue.
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "vendor_app"
      notes: >
        The lock's OFFLINE KEY and key slot index, synchronised to a client
        that has logged into an August/Yale account. Per-unit key material,
        so no value appears here. Once held, unlocking is fully local and the
        account is not consulted again — which is what makes this lock
        survivable if the vendor service does not.
    exclusivity:
      single_connection: true
      single_bond: false
      recovery: >
        Close the Yale Access app before connecting; it holds the lock while
        it is in the foreground.
    enter_pairing_mode:
      required: false
      notes: >
        There is no pairing-mode button in this flow. Authorisation is issued
        by the vendor account rather than by possession of the lock, which is
        the opposite of the Nuki model and worth knowing before someone goes
        looking for a button to hold.
services:
  - uuid: "0000fe24-0000-1000-8000-00805f9b34fb"
    name: "August / Yale lock service (0xFE24)"
    notes: >
      HAP-derived framing (plaintext first byte 0x06, encrypted 0x11; 18-byte
      response). Two sessions: a plaintext Session and an AES-CBC SecureSession
      keyed by the offline key. Motor result at response byte[15].
    characteristics:
      - uuid: "bd4ac611-0b45-11e3-8ffd-0800200c9a66"
        name: "Write"
        properties: ["write"]
        notes: "Plaintext-session write."
      - uuid: "bd4ac612-0b45-11e3-8ffd-0800200c9a66"
        name: "Read"
        properties: ["read", "notify"]
        notes: "Plaintext-session read."
      - uuid: "bd4ac613-0b45-11e3-8ffd-0800200c9a66"
        name: "Secure write"
        properties: ["write"]
        notes: >
          AES-CBC secure-session write (offline-key). Opcodes 0x0A UNLOCK, 0x0B
          LOCK, 0x02 GETSTATUS.
        commands:
          unlock:
            description: "Unlock (opcode 0x0A), sent as an AES-CBC secure frame."
            encoding: "bytes"
            verification: "reported"
            value: [0x0A]
          lock:
            description: "Lock (opcode 0x0B), sent as an AES-CBC secure frame."
            encoding: "bytes"
            verification: "reported"
            value: [0x0B]
          get_status:
            description: "Read lock status (opcode 0x02)."
            encoding: "bytes"
            verification: "reported"
            value: [0x02]
      - uuid: "bd4ac614-0b45-11e3-8ffd-0800200c9a66"
        name: "Secure read"
        properties: ["read", "notify"]
        notes: "AES-CBC secure-session read; motor result at byte[15]."

entities:
  - platform: "switch"
    name: "Lock"
    icon: "mdi:lock"
    command_characteristic: "bd4ac613-0b45-11e3-8ffd-0800200c9a66"
    commands:
      turn_on: "lock"
      turn_off: "unlock"
    notes: "on = locked (0x0B), off = unlocked (0x0A)."

helpful_urls:
  - title: "Yale-Libs/yalexs-ble"
    url: "https://github.com/Yale-Libs/yalexs-ble"
    description: "The local BLE implementation Home Assistant uses: GATT UUIDs, HAP framing, opcodes, AES-CBC session."
  - title: "Home Assistant — August / Yale integration"
    url: "https://www.home-assistant.io/integrations/august/"
    description: "Documents the offline-key requirement and how to sync it from the cloud for local control."
  - title: "Yale Assure Lock 2 installation instructions"
    url: "https://www.manualslib.com/manual/3355424/Yale-Assure-Lock-2.html"
    kind: "manual"
    description: >
      Vendor installation manual covering the Assure Lock 2 and its Smart Module.
  - title: "Yale Assure Lock 2 key-free deadbolt installation guide (PDF)"
    url: "https://pdf.lowes.com/productdocuments/6de39f83-1b4e-411d-9a87-a3eebf3c4767/63493120.pdf"
    kind: "manual"
    description: >
      Retailer-hosted copy of the guide behind this spec's one-minute reset-tool procedure.
