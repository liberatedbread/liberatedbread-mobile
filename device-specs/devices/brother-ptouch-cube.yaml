    state_command: "request_status"
    state_field: "request_status.cutter_jam"
    state_mapping:
      on_value: 1
  - platform: "binary_sensor"
    name: "Overheated"
    device_class: "heat"
    variants: ["PT-P300BT", "PT-P300BTz", "PT-P710BT", "PT-P715eBT", "PT-P910BT"]
    state_command: "request_status"
    state_field: "request_status.overheating"
    state_mapping:
      on_value: 1
    notes: "The PT-P710BT's LED table calls this a high-temperature error: wait until the Power LED turns green."

protocol_details:
  entity_coverage: >
    Printing itself is the image_upload/raster_print feature, not an entity:
    a job is a sequence of commands built from a bitmap, which no entity
    shape carries. Setting commands (auto status, mode bits, margin,
    compression) are per-job and belong to the job builder, so they are not
    bound either. The status reply IS bound (tape width and type, and the
    error bits a user can act on).
  job_sequence:
    description: >
      One job, in order, as Brother's references lay it out and the
      open-source clients send it. Steps marked per_page repeat for each
      page. All multi-byte numbers are little-endian except the status
      reply's phase number.
    steps:
      - {hex: "00 x100", command: "invalidate", note: "64 in the P300BT clients, 200 on the PT-P910BT"}
      - {hex: "1B 40", command: "initialize"}
      - {hex: "1B 69 53", command: "request_status", note: "read 32 bytes; refuse to continue on any error bit or phase_type != 00"}
      - {hex: "1B 69 61 01", command: "switch_to_raster_mode", per_page: true}
      - {hex: "1B 69 21 00", command: "set_auto_status_notification", per_page: true, note: "optional; Brother's sample and pt-p710bt-label-maker send it"}
      - {hex: "1B 69 7A f t w 00 <lines u32 LE> <page> 00", command: "print_information", per_page: true}
      - {hex: "1B 69 4D 40", command: "set_various_mode", per_page: true}
      - {hex: "1B 69 41 01", command: "cut_every_n_labels", per_page: true, note: "PT-P910BT only"}
      - {hex: "1B 69 4B 08", command: "set_advanced_mode", per_page: true}
      - {hex: "1B 69 64 <dots u16 LE>", command: "set_margin", per_page: true}
      - {hex: "4D 02", command: "set_compression", per_page: true}
      - {hex: "47 <n u16 LE> <n bytes> | 5A", command: "raster_line / zero_raster_line", per_page: true, note: "one per line; the count must equal print_information's raster_lines"}
      - {hex: "0C | 1A", command: "print_page / print_last_page_and_feed", per_page: true, note: "0C between pages, 1A after the last"}
    after: >
      Read status_notification frames until status_type 01 (completed),
      02 (error: the printer has discarded the job; resend from the page
      that did not reach phase printing) or 04 (turned off). Ircama allows
      60 s. Then, optionally, invalidate + initialize before closing, as
      Ircama and dogtopus do.
    verification: "reported"
  raster_orientation:
    description: >
      How a label image becomes raster lines, as both open-source clients do
      it and as the stecman capture of the vendor app showed. Build the label
      as a 1-bit image with the tape's width vertical (128 px tall on a
      128-dot model, text upright) and its length horizontal. Raster line n
      is pixel column n, left to right; within a line, bit 7 of the first
      byte is the column's top pixel, and so on down. In other words the
      image is transposed (the clients describe it as rotate 90 degrees and
      mirror). Content narrower than the head is centred: Brother's pin
      tables give equal unused margins on both sides for every tape up to
      24 mm on the 128-dot models, and 45/61 unused dots for 36 mm on the
      PT-P910BT. Which physical edge of the tape Brother's "pin 0" is, is
      not stated; the transposed layout is the one known to print upright.
    verification: "reported"
  print_information_valid_flags:
    description: "The valid-flag byte of print_information (ESC i z n1). Single byte, OR the bits."
    bits:
      "0x02": "media type valid (checked against the cassette)"
      "0x04": "media width valid"
      "0x08": "media length valid"
      "0x40": "priority to print quality (listed as unused)"
      "0x80": "printer recovery always on (on the PT-P910BT it does not enable status pushes)"
    verification: "reported"
  various_mode_bits:
    description: "ESC i M n1. Single byte."
    bits:
      "0x40": "auto cut (PT-P300BT: prints a boundary mark, per the open-source clients)"
      "0x80": "mirror printing"
    unused: "bits 0-5"
    verification: "reported"
  advanced_mode_bits:
    description: "ESC i K n1. Single byte, OR the bits."
    bits:
      "0x01": "draft printing (PT-P900 series; must be 0 on the PT-P910BT; not defined for the PT-P710BT)"
      "0x04": "half cut (PT-P910BT; not used on the PT-P710BT)"
      "0x08": "no chain printing: feed and cut after the last label (0 = chain printing, no feed or cut after the last)"
      "0x10": "special tape: never cut"
      "0x40": "high-resolution printing, 180 x 360 dpi (PT-P710BT; not on the PT-P910BT)"
      "0x80": "no buffer clearing when printing (not on the PT-P910BT)"
    verification: "reported"
  model_differences:
    description: "What changes between members, for a job builder. Everything else is common."
    PT-P300BT:
      dpi: 180
      raster_line_bytes: 16
      printable_dots_12mm: 64
      max_tape_mm: 12
      cutter: "manual lever"
      invalidate_bytes: "64 in the open-source clients (100 is harmless)"
      status_model_code: "0x72"
      reference: "none published; open-source clients"
      socket: "insecure, 500 ms pause after connect"
    PT-P710BT:
      dpi: "180 (180 x 360 with advanced_mode 0x40)"
      raster_line_bytes: 16
      max_tape_mm: 24
      cutter: "automatic full cut"
      invalidate_bytes: 100
      status_model_code: "not published"
      unsupported: ["ESC i A", "half cut", "ESC/P and P-touch Template modes"]
      reference: "PT-E550W/P750W/P710BT raster reference"
      socket: "insecure, 500 ms pause after connect"
    PT-P910BT:
      dpi: 360
      raster_line_bytes: 70
      max_tape_mm: 36
      cutter: "automatic full and half cut"
      invalidate_bytes: 200
      status_model_code: "0x78"
      media_type_for_tze: "0x00 in print_information"
      page_field: "0 first, 1 later, 2 last (and single-page jobs)"
      status_extras: "battery level at byte 6, extended error at byte 7"
      unsupported: ["high-resolution and draft printing", "heat-shrink tube", "no-buffer-clearing bit"]
      reference: "PT-P900/P900W/P950NW/P910BT raster reference"
      socket: "secure, no pause after connect"
    verification: "reported"
  tape_color_codes:
    description: "request_status byte 24, cassette background colour. Single byte."
    values:
      "0x01": "white"
      "0x02": "other"
      "0x03": "clear"
      "0x04": "red"
      "0x05": "blue"
      "0x06": "yellow"
      "0x07": "green"
      "0x08": "black"
      "0x09": "clear with white text"
      "0x20": "matte white"
      "0x21": "matte clear"
      "0x22": "matte silver"
      "0x23": "satin gold"
      "0x24": "satin silver"
      "0x30": "blue (D series)"
      "0x31": "red (D series)"
      "0x40": "fluorescent orange"
      "0x41": "fluorescent yellow"
      "0x50": "berry pink (S series)"
      "0x51": "light gray (S series)"
      "0x52": "lime green (S series)"
      "0x60": "yellow (F series)"
      "0x61": "pink (F series)"
      "0x62": "blue (F series)"
      "0x70": "white heat-shrink tube"
      "0x90": "white flexible ID"
      "0x91": "yellow flexible ID"
      "0xF0": "cleaning cassette"
      "0xF1": "stencil"
      "0xFF": "incompatible"
    verification: "reported"
  text_color_codes:
    description: "request_status byte 25, cassette ink colour. Single byte."
    values:
      "0x01": "white"
      "0x02": "other"
      "0x04": "red"
      "0x05": "blue"
      "0x08": "black"
      "0x0A": "gold"
      "0x62": "blue (F series)"
      "0xF0": "cleaning cassette"
      "0xF1": "stencil"
      "0xFF": "incompatible"
    verification: "reported"
  tape_waste:
    description: >
      Why every label starts with a strip of blank tape, the most common
      complaint about these printers. The cutter sits some way before the
      print head, so the shortest tape the printer can feed out is about
      24.5 mm (PT-P710BT reference) and the P710BT guide says each first
      print feeds about 25 mm of blank tape; Ircama measures about 2.5 cm
      before and 1 mm after the print on a PT-P300BT. It is mechanical, not a
      margin setting. What reduces it over several labels: chain printing
      (set_advanced_mode without 0x08, so the last label is not fed and cut),
      which is also Brother's advice in the P300BT guide (turn off "cut the
      last label" in Design&Print 2, turn on chain printing in iPrint&Label).
    verification: "reported"
  vendor_app_connection:
    description: >
      What the vendor Android app (P-touch Design&Print 2 2.4.1) does, for
      troubleshooting and for a client that wants to behave like it.
      Static analysis, not observed on the air.
    model_table: ["PT-P300BT", "PT-P300BTz", "PT-P710BT", "PT-P715eBT", "PT-P910BT", "PT-N25BT"]
    transport_by_model: "PT-N25BT over BLE; every other model over Classic SPP"
    discovery: "Classic inquiry; keeps devices whose name contains P300, P300BTz, P710, P715, P910 or N25; also lists bonded devices matched the same way"
    bonding: >
      Starts a bond itself and waits up to 45 s for it. When Android reports
      the device type as Classic it leaves the exchange to the OS; when the
      type is unknown it supplies a PIN of the last five characters of the
      advertised name, not Brother's documented 0000 (see
      evidence.open_questions).
    socket: "SPP UUID; insecure for PT-P300BT, PT-P710BT, PT-P715eBT; secure for the rest"
    post_connect_wait_ms: 500
    post_connect_wait_exempt: "names containing PT-P910BT (and MW-170, MW-270)"
    firmware: "downloads from Brother's firmware-update web service and sends over the open link"
    verification: "reported"
  brother_mobile_sdk_ble_channel:
    description: >
      Brother's mobile print SDK, as bundled in the vendor app, carries a
      BLE transport alongside Classic SPP. It is recorded here because an
      earlier research note assumed the Cube models use it; on the evidence
      they do not. The vendor app sends only the PT-N25BT over it, and
      Brother's public Print SDK supported-printer page lists BLE only for
      TD and RJ models (TD-2350D series, TD-4550DNWB, RJ-3250WB, RJ-4250WB)
      and the PT-P910BT, PT-E310BT and PT-E560BT as Bluetooth (Classic).
      Nothing here is claimed for the PT-P300BT, PT-P710BT, PT-P715eBT or
      PT-P910BT. Everything is read from the SDK code; no BLE printer was
      scanned or captured.
    service: "a76eb9e0-f3ac-4990-84cf-3a94d2426b2b"
    scan_filter: "the same service UUID: the SDK discovers BLE printers by service, not by name"
    characteristics:
      - uuid: "a76eb9e1-f3ac-4990-84cf-3a94d2426b2b"
        role: "read: status, up to 32 bytes per read"
      - uuid: "a76eb9e2-f3ac-4990-84cf-3a94d2426b2b"
        role: "write with response; also the bonding kick below"
      - uuid: "a76eb9e3-f3ac-4990-84cf-3a94d2426b2b"
        role: "write without response + notify; declared only in the second-generation app (an older release of the first app declares e0, e1 and e2 only)"
      - uuid: "a76eb9e4-f3ac-4990-84cf-3a94d2426b2b"
        role: "notify"
    cccd: "00002902-0000-1000-8000-00805f9b34fb"
    constants:
      default_mtu_bytes: 23
      requested_mtu_bytes: 512
      write_chunk: "negotiated MTU minus 5 bytes"
      read_max_bytes: 32
      write_queue_bytes: 512
      connect_retries: 3
      min_connect_wait_ms: 5000
    bonding_kick: >
      When the printer's write characteristic is ...e3 (write without
      response), the SDK first writes a single 0x00 byte to ...e2 and waits
      up to 60 s for the OS bond to complete; without that bond it does not
      use the write-without-response path. With ...e2 as the write
      characteristic it writes with response and needs no kick. Which
      printers expose ...e3 and which ...e2 the SDK decides at runtime; no
      table exists in the app.
    payload: "presumably the same raster stream as over SPP; the status layout as carried over BLE was not read"
    verification: "reported"
  test_vectors:
    description: >
      Computed from the layouts above and checked against an independent
      standard-library transcription (a PackBits encoder and decoder written
      from the algorithm, and struct packing). None is a capture; the status
      records are constructed, with zeros where the real bytes are unknown
      (hardware_settings).
    packbits_lines:
      - {raw: "00 00 00 00 00 00 FF FF FF FF 00 00 00 00 00 00", packed: "FB 00 FD FF FB 00", g_line: "47 06 00 FB 00 FD FF FB 00"}
      - {raw: "00 00 00 00 00 18 3C 7E FF FF FF 00 00 00 00 00", packed: "FC 00 02 18 3C 7E FE FF FC 00", g_line: "47 0A 00 FC 00 02 18 3C 7E FE FF FC 00"}
      - {raw: "FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF", packed: "F1 FF", g_line: "47 02 00 F1 FF"}
    frames:
      - {hex: "1B 69 7A 84 01 18 00 02 00 00 00 00 00", meaning: "print_information: width+recovery valid, laminated, 24 mm, 2 lines, first page"}
      - {hex: "1B 69 7A 84 01 0C 00 2C 01 00 00 00 00", meaning: "print_information: 12 mm, 300 lines"}
      - {hex: "1B 69 64 0E 00", meaning: "set_margin 14 dots (2 mm at 180 dpi)"}
    job_24mm_two_lines: >
      100 x 00, then 1B 40 1B 69 61 01 1B 69 21 00 1B 69 7A 84 01 18 00 02 00
      00 00 00 00 1B 69 4D 40 1B 69 4B 08 1B 69 64 0E 00 4D 02 47 06 00 FB 00
      FD FF FB 00 5A 1A (149 bytes in all): one line with dots 48-79 set, one
      blank line, auto cut, print and feed.
    status_replies:
      - {hex: "80 20 42 30 72 30 00 00 00 00 0C 01 00 00 00 00 00 00 00 00 00 00 00 00 01 08 00 00 00 00 00 00", meaning: "PT-P300BT, reply to request, 12 mm laminated, white tape, black ink, no errors, can receive"}
      - {hex: "80 20 42 30 72 30 00 00 00 00 0C 01 00 00 00 00 00 00 06 01 00 00 00 00 01 08 00 00 00 00 00 00", meaning: "push: phase change to printing"}
      - {hex: "80 20 42 30 72 30 00 00 00 00 0C 01 00 00 00 00 00 00 01 00 00 00 00 00 01 08 00 00 00 00 00 00", meaning: "push: printing completed"}
      - {hex: "80 20 42 30 72 30 00 00 00 10 0C 01 00 00 00 00 00 00 02 00 00 00 00 00 01 08 00 00 00 00 00 00", meaning: "push: error occurred, cover open (error_information_2 bit 4)"}
    verification: "reported"

evidence:
  artifacts:
    - type: "vendor_documentation"
      artifact: "Brother Raster Command Reference PT-E550W/P750W/P710BT v1.02, and PT-P900/P900W/P950NW/P910BT v1.02"
      url: "https://download.brother.com/welcome/docp100064/cv_pte550wp750wp710bt_eng_raster_102.pdf"
      description: >
        The command language, status layout and per-tape pin tables for the
        PT-P710BT and PT-P910BT. Do not state the PT-P710BT's status model
        byte. The P910BT reference is at
        download.brother.com/welcome/docp100407/cv_ptp900_eng_raster_102.pdf.
    - type: "vendor_documentation"
      artifact: "PT-P300BT and PT-P710BT user's guides, PT-P910BT user's guide, Brother FAQ faqp00100300_000, Brother Print SDK manual (supported printers; iOS getting started)"
      description: >
        Advertised name format, PIN 0000, one connection at a time, LED
        states, Bluetooth 2.1+EDR on the P710BT and 5.0 with SPP/iAP2 on the
        P910BT, the P910BT's reset and Bluetooth toggle, firmware update over
        USB, that the P710BT does not officially support Bluetooth to a
        computer, the SDK's BLE list (TD/RJ only) and its MFi requirement on
        iOS (com.brother.ptcbp). The P300BT and P710BT guides document no
        factory reset.
    - type: "public_implementation"
      artifact: "stecman gist (original PT-P300BT write-up), dogtopus gist (Python 3 fork), Ircama/PT-P300BT, robby-cornelissen/pt-p710bt-label-maker"
      url: "https://gist.github.com/stecman/ee1fd9a8b1b6f0fdd170ee87ba2ddafd"
      description: >
        Clients their authors ran on a PT-P300BT (first three) and a
        PT-P710BT. The stecman write-up started from Android HCI captures of
        the vendor app: SPP carrying the PT raster language, one 16-byte G
        line per raster line, 64 invalidate bytes, the transposed image, and
        a Fujitsu-made Bluetooth module. The others add the status decoder
        (model byte 0x72 for the P300BT), RFCOMM channel 1, and the Windows
        and macOS paths.
    - type: "static_analysis"
      artifact: "P-touch Design&Print 2 for Android, package com.brother.ptouch.designandprint2, version 2.4.1 (versionCode 572)"
      obtained_via: "third-party APK mirror, 2026-09-17"
      description: >
        Established: the app's six-model table, that only the PT-N25BT goes
        over BLE, the SPP socket and its insecure flag for PT-P300BT,
        PT-P710BT and PT-P715eBT (secure otherwise), the 500 ms post-connect
        pause, the inquiry name filter, the in-app bond and its PIN handling,
        the BLE channel's UUIDs and constants, and that firmware comes from
        Brother's update service. Negative: no table mapping status model
        bytes to models was found, and the status layout as carried over BLE
        was not read.
  app_static_analysis: >
    The transport facts under bluetooth_classic, device.pairing.notes and
    protocol_details.vendor_app_connection / brother_mobile_sdk_ble_channel
    are what the vendor app does, not what a printer was seen to do.
  open_questions:
    - >
      The vendor app's PIN (a possible cause of "pairing fails in the app").
      When Android has not recorded the printer's device type, the app
      supplies the last FIVE characters of the advertised name as the PIN
      (for PT-P710BTxxxx that is "Txxxx"), where Brother documents 0000.
      For a printer found by inquiry Android normally knows the type and the
      app leaves pairing to the OS, so this should be rare. Unverified on
      hardware. Workaround: pair from the system Bluetooth settings.
    - >
      Location permission (a cause of "stuck on turn on location
      services"). Reviews of app 1.3.x describe the app refusing to proceed
      without location services even with them on; a 2024 review of 2.0.0
      says the requirement was dropped. Android required location permission
      for Bluetooth discovery before Android 12, so older app releases on
      older phones may still hit it.
    - >
      App-version regressions. A review of app 1.3.1 reports a PT-P300BT
      that would not connect until the previous app version was
      reinstalled. Nothing in the 2.4.1 code explains it.
    - >
      Error state after printing. The stecman and dogtopus write-ups report
      the PT-P300BT sometimes staying in an error state after a job,
      cleared by pressing the Power button once. Cause unknown.
    - >
      Tape wasted before each label (the commonest complaint in reviews).
      Mechanical; see protocol_details.tape_waste for what reduces it.

remaining_unknowns:
  - "Whether the PT-P300BT, PT-P710BT and PT-P715eBT accept an RFCOMM connection with no bond (the vendor SDK's insecure socket suggests they might), and which pairing mode the printer negotiates (SSP Just Works or legacy PIN 0000)."
  - "The RFCOMM channel on the PT-P910BT and PT-P300BTz, and whether channel 1 is fixed on the others (the open-source clients assume it)."
  - "Status model byte for the PT-P710BT, PT-P715eBT and PT-P300BTz."
  - "The meaning of status bytes 6 and 7 on the PT-P300BT: Brother's P910BT layout (battery, extended error) and the open-source decoders' reading (extended error, power) disagree."
  - "The PT-P300BT's printable dots per tape width below 12 mm, and whether 64 (Ircama) or about 68 (stecman) is right at 12 mm."
  - "What the PT-P300BTz is, and its advertised name."
  - "Whether the PT-P715eBT and PT-P910BT behave as their references and the vendor app say; nobody in the evidence has driven either over Bluetooth."
  - "Whether any Cube model exposes Brother's BLE service a76eb9e0-f3ac-4990-84cf-3a94d2426b2b (the P910BT's 'Bluetooth Mode' setting hints at a BLE mode), and which BLE printers use ...e2 versus ...e3."
  - "The PT-N25BT's BLE framing, name and status layout over that channel."
  - "Whether the iAP2 session iOS apps use carries the same raster stream, and whether the PT-P300BT and PT-P710BT really are MFi accessories."
  - "The firmware file format, whether it is signed, and the transfer bytes the vendor app uses."
  - "Whether the printer keeps one bond or several, and whether any reset clears them."
  - "FCC IDs; not harvested for this spec."

