# Brother P-touch Cube label printers (PT-P300BT, PT-P710BT) — Device Specification
# Status: Spec Available. Bluetooth Classic SPP carrying Brother's PT raster
#         command language. Sources: Brother's published raster command
#         references (PT-E550W/P750W/P710BT and PT-P900/P910BT), Brother's
#         user's guides, pairing FAQ and Print SDK manual, four open-source
#         clients that their authors ran on a PT-P300BT or PT-P710BT, and static
#         analysis of the vendor Android app (P-touch Design&Print 2 2.4.1,
#         versionCode 572) read 2026-09-28. Nothing here has been run against a
#         printer by this project and no capture is held, so every fact is
#         `reported`. Brother's mobile SDK also carries a BLE transport; the
#         public SDK docs and the vendor app both put it on other models, so it
#         is recorded only under protocol_details.brother_mobile_sdk_ble_channel.
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Brother P-touch Cube label printers (PT-P300BT, PT-P710BT)"
  manufacturer: "Brother Industries, Ltd."
  manufacturer_status: "active"
  openness:
    status: "documented_api"
    reverse_engineered: true
    upstream_docs:
      - url: "https://download.brother.com/welcome/docp100064/cv_pte550wp750wp710bt_eng_raster_102.pdf"
        title: "Brother Software Developer's Manual: Raster Command Reference, PT-E550W/P750W/P710BT (v1.02)"
        covers: >
          The PT-P710BT's command language: invalidate, initialize, the 32-byte
          status request and reply, raster-mode switch, print information,
          mode and advanced-mode bits, margin, TIFF (PackBits) compression,
          raster and zero-raster lines, the two print commands, per-tape pin
          tables at 180 dpi and the USB descriptor.
      - url: "https://download.brother.com/welcome/docp100407/cv_ptp900_eng_raster_102.pdf"
        title: "Brother Software Developer's Manual: Raster Command Reference, PT-P900/P900W/P950NW/P910BT (v1.02)"
        covers: >
          The same language for the 360 dpi, 36 mm PT-P910BT, with its
          differences marked per model: 200-byte invalidate, 70-byte raster
          lines, battery and extended-error bytes in the status reply, media
          type 00 for TZe tape, and a "last page" value in print information.
    source_code: "https://github.com/Ircama/PT-P300BT"
    notes: >
      Brother publishes the command language for the PT-P710BT and the
      PT-P910BT, not for the PT-P300BT. That the PT-P300BT speaks the same
      language over SPP was found from Android HCI captures of the vendor app
      by the author of the original community write-up (the stecman gist) and
      is implemented by Ircama/PT-P300BT, which is maintained and tested on
      hardware by its author. The facts no Brother document states (which
      socket flag the vendor opens, the pause after connecting, the inquiry
      name filter, which model the vendor app sends over BLE) come from the
      vendor Android app.
  testing:
    status: untested
    notes: >
      No printer was available to this project and the research store holds
      no capture. The open-source clients cited were run on real printers by
      their authors, and one of them (the stecman gist) started from a
      capture of the vendor app, which is why the job sequence here is
      trusted; that is their verification, not this project's.
  protocol: "bluetooth_classic"
  transport: "rfcomm"
  category: "printer"
  type: "label-printer"
  notes: >
    Battery-powered thermal-transfer tape label printers that take Brother
    TZe cassettes and are driven from a phone. The PT-P300BT ("P-touch
    CUBE") prints up to 12 mm tape with a manual cutter lever and runs on
    six AAA cells or an AC adapter. The PT-P710BT ("CUBE Plus") prints up to
    24 mm tape with an automatic full cutter, a Li-ion pack and USB. Both
    print at 180 dpi. The vendor apps are P-touch Design&Print 2 and
    iPrint&Label; Brother's P710BT guide says the printer does not support
    Bluetooth to a computer, only USB, but the open-source clients cited here
    print to both models from Linux, Windows and macOS over Bluetooth.

    TRANSPORT. Bluetooth Classic only on this evidence (the P710BT's guide
    gives Bluetooth 2.1+EDR). Find it by inquiry: it answers as "PT-" + model
    + the last four digits of its serial number, e.g. PT-P710BTxxxx. Pair
    from the host (PIN 0000 if asked), then open RFCOMM to the Serial Port
    Profile UUID 00001101-0000-1000-8000-00805f9b34fb. The vendor SDK opens
    that socket INSECURE for the PT-P300BT, PT-P710BT and PT-P715eBT and
    secure for every other model, and waits 500 ms after connecting before it
    writes. Brother's mobile SDK also has a BLE channel (service
    a76eb9e0-f3ac-4990-84cf-3a94d2426b2b), and an earlier write-up in the
    research store assumed the Cube models use it. The evidence says they do
    not: Brother's Print SDK supported-printer page lists BLE only on TD and
    RJ models and lists the PT-P910BT as Bluetooth (Classic), and the vendor
    app sends only the PT-N25BT over BLE. See
    protocol_details.brother_mobile_sdk_ble_channel.

    STREAM. Host to printer is Brother's PT raster language: a run of 0x00
    invalidate bytes, ESC @, ESC i a 01 (raster mode), ESC i z (print
    information), ESC i M / ESC i K (mode bits), ESC i d (margin), M 02
    (TIFF/PackBits), one G line per 128-dot raster line (Z for a blank
    line), then 1A to print and feed. Every opcode is self-delimiting. The
    only thing the printer ever sends is a 32-byte status record starting
    80 20 42 30, either in reply to ESC i S or on its own while printing.
    See commands, bluetooth_classic.serial and protocol_details.job_sequence.

    FAMILY. The PT-P715eBT is a PT-P710BT sibling in the same vendor app and
    SDK. The PT-P910BT ("CUBE XP", 36 mm, 360 dpi) uses the same language
    with its own published reference and differences listed in
    protocol_details.model_differences. The PT-P300BTz appears only in the
    vendor app's model table. The PT-N25BT is in the same app but the app
    reaches it over BLE, which this spec does not declare as a control
    surface. All of those are marked unverified in device.variants.

    OUT OF SCOPE. The QL line (brother-ql-1110nwb), the PocketJet PJ line,
    the TD and RJ BLE printers, USB-only and LAN PT desktop models, and every
    other brand in the label-printer survey (LuckPrinter clones are
    fichero-d11-printer; Phomemo/DothanTech, DYMO, PeriPage, Polono and MakeID
    are not covered).

  identification:
    mac_prefixes:
      - prefix: "A0:66:10"
        confidence: "low"
        notes: >
          FUJITSU LIMITED's block, i.e. the maker of the Bluetooth module
          inside the printer rather than Brother. Shown on a PT-P710BT in the
          pairing example of the pt-p710bt-label-maker README, and consistent
          with the original PT-P300BT capture write-up (stecman gist), where
          the printer showed up as a Fujitsu device. It ranks a Classic
          inquiry result and identifies nothing on its own.
    notes: >
      The printers are Classic-only on this evidence, so their names live in
      the bt_classic_inquiry discovery method, not here where a BLE scan
      matcher reads. Name format per Brother's FAQ and user's guides: "PT-" +
      model name + the last four digits of the serial number (printed on a
      sticker under the Power button and inside the cassette cover), e.g.
      PT-P300BTxxxx, PT-P710BTxxxx. The vendor app is looser: it keeps any
      inquiry result or bonded device whose name CONTAINS one of P300,
      P300BTz, P710, P715, P910 or N25.

  discovery:
    methods:
      - type: "bt_classic_inquiry"
        bt_classic:
          name:
            match: "prefix"
            values: ["PT-P300BT", "PT-P710BT", "PT-P715eBT", "PT-P910BT"]
          requires_discoverable_mode: false
        verification: "reported"
        notes: >
          Brother's guides describe the printer as findable from a phone's
          Bluetooth settings whenever it is on, not asleep and not connected
          to another device; there is no pairing button. The PT-P910BT can
          have Bluetooth or discoverability switched off in its settings (see
          device.pairing.enter_pairing_mode). The vendor app runs a Classic
          inquiry and keeps names containing its model keys, and also lists
          already-bonded devices matched the same way, so a host that has
          paired can skip the inquiry. No service UUID is used to narrow the
          match because nobody has checked that the printer's inquiry response
          carries the SPP UUID; the name is specific enough on its own. The
          PT-P300BTz's name is unknown, and the PT-N25BT is found over BLE by
          the vendor app, so neither is listed.
    identity:
      stable_keys: ["address"]
      display: "local_name"

  setup:
    required: true
    confidence: "medium"
    notes: >
      Nothing to provision beyond a Bluetooth bond: no Wi-Fi, no account, no
      cloud in the print path. Brother's guides pair from the phone's own
      Bluetooth settings; Brother's FAQ says Design&Print 2 pairs from inside
      the app (on Android 4.4 and earlier, from the system settings), and the
      vendor app does start the bond itself before connecting. Confidence is
      medium: vendor documentation plus open-source clients that pair the
      same way, none of it replayed by this project.
    methods:
      - type: "bt_classic_pairing"
        name: "Pair from the host's Bluetooth settings, then open SPP"
        role: "primary"
        verified: false
        description: >
          Power the printer on, find PT-<model><last four serial digits> in
          the host's Bluetooth settings and pair (PIN 0000 if asked), then
          open an RFCOMM socket to the SPP UUID and check the printer answers
          a status request. The link-layer facts are in device.pairing.
        steps:
          - action: "Insert a TZe cassette, close the cover and press the Power button."
            actor: "user"
            expect: "PT-P710BT: Power LED lit 3 s, off 1 s (standby). PT-P300BT: LED flashing green (lit 3 s, off 1 s)."
          - action: "Run a Classic inquiry and pick the device named PT-<model><last four digits of the serial>."
            actor: "client"
            expect: "One result per printer. If none appears, the printer may be connected to another device or asleep."
          - action: "Pair with the printer. If the host asks for a PIN, enter 0000."
            actor: "user"
            notes: "Most hosts pair a Bluetooth 2.1+ device with no prompt at all; the PIN is Brother's documented answer when one is asked for."
          - action: "Open an RFCOMM socket to 00001101-0000-1000-8000-00805f9b34fb (SPP) at the printer's address, then wait 500 ms."
            actor: "client"
            timeout_seconds: 10
            notes: >
              Resolve the channel by SDP from the UUID; the open-source clients
              connect to RFCOMM channel 1 and work. The 500 ms pause is the
              vendor SDK's for the Cube models (it skips it for the PT-P910BT).
          - action: "Send invalidate, initialize and request_status, then read 32 bytes."
            actor: "client"
            expect: "A 32-byte status starting 80 20 42 30, status_type 00, no error bits, media_width equal to the loaded tape."
            timeout_seconds: 10
        troubleshooting:
          - symptom: "The printer does not appear, or pairing fails from the vendor app."
            fix: >
              It accepts one connection at a time: turn off Bluetooth on any
              other phone that was using it, or power-cycle the printer. If
              the vendor app's own pairing fails, pair from the system
              Bluetooth settings with PIN 0000 instead (see
              evidence.open_questions on the app's PIN handling).
          - symptom: "Windows pairs, shows 'Driver Unavailable' and disconnects."
            fix: >
              Reported by the Ircama project (quoting pytouch-cube) for the
              PT-P300BT: add an outgoing COM port for the printer's Serial
              service in the classic Bluetooth settings and open that port;
              printing works despite the message.
    factory_reset:
      applicable: "unknown"
      confidence: "low"
      effect: >
        PT-P910BT: returns printer settings to factory defaults (the guide
        calls it resetting the internal memory). Whether it clears the
        printer's list of bonded hosts is not stated. No reset is documented
        for the PT-P300BT or PT-P710BT.
      description: >
        Basis: the PT-P910BT user's guide describes a Power-button reset and a
        reset from Brother's Printer Setting Tool over USB. The PT-P300BT and
        PT-P710BT user's guides describe none, and the P710BT's settings tool
        lists only power-on/off, auto-power-off, report contents and length
        adjustment. Nothing a new owner needs lives on the printer anyway:
        the bond is re-made from the new host, and every print setting is
        sent with each job.
      procedures:
        - name: "Power-button reset (PT-P910BT)"
          applies_to: ["PT-P910BT"]
          verified: false
          basis: "PT-P910BT User's Guide, Troubleshooting > Reset the Label Printer (vendor document, not tried)."
          power_state: "on"
          indicator: "Power LED flashes orange, then lights orange; the printer then returns to idle."
          steps:
            - action: "With the printer idle, hold the Power button about nine seconds until the Power LED flashes green, then release."
              actor: "user"
            - action: "Hold the Power button about nine seconds again until the Power LED flashes green rapidly, and release while it is flashing rapidly."
              actor: "user"
              expect: "Power LED flashes orange, then lights orange; the printer returns to idle."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing to rejoin: pair from the new host. If an old phone keeps
        grabbing the connection, turn its Bluetooth off or remove the printer
        from it; the printer serves one connection at a time.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        No Wi-Fi and no application-level credential. The only secret is the
        Bluetooth link key each side stores after pairing; Brother does not
        document how many the printer keeps.

  pairing:
    required: true
    confidence: "medium"
    security_mode: "unknown"
    bonding: "unknown"
    pin:
      source: "fixed_default"
      value: "0000"
      length: 4
      notes: >
        Brother's PT-P300BT and PT-P710BT user's guides and its pairing FAQ
        (which lists the PT-N25BT, PT-P300BT, PT-P710BT, PT-P715eBT and
        PT-P910BT) say to enter 0000 if the host asks for a PIN. Whether the
        printer ever asks, i.e. falls back to legacy PIN pairing rather than
        completing Secure Simple Pairing silently, is not stated. The
        PT-P910BT's settings tool can enable and change a PIN ("PIN code
        usage"), so on that model it can become user-chosen.
    exclusivity:
      single_connection: true
      single_bond: "unknown"
      recovery: >
        Brother's guides: if the printer cannot be found it may be connected
        to another device; turn off Bluetooth on that device, or turn the
        printer off and on again. Also check it is not asleep and is close
        to the phone.
    enter_pairing_mode:
      required: false
      indicator: >
        None needed: the printer is discoverable and pairable whenever it is
        on, idle and not connected. PT-P710BT: Power LED lit steadily once a
        Bluetooth connection is established. PT-P910BT: Power LED orange
        (lit 3 s, off 1 s) means its Bluetooth is off.
      notes: >
        No button and no window on the PT-P300BT or PT-P710BT. The PT-P910BT
        has settings that can hide it: Bluetooth on/off (toggled from the
        Power button, below), "Bluetooth on Power On", and "Visible to Other
        Devices" in Brother's Printer Setting Tool, with which a host that
        never paired cannot connect.
      procedures:
        - name: "Switch Bluetooth back on (PT-P910BT)"
          applies_to: ["PT-P910BT"]
          verified: false
          basis: "PT-P910BT User's Guide, LED indications table (vendor document, not tried)."
          indicator: "After power-on the Power LED is green when Bluetooth is on and orange when it is off."
          steps:
            - action: "With the printer idle, hold the Power button about nine seconds until the Power LED flashes green, then release."
              actor: "user"
            - action: "Press the Power button twice quickly."
              actor: "user"
              expect: "Bluetooth toggles and the printer turns off."
            - action: "Press the Power button to turn the printer on."
              actor: "user"
              expect: "Power LED green: Bluetooth is on. If it is orange, repeat to toggle again."
    unpair:
      supported: true
      requires_factory_reset: false
      clears: "The host's bond. No printer-side way to drop one bond is documented."
      notes: >
        Remove the printer in the host's Bluetooth settings. The PT-P910BT
        guide warns that a firmware update may reset the printer's Bluetooth
        pairings, after which the host's stale entry must be deleted and the
        printer paired again.
    notes: >
      Basis: Brother's user's guides and FAQ (pair, PIN 0000 if asked), the
      open-source clients (all pair with bluetoothctl or the Windows
      settings before opening RFCOMM), and the vendor Android app, which
      starts a bond itself before its first connection. `required: true` is
      that documented flow. It is not proof that the firmware refuses an
      unbonded link: the vendor SDK opens the socket with Android's INSECURE
      RFCOMM constructor for the PT-P300BT, PT-P710BT and PT-P715eBT, which
      does not demand authentication from the host side, so those three may
      accept a connection with no bond. Nobody has tried. The PT-P300BTz and
      PT-P910BT get a secure socket, which needs the bond. The P710BT is
      Bluetooth 2.1+EDR and has no display or keypad, so a Secure Simple
      Pairing exchange would be Just Works; `security_mode` stays unknown
      because nothing records which mode the printer negotiates.

  host_compatibility:
    - stack: "android"
      link: "br_edr"
      status: "compatible"
      variants: ["PT-P300BT", "PT-P300BTz", "PT-P710BT", "PT-P715eBT", "PT-P910BT"]
      verification: "reported"
      basis: >
        The vendor Android app's own path (static analysis): an RFCOMM socket
        by SPP UUID through the platform stack, insecure for three models and
        secure for the rest.
    - stack: "bluez"
      link: "br_edr"
      status: "compatible"
      variants: ["PT-P300BT", "PT-P300BTz", "PT-P710BT", "PT-P715eBT", "PT-P910BT"]
      verification: "reported"
      basis: >
        The stecman and dogtopus gists and Ircama/PT-P300BT (PT-P300BT) and
        pt-p710bt-label-maker (PT-P710BT) pair with bluetoothctl and print
        over /dev/rfcomm0 or a PyBluez RFCOMM socket on channel 1. Their
        authors' results, not this project's.
    - stack: "windows"
      link: "br_edr"
      status: "compatible"
      variants: ["PT-P300BT", "PT-P300BTz", "PT-P710BT", "PT-P715eBT", "PT-P910BT"]
      verification: "reported"
      basis: >
        Ircama/PT-P300BT documents printing to a PT-P300BT through an
        outgoing Bluetooth COM port on Windows, and ships a Windows build.
      notes: >
        Windows may show the paired printer as "Driver Unavailable" and drop
        the connection right after pairing; opening the COM port still works
        (Ircama README, quoting pytouch-cube). Brother itself does not
        support Bluetooth from a computer on the PT-P710BT (user's guide).
    - stack: "iobluetooth"
      link: "br_edr"
      status: "compatible"
      variants: ["PT-P300BT", "PT-P300BTz", "PT-P710BT", "PT-P715eBT", "PT-P910BT"]
      verification: "reported"
      basis: >
        Ircama/PT-P300BT has a macOS IOBluetooth backend, and the stecman gist
        notes a /dev/tty.* serial device appearing on macOS once the
        PT-P300BT is paired.
    - stack: "corebluetooth"
      link: "br_edr"
      status: "incompatible"
      symptom: "no_transport"
      cause:
        missing_api: "rfcomm"
      workaround: "vendor_mfi"
      variants: ["PT-P300BT", "PT-P300BTz", "PT-P710BT", "PT-P715eBT", "PT-P910BT"]
      verification: "reported"
      basis: >
        CoreBluetooth has no RFCOMM. Brother's iOS apps do reach these
        printers: the PT-P910BT's guide lists its Bluetooth profiles as "SPP;
        iAP2", Brother's Print SDK guide for iOS says Bluetooth printing
        needs its MFi framework and the external-accessory protocol string
        com.brother.ptcbp, and the P910BT has an "Auto re-pairing" setting
        for Apple devices. That the PT-P300BT and PT-P710BT are MFi as well
        is inferred from the vendor's iOS app supporting them; no iOS session
        has been examined.
      notes: >
        An iPhone or iPad cannot open the SPP socket this spec documents;
        only an app declaring Brother's accessory protocol (in practice
        Brother's own) reaches the printer, over iAP2. Whether the iAP2
        session carries the same raster stream is not established. macOS is
        outside this verdict (iobluetooth).

  variants:
    - model: "PT-P300BT"
      notes: >
        P-touch CUBE. TZe 3.5, 6, 9 and 12 mm; 180 dpi; 128-dot raster line
        of which about 64 dots print (Ircama README; the stecman gist saw the
        outer ~30 dots each side of a 12 mm label stay blank); manual cutter
        lever; six AAA cells or AC adapter; no USB. Status model byte 0x72
        (open-source status decoders). Brother publishes no raster reference
        for it; everything comes from the open-source clients and the vendor
        app. The vendor SDK opens an insecure SPP socket and waits 500 ms
        after connecting. With ESC i M bit 6 (auto cut) set, the Ircama and
        dogtopus clients say the P300BT prints a label boundary mark instead
        of cutting.
    - model: "PT-P300BTz"
      notes: >
        Unverified. Present only in the vendor app's model table as a
        12 mm, manual-cutter sibling of the PT-P300BT, and derived from it in
        the vendor SDK. What distinguishes it (hardware revision, region) and
        its advertised name are not established. Unlike the PT-P300BT, the
        vendor SDK opens a SECURE socket to it.
    - model: "PT-P710BT"
      notes: >
        P-touch CUBE Plus. TZe 3.5 to 24 mm; 180 dpi (180 x 360 in
        high-resolution mode); 128-dot head; automatic full cutter (no half
        cut); Li-ion pack charged over USB; USB 2.0 Full Speed printing
        (USB 04f9:20af) with Windows/Mac drivers; Bluetooth 2.1+EDR Class 2.
        Covered by Brother's PT-E550W/P750W/P710BT raster reference, which
        does not give its status model byte. Does not support ESC i A, ESC/P
        or P-touch Template mode. Vendor SDK: insecure socket, 500 ms wait.
    - model: "PT-P715eBT"
      notes: >
        Unverified. A PT-P710BT sibling (24 mm, same cutter class) in the
        vendor app and SDK, where it shares the P710BT's command family and
        its insecure socket. Listed on Brother's pairing FAQ. Nobody in the
        evidence has driven one.
    - model: "PT-P910BT"
      notes: >
        Unverified here, but Brother publishes its raster reference and a
        user's guide: P-touch CUBE XP, TZe 3.5 to 36 mm, 360 dpi, 560-dot
        head (70-byte raster line), full and half cut, Li-ion, USB-C,
        Bluetooth 5.0 with SPP and iAP2, status model byte 0x78. Same
        language with the differences in protocol_details.model_differences.
        The vendor SDK opens a SECURE socket and does not wait after
        connecting. Brother's Print SDK lists it as Bluetooth (Classic) and
        USB, Android 5 or later.
    - model: "PT-N25BT"
      notes: >
        Not on this spec's control surface. A 12 mm printer in the same
        vendor app and on the same pairing FAQ, derived from the PT-P300BT in
        the vendor SDK, but it is the ONE model the vendor app sends over BLE
        (Brother's mobile-SDK channel in
        protocol_details.brother_mobile_sdk_ble_channel) rather than Classic
        SPP. Listed so a reader holding one knows why nothing below reaches
        it. Its advertised name and BLE framing over that channel are not
        established.

bluetooth_classic:
  variants: ["PT-P300BT", "PT-P300BTz", "PT-P710BT", "PT-P715eBT", "PT-P910BT"]
  dual_mode: "unknown"
  ble_role: "none"
  wake_required: false
  profiles:
    - profile: "spp"
      uuid: "00001101-0000-1000-8000-00805f9b34fb"
      channel: 1
      role: "control"
      secure: false
      variants: ["PT-P300BT", "PT-P710BT", "PT-P715eBT"]
      verification: "reported"
      notes: >
        The vendor SDK opens exactly these three models with Android's
        insecure RFCOMM constructor. Channel 1 is what the open-source
        clients connect to (stecman, dogtopus and pt-p710bt-label-maker all
        default to it and print); resolving the channel by SDP from the UUID
        is the portable route.
    - profile: "spp"
      uuid: "00001101-0000-1000-8000-00805f9b34fb"
      role: "control"
      secure: true
      variants: ["PT-P300BTz", "PT-P910BT"]
      verification: "reported"
      notes: >
        Every model the vendor SDK does not single out gets a secure socket,
        which needs the bond. The PT-P910BT's settings tool also has an
        "Encrypt communication data" option. Channel not recorded.
    - profile: "iap2"
      role: "undocumented"
      verification: "reported"
      notes: >
        The PT-P910BT guide lists "SPP; iAP2". For the others, inferred from
        Brother's iOS apps supporting them and the Print SDK's MFi
        requirement (external-accessory protocol com.brother.ptcbp). The
        iOS path; see device.host_compatibility.
  serial:
    profile_uuid: "00001101-0000-1000-8000-00805f9b34fb"
    encoding: "binary"
    correlation: "in_order"
    max_in_flight: 1
    framing:
      length_prefix: false
      checksum: "none"
      rx_start_bytes: ["80"]
      resync: "scan_to_start_bytes"
      max_frame_bytes: 32
      notes: >
        Host to printer: the raster language has no envelope. Each opcode has
        a fixed length or carries its own byte count (G n1 n2 counts the
        bytes after it, little-endian), so the stream is self-delimiting;
        the 0x00 invalidate run exists to flush a half-received command.
        Printer to host: only 32-byte status records, always starting
        80 20 42 30 (print head mark, size 0x20, 'B', series '0'), sent in
        reply to request_status or on their own (unsolicited). A reader that
        loses sync scans for 80 20 42 and takes 32 bytes. Replies and pushes
        share the prefix; byte 18 (status_type) tells them apart: 00 is a
        reply to request_status, anything else is a push.
    response_timeout_ms: 10000
    unsolicited:
      - name: "status_notification"
        prefix: "80 20 42"
        length: 32
        format:
          - offset: 8
            length: 1
            name: "error_information_1"
            type: "uint8"
            notes: "Same bits as request_status.error_information_1."
          - offset: 9
            length: 1
            name: "error_information_2"
            type: "uint8"
            notes: "Same bits as request_status.error_information_2."
          - offset: 18
            length: 1
            name: "status_type"
            type: "uint8"
            values:
              1: "printing completed"
              2: "error occurred"
              4: "turned off"
              5: "notification"
              6: "phase change"
            notes: "00 (reply to status request) never arrives unasked. Single byte."
          - offset: 19
            length: 1
            name: "phase_type"
            type: "uint8"
            values:
              0: "editing (can receive)"
              1: "printing"
          - offset: 20
            length: 2
            name: "phase_number"
            type: "uint16"
            endianness: "big"
            notes: "Big-endian: offset 20 is the high byte. Meaning per phase_type; see request_status."
          - offset: 22
            length: 1
            name: "notification_number"
            type: "uint8"
            values:
              0: "none"
              1: "cover open"
              2: "cover closed"
        notes: >
          Sent while and after printing when automatic status notification is
          on (the default; ESC i ! 00). A normal page gives a phase change to
          printing (06, phase_type 01), then printing completed (01), then a
          phase change back to editing (06, phase_type 00). An error gives
          status_type 02 and the printer discards the rest of the job. The
          dogtopus client prints the first frame after the print command;
          Ircama reads frames until status_type 01, 02 or 04 or 60 s pass.
          Every field of request_status's layout applies; only the ones a
          client acts on are repeated here.
        verification: "reported"
    verification: "reported"
    notes: >
      One command at a time and no status request while a page is printing:
      Brother's reference says nothing, not even ESC i S, may be sent from
      the end of the print data until completion is confirmed, and that the
      printer reports errors on its own meanwhile. The vendor SDK pauses
      500 ms after the socket opens before writing (PT-P300BT, PT-P710BT and
      every model except the PT-P910BT; also the MW-170/270, not covered).
      The open-source clients write each opcode and each raster line as its
      own write and need no pacing. Ircama retries the opening status query
      up to six times because, on macOS especially, the first read on a
      fresh link can return nothing. response_timeout_ms is Ircama's 10 s
      serial timeout, not a vendor figure.
  verification: "reported"
  notes: >
    dual_mode is unknown across the family, not for the P710BT: its guide
    gives Bluetooth 2.1+EDR, which has no BLE. The PT-P910BT is Bluetooth 5.0
    and its settings tool has a "Bluetooth Mode" field shown as Classic, so a
    BLE mode may exist there; no client in the evidence uses one, hence
    ble_role none. wake_required is false because the printer has no sleep
    state that hides it short of being off: it auto-powers-off (PT-P710BT:
    configurable over USB), and the Power button brings it back.

initialization:
  - command: "invalidate"
    expect_response: false
    notes: >
      Once the socket is open (the vendor SDK waits 500 ms first on every
      model but the PT-P910BT). On a PT-P910BT send it twice: its reference
      asks for 200 bytes.
  - command: "initialize"
    expect_response: false
  - command: "request_status"
    expect_response: true
    notes: >
      The link is usable once a 32-byte reply starting 80 20 42 30 arrives
      with status_type 00. Refuse to print if either error byte is non-zero
      or phase_type is not 00 (what Ircama and dogtopus do), and take
      media_width and media_type for print_information from it.

commands:
  # ---- job framing -------------------------------------------------------
  invalidate:
    description: "Invalidate: 100 bytes of 0x00. Flushes a half-received command; NULL is skipped by the printer, so extra zeros are harmless."
    transport: "rfcomm"
    value: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
            0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
            0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
            0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
            0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
            0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
            0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
            0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
            0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
            0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
    notes: >
      100 bytes is the PT-P710BT reference's count (and pt-p710bt-label-maker's);
      the PT-P300BT clients send 64 and the PT-P910BT reference asks for 200
      (send this twice). To abandon a job midway, send invalidate then
      initialize.
    response:
      expected: false
    verification: "reported"
  initialize:
    description: "ESC @: reset mode settings. Brother's reference says it also cancels printing."
    transport: "rfcomm"
    value: [0x1B, 0x40]
    response:
      expected: false
    verification: "reported"
  request_status:
    description: "ESC i S: ask for the 32-byte status record. Send once before each job, never while a page is printing."
    transport: "rfcomm"
    value: [0x1B, 0x69, 0x53]
    response:
      prefix: "80 20 42"
      length: 32
      timeout_ms: 10000
      format:
        - offset: 0
          length: 1
          name: "print_head_mark"
          type: "uint8"
          notes: "Always 0x80."
        - offset: 1
          length: 1
          name: "size"
          type: "uint8"
          notes: "Always 0x20 (32, the record length)."
        - offset: 2
          length: 1
          name: "brother_code"
          type: "uint8"
          notes: "Always 0x42 ('B')."
        - offset: 3
          length: 1
          name: "series_code"
          type: "uint8"
          notes: "Always 0x30 ('0')."
        - offset: 4
          length: 1
          name: "model_code"
          type: "uint8"
          values:
            114: "PT-P300BT (0x72)"
            120: "PT-P910BT (0x78)"
          notes: >
            0x72 comes from the open-source status decoders (dogtopus,
            Ircama), 0x78 from the PT-P910BT reference. The PT-P710BT's and
            PT-P715eBT's values are not published and were not found.
        - offset: 5
          length: 1
          name: "country_code"
          type: "uint8"
          notes: "0x30 ('0') in both references."
        - offset: 6
          length: 1
          name: "battery_level"
          type: "uint8"
          values:
            32: "no AC adapter, full (0x20)"
            34: "no AC adapter, half (0x22)"
            35: "no AC adapter, low (0x23)"
            36: "no AC adapter, needs charging (0x24)"
            48: "AC adapter, full (0x30)"
            50: "AC adapter, half (0x32)"
            51: "AC adapter, low (0x33)"
            52: "AC adapter, needs charging (0x34)"
            55: "battery not installed (0x37)"
          notes: >
            PT-P910BT only, per its reference. The PT-P710BT reference marks
            bytes 6 and 7 reserved (00). The open-source P300BT decoders read
            byte 6 as an extended error and byte 7 as a power level (0 full,
            1 half, 2 low, 3 critical, 4 AC), the opposite order to Brother's
            P910BT layout; neither reading has been checked on a PT-P300BT.
        - offset: 7
          length: 1
          name: "extended_error"
          type: "uint8"
          values:
            33: "incompatible media (0x21)"
          notes: "PT-P910BT per its reference; reserved on the PT-P710BT. See battery_level for the open-source reading."
        - offset: 8
          length: 1
          name: "error_information_1"
          type: "uint8"
          notes: "Bit field; the named bits follow. Non-zero means do not print."
        - offset: 8
          length: 1
          name: "no_media"
          type: "uint8"
          mask: 1
          notes: "Bit 0: no tape cassette."
        - offset: 8
          length: 1
          name: "cutter_jam"
          type: "uint8"
          mask: 4
          notes: "Bit 2."
        - offset: 8
          length: 1
          name: "weak_batteries"
          type: "uint8"
          mask: 8
          notes: "Bit 3."
        - offset: 8
          length: 1
          name: "high_voltage_adapter"
          type: "uint8"
          mask: 64
          notes: "Bit 6: wrong (over-voltage) adapter. Not on the PT-P910BT."
        - offset: 9
          length: 1
          name: "error_information_2"
          type: "uint8"
          notes: "Bit field; the named bits follow. Non-zero means do not print."
        - offset: 9
          length: 1
          name: "replace_media"
          type: "uint8"
          mask: 1
          notes: "Bit 0: wrong media, e.g. print_information's media check failed."
        - offset: 9
          length: 1
          name: "communication_error"
          type: "uint8"
          mask: 4
          notes: "Bit 2. PT-P910BT reference; not used on the PT-P710BT."
        - offset: 9
          length: 1
          name: "communication_buffer_full"
          type: "uint8"
          mask: 8
          notes: "Bit 3. PT-P910BT reference; not used on the PT-P710BT."
        - offset: 9
          length: 1
          name: "cover_open"
          type: "uint8"
          mask: 16
          notes: "Bit 4. Not on the PT-P910BT."
        - offset: 9
          length: 1
          name: "overheating"
          type: "uint8"
          mask: 32
          notes: "Bit 5."
        - offset: 9
          length: 1
          name: "system_error"
          type: "uint8"
          mask: 128
          notes: "Bit 7. PT-P910BT reference; not used on the PT-P710BT."
        - offset: 10
          length: 1
          name: "media_width"
          type: "uint8"
          unit: "mm"
          notes: "Loaded tape width in whole millimetres; 0 = no cassette; a 3.5 mm tape reports 4. Single byte, no scale."
        - offset: 11
          length: 1
          name: "media_type"
          type: "uint8"
          values:
            0: "no media"
            1: "laminated tape"
            3: "non-laminated tape"
            4: "fabric tape (PT-P910BT)"
            17: "heat-shrink tube 2:1 (0x11)"
            20: "flexible ID tape (0x14, PT-P910BT)"
            21: "satin tape (0x15, PT-P910BT)"
            23: "heat-shrink tube 3:1 (0x17)"
            255: "incompatible tape"
        - offset: 12
          length: 1
          name: "number_of_colors"
          type: "uint8"
          notes: "Always 00."
        - offset: 13
          length: 1
          name: "fonts"
          type: "uint8"
          notes: "Always 00."
        - offset: 15
          length: 1
          name: "mode"
          type: "uint8"
          notes: "Echo of the last various_mode flags (0x40 auto cut, 0x80 mirror); 00 if none was sent."
        - offset: 16
          length: 1
          name: "density"
          type: "uint8"
          notes: "Always 00."
        - offset: 17
          length: 1
          name: "media_length"
          type: "uint8"
          unit: "mm"
          notes: "Always 0 for TZe tape (continuous)."
        - offset: 18
          length: 1
          name: "status_type"
          type: "uint8"
          values:
            0: "reply to status request"
            1: "printing completed"
            2: "error occurred"
            4: "turned off"
            5: "notification"
            6: "phase change"
          notes: "03 (exit IF mode) is listed as unused. Single byte."
        - offset: 19
          length: 1
          name: "phase_type"
          type: "uint8"
          values:
            0: "editing (can receive)"
            1: "printing"
        - offset: 20
          length: 2
          name: "phase_number"
          type: "uint16"
          endianness: "big"
          notes: >
            Big-endian. With phase_type 00: 0 = can receive, 1 = feeding.
            With phase_type 01: 0 = printing, 0x14 = cover opened while
            receiving.
        - offset: 22
          length: 1
          name: "notification_number"
          type: "uint8"
          values:
            0: "none"
            1: "cover open"
            2: "cover closed"
        - offset: 23
          length: 1
          name: "expansion_area"
          type: "uint8"
          notes: "Always 00."
        - offset: 24
          length: 1
          name: "tape_color"
          type: "uint8"
          notes: "Cassette background colour code; table in protocol_details.tape_color_codes."
        - offset: 25
          length: 1
          name: "text_color"
          type: "uint8"
          notes: "Cassette ink colour code; table in protocol_details.text_color_codes."
        - offset: 26
          length: 4
          name: "hardware_settings"
          type: "bytes"
          notes: "PT-P710BT reference: factory hardware information used for checking; not decoded. Reserved (00) on the PT-P910BT."
      notes: >
        Worked examples in protocol_details.test_vectors. Brother's layout for
        the PT-P710BT and PT-P910BT; the open-source clients decode the
        PT-P300BT's reply with the same offsets.
      verification: "reported"
    verification: "reported"
  switch_to_raster_mode:
    description: "ESC i a 01: select raster mode. The only mode on the PT-P710BT and PT-P910BT; it lasts until power-off."
    transport: "rfcomm"
    value: [0x1B, 0x69, 0x61, 0x01]
    notes: "The PT-P710BT supports neither ESC/P (00) nor P-touch Template mode (03); the stecman gist found the PT-P300BT does not answer ESC/P either."
    response:
      expected: false
    verification: "reported"
  set_auto_status_notification:
    description: "ESC i ! n: whether the printer pushes status frames while printing."
    transport: "rfcomm"
    template: [0x1B, 0x69, 0x21, "{mode}"]
    parameters:
      mode:
        type: "uint8"
        allowed: [0, 1]
        labels: ["notify (default)", "do not notify"]
        default: 0
    notes: "Supported on the PT-P710BT and PT-P910BT per their references; on the P910BT it is the only way to get status during printing. Lasts until power-off."
    response:
      expected: false
    verification: "reported"
  print_information:
    description: "ESC i z: tape and page description for the page that follows, including its raster line count."
    transport: "rfcomm"
    template: [0x1B, 0x69, 0x7A, "{valid_flags}", "{media_type}", "{media_width}", "{media_length}", "{raster_lines}", "{page}", 0x00]
    parameters:
      valid_flags:
        type: "uint8"
        default: 132
        description: >
          Which of the following fields the printer should check, OR-ed:
          0x02 media type, 0x04 media width, 0x08 media length, 0x40 quality
          (unused), 0x80 recovery. 0x84 (width + recovery) is Brother's
          example and pt-p710bt-label-maker's; Ircama sends 0xC4. With
          0x02/0x04/0x08 set, a mismatch with the loaded tape sets
          replace_media in the status. On the PT-P910BT, 0x80 does not turn
          on status reporting; use set_auto_status_notification.
      media_type:
        type: "uint8"
        source: "state:request_status.media_type"
        description: >
          Checked only when valid_flags has 0x02. 01 laminated, 03
          non-laminated, 11/17 heat-shrink. The PT-P910BT reference asks
          for 00 for any laminated or non-laminated TZe tape.
      media_width:
        type: "uint8"
        unit: "mm"
        source: "state:request_status.media_width"
        description: "Tape width in whole millimetres (0x18 for 24 mm), as the status reports it."
      media_length:
        type: "uint8"
        unit: "mm"
        default: 0
        description: "0 for TZe tape, which is continuous."
      raster_lines:
        type: "uint32"
        endianness: "little"
        required: true
        min: 1
        description: "Number of raster lines (G or Z) in this page, u32 little-endian."
      page:
        type: "uint8"
        allowed: [0, 1, 2]
        labels: ["first page", "any later page", "last page (PT-P910BT only)"]
        default: 0
        description: "The PT-P910BT wants 2 on the last page, and on a single-page job."
    notes: "Example, 24 mm tape, 2 lines: 1B 69 7A 84 01 18 00 02 00 00 00 00 00. More in protocol_details.test_vectors."
    response:
      expected: false
    verification: "reported"
  set_various_mode:
    description: "ESC i M n: auto cut (bit 6) and mirror printing (bit 7)."
    transport: "rfcomm"
    template: [0x1B, 0x69, 0x4D, "{flags}"]
    parameters:
      flags:
        type: "uint8"
        allowed: [0, 64, 128, 192]
        labels: ["no auto cut, no mirror", "auto cut", "mirror", "auto cut and mirror"]
        default: 64
        description: "Bits 0-5 unused. The PT-P300BT has no automatic cutter; the Ircama and dogtopus clients say bit 6 makes it print a label boundary instead."
    response:
      expected: false
    verification: "reported"
  set_advanced_mode:
    description: "ESC i K n: half cut, chain printing, special tape, high resolution, buffer handling."
    transport: "rfcomm"
    template: [0x1B, 0x69, 0x4B, "{flags}"]
    parameters:
      flags:
        type: "uint8"
        min: 0
        max: 255
        default: 8
        description: >
          OR of the bits in protocol_details.advanced_mode_bits: 0x04 half
          cut (PT-P910BT only), 0x08 no chain printing (feed and cut after
          the last label), 0x10 special tape (no cutting), 0x40 high
          resolution (180 x 360 dpi; PT-P710BT only), 0x80 no buffer
          clearing. 0x08 is what both open-source clients and Brother's
          sample send; 0x00 (chain printing) saves the ~25 mm of tape a cut
          wastes before the next label.
    response:
      expected: false
    verification: "reported"
  set_margin:
    description: "ESC i d n1 n2: feed margin before and after the printed area, in dots, u16 little-endian."
    transport: "rfcomm"
    template: [0x1B, 0x69, 0x64, "{margin}"]
    parameters:
      margin:
        type: "uint16"
        endianness: "little"
        unit: "dots"
        min: 0
        max: 1800
        default: 14
        description: >
          Dots at the feed resolution. Brother's range: 14 (2 mm) to 900
          (127 mm) at 180 dpi, 28 to 1800 in the P710BT's high-resolution
          mode, 14 (1 mm) to 1800 on the 360 dpi PT-P910BT. The open-source
          clients send 0 and print; the physical minimum still applies (see
          protocol_details.tape_waste).
    response:
      expected: false
    verification: "reported"
  cut_every_n_labels:
    description: "ESC i A n: with auto cut on, cut after every n labels (1-99). PT-P910BT only; the PT-P710BT reference says it does not support it."
    transport: "rfcomm"
    template: [0x1B, 0x69, 0x41, "{labels}"]
    parameters:
      labels:
        type: "uint8"
        min: 1
        max: 99
        default: 1
    response:
      expected: false
    verification: "reported"
  set_compression:
    description: "M n: raster line compression, 00 none or 02 TIFF (PackBits)."
    transport: "rfcomm"
    template: [0x4D, "{mode}"]
    parameters:
      mode:
        type: "uint8"
        allowed: [0, 2]
        labels: ["uncompressed", "TIFF (PackBits)"]
        default: 2
    notes: "01 is reserved. zero_raster_line is valid only with 02. The vendor app and both open-source clients use 02."
    response:
      expected: false
    verification: "reported"
  raster_line:
    description: "G n1 n2 data: one raster line (one dot column across the tape); n1 n2 is the byte count of data, u16 little-endian."
    transport: "rfcomm"
    template: [0x47, "{byte_count}", "{row}"]
    parameters:
      byte_count:
        type: "uint16"
        endianness: "little"
        required: true
        min: 0
        max: 71
        description: "Must equal the length of row. Uncompressed: 16 (128-dot models) or 70 (PT-P910BT)."
      row:
        type: "bytes"
        required: true
        min_length: 0
        max_length: 71
        description: >
          The line, 1 bit per dot, 1 = print, first byte's MSB first (layout
          in protocol_details.raster_orientation), PackBits-compressed when
          set_compression is 02. Brother: if compression would give more than
          the uncompressed length, send the line as one literal run instead
          (count byte 0x0F then the 16 bytes, 17 in all, on a 128-dot model).
          A line shorter than the head is padded with zero dots by the printer.
    notes: >
      The vendor app and both open-source clients send one G per 128-dot
      line. Example, 24 mm, dots 48-79 on: 47 06 00 FB 00 FD FF FB 00. More
      in protocol_details.test_vectors.
    response:
      expected: false
    verification: "reported"
  zero_raster_line:
    description: "Z: one all-blank raster line. Valid only with TIFF compression."
    transport: "rfcomm"
    value: [0x5A]
    response:
      expected: false
    verification: "reported"
  print_page:
    description: "FF (0x0C): print this page and wait for the next; for every page but the last."
    transport: "rfcomm"
    value: [0x0C]
    response:
      expected: false
      notes: "No reply to the byte itself; with notification on, status_notification frames follow (phase change, printing completed, phase change)."
    verification: "reported"
  print_last_page_and_feed:
    description: "Ctrl-Z (0x1A): print the last page, feed and cut per the mode bits. Ends the job."
    transport: "rfcomm"
    value: [0x1A]
    response:
      expected: false
      notes: "No reply to the byte itself; with notification on, status_notification frames follow. Wait for printing completed (status_type 01) before closing the socket."
    verification: "reported"

features:
  - type: "image_upload"
    variants: ["PT-P300BT", "PT-P300BTz"]
    format: "1bit-bitmap"
    max_width: 128
    max_height: 3536
    max_palette_colors: 2
    print_geometry:
      dpi: 180
      bytes_per_row: 16
      head_dots: 128
      printable_dots: 64
      invalidate_bytes: 100
      max_length_dots: 3536
    media:
      - name: "3.5 mm TZe tape"
        kind: "continuous"
        width_mm: 3.5
        media_type_code: 1
      - name: "6 mm TZe tape"
        kind: "continuous"
        width_mm: 6
        media_type_code: 1
      - name: "9 mm TZe tape"
        kind: "continuous"
        width_mm: 9
        media_type_code: 1
      - name: "12 mm TZe tape"
        kind: "continuous"
        width_mm: 12
        print_width_dots: 64
        media_type_code: 1
        notes: >
          64 printable dots centred in the 128-dot line (Ircama README;
          the stecman gist saw about 30 dots each side stay blank). Dot
          counts for narrower tape on this model are not documented.
  - type: "image_upload"
    variants: ["PT-P710BT", "PT-P715eBT"]
    format: "1bit-bitmap"
    max_width: 128
    max_height: 7086
    max_palette_colors: 2
    print_geometry:
      dpi: 180
      bytes_per_row: 16
      head_dots: 128
      printable_dots: 128
      invalidate_bytes: 100
      min_length_dots: 31
      max_length_dots: 7086
      feed_margin_dots: 14
    media:
      - name: "3.5 mm TZe tape"
        kind: "continuous"
        width_mm: 3.5
        total_width_dots: 24
        print_width_dots: 24
        right_margin_dots: 52
        media_type_code: 1
      - name: "6 mm TZe tape"
        kind: "continuous"
        width_mm: 6
        total_width_dots: 42
        print_width_dots: 32
        right_margin_dots: 48
        media_type_code: 1
      - name: "9 mm TZe tape"
        kind: "continuous"
        width_mm: 9
        total_width_dots: 64
        print_width_dots: 50
        right_margin_dots: 39
        media_type_code: 1
      - name: "12 mm TZe tape"
        kind: "continuous"
        width_mm: 12
        total_width_dots: 84
        print_width_dots: 70
        right_margin_dots: 29
        media_type_code: 1
      - name: "18 mm TZe tape"
        kind: "continuous"
        width_mm: 18
        total_width_dots: 128
        print_width_dots: 112
