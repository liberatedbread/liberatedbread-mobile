  - type: "raster_print"
  - type: "firmware_update"
    dfu:
      mechanisms: ["vendor_serial", "custom"]
      transport: ["rfcomm", "usb"]
      image:
        signing: "unknown"
        algorithm: "unknown"
        source: "vendor_cloud"
        format: "Unknown. A per-model file from Brother's firmware-update web service."
        notes: >
          The vendor Android app asks Brother's firmware-update web service
          for the connected model's latest file and passes it to the SDK's
          file-transfer path over the open Bluetooth link. Nothing about the
          file's structure or signing was examined.
      enter:
        how: "unknown"
        notes: >
          Two vendor routes: the phone app over Bluetooth, and (PT-P710BT,
          PT-P910BT) Brother's P-touch Update Software over USB, whose guides
          say not to power off or unplug during the update. The bytes that
          start a transfer are not documented here, deliberately: a client
          should use the vendor tools.
      dfu_mode:
        notes: >
          The guides describe a state that waits for a new program: PT-P300BT
          LED steady red ("booting"; transfer the program again),
          PT-P710BT Power LED steady red (program transfer failure),
          PT-P910BT Power LED steady red ("recovery mode"). What the printer
          advertises in that state is not known.
      recovery:
        interrupted: "stays_in_bootloader"
        notes: >
          From the vendor guides' LED tables: after a failed transfer the
          printer waits for the program to be sent again. Not tried.
      verification: "reported"
      notes: >
        The P910BT guide warns that a firmware update may reset Bluetooth
        pairings. A user review of the vendor app mentions its printer
        firmware update feature.

local_access:
  status: "native"
  summary: >
    Fully local: pair and print over Bluetooth SPP (or USB on the PT-P710BT
    and PT-P910BT) with no account and no cloud in the path. The vendor app
    wants network access for its templates and some reviewers say for its
    main menu, but the printer knows nothing of that.
  covers:
    - "Raster label printing on every TZe width the model takes"
    - "Status: loaded tape width, type and colours, errors, print progress"
  not_covered:
    - "Firmware update (vendor app or P-touch Update Software only; bytes not documented)"

entities:
  - platform: "sensor"
    name: "Tape Width"
    unit: "mm"
    icon: "mdi:tape-measure"
    variants: ["PT-P300BT", "PT-P300BTz", "PT-P710BT", "PT-P715eBT", "PT-P910BT"]
    state_command: "request_status"
    state_field: "request_status.media_width"
    notes: "0 means no cassette; a 3.5 mm cassette reads 4. Poll only between jobs: no status request is allowed while a page prints."
  - platform: "sensor"
    name: "Tape Type"
    icon: "mdi:label-outline"
    variants: ["PT-P300BT", "PT-P300BTz", "PT-P710BT", "PT-P715eBT", "PT-P910BT"]
    state_command: "request_status"
    state_field: "request_status.media_type"
    state_mapping:
      0: "no media"
      1: "laminated tape"
      3: "non-laminated tape"
      4: "fabric tape"
      17: "heat-shrink tube 2:1"
      20: "flexible ID tape"
      21: "satin tape"
      23: "heat-shrink tube 3:1"
      255: "incompatible tape"
  - platform: "binary_sensor"
    name: "No Tape Cassette"
    device_class: "problem"
    variants: ["PT-P300BT", "PT-P300BTz", "PT-P710BT", "PT-P715eBT", "PT-P910BT"]
    state_command: "request_status"
    state_field: "request_status.no_media"
    state_mapping:
      on_value: 1
  - platform: "binary_sensor"
