device:
  name: "ETEKCITY ESN00 Smart Nutrition Scale"
  manufacturer: "ETEKCITY (VeSync platform)"
  manufacturer_status: "active"
  protocol: "ble"
  notes: >
    The VeSync app is a multi-device platform. The ESN00 kitchen scale
    likely uses the FFA0 or FFE0 service. Command format TBD — HCI snoop
    needed to determine exact byte encoding for weight data, tare, and
    unit change commands.

    Commands (format TBD): tare, unit_change, weight_read.

    Research status: APK acquired and decompiled. All service/characteristic
    UUIDs recovered. Command byte format TBD — HCI snoop needed.

  setup:
    required: false
    confidence: low
    notes: >
      The scale itself needs no provisioning: it is a BLE peripheral that
      advertises and streams weight to whatever connects. The VeSync app asks
      for an account, but that is the app's requirement, not the scale's — the
      account exists to sync readings to VeSync's cloud, and nothing in the
      recovered service map suggests the scale is bound to it.

      Confidence is low: this is inferred from a decompiled APK, and the command
      byte format is still TBD. Whether the scale enforces any binding has not
      been tested against hardware.
    methods:
      - type: ble_direct
        description: >
          Connect over GATT and read weight notifications directly, bypassing
          the VeSync app and account entirely.
        verified: false
        ble:
          pairing_required: false
        steps:
          - action: "Place a load on the scale, or tap it, to wake it from standby."
            actor: user
          - action: "Scan for the scale and connect over GATT."
            actor: client
          - action: "Subscribe to the weight notification characteristic."
            actor: client
            expect: "Weight frames arrive as the load changes. Exact encoding is TBD."
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established. No reset command was recovered from the app, and the
        scale is not known to store per-user state that a reset would clear.
        Removing the batteries is the only power-cycle path observed.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The scale joins no network, so there is nothing to rejoin. A new client
        may connect once the previous one disconnects.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        No WiFi passphrase is involved — the scale is BLE-only. A VeSync account
        credential is held by the app, not by the scale.

