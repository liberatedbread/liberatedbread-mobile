services:
  - uuid: "0000fe95-0000-1000-8000-00805f9b34fb"
    name: "Xiaomi MiBeacon / Mi Auth Service"
    notes: >
      Advertised service (encrypted MiBeacon frames; measurement object
      0x6E16 after bindkey decryption) and the GATT auth service for
      the Mi Home v2 login. Characteristic UUIDs per
      nokistin/xiaomi-s400-live (standard Xiaomi short IDs under the
      Bluetooth base UUID).
    characteristics:
      - uuid: "00000010-0000-1000-8000-00805f9b34fb"
        name: "UPNP (auth commands)"
        properties: ["write", "notify"]
        notes: >
          Client->device auth commands as 4-byte LE opcodes:
          CMD_GET_INFO 0xA2, CMD_SET_KEY 0x15, CMD_LOGIN 0x24,
          CMD_AUTH 0x13. Results arrive on notify: register OK 0x11 /
          login OK `21 00 00 00`, failures 0x12 / 0x23, auth errors
          0xE0-0xE3.
      - uuid: "00000019-0000-1000-8000-00805f9b34fb"
        name: "AVDTP (auth data)"
        properties: ["write", "notify"]
        notes: >
          Bidirectional framed parcels for the login handshake
          (16-byte random key exchange, device info). Frame headers:
          send-key `00 00 00 0b 01 00`, send-info `00 00 00 0a 02 00`,
          send-data `00 00 00 03 04 00`; receiver acks RCV_RDY
          `00 00 01 01`, RCV_OK `00 00 01 00`.
      - uuid: "0000001a-0000-1000-8000-00805f9b34fb"
        name: "VEND1A (app to device, encrypted)"
        properties: ["write"]
        notes: "Post-login AES-CCM encrypted command channel toward the scale."
      - uuid: "0000001b-0000-1000-8000-00805f9b34fb"
        name: "CMTP (device to app, encrypted)"
        properties: ["notify"]
        notes: >
          Post-login encrypted measurement stream: multi-frame AES-CCM
          parcels (dev_key/dev_iv + counter). Decrypted plaintext holds
          an 0xA0 marker then ASCII CSV: live = "weight_x10,stable"
          (2 fields); final = 32 fields with weight_x10 idx 3, stable
          idx 4, device unix timestamp idx 6, impedance x10 as the
          last two fields (the record/history payload).
      - uuid: "00000017-0000-1000-8000-00805f9b34fb"
        name: "AVCTP"
        properties: ["notify"]
        notes: "Present on the auth service; subscribed by xiaomi-s400-live but role undocumented."
      - uuid: "0000001c-0000-1000-8000-00805f9b34fb"
        name: "VEND1C"
        properties: ["notify"]
        notes: "Present on the auth service; role undocumented."

  - uuid: "0000181b-0000-1000-8000-00805f9b34fb"
    name: "Body Composition Service (advertisement data)"
    notes: >
      Not a GATT surface on this device in the documented
      implementations — 0x181B appears as the Service Data UUID (AD
      type 0x16) carrying the 24-byte AES-CCM encrypted measurement
      broadcast. Decrypt with bindkey: nonce = MAC_reversed ||
      data[2:5] || data[-7:-4], AAD 0x11, 32-bit MIC at data[-4:],
      ciphertext data[5:-7]. Plaintext u32le at bytes 4-7: bits 0-10
      weight x0.1 kg, bits 11-17 heart rate raw (+50, valid 1-126),
      bits 18-31 impedance x0.1 ohm. Weight packet and weightless
      second-band packet must be aggregated; which band is high vs
      low frequency is contradicted between sources (medium
      confidence).

entities:
  # The three readings the encrypted CMTP channel actually carries. Its
  # decrypted CSV is weight_x10 / stable / timestamp / impedance /
  # impedance_low — confirmed against two independent implementations.
  - platform: "sensor"
    name: "Weight"
    state_characteristic: "0000001b-0000-1000-8000-00805f9b34fb"
  - platform: "sensor"
    name: "Impedance"
    state_characteristic: "0000001b-0000-1000-8000-00805f9b34fb"
  - platform: "sensor"
    name: "Impedance Low"
    state_characteristic: "0000001b-0000-1000-8000-00805f9b34fb"
  # Deliberately unbound: heart rate is NOT in the CMTP payload. It arrives
  # only in the advertisement (MiBeacon object 0x6E16, bits 11-17 plus a +50
  # offset), which this schema has no `state_characteristic` for — binding it
  # to 0x001b promised a field that channel never sends, so the sensor could
  # only ever read unavailable.
  - platform: "sensor"
    name: "Heart Rate"
    notes: >
      Deliberately unbound, and it cannot be bound as this schema stands.
      Heart rate is NOT in the CMTP payload the other sensors read: it arrives
      only in the advertisement (MiBeacon object 0x6E16, bits 11-17, plus a
      +50 offset), and there is no `state_characteristic` for an advertisement
      field. Binding it to 0x001b would promise a value that channel never
      sends, so the sensor could only ever read unavailable. It is declared so
      the name and platform are settled, and so the gap is visible; a consumer
      should either decode the advertisement itself or not render this at all.
