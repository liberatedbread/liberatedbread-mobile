# Govee H5080 BLE Smart Plug — device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Static analysis of the Govee Home Android app, wire-verified against
# egold555/Govee-Reverse-Engineering (H5080.md) and virtuald/govee-ble-plugs.
# Shares the 00010203-…-1910 GATT service family with Govee's legacy bulbs.

device:
  name: "Govee H5080 Smart Plug"
  manufacturer: "Govee (Shenzhen Intellirocks Tech / iHoment)"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "ble"
  category: "switch"
  notes: >
    WiFi + BLE smart plug family from Govee. Local BLE control uses the
    classic Govee 20-byte binary packet — [2-byte command][17-byte
    payload][1-byte XOR checksum] — wire-verified (egold555 H5080.md,
    virtuald/govee-ble-plugs plugs.py), NOT IoT-style JSON ("turn"/"state"
    are keys of the app's internal IoT abstraction, not what goes on the
    wire). The plug also has a 2.4 GHz WiFi radio (FCC 2AQA6-H5080 lists
    2412-2462 MHz; manual spec panel "IEEE 802.11 b/g/n, 2.4GHz") and a
    cloud binding; BLE local control works without WiFi or cloud.

    Family members:
    - H5080: single plug (goodsType=43)
    - H5081: single plug variant (retail SKU, FCC 2AQA6-H5081; absent
      from the APK's h5080 package — family membership unproven)
    - H5082: dual plug (goodsType=50; RE'd — right=port0, left=port1)
    - H5083: dual plug
    - H5085: Smart Plug Pro, single plug with Matter support
    - H5086: Smart Plug Pro Energy Monitoring (AA00 power metrics)
    - H5089: triple plug (goodsType=90)
    - H5160: triple plug variant
    - H5161: triple v2 (goodsTypes seen in app: 43 single, 50 & 307 dual,
      90 triple)

    COMMAND MAP (20-byte packets written to …2b11; responses echo the
    command id and arrive on …2b10):
    - AA01: get state
    - AA06 / AA20 / AA21: get firmware version (ASCII in payload)
    - AA07: get hardware version
    - AA00: power metrics (H5086 → EE19 response: seconds-powered-on,
      Wh ×0.1, voltage ×0.01 V, current ×0.01 A, power ×0.01 W,
      power factor %)
    - AAB1: get auth key (valid 16-byte key only while the physical
      button is pressed; otherwise a random decoy)
    - 33B2 <16-byte key>: authenticate this connection
    - 3301 <byte>: set on/off. Single-plug H5080: 0xFF on / 0xF0 off
      (all-ports selector — what the app's switch controller emits when
      it addresses every port at once).
    The device also sends unsolicited 3301 state notifications on
    physical-button presses, and the last manufacturer-data byte of the
    advertisement carries state (0x00/0x01; dual: bit0=right, bit1=left).

    On/off byte encoding (from the app's switch controller):
    - bits 0-3: on-state per port (1=port0, 2=port1, 4=port2, 15=all)
    - bits 4-7: port selector (0x10=port0, 0x20=port1, 0x40=port2, 0xF0=all)
    e.g. 0x11 = port 0 on (0x10|0x01), 0x22 = port 1 on (0x20|0x02),
    0x10 = port 0 off. Port-specific bytes are for multi-plug units;
    the single H5080 is driven with the all-ports 0xFF/0xF0 form.

    FIRMWARE LANDSCAPE: versions seen are 1.00.21 and 1.02.00 (RE
    captures) and 1.00.22 in the wild (2025-12 user report); the app
    treats fw <= 1.00.08 as an "old H5080" with reduced features (a
    dedicated capability check in its feature gating). OTA is in-app only
    — no public firmware
    downloads.

    PHYSICAL: 15 A / 1800 W max, ETL + FCC certified (FCC-filed manual
    spec panel).

    CONFIDENCE: HIGH for wire format, UUIDs, command bytes, and the auth
    flow — all wire-verified by two independent implementations
    (egold555 Govee-Reverse-Engineering H5080.md @ fe0cd60; virtuald/
    govee-ble-plugs plugs.py @ 2cf65db). The manufacturer company_id is
    app-confirmed (0xEC88 = 60552; recorded in the identification and
    discovery blocks). Two items still want a single nRF capture: whether
    the 128-bit service UUID is in the ADV packet, and whether a plug uses
    the leading-version-byte broadcast layout that makes hosts report
    0x88XX — that layout is confirmed on Govee lights, not on a plug.

  identification:
    service_uuids:
      - "00010203-0405-0607-0809-0a0b0c0d1910"
    local_name_prefixes:
      # The three forms the two RE implementations actually record. Other
      # family members are expected to follow one of the same two shapes
      # (ihoment_H<sku>_… legacy, GVH<sku>… modern) but are not listed
      # until a name is observed.
      - "ihoment_H5080"
      - "ihoment_H5082"
      - "GVH5086"
    manufacturer_data:
      company_id: 60552
      company_id_hex: "0xEC88"
      additional_company_ids: [34818, 34819, 34883]
      description: >
        The app's broadcast parser requires the bytes 88 EC in the
        manufacturer-specific AD structure (= company 0xEC88 / 60552 when
        they lead the payload). A leading broadcast-version byte shifts
        them to payload offset 1, making host stacks report 0x88XX
        instead — 0x8802, 0x8803 and 0x8843 are the values seen on Govee
        lights (2026-08-22), listed here because the broadcast layout is
        shared across Govee families, not because they were observed on a
        plug. Match on the bytes at payload offset 0 or 1, not on the
        parsed company id. A previous revision of this spec claimed
        63678, which appears in no source.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "regex"
            value: "^(ihoment_H5080|ihoment_H5082|GVH5086)"
          # Both RE implementations discover by local-name prefix
          # (ihoment_H5080_…, ihoment_H5082_…, GVH5086…); whether the
          # 128-bit service UUID below is actually in the ADV packet is
          # unverified (needs one capture).
          service_uuids:
            - "00010203-0405-0607-0809-0a0b0c0d1910"
          manufacturer_data:
            company_id: 60552
            additional_company_ids: [34818, 34819, 34883]
            description: >
              Company id app-confirmed: the app's broadcast parser
              requires the bytes 88 EC in the manufacturer-specific AD
              structure, and reads goodsType as 2 bytes big-endian
              immediately after them (AD payload offsets 3-4 in the
              layout that carries a leading broadcast-version byte, 2-3
              in the one that does not). That version byte is why hosts
              may report company 0x88XX instead of 0xEC88 — match the
              88 EC bytes at payload offset 0 or 1. Plug goodsTypes:
              43=single, 50 & 307=dual, 90=triple. Last byte = on/off
              state (0x00/0x01; dual: bit0=right, bit1=left).
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No BLE bonding/pairing, but there IS an application-layer token
      auth: AAB1 returns the device's static 16-byte key only while the
      physical button is being pressed, and each connection must
      authenticate with 33B2 <key> — unauthenticated 3301 commands are
      silently ignored. First-time key retrieval therefore needs physical
      access; after that the key can be reused (it is static and never
      rotatable). Device advertises on power-up.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Scan (local-name prefix ihoment_H5080_), connect, subscribe to
          notify char …2b10, fetch the auth key with AAB1 while the
          physical button is pressed, authenticate with 33B2, then write
          20-byte binary commands to …2b11.
        ble:
          pairing_required: false
        steps:
          - action: "Power the plug and scan for BLE advertisements (name prefix ihoment_H5080_)."
            actor: "client"
          - action: "Connect; subscribe to notifications on …2b10."
            actor: "client"
          - action: "Press and hold the physical button on the plug."
            actor: "user"
          - action: "Send AAB1 while the button is held to read the 16-byte auth key; store it."
            actor: "client"
          - action: "Authenticate the connection with 33B2 <key>, then write control commands (e.g. 3301)."
            actor: "client"
    factory_reset:
      applicable: true
      confidence: low
      effect: >
        Restores factory settings and returns the plug to pairing mode, so it
        can be added again in the vendor app. The stored network credentials go
        with it on the WiFi-capable models.
      description: >
        Govee's plug range resets from its own button, but the published hold
        time is model-specific and the H5080's own manual does not state one:
        ten seconds is documented for the Smart Plug Pro H5086, which is the
        nearest sibling and the reason that number appears here at all.
        Confidence stays low for exactly that reason — treat ten seconds as a
        starting point and watch the indicator rather than the clock.
      procedures:
        - name: "Hold the plug's button until it returns to pairing mode"
          verified: false
          basis: >
            Govee's documentation for the Smart Plug Pro H5086, which gives a
            ten-second hold as the factory-settings restore. The H5080's own
            manual does not state a hold time; this is the family pattern, not
            a model-specific fact.
          hold_seconds: 10
          power_state: "on"
          glyph: "generic/hold-button.svg"
          indicator: "The plug's indicator changes to its pairing pattern."
          indicator_glyph: "generic/led-flashing.svg"
          steps:
            - action: "With the plug powered, press and hold its button until the indicator changes to the pairing pattern."
              actor: "user"
              expect: "The plug is discoverable in the vendor app as a new device."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The plug accepts one BLE client at a time; any client holding the
        auth key can reconnect and re-authenticate with 33B2 once the
        previous client disconnects. WiFi/cloud state is unaffected by
        BLE client changes.
    credentials:
      wifi_passphrase_protection: unknown
      stored_on_device:
        - "WiFi credentials (2.4 GHz 802.11 b/g/n; app-driven onboarding, separate from the BLE control path)"
        - "Static 16-byte BLE auth key (never rotatable)"
        - "Govee cloud account binding"
      issued_to_client:
        - "Static 16-byte BLE auth key (AAB1, gated by physical button press)"
      notes: >
        No WiFi passphrase crosses the BLE control link. App-layer token
        auth gates switching: unauthenticated 3301 commands are ignored,
        and key issuance (AAB1) requires a physical button press — an
        RF-only attacker cannot toggle the outlet without the key.
        Residual risks: the key is static, sent in cleartext (sniffable
        during a legitimate session), and cannot be rotated. Ecosystem
        advisory: CVE-2025-10910 (CERT Polska, 2025-12) — Govee cloud
        device-binding flaw (CWE-639) enabling account takeover of online
        devices; relevant because this plug IS cloud-connected.
        Server-side fixes + OTA patches were deployed by Govee.

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
services:
  - uuid: "00010203-0405-0607-0809-0a0b0c0d1910"
    name: "Govee H5080 Plug Service"
    notes: >
      All commands are classic Govee 20-byte binary packets:
      [2-byte command][17-byte payload, zero-padded][1-byte XOR checksum
      of bytes 0-18]. Write to …2b11; responses (echoing the command id)
      and unsolicited state notifications arrive on …2b10.
    characteristics:
      - uuid: "00010203-0405-0607-0809-0a0b0c0d2b10"
        name: "State Notify"
        properties: ["read", "notify"]
        notes: >
          Response/notification channel (RECV char in govee-ble-plugs
          plugs.py). Carries command responses (command id echoed) and
          unsolicited 3301 state notifications on physical-button presses.

      - uuid: "00010203-0405-0607-0809-0a0b0c0d2b11"
        name: "Control Write"
        properties: ["read", "write_without_response"]
        notes: >
          Primary control characteristic (SEND char in plugs.py; props
          [read, write-without-response] per H5080.md). 20-byte binary
          packets; requires 33B2 authentication first — unauthenticated
          3301 commands are ignored.
          The on/off byte encodes port + state (from the app's
          switch controller): bits 0-3 on-state per port (1=port0,
          2=port1, 4=port2, 15=all), bits 4-7 port selector (0x10=port0,
          0x20=port1, 0x40=port2, 0xF0=all).
          Example: byte 0x11 = port 0 on (0x10 | 0x01)
                   byte 0x22 = port 1 on (0x20 | 0x02)
                   byte 0x10 = port 0 off (0x10 | 0x00)
          The single-plug H5080 is driven with the all-ports form:
          0xFF on / 0xF0 off.
        commands:
          turn_on:
            description: "Turn outlet on (single-plug H5080, all-ports selector). Full frame: 33 01 ff 00×16 cd."
            encoding: "bytes"
            verification: "confirmed"
            value: [0x33, 0x01, 0xFF, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xCD]
          turn_off:
            description: "Turn outlet off (single-plug H5080, all-ports selector). Full frame: 33 01 f0 00×16 c2."
            encoding: "bytes"
            verification: "confirmed"
            value: [0x33, 0x01, 0xF0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xC2]
          get_state:
            description: "Query on/off state (AA01). Response echoes AA01 on …2b10; state is also in the advertisement manufacturer-data last byte."
            encoding: "bytes"
            verification: "confirmed"
            value: [0xAA, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xAB]
          get_firmware_version:
            description: "Get firmware version as ASCII in the payload (AA06 / AA20 / AA21 all seen on the wire)."
            encoding: "bytes"
            verification: "confirmed"
            value: [0xAA, 0x06, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xAC]
          get_hardware_version:
            description: "Get hardware version (AA07)."
            encoding: "bytes"
            verification: "confirmed"
            value: [0xAA, 0x07, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xAD]
          get_power_metrics:
            description: "H5086 only: AA00 → EE19 response decoding to seconds-powered-on, accumulated Wh (×0.1), voltage (×0.01 V), current (×0.01 A), power (×0.01 W), power factor (%)."
            encoding: "bytes"
            verification: "confirmed"
            value: [0xAA, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xAA]
          get_auth_key:
            description: "AAB1: read the static 16-byte auth key. Only returns the valid key (payload[0]=0x01) while the physical button is pressed; otherwise a random decoy (payload[0]=0x00)."
            encoding: "bytes"
            verification: "confirmed"
            value: [0xAA, 0xB1, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x1B]
          authenticate:
            description: "33B2 <16-byte key>: authenticate this connection. Required before 3301 is honored; the app sends it immediately before every switch command. Full frame: 33 B2 <16 key bytes> 00 <xor>."
            encoding: "bytes"
            verification: "confirmed"
            fixed_length: 20
            template: [0x33, 0xB2, "{key}", 0x00, "{checksum}"]
            packet_layout:
              "0": "0x33, set prefix"
              "1": "0xB2, authenticate"
              "2": "key, 16 bytes as read back from AAB1, bytes 2 to 17"
              "18": "zero padding"
              "19": "XOR of bytes 0 to 18"
            parameters:
              key:
                type: "bytes"
                min_length: 16
                max_length: 16
                description: "The static 16-byte device key read with AAB1 while the physical button is held. Plugs use a 16-byte key; the Govee light families use an 8-byte one on the same AAB1/33B2 mechanism."
              checksum:
                type: "uint8"
                auto: "xor_checksum"
                checksum_start: 0
                description: "XOR of the preceding 19 frame bytes; encoder-filled, never a control."

features: []
  # switch_control omitted — not in schema feature enum.
  # Single, dual, or triple outlet control. H5085 also supports Matter.

entities:
  - platform: "switch"
    name: "Plug Outlet"
    features: ["on_off"]
    commands:
      turn_on: "turn_on"
      turn_off: "turn_off"

helpful_urls:
  - title: "virtuald/govee-ble-plugs"
    url: "https://github.com/virtuald/govee-ble-plugs"
    description: >-
      Working Python client for the H5080 plugs, and the wire-level check on the command bytes
      recorded here.
  - title: "egold555/Govee-Reverse-Engineering"
    url: "https://github.com/egold555/Govee-Reverse-Engineering"
    description: >-
      Community protocol notes for Govee devices. H5080.md is the document this spec's UUIDs and
      frames were verified against.
  - title: "LaggAt/hacs-govee (HACS)"
    url: "https://github.com/LaggAt/hacs-govee"
    description: >-
      HACS Govee integration covering the cloud-API switches/plugs; no Home Assistant integration
      speaks this BLE protocol directly yet.

  - title: "Govee H5080 smart plug manuals"
    url: "https://www.manualslib.com/products/Govee-H5080-11828283.html"
    kind: "manual"
    description: >
      Vendor manuals for the H5080. Note it gives no hold time for the reset, which is why this spec's procedure borrows the H5086's ten seconds and says so.
# RESOLVED (2026-07 verification, see research/govee-h5080-plug/CONFIRMATION.md):
# wire format is 20-byte binary (not JSON), notify is on …2b10, single-plug
# on/off is 0xFF/0xF0, and a button-gated token auth (AAB1/33B2) exists.
# TO VALIDATE (still open):
# - nRF capture: is the 128-bit service UUID in the ADV packet?
# - nRF capture: confirm 0xEC88 / the 0x88XX version-byte form on a plug
#   (app-confirmed and shared across Govee families, not yet seen on this
#   hardware; 63678 appears in no source and is not it)
# - Confirm H5085 Matter commissioning flow
# - Factory reset procedure and what it clears
