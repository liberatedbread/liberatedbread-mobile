  # No app-picker select: Roku's Channel select rides options_source, whose
  # contract is XML-over-HTTP, and Samsung's installed-app list is a
  # WebSocket event (ed.installedApp.get) with no REST equivalent. Declaring
  # a select here would promise a picker no transport can populate. The
  # launch side exists (commands.launch_app, REST) for a consumer that
  # already knows an app id.
