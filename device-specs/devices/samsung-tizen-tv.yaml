  # -- Apps. The one command here the reference app can send today: real
  #    unauthenticated REST on port 8001 (samsungtvws rest.py). The app LIST
  #    that would feed it is WebSocket-only (ed.installedApp.get), so a
  #    dynamic picker is out of reach until the WS transport lands — see
  #    samsung_remote_common.app_control.
  launch_app:
    description: >
      Launch an installed app by its store app id via the REST API.
      Reportedly unauthenticated on the Tizen fleet samsungtvws targets;
      treat a failure as "needs pairing" only after ruling out a wrong id —
      the REST surface predates the token model and does not consult it.
    transport: "http"
    method: "POST"
    path: "/api/v2/applications/{app_id}"
    action: "Launch App"
    parameters:
      app_id:
        type: "string"
        required: true
        description: >
          Samsung store app id, e.g. "3201606009684" or the well-known
          "org.tizen.browser" (launching it NATIVE_LAUNCH-style with a URL
          needs the WebSocket ed.apps.launch, not this endpoint). Opaque
          string; numeric-looking today.
    verification: "reported"

# The remote, as controls. Declaration order follows the Samsung remote:
# power, navigation/d-pad, then volume and channel rockers, transport,
# digits, inputs. Every button here presses a WebSocket command the
# reference app cannot yet send (samsung_remote_common.transport_gap) — the
# entities are declared so the layout and binding are settled the day the
# transport lands, and a consumer without WebSocket support must not offer
# them as live controls.
entities:
  # The stateful Power control (spec-evolution P13). KEY_POWER is nominally a
  # toggle, but the network stack is down in standby, so no network client
  # can reach an off set — from the network the key is discrete-off in
  # practice, which is why it binds turn_off rather than toggle: the toggle
  # direction is unreachable by construction (samsung_remote_common.power).
  # Power-on is Wake-on-LAN; no power state is readable.
  - platform: "switch"
    name: "Power"
    icon: "mdi:power"
    commands:
      turn_off: "press_power"
  - platform: "button"
    name: "Power"
    icon: "mdi:power"
    commands:
      press: "press_power"
    notes: "Network power-off only; power-on is Wake-on-LAN (samsung_remote_common.power)."
  - platform: "button"
    name: "Home"
    icon: "mdi:home"
    commands:
      press: "press_home"
  - platform: "button"
    name: "Back"
    icon: "mdi:arrow-u-left-top"
    commands:
      press: "press_back"
    notes: "The physical Return key; KEY_RETURN on the wire."
  - platform: "button"
    name: "Exit"
    icon: "mdi:close-box-outline"
    commands:
      press: "press_exit"
  - platform: "button"
    name: "Up"
    icon: "mdi:chevron-up"
    commands:
      press: "press_up"
  - platform: "button"
    name: "Left"
    icon: "mdi:chevron-left"
    commands:
      press: "press_left"
  - platform: "button"
    name: "OK"
    commands:
      press: "press_enter"
    notes: "D-pad centre; KEY_ENTER on the wire, and the trailing key of direct channel entry."
  - platform: "button"
    name: "Right"
    icon: "mdi:chevron-right"
    commands:
      press: "press_right"
  - platform: "button"
    name: "Down"
    icon: "mdi:chevron-down"
    commands:
      press: "press_down"
  - platform: "button"
    name: "Menu"
    icon: "mdi:menu"
    commands:
      press: "press_menu"
  - platform: "button"
    name: "Guide"
    icon: "mdi:television-guide"
    commands:
      press: "press_guide"
  - platform: "button"
    name: "Info"
    icon: "mdi:information-outline"
    commands:
      press: "press_info"
  - platform: "button"
    name: "Tools"
    icon: "mdi:dots-horizontal-circle-outline"
    commands:
      press: "press_tools"
  - platform: "button"
    name: "Volume Up"
    icon: "mdi:volume-plus"
    commands:
      press: "press_volume_up"
  - platform: "button"
    name: "Mute"
    icon: "mdi:volume-mute"
    commands:
      press: "press_volume_mute"
  - platform: "button"
    name: "Volume Down"
    icon: "mdi:volume-minus"
    commands:
      press: "press_volume_down"
  - platform: "button"
    name: "Channel Up"
    icon: "mdi:chevron-double-up"
    commands:
      press: "press_channel_up"
  - platform: "button"
    name: "Previous Channel"
