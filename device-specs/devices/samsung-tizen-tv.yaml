# Samsung Tizen Smart TV (2016+) — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Samsung Tizen Smart TV (2016+)"
  manufacturer: "Samsung Electronics"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "wifi"
  category: "tv"
  # Deliberately not "http": the primary control surface is a WebSocket
  # channel, and only the app-launch half of the surface is plain REST. The
  # reference app implements http/soap today, so the remote-key commands
  # below carry no `transport` — they inherit this value, and that IS the
  # recorded transport gap (see samsung_remote_common.transport_gap).
  transport: "websocket"
  notes: >
    Samsung Smart TVs from 2016 onward run Tizen and expose a local control
    API on ports 8001 (plain) and 8002 (TLS). The control channel is a
    WebSocket to /api/v2/channels/samsung.remote.control; the first
    connection from an unknown client name pops an Allow/Deny dialog on the
    TV, and an approved connection is issued a reusable token in the
    ms.channel.connect event. Remote keys are injected as ms.remote.control
    JSON messages; apps are listed and launched with ms.channel.emit
    (ed.installedApp.get / ed.apps.launch) and a small unauthenticated REST
    API under /api/v2/ covers device info and app status/run/close/install.
    Discovery is SSDP (urn:samsung.com:device:RemoteControlReceiver:1).
    Pre-2016 Samsung Smart TVs (Orsay platform) speak a different protocol on
    TCP 55000 — see samsung_legacy_common.
  openness:
    status: "undocumented"
    reverse_engineered: true
    upstream_docs:
      - url: "https://developer.samsung.com/smarttv/develop/specifications/tv-model-groups.html"
        title: "Samsung — TV model groups (model year ↔ Tizen version)"
        covers: >
          Which model families map to which year and Tizen version, i.e.
          which TVs are Tizen (2016+) and fall under this spec at all.
          Samsung publishes nothing about the local wire protocol itself.
    notes: >
      Samsung has never published the local remote-control protocol; the
      developer site documents the (cloud-paired) Smart View SDK and web-app
      APIs, not the port-8001/8002 channel. Everything here is the consensus
      of the open-source clients that drive these TVs daily: samsungtvws
      (xchwarze/samsung-tv-ws-api, the library Home Assistant's samsungtv
      integration uses), samsungctl, and homebridge-samsung-tizen. Status is
      therefore "undocumented" even though the protocol is unusually well
      trodden for a closed one — the write-up below is a reconstruction from
      client source, not a summary of vendor text.

  identification:
    ssdp_search_targets:
      - "urn:samsung.com:device:RemoteControlReceiver:1"
      - "urn:samsung.com:service:MainTVAgent2:1"
    # No mdns_service_type. 2018+ Tizen TVs advertise _airplay._tcp, but so
    # does every Apple TV and AirPlay-capable speaker; Home Assistant matches
    # it with a txt manufacturer=samsung* filter, which is a ranking hint,
    # not an identification. The SSDP targets above are the signal.
    default_port: 8001
    identity_keys:
      primary: "udn"
      secondary: "duid"
      display: "friendlyName"

  discovery:
    methods:
      - type: "ssdp"
        ssdp:
          search_targets:
            - "urn:samsung.com:device:RemoteControlReceiver:1"
            - "urn:samsung.com:service:MainTVAgent2:1"
          response_mapping:
            location:
              url: "LOCATION"
              action: "fetch_xml"
              parse:
                device_identity:
                  stable_keys:
                    - source: "xml://device/UDN"
                      key: "udn"
                  display:
                    source: "xml://device/friendlyName"
                  variant:
                    source: "xml://device/modelName"
                parse_rules:
                  - "The description is ordinary UPnP device XML; the Samsung-specific deviceType urn:samsung.com:device:RemoteControlReceiver:1 is itself the confirmation this is a controllable Samsung TV."
                  - "friendlyName is user-set and typically looks like '[TV] Samsung Q60 Series (55)'; treat it as display text only."
                  - "The LOCATION port is the UPnP description port (commonly 9197 or 8001 depending on generation), NOT the control port — control is always 8001/8002 on the same host."
                  - "The same M-SEARCH may also answer urn:schemas-upnp-org:service:RenderingControl:1 with manufacturer 'Samsung Electronics' (Home Assistant matches this as a weaker third target); dedupe on UDN."
                example: |
                  <root xmlns="urn:schemas-upnp-org:device-1-0">
                    <device>
                      <deviceType>urn:samsung.com:device:RemoteControlReceiver:1</deviceType>
                      <friendlyName>[TV] Samsung 6 Series (55)</friendlyName>
                      <manufacturer>Samsung Electronics</manufacturer>
                      <modelName>UE55KU6079</modelName>
                      <UDN>uuid:0a6b4c2e-0000-1111-2222-0cc47a000000</UDN>
                    </device>
                  </root>
      - type: "mdns"
        mdns:
          service_type: "_airplay._tcp.local."
          identity_mapping:
            stable_keys:
              - source: "txt:deviceid"
            display:
              source: "name"
    identity:
      stable_keys: ["udn", "duid"]
      display: "friendlyName"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      Onboarding happens on the TV's own screen (network selection, passphrase
      on the on-screen keyboard); there is no app-driven provisioning protocol
      to reimplement. What a LAN client must do instead is PAIR: the first
      WebSocket connection from a new client name raises an Allow/Deny dialog
      on the TV, and approval returns a reusable token in the
      ms.channel.connect event (samsung_remote_common.pairing). Medium
      confidence throughout: every step is what the open-source clients and
      Home Assistant's docs describe, replayed against no hardware here.
    methods:
      - type: "device_ui"
        verified: false
        description: >
          First-run setup on the TV itself: language, network, passphrase via
          the on-screen keyboard, optional Samsung account sign-in. The
          account gates app-store installs, not local control.
        steps:
          - action: "Power on the TV and follow the on-screen setup with the bundled remote."
            actor: "user"
          - action: "Select the WiFi network (or plug in Ethernet) and enter the passphrase on the TV itself."
            actor: "user"
            expect: "TV reports a successful connection."
          - action: "Discover the TV on the LAN."
            actor: "client"
            request:
              protocol: "ssdp"
              action: "M-SEARCH for urn:samsung.com:device:RemoteControlReceiver:1"
            expect: "A response whose LOCATION fetches a description with the Samsung RemoteControlReceiver deviceType."
          - action: "Confirm the REST API is reachable."
            actor: "client"
            request:
              protocol: "http"
              action: "GET /api/v2/"
            expect: "JSON device document (name, modelName, duid, network info) on port 8001."
          - action: "Open the WebSocket control channel; the TV shows an Allow/Deny prompt for the new client name — choose Allow."
            actor: "user"
            expect: "Client receives ms.channel.connect with data.token; denial or timeout arrives as ms.channel.unauthorized."
            notes: "The wire detail of this step is samsung_remote_common.pairing; it is a WebSocket, which the request vocabulary here cannot spell."
          - action: "Store the issued token and pass it as the token query parameter on every subsequent connection."
            actor: "client"
    factory_reset:
      confidence: "medium"
      effect: "Clears network credentials, accounts, installed apps, picture/sound settings and the Device Connection Manager approved-client list; the TV returns to first-run setup. Every paired remote-control token dies with it."
      procedures:
        - name: "Menu factory reset"
          steps:
            - action: "Settings > General > Reset (menu path varies slightly by year: on some models Settings > Support > Self Diagnosis > Reset)."
              actor: "user"
            - action: "Enter the security PIN (default 0000) and confirm; the TV reboots into first-run setup."
              actor: "user"
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Settings > General > Network > Network Settings re-runs only the
        network step; a factory reset is never needed just to change routers.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "WiFi credentials"
        - "Optional Samsung account session"
        - "Device Connection Manager approved-client list (paired remote-control clients and their tokens)"
      issued_to_client:
        - "WebSocket auth token, returned in the ms.channel.connect event after the user approves the first connection; reused as the token query parameter on port 8002."
      notes: >
        Access control is the approval prompt plus the token, not a password:
        any host on the same subnet can ASK to control the TV, but only
        approved client names get a working channel. Two settings shape this:
        General > External Device Manager > Device Connection Manager >
        Access Notification (default on newer TVs prompts on EVERY connection;
        "First Time Only" is what makes a stored token useful) and the Device
        List in the same menu, which revokes previously approved clients.
        Samsung TVs refuse WebSocket connections from a different subnet/VLAN
        — documented by both samsungtvws and Home Assistant — so network
        reachability is part of the security model whether the owner wants it
        or not.

helpful_urls:
  - title: "samsungtvws (xchwarze/samsung-tv-ws-api) — reference Python client for the Tizen WebSocket + REST API"
    url: "https://github.com/xchwarze/samsung-tv-ws-api"
    description: "The implementation this spec's wire format is reconstructed from: connection.py has the exact WS URL and token handling, remote.py the ms.remote.control / ms.channel.emit payloads, rest.py the /api/v2/ endpoints. Home Assistant's samsungtv integration wraps this library."
  - title: "samsungtvws COMMANDS.md — remote key vocabulary and CLI semantics"
    url: "https://github.com/xchwarze/samsung-tv-ws-api/blob/master/COMMANDS.md"
    description: "The KEY_* list the commands block below is drawn from, including Click/Press/Release semantics and the key_press_delay throttling clients apply."
  - title: "homebridge-samsung-tizen — command reference the samsungtvws list is adapted from"
    url: "https://tavicu.github.io/homebridge-samsung-tizen/extra/commands.html"
    description: "Independent second source for the key vocabulary; itself labelled 'not an official list from Samsung'."
  - title: "Home Assistant — Samsung Smart TV integration"
    url: "https://www.home-assistant.io/integrations/samsungtv/"
    description: "The production deployment of this protocol: SSDP/zeroconf discovery matchers, the key table, the subnet/VLAN restriction, and the Device Connection Manager 'First Time Only' fix for repeated prompts."
  - title: "samsungctl — legacy (TCP 55000) and WebSocket Samsung TV client"
    url: "https://github.com/Ape/samsungctl"
    description: "The reference for the pre-2016 Orsay protocol (remote_legacy.py): controller-string handshake, base64 key payloads, and the Allow/Deny response bytes."
  - title: "Samsung — TV model groups"
    url: "https://developer.samsung.com/smarttv/develop/specifications/tv-model-groups.html"
    description: "Official model-year ↔ Tizen version table; settles whether a given Samsung TV is Tizen (2016+, this spec) or Orsay (samsung_legacy_common)."

# Everything needed to build the WebSocket channel byte for byte, in the role
# ecp_common plays for Roku. Reconstructed from samsungtvws connection.py /
# remote.py / rest.py (v2.x/3.x), cross-checked against Home Assistant's
# samsungtv integration. Verification is "reported" throughout: exercised
# daily by those clients, replayed against no hardware here.
samsung_remote_common:
  transport: "WebSocket (RFC 6455), JSON text frames"
  transport_gap: >
    NOT SUPPORTED by the reference app today: the app's command transports
    are "http" and "soap", and this channel is a persistent WebSocket with a
    token-auth handshake. A client must implement: RFC 6455 (including TLS
    with a self-signed cert on 8002), the ms.channel.connect /
    ms.channel.unauthorized handshake events, token capture and reuse, and
    keepalive for the session. The commands block below therefore declares
    the key commands with NO `transport` key — they inherit
    device.transport "websocket", and a consumer that only speaks http/soap
    must treat them as documented-but-not-sendable rather than rendering a
    dead control. Only launch_app (REST POST) is directly sendable today.
  ports:
    8001: "ws:// plain WebSocket + http:// REST under /api/v2/. Older Tizen sets (2016-2018 era) commonly listen here; per samsungtvws connection.py the token query parameter is only appended on the TLS port, so 8001 clients typically authenticate by client name alone."
    8002: "wss:// WebSocket + https:// REST. TLS with the TV's self-signed certificate — clients disable verification (samsungtvws passes CERT_NONE). Newer Tizen sets listen here only; the token query parameter is appended when one is stored."
  connection:
    url: >
      <scheme>://<ip>:<port>/api/v2/channels/samsung.remote.control?name=<name>[&token=<token>]
      where scheme/port is ws/8001 or wss/8002, <name> is the client display
      name STANDARD-base64-encoded (samsungtvws: base64 of the UTF-8 name,
      e.g. 'SamsungTvRemote' -> 'U2Ftc3VuZ1R2UmVtb3Rl'), and token is the
      stored auth token (8002 only, when known).
    handshake: >
      The TV speaks first. A good connection delivers an ms.channel.connect
      event whose data carries the new-or-reused token and the currently
      connected client list; the client must read and store data.token
      before sending anything. Refusal is an ms.channel.unauthorized event
      (user pressed Deny, or the prompt timed out) — surface it as "approve
      the connection on the TV", not as a network failure. Startup may also
      deliver client connect/disconnect noise events; samsungtvws ignores
      everything until it sees connect or unauthorized.
    connect_event_example: >
      {"event":"ms.channel.connect","data":{"id":"...","clients":[{"attributes":{"name":"U2Ftc3VuZ1R2UmVtb3Rl"},"connectTime":...,"deviceName":"...","id":"...","isHost":false}],"token":"12345678"}}
    subnet_rule: >
      The TV refuses WebSocket connections that arrive from a different
      subnet/VLAN (both samsungtvws and the Home Assistant docs state this
      plainly). A client that can reach the REST API but never completes the
      WS handshake should suspect routing, not auth.
  key_injection:
    description: >
      One JSON text frame per key event, method ms.remote.control. Cmd is
      Click (press+release, the normal case), Press, or Release — a held key
      is Press, a pause, then Release. DataOfCmd is the key name from the
      KEY_* vocabulary. Option is the literal string "false" and
      TypeOfRemote the literal "SendRemoteKey" for every key. Clients
      throttle repeats (samsungtvws defaults to a 1s key_press_delay).
    example: '{"method":"ms.remote.control","params":{"Cmd":"Click","DataOfCmd":"KEY_HOME","Option":"false","TypeOfRemote":"SendRemoteKey"}}'
    text_entry: >
      Free text into a focused input field is TypeOfRemote "SendInputString"
      with DataOfCmd "base64" and Cmd the base64-encoded text, followed by a
      SendInputEnd message; some TVs additionally require a one-time
      ms.channel.emit broadcast of event "custom.remote.textReceived" before
      the first string (samsungtvws send_text). A cursor device exists too
      (TypeOfRemote "ProcessMouseDevice", Cmd "Move" with a Position object).
    key_vocabulary: >
      The commands block below names the common subset; the full published
      list (power, navigation, digits, channel, volume, inputs, media,
      colour keys, teletext, PIP, KEY_EXT1-41 and friends) is in
      samsungtvws COMMANDS.md and homebridge-samsung-tizen's command page —
      both self-described as unofficial, and individual keys vary by model
      and year. Known generational trap: pre-2016 KEY_POWEROFF/KEY_POWERON
      collapse to a single KEY_POWER toggle on 2016+ sets (Home Assistant
      key-table note).
  app_control:
    over_websocket: >
      ms.channel.emit frames, params {"event": ..., "to": "host"}.
      ed.installedApp.get asks for the installed-app list, answered by an
      ed.installedApp event whose data is a JSON string of app records
      (appId, name, ...) — NOT answered on all models (samsungtvws waits up
      to 10s and gives up; see its issue #23). ed.apps.launch launches:
      params data {"action_type": "DEEP_LINK"|"NATIVE_LAUNCH", "appId": ...,
      "metaTag": ...}; opening a URL is org.tizen.browser with NATIVE_LAUNCH
      and the URL as metaTag.
    over_rest: >
      The same launches and lifecycle operations exist as plain
      unauthenticated REST (samsungtvws rest.py): GET/POST/DELETE/PUT
      /api/v2/applications/{appId} = status/run/close/install, and
      GET /api/v2/ = the device-info document. These are the endpoints in
      http_endpoints below. There is no REST app LIST; the list is the
      WebSocket ed.installedApp.get above, which is why no app-picker select
      entity exists here — options_source's contract is XML-over-HTTP and
      this list is JSON-over-WebSocket.
    device_info_example: >
      GET http://<ip>:8001/api/v2/ answers JSON shaped like
      {"id":"uuid:...","name":"[TV] Samsung 6 Series (55)","version":"2.0.25",
      "device":{"type":"Samsung SmartTV","duid":"...","model":"16_JAZZM_UHD",
      "modelName":"UE55KU6079","networkType":"wireless","ip":"...",
      "wifiMac":"...","udn":"uuid:...","resolution":"3840x2160",...},
      "type":"Samsung SmartTV","uri":"http://<ip>:8001/api/v2/"}.
      device.duid / device.wifiMac are the stable identities the SSDP
      description does not carry; device.wifiMac is also what Wake-on-LAN
      needs.
  pairing:
    flow: >
      No PIN, no shared secret: authorization is the user pressing Allow on
      the TV. First connection from an unknown name -> Allow/Deny dialog.
      Allow -> ms.channel.connect carries data.token; the client stores it
      and sends it as &token= on every later connection (8002). Deny or
      timeout -> ms.channel.unauthorized. The whole flow is driven by the
      client NAME in the URL, so a client that renames itself is a new
      stranger to the TV.
    tv_settings: >
      General > External Device Manager > Device Connection Manager: Access
      Notification set to "First Time Only" stops the prompt-every-time
      behaviour newer TVs default to (Home Assistant and samsungtvws both
      document this), and Device List is where stale approvals are revoked.
      Menu labels vary slightly by Tizen generation.
  power:
    description: >
      KEY_POWER turns the TV OFF from any network client, but no network
      command can turn a standby TV on — the network stack is down. Power-on
      is Wake-on-LAN to the MAC from device.wifiMac (Home Assistant does
      exactly this; it requires WoL enabled on the TV, and ethernet-connected
      sets wake more reliably than WiFi ones).

# The pre-2016 protocol, kept in the same file because a scanner will meet
# both on one LAN and must not confuse them: an Orsay TV answers the same
# SSDP target family but has nothing on 8001/8002. Reference: samsungctl
# remote_legacy.py (0.7.1). Also a documented gap — the reference app has no
# raw-TCP transport either.
samsung_legacy_common:
  applies_to: >
    Pre-2016 Samsung Smart TVs on the Orsay platform (roughly 2011-2015:
    C/D/E/F series and most H/J series). Between the two sits a third,
    messier generation: H-series (2014) and part of J-series (2015) speak a
    WebSocket API on port 8001 wrapped in an AES-encrypted pairing exchange
    (the "encrypted" extra of samsungtvws, py3rijndael-based). That variant
    is noted here for completeness but NOT specified — treat it as an open
    research item, not as covered by either block in this file.
  transport: "TCP 55000"
  wire_format: >
    Every packet is a 3-byte header followed by a length-prefixed,
    base64-carrying payload. serialize(s) = [len(s) as one byte][0x00][s];
    strings are base64-encoded BEFORE serializing. The handshake (sent once,
    on connect) is: outer header 0x00 0x00 0x00, then serialize-raw of an
    inner payload 0x64 0x00 + serialize(base64(description)) +
    serialize(base64(id)) + serialize(base64(name)) — the "controller
    string": a description/app-string, a client id, and the client name the
    TV's prompt will show (samsungctl defaults: description "PC", id "",
    name "samsungctl"; other clients famously use "iphone..iapp.samsung").
    A key press is: outer header 0x00 0x00 0x00 + serialize-raw of inner
    payload 0x00 0x00 0x00 + serialize(base64("KEY_*")).
  responses: >
    The TV answers with a 3-byte header whose bytes 1-2 are the little-endian
    length of a TV-name string, then the name, then a 2-byte little-endian
    length and the response body. Body 0x64 0x00 0x01 0x00 = access granted;
    0x64 0x00 0x00 0x00 = denied; a body starting 0x0A = the TV is showing
    the Allow/Deny prompt (wait and read again); 0x65 = user cancelled;
    0x00 0x00 0x00 0x00 = key accepted. An empty read means the TV hung up.
  pairing: >
    Same model as Tizen, older suit: the first connection from an unknown
    controller name raises the on-screen prompt, and approval is remembered
    per name/MAC. There is no token — the client simply reconnects.
  key_vocabulary: >
    Same KEY_* names as the Tizen vocabulary (they share the remote), per
    samsungctl's table. The generational traps run the other way here:
    KEY_POWERON/KEY_POWEROFF exist on these sets where 2016+ collapsed them
    to KEY_POWER.
  transport_gap: >
    Raw TCP with a custom binary-ish envelope — also not one of the reference
    app's "http"/"soap" transports. Documented so the gap is recorded, not
    hidden.

http_endpoints:
  # The REST half of the Tizen API (samsungtvws rest.py). Same paths on
  # https://<ip>:8002 for TLS-only sets. Unauthenticated: no token, no
  # pairing prompt — which also means any same-subnet host can launch apps.
  - method: "GET"
    path: "/api/v2/"
    name: "Device Info"
    description: >
      JSON identity document: display name, modelName, model code,
      networkType, ip, wifiMac, duid, udn, resolution, Tizen-related
      versions (samsung_remote_common.app_control.device_info_example).
      The duid/wifiMac pair is the stable identity — and the WoL target —
      that the SSDP description lacks.
    response_body:
      content_type: "application/json"
  - method: "GET"
    path: "/api/v2/applications/{app_id}"
    name: "App Status"
    description: >
      Whether the named app is installed/running: {"id": ..., "name": ...,
      "running": true|false, "visible": ..., "version": ...}. App ids are
      the store's (e.g. "3201606009684", "org.tizen.browser"); there is no
      REST list, ids come from the WebSocket ed.installedApp.get event.
    response_body:
      content_type: "application/json"
  - method: "POST"
    path: "/api/v2/applications/{app_id}"
    name: "Launch App"
    description: >
      Launch (or foreground) an installed app by id. Empty body. The
      sendable half of Samsung app control — the WebSocket ed.apps.launch
      equivalent, and the only Tizen command in this file the reference app
      can execute today.
  - method: "DELETE"
    path: "/api/v2/applications/{app_id}"
    name: "Close App"
    description: "Terminate a running app by id. Catalogued for completeness; the reference app's GET/POST-only command vocabulary cannot send it."
  - method: "PUT"
    path: "/api/v2/applications/{app_id}"
    name: "Install App"
    description: "Install an app from the Samsung store by id. Same cataloguing caveat as Close App."

# One invocation per remote key, in the shape entities bind — the Roku
# catalogue's one-command-per-option convention, applied to a different
# envelope. EVERY key command here deliberately omits `transport`: it
# inherits device.transport "websocket", which the reference app does not
# implement (samsung_remote_common.transport_gap). `action` is the wire
# method and `arguments` the params object; `example_body` is the exact
# frame. Verification is "reported" throughout: the vocabulary and payloads
# are the published client implementations', exercised daily by samsungtvws
# and Home Assistant, but this project has replayed none of it against
# hardware.
commands:
  # -- Power. Off only: no network command wakes a standby TV
  #    (samsung_remote_common.power); power-on is Wake-on-LAN.
  press_power:
    description: "Toggle power — in practice, the network power-OFF. 2016+ sets collapsed KEY_POWERON/KEY_POWEROFF into this one key."
    action: "ms.remote.control"
    arguments:
      Cmd: "Click"
      DataOfCmd: "KEY_POWER"
      Option: "false"
      TypeOfRemote: "SendRemoteKey"
    example_body: '{"method":"ms.remote.control","params":{"Cmd":"Click","DataOfCmd":"KEY_POWER","Option":"false","TypeOfRemote":"SendRemoteKey"}}'
    verification: "reported"

  # -- Navigation and system.
  press_home:
    description: "Smart Hub home screen."
    action: "ms.remote.control"
    arguments:
      Cmd: "Click"
      DataOfCmd: "KEY_HOME"
      Option: "false"
      TypeOfRemote: "SendRemoteKey"
    example_body: '{"method":"ms.remote.control","params":{"Cmd":"Click","DataOfCmd":"KEY_HOME","Option":"false","TypeOfRemote":"SendRemoteKey"}}'
    verification: "reported"
  press_back:
    description: "Return one level (the physical Return key)."
    action: "ms.remote.control"
    arguments:
      Cmd: "Click"
      DataOfCmd: "KEY_RETURN"
      Option: "false"
      TypeOfRemote: "SendRemoteKey"
    example_body: '{"method":"ms.remote.control","params":{"Cmd":"Click","DataOfCmd":"KEY_RETURN","Option":"false","TypeOfRemote":"SendRemoteKey"}}'
    verification: "reported"
  press_exit:
    description: "Exit the current app/menu."
    action: "ms.remote.control"
    arguments:
      Cmd: "Click"
      DataOfCmd: "KEY_EXIT"
      Option: "false"
      TypeOfRemote: "SendRemoteKey"
    example_body: '{"method":"ms.remote.control","params":{"Cmd":"Click","DataOfCmd":"KEY_EXIT","Option":"false","TypeOfRemote":"SendRemoteKey"}}'
    verification: "reported"
  press_up:
    description: "D-pad up."
    action: "ms.remote.control"
    arguments:
      Cmd: "Click"
      DataOfCmd: "KEY_UP"
      Option: "false"
      TypeOfRemote: "SendRemoteKey"
    example_body: '{"method":"ms.remote.control","params":{"Cmd":"Click","DataOfCmd":"KEY_UP","Option":"false","TypeOfRemote":"SendRemoteKey"}}'
    verification: "reported"
  press_down:
    description: "D-pad down."
    action: "ms.remote.control"
    arguments:
      Cmd: "Click"
      DataOfCmd: "KEY_DOWN"
