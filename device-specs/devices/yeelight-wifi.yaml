# Yeelight Wi-Fi Lights (LAN Control) — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - Yeelight's own "Yeelight WiFi Light Inter-Operation Specification" PDF
#     (Qingdao Yeelink) — the vendor-published protocol (facts paraphrased).
#   - python-yeelight (Stavros Korokithakis) — reference client.
#
# Related: yeelight-cube-lamp.yaml documents one product on this same 55443
# protocol; this file documents the general bulb/strip/ceiling family.

device:
  name: "Yeelight Wi-Fi Lights (bulbs, strips, ceiling, bedside)"
  manufacturer: "Qingdao Yeelink Information Technology (Xiaomi ecosystem)"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. Facts are paraphrased from
      Yeelight's own Inter-Operation Specification and cross-checked against
      python-yeelight.
  protocol: "wifi"
  category: "light"
  transport: "tcp"
  notes: >
    Yeelight's Wi-Fi smart lights (bulbs, light strips, ceiling lights, bedside
    lamps) speak a vendor-documented local protocol on TCP port 55443: JSON
    messages terminated by CRLF, no authentication, up to 4 simultaneous TCP
    connections, quota ~60 commands/min per connection (144/min total). Local
    control is cloud-independent once enabled — but there is a one-time step: the
    "LAN Control" / developer-mode toggle must be switched on per device in the
    Yeelight app before port 55443 answers.

    DISCOVERY: a simplified SSDP on multicast 239.255.255.250 port 1982 (NOT
    1900). Search with M-SEARCH, MAN "ssdp:discover", ST "wifi_bulb". The reply
    is HTTP/1.1 200 OK with Location: yeelight://<ip>:55443, an id, a model
    (mono/color/stripe/ceiling/bslamp), fw_ver, a space-separated `support`
    method list and current state. Devices also multicast NOTIFY ssdp:alive on
    join and periodically.

    COMMAND: {"id":<int>,"method":<str>,"params":[...]}CRLF; the result echoes
    the id, e.g. {"id":1,"result":["ok"]}. Methods include: get_prop, set_power
    ("on"/"off" + effect + mode), toggle, set_bright (1-100), set_ct_abx
    (1700-6500 K), set_rgb (RGB as one int R*65536+G*256+B), set_hsv (hue 0-359,
    sat 0-100), start_cf / stop_cf (colour flow), set_scene, set_default (persist
    across power cycles), set_name, set_music (a connect-back TCP that lifts the
    rate limits). Debuggable with plain `telnet <ip> 55443`.

  openness:
    status: "documented_api"
    reverse_engineered: false
    upstream_docs:
      - url: "https://www.yeelight.com/download/Yeelight_Inter-Operation_Spec.pdf"
        title: "Yeelight WiFi Light Inter-Operation Specification"
        covers: "The port-55443 JSON protocol, SSDP on 239.255.255.250:1982, and the method set."
    notes: >
      Yeelight published this third-party specification; the facts here are
      paraphrased from it and from python-yeelight. The first-time Wi-Fi
      provisioning uses Xiaomi's closed SmartConfig and is deliberately not
      covered by the spec.

  identification:
    default_port: 55443
    ssdp_search_targets:
      - "wifi_bulb"

  discovery:
    methods:
      - type: "ssdp"
        ssdp:
          multicast_group: "239.255.255.250"
          multicast_port: 1982
          search_targets:
            - "wifi_bulb"
          response_mapping:
            location:
              url: "Location"
              action: "fetch_json"
              parse:
                device_identity:
                  stable_keys:
                    - source: "header://id"
                      key: "id"
                  display:
                    source: "header://name"
                  variant:
                    source: "header://model"
          request:
            transport: "UDP multicast"
            line_ending: "CRLF"
            mx: 1
            template: "M-SEARCH * HTTP/1.1\r\nHOST: {multicast_group}:{multicast_port}\r\nMAN: \"ssdp:discover\"\r\nST: {search_target}\r\n\r\n"
          match:
            description: "Yeelight uses port 1982, not the standard SSDP 1900; a reply carries Location: yeelight://<ip>:55443."
            rule: "ST wifi_bulb and a yeelight:// Location header."
        notes: >
          Yeelight's simplified SSDP runs on 239.255.255.250:1982 (not 1900).
          The response headers carry id (stable), model (mono/color/stripe/
          ceiling/bslamp), fw_ver, the supported-method list and current state.
    identity:
      stable_keys: ["id"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "low"
    notes: >
      First-time Wi-Fi onboarding uses Xiaomi's closed SmartConfig via the
      Yeelight app (deliberately not in the vendor spec). Crucially, the "LAN
      Control" developer toggle must be enabled per device in the app before
      port 55443 answers — a one-time, cloud-adjacent step, after which control
      is fully local.
    methods:
      - type: "smartconfig"
        verified: false
        description: >
          Onboard the light onto Wi-Fi with the Yeelight app (Xiaomi
          SmartConfig), then enable the app's "LAN Control" toggle for the
          device. Port 55443 answers only after that toggle is on.
        steps:
          - action: "Add the light in the Yeelight app and complete Wi-Fi onboarding."
            actor: "user"
          - action: "Enable 'LAN Control' (developer mode) for the device in the app."
            actor: "user"
            expect: "The light answers a get_prop on TCP 55443 and appears in SSDP (port 1982)."
    factory_reset:
      applicable: true
      confidence: low
      effect: >
        Clears Wi-Fi credentials and returns the light to onboarding. Done by a
        power-cycle sequence (typically toggle on/off ~5 times); the exact count
        is model-specific and not transcribed here.
      procedures:
        - name: "Power-cycle reset"
          verified: false
          basis: "Yeelight documents a repeated on/off power-cycle to reset; not replayed here."
          steps:
            - action: "Toggle the light on/off the documented number of times until it flashes to confirm reset."
              actor: "user"
              expect: "The light re-enters Wi-Fi onboarding."
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: >
        No documented in-place Wi-Fi rewrite over the LAN protocol; a network
        change is a reprovision through the app (and re-enabling LAN Control).
    credentials:
      wifi_passphrase_protection: "unknown"
      stored_on_device:
        - "Wi-Fi credentials"
        - "LAN Control enabled flag"
      issued_to_client: []
      notes: >
        Onboarding uses Xiaomi SmartConfig (not documented here), so passphrase
        protection during provisioning is unknown. Post-setup port-55443 control
        is unauthenticated on the LAN, gated only by the LAN Control toggle.

# The Yeelight LAN protocol. Bespoke material lives under `protocol_details`,
# the schema's namespace for single-spec protocol blocks (the schema's top
# level is closed).
protocol_details:
  yeelight_lan_protocol:
    transport: "TCP, port 55443, JSON messages terminated by CRLF"
    authentication: "none (LAN Control toggle must be enabled in the app)"
    limits: "up to 4 concurrent connections; ~60 commands/min per connection, 144/min total (music mode lifts this)"
    message: '{"id":<int>,"method":<str>,"params":[...]}CRLF ; result echoes the id'

http_endpoints:
  - method: "GET"
    path: "/"
    status: "placeholder"
    name: "Local API Placeholder"
    description: >
      Placeholder only. Control is JSON over a raw TCP socket on port 55443
      (see protocol_details.yeelight_lan_protocol), not HTTP.

commands:
  turn_on:
    description: "Turn the light on (set_power on, smooth 500ms)."
    transport: "tcp-json"
    body: '{"id":1,"method":"set_power","params":["on","smooth",500]}'
    verification: "reported"
  turn_off:
    description: "Turn the light off."
    transport: "tcp-json"
    body: '{"id":1,"method":"set_power","params":["off","smooth",500]}'
    verification: "reported"
  set_brightness:
    description: "Set brightness 1-100."
    transport: "tcp-json"
    body: '{"id":1,"method":"set_bright","params":[{level},"smooth",500]}'
    parameters:
      level:
        type: "integer"
        min: 1
        max: 100
        description: "Brightness percent."
    verification: "reported"
  set_rgb:
    description: "Set RGB colour (packed as R*65536 + G*256 + B)."
    transport: "tcp-json"
    body: '{"id":1,"method":"set_rgb","params":[{rgb},"smooth",500]}'
    parameters:
      rgb:
        type: "integer"
        min: 0
        max: 16777215
        description: "Packed RGB integer R*65536+G*256+B."
    verification: "reported"
  set_color_temp:
    description: "Set correlated colour temperature 1700-6500 K."
    transport: "tcp-json"
    body: '{"id":1,"method":"set_ct_abx","params":[{kelvin},"smooth",500]}'
    parameters:
      kelvin:
        type: "integer"
        min: 1700
        max: 6500
        description: "Colour temperature in Kelvin."
    verification: "reported"
  get_state:
    description: "Read properties (power, bright, ct, rgb, hue, sat, color_mode)."
    transport: "tcp-json"
    body: '{"id":1,"method":"get_prop","params":["power","bright","ct","rgb","hue","sat","color_mode"]}'
    verification: "reported"

entities:
  - platform: "light"
    name: "Yeelight"
    features: ["brightness", "rgb", "color_temp"]
    commands:
      turn_on: "turn_on"
      turn_off: "turn_off"
      set_brightness: "set_brightness"

helpful_urls:
  - title: "Yeelight WiFi Light Inter-Operation Specification (vendor PDF)"
    url: "https://www.yeelight.com/download/Yeelight_Inter-Operation_Spec.pdf"
    description: "The vendor-published local protocol: port 55443 JSON, SSDP on 1982, method set."
  - title: "python-yeelight"
    url: "https://gitlab.com/stavros/python-yeelight"
    description: "Reference Python client; documents music mode and the method set."
  - title: "Home Assistant Yeelight integration"
    url: "https://www.home-assistant.io/integrations/yeelight/"
    description: "HA core integration over this LAN protocol (requires LAN Control enabled)."
  - title: "Yeelight Smart LED Bulb 1S user manual"
    url: "https://www.manualslib.com/manual/1867101/Yeelight-Smart-Led-Bulb-1s.html"
    kind: "manual"
    description: >
      Vendor manual for one of the bulbs speaking the LAN control protocol this spec documents.
  - title: "Yeelight Smart LED Bulb W4 multicolor user manual (PDF)"
    url: "https://itead.cc/wp-content/uploads/2024/01/W4-User-Manual.pdf"
    kind: "manual"
    description: >
      A later model's manual, including the five-power-cycle reset.
