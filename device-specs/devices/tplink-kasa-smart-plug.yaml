# TP-Link Kasa Smart Plug — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "TP-Link Kasa Smart Plug"
  manufacturer: "TP-Link"
  manufacturer_status: "active"
  testing:
    status: verified
    detail: minimally-verified
    notes: >
      Read path verified live 2026-08-14 against a real HS210 3-way switch
      (alias placeholdered as "3-Way Switch", mac 00:31:92:AA:BB:CC), driving the protocol exactly
      as documented in kasa_protocol below. UDP discovery: the XOR-autokey
      get_sysinfo broadcast to 255.255.255.255:9999 (no length prefix) drew
      unauthenticated replies from EIGHT Kasa devices on the LAN across five
      model families — KP200, HS210, HS300, KL430, EP40 — each decoding to a
      valid sysinfo with model/alias/sw_ver. TCP control channel: a
      get_sysinfo to port 9999 with the documented 4-byte big-endian length
      prefix + XOR-autokey body returned the full sysinfo (model HS210(US),
      dev_name "Smart Wi-Fi 3-Way Light Switch", relay_state 0, rssi -59)
      with no authentication — confirming the length framing, the 0xAB
      running-key cipher (encrypt and decrypt directions) and the
      no-auth property together. These KP200/EP40/KL430 builds (2024-2025
      firmware) still answer plaintext 9999, so the KP125M-era port closure
      is not universal. Not exercised: any state-changing write
      (system.set_relay_state and friends) — the switch controls real
      lighting and nobody authorized a toggle. The Smart Bulb / Light Strip
      variant state_probes and the two variant-scoped light entities'
      bindings are likewise unexercised against hardware (the strip's
      commands themselves were verified on a KL430; the probe and the
      entity state paths were not).
  protocol: "wifi"
  category: "switch"
  transport: "tcp"  # JSON documents on a raw socket
  notes: >
    The Kasa-era TP-Link smart plugs — HS100 and HS110 (HS110 adds energy
    monitoring), plus the same-protocol HS103/HS105 and KP105/KP115 (KP115
    meters too; see device.variants for which models have the hardware, since
    that is the one difference that changes the entity surface) — speak a
    plaintext local protocol on TCP port 9999: JSON commands wrapped in a
    trivial XOR "autokey" cipher (initial key 0xAB), with no authentication of
    any kind. softScheck reverse-engineered it in 2016 and python-kasa (which
    backs Home Assistant's `tplink` integration, iot_class local_polling) has
    implemented it ever since. Day-to-day control is 100% LAN — block the plug
    from the internet at the router and everything here still works.

    TP-Link the company is alive, so manufacturer_status is `active`; what is
    endangered is this local protocol. HS100 hardware v4 on firmware 1.1.0
    (~2020) CLOSED port 9999 ("enhanced total encryption"), and newer hardware
    (EP25, KP125M, the whole Tapo line) moved to the encrypted KLAP/AES
    protocol with cloud-tied credentials — out of scope for this spec. Keep a
    working unit offline from vendor firmware updates to preserve the API.

    SAFETY: the relay is mains-rated (13–16 A depending on region) and the
    protocol has NO authentication, so anything on the LAN can toggle the load.
    Segment the device accordingly.

    This spec is transcribed from softScheck's write-up and python-kasa; the
    on-the-wire cipher and command vectors below are reproduced by
    scripts/test_kasa_spec.py from the YAML alone, but nothing here has been
    replayed against hardware by this project (verification: reported).
  openness:
    status: "documented_api"
    reverse_engineered: true
    upstream_docs:
      - url: "https://www.softscheck.com/en/blog/tp-link-reverse-engineering/"
        title: "softScheck — Reverse Engineering the TP-Link HS110"
        covers: >
          The port-9999 XOR-autokey cipher, the TCP length framing, and the
          system/emeter/netif JSON command tree.
    source_code: "https://github.com/python-kasa/python-kasa"
    license: "GPL-3.0"
    notes: >
      python-kasa is the authoritative implementation and is far better tested
      against hardware than this document; a consumer wanting a supported
      client should use it. This spec exists to document the protocol, not to
      compete with that library.

  identification:
    # The strong, honest signal: a device is a Kasa plug because it ANSWERED
    # the tplink-smarthome get_sysinfo probe (see discovery below). Only a
    # Kasa-protocol device replies at all, so a consumer that completed the
    # handshake tags the device with this token and the two are matched.
    lan_protocols:
      - "tplink-smarthome"
    # default_port gates this spec into the network match path; it is never
    # evidence on its own (port 9999 names no vendor). The MAC OUIs below are
    # TP-Link's, shared across their whole catalogue (routers, cameras, plugs),
    # so they rank a device rather than identify it — low confidence, as bare
    # strings.
    default_port: 9999
    mac_prefixes:
      - "50:C7:BF"
      - "1C:3B:F3"
      - "AC:84:C6"

  discovery:
    # No mdns/ssdp: Kasa devices announce over neither. Discovery is a UDP
    # broadcast of the XOR-encoded get_sysinfo to 255.255.255.255:9999; every
    # Kasa-protocol device on the segment answers with its full sysinfo. The
    # cipher, its test vectors and the reply shape stay in
    # protocol_details.tplink_smarthome_protocol; what is here is the part a
    # consumer executes.
    methods:
      - type: "udp_broadcast"
        udp_broadcast:
          port: 9999
          broadcast_address: "255.255.255.255"
          # `{"system":{"get_sysinfo":null}}` under the 0xAB XOR autokey, with
          # NO length prefix -- the prefix is TCP-only framing. Same vector the
          # cipher test asserts against.
          probe_hex: "d0f281f88bff9af7d5ef94b6d1b4c09fec95e68fe187e8caf09eeb87eb96eb"
          passive_ok: false
          response_format: "json_xor"
          identity_mapping:
            stable_keys:
              - source: "json:system.get_sysinfo.deviceId"
              - source: "json:system.get_sysinfo.mac"
            display:
              source: "json:system.get_sysinfo.alias"
    identity:
      stable_keys: ["deviceId", "mac"]
      display: "alias"
    static_ip_required: false

  setup:
    required: true
    confidence: "low"
    notes: >
      A factory-fresh or reset plug hosts an open AP named `TP-LINK_Smart
      Plug_XXXX` and speaks the same port-9999 protocol on it. Joining it to
      the home Wi-Fi needs no cloud account: send `netif.set_stainfo` with the
      target SSID, passphrase and key type over the local protocol (this is
      what `kasa wifi join` does in python-kasa; the official Kasa app can also
      do it without signing in). The exact set_stainfo payload has not been
      replayed by this project, so confidence is low.
    methods:
      - type: "softap_http"
        verified: false
        description: >
          Join the plug's own `TP-LINK_Smart Plug_XXXX` AP and drive the
          port-9999 TCP-JSON protocol on it (the AP transport is the same
          protocol as normal control, not literal HTTP). Confirm the device
          answers get_sysinfo, then send netif.set_stainfo with the home
          network credentials; the plug drops its AP and joins.
        softap:
          ssid_prefix: "TP-LINK_Smart Plug"
          open_network: true
          port: 9999
        steps:
          - action: "Factory reset the plug (or power a new one) and wait for its setup AP."
            actor: "user"
            timeout_seconds: 60
            expect: "An open AP named `TP-LINK_Smart Plug_XXXX` appears."
          - action: "Join the setup AP from the provisioning client."
            actor: "user"
            expect: "The client gets an address on the plug's setup subnet."
          - action: "Confirm the plug answers on the setup network."
            actor: "client"
            request:
              protocol: "udp"
              action: "get_sysinfo broadcast to port 9999"
            expect: "A sysinfo reply carrying the plug's model, mac and deviceId."
          - action: "Send the home network credentials."
            actor: "client"
            request:
              service: "netif"
              action: "set_stainfo (ssid, password, key_type) over TCP 9999"
            expect: "The plug acknowledges, drops its AP and joins the home Wi-Fi."
            timeout_seconds: 30
          - action: "Rediscover the plug on the home network."
            actor: "user"
            expect: "The plug answers a get_sysinfo broadcast on the home LAN."
            timeout_seconds: 90
    factory_reset:
      confidence: "medium"
      effect: >
        Clears Wi-Fi credentials, the device alias and any schedules/rules,
        returning the plug to its unprovisioned, AP-hosting state.
      procedures:
        - name: "Press and hold the button (~5 seconds)"
          hold_seconds: 5
          indicator: "The status LED blinks amber/green rapidly to confirm the reset."
          steps:
            - action: "With the plug powered, press and hold its physical button for about 5 seconds until the LED blinks rapidly, then release."
              actor: "user"
              notes: >
                On models with a dedicated reset pinhole (some KP-series), hold
                that instead. A short press just toggles the relay.
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: >
        There is no documented in-place credential update over the local
        protocol; treat a router change as a factory reset and reprovision.
    credentials:
      wifi_passphrase_protection: "plaintext"
      stored_on_device:
        - "Wi-Fi credentials"
      issued_to_client: []
      notes: >
        netif.set_stainfo carries the passphrase inside the same XOR-autokey
        obfuscation the rest of the protocol uses — that is not encryption, so
        the passphrase is effectively plaintext and the open setup AP is the
        only transport protection during provisioning. Post-setup control is
        unauthenticated: anything that can reach port 9999 can drive the plug.

  # The models this one spec covers. The plug models differ in exactly one
  # thing that changes the control surface: whether the plug has metering
  # hardware. The transport, cipher, framing and relay commands are identical
  # across all of them, which is why they share a spec — but the four emeter
  # sensors exist only on the metering models, and a consumer that draws them
  # on an HS100 draws four tiles that are permanently unavailable, because
  # get_emeter on a plug with no meter answers with an error rather than a
  # reading. The sensors carry `variants:` naming the models below that
  # actually have the hardware. The two smartbulb-class variants at the end
  # (Smart Bulb, Light Strip) speak the same wire protocol through different
  # service calls; their light entities are variant-scoped the same way.
  #
  # Matching a device to a variant: get_sysinfo's `model` carries a region
  # suffix ("HS110(US)", "KP115(US)"), so compare it against `model_prefix` as
  # a prefix, never for equality.
  #
  # Better still, when the reply carries it: get_sysinfo's `feature` field is
  # a colon-separated capability list and "ENE" in it means this unit has the
  # emeter module — that is a statement by the device about itself, and it is
  # the test python-kasa's has_emeter makes. Prefer `feature`; the table below
  # is for deciding what to draw before the first poll returns, and for units
  # whose firmware omits the field.
  variants:
    - model: "HS100"
      identification:
        model_prefix: "HS100"
      notes: >
        The original plug: relay only, no metering hardware — get_emeter
        answers with an error. Hardware v4 on firmware 1.1.0 (~2020) closed
        port 9999 entirely; such a unit speaks none of this spec.
    - model: "HS103"
      identification:
        model_prefix: "HS103"
      notes: "Slim relay-only plug. No metering hardware."
    - model: "HS105"
      identification:
        model_prefix: "HS105"
      notes: "Mini relay-only plug. No metering hardware."
    - model: "HS110"
      identification:
        model_prefix: "HS110"
      notes: >
        The metering plug this spec's emeter surface exists for: HS100 plus an
        energy meter. Two field families are in the field — hardware v1
        reports the emeter reply in milli-units
        (voltage_mv/current_ma/power_mw/total_wh) while later hardware reports
        plain SI floats, so the sensors below bind both (see their
        state_mapping `value_fallback`).
    - model: "KP105"
      identification:
        model_prefix: "KP105"
      notes: "Slim relay-only plug, Kasa-protocol generation. No metering hardware."
    - model: "KP115"
      identification:
        model_prefix: "KP115"
      notes: >
        Slim plug WITH energy monitoring — the KP-generation counterpart of
        the HS110, and the other model the emeter sensors apply to. Reports
        the plain SI float family; the milli-unit fallback is HS110 hw v1
        only. Vendor-documented capability, not replayed against hardware by
        this project.
    # The smartbulb-class devices that answer the same protocol. Their
    # variant identity is best read from the reply SHAPE (state_probe), not a
    # model table: a bulb's get_sysinfo carries `light_state` where a plug
    # carries `relay_state`, and a strip additionally reports `length` (its
    # LED count) — the exact discriminator the light-command comments in
    # `commands` below document. The model_prefix is the coarse pre-poll
    # hint: bulbs are the KL1xx family (KL110/KL130), strips KL4xx
    # (KL400/KL430).
    - model: "Smart Bulb"
      identification:
        model_prefix: "KL1"
        state_probe:
          command: "get_sysinfo"
          keys_present: ["light_state"]
          keys_absent: ["length"]
      notes: >
        Kasa smart bulbs (KL110/KL130 …): same transport/cipher/framing, but
        switching and dimming go through the lightingservice's
        transition_light_state (light_on / light_off / set_brightness), and
        state lives in get_sysinfo.light_state. `keys_absent: length` is
        what separates a bulb from a light strip, which a bulb call is
        silently ignored by.
    - model: "Light Strip"
      identification:
        model_prefix: "KL4"
        state_probe:
          command: "get_sysinfo"
          keys_present: ["light_state", "length"]
      notes: >
        Kasa light strips (KL400/KL430): smartbulb-class, but driven through
        smartlife.iot.lightStrip.set_light_state (strip_on / strip_off /
        strip_brightness) — the bulb's lightingservice call is silently
        ignored. `length` (LED count) in get_sysinfo is the field that marks
        a strip; the strip commands were verified on a KL430.
    # The two FAMILY variants the switch entities scope to, shape-identified
    # like the smartbulb pair so one poll decides what the device is. They sit
    # beside the per-model plug variants rather than replacing them: the model
    # table scopes the emeter sensors (a per-model hardware fact), these scope
    # the control surface (a per-family protocol fact).
    - model: "Smart Plug"
      identification:
        state_probe:
          command: "get_sysinfo"
          keys_present: ["relay_state"]
          keys_absent: ["children"]
      notes: >
        The single-outlet relay family (every HS1xx/KP1xx above): a top-level
        relay_state and no children array. The plain Outlet switch applies
        here and nowhere else — a bulb ignores set_relay_state and a strip
        switches per child.
    - model: "Power Strip"
      identification:
        state_probe:
          command: "get_sysinfo"
          keys_present: ["children"]
      notes: >
        The multi-outlet family (HS300, KP200, KP303, EP40): outlets arrive
        as a `children` array, each switched by scoping the write with
        context.child_ids. The instanced Outlets entity applies here; the
        plain Outlet switch has no top-level relay_state to read on these.
    - model: "Metering Plug"
      identification:
        state_probe:
          command: "get_sysinfo"
          keys_present: ["relay_state"]
          value_contains:
            feature: "ENE"
      notes: >
        The energy-metering members of the plug family (HS110, KP115 …),
        identified the way the model table's own comment recommends: the
        device's `feature` capability list carries "ENE" exactly when it has
        the emeter module. The four emeter sensors scope here, so a plug
        without a meter never draws four tiles that never fill.

protocol_handler: "tplink_smarthome"

# Vendor-specific protocol detail this schema does not model. Namespaced so the
# top level can stay closed; nothing here is a declared contract.
protocol_details:
  # The TP-Link Kasa local protocol, byte for byte — the role soap_common plays
  # for Wemo and ecp_common for Roku. Everything a consumer needs to build a
  # request and read a reply without hardware is here; the `commands` block below
  # names the invocations entities bind, and their `body` is the JSON documented
  # here.
  tplink_smarthome_protocol:
    transport: "TCP (control) / UDP (discovery), JSON payloads"
    port: 9999
    authentication: "none"
    cipher:
      name: "XOR autokey"
      description: >
        Byte-wise XOR with a running key. To ENCRYPT: start key = 0xAB (171);
        for each plaintext byte p, emit c = key XOR p, then set key = c. To
        DECRYPT: start key = 0xAB; for each ciphertext byte c, emit p = key XOR
        c, then set key = c. The key is thus the previous CIPHERTEXT byte after
        the first. This is obfuscation, not security — it has no secret.
      initial_key: 0xAB
      test_vectors:
        description: >
          Reproducible with the algorithm above and nothing else; asserted by
          scripts/test_kasa_spec.py. Bytes are hex. The tiny inputs pin the
          cipher direction; the get_sysinfo vector is the canonical discovery
          datagram softScheck and python-kasa both publish.
        cases:
          - plaintext_hex: "000000"
            cipher_hex: "ababab"
          - plaintext_hex: "010203"
            cipher_hex: "aaa8ab"
          - plaintext_utf8: '{"system":{"get_sysinfo":null}}'
            cipher_hex: "d0f281f88bff9af7d5ef94b6d1b4c09fec95e68fe187e8caf09eeb87eb96eb"
    framing:
      tcp: >
        Each message on the TCP stream is a 4-byte big-endian length prefix (the
        count of encrypted payload bytes, NOT including the prefix) followed by
        the XOR-encrypted JSON. The reply uses the same framing.
      udp: >
        Discovery and its replies are a single datagram of the XOR-encrypted
        JSON with NO length prefix.
    discovery:
      method: "udp_broadcast"
      destination: "255.255.255.255:9999"
      request_json: '{"system":{"get_sysinfo":null}}'
      request_datagram_hex: "d0f281f88bff9af7d5ef94b6d1b4c09fec95e68fe187e8caf09eeb87eb96eb"
      response: >
        Each Kasa-protocol device answers with a unicast datagram carrying the
        full get_sysinfo object (see the get_sysinfo command's returns): alias,
        model, deviceId, hwId, mac, rssi and relay_state. deviceId is the stable
        identity; alias is the user-facing name.
    command_tree:
      system.get_sysinfo: "Device info + current relay_state. The state poll and the discovery probe."
      system.set_relay_state: "Set the outlet relay: {state: 1} on, {state: 0} off."
      emeter.get_realtime: "Metering models only (HS110, KP115) — instantaneous voltage/current/power/total. Bound as the get_emeter command and the four sensor entities below; see device.variants for which models have the hardware."
      netif.set_stainfo: "Provisioning: join the plug to a Wi-Fi network (see device.setup)."
      cnCloud.get_info: "The cloud link's state, and the host it points at. Bound as get_cloud_info; see cloud_module."
      cnCloud.unbind: "Detach the device from its Kasa account. Needs the cloud reachable; see cloud_module."
      time.set_timezone: 'Set the clock and time zone, e.g. {"time":{"set_timezone":{"year":2016,"month":1,"mday":1,"hour":10,"min":10,"sec":10,"index":42}}} (index = the device''s time-zone table entry). Bulbs carry it on smartlife.iot.common.timesetting. What keeps schedules right when NTP is blocked; python-kasa''s `kasa time sync` sets the clock from the host''s.'
    # The local face of the vendor cloud. Worth documenting in a local-protocol
    # spec because it is how an owner cuts the device off deliberately: it names
    # the host to block, and unbinding is the one step that has to happen BEFORE
    # the block. See the top-level `cloud` block for what each host does.
    cloud_module:
      module_names:
        plug_switch_strip: "cnCloud"
        bulb_light_strip: "smartlife.iot.common.cloud"
      module_names_notes: >
        Plugs, switches, dimmers and power strips (HS300 / KP303 / KP200 /
        EP40) answer on cnCloud; smart bulbs and KL4xx light strips answer the
        same methods on smartlife.iot.common.cloud and reply "module not
        support" to cnCloud. python-kasa builds the same split (its IoT plug and
        strip classes use cnCloud, its bulb class the smartlife module).
      methods:
        get_info:
          request_json: '{"cnCloud":{"get_info":null}}'
          reply_fields:
            server: "The cloud host this unit connects to: devs.tplinkcloud.com on 2016-era firmware, n-devs.tplinkcloud.com on every newer fixture python-kasa carries. The name to block for this unit, whatever its firmware generation."
            binded: "1 while bound to a Kasa account."
            cld_connection: "1 while the cloud link is up. Read it again after blocking to confirm the block from the device's side."
            username: "The bound account's e-mail. Personal data: never paste a reply containing it anywhere public."
          example_reply_json: '{"binded":1,"cld_connection":1,"fwDlPage":"","fwNotifyType":-1,"illegalType":0,"server":"n-devs.tplinkcloud.com","stopConnect":0,"tcspInfo":"","tcspStatus":1,"username":"<account-email>","err_code":0}'
        unbind:
          request_json: '{"cnCloud":{"unbind":null}}'
          errors:
            "-8": "not bind yet: already unbound."
            "-24": "no reply from server (cnCloud): the cloud is unreachable, so the unbind did not happen. Unbind BEFORE blocking."
            "-4001": "no reply from server (smartlife.iot.common.cloud): as -24, on a bulb."
          notes: >
            Unbinding stopped the every-10-minutes Wi-Fi reconnect some 2023
            builds fall into when their cloud is blocked (see the
            n-devs.tplinkcloud.com egress entry) for one Home Assistant owner;
            another's HS220 on 1.0.10 kept looping until TP-Link's fixed build.
            Rebinding goes through the Kasa app and an account.
        set_server_url:
          request_json: '{"cnCloud":{"set_server_url":{"server":"devs.tplinkcloud.com"}}}'
          notes: >
            Sets the host the device connects to — in principle a way to point
            it at nothing without touching the router. Setting it blank does
            NOT work on an HS300-class strip, which keeps connecting to
            n-devs.tplinkcloud.com (p-doyle/Python-KasaSmartPowerStrip README);
            whether a non-resolving name sticks is untested. Not a substitute
            for a block.
        get_intl_fw_list:
          request_json: '{"cnCloud":{"get_intl_fw_list":{}}}'
          notes: >
            Asks the cloud, through the device, which firmware it is offered.
            Each offer carries fwUrl, a plain-HTTP link on
            download.tplinkcloud.com. Fails (err_code -7) while the cloud link
            is down.
      verification: "reported"
      sources:
        - "softScheck/tplink-smartplug tplink-smarthome-commands.txt (request JSON)"
        - "python-kasa kasa/iot/modules/cloud.py and its IoT test fixtures (reply fields, module split)"
        - "Home Assistant community thread 620727 (unbind error codes and the reconnect-loop effect)"
    multi_outlet_note: >
      Power strips (HS300 / KP200 / KP303 / EP40) report a `children` array in
      get_sysinfo and address each outlet by wrapping a command in
      {"context":{"child_ids":["<deviceId>0N"]}}. Handled here now: the instanced
      "Outlets" switch enumerates the children, and relay_on_child /
      relay_off_child scope the write. A single-relay plug reports no `children`,
      so the plain "Outlet" switch covers it.

# A stub access surface so the schema's "document at least one access surface"
# rule is satisfied; control is the tcp-json protocol above, not REST. The
# LIFX, Lutron and SmartThings specs carry the same placeholder for the same
# reason — the schema has no native raw-socket endpoint type.
evidence:
  app_static_analysis:
    date: "2026-08-14"
    source: "TP-Link Kasa Android app 3.4.602 (com.tplink.kasa_android, APKPure xapk), jadx decompile (clean-room audit; derived facts only)"
    confirms:
      - "The app builds an emeter request as an emeter module carrying an empty get_realtime method object — the request shape the get_emeter command's body documents."
      - "The get_realtime reply is modelled with BOTH field families: voltage/current/power/total as floats and voltage_mv/current_ma/power_mw/total_wh as integers — the two hardware behaviours python-kasa's EmeterStatus normalizes between."
      - "The app's milli-unit code path divides voltage_mv/current_ma/power_mw/total_wh by 1000 to reach V/A/W/kWh, while the legacy path reads the plain float fields directly — so the plain fields already carry SI units, as the entity units below claim."
    confidence: "medium"
    confidence_notes: "Derived from app code, not replayed against plug hardware; python-kasa's hardware-tested EmeterStatus agrees with both code paths."

http_endpoints:
  - method: "GET"
    path: "/"
    name: "Local API Placeholder"
    status: "placeholder"
    description: >
      Placeholder only. There is no HTTP surface: control is JSON over a raw
      TCP socket on port 9999 (see tplink_smarthome_protocol), not REST.

# The invocations entities bind. Each is a `tcp-json` command whose whole
# instruction is the JSON in `body`; a consumer XOR-encrypts and length-frames
# it per tplink_smarthome_protocol and writes it to port 9999.
commands:
  relay_on:
    description: "Close the relay — turn the outlet on."
    transport: "tcp-json"
    body: '{"system":{"set_relay_state":{"state":1}}}'
    example_body: '{"system":{"set_relay_state":{"state":1}}}'
    verification: "reported"
  relay_off:
    description: "Open the relay — turn the outlet off."
    transport: "tcp-json"
    body: '{"system":{"set_relay_state":{"state":0}}}'
    example_body: '{"system":{"set_relay_state":{"state":0}}}'
    verification: "reported"
  relay_on_child:
    description: >
      Close one outlet's relay on a power strip — the same set_relay_state,
      scoped to a single child by its id via the context.child_ids envelope.
    transport: "tcp-json"
    body: '{"context":{"child_ids":["{child_id}"]},"system":{"set_relay_state":{"state":1}}}'
    example_body: '{"context":{"child_ids":["8006ABCDEF0123456789AB00"]},"system":{"set_relay_state":{"state":1}}}'
    parameters:
      child_id:
        type: "string"
        source: "instance:id"
        description: "The strip's own id for the outlet (deviceId + 2-digit outlet index), from get_sysinfo's children[].id."
    verification: "reported"
  relay_off_child:
    description: "Open one outlet's relay on a power strip. See relay_on_child."
    transport: "tcp-json"
    body: '{"context":{"child_ids":["{child_id}"]},"system":{"set_relay_state":{"state":0}}}'
    example_body: '{"context":{"child_ids":["8006ABCDEF0123456789AB00"]},"system":{"set_relay_state":{"state":0}}}'
    parameters:
      child_id:
        type: "string"
        source: "instance:id"
        description: "The strip's own id for the outlet; see relay_on_child."
    verification: "reported"
  # Kasa SMART BULBS (KL110/KL130/KL430 …) answer the same protocol as a plug
  # but switch and dim through the lightingservice's transition_light_state, not
  # set_relay_state, and report their state in get_sysinfo.light_state
  # {on_off, brightness 1-100}. A consumer that finds light_state (not
  # relay_state) drives the bulb with these instead of the outlet relay.
  light_on:
    description: "Turn a Kasa smart bulb on."
    transport: "tcp-json"
    body: '{"smartlife.iot.smartbulb.lightingservice":{"transition_light_state":{"on_off":1,"transition_period":0}}}'
    example_body: '{"smartlife.iot.smartbulb.lightingservice":{"transition_light_state":{"on_off":1,"transition_period":0}}}'
    verification: "reported"
  light_off:
    description: "Turn a Kasa smart bulb off."
    transport: "tcp-json"
    body: '{"smartlife.iot.smartbulb.lightingservice":{"transition_light_state":{"on_off":0,"transition_period":0}}}'
    example_body: '{"smartlife.iot.smartbulb.lightingservice":{"transition_light_state":{"on_off":0,"transition_period":0}}}'
    verification: "reported"
  set_brightness:
    description: "Set a Kasa smart bulb's brightness (1-100), switching it on."
    transport: "tcp-json"
    body: '{"smartlife.iot.smartbulb.lightingservice":{"transition_light_state":{"on_off":1,"brightness":{brightness},"transition_period":0}}}'
    example_body: '{"smartlife.iot.smartbulb.lightingservice":{"transition_light_state":{"on_off":1,"brightness":50,"transition_period":0}}}'
    parameters:
      brightness:
        type: "integer"
        min: 1
        max: 100
        description: "Brightness percent, 1-100, from get_sysinfo.light_state.brightness."
    verification: "reported"
  # Kasa LIGHT STRIPS (KL400/KL430) are SMARTBULB-class too, but switch and dim
  # through a DIFFERENT service — smartlife.iot.lightStrip.set_light_state, not
  # the bulb's lightingservice.transition_light_state (a strip silently ignores
  # the bulb call). A strip is told apart from a bulb by the `length` field
  # (LED count) get_sysinfo carries. Verified on a KL430.
  strip_on:
    description: "Turn a Kasa light strip on."
    transport: "tcp-json"
    body: '{"smartlife.iot.lightStrip":{"set_light_state":{"on_off":1,"transition_period":0}}}'
    example_body: '{"smartlife.iot.lightStrip":{"set_light_state":{"on_off":1,"transition_period":0}}}'
    verification: "confirmed"
  strip_off:
    description: "Turn a Kasa light strip off."
    transport: "tcp-json"
    body: '{"smartlife.iot.lightStrip":{"set_light_state":{"on_off":0,"transition_period":0}}}'
    example_body: '{"smartlife.iot.lightStrip":{"set_light_state":{"on_off":0,"transition_period":0}}}'
    verification: "confirmed"
  strip_brightness:
    description: "Set a Kasa light strip's brightness (1-100), switching it on."
    transport: "tcp-json"
    body: '{"smartlife.iot.lightStrip":{"set_light_state":{"on_off":1,"brightness":{brightness},"transition_period":0}}}'
    example_body: '{"smartlife.iot.lightStrip":{"set_light_state":{"on_off":1,"brightness":50,"transition_period":0}}}'
    parameters:
      brightness:
        type: "integer"
        min: 1
        max: 100
        description: "Brightness percent, 1-100, from get_sysinfo.light_state.brightness."
    verification: "confirmed"
  get_sysinfo:
    description: >
      Read device info and current relay state. This is both the state poll
      (relay_state 0/1) and the discovery probe.
    transport: "tcp-json"
    body: '{"system":{"get_sysinfo":null}}'
    example_body: '{"system":{"get_sysinfo":null}}'
    returns:
      - name: "relay_state"
        type: "integer"
        description: "0 = off, 1 = on. The switch entity reads this."
      - name: "alias"
        type: "string"
        description: "User-assigned device name."
      - name: "model"
        type: "string"
        description: >
          Hardware model with a region suffix, e.g. HS100(US). Match it
          against a `device.variants` entry's `model_prefix` as a PREFIX — the
          suffix varies by region and hardware revision.
      - name: "feature"
        type: "string"
        description: >
          Colon-separated capability list the device states about itself:
          "TIM" on a relay-only plug, "TIM:ENE" on a metering one. "ENE" is
          the runtime test for whether the emeter module — and therefore the
          four sensor entities — exist on this unit, and it is the check
          python-kasa's has_emeter makes. Prefer it over the model table when
          the reply carries it.
      - name: "deviceId"
        type: "string"
        description: "Stable device identity."
      - name: "mac"
        type: "string"
        description: "Wi-Fi MAC address."
    verification: "reported"
  get_emeter:
    description: >
      Read the energy meter's instantaneous readings. Metering models only
      (HS110, KP115) — a plug with no metering hardware answers with an error
      rather than a reading, so a consumer should decide from get_sysinfo's
      `feature`/`model` (see device.variants) whether to poll this at all.
      This is the state poll for the four emeter sensor entities below.
    transport: "tcp-json"
    body: '{"emeter":{"get_realtime":null}}'
    example_body: '{"emeter":{"get_realtime":null}}'
    returns:
      # TWO FIELD FAMILIES, one reading each. A reply carries one family or
      # the other, never both: current firmware reports plain SI floats, HS110
      # hardware v1 reports integers in milli-units under different NAMES. The
      # milli-unit names are declared here as their own fields rather than
      # described in prose only, because the sensor entities bind them as
      # `value_fallback` paths — a consumer resolving a dotted path needs the
      # legacy key to exist in the spec, not a sentence telling it to divide a
      # key that is absent from the reply.
      - name: "voltage"
        type: "number"
        description: >
          Mains voltage in V (float). Current firmware. Absent on HS110
          hardware v1, which sends `voltage_mv` instead.
      - name: "current"
        type: "number"
        description: "Load current in A (float). Current firmware; see `current_ma`."
      - name: "power"
        type: "number"
        description: "Instantaneous load power in W (float). Current firmware; see `power_mw`."
      - name: "total"
        type: "number"
        description: "Accumulated consumption in kWh (float). Current firmware; see `total_wh`."
      - name: "voltage_mv"
        type: "integer"
        description: >
          The HS110 hardware v1 spelling of `voltage`: millivolts. Divide by
          1000 for V. Present INSTEAD OF `voltage`, not alongside it — this is
          the same normalization python-kasa's EmeterStatus performs, and both
          code paths exist in the vendor app (see evidence).
      - name: "current_ma"
        type: "integer"
        description: "HS110 hw v1 spelling of `current`: milliamperes. Divide by 1000 for A."
      - name: "power_mw"
        type: "integer"
        description: "HS110 hw v1 spelling of `power`: milliwatts. Divide by 1000 for W."
      - name: "total_wh"
        type: "integer"
        description: "HS110 hw v1 spelling of `total`: watt-hours. Divide by 1000 for kWh."
      - name: "err_code"
        type: "integer"
        description: >
          0 = no error, present on every method reply in this protocol. A
          non-zero code is what a plug with no metering hardware answers this
          command with.
    verification: "reported"
  get_cloud_info:
    description: >
      Read the cloud link's state on a plug, switch or power strip. `server`
      is the cloud host THIS unit connects to — the name to block, which has
      changed across firmware generations — and `cld_connection` reads 0 once
      a block has taken effect. Bulbs and light strips use
      get_cloud_info_bulb. See protocol_details.tplink_smarthome_protocol.cloud_module.
    transport: "tcp-json"
    body: '{"cnCloud":{"get_info":null}}'
    example_body: '{"cnCloud":{"get_info":null}}'
    returns:
      - name: "server"
        type: "string"
        description: "Cloud host this unit connects to, e.g. n-devs.tplinkcloud.com."
      - name: "binded"
        type: "integer"
        description: "1 while bound to a Kasa account, 0 once unbound."
      - name: "cld_connection"
        type: "integer"
        description: "1 while the cloud link is up, 0 while it is down or blocked."
      - name: "username"
        type: "string"
        description: "The bound account's e-mail address. Personal data; never log or share it."
    verification: "reported"
  get_cloud_info_bulb:
    description: >
      get_cloud_info for smart bulbs and KL4xx light strips, which carry the
      same methods on the smartlife.iot.common.cloud module and answer
      "module not support" to cnCloud.
    transport: "tcp-json"
    body: '{"smartlife.iot.common.cloud":{"get_info":null}}'
    example_body: '{"smartlife.iot.common.cloud":{"get_info":null}}'
    returns:
      - name: "server"
        type: "string"
        description: "Cloud host this unit connects to."
      - name: "binded"
        type: "integer"
        description: "1 while bound to a Kasa account, 0 once unbound."
      - name: "cld_connection"
        type: "integer"
        description: "1 while the cloud link is up, 0 while it is down or blocked."
    verification: "reported"

# One control: the outlet, as an on/off switch. state_command polls
# get_sysinfo; the reply's relay_state is the value, nonzero meaning on. This
# is the same switch/outlet shape the Wemo plug uses — a consumer that already
# renders a network switch needs the tcp-json transport, not a new entity kind.
entities:
  - platform: "switch"
    name: "Outlet"
    device_class: "outlet"
    icon: "mdi:power-socket"
    # Scoped to the shape-identified plug family: on a bulb this switch's
    # write is ignored and its state key absent, and on a power strip the
    # per-child Outlets entity below is the real surface. A consumer that
    # cannot evaluate the state_probe yet (before its first poll) draws
    # probe-scoped entities optimistically and settles on the reply.
    variants: ["Smart Plug"]
    state_command: "get_sysinfo"
    state_mapping:
      value: "relay_state"
      on_when: "nonzero"
    commands:
      turn_on: "relay_on"
      turn_off: "relay_off"

  # The power-strip case: a HS300 / KP200 / KP303 / EP40 reports its outlets as
  # a `children` array in get_sysinfo, each with its own id, alias and integer
  # `state`, and one outlet is switched by scoping the write with
  # context.child_ids (relay_on_child / relay_off_child). This instanced switch
  # enumerates those outlets — one on/off per child, named by its alias. It
  # yields nothing on a single-outlet plug (which reports no `children`), so a
  # consumer shows the plain "Outlet" switch above there and these per-outlet
  # switches on a strip, keyed on whether get_sysinfo carried a children array.
  - platform: "switch"
    name: "Outlets"
    device_class: "outlet"
    icon: "mdi:power-socket"
    variants: ["Power Strip"]
    instances:
      keyed_by: "id"
      children_path: "system.get_sysinfo.children"
      id_field: "id"
      label_path: "alias"
    state_command: "get_sysinfo"
    state_mapping:
      is_on: "state"
      on_when: "nonzero"
    commands:
      turn_on: "relay_on_child"
      turn_off: "relay_off_child"

  # The energy meter, as four sensors polled by get_emeter. The state_mapping
  # values are dotted JSON paths from the reply ROOT
  # ({"emeter":{"get_realtime":{...}}}) — not flattened keys, because the
  # reference app's flattener (kasaSysinfoFields in
  # liberatedbread-mobile/lib/services/kasa_control_service.dart) currently
  # lifts only system.get_sysinfo replies and returns an empty map for an
  # emeter reply; it must be extended to flatten nested replies before these
  # sensors resolve there.
  #
  # Two scoping rules, both machine-readable so a consumer does not have to
  # read prose to avoid drawing a dead tile:
  #
  #   `variants:` — these four exist only on the metering models. On an
  #   HS100/HS103/HS105/KP105 there is no meter, get_emeter answers an error,
  #   and a consumer that stamps them out anyway shows four sensors that never
  #   have a value. Drop them when the connected plug's model is not listed
  #   (or, better, when get_sysinfo's `feature` has no "ENE" — see
  #   device.variants).
  #
  #   `value_fallback` — HS110 hardware v1 does not merely scale these
  #   readings, it NAMES them differently: voltage_mv/current_ma/power_mw/
  #   total_wh, in milli-units. The primary path finds nothing on such a unit,
  #   so each sensor declares the legacy path and the factor that brings it
  #   back to the entity's `unit`. Try the primary first; use the fallback
  #   only when the primary key is absent from the reply.
  - platform: "sensor"
    name: "Voltage"
    device_class: "voltage"
    unit: "V"
    variants: ["Metering Plug"]
    state_command: "get_emeter"
    state_mapping:
      value: "emeter.get_realtime.voltage"
      value_fallback:
        path: "emeter.get_realtime.voltage_mv"
        scale: 0.001
    notes: >
      Metering models only. `voltage` (volts) on current firmware; HS110 hw v1
      sends `voltage_mv` (millivolts) instead — the value_fallback path, times
      its scale, is that reading in V.
  - platform: "sensor"
    name: "Current"
    device_class: "current"
    unit: "A"
    variants: ["Metering Plug"]
    state_command: "get_emeter"
    state_mapping:
      value: "emeter.get_realtime.current"
      value_fallback:
        path: "emeter.get_realtime.current_ma"
        scale: 0.001
    notes: >
      Metering models only. `current` (amperes) on current firmware; HS110 hw
      v1 sends `current_ma` (milliamperes) instead.
  - platform: "sensor"
    name: "Power"
    device_class: "power"
    unit: "W"
    variants: ["Metering Plug"]
    state_command: "get_emeter"
    state_mapping:
      value: "emeter.get_realtime.power"
      value_fallback:
        path: "emeter.get_realtime.power_mw"
        scale: 0.001
    notes: >
      Metering models only. `power` (watts) on current firmware; HS110 hw v1
      sends `power_mw` (milliwatts) instead.
  - platform: "sensor"
    name: "Total Consumption"
    device_class: "energy"
    unit: "kWh"
    variants: ["Metering Plug"]
    state_command: "get_emeter"
    state_mapping:
      value: "emeter.get_realtime.total"
      value_fallback:
        path: "emeter.get_realtime.total_wh"
        scale: 0.001
    notes: >
      Metering models only. `total` (kWh) on current firmware; HS110 hw v1
      sends `total_wh` (watt-hours) instead.

  # The smartbulb-class light surfaces, scoped to the variants whose
  # state_probe identifies them (a bulb's get_sysinfo has light_state and no
  # length; a strip has both). Two entities rather than one because the two
  # families dim through DIFFERENT service calls and a strip silently ignores
  # the bulb's — binding both to one entity would make half the fleet a
  # silent no-op. State for both lives in get_sysinfo.light_state
  # {on_off 0/1, brightness 1-100}, read with the same bare-key convention
  # the Outlet's relay_state uses (paths relative to the flattened sysinfo
  # object).
  - platform: "light"
    name: "Bulb"
    variants: ["Smart Bulb"]
    state_command: "get_sysinfo"
    state_mapping:
      is_on: "light_state.on_off"
      on_when: "nonzero"
      brightness: "light_state.brightness"
    commands:
      turn_on: "light_on"
      turn_off: "light_off"
      set_brightness: "set_brightness"
    notes: >
      Kasa smart bulb (KL1xx): lightingservice.transition_light_state does
      the switching and dimming. Brightness is 1-100, the same range
      get_sysinfo.light_state.brightness reports.
  - platform: "light"
    name: "Light Strip"
    variants: ["Light Strip"]
    state_command: "get_sysinfo"
    state_mapping:
      is_on: "light_state.on_off"
      on_when: "nonzero"
      brightness: "light_state.brightness"
    commands:
      turn_on: "strip_on"
      turn_off: "strip_off"
      set_brightness: "strip_brightness"
    notes: >
      Kasa light strip (KL4xx): smartlife.iot.lightStrip.set_light_state
      does the switching and dimming (verified on a KL430); the bulb-class
      call is silently ignored on a strip. Brightness is 1-100.

# The plug works entirely on the LAN; this records what it phones anyway,
# because a firmware update over that link is how HS100 hw v4 lost port 9999.
# `egress` is what scripts/generate_blocklists.py renders into DNS lists.
cloud:
  required: false
  vendor_service: "TP-Link Kasa cloud (tplinkcloud.com)"
  failure_mode: >
    Nothing local. Blocked or gone, the cloud takes with it off-LAN control
    through the Kasa app, Alexa and Google Assistant (both cloud-to-cloud),
    account binding and app-driven firmware updates; the port-9999 protocol
    this spec documents keeps working. Keeping the device away from those
    updates is how it keeps working.
  egress:
    # --- The device's standing cloud link. Which name depends on the firmware
    # generation, and the device says which: get_cloud_info's `server`.
    - host: "n-devs.tplinkcloud.com"
      contacted_by: "device"
      roles: ["device_cloud"]
      when_blocked:
        impact: "degraded"
        effect: >
          Off-LAN control through the Kasa app, Alexa and Google Assistant
          stops, and so do app-driven updates. On a set of 2023 builds a device
          that cannot reach its cloud also drops and rejoins Wi-Fi every 10
          minutes: TP-Link lists KP125/EP25 1.0.10, EP40A 1.0.5, KP303 v2
          1.0.7, HS103 v5 1.0.8, HS200 v5 1.0.10, HS210 v3 1.0.9, HS220 v3
          1.0.10, KS200 1.0.5 and KS220 1.0.9, and says fixed builds have
          shipped — which fixes it only by taking an update.
        workaround: >
          Unbind the device first (cnCloud.unbind, or
          smartlife.iot.common.cloud.unbind on a bulb) — it needs the cloud
          reachable, so do it before blocking. It stopped the reconnect loop for
          one owner, though an HS220 on 1.0.10 kept looping until the fixed
          build. Failing that, resolve this name to a LAN machine that accepts
          the TCP connection instead of to a null address; a device answered
          that way was reported to settle where a refused one did not.
      verification: "reported"
      basis: >
        The `server` value in every python-kasa IoT test fixture carrying the
        cloud module (HS210, KP105, EP25, KL130 and KL430 among them), and in
        DNS logs posted by a Home Assistant user blocking these devices
        (community.home-assistant.io/t/620727). The reconnect loop and its
        builds are TP-Link staff's (community.tp-link.com/en/smart-home/forum/topic/638558,
        2023-11-06); unbinding and the accept-the-connection workaround are
        from the same Home Assistant thread. The port is not established for
        this name.
    - host: "n-use1-devs.tplinkcloud.com"
      contacted_by: "device"
      roles: ["device_cloud"]
      region: "US"
      when_blocked:
        impact: "degraded"
        effect: >
          The US regional form of n-devs.tplinkcloud.com, with the same cost:
          off-LAN control, voice assistants and app-driven updates stop, and
          the 2023 builds listed there reconnect Wi-Fi every 10 minutes.
        workaround: "As for n-devs.tplinkcloud.com: unbind before blocking, or answer the connection on the LAN."
      verification: "reported"
      basis: >
        Seen in DNS alongside n-devs.tplinkcloud.com by a Home Assistant user
        blocking Kasa devices in the US (community.home-assistant.io/t/620727,
        post 3, 2023). Other regions presumably have their own form; none is
        documented.
    - host: "devs.tplinkcloud.com"
      contacted_by: "device"
      roles: ["device_cloud"]
      ports:
        - {port: 50443, protocol: "tcp"}
      when_blocked:
        impact: "none"
        effect: >
          Off-LAN control through the Kasa app and voice assistants stops; the
          device keeps retrying, and the Kasa app on the LAN shows it as
          "local only".
      verification: "reported"
      basis: >
        The cloud host of 2016-era firmware: softScheck's HS110 network capture
        (TLS to devs.tplinkcloud.com:50443, retried even when configured
        "local only"), an HS105 capture showing the same port in 2017
        (coverclock.blogspot.com, 2017-07), and the default value in
        softScheck's set_server_url example. The "local only" app state is a
        Home Assistant user's report (community.home-assistant.io/t/244229).
    - host: "devs-gw.tplinkcloud.com"
      contacted_by: "device"
      roles: ["device_cloud"]
      when_blocked:
        impact: "unknown"
        effect: >
          TP-Link staff say an HS103 (hardware 2, firmware 1.1.2) must be able
          to resolve this name and deventry.tplinkcloud.com; what fails when it
          cannot is not stated.
      verification: "reported"
      basis: "TP-Link staff reply, community.tp-link.com/us/home/forum/topic/217202 (2020-07-15)."
    - host: "deventry.tplinkcloud.com"
      contacted_by: "device"
      roles: ["device_cloud"]
      when_blocked:
        impact: "unknown"
        effect: >
          TP-Link staff say an HS103 (hardware 2, firmware 1.1.2) must be able
          to resolve this name and devs-gw.tplinkcloud.com; what fails when it
          cannot is not stated.
      verification: "reported"
      basis: "TP-Link staff reply, community.tp-link.com/us/home/forum/topic/217202 (2020-07-15)."
    # --- Firmware images. The cloud offers the update (over the link above);
    # the image itself comes from here, over plain HTTP.
    - host: "download.tplinkcloud.com"
      contacted_by: "device"
      roles: ["firmware_download"]
      ports:
        - {port: 80, protocol: "tcp"}
      when_blocked:
        impact: "none"
        effect: >
          No image can be fetched from here, so an update ordered through the
          app or the cloud fails to download. The cloud hands the device the
          URL, so an image served from any other host would get past this — no
          source has tested the block itself, which is why the firewall rule
          stays the recommendation.
      verification: "reported"
      basis: >
        Every fwUrl in python-kasa's IoT fixtures that answer
        get_intl_fw_list (KL130, KS200M, KL430 v2) is
        http://download.tplinkcloud.com/firmware/<image>.bin; a Home Assistant
        community guide to manual updates uses the same host
        (community.home-assistant.io/t/474097).
    # --- Unexplained lookups.
    - host: "aps1-api.tplinkra.com"
      contacted_by: "device"
      roles: ["other"]
      region: "APAC"
      when_blocked:
        impact: "none"
      verification: "reported"
      basis: >
        An HS110 owner's Pi-hole logged 300,000+ lookups a day for this name
        while it did not resolve; the device stopped once Pi-hole answered it
        as blocked (community.tp-link.com/en/home/forum/topic/110890, 2018).
      notes: >
        Purpose unknown. A sinkhole answer is what calmed the lookups, which
        is an argument for listing it rather than leaving it to fail upstream.
    - host: "use1-api.tplinkra.com"
      contacted_by: "device"
      roles: ["other"]
      region: "US"
      when_blocked:
        impact: "none"
      verification: "hypothesis"
      basis: >
        A Home Assistant user lists "use1-api-tplinkra.com" among the names
        their Kasa devices looked up (community.home-assistant.io/t/620727,
        post 3), read here as a typo for the US form of aps1-api.tplinkra.com.
      notes: "Purpose unknown; see aps1-api.tplinkra.com."
    # --- Time. Never block these: redirect them to a LAN NTP server.
    - host: "pool.ntp.org"
      match: "subdomains"
      contacted_by: "device"
      roles: ["time"]
      ports:
        - {port: 123, protocol: "udp"}
      when_blocked:
        impact: "degraded"
        effect: >
          Schedules, timers and away mode run on the device's clock, and there
          is no battery-backed clock: after a power cut the device keeps a
          default time (an HS100 wakes in January 2000) until something sets
          it.
        workaround: >
          Resolve the name to a LAN NTP server (DHCP's NTP option is not known
          to reach the device), or set the clock over the local protocol —
          time.set_timezone, or python-kasa's `kasa time sync`.
      verification: "reported"
      basis: >
        An EP10/H100/HS220 capture shows NTP to pool.ntp.org and time.nist.gov,
        and redirecting both to a local chrony server by DNS stopped the
        retries (lkeng.org, 2026-01-15); softScheck's 2016 HS110 setup capture
        used cn.pool.ntp.org, which `subdomains` covers. Schedule dependence on
        the clock is TP-Link's FAQ 1206; the January 2000 reset is from
        community.tp-link.com topic 270194.
    - host: "time.nist.gov"
      contacted_by: "device"
      roles: ["time"]
      ports:
        - {port: 123, protocol: "udp"}
      when_blocked:
        impact: "degraded"
        effect: "As for pool.ntp.org: schedules, timers and away mode drift or stop once the clock is lost."
        workaround: "Resolve the name to a LAN NTP server, or set the clock over the local protocol."
      verification: "reported"
      basis: >
        lkeng.org's 2026-01-15 capture (EP10, H100, HS220), and a Home
        Assistant user's DNS log (community.home-assistant.io/t/620727, post 3).
    # --- The Kasa app's hosts. Recorded so nobody mistakes them for the
    # device's; a router list never carries them.
    - host: "wap.tplinkcloud.com"
      contacted_by: "app"
      roles: ["account", "api"]
      when_blocked:
        impact: "none"
        effect: "The Kasa app loses its cloud sign-in and device list on this network. The device is unaffected."
      verification: "reported"
      basis: >
        Captured from the Kasa app's traffic (itnerd.space, 2017-01-22), with
        regional forms eu-wap., use1-wap. and aps1-wap.tplinkcloud.com.
    - host: "n-wap.tplinkcloud.com"
      contacted_by: "app"
      roles: ["account", "api"]
      when_blocked:
        impact: "none"
        effect: "As for wap.tplinkcloud.com: the app's cloud side, not the device's."
      verification: "reported"
      basis: "The Kasa host constant in the open-source piekstra/tplink-cloud-api client (tplinkcloud/client.py); regional forms such as n-use1-wap. are handed out at sign-in."
  notes: >
    The devices use the resolver DHCP gives them (dnsmasq and Pi-hole blocks
    are reported to take effect, and no hardcoded resolver has been
    established), so a DNS list does reach them — it is still the second
    layer.
    The device-cloud name is the one that moves between firmware
    generations; before relying on a list, ask the unit itself
    (get_cloud_info's `server`). Whether a device updates without an app
    confirming it is contested: TP-Link says Kasa firmware only updates
    through the app, and some owners report HS100/HS110 firmware 1.1.0
    arriving unasked in 2020 on units they had not blocked.

local_access:
  status: "native"
  summary: >
    Speaks the port-9999 protocol above as shipped, with no account and no
    cloud, on the firmware this spec covers. The risk is not the vendor
    disappearing but the vendor updating it: HS100 hardware v4 lost the port
    in firmware 1.1.0.
  covers:
    - "On/off, per-outlet control on strips, and energy readings on metering models."
    - "Bulb and light-strip on/off and brightness."
    - "Discovery by UDP broadcast, and Wi-Fi provisioning over the SoftAP."
    - "Setting the clock (time.set_timezone in the command tree), which keeps schedules right with NTP blocked."
  not_covered:
    - "Off-LAN control through the Kasa app, Alexa and Google Assistant: cloud-only."
    - "Firmware updates, deliberately: keeping them out is the point of blocking."
    - "Unbinding from a Kasa account, which needs the cloud reachable."

