# Ecowitt Wi-Fi Gateways — Device Spec (research note)
# Vendor-documented local APIs: TCP 45000 binary protocol, HTTP JSON on port 80,
# and configurable custom-server push. No cloud account needed for any local path.
# Sources checked 2026-08-07: osswww.ecowitt.net telnet PDF v1.6.4,
# wxforum.org topic 40730 (wiki), blog.meteodrenthe.nl (2023-02),
# github.com/mplogas/ecowitt-controller, HA core ecowitt integration (local_push).

device:
  id: ecowitt-gateways
  name: Ecowitt GW1000/GW1100/GW1200/GW2000/GW3000 gateways (+ HP2551/HP2560 consoles; Froggit/Sainlogic/Bresser clones)
  manufacturer: Ecowitt / Fine Offset (Shenzhen)
  category: weather_station
  safety_class: LOW

transport:
  type: wifi
  local_only: true
  note: >
    Gateways join the LAN and expose three local interfaces: a documented
    binary TCP API on port 45000, unauthenticated HTTP JSON endpoints on
    port 80 (newer firmware), and a user-configurable custom-server push
    (Ecowitt or Wunderground wire format) to any LAN host. Cloud upload to
    ecowitt.net is optional and independent.

lan:
  control:
    - protocol: tcp
      port: 45000
      note: >
        Officially documented binary command protocol (vendor PDF v1.6.4,
        community has v1.6.9). Read live data, sensor registry/battery,
        firmware info, calibration, rain totals; write custom-server config;
        reboot. Used by weewx-gw1000, ecowitt-gw1000 (Node), gw1000-http,
        FOSHKplugin.
    - protocol: http
      port: 80
      auth: none
      endpoints:
        - GET /get_livedata_info      # live sensor values, JSON
        - GET /get_sensors_info?page=1  # registered sensors, battery, signal (page=2 for more)
        - GET /get_ws_settings
        - GET /get_units_info
        - GET /get_calibration
        - GET /get_rain_totals
        - GET /get_device_info
        - GET /get_piezo_rain         # WS90 piezo rain (GW2000/GW3000 era)
    - protocol: http-push
      note: >
        Custom-server upload configured locally (web UI or WS View Plus app):
        target host/port/path/interval + protocol type Ecowitt (HTTP POST form)
        or Wunderground (HTTP GET query). HA core ecowitt integration
        (iot_class: local_push) is built on this.

protocol:
  note: >
    TCP 45000 protocol is vendor-published (request/response frames with
    command byte, length, checksum). HTTP endpoints return plain JSON.
    Custom-server POST fields: PASSKEY, stationtype, dateutc, tempinf,
    humidityin, baromrelin, baromabsin, tempf, humidity, winddir, windspeedmph,
    windgustmph, rainin, dailyrainin, solarradiation, UV, soilmoisture, etc.
  commands:
    live_data: TCP 45000 CMD_READ_LIVEDATA or GET /get_livedata_info
    sensor_registry: TCP 45000 sensor-info command or GET /get_sensors_info?page=N
    set_custom_server: TCP 45000 write command (also web UI/app)
    reboot: TCP 45000 command

status:
  apk_acquired: false    # n/a — protocol vendor-documented
  apk_decompiled: false
  uuids_recovered: false # n/a — no BLE in data path
  protocol_recovered: true  # vendor-documented + multiple OSS implementations
  hci_snoop_needed: false
  cloud_dead: false      # company active; cloud optional
  rating: confirmed
  references:
    - osswww.ecowitt.net/uploads/20220407/WN1900 GW1000,1100 WH2680,2650 telenet v1.6.4.pdf
    - wxforum.org/index.php?topic=40730.0 (Ecowitt/Fine Offset wiki, firmware to 2024+)
    - blog.meteodrenthe.nl/2023/02/03/how-to-use-the-ecowitt-gateway-gw1000-gw1100-local-api/
    - github.com/mplogas/ecowitt-controller
    - home-assistant.io/integrations/ecowitt (iot_class: local_push)
