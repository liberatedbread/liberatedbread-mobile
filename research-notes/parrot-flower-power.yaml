# Parrot Flower Power — Device Research Note (structured)
# Sources: Parrot official BLE doc (developer.parrot.com FlowerPower-BLE.pdf),
# emericg/WatchFlower docs/flowerpower-ble-api.md, sandeepmistry/node-flower-power
# APK: com.parrot.flowerpower NOT fetchable (delisted; APKPure has no versions as of 2026-08-03)

device:
  id: parrot-flower-power
  name: Parrot Flower Power (plant sensor; Parrot Pot is a sibling)
  manufacturer: Parrot SA
  category: plant_sensor
  safety_class: LOW

transport:
  type: ble
  local_only: true
  cloud_note: >
    Sensor readings and on-device history are 100% local GATT. Parrot cloud
    supplied only the plant database / care recommendations (dead).

ble:
  advertising:
    name_patterns: ["^Flower power [0-9A-Fa-f]{4}$"]  # last 4 = MAC suffix
    service_uuids: ["39e1fa00-84a8-11e2-afba-0002a5d5c51b"]
    note: fw 1.0 units may not advertise the service UUID; match on name

  services:
    - uuid: "39e1fa00-84a8-11e2-afba-0002a5d5c51b"
      name: live_service
      characteristics:
        - {uuid: "39e1fa01-84a8-11e2-afba-0002a5d5c51b", name: sunlight, properties: [read, notify]}
        - {uuid: "39e1fa02-84a8-11e2-afba-0002a5d5c51b", name: soil_conductivity, properties: [read, notify]}
        - {uuid: "39e1fa03-84a8-11e2-afba-0002a5d5c51b", name: soil_temperature, properties: [read, notify]}
        - {uuid: "39e1fa04-84a8-11e2-afba-0002a5d5c51b", name: air_temperature, properties: [read, notify]}
        - {uuid: "39e1fa05-84a8-11e2-afba-0002a5d5c51b", name: soil_moisture, properties: [read, notify]}
        - {uuid: "39e1fa06-84a8-11e2-afba-0002a5d5c51b", name: live_measure_period, properties: [read, write]}
        - {uuid: "39e1fa07-84a8-11e2-afba-0002a5d5c51b", name: led, properties: [read, write], note: "write 1 = blink until disconnect, 0 = off"}
        - {uuid: "39e1fa08-84a8-11e2-afba-0002a5d5c51b", name: last_move_date, properties: [read, notify]}
        # firmware >= 1.1.0 calibrated set:
        - {uuid: "39e1fa09-84a8-11e2-afba-0002a5d5c51b", name: soil_moisture_calibrated, properties: [read, notify]}
        - {uuid: "39e1fa0a-84a8-11e2-afba-0002a5d5c51b", name: air_temperature_calibrated, properties: [read, notify]}
        - {uuid: "39e1fa0b-84a8-11e2-afba-0002a5d5c51b", name: sunlight_calibrated, properties: [read, notify]}
        - {uuid: "39e1fa0c-84a8-11e2-afba-0002a5d5c51b", name: ea_calibrated, properties: [read, notify]}
        - {uuid: "39e1fa0d-84a8-11e2-afba-0002a5d5c51b", name: ecb_calibrated, properties: [read, notify]}
        - {uuid: "39e1fa0e-84a8-11e2-afba-0002a5d5c51b", name: ecp_calibrated, properties: [read, notify]}

    - uuid: "39e1fb00-84a8-11e2-afba-0002a5d5c51b"
      name: upload_service
      note: characteristics undocumented
    - uuid: "39e1fc00-84a8-11e2-afba-0002a5d5c51b"
      name: history_service
      characteristics:
        - {uuid: "39e1fc01-84a8-11e2-afba-0002a5d5c51b", name: history_nb_entries, properties: [read]}
        - {uuid: "39e1fc02-84a8-11e2-afba-0002a5d5c51b", name: history_last_entry_idx, properties: [read]}
        - {uuid: "39e1fc03-84a8-11e2-afba-0002a5d5c51b", name: history_transfer_start_idx, properties: [read, write]}
        - {uuid: "39e1fc04-84a8-11e2-afba-0002a5d5c51b", name: history_current_session_id, properties: [read]}
        - {uuid: "39e1fc05-84a8-11e2-afba-0002a5d5c51b", name: history_current_session_start_idx, properties: [read]}
        - {uuid: "39e1fc06-84a8-11e2-afba-0002a5d5c51b", name: history_current_session_period, properties: [read]}
    - uuid: "39e1fd00-84a8-11e2-afba-0002a5d5c51b"
      name: clock_service
      characteristics:
        - {uuid: "39e1fd01-84a8-11e2-afba-0002a5d5c51b", name: current_time, properties: [read]}
    - uuid: "39e1fe00-84a8-11e2-afba-0002a5d5c51b"
      name: calibration_service
      note: characteristics undocumented
    - uuid: "f000ffc0-0451-4000-b000-000000000000"
      name: ota_service
      note: TI OAD firmware update

  standard_services:
    - {uuid: "0000180a-0000-1000-8000-00805f9b34fb", name: device_information}
    - {uuid: "0000180f-0000-1000-8000-00805f9b34fb", name: battery_service, characteristics: ["00002a19-0000-1000-8000-00805f9b34fb"]}

protocol:
  note: >
    Pure GATT reads/notifies; little-endian payloads. Device disconnects ~1s
    after the last request, so clients must pipeline requests or reconnect per
    poll. Raw values need conversion (see WatchFlower source); calibrated
    characteristics (fw >= 1.1.0) give SI-ish values directly.
  byte_order: little-endian

status:
  apk_acquired: false   # delisted; apkeep apk-pure + huawei both empty (2026-08-03)
  apk_decompiled: false
  uuids_recovered: true # from official Parrot BLE doc + WatchFlower GATT table
  protocol_recovered: true  # publicly documented; reference implementations exist
  hci_snoop_needed: false
  references:
    - github.com/sandeepmistry/node-flower-power
    - github.com/Parrot-Developers/node-flower-power
    - github.com/emericg/WatchFlower (docs/flowerpower-ble-api.md)
    - developer.parrot.com/docs/FlowerPower/FlowerPower-BLE.pdf
