      characteristics:
        - uuid: "22bb746f-2bb2-7554-2d6f-726568705327"
          name: wake
          description: Write 01 to wake the robot
          properties: [write]
        - uuid: "22bb746f-2bb7-7554-2d6f-726568705327"
          name: tx_power
          description: Set radio TX power during session init
          properties: [write]
        - uuid: "22bb746f-2bbd-7554-2d6f-726568705327"
          name: anti_dos
          description: Write anti-DoS unlock code during session init
          properties: [write]
        - uuid: "22bb746f-2bb6-7554-2d6f-726568705327"
          name: response_notify
          description: Command responses/notifications (2bbe/2bbf also present in DEX; exact write-vs-notify split per vendor doc)
