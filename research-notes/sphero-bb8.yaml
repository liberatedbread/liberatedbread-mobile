    - uuid: "22bb746f-2ba0-7554-2d6f-726568705327"
      name: dfu_service
      description: Sphero firmware update service (chars 2ba1, 2ba6)
    - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
      name: device_information
  notes: >
    Classic SPP UUID 00001101 also present in app (Ollie-era fallback).
    Session init order per vendor docs: anti-DoS code, TX power, then Wake=01.

protocol:
  note: >
    Vendor-published "Sphero BLE API" packet protocol (SOF/did/cid/seq/dlen/data/chk).
    Roll (heading+speed), RGB LED, back LED, raw motors, stabilisation toggle,
    sensor streaming. BB-8 shares the SPRK+-generation command set; R2-D2 adds
    dome/leg actuator commands (see spherov2.js).
  references:
    - Sphero published BLE API documentation (sphero.com developers, archived)
    - github.com/igbopie/spherov2.js   # covers BB-8, BB-9E, R2-D2, R2-Q5, Force Band
    - sphero.com/pages/legacy-products # vendor: use Sphero Edu for BB-8

