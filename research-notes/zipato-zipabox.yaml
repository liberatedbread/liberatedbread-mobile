# Zipato Zipabox / ZipaMicro / ZipaTile — Device Spec (research note, REJECTED)
# Local API disabled by vendor in firmware 1.3.60 (2019-03) after pass-the-hash
# and shared-root-SSH-key disclosures (BlackMarble 2019-07). Cloud-only since.

device:
  id: zipato-zipabox
  name: Zipato Zipabox / ZipaMicro / ZipaTile
  manufacturer: Zipato (Tri Plus Grupa) — zombie vendor, blog stale since 2022-04
  category: smart_home_hub
  safety_class: LOW

transport:
  type: wifi
  local_only: false   # REJECTED: no clean local path on current firmware
  note: >
    Pre-2019 firmware had a local HTTP API, but it shipped with pass-the-hash
    auth and a fleet-wide root SSH key. Vendor response (fw 1.3.60, 2019-03)
    disabled the local API, serial console, and locked SSH. Patched hubs are
    cloud-only; unpatched hubs are exploitable. Not documentable as a local
    control target.

status:
  apk_acquired: false
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: false
  cloud_dead: false   # cloud nominally up; vendor unresponsive
  rejected: true
  reject_reason: local API removed by vendor (fw 1.3.60); only alternatives are
    vulnerable legacy firmware or exploiting locked SSH surface
  references:
    - blackmarble.sh/zipato-smart-hub/ (2019-07-02)
    - latesthackingnews.com/2019/07/05/hackers-can-exploit-zipato-smart-home-hub-flaws-to-break-in/
    - zipato.com (live but stale, checked 2026-08-07)
