# Kankun KK-SP3 "Small K" — Device Spec (research note)
# Dead vendor/cloud (app-era ~2014); device is an OpenWrt box with open SSH
# Local path: SSH (root/p9z34c) GPIO toggle, or community HTTP relay.cgi

device:
  id: kankun-kk-sp3
  name: Kankun KK-SP3 "Small K" Wi-Fi Smart Plug
  manufacturer: Kankun / Huafeng (brand defunct, AliExpress generic)
  category: smart_plug
  safety_class: MEDIUM  # mains relay + public default root password; open-case reflash needs mains caution

transport:
  type: wifi
  local_only: true
  note: >
    No cloud ever involved in control. Device runs OpenWrt/BusyBox with
    dropbear SSH enabled by default. Vendor app/cloud long dead and unneeded.

lan:
  discovery:
    method: network_scan  # own AP for provisioning; then DHCP
  control:
    - protocol: ssh
      port: 22
      auth: "root / p9z34c (default — change immediately)"
      method: toggle relay GPIO directly (/sys/class/gpio) or stock relay script
    - protocol: http
      port: 80
      method: community CGI relay.cgi?state=1|0 (jsoncallback variant for JSON)

protocol:
  note: >
    There is no vendor protocol worth documenting — the device is a Linux
    computer. The "protocol spec" is: SSH in, flip a GPIO. Full OpenWrt
    upgrade documented (siemieniak.net 2020); back up mtd5 first.
  commands:
    power_on: "relay.cgi?state=1 (or GPIO write over SSH)"
    power_off: "relay.cgi?state=0"

status:
  apk_acquired: false   # n/a — vendor app unnecessary
  apk_decompiled: false
  protocol_recovered: true   # Hackaday 2014 + multiple guides + OpenWrt support
  rating: confirmed
  cloud_dead: true
  references:
    - hackaday.com/2014/11/13/hacking-a-20-wifi-smart-plug/ (2014-11-13)
    - anites.com/2015/01/hacking-kankun-smart-wifi-plug.html
    - blog.donbowman.ca/2018/01/30/...kankun-sp3/ (2018-01-30)
    - adrian.siemieniak.net/portal/kankun-smart-plug-openwrt-upgrade/ (2020-03-30)
    - github.com/yurt-page/Kankun_KK-SP3
