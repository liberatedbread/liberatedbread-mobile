# Nura Nuraphone / NuraLoop / NuraTrue — Device Spec (research draft)
# Sources: static analysis of com.nuraphone.android v4.5.4 (jadx, apk-pure via apkeep)
# XAPK SHA-256: cb520a2bfa6262f2c55565f294ce74ef2ca13037540e9d11a5b8d01cc1d33975
# Community RE: CallumCarmicheal/Nura-Windows (Apache-2.0), jamesy0ung/opennura (GPLv3),
#               RohitJacob/jura_ai (GPLv3)
# Company: Nura acquired by Denon/Masimo Apr 2023; Nura-branded products discontinued

device:
  id: nuraphone
  name: Nura Nuraphone (also NuraLoop, NuraTrue, NuraTrue Pro, NuraBuds)
  manufacturer: Nura Operations Pty Ltd (Melbourne) — DEFUNCT 2023 (acquired by Denon/Masimo)
  category: audio_headphones
  safety_class: LOW  # caveat: community warns of possible sudden loud output while experimenting
  rating: confirmed

transport:
  type: bluetooth_classic
  local_only: true
  cloud_dependency: one_time_key_provisioning
  cloud_caveat: >
    All control commands are AES-encrypted with a per-device 16-byte key.
    First-time key recovery needs Nura's backend (email + verification code,
    still online as of 2026 per opennura/jura docs) OR manual extraction of
    the key from a previously-paired phone. After the key is stored locally,
    control is fully offline. Nura backend is at-risk (company defunct).

bluetooth_classic:
  profiles: [a2dp_sink, hfp, avrcp, spp]
  spp_uuids:
    - uuid: "00001101-0000-1000-8000-00805f9b34fb"  # standard SPP
      role: control_channel
      notes: GAIA service on RFCOMM channel 1 (per opennura); insecure socket OK
  quirks:
    - headphone serves the wrong BT channel while A2DP streaming; drop audio
      link first, open control channel, then resume audio
    - iOS app uses BLE GATT instead of RFCOMM (not covered here)
  ios_alternate: ble_gatt

protocol:
  name: Qualcomm GAIA (framing) + Nura crypto layer
  framing:
    source_class: com.nuraphone.android.commands.GAIACommand
    layout: [SOF, version, flags, payload...]  # GAIA standard
    command_ids_class: com.nuraphone.android.commands.GAIACommandID
    response_class: com.nuraphone.android.commands.GAIAResponse
  crypto:
    source_class: com.nuraphone.android.crypto.NativeWrapper (native lib)
    scheme: per-device 16-byte AES key; authenticated encrypt/decrypt; challenge-response auth
    key_acquisition: nura_backend_relay (one-time) or manual extraction from paired phone
  controls_mapped_by_community:
    - anc_off_anc_social_passthrough
    - immersion_level_-2_to_+4
    - personalised_vs_neutral_sound
    - profile_switch_rename_compare
    - touch_button_remap
    - battery_state_monitoring

status:
  apk_acquired: true          # com.nuraphone.android v4.5.4 XAPK from apk-pure
  apk_decompiled: true        # jadx; Kotlin + Flutter UI, native crypto lib
  uuids_recovered: true       # standard SPP 00001101; RFCOMM channel 1
  protocol_recovered: true    # GAIA framing + crypto confirmed in APK; full command map in community repos
  community_re: true          # three working open-source clients (Windows/macOS/iOS)
  hci_snoop_needed: false
  live_device_validation: false
  open_questions:
    - nura backend longevity (key provisioning + account)
    - coverage of NuraLoop/NuraTrue Pro/Denon PerL Pro (partial in opennura)
