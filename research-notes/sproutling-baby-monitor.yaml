# Sproutling Wearable Baby Monitor (Mattel / Fisher-Price) — Research Note
# Cloud shut down 2018-10-31 (official Mattel service FAQ, product FNF59)
# APK source: apkeep (APKPure mirror), com.fisherprice.sproutling v1.2.4
# APK SHA-256: f5110d0c4e0fb3fb9fe7755fa4935f644dddde7b818a6aa2e9a27b5a7abcc924

device:
  id: sproutling-baby-monitor
  name: Sproutling Wearable Baby Monitor (ankle band + Smart Charger hub)
  manufacturer: Sproutling / Mattel Fisher-Price (service shut down 2018-10-31)
  category: baby_monitor
  safety_class: MEDIUM  # infant HR/sleep monitoring; verbatim data only, never a medical alarm

transport:
  type: ble
  local_only: true
  note: >
    Phone-app BLE covers Smart Charger Wi-Fi provisioning only. Band data
    path is band --BLE--> charger --Wi-Fi--> cloud; direct band-to-central
    streaming is an untested hypothesis needing a live capture.

ble:
  advertising:
    name_patterns: []  # TBD — hub advertises during setup; prefix not recovered
    service_uuids: ["4482ACDF-D160-4E10-8FE3-82599F334433"]  # likely; verify by scan

  services:
    - uuid: "4482ACDF-D160-4E10-8FE3-82599F334433"
      name: sproutling_hub_provisioning
      description: Smart Charger Wi-Fi provisioning service (from SHBluetoothLeService.java)
      characteristics:
        - uuid: "1F5FCD82-FE15-4962-A6B2-BAEDFF11FD76"
          name: wifi_scan_mode
          properties: [write]
        - uuid: "9C500CD5-C84A-459A-AF95-26E73C2D49D7"
          name: wifi_list_count
          properties: [read]
        - uuid: "FAB97310-7E7E-4F52-AB2A-51B2332E01A3"
          name: wifi_list
          properties: [read, notify]
        - uuid: "1317D1BC-5F64-4CD2-A5BE-A7C436BE6F88"
          name: wifi_connection_parameters
          properties: [write]
        - uuid: "1C4F894B-75D8-4008-8EC5-D3E77D75BD95"
          name: wifi_connection_parameters_2
          properties: [write]
        - uuid: "ECB9EFD1-1CA6-4AE0-B579-2F58C6237F87"
          name: wifi_connection_state
          properties: [notify]
        - uuid: "89277C18-8A79-48A4-89C8-11F754F0B02D"
          name: config_char_a
          description: purpose TBD
        - uuid: "7A4747B5-B7FB-4643-9C5E-5778F77CAE7E"
          name: config_char_b
          description: purpose TBD

  ota_services:
    - uuid: "FB8C0001-D224-11E4-85A1-0002A5D5C51B"
      name: broadcom_wiced_ota
    - uuid: "77880001-d229-11e4-8689-0002a5d5c51b"
      name: broadcom_wiced_ota_secondary

protocol:
  note: >
    Hub provisioning uses a classic scan/list/connect flow over the
    characteristics above; exact payload encoding TBD (one HCI snoop with
    the APK would pin it down). Band-side BLE protocol is undocumented —
    the band firmware's GATT table is the key open artifact. The app
    bundles the full cloud protobuf schema (sproutling/EventOuterClass,
    Sleep, Hub), which documents the data model for any replacement
    pipeline.
  dead_cloud_endpoints:
    - "https://api-dev-us.sproutlingcloud.com/"
    - "https://api-frog.sproutlingcloud.com/"
    - "https://s3-us-west-1.amazonaws.com/sproutling-app/eol.json"

status:
  apk_acquired: true
  apk_decompiled: true
  uuids_recovered: true  # hub provisioning GATT fully mapped
  protocol_recovered: false  # provisioning payloads + band-side protocol TBD
  hci_snoop_needed: true
  rating: hypothesis  # local hub re-provisioning plausible; band-direct unproven
