# Wink Hub v1 / Wink Hub 2 — Device Spec (research note)
# Cloud still alive 2026-08-07 (wink.com selling subscriptions) but hostage-pricing
# history (2020-05 mandatory $4.99/mo; 2022 outages). Two local paths below.

device:
  id: wink-hub
  name: Wink Hub (v1) and Wink Hub 2
  manufacturer: Wink Labs / i.am+
  category: smart_home_hub
  safety_class: LOW

transport:
  type: wifi
  local_only: true   # path B (rooted) is fully local; path A is local transport + cloud token
  note: >
    Radios: Zigbee, Z-Wave, Lutron Clear Connect, Kidde RF, BLE.
    Path A: stock hub local HTTP API on port 8888, requires OAuth token from
    Wink cloud (python-wink local_control). Path B: rooted v1 hub runs
    aprontest CLI over SSH — fully cloud-free.

lan:
  discovery: dhcp-scan
  path_a_stock:
    protocol: http
    port: 8888
    auth: oauth-bearer-from-wink-cloud   # ongoing cloud dependency
    implementation: python-wink (local_control), HA wink component
  path_b_rooted:
    requires: "hardware root (v1: open case, UART, short NAND data pins at boot)"
    access: ssh
    control_binary: aprontest
    commands:
      list_devices: aprontest -l
      set_attribute: aprontest -e <id> -t <attribute> -v <value>
    integrations: community aprontest-MQTT bridges (Home Assistant, HomeSeer mcsMQTT)

protocol:
  note: >
    aprontest manipulates the hub's local device database directly; attribute
    names/values per device type are documented in community guides and the
    bridges. No vendor spec exists.
  commands:
    pair_zigbee_zwave: aprontest inclusion modes (documented in root guides)
    control: aprontest -e/-t/-v

status:
  apk_acquired: false
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: true   # via python-wink + aprontest community tooling
  hci_snoop_needed: false
  cloud_dead: false          # live as of 2026-08-07, subscription-only
  one_time_cloud: true       # path A needs cloud token continuously; path B none after root
  rating: confirmed
  references:
    - consumerreports.org/smart-home/wink-tells-users-pay-up-or-we-will-disable-smart-home-hub/ (2020-07-14)
    - community.home-assistant.io/t/rooted-wink-local-control/4733 (2016)
    - community.home-assistant.io/t/wink-component-local-control/112822 (2019-04)
    - forums.homeseer.com Wink-v1-to-mcsMQTT hack (2021-02)
    - wink.com (live, fetched 2026-08-07)
