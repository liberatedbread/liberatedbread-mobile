# BeeWi Bluetooth Classic RC Toys — Research Note
# Companion APK: com.beewi.helipad 2.0 via apkeep (APKPure)
# APK SHA-256: 1ae19aab72dedf2817f7a0848be46c6f83256f4165f8fcd1abda3d8615a7b3cf

device:
  id: beewi-bt-toys
  name: BeeWi Bluetooth RC toys (BBZ301/BBZ302 "Sting Bee" helicopter; BBZ201/BBZ251 Mini Cooper S)
  manufacturer: BeeWi (Avenir Telecom subsidiary; brand absorbed into Otio/HBF ~2016, toy line dead)
  category: toy_robot
  safety_class: NONE

transport:
  type: bluetooth_classic
  local_only: true

bluetooth_classic:
  profile: SPP
  spp_uuid: "00001101-0000-1000-8000-00805f9b34fb"  # confirmed in com.beewi.helipad DEX (ConnectionHelper.java)
  rfcomm_channel: 1
  pairing: legacy SPP pairing

protocol:
  note: >
    Commands are 14-character ASCII hex strings written verbatim to the SPP stream,
    streamed continuously while flying. Recovered from com.beewi.helipad v2.0 (jadx).
  frame: '"0x" + O + GG + YY + XX + TT + FF'
  fields:
    O:  orientation nibble — joystick quadrant (signs of x/y)
    GG: throttle (gaz), 2 hex digits
    YY: pitch magnitude, 2 hex digits (|y|*17, clamp 0xFF)
    XX: roll magnitude, 2 hex digits (|x|*17, clamp 0xFF)
    TT: trim, 2 hex digits (|trim|*8)
    FF: fire/shield — idle "01"/"0F"; firing "<team>1" standard / "<team>F" expert
  idle_and_end_command: "0x14000000040F"   # sent on session end (getBytesCommandEnd)
  telemetry: input stream exists in app; frames not yet mapped (flight is write-only in practice)
  car_protocol: BBZ201 Mini Cooper likely same ASCII-hex family; UNVERIFIED — see jimmckeeth/BeeMiniCtrl

status:
  apk_acquired: true            # com.beewi.helipad 2.0 (4)
  apk_decompiled: true          # jadx; UUID + full heli command format recovered
  uuids_recovered: true
  protocol_recovered: true      # helicopter confirmed; car hypothesis pending
  hci_snoop_needed: false       # only to confirm car protocol / telemetry frames
  cloud_dependency: none
  related_packages_not_fetched: [beewi-control-pad]  # car app; package id unknown, not on APKPure
  references:
