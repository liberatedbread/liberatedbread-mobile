# LG Pocket Photo (PD233/239/241/251/269) — Device Spec (research note)
# From static analysis of com.lge.media.lgpocketphoto 3.2.5 (Aptoide, LGE-signed)
# APK SHA-256: 737bd11208e990b75feffaae940778c8eaec3f473021fcdebae98dcb2d4ab806

device:
  id: lg-pocket-photo
  name: LG Pocket Photo (PD233 / PD239 / PD241 / PD251 / PD269)
  manufacturer: LG Electronics
  category: portable_photo_printer
  safety_class: LOW

transport:
  type: bluetooth_classic
  local_only: true

bluetooth_classic:
  pairing:
    pin: "0000"  # typical; some units pair with no PIN — TBD
  channels:
    - name: control_spp
      uuid: "00001101-0000-1000-8000-00805f9b34fb"
      role: control/status (framing TBD — not yet extracted)
    - name: obex_object_push
      uuid: "00001105-0000-1000-8000-00805f9b34fb"
      role: image data path (OBEX PUT)
      caveat: >
        OBEX authentication classes present in the app
        (PasswordAuthentication / AUTH_CHALLENGE). Printer may require
        MD5 challenge-response on PUT; password derivation unknown.
        Bench test required before claiming bare PC push works.

protocol:
  note: >
    Same dual-channel pattern as Polaroid Zip: SPP for control, OPP for
    the rendered JPEG. Control-channel framing not yet recovered
    (PrintActivity and oppserver packages need a full decompile pass).
  image_format: jpeg
  control_commands: TBD

status:
  apk_acquired: true    # via Aptoide (NOT apkeep/APKPure — delisted there)
  apk_decompiled: false # strings-level triage only
  uuids_recovered: true # SPP 0x1101 + OPP 0x1105
  protocol_recovered: partial
  hci_snoop_needed: true
  cloud_dependency: none
  manufacturer_status: >
    Product line discontinued; LG exited smartphones April 2021
    (wind-down July 2021); app abandoned at v3.2.5 (~2019) and delisted
    from Play/APKPure. Aptoide copy is LGE-signed.
  references:
    - https://www.lg.com/hk_en/pocket-photo-printer/pd251/
    - http://popoguide.lge.com/html/pd251/en/en_sub06_02.html
    - https://lg-pocket-photo.soft112.com/
