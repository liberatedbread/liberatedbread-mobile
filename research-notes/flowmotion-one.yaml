protocol:
  note: >
    Message types are kotlinx.serialization classes in
    co.flowmotion.bluetooth.protocol (GimbalMode, StabilizationMode, Joystick,
    VirtualJoystick, TimeLapsePoint, PanoramaPoint, DeviceState, BalanceState,
    RecordingState, SystemEvent, Vec3D...) grouped under FMControlEndpoint,
    FMSystemEndpoint, FMDeviceInfoEndpoint, FMBatteryEndpoint. Custom "@Packed"
    binary framing (SerializerExtKt) — exact wire format TBD but fully recoverable
    by decompile; no obfuscation on the protocol module.
  cloud_required: false

