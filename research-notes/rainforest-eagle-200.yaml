# Rainforest Automation EAGLE-200 — Device Spec (research note)
# Vendor-documented local API; credentials printed on device label — no internet account needed
# External dependency is the utility HAN join, not a vendor cloud

device:
  id: rainforest-eagle-200
  name: Rainforest Automation EAGLE-200 (RFA-Z109) Zigbee SE HAN gateway
  manufacturer: Rainforest Automation (Canada) — support active as of 2025-10
  category: energy_monitor
  safety_class: LOW  # no mains wiring; reads utility smart meter over Zigbee Smart Energy

transport:
  type: wifi            # WiFi + Ethernet
  local_only: true
  note: >
    Local XML/JSON command API on port 80, or push "upload" to an arbitrary
    LAN HTTP endpoint. One-time HAN pairing is done with the utility (meter
    MAC join), not with a Rainforest cloud account; afterwards fully standalone.

lan:
  discovery:
    method: dhcp-scan
  control:
    protocol: http-xml-post   # JSON variant also documented
    port: 80
    path: /cgi-bin/post_manager
    auth: "HTTP Basic: base64(CloudID:InstallCode) — both on the device label"

protocol:
  note: >
    Vendor "EAGLE-200 Local API Manual" v1.0 (2017). Commands POSTed as XML
    <Command><Name>...</Name></Command>; responses carry value +
    multiplier/divisor + Zigbee UTC timestamps. Apply multipliers client-side.
  commands:
    get_instantaneous_demand: current kW demand
    get_current_summation: delivered/received kWh totals
    get_price: current utility price
    get_message: utility text messages
    list_network: HAN network status
    get_history_data: queued upload history
    upload_push: device -> arbitrary LAN HTTP endpoint (config in local web UI)

status:
  apk_acquired: false    # n/a — vendor-documented local API
  apk_decompiled: false
  uuids_recovered: false # n/a — Zigbee SE is a certified utility protocol, not a RE target
  protocol_recovered: true   # vendor-documented
  rating: confirmed
  cloud_dead: false      # local API independent of vendor cloud
  references:
    - support.rainforestautomation.com/article/76-eagle-200-local-api-documentation (2025-10-28)
    - rainforestautomation.com EAGLE-200 Local API Manual v1.0 (PDF, 2017)
    - gist.github.com/darconeous/3746c485b76d55af6fea6a044c66a6a2 (curl howto, 2022-08-10)
    - community.home-assistant.io/t/custom-component-rainforest-eagle-200-local-meter-reader/110656
