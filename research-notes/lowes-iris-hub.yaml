# Lowe's Iris Hub v1/v2 — Device Spec (research note, REJECTED)
# Platform shut down 2019-03-31; no local API on either hub generation;
# no community root/local-control project. Hub is e-waste; v2 Zigbee/Z-Wave
# devices are the salvageable part.

device:
  id: lowes-iris-hub
  name: Lowe's Iris Hub (v1 AlertMe-based, v2)
  manufacturer: Lowe's / AlertMe (v1) — platform shut down 2019-03-31
  category: smart_home_hub
  safety_class: LOW

transport:
  type: wifi
  local_only: false   # REJECTED: cloud-only, no local API ever documented
  note: >
    All control via Iris cloud; servers closed 2019-03-31. No documented
    local API, no substantive community root effort — users migrated to
    Hubitat/SmartThings. V2 Zigbee/Z-Wave devices pair to other hubs and are
    the real rescue targets; v1 AlertMe-profile devices mostly are not.

status:
  apk_acquired: false
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: false
  cloud_dead: true
  rejected: true
  reject_reason: cloud shut 2019-03-31; no local API on hub; no community local path
  references:
    - cnet.com/home/smart-home/lowes-pulls-the-plug-on-the-iris-smart-home-platform/ (2019-01-31)
    - cepro.com/news/lowes_iris_smart_home_platform_shut_down/7622/ (2019-02-06)
    - community.hubitat.com/t/lowes-iris-transition/9872 (2019-02)
