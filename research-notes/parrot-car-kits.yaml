# Parrot CK / MKi / Asteroid car kits — research note
# Consumer car-kit line discontinued ~2015-17 (Parrot SA alive, drones-only).
# Never had cloud dependency: standard BT Classic profiles, no companion app.
# Repo value = pairing/reset/firmware specifics, not protocol RE.

device:
  id: parrot-car-kits
  name: Parrot CK3000/CK3100, MK6000/6100, MKi9000/9100/9200, Asteroid car kits
  manufacturer: Parrot SA (car-kit line discontinued; company active)
  category: vehicle_handsfree_kit
  safety_class: LOW  # hands-free audio only

transport:
  type: bluetooth_classic_profiles   # HFP + A2DP + AVRCP + PBAP + MAP
  local_only: true

bluetooth:
  profiles: [hfp, a2dp, avrcp, pbap, map]
  pairing:
    pin: "1234"   # CK3000/Evo, CK3100/3300/3500; MKi/Asteroid pair via on-screen menu
    table_limits:
      CK3000_evo: 3
      CK3100_3300_3500: 5
      3200LS_3400GPS: 5
      MK6000_6100: 10
      MKi9000_9100_9200: 10
      Asteroid: 10
    note: >
      Full pairing table silently forgets oldest phone — the classic "kit
      won't pair" failure. Fix: voice menu Settings -> Bluetooth -> Delete,
      or factory reset. Last firmware: CK3000 v5.29c, CK3100 v5.00c.
  service_channel:
    note: undocumented SPP channel used by Parrot's update/diagnostic tools

protocol:
  note: >
    No proprietary application protocol on the phone side — standard SIG
    profiles end to end. Control surface is the wired dash remote and voice
    menu. Nothing to reverse for normal use.
  references:
    - https://www.justcarkits.co.uk/blog/2019/02/10/parrot-bluetooth-handsfree-pairing-codes/

status:
  apk_acquired: false   # N/A — no companion app exists
  apk_needed: false
  protocol_recovered: true   # standard profiles; nothing proprietary to recover
  hci_snoop_needed: false
  cloud_dependency: none
  feasibility: confirmed_trivial
