    name_patterns: []  # TBD — no public capture; "OMsignal" / "OM" speculative
    service_uuids: []  # TBD — needs hardware + nRF Connect scan
  services: []  # TBD — expect custom streaming service for ECG ~125 Hz + respiration + accel
  notes: >
    Snap-on smart box reads textile ECG electrodes, a breathing stretch sensor
    and a 3-axis accelerometer; streams over Bluetooth Smart to the companion
    app (NCBI PMC7037315). Pairing/auth behavior unknown — pivotal RE question.

app:
  android: null  # existence never confirmed; iOS-first product; all guessed package ids absent from apk-pure and Wayback Play index
  ios:
    bundle_id: null  # unknown — delisted, not preserved in indexes
    still_listed: false  # verified via iTunes Search API 2026-08-04

protocol:
  note: >
    No public protocol information; no community RE (GitHub 2026-08-04 shows only
    an ML course project on donated datasets). Raw ECG/respiration streaming was
    local; cloud handled accounts, calibration storage and OMrun analytics.
  expected_channels:
    - ecg_stream_notify        # 1-lead, ~125 Hz per secondary sources
    - respiration_notify
    - accelerometer_notify
    - control_write            # session start/stop, calibration?

status:
  apk_acquired: false   # no Android binary found or confirmed to exist
  ipa_available: false  # iOS app delisted; owner-device recovery only
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: true  # requires surviving hardware; no working stock client exists
