# Holux M-241 GPS Logger — Device Spec (research note)
# Sources: holux.info community archive, gpsbabel docs, bt747.org
# Company bankrupt 2019-07; no Android/iOS app ever existed (Windows-only ezTour, dead license server)

device:
  id: holux-m-241
  name: Holux M-241 Bluetooth GPS Logger
  manufacturer: Holux Technology (Taiwan) — bankrupt 2019-07
  also_covers:
    - Holux M-1000 / M-1000B / M-1000C (NMEA-only SPP receivers)
    - Holux M-1200 / GPSlim 236 / GPSlim 240 (NMEA-only SPP receivers)
    - Holux GPSport 245 (logger variant, auto-detected by gpsbabel m241-bin)
  category: gps_logger
  safety_class: NONE  # Position data only; no vehicle/medical function

transport:
  type: bluetooth_classic
  local_only: true

bluetooth_classic:
  profiles: [SPP]
  spp_uuid: "00001101-0000-1000-8000-00805f9b34fb"
  pairing_pin: "0000"  # per holux.info FAQ and third-party pairing compatibility lists
  bluetooth_version: "1.2/2.0"
  baud: 38400  # commonly reported for M-241 NMEA stream; host-side rfcomm baud is emulated
  notes: >
    Standard SPP. Pair with PIN 0000, then rfcomm bind /dev/rfcomm0 <MAC> 1 and
    point gpsd or any NMEA parser at it. No vendor software required for live
    position. Log download and logger configuration use MTK-variant binary
    protocol over the same SPP link (bidirectional) — handled by BT747 or
    gpsbabel m241/m241-bin. USB also available on M-241.

protocol:
  live_position:
    format: NMEA 0183 (GGA, RMC, GSA, GSV)
    transport: SPP stream
    tools: [gpsd, gpsbabel]
  log_download:
    chipset: MediaTek MTK (Holux-specific variant of MTK binary protocol)
    config_commands: PMTK-style text packets ($PMTK...*checksum CRLF)
    log_format: MTK binary, Holux variant — decoded by gpsbabel m241-bin
    tools: [BT747 (bt747.org), gpsbabel m241/m241-bin]
    capacity_points: ~130000  # M-241; GPSport 245 ~200k
  known_bugs:
    - GPS week-number rollover mis-dates logs (post-2019); workaround in BT747 (+1024 weeks), tracked in gpsbabel issue #349

status:
  android_app_existed: false  # Windows-only ezTour / ezTour Plus; license server dead with company
  apk_acquired: false
  apk_needed: false  # BT747 + gpsbabel fully replace vendor software
  protocol_recovered: true  # via gpsbabel m241-bin + BT747 (both open source)
  hci_snoop_needed: false
  cloud_dependency: none  # ezTour map tiles died with the site; irrelevant to local use
  references:
    - https://holux.info/faq/
    - https://www.gpsbabel.org/htmldoc-development/fmt_m241-bin.html
    - http://www.bt747.org/
