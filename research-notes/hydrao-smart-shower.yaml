# HYDRAO Smart Shower Head — Device Spec (research note)
# Static analysis of com.smartandblue.hydrao v1.7.3 (unobfuscated)
# APK source: apkeep (apk-pure)
# APK SHA-256: 6c74dc2cb623e5aa45fe8db7b37591d274a453e362f4c312322d0a15140a97c3

device:
  id: hydrao-smart-shower
  name: HYDRAO First / HYDRAO Aloe smart shower head
  manufacturer: Smart & Blue (France) — liquidated 2026-06-02
  category: water_meter_shower
  safety_class: LOW  # Passive measurement + indication LEDs only

transport:
  type: ble
  local_only: true
  cloud_required: false
  note: >
    Water-powered device; all measurements readable over BLE GATT with no
    pairing, account, or cloud. Cloud only backed app-side history/sharing.

ble:
  advertising:
    name_patterns:
      - "HYDRAO_SHOWER"
      - "OTAServiceMgr"  # during OTA/DFU mode
    service_uuids: []  # TBD — app scans by name

  services:
    - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
      name: hydrao_service
      description: Main HYDRAO service (vendor repurposed standard 0x180F)
      characteristics:
        - uuid: "00002a26-0000-1000-8000-00805f9b34fb"
          name: firmware_version
          properties: [read]
        - uuid: "0000ca1c-0000-1000-8000-00805f9b34fb"
          name: litrage
          description: Two uint16-LE — total volume (L), current shower volume (L)
          properties: [read, notify]
        - uuid: "0000ca1d-0000-1000-8000-00805f9b34fb"
          name: thresholds_seuils
          description: LED volume-alert thresholds (read/write)
          properties: [read, write]
        - uuid: "0000ca1e-0000-1000-8000-00805f9b34fb"
          name: ask_fota
          properties: [write]
        - uuid: "0000ca1f-0000-1000-8000-00805f9b34fb"
          name: ask_reset
          properties: [write]
        - uuid: "0000ca20-0000-1000-8000-00805f9b34fb"
          name: end_shower
          properties: [write]
        - uuid: "0000ca21-0000-1000-8000-00805f9b34fb"
          name: history_index_min_max
          properties: [read]
        - uuid: "0000ca22-0000-1000-8000-00805f9b34fb"
          name: ask_history
          properties: [write]
        - uuid: "0000ca23-0000-1000-8000-00805f9b34fb"
          name: history_record
          properties: [read]
        - uuid: "0000ca24-0000-1000-8000-00805f9b34fb"
          name: hardware_version
          properties: [read]
        - uuid: "0000ca25-0000-1000-8000-00805f9b34fb"
          name: reset
          properties: [write]
        - uuid: "0000ca26-0000-1000-8000-00805f9b34fb"
          name: rotation_counter
          description: Turbine rotation count; shower duration = value/50 seconds
          properties: [read, notify]
        - uuid: "0000ca27-0000-1000-8000-00805f9b34fb"
          name: vmot_turbine_voltage
          properties: [read]
        - uuid: "0000ca28-0000-1000-8000-00805f9b34fb"
          name: device_uuid
          properties: [read]
        - uuid: "0000ca30-0000-1000-8000-00805f9b34fb"
          name: calibration
          properties: [read, write]
        - uuid: "0000ca32-0000-1000-8000-00805f9b34fb"
          name: temperature
          description: Seen in community clients, not in app 1.7.3; uint16, /2 = deg C
          properties: [read, notify]
          note: Added by firmware after app 1.7.3 (per adizanni/hydrao)

    - uuid: "8a97f7c0-8506-11e3-baa7-0800200c9a66"
      name: ota_service
      description: Cypress-style OTA bootloader service
      characteristics:
        - uuid: "122e8cc0-8508-11e3-baa7-0800200c9a66"
          name: ota_current_image
          properties: [read]
        - uuid: "210f99f0-8508-11e3-baa7-0800200c9a66"
          name: ota_new_image
          properties: [write]
        - uuid: "2691aa80-8508-11e3-baa7-0800200c9a66"
          name: ota_new_image_tu
          properties: [write]
        - uuid: "2bdc5760-8508-11e3-baa7-0800200c9a66"
          name: ota_expected_image_tu
          properties: [notify]

  standard_services:
    - uuid: "00002902-0000-1000-8000-00805f9b34fb"
      name: cccd

protocol:
  note: >
    Simple connect-and-read/notify. Volume: uint16-LE pairs on ca1c.
    Temperature: value/2 in deg C (community decoding, char ca32 on newer
    firmware). Duration: rotation counter on ca26 divided by 50 = seconds.
    Threshold writes on ca1d set the LED alert levels (format partially RE'd).
  expected_measurements:
    - volume_total_liters
    - volume_current_shower_liters
    - temperature_c
    - shower_duration_s
    - turbine_voltage
  commands:
    set_thresholds: "write ca1d (byte format TBD, partially RE'd by kamaradclimber)"
    end_shower: "write ca20"
    reset: "write ca25 / ca1f"

third_party_support:
  references:
    - https://github.com/kamaradclimber/hydrao-dump  # original RE, MQTT bridge
    - https://github.com/adizanni/hydrao  # Home Assistant integration + ESPHome ble_client config

status:
  company_status: dead  # liquidation judiciaire, Tribunal de Commerce de Grenoble, 2026-06-02
  apk_acquired: true
  apk_decompiled: true
  uuids_recovered: true
  protocol_recovered: true  # via app GattAttributes + mature community RE
  hci_snoop_needed: false
  difficulty: easy
  confidence: confirmed
