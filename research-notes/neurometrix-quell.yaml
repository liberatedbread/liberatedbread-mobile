protocol:
  note: >
    Command channel is the app_control characteristic: app writes a 32-bit
    "virtual button" value (VirtualButtonCommandWriter). Wire byte order TBD
    (ByteUnpacker bit-packing) — LE and BE encodings both listed below; verify
    with HCI snoop. Status/history arrive as notifications; per-characteristic
    translators exist in com.neurometrix.quell.bluetooth.translators.
  app_control_commands:  # uint32; hex / LE bytes / BE bytes
    start_therapy:          { hex: "0x3801f66f", le: 6ff60138, be: 3801f66f }
    stop_therapy:           { hex: "0x9500ae5d", le: 5dae0095, be: 9500ae5d }
    increase_intensity:     { hex: "0x2003288d", le: 8d280320, be: 2003288d }
    decrease_intensity:     { hex: "0x98023e4e", le: 4e3e0298, be: 98023e4e }
    lights_out:             { hex: "0xa0020202", le: 020202a0, be: a0020202 }
    wake_up:                { hex: "0xa0030303", le: 030303a0, be: a0030303 }
    temporary_high_dose:    { hex: "0xa0040404", le: 040404a0, be: a0040404 }
    temporary_low_dose:     { hex: "0xa0050505", le: 050505a0, be: a0050505 }
    start_calibration:      { hex: "0x23ad164f", le: 4f16ad23, be: 23ad164f }
    sensation_felt:         { hex: "0x543d6066", le: 66603d54, be: 543d6066 }
    halt_calibration:       { hex: "0x428a9631", le: 31968a42, be: 428a9631 }
    heartbeat:              { hex: "0xbead0044", le: 4400adbe, be: bead0044 }
    sensitivity_pattern:    { hex: "0xa0060606", le: 060606a0, be: a0060606 }
    toes_up_device_on_right: { hex: "0xa0010100", le: 000101a0, be: a0010100 }
    toes_up_device_on_left:  { hex: "0xa0010101", le: 010101a0, be: a0010101 }

