# Daikin Wi-Fi Adapters (BRP069/BRP072) — Device Spec (research note)
# Classic adapters: unauthenticated local HTTP API. Onecta generation: local removed.

device:
  id: daikin-wifi-adapters
  name: Daikin Wi-Fi adapters BRP069A41/42/43/45, BRP069B41, BRP072A42/C42 (local API); BRP069C4x (local API + key); Onecta-era adapters (NO local API)
  manufacturer: Daikin (active)
  category: hvac_minisplit_gateway
  safety_class: MEDIUM  # HVAC actuator; classic adapters have no auth

transport:
  type: wifi
  local_only: true
  note: >
    Local HTTP API on classic (BRP069A/B, BRP072) and BRP069C4x adapters;
    no cloud account needed for control once the unit is on Wi-Fi.
    C4x adds API key + password (retrieved per HA integration docs).
    Newest Onecta-app adapters removed the local API entirely — cloud only;
    verify adapter generation before purchase.

lan:
  discovery:
    protocol: udp-broadcast   # probe ports 30000/30050 (pydaikin), or DHCP reservation
  control:
    protocol: http
    port: 80
    auth: none (classic) | api-key+password (BRP069C4x)
    endpoints:
      - GET /common/basic_info           -> name, mac, firmware
      - GET /aircon/get_model_info
      - GET /aircon/get_control_info     -> pow,mode,stemp,shum,f_rate,f_dir,...
      - GET /aircon/get_sensor_info      -> htemp,otemp,hhum
      - GET /aircon/set_control_info?pow=1&mode=3&stemp=22&shum=0&f_rate=A&f_dir=0
    enums:
      pow: {0: off, 1: on}
      mode: {0|1|7: auto, 2: dry, 3: cool, 4: heat, 6: fan}
      f_rate: {A: auto, B: quiet, 3-7: fixed speeds}
      f_dir: {0: off, 1: vertical, 2: horizontal, 3: both}

protocol:
  note: >
    Query-string RPC returning key=value CSV bodies. Implemented by HA
    core daikin integration (pydaikin, local_polling). No TLS, no auth on
    classic adapters.
  commands:
    power_on_cool_22: 'GET /aircon/set_control_info?pow=1&mode=3&stemp=22&shum=0&f_rate=A&f_dir=0'
    off: 'GET /aircon/set_control_info?pow=0&mode=3&stemp=22&shum=0&f_rate=A&f_dir=0'
    read_state: 'GET /aircon/get_control_info'

status:
  rating: confirmed   # HA core integration + pydaikin, long history
  apk_acquired: false # not needed; API community-documented
  apk_decompiled: false
  protocol_recovered: true
  cloud_dead: false   # vendor active; newest adapters cloud-only (buyer beware)
  references:
    - home-assistant.io/integrations/daikin (accessed 2026-08-07)
    - community.home-assistant.io/t/743218 (2024-06-25, local API removal)
    - community.home-assistant.io/t/861215 (2025-03-09, C4x API key)
