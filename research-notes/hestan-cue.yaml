  advertising:
    name_patterns: []  # TBD — not recovered statically ("Cue"/"Hestan" speculative)
    service_uuids: []  # TBD — scan filter not yet located in decompile

  services:
    - uuid: "00001541-6209-4984-454e-f27d42fb55e3"
      name: burner_service
      description: Induction burner primary service (DeviceType.DEVICE_TYPE_INDUCTION_BURNER)
      characteristics:
        - uuid: "00001542-6209-4984-454e-f27d42fb55e3"
          name: burner_char_0
          description: Handled in notification dispatch case 0 — role TBD
        - uuid: "00001543-6209-4984-454e-f27d42fb55e3"
          name: burner_char_1
          description: Handled in notification dispatch case 1 — role TBD
        - uuid: "00001545-6209-4984-454e-f27d42fb55e3"
          name: burner_char_2
          description: Read/notify characteristic — role TBD
        - uuid: "00001546-6209-4984-454e-f27d42fb55e3"
          name: burner_char_3
          description: Handled in notification dispatch case 3 — role TBD
        - uuid: "00001547-6209-4984-454e-f27d42fb55e3"
