  device_models:  # from tb/s.java enum
    - CUE_BURNER_V1
    - CUE_BURNER_V1_100V
    - CUE_BURNER_V1_220V
    - CUE_BURNER_V1_220V_THERMOMIX
    - thermometer cookware (pans/pots, device type family)

protocol:
  note: >
    Service selection is by device type (burner vs thermometer) in ec/c.java.
    Thermometer data characteristic 0xfa84 carries a fixed 6-byte little-endian
    frame. Burner command encoding (set target temp, power level) not yet
    decoded — likely writes to one of 1542/1543. Closed-loop control was done
    app-side: app reads pan temp, writes burner power.
  commands:
    set_temperature: TBD
    set_power: TBD
    temperature_read: TBD  # likely notify on 0xfa84, 6-byte LE frame

