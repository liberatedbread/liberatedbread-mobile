device:
  id: hestan-cue
  name: Hestan Cue Smart Cooking System (induction cooktop + smart cookware)
  manufacturer: Hestan Smart Cooking (Hestan Commercial Corp.)
  category: kitchen_appliance
  safety_class: MEDIUM  # 1600 W induction heating appliance; clamp temps, prefer read-only first

transport:
  type: ble
  local_only: true
  note: >
    Phone app talks BLE directly to both the induction burner and the pan's
    "smart capsule" thermometer. No hub. Cloud served recipes/account only
    (AWS Cognito); app retired 2025-07-21, smart functions officially dead.

