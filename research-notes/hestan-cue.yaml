      characteristics:
        - uuid: "0000fa83-8a11-4222-9610-53f79479ca03"
          name: thermometer_state
          description: Boolean state characteristic (parsed as flag)
        - uuid: "0000fa84-8a11-4222-9610-53f79479ca03"
          name: thermometer_data
          description: 6-byte little-endian payload — likely temperature reading (app validates len==6)
