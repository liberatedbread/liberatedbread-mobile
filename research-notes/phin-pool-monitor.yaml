  standard_services:
    - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
      name: device_information
    - uuid: "00002902-0000-1000-8000-00805f9b34fb"
      name: cccd

protocol:
  note: >
    Foreground PhinBleService scans (RxJava-based BLE layer, obfuscated a3/b3/w2).
    Monitor object constructed from advertisement byte[] (b3/b.java): five 32-bit
    packed values at offsets 0/4/8/12/16; flag bits in byte 24 of first field;
    calibration via 8-byte records with bit-packed fields (7-bit and 8-bit lanes,
    some scaled /10 — looks like electrode mV values).
    Nordic DFU service present for firmware updates.
  expected_measurements:
    - ph
    - orp_sanitizer_mv
    - water_temperature_c
    - battery_status
  commands:
    read_current_values: TBD  # likely passive advert sniff or read on 3206152c
    bridge_wifi_provision: TBD  # writes on c92c815e-... characteristics

third_party_support:
  note: >
    iopool app (com.iopool, still maintained) added pHin hardware support after
    the 2021 shutdown ("link your pHin device to the iopool app"); its binary
    contains pHin's 3206152C characteristic and fe63 service UUIDs.
  references:
    - https://iopool.com/blogs/connected-objects/phin-alternative  # 2022-12-16
    - https://community.home-assistant.io/t/phin-smart-pool-monitor/191533
    - https://community.hubitat.com/t/smart-pool-monitor-phin/44654?page=2

status:
  company_status: dead  # service discontinued 2021-12-20; app/site gone by 2022-12
  apk_acquired: true
  apk_decompiled: true
  uuids_recovered: true
  protocol_recovered: false  # advert byte layout partially parsed; semantics TBD
  hci_snoop_needed: true
  difficulty: medium
  confidence: confirmed  # shutdown confirmed by multiple dated sources
