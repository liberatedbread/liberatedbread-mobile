# nonda ZUS Smart Tire Safety Monitor — research note
# Verified 2026-08-04: nonda.co is now an insurance affiliate page (hardware business gone);
# ZUS app still listed on Play but pivoted to insurance/rewards subscriptions.

device:
  id: nonda-zus-tpms
  name: ZUS Smart Tire Safety Monitor (BLE TPMS, 4 cap sensors)
  manufacturer: nonda (No NDA Inc.)
  category: vehicle_tpms
  safety_class: MEDIUM  # tire-pressure monitoring; read-only

transport:
  type: ble
  local_only: false  # sensor data path believed local BLE; account/mileage features are cloud

ble:
  advertising:
    name_patterns: []  # TBD — needs one nRF Connect scan
    service_uuids: []  # TBD
  services:
    - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
      name: serial_service_candidate
      description: fff0/fff1/fff2 present in app dex; HM-10-style serial, role per device TBD
    - uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
      name: serial_service_alt
      description: ffe0/ffe1 present in app dex
    - uuid: "00001c00-d102-11e1-9b23-000efb0000a5"
      name: telink_ota
      description: Telink OTA family (1c00/1c01/1c02/1c04/1c0f) — firmware update
  classic:
    - uuid: "00001101-0000-1000-8000-00805f9b34fb"
      name: spp
      description: Bluetooth Classic SPP also used by some ZUS devices (dash cam etc.)

protocol:
  note: >
    No prior community RE of the ZUS TPMS advert/GATT format found. Hypothesis:
    cap sensors are passive BLE broadcasters similar to the already-decoded
    generic Chinese TPMS caps (see generic-ble-tpms-caps note). One HCI snoop
    or nRF Connect capture would confirm. The ZUS OBD-II dongle is ELM-adjacent
    and may already be covered by the repo's obd2-bluetooth-adapter spec.
  expected_measurements:
    - tire_pressure
    - tire_temperature
    - slow_leak_alert

status:
  apk_acquired: true
  apk_decompiled: false   # strings-only triage; full jadx not run (78MB XAPK, 9 dex)
  uuids_recovered: partial
  protocol_recovered: false
  hci_snoop_needed: true
  cloud_dependency: account + mileage/trip sync; sensor-local path unverified
  reference: none found

apk:
  - package: us.nonda.zus
    version: 8.20.5
    version_code: 82005
    sha256: 4c32bf5c4573105b7b2def06f37b9a075978ff24a9532c92e84e79b171127d0f
    source: apkeep apk-pure (XAPK)
    note: listed on Play as "ZUS - Save Car Expenses"
