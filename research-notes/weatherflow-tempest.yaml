# WeatherFlow Tempest — Device Spec (research note)
# Vendor-documented local UDP broadcast API (port 50222), HA core integration
# (local_push). One-time app+account provisioning via BLE; UDP keeps flowing
# with internet/cloud down. Company active as of 2026-08 (Wefunder raise 2025-12).
# Sources checked 2026-08-07: weatherflow.github.io/Tempest/api/udp/v143/,
# home-assistant.io/integrations/weatherflow, kingscrowd.com Wefunder profile.

device:
  id: weatherflow-tempest
  name: WeatherFlow Tempest Weather System (hub + Tempest/AIR/SKY sensors)
  manufacturer: WeatherFlow-Tempest, Inc. (Austin, TX)
  category: weather_station
  safety_class: LOW

transport:
  type: wifi
  local_only: true
  note: >
    Hub broadcasts JSON observation datagrams to the LAN broadcast address on
    UDP 50222, unconditionally, once on Wi-Fi. No auth. Vendor-documented
    (UDP Reference v143). One-time provisioning (claim station, set Wi-Fi)
    requires the vendor app + account over BLE; no account-free path known.

lan:
  control:
    - protocol: udp-broadcast
      port: 50222
      direction: device -> LAN broadcast
      auth: none
      message_types:
        - evt_precip      # rain start event
        - evt_strike      # lightning event (distance, energy)
        - rapid_wind      # 3-second wind speed/direction
        - obs_st          # 1-min Tempest observation block (temp/hum/pressure/light/UV/rain/wind/battery/rssi/firmware)
        - obs_air         # legacy AIR unit observations
        - obs_sky         # legacy SKY unit observations
        - device_status   # uptime, voltage, rssi, sensor status
        - hub_status      # hub uptime, rssi, firmware, reset flags
  discovery: passive — listen on UDP 50222 on the same broadcast domain

protocol:
  note: >
    All messages are UTF-8 JSON objects with a "type" field. obs_st packs
    sensor values in a fixed-order array (documented per index in v143).
    serial_number + hub_sn identify devices. Sequence numbers allow gap
    detection. No request/response — pure push.
  commands:
    read_observations: listen UDP 50222 (no command needed)

status:
  apk_acquired: false    # n/a — vendor-documented protocol
  apk_decompiled: false
  uuids_recovered: false # BLE used only for provisioning; not RE'd
  protocol_recovered: true  # vendor-documented
  hci_snoop_needed: false
  cloud_dead: false      # active company; cloud needed only for one-time setup
  one_time_cloud_required: true  # app + account to claim station / set Wi-Fi
  rating: confirmed
  references:
    - weatherflow.github.io/Tempest/api/udp/v143/ (official UDP reference)
    - home-assistant.io/integrations/weatherflow (core, local_push)
    - github.com/briis/hass-weatherflow2mqtt (archived; superseded by core)
    - kingscrowd.com/weatherflow-tempest-on-wefunder-2025/ (company status)
