# iHealth Classic BT Line — Device Spec (research note)
# Sources: iHealth Labs SDK docs (classic-bluetooth device list, cloud-auth
# requirement), 2016 distributor spec sheet (BT V3.0+EDR), ihealthlabs.com

device:
  id: ihealth-classic-bt
  name: iHealth BP3/BP5/BP7 BP monitors, HS3 scale, BG5 glucose meter
  manufacturer: iHealth Labs (company active, pivoted to COVID/flu rapid tests; devices discontinued)
  category: medical_sensor
  safety_class: MEDIUM  # glucose/BP readings inform treatment
  models: [bp3, bp5, bp7, hs3, bg5]

transport:
  type: bluetooth_classic
  profile: spp
  local_only: true   # device-side link is local RFCOMM; see cloud_status caveat
  spp:
    uuid: "00001101-0000-1000-8000-00805f9b34fb"
    note: >
      iHealth SDK docs classify BP3/BP5/BP7/HS3/BG5 as "classic bluetooth
      devices" paired via OS Bluetooth settings (BT V3.0+EDR). Byte-level
      command protocol is proprietary and undocumented; no community RE
      found as of 2026-08.

protocol:
  note: >
    Proprietary framing embedded in vendor SDK binaries (iHealthSDK2.14.0.a,
    Android jar). Not recovered — needs APK from an alternate mirror or a
    live HCI/SPP capture against real hardware.
  expected_measurements:
    - systolic_mmhg
    - diastolic_mmhg
    - pulse_rate_bpm
    - body_weight_kg
    - blood_glucose_mg_dl

cloud_status:
  cloud_required: false        # for the raw RFCOMM link
  cloud_caveat: >
    OFFICIAL APP PATH IS CLOUD-GATED: the vendor SDK requires a cloud
    authentication call before permitting any device connection
    (IHSDKCloudUser). If iHealth's auth servers die, the official apps
    stop working even though the hardware link is purely local. Whether
    auth is one-time or per-connection is unknown.

status:
  apk_acquired: false    # com.ihealth.MyVitals: APKPure listing exists,
                         # apkeep returns empty version list — not fetchable
  apk_package: com.ihealth.MyVitals
  apk_decompiled: false
  uuids_recovered: false  # standard SPP UUID assumed, unverified
  protocol_recovered: false
  hci_snoop_needed: true
  rating: hypothesis
