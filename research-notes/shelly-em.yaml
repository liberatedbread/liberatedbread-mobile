# Shelly EM / 3EM / Pro EM / EM Gen3 — Device Spec (research note)
# Manufacturer ACTIVE (Allterco); local-first design, vendor-documented APIs
# Local path: gen1 HTTP REST + MQTT + CoAP; gen2 JSON-RPC (HTTP/WS) + MQTT + mDNS

device:
  id: shelly-em
  name: Shelly EM, Shelly 3EM (gen1); Shelly Pro EM, Pro 3EM, EM Gen3 (gen2/3)
  manufacturer: Shelly (Allterco Robotics, Bulgaria) — active
  category: energy_monitor
  safety_class: MEDIUM  # DIN-rail/panel install, direct mains wiring on 3EM; EM has a relay output that can drive a contactor

transport:
  type: wifi            # Pro models add Ethernet
  local_only: true
  note: >
    Cloud is a toggle in the local web UI and is never required. Provisioning
    via device AP + local web pages. All APIs below work with WAN blocked.

lan:
  discovery:
    gen1: CoAP multicast 224.0.1.187:5683 (cit/s) + GET /shelly
    gen2plus: mDNS
  control:
    gen1:
      protocol: http-rest
      port: 80
      auth: none by default (optional login in settings)
    gen2plus:
      protocol: json-rpc over HTTP POST /rpc + WebSocket; MQTT; scripts
      auth: optional digest when password set

protocol:
  note: >
    Vendor-documented. Gen1 REST returns per-channel power (W), reactive (VAR),
    voltage, PF, energy counters total/total_returned (Wh). Gen2 RPC exposes
    EM.GetStatus (instantaneous per-phase) and EMData.GetStatus/GetRecords
    (60 days of 1-minute on-device history).
  endpoints:
    gen1_status: "GET /status → emeters[] {power, reactive, voltage, pf, total, total_returned}"
    gen1_meter: "GET /emeter/<n>; GET /emeter/<n>/emeter.csv"
    gen1_relay: "GET /relay/0?turn=on|off|toggle (EM only)"
    gen2_status: "POST /rpc EM.GetStatus"
    gen2_history: "POST /rpc EMData.GetRecords"
    mqtt_topics: "shellies/<id>/emeter/<n>/... (gen1); <id>/status/em:0 (gen2)"

status:
  apk_acquired: false    # not needed — vendor-documented local API
  apk_decompiled: false
  uuids_recovered: false # n/a for LAN control (BLE only used for provisioning on gen2)
  protocol_recovered: true
  rating: confirmed
  cloud_dead: false      # manufacturer active; cloud optional by design
  references:
    - shelly-api-docs.shelly.cloud/gen1 (EM, 3EM)
    - shelly-api-docs.shelly.cloud/gen2/Devices/Gen3/Shelly3EMG3
    - home-assistant.io/integrations/shelly (local)
    - github.com/ALLTERCO/shelly-cli-tools
