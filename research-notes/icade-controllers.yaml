# ION Audio iCade line (cabinet / Jr / Mobile / Core / 8-bitty) — Device Spec
# No companion app ever existed — device is a plain BT Classic HID keyboard.
# Keymap verified against Bluez-IME iCadeReader (com.hexad.bluezime 1.20, F-Droid archive).

device:
  id: icade-controllers
  name: ION Audio iCade family (iCade, iCade Jr, iCade Mobile, iCade Core, iCade 8-bitty)
  manufacturer: ION Audio (inMusic Brands; iCade line discontinued ~2014)
  category: game_controller
  safety_class: LOW

transport:
  type: bluetooth_classic
  local_only: true
  profiles:
    - hid  # presents as a Bluetooth keyboard

bluetooth_classic:
  pairing:
    device_names: ["ION iCade Game Controller", "8-bitty"]
    pairing_mode_cabinet: Hold bottom 4 buttons + top white button 4s, release
    pairing_mode_8bitty: Hold the two center buttons 4s
    pin_entry_cabinet:  # host displays numeric passcode, "typed" via controls
      stick_up: "1"
      stick_down: "2"
      stick_left: "3"
      stick_right: "4"
      top_red: "5"
      bottom_red: "6"
      top_left_black: "7"
      bottom_left_black: "8"
      top_right_black: "9"
      bottom_right_black: "0"
      white_buttons: Enter
    pin_8bitty: none required

protocol:
  note: >
    iCade protocol: each control sends ONE keyboard press event on press and a
    DIFFERENT press event on release. No repeats, no modifier state. Host software
    maps letter pairs to controls (RetroArch/PPSSPP have built-in iCade modes;
    Bluez-IME provides an Android IME driver).
  keymap:  # press_key / release_key
    stick_up:    {press: w, release: e}
    stick_down:  {press: x, release: z}
    stick_left:  {press: a, release: q}
    stick_right: {press: d, release: c}
    button_1:    {press: y, release: t}
    button_2:    {press: u, release: f}
    button_3:    {press: i, release: m}
    button_4:    {press: o, release: g}
    button_5:    {press: h, release: r}
    button_6:    {press: j, release: n}
    button_7:    {press: k, release: p}
    button_8:    {press: l, release: v}
  hid_report: standard boot-protocol keyboard report, report ID 1 (per Bluez-IME)

status:
  apk_acquired: false   # no companion app exists — none needed
  apk_decompiled: false
  protocol_recovered: true  # complete press/release keymap, multi-source confirmed
  hci_snoop_needed: false
  cloud_dependency: none
  references:
    - en.wikipedia.org/wiki/ICade
    - fcc.report/FCC-ID/V77-9ECEA (8-bitty manual)
    - F-Droid archive: com.hexad.bluezime 1.20 (iCadeReader keymap)
