# Cobra Tag — Device Spec (research stage)
# NO APK acquired (not on apk-pure under guessed ids com.cobra.tag / com.cobratag)
# Product: Cobra Electronics, launched 2011, long discontinued (company survives
# as Cedar Electronics — abandoned product, not dead company)

device:
  id: cobra-tag
  name: Cobra Tag
  manufacturer: Cobra Electronics (product discontinued; company alive under Cedar Electronics)
  category: key_finder_proximity_alarm
  safety_class: NONE

transport:
  type: bluetooth_classic
  local_only: true
  cloud_dependency_note: >
    None known — contemporary reviews describe purely local link monitoring
    by the phone app; no account setup documented.

bluetooth_classic:
  version: "2.0 + EDR (Class 2, ~10 m)"   # per official spec sheet
  profiles: []   # TBD — likely SPP or HFP; MFi-era ("Made for iPhone" badged)
  pairing:
    notes: >
      Unverified. Spec sheet claims simultaneous connection to 2 phones.
      sdptool browse on real hardware is the first step.

protocol:
  note: >
    Unknown — no APK obtained and no community RE found. Expected to be a
    simple link-supervision scheme (fob alarms on link loss; app triggers
    fob beeper over RFCOMM), analogous to ZOMM Wireless Leash.
  commands: {}

status:
  apk_acquired: false        # package id unconfirmed; apk-pure miss on two guesses
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: true
  rating: hypothesis         # real product, BT Classic confirmed; protocol unverified
