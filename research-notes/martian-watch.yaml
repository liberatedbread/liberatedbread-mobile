# Martian Watches — Device Spec (research note)
# Company defunct (domain resold -> spam, verified 2026-08-07; app delisted).
# RFCOMM frame format + full opcode table recovered from last APK (jadx).

device:
  id: martian-watch
  name: Martian Passport / Victory / G2G / Notifier MN200 / mVoice
  manufacturer: Martian Watches (Irvine CA; defunct ~2018-2019)
  category: smartwatch
  safety_class: LOW
  models:
    - passport    # 2013, BT Classic, mic+speaker (HFP speakerphone)
    - victory     # 2013, voice model
    - g2g         # 2013, voice model
    - notifier    # 2014, MN200, no speaker; BLE-era
    - mvoice      # 2016-2018, Alexa tie-in

transport:
  type: bluetooth_classic
  profile: spp + hfp
  local_only: true
  rfcomm:
    service_uuid: "0000fff0-0000-1000-8000-00805F9B34FB"  # watch-hosted RFCOMM server
    source: SpwatchService.java:169,519,603 (jadx, app v3.0.1)
    note: >
      Voice models additionally present standard HFP — they work as a generic
      Bluetooth speakerphone with ANY phone and no vendor app. Smart features
      ride the framed protocol below. Notifier/mVoice may mirror the protocol
      over BLE GATT 0xFFF0 (unconfirmed — needs live capture).

protocol:
  frame_format: "0x3C cmd len_hi len_lo payload... 0x3E"  # '<' ... '>', len is big-endian payload length
  source: SpwatchService.write() ~line 1627 (jadx)
  commands:  # partial; ~80 opcodes recovered from SpwatchService constants
    AUDIO: 1
    TEXT: 2
    ACK: 3
    NOTIFICATION: 5
    BATTERY: 9
    DISCONNECT: 15
    BUTTON_EVENT: 20
    DISPLAY_STATUS: 25
    CALLER_ID: 37
    ALERT: 40
    TIME: 41
    HOME_SCREEN: 42
    DISABLE_FEATURE: 44
    SETUP: 45
    FS_INFO: 47
    FS_READ_FILE: 48
    FS_WRITE: 50
    CAMERA: 52
    VERSION: 54
    AUTHORIZE: 55
    FIND_PHONE: 56
    DIAL_PHONE: 57
    AUDIO_STATE: 61
    BUZZER_NOTIF_CONFIG: 68
    ALERT_BUZZ: 71
    ALARM: 72
  note: >
    Init sequence observed in ConnectedThread: write(1,{4}) then write(1,{1}),
    plus write(20,{96,6,0,0}) button-report config. Whether AUTHORIZE is
    enforced by the watch firmware is untested.

cloud_status:
  cloud_required: false  # protocol is direct RFCOMM; only Alexa voice features died with the company

status:
  apk_acquired: true     # com.martianwatches.martianwatchalerts 3.0.1 (apkeep/APKPure)
  apk_sha256: "cf71d5216c58abb6f052f2fb0cc660c539d7a81ccc9e5166329af6e92967401b"
  apk_decompiled: true
  uuids_recovered: true  # RFCOMM 0xFFF0 service UUID + frame format + opcode table
  protocol_recovered: true  # triage-level: framing + commands; payload schemas per-opcode TBD
  hci_snoop_needed: false   # would help confirm per-opcode payload layouts
  rating: confirmed
