# Brultech GreenEye Monitor / ECM-1240 — Device Spec (research note)
# Manufacturer ACTIVE (brultech.com store/docs live 2026-05)
# Local path: device PUSHES vendor-documented binary or HTTP packets to a LAN host

device:
  id: brultech-greeneye
  name: Brultech GreenEye Monitor (GEM, 32 ch) and ECM-1240 (7 ch)
  manufacturer: Brultech Research Inc. (Canada) — active
  category: energy_monitor
  safety_class: MEDIUM  # CTs inside breaker panel; measurement-only

transport:
  type: wifi            # WiFi or Ethernet comm module; RS-232 also present
  local_only: true
  note: >
    Push model: the monitor is pointed at a host:port on the LAN and streams a
    measurement packet every N seconds. No cloud account or service at any
    stage; third-party dashboards were always opt-in destinations.

lan:
  discovery:
    method: push_with_serial  # receivers identify the monitor by serial inside each packet
  control:
    protocol: tcp-push
    port: configurable (HA greeneye_monitor default listener 8000)
    auth: none
    formats:
      - binary packet (default; consumed by HA greeneye_monitor / DashBox / BTMon)
      - HTTP ASCII (GET with all channels in query string; legacy Vera/Ezlo path)

protocol:
  note: >
    Brultech publishes the packet formats and API docs (brultech.com/software).
    Binary frame carries device serial, uptime seconds, per-channel
    watt-seconds/watts/volts, 1-Wire temperatures and pulse counters.
    Spec work = transcribe byte offsets from the vendor packet-format document.
  commands:
    stream_data: device-initiated periodic packet (binary or HTTP)
    configure: via comm-module web UI or Brultech config tool (local)

status:
  apk_acquired: false    # n/a — no mobile app in the loop
  apk_decompiled: false
  uuids_recovered: false # n/a — no BLE
  protocol_recovered: true   # vendor-published packet format + HA implementation
  rating: confirmed
  cloud_dead: false      # never had one; manufacturer active
  references:
    - brultech.com/products ("Packet formats and API available")
    - home-assistant.io/integrations/greeneye_monitor (local_push)
    - community.home-assistant.io/t/brultech-greeneye-monitor-and-ecm-1220-1240-integration/577447 (2023-06-01)
    - community.ezlo.com/t/brultech-greeneye-energy-monitor-gem/172782 (2013-10-27, HTTP format)
