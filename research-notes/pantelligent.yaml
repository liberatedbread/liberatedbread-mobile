# Pantelligent Smart Frying Pan — Device Spec (research note)
# Company defunct (patent lawsuit, by 2019); app removed from stores
# APK: NOT acquired (package id unknown; apkeep/apk-pure misses 2026-08-03)

device:
  id: pantelligent
  name: Pantelligent Smart Frying Pan
  manufacturer: Pantelligent Inc. — out of business (~2018-2019)
  category: kitchen_sensor
  safety_class: LOW  # read-only temperature sensor

transport:
  type: ble
  local_only: true
  note: >
    BLE temperature streaming to phone app; cloud only served recipes.
    Core function (pan surface temperature read-out) is inherently local.

ble:
  advertising:
    name_patterns: []  # TBD — needs physical unit scan
    service_uuids: []  # TBD
  services: []         # TBD — greenfield; expect one service + notify char

protocol:
  note: >
    No public RE and no fetchable APK. Recommended path: brute-force GATT
    enumeration (device is read-only, safe to probe), identify temperature
    notify characteristic, infer encoding (likely int16 °C/°F, ~260 °C max).
  commands:
    temperature_read: TBD

status:
  apk_acquired: false     # unfetchable via apkeep; may exist on archive mirrors
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: false # no APK/app to snoop; direct GATT probing instead
  cloud_dead: true        # company out of business since ~2018-2019
  references:
    - thespoon.tech/bluetooth-connected-smartypans-has-started-shipping/ (2019-09-30)
    - cnet.com/reviews/pantelligent-review/ (2015-12-18)
