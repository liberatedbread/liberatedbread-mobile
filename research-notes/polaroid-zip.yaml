# Polaroid Zip (POLMP01) — Device Spec (research note)
# From static analysis of com.polaroid.mobileprinter (APKPure via apkeep)
# APK SHA-256: 2dce097d579dd015af6c0147473059c4b41a9a8aa20a24f4ef9a67309f27d354

device:
  id: polaroid-zip
  name: Polaroid Zip Instant Photoprinter (POLMP01, "manta")
  manufacturer: Polaroid (licensee C&A Marketing; ZINK platform)
  category: portable_photo_printer
  safety_class: LOW

transport:
  type: bluetooth_classic
  local_only: true

bluetooth_classic:
  pairing:
    method: nfc_tap_or_standard
    notes: NFC tag triggers Android pairing; no account needed
  channels:
    - name: control_spp
      uuid: "00001101-0000-1000-8000-00805f9b34fb"
      role: command/status channel (insecure RFCOMM)
    - name: obex_object_push
      uuid: "00001105-0000-1000-8000-00805f9b34fb"
      role: image data path (standard OBEX PUT of image/*)

protocol:
  note: >
    Control frames on SPP start with magic 1B 2A 43 41 ("ESC*CA") then
    00 00, command byte, subcommand byte, big-endian payload. Image is
    pushed separately over OBEX OPP. Firmware updates (.rbn) go over the
    same SPP channel using UPGRADE commands.
  frame:
    header: "1B 2A 43 41 00 00"
    command_offsets: "byte6=cmd, byte7=subcmd"
    endianness: big
  commands:
    print_ready: "00 00 | size24 count post page01 page02 mode ratioS"
    print_cancel: "00 01"
    print_info_query: "01 00"
    change_info: "01 01 | autoExposure autoPower printMode"
    print_action: "02 00 | dataType"
    fw_upgrade_start: "03 00 | size24 dataType"
    fw_upgrade_cancel: "03 01"
    data_or_upgrade_chunk: "05 00 | size16 payload"
    status_query: "06 00"
  response_layout: TBD  # fields known (battery, fw/tmd ver, mac, errors), framing not mapped
  image_path: obex_opp_push  # bare PC push plausibly works; unverified

status:
  apk_acquired: true
  apk_decompiled: true
  uuids_recovered: true   # SPP 0x1101 + OPP 0x1105
  protocol_recovered: partial  # command set mapped; response framing TBD
  hci_snoop_needed: true       # to confirm response frames + bare-OPP printing
  cloud_dependency: none       # analytics endpoints only
  manufacturer_status: >
    Hardware discontinued; app still maintained by C&A Marketing (v8.x,
    2024) — at-risk but not orphaned. No cloud in print path.
  references:
    - https://polaroid-zip.en.uptodown.com/android/download
    - https://forums.raspberrypi.com/viewtopic.php?t=186183
