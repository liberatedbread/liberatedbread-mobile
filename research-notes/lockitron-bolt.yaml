# Lockitron Bolt
# No APK acquired (removed from Play; not on APK Pure) — research only

device:
  id: lockitron-bolt
  name: Lockitron Bolt (+ Bridge, Keypad)
  manufacturer: Apigy Inc. (acquired by Chamberlain Group early 2019)
  category: smart_lock
  safety_class: HIGH  # physical access control

transport:
  type: ble  # nRF51822; Wi-Fi only via optional Bridge (Electric Imp)
  local_only: true  # historically: phone app drove lock directly over BLE;
                    # Bridge/cloud only added remote access

cloud:
  status: dead  # Lockitron system shut down 2020-06-17 (vendor announcement);
                # residual support only via Chamberlain myQ cloud (2026 status unverified)
  setup_dependency: unknown — whether BLE pairing keys were server-issued is THE
                    open question; if yes, unpaired locks may be unprovisionable

ble:
  advertising:
    name_patterns: []  # TBD
    service_uuids: []  # TBD
  services: []  # no public RE; APK unavailable for static triage

protocol:
  note: >
    No public reverse-engineering found (no GitHub drivers, HA, or Gadgetbridge
    support). Hardware is a standard Nordic nRF51822 running BLE GATT, and the
    product worked phone-to-lock over BLE by design, so a local path physically
    exists. RE would start from the companion APK (currently unfetchable) or an
    nRF52 firmware dump.

status:
  apk_acquired: false  # gone from Play; APK Pure misses on all plausible ids (2026-08-03)
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: true  # and requires an already-paired phone, if one exists
  reference: en.wikipedia.org/wiki/Lockitron
  open_questions:
    - surviving APK (APKMirror/Wayback/old device backup)
    - myQ app still pairing/controlling Bolt, and locally or cloud-only
    - pairing key exchange: phone-local or server-issued
