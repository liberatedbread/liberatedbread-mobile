# UREVO Walking Pads — Device Spec (research)
# APK: com.urevo.app v3.6.22 (26042201), APKPure XAPK via apkeep, 2026-08-04
# XAPK SHA-256: c446b0200ffb27e7bed720293dab5ad4bbe79d9008635673b363239821a4ab63
#
# Protocol recovered 2026-08-10 by static analysis of the Flutter Dart AOT
# snapshot (lib/armeabi-v7a/libapp.so, Dart 3.4.3) using a custom snapshot
# parser + capstone ARM disassembly (toolchain: workspace/static/
# urevo-walking-pad/analysis/). BLE plugin: flutter_reactive_ble. All UUIDs
# below are confirmed string/constant evidence from the app's own code;
# "inferred" items are marked. No hardware capture yet — every command here
# should be treated as code-confirmed but not hardware-confirmed.

device:
  id: urevo-walking-pad
  name: UREVO Walking Pad family (SpaceWalk E3S/E4, Strol 2E Pro, CyberPad; model codes URTM012/018/022/023/024/029/030/041)
  manufacturer: UREVO (UREVO WELLNESS US CO., LTD)
  type: treadmill  # walking pad / under-desk treadmill
  category: treadmill
  safety_class: MEDIUM  # motorised moving belt

transport:
  type: ble
  local_only: true  # app<->pad link is BLE; vendor cloud only for account/stats sync

ble:
  advertising:
    # Code-confirmed: the app's device config keys matching on advertised names
    # starting with the model code (URTM + 3 digits, e.g. URTM022 = SpaceWalk
    # Lite). Exact matcher semantics (startsWith vs contains) go through a
    # dispatch table — high-confidence hypothesis, verify with one scan.
    name_patterns: ["URTM*"]  # code-confirmed match keys, matcher semantics inferred
    # Scan filter registers service UUIDs 0x1826 (FTMS) and 0x180A (DIS).
    # UR-protocol models presumably also expose 0xFFF0 — verify on scan.
    service_uuids:
      - "00001826-0000-1000-8000-00805f9b34fb"  # FTMS-generation pads
      - "0000fff0-0000-1000-8000-00805f9b34fb"  # UR-protocol pads (inferred)
  services:
    # ------------------------------------------------ UR custom protocol
    - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
      name: ur_control_service
      description: >
        UREVO custom "UR" protocol (app classes UREquipment / URTreadmill_*;
        ProtocolType enum UR=0). Used by URTreadmill_* models. Code-confirmed
        from serviceId/writeCharacteristicId/enableNotifyCharacteristicIds
        getters.
      characteristics:
        - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
          name: ur_command_write
          description: Command write — BluePackA frames (see protocol section)
          properties: [write]
        - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
          name: ur_status_notify
          description: Status notifications — BluePackA responses
          properties: [notify]
    # ------------------------------------------------ standard FTMS
    - uuid: "00001826-0000-1000-8000-00805f9b34fb"
      name: fitness_machine_service
      description: >
        Standard Bluetooth FTMS path (app classes FTMSEquipment / FTTreadmill_*;
        ProtocolType enum FTMS=2). Same model codes exist in UR and FTMS
        variants — pick per device by which service it exposes. Characteristic
        set is exactly the FTMS standard; control opcodes are the standard
        ones (0x00 Request Control, 0x07 Start/Resume, 0x08 Stop/Pause,
        0x02 Set Target Speed uint16-LE 0.01 km/h) — opcode usage assumed
        from the standard, not read from code.
      characteristics:
        - uuid: "00002ad9-0000-1000-8000-00805f9b34fb"
          name: treadmill_control_point
          description: FTMS Control Point (write/indicate) — start/stop/speed
          properties: [write, indicate]
        - uuid: "00002acd-0000-1000-8000-00805f9b34fb"
          name: treadmill_data
          properties: [notify]
        - uuid: "00002ada-0000-1000-8000-00805f9b34fb"
          name: fitness_machine_status
          properties: [notify]
        - uuid: "00002ad3-0000-1000-8000-00805f9b34fb"
          name: training_status
          properties: [notify]
        - uuid: "00002ad4-0000-1000-8000-00805f9b34fb"
          name: supported_speed_range
          description: "Read at connect (app: fetchSpeedConfigAfterStarting)"
          properties: [read]
    # ------------------------------------------------ standard DIS
    - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
      name: device_information
      description: Standard DIS (0x2A23-0x2A29 strings present in app)
    # ------------------------------------------------ OTA
    - uuid: "0000fee0-0000-1000-8000-00805f9b34fb"
      name: ota_service
      description: >
        OTA firmware service (ProtocolType enum OTA=1). 0xFEE1 = notify
        (code-confirmed); 0xFEE2 present in the UUID pool, almost certainly
        the write char (inferred). Do not write — interrupted flashes brick
        controllers.
      characteristics:
        - uuid: "0000fee1-0000-1000-8000-00805f9b34fb"
          name: ota_notify
          properties: [notify]
        - uuid: "0000fee2-0000-1000-8000-00805f9b34fb"
          name: ota_write  # inferred
          properties: [write]

protocol:
  note: >
    Two protocol generations, like the KingSmith pads: a UREVO custom "UR"
    protocol on service 0xFFF0 (BluePackA frames) and standard FTMS on
    0x1826. The app picks per model (URTreadmill_* vs FTTreadmill_* classes;
    same numeric model codes exist in both families).

    UR frame (BluePackA), phone->pad commands AND pad->phone responses:
      [0x02] [B] [C (optional)] [payload...] [chk] [0x03]
    - A = 0x02 lead byte, D = 0x03 tail byte (neither is checksummed).
    - B = message class: 0x53 = training control, 0x51 = status query
      (when B is 0x51 or 0x42, the C byte is ABSENT and payload starts at
      index 2; otherwise C = command sub-opcode at index 2, payload at 3).
    - chk = ((B + C + sum(payload bytes)) & 0xFF) ^ 0x5A  — exact formula
      confirmed from BluePackA.getCheckSum disassembly.
    Wire units (protocol-level constants from UREquipment.get:unit, NOT
    per-device config — confirmed by dumping the literal maps; FTMS-side
    constants independently match the FTMS standard, cross-validating the
    method):
      speed byte    = km/h x 10   (0.1 km/h resolution)
      slope byte    = % x 10
      distance u16  = km x 100, little-endian
      calories u16  = kcal x 10, little-endian
    All multi-byte fields little-endian (getUInt16Value: b[0] | b[1]<<8).
    Speed control is absolute target speed only: the app's speed +/- UI
    buttons (addSpeed/reduceSpeed) just compute a new absolute target and
    send the same set-speed command. There are no step opcodes.

    A second packet type, BluePackB (0x5A 0xA5 header, CRC-16/CCITT poly
    0x1021 init 0x0000), exists for other UREVO equipment families (bike /
    massager); not used by UR treadmills.

    No pairing, bonding, token or handshake on either protocol: command
    builders send immediately on connect. Consequence (as with KingSmith):
    anyone in radio range can start the belt.

  commands:
    # UR protocol (write to 0xFFF2). All frames fully confirmed from code,
    # including checksums (stop/pause/resume/status carry NO payload — the
    # shared constant payload array was dumped from the snapshot; it is empty).
    start_prepared:
      description: "Prepare/start training (B=0x53, C=0x01). Payload is 4 bytes built from the session goals (calorie target, distance target, time/mode — exact argument order not pinned)."
      frame: [0x02, 0x53, 0x01, "{b0}", "{b1}", "{b2}", "{b3}", "{chk}", 0x03]
      verification: code-confirmed opcode; payload arg order TBD
    set_speed_and_slope:
      description: "Set absolute target speed + slope (B=0x53, C=0x02). speed byte = km/h x 10, slope byte = % x 10 (protocol-level constants, not per-device config). This is also what the speed +/- buttons send (absolute, no step opcodes)."
      frame: [0x02, 0x53, 0x02, "{speed}", "{slope}", "{chk}", 0x03]
      example: [0x02, 0x53, 0x02, 0x1E, 0x00, 0x73, 0x03]  # 3.0 km/h, slope 0: chk=(0x53+0x02+0x1E)&0xFF^0x5A
      verification: code-confirmed
    stop:
      description: "Stop the belt (B=0x53, C=0x03)"
      frame: [0x02, 0x53, 0x03, 0x0C, 0x03]  # chk = (0x53+0x03)^0x5A
      verification: code-confirmed
    pause:
      description: "Pause the belt (B=0x53, C=0x0A)"
      frame: [0x02, 0x53, 0x0A, 0x07, 0x03]  # chk = (0x53+0x0A)^0x5A
      verification: code-confirmed
    resume:
      description: "Continue/resume training (B=0x53, C=0x09)"
      frame: [0x02, 0x53, 0x09, 0x06, 0x03]  # chk = (0x53+0x09)^0x5A
      verification: code-confirmed
    query_status:
      description: "Request current status (B=0x51, no C byte). Pad answers on 0xFFF1."
      frame: [0x02, 0x51, 0x0B, 0x03]  # chk = 0x51^0x5A
      verification: code-confirmed
    query_speed_config:
      description: "Read min/max speed (B=0x50, C=0x02). Response payload = [minSpeed, maxSpeed] in wire units (x0.1 km/h)."
      frame: [0x02, 0x50, 0x02, 0x57, 0x03]  # chk = (0x50+0x02)^0x5A
      verification: code-confirmed
    query_slope_config:
      description: "Read slope config (B=0x50, C=0x03)."
      frame: [0x02, 0x50, 0x03, 0x54, 0x03]  # chk = (0x50+0x03)^0x5A
      verification: code-confirmed
    # FTMS protocol (write to 0x2AD9) — standard FTMS 1.0 opcodes
    ftms_request_control: [0x00]
    ftms_set_target_speed: "02 <lo> <hi>  # uint16-LE, 0.01 km/h"
    ftms_start_resume: [0x07]
    ftms_stop_pause: "08 <01|02>  # 01=stop, 02=pause"

  status_notification:
    description: >
      BluePackA response on 0xFFF1; after the envelope is stripped the
      payload parses as follows (confirmed from TMStatusResponse.onParseData;
      all multi-byte fields little-endian — getUInt16Value: b[0] | b[1]<<8).
      Payload minimum length 13; extended forms length 15 and 21 add a
      selector-gated u16 and further counters.
    payload_layout:
      - offset: 0
        name: status_mode
        note: "0=standby 1=stopped 2=starting 3=running 4=stopBySlow 5=error 6=forbid 9=prepared 10=pause (from init:statusMap literal)"
      - offset: 1
        name: speed
        note: "x0.1 km/h"
      - offset: 2
        name: slope
        note: "x0.1 %"
      - offset: "3..4"
        name: u16_raw_1
      - offset: "5..6"
        name: distance
        note: "u16-LE, x0.01 km"
      - offset: "7..8"
        name: calories
        note: "u16-LE, x0.1 kcal"
      - offset: "9..10"
        name: u16_raw_2
      - offset: 11
        name: flag_mode
      - offset: 12
        name: extension_selector
        note: "present at len>=13; gates extra u16 at 13..14 (selector 4 => distance, 6 => calories)"

