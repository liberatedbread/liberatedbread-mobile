# Sensel Morph — Device Spec (research note)
# Discontinued 2022-05-05; Sensel Inc. alive (touchpad OEM) but Morph line orphaned.

device:
  id: sensel-morph
  name: Sensel Morph (pressure-sensitive multi-touch controller with overlays)
  manufacturer: Sensel Inc. — Morph line discontinued 2022-05-05
  category: musical_instrument
  safety_class: NONE

transport:
  type: ble  # standard BLE MIDI for playing; USB serial for raw data + map upload
  local_only: true

ble:
  advertising:
    name_patterns: ["Morph"]  # confirm with a scan
    service_uuids: ["03b80e5a-ede8-4b33-a751-6ce34ec4c700"]  # standard BLE MIDI

  services:
    - uuid: "03b80e5a-ede8-4b33-a751-6ce34ec4c700"
      name: ble_midi_service
      description: >
        Standard BLE MIDI peripheral. Overlays flashed with MIDI maps stream
        note/CC/MPE data to any BLE-MIDI host with no Sensel software.
        Raw contact frames (positions/pressure, ~20k taxels) and overlay map
        upload are USB-serial only, via the documented sensel-api protocol.
      characteristics:
        - uuid: "7772e5db-3868-4112-a1a9-f2669d106bf3"
          name: ble_midi_io
          properties: [notify, write, write_no_response]

protocol:
  note: >
    Playing data: plain MIDI/MPE over standard BLE-MIDI framing. Configuration:
    SenselApp (desktop) compiles overlay maps and uploads over USB serial;
    Sensel's official open-source sensel-api documents the contact-frame and
    control protocol. No cloud account required for any function.
  reference_implementations:
    - github.com/sensel/sensel-api   # official open-source API (USB)
    - sensel.github.io/morph-docs    # official user/dev docs mirror

companion_apps:
  - name: SenselApp
    platform: desktop (Windows/macOS/Linux)  # no Android/iOS app ever shipped
    package_id: null

cloud_dependency:
  none: true
  risk: bit-rot of SenselApp installers + firmware downloads on sensel.com — archive now

status:
  company_status: product_abandoned  # company alive, product line dead since 2022-05-05
  apk_acquired: false  # N/A — no mobile app exists
  apk_decompiled: false
  uuids_recovered: true  # standard BLE MIDI only
  protocol_recovered: true  # official open API + docs
  hci_snoop_needed: false
  rating: confirmed
