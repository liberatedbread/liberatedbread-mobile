# HomeSeer HS4 / HomeTroller — Device Spec (research note)
# Active commercial platform; vendor-documented local JSON (HTTP) and ASCII (TCP) APIs.
# docs.homeseer.com updated 2024-10. Cloud (MyHS) optional.

device:
  id: homeseer-hs4
  name: HomeSeer HS4 (HomeTroller hubs, HS4-Pi, self-hosted Windows/Linux)
  manufacturer: HomeSeer Technologies
  category: smart_home_hub
  safety_class: LOW

transport:
  type: wifi
  local_only: true
  note: >
    HS4 web server exposes a JSON API on port 80 by default; an ASCII TCP
    control interface is enabled in Setup > Network ("Control using JSON and
    ASCII commands"). Both are vendor-documented and work without any cloud
    account. MyHS is an optional remote relay only.

lan:
  discovery: dhcp-scan
  json_api:
    protocol: http
    port: 80
    auth: optional-basic    # HS user/pass; can allow no-auth local subnets
    endpoints:
      - GET /JSON?request=getstatus&ref=*            # all device states
      - GET /JSON?request=getcontrol&ref=N           # control UI for device
      - GET /JSON?request=controldevicebyvalue&ref=N&value=V
      - GET /JSON?request=controldevicebylabel&label=...
      - GET /JSON?request=runevent&id=N
  ascii_api:
    protocol: tcp
    port: 10400            # long-standing community default (pyhs3); docs also list Network Port 10401
    note: line-based control/status protocol, enabled in Setup > Network

protocol:
  note: >
    Vendor-documented request/response JSON API plus ASCII command stream.
    Implemented by marthoc/homeseer (Home Assistant), pyhs3 (legacy).
  commands:
    control_by_value: /JSON?request=controldevicebyvalue&ref=N&value=V
    read_status: /JSON?request=getstatus&ref=N

status:
  apk_acquired: false
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: true   # vendor documentation
  hci_snoop_needed: false
  cloud_dead: false          # company active 2026
  rating: confirmed
  references:
    - docs.homeseer.com/hspi/json-api (2024-10)
    - docs.homeseer.com/products/network (2022-08)
    - github.com/marthoc/homeseer (2024)
