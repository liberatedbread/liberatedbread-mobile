# HomeWizard Energy family — Device Spec (research note)
# Manufacturer ACTIVE (NL); vendor-documented local API v1 (HTTP) and v2 (HTTPS + physical pairing)
# Cloud can be disabled via API; only the v1 enable-toggle requires the vendor app

device:
  id: homewizard-energy
  name: HomeWizard P1 Meter (HWE-P1), Energy Socket (HWE-SKT), kWh Meter, Watermeter
  manufacturer: HomeWizard (Netherlands) — active
  category: energy_monitor
  safety_class: LOW  # plug-in devices; the DIN-rail kWh Meter is installer-wired (MEDIUM for that model)

transport:
  type: wifi
  local_only: true
  note: >
    Official documented local APIs. v1 = plain HTTP with no auth; v2 = HTTPS
    with a bearer token obtained by physical button-press pairing (no account).
    PUT /api/v1/system {"cloud_enabled": false} severs cloud while local
    control keeps working. Only caveat: toggling the v1 local API on is done
    in the official app during first-time setup.

lan:
  discovery:
    v1: mDNS _hwenergy._tcp (HTTP port 80)
    v2: mDNS _homewizard._tcp (HTTPS port 443)
  control:
    protocol: http-json
    auth: none (v1); bearer token via button-press pairing (v2)

protocol:
  note: >
    Vendor-documented at api-documentation.homewizard.com. Measurement JSON
    per device class; P1 Meter additionally exposes the raw DSMR telegram.
  endpoints:
    device_info: "GET /api → {product_name, product_type, serial, firmware_version, api_version}"
    measurement: "GET /api/v1/data → {total_power_import_kwh, total_power_export_kwh, active_power_w, active_voltage_l1_v, ...}"
    dsmr_telegram: "GET /api/v1/telegram (P1 Meter)"
    system: "GET/PUT /api/v1/system (cloud_enabled toggle)"
    v2_pairing: "POST /api/user {name:...} then press device button → token"

status:
  apk_acquired: false    # not needed — vendor-documented local API
  apk_decompiled: false
  uuids_recovered: false # n/a — no BLE control path
  protocol_recovered: true   # vendor-documented
  rating: confirmed
  cloud_dead: false      # manufacturer active; cloud optional + API-disableable
  references:
    - api-documentation.homewizard.com/docs/introduction + /docs/discovery (2024-10-29)
    - pypi.org/project/python-homewizard-energy (2025-12-15)
    - raspberry.tips/en/smart-home/homewizard-energy-socket-home-assistant-review (2026-07-10, cloud kill-switch)
    - openhab.org/addons/bindings/homewizard
    - lavag.org/topic/59156 (v2 token pairing flow, 2025-11-10)
