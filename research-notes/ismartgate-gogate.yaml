# iSmartGate / Gogogate2 — Device Spec (research note)
# Remsol ACTIVE (ismartgate.com reachable 2026-08-07).
# Local path: HTTP GET /api.php with AES-encrypted JSON command, XML replies;
# HA core integration gogogate2 (local_polling); PyPI lib bdraco/ismartgate.
# No APK fetched — protocol already implemented in maintained libraries.

device:
  id: ismartgate-gogate
  name: iSmartGate PRO/LITE/MINI + Gogogate2 wired gate/garage controllers
  manufacturer: Remsol (Barcelona)
  category: garage_door_controller
  safety_class: MEDIUM  # relay pulses door/gate openers; magnetic sensor reports position

transport:
  type: wifi
  local_only: true
  note: >
    Local HTTP API on port 80, no cloud account needed at any point; setup
    is via device AP + local web UI. Optional cloud relay (remoteaccess) is
    off the LAN path. iSmartGate models also expose local HomeKit (HAP).

lan:
  discovery:
    note: auto-discovered by HA gogogate2 integration (DHCP/zeroconf); no documented mDNS service of its own
  control:
    protocol: http
    endpoint: GET http://<device-ip>/api.php?data=<ciphertext>
    auth: >
      data = encrypt(JSON [username, password, option, arg1, arg2]);
      key derived from sha1(lowercase(username)+password), sliced into an
      AES passphrase (variant differs between Gogogate2 and iSmartGate
      firmwares — see bdraco/ismartgate ApiCipher classes). Credentials are
      the device's local web-UI login.
    response_format: XML (<response>, <door1..3><status>, <outputs>, <network>, <wifi>, <error>)

protocol:
  note: >
    Two request options: "info" (full hub + door status, sensor voltage/
    temperature, outputs) and "activate" (pulse door arg1 = 1..3). Status
    values closed/opened/undefined; door modes garage/pulse/onoff. Error
    codes differ per family (e.g. CREDENTIALS_INCORRECT 1 vs 11). Verified
    from bdraco/ismartgate source 2026-08-07. Firmware revisions have
    changed the local schema before (Hubitat 2020-07; HA issue #93976).
  commands:
    info: 'option=info'
    activate_door: 'option=activate, arg1=<door id 1-3>'
    homekit: HAP pairing with printed code (iSmartGate only)

status:
  apk_acquired: false
  apk_decompiled: false
  uuids_recovered: false  # n/a — WiFi, not BLE
  protocol_recovered: true
  hci_snoop_needed: false
  cloud_dead: false
  rating: confirmed
  references:
    - github.com/bdraco/ismartgate (PyPI: ismartgate / gogogate2-api)
    - home-assistant.io/integrations/gogogate2/ (iot_class local_polling)
    - community.hubitat.com/t/ismartgate-pro/44891 (2020-07-11, local API schema drift)
    - github.com/home-assistant/core/issues/93976 (2023-06-02)
