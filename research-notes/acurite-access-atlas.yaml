# AcuRite Access / Atlas — Device Spec (research note)
# VERDICT: DUD for local-only. Hub hard-codes cloud uploads; only local capture
# is DNS-intercept (Acuparse) = MITM, out of scope. Sensors readable via rtl_433
# (RF, not Wi-Fi). Atlas 01008 + Access bundles officially discontinued.
# Sources checked 2026-08-07: support.acurite.com Discontinued Products category,
# acurite.com blog (smartHUB EOL 2019-02-28), acuparse.com.

device:
  id: acurite-access-atlas
  name: AcuRite Access hub (09155M) with Iris 5-in-1 / Atlas 7-in-1
  manufacturer: AcuRite (Chaney Instrument / Primex)
  category: weather_station
  safety_class: LOW

transport:
  type: wifi
  local_only: false   # DUD: no LAN API; cloud upload hard-coded to hubapi.myacurite.com
  note: >
    Only "local" capture is DNS-redirect interception of cloud posts
    (Acuparse) — a MITM path, out of scope. Sensors are readable locally via
    rtl_433 SDR (433 MHz), which is RF sniffing, not device LAN access.

protocol:
  note: no documented local protocol; intercepted upload format known via Acuparse

status:
  apk_acquired: false
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false  # local: none exists to recover
  hci_snoop_needed: false
  cloud_dead: false          # My AcuRite portal still up; products discontinued
  products_discontinued: true  # Atlas 01008 + Access bundles on vendor EOL list
  rating: rejected_dud
  rejection_reason: >
    Local access requires DNS interception of cloud traffic (out of scope);
    no vendor local API or custom-server option exists.
  references:
    - support.acurite.com/hc/en-us/categories/360005609933-AcuRite-Discontinued-Products
    - acuparse.com
    - acurite.com/blogs/default-blog/extending-end-of-service-and-support-for-acurite-smarthub
