# PUSH Band / PUSH Band 2.0 (velocity-based training IMU) — research note
# App: com.pushstrength.pushflutter (Flutter). APK source: apkeep (apk-pure), 2026-08-07
# Delisted from Google Play (404). SHA-256: ab9bd8b671cf9f38129afe18e04f6a844c077d2b904538458b07340fbac558a9

device:
  id: push-band
  name: PUSH Band 2.0 (PUSH Pro system)
  manufacturer: PUSH Inc (Toronto) — acquired by WHOOP 2021-09-02, hardware discontinued
  category: fitness_sensor  # velocity-based training IMU
  safety_class: LOW  # read-only sensor; no actuation

transport:
  type: ble
  local_only: true
  note: >
    Band streams IMU/velocity data to the phone over BLE; DSP runs on-device in
    the app (libAlgorithmInterface.so). No cloud needed for the data path itself.
    Stock app requires PUSH/WHOOP account login and Portal sync — with the backend
    dead, practical local use means a clean-room BLE client.

ble:
  advertising:
    name_patterns: []  # TBD — "PUSH" speculative
    service_uuids: []  # TBD
  services:
    - uuid: "fdd39ad0-238f-46af-adb4-6c85480369c7"
      name: push_band_service_unconfirmed
      description: >
        Only 128-bit UUID found in libapp.so strings; likely the band GATT
        service. Characteristics unknown — Flutter AOT snapshot resists static
        analysis; needs nRF Connect scan or HCI snoop on live hardware.
  native_libs:
    - libAlgorithmInterface.so  # on-device VBT DSP
    - libModels.so
    - Couchbase Lite (local DB + sync)

protocol:
  note: >
    6-axis IMU at 200 Hz (per MDPI 2018 validity study). Real-time velocity/power
    computed in-app. Frame format and characteristic layout TBD — dynamic capture
    recommended over further static work (Flutter snapshot).

abandonment:
  acquired_and_discontinued: true   # WHOOP acquisition 2021-09-02; hardware sales ended
  app_delisted: true                # Play 404, verified 2026-08-07
  domain_dead: true                 # trainwithpush.com unreachable, verified 2026-08-07
  sources:
    - https://www.whoop.com/us/en/press-center/acquires-push-velocity-based-training-solution/
    - https://gymaware.com/velocity-based-training-buyers-guide/
    - https://www.mdpi.com/2075-4663/6/4/140

status:
  apk_acquired: true
  apk_decompiled: false   # Flutter; only strings-level triage done
  uuids_recovered: partial  # one candidate service UUID from libapp.so
  protocol_recovered: false
  hci_snoop_needed: true
