# Kestrel 4000-series BT (4500BT) — Device Spec
# No mobile app — Windows "Kestrel Communicator" software only
# Product line discontinued (replaced by 5000-series / BLE LiNK)

device:
  id: kestrel-4500bt-weather-meter
  name: Kestrel 4000-series with Bluetooth (4000/4200/4300/4500 BT)
  manufacturer: Nielsen-Kellerman (Kestrel)
  category: environmental_weather_meter
  safety_class: LOW  # Ballistics/HAZMAT users exist; readings indicative, device
                     # remains fully functional standalone regardless of software

transport:
  type: bluetooth_classic
  local_only: true
  profiles: [SPP]  # hypothesis — BT 2.0-era radio, virtual COM port on Windows;
                   # period sellers note "not MAC/Apple compatible" (pre-MFi Classic)

bluetooth_classic:
  spp_uuid: "00001101-0000-1000-8000-00805f9b34fb"  # unverified — expected standard SPP
  pairing:
    pin_protected: unknown  # likely 1234/0000 if any — verify live
  other_interfaces: [wired_serial_cradle]  # optional PC interface, ASCII protocol

protocol:
  note: >
    Unverified hypothesis: the BT build tunnels the same ASCII serial protocol
    as the wired Kestrel PC interface over SPP. The wired protocol (data-log
    dump, live reading poll) has been discussed in ballistics communities but
    was not formally re-verified for this note. No public RE of the BT variant
    found. Meter logs up to ~2900 data points on-device; offload optional.
  known_commands: []  # TBD — one HCI snoop vs Kestrel Communicator will resolve

status:
  apk_acquired: false   # no mobile app ever existed (Windows software only)
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false  # hypothesis only
  hci_snoop_needed: true
  product_status: discontinued  # 4000 series EOL, replaced by 5000 series (~2014; date unverified)
  cloud_dependency: none  # never had any cloud component
  reference: >
    pdf.nauticexpo.com Kestrel 4500 catalog excerpt;
    pine-environmental.com product listing;
    global.bioweb.co listing (BT Apple-incompatibility note)
