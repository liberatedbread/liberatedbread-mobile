# Securifi Almond / Almond 2015 / Almond+ / Almond 3 — Device Spec (research note)
# Company effectively dead: securifi.com spam-hijacked as of 2026-08-07, app delisted.
# Rescue path: hub's own local web UI controls Zigbee/Z-Wave offline (vendor feature).

device:
  id: securifi-almond
  name: Securifi Almond+ / Almond 3 (and Almond / Almond 2015)
  manufacturer: Securifi (defunct — site hijacked/abandoned 2026)
  category: smart_home_hub
  safety_class: LOW

transport:
  type: wifi
  local_only: true
  note: >
    Router-class device with local web UI (port 80) and touchscreen. Sensors
    tab adds and controls paired Zigbee/Z-Wave devices, rules run on-box.
    Cloud account was optional (remote access only). Verified working offline
    by contemporary reviews (SmallNetBuilder).

lan:
  discovery: dhcp-scan        # router itself; gateway IP
  control:
    protocol: http
    port: 80
    auth: admin-password-set-at-local-setup
    ui_path: Sensors tab (device add/control/status), Rules tab
    programmatic_api: undocumented  # web UI is form/AJAX-driven; endpoints
                                    # recoverable from UI JS or browser proxy

protocol:
  note: >
    No documented programmatic local API. Web UI + touchscreen are the
    supported local interfaces. Android app (delisted) had an undocumented
    LAN protocol — future RE target if a mirror APK is obtained.
  commands:
    device_control: via local web UI (confirmed working offline)
    sensor_pairing: via web UI / touchscreen inclusion wizard

status:
  apk_acquired: false     # FAILED: com.securifi.almond delisted; apkeep
                          # google-play + apk-pure both error (2026-08-07)
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false  # web UI confirmed; programmatic API = hypothesis
  hci_snoop_needed: false
  cloud_dead: true        # securifi.com spam-hijacked 2026-08-07; app delisted
  rating: confirmed-webui / hypothesis-api
  references:
    - smallnetbuilder.com/smarthome/smarthome-reviews/securifi-almondplus-home-automation-features-reviewed/
    - smallnetbuilder.com/wireless/wireless-reviews/securifi-almondplus-reviewed/
    - securifi.com (fetched 2026-08-07 — casino/pharma spam in page body)
