# Broadlink SP2 / SP mini / SP3 — Device Spec (research note)
# Broadlink alive; local UDP+AES protocol fully documented in mjg59/python-broadlink
# Local path: UDP port 80, AES-128-CBC, known default key, offline provisioning

device:
  id: broadlink-sp-plugs
  name: Broadlink SP2 / SP mini / SP3(S) Wi-Fi Smart Plugs (+ OEM rebadges)
  manufacturer: Broadlink (Hangzhou) — alive
  category: smart_plug
  safety_class: LOW  # mains relay; published default AES key — LAN-segment

transport:
  type: wifi
  local_only: true
  note: >
    All control is LAN UDP port 80. No cloud account needed for control OR
    provisioning (python-broadlink broadlink.setup() pushes Wi-Fi creds
    directly to the plug's AP). Newer Broadlink lines add cloud-lock quirks;
    SP2/SP-mini-era units are unaffected.

lan:
  discovery:
    method: udp_broadcast
    port: 80
  control:
    protocol: udp-binary-aes
    port: 80
    crypto: AES-128-CBC; default key 097628343fe99e23765c1513accf8b02; per-client key issued by device after auth command
    header: 56-byte header, magic 5aa5aa55 5aa5aa55, cmd code LE16 at 0x26 (0x006a = command), LE CRC16 checksums

protocol:
  note: >
    Packet-level spec: protocol.md in mjg59/python-broadlink. Commands are
    encrypted JSON-ish payloads; HA broadlink integration is the reference
    implementation. SP2/SP3S expose energy metering.
  commands:
    discover: encrypted broadcast discover packet
    auth: "client id+key negotiation (per-client AES key)"
    power_on: '{"pwr":1}'   # SP2 payload
    power_off: '{"pwr":0}'
    get_state: check power payload
    get_energy: energy payload (SP2/SP3S)

status:
  apk_acquired: false   # not needed — protocol.md is definitive
  apk_decompiled: false
  protocol_recovered: true   # mjg59/python-broadlink + HA broadlink integration
  rating: confirmed
  cloud_dead: false   # company alive; local path independent of cloud anyway
  references:
    - github.com/mjg59/python-broadlink (+ protocol.md)
    - home-assistant.io broadlink integration (local)
    - cnblogs.com/gooutlook/p/10005358.html (2018-11-23, Chinese RE of SP2/SP mini)
