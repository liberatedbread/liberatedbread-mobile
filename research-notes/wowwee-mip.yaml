# WowWee MiP / MiPosaur — Research Note
# Companion app APK source: apkeep (APKPure)
# XAPK SHA-256: 3113cc81aa75aea7dbd5e81a67142e10644ab7c6768af6b540c3e32f2272710a

device:
  id: wowwee-mip
  name: WowWee MiP / MiPosaur / Turbo Dave (Minion MiP) / Roboraptor Blue
  manufacturer: WowWee Group (company active; MiP line discontinued, apps unmaintained since ~2018)
  category: toy_robot
  safety_class: NONE
  excluded: Robosapien X uses an IR dongle, not BLE

transport:
  type: ble
  local_only: true

ble:
  advertising:
    name_patterns: ["MIP_"]  # MIP_ prefix string present in app; per-robot names vary
    service_uuids: []

  # Confirmed in com.wowwee.mip v3.0 DEX (shared bluetoothrobotcontrollib)
  # and matching WowWeeLabs official SDK + adamgreen/MiP community docs
  services:
    - uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
      name: mip_control_service
      description: MiP primary control service
      characteristics:
        - uuid: "0000ffe9-0000-1000-8000-00805f9b34fb"
          name: command_write
          description: Command channel — single-byte opcodes + small payloads (drive, turn, LEDs, sounds, modes)
          properties: [write, write_no_response]
        - uuid: "0000ffe4-0000-1000-8000-00805f9b34fb"
          name: response_notify
          description: Responses + radar/gesture/fall notifications
          properties: [notify]
    - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
      name: battery_service
      characteristics:
        - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
          name: battery_level
    - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
      name: device_information
  additional_uuids_in_app:
    note: >
      DEX also contains ffe5, fff0 and a full ff00-ffb0 table from the shared WowWee
      robot library (other robots / OTA); per-robot applicability needs one nRF
      Connect scan each for MiP, MiPosaur, Turbo Dave.

protocol:
  note: >
    Simple request/response binary protocol, opcodes documented in WowWee's own
    WowWeeLabs SDKs (Android/iOS/Node/Windows) and independently in adamgreen/MiP.
    Examples: set chest LED RGB, drive forward/backward by time or cm, turn by
    degrees, continuous drive, gesture/radar mode select, play sound, read firmware
    version/date. No pairing, no auth, no cloud.
  references:
    - github.com/WowWeeLabs/MiP-Android-SDK   # official, ships command tables
    - github.com/WowWeeLabs/MiP-Node.js-SDK   # official
    - github.com/WowWeeLabs/MiP-Windows-SDK   # official
    - github.com/adamgreen/MiP                # C API + HCI-snoop protocol docs
    - github.com/vlimit/mip                   # original 2014 RE

status:
  apk_acquired: true          # com.wowwee.mip 3.0 (31) XAPK via apkeep apk-pure
  apk_decompiled: false       # DEX string sweep only; official SDKs make full decompile unnecessary
  uuids_recovered: true
  protocol_recovered: true    # via official SDKs + community docs
  hci_snoop_needed: false
  cloud_dependency: none
  related_packages_not_fetched: [com.wowwee.miposaur, com.wowwee.minionmip]
