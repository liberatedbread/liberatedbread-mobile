# AB Shutter 3 / generic BT Classic HID shutter remote — Device Spec
# No companion app exists; device is standard Bluetooth Classic HID.
# Sources: MobileRead thread (2026), StackOverflow HID key report (2015)

device:
  id: ab-shutter-3
  name: AB Shutter 3 / generic Bluetooth Classic HID camera shutter remote
  manufacturer: various OEM (YiChip-based; sold as CamKix and dozens of unbranded clones)
  category: input_remote
  safety_class: NONE

transport:
  type: bluetooth_classic
  local_only: true

bluetooth_classic:
  profiles: [hid]
  sdp_services:
    - uuid16: "0x1124"
      name: human_interface_device
      description: HID profile; presents as keyboard + consumer control combo
  pairing:
    pin: none            # JustWorks / numeric-comparison depending on host
    name_patterns: ["AB Shutter 3", "AB Shutter", "Bluetooth Shutter"]
    notes: >
      Pairs from OS Bluetooth settings. No app. One press to wake/reconnect
      after auto-sleep. Some clones are BLE HID instead of Classic — behaviour
      identical at OS level.
  hid_reports:
    note: >
      Standard boot/report protocol; arrives as evdev events on Linux
      (visible with evtest). No reverse engineering needed.
    button_map:
      ios_button: KEY_VOLUMEUP        # camera shutter in iOS/Android camera apps
      android_button: KEY_VOLUMEDOWN  # varies by clone; some send ENTER
      extra_on_some_clones: [play_pause, next_track, previous_track]

protocol:
  note: >
    None — standard HID. Phone camera apps map volume keys to shutter
    release (Samsung One UI 6+ requires enabling Camera Settings ->
    Volume key function -> Shutter). Repurpose as generic two-button
    HID input on any OS.
  references:
    - https://www.mobileread.com/forums/showthread.php?p=4584542   # YiChip Classic BT confirmed
    - https://stackoverflow.com/questions/33955141               # HID key set on Windows

status:
  apk_acquired: false      # no APK exists — by design
  apk_decompiled: false
  protocol_recovered: true # standard HID; nothing to recover
  hci_snoop_needed: false
  community_support: active (Kindle/KOReader page-turner community, 2026)
