# Wilson X Connected Basketball — Structured Note
# APK source: apkeep (apk-pure); com.sstatzz.basketball.wilson 1.3.8 (final, 2017-12-21)

device:
  id: wilson-x-basketball
  name: Wilson X Connected Basketball
  manufacturer: Wilson Sporting Goods (app by Sstatzz)
  category: sports_sensor
  safety_class: LOW

transport:
  type: ble
  local_only: true
  note: >
    Make/miss detection is computed on the ball's MCU; phone receives shot events
    over BLE. Cloud only used for sharing/leaderboards. Product discontinued; app
    removed from stores (mirrors only).

ble:
  advertising:
    name_patterns: []  # TBD — ball wakes on motion; needs nRF Connect scan
    service_uuids: []  # TBD

  # Three candidate 16-bit UUID families recovered from dex; which one is the
  # ball's GATT is TBD (jadx or scan needed)
  services:
    - uuid: "0000aa80-0000-1000-8000-00805f9b34fb"
      name: candidate_service_aa80
      description: Custom service family; characteristics aa81-aa84, aa90-aa92 seen
      confirmed: false
    - uuid: "0000fa10-0000-1000-8000-00805f9b34fb"
      name: candidate_service_fa10
      description: Chars fa10-fa12, fa14-fa16 (fa13 absent)
      confirmed: false
    - uuid: "0000fd40-0000-1000-8000-00805f9b34fb"
      name: candidate_service_fd40
      description: Chars fd40-fd44
      confirmed: false

  standard_services:
    - uuid: "00001812-0000-1000-8000-00805f9b34fb"
      name: hid_over_gatt
      note: Referenced in app; possibly used for ball-as-HID or OTA
    - uuid: "00002902-0000-1000-8000-00805f9b34fb"
      name: cccd

protocol:
  note: >
    Ball detects dribble/shot/flight/arc and make-vs-miss internally; app receives
    classified events. Frame format TBD. App is small (35 MB), old (2017), and shows
    no heavy obfuscation in strings — a good first jadx target.
  expected_measurements:
    - shot_attempt_event
    - make_miss_result
    - shot_range_estimate

status:
  apk_acquired: true
  apk_decompiled: false
  uuids_recovered: partial  # candidate families only; mapping TBD
  protocol_recovered: false
  hci_snoop_needed: true
  cloud_status: shutdown  # product discontinued, app pulled
  sources:
