# Wilson X — structured research note (2026-11-01)

device:
  id: wilson-x-basketball
  name: Wilson X Connected Basketball
  manufacturer: Wilson Sporting Goods (app discontinued)
  category: sports_sensor

transport:
  type: ble
  local_only: true
  service: "0000fa10-0000-1000-8000-00805f9b34fb"
  notify: "0000fa11-0000-1000-8000-00805f9b34fb"
  mode_write: "0000fa12-0000-1000-8000-00805f9b34fb"
  calibration: "0000fa15-0000-1000-8000-00805f9b34fb"
  timing: "0000fa16-0000-1000-8000-00805f9b34fb"

protocol:
  status: static-analysis-derived; no ball capture
  mode_1: "signed x/y/z bytes; each (value / 127) * 12 / 1000; unit unknown"
  mode_6: "five u24be magnitudes, sqrt(value) * 0.006, then packet counter"
  mode_2: "related u24be magnitude, sqrt(value) * 0.012"
  excluded: "aa80 and fd40 are separate 9-DoF families; 94Fifty is unrelated"
  selection: hardware/firmware-dependent; do not guess

cloud:
  acceleration_stream: local
  shot_classifier: phone-side
  offline_first_run: unproven

next_evidence:
  - Advertised hardware/firmware layout and a mode-1 capture
  - Calibration/timing layouts and offline onboarding

validated_spec: null
