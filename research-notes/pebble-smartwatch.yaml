# Pebble Smartwatch Family — Device Spec (research note)
# Company shut down 2016-12-07; Fitbit cloud killed 2018-06; Rebble community services.
# Local BT Classic SPP control fully confirmed; protocol publicly documented.

device:
  id: pebble-smartwatch
  name: Pebble Classic / Steel / Time / Time Steel / Time Round / Pebble 2
  manufacturer: Pebble Technology Corp (defunct 2016; IP to Fitbit; Rebble community)
  category: smartwatch
  safety_class: LOW
  models:
    - pebble-classic    # 2013, Kickstarter/original + Steel
    - pebble-time       # 2015, Time/Time Steel/Time Round (adds BLE LE features)
    - pebble-2          # 2016, adds HR sensor

transport:
  type: bluetooth_classic
  profile: spp
  local_only: true
  rfcomm:
    service_uuid: "00001101-0000-1000-8000-00805F9B34FB"  # standard SPP UUID
    source: com/getpebble/android/bluetooth/j/b.java:18 (jadx, app v4.4.3)
    note: >
      Phone connects as RFCOMM client to the watch over standard SPP.
      Time-series watches also expose BLE GATT / PPoGATT on later firmware,
      but SPP remains the primary Android/PC data path. iOS uses BLE+ANCS.

protocol:
  note: >
    Fully documented public protocol (developer.rebble.io mirrors the official
    docs). Length-prefixed packets with 16-bit endpoint IDs: notifications,
    music control, time sync, app install (blobdb / .pbw), watchfaces,
    screenshots, ping, AppMessage. Open implementations: libpebble/libpebble2
    (Python, PC over SPP), PebbleKit, Gadgetbridge (Android, cloudless),
    Cobble (Rebble app, open source).
  endpoints_documented: true
  implementations:
    - codeberg.org/Freeyourgadget/Gadgetbridge   # recommended fully-local path
    - github.com/pebble/libpebble2               # PC/Raspberry Pi over SPP
    - developer.rebble.io                        # protocol reference + pebble CLI

cloud_status:
  cloud_required: false
  note: >
    Rebble account is OPTIONAL (appstore, weather, dictation, timeline pins).
    Core pairing, notifications, music control and .pbw sideloading via
    Gadgetbridge need no account and no internet.

status:
  apk_acquired: true        # com.getpebble.android.basalt 4.4.3-1406 (apkeep/APKPure)
  apk_sha256: "7be78e833a65e2bd0db1d40c3e1063bbcf64a8068990b5a26fecfd24b2daaabc"
  apk_decompiled: true
  uuids_recovered: true     # SPP 1101 confirmed in app; BLE GATT UUIDs also present
  protocol_recovered: true  # publicly documented; never needed RE
  hci_snoop_needed: false
  rating: confirmed
