device:
  id: sphero-classic
  name: Sphero 1.0 / Sphero 2.0 / Sphero SPRK Edition (Bluetooth Classic generation)
  manufacturer: Orbotix / Sphero Inc. (active, edu-only pivot; classic line legacy, apps delisted)
  category: toy_robot
  safety_class: NONE

transport:
  type: bluetooth_classic
  local_only: true

bluetooth_classic:
  profile: SPP
  spp_uuid: "00001101-0000-1000-8000-00805f9b34fb"  # confirmed in com.orbotix.spherocam DEX (DeviceConnection.java)
  rfcomm_channel: 1
  pairing: legacy SSP; bluez connects directly over RFCOMM
  advertising_name_pattern: "Sphero-XXX"  # 3-letter color code suffix

protocol:
  note: >
    Vendor-published "Sphero API" (Orbotix developer docs, e.g. Sphero_API_1.20.pdf).
    Command packet: SOP1=0xFF, SOP2 (0xFF=answer requested / 0xFE=fire-and-forget),
    DID, CID, SEQ, DLEN, data, CHK. CHK = ~(sum(DID..last data byte)) & 0xFF.
    Response: SOP1=0xFF, SOP2=0xFF, MSRP, SEQ, DLEN, data, CHK.
  device_ids:
    core: "0x00"        # ping 0x01, getVersion 0x02, setBluetoothName 0x10, getBluetoothInfo 0x11
    bootloader: "0x01"  # bootloader spec never public; see pwnall/sphero-notes
    sphero: "0x02"      # setHeading 0x01, setRGB 0x20, roll 0x30, raw motors, sensor streaming, orbBasic/macros
  references:
    - github.com/slock83/sphero-linux-api   # C++/bluez client; README preserves vendor doc S3 links
    - github.com/pwnall/sphero-notes        # decompiled-app notes, firmware/bootloader RE
    - github.com/saphero/sphero-hack        # dashboard; lists 1.0/2.0/SPRK as Bluetooth Classic
    - mmwise.github.io/sphero_ros/api.html  # ROS wrapper; packet field reference

status:
  apk_acquired: true            # com.orbotix.spherocam 1.2.1 (21)
  apk_decompiled: true          # jadx triage; SPP UUID confirmed
  uuids_recovered: true
  protocol_recovered: true      # vendor-published + community SDKs
  hci_snoop_needed: false
  cloud_dependency: none
  related_packages_not_fetched: [com.orbotix.sphero, com.orbotix.macro, com.orbotix.drawndrive]  # delisted, empty on APKPure 2026-08
