# Garadget — Device Spec (research note)
# Company ACTIVE (garadget.com reachable 2026-08-07). Local path: on-device
# MQTT mode (firmware >= 1.20), configured via SoftAP web UI; firmware is
# open source (github.com/Garadget/firmware).
# APK: com.garadget.android v2.0.6 (vc 15), apkeep/APKPure 2026-08-07
# XAPK SHA-256: 3e11a25eff77db317d2162803c537e39905333899c6a59ef4365a545a5fd0abc

device:
  id: garadget
  name: Garadget WiFi Garage Door Controller
  manufacturer: Garadget (US)
  category: garage_door_controller
  safety_class: MEDIUM  # relay actuates a heavy moving door; host opener's safety sensors still apply

transport:
  type: wifi
  local_only: true  # MQTT mode runs with Particle cloud disabled (mqon bit0 off, bit1 on)
  note: >
    Particle Photon P1 hardware. Stock firmware uses Particle cloud
    (variables doorStatus/doorConfig, function setState, events state/alert).
    Firmware >= 1.20 adds local MQTT; WiFi + broker configured through the
    device SoftAP web UI at http://192.168.0.1/ (PHOTON-XXXX AP, listening
    mode = hold M button ~3s, dark blue LED). No cloud account needed on the
    MQTT path; only legacy firmware updates may need one Particle OTA.

lan:
  discovery:
    ap_mode: PHOTON-XXXX SSID; config UI on 192.168.0.1
  mqtt:
    broker: user-supplied (IP + port set in SoftAP UI)
    topic_prefix: "garadget/<device-name>/"
    subscribe:
      command: payloads open|close|stop|get-status|get-config|reboot
      set-config: "pipe-delimited pairs e.g. srr=5|rlp=1000 (63 char limit)"
    publish:
      status: "status=closed|time=...|sensor=0-100|signal=dB (retained)"
      config: full doorConfig pipe string
      alert: 'JSON {"name","type","data"} (state/timeout/night/config)'
      LWT: Online / Offline (retained)
  door_states: [closed, open, closing, opening, stopped]

protocol:
  note: >
    Wire protocol transcribed from vendor firmware source
    (src/nodes/node-mqtt.cpp, README.md). Config fields: ver, rdt (scan ms),
    mtt (move time ms), rlt (relay press ms), rlp (press delay ms), srr, srt
    (reflection threshold), aev (alert bitmap), aot (open-timeout s),
    ans/ane (night window), tzo, nme, mqon/mqip/mqpt/mqto.
  commands:
    open: publish "open" to garadget/<name>/command
    close: publish "close" to garadget/<name>/command
    stop: publish "stop" to garadget/<name>/command
    get_status: publish "get-status" to garadget/<name>/command

status:
  apk_acquired: true      # com.garadget.android v2.0.6 XAPK, sha256 above
  apk_decompiled: false   # not needed — firmware source is public
  uuids_recovered: false  # n/a — WiFi/MQTT, not BLE
  protocol_recovered: true  # from vendor open-source firmware
  hci_snoop_needed: false
  cloud_dead: false
  rating: confirmed
  references:
    - github.com/Garadget/firmware (node-mqtt.cpp, README protocol docs)
    - vcloudinfo.com/2020/07/how-to-configure-garadget-for-local-mqtt-only.html (2020-07-17)
    - community.garadget.com/t/api-without-internet-cloud/7346 (2020-04-30)
