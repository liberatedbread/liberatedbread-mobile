# TrackR bravo/pixel BLE tracker — Device Research Note (structured)
# APK: com.phonehalo.itemtracker via apkeep (apk-pure, 2026-08-03)
# APK SHA-256: f3d67324150f1d89dcb57197a654586d812663ba5ef6b964818c6b565b4960ee
# UUIDs recovered from DEX strings (classes.dex/classes2.dex), not full decompile

device:
  id: trackr-ble-tracker
  name: TrackR bravo / TrackR pixel (BLE item tracker)
  manufacturer: TrackR, Inc. (formerly Phone Halo, later Adero — defunct 2021)
  category: ble_tracker_button
  safety_class: LOW

transport:
  type: ble
  local_only: true
  cloud_note: >
    Crowd-GPS finding network died with the company (service ended 2021-08-15),
    but ring/link-loss/battery all operate on the direct BLE link.

ble:
  advertising:
    name_patterns: []  # TBD — scan-filter device name not yet extracted;
                       # candidates: "TrackR bravo", "TrackR pixel"
    service_uuids: []  # TBD — likely 0x1802/0x1803 in adv or scan response

  services:
    - uuid: "00001802-0000-1000-8000-00805f9b34fb"
      name: immediate_alert
      description: Standard Immediate Alert — the ringer
      characteristics:
        - uuid: "00002a06-0000-1000-8000-00805f9b34fb"
          name: alert_level
          description: write 0x01 (mild) / 0x02 (high) to ring, 0x00 to stop
          properties: [write_no_response]
    - uuid: "00001803-0000-1000-8000-00805f9b34fb"
      name: link_loss
      description: Standard Link Loss service (separation alerts)
    - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
      name: battery_service
      characteristics:
        - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
          name: battery_level
          properties: [read]
    - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
      name: device_information
      characteristics:
        - uuid: "00002a26-0000-1000-8000-00805f9b34fb"
          name: firmware_revision

  observed_strings_evidence:
    - "00001802-0000-1000-8000-00805f9b34fb / 00002a06 (Immediate Alert, Alert Level)"
    - "00001803 (Link Loss); 0000180F/00002A19 (Battery); 0000180A/00002a26 (DevInfo/FwRev); 00002A05 (Service Changed)"
    - "log strings: 'Immediate alarm START request received', 'Immediate Alert Level Characteristic is not found'"

protocol:
  note: >
    Standard GATT profiles only — no vendor crypto observed in string triage.
    Ring = write Alert Level on 2A06. Button-press (reverse find-my-phone)
    event characteristic not yet identified; may be HID-over-GATT or a custom
    characteristic — needs one jadx pass on com.thetrackr.ble or an HCI capture.
  commands:
    ring: write 0x01|0x02 -> 00002a06-0000-1000-8000-00805f9b34fb
    ring_stop: write 0x00 -> 00002a06-0000-1000-8000-00805f9b34fb
    battery_read: read 00002a19-0000-1000-8000-00805f9b34fb

status:
  apk_acquired: true
  apk_decompiled: false  # DEX strings triage only; full jadx not needed yet
  uuids_recovered: true  # standard-profile UUIDs confirmed in binary
  protocol_recovered: false  # ring path clear; button-event path unknown
  hci_snoop_needed: true   # to identify button-press notify characteristic + adv name
  references:
    - diystuff.nl/embedded/trackr-bravo-teardown/
    - github.com/lesleyxyz/node-tile  # analogous (Tile, not TrackR) ring-via-BLE client
