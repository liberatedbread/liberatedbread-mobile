# DTS Play-Fi (Phorus) speakers — Device Spec (research note)
# Closed Xperi platform (Polk, Definitive Technology, Klipsch Stream, SVS,
# Onkyo/Pioneer, Paradigm, MartinLogan, McIntosh, Philips...). Legacy devices
# losing cloud features (Spotify Connect broken on Phorus-era firmware, 2025).
# Local UPnP/DLNA control confirmed; proprietary TLS app protocol un-RE'd.

device:
  id: dts-play-fi
  name: DTS Play-Fi speakers/soundbars (Phorus PS1/PR1, Polk, Def Tech, Klipsch, SVS, et al.)
  manufacturer: DTS Play-Fi (Xperi) platform; many retail brands, some defunct
  category: network_speaker
  safety_class: LOW

transport:
  type: wifi
  local_only: true
  note: >
    Two layers. (1) UPnP/DLNA renderer — open, unauthenticated, confirmed in
    use (AirConnect). (2) Proprietary TLS control channel used by the
    official app — undocumented; no public third-party client exists.

lan:
  discovery:
    - ssdp: upnp MediaRenderer
    - udp_broadcast: app "announce pulses"; app listens TCP 10108 for ANNOUNCEMENT_RESPONSE_FROM_GATEWAY
  control:
    - protocol: upnp-avtransport   # CONFIRMED: play/pause/volume/URI streaming
      auth: none
    - protocol: tls                # HYPOTHESIS: app control channel
      port: unknown                # not in dex strings; likely native lib constant
      evidence: >
        connectSSLSocket(ip, PORT) + sendSSLCommand(...) in com.dts.playfi
        8.7.1.1491; native libphsslsocket.so; commands VOLUME_CHANGE_REQUEST,
        METADATA_UPDATE_REQUEST, PAUSE_THE_AUDIO_REQUEST,
        SWITCH_INPUT_CHANNEL_REQUEST, TRACK_DATA_ACK

protocol:
  note: >
    Spec the UPnP surface now; the TLS channel needs jadx of connectSSLSocket
    call sites plus one LAN capture to pin port, framing, and TLS trust model.
  commands:
    play_pause_volume: "UPnP AVTransport/RenderingControl (confirmed)"
    uri_stream: "UPnP SetAVTransportURI (confirmed; flac support firmware-dependent)"
    app_commands_unimplemented: "VOLUME_CHANGE_REQUEST / PAUSE_THE_AUDIO_REQUEST / SWITCH_INPUT_CHANNEL_REQUEST (names only, from APK)"

status:
  apk_acquired: true     # com.dts.playfi 8.7.1.1491, APKPure XAPK
  apk_sha256: 86592f5e82b4f6b379c2650bbbb22af23449de68cf269cd798a93bf338020a78
  apk_decompiled: false  # strings-level triage only; jadx follow-up queued
  uuids_recovered: false # n/a — no BLE
  protocol_recovered: partial  # UPnP confirmed; TLS channel names-only
  hci_snoop_needed: false
  cloud_dead: mixed      # platform active; legacy-device cloud features dying (Spotify 2025)
  rating: hypothesis     # for the proprietary channel; UPnP path is confirmed
  references:
    - github.com/philippe44/AirConnect (issue #178)
    - community.spotify.com Play-Fi/Phorus thread (2025-07-22)
    - play-fi.com (platform, active)
