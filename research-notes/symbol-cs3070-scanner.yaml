# Motorola/Symbol CS3070 (CS3000 series) — Device Spec
# No companion app — configuration via printed config barcodes (Zebra PRG)
# EOL product line; vendor-hosted PRG is the authoritative protocol reference

device:
  id: symbol-cs3070-scanner
  name: Motorola Symbol CS3070 batch/Bluetooth 1D laser scanner (CS3000 series)
  manufacturer: Zebra Technologies (Symbol/Motorola lineage)
  category: barcode_scanner
  safety_class: LOW  # Class 2 laser; no actuation

transport:
  type: bluetooth_classic
  local_only: true
  profiles: [SPP, HID]  # HID = keyboard wedge (iOS-compatible); SPP = ASCII stream
  fallback: usb_batch   # 512 MB flash; barcodefile.txt over USB mass storage/CDC

bluetooth_classic:
  spp_uuid: "00001101-0000-1000-8000-00805f9b34fb"  # expected standard; confirm on pairing
  pairing:
    method: scan config barcode from PRG, then pair from host
    pin_protected: configurable via config barcodes
  modes:
    - hid_keyboard_wedge  # default; works with any host incl. iOS
    - spp_serial          # "Bluetooth Serial Port" config barcode; ASCII stream

protocol:
  note: >
    No proprietary protocol: in HID mode the scanner emits keystrokes with
    programmable prefix/suffix; in SPP mode it streams each scan as ASCII over
    the RFCOMM channel. Every parameter (symbologies, beeper, BT mode, PIN,
    terminators) is set by scanning configuration barcodes printed in the
    Zebra CS3000 Series Product Reference Guide — the PRG is the protocol spec.
  data_format: ascii_barcode_plus_terminator  # terminator configurable via PRG barcodes

status:
  apk_acquired: false   # no mobile app ever existed
  apk_decompiled: false
  uuids_recovered: false  # standard SPP/HID; SPP UUID to confirm live
  protocol_recovered: true  # fully documented in vendor PRG (public PDF)
  hci_snoop_needed: false
  product_status: end_of_life  # superseded by CS4070; PRG still hosted by Zebra
  cloud_dependency: none
  reference: >
    zebra.com CS3000 Series Product Reference Guide (cs3070-prg-en.pdf);
    tewarid.github.io CS3070-on-PC notes (2012)
