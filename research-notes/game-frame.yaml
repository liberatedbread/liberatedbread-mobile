# LEDSEQ Game Frame (Wi-Fi Adapter) — Device Spec (research note)
# Vendor (LEDSEQ) alive; local web UI documented; firmware source published

device:
  id: game-frame
  name: LEDSEQ Game Frame with Wi-Fi Adapter (16x16 pixel art display)
  manufacturer: LEDSEQ — active as of 2026-08-07
  category: art_display
  safety_class: LOW

transport:
  type: wifi
  local_only: true
  note: >
    Wi-Fi Adapter (Particle Photon carrier, replaces Teensy LC) serves a
    local web UI on port 80 covering all functions; device scrolls its IP on
    boot. WiFi creds are a plain-text file on the microSD
    (/00system/wifi/wifi.ini) — no account needed. Particle cloud integration
    is optional.

lan:
  provisioning:
    method: sd-card-file      # /00system/wifi/wifi.ini, or Particle USB setup
  control:
    protocol: http
    port: 80
    auth: none
    interface: built-in web page ("control every aspect" per vendor docs)
    raw_routes: TBD           # transcribe from published firmware source

protocol:
  note: >
    Function model documented by vendor (Command/Next/Power/Play/Alert/
    Brightness/Color/clockface/timezone/playback/display/cycle/reboot).
    Vendor documents cloud invocation via Particle API; the same functions
    back the local web page. Local wire format to be transcribed from the
    open firmware (and savvasdalkitsis/gameframe Android app source).
  commands:
    power: on|off|toggle
    play: folder name (8.3) from microSD
    alert: folder name; one-shot overlay then resume
    brightness: 0-7
    color: '"#RRGGBB" or random'
    display_mode: 0=gallery 1=clock 2=effects
    playback: 0=sequential 1=shuffle 2=pause
    cycle: 1-8 (10s .. infinity)
    reboot: immediate

status:
  apk_acquired: false     # no vendor app; third-party app is open source
  apk_decompiled: false
  uuids_recovered: false  # n/a — WiFi device
  protocol_recovered: true   # web UI vendor-documented; raw routes pending transcription
  hci_snoop_needed: false
  cloud_dead: false
  rating: confirmed          # local web UI vendor-documented; route-level spec = hypothesis until transcribed
  references:
    - ledseq.com/game-frame-wi-fi-adapter-documentation/ (2016-10-23)
    - github.com/savvasdalkitsis/gameframe (third-party Android client source)
