# Xiaomi Mijia kitchen appliances (miio LAN protocol) — research note
# Rice cookers (chunmi.cooker.*) + Mi Smart Air Fryer (careli.fryer.maf*).
# Manufacturer ACTIVE. Local control confirmed via python-miio; one-time
# token extraction may need Mi Home cloud credentials.

device:
  id: xiaomi-mijia-kitchen
  name: Xiaomi Mijia IH rice cookers + Mi Smart Air Fryer family
  manufacturer: Xiaomi / Chunmi / Careli (ecosystem OEMs)
  category: kitchen_appliance
  safety_class: MEDIUM  # unattended heating; device enforces own limits

transport:
  type: wifi
  local_only: true
  note: >
    miio protocol: UDP 54321, AES-128-CBC encrypted JSON, 16-byte device
    token. Discovery via broadcast hello handshake (0x2131 magic). Runtime
    is fully local; token acquisition typically needs the Mi Home cloud once.

lan:
  control:
    protocol: miio (udp)
    port: 54321
    encryption: AES-128-CBC with per-device token (32 hex chars)
    discovery: broadcast handshake on 54321
  auth:
    token_required: true
    one_time_cloud_step: >
      Token extraction via Xiaomi-cloud-tokens-extractor (Mi Home account),
      Android backup (miio-extract-tokens), or (older fw) pre-registration
      handshake. Re-pairing/firmware updates can rotate the token.

protocol:
  note: >
    Legacy miio JSON-RPC (method/params) for chunmi.cooker.* and
    careli.fryer.maf*; newer models use MIoT-spec get/set_properties over
    the same transport. Implemented in python-miio (Cooker, AirFryer),
    openHAB miio binding, HA xiaomi_miio + xiaomi_miot custom components.
  models:
    rice_cookers: [chunmi.cooker.normal1, chunmi.cooker.normal2, chunmi.cooker.normal3,
                   chunmi.cooker.normal4, chunmi.cooker.normal5,
                   chunmi.cooker.press1, chunmi.cooker.press2]
    air_fryers: [careli.fryer.maf01, careli.fryer.maf02, careli.fryer.maf03,
                 careli.fryer.maf10a]   # 3.5L/4L/6.5L Mi Smart Air Fryer
  commands:
    rice_cooker:
      get_status: menu/program, stage, phase, temp, remaining time (python-miio Cooker)
      start_cook: program id + duration + auto keep-warm
      cancel_cook: implemented
    air_fryer:
      get_status: mode, target time/temp, remaining (python-miio AirFryer)
      set_target: time + temp
      start_pause_cancel: implemented

status:
  apk_acquired: false    # not needed (protocol covered by python-miio);
                         # com.xiaomi.smarthome XAPK already in workspace from prior swarm
  apk_decompiled: false
  uuids_recovered: false # n/a — WiFi/miio
  protocol_recovered: true
  hci_snoop_needed: false
  cloud_dead: false
  rating: confirmed
  open_questions:
    - per-model menu/program ID tables beyond chunmi.cooker.normal2
    - legacy-miio vs MIoT-spec census for newer models
  references:
    - github.com/rytilahti/python-miio (Cooker: miio.integrations.chunmi.cooker; AirFryer: miio.integrations.careli.fryer)
    - v50.openhab.org/addons/bindings/miio/ (device/model table)
    - github.com/openhab/openhab-addons/issues/18258 (maf10a, 2025-02)
    - github.com/PiotrMachowski/Xiaomi-cloud-tokens-extractor
    - home-assistant.io/integrations/xiaomi_miio/ (local_polling)
