# Eufy RoboVac Tuya-based WiFi models — Device Spec (research note)
# Local Tuya LAN protocol (TCP 6668/6667, AES-128-ECB, DPS commands).
# Local key is cloud-issued at pairing — one-time Eufy account required,
# no account-free extraction known. WAN blockable after key capture.

device:
  id: eufy-robovac-tuya-local
  name: Eufy RoboVac 15C MAX (T2128), G10/G30 Hybrid, G32, X8/X8 Hybrid, L35/LR30 Hybrid
  manufacturer: Anker Eufy — active brand
  category: robot_vacuum
  safety_class: LOW

transport:
  type: wifi
  local_only: true   # after one-time cloud key fetch
  note: >
    RoboVacs are Tuya-platform devices bound to the EufyHome cloud. Local
    control is the Tuya LAN protocol; device ID + 16-byte local key are
    obtained once from the Eufy cloud using account credentials (handled by
    the HA integration config flow), then operation is LAN-only.

lan:
  discovery:
    method: udp_broadcast   # Tuya UDP discovery 6666/6667
  control:
    protocol: tuya-lan
    ports: [6668, 6667]     # TCP; 3.3 (AES-128-ECB, versioned frames) / legacy 3.1
    auth: device_id + 16-byte local_key (cloud-issued at pairing)
    reference: github.com/CodeFoodPixels/robovac (HACS); python-eufy-robovac

protocol:
  note: >
    Tuya DPS model: play/pause/dock, fan speed, BoostIQ, direction pad,
    battery/error status mapped to numbered datapoints. DPS dump visible in
    the CodeFoodPixels integration attributes; X8 confirmed fully local
    (whizzy.org 2026-05-16). X10 Pro Omni generation reportedly moved off
    this scheme — unsupported pending RE.
  commands:
    start_pause: DPS power/play-pause
    dock: DPS charge/go-home
    fan_speed: DPS enum
    direction_pad: DPS manual control (G30+ / X8)

status:
  apk_acquired: true    # com.eufylife.smarthome 3.18.1 (1031) XAPK via apkeep 2026-08-07
  apk_sha256: 22c253dfa810b813aa8c06bf1ce138015e26613f2c1f9ae9e84646f8304c1ac9
  apk_decompiled: false
  protocol_recovered: true
  rating: confirmed       # G10/G30/X8 generation
  rating_caveat: X10 Pro Omni and newer likely not locally controllable (protocol change)
  cloud_dead: false
  cloud_bootstrap: required   # one-time Eufy account for local key; no account-free path
  references:
    - github.com/CodeFoodPixels/robovac
    - whizzy.org/2026-05-16-eufy-x8-home-assistant/ (2026-05-16)
    - maxdiamond.co.uk/blog/hacking-my-eufy-robot-vac (2025-03-10)
    - community.home-assistant.io X10 Pro thread (2025-04; local control not available)
