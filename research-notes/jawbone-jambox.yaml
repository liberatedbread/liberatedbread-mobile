# Jawbone Jambox family — Device Spec (research draft)
# Sources: static analysis of com.jawbone.companion v2.5.13 (jadx, apk-pure via apkeep)
# APK SHA-256: 7dda1109ff4af871e21a3c64e325857e0eafedf353ff637d62e6cb552eed20d5
# Company: Jawbone liquidated July 2017; MyTALK cloud dead; jawbone.com offline

device:
  id: jawbone-jambox
  name: Jawbone Jambox / Big Jambox / Mini Jambox (Bluetooth speakers)
  manufacturer: Jawbone (AliphCom) — LIQUIDATED 2017-07
  category: audio_speaker
  safety_class: LOW
  rating: confirmed

transport:
  type: bluetooth_classic
  local_only: true
  cloud_dependency: none_for_protocol
  cloud_caveat: >
    Official app shows login-on-first-use (Jawbone account, servers dead).
    The SPP/JCI protocol itself is unauthenticated; a third-party client
    needs no cloud. USB firmware update path fully local via archived
    Jawbone Updater + JBZ/DFU files (robertianhawdon.me.uk/jambox/).

bluetooth_classic:
  chipset: CSR BC03/BC05/BC07 family
  profiles: [a2dp_sink, hfp, avrcp, spp]
  spp_uuids:
    - uuid: "00001101-0000-1000-8000-00805f9b34fb"  # standard SPP
      role: control_channel
    - uuid: "0000111e-0000-1000-8000-00805f9b34fb"  # HFP, referenced by app
      role: telephony
  notes: Mini Jambox is BT 4.0 (A2DP 1.2, HFP 1.6); control still via SPP.

protocol:
  name: JCI (Jawbone Control Interface)
  source_package: com.jawbone.jci
  framing:
    header_bytes: 6
    total_bytes: "(size * 2) + 6"
    fields:
      byte0_signature: 0xA0
      byte1_cmd: command id
      bytes2_3_tag: 16-bit client tag (counter, starts at -275 / 0xFEE5)
      byte4_attr: attribute flags (0x00 typical)
      byte5_size: payload size in 16-bit words
    response_fields: [tag, cmd, result_code, attr, size, payload]
  commands:
    1: GetHeadsetVersion
    2: ReadPSKey
    3: WritePSKey
    5: PostMessage
    6: CancelMessage
    7: RegisterNotification
    8: CancelNotification
    10: EventNotification
    12: ResetHeadsetJCI
    13: ReadHeadsetInternalData
    16: ChangeHeadsetFriendlyName
    17: ConfigureLED
    18: Authentication   # usage semantics TBD
    19: PlayTone
    20: PlayPrompt
    25: ReadFile
    27: SetLocator
    28: SetCustomEQ
  result_codes: {0: Success, 1: UnrecognizedCommand, 2: InvalidParameter, 3: DynamicMemoryAllocationFails, 4: CommandPayloadLenMismatch, 9: PSKeyWriteFailure, 16: TooManyNotifications, 21: RegTableDoesntExist, 22: NativeCommandTooLong, 23: DSPnotStarted, 24: UnsupportedStreamModeCommand, 25: NotImplemented}
  features_exposed: [live_audio_toggle, voice_announcements, voice_caller_id, taptap_mode, shakeshake_mode, multishake_mode, paired_device_priority_list, custom_eq, friendly_name]

firmware:
  local_update_path: confirmed
  tools: Jawbone Updater 2.2.5 (Win/Mac) + 1.6.2 recovery (Win), community-archived
  files: JBZ/DFU per-model firmware, final versions archived with md5sums
  source: https://robertianhawdon.me.uk/jambox/
  brick_risk: use md5-verified files; 1.6.2 updater for bricked units

status:
  apk_acquired: true          # com.jawbone.companion v2.5.13 from apk-pure
  apk_decompiled: true        # jadx, unobfuscated
  uuids_recovered: true       # standard SPP 00001101
  protocol_recovered: true    # JCI framing + command table from DEX
  community_re: true          # firmware/update path; JCI protocol RE appears greenfield
  hci_snoop_needed: false     # nice-to-have for response schemas / Authentication semantics
  live_device_validation: false
  open_questions:
    - login gate enforcement in app (bypassable? irrelevant for 3rd-party client)
    - Authentication(18) payload semantics
    - Mini Jambox BLE control surface (if any)
