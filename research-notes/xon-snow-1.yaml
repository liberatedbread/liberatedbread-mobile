device:
  id: xon-snow-1
  name: Cerevo XON SNOW-1 smart snowboard bindings
  manufacturer: Cerevo Inc. (Tokyo) — company ACTIVE; product discontinued
  category: sports_sensor
  safety_class: LOW  # sports metrics + LED feedback only

cloud_status: not_required  # app is a pure local BLE client; no account, no cloud calls seen
