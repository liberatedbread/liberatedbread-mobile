    name_patterns: ["SNOW-1_L", "SNOW-1_R"]  # left/right bindings advertise separately (PairingActivity.java)
    service_uuids: []
  services:
    - uuid: "58952982-3C22-4A8C-B826-5F50EB52F1FB"
      name: xon_service
      description: XON primary service (from BluetoothLeService.java)
      characteristics:
        - uuid: "58952982-3C22-4A8C-B826-5F50EB52F1FC"
          name: data_ch1
          properties: [notify]
        - uuid: "58952982-3C22-4A8C-B826-5F50EB52F1FE"
          name: data_ch2
          properties: [notify]
        - uuid: "58952982-3C22-4A8C-B826-5F50EB52F1FF"
          name: data_ch3
          properties: [notify]
        - uuid: "58952982-3C22-4A8C-B826-5F50EB52F202"
          name: data_ch4
          properties: [notify]
        - uuid: "58952982-3C22-4A8C-B826-5F50EB52F203"
