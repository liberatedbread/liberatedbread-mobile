          properties: [notify]
        - uuid: "58952982-3C22-4A8C-B826-5F50EB52F201"
          name: time_sync
          description: App writes epoch seconds on connect
          properties: [write]
  standard_services:
    - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
      name: battery_service
      note: 0x2A19 battery level notifications handled
    - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
      name: device_information
      note: 0x2A28 SW revision referenced

protocol:
  note: >
    Five notify channels on the XON service plausibly carry the 13-point
    sensor set (4 load sensors/foot, 2 flex sensors, 9-axis IMU); exact
    channel-to-sensor mapping TBD (app partially obfuscated but small).
    Time sync = epoch-seconds write to F201 after service discovery.
    No OTA path and no auth seen — nothing cloud-gated.
  expected_measurements:
    - load_balance_per_foot (4 sensors)
    - board_flex (head/tail)
    - imu_accel_gyro_mag
    - led_feedback_control
  commands:
    time_sync: "write epoch seconds to ...F201"
    led_control: TBD

