# Lattis Ellipse — structured research note (2026-11-01)

device:
  id: lattis-ellipse
  name: Lattis Ellipse Smart Bike Lock
  manufacturer: Lattis (consumer product abandoned; B2B fleet platform remains)
  category: bike_lock

transport:
  type: ble
  local_after_provisioning: true
  advertised_security_service: "d3995e00-fa57-11e4-ae59-0002a5d5c51b"

session_v2:
  signed_message: server-issued and cached; no self-provisioning established
  challenge_key: "lowercase MD5(user id), padded with ASCII f to 64 hex characters"
  challenge_result: "SHA-256 over hex-decoded challenge-key + uppercase-hex challenge"
  correction: MD5/SHA-256, not AES

controls:
  lock: "d3995e42: 00 unlock, 01 lock, ff delayed, ff 00 cancel-delay"
  info: "d3995e43: u16le voltage/raw, s8 temperature/raw, s8 RSSI, position byte"
  touchpad: "d3995e84: PIN padded with ASCII 0 to 16 characters, then hex-decoded to 8 bytes"
  firmware: "d01-d04 resolve through configuration service e80; separate d3995d00 not established"

status:
  static_analysis: complete for the V2 map
  hardware_capture: needed
  validated_spec: null
  open_questions:
    - Owner record export format and one successful session capture
    - Whether touchpad writes work before owner authentication
    - Fresh provisioning without the account backend
