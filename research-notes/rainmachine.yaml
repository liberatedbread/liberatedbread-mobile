# RainMachine Mini 8 / Touch HD / Pro — Device Spec (research note)
# Company quiet since ~2022 but claims in-business; local REST API is self-contained.

device:
  id: rainmachine
  name: RainMachine Mini 8, Touch HD-12/16, Pro-8/16 (2nd gen, 2015+)
  manufacturer: Green Electronics LLC (RainMachine) — quiet but alive 2026-08
  category: irrigation_controller
  safety_class: LOW  # solenoid valves; worst case overwatering

transport:
  type: wifi
  local_only: true
  note: >
    Vendor-documented REST API on the device. Cloud account optional;
    on-device scheduling keeps working without internet.

lan:
  discovery:
    protocol: none_needed   # static IP or DHCP reservation; HA config takes host
  control:
    protocol: https
    port: 8080              # self-signed cert
    alt: http port 18080 (local network only)
    auth: >
      POST /api/4/auth/login with device password -> access_token;
      token on subsequent requests. Password set locally on device.
    api_version: /api/4

protocol:
  note: >
    Full vendor-published REST API: programs, zones, history, weather
    parsers, restrictions, flow meter, system config.
  commands:
    login: POST /api/4/auth/login
    program_start: POST /api/4/program/{id}/start
    zone_start: POST /api/4/zone/{id}/start
    zone_stop: POST /api/4/zone/{id}/stop
    zone_status: GET /api/4/zone
    watering_log: GET /api/4/watering/log

status:
  apk_acquired: false   # not needed — vendor API docs
  apk_decompiled: false
  uuids_recovered: false  # n/a — no BLE
  protocol_recovered: true
  hci_snoop_needed: false
  cloud_dead: false       # company quiet but site live; local API independent of cloud
  confidence: confirmed   # HA core integration rainmachine = local_polling
  references:
    - support.rainmachine.com/hc/en-us/articles/228022248-Controlling-RainMachine-through-REST-API
    - home-assistant.io/integrations/rainmachine
    - support.rainmachine.com/hc/en-us/community/posts/6625420556055 (2022-06-08)
