# eGauge EG3000 / EG4xxx — Device Spec (research note)
# Manufacturer ACTIVE (eGauge Systems, Boulder CO); local-first: no subscription, no mandatory cloud
# Local path: JSON WebAPI + legacy XML API + Modbus TCP, all served by the meter on the LAN

device:
  id: egauge-meter
  name: eGauge EG3000 series / EG4xxx (EG4115 Core, EG4015 Pro)
  manufacturer: eGauge Systems LLC — active
  category: energy_monitor
  safety_class: MEDIUM  # panel install: CTs + direct mains voltage taps; measurement-only

transport:
  type: wifi-lan        # Ethernet primary; WiFi via supported USB adapters on some models
  local_only: true
  note: >
    All data resides on the meter; web UI and APIs are LAN-served. The
    eGauge.net service is an optional remote-access proxy only — block WAN and
    nothing local changes.

lan:
  discovery:
    method: dhcp-scan  # hostname egauge / egauge<serial> typical; no documented mDNS
  control:
    json_webapi:
      protocol: http
      endpoints: /api/registers?rate, /api/register, /api/auth
      auth: HTTP Digest (local users, e.g. "owner")
    xml_api:
      protocol: http
      endpoints: "/cgi-bin/egauge?tot&inst"
      auth: none in default access mode
    modbus:
      protocol: modbus-tcp
      port: 502
      note: firmware-dependent option; BACnet/IP on some models

protocol:
  note: >
    Vendor-documented (webapi.egauge.net; KB "eGauge Meter Communication").
    Registers carry cumulative watt-seconds (signed, grid direction) with
    instantaneous W on ?rate queries; virtual/formula registers compute net
    and per-circuit values. XML API returns one <data> doc with per-register
    <r> entries.
  endpoints:
    instantaneous: "GET /api/registers?rate"
    historical: "GET /api/register?time=<window>"
    legacy_xml: "GET /cgi-bin/egauge?tot&inst"

status:
  apk_acquired: false    # n/a — no mobile app needed
  apk_decompiled: false
  uuids_recovered: false # n/a — no BLE
  protocol_recovered: true   # vendor-documented
  rating: confirmed
  cloud_dead: false      # never required; manufacturer active
  references:
    - webapi.egauge.net (JSON WebAPI reference)
    - kb.egauge.net/books/egauge-meter-communication (XML API, Modbus, firmware notes)
    - home-assistant.io/integrations/egauge (local_polling)
