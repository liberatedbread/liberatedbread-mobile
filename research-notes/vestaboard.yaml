# Vestaboard — Device Spec (research note)
# Company alive (2026); official documented Local API, port 7000

device:
  id: vestaboard
  name: Vestaboard (and Vestaboard Note) split-flap display
  manufacturer: Vestaboard Inc. — alive as of 2026-08-07
  category: ambient_display
  safety_class: LOW   # mechanical flaps; no hazard beyond noise

transport:
  type: wifi
  local_only: true
  note: >
    Official Local API. One-time cloud step: board must be paired, online and
    firmware-current to receive an enablement token; a single local POST then
    returns a permanent local API key. Vendor documents firewalling the board
    off from cloud after enablement. Firmware updates still require cloud.

lan:
  discovery:
    mdns: vestaboard.local   # IPv4 required per vendor; IPv6 unreliable
  control:
    protocol: http
    port: 7000
    auth: header X-Vestaboard-Local-Api-Key
    endpoints:
      - POST /local-api/enable    # one-time; body = enablement token -> returns apiKey
      - POST /local-api/message   # write: JSON array of 132 character codes
      - GET  /local-api/message   # read currently displayed message

protocol:
  note: >
    Vendor-documented at docs.vestaboard.com (Local API). Message payload is a
    6x22 grid as a flat array of 132 integer character codes (0 blank,
    1-26 A-Z, 27-36 digits, 60s = punctuation/colored tiles — transcribe full
    table from vendor docs during spec work).
  commands:
    write_message: POST /local-api/message
    read_message: GET /local-api/message
    enable_local_api: POST /local-api/enable

status:
  apk_acquired: false     # not needed — vendor-documented
  apk_decompiled: false
  uuids_recovered: false  # n/a — no BLE
  protocol_recovered: true
  hci_snoop_needed: false
  cloud_dead: false
  cloud_dependency: one-time enablement token requires cloud account + paired board
  rating: confirmed       # vendor-documented
  open_question: does /local-api/enable work without cloud after vendor shutdown
  references:
    - docs.vestaboard.com/docs/local-api/ (introduction, authentication, endpoints)
    - github.com/jparise/vesta (Python LocalClient)
    - github.com/ShaneSutro/Vestaboard (Python, local API since v1.2.0)
    - github.com/DanielBaulig/vestaboard (Home Assistant integration)
