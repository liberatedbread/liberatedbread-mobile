# Dropcam HD/Pro, Nest Cam (1st gen) — DUD note (rejected lead)
# Verified cloud-locked: no local protocol. Service killed 2024-04-08.

device:
  id: dropcam-nest
  name: Dropcam HD / Dropcam Pro / Nest Cam Indoor-Outdoor (1st gen)
  manufacturer: Dropcam -> Nest -> Google (product line terminated)
  category: ip_camera
  safety_class: LOW

transport:
  type: wifi
  local_only: false
  note: >
    REJECTED LEAD. Cameras stream only through the Nest/Google cloud:
    no RTSP, no ONVIF, no local HTTP API, no documented LAN surface.
    Google ended all support 2024-04-08; units are non-functional as
    networked cameras. Only path would be cloud MITM — out of scope.

lan:
  endpoints: none  # verified: no local access (SmartThings community 2016;
                   # nothing changed before the 2024 shutdown)

status:
  apk_acquired: false   # pointless — app has no local protocol to extract
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: false
  cloud_dead: true   # support ended 2024-04-08
  rating: rejected   # dud: cloud-locked, no local path, service dead
  references:
    - it.slashdot.org/story/23/04/07/195217 (2023-04-07, kill date announcement)
    - pcworld.com/article/2597897 (2025-02-10, deactivation recap)
    - lightnowblog.com (2026-02-07, Dropcam cloud ended 2024-04-08)
    - community.smartthings.com/t/52743 (2016-07, no local access)
    - support.starlinghome.io local-streaming doc (2024-07, bridge-only)
