  advertising:
    name_patterns: []  # TBD
    service_uuids: []  # TBD
  services: []

protocol:
  note: >
    Nothing recovered — genuine APK not obtainable from mirrors.
    First step: source com.motiv APK via adb pull from a legacy device or
    archive.org, then map GATT and the activation handshake.

status:
  apk_acquired: false  # apk-pure "com.motiv" hit is an unrelated 2013 stub app
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
