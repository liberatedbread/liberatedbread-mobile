# Motiv Ring — Research Note (structured)

device:
  id: motiv-ring
  name: Motiv Ring (fitness/sleep smart ring)
  manufacturer: Motiv Inc. (acquired by Proxy 2020-04; Proxy acquired by Oura 2023)
  category: smart_jewelry
  safety_class: LOW  # Passive sensing only

abandonment:
  status: abandoned
  evidence:
    - url: https://techcrunch.com/2020/04/27/smart-ring-maker-motiv-acquired-by-digital-identity-company/
      date: "2020-04-27"
      note: Proxy acquires Motiv
    - url: https://www.mobihealthnews.com/news/motiv-shifts-its-smart-rings-health-tracking-biometrics-following-acquisition
      date: "2020-04-29"
      note: Consumer ring sales halted at acquisition
    - url: https://the5krunner.com/2021/02/10/motiv-ring-gone/
      date: "2021-02-10"
      note: Motiv website offline; operation dead
    - url: https://insider.fitt.co/oura-acquires-digital-identity-startup-proxy/
      date: "2023-05-09"
      note: Proxy (incl. Motiv assets) acquired by Oura; consumer infra orphaned

transport:
  type: ble
  local_only: true  # BLE is the only radio; but activation may be cloud-gated (TBD)
  notes: >
    All phone interaction over BLE GATT. Manual states the app is required for
    activation and sync; whether activation needed the (dead) cloud is the key
    open question. No other transport exists.

