# Orvibo S20 (WiWo era) — Device Spec (research note)
# Company alive (Orvibo, Shenzhen); S20 hardware EOL; local UDP protocol unchanged
# Local path: UDP 10000 "hd"-magic binary protocol + UDP 48899 AT provisioning

device:
  id: orvibo-s20
  name: Orvibo S20 / WiWo-S20 Wi-Fi Smart Socket
  manufacturer: Orvibo (Shenzhen) — alive; S20 line EOL, apps moved to HomeMate
  category: smart_plug
  safety_class: LOW  # mains relay; unauthenticated protocol

transport:
  type: wifi
  local_only: true
  note: >
    Discovery, control and even initial Wi-Fi provisioning are all LAN-local.
    No cloud account needed at any point; vendor app optional.

lan:
  discovery:
    method: udp_broadcast
    port: 10000
    magic: "6864"  # "hd" + LE length + command code
  control:
    protocol: udp-binary
    port: 10000
    auth: none
    session: client subscribes (cmd 0x636c) with its own MAC before sending commands
  provisioning:
    method: udp AT commands to HF-LPB100 module
    port: 48899
    sequence: HF-A11ASSISTHREAD broadcast -> "+ok" -> AT+WSSSID / AT+WSKEY

protocol:
  note: >
    All packets: 0x68 0x64 + 2-byte LE length + 2-byte command code + payload.
    Control packets carry the socket MAC (padded with 0x20) and a trailing
    state byte. Documented by stikonas.eu (2015) and python-orvibo.
  commands:
    discover: "68 64 00 06 71 61"  # broadcast
    subscribe: "cmd 0x636c + client MAC padded with 0x20 + reversed MAC"
    power_on: "cmd 0x6463 + socket MAC + 00 00 00 00 01"
    power_off: "cmd 0x6463 + socket MAC + 00 00 00 00 00"

status:
  apk_acquired: false   # not needed — community-documented protocol
  apk_decompiled: false
  protocol_recovered: true   # stikonas.eu 2015; python-orvibo; HA orvibo integration
  rating: confirmed
  cloud_dead: false   # company alive; S20-era WiWo/Livermore apps abandoned
  references:
    - stikonas.eu/wordpress/2015/02/24/reverse-engineering-orvibo-s20-socket/ (2015-02-24)
    - github.com/happyleavesaoc/python-orvibo
    - home-assistant.io orvibo integration (iot_class: local_polling)
