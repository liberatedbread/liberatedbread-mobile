# Cloud-Locked Thermostat Leads — Verified Rejections (2026-08-07)

device:
  id: thermostat-cloud-locked-duds
  name: Nest / Honeywell Home TCC / Netatmo thermostat lines — rejected leads
  manufacturer: Google Nest; Resideo (Honeywell Home); Legrand-Netatmo
  category: thermostat_hvac
  safety_class: MEDIUM

transport:
  type: wifi
  local_only: false
  note: >
    No local-only control path without a cloud account on any of these.
    Documented to prevent re-research; see companion .md for evidence.

rejected:
  - lead: Google Nest (Learning 1/2/3, Thermostat E)
    reason: >
      No local API; Google SDM API is cloud-only (OAuth+Pub/Sub, $5 dev
      fee). Gen 1/2 support ended 2025-10-25. Exception: Nest Thermostat
      (2020) got Matter-over-WiFi OTA 2023-04-18, but commissioning needs
      Google Home app + account — fails no-cloud bar.
  - lead: Honeywell Home Wi-Fi (RTH9580/9585WF, TH9320WF Wi-Fi 9000, RedLINK gateway THM6000R)
    reason: >
      All control via mytotalconnectcomfort.com cloud; HA honeywell
      integration is cloud polling; no documented local endpoint and no
      community local implementation. Exception: T9/T10 and Lyric Round
      have HomeKit (HAP-local basics only).
  - lead: Netatmo Smart Thermostat + valves
    reason: >
      Cloud-only official API (api.netatmo.com); thermostat-relay link is
      proprietary 868 MHz. HomeKit exposes only basic set/read temp and
      still needs a Netatmo account for provisioning; newer Matter
      firmware likewise account-gated.
  - lead: Sensibo Sky/Air; Mitsubishi Kumo Cloud modules
    reason: >
      Cloud-only APIs. Mitsubishi local options are third-party hardware
      mods (ESPHome MHI-AC-Ctrl), not protocol targets.

status:
  rating: dud
  apk_acquired: false
  apk_decompiled: false
  protocol_recovered: false
  cloud_dead: false
  references:
    - karlquinsland.com/venstar-t7850-teardown-review (2022-04-23, Nest no-local)
    - theverge.com/2023/4/18/23687751 (2023-04-18, Nest 2020 Matter OTA)
    - community.hubitat.com/t/152952 (2025-04-25, Nest gen1/2 EOL)
    - home-assistant.io/integrations/honeywell (accessed 2026-08-07)
    - community.home-assistant.io/t/669150 (2024-01-08, Netatmo local via HomeKit basic only)
