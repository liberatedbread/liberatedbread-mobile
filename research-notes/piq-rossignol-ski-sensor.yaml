device:
  id: piq-rossignol-ski-sensor
  name: PIQ Robot multisport sensor (Rossignol and PIQ ski pack)
  manufacturer: PIQ Sport Intelligence (Paris; tech stack under Octonion)
  category: sports_sensor
  safety_class: LOW  # ski performance metrics only; no medical/vehicle function

cloud_status: dead  # piq.com parked/for-sale 2026; app delisted; activation backend unreachable
company:
  fate: defunct (site live through ~2020 per Wayback; domain for sale as of 2026-08-04)
  sources:
    - https://www.designboom.com/technology/rossignol-piq-ski-wearable-tracker-12-14-2015/
    - https://www.electronicspecifier.com/products/wearables/st-technology-powers-piq-multi-sport-wearable-sensor/
    - https://app.dealroom.co/companies/piq_1

transport:
  type: ble
  local_only: true  # GATT schema recovered; BUT stock app requires server activation (see protocol.note)

ble:
  advertising:
    name_patterns: []  # TBD — likely "PIQ"; app scans via custom ScanFilter by firmware flavor
    service_uuids: []  # TBD — HCI snoop / nRF Connect needed
  services:
    - uuid: "01000000-0000-0000-0000-000000000080"
      name: piq_primary_service
      description: PIQ/Octonion primary GATT service (from BleSchema.java)
      characteristics:
        - uuid: "02000000-0000-0000-0000-000000000080"
          name: data_packet_1
          properties: [notify]
        - uuid: "03000000-0000-0000-0000-000000000080"
          name: data_packet_2
          properties: [notify]
        - uuid: "04000000-0000-0000-0000-000000000080"
          name: command_primary
          description: Command channel (primary/master device role)
          properties: [write]
        - uuid: "05000000-0000-0000-0000-000000000080"
          name: fw_image
          description: OTA firmware image transfer
          properties: [write]
        - uuid: "06000000-0000-0000-0000-000000000080"
          name: command_secondary
          description: Command channel (secondary/slave device role)
          properties: [write]

protocol:
  note: >
    Custom Octonion BLE stack (com.octonion.android.common.source.ble).
    Command/data/fw-image channel layout recovered from BleSchema.java.
    Master/slave sensor roles supported (dual-sensor kits). Packet framing
    in PacketFormatter.java; frame format NOT yet decoded.
    WARNING: stock app pairs via server-side activation (ActivationActivity,
    ActivationUtils.ServerActivationErrorCode) using the boxed "connection
    code" — dead cloud means the stock app cannot activate new sensors.
    Local liberation requires a direct-GATT client; whether sensor firmware
    itself gates data on activation is unknown.
  expected_measurements:
    - imu_13axis_raw_or_fused
    - barometric_altitude  # ST LPS25HB onboard
    - derived_ski_metrics (computed in app/cloud: carve angle, G-force, airtime, rotation)
  commands:
    session_start_stop: TBD
    time_sync: TBD  # GlobalToLocalTimeConverter / SensorTimeCorrector classes exist
    ota: TBD  # fwImage characteristic

apk:
  package_id: com.piq.rossignol
  app_name: Rossignol and PIQ
