  sha256: a1628a7b588f8992adb67e65c18c975bc1e535cecdf72d95363dca1034ac156b
  source: apk-pure via apkeep
  sibling_apps:
    - com.piq.babolat.playpop  # Babolat POP tennis — likely same BLE schema

status:
