# Bose SoundTouch family — Device Spec (research note)
# Cloud EOL: servers shut down 2026-05-06 (delayed from 2026-02-18).
# Vendor published the local Web API as a public PDF in Jan 2026 and shipped a
# local-only app mode. Local REST API also community-used for years (HA core).

device:
  id: bose-soundtouch
  name: SoundTouch 10/20/30, SoundTouch 300, SA-5, Wave SoundTouch, Lifestyle 550/600/650
  manufacturer: Bose (line discontinued; cloud EOL 2026-05-06)
  category: network_speaker
  safety_class: LOW

transport:
  type: wifi
  local_only: true

lan:
  discovery:
    - ssdp: "urn:schemas-upnp-org:device:MediaRenderer"
    - mdns: _soundtouch._tcp   # verify against PDF; SSDP is the documented path
  control:
    - protocol: http-rest      # XML request/response bodies
      port: 8090
      auth: none
    - protocol: websocket      # "gabbo" realtime notifications
      port: 8080

protocol:
  note: >
    Vendor-documented (SoundTouch Web API PDF, Jan 2026, 31 pages):
    HTTP endpoints on 8090 plus WebSocket notification protocol on 8080.
    Community had the REST half mapped for years via libsoundtouch /
    HA soundtouch integration.
  endpoints:
    info: "GET /info"
    now_playing: "GET /now_playing"
    volume: "GET/POST /volume"
    sources: "GET /sources ; POST /select"
    key_press: "POST /key (PLAY, PAUSE, NEXT_TRACK, PREV_TRACK, POWER, MUTE, VOLUME_UP, VOLUME_DOWN)"
    presets: "GET /presets"   # cloud-coupled; dies with the service
    zone_grouping: "GET/POST /zone"
    name: "POST /name"
    bass: "GET/POST /bass"

status:
  apk_acquired: false    # not needed — first-party protocol documentation exists
  apk_decompiled: false
  uuids_recovered: false # n/a — no BLE
  protocol_recovered: true
  hci_snoop_needed: false
  cloud_dead: true       # as of 2026-05-06; local API unaffected
  references:
    - assets.bosecreative.com SoundTouch-Web-API.pdf (2026-01-07)
    - hackaday.com/2026/01/09/bose-soundtouch-smart-speakers-get-an-open-source-lifeline/
    - home-assistant.io/integrations/soundtouch (iot_class: local_polling)
    - github.com/captivus/bose-soundtouch
