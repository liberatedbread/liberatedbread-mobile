# Dericam H502W / S1 / M-H series — Device Spec (research note)
# Brand dormant: dericam.com unreachable 2026-08-07. Local RTSP/ONVIF is the
# rescue path — cameras are fully LAN-functional with no vendor services.

device:
  id: dericam
  name: Dericam H502W, S1, M201W-M801W, H201D/H216W IP cameras
  manufacturer: Dericam (brand dormant; Smarteye/Wanscam-family OEM hardware)
  category: ip_camera
  safety_class: LOW  # privacy risk only

transport:
  type: wifi
  local_only: true
  note: >
    Pre-cloud-lock hardware: local web UI, local RTSP (H.264 models) or
    ASF/MJPEG over HTTP (M-series), ONVIF on H502W/S1 and later. Vendor
    disappearance removes nothing for LAN use.

lan:
  discovery:
    - ONVIF WS-Discovery (H502W/S1 and later)
    - static default IP 192.168.1.188 (Wanscam-family fingerprint)
  http_port: 80
  rtsp_port: 554
  default_credentials: admin / admin
  endpoints:
    rtsp_main: rtsp://IP:554/11            # documented in Dericam setup guides
    rtsp_sub: rtsp://IP:554/12             # some firmware
    rtsp_alt: rtsp://IP:554/ch0_0.h264     # H201D/H502/206c per iSpy
    legacy_stream: /videostream.asf?user=U&pwd=P   # M-series MJPEG/ASF
    onvif: H502W, S1 and later

protocol:
  note: >
    No vendor SDK; interoperable surface is RTSP + ONVIF, community-verified
    across 71 models in the iSpyConnect database. Legacy M-series speak the
    FI89xx-family ASF/MJPEG HTTP streaming. RTSP path has two variants
    (/11 vs /ch0_0.h264) — ONVIF GetStreamUri resolves it.
  commands:
    stream_rtsp: /11 (main), /12 (sub), or /ch0_0.h264
    ptz: ONVIF PTZ
    config: local web UI

status:
  apk_acquired: false   # not needed — RTSP/ONVIF community-verified
  apk_decompiled: false
  uuids_recovered: false  # n/a — Wi-Fi/HTTP
  protocol_recovered: true
  hci_snoop_needed: false
  cloud_dead: true   # brand dormant; dericam.com unreachable 2026-08-07
  rating: confirmed
  security_notes: >
    admin/admin + static default IP 192.168.1.188: change both on day one.
    Frozen firmware; assume Wanscam-family CVEs apply. Cleartext auth —
    isolate on IoT VLAN.
  references:
    - home-security-camera.com/how-to-connect-to-dericam-ip-cameras.htm
    - ispyconnect.com/camera/dericam (71 models, updated 2026-06)
    - justanswer.com Dericam default-credentials thread
    - curl check dericam.com -> 000 (2026-08-07)
