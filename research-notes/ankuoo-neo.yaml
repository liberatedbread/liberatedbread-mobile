# Ankuoo NEO — Device Spec (research note)
# Brand dormant (Broadlink SP1-variant OEM); local UDP protocol reverse-engineered
# Local path: UDP ports 80/8080, fixed 5aa5aa55 key-block packets

device:
  id: ankuoo-neo
  name: Ankuoo NEO Wi-Fi Switch / Plug (NEO Power = Broadlink SP2 variant)
  manufacturer: Ankuoo (brand dormant; OEM Lumi Legend Electrical)
  category: smart_plug
  safety_class: LOW  # mains switching; unauthenticated cleartext UDP

transport:
  type: wifi
  local_only: true
  note: >
    LAN control uses direct UDP to the device (ports 80/8080). Cloud hosts
    (us/eu.broadlink.com.cn) are only for remote access/time sync; blocking
    or DNS-sinking them does not affect local control.
    NOTE: the newer Ankuoo REC line (MS6126/CSW201) is a different protocol
    with a documented open LAN API (HA recswitch integration).

lan:
  discovery:
    method: udp   # device heartbeats + app discovery on 80/8080
  control:
    protocol: udp-binary
    ports: [80, 8080]
    auth: none
    quirks: app/device double-send every packet (UDP loss workaround)

protocol:
  note: >
    Per Diagonactic/Ankuoo RE notes: every LAN packet starts with a 32-byte
    fixed key block (5aa5aa55 repeated pattern), then a 32-bit LE
    timestamp/counter, device type 0x2717 (NEO family), and the device MAC
    little-endian. Power on/off commands confirmed; schedule and anti-theft
    formats only partially documented.
  commands:
    power_on: "key block + type 0x2717 + MAC + on payload (see RE notes)"
    power_off: "key block + type 0x2717 + MAC + off payload"

status:
  apk_acquired: false   # NEO app abandoned; RE notes from live captures suffice
  apk_decompiled: false
  protocol_recovered: true   # Diagonactic/Ankuoo RE notes (packets + fields)
  rating: confirmed          # for on/off; schedule/metering = hypothesis
  cloud_dead: true           # brand dormant; cloud = Broadlink hosts (alive but optional)
  references:
    - github.com/Diagonactic/Ankuoo (protocol RE notes)
    - home-assistant.io/integrations/recswitch/ (newer REC line — different protocol)
    - device.report/ankuoo (FCC filings, Lumi Legend Electrical)
