# Polaroid PoGo / ZINK classic mobile printers — Device Spec (research note)
# No companion app; protocol verified from vendor docs + community projects.

device:
  id: polaroid-pogo-zink
  name: Polaroid PoGo Instant Mobile Printer (CZA-10011B) + GL10 + Dell Wasabi PZ310
  manufacturer: Polaroid (ZINK platform)
  category: portable_photo_printer
  safety_class: LOW

transport:
  type: bluetooth_classic
  local_only: true
  alternates: [usb_pictbridge]

bluetooth_classic:
  version: "2.0+EDR"
  pairing:
    pin: "6000"  # per Polaroid PC-printing PDF; some units accept 0000
    bonding: legacy_pin
  profiles:
    - name: obex_object_push
      uuid16: "0x1105"
      role: server
      description: >
        Sole print path. Push a JPEG object (standard OPP PUT, no BPP
        session) and the printer renders and prints it. Works with
        generic tools: ussp-push, obexftp, BlueZ obexd, Windows
        "Send to Bluetooth device", Android Bluetooth share.
    - name: basic_printing_profile
      uuid16: "0x1122"
      supported: false  # community-confirmed: OPP only, no BPP

protocol:
  note: >
    No proprietary protocol. Standard OBEX Object Push of an image/jpeg
    object; the printer handles scaling. No status/error return channel
    known beyond OPP response codes.
  image_format: jpeg
  recommended_max_dimensions: "1200x1800"  # community practice, not vendor spec
  control_commands: none  # no SPP command channel known

status:
  apk_acquired: false   # N/A — no app required
  apk_decompiled: false
  protocol_recovered: true   # standard OPP; nothing to recover
  hci_snoop_needed: false
  cloud_dependency: none
  manufacturer_status: >
    Hardware discontinued c. 2011-2013. ZINK paper still manufactured
    (ZINK acquired by Foxconn 2015), so consumables remain available.
  references:
    - http://www.plawa.com/download/19111/Polaroid%20PoGo%20printing%20from%20PC%20GB.pdf
    - https://xdaforums.com/t/bluetooth-to-polaroid-pogo.606290/
    - https://github.com/jonathanlking/Instagram-Printer-RP
