# Royaltek RBT-2300 Bluetooth GPS Datalog Receiver — Device Spec (research note)
# Company alive (automotive radar/ODM pivot); consumer GPS line abandoned; no mobile app ever existed

device:
  id: royaltek-rbt-2300
  name: Royaltek RBT-2300 Bluetooth GPS Datalog Receiver
  manufacturer: RoyalTek Co. (Taiwan, Quanta group) — alive, pivoted to radar/ADAS/ODM
  also_covers:
    - Royaltek RBT-2010
    - Royaltek RBT-3000
    - Royaltek RBT-3800
  category: gps_logger
  safety_class: NONE

transport:
  type: bluetooth_classic
  local_only: true

bluetooth_classic:
  profiles: [SPP]
  spp_uuid: "00001101-0000-1000-8000-00805f9b34fb"
  pairing_pin: "0000"
  bluetooth_version: "1.2/2.0"
  notes: >
    SiRFstarIII platform. Live NMEA-over-SPP works with gpsd out of the box
    (pair PIN 0000, rfcomm bind). Internal flash log (~650k points on 64 Mbit)
    requires a proprietary Royaltek request/response dump protocol over the
    same SPP link — Windows-only vendor utility (abandonware) or the 2009
    freeware PocketPC downloader from aeropic.free.fr (partial RE notes).

protocol:
  live_position:
    chipset: SiRFstarIII
    format: NMEA 0183
    binary_mode: SiRF binary via public $PSRF100 sentence
    tools: [gpsd, any NMEA parser]
  log_download:
    format: proprietary Royaltek serial dump protocol (partially reverse-engineered)
    capacity_points: ~650000  # 64 Mbit flash, per aeropic.free.fr
    tools:
      - "Royaltek Data download Utility (Windows, abandonware)"
      - "aeropic.free.fr PocketPC downloader (freeware, 2009, RE notes)"
      - "NOT supported by gpsbabel — greenfield RE opportunity (low difficulty)"
  known_gaps:
    - Log-dump framing not consolidated anywhere; needs capture against live unit
    - RBT-2010/3000 assumed same protocol (same platform generation), unverified

status:
  android_app_existed: false
  apk_acquired: false
  apk_needed: false  # live position needs nothing; log dump needs desktop tool port
  protocol_recovered: partial  # live NMEA: yes; log dump: partial (aeropic notes only)
  hci_snoop_needed: true  # to finish documenting the log-dump protocol
  cloud_dependency: none
  references:
    - http://aeropic.free.fr/RBT_2300/index_english.html
    - https://www.microsoft.com/en-us/research/wp-content/uploads/2017/05/2014080813151459.pdf
    - http://www.royaltek.com/
