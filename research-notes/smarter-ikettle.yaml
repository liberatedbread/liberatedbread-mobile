# Smarter iKettle 2.0 / Smarter Coffee 1 — Device Spec (research note)
# APK source: apkeep (apk-pure), fetched 2026-08-03
# Legacy APK SHA-256: 28e9774de3f9896b7a13b50ceac37f5741ee2111bf6d600416de5799d9537dbb
# Smarter3 XAPK SHA-256: 192b4315a71690dc788a452687b3d10f494ac0ba2da44ad95cca1134374069fd

device:
  id: smarter-ikettle
  name: Smarter iKettle 2.0 (also Smarter Coffee 1st gen; 3rd-gen devices differ — see notes)
  manufacturer: Smarter Applications Ltd (London) — defunct per Electric Imp staff, 2025-12
  category: kitchen_appliance
  safety_class: MEDIUM  # unattended heating appliance; gate boil on water-level sensor

transport:
  type: wifi-lan        # NOTE: not BLE — local TCP/UDP on LAN
  local_only: true      # gen 1/2 only; gen 3 (iKettle 3.0/Coffee 2.0) is Electric Imp cloud
  note: >
    iKettle 1.0/2.0 and Smarter Coffee 1 speak a local binary protocol:
    UDP 2081 broadcast discovery, TCP control session, frames terminated 0x7E.
    iKettle 3rd gen refuses LAN connections (HA community, 2024-04) and is
    cloud-mediated via Electric Imp + Firebase — company defunct, cloud orphaned.

lan:
  discovery:
    protocol: udp
    port: 2081
    payload_hex: "647E"     # {100, 126} broadcast probe
  control:
    protocol: tcp
    port: 2081
    framing: frames terminated by 0x7E; responses read until 0x7E

protocol:
  note: >
    Single-opcode commands with trailing 0x7E. Recovered from legacy app
    (am.smarter.smarterandroid, models/d.java + FirmwareUpdateService.java);
    semantics partially inferred from KettleControlPanel call sites.
    Cross-check with iBrew (github.com/Tristan79/iBrew) and
    aslabicki/Smarter-iKettle-API before finalising.
  commands:
    heat_to_temp:  "15 <temp_c> <units> 7E"
    stop_heat:     "30 7E"
    stop_alt:      "16 7E"        # sent from control-panel stop path — exact role TBD
    session_end:   "2C 7E"        # TBD
    status_query:  "2E 7E"        # expects reply starting 0x2F
    set_defaults:  "1F <keep_warm_min> <temp> <baby_temp> 7E"
    set_scalar:    "19 <value> 00 7E"   # TBD (keep-warm time?)
    fw_update_init: "6E 7E"
    fw_upload:     "70 <len32_be> 7E, then 261-byte blocks with 7E 7E 7E trailer"
  status_fields:  # per aslabicki/Smarter-iKettle-API model
    - temperature
    - water_sensor_raw   # ~2080 empty .. ~2250 full
    - water_percent
    - on_base

status:
  apk_acquired: true         # both legacy (am.smarter.smarterandroid) and smarter3 XAPK
  apk_decompiled: true       # legacy app; smarter3 not decompiled
  uuids_recovered: false     # n/a — Wi-Fi LAN, no BLE GATT
  protocol_recovered: true   # gen 1/2 framing + opcode set (publicly documented since 2016)
  hci_snoop_needed: false
  cloud_dead: true           # company defunct; Google Home linking broken 2025-12
  references:
    - github.com/Tristan79/iBrew
    - github.com/aslabicki/Smarter-iKettle-API
    - community.home-assistant.io/t/smarter-coffee-ikettle/1870
    - forums.electricimp.com/t/6967 (company dead, 2025-12)
