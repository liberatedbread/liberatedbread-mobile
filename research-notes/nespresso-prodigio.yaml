# Nespresso Prodigio — Device Spec (research note)
# Product line discontinued 2020; Nestlé alive (product abandonment, not company death)
# APK: NOT acquired (com.nespresso.aaa failed on apkeep/apk-pure 2026-08-03; legacy app not mirrored)

device:
  id: nespresso-prodigio
  name: Nespresso Prodigio / Prodigio & Milk
  manufacturer: Nestlé Nespresso S.A. (active; product line discontinued 2020)
  category: kitchen_appliance   # coffee machine
  safety_class: MEDIUM  # hot-water dispensing; respect on-device interlocks

transport:
  type: ble
  local_only: true
  note: >
    Bluetooth Smart (BLE) phone->machine link for remote/scheduled brew,
    maintenance alerts, capsule stock. Machine fully functional standalone
    via buttons; BLE is an enhancement, not a dependency.

ble:
  advertising:
    name_patterns: []  # TBD — "Prodigio" speculative
    service_uuids: []  # TBD — needs legacy APK or a unit
  services: []

protocol:
  note: >
    No public RE found (2026-08). 2016-era BLE design implies plain GATT.
    Expected commands: brew_now (size?), schedule, status (water/descale/
    capsule container), capsule count.
  commands:
    brew: TBD
    schedule: TBD
    status_read: TBD

status:
  apk_acquired: false    # com.nespresso.aaa fetch failed; try google-play source or APK archive
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: true
  cloud_dead: false      # vendor alive; app-support status for Prodigio unverified
  references:
    - nestle-nespresso.com/news/Prodigio-first-connected-Nespresso-machine (2016-03-07)
    - whichnespresso.com/ranges/nespresso-prodigio-coffee-machine/ (discontinued 2020)
