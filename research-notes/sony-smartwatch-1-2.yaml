# Sony SmartWatch 1 (MN2) / SmartWatch 2 (SW2) — Device Spec (research note)
# Vendor alive (Sony), product line abandoned 2014. Fully local stack:
# Smart Connect host + extensions, no account, no cloud.

device:
  id: sony-smartwatch-1-2
  name: Sony SmartWatch MN2 + SmartWatch 2 SW2
  manufacturer: Sony / Sony Mobile (vendor active; product line discontinued)
  category: smartwatch
  safety_class: LOW
  models:
    - mn2   # SmartWatch 1, 2012; open native toolchain exists (underverk)
    - sw2   # SmartWatch 2, 2013; 220x176 LCD, NFC tap-pairing
  out_of_scope:
    - swr50 # SmartWatch 3 is Android Wear — different platform entirely

transport:
  type: bluetooth_classic
  profile: spp
  local_only: true
  rfcomm:
    note: >
      BT Classic 3.0 link owned by the Smart Connect host app via Sony's
      SmartExtensions framework. No vendor account or cloud in the path.
      Low-level watch<->host wire protocol never published — greenfield RE
      opportunity (HCI snoop + Smart Connect static pass).

protocol:
  note: >
    Public surface is the Smart Extension API (Sony Add-on SDK): watch apps
    are Android-side ControlExtension / Notification extensions that run
    locally through Smart Connect — no watch flashing, no cloud. Native
    firmware-level access on MN2 via community toolchain
    (github.com/underverk/SmartWatch_Toolchain).
  reference_implementations:
    - github.com/underverk/SmartWatch_Toolchain  # SW1/MN2 native, Arduino-style
    - Sony Add-on SDK (Smart Extension APIs)     # local extension model

cloud_status:
  cloud_required: false  # pairing, notifications, extensions all on-device

status:
  apk_acquired: false    # com.sonymobile.smartconnect + com.sonyericsson.extras.smartwatch2
                         # not on APKPure; Sony still hosts SW2 APKs on sony.com (verified 2026-08-07)
  apk_decompiled: false
  uuids_recovered: false # wire protocol undocumented — HCI snoop needed for host RE
  protocol_recovered: false  # only the SDK-level API is public
  hci_snoop_needed: true
  rating: confirmed  # local operation confirmed; protocol RE still open
