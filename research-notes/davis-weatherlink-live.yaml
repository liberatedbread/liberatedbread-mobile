# Davis WeatherLink Live 6100 — Device Spec (research note)
# Vendor-documented local HTTP API + UDP real-time broadcast, no auth.
# Same local API on Davis AirLink 7210. Company active (Davis/AEM) as of 2026-08.
# Sources checked 2026-08-07: weatherlink.github.io/weatherlink-live-local-api/,
# github.com/weatherlink/weatherlink-live-local-api (API.md transcribed here in summary),
# github.com/ryan-lang/homeassistant-davis-local.

device:
  id: davis-weatherlink-live
  name: Davis WeatherLink Live 6100 (+ AirLink 7210, same API)
  manufacturer: Davis Instruments (AEM)
  category: weather_station
  safety_class: LOW

transport:
  type: wifi
  local_only: true
  note: >
    WLL runs an HTTP server on port 80 serving vendor-documented JSON
    endpoints with no authentication, and can be told to start a 2.5-second
    UDP broadcast on port 22222. Works fully offline; weatherlink.com cloud
    upload is independent.

lan:
  control:
    - protocol: http
      port: 80
      auth: none
      endpoints:
        - GET /v1/current_conditions   # all transmitters: ISS, leaf/soil, bar, temp/hum; poll >= 10 s
        - GET /v1/real_time?duration=N # start UDP 22222 broadcast for N sec (max 86400, default 1200)
    - protocol: udp-broadcast
      port: 22222
      direction: device -> LAN broadcast
      note: enabled on demand via /v1/real_time; ISS rapid update records (wind, rain) every 2.5 s
  discovery: documented in vendor repo; hostname pattern weatherlinklive-XXXXXX (DHCP/Bonjour)

protocol:
  note: >
    JSON documents: {"data": {...}, "error": null}. conditions[] records carry
    lsid (logical sensor id), txid (transmitter 1-8), data_structure_type
    (1=ISS, 2=leaf/soil, 3=bar, 4=temp/hum). Error objects use HTTP-style
    codes 400/404/409/414. Units imperial; rainfall is counts scaled by
    rain_size (1=0.01in, 2=0.2mm, 3=0.1mm, 4=0.001in).
  commands:
    current_conditions: GET /v1/current_conditions
    real_time_start: GET /v1/real_time?duration=<sec>
    real_time_receive: listen UDP 22222

status:
  apk_acquired: false    # n/a — vendor-documented
  apk_decompiled: false
  uuids_recovered: false # n/a
  protocol_recovered: true  # vendor-documented + community implementations
  hci_snoop_needed: false
  cloud_dead: false      # active; local API in firmware regardless
  rating: confirmed
  references:
    - weatherlink.github.io/weatherlink-live-local-api/
    - github.com/weatherlink/weatherlink-live-local-api
    - github.com/ryan-lang/homeassistant-davis-local
