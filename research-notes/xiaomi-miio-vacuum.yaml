# Xiaomi/Roborock miio-generation robot vacuums — Device Spec (research note)
# miIO LAN protocol: UDP 54321, AES-128-CBC keyed by 16-byte device token.
# Local-only after token obtained; token paths: rooted robot (account-free),
# legacy Mi Home app artifacts, or Mi cloud lookup.

device:
  id: xiaomi-miio-vacuum
  name: Xiaomi Mi Robot Vacuum (rockrobo.vacuum.v1), Roborock S5/S6/S7, Xiaomi 1C/1T, Mi Vacuum-Mop series, Dreame/Viomi miio models
  manufacturer: Xiaomi / Roborock / Dreame (ecosystem) — active brands
  category: robot_vacuum
  safety_class: LOW

transport:
  type: wifi
  local_only: true
  note: >
    miIO LAN protocol, UDP 54321. All cleaning control works with WAN
    blocked once the device token is known. Only initial provisioning (stock
    firmware) and token recovery involve vendor infrastructure.

lan:
  discovery:
    method: udp_broadcast   # hello packet 0x2131 len 0x20, all-0xFF fields, to 255.255.255.255:54321
  control:
    protocol: miio-json-over-udp
    port: 54321
    crypto: AES-128-CBC; key=MD5(token), IV=MD5(MD5(token)+token); token = 16-byte per-device secret
    message_format: JSON {"id":N,"method":"...","params":[...]} inside miio binary frame (magic 0x2131)

protocol:
  note: >
    Reference implementation: python-miio (rytilahti). Vacuum dialects:
    rockrobo (app_start/app_charge/get_status/get_map_v1...), dreame, viomi,
    ijai, 3irobotix — per-model classes in the library. HA core xiaomi_miio
    is iot_class local_polling.
  commands:
    start: app_start
    pause: app_pause
    stop_dock: app_charge
    spot: app_spot
    status: get_status
    map: get_map_v1          # RRMap format; community parsers exist
    fan_power: set_custom_mode / set_fan_power  # model-dependent

status:
  apk_acquired: true    # com.xiaomi.smarthome XAPK via apkeep 2026-08-03 (workspace)
  apk_sha256: 12aecd77fd18531e23c7bf43b91ba06b36a8cf7005b31d2fed7645d744ac63b6
  apk_decompiled: false  # unnecessary — python-miio documents the protocol
  protocol_recovered: true
  rating: confirmed
  cloud_dead: false      # Xiaomi cloud alive; local path is independent of it
  cloud_bootstrap: optional  # token via rooted robot = fully account-free
  references:
    - github.com/rytilahti/python-miio (+ docs/legacy_token_extraction.rst)
    - home-assistant.io/integrations/xiaomi_miio (local_polling)
    - github.com/PiotrMachowski (map extractor, RRMap format)
