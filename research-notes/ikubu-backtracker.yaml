# iKubu Backtracker — Research Note (structured)
# No companion app exists; hardware-only BLE link between radar and display modules.

device:
  id: ikubu-backtracker
  name: iKubu Backtracker bicycle rear-view radar
  manufacturer: iKubu (Pty) Ltd., Stellenbosch, South Africa — assets acquired by Garmin 2015-01-14; brand dead
  category: bike_radar
  safety_class: MEDIUM  # rider-awareness safety device; advisory only, false negatives possible

transport:
  type: bluetooth  # BLE vs Classic SPP unverified — needs nRF scan of a live unit
  local_only: true
  cloud_dependency: none  # never had any cloud service; radar->display direct link

ble:
  advertising:
    name_patterns: []  # TBD
    service_uuids: []  # TBD
  services: []  # TBD — no public RE, no app to mine
  note: >
    Radar module (seat post, with flasher light) streams approaching-vehicle
    distance/closing-speed to the handlebar display module over Bluetooth.
    iKubu promised an open third-party API that never shipped before the Garmin
    acquisition; Garmin rebadged the hardware as the ANT+ Varia RTL500.

protocol:
  note: >
    Completely undocumented. RE path: pair an nRF Connect / HCI snoop with a live
    unit, dump the GATT table and notification frames, correlate with known radar
    behavior (vehicle distance/speed). Garmin's later Varia line may share frame
    semantics (unverified).
  prior_re: none found (no GitHub drivers, HA integrations, or forum RE threads located)

status:
  confidence: confirmed  # acquisition + brand death documented (Garmin PR 2015-01-14)
  apk_acquired: false  # no app ever existed
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: true
  hardware_access_needed: true  # tiny installed base is the main blocker
  references:
    - https://www.garmin.com/en-US/newsroom/press-release/corporate/2015-garmin-acquires-assets-of-ikubu-developer-of-backtracker-bike-radar/
    - https://www.dcrainmaker.com/2015/01/acquires-backtracker-company.html
    - https://wiseman-design.com/project-view/backtracker/  # Bluetooth inter-module link
