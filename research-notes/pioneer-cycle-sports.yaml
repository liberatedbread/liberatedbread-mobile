# Pioneer Cycle Sports — Research Note (structured)
# Covers SGX-CA500/CA600 cycle computers + SGY-PM9xx power meters
# APK: jp.pioneer.cyclesports.devicecontrol v1.9.3 via apkeep/apk-pure, 2026-08-04
# SHA-256: 6752afc0e09e1dc38bb33467458b66398282a29ef7c17555e9d6f1f4e9ef8e7f

device:
  id: pioneer-cycle-sports
  name: Pioneer SGX-CA500/CA600 cycle computers + SGY power meters
  manufacturer: Pioneer Corporation (Cycle Sports division exited 2020-03-31)
  category: bike_computer_and_power_meter
  safety_class: LOW  # fitness telemetry

transport:
  type: ble  # head units also have Wi-Fi + USB; power meters also ANT+
  local_only: true
  cloud_dependency: >
    Cyclo-Sphere web service terminated 2021-06-18; successor Shimano Connect Lab
    terminates 2027-03-31. Cloud was only needed for ride analysis, maps, firmware
    distribution, and first-run wizard. Core riding, FIT export (USB), and power
    meter broadcast work fully offline.

ble:
  advertising:
    name_patterns: []  # TBD — likely "SGX-CA600" / "Pioneer" prefixed
    service_uuids: []  # TBD — Xamarin IL, not in DEX; see status.uuids_recovered

  # Power meters expose the Bluetooth SIG standard profile:
  standard_services:
    - uuid: "00001818-0000-1000-8000-00805f9b34fb"
      name: cycling_power
      note: Power meters broadcast standard CPS; zero-offset via CPS control point 0x2A66
    - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
      name: battery_service
      note: expected, verify
    - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
      name: device_information
      note: expected, verify

  # Head-unit config channel (app <-> SGX-CA600): UUIDs TBD
  headunit_config_service:
    note: >
      Present in the Cyclo-Sphere Control app (Wi-Fi setup, page sets, sensor
      config, firmware update over BLE). UUIDs are constructed in Xamarin IL
      (assemblies/DeviceApp.dll, Plugin.BLE) and were not recovered in a cheap
      static pass — use ILSpy on DeviceApp.dll or HCI snoop.

protocol:
  note: >
    App is Xamarin.Forms (Plugin.BLE + Nordic Secure DFU). Power-meter telemetry is
    standard BLE Cycling Power + ANT+; Pioneer pedaling force-vector metrics are a
    proprietary extension shown only by Pioneer/SGX gear. Head unit stores FIT files
    locally; USB mass-storage export is cloud-free.
  known_commands:
    zero_offset: standard Cycling Power Control Point (0x2A66) — power meters
    headunit_config: TBD (in DeviceApp.dll IL)

status:
  confidence: confirmed  # exit + cloud termination dates from Pioneer/Shimano notices
  apk_acquired: true
  apk_decompiled: true   # jadx OK; BLE layer is Xamarin IL, needs ILSpy pass
  uuids_recovered: false # standard CPS assumed for power meters; head-unit map TBD
  protocol_recovered: partial  # standard-profile path is trivial; proprietary bits TBD
  hci_snoop_needed: true  # for CA600 config channel + Wi-Fi sync protocol
  references:
    - https://global.pioneer/en/support/oshirase_etc/cycle/info210524.php  # termination notice 2021-05-24
    - https://global.pioneer/en/support/oshirase_etc/cycle/faq/210524.php  # Cyclo-Sphere ended 2021-06-18
    - https://www.bicycleretailer.com/industry-news/2020/02/04/pioneer-exits-powermeter-market
    - https://www.cycling-review.net/92/shimano-connect-lab-to-replace-pioneer-cyclo-sphere/  # Connect Lab ends 2027-03-31
    - http://pioneer-cyclesports.com/us-en/support/products/manual/USG_SGXCA600_EN.pdf  # manual: app config roles
