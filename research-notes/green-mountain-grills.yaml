# Green Mountain Grills WiFi pellet grills — research note
# Company ACTIVE; local UDP ASCII protocol fully RE'd; cloud optional only.

device:
  id: green-mountain-grills
  name: Green Mountain Grills WiFi pellet grills (Daniel Boone, Jim Bowie, Ledge/Peak Prime(+), Trek/Davy Crockett)
  manufacturer: Green Mountain Grills (Reno, NV) — active
  category: kitchen_appliance   # outdoor cooking appliance (pellet grill/smoker)
  safety_class: HIGH  # live fire; power-off is a mandatory fan cooldown cycle

transport:
  type: wifi
  local_only: true
  note: >
    Unauthenticated ASCII commands over UDP 8080 on the LAN. Vendor app has
    an explicit local mode; cloud used only for remote access. Provisioning
    is local (grill AP / point-to-point mode speaks the same UDP protocol).

lan:
  control:
    protocol: udp
    port: 8080
    discovery: broadcast "UL!" -> reply "GMG<serial>"
    http: port 80 serves a status page (community-confirmed)

protocol:
  note: >
    Plain ASCII frames, bang-terminated, no auth/handshake. Status reply is
    a positional byte-pair field list (deg F): on/off, grill temp + set
    temp, probe1/probe2 temps + set temps (indexes per gmg_home_assistant).
  commands:
    discover: "UL!"           # broadcast; reply "GMG<serial>"
    status: "UR001!"          # full grill/probe state
    set_grill_temp: "UT<150-500>!"
    set_probe1_temp: "UF<32-257>!"
    set_probe2_temp: "Uf<32-257>!"
    power_on: "UK001!"
    power_on_cold_smoke: "UK002!"
    power_off: "UK004!"       # starts fan cooldown; never bypass

status:
  apk_acquired: false    # not needed — protocol fully RE'd by multiple implementations
  apk_decompiled: false
  uuids_recovered: false # n/a — WiFi/UDP
  protocol_recovered: true
  hci_snoop_needed: false
  cloud_dead: false      # vendor active; cloud optional anyway
  rating: confirmed      # several independent open-source clients + HACS integration
  open_questions:
    - Prime+/Peak 2.0 firmware command-set parity
    - full status-reply field map beyond index ~30
  references:
    - github.com/jwhitby91/gmg_home_assistant (HACS integration; command table above)
    - github.com/facultymatt/gmg-js
    - github.com/FeatherKing/grillsrv
    - github.com/brandenco/green-mountain-grill
    - community.home-assistant.io/t/green-mountain-grill/149007 (2019-2024)
