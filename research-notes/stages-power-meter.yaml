# Stages Cycling Power Meters / Dash — Structured Note
# APK source: apkeep (apk-pure); com.stagescycling.stages 4.1.2 (final) XAPK

device:
  id: stages-power-meter
  name: Stages Power meter (Gen 1-3, L/LR) + Dash head unit + SB20 smart bike
  manufacturer: Stages Cycling LLC (ceased ops Apr 2024; assets to Giant/Spia; relaunched 2025)
  category: bike_power_meter
  safety_class: LOW  # meters are read-only; SB20 resistance control would raise this

transport:
  type: ble
  local_only: true
  note: >
    Power meters broadcast standard BLE Cycling Power — readable by any local
    client with no cloud, account, or vendor infra. Stages Link cloud continuity
    was uncertain through the 2024 bankruptcy; Dash sync depends on it.

ble:
  advertising:
    name_patterns: []  # TBD — "Stages"-prefixed
    service_uuids: ["00001818-0000-1000-8000-00805f9b34fb"]  # CPS advertised

  services:
    - uuid: "00001818-0000-1000-8000-00805f9b34fb"
      name: cycling_power_service
      description: Standard CPS — confirmed via app dex literals (1818, 2a63, 2a66)
      characteristics:
        - uuid: "00002a63-0000-1000-8000-00805f9b34fb"
          name: cycling_power_measurement
          properties: [notify]
        - uuid: "00002a66-0000-1000-8000-00805f9b34fb"
          name: cycling_power_control_point
          description: Zero-offset calibration = standard CP Control Point write (opcode 0x0C)
          properties: [write, indicate]
    - uuid: "00001826-0000-1000-8000-00805f9b34fb"
      name: fitness_machine_service
      description: FTMS literal in dex — SB20/Dash path

  alternate_services:
    - uuid: "7e0682c0-7b8f-4645-ae2a-a88d4a42e9a6"
      name: stages_custom_1
      description: Custom family 7e0682c0-c3; role TBD (likely Dash/SB20)
      confirmed: false
    - uuid: "0c46beaf-9c22-48ff-ae0e-c6eae1a2f4e5"
      name: stages_custom_2
      description: Custom family 0c46beaf-b1; role TBD
      confirmed: false
    - uuid: "d445fe01-d139-9a5d-6707-1cc6a58b6303"
      name: stages_custom_3
      description: d445fe01/02 pair; role TBD
      confirmed: false

  standard_services:
    - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
      name: battery_service
    - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
      name: device_information
    - uuid: "0000fe59-0000-1000-8000-00805f9b34fb"
      name: nordic_secure_dfu

protocol:
  note: >
    Core telemetry is 100% standard GATT (CPS) — no RE required. Vendor app needed
    only for firmware updates and advanced config. Custom services for Dash/SB20
    need jadx if those products are in scope.
  expected_measurements:
    - power_watts
    - cadence_rpm
    - left_right_balance (LR models)

status:
  apk_acquired: true
  apk_decompiled: false
  uuids_recovered: true  # standard profile path fully identified
  protocol_recovered: standard_profiles_usable
  hci_snoop_needed: false
  cloud_status: at_risk  # bankrupt Apr 2024; relaunched under new owner Jun 2025
  sources:
    - https://www.dcrainmaker.com/2024/04/stages-cycling-messier.html
    - https://www.bicycleretailer.com/industry-news/2024/06/27/giant-making-bid-buy-stages-cycling-bankruptcy
    - https://the5krunner.com/2025/06/26/stages-cycling-re-starts-trading/
