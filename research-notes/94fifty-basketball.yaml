# 94Fifty Smart Sensor Basketball — Structured Note
# APK source: apkeep (apk-pure); com.spectrumdt.ist 1.4 (only mirrored version)

device:
  id: 94fifty-basketball
  name: 94Fifty Smart Sensor Basketball
  manufacturer: InfoMotion Sports Technologies (bankrupt, Chapter 11)
  category: sports_sensor
  safety_class: LOW

transport:
  type: ble  # TI dual-mode SoC; Android path may be classic SPP — see protocol.note
  local_only: true
  note: >
    All shot/dribble classification runs on the ball's onboard DSP (~6,000 samples/s,
    9 IMU sensors). Phone app is display/coaching only. Company defunct; app pulled
    from stores. Core metrics need no cloud.

ble:
  advertising:
    name_patterns: []  # TBD
    service_uuids: []  # TBD — no UUID literals in dex; likely byte-array constructed

  services:
    - uuid: "32e5fcfc-52ee-41b0-827a-f18929716fef"
      name: unknown_custom
      description: Only 128-bit UUID literal recovered; role TBD
      confirmed: false

protocol:
  note: >
    Structured protocol layer in app: com/_94fifty/protocol/ProtocolInfo plus BLE
    classes (BleDirectAdvertisingTestRequest, BluetoothDeviceBridge). Ball has a TI
    dual-mode Bluetooth SoC — jadx must determine whether Android uses BLE GATT
    (connectGatt) or classic RFCOMM/SPP. If SPP-only on Android, adjust transport.
  expected_measurements:
    - shot_arc
    - shot_backspin_rate
    - shot_release_speed
    - dribble_force_and_speed
    - dribble_count

status:
  apk_acquired: true
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: true
  cloud_status: shutdown  # company bankrupt/defunct
  sources:
    - https://www.abi.org/feed-item/maker-of-%E2%80%98smart%E2%80%99-basketball-files-for-bankruptcy-protection
    - https://www.designnews.com/gadget-freak/smart-basketball-analyzes-shooting-dribbling
    - https://www.engineering.com/fire-the-coach-94fifty-basketball-uses-sensors-to-measure-basketball-skills/
    - https://apkpure.net/tw/94fifty%C2%AE-basketball/com.spectrumdt.ist/versions
