# Onewheel (Future Motion) — Research Note
# App: com.rideonewheel.onewheel ("Onewheel", v2.6.18)
# XAPK source: apkeep (apk-pure)
# XAPK SHA-256: 08dcdfc4e4d472aa14cda6915225e2582700b4da7f7fbcbd7aa536ed510ccc66

device:
  id: onewheel
  name: Onewheel V1 / + / +XR / Pint / Pint X / GT / GT S-Series / XR Classic
  manufacturer: Future Motion Inc. (vendor ACTIVE; account-gated app, DMCA-hostile — cloud-at-risk)
  category: self_balancing_board
  safety_class: HIGH  # self-balancing vehicle; CPSC recall history (nosedive injuries)

transport:
  type: ble
  local_only: true  # telemetry/settings/shaping all local GATT; proven by ponewheel,
                    # OWCE, onewheel-web-bluetooth, rewheel
  cloud_needed_for:
    - initial_board_activation   # internet round-trip; offline path unknown
    - firmware_update_delivery

ble:
  advertising:
    name_patterns: ["Onewheel"]  # per community docs; verify per model
    service_uuids: []            # TBD (boards are usually found by name prefix)

  # UUID family confirmed present in official APK DEX via string scan.
  # Role labels from prior art (ponewheel, OWCE, TomasHubelbauer/onewheel-web-bluetooth).
  services:
    - uuid: "e659f300-ea98-11e3-ac10-0800200c9a66"
      name: onewheel_main_service
      description: Single custom service carrying all telemetry and control
      confidence: confirmed_in_apk_strings
      characteristics:
        - uuid: "e659f3fe-ea98-11e3-ac10-0800200c9a66"
          name: uart_serial_read
          description: serial/telemetry read channel
          properties: [read, notify]
        - uuid: "e659f3ff-ea98-11e3-ac10-0800200c9a66"
          name: uart_serial_write
          description: unlock token write — static 20-byte token required on newer
            firmware, rewritten every ~15s as keep-alive (ponewheel #86/#109, OWCE #121)
          properties: [write]
        - uuid: "e659f307-ea98-11e3-ac10-0800200c9a66"
          name: telemetry_range_start
          description: >
            Every UUID in the contiguous range e659f307..e659f31c (same 128-bit base)
            is present in the APK strings. Individual roles (battery %, odometer,
            speed, ride mode, firmware rev, serial, pitch/roll, etc.) are mapped in
            ponewheel BluetoothLeService and OWCE sources — transcribe from there
            rather than re-RE.

protocol:
  note: >
    Connection flow on newer firmware: write constant 20-byte token to e659f3ff,
    refresh every ~15s; afterwards all characteristics return real values.
    Token is a constant from the stock app (base64 in ponewheel issue #86) — no
    cloud involved. Older V1/+ boards accept reads directly. Firmware patching
    (rewheel) operates over the same service.
  commands:
    unlock: write 20-byte token to e659f3ff (keep-alive every 15s)
    read_battery: read/notify battery characteristic (see ponewheel map)
    set_ride_mode: write ride-mode characteristic (see ponewheel map)

status:
  apk_acquired: true
  apk_decompiled: false  # string-scan triage only; large JS-bundle app
  uuids_recovered: true  # e659f3xx family confirmed in APK; roles from prior art
  protocol_recovered: true  # via community (ponewheel, OWCE, rewheel)
  hci_snoop_needed: false
  reference:
    - github.com/ponewheel/android-ponewheel (issues #86, #109: token flow)
    - github.com/OnewheelCommunityEdition/OWCE_App (issue #121: GT-S unlock)
    - github.com/non-bin/rewheel (firmware mod tool; original repo DMCA'd by FM)
    - github.com/TomasHubelbauer/onewheel-web-bluetooth
    - support.onewheel.com (activation requires internet)
    - onewheel.com/blogs/news/onewheel-cpsc-recall-haptic-buzz (recall firmware via app)
