# FINIS Swimsense Live — Research Note
# Sources: APK static analysis (com.finisinc.live 2.0.0) + dated web sources
# APK source: apkeep (apk-pure), 2026-08-04
# APK SHA-256: cd1989b1f423dec604eac088578a1d2172412d59e79522dbfcea3661abab121b

device:
  id: finis-swimsense-live
  name: FINIS Swimsense Live (1.30.054)
  manufacturer: FINIS, Inc. (app contract-built by Intellectsoft)
  category: swim_fitness_watch
  safety_class: LOW  # Recreational fitness metrics only

transport:
  type: ble
  local_only: true  # GATT exchange is unauthenticated; no account/pairing key in protocol

abandonment:
  product_status: discontinued
  evidence:
    - "FINIS told customers it no longer sells the Swimsense (Amazon.ae listing review): https://www.amazon.ae/FINIS-1-30-054-Swimsense-Live-Watch/dp/B01M0YATL0"
    - "Product absent from finisswim.com; swim-electronics line replaced by Smart Goggle, itself sunset end of 2025: https://swimswam.com/one-last-lap-for-the-finis-smart-goggle/"
    - "Cloud backend apps.finisinc.com unreachable (curl timeout, verified 2026-08-07); FINIS Live FAQ points at apps.FINISinc.com/finis-live/downloads"
  manufacturer_status: alive  # FINIS, Inc. still sells swim gear; only this product+cloud are dead

ble:
  advertising:
    name_patterns: ["BLE-watch", "FINIS-HRM", "FINIS SWIMSENSE"]  # substring match, FinisDeviceScanner.isFinisDevice()
    service_uuids: []  # Scanner matches on name only
  services:
    - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
      name: finis_service
      characteristics:
        - uuid: "0000fff5-0000-1000-8000-00805f9b34fb"
          name: command_write
          properties: [write]
        - uuid: "0000fff4-0000-1000-8000-00805f9b34fb"
          name: read_1
          properties: [read, notify]
        - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
          name: heart_rate  # FINIS HRM strap data
        - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
          name: heart_rate_write
  standard_services:
    - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
      name: battery_service
      characteristics:
        - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
          name: battery_level

protocol:
  note: >
    Simple request/response on the 0xFFF0 service. Commands are written to 0xFFF5 as
    short frames: lead byte 0xAA, a length/opcode pair, payload, terminator 0xFF.
    All command constants are in BleConstants.java; response decoders are in
    FinisBluetoothService.java (com.intellectsoft.finis.ble). No authentication.
  commands:
    get_settings: "AA 00 B1 FF"
    get_stats: "AA 01 B5 FF"
    get_battery: "AA 00 B7 FF"
    get_workout_count: "AA 00 81 FF"
    warm_up_preamble: "AA 00 80 FF"
    workout_date: "AA 08 80 00 FF"
    workout_part1: "AA 08 90 00 FF"
    workout_part2: "AA 08 91 00 FF"
    workout_freestyle: "AA 08 92 00 FF"
    workout_breaststroke: "AA 08 93 00 FF"
    workout_butterfly: "AA 08 94 00 FF"
    workout_backstroke: "AA 08 95 00 FF"
    set_ble_time: "AA 08 B6 <12 bytes> FF"
  response_format: TBD  # parsers present in APK, not yet mapped byte-by-byte

status:
  rating: confirmed
  apk_acquired: true
  apk_decompiled: true
  uuids_recovered: true
  protocol_recovered: partial  # full command set; response layouts readable from decompiled tree
  hci_snoop_needed: false  # optional confirmation only
  cloud_dependency: none_for_ble  # dead cloud only affected web-platform upload/export
