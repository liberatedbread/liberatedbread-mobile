# Zeemote JS1 (incl. Buffalo BSGPJS1H rebrand) — Device Spec
# SPP protocol derived from Bluez-IME 1.20 (com.hexad.bluezime, F-Droid archive)
# Driver APK SHA-256: 99b4aa59e5f1f7b6b0b2db06df4af1567f1d5616b446cae242dc075d33f02b79

device:
  id: zeemote-js1
  name: Zeemote JS1 Bluetooth controller
  manufacturer: Zeemote Inc. (acquired by Aplix 2011; line discontinued)
  category: game_controller
  safety_class: LOW

transport:
  type: bluetooth_classic
  local_only: true
  profiles:
    - hid   # Pointer mode (mouse emulation) — hold A at power-on
    - hid   # Keyboard mode — hold B at power-on
    - spp   # Joystick mode (proprietary) — hold C at power-on

bluetooth_classic:
  pairing:
    mode_select: Button held at power-on selects mode (A=pointer, B=keyboard, C=joystick)
    pin: era-typical (0000 if prompted)
  spp:
    fallback_service_uuid: "8e1f0cf7-508f-4875-b62c-fbb67fd34812"
    note: Default SDP record tried first; UUID above is the fallback in Bluez-IME.

protocol:
  note: >
    Joystick mode frame: [len, 0xA1, msgType, payload...], len counts bytes after
    itself. Button updates list currently-pressed button indices (absence =
    released). Axis updates carry int8 X/Y pairs.
  frame:
    byte0: length
    byte1: 0xA1 (magic)
    byte2: msgType  # 0x07 buttons (JS1), 0x1C buttons (SteelSeries variant), 0x08 axes
  msg_0x07_0x1C_buttons:
    payload: list of pressed button indices, each 0..15
    logical_controls: [A, B, C, D, L, R, dpad_up, dpad_left, dpad_down, dpad_right, ...]
  msg_0x08_axes:
    byte3: axis-pair index
    byte4: X (int8)
    byte5: Y (int8)
  hid_modes:
    pointer: standard HID mouse
    keyboard: standard HID keyboard

status:
  apk_acquired: true    # Bluez-IME 1.20 driver APK from F-Droid archive
  apk_decompiled: true  # jadx triage pass, workspace/static/zeemote-js1/
  protocol_recovered: true   # SPP joystick frames fully mapped
  hci_snoop_needed: false
  cloud_dependency: none
  references:
    - F-Droid archive: com.hexad.bluezime 1.20 (ZeemoteReader.java)
    - github.com/Rakashazi/emu-ex-plus-alpha (native Zeemote support)
    - lightreading.com Zeemote/Aplix acquisition (2011)
    - wlog.flatlib.jp Buffalo JS1 review (2011-12)
