device:
  id: hotwired-heated-gear
  name: HOTWIRED 12V Bluetooth Heated Gear
  manufacturer: Comoto Holdings, Inc. (HOTWIRED)
  category: heated_apparel
  safety_class: HIGH  # resistive heating worn against body - burn/fire risk

transport:
  type: ble
  local_only: true

ble:
  advertising:
    name_patterns: []  # No name filter found in code; connects by MAC address
    service_uuids: []  # No service UUID scan filter found

  services:
    - uuid: "0000ffb0-0000-1000-8000-00805f9b34fb"
      name: primary_service
      characteristics:
        - uuid: "0000ffb1-0000-1000-8000-00805f9b34fb"
          name: write
          description: Command write characteristic (primary)
          properties: [write, write_no_response]
        - uuid: "0000ffb2-0000-1000-8000-00805f9b34fb"
          name: read_notify
          description: Status read and notification characteristic
          properties: [read, notify]

  # Alternate UUIDs also supported by the app
  alternate_services:
    write_alt: "0000fee2-0000-1000-8000-00805f9b34fb"
    read_alt: "0000fee1-0000-1000-8000-00805f9b34fb"

protocol:
  frame_format:
    write:
      header: "AA"  # 1 byte
      payload: variable  # command byte(s)
      trailer: "0000000055"  # 5 bytes
      example: "AA 05 00 00 00 00 55"  # set heat level 5

    notification_echo:
      prefix: "AA"  # echo of sent command for confirmation

    notification_status:
      prefix: "CC"
      fields:
        - name: status
          offset: 2
          length: 2
          encoding: hex
        - name: temps
          offset: 4
          length: 2
          encoding: hex
        - name: battery
          offset: 6
          length: 2
          encoding: hex
        - name: temp
          offset: 8
          length: 2
          encoding: hex
        - name: control
          offset: 10
          length: 2
          encoding: hex

  commands:
    set_heat_level:
      description: Set heat level (0=off, 1-10 = increasing heat)
      format: "AA {level:02X} 00 00 00 00 55"
      parameters:
        level:
          type: uint8
          range: [0, 10]
          default: 0

  timing:
    write_retry_ms: 3000  # Command re-sent if no AA echo within 3s
    service_discovery_delay_ms: 500

safety:
  link_loss: TBD  # Device behaviour on disconnect not yet measured
  max_level: 10
  off_command: "AA 00 00 00 00 00 55"
  note: >
    Do NOT exceed level 10. Do NOT attempt to disable thermal limits.
    Always implement link-loss fail-safe (heat off or bounded timeout).
    Off must be one tap away in any replacement client.

