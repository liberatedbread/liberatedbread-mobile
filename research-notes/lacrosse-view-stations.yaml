# La Crosse View Wi-Fi Stations — Device Spec (research note)
# VERDICT: DUD for local-only (at-risk). Wi-Fi used solely for cloud push; HA
# core integration is Cloud Polling. No local API, custom server, or LAN
# endpoint exists as of 2026-08-07. Service currently up.
# Sources: home-assistant.io/integrations/lacrosse_view (iot_class Cloud Polling),
# lacrossetechnology.zendesk.com setup doc (account required).

device:
  id: lacrosse-view-stations
  name: La Crosse View Wi-Fi stations (V40A-PRO, V21-WTH, C85845, S81120, etc.)
  manufacturer: La Crosse Technology
  category: weather_station
  safety_class: LOW

transport:
  type: wifi
  local_only: false   # DUD: cloud-only; no LAN interface
  note: >
    Station Wi-Fi pushes only to the La Crosse View cloud. No local web UI,
    no documented LAN API, no custom-server option. HA core integration is
    iot_class: Cloud Polling via the vendor API; account required at setup.

protocol:
  note: no local protocol exists; cloud API only (out of scope)

status:
  apk_acquired: false   # com.lacrosse.technology.lacrosseview fetchable, not needed
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: false
  cloud_dead: false     # service up as of 2026-08; fully cloud-dependent = at-risk
  rating: rejected_dud
  rejection_reason: >
    No local path exists today; only MITM of cloud traffic, which is out of
    scope. Revisit as an RE target if La Crosse View service shuts down.
  references:
    - home-assistant.io/integrations/lacrosse_view
    - lacrossetechnology.zendesk.com/hc/en-us/articles/4405783172123
