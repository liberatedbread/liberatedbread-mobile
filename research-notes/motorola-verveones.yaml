# Motorola VerveOnes / VerveRider / VerveLoop (VerveLife) — Device Spec (research draft)
# Sources: static analysis of com.hubbleconnected.vervelife v2.00.83 (jadx, apk-pure via apkeep)
# APK SHA-256: 7d46fc1df3089c84408ae586ce5060ebbeaa7b54a77b22ec7505c98d5cb3bd36
# App unpublished from Google Play 2024-10-15 (AppBrain); devices made by Binatone/Hubble
# under Motorola license

device:
  id: motorola-verveones
  name: Motorola VerveOnes / VerveOnes+ / VerveOnes ME / VerveRider / VerveLoop
  manufacturer: Binatone / Hubble Connected (Motorola brand license, ended)
  category: audio_earbuds
  safety_class: LOW
  rating: confirmed

transport:
  type: bluetooth_classic
  local_only: true
  cloud_dependency: optional_features_only
  cloud_caveat: >
    Hubble Connect Cloud account used for device-locator/check-in features
    (backend dead/at-risk). Device settings (EQ etc.) are local GAIA/SPP
    commands with no protocol-level auth. Whether the app UI runs without
    login is unverified; a third-party client needs no cloud.

bluetooth_classic:
  chipset_variants:
    csr_models: GAIA over RFCOMM (com.csr.gaia.android.library.GaiaLink)
    airoha_models: vendor SPP (com.airoha.android.lib.physical.spp.AirohaSppController)
  spp_uuids:
    - uuid: "00001101-0000-1000-8000-00805f9b34fb"  # standard SPP (referenced)
      role: control_channel
  profiles: [a2dp_sink, hfp, avrcp, spp, gaia_spp]
  ble_note: BLE also present in app (alerts/locator) — not covered here

protocol:
  names: [Qualcomm GAIA (CSR models), Airoha vendor SPP (later models)]
  framing_reference: research-notes/qualcomm-gaia-audio-ecosystem.yaml
  features_observed:
    - native_eq (NativeEqualizerActivity / NativeEqSettingCard — device-side)
    - device_locator (cloud; dead)
    - account_checkin_gallery (cloud; dead)

status:
  apk_acquired: true
  apk_decompiled: true
  uuids_recovered: true       # SPP 00001101; GAIA library present
  protocol_recovered: partial # transports identified; per-model EQ command table not yet extracted
  community_re: false
  hci_snoop_needed: true      # recommended: map which Verve model uses GAIA vs Airoha
  live_device_validation: false
  open_questions:
    - model-to-chipset mapping (GAIA vs Airoha)
    - does app UI function without Hubble login
    - Hubble backend status (irrelevant to local control)
