site_name: OpenGreenIoT Protocol Docs
site_description: Reverse-engineered IoT device protocol documentation
site_author: Pigs Can Fly Labs LLC
repo_name: PigsCanFlyLabs/opengreeniot-protocol-docs
repo_url: https://github.com/PigsCanFlyLabs/opengreeniot-protocol-docs
copyright: Copyright &copy; 2026 Pigs Can Fly Labs LLC

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

