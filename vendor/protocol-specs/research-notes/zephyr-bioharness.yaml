# Zephyr BioHarness 3 / HxM — Device Spec (research note)
# Sources: vendor HxM Bluetooth API guide (zephyranywhere.com, 2010),
# acquisition press (MassDevice 2014-05-05, Medtronic 2014-06-15),
# community: github.com/roger-/pyzephyr, labstreaminglayer/App-Zephyr

device:
  id: zephyr-bioharness
  name: Zephyr BioHarness 3 / HxM physiological monitor strap
  manufacturer: Zephyr Technology (acquired by Covidien 2014, now Medtronic)
  category: physiological_monitor
  safety_class: LOW  # fitness/research readings; not for clinical diagnosis

transport:
  type: bluetooth_classic
  profile: spp
  local_only: true
  spp:
    uuid: "00001101-0000-1000-8000-00805f9b34fb"
    channel: 1  # standard SPP; verify with sdptool/browse
    serial_params:
      baud: 115200
      data_bits: 8
      parity: none
      stop_bits: 1
    pairing: legacy PIN (1234 reported in community usage)

protocol:
  note: >
    Vendor-published "Bluetooth Data Link" framed binary protocol over SPP.
    Frame: STX (0x02) + message ID + length + payload + CRC.
    General Data Packet (0x20) streams HR, breathing rate, activity (VMU),
    peak acceleration, posture, battery at a configurable rate.
    Waveform messages carry ECG (250 Hz), respiration (~25 Hz) and
    accelerometer (up to 100 Hz) streams. Host can enable/disable message
    types and set reporting rates; device never requires any cloud service.
  message_ids:
    general_data_packet: "0x20"
    # full message map in vendor HxM Bluetooth API guide (2010) — see .md
  implementations:
    - github.com/roger-/pyzephyr          # Python, serial Bluetooth protocol
    - github.com/darkopetrovic/zephyr-bt  # fork
    - github.com/labstreaminglayer/App-Zephyr  # LSL adapter (vendor SDK)

cloud_status:
  cloud_required: false   # never had a cloud dependency
  company_status: >
    Zephyr Technology acquired by Covidien (2014-05), Covidien by Medtronic
    (announced 2014-06, closed 2015). Zephyr Performance Systems persists
    under Medtronic (military/research); consumer line orphaned.

status:
  apk_acquired: false     # no confirmed surviving companion app package id
  apk_decompiled: false
  uuids_recovered: true   # standard SPP UUID; vendor-documented
  protocol_recovered: true  # vendor-published spec + OSS implementations
  hci_snoop_needed: false
  rating: confirmed
