# Samsung Wireless Audio Multiroom (WAM) — Device Spec (research note)
# Radiant360 R1/R3/R5/R7 + WAM soundbars/hubs; line discontinued, app abandoned.
# Local HTTP API on port 55001 fully reverse-engineered and in production use.

device:
  id: samsung-wam-multiroom
  name: Samsung Radiant360 R1/R3/R5/R7, WAM/M-series soundbars, WAM hubs
  manufacturer: Samsung (line discontinued ~2017; Multiroom app abandoned)
  category: network_speaker
  safety_class: LOW

transport:
  type: wifi
  local_only: true

lan:
  discovery:
    - ssdp: upnp MediaRenderer   # speakers are also DLNA renderers
  control:
    protocol: http
    port: 55001
    auth: none
    endpoint_pattern: "/UIC?cmd=<pwron>on</pwron><name><Cmd></name>[<p type=... name=... val=.../>]"

protocol:
  note: >
    200+ UIC commands documented in bacl/WAM_API_DOC (extracted from the
    Samsung Multiroom app). XML-in-URL GET requests; responses XML.
    Poll-only — no event channel; integrations poll state.
  commands:
    power: "SetPower / power check via UIC cmd"
    volume: "SetVolume (val 0-30 scale on R-series)"
    mute: "SetMute"
    play_pause: "SetPlaybackControl"
    input_select: "SetFunc (wifi/bt/aux/hdmi/optical)"
    url_playback: "SetUrlPlayback <url>"
    grouping: "SetSpkGroup family (multiroom join/leave)"
    eq: "SetEQ family"
    tunein_preset: "SetTuneInPreset family"

status:
  apk_acquired: false    # command set already published; app delisted anyway
  apk_decompiled: false
  uuids_recovered: false # n/a — no BLE
  protocol_recovered: true
  hci_snoop_needed: false
  cloud_dead: true       # hardware + app abandoned; local API unaffected
  references:
    - github.com/bacl/WAM_API_DOC
    - github.com/Strixx76/samsungwam (HA custom integration)
    - github.com/krygal/samsung_multiroom
    - npmjs.com/package/samsung-multiroom
