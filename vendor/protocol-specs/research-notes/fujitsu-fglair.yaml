# Fujitsu General FGLair Wi-Fi Modules — Device Spec (research note)
# Ayla Networks LAN API; one-time cloud key extraction, then fully local.
# APK: com.fujitsu.fglair v3.4.2 (APKPure via apkeep 2026-08-07)
# XAPK sha256: 7d73f9475173671dfde267ba6404abeea5440d0421ee20af89a58696ff10208a

device:
  id: fujitsu-fglair
  name: Fujitsu General FGLair WLAN adapters (UTY-TFSXW1/W3 + built-in Smartphone Link); same Ayla platform as HiSense AEH-W4B1/W4E1 modules (Beko/Westinghouse/Winia/Tornado/York)
  manufacturer: Fujitsu General (active; FGLair line being superseded by AIRSTAGE Mobile)
  category: hvac_minisplit_gateway
  safety_class: MEDIUM

transport:
  type: wifi
  local_only: true   # after one-time cloud provisioning + LAN key extraction
  note: >
    Ayla Networks LAN API (community-RE'd by deiger/AirCon). Device opens
    an encrypted session to a LAN control server using a per-device LAN
    key; keys are fetched ONCE from Ayla cloud with app credentials
    (aircon discovery), then the unit can be permanently firewalled from
    the internet. Provisioning itself (Wi-Fi join + account binding)
    requires the FGLair app + Ayla account — no offline path documented.

lan:
  discovery:
    protocol: device-initiated   # unit connects out to the advertised LAN server
    note: server reports its local IP to the unit; units may refuse servers outside their subnet
  control:
    protocol: ayla-lan-encrypted   # terminated by deiger/AirCon; re-exposed as HTTP/MQTT
    properties:
      - t_power (ON/OFF)
      - t_work_mode (FAN/HEAT/COOL/DRY/AUTO)
      - t_temp (setpoint), f_temp_in (ambient)
      - t_fan_speed (AUTO/LOWER/LOW/MEDIUM/HIGH/HIGHER)
      - t_fan_power / t_fan_leftright (louvers), t_sleep, t_eco
      - t_backlight, t_display_power, f_humidity, f_e_* fault flags
    reference: github.com/deiger/AirCon (app code fglair-eu / fglair-us)

protocol:
  note: >
    Ayla LAN API framing + encryption implemented in deiger/AirCon
    (Python). ESPHome port: martinhladil/esphome_fujitsu_ac. Alternative
    local lib: Benas09/FujitsuAC. Not applicable to newer AIRSTAGE Mobile
    adapters (SSID AP-WH\E / AP-WJ\E) — different platform, unresearched.
  commands:
    power: t_power=ON|OFF
    mode: t_work_mode=COOL
    setpoint: t_temp=<F>
    status: property status push over LAN session

status:
  rating: confirmed   # long-lived community implementation (2019- )
  apk_acquired: true  # com.fujitsu.fglair 3.4.2 XAPK, workspace/apks/
  apk_decompiled: false  # unnecessary — LAN protocol already documented by deiger
  protocol_recovered: true
  cloud_dead: false   # Ayla/FGLair cloud alive but FGLair hardware line winding down
  one_time_cloud_required: provisioning + LAN key extraction
  references:
    - github.com/deiger/AirCon (accessed 2026-08-07)
    - fujitsu-general.com/global/products/fglair (accessed 2026-08-07)
    - community.home-assistant.io/t/fujitsu-ac-units-integration-with-ha/572114 (2023-05)
    - github.com/Benas09/FujitsuAC (2025-07)
