# Piaggio Fast Forward gita / gitamini — structured note, 2026-11-07

device:
  id: piaggio-fast-forward-gita
  name: Piaggio Fast Forward gita, gitamini, gitaplus and licensed Mini
  manufacturer: Piaggio Fast Forward (Piaggio Group; active)
  category: cargo_following_robot
  safety_class: HIGH_self_propelled_robot
  hardware_testing: false
  app_version: 1.7.4
  remote_drive_or_start_following_command: not_found
  following: on_robot_stereo_depth_RGB_camera_and_Mini_radar_with_physical_button

advertising:
  service_uuid_16: "9999"
  company_id: "0x083B"
  company_wire_bytes: "3b 08"
  minimum_payload_bytes: 25
  tags:
    "0xa1": serial_private
    "0xa2": cloud_object_id_private
    "0xa3": color
    "0xa4": primary_latch_and_setting_state
    "0xa5": battery_255_unknown
    "0xa6": model
    "0xa7": message_code_BE
    "0xa8": connected_user_private
    "0xa9": checksum_suffix_layout_needs_capture
    "0xaa": odometry_BE
  models: {1: gita, 2: gita-mini, 3: internal_pro, 4: gita-plus, 5: gita-tag, 11: licensed_disney_mini}
  unknown_model_behavior: require_explicit_profile_not_original_fallback

service:
  uuid: 87654321-1234-5678-1234-56789abcdef0
  mtu: 185
  ciphertext_chunk_bytes: 181
  continuation_marker_bytes: 1
  characteristics:
    "87654321-1234-5678-1234-56789abcdef1": authenticated_session_command_write
    "87654321-1234-5678-1234-56789abcdef2": operational_encrypted_command_write
    "87654321-1234-5678-1234-56789abcdef3": plaintext_wifi_notifications
    "87654321-1234-5678-1234-56789abcdef4": per_phone_identity_write
    "87654321-1234-5678-1234-56789abcdef5": phone_ECDH_public_key_write
    "87654321-1234-5678-1234-56789abcdef6": robot_ECDH_public_key_read
    "87654321-1234-5678-1234-56789abcdef7": general_plaintext_notifications
    "87654321-1234-5678-1234-56789abcdef8": version_build_read
    "87654321-1234-5678-1234-56789abcdef9": registration_session_feedback_notifications
    "87654321-1234-5678-1234-56789abcdefa": registration_command_write
    "87654321-1234-5678-1234-56789abcdefb": session_key_exchange_write
  feedback_parser: separate_encrypted_fragmented_not_normal_plaintext

cryptography:
  per_connection:
    curve: secp256k1
    derivation: ECDH_shared_secret_SHA256_split_64_hex_chars_into_two_32_char_halves_hex_decode
    key_bytes: 16
    iv_bytes: 16
    cipher: AES-128-CBC_PKCS7
    plaintext: command_byte + 0x7f + data (10-byte zero-padded when empty)
    transport: raw_ciphertext_not_base64
    authentication_caveat: ECDH_alone_does_not_authenticate_robot
    native_module_name_mismatch_requires_runtime_check: true
  session_credential:
    source: authenticated_cloud_session-keys
    encoding: 64_hex_chars_split_into_AES_key_and_IV
    storage: by_robot_UUID
    reuse: offline_or_age_up_to_7_days_selects_existing_verification
    offline_status: credible_post_registration_candidate_not_unlimited_or_enrollment_proof

commands:
  authentication: 7-9
  wifi: 50-59
  registration_session: 60-68
  speaker_settings_latch: 69-79
  update_version_volume_logs: 80-87
  wifi_remove_ota_smarts: 88-93
  disconnect_activate_ssh: 99-102
  remote_drive: not_found
  wifi_join_data: "<SSID> password <password> inside encrypted command"
  SSH: support_gated_endpoint_plus_encrypted_102_not_offline_backdoor

registration:
  serial: exact_10_character_Code128
  QR_secret: exact_20_character_prefix_pff_single_use
  flow: ECDH_robot_payload_authenticated_gitas_robot_verify_registrations
  serial_only_offline_enrollment: not_established
  secrets_excluded: [QR_secret, bearer_tokens, verification_payloads, session_keys, ECDH_secrets, WiFi_credentials, owner_IDs]

ota:
  mini_and_non_original: V2
  metadata: authenticated_ota-v2-check_and_ota-v2-infos
  commands: {download: 85, install: 80}
  image_downloaded_by: robot_over_WiFi_not_phone
  public_image_obtained: false
  staged_rollback_model_not_proof_of_AB_on_every_component: true

remaining_validation:
  - sanitized_advertisements_and_checksum
  - normal_app_runtime_crypto_sanity
  - preserved_session_offline_reads_and_revocation
  - owner_approved_OTA_download_capture
  - physical_module_and_regulatory_labels
