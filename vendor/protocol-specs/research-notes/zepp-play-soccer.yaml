# Zepp Play Soccer — Structured Note
# APK source: apkeep (apk-pure); com.zepp.soccer 1.6.5

device:
  id: zepp-play-soccer
  name: Zepp Play Soccer (dual calf-sleeve sensor pods)
  manufacturer: Zepp Labs (acquired by Huami/Zepp Health 2018)
  category: sports_sensor
  safety_class: LOW

transport:
  type: ble
  local_only: true
  note: >
    Pods stream to phone over BLE; stats aggregated locally. Stock app may require
    Zepp cloud account at login (servers offline) — local replacement client is
    the liberation path. DFU-over-BLE machinery present in app.

ble:
  advertising:
    name_patterns: []  # TBD
    service_uuids: []  # TBD

  services:
    - uuid: "7f400001-b5a3-f393-e0a9-e50e24dcca9e"
      name: zepp_uart_service
      description: >
        UART-style service using the Nordic UART layout on a custom 7f4000xx base
        (stock Zepp swing-sensor apps use 6e4000xx). Direction of the single
        recovered characteristic TBD.
      characteristics:
        - uuid: "7f400002-b5a3-f393-e0a9-e50e24dcca9e"
          name: uart_char
          description: Recovered literal; role (RX vs TX) TBD

  alternate_services:
    - uuid: "ed742075-c5a6-4475-907a-842f227df703"
      name: unknown_service
      description: Single custom UUID literal in com.zepp.soccer dex; purpose TBD

protocol:
  note: >
    Match stats (kicks, sprint distance, top speed, active time) computed from pod
    IMU data. Frame format TBD — jadx + HCI snoop needed.
  expected_measurements:
    - kick_count
    - sprint_distance
    - top_speed
    - active_time

status:
  apk_acquired: true
  apk_decompiled: false
  uuids_recovered: partial
  protocol_recovered: false
  hci_snoop_needed: true
  cloud_status: shutdown
  sources:
    - https://www.chinamoneynetwork.com/2018/07/27/xiaomis-smartwatch-partner-huami-corp-acquires-us-sport-sensor-firm-zepp
    - https://www.auratidecollective.com/blogs/performance-lab/zepp-tennis-dead-what-still-works-2026
