# Foscam FI89xx / FI98xx legacy IP cameras — Device Spec (research note)
# Company active (foscam.com reachable 2026-08-07); legacy lines unmaintained.
# Local CGI + RTSP fully vendor-documented; zero cloud dependency.

device:
  id: foscam-fi89xx
  name: Foscam FI89xx (VGA MJPEG) and FI98xx (HD H.264) legacy IP cameras
  manufacturer: Shenzhen Foscam Intelligent Technology (active)
  category: ip_camera
  safety_class: LOW  # camera; privacy risk only — see cleartext-auth caveat

transport:
  type: wifi
  local_only: true
  note: >
    Both families are classic LAN webcams: built-in web server, HTTP CGI
    control API, MJPEG (FI89xx) or RTSP H.264 (FI98xx) streaming. No cloud
    account or provisioning step is ever required.

lan:
  discovery:
    - vendor "IP Camera Tool" / Equipment Search Tool (UDP broadcast)
    - DHCP client; default DHCP on (no fixed default IP)
  fi89xx_mjpeg:   # FI8904W-FI8920W era
    http_port: 80
    auth: url params user/pwd or HTTP Basic; default admin / (blank)
    endpoints:
      mjpeg_stream: /videostream.cgi?user=U&pwd=P
      snapshot: /snapshot.cgi?user=U&pwd=P
      ptz: /decoder_control.cgi?command=N&user=U&pwd=P  # 0 up,2 down,4 left,6 right,+1 stop; 94/95 IR on/off
      status: /get_status.cgi
      alarm_config: /set_alarm.cgi
      params: /get_params.cgi
  fi98xx_hd:      # FI9821W/26W/31W, FI9803P/04W/05W era
    http_port: 88  # some models 80
    rtsp_port: 88  # 554 on later firmware
    auth: url params usr/pwd; default admin / (blank), later fw forces change
    endpoints:
      cgi: /cgi-bin/CGIProxy.fcgi?cmd=<CMD>&usr=U&pwd=P  # XML responses
      snapshot: cmd=snapPicture2
      dev_state: cmd=getDevState  # includes motionDetectAlarm field
      ptz: cmd=ptzMoveUp / ptzMoveDown / ptzMoveLeft / ptzMoveRight / ptzStopRun
      motion_config: cmd=setMotionDetectConfig
      rtsp_main: rtsp://IP:88/videoMain
      rtsp_sub: rtsp://IP:88/videoSub
    onvif: most models (WS-Discovery; service port 888 or 8080 varies)

protocol:
  note: >
    Two generations: FI89xx = classic "clone platform" CGI (var-format status,
    decoder_control PTZ) shared with Apexis/EasyN/Wanscam-MJPEG rebadges;
    FI98xx = XML CGI over CGIProxy.fcgi plus RTSP. Both are documented in
    vendor CGI SDK PDFs and implemented by Home Assistant (foscam
    integration, local polling), ZoneMinder, openHAB.
  commands:
    stream_mjpeg: videostream.cgi (FI89xx)
    stream_rtsp: videoMain / videoSub (FI98xx)
    snapshot: snapshot.cgi / snapPicture2
    ptz: decoder_control.cgi?command=N / cmd=ptzMove*
    motion_detect_config: set_alarm.cgi / cmd=setMotionDetectConfig
    ir_led: decoder_control command 94/95 / cmd=setInfraLedConfig

status:
  apk_acquired: false   # not needed — vendor CGI SDK published
  apk_decompiled: false
  uuids_recovered: false  # n/a — Wi-Fi/HTTP, no BLE
  protocol_recovered: true  # vendor-documented + HA/ZoneMinder implementations
  hci_snoop_needed: false
  cloud_dead: false  # company active; cloud optional, not required
  rating: confirmed
  security_notes: >
    Legacy firmware unpatched (multiple published CVEs); cleartext HTTP auth.
    Change default password; isolate on IoT VLAN; never port-forward.
  references:
    - foscam.com/faqs/view.html?id=128 (CGI per model family)
    - FI8918W user manual (default admin/blank) — foscam.es mirror
    - Foscam IPCamera CGI User Guide (HD SDK) — community.jeedom.com mirror
    - home-assistant.io/integrations/foscam (fetched 2026-08-07)
    - wiki.zoneminder.com/Foscam_FI8918W
    - ispyconnect.com/camera/foscam (429 models, updated 2026-06)
