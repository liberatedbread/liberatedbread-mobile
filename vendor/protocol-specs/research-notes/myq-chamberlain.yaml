# Chamberlain/LiftMaster myQ — Device Spec (research note, DUD)
# Vendor ACTIVE and HOSTILE to local interop. No LAN API exists; third-party
# cloud API access deliberately broken late 2023 (HA removed integration in
# 2023.12). Only paths are cloud MITM (out of scope) or hardware rescue
# (ratgdo). Documented as a cautionary dud 2026-08-07.

device:
  id: myq-chamberlain
  name: Chamberlain/LiftMaster/Craftsman myQ WiFi hubs and openers
  manufacturer: Chamberlain Group
  category: garage_door_controller
  safety_class: MEDIUM
  dud: true
  dud_reason: >
    No local API on hubs/openers; vendor actively blocks third-party access
    (HA myQ integration removed 2023.12; ratgdo command blacklist episode
    Nov 2023). Cloud MITM/token scraping is the only software path and is
    out of scope for this repo.

transport:
  type: wifi
  local_only: false
  note: >
    All control flows through Chamberlain cloud (myQ API). No documented or
    discovered LAN endpoint on MYQ-G0301/821LM hubs or WiFi openers.
    2025-manufacture white-learn-button openers reportedly reject all
    non-MyQ wall controls, narrowing even the hardware rescue.

protocol:
  note: none — no local protocol to document
  rescue:
    ratgdo: Security+ 2.0 serial decode, fully local (see ratgdo note)
    dry_contact: pre-2012 Sec+ 1.0 / non-Chamberlain openers accept any relay controller

status:
  apk_acquired: false
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: false
  cloud_dead: false
  rating: dud
  references:
    - home-assistant.io/blog/2023/11/06/removal-of-myq-integration/ (2023-11-06)
    - linustechtips.com/topic/1538922-chamberlain-group-intentionally-breaks-third-party-api-access (2023-11-02)
    - jpk.io/home-automation/local-garage-door-control-ratgdo-home-assistant/ (2026-06-24)
