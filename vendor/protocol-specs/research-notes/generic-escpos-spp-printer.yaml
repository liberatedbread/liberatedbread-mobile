# Generic 58mm ESC/POS SPP thermal printers — Device Spec (research note)
# Zjiang ZJ-5802/5805, Goojprt MTP-II/MTP-3/PT-210, MPT-II and clones.
# No companion app required; protocol is standard ESC/POS.

device:
  id: generic-escpos-spp-printer
  name: Generic 58mm Bluetooth thermal receipt printer (Zjiang/Goojprt/MPT family)
  manufacturer: Shenzhen Zijiang (Zjiang), Goojprt, assorted ODMs
  category: portable_receipt_printer
  safety_class: LOW

transport:
  type: bluetooth_classic
  local_only: true
  alternates: [usb_serial, ble_optional]  # "4.0" units may dual-mode

bluetooth_classic:
  profile: spp
  uuid: "00001101-0000-1000-8000-00805f9b34fb"
  channel: 1
  pairing:
    pin: "0000"  # per Goojprt driver CD; "1234" on some clones
    bonding: legacy_pin, stateless
  discovery:
    name_patterns: ["MTP-2", "MTP-3", "BlueTooth Printer", "Printer001", "POS-58*"]

protocol:
  note: >
    ESC/POS subset over the SPP byte stream. Text (32 col font A at 58mm),
    raster image via GS v 0 (max 384 dots wide), standard init ESC @.
    Many clones lack status readback. Drop-in compatible with
    python-escpos over /dev/rfcomm0; Android alternative: RawBT app.
  commands:
    init: "1B 40"
    raster_image: "1D 76 30 <mode> <xL xH yL yH> <data>"
    feed_cut: "1B 64 <n> / GS V"
  max_raster_width_dots: 384
  chars_per_line: 32

status:
  apk_acquired: false  # deliberately skipped — standard protocol
  apk_decompiled: false
  protocol_recovered: true   # public ESC/POS
  hci_snoop_needed: false
  cloud_dependency: none
  manufacturer_status: >
    Hardware actively manufactured (2026 Alibaba listings); vendor
    apps/drivers are low-quality and safely ignorable.
  references:
    - https://github.com/1rfsNet/GOOJPRT-Printer-Driver
    - https://www.ht-instruments.it/media/filer_public/f0/4e/f04e8540-41bc-46d3-ae45-10e98973ab45/mpt-ii_user_manual.pdf
    - https://github.com/python-escpos/python-escpos/discussions/517
