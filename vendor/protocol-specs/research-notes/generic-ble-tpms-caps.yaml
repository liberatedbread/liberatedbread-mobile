# Generic BLE TPMS cap sensors (SYTPMS / TPMSII / ITPMS) — research note
# Vendor-anonymous hardware, orphaned by design; advert format fully decoded by community.

device:
  id: generic-ble-tpms-caps
  name: Generic BLE TPMS cap sensors (SYTPMS / TPMSII / ITPMS K / LYTPMS / Michelin TMS)
  manufacturer: various (unbranded Chinese ODMs)
  category: vehicle_tpms
  safety_class: MEDIUM  # tire-pressure monitoring; read-only

transport:
  type: ble
  local_only: true

ble:
  advertising:
    name_patterns:
      - "BR"        # Type B (SYTPMS app) sensors advertise short name "BR"
    service_uuids:
      - "0x27a5"    # 16-bit service UUID in Type B adverts
  services: []  # passive broadcasters — no GATT connection required or used by the app
  advert_format_type_b:
    layout: "SSBBTTPPPPCCCC (7-byte manufacturer data)"
    fields:
      SS: status bitfield (alarm zero-pressure / rotating / standing 15min /
        begin-rotating / pressure-trend bits)
      BB: battery, 1/10 V
      TT: temperature, deg C
      PPPP: absolute pressure, 1/10 psi
      CCCC: checksum
    example: "0303a527 03084252 08ff281d130105a376  (2.9 V, 19 C, 11.6 psi)"
    source: https://github.com/andi38/TPMS

protocol:
  note: >
    Fully passive: sensors broadcast on pressure change and every couple of
    minutes while pressurized (faster when rotating). Phone app only scans —
    static triage of com.bekubee.sytpms v2.1 found no GATT UUIDs at all.
    Four sensor/app families exist (TPMSII, SYTPMS, Michelin TMS, ITPMS/LYTPMS)
    with at least 3-4 advert layouts; all handled by bkbilly/tpms_ble.
  expected_measurements:
    - tire_pressure
    - tire_temperature
    - sensor_battery
    - status_flags
  references:
    - https://github.com/andi38/TPMS
    - https://github.com/bkbilly/tpms_ble
    - https://github.com/ra6070/BLE-TPMS
    - https://github.com/omadon/TPMS_BLE_BR

status:
  apk_acquired: true
  apk_decompiled: false  # strings-only triage sufficient (passive protocol)
  uuids_recovered: true  # advert service UUID 0x27a5; no GATT services exist
  protocol_recovered: true   # via prior art
  hci_snoop_needed: false
  cloud_dependency: none
  vendor_risk: n/a  # already orphaned-by-design; apps are disposable wrappers

apk:
  - package: com.bekubee.sytpms
    version: "2.1"
    version_code: 14
    sha256: 2177b5752d1bb2a4d4187fb7ca6c127799560aab261cd2e4ef24f8c6dd2a7ec2
    source: apkeep apk-pure (XAPK)
    note: SYTPMS app; TPMSII / ITPMS / LYTPMS package ids not yet captured
