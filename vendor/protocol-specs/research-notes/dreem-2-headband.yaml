# Dreem 2 EEG Sleep Headband — Research Note (structured)

device:
  id: dreem-2-headband
  name: Dreem 2 EEG sleep headband
  manufacturer: Rythm / Dreem (Paris); R&D acquired by Beacon Biosignals 2023-07
  category: sleep_tracker_eeg
  safety_class: MODERATE  # EEG wearable with bone-conduction audio stimulation

abandonment:
  status: abandoned_consumer
  evidence:
    - url: https://beacon.bio/press-releases/beacon-biosignals-acquires-dreem-launches-at-home-sleep-monitoring-services-for-clinical-trials/
      date: "2023-07-11"
      note: Beacon Biosignals acquires Dreem R&D; pivot to B2B clinical trials
    - url: https://businessmodelcanvastemplate.com/blogs/owners/dreem-who-owns
      date: "2024-08-09"
      note: Consumer accounts deactivated post-acquisition (secondary source)
    - url: https://liveworksleep.com/dreem-headband-discontinued-alternatives/
      date: "2026-05-12"
      note: Consumer product dead; hardware line survives as clinical Dreem 3S / Waveband (FDA 510(k) K223539)

transport:
  type: ble
  local_only: true
  notes: >
    BLE peripheral; pairing and recording offload/streaming over BLE.
    Cloud used for sleep staging, CBT-i programs, account sync.
    Open question: whether first-time activation requires the (dead) cloud.

ble:
  advertising:
    name_patterns: []  # TBD
    service_uuids: []  # TBD — app unavailable; check prior-art repo
  services: []

protocol:
  note: >
    Real-time EEG can be logged from the headband over BLE per prior art
    (majorinput.co.uk 2022-02, scripts on GitHub). UUIDs/frame format not yet
    catalogued here.

prior_art:
  - url: https://www.majorinput.co.uk/post/a-closer-look-at-the-dreem-eeg-headband
    date: "2022-02-18"
    note: Real-time low-quality EEG logging from Dreem over BLE; GitHub scripts linked
  - url: https://wearipedia.readthedocs.io/en/latest/notebooks/dreem_headband_3.html
    date: "2022-06-14"
    note: Cloud-API data extraction (deprecated with consumer cloud; reference only)

status:
  apk_acquired: false  # com.rythm.dreem removed from Play; absent from apk-pure
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: true
  difficulty: hard  # App + account infrastructure gone; start from prior-art scripts
