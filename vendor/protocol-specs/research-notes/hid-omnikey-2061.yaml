# HID OMNIKEY 2061 Bluetooth — Device Spec
# No companion app — desktop PC/SC driver only
# Discontinued: HID Global product page notice (accessed 2026-08)

device:
  id: hid-omnikey-2061
  name: HID OMNIKEY 2061 Bluetooth contact smart card reader
  manufacturer: HID Global (ASSA ABLOY)
  category: smart_card_reader
  safety_class: MEDIUM  # Authentication/credential device; mishandled APDU
                        # sequences can lock cards (PIN retry counters)

transport:
  type: bluetooth_classic
  local_only: true
  profiles: [SPP]  # hypothesis — virtual-COM style link; SDP record not yet captured
  fallback: usb    # USB mode may enumerate as standard CCID (verify — would be trivial path)

bluetooth_classic:
  link_encryption: "128-bit (vendor claim; layer TBD)"
  spp_uuid: null   # TBD — capture SDP records on first pairing
  pairing:
    pin_protected: unknown

protocol:
  note: >
    Smart-card APDU tunneling over the BT link, presented on Windows as a
    virtual PC/SC reader via vendor driver over a BT COM port. ISO 7816-3
    T=0/T=1 card side; EMV 2000 Level 1. Over-the-air framing undocumented;
    expected to be a thin wrapper given the virtual-COM driver design.
    No public open-source BT driver found; USB fallback may be standard CCID.
  known_commands: []  # TBD

status:
  apk_acquired: false   # no mobile app exists (desktop driver only)
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: true
  product_status: discontinued  # hidglobal.com notice; resellers: EOL, no replacement
  cloud_dependency: none  # device never had a cloud component
  reference: >
    hidglobal.com/products/2061; CardLogix datasheet mirror;
    usmartcards.com EOL listing
