protocol:
  note: >
    Plain GATT read/write/notify via queued commands (GattManager.java).
    Write semantics: set_program_number / set_treatment_time configure a session,
    increment/decrement/zero_channel adjust intensity; state arrives on notify
    characteristics. Byte-level value encodings TBD — inspect
    bluetooth/device/PulseReliefDevice.java handlers or HCI snoop.

