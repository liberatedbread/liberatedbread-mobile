protocol:
  note: >
    CITYSPORTS pads are "compatible with most Bluetooth Smart mobile devices"
    (manual), the hallmark of the FitShow white-label platform. The protocol
    is already documented in open code: qdomyos-zwift's fitshowtreadmill
    driver implements speed AND incline control for FitShow treadmills
    (QZ Equipment Compatibility wiki). No new RE needed for FitShow-based
    units; confirm per-SKU platform first (some CITYSPORTS models may use
    other controller boards). The FitShow app APK (v5.5.2) is acquired but
    obfuscated; QZ source is the authoritative reference.
  commands: TBD  # available in QZ fitshowtreadmill driver

cloud:
  app_requires_account: unknown
  vendor: FitShow (Xiamen) white-label platform
  risk: platform/app disappearance strands programs+stats; remote keeps basic control

status:
  apk_acquired: true   # com.fitshow v5.5.2
  apk_decompiled: true # triage jadx pass; obfuscated, UUIDs not extracted (unnecessary)
  uuids_recovered: false
  protocol_recovered: true  # via QZ fitshowtreadmill (open source), speed+incline confirmed on wiki
  hci_snoop_needed: false   # only for per-SKU platform confirmation
