# ZOMM Wireless Leash — Device Spec
# APK source: apkeep (apk-pure), com.zomm v2.0.16
# APK SHA-256: 91de8877c15d017303e6b917506e53eee50cb917c72b06b8fecaa44ee4edb104
# Company dead (shut down 2018; site dark since 2015)

device:
  id: zomm-wireless-leash
  name: ZOMM Wireless Leash
  manufacturer: ZOMM LLC (defunct 2018)
  category: key_finder_proximity_alarm
  safety_class: LOW  # had an emergency-call (panic) feature; never rely on it

transport:
  type: bluetooth_classic
  local_only: true
  cloud_dependency_note: >
    Historical one-time config via My.ZOMM.com web account (dead service).
    Core leash alarm / speakerphone / finder functions are fully local BT.
    Advanced reconfiguration requires the local RFCOMM protocol below.

bluetooth_classic:
  profiles: [hfp_1_5, hsp, spp]
  device_side: hands_free_unit   # pairs to phones as a headset/speakerphone
  spp:
    - uuid: "5a4f4d4d-5f41-4e44-524f-49445f534543"
      name: zomm_android_sec
      description: Custom RFCOMM channel used by myZOMM Android app (ASCII "ZOMM_ANDROID_SEC")
    - uuid: "00001101-0000-1000-8000-00805f9b34fb"
      name: standard_spp
      description: App also listens on standard SPP UUID (server socket)
  pairing:
    pin: "0000"   # typical for HFP accessories of the era; JustWorks on SSP hosts
    enter_pairing_mode: "From off, hold Z button ~9 s (two beeps, side lights flash)"
    name_patterns: ["ZOMM"]

protocol:
  framing: hfp_at_commands   # app emulates HFP Audio Gateway with canned responses
  vendor_extensions:
    version_query: "AT+ZOMM?"
    config_read: "\r\n+ZOMM:\r\n"
    response_prefix: "+ZOMM:"
  hfp_slc_canned_strings: ["+BRSF: 99", "+CIND:", "+CIEV: 5,4"]
  service_ids:
    0: reserved
    1: proximity
    2: telephony
    3: physical_activity
    4: temperature
    5: battery
    6: emergency
    -2: diagnostic
  value_opcodes:
    64: get_request
    65: get_confirm
    66: set_request
    67: set_confirm
    68: indication
  value_ids:
    1: battery_state
    2: battery_level
    3: alerting_state_or_config_param
  immediate_alert_values:
    0: no_alert
    1: leash
    2: panic
    3: chirp
    4: silent
    5: silent_leash
  feature_bits:   # PSKEY_FEATURES = 11
    128: leash
    64: leash_vibrate
    32: leash_audio
    16: leash_lights
    2048: panic
  pskeys:
    8: ecall_number
    11: features
    16: device_name
    19: volumes
  open_items: >
    Binary frame layout for value get/set PDUs not yet traced — follow
    ZBluetooth.write() callers in the DEX or capture one HCI snoop.

status:
  apk_acquired: true
  apk_decompiled: true
  uuids_recovered: true      # custom SPP UUID + standard SPP
  protocol_recovered: partial # AT/vendor commands + service/value tables; frame layout TBD
  hci_snoop_needed: true      # to confirm frame layout end-to-end
