device:
  id: earin-m1
  name: Earin M-1 / M-2 true-wireless earbuds
  manufacturer: Earin AB (acquired by i.am+ 2018-01; company dissolved ~2022)
  category: hearable
  safety_class: LOW  # consumer audio; in-ear volume caution

transport:
  type: ble
  local_only: true  # no account, no cloud; single-purpose config app

ble:
  advertising:
    name_patterns: []  # TBD — "EARIN" likely; not confirmed statically
    service_uuids: []  # TBD — CAP service UUID may be advertised

  services:
    - uuid: "be7386e3-8627-cf85-d743-dab853c7da70"
      name: cap_service
      description: Earin proprietary CAP protocol service (CapUuids.java)
      characteristics:
        - uuid: "19df2d7b-c4d0-47ff-a8f4-61173f363a42"
          name: cap_requests
          properties: [write]
        - uuid: "619a19cb-64d4-4728-81f4-3684aa7bcc66"
          name: cap_events
          properties: [notify]
        - uuid: "c40a47f8-b5fb-462f-b259-84b65b02aa57"
          name: cap_upgrade
          description: firmware upgrade / DFU channel

  standard_services:
    - uuid: "00002902-0000-1000-8000-00805f9b34fb"
      name: cccd  # descriptor referenced in app

protocol:
  note: >
    CAP is a request/response GATT protocol: app writes command strings to
    cap_requests and receives responses/events on cap_events; CapProtocol.java
    matches responses by command-string prefix. Commands cover bass boost, L/R
    balance, gain, battery readout, custom name. Command vocabulary not yet
    extracted but present in cleartext in com.earin.earin.communication.cap.
  cloud_required: false

status:
  apk_acquired: true   # com.earin.earin v1.0.19 (vc 100019); Aptoide also has 1.0.9
  apk_decompiled: true
  uuids_recovered: true   # complete CAP service map
  protocol_recovered: false  # command strings TBD (decompile CapProtocol)
  hci_snoop_needed: false  # decompile likely suffices
  prior_art: none_found
  company_status: >
    acquired by i.am+ 2018-01 (Digital Trends); brand dissolved, last social post
    2022-05-22 (Head-Fi, captured 2025-05-09)
  open_questions:
