# Zepp Swing Sensors (Baseball / Golf / Tennis) — Structured Note
# APK source: apkeep (apk-pure); packages com.zepp.baseball 3.4.3, com.zepp.zgolf 4.4.5, com.zepp.ztennis 2.2.1

device:
  id: zepp-swing-sensors
  name: Zepp 1 / Zepp 2 multi-sport swing sensor (Baseball, Golf, Tennis)
  manufacturer: Zepp Labs (acquired by Huami/Zepp Health 2018)
  category: sports_sensor
  safety_class: LOW  # fitness telemetry only, no actuation

transport:
  type: ble
  local_only: true
  note: >
    Sensor streams swing data over BLE; capture and 3D analysis are local to the
    app. Stock apps historically required a Zepp cloud account at login; those
    servers are offline, so a local replacement client is the viable path.
    Sensor also records standalone (offline mode) per official user guide.

ble:
  advertising:
    name_patterns: []  # TBD — likely "ZEPP"-prefixed; needs nRF Connect scan
    service_uuids: []  # TBD

  services:
    - uuid: "d44bc439-abfd-45a2-b575-925416129600"
      name: zepp_sensor_service
      description: >
        Suspected primary Zepp sensor GATT service (single UUID literal found in
        com.zepp.baseball / com.zepp.zgolf dex). Characteristic UUIDs appear to be
        derived from this base in code — needs jadx pass or HCI snoop to enumerate.
      confirmed: false

  alternate_services:
    - uuid: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
      name: nordic_uart_service
      description: Nordic UART — present in app; likely DFU/firmware channel
      characteristics:
        - uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
          name: uart_rx
        # 6e400003 TX not seen as literal in these APKs but standard for the service

  standard_services:
    - uuid: "00002902-0000-1000-8000-00805f9b34fb"
      name: cccd
    - uuid: "00001101-0000-1000-8000-00805f9b34fb"
      name: spp_classic
      note: Classic SPP referenced — Zepp 1 with Zepp Tennis Classic app may use BR/EDR SPP

protocol:
  note: >
    BLE handled in Java package com.zepp.ble (ACTION_GATT_* broadcast pattern,
    connectGatt, service discovery, CCCD notify enable). Swing metrics
    (club/bat speed, tempo, plane, attack angle) computed on-device/in-app by
    native code (avgAttackAngle etc. observed). Command frame format TBD.
  expected_measurements:
    - swing_3d_trajectory
    - club_or_bat_speed
    - tempo
    - attack_angle
    - shot_classification (tennis: forehand/backhand/serve/smash, spin)

status:
  apk_acquired: true
  apk_decompiled: false  # strings-level triage only; jadx pass on com.zepp.ble pending
  uuids_recovered: partial  # service base + Nordic UART; characteristics TBD
  protocol_recovered: false
  hci_snoop_needed: true
  cloud_status: shutdown  # sport-sensor apps infra offline; company pivoted to wearables
  sources:
    - https://www.chinamoneynetwork.com/2018/07/27/xiaomis-smartwatch-partner-huami-corp-acquires-us-sport-sensor-firm-zepp
    - https://www.auratidecollective.com/blogs/performance-lab/zepp-tennis-dead-what-still-works-2026
    - https://images-na.ssl-images-amazon.com/images/I/A1-u5qzL0HS.pdf
