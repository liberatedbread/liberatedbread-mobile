# Microchip RN-41/RN-42 (BlueSMiRF / Bluetooth Mate) — Device Spec
# No companion app — AT-command configuration over serial/SPP
# EOL: Microchip PCN MFOL-24SJQF382 (2022-04-27)

device:
  id: rn42-spp-serial-module
  name: Microchip (Roving Networks) RN-41 / RN-42 Bluetooth SPP module
  manufacturer: Microchip Technology (acquired Roving Networks 2012)
  category: bt_serial_adapter_module
  safety_class: NONE
  notes: >
    Also sold as SparkFun BlueSMiRF Gold/Silver/HID, Bluetooth Mate,
    Parallax RN-42 breakout, and embedded in third-party industrial gear.

transport:
  type: bluetooth_classic
  local_only: true
  profiles: [SPP, HID]  # HID only with RN-42-HID firmware variant

bluetooth_classic:
  version: "2.1 + EDR"
  radio: Class 1 (RN-41) / Class 2 (RN-42)
  spp_uuid: "00001101-0000-1000-8000-00805f9b34fb"
  pairing:
    pin_protected: true
    default_pin: "1234"
  discovery:
    name_patterns: ["RN42-*", "RNBT-*", "BlueRadios*", "FireFly-*"]  # firmware-dependent

protocol:
  note: >
    Transparent serial bridge: whatever the host writes to the SPP channel
    comes out the module's UART and vice versa. Module configuration uses the
    Roving Networks AT-style command set: enter command mode with "$$$"
    (guard-time), exit with "---". Key commands: SM,0/1/2 (slave/master/auto),
    SN,<name> (friendly name), SP,<pin> (PIN), SU,<baud> (UART baud),
    D/E/G (basic/extended settings dumps), R,1 (reboot), SF,1 (factory reset).
  command_mode:
    enter: "$$$"
    exit: "---"
    response_prompt: "CMD"  # module replies CMD on entry, END on exit
  defaults:
    uart_baud: 115200
    pin: "1234"

status:
  apk_acquired: false   # no companion app exists (not applicable)
  apk_decompiled: false
  uuids_recovered: true  # standard SPP UUID
  protocol_recovered: true  # fully documented by vendor AT manual (mirrored)
  hci_snoop_needed: false
  product_status: end_of_life  # PCN MFOL-24SJQF382, 2022-04-27; breakouts retired
  cloud_dependency: none
  reference: >
    Microchip PCN (mm.digikey.com mirror); github.com/sparkfun/BlueSMiRF;
    Roving Networks Bluetooth Advanced User's Guide (mirrored in SparkFun docs)
