# Amazon Echo Button — Device Research Note (structured)
# No companion app exists (voice-paired Alexa Gadget) — APK not applicable
# Key source: mpetroff.net teardown (2017) — BLE HID gamepad, Cypress CYW20735

device:
  id: amazon-echo-button
  name: Amazon Echo Button (Alexa Gadget game button)
  manufacturer: Amazon (discontinued)
  category: ble_button
  safety_class: LOW

transport:
  type: ble
  local_only: true
  cloud_note: >
    Amazon-intended use requires an Echo speaker (cloud-dependent, discontinued
    product line). But the device natively advertises as a standard BLE HID
    gamepad and pairs directly with a computer — local use needs no Amazon
    account or Echo at all (confirmed by teardown author).

ble:
  advertising:
    name_patterns: ["^EchoBtn"]  # e.g. "EchoBtn2V8.3"; trailing chars per-unit/fw
    service_uuids: []            # TBD — HID 0x1812 expected, not yet enumerated
  services:
    - uuid: "00001812-0000-1000-8000-00805f9b34fb"
      name: hid_over_gatt
      status: hypothesis  # inferred from "pairs as a BLE gamepad"; GATT dump TBD
      description: Button presses as HID input reports; LED control channel unknown
  hardware:
    soc: Cypress CYW20735
    debug: SWD via Tag-Connect test points inside battery compartment
      (TMF2=SWDIO, TMF9=SWCLK, TMF10=GND, TMF11=RESET, TMF12=VCC, TMF22=SWO)
    extras: 3x RGB LED (4th footprint unpopulated), U.FL antenna footprint

protocol:
  note: >
    Acts as BLE HID gamepad per mpetroff teardown. Input report mapping and
    any LED-output report/characteristic are unmapped — needs one GATT/HID
    descriptor dump from a paired unit. Firmware reflash via SWD is the
    fallback for full control.

status:
  apk_acquired: false   # not applicable — no companion app ever existed
  apk_decompiled: false
  uuids_recovered: false  # only the advertised name prefix is documented
  protocol_recovered: false
  hci_snoop_needed: false  # plain GATT dump from a paired unit suffices
  hardware_in_hand_needed: true
  references:
    - mpetroff.net/2017/12/amazon-echo-button-teardown/
