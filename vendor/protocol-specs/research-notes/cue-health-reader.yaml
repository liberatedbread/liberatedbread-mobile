device:
  id: cue-health-reader
  name: Cue Health Monitoring System (Cue Reader)
  manufacturer: Cue Health (shut down 2024-05-22; EUAs revoked 2024-10)
  category: molecular_diagnostic_reader
  safety_class: HIGH  # Diagnostic results; documented result-forgery exploit; cartridges recalled

transport:
  type: ble
  local_only: true  # Reader<->app is local BLE+Protobuf; cloud was accounts/proctoring/tamper-checks only
  caveat: single-use test cartridges are recalled and unobtainable — device cannot run a real assay

cloud_status:
  state: dead
  evidence:
    - "FDA warning not to use tests, 2024-05-14 (medicaldevice-network.com)"
    - "Company shut down, all staff laid off, 2024-05-22 (STAT, MassDevice)"
    - "Class II recall, EUAs revoked, app remotely disabled, 2024-10-17 (MedTech Dive)"
    - "com.cuehealth.healthapp 404 on Google Play (checked 2026-08-03)"

