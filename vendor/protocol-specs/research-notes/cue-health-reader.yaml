    note: CSR/Qualcomm OTA UUID family (…-0002a5d5c51b) present in DEX strings

protocol:
  note: >
    BLE link carries Protobuf-framed messages. WithSecure (Ken Gannon, 2022) showed the
    result block ends "10 02" (positive) / "10 03" (negative) and demonstrated a bit-flip
    forgery; Cue's fix was server-side checks, so the on-device protocol is the local
    pre-fix one. Full message set not yet published — jadx the APK for the .proto field
    numbers and GATT mapping.
  encoding: protobuf

prior_art:
