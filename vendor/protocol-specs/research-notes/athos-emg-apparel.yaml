# Athos EMG Smart Apparel — Research Note
# Status: hypothesis — company out of business, no app binary obtainable anywhere
# Company: Athos / Mad Apparel Inc. — PitchBook status "Out of Business" (accessed 2026-08-04)

device:
  id: athos-emg-apparel
  name: Athos Smart Compression Shirt + Shorts (Core module)
  manufacturer: Athos (Mad Apparel Inc.)
  category: smart_clothing_emg
  safety_class: LOW  # passive sEMG/HR sensing only; fitness-grade, not diagnostic

transport:
  type: ble
  local_only: true  # sensor -> Core -> BLE -> phone real-time view; cloud only for sync/history

company_status:
  status: out_of_business
  evidence:
    - "PitchBook profile lists Athos as 'Out of Business' (accessed 2026-08-04): pitchbook.com/profiles/company/56534-95"
    - "iOS app delisted — absent from App Store search (iTunes Search API, 2026-08-04)"
    - "Unverified claim of cloud shutdown Q2 2022 (low-quality Alibaba product-insight article)"
  pivots: "2017 rebrand narrowed to elite teams (Sports Business Journal 2017-04); consumer line abandoned"

ble:
  advertising:
    name_patterns: []  # TBD — no public capture; "Athos" / "Core" speculative
    service_uuids: []  # TBD — needs hardware + nRF Connect scan
  services: []  # TBD — expect custom high-throughput streaming service for ~16ch sEMG @ ~200 Hz + HR + respiration
  notes: >
    Garments carry woven sEMG electrodes (16 shirt / 8 shorts per secondary
    sources) plus heart-rate and breathing sensors; a snap-in Core module
    digitizes and streams over Bluetooth. A 2015 wt-obk.wearable-technologies.com
    article's claim that the Core is "a wi-fi type device" is uncorroborated and
    likely an error for "wireless".

app:
  android: null  # iOS-only for product's whole life (Digital Trends 2022-04, Reviewed.com, HowStuffWorks 2015); Android "planned" but never evidenced
  ios:
    bundle_id: null  # unknown — delisted, not preserved in indexes
    still_listed: false  # verified via iTunes Search API 2026-08-04

protocol:
  note: >
    No public protocol information and no community RE. Real-time Live View
    muscle maps imply continuous notify streaming from the Core. Whether the
    Core streams unauthenticated or requires an app handshake/calibration
    exchange is the pivotal unknown for RE difficulty.
  expected_channels:
    - emg_stream_notify      # multi-channel sEMG, ~200 Hz aggregate
    - heart_rate_notify      # possibly standard 0x180D
    - respiration_notify
    - control_write          # start/stop/calibration?

status:
  apk_acquired: false   # no Android app ever existed
  ipa_available: false  # iOS app delisted; only owner-device recovery
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  hci_snoop_needed: true  # requires surviving hardware; no app to drive it with
  difficulty: VERY_HARD  # greenfield RE, no binary, no captures, rare hardware
  verdict: dead_app_only  # local BLE transport but no obtainable client; RE-only path
