# Nuheara IQbuds family — Device Research Note
# APK source: apkeep (apk-pure), fetched 2026-08-03
# XAPK SHA-256: 11f4457c92d8005ad9ff0e9bddd24c79c886154d8d23cb1f4d4b835db5944d6f

device:
  id: nuheara-iqbuds
  name: Nuheara IQbuds / IQbuds Boost / IQbuds2 MAX (+ IQstream TV accessory)
  manufacturer: Nuheara Limited (voluntary administration 2024-08-07; ASX-delisted)
  category: hearable  # PSAP hearing-enhancement earbuds
  safety_class: MODERATE  # audiogram-driven in-ear amplification; hearing-adjacent

transport:
  # IMPORTANT: bud control is Qualcomm GAIA over Bluetooth Classic SPP, NOT BLE GATT.
  # BLE in the app is used only by the IQstream TV accessory.
  type: bluetooth_classic_spp_gaia  # buds; BLE for IQstream accessory only
  local_only: true

bluetooth_classic:
  protocol: qualcomm_gaia
  uuids:
    - uuid: "00001101-0000-1000-8000-00805f9b34fb"
      name: spp
    - uuid: "00001107-d102-11e1-9b23-00025b00a5a5"
      name: gaia_service  # from com.nuheara.gaialibrary.GaiaLink
  device_name_prefix: "IQbuds"  # IQBudsScanner.java; names: iqbuds/boost/max/2max
  notes: >
    Vendor command layer in com.nuheara.iqbudsapp.communication (NuhearaCommands,
    NuhearaPacket, NuhearaPayloadParser; payloads: AudiogramDataPayload, LiveEQPayload,
    LiveBasicPayload, LocationPayload, ProfilePayload, TapTouchItemPayload,
    FavouritePayload). GAIA itself is publicly documented by Qualcomm with
    open-source host implementations available.

ble:
  advertising:
    name_patterns: ["IQstream"]  # accessory only; buds pair via classic BT name "IQbuds*"
    service_uuids: ["7cb85d00-15cc-48a2-ad50-3c59eb3a785d"]
  services:
    - uuid: "7cb85d00-15cc-48a2-ad50-3c59eb3a785d"
      name: iqstream_service  # IQstream TV audio accessory
      characteristics:
        - uuid: "7cb85d01-15cc-48a2-ad50-3c59eb3a785d"
          name: audio_status
        - uuid: "7cb85d02-15cc-48a2-ad50-3c59eb3a785d"
          name: device_link_info
        - uuid: "7cb85d05-15cc-48a2-ad50-3c59eb3a785d"
          name: statistics
    - uuid: "35770300-5b07-48a8-80ce-a0ba81144276"
      name: iqstream_dfu_service
      characteristics:
        - uuid: "35770301-5b07-48a8-80ce-a0ba81144276"
          name: dfu_data_request
        - uuid: "35770302-5b07-48a8-80ce-a0ba81144276"
          name: dfu_data_response
  standard_services:
    - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
      name: battery  # 2A19 referenced in app

protocol:
  note: >
    Buds: GAIA vendor commands (map in NuhearaCommands.java — not yet extracted).
    IQstream: simple GATT reads/writes on the 7cb85d0x family.
    No cloud in the device-control path; account/registration optional.
  cloud_required: false

status:
  apk_acquired: true   # com.nuheara.iqbudsapp v3.3.5 (vc 967), XAPK
  apk_decompiled: true
  uuids_recovered: true   # GAIA UUIDs + IQstream BLE services
  protocol_recovered: false  # GAIA vendor command map TBD (decompile NuhearaCommands)
  hci_snoop_needed: false  # classic SPP — use RFCOMM capture instead of BLE snoop
  live_scan_needed: true   # confirm whether IQbuds2 MAX also exposes BLE control
  prior_art: Qualcomm GAIA public docs + open-source GAIA hosts; no Nuheara-specific RE found
  company_status: >
    ASX suspension 2024-03-01; KPMG voluntary administrators appointed 2024-08-07;
    delisted July 2024; IQbuds2 MAX discontinued (Hearing Tracker 2025-08-22)
