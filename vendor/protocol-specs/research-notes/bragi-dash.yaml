protocol:
  note: >
    Config and sensor control flow through DATA_EXCHANGE: app writes device-state
    requests to DATA_REQUEST/DATA_WRITE and receives DATA_AVAILABLE notifications.
    Device-state IDs enumerated in com.bragi.a.c.c (NAME, USER_CONFIGURATION,
    VOLUMES_AND_CONTROLS, EQUALIZER, ACTIVITY_STATE, ACTIVITY_MEASUREMENT,
    HEAD_GESTURE, TOUCH_LOCK, DES_TUNNEL, UI_EVENT, EXTERNAL_ASSISTANT_ACTION,
    MIMI_CONFIGURATION, MIMI_COEFFICIENTS, FEATURE_FLAGS, ...). Payload byte
    framing not yet recovered — needs HCI snoop. HR/RSC use standard profiles.
  payload_framing: TBD
  cloud_required: false  # iTranslate/Alexa/account sync optional

