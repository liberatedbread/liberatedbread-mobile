# Boosted Boards — Research Note
# Static analysis of com.boostedboards.android v1.4.5 (2019-12-04, last release)
# APK source: apkeep (apk-pure mirror); Play Store listing removed (company liquidated 2020)
# APK SHA-256: 2c0deabe7ce1a5ea66500112d63513a71e52d0b361619e9bc528cecb0daaefdd

device:
  id: boosted-boards
  name: Boosted Boards (V1–V3, Mini S/X, Plus, Stealth) + Boosted Rev scooter
  manufacturer: Boosted Inc. (liquidated 2020; brand now with Boosted USA reseller)
  category: electric_skateboard
  safety_class: HIGH  # 20+ mph vehicle; mode/speed writes affect ride behavior

transport:
  type: ble
  local_only: true  # Riding + all board-facing app functions are local GATT; dead cloud
                    # only handled account, ride sync, leaderboard, firmware hosting

ble:
  advertising:
    name_patterns: ["Boosted"]  # inferred; app scans by service UUID, not name
    service_uuids:
      - "7dc55a86-c61f-11e5-9912-ba0be0483c18"  # V2/V3 boards (scan filter, f.java)
      - "da2b84f1-6279-48de-bdc0-afbea0226079"  # V1 boards (scan filter, f.java)

  services:
    - uuid: "7dc55a86-c61f-11e5-9912-ba0be0483c18"
      name: boosted_board_v2_service
      description: Primary service for V2/V3 boards (and likely Boosted Rev)
      characteristics:
        - {uuid: "7dc5bb39-c61f-11e5-9912-ba0be0483c18", name: vehicle_id_name, properties: [read, write]}
        - {uuid: "7dc59643-c61f-11e5-9912-ba0be0483c18", name: vehicle_model, properties: [read]}
        - {uuid: "7dc55dec-c61f-11e5-9912-ba0be0483c18", name: vehicle_modes_count, properties: [read]}
        - {uuid: "7dc55f22-c61f-11e5-9912-ba0be0483c18", name: vehicle_mode, properties: [read, write, notify]}
        - {uuid: "7dc56594-c61f-11e5-9912-ba0be0483c18", name: vehicle_odometer, properties: [read, notify]}
        - {uuid: "7dc56b34-c61f-11e5-9912-ba0be0483c18", name: vehicle_speed, properties: [read, notify]}
        - {uuid: "7dc56bfc-c61f-11e5-9912-ba0be0483c18", name: vehicle_power, properties: [read]}
        - {uuid: "7dc5c19d-c61f-11e5-9912-ba0be0483c18", name: vehicle_units, properties: [read, write]}
        - {uuid: "7dc5c201-c61f-11e5-9912-ba0be0483c18", name: vehicle_md_serial, properties: [read]}
        - {uuid: "7dc5c202-c61f-11e5-9912-ba0be0483c18", name: vehicle_md_fw_version, properties: [read]}
        - {uuid: "65a8f834-c61f-11e5-9912-ba0be0483c18", name: battery_id, properties: [read]}
        - {uuid: "65a8f833-c61f-11e5-9912-ba0be0483c18", name: battery_fw, properties: [read]}
        - {uuid: "65a8eeae-c61f-11e5-9912-ba0be0483c18", name: battery_remaining, properties: [read, notify]}
        - {uuid: "65a8f3c2-c61f-11e5-9912-ba0be0483c18", name: battery_capacity, properties: [read]}
        - {uuid: "65a8f5d4-c61f-11e5-9912-ba0be0483c18", name: battery_charging, properties: [read, notify]}
        - {uuid: "ea32b761-d410-42e2-848a-1218201468fc", name: lights_default_mode, properties: [read, write]}
        - {uuid: "ea32dcac-d410-42e2-848a-1218201468fc", name: lights_status, properties: [read, notify]}
        - {uuid: "ea326b96-d410-42e2-848a-1218201468fc", name: lights_brightness, properties: [read, write]}
        - {uuid: "ea324d8c-d410-42e2-848a-1218201468fc", name: brake_lights_pattern, properties: [read, write]}
