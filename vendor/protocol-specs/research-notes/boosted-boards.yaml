  alternate_services:
    - uuid: "da2b84f1-6279-48de-bdc0-afbea0226079"
      name: boosted_board_v1_service
      description: V1 board protocol path (ble/e0/a.java)
      characteristics:
        - {uuid: "99564a02-dc01-4d3c-b04e-3bb1ef0571b2", name: v1_char1}
        - {uuid: "a87988b9-694c-479c-900e-95dfa6c00a24", name: v1_char2}
        - {uuid: "bf03260c-7205-4c25-af43-93b1c299d159", name: v1_char3}
        - {uuid: "18cda784-4bd3-4370-85bb-bfed91ec86af", name: v1_char4}
        - {uuid: "fdd6b4d3-046d-4330-bdec-1fd0c90cb43b", name: v1_char5, note: role TBD, possibly Beams accessory}

  standard_services:
    - uuid: "00002a25-0000-1000-8000-00805f9b34fb"  # serial number (scooter serial)
    - uuid: "00002a26-0000-1000-8000-00805f9b34fb"  # fw rev (motordriver fw version)

protocol:
  note: >
    Plain GATT reads/writes with notify for telemetry (speed, odometer, battery,
    charging, lights status). Discovery is by advertised service UUID
    (7DC55A86 = V2 gen, DA2B84F1 = V1 gen). Remote-to-board riding link is a
    separate BLE protocol, community-cloned on ESP32 (johnathanchiu/boosted-project)
    and partially documented at beambreak.org. Cloud (dead since 2020) was only
    account/rides/leaderboard/firmware hosting — not needed for local control.
  commands:
    set_ride_mode: write vehicle_mode (byte encoding TBD)
    read_battery: notify on battery_remaining
    firmware_update: SERIAL_CMD/SERIAL_AUTH path; binaries were server-hosted (dead)

status:
  apk_acquired: true
  apk_decompiled: true
  uuids_recovered: true   # full V2 characteristic enum + V1 path + scan filters
  protocol_recovered: partial  # value encodings TBD; remote link covered by prior art
  hci_snoop_needed: true  # to pin value encodings and SERIAL_CMD/SERIAL_AUTH flow
  reference:
    - beambreak.org / github.com/axkrysl47/BoostedBreak
    - tejasbhakta.com/boosted-board (remote BLE RE)
    - github.com/johnathanchiu/boosted-project (ESP32 remote pairing clone)
    - foreverboosted.co/faq (server shutdown status)
