# Mad Catz C.T.R.L.R — Device Spec
# Retail unit is dual-radio (BT Classic 2.1 + BLE HOGP); M.O.J.O.-bundled unit is BLE-only.
# All three modes are standard HID — the optional config app was never required.
# Mad Catz Interactive bankrupt 2017-03-30; brand relaunched 2018 by Mad Catz Global.

device:
  id: madcatz-ctrlr
  name: Mad Catz C.T.R.L.R wireless gamepad
  manufacturer: Mad Catz Interactive (bankrupt 2017; brand relaunched by Mad Catz Global 2018)
  category: game_controller
  safety_class: LOW

transport:
  type: bluetooth_classic   # retail variant; bundled M.O.J.O. variant is BLE-only (HOGP)
  local_only: true
  profiles:
    - hid   # all three modes

bluetooth_classic:
  variants:
    retail: Dual-mode radio — BT Classic 2.1 + BLE (HOGP)
    mojo_bundled: BLE-only (HOGP); silver media buttons; ships with USB BT4 dongle
  pairing:
    procedure: OS-level Bluetooth pairing; mode via physical slide switch
    pin: none (SSP)
  modes:  # selected by slide switch; identical HID mappings on both radios
    gamesmart: standard HID gamepad (Android gaming + navigation)
    mouse: HID mouse (left stick cursor, right stick wheel, buttons = clicks)
    pc: standard HID gamepad (numbered buttons, stick axes, d-pad as POV hat)

protocol:
  note: >
    No vendor protocol — every mode is standard HID. The historical "C.T.R.L.R
    app" only remapped keys for games without gamepad support; its disappearance
    does not affect operation.

status:
  apk_acquired: false   # config app optional; package id unconfirmed; not attempted
  apk_decompiled: false
  protocol_recovered: true   # standard HID — nothing proprietary to recover
  hci_snoop_needed: false
  cloud_dependency: none
  references:
    - mgarcia.org C.T.R.L.R analysis (2013-12-16, quotes Mad Catz dev doc v1.6)
    - techpowerup.com/185483 (2013-06-11)
