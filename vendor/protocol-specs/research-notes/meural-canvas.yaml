# Netgear Meural Canvas I & II — Device Spec (research note)
# Product line discontinued by Netgear 2024; cloud service still up as of 2026-08-07
# Local path: unauthenticated HTTP "remote controller" on port 80 (vendor-documented)

device:
  id: meural-canvas
  name: Netgear Meural Canvas / Canvas II (MC315, MC321, MC327)
  manufacturer: Netgear (Meural acquired 2018; line killed 2024)
  category: art_display
  safety_class: LOW

transport:
  type: wifi
  local_only: true
  note: >
    Frame runs a local HTTP server on port 80 ("remote controller", Netgear
    KB000060746). No authentication. Cloud account needed only for initial
    pairing, art store, and firmware updates; SD-card folders meural1-4 give
    a fully offline content path.

lan:
  discovery:
    method: dhcp-scan        # hostname pattern like "picasso-428"; no mDNS documented
  control:
    protocol: http
    port: 80
    auth: none
    reference_js: http://<canvas-ip>/static/remote.js
    endpoints:
      status:
        - GET /remote/identify/
        - GET /remote/get_galleries_json/
        - GET /remote/get_gallery_status_json/
        - GET /remote/get_frame_items_by_gallery_json/
        - GET /remote/get_wifi_connections_json/
        - GET /remote/get_backlight/
        - GET /remote/control_check/sleep/      # also video, als, system
      control:
        - GET /remote/control_command/suspend
        - GET /remote/control_command/resume
        - GET /remote/control_command/set_backlight/<0-100>/
        - GET /remote/control_command/set_orientation/<landscape|portrait>/
        - GET /remote/control_command/change_gallery/<id>/
        - GET /remote/control_command/change_item/<id>/
        - GET /remote/control_command/set_key/<key>/
        - GET /remote/control_command/boot_status/image/
        - GET /remote/control_command/rtc/ | language/ | country/
        - GET /remote/control_command/als_calibrate/off/
      wifi_provisioning:
        - POST /remote/control_command_post/connect_to_new_wifi/
        - POST /remote/control_command_post/connect_to_exist_wifi/
        - POST /remote/control_command_post/connect_to_hidden_wifi/
        - POST /remote/control_command_post/delete_wifi_connection/
      content_push:
        - POST /remote/postcard/                # push image to frame; schema TBD from remote.js
  offline_content:
    method: sd_card
    folders: [meural1, meural2, meural3, meural4]   # max 4 local folders

protocol:
  note: >
    Plain REST-ish GETs for both query and command; responses JSON.
    Endpoint list transcribed from remote.js via the ha-meural project.
    Postcard multipart schema not yet transcribed.
  commands:
    sleep: GET /remote/control_command/suspend
    wake: GET /remote/control_command/resume
    brightness: GET /remote/control_command/set_backlight/<0-100>/
    next_artwork: GET /remote/control_command/change_item/ (id from get_gallery_status_json)
    select_playlist: GET /remote/control_command/change_gallery/<id>/
    push_image: POST /remote/postcard/ (schema TBD)

status:
  apk_acquired: false     # not needed; protocol readable in on-device remote.js
  apk_decompiled: false
  uuids_recovered: false  # n/a — no BLE
  protocol_recovered: true   # confirmed via vendor docs + ha-meural implementation
  hci_snoop_needed: false
  cloud_dead: false       # service alive 2026-08-07, product line dead since 2024
  rating: confirmed       # vendor-documented local interface + HA core integration
  references:
    - github.com/GuySie/ha-meural (endpoint list from remote.js)
    - kb.netgear.com/000060746 (vendor "remote controller" doc)
    - channelnews.com.au/exclusivenetgear-kills-off-meural-canvas/ (2024-05-09)
    - community.netgear.com Meural forum (2025-11-24: service still running)
    - documenter.getpostman.com/view/1657302/RVnWjKUL (unofficial cloud API)
