# Sense Home Energy Monitor — DUD verdict (research note)
# Cloud-only; no local API, no documented LAN protocol; MITM-only path out of scope
# Verified 2026-08-07

device:
  id: sense-monitor
  name: Sense Home Energy Monitor (incl. Schneider Wiser Energy rebadge)
  manufacturer: Sense Labs — active (Series D, 2024)
  category: energy_monitor
  safety_class: MEDIUM  # panel install; measurement-only

transport:
  type: wifi
  local_only: false     # cloud-only: TLS to Sense/AWS; no LAN protocol
  note: >
    No local API exists and disaggregation is server-side. HA integration is
    cloud_polling via sense_energy. MITM (TLS to vendor cloud) is the only
    theoretical intercept and is out of scope per repo rules. No published
    jailbreak/reflash as of 2026-08.

status:
  apk_acquired: false    # pointless — app is a cloud client
  apk_decompiled: false
  uuids_recovered: false
  protocol_recovered: false
  rating: rejected       # DUD for local control
  cloud_dead: false
  references:
    - community.home-assistant.io/t/local-only-non-cloud-home-energy-monitor-options/117768 (2019-05-21)
    - community.home-assistant.io/t/can-i-use-ha-to-obtain-and-store-data-from-a-sense-or-aeotech-energy-monitor-when-internet-is-down/811040 (2024-12-14)
    - home-assistant.io/integrations/sense (cloud_polling)
