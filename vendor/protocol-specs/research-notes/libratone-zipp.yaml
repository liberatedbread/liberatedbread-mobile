# Libratone Zipp / Zipp Mini — Device Spec (research note)
# Speaker line abandoned by Libratone (vendor declined to document protocol);
# local UDP protocol reverse-engineered twice independently (Python + Rust).

device:
  id: libratone-zipp
  name: Libratone Zipp, Zipp Mini (and likely Zipp 2 / Mini 2)
  manufacturer: Libratone (speaker line discontinued; company active in earbuds)
  category: network_speaker
  safety_class: LOW

transport:
  type: wifi
  local_only: true

lan:
  discovery:
    - lssdp: Libratone SSDP variant (UDP broadcast; see abustany/libratone-rs)
  control:
    protocol: udp           # custom binary/JSON command protocol
    ports:
      client_listen: [3333, 7778]   # client must bind these for responses/events
    auth: none

protocol:
  note: >
    RE'd from the Android app (com.libratone.* LSSDPNode command IDs) plus
    the LoxWiki command list. Implemented: transport control, volume, voicing
    (EQ), room settings, standby + timer, favorite recall, name, firmware,
    serial, battery, mute, charging. Known-but-unimplemented command IDs:
    10, 103, 152, 281, 304, 520, 530, 537, 1284, 1285, 1536-1538.
  commands:
    play_pause_stop_next_prev: implemented (python_libratone_zipp)
    volume: get/set implemented
    voicing: get/set/list implemented
    room_setting: get/set/list implemented
    standby: immediate + timer implemented
    favorite_recall: implemented (definition not)
    device_info: name/firmware/serial/battery implemented

status:
  apk_acquired: false    # two prior RE efforts already published the tables
  apk_decompiled: false  # (done by upstream projects, not this repo)
  uuids_recovered: false # n/a — no BLE
  protocol_recovered: true
  hci_snoop_needed: false
  cloud_dead: mixed      # speaker app/service moribund; local protocol unaffected
  references:
    - github.com/Chouffy/python_libratone_zipp
    - github.com/Chouffy/home_assistant_libratone_zipp (HACS)
    - github.com/abustany/libratone-rs
    - loxwiki.eu Libratone Zipp WLan Lautsprecher
