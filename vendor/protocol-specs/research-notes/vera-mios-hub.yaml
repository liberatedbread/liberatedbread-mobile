# Vera MiOS Hubs (VeraEdge/VeraPlus/VeraSecure) — Device Spec (research note)
# Vendor-documented local HTTP API on port 3480; no LAN auth by default.
# Company: Ezlo Innovation (alive 2026, cloud moving to subscription; local API unaffected)

device:
  id: vera-mios-hub
  name: Vera MiOS Controllers (VeraEdge, VeraPlus, VeraSecure, Vera3/Lite)
  manufacturer: Mi Casa Verde / Vera Control / Ezlo Innovation
  category: smart_home_hub
  safety_class: LOW  # hub itself harmless; controlled loads (locks, outlets) carry own risk

transport:
  type: wifi
  local_only: true
  note: >
    Local HTTP "Luup Requests" API on port 3480, unauthenticated on LAN by
    default. Vendor-documented (wiki.mios.com). Identical syntax is proxied
    through MiOS cloud relays, but cloud is optional.

lan:
  discovery: upnp-ssdp        # hub advertises via UPnP; or DHCP scan
  control:
    protocol: http
    port: 3480
    auth: none-by-default     # can be password-enabled; off out of the box
    endpoints:
      - GET /data_request?id=user_data                     # full device/scene JSON
      - GET /data_request?id=sdata                         # compact status
      - GET /data_request?id=lu_action&DeviceNum=N&serviceId=...&action=...  # actuate
      - GET /data_request?id=action&serviceId=urn:micasaverde-com:serviceId:HomeAutomationGateway1&action=RunScene&SceneNum=N
      - GET /data_request?id=variableget&DeviceNum=N&serviceId=...&Variable=...

protocol:
  note: >
    UPnP-service-style actions over HTTP GET. serviceId/action names follow
    UPnP schemas (urn:upnp-org:serviceId:SwitchPower1, Dimming1, door locks
    etc.) plus urn:micasaverde-com extensions. Fully documented on the MiOS
    wiki; reimplemented by openLuup and the Home Assistant vera integration.
  commands:
    device_action: id=lu_action (DeviceNum, serviceId, action, args)
    run_scene: action=RunScene&SceneNum=N
    read_variable: id=variableget

status:
  apk_acquired: false      # n/a — vendor-documented, no RE needed
  apk_decompiled: false
  uuids_recovered: false   # n/a — no BLE
  protocol_recovered: true # vendor docs + openLuup + HA vera integration
  hci_snoop_needed: false
  cloud_dead: false        # Ezlo alive 2026; cloud subscription push does not affect local API
  rating: confirmed
  references:
    - wiki.mios.com/index.php/Luup_Requests (2017)
    - support.getvera.com/hc/en-us/articles/360021950733-Plugin-Development (2019)
    - github.com/akbooer/openLuup
    - community.ezlo.com (active 2025; subscription-thread reports)
