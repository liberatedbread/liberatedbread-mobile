# GoPoint BT1 / BT1A OBD-II adapter — research note
# Vendor effectively dead (gopointtech.com reduced to bare LiteSpeed listing).
# Never cloud-dependent: local SPP dongle. APK still fetchable via apk-pure
# (verified 2026-08-04). Proprietary (non-ELM327) protocol; no open RE yet.

device:
  id: gopoint-bt1
  name: GoPoint Technology BT1 / BT1A Bluetooth OBD-II adapter
  manufacturer: GoPoint Technology (defunct; website is a bare directory listing)
  category: vehicle_diagnostic_adapter
  safety_class: LOW  # diagnostics + DTC clear only

transport:
  type: bluetooth_classic_spp   # Android/PC; iOS used Apple iAP/MFi instead
  local_only: true

bluetooth:
  rfcomm:
    - uuid: "00001101-0000-1000-8000-00805f9b34fb"
      name: spp
      note: from com/gopoint/bt1/scanmgr/a.java
  pairing:
    note: hardware pairing button on dongle; no fixed PIN dependency documented

protocol:
  note: >
    NOT ELM327-compatible (per Harry's LapTimer dev: "a very different chip
    and protocol"). App is identifier-obfuscated; no AT-command strings in
    triage. Wire protocol undocumented publicly; vendor once distributed a
    "BT1 API" to developers (archive.org lead, not yet located). TrackAddict
    and Harry's LapTimer shipped closed-source BT1 drivers, so RE is proven
    feasible. Needs APK RE or one live RFCOMM capture.
  references:
    - https://forum.hptuners.com/showthread.php?p=393059  # BT1 protocol note
    - https://www.elmelectronics.com/help/obd/software/   # BT1/iAP context

status:
  apk_acquired: true
  apk_decompiled: true     # triage-level; obfuscated
  uuids_recovered: true    # standard SPP UUID
  protocol_recovered: false
  hci_snoop_needed: true   # single capture of a scan session would bootstrap RE
  cloud_dependency: none
  feasibility: unproven_moderate

apk:
  - package: com.gopoint.bt1
    version: "1.01"
    version_code: 7
    sha256: dbacd1ea45f0bd0ea63d3ed89d8732dbe04c990779f2e2c4e2cfddec1ce61821
    source: apkeep apk-pure
    note: 2.5 MB 2012-era app, still served despite vendor death
