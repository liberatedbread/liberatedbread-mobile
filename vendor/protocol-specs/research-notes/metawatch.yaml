# MetaWatch — Device Spec (research note)
# Company defunct (evidence: GitHub silent since 2015-03, domain parked 2026-08).
# Firmware + Android app + official SPP protocol spec all open source.

device:
  id: metawatch
  name: MetaWatch WDS111/WDS112 developer watches + Strata/Frame/META M1
  manufacturer: MetaWatch (Fossil Group spin-off, 2011; defunct ~2015)
  category: smartwatch
  safety_class: LOW
  models:
    - wds111    # digital dev watch, 96x96 display
    - wds112    # digital dev watch variant
    - strata    # 2012 Kickstarter retail digital
    - frame     # 2012 retail analog-style
    - meta-m1   # 2014 premium retail

transport:
  type: bluetooth_classic
  profile: spp
  local_only: true
  rfcomm:
    note: >
      TI CC2560 dual-mode module (SPP + BLE 4.0); all community tooling uses
      SPP. Phone/PC/microcontroller connects as RFCOMM client. SparkFun demo
      drives it from an Arduino + BlueSMiRF SPP module — no phone required.

protocol:
  note: >
    Officially documented: "MetaWatch Firmware Design Guide" (public PDF)
    specifies the SPP message protocol — message type byte, options field,
    little-endian length, payload. Covers display buffer writes (96x96),
    buttons, vibrate, RTC/time, idle/application/notification modes.
    Watch firmware (incl. remote protocol handler) and the Android manager app
    are open source under MetaWatchOpenProjects on GitHub.
  spec: https://cdn-reichelt.de/documents/datenblatt/A300/METAWATCH_DESIGN_GUIDE.pdf
  reference_implementations:
    - github.com/MetaWatchOpenProjects/MetaWatch-Gen2   # watch firmware source
    - github.com/MetaWatchOpenProjects/MWM-for-Android-Gen1  # app source
    - github.com/travisgoodspeed/PyMetaWatch            # Python client (PC/SPP)
    - github.com/ka010/MWKit                            # Cocoa client

cloud_status:
  cloud_required: false  # pre-cloud developer platform; no server dependency

status:
  apk_acquired: false     # org.metawatch.manager unfetchable (APKPure: 0 versions); app source on GitHub instead
  apk_decompiled: false   # not needed — source available
  uuids_recovered: false  # standard SPP; no custom UUID needed (design guide)
  protocol_recovered: true  # official spec published by vendor
  hci_snoop_needed: false
  rating: confirmed  # protocol confirmed; company wind-down DATE is hypothesis (~2015)
