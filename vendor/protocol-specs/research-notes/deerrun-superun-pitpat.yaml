protocol:
  note: >
    BLE command protocol not yet statically recovered. Open-source prior art:
    qdomyos-zwift has a dedicated deeruntreadmill device driver, proving the
    protocol is documented in open code. QZ issue #3589 (2025-08) shows a
    PitPat-T01 connecting (belt powers on) but speed control failing on that
    firmware revision — expect per-firmware quirks. The PitPat app
    (com.linzi.sport, v4.21.00) is native, 11 DEX; a triage string pass found
    only the standard Bluetooth assigned-numbers table, so the BLE layer is
    obfuscated or in native libraries.
  commands: TBD

cloud:
  app_requires_account: effectively_yes  # reviews: pad unusable without app sign-in flows
  vendor: PitPat / Joyfit Inc. (races, rewards, AI coach, stats sync)
  risk: platform shutdown or paywall expansion strands app-dependent features; pad hardware unaffected

status:
  apk_acquired: true
  apk_decompiled: false  # triage string pass only; obfuscated/native BLE layer
  uuids_recovered: false
  protocol_recovered: false  # partial via QZ deeruntreadmill (open source)
  hci_snoop_needed: true
