# Tenvis JPT3815W / IPROBOT / TH series — Device Spec (research note)
# Company active (tenvis.com, 2026-08-07); legacy models unmaintained.
# Foscam-clone CGI (MJPEG era) + ONVIF/RTSP (HD era). Zero cloud dependency.

device:
  id: tenvis
  name: Tenvis JPT3815W, IP602W, IPROBOT2/3, TH-series IP cameras
  manufacturer: Tenvis (Shenzhen; active)
  category: ip_camera
  safety_class: LOW  # privacy risk only

transport:
  type: wifi
  local_only: true
  note: >
    Every generation keeps a local web UI and local streams. MJPEG-era
    models use the Foscam FI89xx clone CGI; HD models add ONVIF and RTSP.
    No cloud account or provisioning step required.

lan:
  discovery:
    - ONVIF WS-Discovery (HD models)
    - vendor search tool / DHCP client list
  mjpeg_era:   # JPT3815W, IP602W, Mini319
    http_port: 80   # 81 on some
    default_credentials: admin / (blank) or admin / admin  # batch-dependent
    endpoints:
      mjpeg_stream: /videostream.cgi?user=U&pwd=P
      snapshot: /snapshot.cgi?user=U&pwd=P
      ptz: /decoder_control.cgi?command=N   # FI8918W command map
      status: /get_status.cgi
  hd_era:      # JPT3815W-HD, IPROBOT3, TH661/TH692
    http_port: 80
    rtsp_port: 554
    default_credentials: admin / admin
    onvif: true
    rtsp: path varies by model — resolve via ONVIF GetStreamUri

protocol:
  note: >
    MJPEG models are FI89xx clones: same videostream/snapshot/
    decoder_control CGI (see foscam-fi89xx note). HD models are standard
    ONVIF + RTSP; no vendor CGI SDK published for the HD line. The 2013
    JPT3815W hardware revision altered web UI/CGI paths — verify per unit.
  commands:
    stream_mjpeg: videostream.cgi
    stream_rtsp: via ONVIF GetStreamUri (HD models)
    snapshot: snapshot.cgi
    ptz: decoder_control.cgi?command=N / ONVIF PTZ

status:
  apk_acquired: false   # not needed — clone CGI + ONVIF documented
  apk_decompiled: false
  uuids_recovered: false  # n/a — Wi-Fi/HTTP
  protocol_recovered: true  # community/NVR-verified
  hci_snoop_needed: false
  cloud_dead: false  # cloud never required
  rating: confirmed
  security_notes: >
    Legacy firmware has published auth-bypass/backdoor research; change
    default credentials, cleartext HTTP auth — isolate on IoT VLAN, never
    port-forward.
  references:
    - ispyconnect.com/camera/tenvis (172 models, updated 2026-06)
    - community.synology.com JPT3815W thread
    - community.ezlo.com JPT3815W thread (2014-02, admin/admin)
    - community.netcamstudio.com JPT3815W-HD thread (2015-08)
    - tenvis.com homepage (fetched 2026-08-07)
