  hci_snoop_needed: false
  cloud_dead: true           # vendor ended service ~2018
  products_discontinued: true
  rating: rejected_dud
  rejection_reason: >
    Cloud-only device with dead cloud and no LAN path; only historical capture
    method was traffic interception (out of scope).
  references:
    - discourse.weather-watch.com/t/replace-oregon-scientific-lw301-with-lw89-wd/65684
