# support ~2018. Only capture was traffic interception (weewx-interceptor).
# Sources checked 2026-08-07: discourse.weather-watch.com (2018-09),
# forum.allaboutcircuits.com (2018-09), Trustpilot it.oregonscientific.com (2023).

device:
  id: oregon-scientific-anywhere-weather
  name: Oregon Scientific Anywhere Weather LW301 / LW302
  manufacturer: Oregon Scientific (IDT International)
  category: weather_station
  safety_class: LOW

transport:
  type: wifi
  local_only: false   # DUD: cloud-only push; no LAN interface
