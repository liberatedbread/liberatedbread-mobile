# Beurer PO60 Pulse Oximeter — Device Spec (BLE, fully local)
# Reverse-engineered by static analysis of the two Beurer companion apps —
# HealthManager Pro (Kotlin, obfuscated, RxAndroidBle) and the older classic
# HealthManager (largely unobfuscated) — cross-verified against each other,
# 2026-08. Both carry a PO60 implementation and they agree. A third-party
# hardware-tested bleak script
# (Shreyan1/Beurer-PO60-PulseOximeter-Bluetooth-Integration) independently
# corroborates the UUIDs and the command bytes below.
#
# An existing Android HCI capture confirms bonding, GATT discovery, the clock
# write and a bounded history transfer. Record parsing and command coverage
# still derive from app analysis and the third-party script.

device:
  name: "Beurer PO60 Pulse Oximeter"
  manufacturer: "Beurer GmbH"
  manufacturer_status: "active"
  testing:
    status: untested
    detail: capture-verified
    notes: >
      A sanitized existing Android HCI capture reviewed 2026-11-07 confirms
      SMP bonding with MITM, full GATT discovery, the 0x83 clock write and
      99 00 19 history start, plus 20/20/8-byte notification chunks. No PLX
      0x1822 service or live measurement stream appears in that capture.
      It contains no physical finger-state signal, so the finger-removal
      trigger comes from the vendor manual rather than the capture. No complete
      flow was driven against hardware by this project; record parsing,
      page-size semantics and other firmware revisions remain open.
  protocol: "ble"
  category: "health"
  category_hierarchy: ["measurement", "health", "pulse_oximetry"]
  type: "pulse-oximeter"
  model: "Beurer PO60"
  aliases: ["PO60", "PO 60", "Pulse Oximeter"]
  distributors:
    - name: "Beurer GmbH"
      role: "manufacturer"
      url: "https://www.beurer.com/"
      notes: "PO60 fingertip pulse oximeter; no cloud-dependent service."
  companion_apps:
    - name: "beurer HealthManager Pro"
      package: "com.beurer.healthmanager"
      role: "primary"
      platform: "android"
      url: "https://play.google.com/store/apps/details?id=com.beurer.healthmanager"
      notes: "Current companion; supports local use without account registration."
    - name: "beurer HealthManager"
      package: "com.beurer.connect.healthmanager"
      role: "historical"
      platform: "android"
      url: "https://play.google.com/store/apps/details?id=com.beurer.connect.healthmanager"
      notes: "Older companion used to cross-check record layouts and command bytes."
    - name: "beurer HealthCoach"
      package: "com.beurer.connect.healthcoach"
      role: "historical"
      platform: "other"
      notes: "Named in the older US PO60 manual; withdrawn and not required for sync."
  notes: >
    Bluetooth Smart (BLE 4.0) fingertip pulse oximeter by Beurer (Ulm,
    Germany — company founded 1919, alive and shipping; the Pro app was still
    updated as of v1.22.0, Aug 2026). Measures SpO2 and pulse rate, stores up
    to 100 measurement sessions on-device, color OLED display. Advertises as
    `PO60` (confirmed in both apps' scan filters).

    The device speaks ONE custom GATT service (FF12 on the standard
    0000xxxx-0000-1000-8000-00805f9b34fb base) with a write characteristic
    (FF01) for commands and a notify characteristic (FF02) for acks and
    history data. Full GATT discovery in the reviewed capture found no
    standard BLE Pulse Oximeter profile (0x1822 PLX), agreeing with both apps.

    The interaction model is history sync, not live streaming. After a
    measurement, removing the finger starts an approximately ten-second
    `SYNC` connection window; alternatively, hold the function button for
    five seconds while the PO60 is switched off. On first pairing the PO60
    displays a random six-digit PIN for entry on the phone. A client reuses
    a valid existing bond or pairs, enables notifications, sets the clock,
    then pages the stored-session log until an end-of-transfer record
    arrives. Full-memory transfer and automatic shutdown follow. Do not
    keep an idle connection expecting live samples; live behavior in other
    firmware or app versions remains unproven.

    OEM is unidentified. The BLE stack is the same "ilink" SDK family used
    across the Beurer/Sanitas medical line (BF scales, BM blood-pressure
    monitors, GL glucose, AS activity sensors, FT thermometers); no
    rebranded sibling is known.

    FCC ID: not found — the US manual carries only a generic Part 15
    statement and no FCC ID string; needs a label photo or fccid.io visual
    search.

    No firmware update path exists: neither app contains any DFU/OTA code
    for the PO60 (the only FirmwareRevisionString reads in the codebase are
    on scales), and no firmware URLs were found.

  safety_advisory:
    severity: "warning"
    summary: >
      SpO2 and pulse readings synced from the oximeter are a personal log,
      not a basis for a medical decision.
    detail: >
      A third-party client reads sessions the device has already stored; it
      takes no measurement and adds no accuracy of its own. Show each value
      exactly as the record carries it, with its timestamp, and never let a
      number that arrived through this spec decide whether someone needs
      oxygen, a medication or urgent care: a reading that worries you is a
      reason to look at the device's own display and call a professional,
      not to re-sync. Fingertip oximeters read low or not at all with cold
      hands, nail polish, movement and poor perfusion, and have been
      reported to overestimate on darker skin; none of that is visible in a
      synced record. This spec and any client built from it are
      experimental and unaffiliated with Beurer; the manufacturer's
      instructions for use govern.
    acknowledge_required: true
    advisory_url: "https://www.manualslib.com/manual/2178319/Beurer-Po-60.html"

  identification:
    local_name_prefix: "PO60"
    service_uuids:
      - "0000ff12-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "exact"
            value: "PO60"
          service_uuids:
            - "0000ff12-0000-1000-8000-00805f9b34fb"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: medium
    notes: >
      Nothing to provision — no network, no account. The one gate is BLE
      passkey bonding: on first pairing, enter the random six-digit PIN shown
      on the PO60 display. The vendor manual documents both `SYNC` entry
      methods; the reviewed capture confirms SMP bonding with MITM and a
      bounded history transfer. Whether an unbonded client can already write
      the time-set command is unknown. Confidence medium because a complete
      third-party client flow has not been replayed against the hardware.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Enter `SYNC` after a measurement or from off, connect with a valid
          existing bond or pair using the random device-display PIN, enable
          FF02 notifications, sync the clock, then page the measurement log.
        ble:
          advertised_name: "PO60"
          pairing_required: true
          pin_source: "Random six-digit passkey shown on the PO60 display during pairing"
        steps:
          - action: "After a measurement, remove your finger to enter `SYNC`; alternatively, with the PO60 switched off, hold its function button for five seconds until `SYNC` appears. Device Bluetooth must be ON."
            actor: "user"
            expect: "The PO60 attempts to connect for approximately ten seconds."
          - action: "Scan for the exact local name `PO60` and connect during `SYNC`, reusing a valid existing bond when available."
            actor: "client"
            expect: "Connected link with GATT service FF12 and characteristics FF01 (write) and FF02 (notify)."
          - action: "On first pairing, enter the random six-digit PIN shown on the PO60 display when the phone prompts for it."
            actor: "user"
            expect: "Bonded link using BLE passkey entry."
          - action: "Enable notifications on FF02 (write the CCC descriptor)."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "Enable notifications on 0000ff02"
          - action: "Set the device clock (command 0x83 on FF01; both apps do this immediately after bonding)."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "set_datetime"
            expect: "Ack F3 00 notified on FF02."
          - action: "Read storage info (90 05 15), then page the log with 99 00 19 / 99 01 1A until an E9 4x end-of-transfer record arrives. Do not keep an idle connection expecting live samples."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "read_storage_info / get_measurements_page"
            expect: "All stored measurements transfer; the PO60 then switches off automatically."
    factory_reset:
      applicable: false
      confidence: medium
      effect: >
        There is no way to clear the oximeter's memory. Beurer's own support
        position is that the stored measurements cannot be reset on the device:
        the hundred measurement slots fill and roll, and deleting readings in
        the phone app does not help because the next sync downloads them from
        the device again.
      description: >
        `false` rather than `unknown`, and this is one of the more consequential
        absences in the registry. The PO60's stored sessions are health data;
        they are held unencrypted, readable by any bonded client (see
        `pairing`), and per the vendor there is no owner-accessible way to
        remove them. Nothing survives a hand-over: a second-hand PO60 comes
        with its previous owner's readings, and the only barrier to them is the
        BLE bond.

        The power button is the device's only control and carries power and
        transfer functions; no reset function is documented on it. If a
        procedure ever turns out to exist, this is a block worth revisiting,
        because the privacy consequence is real.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Rebinding to a new phone is ordinary BLE bonding: remove the old bond
        in the previous phone's OS Bluetooth settings if the device refuses
        to pair, enter `SYNC`, then enter the newly displayed random PIN.
        Measurement history survives on the device.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "BLE bond (link-layer keys) per paired phone"
        - "Measurement history (up to 100 sessions) — health data, at rest unencrypted, readable by any bonded client"
      issued_to_client:
        - "Nothing beyond the BLE bond itself; there are no per-device application credentials"

  pairing:
    required: true
    confidence: "medium"
    security_mode: "passkey_entry"
    bonding: "required"
    pin:
      source: "device_screen"
      length: 6
      notes: >
        The PO60 generates a random six-digit PIN and shows it on its display
        during pairing; enter that value on the phone. It is not a fixed PIN
        printed in the manual. The international manual documents this flow,
        and the reviewed capture confirms SMP bonding with MITM.
    exclusivity:
      single_connection: true
      single_bond: "unknown"
      recovery: >
        If the oximeter refuses to pair with a new phone, remove the old bond
        from the previous phone's OS Bluetooth settings and try again.
    unpair:
      supported: "unknown"
      requires_factory_reset: false
      notes: >
        Moving to a new phone is ordinary BLE re-bonding and needs no reset;
        no procedure for clearing the device's own bond state was found in
        either companion app or in the manual text examined.
    enter_pairing_mode:
      required: false
    notes: >
      Bonding is the only protection this device has: nothing in the protocol
      above it is encrypted, and up to 100 stored measurement sessions — health
      data — are readable by any bonded client. Whether an unbonded client can
      already write the time-set command, and how reliably third-party clients
      can reuse an existing bond, remain unestablished.
  # The cloud block below records the phone-app services for completeness.
  # The PO60 itself has no radio but BLE and never talks to any of this.
cloud:
  required: false
  vendor_service: "beurer HealthManager / HealthManager Pro cloud (optional account sync from the phone app)"
  hosts:
    - "https://sync.connect-beurer.com/BHMCWebAPI/ (legacy HealthManager: login, user management, measurement sync up/down)"
    - "https://hmpro.connect.beurer.com (HealthManager Pro, EU)"
    - "https://hmpro-us.connect.beurer.com (HealthManager Pro, US)"
    - "https://sso.connect.beurer.com and https://appsso.beurer.de (Pro SSO)"
    - "https://matomo.connect.beurer.com (Pro analytics)"
  auth:
    type: "other"
    notes: >
      Classic HealthManager uses a login API on the BHMCWebAPI host; the Pro
      app authenticates via its SSO hosts. Not mapped further — the device
      never contacts any cloud, so none of this is on the local-control path.
  failure_mode: >
    Nothing breaks on the device. The PO60 is phone-to-device over BLE only;
    the cloud exists solely as optional account/sync storage inside the
    companion apps (both of which also work in guest/local mode). Beurer GmbH
    is alive and the Pro app is actively maintained, so there is no shutdown
    risk today — and even a total cloud shutdown would leave measurement,
    storage and sync to any BLE client fully functional.
  data_leaves_device:
    - "SpO2/pulse measurement history uploaded by the phone app, only when the user signs into an account"
    - "Account identity and profile data (app-side)"
  notes: >
    Device imagery for the Pro app is served from an Azure CDN
    (beur-hm-api-cdn-endpoint-prod / -produs .azureedge.net) — cosmetic only.

local_access:
  status: "native"
  summary: >
    Fully local by design: the only radio is BLE, and the complete documented
    function set (clock sync + full measurement-history pull) is reachable
    with the three commands in this spec from any BLE host.
  covers:
    - "Full stored-measurement sync: per-session start/end time plus SpO2 and pulse-rate min/max/avg, paged over FF02 notifications"
    - "Device clock set (command 0x83)"
    - "Stored-record count query (90 05 15)"
  not_covered:
    - "Live/streaming SpO2 during a reading — no such command exists in either app; unknown whether the hardware supports it at all"
    - "Firmware update — no OTA/DFU path exists in either app and no firmware image is public"
    - "Deleting records from the device — no such command was found"

services:
  - uuid: "0000ff12-0000-1000-8000-00805f9b34fb"
    name: "Beurer Pulse Oximeter Service"
    notes: >
      The only application service. 16-bit alias FF12 on the standard BLE
      base UUID. Full GATT discovery in the reviewed capture found no SIG
      Pulse Oximeter profile (0x1822 PLX), agreeing with both apps; whether
      a battery service exists remains unestablished. No application-layer
      encryption was found — BLE bonding is the only protection, and numeric
      values are plain 7-bit-masked integers.
    characteristics:
      - uuid: "0000ff01-0000-1000-8000-00805f9b34fb"
        name: "Command (write)"
        properties: ["write"]
        notes: >
          All commands are written here. Checksum rule (both apps): low-7-bit
          additive — CKS = (sum of the preceding bytes) & 0x7F, except the
          0x99 page command, whose last byte is (pp - 103) & 0x7F. The
          concrete command bytes below match the third-party hardware-tested
          bleak script (Shreyan1).
        commands:
          read_storage_info:
            description: "Query the number of stored measurement records; the device answers on FF02"
            value: [0x90, 0x05, 0x15]
            verification: "reported"
          set_datetime:
            description: >
              Set the device clock. CKS = (sum of bytes 0..7) & 0x7F. Device
              acks on FF02 with F3 00. The legacy app wrote placeholder
              05 05 05 in the seconds/pad positions; HealthManager Pro sends
              real seconds — send real time.
            template: [0x83, "{year}", "{month}", "{day}", "{hour}", "{minute}", "{second}", 0x00, 0x00, "{checksum}"]
            verification: "reported"
            parameters:
              year:
                type: "uint8"
                min: 0
                max: 99
                description: "Year minus 2000 (2026 -> 0x1A)"
              month:
                type: "uint8"
                min: 1
                max: 12
              day:
                type: "uint8"
                min: 1
                max: 31
              hour:
                type: "uint8"
                min: 0
                max: 23
              minute:
                type: "uint8"
                min: 0
                max: 59
              second:
                type: "uint8"
                min: 0
                max: 59
              checksum:
                type: "uint8"
                min: 0
                max: 127
                description: >
                  (0x83 + year + month + day + hour + minute + second + 0x00
                  + 0x00) & 0x7F. NOT expressible as the schema's `auto:
                  checksum` (that is sum mod 256); compute it per this rule.
          get_measurements_page:
            description: >
              Request a page of the stored-measurement log on FF02. pp = 0x00
              starts the transfer, pp = 0x01 fetches the next page (the app
              pages every 12 records until the E9 4x end-of-transfer record).
              Checksum for this command is (pp - 103) & 0x7F, giving the
              observed on-the-wire bytes 99 00 19 and 99 01 1A.
            template: [0x99, "{page}", "{checksum}"]
            verification: "reported"
            parameters:
              page:
                type: "uint8"
                min: 0
                max: 1
                labels: ["start", "next"]
                description: "0x00 = START (begin log dump), 0x01 = NEXT (continue paging)"
              checksum:
                type: "uint8"
                min: 25
                max: 26
                description: "(page - 0x67) & 0x7F — 0x19 for START, 0x1A for NEXT"

      - uuid: "0000ff02-0000-1000-8000-00805f9b34fb"
        name: "Response / measurement data (notify)"
        properties: ["notify"]
        notes: >
          Ack and data channel. Known frame types (app-parsed):
          - Time-set ack: F3 00.
          - Storage-info response to 90 05 15: carries the stored-record
            count; exact length/offset of the count byte is NOT yet pinned
            down (open question).
          - Measurement records: stream as 20-byte notification chunks; the
            client reassembles and slices 24-byte records (see `format` for
            the record layout). A record whose byte 1 has high nibble 0x4
            marks end-of-transfer; the app disconnects about 3 s later.
          All numeric fields are plain 7-bit integers (mask 0x7F); pulse-rate
          values >= 128 escape via the flag byte at offset 14 (bit 2 -> +128
          to PR max, bit 3 -> PR min, bit 4 -> PR avg).
        format:
          - offset: 0
            length: 1
            name: "header"
            type: "uint8"
            values:
              233: "measurement record (0xE9)"
            notes: "Every record starts 0xE9. NOTE: this format describes the reassembled 24-byte record, NOT a single notification value — notifications arrive as 20-byte chunks and must be concatenated before slicing."
          - offset: 1
            length: 1
            name: "record_index"
            type: "uint8"
            notes: "Low nibble = packet/record index. High nibble 0x4 marks end-of-transfer (no more pages; client may disconnect)."
          - offset: 2
            length: 1
            name: "start_year"
            type: "uint8"
            value_offset: 2000
            unit: "years"
            notes: "Year minus 2000."
          - offset: 3
            length: 1
            name: "start_month"
            type: "uint8"
          - offset: 4
            length: 1
            name: "start_day"
            type: "uint8"
          - offset: 5
            length: 1
            name: "start_hour"
            type: "uint8"
          - offset: 6
            length: 1
            name: "start_minute"
            type: "uint8"
          - offset: 7
            length: 1
            name: "start_second"
            type: "uint8"
          - offset: 8
            length: 1
            name: "end_year"
            type: "uint8"
            value_offset: 2000
            unit: "years"
            notes: "Measurement end time, same layout as start."
          - offset: 9
            length: 1
            name: "end_month"
            type: "uint8"
          - offset: 10
            length: 1
            name: "end_day"
            type: "uint8"
          - offset: 11
            length: 1
            name: "end_hour"
            type: "uint8"
          - offset: 12
            length: 1
            name: "end_minute"
            type: "uint8"
          - offset: 13
            length: 1
            name: "end_second"
            type: "uint8"
          - offset: 14
            length: 1
            name: "pr_escape_flags"
            type: "uint8"
            notes: "Bit 2 -> add 128 to PR max, bit 3 -> add 128 to PR min, bit 4 -> add 128 to PR avg. Escape for pulse values that exceed the 7-bit field range."
          - offset: 17
            length: 1
            name: "spo2_max"
            type: "uint8"
            unit: "%"
          - offset: 18
            length: 1
            name: "spo2_min"
            type: "uint8"
            unit: "%"
          - offset: 19
            length: 1
            name: "spo2_avg"
            type: "uint8"
            unit: "%"
          - offset: 20
            length: 1
            name: "pr_max"
            type: "uint8"
            unit: "bpm"
            notes: "Add 128 when bit 2 of pr_escape_flags is set."
          - offset: 21
            length: 1
            name: "pr_min"
            type: "uint8"
            unit: "bpm"
            notes: "Add 128 when bit 3 of pr_escape_flags is set."
          - offset: 22
            length: 1
            name: "pr_avg"
            type: "uint8"
            unit: "bpm"
            notes: "Add 128 when bit 4 of pr_escape_flags is set."

# The device's own command protocol: framing, checksum and opcode table.
# Namespaced like every other bespoke block -- and NOT called `protocol`,
# which at the top level used to collide with `device.protocol`, an enum
# that means something else entirely.
protocol_details:
  command_protocol:
    framing:
      byte_order: "big (all fields are single bytes; the year field is year-2000)"
      checksum: >
        Low-7-bit additive: CKS = (sum of preceding frame bytes) & 0x7F for the
        0x83 time-set command; the 0x99 page command uses (page - 103) & 0x7F.
        No CRC, no length prefix, no encryption.
      notes: >
        Notification path reassembly: measurement data arrives as 20-byte
        chunks on FF02; concatenate and slice into 24-byte records starting at
        each 0xE9 header. Bytes 15, 16 and 23 of the record are unused/unknown.
    session_flow:
      description: >
        Device-initiated transfer sequence:
        1. After a measurement, removing the finger starts `SYNC`; alternatively,
           hold the function button for five seconds while the PO60 is off.
           The device attempts to connect for approximately ten seconds.
        2. Connect with a valid existing bond, or complete passkey pairing using
           the random six-digit PIN on the PO60 display. Enable FF02 notifications.
        3. Write set_datetime (0x83 ...) to FF01; expect ack F3 00 on FF02.
        4. Write read_storage_info (90 05 15); the FF02 response carries the
           stored-record count (exact response layout still unpinned).
        5. Write get_measurements_page START (99 00 19); records arrive on FF02
           as notification chunks for reassembly into 24-byte records.
        6. Every 12 records, write NEXT (99 01 1A) to page onward (page size 12
           is inferred from the classic app's record-index constant, not
           hardware-confirmed).
        7. Stop at the end-of-transfer record (header E9, byte 1 high nibble
           0x4). Full-memory transfer and automatic shutdown follow. Do not
           keep an idle connection expecting live samples.
      verification: "reported"
      verification_note: "The SYNC triggers and random PIN come from the vendor manual. App analysis supplies the command sequence; an existing Android HCI capture confirms bonding, clock-set, history start and bounded notifications, but not the complete flow or inferred page size."
    remaining_unknowns:
      - "Whether the PO60 exposes a battery service alongside FF12"
      - "Exact format/length of the storage-info response to 90 05 15"
      - "Page-size semantics of the 0x99 command (12 records/page inferred, not confirmed)"
      - "Bond-reuse reliability for third-party clients and whether an unbonded client can write time-set"
      - "Behavior of other firmware/app versions, including any live-streaming path not seen in the reviewed capture"
      - "FCC ID (absent from the US manual; needs a device-label photo)"
      - "Record bytes 15, 16 and 23"

