# Vizio SmartCast local API — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Vizio SmartCast TV"
  manufacturer: "Vizio"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "wifi"
  category: "tv"
  transport: "https"
  notes: >
    Vizio SmartCast TVs (2016 and later) expose a local HTTPS API on port
    7345 (firmware 4.0 and newer; pre-4.0 firmware serves the same API on
    port 9000). Both ports speak HTTPS only and will not answer plain HTTP;
    the certificate is self-signed (CN historically BG2.prod.vizio.com), so
    clients must skip chain verification. Control requires pairing first:
    PUT /pairing/start makes the TV show a 4-digit PIN, PUT /pairing/pair
    trades the PIN for an AUTH_TOKEN, and every authenticated request then
    carries it in an AUTH header. Key events go to PUT /key_command/ as
    (CODESET, CODE, ACTION) triples, apps launch through PUT /app/launch,
    inputs and every on-screen setting live under /menu_native/, and
    GET /state/device/power_mode is the power reading. Sound bars
    (SmartCast "speakers") share the API shape with audio_settings in
    place of tv_settings and usually need no auth token; this spec covers
    the TV class. The API server stops when the set sleeps, so wake needs
    a WoL magic packet and does not work with the set in Eco power mode.
  openness:
    status: "undocumented"
    reverse_engineered: true
    upstream_docs:
      - url: "https://github.com/exiva/Vizio_SmartCast_API"
        title: "exiva — Vizio SmartCast API (2016+ Models)"
        covers: >
          The canonical reverse-engineered API write-up this spec follows:
          port split (9000/7345), the pairing flow and its status codes,
          /key_command/ and its codeset/code table, /menu_native/ settings
          reads and writes with HASHVAL, /app/launch, power_mode, the
          self-signed certificate, and the WoL-wake note.
      - url: "https://raw.githubusercontent.com/raman325/pyvizio/master/pyvizio/const.py"
        title: "pyvizio const.py — endpoint paths and key codes"
        covers: >
          The exact endpoint paths (including /app/current,
          /state/device/deviceinfo and the serial_number/version/ESN
          identity reads) and the TV key_codes table as Home Assistant's
          backend library implements them.
      - url: "https://www.home-assistant.io/integrations/vizio/"
        title: "Home Assistant — VIZIO SmartCast integration"
        covers: >
          The pairing UX as users actually run it, the remote command
          vocabulary (including num_0..num_9 digit keys), and the Eco Mode
          limitation on powering the set on.
      - url: "https://www.openhab.org/addons/bindings/vizio/"
        title: "openHAB — Vizio binding"
        covers: >
          Independent confirmation of the port split, pairing flow, button
          command list, and the app-list handling (NAME_SPACE as a
          version-like value that may need adjusting).
    notes: >
      Vizio publishes nothing about this API; everything here is community
      reconstruction, exercised daily by pyvizio/vizaio (Home Assistant's
      backend) and the openHAB binding. No part of this spec has been
      replayed against hardware by this project, so every command is
      verification "reported".

  identification:
    ssdp_search_targets:
      - "urn:dial-multiscreen-org:device:dial:1"
      # The DIAL target is what current clients (pyvizio) search; it is
      # shared by every DIAL-capable TV, so the description-document
      # manufacturer match in `discovery` is load-bearing. exiva's older
      # write-up searched urn:schemas-kinoma-com:device:shell:1 — recorded
      # there as a fallback target.
    mdns_service_type: "_viziocast._tcp.local."
    default_port: 7345
    identity_keys:
      primary: "serial"
      secondary: "udn"
      display: "friendly_name"

  discovery:
    methods:
      - type: "ssdp"
        ssdp:
          search_targets: ["urn:dial-multiscreen-org:device:dial:1"]
          port_fallback: [9000]
          match:
            description: >
              DIAL is answered by every DIAL-capable TV on the LAN (Roku,
              Fire TV, ...), so the target alone does not identify a Vizio.
              Fetch the LOCATION description document and keep only
              respondents whose device/manufacturer is exactly "VIZIO" —
              the filter pyvizio applies.
            rule: "xml://root/device/manufacturer == 'VIZIO'"
            manufacturer_exact: "VIZIO"
          response_mapping:
            location:
              url: "LOCATION"
              action: "fetch_xml"
              parse:
                device_identity:
                  stable_keys:
                    - source: "xml://device/UDN"
                      key: "udn"
                  display:
                    source: "xml://device/friendlyName"
                  variant:
                    source: "xml://device/modelName"
      - type: "mdns"
        mdns:
          service_type: "_viziocast._tcp.local."
          txt_record_keys: ["name", "id"]
          identity_mapping:
            stable_keys:
              - source: "txt:id"
            display:
              source: "name"
    identity:
      stable_keys: ["serial", "udn"]
      display: "friendly_name"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      Two separate things happen here and neither needs the vendor cloud:
      network onboarding, done on the TV's own screen, and client pairing,
      which is the API-level step that issues the AUTH token. Pairing is
      per-client: each new client runs it once and stores the token, and
      the token survives until the user deletes the client under
      Settings > System > Mobile Devices (or factory-resets the set).
      Confidence is medium: the flow is documented by the exiva write-up
      and exercised by pyvizio/openHAB, but this project has not run it
      against hardware.
    methods:
      - type: "device_ui"
        verified: false
        description: >
          First-run setup happens on the TV itself: language, network,
          terms, firmware update. Once the set is on the LAN, the client
          pairs for control. Pair with the TV already ON — pyvizio's
          README notes the set can "forget" the PIN if it was off when
          pairing started.
        steps:
          - action: "Complete the on-screen first-run setup (network, terms) with the remote."
            actor: "user"
            expect: "TV is online and answers SSDP/DIAL discovery."
          - action: "Open pairing; the TV shows a 4-digit PIN at the top of the screen."
            actor: "client"
            request:
              protocol: "http"
              action: "PUT /pairing/start"
            expect: "JSON response ITEM carries PAIRING_REQ_TOKEN and CHALLENGE_TYPE."
          - action: "Read the PIN from the TV screen and hand it to the client."
            actor: "user"
          - action: "Submit the PIN to finish pairing."
            actor: "client"
            request:
              protocol: "http"
              action: "PUT /pairing/pair"
            expect: >
              STATUS.RESULT == "success" and ITEM.AUTH_TOKEN present;
              store the token. PAIRING_DENIED means the PIN was wrong,
              MAX_CHALLENGES_EXCEEDED means too many failed tries
              (restart from /pairing/start), BLOCKED means another pairing
              is already in progress.
          - action: "Confirm control with the stored token."
            actor: "client"
            request:
              protocol: "http"
              action: "GET /state/device/power_mode"
            expect: "STATUS.RESULT == \"success\" with the AUTH header set."
    factory_reset:
      confidence: "medium"
      effect: >
        Clears settings, network credentials, paired mobile devices (and
        therefore every issued AUTH token) and tuned channels; the set
        returns to first-run setup. Documented by Vizio support and
        secondary write-ups, not replayed here.
      procedures:
        - name: "Menu factory reset"
          steps:
            - action: "Settings > System > Reset & Admin > Reset TV to Factory Defaults (older firmware: Admin & Privacy)."
              actor: "user"
            - action: "Enter the administrative passcode (default 0000) and confirm Reset."
              actor: "user"
              expect: "The set resets and power-cycles into first-run setup."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Moving networks is a device-UI operation (Settings > Network); a
        factory reset is never needed just to change routers, and issued
        AUTH tokens survive a network change.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "WiFi credentials"
        - "Paired client list with issued AUTH tokens"
      issued_to_client:
        - "AUTH_TOKEN (sent as the AUTH header on every authenticated request)"
      notes: >
        The token is a bearer credential with no documented expiry or
        rotation; any host holding it can drive the TV from the LAN.
        Identity reads (/state/device/deviceinfo, serial_number, version,
        ESN) answer WITHOUT a token — by design, since pyvizio reads the
        serial before pairing — so they must not be treated as secret
        material.

helpful_urls:
  - title: "exiva — Vizio SmartCast API (2016+ Models)"
    url: "https://github.com/exiva/Vizio_SmartCast_API"
    description: "The reverse-engineered API reference this spec follows; cURL examples for every endpoint."
  - title: "pyvizio — Python client and CLI (Home Assistant's backend, maintenance mode)"
    url: "https://github.com/raman325/pyvizio"
    description: "Reference implementation: endpoint paths, key codes, SSDP DIAL discovery and _viziocast mDNS discovery in code."
  - title: "Home Assistant VIZIO SmartCast integration"
    url: "https://www.home-assistant.io/integrations/vizio/"
    description: "User-facing pairing walkthrough and the remote command vocabulary."
  - title: "openHAB Vizio binding"
    url: "https://www.openhab.org/addons/bindings/vizio/"
    description: "Second independent implementation; confirms port split, pairing, and app NAME_SPACE quirks."
  - title: "Lifewire — Vizio TV restart troubleshooting (factory reset and Power Mode menu paths)"
    url: "https://www.lifewire.com/fix-vizio-tv-that-keeps-turning-on-and-off-5198526"
    description: "Secondary confirmation of the factory-reset path (default passcode 0000) and the Eco/Quickstart Power Mode setting location."

# Everything needed to build a SmartCast request byte for byte, in the role
# ecp_common plays for Roku — including the parts the reference app cannot
# yet send (see transport_gap).
smartcast_common:
  transport: "HTTPS"
  transport_gap: >
    The reference app today implements HTTP GET/POST with an empty body
    and no custom headers. This protocol needs FOUR things it does not
    have: (1) HTTPS with certificate verification disabled (self-signed
    TV certificate), (2) PUT requests with a JSON body and Content-Type:
    application/json, (3) an AUTH header on every request after pairing,
    (4) for settings writes, a read-modify-write carrying the current
    HASHVAL back. Every `commands` entry below therefore states the real
    method and arguments but is NOT sendable by the reference app as-is;
    a consumer must implement the transport described here first. The
    unauthenticated GETs (Device Info, Serial Number, Version, ESN) are
    the exception — only the TLS step gates them.
  tls:
    description: >
      HTTPS only, on both ports; plain HTTP gets no answer. The TV serves
      a self-signed certificate (CN observed historically as
      BG2.prod.vizio.com); clients must disable chain and hostname
      verification, exactly as pyvizio does with ssl=False.
  request_format:
    description: >
      Requests go to https://<ip>:<port><path> with <port> 7345 on
      firmware 4.0+ and 9000 on older sets (try 7345 first, fall back).
      Bodies are JSON; every PUT sets Content-Type: application/json.
      Authenticated requests add one header, spelled AUTH by pyvizio
      (HTTP header names are case-insensitive; exiva writes it Auth):
      AUTH: <AUTH_TOKEN>. The pairing endpoints themselves are
      unauthenticated, as are the identity reads.
    http:
      url: "https://<ip>:<port><path>"
      headers: "Content-Type: application/json on PUTs; AUTH: <token> on authenticated calls."
      body: "JSON object per endpoint; GETs send none."
    escaping: >
      JSON strings, nothing further. Setting values that are strings in
      the UI ("On", "HDMI-1") are sent as JSON strings; sliders take
      integers; the wire type to send is stated by the item's TYPE field
      in the settings read.
  response_format:
    description: >
      Every response is a JSON object with a STATUS envelope
      {"RESULT": ..., "DETAIL": ...}, the requested URI, and a TIME
      string. HTTP status codes are NOT meaningful — the API answers 200
      for failures and the verdict lives in STATUS.RESULT ("success",
      "failure", "uri_not_found", "requires_pairing", "invalid_parameter",
      ...). A client that checks only the HTTP status will report failed
      writes as delivered. Query endpoints answer ITEMS (a list of items
      with CNAME/NAME/TYPE/VALUE/HASHVAL); pairing answers a single ITEM.
  key_commands:
    description: >
      Remote keys are PUT /key_command/ with {"KEYLIST": [{"CODESET":
      int, "CODE": int, "ACTION": "KEYPRESS"|"KEYDOWN"|"KEYUP"}]}.
      KEYPRESS is press-and-release; KEYDOWN/KEYUP pair for a hold. The
      KEYLIST array can string several key events into one request.
      Codesets are families: 0 ASCII (channel digits 0-9 are codes
      48-57), 2 transport, 3 D-pad, 4 navigation, 5 audio, 6 video, 7
      input, 8 channel, 9 color/exit, 11 power. The full (codeset, code)
      table this spec implements lives in the `commands` block below;
      pyvizio const.py is the source of record. Home Assistant
      additionally documents a `guide` command whose codeset/code pair
      does not appear in pyvizio or the exiva tables — not catalogued
      here for lack of a sourced value.
  settings_tree:
    description: >
      All on-screen settings are a readable/writable tree under
      /menu_native/dynamic/tv_settings/<cname> (audio_settings on sound
      bars); /menu_native/static/tv_settings/<cname> enumerates the
      allowed choices/ranges. Reads return ITEMS with TYPE telling the
      value kind (T_VALUE_V1 on/off-style, T_VALUE_ABS_V1 slider,
      T_LIST_V1 choice, T_MENU_V1 submenu, ...). WRITES ARE
      READ-MODIFY-WRITE: PUT /menu_native/dynamic/tv_settings/<cname>/
      <item_cname> with {"REQUEST": "MODIFY", "VALUE": ..., "HASHVAL":
      <current hash from the read>} — the HASHVAL is optimistic
      concurrency, and a stale one is rejected. exiva warns that writing
      an out-of-range value can brick sets; honour the static options and
      the TYPE. Top-level CNAME groups include picture, audio, timers,
      network, channels, closed_captions, devices, system,
      mobile_devices, cast. Inputs are the devices subtree:
      devices/name_input lists inputs (ITEMS[x].NAME is the switchable
      name), devices/current_input reads/switches the active one, and the
      current input's own HASHVAL (not the list's) is what a switch sends
      back.
  apps:
    description: >
      PUT /app/launch with {"VALUE": {"APP_ID": str, "NAME_SPACE": int,
      "MESSAGE": str|null}} launches an app; GET /app/current returns the
      foreground one as ITEM.VALUE with the same three fields, or an
      empty VALUE when none is running (pyvizio reports that as
      _NO_APP_RUNNING, and an unrecognised (APP_ID, NAME_SPACE) pair as
      _UNKNOWN_APP). NAME_SPACES 2 and 4 are treated as equivalent by
      pyvizio, and NAME_SPACE 0 means a cast session. THE TV DOES NOT
      LIST ITS APPS: the (APP_ID, NAME_SPACE, MESSAGE) catalogue comes
      from Vizio's app-catalog service or a client's bundled copy
      (pyvizio ships one in pyvizio/data/apps.json), so an app launcher
      is a static-table select, not a device-backed one. SmartCast Home
      itself is launchable as APP_ID "1", NAME_SPACE 4. While an app is
      in the foreground the current_input reads "SMARTCAST" or "CAST".
  power:
    description: >
      GET /state/device/power_mode answers ITEMS[0].VALUE as 1 (on) or 0
      (standby). The API server itself is down while the set sleeps, so
      a powered-off TV is unreachable rather than answering 0 forever;
      waking it needs a Wake-on-LAN magic packet, which does not work
      when the set's Settings > System > Power Mode is Eco Mode (the
      "Quickstart"/moderate modes keep the network stack warm enough).
      POW_ON (11,1) is therefore only reliable from the warm-standby
      modes.

http_endpoints:
  - method: "PUT"
    path: "/pairing/start"
    name: "Begin Pairing"
    description: >
      Unauthenticated. Opens a pairing session; the TV displays a 4-digit
      PIN. Save DEVICE_ID (needed again to finish or cancel) and the
      returned PAIRING_REQ_TOKEN and CHALLENGE_TYPE. Results include
      BLOCKED (pairing already in progress) and
      MAX_CHALLENGES_EXCEEDED.
    request_body:
      content_type: "application/json"
      fields:
        - name: "DEVICE_ID"
          type: "string"
          required: true
          description: "Client-chosen identifier, reused on /pairing/pair and /pairing/cancel."
        - name: "DEVICE_NAME"
          type: "string"
          required: true
          description: "Name the TV lists under Settings > System > Mobile Devices."
      example: |
        {"DEVICE_ID":"opengreeniot-01","DEVICE_NAME":"OpenGreenIoT"}
    response_body:
      content_type: "application/json"
      example: |
        {"ITEM": {"PAIRING_REQ_TOKEN": 654321, "CHALLENGE_TYPE": 1},
         "STATUS": {"RESULT": "SUCCESS", "DETAIL": "Success"}}
  - method: "PUT"
    path: "/pairing/pair"
    name: "Finish Pairing"
    description: >
      Unauthenticated. Trades the on-screen PIN for the AUTH_TOKEN the
      client must store and send as the AUTH header thereafter.
      RESPONSE_VALUE is the PIN as a string; PAIRING_REQ_TOKEN and
      CHALLENGE_TYPE are from Begin Pairing. Results include
      PAIRING_DENIED (wrong PIN) and VALUE_OUT_OF_RANGE.
    request_body:
      content_type: "application/json"
      fields:
        - name: "DEVICE_ID"
          type: "string"
          required: true
        - name: "CHALLENGE_TYPE"
          type: "integer"
          required: true
        - name: "RESPONSE_VALUE"
          type: "string"
          required: true
          description: "The 4-digit PIN shown on the TV."
        - name: "PAIRING_REQ_TOKEN"
          type: "integer"
          required: true
      example: |
        {"DEVICE_ID":"opengreeniot-01","CHALLENGE_TYPE":1,"RESPONSE_VALUE":"1234","PAIRING_REQ_TOKEN":654321}
    response_body:
      content_type: "application/json"
      example: |
        {"ITEM": {"AUTH_TOKEN": "Z2x6aHh4eQ=="},
         "STATUS": {"RESULT": "SUCCESS", "DETAIL": "Success"}}
  - method: "PUT"
    path: "/pairing/cancel"
    name: "Cancel Pairing"
    description: >
      Unauthenticated. Aborts an in-progress pairing; per the exiva
      write-up RESPONSE_VALUE is hard-coded "1111" for cancellation.
    request_body:
      content_type: "application/json"
      example: |
        {"DEVICE_ID":"opengreeniot-01","CHALLENGE_TYPE":1,"RESPONSE_VALUE":"1111","PAIRING_REQ_TOKEN":654321}
  - method: "GET"
    path: "/state/device/deviceinfo"
    name: "Device Info"
    description: >
      Unauthenticated (pyvizio reads it before pairing). Device info
      document; the model name sits at ITEMS[0].VALUE.system_info.model_name
      on TVs (plain VALUE.name on sound bars). This is the on-device
      identity read after SSDP has found the host.
    response_body:
      content_type: "application/json"
  - method: "GET"
    path: "/menu_native/dynamic/tv_settings/system/system_information/tv_information/serial_number"
    name: "Serial Number"
    description: >
      Unauthenticated (pyvizio uses it as the pre-pairing unique id).
      ITEMS[0].VALUE is the serial string — the spec's primary stable
      identity key. Newer firmware moved the system_information branch
      under admin_and_privacy; pyvizio carries both spellings and tries
      the alternate on failure.
    response_body:
      content_type: "application/json"
  - method: "GET"
    path: "/menu_native/dynamic/tv_settings/system/system_information/tv_information/version"
    name: "Firmware Version"
    description: "Unauthenticated. ITEMS[0].VALUE is the firmware version string."
    response_body:
      content_type: "application/json"
  - method: "GET"
    path: "/state/device/power_mode"
    name: "Power Mode"
    description: >
      Authenticated. ITEMS[0].VALUE is 1 (on) or 0 (standby). Unreachable
      rather than wrong when the set is fully asleep — see
      smartcast_common.power.
    response_body:
      content_type: "application/json"
      example: |
        {"ITEMS": [{"TYPE": "T_VALUE_V1", "CNAME": "power_mode", "NAME": "Power Mode", "VALUE": 1}],
         "PARAMETERS": {"HASHONLY": "FALSE", "FLAT": "TRUE", "HELPTEXT": "FALSE"},
         "STATUS": {"RESULT": "SUCCESS", "DETAIL": "Success"}}
  - method: "PUT"
    path: "/key_command/"
    name: "Key Command"
    description: >
      Authenticated. Sends remote key events; see
      smartcast_common.key_commands for the codeset table and hold
      semantics. Trailing slash is part of the path as documented and as
      pyvizio sends it.
    request_body:
      content_type: "application/json"
      fields:
        - name: "KEYLIST"
          type: "array"
          required: true
          description: "List of {CODESET: int, CODE: int, ACTION: KEYPRESS|KEYDOWN|KEYUP}; multiple entries chain into one request."
      example: |
        {"KEYLIST": [{"CODESET": 11, "CODE": 2, "ACTION": "KEYPRESS"}]}
    response_body:
      content_type: "application/json"
  - method: "GET"
    path: "/app/current"
    name: "Current App"
    description: >
      Authenticated. ITEM.VALUE is {APP_ID, NAME_SPACE, MESSAGE} for the
      foreground app, or empty when none is running; NAME_SPACE 0 means a
      cast session. Mapping the pair to a name needs the external app
      catalogue — see smartcast_common.apps.
    response_body:
      content_type: "application/json"
  - method: "PUT"
    path: "/app/launch"
    name: "Launch App"
    description: >
      Authenticated. Launches an app by its catalogue triple. There is no
      on-device app list to enumerate first — see smartcast_common.apps.
    request_body:
      content_type: "application/json"
      example: |
        {"VALUE": {"APP_ID": "4", "NAME_SPACE": 2, "MESSAGE": null}}
    response_body:
      content_type: "application/json"
  - method: "GET"
    path: "/menu_native/dynamic/tv_settings/devices/name_input"
    name: "Input List"
    description: >
      Authenticated. ITEMS holds one item per physical/logical input;
      ITEMS[x].NAME ("HDMI-1", "COMP", "TV", ...) is the VALUE a switch
      sends, and VALUE.NAME/METADATA describe it. SMARTCAST is not an
      entry here — it reads through Current Input while an app runs.
    response_body:
      content_type: "application/json"
  - method: "GET"
    path: "/menu_native/dynamic/tv_settings/devices/current_input"
    name: "Current Input"
    description: >
      Authenticated. ITEMS[0].VALUE is the active input name ("SMARTCAST"
      or "CAST" while an app is foreground) and ITEMS[0].HASHVAL is the
      concurrency token a switch must echo back.
    response_body:
      content_type: "application/json"
  - method: "PUT"
    path: "/menu_native/dynamic/tv_settings/devices/current_input"
    name: "Set Input"
    description: >
      Authenticated. Switches the input: VALUE is a NAME from Input List,
      HASHVAL is the CURRENT INPUT's hash from a fresh read (not the
      list's). Read-modify-write, per smartcast_common.settings_tree.
    request_body:
      content_type: "application/json"
      fields:
        - name: "REQUEST"
          type: "string"
          required: true
          enum: ["MODIFY"]
        - name: "VALUE"
          type: "string"
          required: true
        - name: "HASHVAL"
          type: "integer"
          required: true
      example: |
        {"REQUEST": "MODIFY", "VALUE": "HDMI-1", "HASHVAL": 1384176329}
  - method: "GET"
    path: "/menu_native/dynamic/tv_settings/{settings_cname}"
    name: "Settings Read"
    description: >
      Authenticated. Reads one settings group (picture, audio, timers,
      network, channels, closed_captions, devices, system, mobile_devices,
      cast, and their sub-paths). ITEMS carry CNAME/NAME/TYPE/VALUE/
      HASHVAL; /menu_native/static/tv_settings/{cname} gives the allowed
      choices. See smartcast_common.settings_tree.
    response_body:
      content_type: "application/json"
  - method: "PUT"
    path: "/menu_native/dynamic/tv_settings/{settings_cname}/{item_cname}"
    name: "Settings Write"
    description: >
      Authenticated. Writes one setting with {"REQUEST": "MODIFY",
      "HASHVAL": <from the read>, "VALUE": <typed per the item's TYPE>}.
      exiva warns an invalid VALUE can brick sets — honour the static
      options table and TYPE.
    request_body:
      content_type: "application/json"
      example: |
        {"REQUEST": "MODIFY", "HASHVAL": 831638627, "VALUE": "On"}

# One invocation per remote key, as roku-ecp.yaml does — a button entity has
# nothing to fill a blank with, so each key is its own command with the
# (CODESET, CODE) pair already chosen. The arguments render into the KEYLIST
# entry of a Key Command body per smartcast_common.key_commands; every entry
# is an instance of the Key Command endpoint and shares its transport gap
# (HTTPS + PUT + JSON body + AUTH header — not sendable by the reference app
# today).
#
# Verification is "reported" throughout: the table is pyvizio's const.py key
# map cross-checked against the exiva write-up and Home Assistant's command
# list, but this project has replayed none of it against hardware.
commands:
  # -- Power (codeset 11).
  press_power_on:
    description: "Power the TV on — reliable only from a warm power mode; see smartcast_common.power."
    transport: "http"
    method: "PUT"
    path: "/key_command/"
    action: "Key Command"
    arguments: {CODESET: 11, CODE: 1, ACTION: "KEYPRESS"}
    example_body: |
      {"KEYLIST": [{"CODESET": 11, "CODE": 1, "ACTION": "KEYPRESS"}]}
    verification: "reported"
  press_power_off:
    description: "Power the TV off."
    transport: "http"
    method: "PUT"
    path: "/key_command/"
    action: "Key Command"
    arguments: {CODESET: 11, CODE: 0, ACTION: "KEYPRESS"}
    verification: "reported"
  press_power_toggle:
    description: "Toggle power."
    transport: "http"
    method: "PUT"
    path: "/key_command/"
    action: "Key Command"
    arguments: {CODESET: 11, CODE: 2, ACTION: "KEYPRESS"}
    verification: "reported"

  # -- Navigation (codeset 4) and D-pad (codeset 3).
  press_back:
