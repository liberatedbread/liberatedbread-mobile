  press_digit_5:
    description: "Channel digit 5."
    transport: "http"
    method: "PUT"
    path: "/key_command/"
    action: "Key Command"
    arguments: {CODESET: 0, CODE: 53, ACTION: "KEYPRESS"}
    verification: "reported"
  press_digit_6:
    description: "Channel digit 6."
    transport: "http"
    method: "PUT"
    path: "/key_command/"
    action: "Key Command"
    arguments: {CODESET: 0, CODE: 54, ACTION: "KEYPRESS"}
    verification: "reported"
  press_digit_7:
    description: "Channel digit 7."
    transport: "http"
    method: "PUT"
    path: "/key_command/"
    action: "Key Command"
    arguments: {CODESET: 0, CODE: 55, ACTION: "KEYPRESS"}
    verification: "reported"
  press_digit_8:
    description: "Channel digit 8."
    transport: "http"
    method: "PUT"
    path: "/key_command/"
    action: "Key Command"
    arguments: {CODESET: 0, CODE: 56, ACTION: "KEYPRESS"}
    verification: "reported"
  press_digit_9:
    description: "Channel digit 9."
    transport: "http"
    method: "PUT"
    path: "/key_command/"
    action: "Key Command"
