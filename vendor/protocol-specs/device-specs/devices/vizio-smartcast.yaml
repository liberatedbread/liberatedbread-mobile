  # -- Input and picture (codesets 7 and 6).
  press_input_next:
    description: "Cycle to the next input."
    transport: "http"
    method: "PUT"
    path: "/key_command/"
    action: "Key Command"
    arguments: {CODESET: 7, CODE: 1, ACTION: "KEYPRESS"}
    verification: "reported"
  press_picture_mode:
    description: "Cycle picture mode."
    transport: "http"
    method: "PUT"
    path: "/key_command/"
    action: "Key Command"
    arguments: {CODESET: 6, CODE: 0, ACTION: "KEYPRESS"}
    verification: "reported"
  press_picture_size:
    description: "Cycle picture size / wide mode."
    transport: "http"
    method: "PUT"
    path: "/key_command/"
    action: "Key Command"
    arguments: {CODESET: 6, CODE: 2, ACTION: "KEYPRESS"}
    verification: "reported"

  # -- The two commands that take a caller value.
  launch_app:
    description: >
      Launch an app by its catalogue triple. The TV does not enumerate
      apps, so the values come from a client-side catalogue
      (smartcast_common.apps); NAME_SPACES 2 and 4 are interchangeable,
      and MESSAGE is null for most apps.
    transport: "http"
    method: "PUT"
    path: "/app/launch"
    action: "Launch App"
    arguments:
      APP_ID: "{app_id}"
      NAME_SPACE: "{name_space}"
      MESSAGE: "{message}"
    parameters:
      app_id:
        type: "string"
        required: true
        description: "Catalogue APP_ID, e.g. \"4\" for Prime Video."
      name_space:
        type: "integer"
        required: true
        description: "Catalogue NAME_SPACE; 2 and 4 are treated as equivalent by clients."
      message:
        type: "string"
        description: "Optional launch message (usually null; some cast-backed apps need a JSON payload here)."
    verification: "reported"
  set_input:
    description: >
      Switch to a named input. VALUE comes from the Input List read;
      HASHVAL must be the CURRENT input's hash from a fresh Current Input
      read — the read-back is part of the send
      (smartcast_common.settings_tree).
    transport: "http"
    method: "PUT"
    path: "/menu_native/dynamic/tv_settings/devices/current_input"
    action: "Set Input"
    arguments:
      REQUEST: "MODIFY"
      VALUE: "{input_name}"
      HASHVAL: "{hashval}"
    parameters:
      input_name:
        type: "string"
        required: true
        description: "An ITEMS[x].NAME from the Input List read, e.g. \"HDMI-1\"."
      hashval:
        type: "integer"
        source: "state:Current Input.HASHVAL"
        description: "Optimistic-concurrency token; read it from Current Input immediately before writing."
    verification: "reported"

# The remote as controls. Every entry rides the Key Command transport, so
# every one of them inherits smartcast_common.transport_gap: none is sendable
# by the reference app until it grows HTTPS-with-unverified-TLS, PUT with a
# JSON body, and the AUTH header. Order mirrors a Vizio remote: power, then
# SmartCast/navigation, D-pad, transport, volume, channel, inputs.
entities:
  # The stateful Power control (spec-evolution P13): the discrete codeset-11
  # keys bound as roles, with the toggle beside them for consumers that have
  # read the state first. State is the same authenticated power_mode reading
  # as the Power Mode sensor below.
  - platform: "switch"
    name: "Power"
    icon: "mdi:power"
    commands:
      turn_on: "press_power_on"
      turn_off: "press_power_off"
      toggle: "press_power_toggle"
    state_topic: "/state/device/power_mode"
    notes: >
      ITEMS[0].VALUE: 1 = on, 0 = standby. Authenticated, and unreachable
      rather than wrong while the set is fully asleep (smartcast_common.power)
      — read unreachable as not-confirmed-on, never as a reason to skip the
      discrete off. turn_on is reliable only from a warm power mode.
  - platform: "button"
    name: "Power"
    icon: "mdi:power"
    commands:
      press: "press_power_toggle"
    notes: "Discrete on/off commands exist (press_power_on/off); the toggle is what the physical remote's one power key sends."
  - platform: "button"
    name: "SmartCast"
    icon: "mdi:cast"
    commands:
      press: "press_smartcast"
  - platform: "button"
    name: "Menu"
    icon: "mdi:menu"
    commands:
      press: "press_menu"
  - platform: "button"
    name: "Up"
    icon: "mdi:chevron-up"
    commands:
      press: "press_up"
  - platform: "button"
    name: "Left"
    icon: "mdi:chevron-left"
    commands:
      press: "press_left"
  - platform: "button"
    name: "OK"
    commands:
      press: "press_ok"
  - platform: "button"
    name: "Right"
    icon: "mdi:chevron-right"
    commands:
      press: "press_right"
  - platform: "button"
    name: "Down"
    icon: "mdi:chevron-down"
    commands:
      press: "press_down"
  - platform: "button"
    name: "Back"
    icon: "mdi:arrow-u-left-top"
    commands:
      press: "press_back"
  - platform: "button"
    name: "Exit"
    icon: "mdi:close-box-outline"
    commands:
      press: "press_exit"
  - platform: "button"
    name: "Info"
    icon: "mdi:information-outline"
    commands:
      press: "press_info"
  - platform: "button"
    name: "Rewind"
    icon: "mdi:rewind"
    commands:
      press: "press_seek_back"
  - platform: "button"
    name: "Play"
    icon: "mdi:play"
    commands:
      press: "press_play"
    notes: "Play and pause are discrete keys here, not one toggle."
  - platform: "button"
    name: "Pause"
    icon: "mdi:pause"
    commands:
      press: "press_pause"
  - platform: "button"
    name: "Fast Forward"
    icon: "mdi:fast-forward"
    commands:
      press: "press_seek_fwd"
  - platform: "button"
    name: "Volume Down"
    icon: "mdi:volume-minus"
    commands:
      press: "press_volume_down"
  - platform: "button"
    name: "Mute"
    icon: "mdi:volume-mute"
    commands:
      press: "press_mute_toggle"
  - platform: "button"
    name: "Volume Up"
    icon: "mdi:volume-plus"
    commands:
      press: "press_volume_up"
  - platform: "button"
    name: "Channel Up"
    icon: "mdi:chevron-double-up"
    commands:
      press: "press_channel_up"
    notes: "Meaningful on the tuner input."
  - platform: "button"
    name: "Channel Down"
    icon: "mdi:chevron-double-down"
    commands:
      press: "press_channel_down"
    notes: "Meaningful on the tuner input."
  - platform: "button"
    name: "Input"
    icon: "mdi:video-input-hdmi"
    commands:
      press: "press_input_next"
    notes: "Cycles inputs; direct selection is the Input select below."

  # Direct input selection. The options live on the device but as JSON
  # (Input List read), not as the XML document the select platform's
  # options_source contract is written against — so the sources are
  # recorded in notes rather than in options_source/state_source.
  - platform: "select"
    name: "Input"
    icon: "mdi:video-input-hdmi"
    state_topic: "/menu_native/dynamic/tv_settings/devices/current_input"
    commands:
      select_option: "set_input"
    notes: >
      Options: GET Input List — every ITEMS[x].NAME is one option
      ("HDMI-1", "COMP", ...). Current value: GET Current Input —
      ITEMS[0].VALUE; "SMARTCAST"/"CAST" mean an app is foreground and no
      listed input is current. Selecting sends set_input, whose HASHVAL
      must come from a fresh Current Input read.

  # State surfaces. All three require the AUTH header and answer the
  # STATUS-enveloped JSON smartcast_common describes; the topic alone
  # identifies the reading, per the state_topic contract.
  - platform: "sensor"
    name: "Power Mode"
    state_topic: "/state/device/power_mode"
    notes: "ITEMS[0].VALUE: 1 = on, 0 = standby. Unreachable while fully asleep."
  - platform: "sensor"
    name: "Current Input"
    state_topic: "/menu_native/dynamic/tv_settings/devices/current_input"
    notes: "ITEMS[0].VALUE is the input name; SMARTCAST/CAST while an app runs."
  - platform: "sensor"
    name: "Current App"
    state_topic: "/app/current"
    notes: "ITEM.VALUE is {APP_ID, NAME_SPACE, MESSAGE}; empty VALUE means no app running. Mapping to a name needs the external app catalogue."
