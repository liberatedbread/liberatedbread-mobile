# Smarter iKettle 2.0 / Smarter Coffee — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - ian-kent/ikettle2 protocol notes.
#   - jkellerer/iBrew (fork of Tristan79/iBrew) — cross-checked command IDs.

device:
  name: "Smarter iKettle 2.0 (and Smarter Coffee)"
  manufacturer: "Smarter Applications Ltd"
  manufacturer_status: "shutdown"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The port-2081 framing and
      command IDs are cross-checked between ian-kent/ikettle2 and iBrew (which
      tested against iKettle 2.0 firmware v19).
  protocol: "wifi"
  category: "appliance"
  transport: "tcp"
  notes: >
    The Smarter iKettle 2.0 (and the same-protocol Smarter Coffee) are Wi-Fi
    kettles/coffee makers. Smarter is still a company, but the smart features for
    these devices were removed from the app in mid-2025 — owners report the
    kettles can no longer connect to the app, leaving "very expensive ordinary
    kettles". The LAN protocol needs no cloud at all, so it is the rescue path.

    TRANSPORT: a binary protocol on port 2081, over UDP or TCP, no
    authentication. Message syntax: <id> <args> <terminator>, terminator always
    byte 0x7e ('~').

    IDs are written as hex wire byte with decimal in brackets, "0x15 (21)".
    ian-kent/ikettle2 lists them in decimal, iBrew in bare hex, so the same
    command reads "21" in one and "15" in the other. A bare "21" or "22" put
    on the wire is a different command (iBrew lists 0x21 as heat-to-stored-
    defaults and 0x22 as an unknown kettle command), so the base matters.
    COMMANDS:
      0x15 (21)   heat / boil; args <temperature> <keep-warm minutes>
      0x16 (22)   stop heating
      0x64 (100)  get device info — also the UDP-broadcast discovery probe
      0x6d (109)  firmware-update mode (disables Wi-Fi, creates an "iKettle
                  Update" AP)
    RESPONSES:
      0x03 (3)    command status (ack)
      0x14 (20)   kettle status (flag byte, temperature, water level)
      0x65 (101)  device info reply, e.g. 65 01 13 7e = device type 0x01
                  (kettle), firmware 0x13 (19)
    Water-level quirk: the first level byte reads 7 with the kettle OFF its
    base, 8 when ON the base.

    DISCOVERY: the device-info command 0x64 (100) is used over UDP broadcast after
    setup — but this fails on routers that do not forward UDP broadcasts, so a
    direct TCP connection to a known IP is the reliable path.

    NOTE: the original iKettle (v1) uses an older, different protocol. This spec
    covers the 2.0 / Smarter Coffee family.

  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/jkellerer/iBrew"
    upstream_docs:
      - url: "https://github.com/ian-kent/ikettle2/blob/master/protocol/README.md"
        title: "ian-kent/ikettle2 — protocol notes"
        covers: "The port-2081 framing, the 0x7e terminator, command/response IDs and the water-level quirk."
    notes: >
      No vendor documentation. ian-kent/ikettle2 and iBrew reverse-engineered
      the protocol; iBrew tested against iKettle 2.0 firmware v19 and also drives
      Smarter Coffee.

  identification:
    default_port: 2081

  discovery:
    methods:
      - type: "mdns"
        mdns:
          # No mDNS; discovery is the UDP-broadcast device-info command 0x64 (100),
          # which many routers drop. Placeholder; direct TCP to a known IP is the
          # reliable path. See protocol_details.smarter_protocol.
          service_type: "_http._tcp.local."
          port: 2081
          identity_mapping:
            stable_keys:
              - source: "udp:2081#device_type"
                key: "device_type"
            display:
              source: "udp:2081#device_type"
        notes: >
          Real discovery: broadcast the device-info frame `64 7e` (0x64 = 100)
          on UDP 2081; devices answer 0x65 (101) with their type + firmware. Broadcast may be
          dropped by the router — prefer a direct TCP connection.
    identity:
      stable_keys: ["mac"]
      display: "device_type"
    static_ip_required: false

  setup:
    required: true
    confidence: "low"
    notes: >
      A factory-fresh kettle hosts its own AP for Wi-Fi onboarding; joining it to
      the home network needs no cloud. The firmware-update command 0x6d (109) also
      creates an "iKettle Update" AP. Onboarding wire steps are not documented
      here.
    methods:
      - type: "softap_http"
        verified: false
        description: >
          Join the kettle's setup AP and hand it the home Wi-Fi credentials over
          the port-2081 protocol; it reboots onto the LAN and answers device-info
          0x64 (100) there.
        steps:
          - action: "Power a new/reset kettle and join its setup AP."
            actor: "user"
          - action: "Send the home Wi-Fi credentials over the port-2081 protocol."
            actor: "client"
            expect: "The kettle joins the home network and answers the 0x64 (100) device-info probe."
    factory_reset:
      applicable: true
      confidence: medium
      effect: >
        Clears the stored WiFi credentials and the pairing, returning the base
        to onboarding so it can be given a new network.
      description: >
        On the iKettle 2.0 the community-documented hard reset is holding the
        power button for about ten seconds; a client can also clear the Wi-Fi
        over the protocol (reset_wifi). Smarter's own reset article is for
        the 3rd generation, whose reset lives on the BASE with the kettle
        body lifted off. It is kept below as a variant procedure because it
        is the only vendor-documented one, not because it is known to work
        on a 2.0.

        One detail that saves a support ticket (3rd generation, per Smarter):
        after the reset the connection light keeps flashing green, which
        looks exactly like the failure state it looked like before. That is
        normal, and it does not mean the reset did not take.
      procedures:
        - name: "Hold the power button for ten seconds (iKettle 2.0)"
          verified: false
          basis: "ian-kent/ikettle2 protocol notes: the recovery from command 0x6d (109)'s update mode is a hard reset holding the power button for 10 seconds."
          power_state: "on"
          glyph: "generic/hold-button.svg"
          steps:
            - action: "Press and hold the kettle's power button for about ten seconds."
              actor: "user"
              expect: "The kettle drops its network settings and comes back up in onboarding (not established which LED pattern confirms it)."
        - name: "Clear Wi-Fi over the protocol (iKettle 2.0)"
          verified: false
          basis: "iBrew: command 0x0c (Join wireless network) sent without a preceding SSID/password resets the Wi-Fi to factory settings; ian-kent/ikettle2 says the same of command 12."
          steps:
            - action: "Send reset_wifi on the port-2081 TCP session."
              actor: "client"
              expect: "The kettle leaves the network and returns to its setup access point."
        - name: "Base button held until three beeps, then a power cycle (3rd generation)"
          verified: false
          basis: "Smarter's own support article on resetting the iKettle 3rd generation."
          power_state: "on"
          glyph: "generic/hold-button.svg"
          indicator: "Three beeps from the base."
          steps:
            - action: "Lift the kettle body off the base."
              actor: "user"
            - action: "Press and hold the button on the base until it beeps three times."
              actor: "user"
              expect: "Three beeps."
            - action: "Unplug the base for about ten seconds, then plug it back in."
              actor: "user"
              expect: "The base is back in onboarding. A flashing green connection light at this point is normal."
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: >
        No documented in-place Wi-Fi rewrite; treat a network change as a
        reprovision via the setup AP.
    credentials:
      wifi_passphrase_protection: "unknown"
      stored_on_device:
        - "Wi-Fi credentials"
      issued_to_client: []
      notes: >
        Onboarding passes the Wi-Fi credentials over the port-2081 protocol on
        the setup AP; no encryption is documented. Post-setup control is
        unauthenticated on the LAN.

# The wire protocol. Bespoke command/response material lives under
# `protocol_details`, the schema's namespace for single-spec protocol blocks
# (the schema's top level is closed).
protocol_details:
  smarter_protocol:
    transport: "port 2081, UDP or TCP, binary"
    framing: "<id> <args> <terminator 0x7e>"
    id_notation: "hex wire byte, decimal in brackets; ian-kent/ikettle2 lists decimal, iBrew bare hex"
    commands:
      "0x15 (21)": "heat / boil; args <temperature 0x00-0x64 = 0-100 C> <keep-warm minutes, 0x00 off or 0x05-0x1e>"
      "0x16 (22)": "stop heating"
      "0x64 (100)": "get device info (also the UDP-broadcast discovery probe after setup)"
      "0x6d (109)": "firmware-update mode (creates an 'iKettle Update' AP)"
    responses:
      "0x03 (3)": "command status (ack)"
      "0x14 (20)": "kettle status (flag, temperature, water level)"
      "0x65 (101)": "device info reply, e.g. 65 01 13 7e = kettle, firmware 0x13 (19)"
    water_level_quirk: "level byte reads 7 off the base, 8 on the base"

http_endpoints:
  - method: "GET"
    path: "/"
    status: "placeholder"
    name: "Local API Placeholder"
    description: >
      Placeholder only. Control is a binary protocol on port 2081 over TCP/UDP
      (see protocol_details.smarter_protocol), not HTTP.

commands:
  boil:
    description: >
      Heat / boil (command 0x15 = 21). Arguments are the target temperature
      as one byte in degrees C (0x00-0x64 = 0-100) and the keep-warm time in
      minutes (0x00 off, 0x05-0x1e); iBrew's example `15 32 00 7e` heats to
      50 C with no keep-warm. The legacy app's use of the second byte reads
      as a units flag instead, so treat it as keep-warm per iBrew and send 00.
    transport: "tcp-json"
    body: "15 <target_temp?> <keep_warm_min?> 7e"
    verification: "reported"
  stop:
    description: "Stop heating (command 0x16 = 22)."
    transport: "tcp-json"
    body: "16 7e"
    verification: "reported"
  device_info:
    description: >
      Query device type + firmware (command 0x64 = 100). Reply
      `65 <type> <firmware> 7e` (0x65 = 101). The same frame is the UDP
      discovery broadcast.
    transport: "tcp-json"
    body: "64 7e"
    verification: "reported"
  reset_wifi:
    description: >
      Join wireless network (command 0x0c = 12) with no SSID/password sent
      first: iBrew and ian-kent/ikettle2 both report that this resets the
      Wi-Fi to factory settings. The app's normal join sends
      `0c 7e 00 00 00 00 00 00` after the name and password frames.
    transport: "tcp-json"
    body: "0c 7e"
    verification: "reported"
    advanced: true
    advanced_reason: >
      Forgets the home Wi-Fi: the kettle drops off the network and has to be
      set up again from its access point.
  enter_firmware_update:
    description: >
      Enter firmware-update mode (command 0x6d = 109). The kettle drops off
      the home Wi-Fi and raises its own "iKettle Update" access point; iBrew
      notes it also opens TCP port 6000 there.
    transport: "tcp-json"
    body: "6d 7e"
    verification: "reported"
    advanced: true
    advanced_reason: >
      Takes the kettle off your Wi-Fi and into its update access point, where
      it waits for a firmware image. Smarter's update service is gone, so there
      is no image to give it. The community notes get it back with a hard
      reset (hold the power button about ten seconds) or by pulling power for
      a moment; neither is verified here.

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["custom"]
      transport: "tcp"
      image:
        signing: "unknown"
        source: "unknown"
        notes: >
          The vendor's update service went with the rest of the smart features
          in 2025. No image source is known.
      enter:
        how: "command"
        command: "enter_firmware_update"
      dfu_mode:
        ssid_prefix: "iKettle Update"
        notes: >
          The kettle leaves the home network and hosts the "iKettle Update"
          access point instead; whether the SSID carries a suffix is not
          established. A client that loses the kettle on the LAN and sees this
          AP should report it as mid-update, not as a new device.
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        Entry and the update AP are from the community protocol notes
        (ian-kent/ikettle2, iBrew), not hardware-verified. The legacy app's
        own update path (research-notes/smarter-ikettle.md, app-derived and
        not cross-checked) sends an update-init frame `6E 7E`, then
        `70 <len32> 7E` followed by 261-byte image blocks with a `7E 7E 7E`
        trailer, over the port-2081 TCP session. How that relates to command
        0x6d (109) and the update AP (same flow, or two paths) is not
        established; neither ian-kent/ikettle2 nor iBrew lists 0x6e (110) or
        0x70 (112), so the mechanism is `custom` and `6E` is not declared as a
        command.

entities:
  - platform: "switch"
    name: "Kettle"
    icon: "mdi:kettle"
    commands:
      turn_on: "boil"
      turn_off: "stop"

helpful_urls:
  - title: "ian-kent/ikettle2 — protocol notes"
    url: "https://github.com/ian-kent/ikettle2/blob/master/protocol/README.md"
    description: "Port-2081 framing, the 0x7e terminator, command/response IDs and the water-level quirk."
  - title: "jkellerer/iBrew"
    url: "https://github.com/jkellerer/iBrew"
    description: "iBrew fork — console/CLI/library for iKettle 2.0 and Smarter Coffee (tested against firmware v19)."
  - title: "Smarter support: resetting the iKettle 3rd generation (Internet Archive)"
    url: "https://web.archive.org/web/20231202052316/https://support.smarter.am/hc/en-us/articles/115005044805-How-do-I-reset-the-iKettle-3rd-Generation-"
    kind: "vendor_support"
    description: >
      Source for the reset in this spec. Archived because Smarter has shut down and the live support site no longer answers.
