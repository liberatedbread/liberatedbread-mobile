# TTLock / Sciener BLE Locks — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - Fusseldieb/ttlock-reverse-engineering (community RE of the BLE frame/crypto).
#   - nv1t "The weird BLE-Lock" (cloud-side security research).
#   - ttlock/Android_SDK_Demo (the official closed SDK, for the feature surface).
#   - roquerodrigo/ha-ttlock-ble @ 06c2a85 (maintained local-BLE Home Assistant
#     integration: per-lock credential set, frame-header defaults, advert state).
#   - kind3r/hass-addons @ 46a4be3 (legacy local pair/reset add-on; unmaintained).

device:
  name: "TTLock / Sciener BLE Locks (rebadged smart deadbolts, padlocks, cabinet locks)"
  manufacturer: "Sciener (TTLock platform) — rebadged by hundreds of OEMs"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The GATT UUIDs, frame layout
      (magic 7F 5A, CRC-8/MAXIM, CRLF), and AES-CBC/PKCS5 crypto are from
      Fusseldieb/ttlock-reverse-engineering; the cloud-side vulnerabilities from
      nv1t's teardown. The Fusseldieb RE authors report their AES key-exchange
      is not fully solved (residual padding errors), but two open-source
      implementations report working local control: kind3r/ttlock-sdk-js
      (init/lock/unlock of V3 locks) and roquerodrigo/ha-ttlock-ble
      (lock/unlock, state, battery and push events from provisioned keys).
      Those are third-party success reports, not runs by this project.
  protocol: "ble"
  category: "lock"
  notes: >
    TTLock is a white-label BLE lock stack by Sciener, rebadged by a huge number
    of OEMs (generic "S2xx" smart deadbolts, padlocks, cabinet locks). Sciener is
    active and ships a closed Android/iOS SDK and a cloud, but does NOT publish
    the BLE wire protocol; the community has partially reverse-engineered it.
    Local control is possible: the cloud is only for key/passcode issuance, and
    once a client holds the lock's per-lock credential set it can lock and
    unlock over BLE offline. That set is more than the AES key (reported, from
    roquerodrigo/ha-ttlock-ble's account-free manual-key path): the lock MAC,
    the 16-byte AES key, the numeric unlock key (as issued at initialisation,
    not the obfuscated form the vendor cloud returns), an optional numeric
    admin passcode, and the five frame-header values below. Lock/unlock needs
    no admin passcode, but passcode management and the sound setting do, and a
    hand-entered key often lacks it -- so basic actuation working is not proof
    that admin features will. The cloud's other per-key fields (user id,
    validity window) never reach the wire: that integration sends its
    user-time check with a zeroed user id and the firmware's permanent-key
    date values. The same integration offers Schlage Breeze accounts as a
    second TTLock-platform app at sign-in; that does not establish that every
    Breeze lock works on the manual-key path.

    GATT: command writes on characteristic 0000fff2 (write-without-response),
    status notifications on 0000fff4; battery is the standard 0x2A19 under 0x180F.
    (A Nordic legacy DFU service 00001530-1212-efde-1523-785feabcd123 is also
    present for OTA. Only its presence is recorded, in
    features[type: firmware_update], so a generic client knows to keep out of
    it; the update procedure is deliberately not documented: bricking risk.)

    FRAME: [12-byte header][16-32 byte data][3-byte tail]. Header bytes 0-1 are
    the fixed magic 7F 5A; byte 2 protocol type, byte 3 sub-version, byte 4
    scene, bytes 5-6 groupId, bytes 7-8 orgId, byte 9 command id, byte 10
    encryption flag, byte 11 data length. Tail = 1 byte CRC-8/MAXIM over
    header+payload, then CRLF (0D 0A) terminating every packet. The header
    values are per lock: ha-ttlock-ble defaults to protocol type 5,
    sub-version 3, scene 2, groupId 1, orgId 1 and describes those as right
    for most V3 locks, not for every TTLock variant (reported). The lock
    advertises its own protocol type, sub-version and scene, so a client can
    read those three from a scan and check them before connecting; a wrong
    value shows up as a lock that never answers.

    CRYPTO: data is AES/CBC/PKCS5, 16-byte blocks, with the IV equal to the key
    (16 bytes). A pre-AES XOR obfuscation is applied per byte using a 256-entry
    CRC table. Encryption is confirmed for protocol 5 / sub-version 3; the AES
    key (aesKeyArray) is retrieved from the lock after successful pairing (it is
    NOT one global constant). Auth is a custom multi-packet key exchange, not
    standard BLE bonding.

  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/Fusseldieb/ttlock-reverse-engineering"
    upstream_docs:
      - url: "https://github.com/Fusseldieb/ttlock-reverse-engineering"
        title: "Fusseldieb/ttlock-reverse-engineering"
        covers: "The GATT UUIDs, the 7F 5A frame layout, CRC-8/MAXIM + CRLF tail, and the AES-CBC (IV=key) crypto."
    notes: >
      Sciener publishes a closed SDK (black-box native lock core) and a
      registered-developer cloud API, but not the BLE frame/crypto. The community
      RE is the only open wire documentation and is incomplete (the AES
      key-exchange is not fully solved).

  security_advisory:
    severity: "reported"
    summary: >
      TTLock's cloud API has had severe public flaws (user enumeration, exposed
      passcodes) that let a researcher open locks; older BLE variants are weakly
      protected.
    detail: >
      nv1t's teardown of a TTLock-family lock reported a certificate-pinning
      bypass via a hardcoded string, SQL injection in a lock-info endpoint, and
      an IDOR / user-enumeration flaw exposing ~502,000 user records with lock
      passcodes returned by the API — enough to open affected locks. This is a
      cloud-side issue (not a BLE replay), and its patch status is not
      established here. Older/plaintext BLE protocol variants are also weakly
      protected per the RE work.
    advisory_url: "https://nv1t.github.io/blog/the-weired-ble-lock/"

  identification:
    local_name_prefix: "S2"
    manufacturer_data:
      description: >
        The BLE advertisement local name encodes the last 6 MAC octets in
        REVERSED byte order (e.g. a name ending "_abcdef" corresponds to MAC
        ...ef:cd:ab). Many rebadged models advertise an "S2xx" style name.

        Manufacturer data carries lock state, so status can be tracked
        passively with no connection (reported, roquerodrigo/ha-ttlock-ble):
        protocol type, sub-version and scene (the first three frame-header
        values), the bolt position and battery level, an indication that
        unsynced operation-log records are waiting, and the lock's own MAC,
        which that integration checks against the advertiser address before
        trusting a payload. A dormant lock advertises without a usable bolt
        position (battery only). The lock stops advertising while a session
        is held open. The byte offsets live in that project's separate
        ttlock-ble SDK and are not recorded here yet. Its Bluetooth matcher
        keys on manufacturer ID 773 (0x0305); hypothesis, not checked: that
        is not a SIG company assignment but protocol type 5 / sub-version 3
        sitting in the company-ID slot (05 03 on the wire), so it would miss
        locks on other protocol versions -- do not use it as a sole matcher.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "regex"
            value: "^S[0-9]"
        notes: >
          Rebadged TTLock deadbolts commonly advertise an "S2xx"-style name whose
          suffix is the reversed last-6-MAC. Because OEMs rename freely, confirm
          by connecting and exchanging a 7F 5A-framed packet.
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      Pairing is done through the TTLock app, which registers the lock to a cloud
      account and provisions the per-lock AES key material; passcodes/eKeys are
      issued through the cloud but can be used offline. A third-party client needs
      the lock's aesKeyArray and unlock key (from a successful pairing; plus the
      admin passcode for admin operations) to drive it locally. A lock that was
      initialised locally can be driven with those values alone and no TTLock
      account (ha-ttlock-ble's manual-key path, reported); that path accepts
      the output of an initialisation, it does not perform one.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Pair with the lock to obtain its per-lock AES key (aesKeyArray), then
          connect, subscribe to notify char 0000fff4, and write 7F 5A-framed,
          AES-CBC-encrypted commands to 0000fff2.
        ble:
          pairing_required: true
        steps:
          - action: "Pair the lock (via the TTLock app or a client that implements the key exchange) to obtain the per-lock AES key."
            actor: "user"
          - action: "Connect, subscribe to 0000fff4, and write framed/encrypted commands to 0000fff2."
            actor: "client"
    factory_reset:
      applicable: true
      confidence: medium
      effect: >
        Returns the lock to factory state: the account binding and the per-lock
        AES key are cleared, along with enrolled passcodes and fingerprints,
        and the lock reverts to its default master passcode. Any client holding
        the old key stops working and the lock must be added to an account
        again to issue a new one.
      description: >
        The TTLock/Sciener platform is sold under dozens of OEM names and the
        control layout differs between them, so identify which of these two
        shapes the lock in hand has before starting. What does not vary is the
        consequence: a reset lock is wide open on a documented default
        passcode until it is re-enrolled, so do not reset a door and then walk
        away from it.
      procedures:
        - name: "Reset button on the rear panel held for five seconds"
          glyph: "generic/hold-button.svg"
          verified: false
          basis: >
            The TTLock A260 WiFi smart lock user manual, which documents the
            button, the hold time and the resulting default passcode.
          applies_to: ["TTLock A260 and similar keypad/fingerprint rebrands"]
          hold_seconds: 5
          power_state: "on"
          indicator: "Two audible tips from the lock."
          steps:
            - action: "Open the door and find the single Reset button on the back of the rear panel."
              actor: "user"
            - action: "Press and hold it for five seconds, until the lock gives two audible tips."
              actor: "user"
              expect: >
                The lock is in factory state and opens to any passcode or
                fingerprint until it is re-enrolled. The documented default
                master passcode is 123456 — a product-wide vendor default, not
                a per-unit secret, and the reason a freshly reset lock should
                not be left on a door.
            - action: "Press the reset button for three seconds and enter 000# to initialise, if the model prompts for an initialisation passcode."
              actor: "user"
              expect: "The lock announces success."
              notes: "Documented for the A260; not all rebrands ask for this step."
        - name: "Clear the lock data from the setting button (button-and-beep models)"
          glyph: "generic/press-two-buttons.svg"
          verified: false
          basis: >
            The Lagute/Sciener smart lock instructions, which document the
            setting-button flow used by the models with no keypad.
          applies_to: ["Sciener/Lagute button-and-beep rebrands"]
          power_state: "on"
          indicator: "A single beep confirms the lock is empty."
          steps:
            - action: "Hold the setting button beside the batteries until a long beep says the lock is in setting mode, and keep holding."
              actor: "user"
            - action: "Still in setting mode, hold the unlock button until a beep sounds."
              actor: "user"
              expect: "One beep — the lock's data is cleared."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "No network membership; a client with the key re-connects independently."
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device:
        - "Per-lock AES key (aesKeyArray), provisioned at pairing"
        - "Issued passcodes / eKeys"
      issued_to_client:
        - "The per-lock AES key (after successful pairing)"
        - "The numeric unlock key, needed for lock/unlock"
        - "The numeric admin passcode (admin key holders only), needed for passcode/fingerprint/card management and settings"
      notes: >
        The per-lock AES key gates control; it is provisioned at pairing (not a
        global constant). Lock/unlock also needs the unlock key, and admin
        operations the admin passcode (ha-ttlock-ble's manual-key form,
        reported). All three are live per-lock secrets: keep them out of logs,
        diagnostics and examples. There is no Wi-Fi on the lock itself (a separate TTLock
        Wi-Fi gateway exists). See the security_advisory: the cloud that issues
        keys/passcodes has had severe public flaws.

  pairing:
    required: true
    confidence: "medium"
    security_mode: "app_layer"
    bonding: "none"
    exclusivity:
      single_connection: "unknown"
      single_bond: true
      recovery: >
        A lock that is already initialised will not accept a new admin. Get
        the current admin to delete the lock from their app (which resets it
        over BLE), or factory-reset it at the hardware, then initialise it
        again. Close the TTLock app on nearby phones while doing so.
      notes: >
        Initialisation only works while the lock is in setting mode, which
        it advertises as a flag in its advertisement data and leaves for
        good once an admin is added. Other people get access as eKeys and
        passcodes the admin issues (through the vendor cloud, in the stock
        app), not by pairing again.
    enter_pairing_mode:
      required: true
      window_seconds: 10
      indicator: "The keypad lights up."
      notes: >
        Two conditions: the lock must be in setting (factory) mode, and it
        must be awake. A lock sleeps between uses and is discoverable only
        for roughly 10-15 seconds after it is woken, so a client should be
        scanning already, or wake the lock a few seconds after starting its
        scan — a lock woken too early can fall asleep again before the
        initialisation finishes.
      procedures:
        - name: "Touch the keypad to wake a factory-state lock, then initialise"
          verified: false
          basis: >
            kind3r/ttlock-sdk-js (GPL-3.0), whose README documents the wake
            requirement and the 10-15 second window for its init example.
          power_state: "on"
          steps:
            - action: "If the lock has been added before, factory-reset it first (see setup.factory_reset)."
              actor: "user"
            - action: "Touch the keypad to wake the lock."
              actor: "user"
              expect: "The keypad lights; the lock advertises with its setting-mode flag set."
            - action: "Connect within the window and run the initialisation exchange."
              actor: "client"
    unpair:
      supported: false
      requires_factory_reset: true
      notes: >
        Removing the admin is a reset: the stock app's delete sends the
        lock's reset command over BLE, and ttlock-sdk-js's reset does the
        same — the lock returns to setting mode with its AES key, admin,
        passcodes and fingerprints gone. Revoking a non-admin eKey is a
        cloud-side operation in the vendor's account system rather than
        anything a local client can do on the lock.
    notes: >
      Authentication is a custom multi-packet exchange rather than BLE
      bonding, so nothing appears in the operating system's Bluetooth
      settings. Initialising a factory-state lock fetches an AES key the
      lock itself generates and registers the client as admin with
      credentials the client chooses; every later command is encrypted with
      that key. No cloud is needed for this: ttlock-sdk-js (the basis of a
      Home Assistant add-on) initialises, locks and unlocks V3-protocol
      locks entirely over BLE, though its author reports initialisation
      sometimes fails and has to be repeated. Treat that add-on
      (kind3r/hass-addons) as historical evidence, not a maintained base: its
      README says the author cannot maintain it, citing differently-behaving
      TTLock variants and unstable BLE, and its last commit is 2022-07-26.
      The maintained roquerodrigo/ha-ttlock-ble does not initialise locks; it
      consumes keys from the vendor cloud or from a prior local
      initialisation. The vendor cloud matters only in the stock app's world, where it
      stores the lock data after pairing and issues eKeys and passcodes to
      other users. Possession of the lock is the authorisation — whoever
      initialises it first owns it — which is why a reset lock should not
      be left on a door. The key is per-lock and belongs to its owner, so no
      value appears here.
features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["nordic_legacy_dfu"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "vendor_cloud"
        notes: >
          A stock legacy Nordic bootloader takes unsigned images with a CRC-16
          init packet; whether Sciener changed that is not established. Images
          are served per lock (reported, static analysis of the official app
          9.9.260902): its update screen asks the vendor cloud for update
          metadata keyed by the lock ID plus the lock's model, hardware and
          firmware revisions, then downloads whatever URL comes back for that
          lock. No owner-independent public image or image URL has been
          located -- neither the vendor SDK demo nor either open-source
          integration ships one -- and a generic "TTLock firmware" file would
          be unsafe across the platform's many model and hardware revisions.
      enter:
        how: "unknown"
        notes: >
          Not documented on purpose. The stack's buttonless entry (01 04 on
          the legacy control point) is in firmware-update.md; nothing here
          says whether this firmware honours it.
      dfu_mode:
        notes: >
          Not observed. A stock legacy bootloader advertises "DfuTarg", and
          whether it moves address depends on the SDK version, so nothing
          yet binds a DfuTarg advert back to a TTLock lock.
      services: ["00001530-1212-efde-1523-785feabcd123"]
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        Service presence from the community reverse engineering; the vendor's
        closed SDK also exposes a DFU feature. A replacement client should
        recognise the service and leave it alone: a failed update on a lock
        can strand the door.

services:
  - uuid: "00001910-0000-1000-8000-00805f9b34fb"
    name: "TTLock command service (0x1910)"
    notes: >
      Command channel (GATT service 0x1910; per the Fusseldieb gatttool dump the
      fff2/fff4 characteristics sit inside service 0x1910, not a 0xFFF0 service).
      Characteristics resolved by UUID: write 0000fff2
      (write-without-response), notify 0000fff4. All packets are
      [12B header (magic 7F 5A ...)][data][CRC-8/MAXIM][CRLF]; data is
      AES/CBC/PKCS5 with IV = key. A Nordic legacy DFU service
      (00001530-1212-efde-1523-785feabcd123) is also present for OTA; see its
      own entry below.
    characteristics:
      - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
        name: "Command write"
        properties: ["write_without_response"]
        notes: "7F 5A-framed, AES-CBC-encrypted command packets (lock/unlock, passcode ops)."
      - uuid: "0000fff4-0000-1000-8000-00805f9b34fb"
        name: "Status notify"
        properties: ["notify"]
        notes: "Framed responses and status; 16-byte encrypted data packets carry a trailing checksum byte."
      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "Battery Level (standard)"
        properties: ["read"]
        notes: "Standard SIG Battery Level (uint8 %) under service 0x180F."
        format:
          - offset: 0
            length: 1
            name: "battery_level"
            type: "uint8"
            unit: "%"
            device_class: "battery"
            notes: >
              The SIG-defined layout; not read back from a lock by this
              project (reported, not confirmed).

  - uuid: "00001530-1212-efde-1523-785feabcd123"
    name: "Nordic Legacy DFU Service"
    notes: >
      The firmware-update path, not a control surface: list it read-only and
      never write to it. Present on the lock per the community reverse
      engineering (Fusseldieb/ttlock-reverse-engineering); its
      characteristics and the update procedure are intentionally not
      documented here (bricking risk). See features[type: firmware_update].

entities:
  - platform: "sensor"
    name: "Battery"
    device_class: "battery"
    unit: "%"
    state_characteristic: "00002a19-0000-1000-8000-00805f9b34fb"
    state_mapping:
      value: "battery_level"
    notes: "Standard battery-level characteristic."

helpful_urls:
  - title: "Fusseldieb/ttlock-reverse-engineering"
    url: "https://github.com/Fusseldieb/ttlock-reverse-engineering"
    description: "Community RE: GATT UUIDs, the 7F 5A frame, CRC-8/MAXIM + CRLF, AES-CBC (IV=key) crypto."
  - title: "nv1t — The weird BLE-Lock (security teardown)"
    url: "https://nv1t.github.io/blog/the-weired-ble-lock/"
    description: "Cloud-side vulnerabilities (user enumeration, exposed passcodes) affecting TTLock-family locks."
  - title: "ttlock/Android_SDK_Demo (official closed SDK)"
    url: "https://github.com/ttlock/Android_SDK_Demo"
    description: "The vendor's public (but closed-core) SDK — confirms the lock/gateway/DFU feature surface, not the wire format."
  - title: "TTLock A260 user manual (PDF)"
    url: "https://digitalas.lt/img/cms/Instructions_ENG/A260%20User%20Manual%20TTLOCK%20202008.pdf"
    kind: "manual"
    description: >
      Distributor-hosted vendor manual for the A260 — the source of the five-second rear reset button and the 123456 default master passcode in this spec.
  - title: "TTLock A210 series user manual"
    url: "https://www.manualslib.com/manual/3463905/Ttlock-A210-Series.html"
    kind: "manual"
    description: >
      A sibling model, useful because the rebadges vary in which controls they expose.
  - title: "roquerodrigo/ha-ttlock-ble"
    url: "https://github.com/roquerodrigo/ha-ttlock-ble"
    description: "Maintained Home Assistant integration: local BLE lock/unlock, state, battery and push events from cloud-downloaded or hand-entered per-lock keys."

remaining_unknowns:
  - "Account-free initialisation of an arbitrary factory-state lock by a maintained tool: ttlock-sdk-js reports it for V3 locks, but the add-on built on it says it is unmaintained; ha-ttlock-ble only consumes keys from a prior initialisation."
  - "Byte offsets of the advertised state (bolt position, battery, records-pending, protocol header values, MAC); they live in the ttlock-ble SDK, which was not inspected."
  - "Whether manufacturer ID 773 (0x0305) is really protocol type 5 / sub-version 3 in the company-ID slot, and what non-V3 locks advertise there."
  - "Which locks the V3 frame-header defaults (5, 3, 2, 1, 1) do not fit, and what they use instead."
  - "Whether Schlage Breeze locks accept the manual-key path; they are known only as a second TTLock-platform account type."
  - "A safe, generic factory-reset procedure across rebrands; the two procedures above are model-specific and unexecuted."
  - "Certificate pinning in the current official app (not dynamically tested), and whether the cloud flaws in the security advisory are patched."
  - "An owner-independent firmware image: none located (not proven not to exist); lock-side image signing is unknown."

evidence:
  artifacts:
    - type: "community_repo"
      url: "https://github.com/Fusseldieb/ttlock-reverse-engineering"
      description: "Community RE: GATT UUIDs and gatttool dump, the 7F 5A frame, CRC-8/MAXIM + CRLF tail, AES-CBC (IV = key) crypto. Its authors report the key exchange is not fully solved."
    - type: "public_research"
      url: "https://nv1t.github.io/blog/the-weired-ble-lock/"
      description: "Cloud-side teardown behind the security_advisory."
    - type: "vendor_documentation"
      url: "https://github.com/ttlock/Android_SDK_Demo/blob/master/README.en.md"
      description: "Official closed-core SDK demo: confirms lock, gateway and DFU client APIs exist; publishes no wire format and no firmware image."
    - type: "public_implementation"
      artifact: "roquerodrigo/ha-ttlock-ble @ 06c2a8548342092ac1bc76b3d6ce0d8eabf3e660 (2026-11-09)"
      url: "https://github.com/roquerodrigo/ha-ttlock-ble/tree/06c2a8548342092ac1bc76b3d6ce0d8eabf3e660"
      description: >
        Source review 2026-11-11 (custom_components/ttlock_ble/manual_key.py,
        config_flow.py, advertisement.py, README). Established in code: the
        cloud-vs-manual setup choice, the manual-key credential set (MAC,
        16-byte AES key, numeric unlock key, optional admin passcode, five
        frame-header values with V3 defaults 5/3/2/1/1), the advertisement
        cross-check of protocol type/version/scene, and that admin-only
        features need the admin passcode. Upstream-reported only: real
        lock/event/battery behaviour and the coverage of the V3 defaults. No
        lock was driven and no key entered; the upstream test suite could not
        be run offline (a Home Assistant transitive dependency was missing).
    - type: "community_repo"
      artifact: "kind3r/hass-addons @ 46a4be3a55afbb23cb06cecd66af78afe89ec0ab (2022-07-26)"
      url: "https://github.com/kind3r/hass-addons/tree/46a4be3a55afbb23cb06cecd66af78afe89ec0ab"
      description: >
        Legacy local pair/reset, credential-management and lock/unlock add-on
        built on ttlock-sdk-js. Its README says the author cannot maintain it
        (TTLock variants behave differently; BLE is unstable). The repository
        is not archived; "unmaintained" is the README's own statement.
        Historical evidence only; no pair or reset was run.
    - type: "static_analysis"
      artifact: "com.tongtongsuo.app 9.9.260902 (TTLock, Hangzhou Sciener Smart Technology)"
      sha256: "e7fcf00aa7c37f80d24e992f6a532090eb357802c686e4c7cbac6a4bd5764f41"
      obtained_via: "third-party APK mirror (XAPK), 2026-09"
      description: >
        Official app, read 2026-11-11 for the firmware path only: update
        metadata is requested per lock (lock ID plus model, hardware and
        firmware revisions) and the image is downloaded from the URL returned,
        so there is no reusable public image link. No update metadata was
        requested and no DFU command sent. The sha256 is of the XAPK bundle.
