# LED space (com.yj.led) Wi-Fi LED screen device spec (LOY SPACE protocol)
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "LED space Wi-Fi LED Screen (YSP-001 family)"
  manufacturer: "LOY SPACE / popled.cn"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "wifi"
  category: "display"
  transport: "udp"
  notes: >
    Wi-Fi sibling of the AUTOBABA LED Backpack on the same LOY SPACE / popled.cn
    platform — the third app binding documented for this protocol, alongside LOY
    SPACE (com.yskd.loywf) and NYAN GEAR (com.nyan.gear). Product listings name
    the panel YSP-001 (backpack screens, advertising vests, LED clothing); the
    same board family ships in Wi-Fi and Bluetooth variants, and the app drives
    both (FastBLE client plus a UDP path). The LED space app itself has been
    stale since 2023-06-29, but the platform ecosystem is active (LOY SPACE app
    updated 2026-03-25, backend CDNs live).
    Wi-Fi path: the device hosts a WPA/passphrase-protected AP whose SSID starts
    with "YS", secured with a well-known default password (12345678, per the
    app's own help text in 13 languages) that a user can change. The client
    joins it, broadcasts a TLV-serialized
    {"cmd":{"get":"dev_info"}} probe to 255.255.255.255:UDP/9090, and learns the
    device address from the reply sender (expected to be the ESP-style AP
    gateway 192.168.4.1 — not directly captured here). Commands are JSON
    objects app-side, serialized to binary 0xAA55-framed TLV on the wire by the
    native library libys_parse_tlv (parseJson/parseBin); replies come back as
    {"ack":{...},"sno":N}. Same wire frame as BLE: [0xAA, 0x55, 0xFF, 0xFF,
    len (u16-LE), sno (u16-LE), flags (0xC1), subflag, ...payload,
    checksum (u16-LE additive)] — over UDP each datagram chunk additionally
    carries an outer u16-LE length prefix (PacketDateUtils.toPacket), and large
    payloads are split into 180-byte chunks (writeFscNum; writeNum 120 on the
    other send path) with a ~5 ms inter-packet interval.
    Command vocabulary matches the AUTOBABA / NYAN specs (power, light 0-15,
    get dev_info/param_dev/param_wifi, delete del_all, rotate, pgm_play) and
    adds platform commands seen only in this app: dispatch, show_dev,
    pgm_flicker, bluetooth (radio control), timing (RTC set), delete del_ids,
    and a param_wifi SET command carrying user/pwd/ip_svr/port_svr/sec_hb —
    i.e. station-mode provisioning that points the panel at a server over a
    home network. Program upload uses the pkts_program JSON structure
    (60 sparse program slots, id_pro 11-19 seen in app templates) with
    zlib-compressed BMP pixel payloads (zip_bmp) built app-side by BmpUtils.
    Default screen geometry 64x64 (SharedPreferences default); 160x32 seen in
    UI code; dev_model default "gy", round panels detected by model containing
    "CXB5".
    CONFIDENCE: HIGH for the platform match — BLE UUIDs
    (fff0/fff1/fff2), JSON command strings, UDP port 9090 and popled.cn
    backend hosts (a.popled.cn, auth.popled.cn, wxbtapp.popled.cn:8443,
    app.popled.cn) verified in the decompiled com.yj.led 1.3.6.32 app;
    MEDIUM for Wi-Fi wire details — taken from the app's UDP/TLV code path,
    not replayed against hardware by this project.
  identification:
    ssid_prefix: "YS"
    default_port: 9090
    # BLE variant of the same board family (the app scans for it too).
    local_name_prefix: "YS"
    service_uuids:
      - "0000fff0-0000-1000-8000-00805f9b34fb"
    identity_keys:
      primary: "id_dev"
      display: "name"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "YS"
          service_uuids:
            - "0000fff0-0000-1000-8000-00805f9b34fb"
    identity:
      stable_keys: ["id_dev"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      AP-mode control needs no provisioning: the panel permanently hosts its
      own "YS…" Wi-Fi hotspot and accepts TLV/UDP commands from any client
      that joins it. The app's help flow is: join the YS hotspot with the
      default password 12345678, then the app broadcasts its dev_info probe
      and binds to the reply address. A station-mode provisioning command
      (param_wifi set with user/pwd/ip_svr/port_svr/sec_hb) exists in the app
      and can move the panel onto a home network pointed at a server, but it
      is not needed for local control and its post-provisioning behavior has
      not been captured.
    methods:
      - type: "softap_udp"
        verified: false
        description: >
          The device itself is the AP — join it and speak the LOY SPACE
          TLV protocol over UDP port 9090. There is no account, no pairing
          PIN, and no credential exchange; physical proximity plus knowledge
          of the (default, documented-in-app) AP password is the only access
          control. Discovery: send the TLV serialization of
          {"cmd":{"get":"dev_info"}} broadcast to 255.255.255.255:9090; the
          device answers with {"ack":{"dev_info":{id_dev, model, version,
          cid, ...}},"sno":N} and subsequent commands go unicast to the
          reply address. The same discovery probe documented for the AUTOBABA
          backpack (aa 55 ff ff 08 00 01 00 c1 03 0a 00 d4 03) applies.
        softap:
          ssid_prefix: "YS"
          open_network: false
          gateway_ip: "192.168.4.1"
          port: 9090
          ssid_notes: >
            SSID starts with "YS"; default password 12345678 per the app's
            help text. gateway_ip is the expected ESP-style AP address —
            the app does not hardcode it; it broadcasts to
            255.255.255.255:9090 and adopts the reply sender's address.
        steps:
          - action: "Power the panel and join its Wi-Fi hotspot (SSID starts with YS, default password 12345678)."
            actor: "user"
            expect: "Client receives an address on the device AP network."
          - action: "Broadcast the TLV-serialized dev_info probe."
            actor: "client"
            request:
              protocol: "udp"
              message: 'parseJson({"cmd":{"get":"dev_info"}}) broadcast to 255.255.255.255:9090'
            expect: 'A reply datagram decoding to {"ack":{"dev_info":{...}},"sno":N}; adopt the sender address for unicast commands.'
            timeout_seconds: 10
          - action: "Send commands unicast to the learned device address on UDP 9090."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        No account or owner binding exists to clear. The LOY SPACE platform
        command set includes {"cmd":{"delete":{"del_all":1}}} (clear all
        programs) and a format variant, which reset content, not credentials.
        If the AP password was changed from the default and lost, no software
        recovery path is documented — check the unit for a hardware reset
        button.
      procedures:
        - name: "Clear stored programs (soft reset)"
          steps:
            - action: "Send the delete-all command over the joined AP."
              actor: "client"
              request:
                protocol: "udp"
                message: '{"cmd":{"delete":{"del_all":1}},"ids_dev":"<id_dev>","sno":N} to the device address on UDP 9090'
              expect: "All stored programs are erased; AP settings survive."
        - name: "Power cycle"
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "The YS hotspot reappears and the device accepts commands again."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds the panel to an owner. Switching controllers is just
        joining the device AP from the new client and re-running discovery.
        Panels moved to a home network via the param_wifi provisioning
        command have not been observed and may need a unit-specific recovery
        path.
    credentials:
      wifi_passphrase_protection: "plaintext"
      stored_on_device:
        - "Wi-Fi AP password (default 12345678, changeable)"
        - "Optional station-mode credentials if param_wifi provisioning was used"
      issued_to_client: []
      notes: >
        Anyone who joins the device AP can issue commands; the AP password
        (whose default is published in the vendor app's own help pages) is
        the only barrier.

# Custom consumer-side handler: JSON command serialization into the popled 0xAA55
# framed binary-TLV transport (shared with the AUTOBABA LED Backpack and the
# NYAN BT Image Controller). Declarative.
protocol_handler: "popled_json"

# Full-color image / animation upload. The app renders content, converts to
# 24-bit BMP (BmpUtils), zlib-compresses it (ZLibUtils.compress = java.util.zip
# Deflater) and embeds it Base64-encoded as zip_bmp inside the pkts_program JSON
# program structure; the TLV library serializes the whole program. The wire
# payload is this zlib-compressed BMP, not a GIF (GIF frames take the parallel
# zip_gif path). Default geometry 64x64; actual geometry is device-reported
# (get param_dev / dev_info).
features:
  - type: "image_upload"
    format: "zlib-bmp"
    max_width: 64
    max_height: 64
    resolution_source: "device_reported"

# Wi-Fi (UDP) control surface as implemented by com.yj.led. The wire frame,
# checksum rules and JSON vocabulary are the shared LOY SPACE protocol
# documented in autobaba-led-backpack.yaml; this block captures only the
# Wi-Fi-specific transport behavior plus the commands first seen in this app.
popled_wifi_protocol:
  transport:
    udp:
      port: 9090
      discovery: >
        TLV-serialized {"cmd":{"get":"dev_info"}} broadcast to
        255.255.255.255:9090. The app learns the device address from the
        reply sender (UDPBuild.java) rather than hardcoding 192.168.4.1.
      framing: >
        Each datagram chunk carries an outer u16-LE length prefix followed by
        that many bytes of 0xAA55-framed TLV payload
        (PacketDateUtils.toPacket). Large sends are split into 180-byte
        chunks (writeFscNum; 120 on the writeNum path) at ~5 ms intervals.
        Replies decode through the same TLV layer to JSON.
      retry: "Vendor app: up to 10 resends at 8 s intervals until an ACK-shaped reply (matching sno) arrives; error replies are {\"cmd\":\"err\"} / {\"cmd\":\"failed\"}."
      receive_buffer: 1024
  sequence:
    # Wire value carried in the u16-LE sno field of the first frame.
    sno_base: 1
    # App-level 32-bit counter seed; only its low 16 bits reach the wire.
    app_counter_base: 4294901761
    notes: >
      The app keeps its sequence counter as the 32-bit value 4294901761
      (0xFFFF0001) — stored as the string "4294901761" in Constant.sno and
      passed to the native TLV serializer as (int)4294901761L
      (Main2Activity.parseJson). Only the low 16 bits reach the wire: the
      frame's sno (u16-LE) is app_counter & 0xFFFF, so the first frame carries
      sno=1 (0xFFFF0001 & 0xFFFF = 1), matching the worked discovery frame
      above. The counter advances by one per command
      (Constant.getSnoLength = counter + 1) and the wire sno wraps every 65536.
      The app tracks reply sno values and accepts the next sequential one.
  response_envelope: '{"ack":{...},"sno":N}'
  commands_seen_only_in_this_app:
    set_wifi_params:
      description: >
        Station-mode provisioning: tells the panel to join a Wi-Fi network
        and contact a server. JSON: {"cmd":{"param_wifi":{"type":0,"user":
        "<ssid>","pwd":"<password>","ip_svr":"<server>","port_svr":"9090",
        "sec_hb":30}},"ids_dev":"<id_dev>","sno":N}. Not needed for AP-mode
        local control; behavior after provisioning not captured.
    get_wifi_params:
      description: 'Query Wi-Fi parameters. JSON: {"cmd":{"get":"param_wifi"}}'
    get_screen_params:
      description: 'Query screen geometry/model. JSON: {"cmd":{"get":"param_dev"},"ids_dev":"<id_dev>","sno":N}'
    dispatch_program:
      description: 'Play one program for a fixed time. JSON: {"cmd":{"dispatch":{"type":1,"id_pro":N,"play_fixed_time":32767}},"ids_dev":"<id_dev>","sno":N} (type 0 form carries a "value" key).'
    show_dev:
      description: 'Device show flag, get and set. JSON: {"cmd":{"get":"show_dev"}} / {"cmd":{"show_dev":N},"ids_dev":"<id_dev>","sno":N}'
    program_flicker:
      description: 'Flicker/cycle through programs. JSON: {"cmd":{"pgm_flicker":{"type":0,"count_pgm":N,"time":T}},"ids_dev":"<id_dev>","sno":N}'
    bluetooth_control:
      description: 'Bluetooth radio control. JSON: {"cmd":{"bluetooth":{"type":0,"val":N}},"ids_dev":"<id_dev>","sno":N}; {"cmd":{"get":"bluetooth"}} queries.'
    set_time:
      description: 'Set the device RTC. JSON: {"cmd":{"timing":"<timestamp>"}}'
    delete_programs_by_id:
      description: 'Delete specific programs. JSON: {"cmd":{"delete":{"del_ids":[...]}}}'
  program_upload:
    description: >
      Programs are built as a pkts_program JSON object — property_pro
      (width, height, gray, type_color, type_pro, play_loop), list_region
      with info_pos geometry, and list_item entries of type_item "text_pic"
      (text, color, size, font, alignment) or "graphic" (zip_bmp payload).
      App templates use id_pro 11-19; the platform supports 60 sparse
      program slots. In this app pgm_play carries the full ids_pro array
      (whole playlist); the sibling uni-app binding
      (autobaba-led-backpack.yaml) sends pgm_play with a single "index", and
      hardware-verified RE shows wire program-select is a single zero-based
      slot index — see the play_program command notes.
      zip_bmp is a zlib-compressed 24-bit BMP rendered app-side.

# BLE variant of the same hardware family — identical GATT surface to the
# AUTOBABA LED Backpack (the app contains a full FastBLE client against these
# UUIDs). The Wi-Fi path above is this spec's primary surface; the BLE service
# is documented here so consumers can drive either board variant.
services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "LOY SPACE BLE Service"
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: "Notify"
        properties: ["notify"]
        notes: >
          Notify characteristic (READ_ATTRIBUTE in com.yj.led Constant.java).
          Same semantics as the AUTOBABA spec: NOTIFY-only, enable the CCCD
          before writing or frames are not ACKed.
      - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
        name: "Write"
        properties: ["write_without_response"]
        framing:
          length_prefix: true
          max_chunk_size: 180
        notes: >
          Write characteristic (WRITE_ATTRIBUTE in com.yj.led Constant.java).
          Same wire frame and checksum rules as the AUTOBABA spec; commands
          are the JSON vocabulary documented there and in
          popled_wifi_protocol above, serialized to binary TLV before send.
        commands:
          power_toggle:
            description: 'Toggle screen power. JSON: {"cmd":{"power":{"type":0}},"ids_dev":"<id_dev>","sno":N} (this app also emits {"type":1}).'
            encoding: "json"
            payload:
              key: "cmd.power.type"
              value_type: "int"
          set_brightness:
            description: 'Set brightness 0-15. JSON: {"cmd":{"light":{"type":0,"value_fix":N}},"ids_dev":"<id_dev>","sno":N}'
            encoding: "json"
            payload:
              key: "cmd.light.value_fix"
              value_type: "int"
          get_device_info:
            description: 'Query device info. JSON: {"cmd":{"get":"dev_info"}} (no ids_dev on the bare discovery probe)'
            encoding: "json"
            payload:
              key: "cmd.get"
              value_type: "string"
          get_power_state:
            description: 'Query power state. JSON: {"cmd":{"get":"power"},"ids_dev":"<id_dev>","sno":N}'
            encoding: "json"
            payload:
              key: "cmd.get"
              value_type: "string"
          get_brightness:
            description: 'Query brightness. JSON: {"cmd":{"get":"light"},"ids_dev":"<id_dev>","sno":N}'
            encoding: "json"
            payload:
              key: "cmd.get"
              value_type: "string"
          delete_all_programs:
            description: 'Delete all programs. JSON: {"cmd":{"delete":{"del_all":1}},"ids_dev":"<id_dev>","sno":N}'
            encoding: "json"
            payload:
              key: "cmd.delete.del_all"
              value_type: "int"
          set_rotation:
            description: 'Set screen rotation. JSON: {"cmd":{"rotate":N},"ids_dev":"<id_dev>","sno":N}'
            encoding: "json"
            payload:
              key: "cmd.rotate"
              value_type: "int"
          play_program:
            description: >
              Play programs. This com.yj.led (LED space) binding sends the whole
              playlist: {"cmd":{"pgm_play":{"model":0,"ids_pro":[1..60]}},
              "ids_dev":"<id_dev>","sno":N}, where ids_pro is the full 60-slot
              program-id array (Constant.java pgm_play template). The sibling
              uni-app binding documented in autobaba-led-backpack.yaml instead
              sends a single-slot form, {"cmd":{"pgm_play":{"model":0,
              "index":N}},...}; both are real JSON shapes for the same LOY SPACE
              pgm_play opcode across app versions. On the wire, hardware-verified
              RE (samrodrigues/loy-space-protocol) shows program selection is a
              single zero-based slot index, so a client that only needs to show
              one program can use the single-slot form. To play a single stored
              program this app also uses the dispatch command
              (dispatch_program above), not pgm_play.
            encoding: "json"
            payload:
              key: "cmd.pgm_play.ids_pro"
              value_type: "object"

entities:
  - platform: "light"
    name: "LED Screen"
    features: ["brightness"]
    commands:
      set_brightness: "set_brightness"
