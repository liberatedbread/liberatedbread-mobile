  - platform: "switch"
    name: "Lock"
    icon: "mdi:lock"
    variants: *v2
    state_characteristic: "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
    commands:
      turn_on: "v2_lock"
      turn_off: "v2_unlock"
    notes: "Both commands are advanced. Lock state is in the V11 settings reply; not located for other models."

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["vendor_ble", "jieli_ota"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "vendor_cloud"
        notes: >-
          The vendor app fetches images from its cloud (the download base URL
          is obfuscated in the app build examined and is not recorded) and
          bundles none. No image has been examined.
      enter:
        how: "unknown"
        notes: >-
          Main controller: the vendor app sends firmware as a series of block
          and status messages over the normal control link. JieLi
          co-processor: JieLi's own OTA protocol on
          0000ae00-0000-1000-8000-00805f9b34fb. Neither byte layout is
          documented here, deliberately; an interrupted main-controller update
          on a vehicle is not something to invite.
      dfu_mode:
        notes: "How a wheel looks mid-update is not recorded. The V11 1.4+ and V12 real-time state bytes carry a firmware-update-in-progress bit."
      services: ["0000ae00-0000-1000-8000-00805f9b34fb"]
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >-
        From static analysis of the vendor app only (JieLi OTA library, the
        firmware block/status message types, the obfuscated download
        endpoint). The UI lists five separately versioned boards (driver,
        HMIC, BT, BMS 1, BMS 2), so there are probably several update paths
        relayed through the BT board. Store reviews report updates failing
        part-way and a V5F whose sound transfer crashed its controller.

protocol_details:
  legacy:
    framing: "AA AA | escaped (16-byte message + optional L-byte extended payload) | checksum (sum-8 of unescaped message) | 55 55. Escape byte A5 precedes any AA, 55 or A5. See payload_formats.Legacy_Frame."
    message_ids:
      "0x0F550113": "GetFastInfo. Phone: data FF x 8, data type (the poll). Wheel: extended fast-info reply."
      "0x0F550114": "GetSlowInfo. Phone: data FF x 8, remote type. Wheel: extended slow-info reply. WheelLog also has unused variants with data 00 00 00 0F ... (battery levels) and 20 00 ... (version)."
      "0x0F550115": "RideMode. Also carries the max-speed (tilt-back), pedal-tilt and pedal-sensitivity writes, selected by data[0] (0x01, 0x00 with the angle in data[4..7], 0x06). Only the ride-mode form (data[0] = 0x0A) is declared."
      "0x0F550116": "RemoteControl. data[0] = 0xB2, data[4] selects: 0x05 power off, 0x0F decorative LEDs on, 0x10 off, 0x11 beep."
      "0x0F550119": "Calibration. data 32 54 76 98 00 00 00 00; reply data[0] = 1 on success."
      "0x0F550307": "PinCode (password). data = six ASCII digits, 00 00."
      "0x0F55010D": "Light. data[0] = 1 on, 0 off."
      "0x0F55012E": "HandleButton. data[0] = 0 disables the handle (lift) cut-off, 1 enables it. Not declared: disabling a cut-off is a safety change."
      "0x0F550609": "PlaySound. data[0] = sound number."
      "0x0F55060A": "SpeakerVolume. data[0..1] = volume x 100 as uint16 LE (0-10000 for 0-100 %)."
      "0x0F780101": "Alert, pushed by the wheel (payload_formats.Legacy_Alert)."
    replies_to_settings: "The wheel answers Calibration, RideMode, RemoteControl, Light, HandleButton and SpeakerVolume with the same ID and data[0] = 1 on success, anything else on failure."
    password_message: "ID 0x0F550307, data = the six password digits as ASCII (0x30-0x39), then 00 00; length 8, channel 5, format 0, type 0. Build it with a framer: the ID's 0x55 must be escaped and the checksum computed over the unescaped message."
    speaker_volume_message: "ID 0x0F55060A, data[0] = low byte and data[1] = high byte of volume x 100, remaining data 0; length 8, channel 5, format 0, type 0. Not declared as a command because a generic template cannot escape the ID and checksum correctly."
    model_codes:
      notes: "Model code = slow-info byte 107 x 10 + byte 104. Only the V5, V8, Glide 3 and V10 rows are in this spec's scope; the rest are codes WheelLog's legacy decoder recognises for other INMOTION products (the L6 is a kick scooter) and are listed so a client can say what it found."
      "50": "V5"
      "51": "V5+"
      "52": "V5F"
      "53": "V5D"
      "80": "V8"
      "85": "Glide 3 (Solowheel)"
      "86": "V8F"
      "87": "V8S"
      "100": "V10S"
      "101": "V10SF"
      "140": "V10"
      "141": "V10F"
      "142": "V10T"
      "143": "V10FT"
      "0-7": "R1 family (R1N, R1S, R1CF, R1AP, R1EX, R1 sample, R1T, R10): out of scope"
      "10-13": "V3 family (V3, V3C, V3 Pro, V3S): out of scope"
      "20-24": "R2 family (R2, R2N, R2S, R2 sample, R2EX): out of scope"
      "30": "R0: out of scope"
      "60": "L6: out of scope (kick scooter)"
      "61": "Lively: out of scope"
    polling_loop: "Timer: 200 ms initial delay, 25 ms tick, one request per ten ticks, tick count restarted by every complete received frame. Order: password (up to six times, until a 0x0F550307 reply), then slow info (until the model and a valid slow-info payload are known), then a queued setting command if any (after which slow info is re-read), otherwise fast info."
  v2:
    framing: "AA AA | escaped (flags, len, command, data) | escaped XOR checksum. Escape byte A5 precedes any AA or A5. See payload_formats.V2_Frame."
    flags:
      "0x11": "Initial: MainInfo requests and replies, and the two power-off messages."
      "0x14": "Default: everything else."
    commands:
      "0x01": "MainVersion (WheelLog builds it, never sends it)."
      "0x02": "MainInfo; data[0] selects 0x01 car type, 0x02 serial, 0x06 versions."
      "0x03": "Diagnostic; also the power-off exchange with flags 0x11 (data 81 00, then 82)."
      "0x04": "RealTimeInfo."
      "0x05": "BatteryRealTimeInfo."
      "0x10": "Unknown. WheelLog sends it once with data 00 01 after reading settings and ignores the reply."
      "0x11": "TotalStats."
      "0x20": "Settings (request data 20)."
      "0x60": "Control; data[0] is the sub-command."
    control_subcommands:
      notes: "Data[0] of a Control (0x60) message, then its arguments. 'declared' names the command in services; the rest are recorded so the next person knows they exist, not so they get sent."
      "0x21": "Max speed (tilt-back): speed x 100 as uint16 LE; the V13/V14 family, V11Y, V9 and V12S add a second uint16 LE, the alarm speed x 100. Not declared (speed limit)."
      "0x22": "Pedal tilt: tenths of a degree x 10 (hundredths of a degree) as int16 LE. Not declared."
      "0x23": "Classic ride mode: declared (v2_classic_mode_on/off), advanced."
      "0x24": "'Fancier' ride mode flag. Not declared."
      "0x25": "Pedal sensitivity: the same byte twice. Not declared."
      "0x26": "Speaker volume: declared (v2_set_speaker_volume)."
      "0x28": "Standby delay: seconds as uint16 LE. Not declared."
      "0x2B": "Headlight brightness; one byte (V11, declared) or two (V12 low, high)."
      "0x2C": "Sound enabled: declared (v2_sound_on/off)."
      "0x2D": "Daytime running light: declared (v2_drl_on/off)."
      "0x2E": "Handle button: 1 disables the lift cut-off. Not declared (safety cut-off)."
      "0x2F": "Auto headlight on/off (V12 family, V13). Not declared; harmless, left for a later pass."
      "0x31": "Lock: declared (v2_lock/v2_unlock), advanced."
      "0x32": "Transport mode: declared, advanced."
      "0x37": "Go-home mode (V11, V11Y). Not declared."
      "0x38": "Fan quiet mode (V11). Not declared (cooling)."
      "0x39": "Sound wave (V12 family). Not declared."
      "0x3E": "Alarm speeds (V12 family, two uint16 LE, speed x 100) or split mode (others). Not declared."
      "0x3F": "Split-mode acceleration and braking (0x40 on the V12 family). Not declared."
      "0x40": "Headlight on a V11 before main board 1.4 (declared); split-mode acceleration and braking on the V12 family."
      "0x41": "Play sound on a V11 before main board 1.4 (declared)."
      "0x42": "Calibration on a V11 before main board 1.4 (declared, advanced); split mode on the V12 family."
      "0x43": "Fan on/off (V11). Not declared (cooling)."
      "0x45": "Berm-angle mode (V13, V14, V12S). Not declared."
      "0x50": "Headlight: one byte (declared) or low and high beam bytes (declared as v2_set_beams)."
      "0x51": "Play sound/beep: sound number, then a third byte (0x01 or 0x64). Declared for sounds 0x02 and 0x18."
      "0x52": "Calibration: 01 00 01 turn, 01 01 00 balance. Declared, advanced."
    escape_proof: "v2_set_speaker_volume and v2_set_headlight_brightness: every byte after AA AA is below 0x80 when the argument is 0-100, and so is their XOR, so none can be AA or A5. v2_set_beams: arguments are 0 or 1, and the XOR of 14 04 60 50 with them is 0x20-0x21. No escaping is ever needed for the declared ranges."
    model_codes:
      notes: "Model code = car-type series x 10 + type."
      "61": "V11"
      "62": "V11Y"
      "71": "V12 HS"
      "72": "V12 HT"
      "73": "V12 Pro"
      "81": "V13"
      "82": "V13 Pro"
      "91": "V14 50GB"
      "92": "V14 50S"
      "111": "V12S"
      "121": "V9"
    settings_reply: "Command 0xA0, flags 0x14. Model-specific. V11 (offsets into data): 1-2 speed limit x 100 (uint16 LE, km/h), 3-4 pitch zero (int16 LE, hundredths of a degree), 5 drive/ride mode nibbles, 6-7 comfort and classic sensitivity, 8 volume (%), 18 headlight brightness, 22 bits 2-3 lock state and bits 4-5 transport mode. V12 family: 9-10 speed limit x 100, 11-14 two alarm speeds, 22 volume, 26-27 low and high beam brightness, 39 bit 0 mute, bit 2 handle button, bit 3 auto light, bit 6 transport mode. V13, V14, V11Y, V9, V12S: 1-2 speed limit x 100, 3-4 alarm speed, 31 bit 0 mute and bit 2 daytime running light, 32 bit 4 transport mode. Volume is not located for these."
    error_bits: "Seven bytes of flags from the layout's error offset: phase and bus current sensors, motor hall, battery, IMU, controller and BLE communication, temperature sensors, fan, RTC, external ROM, bus and battery voltage sensors, cannot-power-off, under/over voltage, over bus current (2 bits), low battery (2 bits), MOSFET/motor/battery/board over-temperature, over speed, output saturation, motor spin and block, posture, risky behaviour, motor no-load, no self-test, compatibility, power-key long press, forced DFU, device lock, CPU and IMU over-temperature, hardware compatibility, fan low speed (in that bit order, per WheelLog)."
    polling_loop: "Timer: 100 ms initial delay, 25 ms tick, one request per ten ticks, restarted by every complete reply. Order: car type (until answered), serial (until answered), versions (once), settings (once, and again after any control command), command 0x10 with data 00 01 (once), then TotalStats and RealTimeInfo alternately. A queued control command replaces the next request."
  v2_layout_selection:
    "V11, main board before 1.4": "V2_RealTime_V11_Early"
    "V11, main board 1.4 or later": "V2_RealTime_V11_1_4"
    "V12 HS / HT / Pro": "V2_RealTime_V12"
    "V13 / V13 Pro": "V2_RealTime_V13"
    "V14, V11Y, V9, V12S": "V2_RealTime_V14_Family"
    notes: "Until the versions reply arrives, a V11's layout is unknown; WheelLog uses the early layout by default."
  gatt_fingerprints:
    notes: "WheelLog picks the protocol by matching the full discovered GATT table against res/raw/bluetooth_services.json. Legacy: 180a (2a23, 2a26, 2a29), 180f (2a19), ffe0 (ffe4), ffe5 (ffe9), fff0 (fff1-fff9), ffd0 (ffd1-ffd4), ffc0 (ffc1, ffc2), ffb0 (ffb1-ffb4), ffa0 (ffa1, ffa2), ff90 (ff91-ff9a), fc60 (fc64), fe00 (fe01-fe06), all 16-bit on the Bluetooth base. V2: 1800 (2a00, 2a01, 2a04, 2aa6), 1801 (2a05, or empty), 6e400001 (6e400002, 6e400003); one V2 variant also has ffe5 (ffe9) and ffe0 (ffe4)."
  discrepancies:
    fff1_family: "Our research notes said newer wheels (V11/V13 generation) use an 'fff1 family' of UUIDs. That is not supported: WheelLog drives V2 wheels over the Nordic UART UUIDs, the vendor app's string table carries the Nordic UART trio, ffe0/ffe4 and ffe5/ffe9 and no fff1 UUID, and the only fff0/fff1 service in any source is the unused module service in WheelLog's LEGACY fingerprint. Treated as an error in the notes, unverified until a wheel is scanned."
    unexplained_vendor_uuids: "Two UUID-shaped strings in the vendor app turned out not to be GATT UUIDs: b48903b0-a70e-4d46-8b06-c00dc593911b is a help-desk chat widget key in the app's bundled help pages, and 383f2407-53f9-475b-87bd-6d2f1ce12105 sits among HTTP/WebSocket library constants, next to the RFC 6455 WebSocket GUID."
    v12_manual_name: "The V12 user manual filed with the FCC gives the BLE ID as V11-XXXXXXXX, text evidently copied from the V11 manual; the V12's real prefix is not established."
  vendor_app_findings: "com.inmotion.android.app 8.1.34 is a heavily obfuscated Flutter app. Its string table carries the UUIDs above (legacy pair, Nordic UART trio, CCCD, JieLi ae00-ae02). Its decoders are organised per product generation, and the newer generations have separate message types for BMS cell voltages, BMS warnings and protection, real-time errors and total statistics, so there is BMS detail beyond WheelLog's battery message whose layout is not recorded. It embeds a JieLi OTA library, an eSIM LPA stack on BLE service 0000ff00-0000-1000-8000-00805f9b34fb (0000ff02/0000ff03 on the same base) for cellular models, and firmware block/status messages for main-controller updates. Its listing screenshots show lock, lights, speaker (wheels only), Owner Authorization, and a Vehicle Information screen with five board versions (driver, HMIC, BT, BMS 1, BMS 2)."
  client_defects:
    notes: "WheelLog behaviours that explain field symptoms; wrong turns not to copy."
    unescaped_checksum: "Both WheelLog writers append the checksum without escaping it. A frame whose checksum is AA or A5 (and, on legacy, 55) would be misread by the wheel. The declared commands avoid this; a general framer should escape."
    last_chunk_padding: "WheelLog's legacy writer always writes 20 bytes, so the tail chunk carries stale bytes after 55 55."
    fixed_password: "WheelLog always sends password 000000 to legacy wheels and offers no way to change it."
    low_byte_length: "WheelLog's legacy reassembler uses only the low byte of the extended length."
  not_declared:
    notes: "Deliberately left out: speed-limit/tilt-back and alarm-speed writes (both protocols), pedal tilt and sensitivity, handle-button disable, fan and quiet mode, standby delay, split and berm-angle modes, go-home mode, and every firmware-update byte. Region or speed overrides beyond what the vendor app offers are not documented anywhere here."
  test_vectors:
    notes: "Request frames were computed from the rules above and match what WheelLog's builders produce. Reply frames are WheelLog unit-test captures from third-party wheels; the one identifying frame (a legacy slow-info reply) has its serial replaced with an invented value and its checksum recomputed."
    legacy_fast_info_request: "aa aa 13 01 a5 55 0f ff ff ff ff ff ff ff ff 08 05 00 00 7d 55 55"
    legacy_password_000000: "aa aa 07 03 a5 55 0f 30 30 30 30 30 30 00 00 08 05 00 00 9b 55 55"
    legacy_fast_info_reply_v5f: "see payload_formats.Legacy_FastInfo.example; checksum 0x26 = sum of the 112 unescaped message bytes"
    legacy_slow_info_reply_v5f_synthetic: "see payload_formats.Legacy_SlowInfo.example; checksum 0x7b"
    v2_car_type_request: "aa aa 11 02 02 01 10  (XOR 11^02^02^01 = 10)"
    v2_car_type_reply_v11: "aa aa 11 08 82 01 02 06 01 02 01 00 9c -> model 61, V11"
    v2_realtime_reply_escaped_v11: "aaaa1431843020a5a50068025207870080009400882c5fc4b000d7001000f4ff2b037c1564190000d9d9492b00000000000000000000a5a5 -> data A5 escaped at offset 2 (a5 a5), checksum 0xA5 escaped at the end; 82.40 V, 1.65 A, 6.16 km/h"
    v2_realtime_reply_v11_1_4: "aaaa1445842d1d10000000efff070000000000000000002b0300000000000000008a149612e02e8813641900000000cbb000cccad1000028000000000049140000000000000000000021 -> 74.69 V, 0.00 km/h, battery 52.58 %, MOS 27 C, board 28 C, CPU 26 C, IMU 33 C"
    v2_serial_reply_synthetic: "see payload_formats.V2_MainInfo_Serial.example"
  excluded:
    ninebot_z: "Ninebot Z wheels use a separate XOR-keyed protocol (WheelLog NinebotZAdapter.java); a candidate for its own spec."
    scooters_and_scv: "INMOTION kick scooters (Climber, L-series and relatives) and SCV self-balancing vehicles share the vendor app but are not covered."
    esim_lpa: "The eSIM LPA BLE service on cellular models (service 0000ff00-0000-1000-8000-00805f9b34fb) is out of scope."
    cloud: "Account, activation, Owner Authorization, firmware download: out of scope."

evidence:
  open_source_review: >-
    Wheellog/Wheellog.Android at commit 1b3707973e3b (2026-09-21), read in
    full for the InMotion paths: both adapters (framing, escaping, checksums,
    message IDs and control sub-commands, polling loops, every real-time,
    settings and total-stats layout), Constants.kt (UUIDs),
    bluetooth_services.json (GATT fingerprints), WheelData.java (protocol
    detection and the password default), BluetoothService.kt (write types and
    legacy chunking), the settings screen (which controls WheelLog offers per
    model, its slider ranges, and the speed gate on power-off and
    calibration), and the adapters' unit tests. The frames in those tests were
    re-checked with an independent transcription of the framing rules: every
    checksum verified and every decoded value matched the tests.
  documentation_review: >-
    The user manuals INMOTION filed with the FCC for the V11, V12, V12 Pro and
    V13 (the V11 and V13 text layers are glyph-shifted, so the relevant pages
    were read from renders). They give the BLE name convention and iOS/Android
    app support, and none documents a reset. The FCC grant pages for
    2ADUSV11, 2ADUSV12, 2ADUSV12PRO, 2ADUSV13 and 2ADUSV8S give BLE-band
    operation, the V12 grant's list of related model numbers, and the V13's
    4G antenna.
  app_static_analysis: >-
    com.inmotion.android.app 8.1.34, a heavily obfuscated Flutter build:
    string-table and decompile search for UUIDs, OTA and eSIM stacks, and
    firmware-update message types. Used for corroboration and scope only
    (protocol_details.vendor_app_findings); no byte layout in this spec comes
    from it, and no internal names are reproduced.
  ui_review: >-
    Five vendor app-store listing screenshots: the vehicle dashboard (speed,
    battery and range, ride time and distance, max speed, odometer; lock,
    lights, speaker and settings buttons), the scooter variant (no speaker),
    the Vehicle Information screen (serial, BLE name, model, activation date,
    five board versions) and the Me screen (Owner Authorization, a release
    build's environment switch). The serial, BLE-name suffix and account
    handle visible there are not reproduced. Google Play reviews (sampled
    2026-09-22) supplied the troubleshooting symptoms.
  open_questions: >-
    See remaining_unknowns. First things to settle with a wheel in hand: the
    V2 names of the V9, V12 HS/HT, V14 and legacy wheels, whether a legacy
    wheel with a non-default password withholds data, what lock and
    transport mode do to a wheel, and a capture of the vendor app's settings
    and firmware exchanges.
  artifacts:
    - type: "public_implementation"
      artifact: "Wheellog/Wheellog.Android @ 1b3707973e3b4528bd88778f9ebdf7a79817cf3f (GPL-3.0)"
      url: "https://github.com/Wheellog/Wheellog.Android"
      obtained_via: "git clone into the research store, 2026-09"
      description: "The source of both wire formats and of the test vectors."
    - type: "vendor_documentation"
      artifact: "INMOTION V11, V12, V12 Pro and V13 user manuals (FCC user-manual exhibits)"
      url: "https://fccid.co/fcc/2ADUSV13"
      obtained_via: "fccid.co, harvested 2026-09-26"
      description: "BLE name convention (V11-, V12Pro-, V13- plus the last eight serial characters), app platform support; no reset procedure."
    - type: "fcc_filing"
      artifact: "FCC IDs 2ADUSV11, 2ADUSV12, 2ADUSV12PRO, 2ADUSV13, 2ADUSV8S (INMOTION TECHNOLOGIES CO., LTD.)"
      url: "https://fccid.co/fcc/2ADUSV11"
      obtained_via: "fccid.co, harvested 2026-09-26"
      description: "2402-2480 MHz DTS grants (2020-2024); related model numbers; the V13's 4G FPC antenna."
    - type: "static_analysis"
      artifact: "com.inmotion.android.app 8.1.34 (XAPK)"
      obtained_via: "third-party APK mirror, 2026-09"
      description: "Corroboration only: UUID set, JieLi OTA, eSIM LPA stack, firmware block/status messages, obfuscated cloud endpoint; no fff1 UUID."
    - type: "vendor_store_listing"
      artifact: "INMOTION app Google Play listing screenshots (5) and reviews (188 sampled)"
      obtained_via: "Play store scrape, 2026-09-22"
      description: "UI survey (control surface, five-board version list, BLE name/serial relation) and field symptoms. Identifiers in the screenshots are not reproduced."

remaining_unknowns:
  - "Advertised names of the V9, V11Y, V12 HS/HT, V12S, V13 Pro and V14, and of every legacy wheel. Only V11-, V12Pro- and V13- are sourced."
  - "Whether the wheels use public or random BLE addresses, and whether they accept more than one central."
  - "Whether a legacy wheel whose owner set a non-default password withholds data from a client that sends the wrong one, and whether 000000 is the factory default."
  - "What the wheel does with lock, power-off, calibration or ride-mode commands received while moving. Treat as dangerous until established."
  - "What V2 lock actually does (immobiliser, alarm, both) and how lock state is reported on models other than the V11."
  - "Whether clearing transport mode over BLE is enough to make a factory-new V2 wheel rideable without the vendor's cloud activation."
  - "The meaning of V2 command 0x10 (sent once with data 00 01), MainInfo bytes 4-6, and the third byte of the play-sound sub-command."
  - "Units of the V2 total-stats energy fields and of every V2 BatteryRealTimeInfo field; the layout of the BMS cell-voltage, warning and protection messages the vendor app decodes."
  - "Several V13 and V14-family real-time offsets WheelLog itself marks unsure (pitch, torque, motor power, roll, the V13 trip-distance word order)."
  - "Where the per-board versions for the HMIC board and the two BMS boards come from (the versions reply only yields main, driver and BLE in WheelLog), and whether the reply is really a tagged per-board list."
  - "Which radio serves the JieLi OTA service 0000ae00-0000-1000-8000-00805f9b34fb, and the main-controller update protocol (out of scope on purpose, but unknown)."
  - "How the V12 touch-screen access code and the vendor app's Owner Authorization are set or enforced over BLE."
  - "Whether the 2024 V8S (FCC 2ADUSV8S) still speaks the legacy protocol."
  - "Whether the legacy Battery Service level (00002a19-0000-1000-8000-00805f9b34fb) reflects the pack."
  - "Whether the wheel ever sends a legacy checksum of AA, 55 or A5 unescaped; the V2 captures show the wheel escaping its checksum."

