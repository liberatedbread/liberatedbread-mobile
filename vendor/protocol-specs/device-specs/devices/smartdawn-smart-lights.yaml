device:
  name: "SmartDawn Smart Lights"
  manufacturer: "Hangzhou Daniao Technology Co., Ltd (SmartDawn/Minetom store brand)"
  manufacturer_status: "active"
  protocol: "ble"
  category: "light"
  notes: >
    SmartDawn (smartdawn.com, Shopify storefront linked to the Minetom
    string-lights seller) sells addressable-RGB holiday lighting: RGBIC
    permanent outdoor string lights, icicle/net/curtain lights, meteor-shower
    tubes, cone trees. The products are white-label builds of Hangzhou Daniao
    Technology's "point-controlled color light" platform — the same stack
    behind Daniao's SuperPix (com.daniaokeji.cs) and legacy SmartPixel apps.

    COMPANION APP: "SmartDawn" — Android com.daniaokeji.smartdawn (v1.2.4,
    updated 2026-01-06), iOS id 6749049089. Features: music/mic reactive
    modes, hand-drawn patterns, scrolling text, photo-to-light, groups,
    timers. Local BLE control works without any account or cloud.

    PROTOCOL: custom "DDP/DNX" stack, mapped from decompilation of the
    official SmartDawn.apk v1.2.4 (jadx: com.daniaokeji.libs.bluetooth.
    BleUtils5, com.daniaokeji.libs.udp.*) cross-checked against the app's
    bundled H5 JavaScript (assets/HTML/assets/index-CL_jUmAY.js), which
    implements the same encoders a second time, and the app's bundled
    protobuf schema (assets/HTML/p2p.proto), which pins every message
    type number and payload shape. Commands are protobuf messages wrapped
    in a 20-byte extended DDP header, fragmented into BLE writes carrying
    a 4-byte fragment header. Simple commands (power, brightness) need no
    protobuf beyond a single SimpleMessage {i1} value. Re-verified against
    the same APK on 2026-08-08 (sha256
    58aaf3d6027c59aa5ab7876930fb16661d224d28220f58f227e35c2ddeca07aa,
    fetched from the vendor's own CDN,
    http://file.daniaokeji.com/download/SmartDawn.apk).

    DISCOVERY: advertised local name is 6-8 chars starting with "DN"
    (app-side filter, case-insensitive). The custom service UUID
    00000074-1972-1925-3022-077119514e44 is what the official app's scan
    filter names, but the JY25CUT curtain controller tested live
    (2026-08-08, unit "DN0B88") does NOT include it in its advertisement —
    the ADV carries only the local name and a manufacturer-data record
    (company id 0x61ea + 12 payload bytes, observed
    03 e8 00 64 14 14 00 00 72 74 00 00: fw_ver, factory id, product
    type, width, height, group, vendor, run-mode/leader flags). Scan
    matching must therefore key on the name prefix (and optionally the
    manufacturer data); the service UUID is confirmed from the GATT table
    after connecting.

    WIFI VARIANTS: Daniao's platform also supports Wi-Fi control — same DDP
    framing over UDP port 4048, device presence announcements to app UDP
    port 14040, and AP-mode provisioning (controller AP "DN??????",
    password "00000000"; or phone hotspot named i5g*/I5G* with password
    "00000000"). Whether shipping SmartDawn-branded SKUs enable Wi-Fi is
    unverified; the curtain lights are BLE-per-listing.

    CONFIDENCE: HIGH for discovery, GATT layout, fragment framing,
    extended-header layout, and the core command path — code-sourced from
    two independent implementations inside the vendor's own app AND
    verified live against JY25CUT curtain hardware (unit "DN0B88",
    "DNX:S104-JY" per its DeviceInfo push) on 2026-08-08: connect +
    subscribe needs no pairing; the device immediately pushes
    M_DEVICE_INFO_NOTIFY (mt=2103) and a periodic M_PLAY_PROGRESS_NOTIFY
    (mt=2630) stream on the DDP notify characteristic; fragment-framed
    M_SET_POWEROFF/M_SET_POWERON commands (single-fragment, big-endian
    header fields, correct len) are acknowledged with
    M_POWER_STATUS_NOTIFY (mt=2105) and visibly pause/resume playback,
    while the SAME packets written WITHOUT the 4-byte fragment header are
    silently ignored — the framing is mandatory, not advisory. Commands
    worked without a prior M_TIME_SYNC. M_SET_BRIGHTNESS (mt=2509, protobuf
    SimpleMessage {i1}) is accepted without an ACK and the value echoes
    back in the next M_DEVICE_INFO_NOTIFY brightness field. The pixel-push
    path was also exercised live: M_DEV_START (mt=235) verifiably takes
    over the display (the M_PLAY_PROGRESS_NOTIFY stream goes silent until
    the mode is left), and full-canvas TUTU_RESTORE chunks then stream on
    the BIN channel (format under the BIN Write characteristic).
    M_GET_RUNNING_STATUS (mt=2104) produced no observable reply in that
    session (framed or not) — its semantics stay medium confidence, as
    does payload field usage for commands not exercised live (SimpleMessage
    i1/i2/s1 semantics, ranges), which follows app call sites. Header shape
    and UDP port 4048 echo the WLED/xLights DDP (Digital Display Protocol),
    suggesting a derivation, but the DNX extended channel is
    Daniao-specific.

  identification:
    # Advertised local name is 6-8 chars starting with "DN" (the official
    # app's scan filter, case-insensitive) — see the DISCOVERY note above.
    # Declared here as well as per-variant so clients that identify by the
    # device-level block can match before/without service discovery.
    local_name_prefix: "DN"
    service_uuids:
      - "00000074-1972-1925-3022-077119514e44"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "DN"
          service_uuids:
            - "00000074-1972-1925-3022-077119514e44"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      BLE models need no provisioning: power on, scan for the DN-prefixed
      name (the tested JY25CUT unit does not advertise the 00000074-...
      service UUID — see DISCOVERY), connect, subscribe to the DDP
      and BIN notify characteristics, negotiate MTU (app requests 512,
      payload MTU = negotiated - 3, fallback 20), then optionally send a
      time sync (M_TIME_SYNC, mt=2504) — the official app always does, but
      live testing (2026-08-08) confirmed power commands work without it.
      No pairing, bonding, or authentication on the command path — auth
      message types exist but serve cloud/sharing flows; the whole flow was
      exercised on JY25CUT curtain hardware over BlueZ. Wi-Fi SKUs (if any
      ship under SmartDawn) would use the AP-mode flow in the notes above
      (low confidence for this brand).
    methods:
      - type: "ble_direct"
        verified: true
        description: >
          Scan for a "DN"-prefixed name (6-8 chars) or the
          00000074-1972-1925-3022-077119514e44 service UUID, connect, enable
          notifications on the DDP (01010074-...) and BIN (02010074-...)
          characteristics, request MTU, then send M_TIME_SYNC followed by
          normal commands.
        ble:
          pairing_required: false
        steps:
          - action: "Power the lights; they advertise immediately."
            actor: "user"
            request:
              protocol: "ble_gatt"
          - action: >
              Scan for the DN-prefixed name / 00000074-... service UUID and
              connect; subscribe to both notify characteristics and raise MTU.
            actor: "client"
          - action: >
              Send M_TIME_SYNC (mt=2504, TimeSync protobuf) then command
              packets on the DDP write characteristic.
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        M_FACTORY_RESET (mt=2598) and M_REBOOT (mt=2599) commands exist in
        the protocol. The controller hardware also has a physical mode
        button (per the FCC manual: press to switch mode, hold to turn
        off). No BLE bonding state exists to clear.
      procedures:
        - name: "Software factory reset"
          steps:
            - action: "Send M_FACTORY_RESET (mt=2598) over the DDP channel."
              actor: "client"
              expect: "Device resets to factory state (per app code; not captured on hardware)."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        No bonding. Any central within range can connect and send commands.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        BLE path has no credentials. Wi-Fi provisioning (Wi-Fi SKUs only)
        uses the fixed AP/hotspot passphrase "00000000".

  variants:
    - model: "RGBIC permanent outdoor string lights (50/100/150/200 ft)"
      identification:
        local_name_prefix: "DN"
    - model: "Smart curtain lights (JY25CUT series)"
      identification:
        local_name_prefix: "DN"
    - model: "Smart icicle / net / meteor-shower / cone-tree / firecracker (HL1123) lights"
      identification:
        local_name_prefix: "DN"

