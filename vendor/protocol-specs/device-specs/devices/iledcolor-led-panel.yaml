# iLEDColor LED Panel — Device Spec
# Generated from static analysis of the vendor's iLEDColor Android app.

device:
  name: "iLEDColor LED Matrix Panel (DreamPanel v3)"
  manufacturer: "Shenzhen I-ledshow Technology Co., Ltd."
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "ble"
  category: "display"
  notes: >
    This app replaced SPOTLED for DreamPanel v3 hardware (horizontal serial
    number). Built on JieLi (JL) Bluetooth OTA SDK. The protocol is FULLY
    RECOVERED: the vendor published its complete implementation as the
    open-source Flutter plugin led_bt_jl_ota on pub.dev (0.0.1 2024-08-17 →
    0.0.34 2025-05-06), and the independent Rust RE akkaisinabin/iledcolor-rs
    agrees byte-for-byte.

    LED commands do NOT ride the OTA pipe. They use a dedicated proprietary
    service 0000A950: A951 command (write / write-without-response), A952 bulk
    data (image/GIF program upload), A953 notify. AE00/AE01/AE02 is the JieLi
    OTA firmware-upgrade stack only — confirmed against JieLi's official
    jl_bt_ota SDK (BluetoothConstant carries the same three UUIDs).

    Command packet format (write to A951), cross-validated between the vendor
    plugin and iledcolor-rs:
      [0x54] [handle:u8] [length:u16 BE (= payload + 2)] [payload…]
      [checksum:u16 BE = simple sum of all preceding bytes]
    Known handles: 0x00 Continue, 0x01 EndStream, 0x03 program item (playlist
    entry), 0x06 StartStream (single GIF/graffiti/program upload), 0x07
    playlist control (defined in the vendor example but unused/commented out),
    0x08 program-list complete (payload [0x01]), 0x09 Brightness, 0x0A
    LedEnable, 0x0D Connect, 0x0E SetPass, 0x0F TestPass; "simple data" frames
    also use dataType 0x00 with cmdCode 0x02 (speed) / 0x04 (effect).
    Bulk program data goes to A952 framed with header [0x54, 0x00] and a
    CRC32C over the payload (the app's send-parameter builder).
    Session flow: Connect (0x0D) → TestPass (0x0F) → commands/uploads.

    Command payloads (vendor plugin send builders + iledcolor-rs docs/ouppy.md,
    the latter hardware-sniffed): Connect 0x0D payload [0x00], replies 0x0000 —
    exact semantics unclear (iledcolor-rs: "we send 0x00, receive 0x0000,
    always"); the vendor example reuses it as a ping/latency probe and treats
    its reply as a "query built-in program count" response. TestPass 0x0F
    payload = 6-byte password; response 0x01 correct / 0x02 incorrect /
    0x03 no password set. SetPass 0x0E payload = [op, oldPass:6, newPass:6]
    with op 0x00 set / 0x01 change / 0x02 unset (oldPass zeroed when none);
    response 0x01 success / 0x02 failure. Brightness 0x09 payload =
    [level, 0x00×8]; hardware sniffing gives 0x00/0x01 brightest … 0x0A
    dimmest, ≥0x0B wraps to brightest (the vendor API comment claims 0–100 —
    trust the sniffed 0–10 range). LedEnable 0x0A payload = [enable, 0x00×8],
    0x00 off, anything else on. Program item 0x03 payload = [program count,
    program index, program CRC32:4, total length:u32 BE, play count, border,
    0x00, 0x00].

    A953 responses echo the 0x54 framing. Status byte values, from the
    vendor app's transfer callback: 0x00 transfer failed, 0x01 success, 0x02
    insufficient storage, 0x03 program already exists — no update needed
    (matched on the program CRC32, i.e. the panel retains uploaded programs
    across connections), 0x04 data error (e.g. length over maximum). During a
    chunked upload the panel answers each chunk with an 11-byte Continue
    (handle 0x00) response whose status sits at byte 8 (0x01 = send next
    chunk); EndStream (0x01) carries the final result.

    Advertisement layout decoded from the app's advertisement model and its
    BLE parse helper:
    manufacturer bytes match [01 54 59 00 01] ("TY", hat/mini-show) or
    [01 54 42 44 xx] ("TBD", devil-eye / color panels). bytes[1..4] screen-type
    id, [5..6] height, [7..8] width (u16 BE), [9] color type, version code
    (u16 BE) at bytes[11..12], customer id (u16 BE) at bytes[13..14],
    bytes[15..16] funCode bitmask (bit0 time, bit1 partition, bit2 GIF,
    bit3 media, bit4 rotate/eye, bit5 border, bit6 password, bit7 remote).
    Exception: "old protocol" devices (screen-type id 0x534C0005) shift
    version/customer id one byte earlier (bytes[10..11] / [12..13]) and are
    sent differently framed bulk data (chunk header [0x01, dataType, cmdCode],
    trailer [0x02, 0x03]; from the vendor plugin's legacy send path).
    Geometry is advertised — no query needed. The brightness command requires
    a device protocol version of 6 or later.

    Architecture: the app is Flutter — the BLE logic lives in Dart and in the
    published plugin, which is why an early Java-only static pass found no
    UUIDs. The Java layer only carries the BLE manager, OTA handler and send
    thread (whose unobfuscated originals ship in the plugin).

    SPOTLED compatibility probe: check service 0000ff20-0000-1000-8000-00805f9b34fb
    (SPOTLED generation; absent on iLEDColor panels — the two generations are
    incompatible, iledcolor-rs: "not compatible with the spotled protocol").

    Vendor cloud (live 2026-07, no auth for reads): content library
    iledcolor.api.iledshow.cn; unauthenticated panel-firmware OTA API
    app.iledshow.cn:8098/ota/getNewestOta?width&height&currVersion&customerId&colorType
    — responds 200 but is customerId-gated: it needs the exact
    (width, height, customerId, colorType) tuple a real device advertises.
    Telemetry note: the app reports device MAC/name/advertisement bytes to
    iledcolor.api.iledshow.cn/api/reporting/add on OTA events (privacy-relevant).

    Security context: the panel's JieLi AC63-family SoC lineage was implicated
    in the BrakTooth disclosures (Bluetooth Classic DoS/deadlock, e.g.
    CVE-2021-34150; see Jieli-Tech/fw-AC63_BT_SDK issue #78). That applies to
    the chip vendor's classic-BT stack; direct impact on this BLE-only panel
    is unknown.

    Research status: protocol recovered from the vendor's own published
    sources plus an independent reimplementation. An HCI snoop is now a
    nice-to-have validation, not a blocker.

  identification:
    manufacturer_data:
      description: >
        Advertisement match is a sliding-window substring search over the raw
        scan record (the vendor app's advertisement matcher), so no fixed
        company-ID offset is asserted. Match patterns: [01 54 59 00 01]
        ("TY", hat/mini-show) and [01 54 42 44 xx] ("TBD", devil-eye / color
        panels; xx 0x01..0x10 in the vendor support list). Payload layout from
        the match offset: bytes[1..4] screen-type id, [5..6] height, [7..8]
        width (u16 BE), [9] color type, version code (u16 BE) at [11..12],
        customer id (u16 BE) at [13..14], bytes[15..16] funCode bitmask
        (bit0 time, bit1 partition, bit2 GIF, bit3 media, bit4 rotate/eye,
        bit5 border, bit6 password, bit7 remote). Old-protocol devices
        (screen-type id 0x534C0005) carry version/customer id one byte
        earlier ([10..11] / [12..13]). Geometry is advertised — no query
        needed.
  discovery:
    methods:
      - type: "ble_scan"
        notes: >
          Match raw scan-record bytes containing [01 54 59 00 01] or
          [01 54 42 44 xx] (see device.identification.manufacturer_data for
          the layout and funCode bits).
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: high
    notes: >
      Nothing is provisioned. The panel is a BLE peripheral: it advertises,
      accepts a connection without pairing, and takes commands on the A950
      service. The session starts with Connect (handle 0x0D) then TestPass
      (0x0F) carrying the 6-byte password, which defaults to 6×0x00. Panels
      support an optional user-set password (funCode bit 0x40), so open
      access holds for factory-default panels only.
    methods:
      - type: ble_direct
        description: >
          Connect over GATT to service 0000A950: write commands to A951 in the
          recovered [0x54][handle][len16BE][payload][sum16BE] framing,
          subscribe to A953, upload bulk data to A952. Framing and opcodes are
          published in the vendor's Flutter plugin led_bt_jl_ota (pub.dev).
        verified: false
        ble:
          pairing_required: false
        steps:
          - action: "Power the panel on; it advertises immediately."
            actor: user
          - action: "Scan for the panel and connect over GATT."
            actor: client
          - action: >
              Probe for service 0000ff20-0000-1000-8000-00805f9b34fb to tell
              SPOTLED-generation hardware from DreamPanel v3.
            actor: client
          - action: >
              On service 0000A950: send Connect (handle 0x0D) then TestPass
              (0x0F, default password 6×0x00) on A951; subscribe to A953.
            actor: client
            expect: "Panel accepts commands (brightness, effects, uploads)."
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established. Re-mined the vendor plugin's complete command
        construction (all send builders in led_bt_jl_ota 0.0.34) and
        iledcolor-rs: no factory-reset or content-erase handle exists in the
        recovered opcode map. The panel does retain uploaded programs across
        connections — it answers a re-upload of an identical program CRC32
        with status 0x03 "already exists, no update needed" — but whether a
        power cycle clears stored content remains untested against hardware.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The panel joins no network. Any client may connect once the previous one
        disconnects.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        BLE-only device; no WiFi passphrase is transferred. The link is
        unauthenticated; panels support an optional 6-byte password
        (SetPass/TestPass handles, default 6×0x00), so anyone in range can
        drive a factory-default display.

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
services:
  - uuid: "0000a950-0000-1000-8000-00805f9b34fb"
    name: "iLEDColor LED Control Service"
    notes: >
      Proprietary LED command/data channel, recovered from the vendor's
      open-source Flutter plugin led_bt_jl_ota (pub.dev) and independently
      confirmed by akkaisinabin/iledcolor-rs (byte-for-byte agreement).
      Command packets on A951: [0x54][handle:u8][length:u16 BE (= payload+2)]
      [payload…][checksum:u16 BE = simple sum of all preceding bytes].
      Handles: 0x00 Continue, 0x01 EndStream, 0x03 program item, 0x06
      StartStream (GIF/program upload), 0x08 program-list complete, 0x09
      Brightness, 0x0A LedEnable, 0x0D Connect, 0x0E SetPass, 0x0F TestPass
      (payload layouts in device.notes). Session: Connect (0x0D) → TestPass
      (0x0F, default password 6×0x00) → commands.
    characteristics:
      - uuid: "0000a951-0000-1000-8000-00805f9b34fb"
        name: "Command"
        notes: "LED command packets in the 0x54 framing described above."
        properties: ["write", "write_without_response"]
      - uuid: "0000a952-0000-1000-8000-00805f9b34fb"
        name: "Data"
        notes: >
          Bulk image/GIF program upload. Each chunk is a full 0x54-framed
          packet with handle 0x00: [0x54, 0x00][len:u16 BE][sequence:u32 BE]
          [chunk length:u16 BE][chunk…][sum:u16 BE], sized to fit MTU−13
          (the vendor app's chunker; iledcolor-rs uses 492-byte
          data chunks). The transfer ends with an EndStream packet
          [0x54, 0x01, 0x0003, 0x01, sum]. CRC32C (Castagnoli) covers the
          program payload and is announced in the StartStream/program-item
          command on A951.
        properties: ["write"]
      - uuid: "0000a953-0000-1000-8000-00805f9b34fb"
        name: "Notify"
        notes: >
          Command responses and transfer progress in the same 0x54 framing,
          handle echoing the command. Status byte: 0x00 failed, 0x01 success,
          0x02 insufficient storage, 0x03 program already exists (CRC32
          match), 0x04 data error; TestPass replies 0x01 correct / 0x02
          incorrect / 0x03 no password set.
        properties: ["notify"]
  - uuid: "0000ae00-0000-1000-8000-00805f9b34fb"
    name: "JL OTA Service"
    notes: >
      JieLi Bluetooth OTA service (firmware upgrade only — LED commands use
      service 0000A950). Characteristic properties below are inferred from
      the jl_bt_ota SDK's client behaviour (writes AE01, subscribes AE02);
      the peripheral's own GATT attribute flags are not confirmed from
      app-side code.
    characteristics:
      - uuid: "0000ae01-0000-1000-8000-00805f9b34fb"
        name: "JL OTA Write"
        notes: "JL OTA write characteristic (firmware-upgrade flow only)."
        properties: ["write", "write_without_response"]
      - uuid: "0000ae02-0000-1000-8000-00805f9b34fb"
        name: "JL OTA Notify"
        notes: "JL OTA notification characteristic."
        properties: ["notify"]

helpful_urls:
  - title: "led_bt_jl_ota on pub.dev"
    url: "https://pub.dev/packages/led_bt_jl_ota"
    description: >-
      The vendor's own Flutter plugin, published open source. This is the complete implementation
      this spec's packet format comes from, and the unobfuscated original of the app's Java BLE
      layer.
  - title: "iledcolor-rs"
    url: "https://github.com/akkaisinabin/iledcolor-rs"
    description: >-
      Independent Rust reverse engineering that agrees with the vendor plugin byte-for-byte; also
      the source of the SPOTLED-incompatibility finding.
  - title: "JieLi Android JL_OTA SDK"
    url: "https://github.com/Jieli-Tech/Android-JL_OTA"
    description: >-
      JieLi's official OTA SDK. Confirms that AE00/AE01/AE02 is the firmware-upgrade stack and not
      the LED control path.
  - title: "fw-AC63_BT_SDK issue #78"
    url: "https://github.com/Jieli-Tech/fw-AC63_BT_SDK/issues/78"
    description: >-
      Upstream issue on the AC63-family SoC lineage implicated in CVE-2021-34150; the security
      context this spec records.
  - title: "python-spotled"
    url: "https://github.com/iwalton3/python-spotled"
    description: >-
      Client for the earlier SPOTLED panel generation, whose protocol these panels are not
      compatible with.
  - title: "iLEDColor app on Google Play"
    url: "https://play.google.com/store/apps/details?id=com.led.iledcolor"
    kind: "vendor_support"
    description: "Distribution page for the analysed app."
