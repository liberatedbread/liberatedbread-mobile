      - uuid: "00000a20-0000-1000-8000-00805f9b34fb"
        name: "Activate (unlock/register)"
        properties: ["read", "write"]
        verification: "confirmed"
        notes: >
          Read first: static analysis says a first byte of 00 means locked.
          The captured unit returned 01 and therefore received no activation
          write. The locked-unit write and its chipId derivation remain
          reported, not capture-confirmed. (Other FOREO models use an older
          01 01 <ASCII serial> variant; Peach uses the chip-id variant.)
        commands:
          activate:
            description: >
              Unlock a locked unit: 01 02 followed by the 8-byte chipId
              derived from the device's BLE MAC (keyless permutation, fully
              offline — see `protocol_details.activation`).
            template: [0x01, 0x02, "{chip_id}"]
            verification: "reported"
            advanced: true
            advanced_reason: "Unlocks a locked IPL device in place of the vendor's own registration flow; the write was never captured (the captured unit was already active). Send it only after reading 0A20 and seeing a first byte of 00, never to an active unit."
            parameters:
              chip_id:
                type: "bytes"
                min_length: 8
                max_length: 8
                description: "8-byte chipId = keyless nibble permutation of the 6-byte BLE MAC; algorithm and test vectors in protocol_details.activation."
