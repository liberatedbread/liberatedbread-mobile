evidence:
  artifacts:
    - type: "static_analysis"
      artifact: "com.foreo.foreoapp (FOREO For You) 4.4.1 (versionCode 559), base APK"
      sha256: "90a4ec8f5c22c1085d1500f6bf1954c28edcd81531f0eed94bf8a13aa494ae79"
      obtained_via: "third-party APK mirror, 2026-08-29"
      description: >
        Static analysis of the FOREO For You app (2026-08). Source of every
        protocol fact here: the GATT map and the characteristic-by-UUID
        resolution, the command opcode table and dialect switch, the
        security-access handshake, the MAC-derived activation (chipId)
        algorithm, and the app-side-only subscription enforcement. Also
        establishes the negative findings: no bonding anywhere on the Peach
        path, no MTU negotiation, and no in-app-purchase store integration.
    - type: "static_analysis"
      artifact: "com.foreo.foreoapp 4.2.0 arm64 APKS comparison bundle"
      sha256: "304f62e696975c580248dd3c1d63034f1e66a0177f8d4498dc6777144b4fd2a5"
      obtained_via: "third-party APK mirror, 2026-11-08"
      description: >
        Comparison build whose relevant PEACH2 implementations corroborate
        exact-name scanning, security access, subscription/test-device gating,
        Basic/Pro constants and Duo mode bytes. JADX reported 69 errors across
        the full bundle, so only the present matching implementations are used.
        No newer-store-version claim is made.
    - type: "capture_analysis"
      artifact: "capture-analysis-2026-11-08.json (sanitized ATT/GATT analysis)"
      description: >
        Cross-checks 27 writes/responses, 210 reads/responses and 517
        notification packets. Identifies body/head NTC, accelerometer and
        vibrator-setting roles and their counts, exact scan behavior and the
        500 ms post-security-access delay. Confirms seven Basic writes and no
        Pro write. Addresses, serials and raw security payloads are omitted.
    - type: "live_capture"
      artifact: "foreoPeach2.pcapng (Android HCI snoop, 2026-11-07)"
      sha256: "b301ad5b7d29608989238cc05945e6f12b428adb5e3dd529771dd888508f5021"
      obtained_via: "owner-supplied stock-app capture"
      description: >
        Two connections to an already-active PEACH2 running PEACH2 F.REV.K.
        Confirms the FFF0 service map, MAC-derived security write, no-pairing
        session, 0A20 state 01, serial read from 0A02, intensity/mode writes,
        automatic fan and seven-byte cooling profile. Establishes the negative
        findings that 0A30, 0A07, Battery Service, TI OAD and D0FF were absent
        from this normal-mode table and 0A08 was read + notify. No locked-unit
        activation, Pro-mode write or OTA was captured. Real addresses, serial
        and activation values are not reproduced in this spec.
    - type: "vendor_documentation"
      description: >
        FOREO Peach 2 user manual (vendor-hosted, linked in helpful_urls).
        Corroborates the ship-locked behaviour and the registration
        requirement, and documents five hardware-button intensity levels
        versus the app's six.
  open_questions: >
    `remaining_unknowns` now starts with a locked/factory-unit activation
    capture, Pro mode and old-dialect behavior, cooling/sensor semantics and a
    safe OTA path. The containing FFF0 service, new-dialect command envelope,
    seven-byte cooling layout and already-active 0A20 read are settled by the
    2026-11-07 capture.
