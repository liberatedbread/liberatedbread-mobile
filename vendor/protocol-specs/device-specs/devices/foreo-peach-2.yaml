      - uuid: "00002a50-0000-1000-8000-00805f9b34fb"
        name: "PnP ID"
        properties: ["read"]

  - uuid: "f000ffc0-0451-4000-b000-000000000000"
    name: "TI OAD (Over-the-Air Download)"
    verification: "reported"
    notes: >
      Present in the app with image characteristics …ffc1 and …ffc2, but not
      present in the captured unit's normal-mode GATT table. It may require a
      separate update mode; no trigger or transfer was captured. Whether app
      4.4.1 can OTA a Peach remains unconfirmed.

  - uuid: "0000d0ff-3c17-d293-8e48-14fe2e4da212"
    name: "Unidentified D0FF service (declared, apparently unused)"
    verification: "reported"
    notes: >
      Declared in the app but absent from the captured normal-mode GATT
      table. No use was found in 4.4.1 or observed live. Its role is
      unconfirmed; leave it alone rather than probing it as OTA.

protocol_handler: "ipl_foreo"

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["unknown"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "vendor_cloud"
        notes: "The app fetches images from the vendor's CDN; the fetch path is not recovered."
      enter:
        how: "unknown"
        notes: >
          No verified entry command exists. Static analysis suggested a write
          to 00000a08, but the captured unit declares that characteristic read
          + notify and no OTA write was observed. Do not write 0A08 as an
          update trigger on this firmware.
      dfu_mode:
        notes: >
          Static analysis expects the TI OAD service (f000ffc0) with Image
          Identify (ffc1) and Image Block (ffc2) after an update-mode reboot.
          That service was absent from the normal-mode capture, and its
          update-mode name and address remain unknown.
      recovery:
        interrupted: "unknown"
      verification: "hypothesis"
      notes: >
        App-derived, and thin: no transfer flow was traced, and whether app
        4.4.1 can OTA a Peach at all is unconfirmed. Mechanism is left
        unknown rather than ti_oad because other vendors reuse these UUIDs
        over different stacks.

protocol_details:
  scan_to_add:
    verification: "reported"
    configured_names:
      peach_2: "PEACH2"
      peach_2_go: "PEACH2GO"
      peach_2_duo: "PEACH2Duo"
      peach_2_pro_max: "PEACH2ProMAX"
    match: "exact"
    timeout_seconds: 30
    already_active_result_delay_seconds: 10
    activation_advertisement:
      source: "Raw scan record, using an address-derived marker and a following nibble ending in 1 or 0"
      observed_layout: >
        Manufacturer-specific data, company ID 0xFFFF (little-endian FF FF
        on air), payload FF FF <MAC m0..m5> FF 01 — e.g. for the
        documentation MAC AA:BB:CC:DD:EE:FF the payload would read
        FF FF AA BB CC DD EE FF FF 01. The MAC is the address-derived marker;
        the final byte, 01 on an already-active unit, is the likely activation
        nibble. Observed 2026-11-14 on an active PEACH2 F.REV.K.
      capture_value: "01 (active unit); the locked-unit value is unobserved"
      note: "Inactive and OTA devices are published immediately; already-active devices are accumulated for later filtering. That the trailing byte reads 00 on a locked unit is inferred from the app logic, not observed."
    preconnect_device_info_api_bypass: ["PEACH2", "PEACH2GO", "PEACH2ProMAX"]
    registration: >
      The three named models skip the stock app's pre-connect device-info API
      lookup and publish the scanned device directly. Account registration is
      a separate later step, not something this exception proves unnecessary.
    security_access:
      response: "ATT Write Response"
      post_success_delay_ms: 500
      challenge_response_validated: false
      enforced_on_active_unit: false
      role: "Connection setup, not a Pro token, activation write or IPL firing command. On the active F.REV.K unit FFF1 queries and writes worked without it."
  command_protocol:
    framing: >
      No framing: no header, length or checksum. Writes to FFF1 are raw
      `opcode || payload`. First byte 0A = write/set, 0B = read/query; second
      byte = sub-opcode.
    query_model: >
      Write `0B xx` to FFF1, then READ FFF1 back and parse the returned
      bytes. A read-back of all FF bytes means the device was busy; the app
      retries up to 5 times. Every write is verified by the same read-back.
      The observed settings-write acknowledgement was 18 bytes beginning 01
      and otherwise zero. A busy reply to a write means it was not applied:
      re-send the write, not just the read.
    read_back_formats: >
      The T-Sonic motor level is the first byte of the 0B01 read-back (05
      observed); removal mode 01 means Basic and >= 6 means Pro (0BD0; 06
      observed after 0AD0 06). The new 0BC4 0007 query returned an 18-byte
      value whose first seven bytes are the cooling profile accepted by 0AC4.
      0BB2 returns one byte and 0BB4 / 0BB5 / 0BD1 return their tables as
      leading bytes followed by zeros (replay-confirmed on F.REV.K). The
      0BA2 layout remains unpinned.
    capture_verified_vectors:
      - command: "0a c0 0a"
        meaning: "Enable automatic fan; write acknowledged."
      - command: "0b 01"
        response: "05 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
        meaning: "T-Sonic motor level 5."
      - command: "0b c4 00 07"
        response_prefix: "22 1b 21 02 1c 14 14"
        meaning: "Seven-byte current cooling profile (the F.REV.I–K level-0 profile); the remainder of the 18-byte response was zero."
      - command: "0a 01 03"
        meaning: "Set T-Sonic motor level 3; subsequent 18-byte read-back began 01."
      - command: "0a c4 14 0d 21 02 1c 14 14"
        meaning: "Set the F.REV.I–K level-1 cooling profile (see cooling_profiles)."
      - command: "0a d0 01"
        response: "01 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
        meaning: "Select Basic removal mode."
      - command: "0a b1 a5"
        meaning: "Accepted after calibration polling, with the usual 01-prefixed read-back. Its semantics are unknown; do not generalize it into a calibration command."
    replay_verified_vectors:
      description: "Driven by a replacement client on 2026-11-14 against an active PEACH2 F.REV.K; 18-byte read-backs abbreviated to their non-zero prefix."
      vectors:
        - command: "0b c4 00 07"
          response_prefix: "64 0d 21 02 1c 14 14"
          meaning: "F.REV.I–K level-5 cooling profile."
        - command: "0a 01 05"
          response_prefix: "01"
          meaning: "T-Sonic level 5 written back unchanged; acknowledged with or without the 0A10 handshake."
        - command: "0a d0 06"
          response_prefix: "01"
          meaning: "Pro removal mode accepted with no subscription or account."
        - command: "0b d0"
          response_prefix: "06"
          meaning: "Pro read back immediately and again after a fresh connection."
        - command: "0b d1"
          response_prefix: "06 0a 0f 15 19 18 1b 1d 20 23"
          meaning: "Ten-entry flash voltage table, read in Pro mode; read only."
        - command: "0b b4"
          response_prefix: "37 32"
          meaning: "Head-NTC thresholds 55 / 50, matching the app's model config."
        - command: "0b b5"
          response_prefix: "50 46"
          meaning: "Body-NTC thresholds 80 / 70, matching the app's model config."
        - command: "0b b2"
          response_prefix: "02"
          meaning: "Temperature-enable 02, matching the app's model config."
        - command: "0a 01 02"
          response_prefix: "01"
          meaning: "T-Sonic level lowered from 5 to 2; 0B01 then read 02."
  cooling_profiles:
    verification: "reported"
    verification_note: "Table taken from the stock app's bundled per-model settings config. The F.REV.I–K level-0, level-1 and level-5 rows match bytes seen on hardware (capture and replay); the rest are app-derived."
    description: >
      The stock app's cooling control maps levels 0–5 to fixed seven-byte
      0AC4 profiles chosen by SW revision (2A28). Older firmware uses the
      single-byte 0AC0 path; F.REV.L and the Pro MAX use eight-byte rows
      whose last byte carries the level. Pick the row for the unit's exact
      SW revision; do not interpolate. Values are hex.
    tables:
      - sw_revisions: ["PEACH2 F.REV.D", "PEACH2 F.REV.E", "PEACH2 F.REV.F", "PEACH2 F.REV.G"]
        levels: ["23 00 1E 0A 1C 14 14", "23 23 1E 0A 1C 14 14", "23 32 1E 0A 1C 14 14", "23 41 1E 0A 1C 14 14", "23 50 1E 0A 1C 14 14", "23 64 1E 0A 1C 14 14"]
      - sw_revisions: ["PEACH2 F.REV.I", "PEACH2 F.REV.J", "PEACH2 F.REV.K", "PEACH2GO F.REV.B", "PEACH2GO F.REV.C"]
        levels: ["22 1B 21 02 1C 14 14", "14 0D 21 02 1C 14 14", "28 0D 21 02 1C 14 14", "3C 0D 21 02 1C 14 14", "50 0D 21 02 1C 14 14", "64 0D 21 02 1C 14 14"]
      - sw_revisions: ["PEACH2 F.REV.L", "PEACH2GO F.REV.D", "PEACH2ProMAX F.REV.A", "PEACH2ProMAX F.REV.B"]
        levels: ["22 1B 21 02 1C 14 14 00", "22 1B 21 02 1C 14 14 23", "22 1B 21 02 1C 14 14 32", "22 1B 21 02 1C 14 14 41", "22 1B 21 02 1C 14 14 50", "22 1B 21 02 1C 14 14 64"]
        note: "Eight bytes, while set_cooling documents seven; these firmwares were not examined on hardware."
    level_encoding: >
      In every table the level appears as a percentage: 00/23/32/41/50/64 hex
      (0/35/50/65/80/100 %) or 14/28/3C/50/64 hex (20/40/60/80/100 %), with
      22 1B… standing in for level 0 on F.REV.I–K. The fixed bytes are not
      decoded.
  ipl_speed:
    verification: "reported"
    description: >
      Pro MAX only (bundled config for PEACH2ProMAX F.REV.A–F): an "IPL
      speed" setting with Fast and Balanced modes on FFF1 opcode 0AA3, read
      back with 0BA3 0A. Each mode is a fixed set of seven write strings of
      the form 0AA3 <n> <n non-increasing per-step bytes>, for n = 1, 2, 3,
      4, 5, 8 and 10. Fast starts each table at 0D, Balanced at 0A–0C. What
      n and the step bytes control is not decoded, and nothing in this
      family was examined on hardware. Not
      applicable to the plain PEACH2, whose config has no IPL-speed entry.
  dialect_selection:
    description: >
      Two command dialects exist. Peach 2 go and Pro MAX use the NEW dialect;
      Duo has a separate mode-command path using repeated 0AA2 bytes even
      though the broader new-dialect family rules apply to it. A plain Peach 2
      uses the OLD dialect when the last character of its SW revision string
      (2A28) is in a–c, otherwise the new dialect. Old vs new differs in
      removal/flash mode (0AA2 flash-mode bytes vs 0AD0 removal mode) and
      cooling (0AC0 vs 0AC4, 0BC0 vs 0BC4 0007). Duo Basic is
      0AA2 02 02 02 02 02 and Duo Pro is 0AA2 03 03 03 03 03; neither was
      captured, and the Duo Pro switch is hidden in the app. The captured
      PEACH2 F.REV.K unit used 0AD0/0BC4 and also accepted 0AC0 0A auto-fan.
    verification: "confirmed"
    verification_note: "One new-dialect unit is capture-confirmed; the old-dialect suffix rule and other suffix edge cases remain app-derived."
  activation:
    description: >
      Run after every connect: (1) security access — write
      01 A1 <MAC[3]> <MAC[4]> <MAC[5]> to 0A10 (retried up to 3x by the
      stock app); (2) read SW revision 2A28; (3) read 0A20 and only if its
      first byte is 00 write 01 02 <8-byte chipId>; (4) only when 0A30 exists,
      read it and unless its first byte is 01 write 01. The captured unit was
      already active, exposed no 0A30, and instead proceeded to read its
      serial from 0A02. Steps 1–2 and the 0A20 read are capture- and
      replay-confirmed; the locked-unit activation write and 0A30 flow are
      app-derived.
    chip_id_algorithm: >
      chipId is a fixed, keyless permutation of the 6-byte BLE MAC
      (m0 m1 m2 m3 m4 m5, in the usual printed order). Let
      b = [m5, m4, m3, 0x00, 0x00, m2, m1, m0]. Then the 8 output bytes are
      (all arithmetic mod 256):

        out[0] = (b[2] & 0x0F) | (b[7] & 0xF0)
        out[1] = (b[5] & 0x0F) | (b[1] & 0xF0)
        out[2] = (b[7] & 0x0F) + (0xF0 - (b[6] & 0xF0))
        out[3] = 0xFF - b[6]
        out[4] = b[5] + 1
        out[5] = (b[1] & 0x0F) + (0xF0 - (b[2] & 0xF0))
        out[6] = (b[0] & 0x0F) | (b[5] & 0xF0)
        out[7] = (b[6] & 0x0F) | (b[0] & 0xF0)

      No key, no nonce, no server input — pure MAC arithmetic.
      `scripts/test_foreo_peach2_spec.py` transcribes this algorithm and
      asserts the vectors below.
    test_vectors:
      description: >
        Documentation MAC 00:11:22:33:44:55-style placeholder (AA:BB:CC:DD:EE:FF)
        — identifies no real unit. A client whose chipId(MAC) does not
        reproduce these bytes has mis-transcribed the algorithm.
      input:
        ble_mac: "AA:BB:CC:DD:EE:FF"
      vectors:
        - step: "security_access write to 0A10"
          bytes: "01 A1 DD EE FF"
        - step: "chipId (payload of the 01 02 … activation write to 0A20)"
          bytes: "AD EC 4A 44 CD 2E CF FB"
        - step: "full activation write to 0A20"
          bytes: "01 02 AD EC 4A 44 CD 2E CF FB"
  paywall:
    mechanism: >
      Server-side subscription (via an external billing provider), bought
      through an in-app web flow — the app has no in-app-purchase store
      integration. Entitlement is fetched from the vendor API, cached locally
      and checked in the UI. Normal Pro selection requires both the
      subscription flag and an active subscription state. A separate
      testing == 1 flag bypasses the inactive-subscription UI branch; that is
      a vendor-test exception, not an ordinary registration requirement.
    gated_features:
      - "Pro removal mode and its five additional boost intensities (Peach 2 family UI)"
    enforcement: >
      The only gate is in the app, before the settings write. Once the app
      permits Pro, it writes 0AD0 06 to FFF1; Basic is 0AD0 01. There is no
      token, key or server-issued blob anywhere on the Pro path, and the
      firmware does not enforce entitlement: on 2026-11-14 a replacement
      client with no FOREO account wrote 0AD0 06 to a PEACH2 F.REV.K, which
      acknowledged it, read back 06, and still reported 06 after a fresh
      connection. Static analysis says the stock app, on connecting to a
      non-Duo device that reports >= 6 while it considers the subscription
      inactive, writes Basic back, so opening the stock app undoes the
      change; that downgrade was not exercised. Security access on 0A10 is
      connection setup, not a Pro unlock token. Basic mode, cooling and the
      T-Sonic level are not paywalled. The Basic/Pro
      switch is shown for Peach 2 go / Pro MAX always and for a plain Peach 2
      on new firmware (SW revision not ending in a–g); it is hidden on Duo.
      Duo uses repeated 0AA2 mode bytes instead of 0AD0; its Pro command was
      not captured either. 'Peach 2 Pro MAX' is a separate hardware SKU.
    verification: "confirmed"
    verification_note: "Firmware acceptance of a direct Pro write is replay-confirmed on one PEACH2 F.REV.K. The app-side gate and downgrade logic are app-derived; Duo and old-dialect Pro paths are untested."

remaining_unknowns:
  - "Locked/factory-unit behavior: the advertisement's trailing activation byte on a locked unit (01 on an active one), whether locked units accept security access immediately or enforce it, and whether they accept the documented 01 02 chipId write. Every unit examined was already active."
  - "Complete registration/server behavior after the PEACH2/GO/Pro Max pre-connect API exception; the exception itself does not prove registration is unnecessary."
  - "0A30 wake-up, 0A07 chip ID and 2A19 battery were absent from the captured new-dialect GATT table; their presence and containing services on other firmware remain unknown."
  - "The fixed (non-level) bytes of the 0AC4 cooling profiles, whether F.REV.L / Pro MAX accept their eight-byte rows and how 0BC4 0007 reports the eighth byte; the 0BA2 read-back layout; what the Pro MAX 0AA3 IPL-speed bytes control."
  - "How Pro's 'five extra boost intensities' are applied. The handset still offers five levels in Pro (owner observation, 2026-11-14) and the flash voltage table holds ten entries, so levels 1–5 most likely select entries 6–10 in Pro; confirming that needs a 0BD1 read in Basic and an observation of which entry a flash uses, neither done. Units of the voltage entries are unknown."
  - "Whether any BLE command sets or reads the handset's IPL intensity. None was found in the app's Peach settings flows."
  - "Whether a handshake-less connection can do anything the handshake normally gates. On the active F.REV.K unit nothing tested required it."
  - "Units and conversion formulas for body/head NTC (0A18/0A19), accelerometer axes/units (0A0C), the vibrator-setting vocabulary (0A0D), the unknown 0A44/0A09 streams, and the accepted 0AB1 A5 write."
  - "Old-dialect behavior, Duo-specific mode/cooling paths and SW-revision suffix edge cases beyond the one confirmed new-dialect F.REV.K unit; Duo Pro was not captured."
  - "Whether the stock app's downgrade-to-Basic actually fires on connect, and whether other firmware revisions, the Pro MAX or the Duo also accept Pro without entitlement. Only one F.REV.K unit was tested."
  - "OTA entry, image fetch/transfer, update-mode identity and recovery. The captured 0A08 is read + notify, so the earlier write-trigger hypothesis is not valid for this unit."
  - "Whether the peripheral accepts only one central at a time; short sequential connections do not establish a general exclusivity rule. Also why the first BlueZ connect attempt so often drops during service discovery."
  - "Whether any model exposes a remote-fire command. None was identified in the reviewed app flows or this capture, which is a scoped negative result, not proof of absence."
  - "FOREO Bear 2 (microcurrent, same app) appears to share the activation + subscription pattern per code structure — follow-up target if a unit is acquired"

