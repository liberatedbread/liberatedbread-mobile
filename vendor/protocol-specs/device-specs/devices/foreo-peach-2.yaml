protocol_handler: "ipl_foreo"

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["unknown"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "vendor_cloud"
        notes: "The app fetches images from the vendor's CDN; the fetch path is not recovered."
      enter:
        how: "unknown"
        notes: >
          No verified entry command exists. Static analysis suggested a write
          to 00000a08, but the captured unit declares that characteristic read
          + notify and no OTA write was observed. Do not write 0A08 as an
          update trigger on this firmware.
      dfu_mode:
        notes: >
          Static analysis expects the TI OAD service (f000ffc0) with Image
          Identify (ffc1) and Image Block (ffc2) after an update-mode reboot.
          That service was absent from the normal-mode capture, and its
          update-mode name and address remain unknown.
      recovery:
        interrupted: "unknown"
      verification: "hypothesis"
      notes: >
        App-derived, and thin: no transfer flow was traced, and whether app
        4.4.1 can OTA a Peach at all is unconfirmed. Mechanism is left
        unknown rather than ti_oad because other vendors reuse these UUIDs
        over different stacks.

protocol_details:
  scan_to_add:
    verification: "reported"
    configured_names:
      peach_2: "PEACH2"
      peach_2_go: "PEACH2GO"
      peach_2_duo: "PEACH2Duo"
      peach_2_pro_max: "PEACH2ProMAX"
    match: "exact"
    timeout_seconds: 30
    already_active_result_delay_seconds: 10
    activation_advertisement:
      source: "Raw scan record, using an address-derived marker and a following nibble ending in 1 or 0"
      capture_value: "unknown"
      note: "Inactive and OTA devices are published immediately; already-active devices are accumulated for later filtering. The specific flag in this capture was not independently decoded."
    preconnect_device_info_api_bypass: ["PEACH2", "PEACH2GO", "PEACH2ProMAX"]
    registration: >
      The three named models skip the stock app's pre-connect device-info API
      lookup and publish the scanned device directly. Account registration is
      a separate later step, not something this exception proves unnecessary.
    security_access:
      response: "ATT Write Response"
      post_success_delay_ms: 500
      challenge_response_validated: false
      role: "Connection setup, not a Pro token, activation write or IPL firing command"
  command_protocol:
    framing: >
      No framing: no header, length or checksum. Writes to FFF1 are raw
      `opcode || payload`. First byte 0A = write/set, 0B = read/query; second
      byte = sub-opcode.
    query_model: >
      Write `0B xx` to FFF1, then READ FFF1 back and parse the returned
      bytes. A read-back starting with FF FF FF FF means the device was busy;
      the app retries up to 5 times. Every write is verified by the same
      read-back. The observed settings-write acknowledgement was 18 bytes
      beginning 01 and otherwise zero.
    read_back_formats: >
      Intensity is the first byte of the 0B01 read-back (05 observed after
      selecting level 5); removal mode 01 means Basic and >= 6 means Pro
      (0BD0). The new 0BC4 0007 query returned an 18-byte value whose first
      seven bytes are the cooling profile accepted by 0AC4. Layouts for
      0BA2, 0BB2/0BB4/0BB5 and 0BD1 remain unpinned.
    capture_verified_vectors:
      - command: "0a c0 0a"
        meaning: "Enable automatic fan; write acknowledged."
      - command: "0b 01"
        response: "05 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
        meaning: "Intensity 5."
      - command: "0b c4 00 07"
        response_prefix: "22 1b 21 02 1c 14 14"
        meaning: "Seven-byte current cooling profile; the remainder of the 18-byte response was zero."
      - command: "0a 01 03"
        meaning: "Set intensity 3; subsequent 18-byte read-back began 01."
      - command: "0a c4 14 0d 21 02 1c 14 14"
        meaning: "Set one observed seven-byte cooling profile; this is a wire example, not a universal recommended setting."
      - command: "0a d0 01"
        response: "01 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
        meaning: "Select Basic removal mode."
      - command: "0a b1 a5"
        meaning: "Accepted after calibration polling, with the usual 01-prefixed read-back. Its semantics are unknown; do not generalize it into a calibration command."
  dialect_selection:
    description: >
      Two command dialects exist. Peach 2 go and Pro MAX use the NEW dialect;
      Duo has a separate mode-command path using repeated 0AA2 bytes even
      though the broader new-dialect family rules apply to it. A plain Peach 2
      uses the OLD dialect when the last character of its SW revision string
      (2A28) is in a–c, otherwise the new dialect. Old vs new differs in
      removal/flash mode (0AA2 flash-mode bytes vs 0AD0 removal mode) and
      cooling (0AC0 vs 0AC4, 0BC0 vs 0BC4 0007). Duo Basic is
      0AA2 02 02 02 02 02 and Duo Pro is 0AA2 03 03 03 03 03; neither was
      captured, and the Duo Pro switch is hidden in the app. The captured
      PEACH2 F.REV.K unit used 0AD0/0BC4 and also accepted 0AC0 0A auto-fan.
    verification: "confirmed"
    verification_note: "One new-dialect unit is capture-confirmed; the old-dialect suffix rule and other suffix edge cases remain app-derived."
  activation:
    description: >
      Run after every connect: (1) security access — write
      01 A1 <MAC[3]> <MAC[4]> <MAC[5]> to 0A10 (retried up to 3x by the
      stock app); (2) read SW revision 2A28; (3) read 0A20 and only if its
      first byte is 00 write 01 02 <8-byte chipId>; (4) only when 0A30 exists,
      read it and unless its first byte is 01 write 01. The captured unit was
      already active, exposed no 0A30, and instead proceeded to read its
      serial from 0A02. Steps 1–2 and the 0A20 read are capture-confirmed;
      the locked-unit activation write and 0A30 flow are app-derived.
    chip_id_algorithm: >
      chipId is a fixed, keyless permutation of the 6-byte BLE MAC
      (m0 m1 m2 m3 m4 m5, in the usual printed order). Let
      b = [m5, m4, m3, 0x00, 0x00, m2, m1, m0]. Then the 8 output bytes are
      (all arithmetic mod 256):

        out[0] = (b[2] & 0x0F) | (b[7] & 0xF0)
        out[1] = (b[5] & 0x0F) | (b[1] & 0xF0)
        out[2] = (b[7] & 0x0F) + (0xF0 - (b[6] & 0xF0))
        out[3] = 0xFF - b[6]
        out[4] = b[5] + 1
        out[5] = (b[1] & 0x0F) + (0xF0 - (b[2] & 0xF0))
        out[6] = (b[0] & 0x0F) | (b[5] & 0xF0)
        out[7] = (b[6] & 0x0F) | (b[0] & 0xF0)

      No key, no nonce, no server input — pure MAC arithmetic.
      `scripts/test_foreo_peach2_spec.py` transcribes this algorithm and
      asserts the vectors below.
    test_vectors:
      description: >
        Documentation MAC 00:11:22:33:44:55-style placeholder (AA:BB:CC:DD:EE:FF)
        — identifies no real unit. A client whose chipId(MAC) does not
        reproduce these bytes has mis-transcribed the algorithm.
      input:
        ble_mac: "AA:BB:CC:DD:EE:FF"
      vectors:
        - step: "security_access write to 0A10"
          bytes: "01 A1 DD EE FF"
        - step: "chipId (payload of the 01 02 … activation write to 0A20)"
          bytes: "AD EC 4A 44 CD 2E CF FB"
        - step: "full activation write to 0A20"
          bytes: "01 02 AD EC 4A 44 CD 2E CF FB"
  paywall:
    mechanism: >
      Server-side subscription (via an external billing provider), bought
      through an in-app web flow — the app has no in-app-purchase store
      integration. Entitlement is fetched from the vendor API, cached locally
      and checked in the UI. Normal Pro selection requires both the
      subscription flag and an active subscription state. A separate
      testing == 1 flag bypasses the inactive-subscription UI branch; that is
      a vendor-test exception, not an ordinary registration requirement.
    gated_features:
      - "Pro removal mode and its five additional boost intensities (Peach 2 family UI)"
    enforcement: >
      The confirmed gate is in the app before the settings write. Once the app
      permits Pro, it writes 0AD0 06 to FFF1; Basic is 0AD0 01. Static analysis
      says a non-Duo device reporting >= 6 with an inactive subscription is
      switched back to Basic. The capture contains seven Basic writes and no
      Pro write, so it neither proves that this downgrade ran nor establishes
      whether firmware accepts a direct Pro write outside the entitlement
      path. Any independent firmware entitlement enforcement is unknown.
      Security access on 0A10 is connection setup, not a Pro unlock token.
      Intensity levels 0–5 and Basic mode are not paywalled. The Basic/Pro
      switch is shown for Peach 2 go / Pro MAX always and for a plain Peach 2
      on new firmware (SW revision not ending in a–g); it is hidden on Duo.
      Duo uses repeated 0AA2 mode bytes instead of 0AD0; its Pro command was
      not captured either. 'Peach 2 Pro MAX' is a separate hardware SKU.
    verification: "reported"

remaining_unknowns:
  - "Locked/factory-unit behavior: the exact advertisement activation-bit value in this capture, whether locked units advertise identically and accept security access immediately, and whether they accept the documented 01 02 chipId write. The captured unit was already active."
  - "Complete registration/server behavior after the PEACH2/GO/Pro Max pre-connect API exception; the exception itself does not prove registration is unnecessary."
  - "0A30 wake-up, 0A07 chip ID and 2A19 battery were absent from the captured new-dialect GATT table; their presence and containing services on other firmware remain unknown."
  - "The semantics and level mapping of the seven-byte 0AC4 cooling profile; read-back layouts for 0BA2, 0BB2/0BB4/0BB5 and 0BD1; payload layouts for 0AB2/0AB4/0AB5/0AD1 set opcodes."
  - "Units and conversion formulas for body/head NTC (0A18/0A19), accelerometer axes/units (0A0C), the vibrator-setting vocabulary (0A0D), the unknown 0A44/0A09 streams, and the accepted 0AB1 A5 write."
  - "Old-dialect behavior, Duo-specific mode/cooling paths and SW-revision suffix edge cases beyond the one confirmed new-dialect F.REV.K unit; Duo Pro was not captured."
  - "Direct firmware acceptance of Pro mode outside the app's entitlement path, whether any downgrade occurred in the capture, and the account's subscription state. Only Basic writes were observed."
  - "OTA entry, image fetch/transfer, update-mode identity and recovery. The captured 0A08 is read + notify, so the earlier write-trigger hypothesis is not valid for this unit."
  - "Whether the peripheral accepts only one central at a time; two short stock-app connections do not establish a general exclusivity rule."
  - "Whether any model exposes a remote-fire command. None was identified in the reviewed app flows or this capture, which is a scoped negative result, not proof of absence."
  - "FOREO Bear 2 (microcurrent, same app) appears to share the activation + subscription pattern per code structure — follow-up target if a unit is acquired"

