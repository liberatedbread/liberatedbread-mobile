# FOREO Peach 2 (IPL hair removal) — Device Spec (BLE, fully local)
# Reverse-engineered from FOREO For You 4.4.1 (versionCode 559) and a
# 2026-11-07 stock-app Android HCI capture. No replacement client has replayed
# the spec. Facts confirmed by that capture are marked `confirmed`; app-derived
# locked-unit activation, Pro mode and OTA remain `reported` or `hypothesis`.
#
# Two headline findings:
#   1. The device ships LOCKED and static analysis derives its activation bytes
#      from its own BLE MAC, without server input. The captured unit was already
#      active, so the locked-unit write remains unverified.
#   2. Pro mode is gated in the app by subscription state, with a separate
#      vendor-test exception. The capture contains no Pro write, so direct
#      firmware acceptance outside that entitlement path is not established.

device:
  name: "FOREO Peach 2 IPL hair removal"
  manufacturer: "FOREO AB"
  manufacturer_status: "active"
  testing:
    status: untested
    detail: capture-verified
    notes: >
      A 2026-11-07 Android HCI snoop captured two stock-app connections to an
      already-activated PEACH2 running new-dialect firmware. It confirms the
      FFF0 service layout, no-pairing session, security-access derivation,
      0A20 read, intensity/mode writes, cooling query and seven-byte cooling
      profile writes. The locked-unit activation write, 0A30 wake-up flow,
      Pro-mode write and OTA were not observed, and no replacement client has
      replayed this spec against hardware.
  protocol: "ble"
  transport: "ble-gatt"
  category: "personal_care"
  type: "ipl-hair-removal"
  notes: >
    Mains-powered IPL (intense pulsed light) hair-removal device with BLE,
    Telink-based chipset, companion app FOREO For You. One spec covers the
    Peach 2 family — Peach 2, Peach 2 go, Peach 2 Pro MAX, Peach 2 Duo —
    which share one code path in the app and differ in command dialect (see
    `protocol_details.dialect_selection`) and in which UI modes the app
    exposes. Optical output up to 7.3 J/cm² with firmware skin-contact and
    eye-safety interlocks; intensity levels 0–5 over BLE (the hardware
    buttons expose five levels per the vendor manual, the app six).

    The device ships LOCKED: per the vendor manual it will not turn on until
    "registered" from the app. Static analysis derives the 0A20 activation
    payload entirely from the device's own BLE MAC (see
    `protocol_details.activation`), with no server input. That makes offline
    activation implementable in principle, but the locked-unit write was not
    observed: the captured unit was already active. PEACH2/GO/Pro Max also
    skip the stock app's pre-connect device-info lookup; account registration
    remains a separate later step.

    Custom 16-bit UUIDs on the standard Bluetooth base
    (0000xxxx-0000-1000-8000-00805f9b34fb). No pairing/bonding at any point
    (the app never bonds), no MTU negotiation on the Peach connect path —
    20-byte writes suffice. No command framing: writes are raw
    opcode || payload, answers are read back from the command characteristic.

  variants:
    - model: "Peach 2"
      identification:
        local_names: ["PEACH2"]
    - model: "Peach 2 go"
      identification:
        local_names: ["PEACH2GO"]
    - model: "Peach 2 Pro MAX"
      identification:
        local_names: ["PEACH2ProMAX"]
    - model: "Peach 2 Duo"
      identification:
        local_names: ["PEACH2Duo"]

  safety_advisory:
    severity: "danger"
    summary: >
      IPL fires intense light pulses — improper use can cause permanent skin
      burns, blistering, scarring, or eye injury.
    detail: >
      This is an IPL (intense pulsed light) hair-removal handset with an optical
      output up to 7.3 J/cm². Used wrongly it can cause permanent harm: burns,
      blistering, discoloration or scarring of the skin, and serious eye injury
      from looking into a flash. Always follow FOREO's own instructions —
      patch-test first, match the intensity level to your skin tone (darker skin
      needs a lower level), never treat broken, tanned, tattooed or moled skin,
      and keep it away from the eyes. This app only sets intensity and mode over
      Bluetooth; the flash itself is triggered on the device against its
      skin-contact interlock. This app is EXPERIMENTAL and is not affiliated
      with, endorsed by, or supported by FOREO — the manufacturer's manual and
      safety guidance govern.
    acknowledge_required: true
    advisory_url: "https://www.foreo.com/mysa/find-out-if-peach-2-is-suitable-for-you"
    advisory_archive_url: "https://web.archive.org/web/20260831005900/https://www.foreo.com/mysa/find-out-if-peach-2-is-suitable-for-you"
  identification:
    local_names:
      - "PEACH2"
      - "PEACH 2"
      - "PEACH™ 2"
      - "PEACH2GO"
      - "PEACH2ProMAX"
      - "PEACH2 Pro MAX"
      - "PEACH2Duo"
    notes: >
      App 4.4.1 and the 4.2.0 comparison build configure exact model-specific
      names: PEACH2, PEACH2GO, PEACH2Duo and PEACH2ProMAX. The spaced and
      trademark forms are retained as previously reported aliases, not as a
      reason to match every PEACH-prefixed device.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "exact"
            values:
              - "PEACH2"
              - "PEACH 2"
              - "PEACH™ 2"
              - "PEACH2GO"
              - "PEACH2ProMAX"
              - "PEACH2 Pro MAX"
              - "PEACH2Duo"
        notes: >
          The stock app disables fuzzy name matching and scans for the selected
          model's configured name for 30 seconds. Its scan handler also derives
          activation state from the raw advertisement; the exact flag encoding
          in this capture is not independently decoded.
    identity:
      stable_keys: ["address"]
      display: "local_name"
      notes: >
        The security-access and activation writes both take bytes of the
        device's own BLE MAC, so the address is load-bearing for this
        protocol, not just an identity key. The stock app also uses an
        address-derived marker when interpreting advertisement activation
        state. The exact locked/advertising flag value remains unknown — see
        `remaining_unknowns`.
    static_ip_required: false

  setup:
    required: false
    confidence: medium
    notes: >
      Nothing to provision — no network, no account. The one gate is the
      ship-lock: a factory-fresh Peach 2 refuses to operate until a client
      performs the BLE activation below. Static analysis shows the activation
      payload derives only from the device's own BLE MAC, so the offline route
      is primary. The 2026-11-07 capture confirms discovery, security access,
      the SW-revision and 0A20 reads on an already-active unit; it does not
      verify the locked-unit write. PEACH2/GO/Pro Max skip the stock app's
      pre-connect device-information API lookup, but account registration is a
      separate later step whose complete server behavior is not mapped here.
    methods:
      - type: "ble_direct"
        name: "Offline BLE activation (no account, no network)"
        role: primary
        verified: false
        description: >
          Scan for the selected model's exact advertised name, connect without
          bonding, write the security-access handshake, then read 0A20 and,
          only if its first byte is 00, write 01 02 <8-byte chipId> as
          documented under `protocol_details.activation`. Read 0A30 and enable
          wake-up only on firmware that exposes that characteristic; the
          captured new-dialect unit did not expose it.
        ble:
          advertised_name: "PEACH2 / PEACH 2 / PEACH2GO / PEACH2Duo / PEACH2ProMAX"
          advertised_name_match: "exact"
          pairing_required: false
        steps:
          - action: "Plug in and scan for the selected model's exact configured name (PEACH2, PEACH2GO, PEACH2Duo or PEACH2ProMAX; the spaced/trademark aliases are retained in discovery). The stock app scans for 30 seconds."
            actor: "client"
            expect: "Advertisement with the exact model name and, if decodable, an activation-state marker. Do not treat every PEACH-prefixed device as this model."
          - action: "Connect (no bonding) and discover services. FFF0 contains FFF1, 0A10 and 0A20 on the captured firmware."
            actor: "client"
          - action: "Write security access: 01 A1 <MAC[3]> <MAC[4]> <MAC[5]> to characteristic 0A10 (last three bytes of the device's own BLE MAC)."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "security_access"
            expect: "Write Response received; the stock app retries up to 3 times, waits 500 ms, and validates no challenge response before continuing."
          - action: "Read SW revision (2A28) — the device is ready; the value also selects the command dialect."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "read_sw_revision"
          - action: "Read 0A20; if the value starts with byte 00, write 01 02 <chipId(MAC)> (see protocol_details.activation). If it already starts with 01, do not rewrite it."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "activate"
            expect: "Device unlocked; the captured already-active unit returned 01 and required no activation write."
          - action: "If 0A30 exists, read it and, unless the value starts with 01, write 01 (wake-up enabled). Skip this step when 0A30 is absent, as on the captured new-dialect unit."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "set_wakeup"
      - type: "cloud_account"
        name: "Stock FOREO For You app registration"
        role: alternative
        verified: false
        description: >
          The vendor flow: sign into a FOREO account in the app, which POSTs
          a product registration to the vendor cloud and then performs exactly
          the BLE activation above. The server call is warranty bookkeeping —
          none of its response feeds the unlock bytes — so this route adds an
          account and a network dependency without adding anything the
          firmware requires. Kept as documentation of what the stock app does,
          and the only route that records the unit under the owner's warranty
          account.
        cloud:
          provider: "FOREO (FOREO For You account)"
          local_alternative: >
            The primary method above: the activation write is computable
            offline from the device's BLE MAC, so the cloud registration is
            optional end to end.
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established. No factory-reset procedure was found in the app or in
        the manual text examined, and none occurred in the capture. What a
        reset would clear is unknown. Activation state (0A20) and wake-up
        (0A30, on firmware that exposes it) are the persisted setup state
        identified by static analysis; ordinary runtime-setting persistence
        was not established.
      description: >
        Nobody has established a reset procedure for the Peach 2. Static
        analysis describes activation as idempotent, so a second-hand unit
        should not need a reset for normal ownership. The locked-unit write
        remains unverified. Do not guess a procedure on an IPL device — the
        skin-contact and eye-safety interlocks make improvised button
        sequences a poor idea. Listed as `unknown` rather than `false`
        because nothing proves one does not exist.
    rejoin:
      requires_factory_reset: false
      in_place_supported: true
      notes: >
        There is no network to rejoin and no bond to move: a new phone just
        scans, connects and writes the security-access handshake. Only a unit
        whose 0A20 value is still locked needs the activation write.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Activation state derived from the device BLE MAC (0A20; the locked-unit write is app-derived)"
        - "Wake-up enable flag (0A30, only on firmware that exposes it; absent from the captured unit)"
      issued_to_client:
        - "Nothing. No keys, tokens or bonds are issued in either setup route; the cloud route's account session lives entirely in the phone app."

  pairing:
    required: false
    confidence: "high"
    security_mode: "app_layer"
    bonding: "none"
    exclusivity:
      single_connection: "unknown"
      single_bond: "unknown"
      recovery: >
        No bond exists to clear. If a connection stalls, close the vendor app
        and reconnect, then repeat the security-access write. Two short
        stock-app connections were captured; general single-central behavior
        remains unknown.
      notes: >
        No SMP exchange or bonding occurred in either captured connection.
        This does not establish how many centrals the peripheral accepts at
        once.
    enter_pairing_mode:
      required: false
      notes: >
        The activated captured unit advertised as PEACH2 and accepted bare
        connections. Whether a factory-locked unit advertises identically is
        still unverified.
    unpair:
      supported: false
      requires_factory_reset: false
      notes: >
        Nothing to unpair: no bond was created in the capture, so moving to a
        new client needs no reset or forget-device step.
    notes: >
      No link-layer pairing occurred in either captured connection. What looks
      like security lives entirely above the link layer: the per-connection
      security-access write to 0A10 and, only on a locked unit, the activation
      write to 0A20. Both derive from the device's own BLE MAC. The first is
      capture-confirmed; the second remains app-derived because the captured
      unit was already active.

  # The cloud block records the phone-app services for completeness. The
  # device itself has no radio but BLE and never talks to any of this; the
  # stock app's server round-trips are bookkeeping the firmware ignores.
cloud:
  required: false
  vendor_service: "FOREO For You cloud (account, product-registration bookkeeping, subscription entitlement)"
  hosts:
    - "https://apiadmin.foreo.com"
    - "https://appadmin.foreo.com"
    - "https://www.foreo.com/api/… (web API surface)"
  auth:
    type: "other"
    notes: >
      Account login in the app; session expiry forces re-login. Device
      registration is an account-scoped POST under
      users/{uuid}/product_registration. Not mapped further — none of it is
      on the local-control path.
    verification: "reported"
  failure_mode: >
    The captured BLE settings operations require no cloud round trip, so an
    already-active unit retains its documented local controls when the vendor
    cloud is unavailable. Static analysis makes locked-unit activation and Pro
    mode locally constructible as well, but neither was directly verified. The
    cloud records product registration and supplies the entitlement state the
    stock app uses to gate Pro; complete registration-server behavior after
    the PEACH2 pre-connect API exception is not mapped.
  data_leaves_device:
    - "Product registration record (device model/serial attached to the owner's account) — sent by the phone app, only on the stock registration route"
    - "Subscription entitlement state (server-side, via an external billing provider) — fetched and enforced by the app; any independent firmware entitlement check is unknown"
    - "Account identity and profile data (app-side)"
  notes: >
    Monetization is a server-side subscription bought via an in-app web flow;
    the app has no in-app-purchase store integration. The subscription gates
    the app's Pro UI. Static analysis says an inactive subscription causes a
    Basic-mode write when the device reports Pro, and a separate testing flag
    bypasses that UI branch. The capture contains only Basic writes and does
    not establish that downgrade path or direct firmware acceptance of Pro.
    See `protocol_details.paywall`.

local_access:
  status: "native"
  summary: >
    Captured ordinary controls are fully local over BLE. Offline locked-unit
    activation and Pro mode are implementable from static analysis but not
    hardware-confirmed; do not treat them as capture-verified capabilities.
  covers:
    - "Offline activation (unlock) of a factory-fresh unit — chipId derived from the device's BLE MAC, written to 0A20 (app-derived; not observed on the already-active captured unit)"
    - "IPL intensity set/read, levels 0–5 (0A01/0B01; levels 3 and 5 and the query are capture-confirmed)"
    - "Removal mode Basic/Pro set/read (0AD0/0BD0 on new firmware; 0AA2/0BA2 flash-mode bytes on old firmware) — Basic captured; Pro app-derived"
    - "Cooling/fan profile set/read (0AC4 seven-byte profile / 0BC4 0007; 0AC0 0A automatic fan also captured)"
    - "Serial number (0A02 on the captured firmware) and SW revision (2A28); 0A07 and 2A19 were not present"
    - "Skin-sensor/accelerometer calibration polling (0A0C; one-byte read values captured, semantics unpinned)"
    - "Temperature-enable and head/body NTC threshold opcodes (0AB2/0AB4/0AB5 families; payload layouts unpinned — see remaining_unknowns)"
  not_covered:
    - "OTA firmware update — no safe entry or transfer is known. The captured 0A08 is read + notify, not a verified trigger write, and TI OAD was absent from normal-mode discovery"
    - "Firing flashes from the app is not a BLE operation on this device family in the flows traced — flashing is hardware-triggered against the skin-contact interlock"

services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "FOREO Peach Command and Security Service"
    verification: "confirmed"
    notes: >
      Live service discovery on 2026-11-07 confirmed this containing service
      and every characteristic below. The earlier stand-in 0A20 service was
      wrong. All command traffic is raw `opcode || payload` with no header,
      length or checksum; queries are written and then answered by READING
      FFF1 back. A read-back starting with FF FF FF FF means the device was
      busy — the app retries up to 5 times. Every observed settings write was
      followed by an 18-byte read-back whose first byte was 01.
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: "Command channel"
        properties: ["write", "read"]
        verification: "confirmed"
        notes: >
          All Peach commands are written here and all answers read back from
          the same characteristic. First byte 0A = write/set, 0B = read/query;
          second byte = sub-opcode. Dialect selection is in
          `protocol_details.dialect_selection`.
        commands:
          set_intensity:
            description: "Set IPL intensity level, 0–5 (six levels; the hardware buttons expose five per the vendor manual)."
            template: [0x0A, 0x01, "{level}"]
            verification: "confirmed"
            parameters:
              level:
                type: "uint8"
                min: 0
                max: 5
          get_intensity:
            description: "Read IPL intensity; the level is the first byte of the FFF1 read-back."
            value: [0x0B, 0x01]
            verification: "confirmed"
          set_removal_mode_basic:
            description: "New-firmware removal mode: Basic."
            value: [0x0A, 0xD0, 0x01]
            verification: "confirmed"
          set_removal_mode_pro:
            description: >
              New-firmware removal mode: Pro. The stock app permits this write
              with an active eligible subscription or its testing flag. Direct
              firmware acceptance outside that path is unknown; the
              2026-11-07 capture contains no Pro write.
            value: [0x0A, 0xD0, 0x06]
            verification: "reported"
            advanced: true
            advanced_reason: "Switches an IPL device to its higher-output Pro removal mode, a write the capture never made and the stock app gates behind a subscription. Read the mode back with get_removal_mode, and match the intensity to your skin tone per the vendor manual."
          get_removal_mode:
            description: "Read removal mode; a read-back value >= 6 means Pro. Basic returned 01 in the live capture."
            value: [0x0B, 0xD0]
            verification: "confirmed"
          set_flash_mode:
            description: >
              OLD-firmware flash mode and the separate Duo mode-command path;
              the mode byte is repeated five times (Basic = 02 x5,
              Pro = 03 x5, Face = 01 x5). Other new-firmware models use
              set_removal_mode_* instead — see
              `protocol_details.dialect_selection`. Duo Pro was not captured.
            template: [0x0A, 0xA2, "{mode}", "{mode}", "{mode}", "{mode}", "{mode}"]
            verification: "reported"
            advanced: true
            advanced_reason: "Changes the flash mode of an IPL device (Face, Basic or Pro) on the old-firmware and Duo paths only, none of which were captured. Sent to the wrong dialect it is an unverified write; check protocol_details.dialect_selection and read the mode back with get_flash_mode."
            parameters:
              mode:
                type: "uint8"
                min: 1
                max: 3
                labels: ["Face", "Basic", "Pro"]
          get_flash_mode:
            description: "Read flash mode (old firmware)."
            value: [0x0B, 0xA2]
            verification: "reported"
          set_cooling:
            description: >
              New-firmware cooling profile write: 0AC4 followed by exactly
              seven bytes. The capture accepted several profiles; their field
              semantics and level mapping remain incomplete.
            template: [0x0A, 0xC4, "{profile}"]
            verification: "confirmed"
            advanced: true
            advanced_reason: "Cooling-profile semantics are only partially decoded. Read the current seven-byte profile first; do not substitute arbitrary values on an IPL device."
            parameters:
              profile:
                type: "bytes"
                min_length: 7
                max_length: 7
                description: "Seven-byte profile as returned by get_cooling_new. Read-back carries these seven bytes followed by zeroes."
          set_auto_fan:
            description: "Enable automatic fan control (0AC0 0A). Accepted on the captured new-dialect unit as well as documented for the old dialect."
            value: [0x0A, 0xC0, 0x0A]
            verification: "confirmed"
          set_cooling_old:
            description: "OLD-firmware single-byte cooling write (0AC0); use set_auto_fan for the documented automatic mode."
            template: [0x0A, 0xC0, "{value}"]
            verification: "reported"
            advanced: true
            advanced_reason: "Writes an arbitrary cooling byte to an IPL device's old-firmware cooling path; the value meanings are not decoded beyond set_auto_fan's 0A. Cooling protects the skin during flashing, so prefer set_auto_fan."
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          get_cooling:
            description: "Read cooling level on OLD firmware (0BC0)."
            value: [0x0B, 0xC0]
            verification: "reported"
          get_cooling_new:
            description: "Read the new-firmware cooling profile (0BC4 0007). The first seven bytes are the profile accepted by set_cooling; the observed read-back was 18 bytes."
            value: [0x0B, 0xC4, 0x00, 0x07]
            verification: "confirmed"
          set_temperature_enable:
            description: "Temperature-enable set. Payload layout not recovered — only the 0AB2 opcode is known."
            verification: "hypothesis"
          get_temperature_enable:
            description: "Temperature-enable read."
            value: [0x0B, 0xB2]
            verification: "reported"
          set_head_ntc_threshold:
            description: "Head-NTC (temperature) threshold set. Payload layout not recovered — only the 0AB4 opcode is known."
            verification: "hypothesis"
          get_head_ntc_threshold:
            description: "Head-NTC threshold read."
            value: [0x0B, 0xB4]
            verification: "reported"
          set_body_ntc_threshold:
            description: "Body-NTC threshold set. Payload layout not recovered — only the 0AB5 opcode is known."
            verification: "hypothesis"
          get_body_ntc_threshold:
            description: "Body-NTC threshold read."
            value: [0x0B, 0xB5]
            verification: "reported"
          set_flash_voltage_table:
            description: "Flash voltage table set. Payload layout not recovered — only the 0AD1 opcode is known."
            verification: "hypothesis"
          get_flash_voltage_table:
            description: "Flash voltage table read."
            value: [0x0B, 0xD1]
            verification: "reported"

      - uuid: "00000a01-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A01 (role unverified)"
        properties: ["read", "write"]
        verification: "confirmed"
        notes: "Separate from the 0A01 intensity opcode on FFF1. Present in live GATT but not used in the capture."
      - uuid: "00000a02-0000-1000-8000-00805f9b34fb"
        name: "Serial number"
        properties: ["read", "write"]
        verification: "confirmed"
        notes: "The stock app read a 14-byte ASCII serial here. No write was attempted; the unit-specific value is deliberately not retained in this spec."
      - uuid: "00000a03-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A03 (role unverified)"
        properties: ["read"]
        verification: "confirmed"
      - uuid: "00000a10-0000-1000-8000-00805f9b34fb"
        name: "Security access"
        properties: ["read", "write"]
        verification: "confirmed"
        notes: >
          Session handshake, written once after service discovery; the stock
          app retries the write up to 3 times. The live write matched the
          MAC-derived construction exactly. GATT also declares read access,
          which the earlier app-only map omitted.
        commands:
          security_access:
            description: >
              Handshake: 01 A1 followed by the last three bytes of the
              device's own BLE MAC (printed order m0..m5; send m3 m4 m5).
            template: [0x01, 0xA1, "{mac3}", "{mac4}", "{mac5}"]
            verification: "confirmed"
            parameters:
              mac3:
                type: "uint8"
                min: 0
                max: 255
                description: "Byte 3 of the device BLE MAC (4th printed octet)."
              mac4:
                type: "uint8"
                min: 0
                max: 255
                description: "Byte 4 of the device BLE MAC."
              mac5:
                type: "uint8"
                min: 0
                max: 255
                description: "Byte 5 of the device BLE MAC (last octet)."
      - uuid: "00000a50-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A50 (role unverified)"
        properties: ["read", "write_without_response", "notify"]
        verification: "confirmed"
      - uuid: "00000af0-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0AF0 (role unverified)"
        properties: ["read", "notify"]
        verification: "confirmed"
      - uuid: "00000a04-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A04 (role unverified)"
        properties: ["read", "write"]
        verification: "confirmed"
      - uuid: "00000a44-0000-1000-8000-00805f9b34fb"
        name: "Sensor notifications 0A44"
        properties: ["read", "notify"]
        verification: "confirmed"
        notes: "Frequent one-byte notifications were captured; their physical meaning is not decoded."
      - uuid: "00000a06-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A06 (role unverified)"
        properties: ["read", "write"]
        verification: "confirmed"
      - uuid: "00000a08-0000-1000-8000-00805f9b34fb"
        name: "Notifications 0A08 (role unverified)"
        properties: ["read", "notify"]
        verification: "confirmed"
        notes: >
          Live properties are read + notify, not the OTA-trigger write
          inferred from app constants. No OTA operation was captured. Do not
          write this characteristic as an update trigger on this firmware.
      - uuid: "00000a18-0000-1000-8000-00805f9b34fb"
        name: "Body NTC notifications"
        properties: ["read", "write"]
        verification: "confirmed"
