# FOREO Peach 2 (IPL hair removal) — Device Spec (BLE, fully local)
# Reverse-engineered from FOREO For You 4.4.1 (versionCode 559) and a
# 2026-11-07 stock-app Android HCI capture, then replayed on 2026-11-14 by an
# independent BlueZ/bleak client against the same model (PEACH2 F.REV.K).
# Facts confirmed by the capture or the replay are marked `confirmed`;
# app-derived locked-unit activation and OTA remain `reported` or `hypothesis`.
#
# Headline findings:
#   1. The device ships LOCKED and static analysis derives its activation bytes
#      from its own BLE MAC, without server input. Every unit examined was
#      already active, so the locked-unit write remains unverified.
#   2. Pro mode is gated only in the app, by subscription state. On 2026-11-14
#      the firmware accepted a direct 0AD0 06 write from the replacement
#      client, read back 06, and kept it across reconnects: there is no
#      firmware-side entitlement check on this firmware.
#   3. FFF1 opcode 0A01/0B01 is the T-Sonic vibration-motor level, not IPL
#      output. IPL intensity is chosen on the handset's +/- buttons only.

device:
  name: "FOREO Peach 2 IPL hair removal"
  manufacturer: "FOREO AB"
  manufacturer_status: "active"
  testing:
    status: verified
    detail: minimally-verified
    notes: >
      2026-11-14: an independent BlueZ + bleak client written from this spec
      alone drove an already-activated PEACH2 (SW revision PEACH2 F.REV.K)
      over seven connections. Driven and behaving as written: exact-name
      discovery, unbonded connect, a live GATT table matching `services`
      characteristic-for-characteristic (properties included), the 0A10
      security-access write, DIS reads and dialect selection, the 0A20 read
      (01 = active, so no activation write), absence of 0A30, the 0A02
      serial read, FFF1 queries 0B01 / 0BD0 / 0BC4 0007, write-backs of
      0A01 and 0AD0 01 with 01-prefixed acknowledgements, a 0AD0 06 Pro
      write that read back 06 and persisted across reconnects, and 0A44
      notifications, plus read-only 0BB2 / 0BB4 / 0BB5 / 0BD1 table
      queries and a T-Sonic write from 5 to 2. Not driven: the locked-unit
      activation write (no locked unit), 0A30 wake-up, cooling writes, any
      write to the 0AB*/0AD1 safety tables (deliberately), old-dialect and
      Duo paths, and OTA. Earlier evidence:
      the 2026-11-07 stock-app HCI capture of the same model.
  protocol: "ble"
  transport: "ble-gatt"
  category: "personal_care"
  type: "ipl-hair-removal"
  notes: >
    Mains-powered IPL (intense pulsed light) hair-removal device with BLE,
    Telink-based chipset, companion app FOREO For You. One spec covers the
    Peach 2 family — Peach 2, Peach 2 go, Peach 2 Pro MAX, Peach 2 Duo —
    which share one code path in the app and differ in command dialect (see
    `protocol_details.dialect_selection`) and in which UI modes the app
    exposes. Optical output up to 7.3 J/cm² with firmware skin-contact and
    eye-safety interlocks. IPL intensity is selected only on the handset's
    +/- buttons, per the vendor manuals; no BLE command sets it in the
    flows traced. What BLE does set is the removal mode (Basic, or Pro with
    its extra boost intensities), cooling, and on models that have one the
    T-Sonic vibration-motor level (FFF1 0A01, 0–5).

    The device ships LOCKED: per the vendor manual it will not turn on until
    "registered" from the app. Static analysis derives the 0A20 activation
    payload entirely from the device's own BLE MAC (see
    `protocol_details.activation`), with no server input. That makes offline
    activation implementable in principle, but the locked-unit write was not
    observed: every unit examined was already active. PEACH2/GO/Pro Max
    also skip the stock app's pre-connect device-info lookup; account
    registration remains a separate later step.

    Custom 16-bit UUIDs on the standard Bluetooth base
    (0000xxxx-0000-1000-8000-00805f9b34fb). No pairing/bonding at any point
    (the app never bonds), no MTU negotiation on the Peach connect path —
    20-byte writes suffice. No command framing: writes are raw
    opcode || payload, answers are read back from the command characteristic.

  variants:
    - model: "Peach 2"
      identification:
        local_names: ["PEACH2"]
    - model: "Peach 2 go"
      identification:
        local_names: ["PEACH2GO"]
    - model: "Peach 2 Pro MAX"
      identification:
        local_names: ["PEACH2ProMAX"]
    - model: "Peach 2 Duo"
      identification:
        local_names: ["PEACH2Duo"]

  safety_advisory:
    severity: "danger"
    summary: >
      IPL fires intense light pulses — improper use can cause permanent skin
      burns, blistering, scarring, or eye injury.
    detail: >
      This is an IPL (intense pulsed light) hair-removal handset with an optical
      output up to 7.3 J/cm². Used wrongly it can cause permanent harm: burns,
      blistering, discoloration or scarring of the skin, and serious eye injury
      from looking into a flash. Always follow FOREO's own instructions —
      patch-test first, match the intensity level to your skin tone (darker skin
      needs a lower level), never treat broken, tanned, tattooed or moled skin,
      and keep it away from the eyes. This app only sets intensity and mode over
      Bluetooth; the flash itself is triggered on the device against its
      skin-contact interlock. This app is EXPERIMENTAL and is not affiliated
      with, endorsed by, or supported by FOREO — the manufacturer's manual and
      safety guidance govern.
    acknowledge_required: true
    advisory_url: "https://www.foreo.com/mysa/find-out-if-peach-2-is-suitable-for-you"
    advisory_archive_url: "https://web.archive.org/web/20260831005900/https://www.foreo.com/mysa/find-out-if-peach-2-is-suitable-for-you"
  identification:
    local_names:
      - "PEACH2"
      - "PEACH 2"
      - "PEACH™ 2"
      - "PEACH2GO"
      - "PEACH2ProMAX"
      - "PEACH2 Pro MAX"
      - "PEACH2Duo"
    notes: >
      App 4.4.1 and the 4.2.0 comparison build configure exact model-specific
      names: PEACH2, PEACH2GO, PEACH2Duo and PEACH2ProMAX. The spaced and
      trademark forms are retained as previously reported aliases, not as a
      reason to match every PEACH-prefixed device.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "exact"
            values:
              - "PEACH2"
              - "PEACH 2"
              - "PEACH™ 2"
              - "PEACH2GO"
              - "PEACH2ProMAX"
              - "PEACH2 Pro MAX"
              - "PEACH2Duo"
        notes: >
          The stock app disables fuzzy name matching and scans for the selected
          model's configured name for 30 seconds. Its scan handler also derives
          activation state from the raw advertisement. The active unit
          advertised manufacturer-specific data under company ID 0xFFFF whose
          payload is FF FF, the device's own 6-byte BLE MAC in printed order,
          then FF 01 (see `protocol_details.scan_to_add.activation_advertisement`).
          It carried no service UUIDs or service data.
    identity:
      stable_keys: ["address"]
      display: "local_name"
      notes: >
        The security-access and activation writes both take bytes of the
        device's own BLE MAC, so the address is load-bearing for this
        protocol, not just an identity key. The advertisement carries the
        same MAC in its manufacturer data, which is the address-derived
        marker the stock app keys its activation-state check on. The value
        a locked unit advertises remains unknown — see `remaining_unknowns`.
    static_ip_required: false

  setup:
    required: false
    confidence: medium
    notes: >
      Nothing to provision — no network, no account. The one gate is the
      ship-lock: a factory-fresh Peach 2 refuses to operate until a client
      performs the BLE activation below. Static analysis shows the activation
      payload derives only from the device's own BLE MAC, so the offline route
      is primary. The 2026-11-07 capture and the 2026-11-14 replacement-client
      replay confirm discovery, security access, the SW-revision and 0A20
      reads on an already-active unit; neither verifies the locked-unit
      write. PEACH2/GO/Pro Max skip the stock app's
      pre-connect device-information API lookup, but account registration is a
      separate later step whose complete server behavior is not mapped here.
    methods:
      - type: "ble_direct"
        name: "Offline BLE activation (no account, no network)"
        role: primary
        verified: false
        description: >
          Scan for the selected model's exact advertised name, connect without
          bonding, write the security-access handshake, then read 0A20 and,
          only if its first byte is 00, write 01 02 <8-byte chipId> as
          documented under `protocol_details.activation`. Read 0A30 and enable
          wake-up only on firmware that exposes that characteristic; the
          captured new-dialect unit did not expose it.
        ble:
          advertised_name: "PEACH2 / PEACH 2 / PEACH2GO / PEACH2Duo / PEACH2ProMAX"
          advertised_name_match: "exact"
          pairing_required: false
        steps:
          - action: "Plug in and scan for the selected model's exact configured name (PEACH2, PEACH2GO, PEACH2Duo or PEACH2ProMAX; the spaced/trademark aliases are retained in discovery). The stock app scans for 30 seconds."
            actor: "client"
            expect: "Advertisement with the exact model name and manufacturer data (company ID 0xFFFF) carrying the device MAC and an activation-state byte (01 on an active unit). Do not treat every PEACH-prefixed device as this model."
          - action: "Connect (no bonding) and discover services. FFF0 contains FFF1, 0A10 and 0A20 on the captured firmware. The first connection attempt often drops during service discovery (4 of 7 replay sessions under BlueZ); retry the connect."
            actor: "client"
            expect: "Connected with services resolved, usually by the second attempt."
          - action: "Write security access: 01 A1 <MAC[3]> <MAC[4]> <MAC[5]> to characteristic 0A10 (last three bytes of the device's own BLE MAC)."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "security_access"
            expect: "Write Response received; the stock app retries up to 3 times, waits 500 ms, and validates no challenge response before continuing. A 0A10 read afterwards returned 01 00 00 00 00 in the replay. On the active F.REV.K unit, FFF1 queries and writes also succeeded without this handshake, but send it anyway: whether a locked unit or other firmware enforces it is unknown."
          - action: "Read SW revision (2A28) — the device is ready; the value also selects the command dialect."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "read_sw_revision"
          - action: "Read 0A20; if the value starts with byte 00, write 01 02 <chipId(MAC)> (see protocol_details.activation). If it already starts with 01, do not rewrite it."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "activate"
            expect: "Device unlocked; the already-active unit returned 01 (a 17-byte value whose remaining bytes are not decoded) in both the capture and the replay, and required no activation write."
          - action: "If 0A30 exists, read it and, unless the value starts with 01, write 01 (wake-up enabled). Skip this step when 0A30 is absent, as on the captured new-dialect unit."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "set_wakeup"
      - type: "cloud_account"
        name: "Stock FOREO For You app registration"
        role: alternative
        verified: false
        description: >
          The vendor flow: sign into a FOREO account in the app, which POSTs
          a product registration to the vendor cloud and then performs exactly
          the BLE activation above. The server call is warranty bookkeeping —
          none of its response feeds the unlock bytes — so this route adds an
          account and a network dependency without adding anything the
          firmware requires. Kept as documentation of what the stock app does,
          and the only route that records the unit under the owner's warranty
          account.
        cloud:
          provider: "FOREO (FOREO For You account)"
          local_alternative: >
            The primary method above: the activation write is computable
            offline from the device's BLE MAC, so the cloud registration is
            optional end to end.
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established. No factory-reset procedure was found in the app or in
        the manual text examined, and none occurred in the capture. What a
        reset would clear is unknown. Activation state (0A20) and wake-up
        (0A30, on firmware that exposes it) are the persisted setup state
        identified by static analysis; ordinary runtime-setting persistence
        was not established.
      description: >
        Nobody has established a reset procedure for the Peach 2. Static
        analysis describes activation as idempotent, so a second-hand unit
        should not need a reset for normal ownership. The locked-unit write
        remains unverified. Do not guess a procedure on an IPL device — the
        skin-contact and eye-safety interlocks make improvised button
        sequences a poor idea. Listed as `unknown` rather than `false`
        because nothing proves one does not exist.
    rejoin:
      requires_factory_reset: false
      in_place_supported: true
      notes: >
        There is no network to rejoin and no bond to move: a new phone just
        scans, connects and writes the security-access handshake. Only a unit
        whose 0A20 value is still locked needs the activation write.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Activation state derived from the device BLE MAC (0A20; the locked-unit write is app-derived)"
        - "Wake-up enable flag (0A30, only on firmware that exposes it; absent from the captured unit)"
      issued_to_client:
        - "Nothing. No keys, tokens or bonds are issued in either setup route; the cloud route's account session lives entirely in the phone app."

  pairing:
    required: false
    confidence: "high"
    security_mode: "app_layer"
    bonding: "none"
    exclusivity:
      single_connection: "unknown"
      single_bond: "unknown"
      recovery: >
        No bond exists to clear. If a connection stalls, close the vendor app
        and reconnect, then repeat the security-access write. Under BlueZ the
        first connect attempt frequently dropped during service discovery
        ("device disconnected"); an immediate retry succeeded every time.
        General single-central behavior remains unknown.
      notes: >
        No SMP exchange or bonding occurred in either captured connection or
        in any of the seven replay connections (BlueZ reported Paired: no,
        Bonded: no). This does not establish how many centrals the peripheral
        accepts at once.
    enter_pairing_mode:
      required: false
      notes: >
        The activated captured unit advertised as PEACH2 and accepted bare
        connections. Whether a factory-locked unit advertises identically is
        still unverified.
    unpair:
      supported: false
      requires_factory_reset: false
      notes: >
        Nothing to unpair: no bond was created in the capture, so moving to a
        new client needs no reset or forget-device step.
    notes: >
      No link-layer pairing occurred in either captured connection. What looks
      like security lives entirely above the link layer: the per-connection
      security-access write to 0A10 and, only on a locked unit, the activation
      write to 0A20. Both derive from the device's own BLE MAC. The first is
      capture- and replay-confirmed, though the active F.REV.K unit did not
      enforce it; the second remains app-derived because every unit examined
      was already active.

  # The cloud block records the phone-app services for completeness. The
  # device itself has no radio but BLE and never talks to any of this; the
  # stock app's server round-trips are bookkeeping the firmware ignores.
cloud:
  required: false
  vendor_service: "FOREO For You cloud (account, product-registration bookkeeping, subscription entitlement)"
  hosts:
    - "https://apiadmin.foreo.com"
    - "https://appadmin.foreo.com"
    - "https://www.foreo.com/api/… (web API surface)"
  auth:
    type: "other"
    notes: >
      Account login in the app; session expiry forces re-login. Device
      registration is an account-scoped POST under
      users/{uuid}/product_registration. Not mapped further — none of it is
      on the local-control path.
    verification: "reported"
  failure_mode: >
    The captured BLE settings operations require no cloud round trip, so an
    already-active unit retains its documented local controls when the vendor
    cloud is unavailable, Pro mode included (replay-confirmed 2026-11-14).
    Static analysis makes locked-unit activation locally constructible as
    well, but it was not directly verified. The
    cloud records product registration and supplies the entitlement state the
    stock app uses to gate Pro; complete registration-server behavior after
    the PEACH2 pre-connect API exception is not mapped.
  data_leaves_device:
    - "Product registration record (device model/serial attached to the owner's account) — sent by the phone app, only on the stock registration route"
    - "Subscription entitlement state (server-side, via an external billing provider) — fetched and enforced by the app only; the F.REV.K firmware accepted Pro without it"
    - "Account identity and profile data (app-side)"
  notes: >
    Monetization is a server-side subscription bought via an in-app web flow;
    the app has no in-app-purchase store integration. The subscription gates
    the app's Pro UI. Static analysis says an inactive subscription causes a
    Basic-mode write when the device reports Pro, and a separate testing flag
    bypasses that UI branch. The firmware itself does not check entitlement:
    a direct Pro write from a replacement client was accepted and persisted
    (2026-11-14). The downgrade path was not exercised. See
    `protocol_details.paywall`.

local_access:
  status: "native"
  summary: >
    Ordinary controls, Pro mode included, are fully local over BLE and were
    driven by a replacement client on 2026-11-14. Offline locked-unit
    activation is implementable from static analysis but not
    hardware-confirmed; do not treat it as a verified capability.
  covers:
    - "Offline activation (unlock) of a factory-fresh unit — chipId derived from the device's BLE MAC, written to 0A20 (app-derived; every unit examined was already active)"
    - "Removal mode Basic/Pro set/read (0AD0/0BD0 on new firmware; 0AA2/0BA2 flash-mode bytes on old firmware) — Basic and Pro replay-confirmed with no subscription; old-firmware bytes app-derived"
    - "T-Sonic vibration-motor level set/read, 0–5 (0A01/0B01; the stock app shows it only when the model's settings config does not disable the motor)"
    - "Cooling/fan profile set/read (0AC4 seven-byte profile / 0BC4 0007; per-level profiles in protocol_details.cooling_profiles; 0AC0 0A automatic fan also captured)"
    - "Serial number (0A02 on the captured firmware) and SW revision (2A28); 0A07 and 2A19 were not present"
    - "Skin-sensor/accelerometer calibration polling (0A0C; one-byte read values captured, semantics unpinned)"
    - "Temperature-enable and head/body NTC threshold opcodes (0AB2/0AB4/0AB5 families; payload layouts unpinned — see remaining_unknowns)"
  not_covered:
    - "OTA firmware update — no safe entry or transfer is known. The captured 0A08 is read + notify, not a verified trigger write, and TI OAD was absent from normal-mode discovery"
    - "Firing flashes from the app is not a BLE operation on this device family in the flows traced — flashing is hardware-triggered against the skin-contact interlock"
    - "Selecting the IPL intensity level — done on the handset's +/- buttons per the vendor manuals; no BLE command for it was found in the flows traced"

services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "FOREO Peach Command and Security Service"
    verification: "confirmed"
    notes: >
      Live service discovery on 2026-11-07 confirmed this containing service
      and every characteristic below; the 2026-11-14 replay found the same
      table with identical properties. The earlier stand-in 0A20 service was
      wrong. All command traffic is raw `opcode || payload` with no header,
      length or checksum; queries are written and then answered by READING
      FFF1 back. A read-back of all FF bytes means the device was busy — the
      app retries up to 5 times, and in the replay roughly one write in five
      returned busy and succeeded on the next try. Every accepted settings
      write was followed by an 18-byte read-back whose first byte was 01.
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: "Command channel"
        properties: ["write", "read"]
        verification: "confirmed"
        notes: >
          All Peach commands are written here and all answers read back from
          the same characteristic. First byte 0A = write/set, 0B = read/query;
          second byte = sub-opcode. Dialect selection is in
          `protocol_details.dialect_selection`.
        commands:
          set_tsonic_level:
            description: >
              Set the T-Sonic vibration-motor level, 0–5. This is the
              handset's massage motor, not IPL output: the app's own name for
              the opcode is "motor level", and the settings screen shows it
              under a T-Sonic heading. Earlier revisions of this spec called
              it IPL intensity, which was wrong.
            template: [0x0A, 0x01, "{level}"]
            verification: "confirmed"
            parameters:
              level:
                type: "uint8"
                min: 0
                max: 5
          get_tsonic_level:
            description: "Read the T-Sonic motor level; the level is the first byte of the FFF1 read-back (05 in both the capture and the replay)."
            value: [0x0B, 0x01]
            verification: "confirmed"
          set_removal_mode_basic:
            description: "New-firmware removal mode: Basic."
            value: [0x0A, 0xD0, 0x01]
            verification: "confirmed"
          set_removal_mode_pro:
            description: >
              New-firmware removal mode: Pro, which the app describes as five
              extra boost intensities for experienced users and recommends
              for non-sensitive body areas. The stock app permits this write
              only with an active eligible subscription or its testing flag,
              but the firmware does not check: on 2026-11-14 a replacement
              client with no account wrote it to a PEACH2 F.REV.K, got the
              usual 01 acknowledgement, read back 06, and still read 06 after
              reconnecting. The stock app writes Basic back on its next
              connect if it considers the subscription inactive.
            value: [0x0A, 0xD0, 0x06]
            verification: "confirmed"
            advanced: true
            advanced_reason: "Switches an IPL device to its higher-output Pro removal mode, which unlocks boost intensities above the Basic range on the handset. Pro is for non-sensitive body areas and experienced users; read the mode back with get_removal_mode, patch-test, and match the handset intensity to your skin tone per the vendor manual."
          get_removal_mode:
            description: "Read removal mode; a read-back value >= 6 means Pro. Basic returned 01 in the capture and the replay; Pro returned 06 in the replay."
            value: [0x0B, 0xD0]
            verification: "confirmed"
          set_flash_mode:
            description: >
              OLD-firmware flash mode and the separate Duo mode-command path;
              the mode byte is repeated five times (Basic = 02 x5,
              Pro = 03 x5, Face = 01 x5). Other new-firmware models use
              set_removal_mode_* instead — see
              `protocol_details.dialect_selection`. Duo Pro was not captured.
            template: [0x0A, 0xA2, "{mode}", "{mode}", "{mode}", "{mode}", "{mode}"]
            verification: "reported"
            advanced: true
            advanced_reason: "Changes the flash mode of an IPL device (Face, Basic or Pro) on the old-firmware and Duo paths only, none of which were captured. Sent to the wrong dialect it is an unverified write; check protocol_details.dialect_selection and read the mode back with get_flash_mode."
            parameters:
              mode:
                type: "uint8"
                min: 1
                max: 3
                labels: ["Face", "Basic", "Pro"]
          get_flash_mode:
            description: "Read flash mode (old firmware)."
            value: [0x0B, 0xA2]
            verification: "reported"
          set_cooling:
            description: >
              New-firmware cooling profile write: 0AC4 followed by exactly
              seven bytes. The stock app does not compose these bytes: it
              picks one of six fixed per-level profiles from its bundled
              model config, keyed by SW revision (see
              `protocol_details.cooling_profiles`). On F.REV.I–K the first
              byte is the cooling level as a percentage (14/28/3C/50/64 hex =
              20–100 % for levels 1–5) and 22 1B… is level 0. The other
              fields are fixed per firmware family and not decoded.
            template: [0x0A, 0xC4, "{profile}"]
            verification: "confirmed"
            advanced: true
            advanced_reason: "Cooling protects the skin during flashing. Send only one of the stock per-level profiles for the unit's SW revision (protocol_details.cooling_profiles); do not substitute arbitrary bytes on an IPL device."
            parameters:
              profile:
                type: "bytes"
                min_length: 7
                max_length: 8
                description: >
                  The cooling row for the unit's SW revision from
                  protocol_details.cooling_profiles: seven bytes on F.REV.D–K
                  and PEACH2GO F.REV.B–C (capture-confirmed on F.REV.K), eight
                  bytes on PEACH2 F.REV.L, PEACH2GO F.REV.D and Pro MAX
                  F.REV.A–B, where the eighth byte carries the level (app
                  config only; those firmwares were not examined, and how
                  get_cooling_new reports the eighth byte is unknown).
                  Read-back carries the profile followed by zeroes.
          set_auto_fan:
            description: "Enable automatic fan control (0AC0 0A). Accepted on the captured new-dialect unit as well as documented for the old dialect."
            value: [0x0A, 0xC0, 0x0A]
            verification: "confirmed"
          set_cooling_old:
            description: "OLD-firmware single-byte cooling write (0AC0); use set_auto_fan for the documented automatic mode."
            template: [0x0A, 0xC0, "{value}"]
            verification: "reported"
            advanced: true
            advanced_reason: "Writes an arbitrary cooling byte to an IPL device's old-firmware cooling path; the value meanings are not decoded beyond set_auto_fan's 0A. Cooling protects the skin during flashing, so prefer set_auto_fan."
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          get_cooling:
            description: "Read cooling level on OLD firmware (0BC0)."
            value: [0x0B, 0xC0]
            verification: "reported"
          get_cooling_new:
            description: "Read the new-firmware cooling profile (0BC4 0007). The first seven bytes are the profile accepted by set_cooling; the observed read-back was 18 bytes. The replay read 64 0D 21 02 1C 14 14, the F.REV.K level-5 profile."
            value: [0x0B, 0xC4, 0x00, 0x07]
            verification: "confirmed"
          set_temperature_enable:
            description: >
              Temperature-enable set: 0AB2 followed by one byte. The stock
              app reads 0BB2 on connect and, if the value differs from its
              model config, writes the config value back. Deliberately given
              no executable template here.
            verification: "reported"
            advanced: true
            advanced_reason: "Changes the handset's temperature-protection setting, a safety parameter the vendor pushes from its model config. Never write a value other than the one the unit already reports."
          get_temperature_enable:
            description: "Temperature-enable read; the first byte of the read-back is the setting. The replay read 02 on F.REV.K, matching the app's model config."
            value: [0x0B, 0xB2]
            verification: "confirmed"
          set_head_ntc_threshold:
            description: >
              Head-NTC (temperature) threshold set: 0AB4 followed by the
              threshold list, one byte per entry, as the app's config holds
              it. The app rewrites it on connect when 0BB4 differs. No
              executable template, deliberately.
            verification: "reported"
            advanced: true
            advanced_reason: "Moves a thermal cut-out threshold on an IPL handset; a wrong value can let the treatment head overheat against skin. Do not write it."
          get_head_ntc_threshold:
            description: "Head-NTC threshold read; the leading non-zero bytes are the threshold list. The replay read 37 32 (55, 50), matching the app's model config; units not established."
            value: [0x0B, 0xB4]
            verification: "confirmed"
          set_body_ntc_threshold:
            description: >
              Body-NTC threshold set: 0AB5 followed by the threshold list,
              one byte per entry. Same check-and-rewrite pattern as the head
              threshold. No executable template, deliberately.
            verification: "reported"
            advanced: true
            advanced_reason: "Moves a thermal cut-out threshold on an IPL handset. Do not write it."
          get_body_ntc_threshold:
            description: "Body-NTC threshold read; the leading non-zero bytes are the threshold list. The replay read 50 46 (80, 70), matching the app's model config; units not established."
            value: [0x0B, 0xB5]
            verification: "confirmed"
          set_flash_voltage_table:
            description: >
              Flash voltage table set: 0AD1 followed by the per-level table,
              one byte per entry. The stock app reads 0BD1 on connect and
              rewrites the table from its server-delivered model config when
              the read-back does not start with it. This is FOREO's energy
              calibration, not a user setting, and it is the only per-level
              energy control found: there is no BLE command for the handset
              level itself. No executable template, deliberately. The
              five-entry table in the app's bundled offline config is stale
              (that entry is marked deleted, and the live unit holds ten
              entries), so never "restore" it.
            verification: "reported"
            advanced: true
            advanced_reason: "Directly sets flash energy per intensity level on an IPL device. Raising it can exceed the output the skin-tone and eye-safety design assumes and cause burns or eye injury. Read only; never write."
          get_flash_voltage_table:
            description: >
              Flash voltage table read. In Pro mode on F.REV.K the replay read
              ten entries, 06 0A 0F 15 19 18 1B 1D 20 23, then zeros. Units
              are not established. The handset still offers five levels in Pro
              (owner observation), so the likely reading is that levels 1–5
              use entries 1–5 in Basic and entries 6–10 (the app's "5 extra
              boost intensities") in Pro. That mapping is a hypothesis; see
              remaining_unknowns.
            value: [0x0B, 0xD1]
            verification: "confirmed"

      - uuid: "00000a01-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A01 (role unverified)"
        properties: ["read", "write"]
        verification: "confirmed"
        notes: "Separate from the 0A01 T-Sonic opcode on FFF1. Present in live GATT but not used in the capture or the replay."
      - uuid: "00000a02-0000-1000-8000-00805f9b34fb"
        name: "Serial number"
        properties: ["read", "write"]
        verification: "confirmed"
        notes: "The stock app read a 14-byte ASCII serial here. No write was attempted; the unit-specific value is deliberately not retained in this spec."
      - uuid: "00000a03-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A03 (role unverified)"
        properties: ["read"]
        verification: "confirmed"
      - uuid: "00000a10-0000-1000-8000-00805f9b34fb"
        name: "Security access"
        properties: ["read", "write"]
        verification: "confirmed"
        notes: >
          Session handshake, written once after service discovery; the stock
          app retries the write up to 3 times. The live write matched the
          MAC-derived construction exactly. GATT also declares read access,
          which the earlier app-only map omitted; the replay read
          01 00 00 00 00 after a successful write. Not enforced on the active
          F.REV.K unit: FFF1 queries, the 0A20 read and settings writes all
          succeeded on a connection that never wrote 0A10. Clients should
          still send it, since locked units and other firmware are untested.
        commands:
          security_access:
            description: >
              Handshake: 01 A1 followed by the last three bytes of the
              device's own BLE MAC (printed order m0..m5; send m3 m4 m5).
            template: [0x01, 0xA1, "{mac3}", "{mac4}", "{mac5}"]
            verification: "confirmed"
            parameters:
              mac3:
                type: "uint8"
                min: 0
                max: 255
                description: "Byte 3 of the device BLE MAC (4th printed octet)."
              mac4:
                type: "uint8"
                min: 0
                max: 255
                description: "Byte 4 of the device BLE MAC."
              mac5:
                type: "uint8"
                min: 0
                max: 255
                description: "Byte 5 of the device BLE MAC (last octet)."
      - uuid: "00000a50-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A50 (role unverified)"
        properties: ["read", "write_without_response", "notify"]
        verification: "confirmed"
      - uuid: "00000af0-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0AF0 (role unverified)"
        properties: ["read", "notify"]
        verification: "confirmed"
      - uuid: "00000a04-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A04 (role unverified)"
        properties: ["read", "write"]
        verification: "confirmed"
      - uuid: "00000a44-0000-1000-8000-00805f9b34fb"
        name: "Sensor notifications 0A44"
        properties: ["read", "notify"]
        verification: "confirmed"
        notes: "Frequent one-byte notifications were captured; their physical meaning is not decoded. The replay saw D0/D1 values, three in five seconds on an idle unit."
      - uuid: "00000a06-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A06 (role unverified)"
        properties: ["read", "write"]
        verification: "confirmed"
      - uuid: "00000a08-0000-1000-8000-00805f9b34fb"
        name: "Notifications 0A08 (role unverified)"
        properties: ["read", "notify"]
        verification: "confirmed"
        notes: >
          Live properties are read + notify, not the OTA-trigger write
          inferred from app constants. No OTA operation was captured. Do not
          write this characteristic as an update trigger on this firmware.
      - uuid: "00000a18-0000-1000-8000-00805f9b34fb"
        name: "Body NTC notifications"
        properties: ["read", "write"]
        verification: "confirmed"
        notes: "The app identifies this as body NTC. The capture contains 165 one-byte notifications even though the declaration omits the notify property; units and conversion are undecoded."
      - uuid: "00000a09-0000-1000-8000-00805f9b34fb"
        name: "Sensor notifications 0A09"
        properties: ["read", "notify"]
        verification: "confirmed"
        notes: "Thirteen one-byte notifications were captured; their semantics are undecoded."
      - uuid: "00000a19-0000-1000-8000-00805f9b34fb"
        name: "Head NTC notifications"
        properties: ["read", "write"]
        verification: "confirmed"
        notes: "The app identifies this as head NTC. The capture contains 110 one-byte notifications even though the declaration omits the notify property; units and conversion are undecoded."
      - uuid: "00000a0c-0000-1000-8000-00805f9b34fb"
        name: "Accelerometer polling"
        properties: ["read", "notify"]
        verification: "confirmed"
        notes: "The app names this accelerometer input and repeatedly read 180 one-byte values during calibration; axes, units and thresholds remain undecoded."
      - uuid: "00000a0d-0000-1000-8000-00805f9b34fb"
        name: "Vibrator setting notifications"
        properties: ["read", "notify"]
        verification: "confirmed"
        notes: "The app names this vibrator setting. Fifteen one-byte notifications were captured; the value vocabulary is undecoded."
      - uuid: "00000a20-0000-1000-8000-00805f9b34fb"
        name: "Activate (unlock/register)"
        properties: ["read", "write"]
        verification: "confirmed"
        notes: >
          Read first: static analysis says a first byte of 00 means locked.
          The captured unit returned 01 and therefore received no activation
          write; the replay read the same 01 as the first byte of a 17-byte
          value whose trailing bytes are unit-specific and not decoded (not
          reproduced here). The read succeeded with or without the 0A10
          handshake. The locked-unit write and its chipId derivation remain
          reported, not hardware-confirmed. (Other FOREO models use an older
          01 01 <ASCII serial> variant; Peach uses the chip-id variant.)
        commands:
          activate:
            description: >
              Unlock a locked unit: 01 02 followed by the 8-byte chipId
              derived from the device's BLE MAC (keyless permutation, fully
              offline — see `protocol_details.activation`).
            template: [0x01, 0x02, "{chip_id}"]
            verification: "reported"
            advanced: true
            advanced_reason: "Unlocks a locked IPL device in place of the vendor's own registration flow; the write was never captured (the captured unit was already active). Send it only after reading 0A20 and seeing a first byte of 00, never to an active unit."
            parameters:
              chip_id:
                type: "bytes"
                min_length: 8
                max_length: 8
                description: "8-byte chipId = keyless nibble permutation of the 6-byte BLE MAC; algorithm and test vectors in protocol_details.activation."
      - uuid: "00000a40-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A40 (role unverified)"
        properties: ["read", "write"]
        verification: "confirmed"

  - uuid: "0000181c-0000-1000-8000-00805f9b34fb"
    name: "FOREO 0x181C service"
    verification: "confirmed"
    notes: "Present beside FFF0 in the captured GATT table; no 0x180F Battery Service was present on this unit."
    characteristics:
      - uuid: "00000a05-0000-1000-8000-00805f9b34fb"
        name: "Direct characteristic 0A05 (role unverified)"
        properties: ["read", "write"]
        verification: "confirmed"
        notes: "The stock app did not read or write this characteristic. Do not confuse it with the serial number read from 0A02 on the captured firmware."

  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    name: "Device Information Service"
    verification: "confirmed"
    notes: "Standard DIS. SW revision (2A28) is read at every connect and selects the old/new command dialect (see protocol_details.dialect_selection). The captured unit reported PEACH2 F.REV.K and therefore used the new dialect."
    characteristics:
      - uuid: "00002a23-0000-1000-8000-00805f9b34fb"
        name: "System ID"
        properties: ["read"]
      - uuid: "00002a24-0000-1000-8000-00805f9b34fb"
        name: "Model Number String"
        properties: ["read"]
      - uuid: "00002a26-0000-1000-8000-00805f9b34fb"
        name: "Firmware Revision String"
        properties: ["read"]
      - uuid: "00002a27-0000-1000-8000-00805f9b34fb"
        name: "Hardware Revision String"
        properties: ["read"]
      - uuid: "00002a28-0000-1000-8000-00805f9b34fb"
        name: "Software Revision String"
        properties: ["read"]
      - uuid: "00002a29-0000-1000-8000-00805f9b34fb"
        name: "Manufacturer Name String"
        properties: ["read"]
      - uuid: "00002a2a-0000-1000-8000-00805f9b34fb"
        name: "IEEE Regulatory Certification"
