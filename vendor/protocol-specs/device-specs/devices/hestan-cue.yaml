                  1132265472, 1132331008, 1132396544, 1132462080, 1132494848, 1132527616, 1132560384, 1132593152
                ]
                labels: [
                  "37 °C", "38 °C", "39 °C", "40 °C", "41 °C", "42 °C", "43 °C", "44 °C", "45 °C", "46 °C", "47 °C", "48 °C",
                  "49 °C", "50 °C", "51 °C", "52 °C", "53 °C", "54 °C", "55 °C", "56 °C", "57 °C", "58 °C", "59 °C", "60 °C",
