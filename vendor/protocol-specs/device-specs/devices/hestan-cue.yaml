# Hestan Cue Smart Cooking System (induction burner + smart cookware) device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (clean-room; derived facts only, every table written in our own
# words, no vendor code, strings or identifiers of our own hardware):
#   - Static analysis of the vendor's Android app (Hestan Cue 1.5.x, retired
#     2025-07-21), obtained from a third-party mirror. Byte layouts were read
#     from the app's GATT parsers and writers. Two of them, the burner-mode
#     writer and the burner characteristic dispatcher, did not decompile
#     cleanly and were reconstructed from the instruction dump.
#   - The vendor's support portal (support.hestancue.com): sunset notices,
#     setup, Control Mode, power, firmware and troubleshooting articles.
#   - FCC ID 2AYY4-41701 (Hestan Cue Smart Probe) exhibits on fccid.co.
#   - The Bluetooth SIG company-identifier registry (0x03F1).
# No captures exist. Every protocol fact is `verification: reported`.

device:
  name: "Hestan Cue Smart Cooking System (induction burner + smart cookware)"
  manufacturer: "Hestan Smart Cooking"
  manufacturer_status: "abandoned"
  type: "induction-cooktop-and-smart-cookware"
  category: "appliance"
  protocol: "ble"
  transport: "ble-gatt"
  testing:
    status: untested
    notes: >-
      Nobody on this project has driven a Cue burner, pan, pot or probe from
      this document, and the research store holds no capture of one. Every
      byte layout below was read out of the vendor's Android app, so each
      protocol fact is `reported`, never `confirmed`.
  safety_advisory:
    severity: "warning"
    summary: >-
      This drives a 1600 W induction burner remotely. An empty pan left
      heating can reach several hundred degrees before the burner's own
      cut-out trips.
    detail: >-
      The vendor warns never to leave Cue cookware unattended, never to let
      it boil dry, and never to use Cue cookware or the Smart Probe in an
      oven, under a broiler or on a non-Cue cooktop. Its own figures are
      that Cue pans are safe empty to about 400 °F (204 °C) and should not
      exceed 450 °F (232 °C) with food in them. It also says an unattended
      stainless pan on a burner at full power can pass 750 °F (400 °C)
      before the burner overheats and shuts off. The app's Control Mode let
      users set up to 260 °C (500 °F), above that 450 °F guidance. The
      burner will not heat for an app until someone standing at it presses
      its power button and then its next button (the two-touch
      confirmation, see device.notes), and this spec declares nothing that
      skips that. Stay at the burner while it heats, keep to the vendor's
      temperature guidance, and send disable_heating when you are done.
      This spec is not affiliated with Hestan, and Hestan's own safety
      instructions govern how the hardware is used.
    advisory_url: "https://support.hestancue.com/en/support/solutions/articles/19000126757"
  notes: >
    Hestan Cue is a guided-cooking system: a portable induction burner, pans
    and pots with a Bluetooth "capsule" in the handle, a later clip-on Smart
    Probe, and a phone app. Every part is a separate BLE peripheral that the
    phone talks to directly. There is no hub. The vendor cloud held accounts,
    recipes and firmware images, but the control paths below are local. The
    vendor retired the app on 2025-07-21. Its support articles say the
    burner still works as a plain induction hob from its own touch controls,
    and that every "smart" function (temperature control, guided recipes)
    ended with the app.

    WHO CLOSES THE LOOP. The app does not compute burner power itself. It
    routes one piece of cookware to the burner (the burner's 00001542
    characteristic takes the cookware's 6-byte id, which is the cookware's
    BLE address least-significant byte first), then writes a mode record to
    00001543 carrying the target temperature in °C and six controller gains.
    The burner then takes readings from the routed cookware and holds the
    target itself. It relays each reading back to the app as an event on
    00001546. The app supervises: it keeps control, watches events and
    faults, and rewrites the target when a recipe step changes. Event codes
    about decrypting the cookware and rewriting its id with a new IV
    suggest that the cookware-to-burner link is encrypted. Nothing in the
    app carries key material for it, so a client only passes the id.

    THE TWO-TOUCH CONFIRMATION. The burner does not let an app heat until a
    person confirms at the burner. The app asks with opcode 0x08 on
    00001547. The burner then raises events asking for a press of its power
    button (0x6013) and then its next button (0x6014), and finally reports
    control granted (0x6015) or revoked (0x6016). Status byte 1 of 00001545
    tracks the same state, and the app writes no setpoint until it reads 3
    (app has control). The app's names for these events suggest the gate is
    a safety-listing requirement. The confirmation is what keeps a stray
    client from heating an empty pan, and this spec declares no command that
    skips it (see the advanced commands on 00001547).

    CLIENT RULES (from the app's burner supervisor):
      1. Know the burner's firmware version before any 00001547 command. The
         app refuses to send one until it has read 00001537 in the DFU
         service or seen a type-3 advertisement.
      2. Enable indications on 00001546 and notifications on 00001545, then
         read 00001545, 00001542 and 00001543. The app treats the burner as
         not ready until indications are on and both 00001543 and the
         control byte of 00001545 have been read.
      3. On the first pass after connecting, if 00001543 reports any mode
         other than 4 (disabled), send the idle-light-off opcode and write
         mode 4 (disable_heating) before anything else.
      4. Compare 00001542 with the cookware you mean to use. Write it only
         when it differs and the cookware is in range, then read it back.
      5. If the burner reports mode 0 (manual) while cooking, the user has
         taken over at the burner's own controls. The app stops driving it.
      6. Ask for control (opcode 0x08) only from mode 4. Wait for control
         byte 3, then write the setpoint and read 00001543 back to confirm
         it.
      7. Every write carries a 16-bit request id. The app draws them from one
         app-wide counter that runs 1 to 32767 and then wraps to 0.
      8. Stop with the idle-light-off opcode followed by mode 4 and timeout
         0. The app never writes mode 3 (off).
    The app re-runs this check every 250 ms while the burner is not ready and
    every 2.5 s once it is. It arms a 60 s timer when it starts connecting.

    READ-ONLY FIRST. The cookware and the probe broadcast their temperature
    in their advertisements (manufacturer data under the Hestan Smart
    Cooking company id 0x03F1), so a thermometer client needs no
    connection, no write and no burner. Start there. Driving the burner is
    the second step, and it needs someone standing at it.

    SCOPE. In scope: the Cue induction burner, and the cookware and probe
    that carry the handle service 0000fa81-8a11-4222-9610-53f79479ca03. The
    app's product table lists four burner builds (US, a 220 V build, a 220
    V build for a partner, and a 100 V build). All four share one status
    parser, but only the base US layout is evidenced by anything beyond that
    table. The app gives every thermometer device type the same thermometer
    class, the Smart Probe included, so the probe shares the handle service
    and parser (reported, from the app, not from a probe). Out of scope: the
    built-in and Wi-Fi cooktops of other brands that the same app drove (a
    different status layout, bonded BLE or Wi-Fi), the smart-oven stub the
    app references, every cloud API, and the firmware image transfer beyond
    naming the Nordic DFU stacks.

    FLOATS. Temperatures, gains and the power position are IEEE 754 binary32
    values, little-endian, on the wire. The schema has no float type yet. So
    a float that a command sends is declared as a uint32 parameter whose
    allowed values are the float's bit patterns, and a float that is only
    read is declared as a 4-byte `bytes` field whose notes say how to read
    it. Reinterpret those four bytes as a float and never scale the integer
    (see protocol_details.float_encoding).

  identification:
    manufacturer_data:
      company_id: 1009
      company_id_hex: "0x03F1"
      description: >-
        A real SIG assignment: 0x03F1 is registered to Hestan Smart Cooking
        Inc. The app accepts an advertisement's manufacturer data only under
        this id. The payload after the id is a 4-byte field, a frame counter,
        a frame type (1 first-generation cookware, 2 second-generation
        cookware or probe, 3 burner) and a type-specific body (see
        payload_formats.Advertisement_Cookware_V1, Advertisement_Cookware_V2
        and Advertisement_Burner). The app takes a burner that advertises
        without this block to be on older firmware, and it tolerates a
        missing block only for the burner builds and the first-generation
        pan and pot.
    service_uuids:
      - "00001530-0000-1000-8000-00805f9b34fb"
    notes: >-
      The app's scanner reads the incomplete 16-bit service list (AD type
      0x02) and recognises two values there: 0x1530, the 16-bit alias of the
      Nordic legacy DFU service base, and 0xfe59, Nordic's Secure DFU service.
      It logs anything else as an unknown DFU service. 0xfe59 is on many
      unrelated Nordic products, so it is not an identifier here. The
      advertised local name is 8 characters of standard base64 that decode
      to 6 bytes: the device's BLE address least-significant byte first,
      with the top two bits of the last byte replaced by a device type (00
      pan, 01 pot, 10 burner). OR-ing 0xC0 back into that byte gives the
      random static address. The app refuses a device whose name-derived
      address does not match its connection address (payload_formats.Local_Name).
      An 8-character base64 name is too weak to match on alone, so it is a
      check after scanning, not a matcher.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          manufacturer_data:
            company_id: 1009
            description: >-
              Hestan Smart Cooking's own id. Byte 5 of the payload (after the
              company id) is the frame type: 1 first-generation cookware,
              2 second-generation cookware or probe, 3 burner.
        notes: >-
          The usual path. Cookware and probe frames carry a live temperature,
          so the scan result alone is a thermometer reading.
      - type: "ble_scan"
        ble:
          service_uuids:
            - "00001530-0000-1000-8000-00805f9b34fb"
        notes: >-
          Fallback for burners on older firmware, and for first-generation
          pans and pots, which the app accepts without manufacturer data.
          Confirm the match by decoding the local name (payload_formats.Local_Name)
          and checking that the device type bits and the address agree.
    identity:
      stable_keys: ["address"]
      display: "address"
      notes: >-
        The address is a random static address, and the local name encodes
        it, so the two identify the same unit. The name is base64 and means
        nothing to a person, so show the decoded device type and address
        rather than the name. Whether a unit keeps its address across a
        battery change or a firmware update is not recorded.
    static_ip_required: false

  setup:
    required: false
    confidence: "low"
    notes: >-
      Nothing to provision for the BLE path: no Wi-Fi, no credential, no
      account and no bond. One caveat is no longer fixable. The vendor
      says a factory-fresh burner and cookware needed a firmware update from
      the app before they would cook "or even be turned on", and the
      firmware came from the retired cloud. The app ships no images. A unit
      that was never updated may therefore be stuck, and nobody has checked
      what its factory firmware answers over BLE. Confidence is low because
      the whole flow comes from the app and has never been replayed.
    methods:
      - type: "ble_direct"
        name: "Direct BLE, no account: read cookware, heat after two-touch at burner"
        role: "primary"
        verified: false
        description: >-
          Read the cookware or probe from its advertisements. To heat,
          connect to the burner, route the cookware to it, ask for control,
          have someone press the burner's power button and then its next
          button, and write a setpoint. No pairing at any stage.
        ble:
          service_uuid: "00001541-6209-4984-454e-f27d42fb55e3"
          write_characteristic: "00001543-6209-4984-454e-f27d42fb55e3"
          read_characteristic: "00001546-6209-4984-454e-f27d42fb55e3"
          pairing_required: false
        steps:
          - action: "Fit a fresh AAA cell in the pan or pot handle and screw the end cap fully home (a quarter-turn back switches the capsule off), or a CR2450 in the Smart Probe. Plug the burner into its own outlet."
            actor: user
          - action: "Scan for manufacturer data under company id 1009 (0x03F1). Frame type 1 or 2 is cookware or probe, and it carries the reading. Frame type 3 is the burner and carries its firmware version and product id."
            actor: client
            expect: "A live temperature from the cookware with no connection. See payload_formats.Advertisement_Cookware_V2."
          - action: "Place the cookware centred on the burner. Connect to the burner and run the burner service's initialization (firmware version, indications on 00001546-6209-4984-454e-f27d42fb55e3, notifications on 00001545-6209-4984-454e-f27d42fb55e3, reads of 00001545, 00001542 and 00001543)."
            actor: client
            timeout_seconds: 60
          - action: "If 00001543-6209-4984-454e-f27d42fb55e3 reports any mode but 4, send set_next_button_light (off) and disable_heating."
            actor: client
          - action: "Read 00001542-6209-4984-454e-f27d42fb55e3. If it does not hold the cookware's address (least-significant byte first), send route_cookware and read it back."
            actor: client
          - action: "Send ask_for_app_control (opcode 0x08 on 00001547-6209-4984-454e-f27d42fb55e3)."
            actor: client
            expect: "Event 0x6013 on 00001546: the burner wants its power button pressed."
          - action: "At the burner, press the power button, then the next button when asked."
            actor: user
            expect: "Event 0x6014 after the first press, then 0x6015 (control granted). Byte 1 of 00001545 reads 3."
          - action: "Send set_target_temperature (or set_power_position), then read 00001543-6209-4984-454e-f27d42fb55e3 back to confirm the mode and target."
            actor: client
          - action: "The burner heats and relays cookware readings as event 0x7005 on 00001546. It reports burner and power-stage telemetry as 0x7003 and 0x7002."
            actor: device
          - action: "To stop, send set_next_button_light (off) and then disable_heating (mode 4, timeout 0)."
            actor: client
        timing:
          supervisor_poll_not_ready_ms: 250
          supervisor_poll_ready_ms: 2500
          connect_give_up_s: 60
          gatt_operation_timeout_s: 8
          basis: "The app's burner supervisor and GATT queue. Each queued read, write or CCCD write times out after 8 s."
        troubleshooting:
          - symptom: "The burner ignores every command."
            causes:
              - "The client sent a 00001547 command before learning the firmware version. The vendor app never does (client rule 1); whether the burner itself requires it is not established. Read 00001537 first."
              - "The burner's firmware was never updated. The vendor says a new burner will not even power on until it is, and the update source is gone (setup.notes)."
          - symptom: "A setpoint is written but nothing heats."
            causes:
              - "Nobody completed the two-touch confirmation. Byte 1 of 00001545 is not 3."
              - "The burner was not in mode 4 when control was requested. The app always disables first."
              - "The cookware is not induction-compatible or not centred. Byte 6 of 00001545 reports whether cookware is present."
              - "The burner is in an overheat state. The vendor's fix is to let it cool, then unplug it and plug it back in."
          - symptom: "The burner switches itself off mid-cook."
            causes:
              - "The controls are capacitive. The vendor says a pan slid over them, or clothing near them, can press them. Turn the burner so the controls are to the side."
              - "An event whose code the app treats as stop-cooking arrived (protocol_details.event_codes), such as over-temperature or a failed handshake."
          - symptom: "A second phone cannot find the burner or the cookware."
            causes:
              - "Another phone still holds a connection. The vendor's advice is to turn Bluetooth off on other phones and tablets."
              - "On Android, location services are off. The vendor's own troubleshooting requires them for BLE scanning."
      - type: "cloud_account"
        name: "Vendor app registration and firmware update (retired 2025-07-21)"
        role: "historical"
        verified: false
        description: >-
          The vendor's flow: install the Hestan Cue app, sign in to a vendor
          account (AWS Cognito), add each device from the Profile screen,
          install the firmware the app downloaded, then cook guided recipes
          or use Control Mode. The app, account service, recipe feed and
          firmware metadata service are all retired, so this route cannot be
          completed. It is kept because every vendor article still describes
          it.
        cloud:
          provider: "Hestan Smart Cooking (retired)"
          local_alternative: "The ble_direct method above. It needs no account and no network."
        steps:
          - action: "Install the Hestan Cue app, sign in, and add the burner and cookware under Profile."
            actor: user
          - action: "Tap Update Firmware for each device and accept the pairing prompt if the phone shows one."
            actor: user
            notes: "For the burner builds and the first-generation pan, the app asks the phone to bond before the update, and it retries the bond every minute until one exists."
          - action: "Cook a guided recipe or use Control Mode."
            actor: user
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >-
        No factory reset is documented for the burner, the cookware or the
        probe. The only persistent client-visible state is the cookware id
        the burner last had routed to it (00001542), which the next client
        overwrites. Whether that id survives a power cycle is not recorded.
        Unplugging the burner clears an overheat lock-out, according to the
        vendor.
      description: >-
        Basis for "unknown": the vendor's support portal was searched for
        reset, pairing, firmware and power-button articles, and none
        describes a reset beyond unplugging the burner. The app sends no
        reset command. This is a finding from those sources, not a test.
      procedures:
        - name: "Power-cycle the burner"
          verified: false
          basis: "Vendor support articles on the overheating error and on a burner that does not turn on: unplug it, wait, plug it back in."
          power_state: "on"
          description: "Clears an overheat state. Nothing says it clears anything else."
          steps:
            - action: "Let the burner cool with its fan running, unplug it, wait a few moments and plug it back in."
              actor: user
        - name: "Switch the cookware capsule off and on"
          verified: false
          basis: "Vendor support article on turning Cue cookware off: a quarter-turn of the handle's end cap switches it off, and tightening it switches it back on."
          power_state: "on"
          steps:
            - action: "Turn the end cap on the handle back about a quarter-turn, then tighten it fully again."
              actor: user
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >-
        Nothing binds the burner or the cookware to a phone or an account on
        the BLE path. A new client connects, routes its cookware with
        route_cookware and asks for control again. A phone that bonded for a
        legacy firmware update should forget the device in its Bluetooth
        settings (device.pairing.unpair).
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >-
        No credential crosses the BLE path. Event codes and status codes
        mention a handshake, a key and cookware encryption between the burner
        and the cookware (protocol_details.event_codes), but no key reaches or
        leaves the app, so there is nothing a client can supply or has to
        protect.

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "optional"
    exclusivity:
      single_connection: "unknown"
      single_bond: "unknown"
      recovery: >-
        Close the vendor app if it is still installed and turn Bluetooth off
        on other phones and tablets, which the vendor says can hold an old
        connection. Then unplug the burner, or turn the cookware's end cap
        off and on, and scan again.
      notes: >-
        Whether the burner accepts two centrals at once is not recorded. The
        app holds one connection per device.
    enter_pairing_mode:
      required: false
      notes: >-
        Nothing to enter. The burner advertises whenever it is plugged in.
        The cookware advertises while its end cap is screwed fully home with
        a live battery, and the probe while its battery is fitted.
    unpair:
      supported: true
      requires_factory_reset: false
      clears: "The phone-side bond left by a legacy firmware update. The device keeps no bond that matters on the control path."
      procedures:
        - name: "Forget the device in the phone's Bluetooth settings"
          verified: false
          basis: "The app's firmware-update path, which bonds the burner builds and the first-generation pan before a legacy DFU, and the vendor's advice not to pair Cue devices from the OS settings."
          power_state: "on"
          steps:
            - action: "Open the phone's Bluetooth settings and forget the burner or pan."
              actor: user
    notes: >-
      The app's product table marks the Cue burner and all Cue cookware as
      unpaired Bluetooth devices. It connects, discovers services and talks
      with no bond, and the vendor's support articles tell owners not to pair
      Cue devices from the phone's settings. The one exception is firmware
      update. Before a legacy-DFU update of a burner build or a
      first-generation pan, the app asks the phone to bond, and the vendor's
      firmware article says to accept a pairing prompt if one appears. The
      pairing method used then is not recorded. Some Android phones only
      found Cue devices after an OS pair-then-unpair, which the vendor
      documents as a workaround rather than a requirement.

  host_compatibility:
    - stack: android
      status: compatible
      verification: reported
      basis: "The vendor's Android app, which this spec was read from, drove the burner and cookware with no bond."
      notes: >-
        The vendor's troubleshooting articles say location services must be
        on for scanning, and that some phones only saw Cue devices after a
        pair-then-unpair in the OS settings.
    - stack: corebluetooth
      status: compatible
      verification: reported
      basis: "The vendor shipped an iOS app (3.1.2 or later for the Smart Probe, per its support article) that drove the same hardware."
    - stack: bluez
      status: unknown
      verification: hypothesis
      basis: "No Linux client has been reported. Nothing in the GATT layout suggests a problem."

  variants:
    - model: "Cue burner (US)"
      notes: >-
        Product id 32 (0x0020) in the burner advertisement. Vendor model
        41000: 110-120 V, 60 Hz, up to 1600 W, ungrounded polarised plug. The
        only burner layout evidenced beyond the app's product table.
    - model: "Cue burner (220 V)"
      notes: >-
        Product id 47 (0x002f). The vendor lists models 41004 to 41009 for
        EU, UK, Oceania and Asia at 240 V, 50 Hz. The app parses its status
        with the same layout as the US build. Not otherwise evidenced.
    - model: "Cue burner (220 V, partner edition)"
      notes: >-
        Product id 48 (0x0030), a 220 V build whose setup the app files under
        Thermomix as partner. Same status parser. Not otherwise evidenced.
    - model: "Cue burner (100 V)"
      notes: >-
        Product id 96 (0x0060). Same status parser. Not otherwise evidenced.
    - model: "Cue cookware (first generation)"
      notes: >-
        The 11-inch fry pan (product id 0) and the 5.5 qt chef's pot (product
        id 1). AAA cell in the handle end cap. Frame type 1 advertisements,
        or no manufacturer data at all. The pan uses the Nordic legacy DFU
        stack.
    - model: "Cue cookware (second generation)"
      notes: >-
        The 11-inch fry pan (8), 5.5 qt chef's pot (9), 3.5 qt pot (10) and
        11-inch non-stick fry pan (18). The app's table also lists a
        partner-branded pan, pot and small pot (14, 16, 17) whose brand is not
        established from public sources. Frame type 2 advertisements carry
        the product id and firmware version.
    - model: "Hestan Cue Smart Probe"
      notes: >-
        Product id 13, FCC ID 2AYY4-41701 (granted 2021-04-14, model number
        417 in its manual), CR2450 cell, rated by the vendor for 1.7-204 °C.
        It needs a Cue burner to control heat. The app handles it with the
        same thermometer class as the pans, so it shares the handle service
        and frames (reported, from the app only). The app's table also lists
        a partner-branded probe (11).

services:
  - uuid: "00001541-6209-4984-454e-f27d42fb55e3"
    name: "Cue burner control"
    notes: >-
      Served by the burner only. Every write goes to this service. The five
      characteristics share the vendor base
      0000154x-6209-4984-454e-f27d42fb55e3. Each write starts with a 16-bit
      little-endian request id (client rule 7). The app queues one GATT
      operation at a time and waits for each write's completion callback
      before the next. Whether these characteristics also accept
      write-without-response is not recorded.
    initialization:
      - characteristic: "00001537-1212-efde-1523-785feabcd123"
        read: true
        notes: >-
          Firmware version (u16 LE) from the DFU service. The app sends no
          00001547 command until it has a version from here or from a type-3
          advertisement. The app reads it only when the DFU service is
          present.
      - characteristic: "00001535-1212-efde-1523-785feabcd123"
        read: true
        notes: "Device type and revision (two u16 LE)."
      - characteristic: "00001546-6209-4984-454e-f27d42fb55e3"
        subscribe: true
        notes: "Indications (CCCD 0x0002). Required: the app treats the burner as not ready without them."
      - characteristic: "00001545-6209-4984-454e-f27d42fb55e3"
        subscribe: true
        notes: "Notifications (CCCD 0x0001)."
      - characteristic: "00001545-6209-4984-454e-f27d42fb55e3"
        read: true
        notes: "Status, including the app-control byte the app waits for."
      - characteristic: "00001542-6209-4984-454e-f27d42fb55e3"
        read: true
        notes: "The cookware id currently routed to the burner."
      - characteristic: "00001543-6209-4984-454e-f27d42fb55e3"
        read: true
        notes: "Current mode record."
      - characteristic: "00001543-6209-4984-454e-f27d42fb55e3"
        description: >-
          If the mode just read is not 4 (disabled), send
          set_next_button_light with the off value, then disable_heating,
          before anything else. The app does this on the first pass after
          every connection.
    characteristics:
      - uuid: "00001542-6209-4984-454e-f27d42fb55e3"
        name: "cookware_route"
        properties: ["read", "write"]
        notes: >-
          Which cookware or probe the burner takes readings from. Written as
          a 20-byte record: request id, the cookware's 6-byte id, then 12 zero
          bytes. The id is the cookware's BLE address least-significant byte
          first, exactly as the address string reads right to left (address
          C1:23:45:67:89:AB gives ab 89 67 45 23 c1). The app reads this back
          after connecting and after every write, and rewrites it only when
          it differs from the cookware in use.
        commands:
          route_cookware:
            description: >-
              Route one pan, pot or probe to the burner. Example with
              request id 7 and the cookware at C1:23:45:67:89:AB: 07 00 ab 89
              67 45 23 c1 followed by 12 bytes of 00.
            template: ["{request_id}", "{cookware_id}", 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            fixed_length: 20
            verification: "reported"
            parameters:
              request_id:
                type: "uint16"
                endianness: "little"
                auto: "sequence"
                description: "App-wide request counter, 1 to 32767, then wraps to 0."
              cookware_id:
                type: "bytes"
                min_length: 6
                max_length: 6
                description: "The cookware's BLE address, least-significant byte first."
        format:
          - name: "request_id"
            offset: 0
            length: 2
            type: "uint16"
            endianness: "little"
          - name: "cookware_id"
            offset: 2
            length: 6
            type: "bytes"
            notes: "Address least-significant byte first. The remaining 12 bytes are unused."

      - uuid: "00001543-6209-4984-454e-f27d42fb55e3"
        name: "burner_mode"
        properties: ["read", "write"]
        notes: >-
          A 36-byte little-endian record, written and read back with one
          layout: request id (u16), mode (u8), target (float32), six
          controller gains (float32 each), a flag byte, and a timeout in
          seconds (u32). The target is °C in mode 1 and a power position as a
          fraction of full (0.0-1.0) in mode 2. It is zero otherwise, and so
          are the gains outside mode 1. The app always writes 1 in the flag
          byte, and its readback parser labels that byte as a thermocouple
          selector. The app re-reads this characteristic after every write.
          The writer did not decompile cleanly and was reconstructed from the
          instruction dump. The reader decompiled cleanly and agrees with it
          byte for byte.
        commands:
          set_target_temperature:
            description: >-
              Mode 1: hold the routed cookware at a temperature. The target
              goes out in °C whatever unit the user picked (the app converts
              °F first). The gains are the app's built-in fallback set (kp
              0.008, ki 0.006, kd 0.06, repeated for the second set). The app
              used that set whenever the retired catalogue offered none for
              the heat source. The allowed targets are 37-260 °C in 1 °C
              steps, the app's Control Mode range. Example, 200 °C for one
              hour with request id 8: 08 00 01 00 00 48 43 6f 12 03 3c a6 9b
              c4 3b 8f c2 75 3d 6f 12 03 3c a6 9b c4 3b 8f c2 75 3d 01 10 0e
              00 00. Needs app control (status byte 1 = 3).
            template: ["{request_id}", 0x01, "{target_c}", 0x6f, 0x12, 0x03, 0x3c, 0xa6, 0x9b, 0xc4, 0x3b, 0x8f, 0xc2, 0x75, 0x3d, 0x6f, 0x12, 0x03, 0x3c, 0xa6, 0x9b, 0xc4, 0x3b, 0x8f, 0xc2, 0x75, 0x3d, 0x01, "{timeout_s}"]
            fixed_length: 36
            verification: "reported"
            packet_layout:
              "0": "request id, u16 LE"
              "2": "mode 0x01 (hold temperature)"
              "3": "target, float32 LE, °C"
              "7": "six controller gains, float32 LE each (fixed: the app's fallback set)"
              "31": "flag byte, always 0x01 from the app"
              "32": "timeout, u32 LE, seconds"
            parameters:
              request_id:
                type: "uint16"
                endianness: "little"
                auto: "sequence"
                description: "App-wide request counter, 1 to 32767, then wraps to 0."
              target_c:
                type: "uint32"
                endianness: "little"
                description: >-
                  Target temperature in °C as the bit pattern of an IEEE 754
                  binary32 float, sent as its four little-endian bytes. The
                  allowed values are the patterns of 37.0 to 260.0 in 1 °C
                  steps (37.0 is 0x42140000, 200.0 is 0x43480000, 260.0 is
                  0x43820000). Pick a label, never send a °C number as the
                  integer.
                allowed: [
