                  "181 °C", "182 °C", "183 °C", "184 °C", "185 °C", "186 °C", "187 °C", "188 °C", "189 °C", "190 °C", "191 °C", "192 °C",
                  "193 °C", "194 °C", "195 °C", "196 °C", "197 °C", "198 °C", "199 °C", "200 °C", "201 °C", "202 °C", "203 °C", "204 °C",
                  "205 °C", "206 °C", "207 °C", "208 °C", "209 °C", "210 °C", "211 °C", "212 °C", "213 °C", "214 °C", "215 °C", "216 °C",
                  "217 °C", "218 °C", "219 °C", "220 °C", "221 °C", "222 °C", "223 °C", "224 °C", "225 °C", "226 °C", "227 °C", "228 °C",
                  "229 °C", "230 °C", "231 °C", "232 °C", "233 °C", "234 °C", "235 °C", "236 °C", "237 °C", "238 °C", "239 °C", "240 °C",
                  "241 °C", "242 °C", "243 °C", "244 °C", "245 °C", "246 °C", "247 °C", "248 °C", "249 °C", "250 °C", "251 °C", "252 °C",
                  "253 °C", "254 °C", "255 °C", "256 °C", "257 °C", "258 °C", "259 °C", "260 °C"
                ]
                notes: >-
                  The app's Control Mode offered 100-500 °F or 37-260 °C. The
                  vendor's cookware guidance tops out at 450 °F (232 °C) with
                  food in the pan (device.safety_advisory).
              timeout_s:
                type: "uint32"
                endianness: "little"
                min: 1
                max: 86400
                default: 3600
                description: >-
                  Seconds the burner keeps this mode. The app sent 86400 (one
                  day) from Control Mode, 3600 to hold a recipe temperature,
                  and a step's remaining seconds plus 1000 during a timed step.
                  What the burner does when the timeout runs out is not
                  recorded.
          set_target_temperature_custom_gains:
            description: >-
              Mode 1 with caller-supplied controller gains. This is what the
              app did when its retired catalogue supplied per-heat-source or
              per-recipe gains. Those tables are gone, and nothing here
              reproduces them.
            template: ["{request_id}", 0x01, "{target_c}", "{gains}", 0x01, "{timeout_s}"]
            fixed_length: 36
            advanced: true
            advanced_reason: >-
              The six gains tune the burner's own temperature controller.
              Wrong gains can make it overshoot the target, oscillate, or
              drive the pan far hotter than asked before the burner's
              over-temperature cut-out trips. The only gains this spec
              vouches for are the app's fallback set in
              set_target_temperature.
            verification: "reported"
            parameters:
              request_id:
                type: "uint16"
                endianness: "little"
                auto: "sequence"
                description: "App-wide request counter."
              target_c:
                type: "uint32"
                endianness: "little"
                min: 1108606976
                max: 1132593152
                description: >-
                  Target in °C as the bit pattern of a binary32 float. For a
                  positive float the pattern rises with the value, so this
                  range is exactly 37.0-260.0 °C.
              gains:
                type: "bytes"
                min_length: 24
                max_length: 24
                description: >-
                  Six binary32 floats, little-endian: proportional, integral
                  and derivative gain, then a second set in the same order.
                  The app's fallback is 0.008, 0.006, 0.06 for both sets. What
                  distinguishes the two sets is not established.
              timeout_s:
                type: "uint32"
                endianness: "little"
                min: 1
                max: 86400
                default: 3600
                description: "Seconds the burner keeps this mode."
          set_power_position:
            description: >-
              Mode 2: a fixed power position, like turning a knob. This is the
              app's Power tab. There is no temperature feedback, so the pan
              keeps heating for as long as power is applied (the vendor's
              Control Mode article). Allowed positions are the app's own:
              levels 1-10 at 10-100 %, and the 5 % idle position the app sent
              for level 0 and when a cook started. Example, level 5 for a day
              with request id 9: 09 00 02 00 00 00 3f, then 24 bytes of 00,
              then 01 80 51 01 00. Needs app control.
            template: ["{request_id}", 0x02, "{position}", 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01, "{timeout_s}"]
            fixed_length: 36
            verification: "reported"
            parameters:
              request_id:
                type: "uint16"
                endianness: "little"
                auto: "sequence"
                description: "App-wide request counter."
              position:
                type: "uint32"
                endianness: "little"
                description: >-
                  Power position as the bit pattern of a binary32 fraction of
                  full power (percent / 100). The app validates 0-100 % and
                  divides by 100 before writing.
                allowed: [1028443341, 1036831949, 1045220557, 1050253722, 1053609165, 1056964608, 1058642330, 1060320051, 1061997773, 1063675494, 1065353216]
                labels: ["Idle (5 %)", "1 (10 %)", "2 (20 %)", "3 (30 %)", "4 (40 %)", "5 (50 %)", "6 (60 %)", "7 (70 %)", "8 (80 %)", "9 (90 %)", "10 (100 %)"]
              timeout_s:
                type: "uint32"
                endianness: "little"
                min: 1
                max: 86400
                default: 3600
                description: "Seconds the burner keeps this mode. The app sent 86400 from the Power tab and 9000 with the idle position."
          disable_heating:
            description: >-
              Mode 4 (disabled) with zero target, zero gains and timeout 0. It
              is the app's way to stop and its safe state at startup. The app
              sends set_next_button_light with the off value first. Example
              with request id 10: 0a 00 04, then 28 bytes of 00, then 01 00 00
              00 00.
            template: ["{request_id}", 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]
            fixed_length: 36
            verification: "reported"
            parameters:
              request_id:
                type: "uint16"
                endianness: "little"
                auto: "sequence"
                description: "App-wide request counter."
        format:
          - name: "request_id"
            offset: 0
            length: 2
            type: "uint16"
            endianness: "little"
          - name: "mode"
            offset: 2
            length: 1
            type: "uint8"
            values:
              0: "manual (the user is at the burner's own controls)"
              1: "hold temperature"
              2: "fixed power position"
              3: "off"
              4: "disabled (idle, the app's safe state)"
          - name: "target_bits"
            offset: 3
            length: 4
            type: "uint32"
            endianness: "little"
            notes: >-
              Bit pattern of a binary32 float: °C in mode 1, a fraction of
              full power in mode 2, 0 otherwise. Reinterpret it as a float and
              never scale it as an integer. It is typed as an integer so that
              the Power Position select can match it against its allowed
              patterns.
          - name: "controller_gains"
            offset: 7
            length: 24
            type: "bytes"
            notes: "Six binary32 floats, little-endian (see set_target_temperature_custom_gains)."
          - name: "sensor_flag"
            offset: 31
            length: 1
            type: "uint8"
            notes: "The app always writes 1. Its reader labels this byte as a thermocouple selector."
          - name: "timeout_s"
            offset: 32
            length: 4
            type: "uint32"
            endianness: "little"
            unit: "s"

      - uuid: "00001545-6209-4984-454e-f27d42fb55e3"
        name: "burner_status"
        properties: ["read", "notify"]
        notes: >-
          A 20-byte record whose first eight bytes are one enumerated code
          each. The app ignores bytes 8-19. It reads this characteristic
          after connecting and after every app-control event, and subscribes
          to its notifications. The app's mock burner (a test double built
          into the app) writes bytes 5 and 6 in the opposite order to the
          real parser. This spec follows the parser.
        format:
          - name: "app_control_permission"
            offset: 0
            length: 1
            type: "uint8"
            values:
              0: "allowed"
              1: "not allowed"
          - name: "app_control_state"
            offset: 1
            length: 1
            type: "uint8"
            values:
              0: "no app control"
              1: "waiting for the power button"
              2: "waiting for the next button"
              3: "app has control"
          - name: "line_voltage_status"
            offset: 2
            length: 1
            type: "uint8"
            values:
              0: "ok"
              1: "too low"
              2: "too high"
          - name: "power_stage_temperature_status"
            offset: 3
            length: 1
            type: "uint8"
            values:
              0: "normal"
              1: "power limited"
              2: "over temperature, shutting down"
              3: "thermistor open or shorted"
          - name: "glass_temperature_status"
            offset: 4
            length: 1
            type: "uint8"
            values:
              0: "normal"
              1: "reducing power"
              2: "reducing power further"
              3: "over temperature, shutting down"
              4: "thermistor not working"
              5: "thermistor open or shorted"
          - name: "power_limit_status"
            offset: 5
            length: 1
            type: "uint8"
            values:
              0: "no limit"
              1: "reduced by one step"
              2: "limited to a fixed level"
              3: "intermittent"
              4: "no power"
            notes: "The app's label for value 2 names the number one thousand, plausibly a 1000 W cap (hypothesis)."
          - name: "cookware_presence"
            offset: 6
            length: 1
            type: "uint8"
            values:
              0: "present"
              1: "not detected"
              2: "timed out, shutting down"
          - name: "cookware_sensor_status"
            offset: 7
            length: 1
            type: "uint8"
            values:
              0: "missing"
              1: "ok"
              2: "corrupt"
              3: "open circuit"
              4: "too high"
              5: "too low"
              6: "not initialised"
              7: "computation error"
              8: "high but usable"
              9: "low but usable"

      - uuid: "00001546-6209-4984-454e-f27d42fb55e3"
        name: "burner_events"
        properties: ["indicate"]
        notes: >-
          The burner's event stream, and the one thing the app cannot do
          without. Every indication is exactly 20 bytes: request id (u16 LE),
          event code (u16 LE), then a body that depends on the code
          (payload_formats.Burner_Event_*). Codes are grouped by their top
          nibble: 0x2 cookware errors, 0x5 burner errors, 0x6 state changes
          and button presses, 0x7 telemetry. The full table, with the codes
          the app treats as stop-cooking, is in protocol_details.event_codes.
          The app's mock burner numbers its own events from 0x8001 upward,
          which suggests the burner uses the top half of the id space for
          events it raises itself (hypothesis).
        format:
          - name: "request_id"
            offset: 0
            length: 2
            type: "uint16"
            endianness: "little"
          - name: "event_code"
            offset: 2
            length: 2
            type: "uint16"
            endianness: "little"
            values:
              8706: "0x2202 cookware frame arrived damaged"
              20481: "0x5001 battery error"
              20489: "0x5009 temperature too high (stop cooking)"
              20490: "0x500a unspecified error"
              20491: "0x500b temperature below what the power position should give"
              20493: "0x500d event queue overflowed"
              20494: "0x500e position queue overflowed"
              20495: "0x500f handshake needed first (stop cooking)"
              20496: "0x5010 handshake rejected (stop cooking)"
              20497: "0x5011 cookware could not be decrypted (stop cooking)"
              20498: "0x5012 last command could not be decrypted (stop cooking)"
              20499: "0x5013 cookware id must be rewritten with a new IV"
              24580: "0x6004 next button pressed"
              24581: "0x6005 next button held"
              24582: "0x6006 next button released"
              24584: "0x6008 status changed"
              24585: "0x6009 status delta"
              24586: "0x600a user took control at the burner"
              24587: "0x600b power button pressed"
              24588: "0x600c burner switched off"
              24589: "0x600d power button released"
              24590: "0x600e no cookware"
              24591: "0x600f cookware back"
              24592: "0x6010 cookware timed out"
              24593: "0x6011 handshake succeeded"
              24594: "0x6012 key written"
              24595: "0x6013 app control: press the power button"
              24596: "0x6014 app control: press the next button"
              24597: "0x6015 app control granted"
              24598: "0x6016 app control revoked"
              28673: "0x7001 heartbeat"
              28674: "0x7002 power-stage telemetry"
              28675: "0x7003 burner telemetry"
              28676: "0x7004 routed cookware identity"
              28677: "0x7005 routed cookware reading"

      - uuid: "00001547-6209-4984-454e-f27d42fb55e3"
        name: "burner_command"
        properties: ["write"]
        notes: >-
          Three-byte commands: request id (u16 LE) and a one-byte opcode.
          Opcodes 0x02-0x04 set how the next button's light idles, and 0x08
          asks for app control. The app sends only those, and 0x05-0x07 are
          defined in its table but never sent. The app will not send any of
          them before it knows the firmware version (client rule 1).
        commands:
          set_next_button_light:
            description: >-
              How the burner's next button light behaves while idle. The app
              turned it on at a recipe step that waits for the user to press
              next, and off everywhere else, including just before
              disable_heating.
            template: ["{request_id}", "{light}"]
            verification: "reported"
            parameters:
              request_id:
                type: "uint16"
                endianness: "little"
                auto: "sequence"
                description: "App-wide request counter."
              light:
                type: "uint8"
                min: 2
                max: 4
                labels: ["on", "off", "blinking"]
                description: "Opcode 0x02 on, 0x03 off, 0x04 blinking."
          ask_for_app_control:
            description: >-
              Opcode 0x08. Starts the two-touch confirmation. The burner
              raises 0x6013 (press power), then 0x6014 (press next), then
              0x6015 (granted) or 0x6016 (revoked), and byte 1 of 00001545
              follows. The app sends it only from mode 4, and only while
              control is neither held nor in progress. It is an ordinary
              command because it only asks: nothing heats until a person at
              the burner presses both buttons.
            template: ["{request_id}", 0x08]
            verification: "reported"
            parameters:
              request_id:
                type: "uint16"
                endianness: "little"
                auto: "sequence"
                description: "App-wide request counter."
          declare_app_in_control:
            description: >-
              Opcode 0x05. The app's command table names it as the app
              having control. The app never sends it, and what the burner does
              with it (whether it skips the two-touch confirmation) is not
              known.
            template: ["{request_id}", 0x05]
            advanced: true
            advanced_reason: >-
              Never sent by the vendor app. If the burner honours it, it may
              hand heating control to a client with nobody at the burner,
              bypassing the two-touch confirmation that exists to stop a
              remote client heating an empty or unattended pan.
            verification: "reported"
            parameters:
              request_id:
                type: "uint16"
                endianness: "little"
                auto: "sequence"
                description: "App-wide request counter."
          lock_out_app:
            description: >-
              Opcode 0x06. The app's table names an app lockout. Never sent
              by the app, and its effect is not known.
            template: ["{request_id}", 0x06]
            advanced: true
            advanced_reason: >-
              Never sent by the vendor app. It may lock app control out until
              a power cycle or leave the burner in a state no known command
              undoes.
            verification: "reported"
            parameters:
              request_id:
                type: "uint16"
                endianness: "little"
                auto: "sequence"
                description: "App-wide request counter."
          clear_burner_status:
            description: >-
              Opcode 0x07. The app's table names it as clearing status.
              Never sent by the app.
            template: ["{request_id}", 0x07]
            advanced: true
            advanced_reason: >-
              Never sent by the vendor app. It may clear an over-temperature
              or fault state the burner latched for a reason. The vendor's
              own remedy for an overheat is to let the burner cool and
              power-cycle it.
            verification: "reported"
            parameters:
              request_id:
                type: "uint16"
                endianness: "little"
                auto: "sequence"
                description: "App-wide request counter."

  - uuid: "0000fa81-8a11-4222-9610-53f79479ca03"
    name: "Cue cookware handle / probe thermometer"
    notes: >-
      Served by the pan and pot handle capsules and, per the app, by the
      Smart Probe. Characteristics share the base
      0000fa8x-8a11-4222-9610-53f79479ca03. The app never writes to this
      service. It enables indications on 0000fa85, reads 0000fa84 once, and
      parses 20-byte thermometer frames from 0000fa83 whenever they arrive.
      The app also takes the same readings from the cookware's
      advertisements. Whether it keeps a connection to the cookware during
      a cook is not established. The research notes filed with the APK
      called 0000fa84 the temperature path. The app's parser shows the
      frame on 0000fa83, and 0000fa84 is a 6-byte value it only
      length-checks.
    initialization:
      - characteristic: "00001537-1212-efde-1523-785feabcd123"
        read: true
        notes: "Firmware version (u16 LE). The app reads it only when the DFU service is present."
      - characteristic: "00001535-1212-efde-1523-785feabcd123"
        read: true
        notes: "Device type and revision."
      - characteristic: "0000fa85-8a11-4222-9610-53f79479ca03"
        subscribe: true
        notes: "Indications (CCCD 0x0002), as the app does. What arrives on them is not recorded."
      - characteristic: "0000fa84-8a11-4222-9610-53f79479ca03"
        read: true
        notes: "Six bytes. The app checks the length and logs the value."
    characteristics:
      - uuid: "0000fa83-8a11-4222-9610-53f79479ca03"
        name: "thermometer_frame"
        properties: ["notify"]
        notes: >-
          A 20-byte little-endian frame. The app rejects any other length. Of
          the frame the app keeps the second temperature (offset 12), the
          fault byte at offset 18 and the battery byte. The first
          temperature, the sensor slots and the second fault byte only reach
          its log. The properties are not recorded. The app's mock burner
          treats this as a notify characteristic, while the real app enables
          only 0000fa85, so how frames are triggered on a live connection is
          an open question. Example (invented readings): 04 82 01 04 40 e2 01
          00 00 00 cc 41 00 40 3b 43 00 01 00 00 is a base temperature of
          187.25 °C.
        format:
          - name: "frame_version"
            offset: 0
            length: 1
            type: "uint8"
          - name: "battery_raw"
            offset: 1
            length: 1
            type: "uint8"
            notes: "The app calls this the battery voltage and forwards it raw. The scale is not recorded. The app's mock sends 130."
          - name: "frame_counter"
            offset: 2
            length: 1
            type: "uint8"
          - name: "cold_junction_raw"
            offset: 3
            length: 1
            type: "uint8"
            notes: "Thermocouple cold-junction reading, raw. The scale is not recorded."
          - name: "timestamp_raw"
            offset: 4
            length: 4
            type: "uint32"
            endianness: "little"
            notes: "The app only logs it. The unit is not recorded."
          - name: "temperature_aux"
            offset: 8
            length: 4
            type: "bytes"
            notes: "binary32 LE, °C. The app logs it but does not use it."
          - name: "temperature_base"
            offset: 12
            length: 4
            type: "bytes"
            notes: >-
              binary32 LE, °C: the cookware's base temperature, which the app
              uses. The value -999.0 (bytes 00 c0 79 c4) is the app's own
              marker for no reading. Its burner-relay parser drops a reading
              that decodes to it, and this direct parser does not check.
          - name: "sensor_slot_a"
            offset: 16
            length: 1
            type: "uint8"
          - name: "sensor_slot_b"
            offset: 17
            length: 1
            type: "uint8"
          - name: "fault_base"
            offset: 18
            length: 1
            type: "uint8"
            notes: "The fault code the app forwards with the base temperature. Plausibly the thermocouple codes of Advertisement_Cookware_V2 (0 no fault)."
          - name: "fault_other"
            offset: 19
            length: 1
            type: "uint8"
      - uuid: "0000fa84-8a11-4222-9610-53f79479ca03"
        name: "handle_info"
        properties: ["read"]
        notes: >-
          Exactly 6 bytes, little-endian per the app's buffer. The app checks
          the length and logs the value, nothing more. Its meaning is not
          established. It is the same length as the cookware id the burner
          takes, but nothing ties the two.
        format:
          - name: "value"
            offset: 0
            length: 6
            type: "bytes"
      - uuid: "0000fa85-8a11-4222-9610-53f79479ca03"
        name: "handle_events"
        properties: ["indicate"]
        notes: >-
          The app writes the indication-enable value (0x0002) to this
          characteristic's last descriptor on connect. It has no parser for
          anything arriving here.

  - uuid: "00001530-1212-efde-1523-785feabcd123"
    name: "Nordic legacy DFU service (with vendor identity characteristics)"
    notes: >-
      Nordic's legacy DFU service base. Nordic's stock layout has control
      point 00001531, packet 00001532 and version 00001534 (see
      docs/protocols/firmware-update.md). Those belong to the stock DFU
      library the app embeds and are deliberately not declared here: no
      bootloader entry or image bytes appear in this spec. The app reads two
      further characteristics that are not part of Nordic's stock service,
      and they carry identity.
    characteristics:
      - uuid: "00001535-1212-efde-1523-785feabcd123"
        name: "device_identity"
        properties: ["read"]
        notes: "Exactly 4 bytes. The app keeps the revision."
        format:
          - name: "device_type"
            offset: 0
            length: 2
            type: "uint16"
            endianness: "little"
          - name: "device_revision"
            offset: 2
            length: 2
            type: "uint16"
            endianness: "little"
      - uuid: "00001537-1212-efde-1523-785feabcd123"
        name: "firmware_version"
        properties: ["read"]
        notes: >-
          Exactly 2 bytes. Advertisements carry the same number as two bytes,
          major then minor, and the app forms (major << 8) | minor. So this
          u16 is presumably major in its high byte (hypothesis). The app
          will not send a 00001547 command until it has this value (client
          rule 1); whether the burner itself cares is not established.
        format:
          - name: "firmware_version"
            offset: 0
            length: 2
            type: "uint16"
            endianness: "little"

payload_formats:
  Local_Name:
    description: >-
      The advertised local name of the burner and the cookware: 8 characters
      of standard base64 (RFC 4648 alphabet, with + and /) that decode to 6
      bytes.
    fields:
      - name: "address_bytes"
        description: "Bytes 0-5: the BLE address least-significant byte first. Byte 5's top two bits are replaced by the device type."
      - name: "device_type"
        description: "Byte 5 AND 0xC0: 0x00 pan, 0x40 pot, 0x80 burner. The app rejects 0xC0."
    parse_rules:
      - "Base64-decode the name. Anything but 6 bytes is not a Cue device."
      - "device_type = byte5 & 0xC0 (0x00 pan, 0x40 pot, 0x80 burner)."
      - "address = byte5 | 0xC0, byte4, byte3, byte2, byte1, byte0, written most-significant first."
      - "Check the address against the one the scan reported. The app rejects a mismatch. It also computes the reported address minus one, apparently to accept a unit advertising from its bootloader address, but that comparison did not decompile cleanly."
      - "Second-generation cookware and the probe advertise a product id (Advertisement_Cookware_V2), which overrides the device type from the name."
    example: "q4lnRSOB decodes to ab 89 67 45 23 81: a burner at C1:23:45:67:89:AB (invented address)"
  Advertisement_Header:
    description: >-
      Manufacturer-specific data (AD type 0xFF) under company id 0x03F1.
      Offsets are counted from the first byte after the two company-id
      bytes. All fields are little-endian.
    fields:
      - name: "unknown_u32"
        description: "Bytes 0-3, u32 LE. The app reads it and discards it."
      - name: "frame_counter"
        description: "Byte 4, u8."
      - name: "frame_type"
        description: "Byte 5, u8: 1 first-generation cookware, 2 second-generation cookware or probe, 3 burner. The app rejects any other value."
    values:
      "1": "Advertisement_Cookware_V1"
      "2": "Advertisement_Cookware_V2"
      "3": "Advertisement_Burner"
  Advertisement_Cookware_V1:
    description: "Frame type 1. Offsets after the company id, continuing Advertisement_Header."
    fields:
      - name: "battery_raw"
        description: "Byte 6, u8. The scale is not recorded."
      - name: "cold_junction_raw"
        description: "Byte 7, one byte. The scale is not recorded."
      - name: "temperature_aux"
        unit: "C"
        description: "Bytes 8-11, binary32 LE, °C. The app does not use it."
      - name: "temperature_base"
        unit: "C"
        description: "Bytes 12-15, binary32 LE, °C. The reading the app uses."
      - name: "fault_base"
        description: "Byte 19, u8. The fault code the app forwards with the reading. Bytes 16-18 are read and ignored."
  Advertisement_Cookware_V2:
    description: >-
      Frame type 2, from second-generation cookware and the Smart Probe.
      Offsets after the company id.
    fields:
      - name: "firmware_major"
        description: "Byte 6, u8. The app's firmware version is (major << 8) | minor."
      - name: "firmware_minor"
        description: "Byte 7, u8."
      - name: "product_id"
        description: "Bytes 8-9, u16 LE: 8 fry pan, 9 chef's pot, 10 3.5 qt pot, 13 Smart Probe, 18 non-stick fry pan, and 11, 14, 16 and 17 for the partner-branded line (device.variants)."
      - name: "battery_raw"
        description: "Byte 10, u8. The scale is not recorded."
      - name: "temperature"
        unit: "C"
        description: "Bytes 11-14, binary32 LE, °C."
      - name: "cold_junction_raw"
        description: "Byte 15, u8. The scale is not recorded."
      - name: "thermocouple_status"
        description: "Byte 16, u8: 0 no fault, 1 open circuit, 2 too high, 3 too low, 4 not initialised, 5 computation error. The app rejects any other value."
    parse_rules:
      - "Check the company id (0x03F1), then frame_type == 2 at byte 5."
      - "temperature = struct.unpack('<f', payload[11:15]) in °C. Report it only when thermocouple_status is 0."
    example: "f1 03 00 00 00 00 05 02 01 04 08 00 96 00 40 3b 43 1e 00 (with the company id, invented values): pan product 8, firmware 1.4, 187.25 °C, no fault"
  Advertisement_Burner:
    description: "Frame type 3, from the burner. Offsets after the company id."
    fields:
      - name: "firmware_major"
        description: "Byte 6, u8."
      - name: "firmware_minor"
        description: "Byte 7, u8. Firmware version = (major << 8) | minor. This satisfies client rule 1."
      - name: "product_id"
        description: "Bytes 8-9, u16 LE: 32 US, 47 220 V, 48 220 V partner edition, 96 100 V."
      - name: "unused"
        description: "Byte 10, if present. The app skips it."
      - name: "flag"
        description: "Byte 11, if present: non-zero reads as true. The app keeps it but never uses it. Meaning unknown."
  Burner_Event_Heartbeat:
    description: "00001546 event 0x7001. Offsets from the start of the 20-byte indication."
    fields:
      - name: "counter"
        description: "Bytes 4-7, binary32 LE. A heartbeat counter, carried as a float. The app's mock counts up from 1."
  Burner_Event_Power_Stage:
    description: "00001546 event 0x7002: power-stage telemetry."
    fields:
      - name: "current"
        unit: "A"
        description: "Bytes 4-7, binary32 LE. The app labels it current. Amperes is a hypothesis."
      - name: "line_voltage"
        unit: "V"
        description: "Bytes 8-11, binary32 LE. Volts is a hypothesis."
      - name: "energy_applied"
        description: "Bytes 12-15, binary32 LE. The unit is not recorded."
      - name: "pan_detect_pulses"
        description: "Byte 16, u8. A count from the coil's pan-detection."
      - name: "glass_temperature"
        unit: "C"
        description: "Byte 17, u8. °C is a hypothesis."
      - name: "power_stage_temperature"
        unit: "C"
        description: "Bytes 18-19, signed 16-bit LE. The power transistor's temperature. °C is a hypothesis."
  Burner_Event_Burner:
    description: "00001546 event 0x7003: burner telemetry."
    fields:
      - name: "position"
        description: "Bytes 4-7, binary32 LE: the current power position as a fraction of full. The app multiplies by 100 for a percentage."
      - name: "controller_temperature"
        unit: "C"
        description: "Byte 8, u8. The app labels it an IC temperature. °C is a hypothesis."
  Burner_Event_Cookware_Identity:
    description: "00001546 event 0x7004: identity of the routed cookware, relayed by the burner."
    fields:
      - name: "device_type"
        description: "Bytes 4-5, u16 LE."
      - name: "device_revision"
        description: "Bytes 6-7, u16 LE."
      - name: "software_version"
        description: "Bytes 8-9, u16 LE."
  Burner_Event_Cookware_Reading:
    description: >-
      00001546 event 0x7005: the routed cookware's reading, relayed by the
      burner. The body is the thermometer frame with the timestamp removed
      and the first three bytes in a different order. The app's two parsers
      disagree on that order, and this follows the relay parser.
    fields:
      - name: "frame_counter"
        description: "Byte 4, u8."
      - name: "frame_version"
        description: "Byte 5, u8."
      - name: "battery_raw"
        description: "Byte 6, u8."
      - name: "cold_junction_raw"
        description: "Byte 7, u8."
      - name: "temperature_aux"
        unit: "C"
        description: "Bytes 8-11, binary32 LE, °C."
      - name: "temperature_base"
        unit: "C"
        description: "Bytes 12-15, binary32 LE, °C. The reading the app uses. -999.0 means no reading."
      - name: "sensor_slots"
        description: "Bytes 16-17, u8 each."
      - name: "fault_base"
        description: "Byte 18, u8."
      - name: "fault_other"
        description: "Byte 19, u8."
    example: "01 80 05 70 01 02 82 04 00 40 3b 43 00 40 3b 43 00 01 00 00 (invented): 187.25 °C"
  Burner_Event_Status_Change:
    description: "00001546 event 0x6008: three status codes and an action word."
    fields:
      - name: "counter"
        description: "Bytes 4-5, u16 LE."
      - name: "status_1"
        description: "Bytes 6-7, u16 LE, a code from protocol_details.status_codes. 0x0000 means all is well."
      - name: "status_2"
        description: "Bytes 8-9, u16 LE, same table."
      - name: "status_3"
        description: "Bytes 10-11, u16 LE, same table."
      - name: "action"
        description: "Bytes 12-15, u32 LE bit field: 0 nothing, bit 0 set means the burner switched off (the app stops the cook), bit 1 set means its history overflowed (a warning)."

entities:
  - platform: "select"
    name: "Target Temperature"
    icon: "mdi:thermometer"
    variants: ["Cue burner (US)", "Cue burner (220 V)", "Cue burner (220 V, partner edition)", "Cue burner (100 V)"]
    command_characteristic: "00001543-6209-4984-454e-f27d42fb55e3"
    commands:
      select_option: "set_target_temperature"
    notes: >-
      37-260 °C in 1 °C steps. The options come from the command's allowed
      bit patterns and labels. Writing one needs app control (status byte 1
      = 3) and a routed cookware. The current target is target_bits of
      00001543 in mode 1, a binary32 float.
  - platform: "select"
    name: "Power Position"
    icon: "mdi:knob"
    variants: ["Cue burner (US)", "Cue burner (220 V)", "Cue burner (220 V, partner edition)", "Cue burner (100 V)"]
    state_characteristic: "00001543-6209-4984-454e-f27d42fb55e3"
    state_mapping:
      value: "target_bits"
      options:
        1028443341: "Idle (5 %)"
        1036831949: "1 (10 %)"
        1045220557: "2 (20 %)"
        1050253722: "3 (30 %)"
        1053609165: "4 (40 %)"
        1056964608: "5 (50 %)"
        1058642330: "6 (60 %)"
        1060320051: "7 (70 %)"
        1061997773: "8 (80 %)"
        1063675494: "9 (90 %)"
        1065353216: "10 (100 %)"
    commands:
      select_option: "set_power_position"
    notes: >-
      The app's Power tab. Meaningful only while 00001543 reports mode 2. In
      mode 1 target_bits holds a temperature and matches no option. Open-loop:
      the pan keeps heating.
  - platform: "button"
    name: "Turn Heating Off"
    icon: "mdi:stove"
    variants: ["Cue burner (US)", "Cue burner (220 V)", "Cue burner (220 V, partner edition)", "Cue burner (100 V)"]
    commands:
      press: "disable_heating"
    notes: "Mode 4, timeout 0. The app sends the next-button light off first."
  - platform: "button"
    name: "Ask For App Control"
    icon: "mdi:gesture-tap-button"
    variants: ["Cue burner (US)", "Cue burner (220 V)", "Cue burner (220 V, partner edition)", "Cue burner (100 V)"]
    commands:
      press: "ask_for_app_control"
    notes: "Starts the two-touch confirmation. Someone must then press the burner's power and next buttons."
  - platform: "select"
    name: "Next Button Light"
    icon: "mdi:led-on"
    variants: ["Cue burner (US)", "Cue burner (220 V)", "Cue burner (220 V, partner edition)", "Cue burner (100 V)"]
    command_characteristic: "00001547-6209-4984-454e-f27d42fb55e3"
    commands:
      select_option: "set_next_button_light"
    notes: "Write-only. No readback of the light state is known."
  - platform: "sensor"
    name: "Burner Mode"
    icon: "mdi:stove"
    variants: ["Cue burner (US)", "Cue burner (220 V)", "Cue burner (220 V, partner edition)", "Cue burner (100 V)"]
    state_characteristic: "00001543-6209-4984-454e-f27d42fb55e3"
    state_mapping:
      value: "mode"
    notes: "0 means the user took over at the burner, and the app stops driving it then."
  - platform: "sensor"
    name: "App Control"
    icon: "mdi:account-check"
    variants: ["Cue burner (US)", "Cue burner (220 V)", "Cue burner (220 V, partner edition)", "Cue burner (100 V)"]
    state_characteristic: "00001545-6209-4984-454e-f27d42fb55e3"
    state_mapping:
      value: "app_control_state"
  - platform: "sensor"
    name: "Cookware On Burner"
    icon: "mdi:pot"
    variants: ["Cue burner (US)", "Cue burner (220 V)", "Cue burner (220 V, partner edition)", "Cue burner (100 V)"]
    state_characteristic: "00001545-6209-4984-454e-f27d42fb55e3"
    state_mapping:
      value: "cookware_presence"
  - platform: "sensor"
    name: "Glass Temperature Status"
    icon: "mdi:thermometer-alert"
    variants: ["Cue burner (US)", "Cue burner (220 V)", "Cue burner (220 V, partner edition)", "Cue burner (100 V)"]
    state_characteristic: "00001545-6209-4984-454e-f27d42fb55e3"
    state_mapping:
      value: "glass_temperature_status"
  - platform: "sensor"
    name: "Cookware Temperature"
    device_class: "temperature"
    unit: "C"
    variants: ["Cue cookware (first generation)", "Cue cookware (second generation)", "Hestan Cue Smart Probe"]
    state_characteristic: "0000fa83-8a11-4222-9610-53f79479ca03"
    state_mapping:
      value: "temperature_base"
    notes: >-
      A binary32 float in °C, which the schema cannot type yet
      (device.notes, FLOATS). A consumer must reinterpret the four bytes.
      The same reading arrives with no connection in the advertisement
      (payload_formats.Advertisement_Cookware_V2), and relayed by the burner
      as event 0x7005.
  - platform: "sensor"
    name: "Firmware Version"
    icon: "mdi:chip"
    state_characteristic: "00001537-1212-efde-1523-785feabcd123"
    state_mapping:
      value: "firmware_version"
    notes: "Raw u16. Advertisements give the same number as major.minor bytes."

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["nordic_legacy_dfu", "nordic_secure_dfu"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "vendor_cloud"
        notes: >-
          The app asked the vendor cloud for the current firmware build for
          each product id and downloaded a Nordic DFU zip. That cloud is
          retired, and the app ships no image. Legacy-DFU images are
          unsigned by the stack's design. Whether the second-generation
          images were signed is not recorded.
      enter:
        how: "stack_characteristic"
        notes: >-
          The app hands the update to Nordic's stock Android DFU library,
          which enters the bootloader through the stack's own buttonless
          entry (docs/protocols/firmware-update.md). No entry bytes are
          declared in this spec. The burner builds and the first-generation
          pan are legacy-DFU devices (service 00001530-1212-efde-1523-785feabcd123),
          and the app bonds them first. The other devices are presumably
          Secure DFU (0000fe59-0000-1000-8000-00805f9b34fb), which the
          scanner recognises in advertisements (hypothesis).
      dfu_mode:
        address_offset: 1
        notes: >-
          The app's name check computes the reported address minus one,
          which fits a bootloader advertising at the application address +1
          (hypothesis). The bootloader's advertised name is not recorded.
      services: ["00001530-1212-efde-1523-785feabcd123"]
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >-
        The vendor says a device with an interrupted update ("even 99 %
        done") misbehaves until a full update succeeds. With the image source
        gone, do not start an update you cannot finish.

protocol_details:
  float_encoding:
    rule: "Every temperature, gain and power position on this protocol is an IEEE 754 binary32 float, little-endian. The schema has no float type, so commands carry the float's bit pattern as a uint32 parameter and read-only fields carry it as 4 raw bytes."
    encode_python: "struct.pack('<f', value)   # e.g. 200.0 -> 00 00 48 43"
    decode_python: "struct.unpack('<f', four_bytes)[0]"
    bit_pattern_python: "struct.unpack('<I', struct.pack('<f', value))[0]   # 200.0 -> 1128792064 (0x43480000)"
    ordering: "For positive floats the bit pattern rises with the value, so a min/max on the pattern bounds the value exactly."
  control_model:
    loop: "The burner runs the temperature controller. The app routes cookware (00001542), writes target, gains and timeout (00001543) and supervises the event stream. It does not compute power in mode 1."
    app_constants:
      control_mode_range_c: "37-260 (100-500 °F), 1-degree steps in the user's unit. The app applies this range whenever a Cue burner connects; the retired catalogue may have narrowed it per cookware."
      fallback_gains: "0.008, 0.006, 0.06, 0.008, 0.006, 0.06"
      idle_position_percent: 5
      timeouts_s: "86400 Control Mode (temperature or power), or the Control Mode timer's remaining seconds + 1 when one is set; 3600 recipe hold; 9000 idle position at cook start; remaining step seconds + 1000 during a timed step; 0 with disable_heating"
      request_id: "one app-wide counter shared by every device, 1-32767, then 0"
    supervisor_sequence:
      - "Connect (give up after 60 s)."
      - "Wait for indications on 00001546, a read of 00001543 and the control byte of 00001545."
      - "First pass only: if the mode is not 4, set the next-button light off and write mode 4."
      - "Read 00001542. If it is not the chosen cookware's id and that cookware is in range, write it and read it back."
      - "If not cooking, report ready."
      - "If cooking and the mode is 0, the user took over: stop."
      - "If control is neither held nor in progress: from any mode but 4, write mode 4 first. From mode 4, send opcode 0x08 and show the two-touch prompt."
      - "Once control is held: write the pending setpoint (position or temperature), or the 5 % idle position if none is pending, then re-send any pending light command."
      - "Re-run every 250 ms until ready, then every 2.5 s."
    on_app_control_event: "For 0x6013-0x6016 the app updates its control state, then re-reads 00001543 and 00001545."
  event_codes:
    stop_cooking: ["0x5009", "0x500f", "0x5010", "0x5011", "0x5012"]
    errors: ["0x2202", "0x5001", "0x5009", "0x500a", "0x500b", "0x500d", "0x500e", "0x500f", "0x5010", "0x5011", "0x5012"]
    app_control_events: ["0x6013", "0x6014", "0x6015", "0x6016"]
    unknown_code_handling: "The app maps an unrecognised code to 0x500a (unspecified error)."
    notes: "Labels for every code are in the event_code values of 00001546. The app also stops a cook on a status_change event whose action has bit 0 set."
  status_codes:
    notes: "The u16 codes in event 0x6008. The top nibble is severity (1 warning, 2 error, 3 fatal) and the second nibble the source (1 burner, 2 cookware). Labels are our own."
    "0x0000": "all well"
    "0x1101": "warning: no data from the burner"
    "0x1140": "warning: no cookware on the coil"
    "0x1141": "warning: glass over temperature"
    "0x1142": "warning: power transistor over temperature"
    "0x1149": "warning: power reduced"
    "0x114b": "warning: handshake needed"
    "0x1201": "warning: no data from the cookware"
    "0x1245": "warning: cookware battery critical"
    "0x2101": "error: no data from the burner"
    "0x2141": "error: glass over temperature"
    "0x2142": "error: power transistor over temperature"
    "0x2143": "error: line voltage low"
    "0x2148": "error: controller shut down automatically"
    "0x214a": "error: burner shut down automatically"
    "0x2201": "error: no data from the cookware"
    "0x2240": "error: cookware thermocouple open"
    "0x2246": "error: wrong cookware"
    "0x2247": "error: cookware key invalid"
    "0x2248": "error: cookware needs a firmware update"
    "0x3145": "fatal: power transistor thermistor open or shorted (stop cooking)"
    "0x3146": "fatal: glass thermistor broken (stop cooking)"
    "0x3147": "fatal: glass thermistor open or shorted (stop cooking)"
    "0xf000": "the app's own marker for a code it does not know"
  product_ids:
    "0": "11-inch fry pan, first generation (legacy DFU)"
    "1": "5.5 qt chef's pot, first generation"
    "8": "11-inch fry pan, second generation"
    "9": "5.5 qt chef's pot, second generation"
    "10": "3.5 qt pot, second generation"
    "11": "probe, partner-branded line"
    "13": "Hestan Cue Smart Probe"
    "14": "fry pan, partner-branded line"
    "16": "pot, partner-branded line"
    "17": "small pot, partner-branded line"
    "18": "11-inch non-stick fry pan"
    "32": "Cue burner, US (legacy DFU)"
    "47": "Cue burner, 220 V (legacy DFU)"
    "48": "Cue burner, 220 V partner edition (legacy DFU)"
    "96": "Cue burner, 100 V (legacy DFU)"
    other: "The table also lists Hestan's own built-in KICS induction cooktops (bonded BLE), GE Appliances Café, Profile and Monogram ranges and cooktops (Wi-Fi, which the vendor's support site also documents), and built-in induction hobs from three European brands with a different 00001545 layout. All are out of scope."
  decompile_gaps:
    burner_mode_writer: "The 36-byte writer failed to decompile. It was reconstructed from the instruction dump: u16 request id, a one-byte mode, a float target (position / 100 in mode 2, °C in mode 1, else 0), six float gains (mode 1) or six zeros, one byte = 1, u32 timeout. The one-byte writes are confirmed by the writer helper, which stores a single byte, and by the 36-byte buffer size, which leaves no room for 16-bit fields."
    burner_dispatcher: "The burner's characteristic dispatcher (00001546 bodies, 00001545 and 00001542 routing) was recovered only with jadx's bad-code output. The byte reads are unambiguous, but the control flow around them is not."
    name_check: "The name-versus-address comparison did not decompile cleanly (payload_formats.Local_Name)."
    triage_corrections: "An earlier triage read the thermometer fields and the mode byte as u16. The app's reader helper reads one unsigned byte for each, which is what makes the 20-byte frame and the 36-byte record add up. It also placed the firmware version in 00001545, but the app reads it from 00001537 or the advertisement."
  mock_burner:
    notes: "The app contains a mock burner for testing. Its frames broadly agree with the real parsers, and they are useful as shape examples. It writes bytes 5 and 6 of 00001545 in the opposite order to the real parser, and it builds a burner-telemetry event with a rounded temperature in the controller-temperature byte."
  cloud:
    notes: "Accounts (AWS Cognito), recipes, per-heat-source gain tables and firmware-build metadata all came from vendor services that are now retired. No endpoint is given here, because none serves anything."

evidence:
  app_static_analysis: >-
    The vendor's Android app (Hestan Cue 1.5.x; the vendor says Android
    1.5.1 or later supports the Smart Probe) was decompiled.
    From it: the GATT writers and readers for the burner, handle and DFU
    services; the advertisement scanner and the name decoder; the product
    and device-type tables; the burner status, event, status-change and
    action code tables; the connection supervisor; the Control Mode ranges
    and timeouts; and the firmware-update and bonding path. Two methods
    needed the instruction dump (evidence.decompile). Nothing was run
    against hardware.
  decompile: >-
    Methods that failed to decompile normally were re-read with jadx's
    bad-code output or from the instruction dump in the decompiler's
    comments (protocol_details.decompile_gaps). Every field width was
    checked against the reader and writer helpers and the fixed buffer
    lengths (20 and 36 bytes).
  documentation_review: >-
    The vendor's support portal, read 2026-09-28: the app sunset notices,
    manual mode, hardware setup, pairing and Android troubleshooting,
    firmware update, power requirements (models 41000 and 41004-41009),
    Control Mode, overheating, capacitive controls, cookware battery and
    end cap, cookware temperature limits, signal range, and the Smart Probe
    setup, detection and range articles.
  fcc_review: >-
    FCC ID 2AYY4-41701 (Hestan Cue Smart Probe, granted 2021-04-14). The
    grant is filed as a Part 15B digital device, and its test report lists
    a 2402-2480 MHz GFSK BLE radio powered by a battery. Its two user-manual
    exhibits (quick start and safety instructions, model number 417) were
    read. No grant was found for the burner or the pan and pot capsules
    under Hestan's grantee code.
  open_questions: >-
    See remaining_unknowns. The first thing to settle with hardware is a
    capture of the burner's 00001543 readback and one 0x7005 event, then
    whether the burner accepts a setpoint after the two-touch confirmation
    with the fallback gains.
  artifacts:
    - type: "static_analysis"
      artifact: "Hestan Cue Android app 1.5.x (package com.hestan.cue)"
      obtained_via: "third-party APK mirror, 2026-08"
      description: "Source of every byte layout in this spec. The app was retired 2025-07-21."
    - type: "vendor_documentation"
      artifact: "Hestan Cue support portal articles"
      url: "https://support.hestancue.com/en/support/solutions/articles/19000166286"
      obtained_via: "fetched 2026-09-28"
      description: "Sunset dates, setup, manual mode, firmware, power, Control Mode, overheating, capacitive-control and probe articles."
    - type: "fcc_filing"
      artifact: "FCC ID 2AYY4-41701 (Hestan Cue Smart Probe)"
      url: "https://fccid.co/fcc/2AYY4-41701"
      obtained_via: "fccid.co, harvested 2026-09-26"
      description: "Grant, test report, internal and external photos, and two user-manual exhibits."
    - type: "public_research"
      artifact: "Archived Google Play listing for the Hestan Cue app (2024-07-20)"
      url: "https://web.archive.org/web/20240720010437/https://play.google.com/store/apps/details?id=com.hestan.cue"
      obtained_via: "Wayback Machine"
      description: "The last vendor description of the system: cookware, burner and app all on Bluetooth, and Control Mode."
    - type: "standard"
      artifact: "Bluetooth SIG assigned numbers, company identifiers"
      url: "https://www.bluetooth.com/specifications/assigned-numbers/"
      obtained_via: "fetched 2026-09-28"
      description: "0x03F1 is registered to Hestan Smart Cooking Inc."

remaining_unknowns:
  - "Advertising: the exact on-air layout (which structures are in the advertisement and which in the scan response), whether burners on current firmware carry the 0x1530 16-bit service, and what the 4-byte field at the start of the manufacturer payload is."
  - "Whether the burner needs anything beyond the firmware-version gate, the two-touch confirmation and mode 4 before it accepts a setpoint. The status and event tables name a handshake, a key and 'handshake required' and 'handshake invalid' errors that the app never drives."
  - "What 'encryption' means between the burner and the cookware: the events name decrypting the handle and rewriting its id with a new IV, but the app carries no key."
  - "What the burner does when a mode's timeout runs out, and whether mode 3 (off) behaves differently from mode 4 (disabled)."
  - "What opcodes 0x05 (app in control), 0x06 (lockout) and 0x07 (clear status) do. The app never sends them."
  - "The semantics of the 6 bytes of 0000fa84-8a11-4222-9610-53f79479ca03, what 0000fa85 indicates, and how 0000fa83 frames are delivered on a live connection."
  - "Scales for the battery, cold-junction and timestamp fields, the units of the power-stage telemetry, and what separates the two controller gain sets."
  - "Whether the 220 V, 220 V partner-edition and 100 V burners, and the second-generation cookware, differ from the base layout in anything but product id. Only the app's product table ties them together."
  - "Whether the Smart Probe really serves 0000fa81-8a11-4222-9610-53f79479ca03. The app routes it through the same thermometer class, but no probe has been examined."
  - "The order of the first three bytes of the thermometer frame: the direct parser reads version, battery, counter, and the burner-relay parser reads counter, version, battery."
  - "Whether a burner or cookware that never received the app's first firmware update can be used at all, now that the images are gone."
  - "Whether the burner accepts more than one central, and whether it keeps the routed cookware id across a power cycle."

