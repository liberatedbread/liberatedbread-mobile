                  "133 °C", "134 °C", "135 °C", "136 °C", "137 °C", "138 °C", "139 °C", "140 °C", "141 °C", "142 °C", "143 °C", "144 °C",
                  "145 °C", "146 °C", "147 °C", "148 °C", "149 °C", "150 °C", "151 °C", "152 °C", "153 °C", "154 °C", "155 °C", "156 °C",
                  "157 °C", "158 °C", "159 °C", "160 °C", "161 °C", "162 °C", "163 °C", "164 °C", "165 °C", "166 °C", "167 °C", "168 °C",
