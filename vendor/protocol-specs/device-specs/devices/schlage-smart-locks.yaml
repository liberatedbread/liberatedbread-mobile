              Push the cloud-minted JITR identity blob: {1:8, 2:4, 16:{0:6,
              1:2, 2:{0:payload0Bytes}}}; poll status {1:8, 2:5, 16:{0:6,
              1:4}} → 0..5 (stopped/started/success/AP error/host error/IP
              acquired). The app's enum ends at IP_ACQUIRED (pj.java:46-88);
