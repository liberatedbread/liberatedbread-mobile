# Schlage Smart Locks (Sense / Encode family) — Device Spec (BLE "uWeave")
# Reverse-engineered from the Schlage Home Android app (com.allegion.leopard),
# versions 3.6.0 (unobfuscated protocol code) and 6.1.0 (resources; the
# app-specific Java is packed by a commercial protector in this version, but
# the bundled Google Weave/GCD security classes ship unobfuscated — so the
# SPAKE2/P-224 pairing constants are confirmed in BOTH versions; the packed
# session-layer claims below remain 3.6.0-only).
#
# APKs analyzed (workspace only, never committed — see docs/CLEANROOM_RULES.md):
#   com.allegion.leopard 3.6.0  sha256 73ad73952f585fb6fcc4d5f31a503c65903a1714077afc62781c6e6b1248219c
#   com.allegion.leopard 6.1.0  sha256 0e87604de5e12f650badea5539ea0765f4b7ea5e29206db02b9cb1404631abdd
# Both fetched from APKPure via apkeep. res/raw/sense_gatt_profile.json and
# res/raw/firmware_gatt_profile.json are byte-identical between the two versions.
#
# Cross-checked against the public Go implementation
# golang.betakappaphi.com/schlage-uweave (github.com/huguesb/schlage-uweave):
# UUIDs, fragmentation header, SPAKE2/P-224 constants, HKDF salt, EAX nonce
# format, macaroon format and the CBOR command map all agree.
#
# Verification basis for `verification: confirmed` below: the fact was located
# and read in the decompiled vendor app AND matches the independent Go
# implementation. Nothing here has been replayed against a physical lock by us;
# the Go library authors report hardware testing. `reported` marks facts taken
# from the RE report / app strings that we did not independently re-derive.
#
# Key source references (jadx; 3.6.0 class names obfuscated):
#   defpackage/ou2.java — uWeave session base: fragmentation (19-byte chunks,
#     flags 0x8/0x4/0x0/0xC, 1024-byte blocks), EAX encrypt with nonce
#     nonceBase(16) || senderID(1) || counter(3 BE), HKDF at line ~647 with the
#     32-byte salt, IKM = 0x02 || clientRandom(12) || serverRandom || satTag(16),
#     HKDF info "session key", 32-byte output split 16 key / 16 nonce base.
#   defpackage/ej.java  — pairing: {1:2,2:1,16:{0:1,1:0}} start, SPAKE via r33,
#     timestamp proof under EAX key K[0:16] with 1-byte nonces 0x00/0x01,
#     {1:3,2:2,16:{0:sessionID,1:commitment,2:encTimestamp}}, CAT/SAT from
#     {17:{0:blob}} decrypted as CBOR {0:CAT, 1:SAT}.
#   defpackage/r33.java — SPAKE2/P-224: passwordHash = BigInteger(SHA256(pin)[0:28]),
#     P-224 params, blinding points KM=4D48C8EA.../6C185CAB... and
#     KN=0B1CFC6A.../3E14F629..., 56-byte affine x||y commitments.
#   defpackage/x2.java, defpackage/bk.java — access-code CRUD CBOR structures.
#   com/allegion/leopard/api/bridge/commission/model/WifiPayload.java —
#     legacy (3.x) WiFi commissioning encryption: SHA-256(secret + "|" + id[6:]),
#     AES/CBC/NoPadding, zero IV, be64(counter) || JSON({ssid,password}),
#     zero-padded to 16.
# 6.1.0 (unobfuscated): com/google/android/apps/weave/gcd/security/
#   SpakeP224.java:51-56,143-145,185-187,326 — every SPAKE2/P-224 constant
#   (KM, KN, p, a, b, generator G), the SHA256[0:28] password hash and the
#   56-byte commitment format match 3.6.0 r33.java exactly.

device:
  name: "Schlage Smart Locks (Sense / Encode family)"
  manufacturer: "Schlage (Allegion)"
  manufacturer_status: "active"
  testing:
    status: untested
  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/huguesb/schlage-uweave"
    notes: >
      Schlage publishes no local protocol documentation; a commercial cloud API
      (developer.allegion.com) exists but excludes individual/hobbyist use and
      covers only the cloud path. Everything in this spec was recovered from
      the vendor's Android app. The Go library cited is an independent
      third-party reimplementation, not vendor documentation.
  category: "lock"
  type: "electronic_door_lock"
  protocol: "ble"
  transport: "ble-gatt"
  models:
    - "Sense (BE479)"
    - "Encode (BE489)"
    - "Encode Plus (BE499)"
    - "Encode Lever"
  notes: >
    Schlage's residential smart locks all speak the same proprietary BLE
    protocol — a uWeave-derived GATT profile carrying CBOR "Privet" RPC inside
    an AES-128-EAX session channel, paired via SPAKE2/P-224 against the lock's
    printed programming code. Once paired, every owner function works locally
    over BLE with no cloud: lock/unlock, state (battery/door/alarm), settings,
    access-code CRUD, history logs, time sync, firmware OTA, factory reset.

    The WiFi radios on the Encode family have NO local-network API: runtime
    WiFi traffic is a cloud relay (REST + MQTT-over-WebSocket against
    *.allegion.yonomi.cloud). The Encode Plus's HomeKit `_hap._udp` mDNS
    record is Apple's protocol, mutually exclusive with Schlage-mode pairing.
    Schlage Connect (BE468/BE469) is a different, Z-Wave S2 product and is
    out of scope here.

    SECURITY MODEL: the trust root is the lock's physical programming code
    (printed inside the lock, on the back of the keypad assembly / in the
    manual). Whoever has it plus BLE range can pair and gain full control.
    After pairing, the client holds two bearer macaroons (SAT/CAT); a dumped
    client database plus BLE range also grants control without the code.
    Per-session keys are properly ephemeral (fresh randoms + HKDF per
    session); the pairing-phase cipher uses fixed 1-byte nonces, which only
    matters against an eavesdropper present during the ~30 s pairing window.

    VERIFICATION: protocol facts marked `confirmed` were read directly out of
    the decompiled 3.6.0 app and agree with the Go reimplementation; they have
    not been replayed against hardware by us. See header comment.

  setup:
    required: true
    confidence: "medium"
    notes: >
      Like the Nuki spec, this lock genuinely must be provisioned: every
      command after pairing rides a session channel keyed by macaroon
      credentials (SAT/CAT) that only the pairing exchange issues. Pairing is
      SPAKE2/P-224 with the lock's printed programming code as the password —
      physical possession of the inside of the lock, not mere proximity, is
      what authorizes a new client.

      Confidence medium: the full flow was read in the decompiled app and
      matches the working Go implementation on every constant and message,
      but we have not run it against a lock ourselves.
    methods:
      - type: ble_provisioning
        description: >
          Pair over BLE: SPAKE2/P-224 with the programming code as password,
          then claim an access-control credential (CAT). Runs phases A-D once;
          later sessions resume at phase C (see top-level `initialization`).
        verified: false
        ble:
          pairing_required: false
          notes: >
            No BLE-layer bonding/pairing — all security is application-layer
            (SPAKE2 + macaroons + AES-EAX). GATT connect only.
        steps:
          - action: >
              Find the lock's programming code (printed on the label inside
              the lock / on the back of the keypad assembly, and in the
              manual). Ensure the lock is in Schlage mode, not HomeKit mode —
              HomeKit pairing is mutually exclusive with Schlage pairing and
              switching modes wipes access codes.
            actor: user
          - action: >
              Scan for the lock: unified/Schlage mode advertises the
              DataTransfer service UUID 1F6B43AA-94DE-4BA9-981C-DA38823117BD
              (AD type 0x06, 128-bit LE). Connect and discover the uWeave
              service 883f45ec-14cb-46aa-9864-9a4e782b33d0.
            actor: client
          - action: >
              Phase A — enable indications on RxData
              (26002998-e001-4812-8c08-5cd2afda0830, CCCD 00002902) and send
              the unsecured connection request control packet (control header,
              cmd 0) with crypto mode 0.
            actor: client
            expect: "Lock answers with a connection-confirm control packet (cmd 1)."
          - action: >
              Phase B — send pairing start {1:2, 2:1, 16:{0:1, 1:0}}
              (pairingType 1 = embedded, cryptoMethod 0 = SPAKE2/P-224).
            actor: client
            expect: "Lock replies {17:{0:sessionID, 1:serverCommitment(56B)}}."
          - action: >
              Compute SPAKE2/P-224: passwordHash = BigInteger(SHA256(
              UTF-8 programming code)[0:28]); random 28-byte x; client
              commitment T = x*G + passwordHash*KM serialized as 56-byte
              affine x||y (no prefix); shared key K = x*(S - passwordHash*KN);
              pairing-phase AES key = K[0:16]. Encrypt CBOR {0:unixTimeSec}
              with AES-128-EAX (96-bit tag) under K[0:16] using fixed 1-byte
              nonce 0x00, and send {1:3, 2:2, 16:{0:sessionID,
              1:clientCommitment, 2:encryptedTimestamp}}.
            actor: client
            expect: >
              Lock replies {17:{0:blob}}; decrypt with nonce 0x01 to CBOR
              {0:CAT, 1:SAT} — the long-term bearer credentials. Persist both.
          - action: >
              Phase C — secure connection request: control header +
              negotiation with crypto mode 2 (TOKEN_SHA256), followed by a raw
              12-byte clientRandom. On the lock's reply, take serverRandom
              (bytes [5:]), attenuate the SAT with caveat 0x14
              (authentication_challenge) = HMAC-SHA256(key=satTag,
              CBOR_bstr(0x14 || CBOR_bstr(1 || clientRandom || serverRandom)))
              truncated to 16 bytes, and send the extended SAT. Verify the
              lock's matching HMAC for value 2, then derive session keys:
              IKM = 0x02 || clientRandom(12) || serverRandom(12) || satTag(16);
              HKDF-SHA256(salt=008A393622041F5F0FC75D97DAEE6E81CBBB2BC74F9C
              CC91E75E77A56B4A4B05, ikm) expand(info="session key", 32);
              first 16 bytes = AES-128 session key, last 16 = nonce base.
            actor: client
          - action: >
              Phase D — authorize with the CAT {1:5, 2:3, 16:{0:1, 1:0,
              2:CAT}} (pairing mode), then claim access control {1:24, 2:4} →
              lock returns the new CAT → confirm {1:25, 2:5, 16:{0:CAT}}.
              Housekeeping: set timezone (trait 5 prop 20), DST, read
              serial/model/firmware. Store {sat, cat, userId, model, serial,
              mac, firmware}.
            actor: client
            expect: "Lock accepts commands over the encrypted session channel."
        timing:
          notes: >
            The app posts a response watchdog per command: 3000 ms for most
            commands, 15000 ms for the lock/unlock command (motor runtime).
      - type: cloud_account
        description: >
          OPTIONAL vendor path — the Schlage Home app additionally onboards
          WiFi locks to the vendor cloud (JITR). Not required for local BLE
          control. See the top-level `cloud` block for what stays
          cloud-dependent.
        verified: false
        cloud:
          local_alternative: >
            Yes, and it is the primary path: the `ble_provisioning` method
            above onboards the lock with nothing but the printed programming
            code, after which every owner function runs over the encrypted
            uWeave GATT channel. See `local_access` (status: native) for the
            covered surface. This cloud_account step is additive, for remote
            access on WiFi models.
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: >
        Factory default reset is available over the protocol itself
        (trait 3, op 3 — see the factory_reset command, flagged advanced) and
        clears access codes, paired credentials and configuration; the lock
        must be re-paired afterwards. The physical button sequence is
        documented by Schlage per model and is not reproduced here — consult
        the vendor manual for the specific lock.
      procedures:
        - name: "Protocol reset over BLE (documented here)"
          steps:
            - action: >
                Pair or resume a session as an owner, then send the
                `factory_reset` command — {1:8, 2:2, 16:{0:3, 1:3}} — on the
                uWeave GATT channel.
              actor: "client"
              notes: >
                Flagged `advanced` in the command table: it clears access
                codes, paired credentials and configuration.
            - action: >
                Re-pair with the printed programming code before the lock can
                be used again.
              actor: "user"
              notes: >
                Recovery is physical — open the lock and read the programming
                code off the label.
        - name: "Vendor button sequence (per model, not reproduced here)"
          steps:
            - action: >
                Follow the reset sequence in the Schlage manual for the
                specific lock model.
              actor: "user"
              notes: >
                Listed so the physical path is not mistaken for absent; the
                per-model steps are vendor documentation and are deliberately
                not guessed at here.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        A previously paired client rejoins with its stored SAT/CAT by running
        only phase C (fresh randoms → new session keys); no re-pairing and no
        reset. One active BLE session at a time: while a third-party client is
        connected, the Schlage app falls back to its cloud path.
    credentials:
      wifi_passphrase_protection: "device_encrypted"
      stored_on_device:
        - "SPAKE2 verifier state derived from the printed programming code"
        - "Issued CAT/SAT macaroons for paired clients"
        - "Access codes and schedules"
      issued_to_client:
        - "CAT (Client Authorization Token) macaroon — bearer credential"
        - "SAT (Server Authentication Token) macaroon — used to derive per-session keys"
      notes: >
        The pairing secret is the lock's printed programming code; it never
        crosses the link in cleartext (SPAKE2 password). Macaroons are CBOR
        bstr(array(N) bstr(caveat_1)...bstr(caveat_N) bstr(mac_tag)) with the
        tag an HMAC-SHA256 chained over caveats, truncated to 16 bytes;
        attenuation appends a caveat and recomputes the tag. WiFi credentials
        pushed to the lock go over the encrypted session channel; the legacy
        3.x app additionally wrapped the WiFi payload in AES/CBC with
        key = SHA-256(secret + "|" + id[6:]) and a zero IV (verified in
        WifiPayload.java). On 6.x the lock's cloud identity ("payload0" JITR
        blob) is minted by the vendor's factory service and pushed over BLE —
        see `cloud`.

  identification:
    service_uuids:
      - "1f6b43aa-94de-4ba9-981c-da38823117bd"   # advertised (AD 0x06) in Schlage/unified mode
    notes: >
      Schlage/unified-mode locks advertise the firmware DataTransfer service
      UUID in the scan record (report: scan bytes [3..21) = 11 06 followed by
      the UUID little-endian; commissioned locks set scan-response byte 55 =
      0x82 — reported, not re-derived here). The uWeave service itself
      (883f45ec-...) is NOT advertised; it is discovered after connect. Locks
      in HomeKit mode instead advertise the complete local name "SENSE  "
      (with trailing spaces) and speak Apple HAP — a different, mutually
      exclusive mode.

  discovery:
    # Three match rules, ordered by what has actually been seen on hardware.
    # The one commissioned lock captured on 2026-08-14 advertised NO service
    # UUIDs at all — a scanner filtering only on the DataTransfer UUID would
    # have missed it — but it did carry the Allegion company ID and a
    # serial-bearing local name. See evidence.live_hardware.
    methods:
      - type: "ble_scan"
        ble:
          manufacturer_data:
            company_id: 315
            description: >
              Allegion. The single hardware-observed signal: the captured
              advertisement carried manufacturer data under this company ID
              (payload embeds a MAC) and nothing else identifying. Company ID
              alone is a family match, not a model match.
        notes: >
          Observed 2026-08-14 on a commissioned lock. Prefer this filter: it
          is independent of both the rotating BLE address and the advertising
          mode.
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "SCHLAGE"
        notes: >
          Complete local name "SCHLAGE" followed by 8 uppercase hex digits (a
          serial-looking suffix), observed 2026-08-14. This full string — not
          the prefix — is the lock's stable identity; see `identity` below.
      - type: "ble_scan"
        ble:
          service_uuids:
            - "1f6b43aa-94de-4ba9-981c-da38823117bd"
        notes: >
          Unified/Schlage-mode advertisement as documented by the app (AD
          0x06) — reported, and NOT observed on the one commissioned lock
          captured here, which advertised no service UUIDs. Kept as a match
          rule because uncommissioned locks are expected to advertise it.
          HomeKit-mode locks are found by local name 'SENSE  ' instead, and
          speak HAP rather than anything in this spec.
    identity:
      # NOT the BLE address. Both lock addresses seen on 2026-08-14 had the
      # locally-administered bit set — these are random-static addresses,
      # which the lock may rotate at any time. Keying on one means a client
      # either loses a lock it already knows or enrols the same lock twice.
      stable_keys: ["local_name"]
      display: "local_name"
      notes: >
        `local_name` is the full advertised string "SCHLAGE<8 hex digits>";
        the hex suffix is serial-derived and is what makes the name identity
        rather than a family label — match the WHOLE string, never the
        "SCHLAGE" prefix that discovery scans on. The BLE address is an
        ephemeral connection locator only: use whatever address the most
        recent advertisement carried to connect, and re-resolve it by scanning
        after a failure rather than persisting it. A HomeKit-mode lock
        advertises the constant name "SENSE  " (trailing spaces), which is a
        mode label shared by every such unit and therefore no identity at all
        — but such a lock speaks HAP, not this spec, so it is out of scope
        here rather than a gap in these keys. The Allegion manufacturer-data
        payload (company ID 315) embeds a MAC and may prove to be a better key
        still; it is not used here because whether that MAC is the stable
        public address or the rotating one it advertises with is unresolved —
        the HCI-snoop session in evidence.follow_up should settle it.
    static_ip_required: false

  variants:
    - model: "Sense (BE479)"
      identification:
        service_uuids:
          - "1f6b43aa-94de-4ba9-981c-da38823117bd"
      notes: >
        BLE-only lock (optional BR400 WiFi adapter, commissioned via its own
        softAP; commissioning-only, not a runtime channel). Also speaks Apple
        HAP-over-BLE in HomeKit mode — mutually exclusive with Schlage mode.
        Codename MARLIN in the app. Firmware OTA block/packet 1024/128.
        The BR400 itself deserves a caveat: the 3.6.0 app speaks to it over
        an UNAUTHENTICATED LAN HTTP API (mDNS _http._tcp; bridge/info,
        bridge/ble/scan, and POST bridge/update_mcu accepting an arbitrary
        firmware URL over plain HTTP) — accessory-scoped, not present on
        Encode-family locks; see research-notes/schlage-wifi-local-surface.md.
    - model: "Encode (BE489)"
      identification:
        service_uuids:
          - "1f6b43aa-94de-4ba9-981c-da38823117bd"
      notes: >
        WiFi + BLE. WiFi runtime is cloud relay only; BLE is the local path.
        Codenames LEOPARD/DENALI. CAT minting for non-owner users goes
        through the vendor CatStar service (cloud).
    - model: "Encode Plus (BE499)"
      identification:
        service_uuids:
          - "1f6b43aa-94de-4ba9-981c-da38823117bd"
      notes: >
        WiFi + BLE + Thread + NFC (Apple Home Key). Codename JACKALOPE, FCC
        ID XPB-JACKALOPE (Silicon Labs MGM12P/EFR32MG12 BLE+Thread module,
        NXP NFC frontend). HomeKit over Thread/BLE available; the only
        Schlage lock observed to advertise mDNS (_hap._udp, Apple's
        protocol).
    - model: "Encode Lever"
      identification:
        service_uuids:
          - "1f6b43aa-94de-4ba9-981c-da38823117bd"
      notes: >
        WiFi + BLE lever variant of Encode. Feature-toggled in app 3.6.0
        ("encode_lever": false); later versions enable it. Same uWeave stack.

initialization:
  # Per-connection handshake (session resumption, phase C of pairing). Runs on
  # EVERY connect for an already-paired client. Byte sequences are dynamic
  # (fresh randoms per session), so steps are described procedurally rather
  # than as fixed `write` arrays; `characteristic` names the GATT endpoint.
  - characteristic: "26002998-e001-4812-8c08-5cd2afda0830"  # RxData
    read: true
    description: "Enable indications on RxData (CCCD 00002902-0000-1000-8000-00805f9b34fb) before anything else."
  - characteristic: "ff530c78-cd50-4bb9-bbd4-0712f32b3796"  # TxData
    description: >
      Send secure connection request: control header (0x80 | counter<<4 | cmd 0)
      + negotiation (min/max protocol version, max packet size, crypto mode
      0x02 = TOKEN_SHA256) + raw 12-byte clientRandom. Await connection
      confirm (cmd 1); serverRandom = response bytes [5:].
  - characteristic: "ff530c78-cd50-4bb9-bbd4-0712f32b3796"  # TxData
    description: >
      Send SAT extended with the authentication_challenge caveat (0x14, HMAC
      over 1 || clientRandom || serverRandom keyed by satTag, truncated to 16
      bytes). Verify the lock's matching HMAC for value 2.
  - characteristic: "ff530c78-cd50-4bb9-bbd4-0712f32b3796"  # TxData
    description: >
      Derive session keys (HKDF-SHA256, salt 008A3936...4B05, IKM 0x02 ||
      clientRandom || serverRandom || satTag, info "session key", 32 bytes =
      16 key + 16 nonce base), then authorize: {1:5, 2:1, 16:{0:2, 1:0,
      2:CAT}} (token mode; post-pairing sessions use authMode 2).
  - characteristic: "ff530c78-cd50-4bb9-bbd4-0712f32b3796"  # TxData
    description: >
      Session is up. All further traffic: whole CBOR messages AES-128-EAX
      encrypted (96-bit tag, no AAD; nonce = nonceBase(16) || senderID(1) ||
      counter(3 BE); client senderID 0x01, lock 0x03; counters from 1 per
      session), then fragmented into 20-byte writes.

services:
  - uuid: "883f45ec-14cb-46aa-9864-9a4e782b33d0"
    name: "uWeave Profile (Schlage local control)"
    notes: >
      The local data path for all lock functions. From
      res/raw/sense_gatt_profile.json (byte-identical in app 3.6.0 and 6.1.0;
      the resource is parsed at runtime into a nickname→UUID map). Not
      advertised — discovered after GATT connect. No MTU negotiation: default
      ATT MTU 23, every write is 1 header byte + up to 19 payload bytes.
      Header = (packetCounter mod 8) << 4 | flags; flags 0x8 FIRST,
      0x0 CONTINUATION, 0x4 LAST, 0xC SINGLE; control packets set bit 7 with
      the command number in the low nibble (cmd 0 = connection request,
      cmd 1 = connection confirm). Max message block 1024 bytes. Reassembly
      mirrors this on indications.
    characteristics:
      - uuid: "26002998-e001-4812-8c08-5cd2afda0830"
        name: "RxData (lock → client)"
        properties: ["indicate"]
        notes: >
          Indications carry fragmented, AES-128-EAX-encrypted CBOR responses
          (and, during pairing, the plaintext handshake replies). Enable via
          CCCD 00002902-0000-1000-8000-00805f9b34fb before the connection
          request.
      - uuid: "ff530c78-cd50-4bb9-bbd4-0712f32b3796"
        name: "TxData (client → lock)"
        properties: ["write"]
        notes: >
          All commands are CBOR "Privet" RPC envelopes, AES-128-EAX encrypted
          under the session key once paired, then fragmented (see service
          notes). Envelope: request {1:apiId, 2:requestTypeId, 16:{trait,
          property, data}}; success result at key 17 (often nested 17→17);
          error code at key 3 → 4. apiIds: 2=pairing start, 3=pairing
          confirm, 5=auth(CAT), 6=state query, 8=trait/property RPC,
          24=claim, 25=claim confirm. Key 2 is a fixed per-command constant
          (1=DST write, 2=check/FDR/delete, 3=pairing-CAT/list-check/
          history-read/state, 4=reads/WiFi/claim, 5=deleteAll/claim-confirm/
          JITR, 7=writes). Traits: 1=LockData, 3=History/DeviceMgmt,
          4=AccessCodes, 5=LockConfig, 6=WiFi.
        commands:
          lock_unlock:
            description: >
              Lock or unlock the bolt. CBOR {1:8, 2:7, 16:{0:1, 1:0, 2:{0:
              stateOrdinal, 1:userId(8B big-endian)}}}. stateOrdinal: 0 =
              unlock, 1 = lock (lockState enum: 0=unlocked, 1=locked,
              2=jammed, 3=unknown, 4=motorJammed, 5=passage, 6=deadlocked).
            verification: "confirmed"
          lock_state:
            description: >
              Query full lock state. CBOR {1:6, 2:3} → result keys: 0=status,
              12=batteryState, 14=alarmEnabled, 21=batteryLevel, 25=doorState
              (0=unknown, 1=open, 2=closed, 3=faulty).
            verification: "reported"
          read_info:
            description: >
              Read device info. CBOR {1:8, 2:4, 16:{0:1, 1:P}} with P:
              2=manufacturer, 3=model, 4=serial, 5=main firmware, 7=current
              time, 12=battery, 15=extended firmware versions.
            verification: "confirmed"
          set_time:
            description: "Set lock clock: saveData trait 1 prop 6 (unix seconds)."
            verification: "reported"
          read_settings:
            description: >
              Read lock configuration (trait 5): 3=beeper, 5=autoLockTime,
              9=alarmMode, 11=alarmSensitivity, 13=lockAndLeave,
              15=codeLength, 21=timezone, 27=opMode (0=Schlage BLE only,
              1=simultaneous BLE+Matter on supported hardware).
            verification: "reported"
          write_settings:
            description: >
              Write lock configuration (trait 5): 2=beeper, 4=autoLockTime,
              8=alarmMode, 10=alarmSensitivity, 12=lockAndLeave.
            verification: "reported"
          set_timezone_dst:
            description: >
              Timezone: trait 5 prop 20 (minutes offset). DST window:
              {1:8, 2:1, 16:{0:5, 1:18, 2:{0:1, 1:start, 2:end}}}.
            verification: "reported"
          set_access_code_length:
            description: >
              Set keypad code length: {1:8, 2:2, 16:{0:5, 1:14, 2:{0:len}}}.
            verification: "confirmed"
          save_access_code:
            description: >
              Add or update an access code: {1:8, 2:3, 16:{0:4, 1:(0=add |
              4=update), 2:{0:userUuid(8B BE), 1:name, 2:code, 3:schedule1,
              4:schedule2, 5:blocked, 6:startEpoch, 7:endEpoch}}}.
            verification: "confirmed"
          delete_access_code:
            description: "Delete one access code: {1:8, 2:2, 16:{0:4, 1:1, 2:{2:code}}}."
            verification: "confirmed"
          delete_all_access_codes:
            description: "Delete every access code: {1:8, 2:5, 16:{0:4, 1:2}}."
            verification: "confirmed"
            advanced: true
            advanced_reason: >
              Wipes all keypad access codes at once; household members who
              rely on codes are locked out until codes are re-added. Codes
              can be re-created with save_access_code afterwards — nothing
              else is lost.
          list_access_codes:
            description: >
              Two-step: check {1:8, 2:3, 16:{0:4, 1:6, 2:{0:0}}} then read
              {1:8, 2:4, 16:{0:4, 1:5}}; paged, moreAvailable at key 0x0A.
            verification: "reported"
          read_history:
            description: >
              Download event log. Two-step: check {1:8, 2:2, 16:{0:3, 1:0,
              2:{0:0}}} then read batches {1:8, 2:3, 16:{0:3, 1:batchSize}}.
            verification: "reported"
          factory_reset:
            description: "Factory default reset: {1:8, 2:2, 16:{0:3, 1:3}}."
            verification: "reported"
            advanced: true
            advanced_reason: >
              Clears access codes, paired credentials and configuration; the
              lock must be re-paired (programming code required) before it
              can be used again. Recovery is physical: open the lock, read
              the programming code off the label, re-pair.
          set_wifi_credentials:
            description: >
              Push WiFi credentials: {1:8, 2:4, 16:{0:6, 1:0, 2:{0:ssid,
              1:password, 2:security}}}. The security enum is hardcoded to 1
              in the 3.6.0 app (fj.java:102). Only meaningful for WiFi
              models; the lock's cloud identity (payload0) must already
              exist — see `cloud`.
            verification: "reported"
          wifi_jitr_payload0:
