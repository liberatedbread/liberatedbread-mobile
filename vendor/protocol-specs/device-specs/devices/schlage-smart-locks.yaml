cloud:
  required: false
  vendor_service: "Schlage cloud (Yonomi platform, Allegion)"
  hosts:
    - "https://api.allegion.yonomi.cloud"      # consumer REST /v1 + MQTT-over-WSS realtime
    - "https://catstar.allegion.yonomi.cloud"  # CAT minting (Encode family, non-owner users)
    - "https://factory.allegion.yonomi.cloud"  # JITR "payload0" identity minting
    - "https://api.allegionengage.com"         # firmware metadata/binaries
  auth:
    type: "other"
    notes: >
      AWS Cognito SRP user-pool login (region us-west-2) plus an
      X-Api-Key header on REST. Shape only — the app-embedded API key and
      Cognito client secret are vendor client credentials and are
      deliberately not recorded here. TLS pinning on *.yonomi.cloud (Amazon
      Root CA 1-4 in network_security_config.xml).
    verification: "confirmed"
  endpoints:
    - path: "/v1/ (REST, device list/state/commands)"
      method: "GET"
      returns: "Account devices and shadow state; commands are semantically identical to the BLE CBOR commands."
      verification: "reported"
    - path: "payload0?deviceType=...&physicalId=<serial> (factory service)"
      method: "GET"
      returns: "Encrypted JITR identity blob ('payload0') that onboards a WiFi lock to AWS IoT."
      verification: "reported"
  failure_mode: >
    Partial loss only. Day-to-day local control (lock/unlock, codes, logs,
    settings over BLE) is unaffected. What stops without the vendor cloud:
    remote/out-of-BLE-range access, push notifications, first-time WiFi
    onboarding of Encode-family locks (payload0/JITR minting), CAT minting
    for non-owner users on non-Sense locks, firmware metadata/binaries, and
    multi-user invites.
  data_leaves_device:
    - "lock/unlock and alarm event history (access log — personal data about household members' comings and goings)"
    - "access-code names and schedules"
    - "device telemetry (battery, firmware, WiFi diagnostics)"
  notes: >
    The WiFi path is a pure cloud relay: no local REST server, no open port,
    no SSDP; the only mDNS observed on a LAN is the Encode Plus's HomeKit
    _hap._udp record (Apple's protocol, mutually exclusive with Schlage
    mode). Exhaustive search of the app found no LAN runtime path to any
    lock — no local WiFi API exists to document.

local_access:
  status: "native"
  summary: >
    Full local control over BLE as shipped — pair once with the printed
    programming code (SPAKE2), then all owner functions run over the
    encrypted uWeave GATT channel with no cloud dependency.
  covers:
    - "lock/unlock and state (battery, door, alarm) over BLE"
    - "access-code add/update/delete/list over BLE"
    - "history/event log download over BLE"
    - "settings (beeper, auto-lock, alarm, lock-and-leave), time/timezone/DST over BLE"
    - "firmware OTA over BLE (image bytes still come from the vendor cloud)"
    - "factory reset over BLE (advanced)"
  not_covered:
    - "first-time WiFi onboarding of Encode-family locks — payload0/JITR blob is minted by the vendor factory cloud"
    - "CAT minting for non-owner users on non-Sense locks (CatStar service)"
    - "firmware metadata and binaries"
    - "out-of-range access, push notifications, multi-user invites — inherently the vendor cloud or an owner-built bridge"
  notes: >
    A working third-party client exists: github.com/huguesb/schlage-uweave
    (Go). pyschlage (github.com/dknowles2/pyschlage) covers the cloud API
    and backs the Home Assistant schlage integration; a local BLE
    integration can be built from this spec.

protocol:
  framing:
    byte_order: "big_endian"
    notes: >
      uWeave fragmentation: no MTU negotiation (ATT MTU 23). Every GATT
      write/indication = 1 header byte + ≤19 payload bytes. Header: bits 6-4
      = packet counter (mod 8), bit 3 = FIRST, bit 2 = LAST (0xC = single
      packet, 0x0 = continuation), bit 7 set = control packet with the
      command in the low nibble (0 = connection request, 1 = connection
      confirm). Max reassembled block 1024 bytes. Whole CBOR messages are
      encrypted first, then fragmented; on receive, reassemble then decrypt.
  encryption:
    algorithm: "aes-128-eax"
    key_derivation: "handshake"
    notes: >
      AES-128-EAX (96-bit truncated tag, no AAD). Session nonce =
      nonceBase(16) || senderID(1) || counter(3, big-endian); client→lock
      senderID 0x01, lock→client 0x03; counters start at 1 per session.
      Session keys per connection: IKM = 0x02 || clientRandom(12) ||
      serverRandom(12) || satTag(16); HKDF-SHA256 extract with the fixed
      32-byte salt 008A393622041F5F0FC75D97DAEE6E81CBBB2BC74F9CCC91E75E77A5
      6B4A4B05, expand(info="session key", 32) → [0:16] AES key, [16:32]
      nonce base. The one-shot PAIRING phase instead uses AES-EAX under
      K[0:16] (SPAKE2 shared key) with fixed 1-byte nonces (0x00 client→lock,
      0x01 lock→client) — no replay protection there beyond the encrypted
      timestamp.
  pairing:
    description: >
      SPAKE2 over P-224 (Google GCD/Weave construction). Password = the
      lock's printed programming code: passwordHash =
      BigInteger(SHA256(UTF-8 code)[0:28]). Client commitment T = x*G +
      passwordHash*KM, serialized as 56-byte affine x||y (no prefix byte).
      Shared key K = x*(S - passwordHash*KN). Blinding points (P-224, hex):
      KM = (4D48C8EA8D23392E07E851FA6AA82048094E051372499C6FBA62A74B,
      6C185CABD52E2E8A9E2D21B0EC4EE141211FE29D64EA4D04463AE833); KN =
      (0B1CFC6A407CDCB15DC1704CD13EDAAB8FDEFF8CFBFB50D2C81DE2C2,
      3E14F62996080907B56DD282071AA7A121C39934BC30DA5BCBC6A3CC). Curve is
      NIST secp224r1 (p = FFFFFFFF...FF000000000000000000000001, generator
      B70E0CBD.../BD376388...). On success the lock issues CAT + SAT
      macaroons (CBOR bstr(array of caveat bstrs + 16-byte truncated
      HMAC-SHA256 tag)). Constants confirmed in BOTH app versions: the
      unobfuscated 6.1.0
      com/google/android/apps/weave/gcd/security/SpakeP224.java
      (:51-56,143-145,185-187,326) matches the obfuscated 3.6.0 r33.java on
      every constant above (app-confirmed ×2, not hardware-tested).
  message_format:
    description: >
      CBOR "Privet" RPC. Request {1:apiId, 2:requestTypeId, 16:{trait,
      property, data}}; success at key 17 (frequently nested 17→17); error
      map at key 3 with code at 3→4. apiIds 2/3 pairing, 5 auth, 6 state,
      8 trait/property RPC, 24/25 access-control claim. Traits 1 LockData,
      3 History/DeviceMgmt, 4 AccessCodes, 5 LockConfig, 6 WiFi. See the
      per-command table on the TxData characteristic.

# Entities: the mobile/HA entity enum has no `lock` platform today, so no
# entities block — the lock entity would map state from the lock_state
# command (result keys 0/12/14/21/25) and commands to lock_unlock.

evidence:
  live_hardware:
    date: "2026-08-14"
    environment: >
      BlueZ hci0 + Python bleak on the owner's LAN (10.69.0.0/16); three
      Schlage locks on site (front / kitchen / laundry doors), all
      commissioned and in daily use. Strictly read-only mission: BLE
      scanning and LAN discovery only. No pairing was attempted (SPAKE2
      needs the printed programming code), nothing was written to any
      lock, no state-changing command was sent.
    ble_observations:
      - >
        One lock was captured advertising exactly once at the start of the
        session: complete local name "SCHLAGE" followed by 8 uppercase hex
        digits (serial-looking suffix), Bluetooth address beginning B7:AC:C2
        (recorded partially here on purpose — this is a security device),
        RSSI -74 dBm, and manufacturer data under Bluetooth company ID 315
        ("Allegion" per registries/bluetooth-company-ids.tsv) whose payload
        embeds a MAC address. That address prefix is NOT a vendor OUI: the
        locally-administered bit is set, so this is a random-static address
        the lock may rotate (see follow_up) — which is why
        discovery.identity keys on the local name instead. Whether the MAC
        inside the manufacturer payload is the stable public address or a
        copy of the rotating one was not determined.
      - >
        That captured advertisement contained NO service UUIDs at all —
        specifically NOT the DataTransfer UUID
        1f6b43aa-94de-4ba9-981c-da38823117bd that this spec says
        Schlage-mode locks advertise (AD 0x06). Single sample from a
        commissioned, in-use lock; the spec already notes (reported) that
        commissioned locks change their advertising bytes, so this is
        recorded as "not observed", not as a refutation.
      - >
        Roughly 75 minutes of subsequent scanning (several bleak scans, a
        20-minute watcher armed to auto-connect, bluetoothctl) captured
        zero further advertisements from any of the three locks: idle
        Schlage locks advertise very rarely (they appear to sleep until
        woken, e.g. by keypad touch). GATT enumeration therefore did NOT
        happen — BlueZ refuses to connect to a device it cannot
        rediscover ("Device not available") and the seen lock never
        re-announced. The GATT service table in this spec remains
        app+Go-library-derived, not hardware-observed.
      - >
        No lock was observed advertising the HomeKit-mode complete local
        name "SENSE  " (trailing spaces) or any Apple HAP BLE signature:
        no unit on site was in HAP-over-BLE mode at scan time —
        consistent with all three being commissioned in Schlage mode (or
        simply asleep).
    lan_observations:
      - >
        Full mDNS enumeration (avahi-browse -a): no Schlage/Allegion
        service instance of any kind, and no _hap._udp record on the LAN
        — no Encode Plus here is in HomeKit mode. Consistent with the
        spec's claim that Schlage-mode locks emit no mDNS and that
        _hap._udp is HomeKit-only.
      - >
        SSDP M-SEARCH (ssdp:all): the only responders were Roku, Hue and
        Synology devices — nothing Schlage. The ARP/neighbor table
        contains no Schlage/Allegion OUI (none exists in
        registries/ieee-oui.tsv), so lock IP addresses could not be
        identified and no port scan was possible. This is consistent
        with — but not positive proof of — the claim that Encode-family
        WiFi has no local API: the locks make no discovery announcements
        on the LAN at all.
      - >
        Follow-up full-/16 census (same day, ~88 live hosts resolved by
        ping/ARP with OUI lookups against registries/ieee-oui.tsv, then
        bounded port scans of every module-vendor candidate): no host
        identifiable as a Schlage lock. Candidates resolved to other
        devices — the Murata-module host is a Rachio controller (TLS cert
        says so), the FN-LINK-module host is a Chamberlain myQ garage
        controller (MYQ-G0401) serving an unauthenticated WiFi-setup
        page, the Gaoshengda-module hosts are a Roku TV (ECP on 8060)
        and an IPv6-only neighbor, the TI-module host runs SSH. Locks
        that only dial out to the cloud are indistinguishable from any
        other silent host here — consistent with the app-level finding
        (2026-08, com.allegion.leopard 3.6.0) that the lock never hosts
        a softAP and the app never opens a socket to a lock: runtime
        WiFi is outbound REST + MQTT-over-WSS only.
    claims_checked:
      - claim: "Schlage-mode locks advertise DataTransfer UUID 1f6b43aa-94de-4ba9-981c-da38823117bd (AD 0x06)"
        result: "not observed — the one captured advertisement (commissioned lock) carried no service UUIDs"
      - claim: "locks are identifiable over BLE in Schlage mode"
        result: "confirmed in principle — one lock observed advertising name 'SCHLAGE' + serial-looking hex suffix, Allegion company ID 315 in manufacturer data"
      - claim: "Sense can sit in HAP-over-BLE mode (name 'SENSE  '), mutually exclusive with uWeave"
        result: "not observed — no lock in HomeKit BLE mode on site"
      - claim: "Encode-family WiFi has no local API; the only mDNS is the Encode Plus's HomeKit _hap._udp"
        result: "consistent — no Schlage mDNS or SSDP service of any kind observed on the LAN"
      - claim: "uWeave GATT profile 883f45ec-14cb-46aa-9864-9a4e782b33d0 is present after connect"
        result: "untested — the lock never re-advertised, so no GATT connection could be made"
    follow_up: >
      Two radio-behavior findings from the awake-window attempts (also
      2026-08-14): both observed lock addresses carry the
      locally-administered bit — the locks use random-static BLE addresses
      that can rotate, so any watcher must key on the Allegion
      manufacturer-data company ID 315 or the SCHLAGE local name, never a
      fixed MAC; and a keypad touch did NOT reliably produce an
      advertisement at the scanner (two presses, nothing heard, on a link
      previously measured at -74/-89 dBm) — which wake action opens the
      BLE window on a commissioned lock is itself still unknown. The
      productive next step is therefore an on-device capture: HCI snoop on
      a phone running the Schlage Home app through a pairing and a session,
      rather than more blind scanning. A clean-room Python port of the full
      uWeave client stack (fragmentation, SPAKE2/P-224, AES-128-EAX, HKDF,
      Privet CBOR), built for the pairing attempt and cross-checked against
      the Go reference, is preserved uncommitted in
      workspace/schlage-verify/ for that future session. User
      disambiguation is needed to map the advertised "SCHLAGE<hex>" name to
      the front/kitchen/laundry doors.

sources:
  - type: "apk_decompilation"
    apk: "com.allegion.leopard 3.6.0 (sha256 73ad73952f585fb6fcc4d5f31a503c65903a1714077afc62781c6e6b1248219c) and 6.1.0 (sha256 0e87604de5e12f650badea5539ea0765f4b7ea5e29206db02b9cb1404631abdd), APKPure via apkeep"
    decompiler: "jadx 1.5.1"
    key_files:
      - "res/raw/sense_gatt_profile.json (uWeave UUIDs; identical 3.6.0/6.1.0)"
      - "res/raw/firmware_gatt_profile.json (OTA UUIDs; identical 3.6.0/6.1.0)"
      - "3.6.0: defpackage/ou2.java (session, fragmentation, HKDF salt, EAX nonce)"
      - "3.6.0: defpackage/ej.java (pairing phases), defpackage/r33.java (SPAKE2/P-224)"
      - "3.6.0: defpackage/x2.java, defpackage/bk.java (access-code CBOR)"
      - "3.6.0: com/allegion/leopard/api/bridge/commission/model/WifiPayload.java (legacy WiFi commissioning crypto)"
      - "6.1.0: com/google/android/apps/weave/gcd/security/SpakeP224.java (SPAKE2/P-224 constants, unobfuscated; every pairing constant matches 3.6.0)"
      - "6.1.0: res/xml/network_security_config.xml (TLS pinning: yonomi.cloud, Amazon Root CA 1-4)"
  - type: "public_implementation"
    url: "https://github.com/huguesb/schlage-uweave"
    description: "Independent Go reimplementation of the full BLE stack; agrees with the APK extraction on every constant checked."
  - type: "public_implementation"
    url: "https://github.com/dknowles2/pyschlage"
    description: "Python client for the Schlage cloud API (not the BLE path); backs the Home Assistant schlage integration."
