# Nuki Smart Lock — Device Spec (BLE)
# Reverse-engineered from io.nuki APK v2026.7.1 (jadx decompilation)
# Cross-referenced with public Nuki BLE API docs at developer.nuki.io
#
# APK SHA-256: b737cd2f... (114 MB, 26,111 classes)
# Key source files: BleConstants.java, BleResponse.java, KeyturnerStatesResponse.java,
#   LockState.java, LockAction.kt, Utils.kt, ErrorReportResponse.java

device:
  name: "Nuki Smart Lock"
  manufacturer: "Nuki Home Solutions GmbH"
  manufacturer_status: "active"
  testing:
    status: untested
  category: "lock"
  type: "electronic_door_lock"
  protocol: "ble"
  transport: "ble-gatt"
  models:
    - "Smart Lock 1.0"
    - "Smart Lock 2.0"
    - "Smart Lock 3.0"
    - "Smart Lock 4.0"
    - "Smart Lock Pro"
    - "Smart Lock Ultra"
    - "Smart Lock (5th gen)"
    - "Smart Lock Pro (5th gen)"
    - "Smart Lock Go"
  notes: >
    The Nuki Smart Lock is a retrofit electronic door lock that mounts over
    an existing Euro-profile cylinder. It communicates primarily via BLE
    with an optional WiFi bridge for remote access.

    Protocol: encrypted BLE GATT with challenge-response authentication
    (public key exchange, nonce, authorization IDs). Lock actions are
    CRC-16 authenticated. All multi-byte values are little-endian.

    The app supports multiple Nuki device types (Smart Lock, Opener, Door
    Sensor, Keypad, Fob, Box, Bridge) each with their own BLE service UUIDs
    but sharing the same command/response protocol over a GATT data
    characteristic.

    Research status: APK decompiled, full UUID map and command IDs recovered.
    Message frame format confirmed via BleResponse.java disassembly.
    Lock state enum and error codes fully enumerated.
    Pairing/auth flow understood at protocol level from public docs.
    CRC-16 implementation confirmed (CRC-16/CCITT-FALSE, poly 0x1021,
    init 0xFFFF, MSB-first, non-reflected — NOT XModem).

    Security: NCC Group's July 2022 advisory disclosed 11 CVEs in Nuki
    products, including CVE-2022-32507 (broken access controls in the BLE
    protocol) and CVE-2022-32505 (DoS via unauthenticated BLE packets),
    fixed in Smart Lock 3.0 FW >=3.3.5 and 2.0 FW >=2.12.4. Official MQTT
    and Matter-over-Thread APIs are now documented alongside BLE/Web
    (4th-gen Pro/Ultra/5th-gen support Matter; Ultra/Pro have built-in
    WiFi, no bridge needed).

  setup:
    required: true
    confidence: medium
    notes: >
      Unlike most devices in this repo, the Nuki lock genuinely must be
      provisioned before it will do anything: every command after pairing
      carries an authorization ID that only the pairing exchange can issue.
      Pairing is public-key based (CMD 3 PublicKeyRequest, CMD 4/5
      challenge-response) and gated by a security PIN the owner sets on
      first setup — 4 digits on Smart Lock 1.0-4.0, widened to 6 digits
      with Smart Lock Ultra (6-digit on Ultra/5th-gen/Go/Pro).

      The lock is put into pairing mode physically, by holding its button. That
      is deliberate: it means possession of the door, not proximity to it, is
      what authorises a new client.

      Confidence is medium — the flow is understood from the decompiled app and
      Nuki's public BLE API documentation, but has not been run against a lock
      here. Treat the step ordering as documented rather than observed.
    methods:
      - type: ble_provisioning
        description: >
          Pair over BLE by exchanging public keys, answering the
          challenge-response, and verifying the security PIN. On success the
          lock issues an authorization ID that authenticates all later commands.
        verified: false
        ble:
          pairing_required: true
        steps:
          - action: >
              Put the lock into pairing mode by holding its button until the
              ring LED indicates it is discoverable.
            actor: user
          - action: "Connect over BLE and discover the keyturner pairing service."
            actor: client
          - action: "Exchange public keys (CMD 3: PublicKeyRequest / PublicKeyResponse)."
            actor: client
          - action: >
              Complete challenge-response authentication (CMD 4:
              ChallengeResponse, CMD 5: AuthorizationAuthenticatorRequest).
            actor: client
          - action: "Enter the security PIN (4-digit on SL 1.0-4.0, 6-digit on Ultra/5th-gen/Go/Pro) when the client asks for it."
            actor: user
          - action: "Verify the PIN (CMD 32: VerifySecurityPinRequest)."
            actor: client
            expect: >
              The lock returns an authorization ID. Store it with the keypair —
              losing it means re-pairing.
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        A factory reset exists and clears authorizations, the security PIN and
        calibration — the lock must be re-taught its door afterwards. The exact
        button sequence is not established here: it is documented by Nuki per
        hardware generation and differs between Smart Lock 1.0-4.0 and Pro, and
        a guessed sequence on a door lock can leave someone locked out of their
        home. Consult Nuki's documentation for the specific model.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        A previously paired client rejoins with its stored keypair and
        authorization ID; no reset is needed. A reset is only required to revoke
        an authorization that can no longer be removed through the app — for
        example after losing the phone that held it. The optional WiFi bridge is
        provisioned separately and is not part of this flow.
    credentials:
      # No WiFi passphrase exists here: the lock is BLE-only and the optional
      # bridge handles network credentials separately. The secrets that do cross
      # this link are recorded below and in `notes`.
      wifi_passphrase_protection: not_applicable
      stored_on_device:
        - "Client public keys and their authorization IDs"
        - "Security PIN (4-digit on SL 1.0-4.0; 6-digit on Ultra/5th-gen/Go/Pro)"
      issued_to_client:
        - "Authorization ID, issued on successful pairing"
        - "Lock public key, from the key exchange"
      notes: >
        No WiFi passphrase crosses this link — the lock itself is BLE-only, and
        the separate WiFi bridge handles network credentials on its own. The
        security PIN is user-chosen and verified over the encrypted channel
        established by the key exchange.

identification:
  manufacturer_id: "Nuki"
  model_detection:
    - method: "ble_service_uuid"
      keyturner_service: "A92EE000-5501-11E4-916C-0800200C9A66"
    - method: "ble_device_name"
      patterns: ["Nuki_", "Nuki_SL_", "Nuki_Opener_", "Nuki_Door_Sensor_"]

ble:
  connection:
    transport: "le"
    phy_preference: "le_1m"
    mtu_negotiation: true
    # No verifiable preferred MTU: the app accepts any MTU 23-517
    # (C7538iv.java:1846, "mtu must be between 23 and 517"); the official BLE
    # API only notes MTU exchange is supported since FW 1.9.3/2.7.20. An
    # earlier revision stated 185 — unverifiable, dropped.
    # No BLE bonding: security is application-layer NaCl (Curve25519 DH +
    # XSalsa20-Poly1305); neither pyNukiBT nor NukiBleEsp32 bonds.
    bonding_required: false

services:
  # --- Keyturner (Smart Lock) ---
  # GATT roles corrected against the official Nuki BLE API V2.3.0 (2025-01-08):
  # A92EE000 is the Initialization Service (advertises the uninitialized
  # state, has NO characteristics of its own), A92EE100 is the Pairing
  # Service, A92EE200 is the Keyturner (command) Service with A92EE201 =
  # General Data IO (unencrypted) and A92EE202 = User-Specific Data IO
  # (encrypted). The nested list below keeps the repo's flat layout.
  # Unmapped: the app's BleConstants also carry A92DE000 (with A92DE001-DE003)
  # and A92FE000 (with A92FE001/FE002), plus the Smart Lock Ultra pairing
  # service A92EE300 — three further service prefixes with no device role
  # established here (app-derived, not hardware-verified).
  - uuid: "A92EE000-5501-11E4-916C-0800200C9A66"
    name: "Keyturner Initialization Service"
    description: "Advertises the uninitialized state; has no characteristics of its own (official BLE API V2.3.0). The entries below are the separate keyturner services/characteristics, kept here for reference."
    device: "smart_lock"
    characteristics:
      - uuid: "A92EE101-5501-11E4-916C-0800200C9A66"
        name: "Keyturner Data"
        type: "data"
        description: >
          Command/response characteristic for lock operations, configuration,
          state queries, and firmware updates. Supports write, read, notify.
        properties: ["write", "read", "notify", "indicate"]
      - uuid: "A92EE100-5501-11E4-916C-0800200C9A66"
        name: "Keyturner Pairing Service"
        type: "pairing"
        description: "Pairing service for initial authorization (SL 1-4; Smart Lock Ultra uses A92EE300 instead)"
        properties: ["write", "read", "notify"]
      - uuid: "A92EEF00-5501-11E4-916C-0800200C9A66"
        name: "Keyturner Pairing Data"
        type: "pairing_data"
        description: "Pairing data characteristic (present in the app's BleConstants; not listed in the official BLE API V2.3.0)"
        properties: ["write", "read", "notify"]
      - uuid: "A92EE200-5501-11E4-916C-0800200C9A66"
        name: "Keyturner Service (command service)"
        type: "data"
        description: "Keyturner command service per official BLE API V2.3.0 (NOT a firmware service); carries the data IO characteristics below"
        properties: ["write", "notify"]
      - uuid: "A92EE201-5501-11E4-916C-0800200C9A66"
        name: "Keyturner General Data IO"
        type: "data"
        description: "General Data IO characteristic — unencrypted command channel (official BLE API V2.3.0)"
        properties: ["write", "notify"]
      - uuid: "A92EE202-5501-11E4-916C-0800200C9A66"
        name: "Keyturner User-Specific Data IO"
        type: "data"
        description: "User-Specific Data IO characteristic — encrypted command channel (official BLE API V2.3.0); used by pyNukiBT/NukiBleEsp32"
        properties: ["write", "notify"]
      - uuid: "A92EE203-5501-11E4-916C-0800200C9A66"
        name: "Keyturner Firmware Verify"
        type: "firmware_verify"
        description: "Present in the app's BleConstants; not listed in the official BLE API V2.3.0 — role unverified"
        properties: ["write", "read"]

  # --- Keypad (paired with Keyturner) ---
  - uuid: "A92EE400-5501-11E4-916C-0800200C9A66"
    name: "Keypad Pairing Service"
    description: "Keypad pairing with parent Smart Lock"
    device: "keypad"
    characteristics:
      - uuid: "A92EE300-5501-11E4-916C-0800200C9A66"
        name: "Keypad Data Service"
        type: "data"
        properties: ["write", "read", "notify"]
      - uuid: "A92EE301-5501-11E4-916C-0800200C9A66"
        name: "Keypad Data"
        type: "data"
        properties: ["write", "read", "notify"]

  # --- Opener ---
  - uuid: "A92AE000-5501-11E4-916C-0800200C9A66"
    name: "Opener Service"
    description: "Primary GATT service for Nuki Opener (door intercom opener)"
    device: "opener"
    characteristics:
      - uuid: "A92AE101-5501-11E4-916C-0800200C9A66"
        name: "Opener Data"
        type: "data"
        properties: ["write", "read", "notify", "indicate"]
      - uuid: "A92AE100-5501-11E4-916C-0800200C9A66"
        name: "Opener Pairing Service"
        type: "pairing"
        properties: ["write", "read", "notify"]
      - uuid: "A92AEF00-5501-11E4-916C-0800200C9A66"
        name: "Opener Pairing Data"
        type: "pairing_data"
        properties: ["write", "read", "notify"]
      - uuid: "A92AE200-5501-11E4-916C-0800200C9A66"
        name: "Opener Firmware"
        type: "firmware"
        properties: ["write", "notify"]
      - uuid: "A92AE201-5501-11E4-916C-0800200C9A66"
        name: "Opener Firmware Data"
        type: "firmware_data"
        properties: ["write", "notify"]
      - uuid: "A92AE202-5501-11E4-916C-0800200C9A66"
        name: "Opener Firmware Status"
        type: "firmware_status"
        properties: ["notify", "read"]
      - uuid: "A92AE203-5501-11E4-916C-0800200C9A66"
        name: "Opener Firmware Verify"
        type: "firmware_verify"
        properties: ["write", "read"]

  # --- Door Sensor ---
  - uuid: "A92AA000-5501-11E4-916C-0800200C9A66"
    name: "Door Sensor Service"
    description: "Nuki Door Sensor — magnetic door open/close detection"
    device: "door_sensor"
    characteristics:
      - uuid: "A92AA101-5501-11E4-916C-0800200C9A66"
        name: "Door Sensor Data"
        type: "data"
        properties: ["write", "read", "notify"]
      - uuid: "A92AA100-5501-11E4-916C-0800200C9A66"
        name: "Door Sensor Pairing"
        type: "pairing"
        properties: ["write", "read", "notify"]
      - uuid: "A92AAF00-5501-11E4-916C-0800200C9A66"
        name: "Door Sensor Pairing Data"
        type: "pairing_data"
        properties: ["write", "read", "notify"]
      - uuid: "A92AA200-5501-11E4-916C-0800200C9A66"
        name: "Door Sensor Firmware"
        type: "firmware"
        properties: ["write", "notify"]
      - uuid: "A92AA201-5501-11E4-916C-0800200C9A66"
        name: "Door Sensor Firmware Data"
        type: "firmware_data"
        properties: ["write", "notify"]
      - uuid: "A92AA202-5501-11E4-916C-0800200C9A66"
        name: "Door Sensor Firmware Status"
        type: "firmware_status"
        properties: ["notify", "read"]
      - uuid: "A92AA203-5501-11E4-916C-0800200C9A66"
        name: "Door Sensor Firmware Verify"
        type: "firmware_verify"
        properties: ["write", "read"]

  # --- Standard Device Information ---
  - uuid: "0000180A-0000-1000-8000-00805F9B34FB"
    name: "Device Information Service"
    description: "Standard BLE Device Information (model, serial, firmware)"
    device: "all"
    characteristics:
      - uuid: "00002A24-0000-1000-8000-00805F9B34FB"
        name: "Model Number String"
        type: "device_info"
        properties: ["read"]
      - uuid: "00002A25-0000-1000-8000-00805F9B34FB"
        name: "Serial Number String"
        type: "device_info"
        properties: ["read"]
      - uuid: "00002A26-0000-1000-8000-00805F9B34FB"
        name: "Firmware Revision String"
        type: "device_info"
        properties: ["read"]

advertising:
  discovery_method: "ble_scan"
  local_name_prefixes:
    - "Nuki_"
    - "Nuki_SL_"
    - "Nuki_Opener_"
    - "Nuki_Door_Sensor_"
  service_uuids:
    - "A92EE000-5501-11E4-916C-0800200C9A66"   # Keyturner
    - "A92AE000-5501-11E4-916C-0800200C9A66"   # Opener
    - "A92AA000-5501-11E4-916C-0800200C9A66"   # Door Sensor
  scan_response:
    prefix: "0201061521"
    ibeacon_prefix: "0201061AFF4C000215"
    notes: >
      Devices embed their service UUID in scan response data. The app uses
      CRC-16 mask/pattern matching to filter scan results efficiently:
      mask = CRC16(prefix + CRC16_of_UUID_bytes)
      pattern = CRC16(prefix + UUID_bytes_as_little_endian)

protocol:
  framing:
    byte_order: "little_endian"
    crc:
      algorithm: "CRC-16/CCITT-FALSE"
      polynomial: "0x1021"
      initial: "0xFFFF"
      reflected: false
      xor_out: "0x0000"
      notes: "MSB-first, non-reflected (NOT the XModem variant — XModem would also imply init 0x0000). Matches the official doc's 'CRC-CCITT, normal (0x1021), initial remainder 0xFFFF' and pyNukiBT's Crc(width=16, poly=0x1021, initvalue=0xffff, reflect_input=False, reflect_output=False). Used on scan response data and message authentication."

  message_format:
    description: >
      Messages are read from ByteBuffer.wrap(payload).order(ByteOrder.LITTLE_ENDIAN).
      The base BleResponse class defines:
        channel (int, set externally) — routing/message type
        command (short) — command/response identifier
        payload — variable-length, command-specific data

  pairing:
    description: >
      Nuki uses public-key based pairing with challenge-response authentication:
      1. BLE connection and service discovery
      2. Public key exchange (CMD 3: PublicKeyRequest / PublicKeyResponse)
      3. Challenge-response authentication (CMD 4: ChallengeResponse, CMD 5: AuthorizationAuthenticatorRequest)
      4. Security PIN verification (CMD 32: VerifySecurityPinRequest)
      5. On success, the device returns an authorization ID used for subsequent commands
    nuki_specific:
      security_pin: "Numeric PIN set during initial setup: 4 digits (uint16) on Smart Lock 1.0-4.0, 6 digits (uint32) on Ultra/5th-gen/Go/Pro"
      authorization_id: "Integer ID assigned after successful pairing, used to authenticate all commands"

  commands:
    # --- Core Keyturner Commands ---
    request_data:
      id: 1
      name: "RequestDataRequest"
      direction: "client_to_device"
      description: "Request device data (serial number, etc.)"

    device_type:
      id: 2
      name: "DeviceTypeResponse"
      direction: "device_to_client"
      description: "Returns device type identifier"

    public_key:
      id: 3
      name: "PublicKeyRequest / PublicKeyResponse"
      direction: "bidirectional"
      description: "Public key exchange for pairing/authorization"

    challenge:
      id: 4
      name: "ChallengeResponse"
      direction: "device_to_client"
      description: "Challenge data for authentication"

    authorization_authenticator:
      id: 5
      name: "AuthorizationAuthenticatorRequest"
      direction: "client_to_device"
      description: "Send authorization authenticator after challenge"

    # --- Authorization management (official BLE API V2.3.0; documented but not
    #     yet exercised by this repo — payload detail only where the doc gives it) ---
    authorization_data:
      id: 6
      name: "AuthorizationDataRequest (0x0006)"
      direction: "client_to_device"
      description: "Create an authorization entry (official BLE API V2.3.0)"

    authorization_id:
      id: 7
      name: "AuthorizationIdResponse (0x0007)"
      direction: "device_to_client"
      description: "Returns the authorization ID. NOTE: 0x0007 is Authorization-ID, NOT Error Report (0x0012)."

    remove_authorization_entry:
      id: 8
      name: "RemoveAuthorizationEntryRequest (0x0008)"
      direction: "client_to_device"
      description: "Remove an authorization entry (official BLE API V2.3.0)"

    request_authorization_entries:
      id: 9
      name: "RequestAuthorizationEntriesRequest (0x0009)"
      direction: "client_to_device"
      description: "List authorization entries (official BLE API V2.3.0)"

    authorization_entry:
      id: 10
      name: "AuthorizationEntryResponse (0x000A)"
      direction: "device_to_client"
      description: "A single authorization entry (official BLE API V2.3.0)"

    authorization_data_invite:
      id: 11
      name: "AuthorizationDataInviteRequest (0x000B)"
      direction: "client_to_device"
      description: "Create an authorization entry via invite flow (official BLE API V2.3.0)"

    most_recent_command:
      id: 15
      name: "MostRecentCommandResponse (0x000F)"
      direction: "device_to_client"
      description: "The most recent command executed by the lock (official BLE API V2.3.0)"

    openings_closings_summary:
      id: 16
      name: "OpeningsClosingsSummaryResponse (0x0010)"
      direction: "device_to_client"
      description: "Summary of door openings/closings (official BLE API V2.3.0)"

    battery_report:
      id: 17
      name: "BatteryReportResponse (0x0011)"
      direction: "device_to_client"
      description: "Battery report (official BLE API V2.3.0)"

    config:
      id: 21
      name: "ConfigResponse (0x0015)"
      direction: "device_to_client"
      description: "Device configuration response (official BLE API V2.3.0)"

    request_reboot:
      id: 29
      name: "RequestRebootRequest (0x001D)"
      direction: "client_to_device"
      description: "Reboot the lock (official BLE API V2.3.0)"

    authorization_id_confirmation:
      id: 30
      name: "AuthorizationIdConfirmationRequest (0x001E)"
      direction: "client_to_device"
      description: "Confirm the authorization ID after pairing (official BLE API V2.3.0)"

    keyturner_states:
      id: 12
      name: "KeyturnerStatesResponse"
      direction: "device_to_client"
      description: >
        Full device state notification. Returns lock state, battery, door sensor
        state, WiFi/Thread connectivity, night mode, and accessory status.
      fields:
        - name: "nukiState"
          type: "uint8"
          description: "Operational state of the lock"
        - name: "lockState"
          type: "uint8"
          description: "LockState enum value (0=uncalibrated, 1=locked, 3=unlocked, etc.) — single byte per official BLE API V2.3.0"
        - name: "trigger"
          type: "uint8"
          description: "Source of the last state change (0=system, 1=manual, 2=button, 3=automatic, 6=auto lock)"
        - name: "currentTime"
          type: "datetime"
          description: "Device current time (year, month, day, hour, min, sec)"
        - name: "timezoneOffset"
          type: "sint16"
          description: "Timezone offset (UTC) in minutes (official BLE API V2.3.0)"
        - name: "battery"
          type: "uint8"
          description: "Battery flags byte: bit0 = critical, bit1 = charging, bits 2-7 = charge level in steps of 2%"
        - name: "configUpdateCount"
          type: "uint8"
          description: "Current count of modifications to the internal config (official BLE API V2.3.0)"
        - name: "lockNGoTimer"
          type: "uint8"
          description: "Status of the lock'n'go timer, or 0 if no lock'n'go is active (official BLE API V2.3.0)"
        - name: "lastLockAction"
          type: "uint8"
          description: "Most recent lock action performed (official BLE API V2.3.0)"
        - name: "lastLockActionTrigger"
          type: "uint8"
          description: "Trigger that caused the most recent lock action (official BLE API V2.3.0)"
        - name: "lastLockActionCompletionStatus"
          type: "uint8"
          description: "Completion status of the most recent lock action (official BLE API V2.3.0)"
        - name: "doorSensorState"
          type: "uint8"
          description: "Door state (0=unavailable, 1=deactivated, 2=closed, 3=opened, 4=unknown, 5=calibrating, 0x10=uncalibrated, 0xF0=tampered)"
        - name: "nightModeActive"
          type: "bool"
          description: "Night mode is currently active"

    lock_action:
      id: 13
      name: "LockActionRequest / DoorLockActionRequest"
      direction: "client_to_device"
      description: "Perform a lock/unlock/unlatch/lock-n-go action. Wire format: lockAction u8 + authId u32 + flags u8 + optional 20-byte name suffix + 32-byte nonce (no trigger field — trigger only appears in Keyturner States)."
      fields:
        - name: "lockAction"
          type: "uint8"
          values:
            1: "UNLOCK"
            2: "LOCK"
            3: "UNLATCH"
            4: "LOCK_N_GO"
            5: "LOCK_N_GO_WITH_UNLATCH"
            6: "FULL_LOCK"
            129: "FOB_ACTION_1 (0x81)"
            130: "FOB_ACTION_2 (0x82)"
            131: "FOB_ACTION_3 (0x83)"
        - name: "authId"
          type: "uint32"
          description: "Authorization ID (assigned during pairing)"
        - name: "flags"
          type: "uint8"
          description: "Option flags (bit0 = auto-unlock, bit1 = force)"
        - name: "name_suffix"
          type: "bytes"
          description: "Optional 20-byte name suffix"
        - name: "nonce"
          type: "bytes"
          description: "32-byte nonce"

    status:
      id: 14
      name: "StatusResponse"
      direction: "device_to_client"
      description: "Simple status response (OK/error)"

    set_config:
      id: 19
      name: "SetConfigRequest"
      direction: "client_to_device"
      description: "Write device configuration (auto-lock timer, button enabled, LED brightness, etc.)"

    request_config:
      id: 20
      name: "RequestConfigRequest"
      direction: "client_to_device"
      description: "Read current device configuration"

    set_security_pin:
      id: 25
      name: "SetSecurityPinRequest"
      direction: "client_to_device"
      description: "Set or change the security PIN (4 digits on SL 1.0-4.0, 6 digits on Ultra/5th-gen/Go/Pro)"

    request_calibration:
      id: 26
      name: "RequestCalibrationRequest"
      direction: "client_to_device"
      description: "Start lock calibration procedure"

    authorization_id_invite:
      id: 31
      name: "AuthorizationIdInviteResponse"
      direction: "device_to_client"
      description: "Returns authorization ID after successful pairing invite"

    verify_security_pin:
      id: 32
      name: "VerifySecurityPinRequest"
