      33: "KEYTURNER_ERROR_BAD_PIN"
      34: "KEYTURNER_ERROR_BAD_NONCE"
      35: "KEYTURNER_ERROR_BAD_PARAMETER"
      36: "KEYTURNER_ERROR_INVALID_AUTH_ID"
      37: "KEYTURNER_ERROR_DISABLED"
      38: "KEYTURNER_ERROR_REMOTE_NOT_ALLOWED"
      39: "KEYTURNER_ERROR_TIME_NOT_ALLOWED"
      40: "KEYTURNER_ERROR_TOO_MANY_PIN_ATTEMPTS"
      41: "KEYTURNER_ERROR_TOO_MANY_ENTRIES"
      42: "KEYTURNER_ERROR_CODE_ALREADY_EXISTS"
      43: "KEYTURNER_ERROR_CODE_INVALID (0x2B)"
      44: "KEYTURNER_ERROR_CODE_INVALID_TIMEOUT_1 (0x2C)"
      45: "KEYTURNER_ERROR_CODE_INVALID_TIMEOUT_2 (0x2D)"
      46: "KEYTURNER_ERROR_CODE_INVALID_TIMEOUT_3 (0x2E)"
      47: "KEYTURNER_ERROR_FIRMWARE_BINARY_MISMATCH"
      48: "KEYTURNER_ERROR_NOT_PAID"
      64: "KEYTURNER_ERROR_AUTO_UNLOCK_TOO_RECENT"
      65: "KEYTURNER_ERROR_POSITION_UNKNOWN"
      66: "KEYTURNER_ERROR_MOTOR_BLOCKED"
      67: "KEYTURNER_ERROR_CLUTCH_FAILURE"
      68: "KEYTURNER_ERROR_MOTOR_TIMEOUT"
      69: "KEYTURNER_ERROR_BUSY"
      70: "KEYTURNER_ERROR_CANCELED"
      71: "KEYTURNER_ERROR_NOT_CALIBRATED"
      72: "KEYTURNER_MOTOR_POSITION_LIMIT"
      73: "KEYTURNER_ERROR_MOTOR_LOW_VOLTAGE"
      74: "KEYTURNER_ERROR_MOTOR_POWER_FAILURE"
      75: "KEYTURNER_ERROR_CLUTCH_POWER_FAILURE"
      76: "KEYTURNER_ERROR_VOLTAGE_TOO_LOW"
      77: "KEYTURNER_ERROR_FIRMWARE_UPDATE_NEEDED"
      78: "KEYTURNER_ERROR_REJECTED"
