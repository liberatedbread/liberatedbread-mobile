  lock_states:
    0: "UNCALIBRATED — Lock not yet calibrated, cannot operate"
    1: "LOCKED — Door is locked"
    2: "UNLOCKING — Motor is unlocking"
    3: "UNLOCKED — Door is unlocked"
    4: "LOCKING — Motor is locking"
