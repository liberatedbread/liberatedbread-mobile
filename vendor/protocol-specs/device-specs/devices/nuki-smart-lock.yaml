  error_codes:
    # Codes 1-5, 130/131 and 224/225 are app-derived (ErrorReportResponse,
    # decompiled C12525xP0.java) — the official BLE API V2.3.0 error tables
    # list only 0xFD-0xFF general, 0x10-0x13 pairing and the 0x20+ keyturner
    # codes. 4 and 225 are NOT duplicates: the app names them distinctly —
    # generic 4 ERROR_ALREADY_CONFIGURED vs keyturner 225 (0xE1)
    # KEYTURNER_ERROR_ALREADY_CONFIGURED.
    generic:
      1: "ERROR_BAD_PARAMETER"
      2: "ERROR_NOT_AUTHORIZED"
      3: "ERROR_BAD_PIN"
      4: "ERROR_ALREADY_CONFIGURED"
      5: "ERROR_BAD_AUTHENTICATOR"
      224: "KEYTURNER_ERROR_NOT_IN_MAINTENANCE_MODE (0xE0, app-derived)"
      225: "KEYTURNER_ERROR_ALREADY_CONFIGURED (0xE1, app-derived — distinct from generic code 4)"
      253: "ERROR_BAD_CRC"
      254: "ERROR_BAD_LENGTH"
      255: "ERROR_UNKNOWN"
    pairing:
