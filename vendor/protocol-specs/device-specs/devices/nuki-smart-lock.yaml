sources:
  - type: "apk_decompilation"
    path: "~/research/nuki/nuki-decompiled/"
    apk: "io.nuki v2026.7.1"
    decompiler: "jadx"
    key_files:
      - "sources/android/content/C4173Xt.java (BleConstants.java)"
      - "sources/android/content/AbstractC5828du.java (BleResponse.java)"
      - "sources/android/content/C6385fW1.java (KeyturnerStatesResponse.java)"
      - "sources/android/content/C12525xP0.java (ErrorReportResponse.java)"
      - "sources/android/content/D52.java (LockState.java)"
      - "sources/android/content/C7538iv.java (BluetoothPeripheral.kt)"
      - "sources/android/content/V74.java (Utils.kt — CRC-16 implementation)"
  - type: "public_documentation"
    url: "https://developer.nuki.io/"
    description: "Nuki BLE API (publicly documented)"

helpful_urls:
  - title: "Nuki Smart Lock API V2.3.0 (PDF, 2025-01-08)"
    url: "https://developer.nuki.io/uploads/short-url/1qEVXUUpo4xkPvTchbyKbdJLuOV.pdf"
    description: "The official BLE API document this spec's GATT roles, command IDs and error tables were cross-checked against."
  - title: "ronengr/pyNukiBT"
    url: "https://github.com/ronengr/pyNukiBT"
    description: "Python BLE client; const.py corroborates the CRC-16 parameters and command constants."
  - title: "I-Connect/NukiBleEsp32"
    url: "https://github.com/I-Connect/NukiBleEsp32"
    description: "ESP32 BLE client; NukiLockConstants.h is an independent enumeration of commands, states and error codes."
  - title: "technyon/nuki_hub"
    url: "https://github.com/technyon/nuki_hub"
    description: "ESP32 bridge exposing the lock over MQTT — working implementation built on NukiBleEsp32."
  - title: "uriyacovy/ESPHome_nuki_lock"
    url: "https://github.com/uriyacovy/ESPHome_nuki_lock"
    description: "ESPHome component driving the lock over BLE — working open implementation."
  - title: "NCC Group advisory: multiple vulnerabilities in Nuki smart locks (July 2022)"
    url: "https://www.nccgroup.com/us/research-blog/technical-advisory-multiple-vulnerabilities-in-nuki-smart-locks-cve-2022-32509-cve-2022-32504-cve-2022-32502-cve-2022-32507-cve-2022-32503-cve-2022-32510-cve-2022-32506-cve-2022-32508-cve-2022-32505/"
    description: "Source for the 11 CVEs cited in device.notes, including the BLE protocol access-control and DoS findings."
