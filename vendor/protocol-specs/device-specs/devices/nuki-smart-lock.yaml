# Nuki Smart Lock — Device Spec (BLE)
# Reverse-engineered by static analysis of the official Nuki Android app
# Cross-referenced with public Nuki BLE API docs at developer.nuki.io
#
# What the app contributed: the BLE constants (UUIDs, command IDs), the
# response frame layout, the keyturner-state and lock-state enums, the
# lock-action set, the error-report codes and the CRC-16 implementation.

device:
  name: "Nuki Smart Lock"
  manufacturer: "Nuki Home Solutions GmbH"
  manufacturer_status: "active"
  testing:
    status: untested
  category: "lock"
  type: "electronic_door_lock"
  protocol: "ble"
  transport: "ble-gatt"
  variants:
    - model: "Smart Lock 1.0"
    - model: "Smart Lock 2.0"
    - model: "Smart Lock 3.0"
    - model: "Smart Lock 4.0"
    - model: "Smart Lock Pro"
    - model: "Smart Lock Ultra"
    - model: "Smart Lock (5th gen)"
    - model: "Smart Lock Pro (5th gen)"
    - model: "Smart Lock Go"
  notes: >
    The Nuki Smart Lock is a retrofit electronic door lock that mounts over
    an existing Euro-profile cylinder. It communicates primarily via BLE
    with an optional WiFi bridge for remote access.

    Protocol: encrypted BLE GATT with challenge-response authentication
    (public key exchange, nonce, authorization IDs). Lock actions are
    CRC-16 authenticated. All multi-byte values are little-endian.

    The app supports multiple Nuki device types (Smart Lock, Opener, Door
    Sensor, Keypad, Fob, Box, Bridge) each with their own BLE service UUIDs
    but sharing the same command/response protocol over a GATT data
    characteristic.

    Research status: app analysed, full UUID map and command IDs recovered.
    Message frame format confirmed against the app's response parser.
    Lock state enum and error codes fully enumerated.
    Pairing/auth flow understood at protocol level from public docs.
    CRC-16 implementation confirmed (CRC-16/CCITT-FALSE, poly 0x1021,
    init 0xFFFF, MSB-first, non-reflected — NOT XModem).

    Security: NCC Group's July 2022 advisory disclosed 11 CVEs in Nuki
    products, including CVE-2022-32507 (broken access controls in the BLE
    protocol) and CVE-2022-32505 (DoS via unauthenticated BLE packets),
    fixed in Smart Lock 3.0 FW >=3.3.5 and 2.0 FW >=2.12.4. Official MQTT
    and Matter-over-Thread APIs are now documented alongside BLE/Web
    (4th-gen Pro/Ultra/5th-gen support Matter; Ultra/Pro have built-in
    WiFi, no bridge needed).

  identification:
    # Moved out of a top-level `identification:` block, which is not the key
    # any consumer reads -- the schema's identification is `device.identification`
    # and this spec had none, so nothing could match a Nuki at all.
    local_name_prefixes:
      - "Nuki_"
      - "Nuki_SL_"
      - "Nuki_Opener_"
      - "Nuki_Door_Sensor_"
    # What a Nuki advertises depends on its state (the app's scanner, and
    # the official BLE API for the keyturner): the x000 Initialization UUID
    # while uninitialized, the x100 Pairing Service while in pairing mode,
    # and once paired an iBeacon whose proximity UUID is the x200 command
    # service (manufacturer_data below; discovery carries the pattern). A
    # matcher on x000 alone never finds a lock that is already set up.
    service_uuids:
      - "a92ee000-5501-11e4-916c-0800200c9a66"   # Smart Lock 1-4, uninitialized
      - "a92ee100-5501-11e4-916c-0800200c9a66"   # Smart Lock 1-4, pairing mode
      - "a92ee400-5501-11e4-916c-0800200c9a66"   # Smart Lock 5th gen, uninitialized (app-derived)
      - "a92ee300-5501-11e4-916c-0800200c9a66"   # Smart Lock 5th gen, pairing mode
      - "a92ae000-5501-11e4-916c-0800200c9a66"   # Opener, uninitialized
      - "a92ae100-5501-11e4-916c-0800200c9a66"   # Opener, pairing mode
    manufacturer_data:
      company_id: 76
      company_id_hex: "0x004C"
      description: >
        Apple's company ID, carrying an iBeacon (02 15 + 16-byte proximity
        UUID + major + minor + TX power). Only the proximity UUID makes it a
        Nuki: a92ee200-... for a paired Smart Lock, a92ae200-... for a
        paired Opener. On its own, 0x004C says nothing.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "Nuki_"
          service_uuids:
            - "a92ee000-5501-11e4-916c-0800200c9a66"
            - "a92ee100-5501-11e4-916c-0800200c9a66"
            - "a92ee400-5501-11e4-916c-0800200c9a66"
            - "a92ee300-5501-11e4-916c-0800200c9a66"
            - "a92ae000-5501-11e4-916c-0800200c9a66"
            - "a92ae100-5501-11e4-916c-0800200c9a66"
        notes: "Uninitialized and pairing-mode devices."
      - type: "ble_scan"
        ble:
          manufacturer_data:
            company_id: 76
            match: "prefix"
            pattern: "0215a92ee200550111e4916c0800200c9a66"
            description: "iBeacon with the Smart Lock command-service UUID as proximity UUID: a paired Smart Lock."
        notes: "App-derived (its paired-device scan filter), not captured."
      - type: "ble_scan"
        ble:
          manufacturer_data:
            company_id: 76
            match: "prefix"
            pattern: "0215a92ae200550111e4916c0800200c9a66"
            description: "iBeacon with the Opener command-service UUID as proximity UUID: a paired Opener."
        notes: "App-derived (its paired-device scan filter), not captured."
    identity:
      stable_keys: ["address"]
      display: "local_name"
      notes: >
        The iBeacon's major/minor are not established as a per-unit id, so
        the BLE address is the key.
    static_ip_required: false
  setup:
    required: true
    confidence: medium
    notes: >
      Unlike most devices in this repo, the Nuki lock genuinely must be
      provisioned before it will do anything: every command after pairing
      carries an authorization ID that only the pairing exchange can issue.
      Pairing is public-key based (CMD 3 PublicKeyRequest, CMD 4/5
      challenge-response) and gated by a security PIN the owner sets on
      first setup — 4 digits on Smart Lock 1.0-4.0, widened to 6 digits
      with Smart Lock Ultra (6-digit on Ultra/5th-gen/Go/Pro).

      The lock is put into pairing mode physically, by holding its button. That
      is deliberate: it means possession of the door, not proximity to it, is
      what authorises a new client.

      Confidence is medium — the flow is understood from the vendor app and
      Nuki's public BLE API documentation, but has not been run against a lock
      here. Treat the step ordering as documented rather than observed.
    methods:
      - type: ble_provisioning
        description: >
          Pair over BLE by exchanging public keys, answering the
          challenge-response, and verifying the security PIN. On success the
          lock issues an authorization ID that authenticates all later commands.
        verified: false
        ble:
          pairing_required: true
        steps:
          - action: >
              Put the lock into pairing mode by holding its button until the
              ring LED indicates it is discoverable.
            actor: user
          - action: "Connect over BLE and discover the keyturner pairing service."
            actor: client
          - action: "Exchange public keys (CMD 3: PublicKeyRequest / PublicKeyResponse)."
            actor: client
          - action: >
              Complete challenge-response authentication (CMD 4:
              ChallengeResponse, CMD 5: AuthorizationAuthenticatorRequest).
            actor: client
          - action: "Enter the security PIN (4-digit on SL 1.0-4.0, 6-digit on Ultra/5th-gen/Go/Pro) when the client asks for it."
            actor: user
          - action: "Verify the PIN (CMD 32: VerifySecurityPinRequest)."
            actor: client
            expect: >
              The lock returns an authorization ID. Store it with the keypair —
              losing it means re-pairing.
    factory_reset:
      applicable: true
      confidence: low
      effect: >
        Clears every authorization, the security PIN and the door calibration.
        The lock must be re-taught its door afterwards and every client
        re-paired — including yours, so do not do this to a door you need to
        use in the next half hour.
      description: >
        Nuki documents a reset in their own support portal and the shape of it
        is consistent across the summaries available here: a recessed button
        reached with a straightened paperclip, held until the ring LED flashes
        red and blue alternately, after which the lock erases its
        configuration and finally settles to a steady blue — pairing mode,
        ready to be set up again. Allow a further quarter of a minute or so for
        the motor to recalibrate.

        Confidence is deliberately LOW. The detail above comes from
        third-party reproductions of Nuki's support article rather than from
        the article itself, which could not be retrieved directly, and hold
        times differ between generations. On a door lock that is the
        difference between a procedure and a guess: read Nuki's own page for
        the exact model before starting, and treat the LED as the authority
        rather than any number quoted here.
      procedures:
        - name: "Recessed reset button held until the ring LED alternates red and blue"
          verified: false
          basis: >
            Third-party guides reproducing Nuki's support article on resetting
            the Smart Lock; Nuki's own page is the authority and should be
            checked for the specific generation. Not replayed against a lock.
          hold_seconds: 10
          power_state: "on"
          glyph: "generic/pinhole-reset.svg"
          indicator: "Ring LED flashing red and blue alternately, then steady blue when the lock reaches pairing mode."
          indicator_glyph: "devices/nuki-smart-lock/ring-led-pairing.svg"
          steps:
            - action: "Straighten a paperclip and press the recessed reset button on the lock body."
              actor: "user"
            - action: "Hold until the ring LED starts flashing red and blue alternately, then release — continuing to hold can interrupt the sequence."
              actor: "user"
              expect: "Alternating red/blue flashing."
            - action: "Leave the lock alone while it erases its configuration."
              actor: "device"
              timeout_seconds: 120
              expect: "The LED settles to steady blue: the lock is in pairing mode."
            - action: "Allow a further fifteen to twenty seconds for the motor to recalibrate before setting it up again."
              actor: "device"
              timeout_seconds: 60
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        A previously paired client rejoins with its stored keypair and
        authorization ID; no reset is needed. A reset is only required to revoke
        an authorization that can no longer be removed through the app — for
        example after losing the phone that held it. The optional WiFi bridge is
        provisioned separately and is not part of this flow.
    credentials:
      # No WiFi passphrase exists here: the lock is BLE-only and the optional
      # bridge handles network credentials separately. The secrets that do cross
      # this link are recorded below and in `notes`.
      wifi_passphrase_protection: not_applicable
      stored_on_device:
        - "Client public keys and their authorization IDs"
        - "Security PIN (4-digit on SL 1.0-4.0; 6-digit on Ultra/5th-gen/Go/Pro)"
      issued_to_client:
        - "Authorization ID, issued on successful pairing"
        - "Lock public key, from the key exchange"
      notes: >
        No WiFi passphrase crosses this link — the lock itself is BLE-only, and
        the separate WiFi bridge handles network credentials on its own. The
        security PIN is user-chosen and verified over the encrypted channel
        established by the key exchange.

  pairing:
    required: true
    confidence: "medium"
    # The transport pairs trivially; the authorisation that matters is the
    # public-key exchange documented under setup.methods and command_protocol.
    # Recorded as app_layer so a reader who finds no link-layer security knows
    # it was looked for, and knows where the security actually lives.
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "user_chosen"
      length: 4
      notes: >
        The security PIN is set by the owner at first setup and verified over
        the channel the key exchange established (CMD 32), not by the BLE
        pairing procedure. Four digits on Smart Lock 1.0-4.0; six on
        Ultra/5th-gen/Go/Pro, so a client must not hardcode the length. There
        is a factory default on an unconfigured lock; it is not reproduced
        here because a working default PIN for a door lock is a key, and the
        owner sets their own during setup in any case.
    exclusivity:
      single_connection: true
      single_bond: false
      recovery: >
        Close the vendor app and any other client before connecting. The lock
        serves one central at a time, but it stores many authorizations — a
        new client does not evict an existing one, which is the point of the
        per-client keypair.
      notes: >
        Authorizations accumulate rather than replace, so a lock that has been
        paired before is still pairable; revoking an old client is an app-side
        operation on the authorization list, not a re-pairing.
    enter_pairing_mode:
      required: true
      indicator: "The ring LED lights to show the lock is discoverable and will accept a new pairing."
      indicator_glyph: "devices/nuki-smart-lock/ring-led-pairing.svg"
      notes: >
        Pairing mode is entered at the hardware, by holding the lock's button.
        That is a deliberate design choice rather than an inconvenience: it
        makes possession of the door, not proximity to it, the thing that
        authorises a new client. A consumer should say so when it asks the
        user to go and press the button.
      procedures:
        - name: "Hold the lock button until the ring LED indicates it is discoverable"
          verified: false
          basis: >
            Nuki's public BLE API documentation and the vendor app's own
            instructions. Hold time is not restated here because it differs by
            hardware generation and the ring LED is the authoritative signal;
            not replayed against a lock here.
          power_state: "on"
          glyph: "devices/nuki-smart-lock/pairing-button-hold.svg"
          indicator: "Ring LED indicates the lock is discoverable."
          indicator_glyph: "devices/nuki-smart-lock/ring-led-pairing.svg"
          steps:
            - action: "Press and hold the button on the face of the lock."
              actor: "user"
              glyph: "devices/nuki-smart-lock/pairing-button-hold.svg"
            - action: "Keep holding until the ring LED changes to the discoverable pattern, then release."
              actor: "user"
              expect: "The ring LED indicates the lock is discoverable."
            - action: "Scan and connect while the lock is in this state."
              actor: "client"
    unpair:
      supported: true
      requires_factory_reset: false
      clears: >
        One client's authorization, leaving the lock's calibration, security
        PIN and every other client's authorization intact.
      notes: >
        Revoking an authorization is an operation on the lock's authorization
        list rather than a physical procedure, which is why there are no steps
        here — it is done by an already-authorised client, and the commands
        for it live in the command protocol below. The physical route, for a
        lock nobody can still authorise against, is the factory reset in
        `setup.factory_reset`, which is not established here.

ble:
  connection:
    transport: "le"
    phy_preference: "le_1m"
    mtu_negotiation: true
    # No verifiable preferred MTU: the app accepts any MTU 23-517
    # ("mtu must be between 23 and 517"); the official BLE
    # API only notes MTU exchange is supported since FW 1.9.3/2.7.20. An
    # earlier revision stated 185 — unverifiable, dropped.
    # No BLE bonding: security is application-layer NaCl (Curve25519 DH +
    # XSalsa20-Poly1305); neither pyNukiBT nor NukiBleEsp32 bonds.
    bonding_required: false

services:
  # --- Keyturner (Smart Lock) ---
  # GATT layout per the official Nuki BLE API V2.3.0 (2025-01-08) and V2.3.1
  # (2026-05-29): separate services. A92EE000 is the Initialization Service
  # (advertises the uninitialized state, has NO characteristics of its own),
  # A92EE100 is the Pairing Service carrying Pairing GDIO A92EE101 (Smart Lock
  # 1-4), A92EE300 is the Pairing Service carrying Pairing GDIO A92EE301 (5th
  # generation: Ultra/Pro/Go, V2.3.1), and A92EE200 is the Keyturner (command)
  # Service with A92EE201 = General Data IO (unencrypted) and A92EE202 =
  # User-Specific Data IO (encrypted).
  #
  # The app's BLE constants add, for the same family: A92EEF00 (an advertised
  # UUID its scanner reads as "maintenance mode"), A92EE400 (the 5th-gen
  # counterpart of A92EE000 in its scanner) and A92EE203 (a fifth request
  # channel the app addresses under A92EE200). Opener (A92AExxx), Smart Door
  # (A92AAxxx) and Door Sensor (A92ABxxx) follow below. Keypad (A92CExxx),
  # Keypad 2.0 (A92DExxx), Fob (A92CFxxx) and Box (A92BExxx) are listed under
  # protocol_details.additional_devices; the app's Bridge family (A92FE000
  # with A92FE001/FE002) is not modelled here.
  - uuid: "a92ee000-5501-11e4-916c-0800200c9a66"
    name: "Keyturner Initialization Service"
    description: "Advertises the uninitialized state; has no characteristics of its own (official BLE API V2.3.0)."
    notes: "Advertisement-only: its presence in a scan means the lock is not yet paired. Nothing to read or write under it."
    device: "smart_lock"

  - uuid: "a92eef00-5501-11e4-916c-0800200c9a66"
    name: "Keyturner Maintenance-Mode Advertisement"
    description: >
      Advertised service UUID that the app's scanner reads as "device
      initialized, in maintenance mode" (it sits beside A92EE000 =
      uninitialized and A92EE100 = pairing mode in the same scan-filter set).
      Not in the official BLE API. Earlier revisions of this spec listed it as
      a pairing-data characteristic; nothing in the app uses it as a
      characteristic. What maintenance mode is (bootloader/DFU is likely) is
      unverified.
    notes: "App-derived advertisement role only. Whether the device exposes a GATT service with this UUID in maintenance mode, and what characteristics it carries, has not been observed."
    device: "smart_lock"

  - uuid: "a92ee100-5501-11e4-916c-0800200c9a66"
    name: "Keyturner Pairing Service"
    description: "Pairing service for initial authorization (Smart Lock 1-4; 5th generation uses A92EE300), official BLE API V2.3.0. Also advertised while the lock is in pairing mode."
    device: "smart_lock"
    characteristics:
      - uuid: "a92ee101-5501-11e4-916c-0800200c9a66"
        name: "Keyturner Pairing General Data IO"
        type: "pairing"
        description: >
          Pairing GDIO: the unencrypted channel the authorization handshake
          runs over (official BLE API V2.3.0). Lock operations, configuration
          and state queries go over the Keyturner Service's data IO
          characteristics (a92ee201 / a92ee202).
        # Official BLE API V2.3.1: write (long) + indicate on every data IO
        # characteristic, not notify.
        properties: ["write", "indicate"]

  - uuid: "a92ee200-5501-11e4-916c-0800200c9a66"
    name: "Keyturner Service (command service)"
    description: "Keyturner command service per official BLE API V2.3.0 (NOT a firmware service). A paired lock advertises this UUID as its iBeacon proximity UUID (app scan filter)."
    device: "smart_lock"
    characteristics:
      - uuid: "a92ee201-5501-11e4-916c-0800200c9a66"
        name: "Keyturner General Data IO"
        type: "data"
        description: "General Data IO characteristic — unencrypted command channel (official BLE API V2.3.0)"
        properties: ["write", "indicate"]
      - uuid: "a92ee202-5501-11e4-916c-0800200c9a66"
        name: "Keyturner User-Specific Data IO"
        type: "data"
        description: "User-Specific Data IO characteristic — encrypted command channel (official BLE API V2.3.0); used by pyNukiBT/NukiBleEsp32"
        properties: ["write", "indicate"]
      - uuid: "a92ee203-5501-11e4-916c-0800200c9a66"
        name: "Keyturner Auxiliary Data IO"
        type: "data"
        description: >
          Not in the official BLE API. The app's request layer routes one of
          its request channels (distinct from the GDIO and USDIO channels) to
          this characteristic under A92EE200, so the parent service is
          app-derived; the role of that channel is unverified. Earlier
          revisions of this spec called it "Firmware Verify" with no evidence.
          Properties are not stated anywhere and are assumed.
        properties: ["write", "indicate"]

  - uuid: "a92ee300-5501-11e4-916c-0800200c9a66"
    name: "Keyturner Pairing Service (5th generation)"
    description: >
      Pairing service of Smart Lock 5th generation (Ultra/Pro/Go), official
      BLE API V2.3.1; pyNukiBT's Ultra class uses the same pair. The app uses
      it for device type 5 and also scans for it as the "pairing mode"
      advertisement of those locks. Earlier revisions of this spec labelled
      it a Keypad service.
    device: "smart_lock"
    characteristics:
      - uuid: "a92ee301-5501-11e4-916c-0800200c9a66"
        name: "Keyturner Pairing General Data IO (5th generation)"
        type: "pairing"
        description: "Unencrypted pairing GDIO for 5th-gen locks (official BLE API V2.3.1: write (long), indicate)."
        properties: ["write", "indicate"]

  - uuid: "a92ee400-5501-11e4-916c-0800200c9a66"
    name: "Keyturner Initialization Service (5th generation)"
    description: >
      App-derived: the app's scanner for 5th-gen locks treats this advertised
      UUID as "uninitialized", the role A92EE000 has for Smart Lock 1-4. Not
      in the official BLE API V2.3.1. Earlier revisions of this spec called it
      a Keypad Pairing Service; nothing in the app ties it to the Keypad.
    notes: "Advertisement role is app-derived only; no characteristics are defined for it in the app, and whether it is a GATT service at all on hardware is unverified."
    device: "smart_lock"

  # --- Opener ---
  # Official Nuki Opener BLE API V1.1.0 (2020-08-07) documents three services
  # (Initialization / Pairing with GDIO / Opener Service with GDIO + USDIO),
  # but prints them with the keyturner's a92ee... prefix -- a copy-paste error
  # reported on the Nuki developer forum; the Opener announces a92ae....
  # The a92ae UUIDs and their parents are confirmed by the app's BLE constants
  # and request routing, NukiBleEsp32 (NukiOpenerConstants.h) and pyNukiBT.
  - uuid: "a92ae000-5501-11e4-916c-0800200c9a66"
    name: "Opener Initialization Service"
    description: "Advertises the uninitialized state of an Opener; has no characteristics (Opener BLE API V1.1.0, with the a92ae prefix correction)."
    notes: "Advertisement-only, like the keyturner's A92EE000: present in a scan while the Opener is not yet paired."
    device: "opener"

  - uuid: "a92aef00-5501-11e4-916c-0800200c9a66"
    name: "Opener Maintenance-Mode Advertisement"
    description: "Advertised UUID the app's Opener scanner reads as 'initialized, maintenance mode'. Not in the official Opener API; previously listed here as a pairing-data characteristic."
    notes: "App-derived advertisement role only; whether a GATT service with characteristics exists under it is unverified."
    device: "opener"

  - uuid: "a92ae100-5501-11e4-916c-0800200c9a66"
    name: "Opener Pairing Service"
    description: "Pairing service for initial authorization (Opener BLE API V1.1.0; UUID per the app, NukiBleEsp32 and pyNukiBT). Also advertised while the Opener is in pairing mode."
    device: "opener"
    characteristics:
      - uuid: "a92ae101-5501-11e4-916c-0800200c9a66"
        name: "Opener Pairing General Data IO"
        type: "pairing"
        description: "Unencrypted pairing GDIO the authorization handshake runs over (Opener BLE API V1.1.0: write (long), indicate). Not the command channel."
        properties: ["write", "indicate"]

  - uuid: "a92ae200-5501-11e4-916c-0800200c9a66"
    name: "Opener Service (command service)"
    description: "Opener command service (Opener BLE API V1.1.0; UUID per the app, NukiBleEsp32 and pyNukiBT). NOT a firmware service. A paired Opener advertises this UUID as its iBeacon proximity UUID (app scan filter)."
    device: "opener"
    characteristics:
      - uuid: "a92ae201-5501-11e4-916c-0800200c9a66"
        name: "Opener General Data IO"
        type: "data"
        description: "General Data IO — unencrypted channel (Opener BLE API V1.1.0: write (long), indicate)."
        properties: ["write", "indicate"]
      - uuid: "a92ae202-5501-11e4-916c-0800200c9a66"
        name: "Opener User-Specific Data IO"
        type: "data"
        description: "User-Specific Data IO — encrypted command channel (Opener BLE API V1.1.0: write (long), indicate); the characteristic NukiBleEsp32 and pyNukiBT send Opener commands on."
        properties: ["write", "indicate"]
      - uuid: "a92ae203-5501-11e4-916c-0800200c9a66"
        name: "Opener Auxiliary Data IO"
        type: "data"
        description: "Not in the official Opener API. The app routes a separate request channel to it under A92AE200 (parent app-derived); role unverified. Properties assumed."
        properties: ["write", "indicate"]

  # --- Smart Door (device type 3) ---
  # The A92AAxxx family is the Nuki Smart Door (a door with a built-in Nuki
  # lock; device type 3), NOT the Door Sensor: the app's scanner, pairing and
  # command routing for this family all belong to its "Door" device, which
  # carries a full lock feature set (authorizations, keypad codes, time
  # control, its own door-sensor config). The layout mirrors the keyturner
  # and Opener. No official BLE API is published for it; everything here is
  # app-derived and not hardware-verified.
  - uuid: "a92aa000-5501-11e4-916c-0800200c9a66"
    name: "Smart Door Initialization Service"
    description: "App-derived: advertised UUID the app's Door scanner reads as 'uninitialized', mirroring A92EE000/A92AE000."
    notes: "Advertisement role only; no characteristics are defined for it in the app. Not hardware-verified."
    device: "smart_door"

  - uuid: "a92aaf00-5501-11e4-916c-0800200c9a66"
    name: "Smart Door Maintenance-Mode Advertisement"
    description: "App-derived: advertised UUID the app's Door scanner reads as 'initialized, maintenance mode'. Previously listed here as a pairing-data characteristic."
    notes: "App-derived advertisement role only; whether a GATT service with characteristics exists under it is unverified."
    device: "smart_door"

  - uuid: "a92aa100-5501-11e4-916c-0800200c9a66"
    name: "Smart Door Pairing Service"
    description: "App-derived: the service the app pairs a Door through (and the pairing-mode advertisement)."
    device: "smart_door"
    characteristics:
      - uuid: "a92aa101-5501-11e4-916c-0800200c9a66"
        name: "Smart Door Pairing General Data IO"
        type: "pairing"
        description: "App-derived: the unencrypted pairing characteristic under A92AA100. Properties assumed by analogy with the keyturner/Opener pairing GDIO."
        properties: ["write", "indicate"]

  - uuid: "a92aa200-5501-11e4-916c-0800200c9a66"
    name: "Smart Door Service (command service)"
    description: "App-derived: the Door's command service (also its iBeacon proximity UUID when paired). NOT a firmware service."
    device: "smart_door"
    characteristics:
      - uuid: "a92aa201-5501-11e4-916c-0800200c9a66"
        name: "Smart Door General Data IO"
        type: "data"
        description: "App-derived: unencrypted request channel. Properties assumed by analogy."
        properties: ["write", "indicate"]
      - uuid: "a92aa202-5501-11e4-916c-0800200c9a66"
        name: "Smart Door User-Specific Data IO"
        type: "data"
        description: "App-derived: encrypted command channel. Properties assumed by analogy."
        properties: ["write", "indicate"]
      - uuid: "a92aa203-5501-11e4-916c-0800200c9a66"
        name: "Smart Door Auxiliary Data IO"
        type: "data"
        description: "App-derived: a separate request channel under A92AA200; role unverified. Properties assumed."
        properties: ["write", "indicate"]

  # --- Door Sensor (device type 15) ---
  # App-derived only (no official BLE API): one service, which the app also
  # scans for as the sensor's advertisement and uses for pairing, carrying
  # three characteristics. Not hardware-verified.
  - uuid: "a92ab000-5501-11e4-916c-0800200c9a66"
    name: "Door Sensor Service"
    description: "App-derived: the Door Sensor's single service; its advertised UUID, pairing service and request service in the app. Magnetic door open/close detection."
    device: "door_sensor"
    characteristics:
      - uuid: "a92ab001-5501-11e4-916c-0800200c9a66"
        name: "Door Sensor General Data IO"
        type: "data"
        description: "App-derived: unencrypted channel, used for both pairing and plain requests. Properties assumed by analogy."
        properties: ["write", "indicate"]
      - uuid: "a92ab002-5501-11e4-916c-0800200c9a66"
        name: "Door Sensor Encrypted Data IO"
        type: "data"
        description: "App-derived: encrypted channel, keyed with a Door-Sensor-specific shared key. Properties assumed by analogy."
        properties: ["write", "indicate"]
      - uuid: "a92ab003-5501-11e4-916c-0800200c9a66"
        name: "Door Sensor Auxiliary Data IO"
        type: "data"
        description: "App-derived: a separate request channel; role unverified. Properties assumed."
        properties: ["write", "indicate"]

  # --- Standard Device Information ---
  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    name: "Device Information Service"
    description: "Standard BLE Device Information (model, serial, firmware)"
    device: "all"
    characteristics:
      - uuid: "00002a24-0000-1000-8000-00805f9b34fb"
        name: "Model Number String"
        type: "device_info"
        properties: ["read"]
      - uuid: "00002a25-0000-1000-8000-00805f9b34fb"
        name: "Serial Number String"
        type: "device_info"
        properties: ["read"]
      - uuid: "00002a26-0000-1000-8000-00805f9b34fb"
        name: "Firmware Revision String"
        type: "device_info"
        properties: ["read"]

advertising:
  discovery_method: "ble_scan"
  local_name_prefixes:
    - "Nuki_"
    - "Nuki_SL_"
    - "Nuki_Opener_"
    - "Nuki_Door_Sensor_"
  service_uuids:
    # Per the app's scanner, each family advertises its x000 UUID while
    # uninitialized, x100 in pairing mode, xF00 in maintenance mode, and an
    # iBeacon whose proximity UUID is its x200 command service once paired.
    # Only the uninitialized-state UUIDs are listed here.
    - "a92ee000-5501-11e4-916c-0800200c9a66"   # Keyturner (Smart Lock 1-4) Initialization Service
    - "a92ee400-5501-11e4-916c-0800200c9a66"   # Keyturner 5th gen, uninitialized (app-derived)
    - "a92ae000-5501-11e4-916c-0800200c9a66"   # Opener Initialization Service
    - "a92aa000-5501-11e4-916c-0800200c9a66"   # Smart Door, uninitialized (app-derived)
    - "a92ab000-5501-11e4-916c-0800200c9a66"   # Door Sensor service (app-derived)
  scan_response:
    prefix: "0201061521"
    ibeacon_prefix: "0201061AFF4C000215"
    notes: >
      Devices embed their service UUID in scan response data. The app uses
      CRC-16 mask/pattern matching to filter scan results efficiently:
      mask = CRC16(prefix + CRC16_of_UUID_bytes)
      pattern = CRC16(prefix + UUID_bytes_as_little_endian)

# Vendor-specific protocol detail this schema does not model. Namespaced so the
# top level can stay closed; nothing here is a declared contract.
protocol_details:
  additional_devices:
    opener:
      name: "Nuki Opener"
      # Command service / encrypted command characteristic, as NukiBleEsp32
      # and pyNukiBT use them; pairing goes over a92ae100 / a92ae101.
      service_uuid: "a92ae200-5501-11e4-916c-0800200c9a66"
      data_characteristic: "a92ae202-5501-11e4-916c-0800200c9a66"
      pairing_service_uuid: "a92ae100-5501-11e4-916c-0800200c9a66"
      pairing_characteristic: "a92ae101-5501-11e4-916c-0800200c9a66"
      description: "Retrofit intercom door opener. Uses same command protocol as Smart Lock (official Nuki Opener BLE API V1.1.0)."
      commands:
        opener_lock_action:
          id: 13
          name: "OpenerLockActionRequest"
          description: "Open door / toggle ring-to-open"
        opener_states:
          id: 12
          name: "OpenerStatesResponse"
          description: "Opener device state (ring-to-open timer, battery, etc.)"
        opener_status:
          id: 14
          name: "OpenerStatusResponse"
          description: "Simple open/closed status"

    smart_door:
      name: "Nuki Smart Door"
      # App-derived (device type 3); this entry was previously labelled
      # "Door Sensor". The states/status responses below belong to this
      # device in the app, not to the Door Sensor.
      service_uuid: "a92aa200-5501-11e4-916c-0800200c9a66"
      data_characteristic: "a92aa202-5501-11e4-916c-0800200c9a66"
      pairing_service_uuid: "a92aa100-5501-11e4-916c-0800200c9a66"
      pairing_characteristic: "a92aa101-5501-11e4-916c-0800200c9a66"
      description: "Door with an integrated Nuki lock (authorizations, keypad codes, time control and its own door-sensor config in the app). Not hardware-verified."
      commands:
        door_states:
          id: 12
          name: "DoorStatesResponse"
          description: "Smart Door state"
        door_status:
          id: 14
          name: "DoorStatusResponse"
          description: "Simple Smart Door status"

    door_sensor:
      name: "Nuki Door Sensor"
      # App-derived (device type 15). Single service; the app pairs over the
      # unencrypted a92ab001 and uses a92ab002 as the encrypted channel.
      service_uuid: "a92ab000-5501-11e4-916c-0800200c9a66"
      data_characteristic: "a92ab002-5501-11e4-916c-0800200c9a66"
      pairing_characteristic: "a92ab001-5501-11e4-916c-0800200c9a66"
      description: "Magnetic door sensor for detecting open/closed state. Not hardware-verified."

    keypad:
      name: "Nuki Keypad"
      # App-derived (device type 12). Single service a92ce000 (also its
      # advertised UUID) carrying a92ce001 (unencrypted data IO), a92ce002
      # (encrypted data IO) and a92ce003 (auxiliary channel, role unverified).
      # Earlier revisions tied it to a92ee400 / a92ee300 / a92ee301; those are
      # Smart Lock 5th-gen pairing UUIDs (see services).
      service_uuid: "a92ce000-5501-11e4-916c-0800200c9a66"
      data_characteristic: "a92ce002-5501-11e4-916c-0800200c9a66"
      pairing_characteristic: "a92ce001-5501-11e4-916c-0800200c9a66"
      description: >
        Wireless numeric keypad that pairs with a Smart Lock and manages access
        codes (6-digit PINs). Characteristic roles are app-derived and not
        hardware-verified.

    keypad_2:
      name: "Nuki Keypad 2.0"
      # App-derived (device type 16): same shape as the Keypad under a92de000
      # (a92de001 unencrypted, a92de002 encrypted, a92de003 auxiliary).
      service_uuid: "a92de000-5501-11e4-916c-0800200c9a66"
      data_characteristic: "a92de002-5501-11e4-916c-0800200c9a66"
      pairing_characteristic: "a92de001-5501-11e4-916c-0800200c9a66"
      description: "Second-generation keypad (fingerprint model). Not hardware-verified."

    fob:
      name: "Nuki Fob"
      service_uuid: "a92cf000-5501-11e4-916c-0800200c9a66"
      description: >
        NFC/BLE key fob for touch-to-unlock. Uses fob-specific commands (15-28)
        for authorization and configuration.

    box:
      name: "Nuki Box"
      service_uuid: "a92be000-5501-11e4-916c-0800200c9a66"
      description: "Nuki Box (wall-mounted access point)"

  command_protocol:
    framing:
      byte_order: "little_endian"
      crc:
        algorithm: "CRC-16/CCITT-FALSE"
        polynomial: "0x1021"
        initial: "0xFFFF"
        reflected: false
        xor_out: "0x0000"
        notes: "MSB-first, non-reflected (NOT the XModem variant — XModem would also imply init 0x0000). Matches the official doc's 'CRC-CCITT, normal (0x1021), initial remainder 0xFFFF' and pyNukiBT's Crc(width=16, poly=0x1021, initvalue=0xffff, reflect_input=False, reflect_output=False). Used on scan response data and message authentication."

    message_format:
      description: >
        Messages are read from ByteBuffer.wrap(payload).order(ByteOrder.LITTLE_ENDIAN).
        The base BleResponse class defines:
          channel (int, set externally) — routing/message type
          command (short) — command/response identifier
          payload — variable-length, command-specific data

    pairing:
      description: >
        Nuki uses public-key based pairing with challenge-response authentication:
        1. BLE connection and service discovery
        2. Public key exchange (CMD 3: PublicKeyRequest / PublicKeyResponse)
        3. Challenge-response authentication (CMD 4: ChallengeResponse, CMD 5: AuthorizationAuthenticatorRequest)
        4. Security PIN verification (CMD 32: VerifySecurityPinRequest)
        5. On success, the device returns an authorization ID used for subsequent commands
      nuki_specific:
        security_pin: "Numeric PIN set during initial setup: 4 digits (uint16) on Smart Lock 1.0-4.0, 6 digits (uint32) on Ultra/5th-gen/Go/Pro"
        authorization_id: "Integer ID assigned after successful pairing, used to authenticate all commands"

    commands:
      # --- Core Keyturner Commands ---
      request_data:
        id: 1
        name: "RequestDataRequest"
        direction: "client_to_device"
        description: "Request device data (serial number, etc.)"

      device_type:
        id: 2
        name: "DeviceTypeResponse"
        direction: "device_to_client"
        description: "Returns device type identifier"

      public_key:
        id: 3
        name: "PublicKeyRequest / PublicKeyResponse"
        direction: "bidirectional"
        description: "Public key exchange for pairing/authorization"

      challenge:
        id: 4
        name: "ChallengeResponse"
        direction: "device_to_client"
        description: "Challenge data for authentication"

      authorization_authenticator:
        id: 5
        name: "AuthorizationAuthenticatorRequest"
        direction: "client_to_device"
        description: "Send authorization authenticator after challenge"

      # --- Authorization management (official BLE API V2.3.0; documented but not
      #     yet exercised by this repo — payload detail only where the doc gives it) ---
      authorization_data:
        id: 6
        name: "AuthorizationDataRequest (0x0006)"
        direction: "client_to_device"
        description: "Create an authorization entry (official BLE API V2.3.0)"

      authorization_id:
        id: 7
        name: "AuthorizationIdResponse (0x0007)"
        direction: "device_to_client"
        description: "Returns the authorization ID. NOTE: 0x0007 is Authorization-ID, NOT Error Report (0x0012)."

      remove_authorization_entry:
        id: 8
        name: "RemoveAuthorizationEntryRequest (0x0008)"
        direction: "client_to_device"
        description: "Remove an authorization entry (official BLE API V2.3.0)"

      request_authorization_entries:
        id: 9
        name: "RequestAuthorizationEntriesRequest (0x0009)"
        direction: "client_to_device"
        description: "List authorization entries (official BLE API V2.3.0)"

      authorization_entry:
        id: 10
        name: "AuthorizationEntryResponse (0x000A)"
        direction: "device_to_client"
        description: "A single authorization entry (official BLE API V2.3.0)"

      authorization_data_invite:
        id: 11
        name: "AuthorizationDataInviteRequest (0x000B)"
        direction: "client_to_device"
        description: "Create an authorization entry via invite flow (official BLE API V2.3.0)"

      most_recent_command:
        id: 15
        name: "MostRecentCommandResponse (0x000F)"
        direction: "device_to_client"
        description: "The most recent command executed by the lock (official BLE API V2.3.0)"

      openings_closings_summary:
        id: 16
        name: "OpeningsClosingsSummaryResponse (0x0010)"
        direction: "device_to_client"
        description: "Summary of door openings/closings (official BLE API V2.3.0)"

      battery_report:
        id: 17
        name: "BatteryReportResponse (0x0011)"
        direction: "device_to_client"
        description: "Battery report (official BLE API V2.3.0)"

      config:
        id: 21
        name: "ConfigResponse (0x0015)"
        direction: "device_to_client"
        description: "Device configuration response (official BLE API V2.3.0)"

      request_reboot:
        id: 29
        name: "RequestRebootRequest (0x001D)"
        direction: "client_to_device"
        description: "Reboot the lock (official BLE API V2.3.0)"

      authorization_id_confirmation:
        id: 30
        name: "AuthorizationIdConfirmationRequest (0x001E)"
        direction: "client_to_device"
        description: "Confirm the authorization ID after pairing (official BLE API V2.3.0)"

      keyturner_states:
        id: 12
        name: "KeyturnerStatesResponse"
        direction: "device_to_client"
        description: >
          Full device state notification. Returns lock state, battery, door sensor
          state, WiFi/Thread connectivity, night mode, and accessory status.
        fields:
          - name: "nukiState"
            type: "uint8"
            description: "Operational state of the lock"
          - name: "lockState"
            type: "uint8"
            description: "LockState enum value (0=uncalibrated, 1=locked, 3=unlocked, etc.) — single byte per official BLE API V2.3.0"
          - name: "trigger"
            type: "uint8"
            description: "Source of the last state change (0=system, 1=manual, 2=button, 3=automatic, 6=auto lock)"
          - name: "currentTime"
            type: "datetime"
            description: "Device current time (year, month, day, hour, min, sec)"
          - name: "timezoneOffset"
            type: "sint16"
            description: "Timezone offset (UTC) in minutes (official BLE API V2.3.0)"
          - name: "battery"
            type: "uint8"
            description: "Battery flags byte: bit0 = critical, bit1 = charging, bits 2-7 = charge level in steps of 2%"
          - name: "configUpdateCount"
            type: "uint8"
            description: "Current count of modifications to the internal config (official BLE API V2.3.0)"
          - name: "lockNGoTimer"
            type: "uint8"
            description: "Status of the lock'n'go timer, or 0 if no lock'n'go is active (official BLE API V2.3.0)"
          - name: "lastLockAction"
            type: "uint8"
            description: "Most recent lock action performed (official BLE API V2.3.0)"
          - name: "lastLockActionTrigger"
            type: "uint8"
            description: "Trigger that caused the most recent lock action (official BLE API V2.3.0)"
          - name: "lastLockActionCompletionStatus"
            type: "uint8"
            description: "Completion status of the most recent lock action (official BLE API V2.3.0)"
          - name: "doorSensorState"
            type: "uint8"
            description: "Door state (0=unavailable, 1=deactivated, 2=closed, 3=opened, 4=unknown, 5=calibrating, 0x10=uncalibrated, 0xF0=tampered)"
          - name: "nightModeActive"
            type: "bool"
            description: "Night mode is currently active"

      lock_action:
        id: 13
        name: "LockActionRequest / DoorLockActionRequest"
        direction: "client_to_device"
        description: "Perform a lock/unlock/unlatch/lock-n-go action. Wire format: lockAction u8 + authId u32 + flags u8 + optional 20-byte name suffix + 32-byte nonce (no trigger field — trigger only appears in Keyturner States)."
        fields:
          - name: "lockAction"
            type: "uint8"
            values:
              1: "UNLOCK"
              2: "LOCK"
              3: "UNLATCH"
              4: "LOCK_N_GO"
              5: "LOCK_N_GO_WITH_UNLATCH"
              6: "FULL_LOCK"
              129: "FOB_ACTION_1 (0x81)"
              130: "FOB_ACTION_2 (0x82)"
              131: "FOB_ACTION_3 (0x83)"
          - name: "authId"
            type: "uint32"
            description: "Authorization ID (assigned during pairing)"
          - name: "flags"
            type: "uint8"
            description: "Option flags (bit0 = auto-unlock, bit1 = force)"
          - name: "name_suffix"
            type: "bytes"
            description: "Optional 20-byte name suffix"
          - name: "nonce"
            type: "bytes"
            description: "32-byte nonce"

      status:
        id: 14
        name: "StatusResponse"
        direction: "device_to_client"
        description: "Simple status response (OK/error)"

      set_config:
        id: 19
        name: "SetConfigRequest"
        direction: "client_to_device"
        description: "Write device configuration (auto-lock timer, button enabled, LED brightness, etc.)"

      request_config:
        id: 20
        name: "RequestConfigRequest"
        direction: "client_to_device"
        description: "Read current device configuration"

      set_security_pin:
        id: 25
        name: "SetSecurityPinRequest"
        direction: "client_to_device"
        description: "Set or change the security PIN (4 digits on SL 1.0-4.0, 6 digits on Ultra/5th-gen/Go/Pro)"

      request_calibration:
        id: 26
        name: "RequestCalibrationRequest"
        direction: "client_to_device"
        description: "Start lock calibration procedure"

      authorization_id_invite:
        id: 31
        name: "AuthorizationIdInviteResponse"
        direction: "device_to_client"
        description: "Returns authorization ID after successful pairing invite"

      verify_security_pin:
        id: 32
        name: "VerifySecurityPinRequest"
        direction: "client_to_device"
        description: "Verify security PIN to authorize operations"

      update_time:
        id: 33
        name: "UpdateTimeRequest"
        direction: "client_to_device"
        description: "Synchronize device clock (timezone-aware)"

      update_authorization_entry:
        id: 37
        name: "UpdateAuthorizationEntryRequest (0x0025)"
        direction: "client_to_device"
        description: "Update an existing authorization entry (official BLE API V2.3.0)"

      authorization_entry_count:
        id: 39
        name: "AuthorizationEntryCountResponse"
        direction: "device_to_client"
        description: "Number of authorized users/devices"

      # --- Activity log (official BLE API V2.3.0) ---
      request_log_entries:
        id: 49
        name: "RequestLogEntriesRequest (0x0031)"
        direction: "client_to_device"
        description: "Request activity log entries (official BLE API V2.3.0)"

      log_entry:
        id: 50
        name: "LogEntryResponse (0x0032)"
        direction: "device_to_client"
        description: "A single activity log entry (official BLE API V2.3.0)"

      log_entry_count:
        id: 51
        name: "LogEntryCountResponse (0x0033)"
        direction: "device_to_client"
        description: "Count of activity log entries (official BLE API V2.3.0)"

      enable_logging:
        id: 52
        name: "EnableLoggingRequest (0x0034)"
        direction: "client_to_device"
        description: "Enable or disable activity logging (official BLE API V2.3.0)"

      # --- Advanced config (official BLE API V2.3.0) ---
      set_advanced_config:
        id: 53
        name: "SetAdvancedConfigRequest (0x0035)"
        direction: "client_to_device"
        description: "Write advanced configuration (official BLE API V2.3.0)"

      request_advanced_config:
        id: 54
        name: "RequestAdvancedConfigRequest (0x0036)"
        direction: "client_to_device"
        description: "Read advanced configuration (official BLE API V2.3.0)"

      advanced_config:
        id: 55
        name: "AdvancedConfigResponse (0x0037)"
        direction: "device_to_client"
        description: "Advanced configuration response (official BLE API V2.3.0)"

      # --- Time-control entries: time-based access windows (official BLE API V2.3.0) ---
      add_time_control_entry:
        id: 57
        name: "AddTimeControlEntryRequest (0x0039)"
        direction: "client_to_device"
        description: "Add a time-control entry (official BLE API V2.3.0)"

      time_control_entry_id:
        id: 58
        name: "TimeControlEntryIdResponse (0x003A)"
        direction: "device_to_client"
        description: "ID of a created time-control entry (official BLE API V2.3.0)"

      remove_time_control_entry:
        id: 59
        name: "RemoveTimeControlEntryRequest (0x003B)"
        direction: "client_to_device"
        description: "Remove a time-control entry (official BLE API V2.3.0)"

      request_time_control_entries:
        id: 60
        name: "RequestTimeControlEntriesRequest (0x003C)"
        direction: "client_to_device"
        description: "List time-control entries (official BLE API V2.3.0)"

      time_control_entry_count:
        id: 61
        name: "TimeControlEntryCountResponse (0x003D)"
        direction: "device_to_client"
        description: "Count of time-control entries (official BLE API V2.3.0)"

      time_control_entry:
        id: 62
        name: "TimeControlEntryResponse (0x003E)"
        direction: "device_to_client"
        description: "A single time-control entry (official BLE API V2.3.0)"

      update_time_control_entry:
        id: 63
        name: "UpdateTimeControlEntryRequest (0x003F)"
        direction: "client_to_device"
        description: "Update a time-control entry (official BLE API V2.3.0)"

      add_keypad_code:
        id: 65
        name: "AddKeypadCodeRequest (0x0041)"
        direction: "client_to_device"
        description: "Add a keypad access code (official BLE API V2.3.0)"

      keypad_code_id:
        id: 66
        name: "KeypadCodeIdResponse"
        direction: "client_to_device"
        description: "Add/update a keypad access code"

      request_keypad_codes:
        id: 67
        name: "RequestKeypadCodesRequest"
        direction: "client_to_device"
        description: "List all configured keypad codes"

      keypad_code_count:
        id: 68
        name: "KeypadCodeCountResponse"
        direction: "device_to_client"
        description: "Count of configured keypad codes"

      keypad_code:
        id: 69
        name: "KeypadCodeResponse (0x0045)"
        direction: "device_to_client"
        description: "A single keypad access code entry (official BLE API V2.3.0)"

      update_keypad_code:
        id: 70
        name: "UpdateKeypadCodeRequest (0x0046)"
        direction: "client_to_device"
        description: "Update a keypad access code (official BLE API V2.3.0)"

      remove_keypad_code:
        id: 71
        name: "RemoveKeypadCodeRequest"
        direction: "client_to_device"
        description: "Delete a keypad access code"

      authorization_info:
        id: 76
        name: "AuthorizationInfoResponse (0x004C)"
        direction: "device_to_client"
        description: "Information about the client's own authorization (official BLE API V2.3.0)"

      simple_lock_action:
        id: 256
        name: "SimpleLockActionRequest (0x0100)"
        direction: "client_to_device"
        description: "Simplified lock action without full authorization data (official BLE API V2.3.0)"

      # --- Error reporting ---
      error_report:
        id: 18
        name: "ErrorReportResponse / KeyturnerErrorReportResponse"
        direction: "device_to_client"
        description: "Error response with code and optional message (0x0012 per official BLE API V2.3.0 — 0x0007 is Authorization-ID, not Error Report)"

    error_codes:
      # Codes 1-5, 130/131 and 224/225 are app-derived (from its error-report
      # response class) — the official BLE API V2.3.0 error tables
      # list only 0xFD-0xFF general, 0x10-0x13 pairing and the 0x20+ keyturner
      # codes. 4 and 225 are NOT duplicates: the app names them distinctly —
      # generic 4 ERROR_ALREADY_CONFIGURED vs keyturner 225 (0xE1)
      # KEYTURNER_ERROR_ALREADY_CONFIGURED.
      generic:
        1: "ERROR_BAD_PARAMETER"
        2: "ERROR_NOT_AUTHORIZED"
        3: "ERROR_BAD_PIN"
        4: "ERROR_ALREADY_CONFIGURED"
        5: "ERROR_BAD_AUTHENTICATOR"
        224: "KEYTURNER_ERROR_NOT_IN_MAINTENANCE_MODE (0xE0, app-derived)"
        225: "KEYTURNER_ERROR_ALREADY_CONFIGURED (0xE1, app-derived — distinct from generic code 4)"
        253: "ERROR_BAD_CRC"
        254: "ERROR_BAD_LENGTH"
        255: "ERROR_UNKNOWN"
      pairing:
        16: "PAIRING_ERROR_NOT_PAIRING"
        17: "PAIRING_ERROR_BAD_AUTHENTICATOR"
        18: "PAIRING_ERROR_BAD_PARAMETER"
        19: "PAIRING_ERROR_MAX_USER"
      keyturner:
        32: "KEYTURNER_ERROR_NOT_AUTHORIZED"
        33: "KEYTURNER_ERROR_BAD_PIN"
        34: "KEYTURNER_ERROR_BAD_NONCE"
        35: "KEYTURNER_ERROR_BAD_PARAMETER"
        36: "KEYTURNER_ERROR_INVALID_AUTH_ID"
        37: "KEYTURNER_ERROR_DISABLED"
        38: "KEYTURNER_ERROR_REMOTE_NOT_ALLOWED"
        39: "KEYTURNER_ERROR_TIME_NOT_ALLOWED"
        40: "KEYTURNER_ERROR_TOO_MANY_PIN_ATTEMPTS"
        41: "KEYTURNER_ERROR_TOO_MANY_ENTRIES"
        42: "KEYTURNER_ERROR_CODE_ALREADY_EXISTS"
        43: "KEYTURNER_ERROR_CODE_INVALID (0x2B)"
        44: "KEYTURNER_ERROR_CODE_INVALID_TIMEOUT_1 (0x2C)"
        45: "KEYTURNER_ERROR_CODE_INVALID_TIMEOUT_2 (0x2D)"
        46: "KEYTURNER_ERROR_CODE_INVALID_TIMEOUT_3 (0x2E)"
        47: "KEYTURNER_ERROR_FIRMWARE_BINARY_MISMATCH"
        48: "KEYTURNER_ERROR_NOT_PAID"
        64: "KEYTURNER_ERROR_AUTO_UNLOCK_TOO_RECENT"
        65: "KEYTURNER_ERROR_POSITION_UNKNOWN"
        66: "KEYTURNER_ERROR_MOTOR_BLOCKED"
        67: "KEYTURNER_ERROR_CLUTCH_FAILURE"
        68: "KEYTURNER_ERROR_MOTOR_TIMEOUT"
        69: "KEYTURNER_ERROR_BUSY"
        70: "KEYTURNER_ERROR_CANCELED"
        71: "KEYTURNER_ERROR_NOT_CALIBRATED"
        72: "KEYTURNER_MOTOR_POSITION_LIMIT"
        73: "KEYTURNER_ERROR_MOTOR_LOW_VOLTAGE"
        74: "KEYTURNER_ERROR_MOTOR_POWER_FAILURE"
        75: "KEYTURNER_ERROR_CLUTCH_POWER_FAILURE"
        76: "KEYTURNER_ERROR_VOLTAGE_TOO_LOW"
        77: "KEYTURNER_ERROR_FIRMWARE_UPDATE_NEEDED"
        78: "KEYTURNER_ERROR_REJECTED"
        79: "KEYTURNER_ERROR_REJECTED_NIGHT_MODE"
        96: "KEYTURNER_ERROR_DS_CALIBRATION_FAILED"
        97: "KEYTURNER_ERROR_DS_TIMEOUT"
        98: "KEYTURNER_ERROR_DS_BROKEN"
      wifi_module:
        130: "KEYTURNER_ERROR_NO_WIFI_MODULE_AVAILABLE (0x82, app-derived)"
        131: "KEYTURNER_ERROR_WIFI_SCAN_FAILED (0x83, app-derived)"

    lock_states:
      0: "UNCALIBRATED — Lock not yet calibrated, cannot operate"
      1: "LOCKED — Door is locked"
      2: "UNLOCKING — Motor is unlocking"
      3: "UNLOCKED — Door is unlocked"
      4: "LOCKING — Motor is locking"
      5: "UNLATCHED — Lock is unlatched (door can be pushed open)"
      6: "UNLOCKED_LOCKNGO_ACTIVE — Unlocked with Lock-n-Go active"
      7: "UNLATCHING — Motor is unlatching"
      252: "CALIBRATION — Lock is in calibration mode"
      253: "BOOT_RUN — Lock is booting up"
      254: "MOTOR_BLOCKED — Motor is blocked, cannot move"
      255: "UNDEFINED — State unknown"

    lock_actions:
      1: "UNLOCK — Unlock the door"
      2: "LOCK — Lock the door"
      3: "UNLATCH — Unlatch (pull back the latch)"
      4: "LOCK_N_GO — Lock and unlatch (single cycle)"
      5: "LOCK_N_GO_WITH_UNLATCH — Lock-n-Go with unlatch at end"
      6: "FULL_LOCK — Full lock"
      129: "FOB_ACTION_1 (0x81) — Fob action 1"
      130: "FOB_ACTION_2 (0x82) — Fob action 2"
      131: "FOB_ACTION_3 (0x83) — Fob action 3"

    door_sensor_states:
      0: "UNAVAILABLE"
      1: "DEACTIVATED"
      2: "DOOR_CLOSED"
      3: "DOOR_OPENED"
      4: "DOOR_UNKNOWN"
      5: "CALIBRATING"
      16: "UNCALIBRATED (0x10, SL 3.0 and later)"
      240: "TAMPERED (0xF0, SL 3.0 and later)"

