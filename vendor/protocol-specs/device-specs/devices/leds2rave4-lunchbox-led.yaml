device:
  name: "LEDs2RAVE4 / Lunchbox Dream LED (SP107E/SP110E/SPOTLED)"
  manufacturer: "Shenzhen Sperll Optoelectronic (SPLED)"
  manufacturer_status: "unsupported"
  aliases: ["LEDs2RAVE4", "Lunchbox Dream LED", "Dream LED Skin", "DreamSkin", "DreamPanel", "Lunchbox backpack", "SP107E", "SP110E", "SPOTLED"]
  distributors:
    - name: "LEDs 2 RAVE 4"
      role: "brand"
      url: "https://leds2rave4.com/"
      notes: "DreamSkin and DreamPanel product line, created with Lunchbox Packs."
    - name: "Lunchbox Packs"
      role: "retailer"
      url: "https://www.lunchboxpacks.com/"
      notes: "Lunchbox backpack retailer and setup-guide publisher."
    - name: "Shenzhen Sperll Optoelectronic Technology Co., Ltd. (SPLED)"
      role: "manufacturer"
      notes: "SP107E / SP110E controllers and LED CHORD / LED Hue apps."
    - name: "Host No.4 Technology (Chengdu) Co., Ltd."
      role: "manufacturer"
      notes: "SPOTLED panels and app for v2 and early v3 generations."
    - name: "Shenzhen I-ledshow Technology Co., Ltd."
      role: "manufacturer"
      notes: "iLEDColor app used by recent DreamPanel v3 boards."
  companion_apps:
    - name: "LED CHORD"
      package: "com.spled.pzse"
      role: "variant"
      platform: "android"
      url: "https://play.google.com/store/apps/details?id=com.spled.pzse"
      notes: "Dream LED Skin v1 and SP107E; SP110E uses LED Hue instead."
    - name: "SPOTLED"
      package: "com.led.spotled"
      role: "primary"
      platform: "android"
      url: "https://play.google.com/store/apps/details?id=com.led.spotled"
      notes: "Dream LED Skin 2.0 and early DreamPanel v3. Deprecated on recent Android."
    - name: "iLEDColor"
      package: "com.led.iledcolor"
      role: "alternative"
      platform: "ios"
      url: "https://apps.apple.com/us/app/iledcolor/id6737223690"
      notes: "Recent DreamPanel v3 boards; horizontal serial number selects this app."
    - name: "PIXELY GLOW"
      role: "alternative"
      platform: "android"
      url: "https://leds2rave4.com/blogs/animated-gifs/spotled-android-fix"
      notes: "Vendor-suggested alternative when SPOTLED cannot be installed on recent Android."
  testing:
    status: verified
    detail: minimally-verified
    notes: >
      On 2026-11-07 this project queried one SPOTLED unit (96x16 RGB, 7280-byte
      receive buffer), uploaded a static RGB frame and completed a single-frame
      native scroll-left upload with success acknowledgements. An eight-frame
      full-RGB upload was rejected with response 254, so arbitrary multi-frame
      support is not claimed. SP107E, SP110E and other panel geometries remain
      untested; iLEDColor hardware is covered by its own spec.
  protocol: "ble"
  category: "display"
  category_hierarchy: ["display", "led_matrix"]
  notes: >
    SPI LED pixel controllers and matrix panels used in LEDs2RAVE4 / Lunchbox
    Dream LED products. The generations do not share one protocol:
      * SP107E ("LED Chord") — Nordic UART service 0xFFE0, single characteristic
        0xFFE1 (write + notify). Fixed 4-byte command frame [d0, d1, d2, cmd_byte];
        no length prefix or checksum. check_device (cmd 0x01) returns 15 bytes.
      * SP110E ("LED Hue") — the same 0xFFE0/0xFFE1 channel but a different
        4-byte opcode set (the sp110e_* commands below).
      * SPOTLED matrix panels (com.led.spotled) — service 0xFF20, FF21 command
        and FF22 data. Data payloads use a 15-byte header (uint32 header length
        15, uint16 command type 0x8004, uint32 serial, uint32 content length,
        1-byte checksum), followed by typed records. The complete record and
        effect tables are in spotled-led-panel.yaml, the canonical reference.
      * Recent iLEDColor DreamPanel v3 boards — separate A950/A951/A952/A953
        protocol in iledcolor-led-panel.yaml. A tested unit had no FF20 service;
        iLEDColor is not a cloud-only or unmapped target.

    DESIGN APP PER GENERATION (the app, not the model name, identifies the protocol):
      * Dream LED Skin v1        -> LED CHORD (com.spled.pzse)   -> SP107E, 0xFFE0
      * Dream LED Skin 2.0       -> SPOTLED   (com.led.spotled)  -> framed, 0xFF20
      * Dream Skin 3.0 early     -> SPOTLED   (com.led.spotled)  -> framed, 0xFF20
      * Dream Skin 3.0 recent    -> iLEDColor (com.led.iledcolor) -> A950
    LEDs2RAVE4 changed the DreamPanel v3 controller board mid-production-run. If
    the panel's serial number renders horizontally, the unit needs iLEDColor;
    vertical selects SPOTLED.

    SPOTLED upload flow is device-driven: write (MTU - 3) byte chunks and, when
    ContinueSending (type 255) arrives, resume from its offset rather than your
    own cursor. Do not wait at a fixed buffer_size/chunk_size threshold: the
    vendor sender paces writes and reacts to device responses. SendingDataFinish
    succeeds with response type 4, status 0, not type 2. PauseSending (type 254)
    can indicate bad MTU, but was also observed rejecting an eight-frame RGB
    payload; it is not proof of an MTU problem. GetDisplayInfo returns real
    width, height, colour depth (16 mono / 255 RGB), advertised frame limit,
    brightness and font info — query it instead of hardcoding a panel size.
    The tested unit reported 96x16 RGB, frame limit 20 and a 7280-byte buffer.

    CONFIDENCE: the SPOTLED UUIDs, queries, static RGB upload and single-frame
    native scroll are hardware-confirmed. Multi-frame RGB limits, AE30/FF10
    roles and the SP107E/SP110E live command tables remain open. SP107E static
    colour is 0x0C, not 0x04 (RGB order); SP110E speed is 0x00-0xFF. The full
    SP107E opcode map and 26-byte status layout are documented in UniLED.
    SPOTLED is deprecated on recent Android; LEDs2RAVE4 recommends a sideload
    or PIXELY GLOW. The LED Chord / LED Hue seller is Shenzhen Sperll
    Optoelectronic Technology Co., Ltd.
  identification:
    local_name_prefixes: ["SP1", "LBXDRMSKIN_LED_", "SpotLED_"]
    service_uuids:
      - "0000ffe0-0000-1000-8000-00805f9b34fb"
      - "0000ff20-0000-1000-8000-00805f9b34fb"
  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            values: ["SP1", "LBXDRMSKIN_LED_", "SpotLED_"]
          service_uuids:
            - "0000ffe0-0000-1000-8000-00805f9b34fb"
            - "0000ff20-0000-1000-8000-00805f9b34fb"
        notes: >
          Some SPOTLED advertisement samples contain only 0x1812, so do not
          require FF20 in every individual sample. Match a known name or an
          advertised protocol service, then confirm the GATT layout.
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning. SP107E/SP110E controllers accept a connection from any
      central; the LED strip layout is configured by command after connecting,
      not during setup. The SPOTLED query and upload onboarding path was
      exercised successfully on 2026-11-07.
    methods:
      - type: "ble_direct"
        verified: true
        description: >
          No provisioning step: the device advertises as soon as it is powered
          on and accepts a connection from any central. There is no account, no
          network credential exchange and no pairing PIN, so a replacement
          client only has to scan, connect and write. Verification covers the
          SPOTLED generation; SP107E/SP110E remain source-derived.
        ble:
          advertised_name: "SP1 / LBXDRMSKIN_LED_ / SpotLED_"
          pairing_required: false
        steps:
          - action: "Power the device and scan for its advertisement."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect, enable FF21 notifications on SPOTLED, then query BufferSize and DisplayInfo before uploading."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        No credential state to clear. Power-cycling drops the current
        connection, which is the actual remedy for the common failure mode:
        the device already being connected to another central.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "Device advertises again and accepts a new connection."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds this device to a network or an owner, so switching
        controllers is just connecting from the new one. If the old client is
        an Android or iOS phone, remove the device from the OS Bluetooth list
        as well — a cached bond can keep the phone reconnecting automatically
        and holding the single available link.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        Anything within radio range can connect and issue commands. Physical
        proximity is the only access control.
  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
  variants:
    - model: "SP107E"
      identification:
        local_name_prefix: "SP107e"
        service_uuids:
          - "0000ffe0-0000-1000-8000-00805f9b34fb"
    - model: "SP110E"
      identification:
        service_uuids:
          - "0000ffe0-0000-1000-8000-00805f9b34fb"
    - model: "SPOTLED Matrix Panel (Dream Skin)"
      identification:
        local_name_prefixes: ["LBXDRMSKIN_LED_", "SpotLED_"]
        service_uuids:
          - "0000ff20-0000-1000-8000-00805f9b34fb"

services:
  # SP107E / SP110E — Nordic UART, 4-byte fixed command frame
  - uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
    name: "SP107E/SP110E LED Control Service (Nordic UART)"
    characteristics:
      - uuid: "0000ffe1-0000-1000-8000-00805f9b34fb"
        name: "Control"
        properties: ["write", "notify"]
        notes: >
          Fixed 4-byte command frame [d0, d1, d2, cmd_byte]; no length prefix,
          no checksum. Notifications (e.g. check_device's 15-byte reply) arrive
          on this same characteristic. Confidence: core opcodes HIGH, others MEDIUM.
          SP110E hardware uses this same service/characteristic with its own
          4-byte opcode set (mbullington sp110e.md gist: "My device's service id
          is 0xFFE0 and has one characteristic 0xFFE1") — the sp110e_* commands
          below. The full SP107E opcode map and 26-byte status layout are
          decoded in monty68/uniled led_chord.py.
        commands:
          sp107e_check_device:
            description: "SP107E: probe/handshake (cmd 0x01); response is 15 bytes"
            value: [0x00, 0x00, 0x00, 0x01]
          sp107e_power_on:
            description: "SP107E: Turn on (cmd 0xAA)"
            value: [0x00, 0x00, 0x00, 0xAA]
          sp107e_power_off:
            description: "SP107E: Turn off (cmd 0xBB)"
            value: [0x00, 0x00, 0x00, 0xBB]
          sp107e_set_color:
            description: "SP107E: Set static RGB colour (cmd 0x0C — NOT 0x04; 0x04 is SET_RGB_SEQ colour order and would reprogram the chip's RGB sequence)"
            template: ["{red}", "{green}", "{blue}", 0x0C]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          sp107e_set_brightness:
            description: "SP107E: Set brightness (secondary source, verify)"
            template: ["{level}", 0x00, 0x00, 0x0A]
            parameters:
              level:
                type: "uint8"
                min: 0
                max: 255
          sp107e_set_effect:
            description: "SP107E: Set effect 0x01-0xB4 dynamic, 0xB5 static (secondary source, verify)"
            template: ["{mode}", 0x00, 0x00, 0x08]
            parameters:
              mode:
                type: "uint8"
                min: 0
                max: 249
          sp107e_status_query:
            description: "SP107E: Query status, returns 26 bytes in 2 packets (secondary source, verify)"
            value: [0x00, 0x00, 0x00, 0x02]
          sp110e_power_on:
            description: "SP110E: Turn on (secondary source, verify)"
            value: [0x00, 0x00, 0x00, 0xAA]
          sp110e_power_off:
            description: "SP110E: Turn off (secondary source, verify)"
            value: [0x00, 0x00, 0x00, 0xAB]
          sp110e_set_color:
            description: "SP110E: Set static RGB colour (secondary source, verify)"
            template: ["{red}", "{green}", "{blue}", 0x1E]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          sp110e_set_brightness:
            description: "SP110E: Set brightness 0x00-0xFF (secondary source, verify)"
            template: ["{level}", 0x00, 0x00, 0x2A]
            parameters:
              level:
                type: "uint8"
                min: 0
                max: 255
          sp110e_set_effect:
            description: "SP110E: Set effect 0x01-0x78 dynamic, 0x79 static (secondary source, verify)"
            template: ["{mode}", 0x00, 0x00, 0x2C]
            parameters:
              mode:
                type: "uint8"
                min: 0
                max: 121
          sp110e_set_speed:
            description: "SP110E: Set animation speed 0x00-0xFF (secondary source, verify)"
            template: ["{speed}", 0x00, 0x00, 0x03]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
          sp110e_status_query:
            description: "SP110E: Query device status, returns 12 bytes (secondary source, verify)"
            value: [0x00, 0x00, 0x00, 0x10]

  # SPOTLED matrix panel — framed transport (len + cmdID + serial + content + 1-byte sum)
  - uuid: "0000ff20-0000-1000-8000-00805f9b34fb"
    name: "SPOTLED Matrix Panel Service"
    initialization:
      - characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
        subscribe: true
      - characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
        write: [0x04, 0x14, 0x00, 0x00]
        notes: "Await the type-21 BufferSize notification, not an ATT read."
      - characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
        write: [0x04, 0x12, 0x00, 0x00]
        notes: "Await the type-19 DisplayInfo notification."
    characteristics:
      - uuid: "0000ff21-0000-1000-8000-00805f9b34fb"
        name: "Command"
        properties: ["write_without_response", "notify"]
        notes: >
          SPOTLED app protocol (com.led.spotled), live-confirmed on a 96x16
          RGB unit. Canonical reference: spotled-led-panel.yaml — keep in sync.
          Commands are complete frames and must not receive another framing
          layer. Notification values have a two-byte outer header
          [total_length][response_type], followed by the documented content.
          SendingDataFinish succeeds with response type 4 and status zero.
        commands:
          spotled_sending_data_start:
            description: >
              SPOTLED: announce an incoming data payload. Expect response
              type 2 with matching serial/type and status zero.
            template: [0x0A, 0x01, "{serial_hi}", "{serial_lo}", "{type_hi}", "{type_lo}", "{len_b3}", "{len_b2}", "{len_b1}", "{len_b0}"]
            verification: "confirmed"
            parameters:
              serial_hi: { type: "uint8" }
              serial_lo: { type: "uint8" }
              type_hi: { type: "uint8" }
              type_lo: { type: "uint8" }
              len_b3: { type: "uint8" }
              len_b2: { type: "uint8" }
              len_b1: { type: "uint8" }
              len_b0: { type: "uint8" }
          spotled_sending_data_finish:
            description: >
              SPOTLED: payload fully transmitted. Expect response type 4
              with matching serial/type and status zero, not type 2.
            template: [0x0A, 0x03, "{serial_hi}", "{serial_lo}", "{type_hi}", "{type_lo}", "{len_b3}", "{len_b2}", "{len_b1}", "{len_b0}"]
            verification: "confirmed"
            parameters:
              serial_hi: { type: "uint8" }
              serial_lo: { type: "uint8" }
              type_hi: { type: "uint8" }
              type_lo: { type: "uint8" }
              len_b3: { type: "uint8" }
              len_b2: { type: "uint8" }
              len_b1: { type: "uint8" }
              len_b0: { type: "uint8" }
          spotled_get_version:
            description: "SPOTLED: device type + device/software revision (13-byte content after the two-byte response header)."
            value: [0x04, 0x10, 0x00, 0x00]
            verification: "confirmed"
          spotled_get_display_info:
            description: >
              SPOTLED: query big-endian width, height, colour depth
              (16 mono / 255 RGB), advertised frame limit, brightness and font
              info (11-byte content after the two-byte response header).
            value: [0x04, 0x12, 0x00, 0x00]
            verification: "confirmed"
          spotled_get_buffer_size:
            description: "SPOTLED: device data buffer size (7-byte content after the two-byte response header)."
            value: [0x04, 0x14, 0x00, 0x00]
            verification: "confirmed"

      - uuid: "0000ff22-0000-1000-8000-00805f9b34fb"
        name: "Data"
        properties: ["write_without_response"]
        notes: >
          Bulk data channel (used alongside FF21). Payload structure and typed
          records are canonical in spotled-led-panel.yaml. Write (MTU - 3)
          byte chunks and react to device-driven ContinueSending (type 255)
          offsets; do not assume a fixed buffer-full threshold. PauseSending
          (type 254) may mean bad MTU but also rejected an eight-frame RGB
          payload, whose exact limiting factor remains unresolved.

features:
  - type: "image_upload"
    variants: ["SPOTLED Matrix Panel (Dream Skin)"]
    format: "rgb888"
    resolution_source: "device_reported"
    verification: "confirmed"
    notes: >
      A 96x16 RGB static upload and a single-frame native scroll-left upload
      completed at MTU 512 in ten chunks with type-2 start and type-4 finish
      success responses. GetDisplayInfo supplies geometry. An eight-frame
      full-RGB upload was rejected with response 254, so the advertised
      20-frame field is not treated as a proven multi-frame limit.

entities:
  - platform: "light"
    name: "LED Strip"
    variants: ["SP107E"]
    features: ["brightness", "color"]
    state_characteristic: "0000ffe1-0000-1000-8000-00805f9b34fb"
    commands:
      turn_on: "sp107e_power_on"
      turn_off: "sp107e_power_off"
      set_color: "sp107e_set_color"
      set_brightness: "sp107e_set_brightness"
  - platform: "light"
    name: "LED Strip"
    variants: ["SP110E"]
    features: ["brightness", "color", "effect"]
    state_characteristic: "0000ffe1-0000-1000-8000-00805f9b34fb"
    commands:
      turn_on: "sp110e_power_on"
      turn_off: "sp110e_power_off"
      set_color: "sp110e_set_color"
      set_brightness: "sp110e_set_brightness"
      set_effect: "sp110e_set_effect"
    notes: >
      SP110E dialect of the same 0xFFE1 channel — the two variants share the
      characteristic but not the opcode set, hence the per-variant entities.
      All sp110e_* opcodes are secondary-source; verify on hardware.

remaining_unknowns:
  - "SP107E and SP110E commands remain source-derived; no live capture verifies their characteristic properties or per-variant tables."
  - "The tested SPOTLED unit rejected an eight-frame full-RGB payload with response 254. Its true multi-frame/resource limit and the meaning of the advertised frame-limit field need an official-app capture."
  - "AE30 and FF10 were enumerated on the SPOTLED unit but not used; their roles are unknown."
  - "Static RGB and single-frame native scrolling are confirmed only on the tested 96x16 unit. Other geometries, text/font records, brightness/screen-mode writes and factory reset remain unverified."
  - "iLEDColor settings beyond the separate spec's confirmed Connect/TestPass and upload flows remain open."

helpful_urls:
  - title: "monty68/uniled — UniLED (HACS)"
    url: "https://github.com/monty68/uniled"
    description: >-
      HACS integration for SP LED / BanlanX-family BLE controllers (LED Chord / SP107E, LED
      Hue / SP110E); a production Home Assistant consumer of the SP107E command set this spec
      documents. Does not cover the later SPOTLED-app panel generation.
  - title: "SP110E Bluetooth LED controller operating instructions (PDF)"
    url: "https://m.media-amazon.com/images/I/81-vuGVbmgL.pdf"
    kind: "manual"
    description: >
      Vendor instructions for the SP110E.
  - title: "SP107E Bluetooth LED music controller manual (PDF)"
    url: "https://www.ledbe.com/image/catalog/Sperll/sp107e-manual.pdf"
    kind: "manual"
    description: >
      Vendor manual for the SP107E, the music-reactive sibling this spec also covers.
  - title: "SP105E LED controller manual (PDF)"
    url: "https://www.ledbe.com/image/catalog/Sperll/sp105e-magic-controller-manual.pdf"
    kind: "manual"
    description: >
      Manual for the SP105E, a sibling of the SP107E/SP110E this spec covers.
