    description: >
      Static analysis of the final release of the June companion Android app
      (2026-08-18). Its environment enum supplied the prod/dev REST,
      messaging, WebSocket and recipe hosts plus the app-constant
      client_id/client_secret; its message-code factory and payload adapters
      supplied the envelope; its HTTP client supplied the three hardcoded
      certificate SPKI pins. Also verified here: zero BLE GATT service UUIDs
      anywhere in the app, a bundled libsodium in seven ABIs, and no
      OTA/firmware code in the companion at all.
