    title: "warhammerkid/bluetti_mqtt"
    description: "Primary working implementation (Python/bleak): UUIDs, MODBUS framing, CRC, complete EP500 register map, retry etiquette, discovery regex."
  - url: "https://github.com/Patrick762/bluetti-bt-lib"
    title: "Patrick762/bluetti-bt-lib"
    description: "Independent working library: cross-checks EP500 addresses, adds the V2 register layout and the encrypted-protocol handshake port."
  - url: "https://github.com/Patrick762/hassio-bluetti-bt"
    title: "Patrick762/hassio-bluetti-bt"
    description: "Home Assistant integration; advertisement local_name matchers (EP5* etc.)."
  - url: "https://github.com/mariolukas/Bluetti_ESP32_Bridge"
    title: "mariolukas/Bluetti_ESP32_Bridge"
    description: "ESP32 C++ bridge; third independent confirmation of service UUID, poll ranges and write registers 3007/3008."
