# NIIMBOT D110 / B21 Thermal Label Printer
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "NIIMBOT D110 / B21 Thermal Label Printer"
  manufacturer: "NIIMBOT (Wuhan Jingchen Intelligent Identification Technology Co., Ltd., FCC ID 2ARXB)"
  manufacturer_status: "unsupported"
  testing:
    status: untested
  protocol: "ble"
  category: "printer"
  notes: >
    Popular cheap thermal label printer with a closed ecosystem. $15-30.
    D110 is a compact single-label printer; B21 adds larger print width
    and more features. The community open-source client "NiimBlue"
    (Web Bluetooth) has reverse-engineered the full protocol through
    MultiMote/niimbluelib.

    PROTOCOL: packet-based binary protocol over BLE GATT. Each packet uses
    0x55 0x55 as header and 0xAA 0xAA as tail. Packet structure:
    [prefix(optional)] [0x55 0x55] [command] [data_length] [data...]
    [checksum] [0xAA 0xAA].

    CHECKSUM: XOR of all bytes from command through the last data byte
    (inclusive). For simple request packets (data_length=1, data=1),
    checksum equals the command byte.

    PACKET TYPES:
    - 0xC1 Connect / 0xC2 response (connection handshake, only packet
      with 0x03 prefix)
    - 0x01 PrintStart (1-9 byte variants depending on model)
    - 0x13 SetPageSize (2-13 byte variants)
    - 0x03 PageStart / 0xE3 PageEnd
    - 0xF3 PrintEnd
    - 0x21 SetDensity / 0x31 response
    - 0x23 SetLabelType / 0x33 response
    - 0x84 PrintEmptyRow (fill row with white pixels)
    - 0x85 PrintBitmapRow (send row with black/white pixel data)
    - 0x83 PrintBitmapRowIndexed (row with < 7 black pixels, uses pixel
      indexes)
    - 0xDC Heartbeat / 0xDD, 0xDE, 0xDF and 0xD9 responses (0xD9 =
      Advanced2, the normal response on protocol-v3+ printers)
    - 0x40 GetDeviceInfo — multiple response IDs for different info
      (serial, hardware, firmware, etc.)
    - 0x28 PrinterReset / 0x38 response
    - 0xF5 StartFirmwareUpgrade (uses CRC32 variant of packet format)

    D110 SPECIFIC: uses 1-byte PrintStart variant. SetPageSize uses the
    4-byte [rows(u16), cols(u16)] BIG-endian variant (the 2-byte
    row-count-only variant is the old D11, not the D110). Printhead is
    96px wide (12mm @203dpi, 12 bytes/row for 1-bit data) — NOT 384px;
    384px/48mm is the B21 printhead.

    BITMAP ROW ENCODING: PrintBitmapRow (0x85) sends row data with a
    black-pixel-count segment. For rows with fewer than 7 black pixels,
    PrintBitmapRowIndexed (0x83) sends pixel x-coordinates as uint16
    BIG-endian values (Utils.u16ToBytes; wiki example x=320 = 01 40)
    instead of a full bitmap.

    HEARTBEAT: send 0xDC with data [0x01] or [0x04] (protocol version
    dependent). Response includes lid closed status, charge level, paper
    inserted, RFID status, and (on newer models) ribbon state.

    DISCOVERY: advertised names are model-prefixed ("D110-*", "B21-*",
    "D11-*"); every known implementation matches model names, and none
    matches a "NIIMBOT" prefix — do not scan for "NIIMBOT". Service
    UUID is manufacturer-specific; the niimbluelib handles service/char
    discovery dynamically.

    FIRMWARE / ECOSYSTEM (verified 2026-07-31): the community archive
    fw.niim.blue hosts original, unmodified official firmware (D110 up to
    v13.15, B21 up to v1.31); D110 images are raw (base 0x01010000) and
    newer files carry a 0x18-signature header with length + CRC32 fields.
    D110 MCU is a YiCHiP YC3121-d (D110_M: YC3122-L, refuses downgrades).
    The vendor cloud API is live without auth:
    POST print.niimbot.com/api/firmware/machineCascadeDetail returns
    per-model characteristics. Newer "v4" models (D110_M, B21_PRO, D11_H)
    use a different print task — 9-byte PrintStart, 13-byte SetPageSize,
    no PageStart — so the uniform-protocol assumption is aging. Consumable
    lock-in: paper/ribbon RFID tags (RfidInfo 0x1A/0x1C, WriteRFID 0x70,
    AntiFake 0x0B) plus a region lock are documented on the wiki.

    CONFIDENCE: HIGH for packet format, checksum algorithm, command IDs,
    PrintStart/SetPageSize variants, bitmap row encoding, and heartbeat
    format — sourced from MultiMote/niimbluelib, the production-quality
    TypeScript library behind niim.blue, tested against D110, B21, B1,
    D11, and other NIIMBOT models.

  identification:
    local_name_prefix: "D110"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "D110"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      Connect, send Connect packet (0xC1), then begin print sequence.
      No pairing or bonding required.
    methods:
      - type: "ble_direct"
        # Derived from the NiimBlue/niimbluelib community client, which does run
        # this flow against real printers — but not verified here, which is what
        # this field claims. False, matching the block's medium confidence.
        verified: false
        description: >
          Scan for model-prefixed advertisement, connect, send connect handshake,
          then start print sequence.
        ble:
          pairing_required: false
        steps:
          - action: "Power on the printer."
            actor: "user"
            request:
              protocol: "ble_gatt"
          - action: >
              Scan for a model-prefixed name ("D110-*", "B21-*") and connect.
            actor: "client"
          - action: >
              Send Connect packet (0xC1) and receive response (0xC2).
            actor: "client"
          - action: >
              Begin print sequence: SetDensity → SetLabelType → PrintStart →
              PageStart → SetPageSize → print rows → PageEnd → PrintEnd.
            actor: "client"
    factory_reset:
      confidence: "medium"
      effect: >
        Send PrinterReset packet (0x28). Returns response 0x38.
      procedures:
        - name: "Command reset"
          steps:
            - action: "Send 0x28 packet to printer."
              actor: "client"
              expect: "Device responds with 0x38 and resets."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "No bonding. Any central can connect."
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: "BLE-only. No auth."

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
  variants:
    - model: "D110"
      identification:
        local_name_prefix: "D110"
      notes: >
        96px printhead (12mm @203dpi, 12 bytes/row). 1-byte PrintStart.
        4-byte SetPageSize [rows(u16), cols(u16)] big-endian.
    - model: "B21"
      identification:
        local_name_prefix: "B21"
      notes: >
        Larger print width (384px/48mm printhead). May use extended
        PrintStart/SetPageSize variants.
    - model: "D11"
      identification:
        local_name_prefix: "D11"
      notes: "Similar to D110. 1-byte PrintStart; old D11 uses the 2-byte SetPageSize."

features:
  - type: "image_upload"
    max_width: 96
    max_height: 65535
    format: "1bit-bitmap"
    # 1 bit per pixel — black or white, nothing between. Stated so an editor
    # does not quantize to another device's 16-colour ceiling.
    max_palette_colors: 2
  # The upload IS the device: the packet protocol prints rows and resolves no
  # entities, and a consumer keeps the printer on this marker rather than
  # dropping it as empty. Declared beside image_upload, which describes the
  # bitmap the stream takes.
  - type: "raster_print"
  - type: "firmware_update"
    dfu:
      mechanisms: ["vendor_ble"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "public_url"
        format: >
          Raw application image (D110 base address 0x01010000); newer files
          carry the 0x18-signature header with length and CRC32 fields
          described in device.notes.
        notes: >
          The community archive https://fw.niim.blue hosts original,
          unmodified official images (D110 up to v13.15, B21 up to v1.31).
          Whether the bootloader checks anything beyond the CRC32 is not
          established. The D110_M (YC3122-L) refuses downgrades.
      enter:
        how: "unknown"
        notes: >
          niimbluelib names packet 0xF5 StartFirmwareUpgrade and sends it in
          a CRC32 variant of the packet format rather than the XOR-checksum
          envelope. That variant's layout is not written down here, so the
          packet is not declared as a command; a client that builds it must
          treat it as advanced.
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        From MultiMote/niimbluelib and the fw.niim.blue archive; not
        exercised by this project. The same packet protocol also runs over
        Bluetooth Classic SPP (RFCOMM channel 1) and USB serial, and whether
        the upgrade packet works on those transports is not established. The
        print service carries every ordinary command too, so it is not
        listed under `services`.

services:
  - uuid: "e7810a71-73ae-499d-8c15-faa9aef0c3f2"
    name: "NIIMBOT Print Service"
    notes: >
      Most models expose service e7810a71-73ae-499d-8c15-faa9aef0c3f2 with a
      single characteristic carrying both directions (niimbluelib still
      discovers service/char dynamically). The packet-based binary protocol is
      consistent across all pre-v4 NIIMBOT models, and the same protocol also
      runs over Bluetooth Classic SPP/RFCOMM channel 1 and USB serial
      (115200 baud); the printer exposes two BT addresses (BLE + classic).

      PACKET FORMAT: `[0x03?] 0x55 0x55 <cmd> <len> <data...> <xor_checksum> 0xAA 0xAA`
      The 0x03 prefix is used only on the Connect packet (0xC1).
      Checksum = XOR of cmd through last data byte.

      PRINT SEQUENCE (D110 task, per niimbluelib / wiki print-tasks):
      1. Connect (0xC1) — handshake
      2. SetDensity (0x21) — print density level
      3. SetLabelType (0x23) — label/gap/continuous
      4. PrintStart (0x01) — announce total pages
      5. PageStart (0x03) — begin page
      6. SetPageSize (0x13) — [rows(u16), cols(u16)] big-endian
      7. PrintBitmapRow (0x85) / PrintBitmapRowIndexed (0x83) / PrintEmptyRow (0x84)
      8. PageEnd (0xE3) — end page
      9. Repeat 5-8 for multiple copies
      10. PrintEnd (0xF3) — finish job

      D110 MODEL: PrintStart uses 1-byte variant `55 55 01 01 01 <cs> aa aa`.
      SetPageSize uses the 4-byte big-endian variant
      `55 55 13 04 <row_hi> <row_lo> <col_hi> <col_lo> <cs> aa aa`
      (the 2-byte row-count-only variant is the old D11). D110 printhead is
      96px (12mm @203dpi) — 384px is the B21.
    characteristics:
      - uuid: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f"
        name: "Print Data"
        properties: ["notify", "write_without_response"]
        notes: >
          Single characteristic for command writes AND responses/heartbeat
          notifications on most models (niimbluelib selects the char requiring
          NOTIFY + WRITE_NO_RESPONSE).
          FRAME SELECTION: every reply the printer sends arrives here in the
          `55 55 <cmd> <len> <data...> <xor> AA AA` envelope, and the format
          block below describes exactly one of them — the reply to the
          0xDC heartbeat request as a D110 sends it: cmd 0xDD with a 10-byte
          data field, 17 bytes in all. Check bytes 2-3 read 0xDD 0x0A before
          trusting the offsets; a print acknowledgement or an info reply on
          the same characteristic puts other bytes there. Offsets are from
          niimbluelib's heartbeat parser (the 10-byte case: lid at data
          byte 8, charge level at data byte 9, no paper field) — reported,
          not read back by this project. Other models answer with 13-, 19-
          or 20-byte data fields whose lid/charge/paper bytes sit elsewhere;
          see remaining_unknowns.
        format:
          - offset: 0
            length: 2
            name: "head"
            type: "uint16"
            endianness: "big"
            values:
              0x5555: "packet_head"
          - offset: 2
            length: 1
            name: "response_id"
            type: "uint8"
            values:
              0xDD: "heartbeat_reply"
            notes: "The layout below only holds for 0xDD."
          - offset: 3
            length: 1
            name: "data_length"
            type: "uint8"
            notes: "10 on the D110; other values mean another model's heartbeat layout."
          - offset: 12
            length: 1
            name: "lid_open"
            type: "uint8"
            notes: "0 = lid closed, non-zero = open (data byte 8 of the D110 heartbeat)."
          - offset: 13
            length: 1
            name: "charge_level"
            type: "uint8"
            device_class: "battery"
            values:
              0: "empty"
              1: "25%"
              2: "50%"
              3: "75%"
              4: "100%"
            notes: >
              A five-step gauge (data byte 9), not a percent; the labels are
              the steps' nominal fill. The same 0-4 code comes back from the
              battery-level printer-info query. niimbluelib's heartbeat parser
              labels this byte a percentage; the 0-4 scale the printer-info
              query returns is the reading adopted here, so treat a value
              above 4 as a percent from a newer firmware.

entities:
  - platform: "cover"
    name: "Print Feed"
    state_characteristic: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f"
  - platform: "sensor"
    name: "Battery Level"
    device_class: "battery"
    variants: ["D110"]
    state_characteristic: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f"
    state_mapping:
      value: "charge_level"
    notes: >
      0-4 gauge step from the D110 heartbeat reply; a consumer must send the
      heartbeat request to get one, and must only decode replies whose
      response_id is 0xDD (see the characteristic notes). Scoped to the D110
      because the B21's heartbeat is a different length with the byte
      elsewhere.
  - platform: "binary_sensor"
    name: "Lid"
    variants: ["D110"]
    state_characteristic: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f"
    state_mapping:
      value: "lid_open"
      on_when: "nonzero"
    notes: "On = lid open. Same heartbeat-reply caveats as Battery Level."
  - platform: "binary_sensor"
    name: "Paper"
    state_characteristic: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f"
    notes: >
      Unbound: the D110's 10-byte heartbeat reply has no paper byte
      (niimbluelib reports paper only for the 13-, 19- and 20-byte replies
      of other models), so on the namesake model this reading cannot be
      produced. Declared so the gap is visible; see remaining_unknowns.

helpful_urls:
  - title: "eigger/hass-niimbot (HACS)"
    url: "https://github.com/eigger/hass-niimbot"
    description: "HACS integration printing to Niimbot BLE label printers (D110 family) from Home Assistant."
  - title: "NIIMBOT D110 quick start manual"
    url: "https://www.manualslib.com/manual/3027392/Niimbot-D110.html"
    kind: "manual"
    description: >
      Vendor quick start covering the indicator-light meanings this spec's status decoding relies on.

remaining_unknowns:
  - >
    The Print Data characteristic multiplexes every reply, and the schema
    has no frame selector: the format block is written for the D110's
    17-byte heartbeat reply (0xDD, 10 data bytes) and a consumer has to
    check response_id and data_length itself before using the lid and
    charge offsets.
  - >
    Other models' heartbeat replies put the same facts elsewhere — per
    niimbluelib, a 13-byte data field (B1) carries lid at data byte 9,
    charge at 10, paper-inserted at 11 and RFID-read at 12; a 19-byte field
    has them at 15-18; a 20-byte field carries only paper at 18 and RFID at
    19 — and one offset table cannot hold all four, so the Battery Level and
    Lid entities are scoped to the D110 and the B21 has no bound readings.
  - >
    Paper presence is not in the D110 heartbeat reply at all, so the Paper
    entity has nothing to bind on the namesake model; whether the D110
    reports it through another query is not established.
