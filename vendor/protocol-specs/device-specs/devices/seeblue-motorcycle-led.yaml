# Seeblue / LEDGlow Motorcycle LED Controller device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Seeblue Motorcycle LED Controller"
  manufacturer: "Seeblue / LEDGlow"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "ble"
  category: "light"
  notes: >
    White-label BLE module used by LEDGlow Motorcycle, LEDGlow V2, and other
    Seeblue-powered brands. SEEBlue transport envelope: [0x95, len, index,
    protocol_id, data..., checksum]. Checksum is 8-bit two's complement over
    bytes from message_length through last payload byte. Static analysis sources:
    com.seeblue.ledglow_moto v1.9.1 and com.seeblue.ledglowv2 v1.4.1.
  identification:
    service_uuids:
      - "0000ffe5-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "exact"
            value: "LEDGlowMoto"
          notes: >
            The vendor apps scan unfiltered and match the advertised local
            name exactly: "LEDGlowMoto" (moto app) or "LEDGlowV2" (v2 app).
            Service-UUID filtering is not what the apps do; whether the
            advertisement also carries the 0xFFE5 service UUID is unverified
            from app code.
    identity:
      stable_keys: ["address"]
      display: "service_uuid"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      No provisioning. Discovery is by exact advertised local name —
      "LEDGlowMoto" or "LEDGlowV2"; the controllers do advertise a stable
      local name and that name is the discovery key.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          No provisioning step: the device advertises as soon as it is powered
          on and accepts a connection from any central. There is no account, no
          network credential exchange and no pairing PIN. One caveat: after
          every connect the vendor app runs an app-level handshake on SEEBlue
          protocol 0x00 — a 7-byte message [0x00 + the last 6 bytes of the
          phone's ANDROID_ID]. Whether the firmware rejects writes without it
          is unverifiable from app code, so a "just write" client may or may
          not work; implement the handshake to be safe.
        ble:
          pairing_required: false
        steps:
          - action: "Power the device and scan for its advertisement."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect, then send the post-connect handshake on protocol 0x00: 7-byte message [0x00 + last 6 bytes of ANDROID_ID]."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        No credential state to clear. Power-cycling drops the current
        connection, which is the actual remedy for the common failure mode:
        the device already being connected to another central.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "Device advertises again and accepts a new connection."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds this device to a network or an owner, so switching
        controllers is just connecting from the new one. If the old client is
        an Android or iOS phone, remove the device from the OS Bluetooth list
        as well — a cached bond can keep the phone reconnecting automatically
        and holding the single available link.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        Anything within radio range can connect and issue commands. Physical
        proximity is the only access control. Note the app-level handshake on
        protocol 0x00 after every connect (see setup description); whether the
        firmware enforces it is unverified.
services:
  - uuid: "0000ffe5-0000-1000-8000-00805f9b34fb"
    name: "LEDGlow BLE Data Service"
    characteristics:
      - uuid: "0000ffe9-0000-1000-8000-00805f9b34fb"
        name: "TX Write"
        properties: ["write"]
        notes: "SEEBlue envelope writes target this characteristic."
        framing:
          # No generic `checksum:` here on purpose. The enum's `sum` means the
          # sum itself is appended, and this protocol appends its 8-bit two's
          # complement — a consumer executing `sum` would emit a different
          # final byte on nearly every frame. The scheme states the real
          # algorithm; a near-miss generic value would contradict it.
          scheme: "seeblue_envelope"
          notes: >
            Every command below writes its packet inside the SEEBlue envelope:
            [0x95][message_length][message_index][protocol_id][packet][checksum].
            The envelope's three variable bytes belong to the framing layer and
            not to any command — message_index is a per-connection sequence
            number the client owns, and both message_length and the checksum are
            derived from the finished packet — so the templates below are the
            packet alone, per the framing contract in schema.json. They used to
            spell the framed form out with `{message_length}`/`{message_index}`/
            `{checksum}` placeholders that no command declared or could fill,
            which cost the whole spec its parse.

            Full protocol_id map (ledglowlib/Constants.smali): 0x00 INTERNAL
            (post-connect auth handshake), 0x01 LIGHTING, 0x02 RESPONSE (the
            device answers requests on this protocol), 0x03 BOOTLOADER
            (latent OTA: SEEBlueLEBootloaderActivity flashes an Intel HEX
            file over BLE with opcodes VERSION_REQUEST, START_UPDATE 0x01,
            START_BLOCK 0x02, BLOCK_DATA 0x03 and ~2 s block pacing; no
            firmware HEX is public), 0x04 GENERIC. Protocol 0x10 carries the
            full LEDGlow snapshot and, in the v2 app, the UI-change commands
            below — those use packet [0x05, ui_id, values...] where 0x05 is a
            message-type byte, NOT the protocol_id.

            Protocol 0x10 also carries typed settings-snapshot blocks in the
            v2 app (BluetoothHelper constants): type 0x06 underbody (UB),
            0x07 white-wire (WW), 0x08 interior (IN), 0x09 ABC, 0x0A general
            (TAB). A LEDGLOW_GET_FEATURES = 0x80 constant exists with no
            observed call site.
        commands:
          direct_brake_feature:
            description: "Direct protocol 0x01 command 0: brake feature; values 1=brake off, 2=brake light on, 8=brake pulse on (bit flags)"
            protocol_id: 0x01
            command_id: 0
            template: [0x00, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          direct_set_color_1:
            description: "Direct protocol 0x01 command 1: set RGB color 1"
            protocol_id: 0x01
            command_id: 1
            template: [0x01, "{red}", "{green}", "{blue}"]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          direct_set_brightness_1:
            description: "Direct protocol 0x01 command 2: set brightness 1"
            protocol_id: 0x01
            command_id: 2
            template: [0x02, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255
          direct_set_speed:
            description: "Direct protocol 0x01 command 3: set animation speed"
            protocol_id: 0x01
            command_id: 3
            template: [0x03, "{speed}"]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
          direct_set_mode:
            description: "Direct protocol 0x01 command 4: set effect mode; app sends mode_index + 1"
            protocol_id: 0x01
            command_id: 4
            template: [0x04, "{mode_plus_1}"]
            parameters:
              mode_plus_1:
                type: "uint8"
                min: 1
                max: 255
          direct_command_5_reserved:
            description: "Direct protocol 0x01 command 5: not observed in analyzed APKs; reserved gap between mode and color 2"
            protocol_id: 0x01
            command_id: 5
            observed: false
          direct_set_color_2:
            description: "Direct protocol 0x01 command 6: set RGB color 2"
            protocol_id: 0x01
            command_id: 6
            template: [0x06, "{red}", "{green}", "{blue}"]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          direct_set_brightness_2:
            description: "Direct protocol 0x01 command 7: set brightness 2"
            protocol_id: 0x01
            command_id: 7
            template: [0x07, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255
          direct_additional_feature:
            description: "Direct protocol 0x01 command 8: additional feature; values 1=hazards on, 2=hazards off, 3=dual-zone on, 4=dual-zone off"
            protocol_id: 0x01
            command_id: 8
            template: [0x08, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          full_settings_snapshot:
            description: "Full LEDGlow snapshot protocol 0x10: complete two-color state payload"
            protocol_id: 0x10
            template: [0x01, "{on_off}", "{brightness1}", "{brightness2}", "{speed}", "{mode_plus_1}", "{red1}", "{green1}", "{blue1}", "{red2}", "{green2}", "{blue2}"]
            parameters:
              on_off:
                type: "uint8"
                min: 0
                max: 255
                notes: "Vendor app emits 0xFF for on, 0x00 for off; any non-zero value may work."
              brightness1:
                type: "uint8"
                min: 0
                max: 255
              brightness2:
                type: "uint8"
                min: 0
                max: 255
              speed:
                type: "uint8"
                min: 0
                max: 255
              mode_plus_1:
                type: "uint8"
                min: 1
                max: 255
              red1:
                type: "uint8"
                min: 0
                max: 255
              green1:
                type: "uint8"
                min: 0
                max: 255
              blue1:
                type: "uint8"
                min: 0
                max: 255
              red2:
                type: "uint8"
                min: 0
                max: 255
              green2:
                type: "uint8"
                min: 0
                max: 255
              blue2:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_power:
            description: "LEDGlow V2 UI change ID 0: power"
            protocol_id: 0x10
            ui_id: 0
            template: [0x05, 0x00, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_color_a:
            description: "LEDGlow V2 UI change ID 2: color A RGB"
            protocol_id: 0x10
            ui_id: 2
            template: [0x05, 0x02, "{red}", "{green}", "{blue}"]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_color_b:
            description: "LEDGlow V2 UI change ID 3: color B RGB"
            protocol_id: 0x10
            ui_id: 3
            template: [0x05, 0x03, "{red}", "{green}", "{blue}"]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_color_c:
            description: "LEDGlow V2 UI change ID 4: color C RGB"
            protocol_id: 0x10
            ui_id: 4
            template: [0x05, 0x04, "{red}", "{green}", "{blue}"]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_brightness_a:
            description: "LEDGlow V2 UI change ID 5: brightness A"
            protocol_id: 0x10
            ui_id: 5
            template: [0x05, 0x05, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_brightness_b:
            description: "LEDGlow V2 UI change ID 6: brightness B"
            protocol_id: 0x10
            ui_id: 6
            template: [0x05, 0x06, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_brightness_c:
            description: "LEDGlow V2 UI change ID 7: brightness C"
            protocol_id: 0x10
            ui_id: 7
            template: [0x05, 0x07, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_million_color_a:
            description: "LEDGlow V2 UI change ID 8: million color A"
            protocol_id: 0x10
            ui_id: 8
            template: [0x05, 0x08, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_million_color_b:
            description: "LEDGlow V2 UI change ID 9: million color B"
            protocol_id: 0x10
            ui_id: 9
            template: [0x05, 0x09, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_million_color_c:
            description: "LEDGlow V2 UI change ID 10: million color C"
            protocol_id: 0x10
            ui_id: 10
            template: [0x05, 0x0A, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_fade:
            description: "LEDGlow V2 UI change ID 11: fade"
            protocol_id: 0x10
            ui_id: 11
            template: [0x05, 0x0B, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_speed:
            description: "LEDGlow V2 UI change ID 12: speed"
            protocol_id: 0x10
            ui_id: 12
            template: [0x05, 0x0C, "{speed}"]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_music:
            description: "LEDGlow V2 UI change ID 13: music"
            protocol_id: 0x10
            ui_id: 13
            template: [0x05, 0x0D, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_mode:
            description: "LEDGlow V2 UI change ID 14: mode"
            protocol_id: 0x10
            ui_id: 14
            template: [0x05, 0x0E, "{mode}"]
            parameters:
              mode:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_strobe:
            description: "LEDGlow V2 UI change ID 15: strobe"
            protocol_id: 0x10
            ui_id: 15
            template: [0x05, 0x0F, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_white_wire_ui:
            description: "LEDGlow V2 white wire UI IDs 64-79; payload is [ui_id, values...]"
            protocol_id: 0x10
            ui_id_range: [64, 79]
            template: [0x05, "{ui_id}", "{values}"]
            parameters:
              ui_id:
                type: "uint8"
                min: 64
                max: 79
                description: "Which white-wire control this packet addresses; the band this command stands for."
              values:
                type: "bytes"
                min_length: 1
                description: "The control's value bytes, whose count and meaning depend on ui_id."
          ledglow_v2_interior_ui:
            description: "LEDGlow V2 interior UI IDs 0x80+; payload is [ui_id, values...]"
            protocol_id: 0x10
            ui_id_min: 0x80
            template: [0x05, "{ui_id}", "{values}"]
            parameters:
              ui_id:
                type: "uint8"
                min: 128
                description: "Which interior control this packet addresses. The band starts at 0x80; its upper end is not known from app code."
              values:
                type: "bytes"
                min_length: 1
                description: "The control's value bytes, whose count and meaning depend on ui_id."
          ledglow_v2_system_power:
            description: "LEDGlow V2 system UI ID 0xF0: system power"
            protocol_id: 0x10
            ui_id: 0xF0
            template: [0x05, 0xF0, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_courtesy_light:
            description: "LEDGlow V2 system UI ID 0xF1: courtesy light"
            protocol_id: 0x10
            ui_id: 0xF1
            template: [0x05, 0xF1, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_low_voltage:
            description: "LEDGlow V2 system UI ID 0xF3: low voltage"
            protocol_id: 0x10
            ui_id: 0xF3
            template: [0x05, 0xF3, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_auto_dim:
            description: "LEDGlow V2 system UI ID 0xF4: auto dim"
            protocol_id: 0x10
            ui_id: 0xF4
            template: [0x05, 0xF4, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_display_brightness:
            description: "LEDGlow V2 system UI ID 0xF5: display brightness"
            protocol_id: 0x10
            ui_id: 0xF5
            template: [0x05, 0xF5, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_courtesy_color:
            description: "LEDGlow V2 system UI ID 0xF6: courtesy color"
            protocol_id: 0x10
            ui_id: 0xF6
            template: [0x05, 0xF6, "{red}", "{green}", "{blue}"]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_backlight_color:
            description: "LEDGlow V2 system UI ID 0xF7: backlight color"
            protocol_id: 0x10
            ui_id: 0xF7
            template: [0x05, 0xF7, "{red}", "{green}", "{blue}"]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_white_wire_system:
            description: "LEDGlow V2 system UI ID 0xF9: white wire"
            protocol_id: 0x10
            ui_id: 0xF9
            template: [0x05, 0xF9, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
          ledglow_v2_auto_off:
            description: "LEDGlow V2 system UI ID 0xFA: auto off"
            protocol_id: 0x10
            ui_id: 0xFA
            template: [0x05, 0xFA, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255
  - uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
    name: "LEDGlow Serial Data Service"
    notes: >
      Second service ("serial data channel" in the app) hosting the RX/notify
      channel: SEEBlueLEManager fetches characteristic 0xFFE4 from THIS
      service, not from 0xFFE5.
    characteristics:
      - uuid: "0000ffe4-0000-1000-8000-00805f9b34fb"
        name: "RX Notify"
        properties: ["notify"]
        notes: "Incoming SEEBlue frames; the device answers requests on protocol 0x02."

entities:
  - platform: "light"
    name: "Motorcycle LEDs"
    features: ["brightness", "color", "effect"]
    state_characteristic: "0000ffe4-0000-1000-8000-00805f9b34fb"
    commands:
      turn_on: "full_settings_snapshot"
      set_color: "direct_set_color_1"
      set_brightness: "direct_set_brightness_1"
      set_effect: "direct_set_mode"
