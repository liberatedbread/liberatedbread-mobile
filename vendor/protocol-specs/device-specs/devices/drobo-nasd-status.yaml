  - title: "jerimiah797/drobo-nas-protocol"
    url: "https://github.com/jerimiah797/drobo-nas-protocol"
    description: "Frame header layout and a reader script, from one 5N2."
  - title: "cosmouser/drobo_exporter"
    url: "https://github.com/cosmouser/drobo_exporter"
