  openscq30_models:
    description: >
      Models OpenSCQ30 (commit bc77a293, 2026-09-26) drives, each with its
      own module under lib/src/devices/soundcore/. Only the A3116 is
      configured without a checksum. Only the A3930 pins SPP; every other
      model picks the vendor UUID from SDP when there is one and falls back
      to SPP. The A3028 module also drives the A3029, the A3027 module the
      A3030, the A3931 module the A3935, and the A3933 module the A3939.
    skus: ["A3004", "A3005", "A3027", "A3028", "A3029", "A3030", "A3031", "A3033", "A3035", "A3040", "A3062", "A3116", "A3330", "A3388", "A3876", "A3909", "A3926", "A3930", "A3931", "A3933", "A3935", "A3936", "A3939", "A3944", "A3945", "A3947", "A3948", "A3949", "A3951", "A3952", "A3954", "A3955", "A3957", "A3959", "A3968", "D1101", "D1202", "D1301"]
  fast_pair_stream:
    note: >
      On the A3947 the Android system opened Google's Fast Pair Message
      Stream (RFCOMM, df21fe2c-2515-4fdb-8886-f12c4d67927c) before the
      soundcore app connected. It carried group 03 messages: model ID (code
      01, D1E4E3, the Liberty 4 NC's Fast Pair model), the device's current
      BLE address (code 02; the captured value is not reproduced), battery
      (code 03: left, right and case, one byte each, percent in bits 0-6,
      bit 7 charging) and, from the phone, platform type (code 08). A
      client that only wants battery can read it here without the vendor
      protocol. Format per Google's published specification.
    verification: "confirmed"

evidence:
  artifacts:
    - type: "hci_capture"
      artifact: "Android btsnoop log, soundcore Liberty 4 NC (A3947) and the vendor app, attached to SoundcoreManager issue #162 (2024-05-01)"
      url: "https://github.com/gmallios/SoundcoreManager/issues/162"
      description: >
        SDP browse of the earbuds (vendor record on channel 15, TOTA on 12,
        BESOTA on 13, Fast Pair stream on 17), the BLE advertisement, the Fast
        Pair message stream, and the vendor app's session: state request and
        reply, LDAC query and reply, five sound-mode sets and their
        acknowledgements. Every checksum recomputed. The unit's address,
        serial number and Fast Pair account data are not reproduced.
    - type: "hci_capture"
      artifact: "Android btsnoop log, Soundcore Motion+ (A3116) and the vendor app, attached to OpenSCQ30 issue #215 (2026-01-15)"
      url: "https://github.com/Oppzippy/OpenSCQ30/issues/215"
      description: >
        SDP browse of the speaker (vendor record "CSR GAIA" on channel 1, no
        SPP-class record) and 53 soundcore frames with no checksum byte:
        state, voice prompt, 05 01, EQ presets and pushes, custom EQ, volume,
        auto power-off and its push. The unit's address and serial number are
        not reproduced.
    - type: "public_implementation"
      artifact: "OpenSCQ30, commit bc77a293278092e0e3bd39ea2612371054ecb1be (2026-09-26)"
      url: "https://github.com/Oppzippy/OpenSCQ30"
      description: >
        Framing and checksum (lib/src/devices/soundcore/common/packet.rs,
        packet/checksum.rs), the vendor RFCOMM UUID rule (lib/src/devices/soundcore.rs,
        common/device.rs), per-model modules a3947, a3116 and a3028 (state
        layouts, sound modes, EQ encodings, command IDs), and the shared flag
        table (common/modules/flag.rs). Source of every `reported` payload
        meaning.
    - type: "public_implementation"
      artifact: "SoundcoreManager, commit 131ac405a1a372c689e6952e3b1b11f89ba4e54d (2024-10-03)"
      url: "https://github.com/gmallios/SoundcoreManager"
      description: >
        An independent implementation of the same frames
        (soundcore-lib/src/packets/request.rs, parsers/checksum.rs) sent over
        BLE GATT (soundcore-lib/src/ble/btleplug/connection.rs), which picks
        the first non-generic service holding a notify+read and a
        write+write-without-response characteristic. The evidence for
        ble_role secondary_control.
    - type: "static_analysis"
      artifact: "soundcore for Android (com.oceanwing.soundcore), version 2.9.9"
      obtained_via: "third-party APK mirror"
      description: >
        Per-model control UUIDs, BLE advertisement codes and OTA UUIDs (the
        model_table), the insecure RFCOMM socket, the 1024-byte read buffer,
        the BLE advertisement parser that reads the BR/EDR address from
        manufacturer data, the A3116 frame constants (9-byte frames, no
        checksum), and the bundled BES and Qualcomm GAIA updaters. An old
        build: it predates the A3947.
    - type: "fcc_filing"
      artifact: "FCC IDs 2AOKB-A3947 (Liberty 4 NC, granted 2023-03-28) and 2AOKB-A3028 (Life Q30 and Life Tune, granted 2020-08-12), Anker Innovations Limited"
      url: "https://fccid.co/fcc/2AOKB-A3947"
      description: "User-manual exhibits: pairing, dual connection and reset steps for those models. Both grants are 2402-2480 MHz."
    - type: "vendor_documentation"
      artifact: "Soundcore Motion+ user manual, multilingual, revision 2020-11"
      url: "https://dix7fd4yse9rd.cloudfront.net/s/Soundcore/product/6109030547646/files/1608603719981_soundcorea3116manualmulti20201125v02.pdf"
      description: "Pairing, TWS and indicator behaviour for the A3116; aptX support; no reset procedure."
  capture_analysis: >
    Captures were decoded with Wireshark's btrfcomm and btsdp dissectors and
    a small SDP reassembler for continuation responses. Both logs start with
    the device already bonded, so no pairing exchange appears. Neither shows
    GATT traffic to a soundcore service.
  open_questions:
    - >
      The vendor app now requires an account (reviews from 2026-09 describe
      forced sign-up with v5.0.x) and shows full-screen advertising before
      its device screen. Nothing on the device side needs either: the
      control socket is unauthenticated in both captures. This spec is the
      way around both.
    - >
      "The app says not connected, but the earbuds play fine" (a recurring
      review, e.g. Liberty 4 NC in 2023). Audio and control are separate
      links: A2DP can be up while the RFCOMM control channel is not.
      Candidate causes on the A3947: another client (or the app's own
      background service) still holding the control channel, or a client
      opening the SPP-class record (TOTA, channel 12) instead of the vendor
      record. Not reproduced.
    - >
      The Motion+ publishes no SPP-class SDP record. A client that opens "the
      serial port" by 00001101 finds nothing. OpenSCQ30's A3116 module pins
      the vendor UUID, and its changelog lists several Motion+ connection
      fixes; #215 is one such report. Whether this was the cause is not
      established.
    - >
      Gaming mode on the Liberty 4 NC "appears enabled but does nothing"
      (a 2026-09 review). OpenSCQ30 has a model-specific gaming-mode module
      for the A3947 (builder a3947_gaming_mode). Not examined here.
    - >
      Why the vendor app sent the A3116 state request twice, 1.3 s apart, at
      connect: a timeout-and-retry in its connect logic, or a deliberate
      double read. Harmless either way.

remaining_unknowns:
  - "The BLE GATT service that SoundcoreManager tunnels frames over: its UUIDs, which models have it (the A3947 and A3116 are not known to), and whether iOS uses it. Deliberately not documented here."
  - "Whether any model requires an application-layer handshake or key before accepting sets. None seen on the A3947 or A3116; newer models (Liberty 5, Space One, Sleep, AeroClip) were not examined."
  - "The meaning of the A3116's 05 01 reply (sixteen u16 values) and of its state byte at offset 12."
  - "The A3947 state bytes OpenSCQ30 marks unknown (offsets 41-45 version string, 68, 117, 142-147, 149, 151, 154-156, 167)."
  - "Whether the auto-power-off meaning of the A3116's unsolicited 01 05 push is right; inferred from two echoes."
  - "Whether custom EQ on the A3116 should be selected as preset 0xff (vendor app) or 0x0f (OpenSCQ30), and whether the difference matters to the speaker."
  - "What the A3028/A3029 do with the band bytes when a named preset ID is sent, and whether the A3028 answers sets with the same empty acknowledgement the A3947 sends."
  - "The RFCOMM channel of the A3028/A3029 control record, and whether they also carry a vendor-UUID record on newer firmware."
  - "How many hosts a device remembers, whether two hosts can hold the control channel at once on multipoint models, and what the factory reset clears."
  - "The firmware update paths (BES OTA on the A3947, possibly GAIA on the A3116, per-model 7c UUIDs on speakers): deliberately not examined. Brick risk."
  - "Party-mode linking, case display and recording, HearID upload, and the Anka AI features: out of scope."
  - "A Motion+ factory-reset procedure; its manual gives none."
  - "Whether every A3947 serial number embeds the unit's BR/EDR address (one unit seen)."

