protocol_details:
  entity_coverage: >
    Not bound to any entity, and why. The EQ curves (a3116_set_custom_eq,
    a3028_set_equalizer) take eight or nine caller-chosen gains at once and
    no entity platform holds a curve. a3028_set_equalizer's named presets
    also need that preset's band values sent along, which lives in
    OpenSCQ30's preset list rather than in a state field. a3947_request_ldac
    is a reading with no matching set declared. a3116_request_unknown_0501's
    reply is not understood. The battery levels are bound raw (0-5) because
    the device reports steps, not percent.
  frame_grammar:
    phone_to_device: "08 ee 00 00 00 | cmd[0] cmd[1] | len (u16 LE, whole frame) | payload | [checksum]"
    device_to_phone: "09 ff 00 00 01 | cmd[0] cmd[1] | len (u16 LE, whole frame) | payload | [checksum]"
    checksum: "sum8 of every preceding byte of the frame, starting with 08/09. Present on the A3947, A3028/A3029 and every OpenSCQ30 model except the A3116, which has none."
    acknowledgement: "The device answers a set with a frame carrying the same two command bytes and an empty payload (length 10 with a checksum, 9 without)."
    replies: "A query's reply carries the same two command bytes as the query."
    command_bytes: >
      The first command byte groups functions (01 device and general, 02 EQ,
      03 EQ with HearID, 04 buttons, 05 A3116 statistics(?), 06 sound modes,
      0b multipoint, 10 and 20 hearing-related flags on newer earbuds). The
      second has its top bit set for a set or change (0x81, 0x83, ...) and
      clear for a query or report (0x01, 0x03, ...). The meaning of a given
      pair still varies by model; this is a pattern, not a rule to send by.
  checksum_examples:
    - {hex: "08 ee 00 00 00 01 01 0a 00 02", note: "A3947 state request; captured"}
    - {hex: "08 ee 00 00 00 01 7f 0a 00 80", note: "A3947 LDAC query; captured"}
    - {hex: "09 ff 00 00 01 01 7f 0b 00 00 94", note: "A3947 LDAC reply, off; captured"}
    - {hex: "09 ff 00 00 01 06 81 0a 00 9a", note: "A3947 sound-mode acknowledgement; captured"}
    - {hex: "08 ee 00 00 00 06 81 11 00 01 50 00 01 00 00 00 e0", note: "A3947 transparency; captured"}
    - {hex: "08 ee 00 00 00 06 81 11 00 00 50 00 01 00 00 00 df", note: "A3947 noise cancelling; captured"}
  no_checksum_examples:
    - {hex: "08 ee 00 00 00 01 01 09 00", note: "A3116 state request; captured"}
    - {hex: "09 ff 00 00 01 01 10 0a 00 01", note: "A3116 voice prompt reply, on; captured"}
    - {hex: "08 ee 00 00 00 02 81 0a 00 ff", note: "A3116 EQ preset custom, as the vendor app sends it; captured"}
    - {hex: "09 ff 00 00 01 02 01 0a 00 00", note: "A3116 EQ preset push after a BassUp set; captured"}
    - {hex: "09 ff 00 00 01 01 05 0a 00 02", note: "A3116 auto-power-off push after a 10-minute set; captured"}
  connect_sequence:
    A3947:
      - "Open an insecure RFCOMM socket to 0cf12d31-fac3-4553-bd80-d6832e7b3947 (channel 15 in the capture)."
      - "Send 08 ee 00 00 00 01 01 0a 00 02 (state); the 169-byte reply arrived in 50 ms."
      - "The vendor app then sent 08 ee 00 00 00 01 7f 0a 00 80 (LDAC query). No other handshake, no authentication."
    A3116:
      - "Open an insecure RFCOMM socket to 0cf12d31-fac3-4553-bd80-d6832e7b3116 (channel 1 in the capture)."
      - "Send 08 ee 00 00 00 01 01 09 00 (state, no checksum); the 45-byte reply arrived in 20 ms. The vendor app sent it a second time 1.3 s later."
      - "The vendor app then sent 01 10 (voice prompt) and 05 01 (undecoded). OpenSCQ30 sends 01 10 only on firmware 38.39 or later."
    A3028:
      - "Open an insecure RFCOMM socket to SPP 00001101-0000-1000-8000-00805f9b34fb (from the vendor app's model table)."
      - "Send 08 ee 00 00 00 01 01 0a 00 02 (state). That is all OpenSCQ30 sends before normal use."
    notes: >
      No `initialization` block is declared: there is no handshake to gate
      the link, and the first request differs by model (with or without a
      checksum), which a model-independent step list cannot express.
  model_table:
    description: >
      SKU to control channel, from static analysis of an older vendor Android
      build (2.9.9, which predates the Liberty 4 NC and the Space range) and
      normalised here: rows sorted by SKU, UUIDs lower-cased. `control` is
      `vendor` for 0cf12d31-fac3-4553-bd80-d6832e7b<code>, or `spp` for
      00001101-0000-1000-8000-00805f9b34fb. `ble_code` is the byte XX of the
      BLE advertisement code 01XXf5da-0000-1000-8000-00805f9b34fb that build
      matches (empty where it uses none or something else). `ota_7c` marks
      models for which it also carries the 7c-sibling OTA UUID. Names are
      the retail names SoundcoreManager uses. Codes ending in a letter (302b,
      339a, 339b, 339c, 392b, 393b, 393c) are regional or hardware revisions
      of the base SKU and have their own UUID tail. A3947 was added from the
      capture. A SKU missing from the table is NOT unsupported: the app has
      gained models since this build, and its vendor UUID follows the same
      rule (the A3947's did).
    verification: "reported"
    rows:
      - {code: "3025", name: "Life Q20+", control: "vendor", ble_code: "12"}
