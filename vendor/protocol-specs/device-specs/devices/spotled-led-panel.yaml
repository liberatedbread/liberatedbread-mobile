device:
  name: "SPOTLED LED Panel"
  manufacturer: "Host No.4 Technology (Chengdu) Co., Ltd."
  manufacturer_status: "unsupported"
  testing:
    status: verified
    detail: minimally-verified
    notes: >
      On 2026-11-07 this project used this protocol on a 96x16 RGB Lunchbox
      panel for all three information queries, a ten-chunk static upload and a
      single-frame native scroll-left upload. Start returned type 2 and finish
      returned type 4, both with status zero. An eight-frame full-RGB upload
      was rejected with response 254; other panel geometries, monochrome mode,
      multi-frame uploads, text records and OTA remain unverified.
  protocol: "ble"
  category: "display"
  category_hierarchy: ["display", "led_matrix"]
  notes: >
    OEM full-color LED matrix panels driven by the SPOTLED app (Android package
    com.led.spotled; iOS bundleId com.sunday.led, App Store id 1564039607),
    claiming 140k+ users. The app is unmaintained: v1.9.4 (2023-10-12) is the
    last release on both platforms and current Android will not install it from
    the Play Store — the vendor portal led.spotled.xyz serves the APK directly
    (GitHub-hosted v1.7.7 and Aliyun OSS v1.9.4, both archived in the research
    store). Not brand-specific: the same app and
    protocol drive LED hats, name badges, backpack and hydration-pack skins, chest
    panels and long flexible banner signs (32x256 arrays are commonly sold), each
    rebranded by a different reseller. The Lunchbox / LEDs 2 RAVE 4 Dream Skin 2.0
    and early Dream Skin 3.0 panels are members of this family — see
    leds2rave4-lunchbox-led.yaml, which carries the same 0xFF20 service alongside
    the SP107E/SP110E generations of that product line. THIS spec is the canonical
    SPOTLED reference; keep the two in sync.

    NO PAIRING: devices are connected from inside the app, not via system Bluetooth.
    There is no bonding and no auth — anything in range can drive the panel. Treat
    that as a wearer-privacy note, not an obstacle.

    DISCOVERY: there is no universal advertised-name prefix across the family
    because resellers set their own. FF20 is the useful service signal when
    present, but some advertisement samples omit it. Known name prefixes include
    "LBXDRMSKIN_LED_" and "SpotLED_"; match those as well, then confirm GATT.

    CONNECTION BOOTSTRAP (all steps required for a working client):
      1. Connect and negotiate MTU (falls back to 23 if not negotiated).
      2. Enable FF21 notifications through the GATT client. Do not write CCCD
         bytes to FF21 itself; discover the descriptor if writing it directly.
      3. Discover the FF21 (command) and FF22 (data) handles under FF20.
      4. GetBufferSize (04 14 00 00) and await the type-21 notification.
      5. GetDisplayInfo (04 12 00 00) and await the type-19 notification for
         width, height, colour depth, advertised frame limit and brightness.
    Notification values begin [total_length][response_type], followed by the
    documented content. They are not ATT read-back responses.

    COMMAND FRAME (FF21): [uint8 frame_length][uint8 command_id]
    [uint16_be serial][uint16_be command_type][uint32_be command_length].
    Serial numbers wrap: uint16 for commands, uint32 for data payloads.

    DATA FRAME (FF22): 15-byte header — [uint32_be header_length = 15]
    [uint16_be command_type = 0x8004][uint32_be serial][uint32_be content_length]
    [uint8 checksum] — followed by typed content records, each
    [uint32_be length][uint16_be type][fields][uint8 checksum]. Record types:
    2 color, 3 character, 4 text, 5 font, 7 time, 8 effect, 9 speed, 10 number bar,
    11 animation, 13 font character, 14 brightness (0-100),
    15 screen mode (0 normal / 1 upside-down / 2 mirror / 3 both), 96 frame
    (width, height, depth 1=mono 24=RGB, bitmap).
    Effects (type 8): 0 none, 1 up, 2 down, 3 left, 4 right, 5 stack, 6 expand,
    7 laser.
    CHECKSUM: byte sum of the covered range; if it exceeds 0xFF, negate ((~sum) + 1);
    keep the low byte.

    UPLOAD FLOW CONTROL: send SendingDataStart and require type-2 status zero.
    Write the payload to FF22 in chunks of (MTU - 3) bytes. Pace writes and
    react to device responses instead of waiting at a fixed
    buffer_size/chunk_size threshold. ContinueSending (type 255) carries the
    offset to RESUME FROM, not your own cursor. Finish with SendingDataFinish
    and require type-4 status zero, not type 2. PauseSending (type 254) can
    mean bad MTU, but also rejected an eight-frame RGB upload; it is not by
    itself an MTU diagnosis. Derive chunk size from negotiated MTU every
    connection rather than assuming the 23-byte default.

    RESPONSES (notify on FF21): type 2 SendingData, type 4 SendingDataFinish,
    type 255 ContinueSending, type 254 PauseSending, type 19 DisplayInfo,
    type 17 Version, type 21 BufferSize.

    TEXT: two paths. Rendering client-side into an Animation record (type 11) of
    frames is faster and more capable. Sending Character records (type 3, capped
    around 72 chars) lets the device lay text out but is slower and more limited.
    Custom glyphs must be uploaded as FontCharacter records (type 13) before the
    text referencing them.

    FIRMWARE: a vendor OTA mechanism exists in the app, but firmware binaries
    are not bundled and no public download or wire capture has been recovered.
    The app also carries a cloud account layer; BLE control is fully local.

    CONFIDENCE: the protocol is independently implemented several times. The
    2026-11-07 live session additionally confirmed FF20/FF21/FF22 properties,
    all three queries, static RGB upload and single-frame native scroll-left.
    An eight-frame RGB upload was rejected, so the advertised 20-frame field
    is not a proven transfer-size guarantee. Other geometries, text records,
    monochrome panels and OTA remain unverified.

  identification:
    local_name_prefixes: ["LBXDRMSKIN_LED_", "SpotLED_"]
    service_uuids:
      - "0000ff20-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            values: ["LBXDRMSKIN_LED_", "SpotLED_"]
          service_uuids:
            - "0000ff20-0000-1000-8000-00805f9b34fb"
        notes: "Match any known name or FF20; some shorter advertisement samples omit FF20."
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning. Use a known name or FF20 for discovery, then confirm
      the FF20/FF21/FF22 layout. The same OEM protocol ships in hats, badges,
      backpack skins and banner signs with no universal advertising name.
    methods:
      - type: "ble_direct"
        verified: true
        description: >
          No provisioning step: the device advertises as soon as it is powered
          on and accepts a connection from any central. There is no account, no
          network credential exchange and no pairing PIN. The 2026-11-07 live
          session verified subscription, all three queries and content upload.
        ble:
          pairing_required: false
        steps:
          - action: "Power the device and scan for its advertisement."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect, enable FF21 notifications, then issue GetBufferSize and GetDisplayInfo and await their notifications."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        No credential state to clear. Power-cycling drops the current
        connection, which is the actual remedy for the common failure mode:
        the device already being connected to another central.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "Device advertises again and accepts a new connection."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds this device to a network or an owner, so switching
        controllers is just connecting from the new one. If the old client is
        an Android or iOS phone, remove the device from the OS Bluetooth list
        as well — a cached bond can keep the phone reconnecting automatically
        and holding the single available link.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        Anything within radio range can connect and issue commands. Physical
        proximity is the only access control.

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
  variants:
    - model: "Lunchbox Dream Skin 2.0 / 3.0 (early boards)"
      identification:
        local_name_prefixes: ["LBXDRMSKIN_LED_", "SpotLED_"]
        service_uuids:
          - "0000ff20-0000-1000-8000-00805f9b34fb"
      notes: >
        See leds2rave4-lunchbox-led.yaml for the full product-line context,
        including the SP107E v1 generation and the iLEDColor v3 board revision.

services:
  - uuid: "0000ff20-0000-1000-8000-00805f9b34fb"
    name: "SPOTLED Service"
    initialization:
      - characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
        subscribe: true
        notes: "Enable notifications through the GATT client; do not write CCCD bytes to FF21 itself."
      - characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
        write: [0x04, 0x14, 0x00, 0x00]
        notes: "Wait for the type-21 BufferSize notification; this is not an ATT read-back characteristic."
      - characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
        write: [0x04, 0x12, 0x00, 0x00]
        notes: "Wait for the type-19 DisplayInfo notification."
    characteristics:
      - uuid: "0000ff21-0000-1000-8000-00805f9b34fb"
        name: "Command"
        properties: ["write_without_response", "notify"]
        notes: >
          Control channel. NO characteristic-level `framing` is declared ON PURPOSE:
          the values/templates below are COMPLETE frames — each already carries its
          own leading length byte and command ID — and are written verbatim.
          Declaring framing.length_prefix/checksum would make a consumer prepend a
          second length and append a checksum, producing packets the panel rejects.
          The command channel carries no checksum at all; the sum checksum belongs to
          the 0xFF22 data payload records.

          Frame layout [uint8 length][uint8 command_id]
          [uint16_be serial][uint16_be command_type][uint32_be command_length].
          Responses arrive as notifications here. The Get* commands below are
          fixed 4-byte frames; the SendingData* commands are parameterised because
          their serial number, command type and payload length change per upload.
        commands:
          get_version:
            description: "Device type + device/software revision (13-byte content after the two-byte response header)."
            value: [0x04, 0x10, 0x00, 0x00]
            verification: "confirmed"
          get_display_info:
            description: >
              Query big-endian width, height, colour depth (16 mono / 255 RGB),
              advertised frame limit, brightness and font info (11-byte content
              after the two-byte response header).
            value: [0x04, 0x12, 0x00, 0x00]
            verification: "confirmed"
          get_buffer_size:
            description: "Device data buffer size (7-byte content after the two-byte response header)."
            value: [0x04, 0x14, 0x00, 0x00]
            verification: "confirmed"
          sending_data_start:
            description: >
              Announce an incoming data payload. Expect response type 2 with
              matching serial and command type and status zero.
            template: [0x0A, 0x01, "{serial_hi}", "{serial_lo}", "{type_hi}", "{type_lo}", "{len_b3}", "{len_b2}", "{len_b1}", "{len_b0}"]
            verification: "confirmed"
            parameters:
              serial_hi: { type: "uint8" }
              serial_lo: { type: "uint8" }
              type_hi: { type: "uint8" }
              type_lo: { type: "uint8" }
              len_b3: { type: "uint8" }
              len_b2: { type: "uint8" }
              len_b1: { type: "uint8" }
              len_b0: { type: "uint8" }
          sending_data_finish:
            description: >
              Payload fully transmitted. Expect response type 4 with matching
              serial and command type and status zero, not type 2.
            template: [0x0A, 0x03, "{serial_hi}", "{serial_lo}", "{type_hi}", "{type_lo}", "{len_b3}", "{len_b2}", "{len_b1}", "{len_b0}"]
            verification: "confirmed"
            parameters:
              serial_hi: { type: "uint8" }
              serial_lo: { type: "uint8" }
              type_hi: { type: "uint8" }
              type_lo: { type: "uint8" }
              len_b3: { type: "uint8" }
              len_b2: { type: "uint8" }
              len_b1: { type: "uint8" }
              len_b0: { type: "uint8" }

      - uuid: "0000ff22-0000-1000-8000-00805f9b34fb"
        name: "Data"
        properties: ["write_without_response"]
        notes: >
          Bulk payload channel. NO characteristic-level `framing` is declared ON
          PURPOSE. The length prefix and sum checksum here belong to the PAYLOAD
          (its 15-byte header, and each typed record within it), not to individual
          BLE writes: the payload is serialized once, then sliced into raw chunks.
          A consumer applying framing per write would prepend a length and append a
          checksum to every chunk and corrupt the upload.

          Write in (MTU - 3) byte chunks between sending_data_start and
          sending_data_finish, reacting to device-driven ContinueSending offsets
          instead of assuming a fixed buffer-full threshold. Payload structure is
          described in the device notes above. Brightness is record type 14 and
          screen mode is record type 15 — both are data payloads, not FF21 commands.

features:
  - type: "image_upload"
    format: "rgb888"
    resolution_source: "device_reported"
    verification: "confirmed"
    notes: >
      A 96x16 RGB static upload and a single-frame native scroll-left upload
      completed at MTU 512 in ten chunks with type-2 start and type-4 finish
      success responses. GetDisplayInfo supplies geometry. An eight-frame
      full-RGB upload was rejected with response 254, so the advertised
      20-frame field is not treated as a proven multi-frame limit.
  - type: "firmware_update"
    dfu:
      mechanisms: ["unknown"]
      image:
        signing: "unknown"
        source: "unknown"
        format: "A .bin file named like db_update_GDF-C2302_xxxx_V1.0_210425a.bin (GDF-C2302 the hardware model, 210425a a 2021-04-25 build); contents unknown."
        notes: >
          No image is bundled in the APK and none is publicly downloadable;
          getting one would need a capture of the app's upgrade flow.
      enter:
        how: "unknown"
      recovery:
        interrupted: "unknown"
      verification: "hypothesis"
      notes: >
        The app carries an upgrade routine and dialog keyed on the panel's
        hardware version, but neither the transport nor the wire protocol of
        the update has been traced, and none of the open reimplementations
        touches it. Presumably it rides the 0xFF20 service, which also
        carries every ordinary command, so nothing is listed under
        `services`.

entities:
  - platform: "light"
    name: "LED Panel"
    features: ["brightness"]
    state_characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
  - platform: "select"
    name: "Screen Mode"
    state_characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
    state_mapping:
      "0": "normal"
      "1": "upside_down"
      "2": "mirror"
      "3": "mirror_upside_down"

remaining_unknowns:
  - "The tested unit rejected eight-frame and three-frame full-RGB payloads with response 254, and its material/playlist/screen-on controls returned no successful object response. The true multi-frame/resource limit, playlist behavior and the meaning of the advertised frame-limit field need an official-app capture."
  - "Other geometries, monochrome panels, text/font records, brightness and screen-mode writes, factory reset and OTA remain unverified."
  - "AE30 and FF10 were enumerated on the tested unit but not used; their roles are unknown."

helpful_urls:
  - title: "SPOTLED app: getting started"
    url: "https://spotled.app/getting-started/"
    kind: "vendor_support"
    description: >
      The vendor's own setup guide, including reading the model from the Bluetooth ID shown at power-on. There is no printed manual for these panels.
  - title: "iwalton3/python-spotled"
    url: "https://github.com/iwalton3/python-spotled"
    kind: "implementation"
    description: >
      Working control library for the same displays.
