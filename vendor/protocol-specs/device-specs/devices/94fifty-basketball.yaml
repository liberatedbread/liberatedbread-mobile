protocol_details:
  framing:
    wire: "7e <packet with 7d and 7e escaped> 7e"
    escape: "A packet byte 0x7d or 0x7e is sent as 0x7d followed by (byte XOR 0x20): 7d -> 7d 5d, 7e -> 7d 5e. No other byte is escaped."
    request_packet: "type u16 BE | token u16 BE | payload | crc u32 BE"
    reply_packet: "type u16 BE (request type | 0x8000) | token u16 BE (echoed) | error u16 BE | payload | crc u32 BE"
    alignment: >
      The whole packet, CRC included, is a multiple of 4 bytes, so a request
      payload is a multiple of 4 and a reply payload is 2 more than a
      multiple of 4. Most reply payloads therefore start with 2 zero bytes of
      padding at offset 6. A reply with a non-zero error carries a 2-byte
      zero payload: 12 bytes in all.
    crc:
      name: "CRC-32/BZIP2"
      width: 32
      polynomial: "0x04c11db7"
      init: "0xffffffff"
      reflect_in: false
      reflect_out: false
      xor_out: "0xffffffff"
      check_ascii_123456789: "0xfc891918"
      covers: "Every packet byte before the CRC, on the de-stuffed packet."
      byte_order: "big-endian on the wire"
      notes: "Table-driven, MSB first. Not the reflected zlib/Ethernet CRC-32, which gives 0xcbf43926 on the same check string."
    receive: >
      Split on 0x7e. Undo escapes. Drop empty frames. Drop a frame on 0x7d
      followed by 0x7d or 0x7e, on more than 2048 buffered bytes, on a length
      under 8 or not a multiple of 4, or on a CRC mismatch. Unknown types are
      dropped silently by the vendor app.
    verification: "reported"
  tokens: >
    The requester picks a 16-bit token and the reply echoes it. Token 0 is
    reserved for unsolicited frames (live dribbling and shooting records,
    stream data). The vendor app uses 1 for its opening get_system_info and
    otherwise the low 15 bits of the current time in ms, never 0; its
    firmware updater counts up from 1. This spec's fixed commands all use
    0x0001, which is harmless because replies are also distinguished by type.
  session:
    - "Open the insecure RFCOMM socket to 32e5fcfc-52ee-41b0-827a-f18929716fef."
    - "Send get_system_info (token 1). Wait up to 5000 ms for type 0x8001; nothing else is sent before it."
    - "Use the protocol, bootloader and firmware versions and hardware revision it reports; the vendor app offers a firmware update when its bundled image for that revision is newer."
    - "Run requests; each has its own timeout (1000 ms by default)."
    - "To finish, send power_off (the vendor app's disconnect) or power_disconnect, or just close the socket."
  opcodes:
    description: >
      Every request type the protocol library defines, with its reply. u16
      values; replies are request | 0x8000. The declared commands cover the
      fixed ones; parameterised ones are in parameterised_requests; the rest
      are in advanced_opcodes.
    table:
      "0x0001": {name: "system info", reply: "0x8001", declared: "get_system_info"}
      "0x0002": {name: "firmware segment", reply: "0x8002", see: "advanced_opcodes"}
      "0x0003": {name: "firmware finalize", reply: "0x8003", see: "advanced_opcodes"}
      "0x0004": {name: "power control", reply: "0x8004", declared: "power_off, power_reset, power_disconnect, power_travel_mode, power_disable_bluetooth", payload: "mode u16 (0 off, 1 reset, 2 travel/airplane, 3 disconnect, 4 Bluetooth off) | delay u16 ms before acting"}
      "0x0005": {name: "status", reply: "0x8005", declared: "get_status"}
      "0x0006": {name: "get clock", reply: "0x8006", declared: "get_rtc"}
      "0x0007": {name: "set clock", reply: "0x8007", see: "parameterised_requests.set_rtc"}
      "0x0008": {name: "abort", reply: "0x8008", declared: "abort_activity"}
      "0x0009": {name: "start bandwidth test", reply: "0x8009", see: "advanced_opcodes"}
      "0x000a": {name: "end bandwidth test", reply: "0x800a", see: "advanced_opcodes"}
      "0x000b": {name: "get ball name", reply: "0x800b", declared: "get_ball_name"}
      "0x000c": {name: "set ball name", reply: "0x800c", see: "parameterised_requests.set_ball_name"}
      "0x000d": {name: "hardware self-test", reply: "0x800d", declared: "get_hardware_diag"}
      "0x0055": {name: "echo (dummy payload)", reply: "0x8055", see: "advanced_opcodes"}
      "0x0101": {name: "start raw stream", reply: "0x8101", data: "0x8301", see: "streams"}
      "0x0102": {name: "start orientation stream", reply: "0x8102", data: "0x8302", see: "streams"}
      "0x0120": {name: "start dribbling activity", reply: "0x8120", data: "0x8320", declared: "start_dribbling_drill", see: "parameterised_requests.start_activity"}
      "0x0121": {name: "start shooting activity", reply: "0x8121", data: "0x8321", declared: "start_shooting_drill_pass, start_shooting_drill_solo", see: "parameterised_requests.start_activity"}
      "0x0201": {name: "end raw stream", reply: "0x8201", see: "streams"}
      "0x0202": {name: "end orientation stream", reply: "0x8202", see: "streams"}
      "0x0220": {name: "end dribbling activity", reply: "0x8220", declared: "end_dribbling_activity"}
      "0x0221": {name: "end shooting activity", reply: "0x8221", declared: "end_shooting_activity"}
      "0x0320": {name: "get stored dribbling record", reply: "0x8320", see: "parameterised_requests.get_stored_record"}
      "0x0321": {name: "get stored shooting record", reply: "0x8321", see: "parameterised_requests.get_stored_record"}
      "0x0401-0x0406": {name: "factory and FCC test modes", see: "advanced_opcodes"}
      "0x8080": {name: "bandwidth test data", direction: "ball to phone", see: "advanced_opcodes"}
    not_defined: >
      There is no opcode 0x0200 (512). Earlier notes on this ball listed 512
      as the raw-stream start; the app's type table has start raw stream at
      0x0101 (257), end raw stream at 0x0201 (513) and end orientation stream
      at 0x0202 (514). The pattern: starts 0x01xx, ends 0x02xx, data frames
      0x83xx, stored-record fetches 0x03xx, test modes 0x04xx.
    verification: "reported"
  error_codes:
    0: "no error"
    1: "unknown packet type"
    2: "system busy (retry)"
    3: "in progress (the firmware updater treats it as success)"
    4: "firmware segment out of sequence"
    5: "firmware image corrupted"
    6: "invalid packet size"
    7: "invalid packet field"
    8: "low battery"
    9: "invalid state"
    10: "invalid activity id"
    11: "invalid record id"
    12: "activity not running"
    13: "scoring engine failed"
    14: "out of resources"
    65535: "unspecified failure (also what the app maps any unlisted value to)"
  parameterised_requests:
    description: >
      Requests that take a caller value. Each needs its CRC-32/BZIP2 computed
      and its packet byte-stuffed, which the schema's command encoder cannot
      do yet, so they are not in `commands`. Layouts are of the de-stuffed
      packet; every integer is big-endian. Worked frames use token 0x1234 and
      are computed, not captured.
    set_rtc:
      opcode: "0x0007"
      packet: "00 07 | token u16 | utc_seconds u32 | crc u32 (12 bytes)"
      utc_seconds: "Seconds since 1970-01-01T00:00:00Z, u32 big-endian. The vendor app sends the phone's current time."
      reply: "0x8007, 12 bytes, error only."
      example: {meaning: "2026-01-01T00:00:00Z (1767225600), token 0x1234", wire: "7e 00 07 12 34 69 55 b9 00 c7 85 c9 90 7e"}
    set_ball_name:
      opcode: "0x000c"
      packet: "00 0c | token u16 | name 48 bytes | crc u32 (56 bytes)"
      name: "UTF-8, NUL-padded to 48 bytes; a 48-byte name has no terminator. The Android app never sends this; its own rename UI allowed 1-20 ASCII characters and kept the name off the ball."
      reply: "0x800c, 12 bytes, error only."
      example: {meaning: "name 'Court 1', token 0x1234", wire: "7e 00 0c 12 34 43 6f 75 72 74 20 31 (41 x 00) c8 e1 b3 73 7e"}
    get_stored_record:
      opcodes: {dribbling: "0x0320", shooting: "0x0321"}
      packet: "03 2x | token u16 | activity_id u32 | record_id u16 | 00 00 | crc u32 (16 bytes)"
      reply: "A dribbling_record (0x8320) or shooting_record (0x8321) frame carrying the request's token; errors 10 (invalid activity id) and 11 (invalid record id) are defined."
      notes: "The vendor app v1.4 never sends these: it uses only the live records. Whether a ball keeps records after the activity ends, or across a power cycle, is not established."
      example: {meaning: "shooting record 0 of activity 1, token 0x1234", wire: "7e 03 21 12 34 00 00 00 01 00 00 00 00 c8 7b e0 2d 7e"}
    start_activity:
      opcodes: {dribbling: "0x0120", shooting: "0x0121", raw_stream: "0x0101", orientation_stream: "0x0102"}
      common_payload: "user_id u32 | start_time u32 | 00 00 | notify_method u16 | activity_limit u32 | notify_interval u32 (20 bytes)"
      user_id: "Always 0 from the vendor app."
      start_time: "Always 0 from the vendor app."
      notify_method: "Bit 0: the limit counts events (1) or milliseconds (0). Bit 1: a record is sent every notify_interval events (1) or milliseconds (0). 0 = time/time, 3 = event/event."
      activity_limit: "Milliseconds (bit 0 clear) or events (bit 0 set). Minimum 100 ms or 1 event per the protocol library."
      notify_interval: "Milliseconds (bit 1 clear) or events (bit 1 set). Minimum 100 ms or 1 event."
      dribbling_extra: "dsp_algorithm u16 (0 from the app) | dribble_window u16 (5 from the app). Payload 24 bytes, packet 32."
      shooting_extra: "player_height u16 in inches (the app sends the player's height, 70 if unknown) | shot_distance u16 in inches (165 free throw, 180 for 15 ft and shoot-around, 216 for 18 ft, 240 for 20 ft, 276 for 23 ft) | shooting_algorithm u16 (1 with a pass, 2 solo; the protocol library also names 1 'with magnetometer' and 2 'without magnetometer', and 3 and up are debug values) | 00 00. Payload 28 bytes, packet 36."
      vendor_presets:
        dribbling_drill: "notify_method 0, limit 600000 ms, interval 200 ms, algorithm 0, window 5 (start_dribbling_drill)"
        dribbling_self_test: "notify_method 0, limit 3000 ms, interval 200 ms, window 5 (factory validator)"
        shooting_drill: "notify_method 3, limit N shots (20 by default), interval 1 shot (start_shooting_drill_*)"
      reply: "0x8120 or 0x8121: error, 00 00, activity_id u32 (16 bytes)."
  streams:
    description: >
      Diagnostic data streams. Not bound to any entity: the vendor app treats
      the data as opaque and only saves it to a file.
    raw_stream: "Start 0x0101 with the common start payload, notify_method 2, activity_limit = duration in ms, notify_interval 1. Data frames 0x8301 (1344 bytes, 1324 sample bytes each; see bluetooth_classic.serial.unsolicited raw_data). End with 0x0201; the reply 0x8201 carries the notification count u16 at offset 6."
    orientation_stream: "Start 0x0102, notify_method 2, activity_limit in ms, notify_interval in events (the app's validator uses 4000 ms and 5). Data frames 0x8302 (28 bytes, 8 data bytes). End with 0x0202; reply 0x8202 carries the notification count u16 at offset 6."
    start_reply: "0x8101 / 0x8102 with an error code; the app does not check the payload length (its own encoder writes 6 zero bytes, a 16-byte packet)."
  battery_percentage:
    description: "The vendor app's gauge, from the status battery_voltage v in mV. Presentation only; clamp the result to 1-100."
    formula: >
      t = 40 if v >= 4000; (4071.9 - v) / 1.9131 if v > 3900; (3982.2 - v) /
      1.0776 if v > 3550; else (13394 - v) / 26.018. percent = floor((1 -
      (t - 40) / 360) * 100).
    indicator: "The app's ball-battery icon is green above 30 %, yellow above 15 %, red at 15 % or below. Its factory validator fails a ball at 10 % or below."
  control_percentage:
    description: "How the vendor app turns a dribbling_record into its ball-control percentage (presentation only)."
    formula: >
      If 10 * samples_to_buffer_end - 10 * samples_to_last_dribble < 2 *
      average_dribble_speed, control = ceil(100 * samples_in_control /
      (samples_to_last_dribble - samples_to_first_dribble)); otherwise ceil(100
      * samples_in_control / (samples_to_buffer_end - samples_to_first_dribble)).
      A zero denominator gives 0. Clamp to 0-100.
  advanced_opcodes:
    firmware_segment:
      opcode: "0x0002"
      role: "Carries one chunk of a firmware image (sequence number, length, up to 1012 bytes). Writes flash on the running ball."
      advanced: true
      advanced_reason: "Replaces the ball's firmware; a wrong or interrupted image may leave it unable to boot, and nothing here documents recovery."
    firmware_finalize:
      opcode: "0x0003"
      role: "Commits the uploaded image."
      advanced: true
      advanced_reason: "Commits whatever was uploaded as the ball's firmware; same risk as firmware_segment."
    factory_test_modes:
      opcodes: "0x0401 FCC test mode (modulation, test pattern, channel, power), 0x0402 RF signalling test, 0x0403 set maximum output power, 0x0404 FCC TX/RX mode, 0x0405 BLE directed-advertising test, 0x0406 BLE undirected-advertising test"
      role: "Radio certification and production-line tests. Payloads intentionally not given."
      advanced: true
      advanced_reason: "Puts the radio into a regulatory test mode (continuous carriers, fixed channels, raised output power) that leaves normal operation and may transmit outside what the grant allows; the way back is not documented."
    bandwidth_test:
      opcodes: "0x0009 start, 0x000a end (the app waits up to 15 s for its reply), 0x8080 data frames of up to 2036 bytes"
      role: "Throughput test that floods the link with dummy data."
      advanced: true
      advanced_reason: "Floods the RFCOMM link; a client that is not draining it will stall."
    dummy_echo:
      opcode: "0x0055"
      role: "Loopback of up to 1260 bytes, reply 0x8055. Defined by the protocol library but never sent by the app; whether the firmware answers it, and the reply's padding, are unknown."
  vendor_app_behaviour:
    offline_use: >
      The app's login screen offers a guest ("Just visiting") path that is
      entirely local, so drills work without the dead server once the ball
      connects. Typing the word diag into the sign-in screen's email field
      opens the diagnostic screen (connect, status, clock, streams,
      activities, firmware) without an account.
    validators: >
      The device-validator screens are production-line tools, not an
      authenticity check. They open from the diagnostic screen's device-test
      list, or at launch when the app's mode is set to factory in the
      diagnostic settings. They never run in the consumer flow. They exercise
      the battery, streams, a dribbling activity, the hardware self-test,
      firmware and the power modes, and post their results to the dead
      server. Nothing gates normal use on them.
    firmware_policy: >
      By default the app compares the ball's firmware with the one OEM image
      it bundles for that hardware revision (hw1 0.73, hw2 0.130) and, if the
      two differ in EITHER direction, goes straight from its ball-connection
      screen into flashing that image, with no prompt. A ball carrying newer
      firmware than the bundled image is therefore downgraded the first time
      the Android app v1.4 connects to it. A ball reporting firmware major 72
      is exempt. The diagnostic screen's settings page has a
      firmware-validation-mode selector with four choices: fixed version (the
      default, as above), upgrade only, downgrade only and disabled. The
      release build exposes it, and it is reachable without an account
      (offline_use). Set it to disabled or upgrade only BEFORE letting the app
      connect to a ball whose firmware should be kept.
    unused_opcodes: "The app never sends get or set ball name, the echo (0x0055) or the stored-record fetches, although its protocol library can encode all of them."
    rename: "Renaming a ball in the app changes only the app's own record (and its cloud copy) and requires 1-20 ASCII characters; nothing is written to the ball."
    reconnect: "Before connecting to a ball the app sends power-control disconnect to whichever ball it had; on disconnect it sends power-control off, so the ball sleeps and has to be bounced again. When the link comes back in the middle of a drill it sends get_status and starts a new activity if the ball reports idle in the state word's low byte (activity_state_low 0 or an unlisted value); it never resumes the old activity id."
    reader_defect: >
      As decompiled, the app's frame reader recognises a closing 0x7e but the
      recovered code does not hand the frame on; this is most likely a
      decompiler artefact rather than an app bug, since the app evidently
      worked. Noted so nobody copies the reader verbatim.
  entity_coverage: >
    Not bound to any entity, and why. Setting the clock and the stored name,
    fetching stored records and custom activity starts need a CRC the encoder
    cannot compute (parameterised_requests). The raw and orientation streams
    are opaque. Travel Mode and Bluetooth-off are advanced and left unbound.
    Live records ARE bound, through `state_field` on
    bluetooth_classic.serial.unsolicited.
  test_vectors:
    description: >
      Computed from the vendor app's encoders and checked against an
      independent standard-library transcription of the framing. None is a
      capture.
    crc32_bzip2:
      - {input_ascii: "123456789", crc: "0xfc891918"}
      - {input_hex: "00 01 00 01", crc: "0x3de293b4", meaning: "get_system_info packet, token 1"}
    frames:
      - {hex: "7e 00 01 00 01 3d e2 93 b4 7e", meaning: "get_system_info, token 1"}
      - {hex: "7e 00 05 00 7d 5e e2 7b 81 f2 7e", meaning: "get_status with token 0x007e: the token's 7e is escaped as 7d 5e"}
      - {hex: "7e 00 05 00 0b 15 0a f7 7d 5e 7e", meaning: "get_status with token 0x000b: the CRC's last byte 7e is escaped"}
      - {hex: "7e 00 07 12 34 69 55 b9 00 c7 85 c9 90 7e", meaning: "set_rtc 2026-01-01T00:00:00Z, token 0x1234"}
      - {hex: "7e 03 21 12 34 00 00 00 01 00 00 00 00 c8 7b e0 2d 7e", meaning: "fetch shooting record 0 of activity 1, token 0x1234"}
      - {hex: "7e 80 05 00 01 00 00 00 00 00 00 0f 3c 00 00 00 00 00 00 00 00 1c 5e 47 2d 7e", meaning: "status reply: idle, 3900 mV"}
      - {hex: "7e 80 01 00 01 00 00 00 00 00 01 00 01 00 01 00 82 00 00 00 02 00 00 30 39 99 fc 9b 62 7e", meaning: "system info reply: OEM, protocol 0.1, bootloader 0.1, firmware 0.130, hw2, serial 12345 (invented)"}
      - {hex: "7e 83 21 00 00 00 00 00 00 00 00 00 07 00 03 00 00 00 00 04 b0 00 00 15 18 00 00 17 70 00 01 00 00 00 00 14 b4 00 00 15 0e 02 8a 02 bc 20 00 1f 4a 0e 6a 0d ac 00 54 00 00 00 b4 00 00 5c e2 f5 08 7e", meaning: "live shooting record (invented values): activity 7, record 3, made, release 0.650 s, arc 45.0 degrees, spin 150 rpm, distance 180"}
      - {hex: "7e 83 20 00 00 00 00 00 00 00 00 00 07 00 0c 00 00 00 00 00 64 00 00 0b 54 00 00 0b b8 00 00 09 c4 00 00 00 78 00 3c 00 28 00 23 00 fa 08 00 07 6c 00 01 00 00 39 10 ce 66 7e", meaning: "live dribbling record (invented values): activity 7, record 12, 12 dribbles, streak 4, intensity 2.0 G"}
  schema_gap: >
    Proposed for docs/contributing/spec-evolution.md: an `auto: crc32_bzip2`
    parameter role (CRC-32/BZIP2, big-endian u32) and a byte-stuffing framing
    scheme for byte streams (`hdlc_7e`: 0x7e flags, 0x7d escape XOR 0x20).
    With both, every request in parameterised_requests becomes a `template`
    command and the fixed frames here could drop their precomputed CRCs.

evidence:
  artifacts:
    - type: "static_analysis"
      artifact: "94Fifty Basketball for Android, package com.spectrumdt.ist, version 1.4 (December 2014)"
      obtained_via: "third-party APK mirror, 2026-09; delisted everywhere else"
      description: >
        Decompiled Java, protocol layer unobfuscated. Established the insecure
        RFCOMM socket to the vendor SDP UUID, the BLE-scan and Classic-inquiry
        discovery paths, the 0x7e framing and escaping, the CRC-32/BZIP2
        parameters, every packet layout and opcode, the reply-token rule, the
        connect handshake and timeouts, the drill presets, the display
        scalings (arc, spin, release time, intensity, dribble counts), the
        battery curve, the firmware-update exchange and the app's offline and
        diagnostic paths. Negative findings: no pairing or crypto in the app
        (the only AES is inside a bundled Google library), no use of the ball
        name opcodes, the echo opcode or the stored-record fetches, and the
        device-validator screens never run in the consumer flow.
    - type: "fcc_filing"
      artifact: "FCC ID 2AARZ-TBBX001, InfoMotion Sports Technologies Inc., granted 2013-09-30 (DTS, 2402-2480 MHz, 1.38 mW conducted)"
      url: "https://fccid.co/fcc/2AARZ-TBBX001"
      description: >
        The test report describes a Bluetooth 4.0 radio, GFSK, on 40 channels
        at 2 MHz spacing (the LE channel plan; the report nonetheless labels it
        FHSS with adaptive hopping), 1.38 mW conducted into a -0.5 dBi
        antenna, and the grant is DTS only. A
        BR/EDR transmitter would normally carry a separate 79-channel
        frequency-hopping grant, and none is filed under this grantee code,
        although the Android app can only have reached the ball over BR/EDR
        (RFCOMM does not run over LE). The app's own radio test-mode requests
        do include BR/EDR modes (EDR modulations, frequency hopping, ACL
        packet types up to 3-DH5), so the radio is BR/EDR-capable whatever the
        filing says. The internal photos show the sensor puck, a
        3.7 V 240 mAh lithium-polymer cell, a chip antenna and the Qi receive
        coil. Chip markings are not legible. The grantee holds no other grant,
        so the SmartNet and charging pad have none under this code.
    - type: "vendor_documentation"
      artifact: "94Fifty Smart Sensor Basketball user guide (FCC user-manual exhibit)"
      url: "https://fccid.co/api/files/s1/2aarz_tbbx001_usersmanual_2089328_be3eadb87f.pdf"
      description: >
        Activation from Travel Mode on the charging pad, the four-bounce wake,
        auto-sleep, Travel Mode needing the pad to recover, charging (about 3 h
        from empty), the chest-pass and solo shooting technique, and iOS
        compatibility for Bluetooth 4.0 devices.
  app_static_analysis: >
    Everything under `commands`, `bluetooth_classic` and `protocol_details`
    is what the vendor app sends and parses, not what a ball was seen to do.
    No hardware, no captures and no screenshots were available, so every fact
    is `reported`.
  open_questions:
    - >
      Is the ball still usable without the dead backend? The Android app has
      a local guest path and an account-free diagnostic screen, and nothing
      in the ball's protocol refers to an account, so the answer looks like
      yes; nobody has confirmed it on a device running the app today (it
      targets Android 4-era APIs).
    - >
      The CRC parameters are read off the app's CRC routine (MSB-first table,
      polynomial 0x04c11db7, seed 0xffffffff, final inversion) and checked by
      transcription; a single captured frame would confirm them.
    - >
      Does the iOS app talk to the ball over BLE GATT? If so there is a second
      control surface with a GATT table nobody has recorded.
    - >
      Units of launch_height and shot_distance in shot records, the raw unit
      and sign of spin, and the sample rate behind every sample count.
      Launch-era press quoted nine sensors and 6,000 data points per second in
      total, which does not by itself give the per-sample rate the counters
      use.
    - >
      Whether the ball keeps activity records for later fetch (opcodes
      0x0320/0x0321), and for how long.
    - >
      Why the FCC grant covers only the LE (DTS, 40-channel) mode when the
      Android app talks to the ball over BR/EDR RFCOMM, and the app's own
      radio test modes include BR/EDR packet types. An inquiry scan or an HCI
      snoop log of the app answers it at once; until then the BR/EDR side
      rests entirely on the app's code.

remaining_unknowns:
  - "Everything, on hardware: no capture and no session exists. Each byte here comes from the vendor app's encoders and parsers."
  - "The BLE advertised name, whether the BR/EDR address equals the BLE address, and the RFCOMM channel number."
  - "The BLE GATT surface, if any, that the iOS app used."
  - "How long the ball stays awake and connectable after the bounce, and whether it accepts a second connection."
  - "Whether power-control replies arrive before the link drops, and exactly how power-control mode 4 (Bluetooth off) is undone."
  - "Units of launch_height and shot_distance; the raw unit and sign of spin; the sample rate; whether average_consecutive_dribbles is in tenths."
  - "The layouts of the raw-sensor and orientation stream data."
  - "Whether the echo opcode (0x0055) is implemented by the firmware."
  - "Whether stored activity records survive the activity's end or a power cycle."
  - "Whether the ball verifies a signature on firmware images, and what an interrupted update leaves behind."
  - "Whether any ball in the field runs firmware newer than the Android app's bundled images (an iOS build could have shipped one); the Android app would silently downgrade it."
  - "Whether hw1 and hw2 differ in anything but the firmware image they take."
  - "The exact MCU and Bluetooth part numbers; FCC photo markings are illegible. A TI CC256x-class controller beside a 16-bit host is hypothesised from the radio test-mode enumerations, not seen."

