protocol_details:
  generation_mapping:
    description: >
      How the vendor app sorts a scan result, and what this spec concludes
      from it. Reported: inferred from the app plus BlueRadios' published
      BRSP UUIDs, not from hardware.
    rules:
      - {advertised_service: "7dc55a86-c61f-11e5-9912-ba0be0483c18", app_generation: "V2", covers: "2nd-gen Dual/Dual+, Plus, Stealth, Mini S, Mini X; the Rev (by the app's logic)"}
      - {advertised_service: "da2b84f1-6279-48de-bdc0-afbea0226079", app_generation: "V1", covers: "1st-gen Single/Dual/Dual+ (BlueRadios BRSP serial pipe)"}
      - {advertised_service: "ea32b817-d410-42e2-848a-1218201468fc", app_generation: "V2 + scooter", covers: "Boosted Rev (a check on top of the V2 match, in a helper the release examined never calls)"}
    verification: "reported"
  per_model_scales:
    description: >
      Factors the app applies to the raw odometer and speed counts, by the
      model code read from 7dc59643. Odometer in miles per count; speed in
      mph per count.
    odometer_mi_per_count:
      "0": 3.6128e-5
      "1": 3.6128e-5
      "2": 3.6128e-5
      "3": 3.8386e-5
      "4": 3.8386e-5
      "5": 3.6128e-5
      "6": 3.6128e-5
      "7": 6.2137273665e-4
    speed_mph_per_count:
      boards: 0.0028409092
      "7": 0.00223694
    test_vectors:
      - {characteristic: "7dc56b34-c61f-11e5-9912-ba0be0483c18", model: 4, bytes: "c0 0d", raw: 3520, decoded: "10.0 mph"}
      - {characteristic: "7dc56b34-c61f-11e5-9912-ba0be0483c18", model: 7, bytes: "10 27", raw: 10000, decoded: "22.37 mph (10 m/s)"}
      - {characteristic: "7dc56594-c61f-11e5-9912-ba0be0483c18", model: 1, bytes: "40 42 0f 00", raw: 1000000, decoded: "36.128 mi"}
      - {characteristic: "7dc56594-c61f-11e5-9912-ba0be0483c18", model: 3, bytes: "40 42 0f 00", raw: 1000000, decoded: "38.386 mi"}
      - {characteristic: "7dc56594-c61f-11e5-9912-ba0be0483c18", model: 7, bytes: "40 42 0f 00", raw: 1000000, decoded: "621.37 mi (1000 km)"}
    verification: "reported"
  ride_modes:
    description: >
      The firmware's modes as the app presents them. The wire value is the
      index. The app numbers modes from 1. The km/h figures are the app's
      own display constants for its mode picker. The firmware enforces the
      real caps, and they vary with board and firmware (the vendor's
      listing screenshot shows 22/26/32/35/39 km/h on a 3rd-gen board).
    modes:
      - {wire: 0, shown_as: 1, name: "Beginner", app_top_speed_kmh: 18.0, app_top_speed_kmh_rev: 19.3}
      - {wire: 1, shown_as: 2, name: "Eco", app_top_speed_kmh: 25.0, app_top_speed_kmh_rev: 29.0}
      - {wire: 2, shown_as: 3, name: "Expert", app_top_speed_kmh: 32.0, app_top_speed_kmh_rev: 38.6}
      - {wire: 3, shown_as: 4, name: "Pro", app_top_speed_kmh: 35.0}
      - {wire: 4, shown_as: 5, name: "Hyper", app_top_speed_kmh: 38.0}
    first_gen_reference: >
      The vendor's 2014 insert for 1st-gen boards (which this GATT profile
      does not reach) lists Dual as Beginner 11 mph, Eco 16 mph and Expert
      20 mph, and Dual+ adds Pro at 22 mph. On those boards the mode is
      cycled with three presses of the remote's button.
    verification: "reported"
  characteristic_sets:
    description: >
      The app keeps three groups of characteristics. On connect it reads
      every characteristic from all three groups that the GATT table
      actually contains, whatever the vehicle. Then, going by the Firmware
      Revision String, it reads the battery pack group again or asks the
      serial pipe (protocol_details.firmware_gates), and finally subscribes
      to the notify set.
    board: ["7dc5bb39", "7dc55f22", "7dc59643", "7dc56594", "7dc55dec", "00002a26", "65a8eeae", "65a8f5d4", "65a8f3c2", "7dc56b34"]
    battery_pack_v1_5_plus: ["65a8f834", "65a8f833"]
    scooter_group: ["7dc5c19d", "ea32dcac", "ea32b761", "ea326b96", "ea324d8c", "7dc5c201", "7dc5c202"]
    notify: ["7dc55f22", "7dc56594", "7dc56b34", "65a8eeae", "65a8f5d4", "ea32dcac"]
    known_but_unused: ["7dc56bfc (power)", "00002a25 (serial number)"]
    notes: "Short forms are the first 8 hex digits of the full UUIDs declared in `services`."
  firmware_gates:
    description: "Version thresholds the vendor app applies. 'fw string' = the Firmware Revision String (00002a26-0000-1000-8000-00805f9b34fb), read after connecting; 'advertised' = the version in the manufacturer data, read before connecting."
    gates:
      - {version: "v1.4.2", source: "fw string", effect: "Below: the app gets no battery pack ID/firmware at all."}
      - {version: "v1.5.0", source: "fw string", effect: "From here the app reads the battery pack ID/firmware characteristics. From v1.4.2 up to v1.5.0 it asks the serial pipe instead (25 s timeout)."}
      - {version: "v1.5.0", source: "fw string", effect: "Serial-pipe writes are wrapped in a framing (not mapped)."}
      - {version: "v1.6.0", source: "fw string", effect: "The serial pipe needs a cloud-answered challenge before use."}
      - {version: "v2.0.0", source: "advertised", effect: "Below: the app deletes the phone's bond before connecting and bonds again."}
      - {version: "v2.1.0", source: "advertised", effect: "The app defines a 'bonded connection fixed' test at this version but never calls it in the release examined."}
    verification: "reported"
  range_estimate:
    description: >
      The app computes range itself. The board reports only charge, pack
      capacity and mode. The estimate in miles is (battery_percent / 100) x
      capacity_factor x (full_range + (mode_wire + 1) x mode_coeff +
      (grade_setting / 400) x rider_weight_lb x grade_coeff +
      (aggressiveness_setting / 100) x rider_weight_lb x aggressiveness_coeff).
      Grade, aggressiveness and weight are rider settings kept in the app.
    coefficients:
      boards: {full_range: 9.30698856285735, mode_coeff: -1.0949060404929, grade_coeff: -0.046077882499967, aggressiveness_coeff: -0.007478175495908}
      rev: {full_range: 9.22777778, mode_coeff: -1.9, grade_coeff: -0.013, aggressiveness_coeff: -0.0027}
    verification: "reported"
  cloud:
    description: "Boosted's REST backend (accounts, rides, cities, inbox and the firmware list with image URLs) has been offline since 2020. Nothing in this spec depends on it."

evidence:
  app_static_analysis: >
    The last Android release of the vendor app (1.4.5, December 2019),
    decompiled and read by hand in September 2026. It established the scan
    filters and generation mapping, the full characteristic list with each
    characteristic's parser (offset, width, signedness, scale), every write
    path (mode, units, name, lights), the bond-before-connect behaviour,
    the firmware-version gates, the serial pipe's cloud challenge, and
    that the app bundles no Nordic DFU or MCUmgr library. It also showed
    that the ride-mode wire values are 0-4, not the 1-5 the app shows.
  documentation_review: >
    Boosted's own support articles and the 2014 riding-mode insert, as
    archived by the Internet Archive: the five-press pairing step, app and
    remote coexistence per generation, the Beams lights, the
    extended-range battery's update requirement, and the 1st-gen mode
    speeds. The archived Play Store listing screenshots confirmed the five
    mode names and their order.
  community_reports: >
    The foreverboosted.co FAQ: owners read the Firmware Revision String
    under Device Information and battery firmware under service
    65a8eaa8-c61f-11e5-9912-ba0be0483c18 with a generic BLE explorer, and
    the last firmware releases (ESC 2.7.2, extended-range battery 2.5.1).
    Beambreak's firmware table dates Beams support to ESC 2.7.x.
  open_questions: >
    Everything is reported. Nothing was captured or replayed. The
    generation mapping, the Rev's advertised services, the parent services
    of the vehicle, lights and serial characteristics, the pairing
    association model, and whether the board enforces the bond all need
    hardware.
  artifacts:
    - type: "static_analysis"
      artifact: "Boosted Boards Android app, release 1.4.5 (December 2019), the final release"
      obtained_via: "third-party APK mirror; the app is delisted from Google Play"
      description: >
        Source of every characteristic, value layout and write in this
        spec. Negative findings: no Nordic DFU or MCUmgr/SMP library; no
        PIN handling; the power and serial-number characteristics are
        known to the app but never read.
    - type: "documentation"
      artifact: "Boosted support articles and 2014 riding-mode insert (Internet Archive copies)"
      description: "Pairing procedure, generation compatibility, lights, battery update requirement, 1st-gen mode speeds."

remaining_unknowns:
  - "Nothing has been checked on hardware. Every characteristic, scale and write here is read from the vendor app."
  - "The generation mapping (7dc55a86 = 2nd/3rd gen, da2b84f1 = 1st gen BRSP) is inferred from the app and BlueRadios' public UUIDs, not observed on a board."
  - "Whether the Rev advertises 7dc55a86 as well as ea32b817. The app's scan filters imply it must, but nobody has looked."
  - "Parent services: the vehicle characteristics are assumed to sit under the advertised 7dc55a86 service and the lights under ea32b817, and the serial pair's service is unknown. Only the battery service (65a8eaa8) and Device Information placement come from owners' own reads."
  - "The pairing association model (Just Works is likely: the app supplies no PIN), whether the board refuses an unbonded central, how many bonds it keeps, and how long the pairing window lasts."
  - "The physical unit of battery_capacity's raw count, and the lengths of the motor-driver serial and battery ID values."
  - "Maximum board-name length, and whether a rename changes the advertised local name."
  - "vehicle_power (7dc56bfc) layout and properties: the app never reads it."
  - "Whether boards (not only the Rev) expose vehicle_units, and what it changes on a board with no display."
  - "Which vehicles expose the lights characteristics: the Rev (built-in lights) and boards on ESC 2.7.x with Beams fitted, both by inference. Not checked."
  - "Whether the flags bytes of the manufacturer data carry anything besides the pairing bit, and whether scan-record bytes 34-37 really hold the motor-driver serial over the air."
  - "The serial pipe's framing (v1.5.0+) and the bootloader protocol are deliberately unmapped. The v1.6.0+ challenge cannot be answered without Boosted's servers."
  - "The 1st-gen BRSP payload is entirely unmapped."

