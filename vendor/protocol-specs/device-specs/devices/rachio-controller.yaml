device:
  name: "Rachio Controller"
  manufacturer: "Rachio"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "wifi"
  category: "irrigation"
  transport: "homekit"
  notes: >
    The observed Rachio controller advertises HomeKit HAP over mDNS with a
    model string matching Rachio-AABBCC. The HAP accessory ID is stable across
    IP changes and should be used for identity. Port 80 is open on the device,
    but this spec currently documents local discovery rather than a complete
    unauthenticated control protocol.
    Silicon lineage: Gen 1 = Electric Imp platform (BlinkUp optical
    provisioning; cloud end-of-life 2024), Gen 2 = AzureWave CU288 / Marvell
    (FCC ID TLZ-CU288), Gen 3 = Rachio's own FCC ID 2AOTB-ZULWC, dual-band
    Wi-Fi plus a 900 MHz radio for the Wireless Flow Meter. Native HomeKit
    exists only on Rachio 3. In-the-wild firmware build:
    iro3-firmware-hk-5-632 ("hk" = HomeKit). Rachio's 2025 Smart Lighting
    Controller uses Matter/Thread — the vendor is migrating new products away
    from HomeKit.
  identification:
    # No mdns_service_type. HomeKit accessories all advertise `_hap._tcp` — hundreds of unrelated
    # products. It says the device speaks HomeKit, not that it is this one.
    # The `discovery` block below still records it.
    default_port: 80
    identity_keys:
      primary: "hap_id"
      display: "name"

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_hap._tcp.local."
          txt_record_keys: ["id", "md", "c#", "pv"]
          identity_mapping:
            stable_keys:
              - source: "txt:id"
                key: "hap_id"
            display:
              source: "name"
    identity:
      stable_keys: ["hap_id"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      Gen 2 onboarding is documented from the decompiled vendor app
      (com.rachio.iro v2.8, UCLA ECE209AS): SoftAP provisioning with a
      Curve25519 secure session (see below). The Gen 3 flow is now also
      documented from the decompiled current app (com.rachio.prov.gen3):
      HTTPS JSON POSTs to the setup AP under a pinned CA, no Curve25519
      session (see below). Neither flow has been replayed against hardware.
      What is confirmed from the LAN probe is the post-setup state: the
      controller advertises a HomeKit HAP service, and HAP pairing gives
      cloud-free local control. The HomeKit setup code is NOT printed on the
      device — it is generated and displayed in the Rachio app (Controller
      Settings → HomeKit; reportedly iOS-only), so HAP pairing depends on the
      vendor app at least once.
    methods:
      - type: "softap_http"
        verified: false
        description: >
          Gen 2 flow (decompiled com.rachio.iro v2.8; constants re-confirmed
          in the current decompiled app, com.rachio.prov.gen2): the phone
          joins the unit's setup AP (SSID prefix "Rachio"; device AP at
          192.168.10.1), then GET /rachio/iroinfo (device info incl. salt),
          POST /prov/secure-session (Curve25519 ECDH; session key derived
          from the shared secret + device salt + serial number — the serial
          acts as PIN), GET /prov/net-info?session_id=N (scan results,
          AES-CTR encrypted), POST /prov/network?session_id=N (home
          SSID/passphrase, AES-CTR encrypted) and POST /sys/time (epoch
          sync). Bodies are form-urlencoded; crypto is AES/CTR/NoPadding
          with Curve25519 ECDH, as re-confirmed in the current app.
        softap:
          ssid_prefix: "Rachio"
          ssid_examples: ["Rachio-XXXXXX"]
          gateway_ip: "192.168.10.1"
          credential_encryption:
            algorithm: "AES/CTR/NoPadding"
            key_derivation: "Curve25519 ECDH shared secret + device salt + device serial number (serial acts as PIN); session-scoped key."
            notes: "Setup SSID is 'Rachio-' plus the last 3 MAC bytes (6 hex chars, uppercase), derived from the MAC in the current decompiled app."
        steps:
          - action: 'Join the controller''s setup AP (SSID "Rachio-XXXXXX", XXXXXX = last 3 MAC bytes uppercase); the device is at 192.168.10.1.'
            actor: "client"
          - action: "GET /rachio/iroinfo for device info and salt."
            actor: "client"
          - action: "POST /prov/secure-session to establish the Curve25519 ECDH session (serial number as PIN)."
            actor: "client"
          - action: "GET /prov/net-info?session_id=N for scan results (AES-CTR, session-scoped)."
            actor: "client"
          - action: "POST /prov/network?session_id=N with the home Wi-Fi credentials (AES-CTR encrypted)."
            actor: "client"
          - action: "POST /sys/time to sync the epoch."
            actor: "client"
            notes: "Gen 2 verified from the decompiled app (v2.8 flow, constants re-confirmed in the current app); not replayed on hardware."
      - type: "softap_http"
        verified: false
        description: >
          Gen 3 flow (decompiled current app, com.rachio.prov.gen3): the
          phone joins the unit's setup Wi-Fi, then talks HTTPS JSON to the
          device — POST https://<deviceMac>/<endpoint> with a custom DNS
          resolver, a pinned root CA shipped in the app assets
          (rachioBroker_rootCA.pem) and auth header
          "x-api-key: <serial uppercase>". Endpoints: info, config, conn,
          schedule, time, done, remove, fwupdate. The config body carries
          the home ssid/pass in cleartext JSON (protected only by the pinned
          TLS session); time carries the epoch. The conn poll exposes the
          device's connection state machine — WIFI_CONNECTED → DNS_SUCCESS →
          TLS_CONNECTED → MQTT_CONNECTED → MQTT_SUBSCRIBED → FULLY_CONNECTED
          — confirming the Gen 3 cloud path is MQTT. App-side provisioning
          states run CONNECT → SETTINGTIME → CONFIGURING → WAITINGFORWIFI →
          CHECKING → COMPLETE, with a final POST done.
        softap:
          ssid_prefix: "Rachio"
          ssid_examples: ["Rachio-XXXXXX"]
          credential_encryption:
            algorithm: "TLS with a pinned vendor root CA"
            notes: "Wi-Fi credentials travel as cleartext JSON fields (ssid, pass) inside the pinned-TLS POST body; no application-layer encryption like Gen 2."
        steps:
          - action: 'Join the controller''s setup Wi-Fi (SSID "Rachio-XXXXXX", XXXXXX = last 3 MAC bytes uppercase).'
            actor: "client"
          - action: "POST https://<deviceMac>/time with the current epoch (JSON, pinned CA, x-api-key header)."
            actor: "client"
          - action: "POST https://<deviceMac>/config with the home Wi-Fi ssid and pass as JSON."
            actor: "client"
          - action: "Poll https://<deviceMac>/conn until the device reports Wi-Fi then MQTT connected (state machine ending at FULLY_CONNECTED)."
            actor: "client"
          - action: "POST https://<deviceMac>/done to end provisioning."
            actor: "client"
            notes: "Derived from the decompiled app; not replayed on hardware. The pinned CA means third-party clients must extract or replace it to talk to the device."
      - type: "button_pairing"
        verified: false
        description: >
          HomeKit pairing using the 8-digit setup code generated and displayed
          in the Rachio app (Controller Settings → HomeKit; reportedly
          iOS-only), which provides cloud-free local control once paired.
        steps:
          - action: "Perform a HAP pair-setup against the advertised _hap._tcp service using the app-displayed setup code."
            actor: "client"
            notes: "Not implemented in this project; the most promising route to local control."
    factory_reset:
      confidence: "medium"
      effect: "Clears WiFi credentials, HomeKit pairings and schedules (vendor-documented procedure)."
      procedures:
        - name: "Stop Button held (Rachio 3)"
          hold_seconds: 10
          indicator: "Light bar fills yellow left-to-right during the hold, then flashes blue all across."
          steps:
            - action: "Press and hold the Stop Button (top of the circular button pad) until the light bar flashes blue all across."
              actor: "user"
        - name: "Unplug + hold Up-Arrow and Select (Gen 1 / Gen 2)"
          steps:
            - action: "Unplug the controller, hold Up-Arrow + Select, and re-power while holding."
              actor: "user"
              notes: "Vendor-documented procedure for Gen 1/Gen 2 units."
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: "Unverified. The onboarding flows are now documented from the decompiled app, but whether a configured unit accepts in-place re-provisioning without a reset is still unknown — assume reset-and-reprovision."
    credentials:
      # Gen 2 encrypts at the app layer (AES-CTR under Curve25519 ECDH); Gen 3
      # sends cleartext JSON inside pinned-CA TLS. Single enum value: "tls"
      # reflects the current Gen 3 flow; per-method detail is in the
      # softap credential_encryption blocks above.
      wifi_passphrase_protection: "tls"
      stored_on_device:
        - "WiFi credentials"
        - "HomeKit pairing keys"
      issued_to_client:
        - "HomeKit long-term public key pair, if HAP pairing is used"

evidence:
  live_lan_probe:
    date: "2026-07-16"
    address: "192.168.1.186"
    hostname: "WICED-hap-B68A9A.local"
    mdns_service_type: "_hap._tcp"
    model_txt: "Rachio-AABBCC"
    port: 80
    hap_id: "0A:01:0A:AA:BB:CC"

http_endpoints:
  - method: "GET"
    path: "/"
    name: "Device HTTP Root"
    description: "TCP port 80 was observed open. Control path is not yet documented as a complete local unauthenticated REST API."

entities:
  - platform: "switch"
    name: "Irrigation Zone"
    state_topic: "homekit://{hap_id}"
    commands:
      turn_on: "HAP characteristic write"
      turn_off: "HAP characteristic write"

