# HOTWIRED Heated Gear device spec
# Derived from static analysis of com.hotwired.mec v1.1 (build 8)
# Deep analysis completed 2026-07-28 — protocol fully decoded from decompiled code.
#
# SAFETY: This device controls resistive heating elements held against the body.
# Max level confirmed at 10 (0x0A). Never exceed or remove limits.
# The device has NO authentication at the BLE layer.

device:
  name: "HOTWIRED 12V Bluetooth Heated Gear"
  manufacturer: "Comoto Holdings, Inc. (HOTWIRED brand)"
  manufacturer_status: "unsupported"
  protocol: "ble"
  notes: >
    12V motorcycle heated gear (jacket liner, pant liner, gloves, heating pad).
    Each garment has an independent BLE module. Gloves are paired in the UI.
    Two hardware variants detected: BT-912/BT-712 (both use ffb0-UUID family,
    with fallback support for fee0-UUID family on older modules).
    Protocol uses AA/55 framed 8-byte commands with echo-based acknowledgment.
    No keep-alive heartbeat — write-with-retry pattern instead.
    MAX HEAT LEVEL: 10 (0x0A). DO NOT EXCEED.
    WARNING: No BLE security — any nearby device can control the heat.
    WARNING: Burn/fire/electrical risk — see target.md safety section.
  identification:
    service_uuids:
      - "0000ffb0-0000-1000-8000-00805f9b34fb"
    advertisement_names:
      - "BT-912"
      - "BT-712"

  setup:
    required: false
    confidence: medium
    notes: >
      Each garment is an independent BLE module with no provisioning of any
      kind: it advertises as BT-912 or BT-712 and accepts AA/55 framed commands
      from anything that connects. The "pairing" in the vendor app is a UI
      grouping — it associates the left and right glove modules in the app's own
      state so one slider drives both — and does not create a BLE bond or any
      binding on the hardware.

      SAFETY: because there is no bond, key or authentication, any device in
      range can set the heat level. Treat the absence of setup as a hazard to
      surface to the user, not as a convenience. Never send a level above 10
      (0x0A).
    methods:
      - type: ble_direct
        description: >
          Connect over GATT to a garment module and write 8-byte AA/55 framed
          commands, confirming each by the echoed acknowledgment rather than a
          heartbeat.
        verified: false
        ble:
          pairing_required: false
        steps:
          - action: "Connect the garment to 12V power so its module powers up and advertises."
            actor: user
          - action: >
              Scan for advertisement name BT-912 or BT-712, or for service
              0000ffb0; fall back to the fee0 service family for older modules.
            actor: client
          - action: "Connect over GATT — no bonding is offered or required."
            actor: client
          - action: >
              Write an 8-byte AA/55 framed command and wait for the echoed
              acknowledgment, retrying on no echo.
            actor: client
            expect: "The module echoes the command frame back."
          - action: >
              For gloves, repeat for the second module and associate the two in
              client state; the hardware has no concept of a pair.
            actor: client
    factory_reset:
      applicable: false
      confidence: high
      effect: >
        There is nothing to clear. The module holds no credential, no bond and
        no persisted configuration — heat level is commanded live and lost on
        power-down. Disconnecting the garment from 12V returns it to its
        power-on state, which is the only state it has.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        No network is joined and no bond is held, so a new client connects
        immediately once the previous one disconnects. This is also the failure
        mode: control is taken, not handed over.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        No credentials exist anywhere in this protocol. That is the security
        finding, not an omission — see the warnings in `device.notes`.

services:
  - uuid: "0000ffb0-0000-1000-8000-00805f9b34fb"
    name: "HOTWIRED Heated Gear Control Service"
    characteristics:
      - uuid: "0000ffb1-0000-1000-8000-00805f9b34fb"
        name: "Command Write"
        properties: ["write"]
        notes: >
          Primary write characteristic for BT-912/BT-712 modules.
          8-byte frames: AA <STATUS> <LEVEL> 00 00 00 00 55.
          STATUS: 00=OFF, 01=ON. LEVEL: 00-0A (0-10 decimal).
          Device echoes frame back on notify characteristic as ACK.
          Also check fallback: 0000fee2-0000-1000-8000-00805f9b34fb
          for older hardware revisions.
      - uuid: "0000ffb2-0000-1000-8000-00805f9b34fb"
        name: "Status Notify"
        properties: ["read", "notify"]
        notes: >
          Notifications provide two response types:
          Type 1 (AA prefix): Command echo acknowledgment.
          Type 2 (CC prefix): Status report with battery/temperature.
          CC format: CC <STATUS> <TEMPS> <BATTERY> <TEMP> <CONTROL>.
          Enable notifications via CCCD 00002902-0000-1000-8000-00805f9b34fb.
          Also check fallback: 0000fee1-0000-1000-8000-00805f9b34fb.

  # Fallback service for older hardware variant
  - uuid: "0000ffb0-0000-1000-8000-00805f9b34fb"
    name: "HOTWIRED Heated Gear Control Service (alt characteristics)"
    characteristics:
      - uuid: "0000fee2-0000-1000-8000-00805f9b34fb"
        name: "Command Write (fallback)"
        properties: ["write"]
        notes: >
          Alternate write characteristic for older hardware revision.
          Same frame format as ffb1.
      - uuid: "0000fee1-0000-1000-8000-00805f9b34fb"
        name: "Status Notify (fallback)"
        properties: ["read", "notify"]
        notes: >
          Alternate notify characteristic for older hardware revision.
          Same response format as ffb2.

commands:
  set_heat:
    description: "Set heat on/off and level"
    write_characteristic: "0000ffb1-0000-1000-8000-00805f9b34fb"
    fallback_characteristic: "0000fee2-0000-1000-8000-00805f9b34fb"
    frame:
      - byte: 0
        value: "0xAA"
        description: "Frame header"
      - byte: 1
        name: "status"
        values:
          - "0x00": "OFF"
          - "0x01": "ON"
        description: "Power state"
      - byte: 2
        name: "level"
        min: "0x00"
        max: "0x0A"
        description: "Heat level 0-10 (0=OFF/clamp, 10=max)"
      - bytes: "3-6"
        value: "0x00000000"
        description: "Reserved padding"
      - byte: 7
        value: "0x55"
        description: "Frame footer"
    examples:
      - name: "OFF"
        hex: "AA00000000000055"
      - name: "ON level 1"
        hex: "AA01010000000055"
      - name: "ON level 5"
        hex: "AA01050000000055"
      - name: "ON level 10 (max)"
        hex: "AA010A0000000055"
    ack:
      type: "echo"
      description: "Device echoes exact frame back on notify characteristic to acknowledge"
    retry:
      enabled: true
      timeout_ms: 3000
      description: "Retransmit after 3 seconds if no matching echo received"

notifications:
  characteristic: "0000ffb2-0000-1000-8000-00805f9b34fb"
  fallback_characteristic: "0000fee1-0000-1000-8000-00805f9b34fb"
  cccd: "00002902-0000-1000-8000-00805f9b34fb"
  types:
    - name: "command_echo"
      prefix: "AA"
      format: "AA <STATUS> <LEVEL> 00 00 00 00 55"
      description: "Exact echo of last write command — serves as acknowledgment"
    - name: "status_report"
      prefix: "CC"
      format: "CC <STATUS> <TEMPS> <BATTERY> <TEMP> <CONTROL>"
      description: "Unsolicited periodic status report"
      fields:
        - offset: "2-4"
          name: "status"
          description: "00=OFF, 01=ON"
        - offset: "4-6"
          name: "temps"
          description: "Current heat level (00-0A hex)"
        - offset: "6-8"
          name: "battery"
          description: >
            Battery status byte. Parsed as binary:
            bits 0-3: charging flag (0=absent, non-zero=present)
            bits 4-7: level 0-4 mapping to 0/25/50/75/100%
        - offset: "8-10"
          name: "temp"
          description: "Internal temperature (unused by stock app)"
        - offset: "10-12"
          name: "control"
          description: "Control state (unused by stock app)"

timing:
  connect_delay_ms: 500
  connect_timeout_ms: 10000
  write_retry_ms: 3000
  temp_change_debounce_ms: 500
  glove_sync_debounce_ms: 1000
  keep_alive: "none"
  notes: "No periodic heartbeat — device echoes writes for ACK, sends unsolicited CC status reports"

security:
  bonding: "none"
  pairing: "none"
  encryption: "none"
  authentication: "none"
  notes: >
    Device uses connectGatt(autoConnect=false) with no bonding.
    Frames are plaintext — no encryption, no challenge-response.
    Cloud auth (mid/token headers) is for app features only, NOT BLE.

hardware_variants:
  - name: "BT-912"
    uuid_family: "ffb0"
    progress_color: "blue"
    notes: "Primary variant — blue UI progress bar"
  - name: "BT-712"
    uuid_family: "ffb0"
    progress_color: "blue"
    notes: "Secondary variant — same UUIDs, blue progress bar"
  - name: "Unknown (fallback)"
    uuid_family: "fee0"
    progress_color: "yellow"
    notes: "Older revision using fee1/fee2 characteristics — yellow progress bar"

product_types:
  - id: "jacket"
    resource: "R.string.top"
    description: "Jacket liner — single zone control"
  - id: "pants"
    resource: "R.string.bottom"
    description: "Pant liner — single zone control"
  - id: "heating_pad"
    resource: "R.string.heat_pad"
    description: "Heating pad — single zone control"
  - id: "gloves"
    resource: "R.string.left / R.string.right"
    description: "Gloves — paired zone, always synced together"

safety:
  max_level: 10
  max_level_hex: "0x0A"
  require_user_confirmation: true
  link_loss_behavior: "device_controlled"
  notes: >
    The device firmware controls link-loss behavior — the app does not implement
    a keep-alive. A replacement client MUST implement its own fail-safe:
    - Loss of BLE link → command OFF or bounded timeout
    - Never auto-apply last level on reconnect without explicit user confirmation
    - "Off" must be reachable in one tap
    - Current commanded level must be displayed unambiguously at all times

entities:
  - platform: "climate"
    name: "Heat Level"
    write_characteristic: "0000ffb1-0000-1000-8000-00805f9b34fb"
    fallback_characteristic: "0000fee2-0000-1000-8000-00805f9b34fb"
    state_characteristic: "0000ffb2-0000-1000-8000-00805f9b34fb"
    fallback_state_characteristic: "0000fee1-0000-1000-8000-00805f9b34fb"
    min_temp: 0
    max_temp: 10
    temp_step: 1
    precision: 1.0

  - platform: "sensor"
    name: "Battery Level"
    state_characteristic: "0000ffb2-0000-1000-8000-00805f9b34fb"
    value_template: "{{ value[3:4] | int(base=16) | binary }}"
    unit: "%"
    mapping:
      - 0: 0
      - 1: 25
      - 2: 50
      - 3: 75
      - 4: 100

  - platform: "sensor"
    name: "Internal Temperature"
    state_characteristic: "0000ffb2-0000-1000-8000-00805f9b34fb"
    value_template: "{{ value[4:5] | int(base=16) }}"
    unit: "°C"
    notes: "Scale and offset unconfirmed — requires bench testing"
