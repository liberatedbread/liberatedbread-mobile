protocol_details:
  authentication:
    summary: >-
      A per-connection challenge-response on service
      64ac0000-4a4b-4b58-9f37-94d3c52ffdf7, run after the link is encrypted.
      AES-128 in ECB mode with no padding, over single 16-byte blocks. The
      mode and padding are written into the vendor app's cipher setup, so
      this is not a guess from the code's shape. It has still not been
      captured on the air, so it stays `reported`.
    keyed_algorithm:
      - "1. app_challenge = 8 random bytes || 8 zero bytes. Write it to 64ac0002."
      - "2. c = read 64ac0003 (16 bytes). The device computes it as AES-128-ECB-encrypt(K, app_challenge[0:8] || device_nonce[0:8]). The layout is from kvantetore/igrill, which checks the first half. The vendor app does not check it."
      - "3. p = AES-128-ECB-decrypt(K, c)."
      - "4. response = AES-128-ECB-encrypt(K, 8 zero bytes || p[8:16]). Write it to 64ac0004."
      - "5. The vendor app allows 30 s for steps 1-4. On failure it removes the OS bond, reconnects and bonds again."
    key_free_variant: >-
      Write 16 zero bytes as the challenge. Then p[0:8] is already zero, so
      step 4's plaintext equals step 3's and the response is c itself: read
      64ac0003 and write the same 16 bytes to 64ac0004. No key is needed.
      kins-dev/igrill-smoker worked this out, and bendikwa/igrill (release
      2.0, which dropped its crypto dependency), esphome-igrill and
      esp32_iGrill all use it on hardware across the family. The
      missing-devices survey asks for the keyed handshake to be confirmed on
      hardware as well, not only this shortcut. See remaining_unknowns.
    key_handling: >-
      K is a 16-byte constant per model family: the vendor app holds six
      distinct keys for its nine models. They are not reproduced here, in
      the docs or in any test. A replacement client does not need one. An
      owner who wants the keyed form can find how the community's first
      client obtained keys in kvantetore/igrill. The key is a shared
      product secret, not a per-unit credential, and publishing it would
      add nothing the key-free form does not already give.
    test_vectors:
      key_note: >-
        ILLUSTRATIVE KEY ONLY: 000102030405060708090a0b0c0d0e0f is the
        FIPS-197 example key, not a device key. These vectors check an
        implementation of the arithmetic above, not interoperability with a
        real unit.
      key_hex: "000102030405060708090a0b0c0d0e0f"
      vectors:
        - name: "keyed form"
          app_challenge_hex: "a1a2a3a4a5a6a7a80000000000000000"
          device_plaintext_hex: "a1a2a3a4a5a6a7a8b1b2b3b4b5b6b7b8"
          device_challenge_hex: "e5d0713e710ddab7e8ff5afcdc97a0b4"
          response_hex: "39fac7fbed092b862656a0f692afb3a2"
        - name: "key-free form (zero challenge, same device nonce)"
          app_challenge_hex: "00000000000000000000000000000000"
          device_plaintext_hex: "0000000000000000b1b2b3b4b5b6b7b8"
          device_challenge_hex: "39fac7fbed092b862656a0f692afb3a2"
          response_hex: "39fac7fbed092b862656a0f692afb3a2"
      check: "openssl enc -aes-128-ecb -nopad -K 000102030405060708090a0b0c0d0e0f reproduces each device_challenge_hex from device_plaintext_hex. The response for a given nonce is the same in both vectors, and in the key-free vector it equals the challenge."
  model_identification:
    advertised_name_prefixes:
      notes: >-
        The vendor app lowercases the advertised local name and tests these
        prefixes, longest first. The mini v2's "igrill_mini02" is special-
        cased ahead of the list because "igrill_mini" would otherwise swallow
        it. A name that matches none is not offered to the user. These are
        the on-air name prefixes the app accepts. The exact casing and suffix
        a unit sends is on record only for "iGrill_mini".
      igrill_mini: "igrill_mini"
      igrill_mini_v2: "igrill_mini02 (checked first) or igrill_mini_2"
      igrill_2: "igrill_v2"
      igrill_2_v2_2: "igrill_v2_2"
      igrill_3: "igrill_v3"
      kitchen_thermometer: "kt"
      kitchen_thermometer_mini: "kt_mini"
      pulse_1000: "pulse 1000"
      pulse_2000: "pulse 2000"
    service_uuid_mapping:
      notes: >-
        Two sources, and they disagree for the mini and the iGrill 2. The
        community mapping comes from clients that detect the model by these
        services on hardware. The app's model table carries UUID constants
        its own code never reads (it identifies models by name), so where the
        two disagree the community mapping is used in `variants`. One
        reading that reconciles them: the app's "mini" and "iGrill 2" entries
        describe the later hardware revisions (9d610c43..., ada7590f...),
        and the original iDevices-era revisions (63c70000..., a5c50000...)
        simply have no constant left in the app.
      community:
        "63c70000-4a82-4261-95ff-92cf32477861": "iGrill mini (esphome-igrill, esp32_iGrill)"
        "9d610c43-ae1d-41a9-9b09-3c7ecd5c6035": "iGrill mini v2 (esphome-igrill, esp32_iGrill)"
        "a5c50000-f186-4bd6-97f2-7ebacba0d708": "iGrill 2 (esphome-igrill, esp32_iGrill)"
        "ada7590f-2e6d-469e-8f7b-1822b386a5e9": "iGrill 2 v202 (esphome-igrill, esp32_iGrill)"
        "6e910000-58dc-41c7-943f-518b278cea88": "iGrill 3 (esphome-igrill, esp32_iGrill)"
        "19450000-9b05-40bb-80d8-7c85840aec34": "iDevices Kitchen Thermometer (esphome-igrill)"
        "7e920000-68dc-41c7-943f-518b278cea87": "Pulse 1000 (esphome-igrill)"
        "7e920000-68dc-41c7-943f-518b278cea88": "Pulse 2000 (esphome-igrill)"
      vendor_app_model_table:
        "9d610c43-ae1d-41a9-9b09-3c7ecd5c6035": "iGrill mini"
        "ada7590f-2e6d-469e-8f7b-1822b386a5e9": "iGrill 2"
        "6e910000-58dc-41c7-943f-518b278cea88": "iGrill 3 (with the propane service f5d40000-3548-4c22-9947-f3673fce3cd9)"
        "19450000-9b05-40bb-80d8-7c85840aec34": "Kitchen Thermometer"
        "38e70000-43bf-4afa-8170-e45548b5205b": "Kitchen Thermometer Mini"
        "6c910000-58dc-41c7-943f-518b278ceaaa": "Pulse 1000 and Pulse 2000 (the controller service, not the thermometer service)"
        no_constant: "iGrill mini v2 and iGrill 2 v2.2 carry no service UUID in the app."
    display_name: >-
      The app labels a unit with the model's display name, a hyphen, and the
      last two octets of its MAC without the colon: iGrill Mini-XXXX,
      iGrill²-XXXX. The vendor screenshots show these labels, and they were
      earlier mistaken for advertised names.
  configuration:
    layout: "06ef0001: byte 0 unit (0 = F, 1 = C); byte 1 unknown; byte 2 alarm acknowledged (0/1); bytes 3-4 unknown."
    app_behaviour:
      - "On connect: read the block, take the unit from byte 0, then write the block back with byte 2 = 0 (the app logs this as resetting the acknowledgement)."
      - "When the user dismisses an alarm on the app's alarm screen, the app writes the stored block back with byte 2 = 1."
      - "When the user changes the unit, the app writes the stored block back with byte 0 = the new unit. It then converts each probe's high and low thresholds (F = C x 9/5 + 32 and back, skipping -2000) and rewrites every alarm characteristic."
    note: >-
      Acknowledging an alarm is a read-modify-write of bytes the spec cannot
      name (1, 3 and 4), so it is not declared as a command. A client that
      wants it should read 06ef0001, set byte 2 to 1 and write all 5 bytes
      back.
  alarm_semantics:
    peak: "High side set, low side -2000. The manuals: sounds when the probe reaches the target. On the mini models the LED goes green, then yellow at 15 F (9 C) away, orange at 5 F (3 C) away, blinking red at the target, and solid red once acknowledged."
    range: "Both sides set. Sounds when the probe leaves the band. The app uses it for grill or ambient temperature."
    disabled: "-2000 on a side (raw 30 f8)."
    unit: "Whole degrees in the configured unit. The device does not convert stored thresholds when the unit changes."
  knob_lights:
    scope: "iGrill 3 wired to a Genesis II LX grill's control-knob lights (iGrill 3 manual: the app turns the knob lights on and off, as does the grill's own button)."
    characteristics:
      eaef0001-3909-454c-9d7e-e68cba24a9b8: >-
        The app writes the single byte 0x01 when the user taps the light
        switch in its device settings, which it shows only for the iGrill 3.
        It is always 0x01, so it behaves like a button press or toggle. It is
        not written on connect, although earlier notes said so.
      eaef0002-3909-454c-9d7e-e68cba24a9b8: "Read on connect. One byte that the app logs as the LED knob light configuration. Values not established."
    not_declared_because: "The containing service UUID is not recorded (the app addresses both characteristics by characteristic UUID alone), so no service entry, command or entity is declared for them."
  pulse_controller_service:
    status: "OUT OF SCOPE. It heats, so it is safety-sensitive, and no control of it is documented here."
    service: "6c910000-58dc-41c7-943f-518b278ceaaa"
    roles_only: >-
      Per the vendor app: a notify characteristic whose value the app
      divides by 100 and shows as a temperature. A one-byte controller
      display-unit write, with the OPPOSITE encoding to 06ef0001 (0 = C,
      1 = F), which the app sends alongside every unit change. A one-byte
      controller firmware-version read. A buzzer-status notify. The
      controller firmware-update packet write and its status notify.
      esphome-igrill additionally reads 6c91000a-58dc-41c7-943f-518b278ceaaa
      as ASCII three-digit fields for the two heating elements' actual and
      set temperatures, read-only. No write to this service is described,
      and none should be attempted from a client built on this spec.
  firmware_update:
    summary: >-
      Role level only, by design. The app fetches images from a vendor
      object store: Intel HEX for the BLE radio module, and raw Cortex-M
      binaries for the Pulse controller. It then delivers them over BLE on
      one of three paths (features[firmware_update].dfu.notes). No
      update-begin payload, block or record layout, address offset, image
      name or digest is published, because a wrong one can leave a
      thermometer unusable and the vendor's images are not ours to
      redistribute.
  source_conflicts:
    ui_summary_encryption_and_resolution: "The screenshot summary said 'no encryption' and '0.1 degree units'. The app's code shows an AES handshake and whole degrees, and every community client divides by nothing. The summary was wrong."
    brief_advertised_names: "iGrill2-XXXX and similar are app display names built from the MAC, not advertised names (model_identification.display_name)."
    eaef0001_on_connect: "Earlier notes said 0x01 is written to eaef0001 on connect. In the app it is a user action on the iGrill 3 only (knob_lights)."
    ambient_alarm_role: "06ef000b was listed as role unknown. The app parses and writes it as the ambient sensor's alarm pair."
    config_uuid_in_community_code: "bendikwa/igrill and kins-dev/igrill-smoker define a CONFIG constant equal to 06ef0002, probe 1's UUID. They never use it. The configuration characteristic is 06ef0001 (vendor app, esp32_iGrill, esphome-igrill)."
    unsigned_reads: "bendikwa/igrill and esphome-igrill read the temperature as unsigned 16-bit, so the no-probe value shows as 63536 and a sub-zero reading wraps. The app and kins-dev/igrill-smoker read it signed."
    vendor_status: "Research notes: discontinued. Play listing: updated 2025-10-16. Weber's PSTI statement: security support ended 2021. All three are recorded in device.notes."

evidence:
  app_static_analysis: >-
    Weber iGrill 5.8.1 for Android, decompiled. The app is obfuscated, but
    its BLE log strings name every characteristic role. It established: the
    model table (nine models, probe counts, name prefixes, service UUID
    constants), the bond-then-connect-then-authenticate flow and its 30 s
    timeouts, the handshake's arithmetic and its AES/ECB/NoPadding cipher
    setup, the probe parser (int16 LE, whole degrees, byte 2 bit 7 unit,
    below -500 absent), the alarm pair layout and the -2000 sentinel, the
    configuration block's unit and acknowledgement bytes and the app's
    read-modify-write of it, the ambient alarm on 06ef000b, the propane
    parser and fault bit, the knob-light characteristics, the Pulse
    controller characteristics' roles, the three update paths (role only),
    and the display-name rule. Nothing from it is reproduced beyond UUIDs
    and byte layouts. The per-model keys it contains are deliberately left
    out.
  open_source_review: >-
    kvantetore/igrill (the original keyed client; confirms the device
    plaintext layout). kins-dev/igrill-smoker @ 5dc78b5f (the key-free
    handshake, signed reads, threshold writes as two int16 LE). bendikwa/igrill
    @ e42dba40 (key-free handshake, bonding advice). bendikwa/esphome-igrill @
    b5edba3c (model detection by service UUID, encryption before
    authentication, threshold read and write, propane, Pulse element read,
    hardware-confirmed model list). 1mckenna/esp32_iGrill @ 45c5f1d3
    (advertised-service matching, just-works bond parameters, single-byte
    unit write, propane, credited hardware testers).
  documentation_review: >-
    Weber-hosted manuals: iGrill Mini (2016), iGrill 2 (2016), iGrill 3
    (2016), Pulse 2000 (US 2022) and Pulse 1000/2000 (GB 2018). The iDevices
    Kitchen Thermometer and Kitchen Thermometer mini manuals, via the
    Internet Archive. Weber's 2024 UK PSTI statement for iGrill products.
    They gave the pairing indicators, reset procedures, auto-shut-off
    timings, peak and range alarm behaviour, fuel gauge and knob lights, and
    the security support end dates. No manual prints an FCC ID.
  capture_review: "None. Our research store holds no capture of any model in this family."
  open_questions: >-
    See remaining_unknowns. What to settle first with a unit in hand: the
    exact advertised names per model, whether a 1-byte write to 06ef0001
    keeps bytes 1-4, and one HCI capture of the vendor app's keyed handshake
    and an alarm acknowledgement.
  artifacts:
    - type: "static_analysis"
      artifact: "com.weber.igrill 5.8.1 (versionCode 508010000), XAPK"
      obtained_via: "third-party APK mirror, 2026-09-01"
      description: "The vendor app. Source of every byte layout marked reported here. Its embedded model keys are not reproduced."
    - type: "public_implementation"
      artifact: "bendikwa/esphome-igrill @ b5edba3c87d16ff96d4aa2ee90a20a1921fb80ce"
      url: "https://github.com/bendikwa/esphome-igrill"
      obtained_via: "git clone, 2026-09-28"
      description: "ESPHome component: per-model service UUIDs, key-free handshake after forcing encryption, threshold read/write verified against an HCI capture on an iGrill 2, propane, Pulse element read, and the confirmed-model list."
    - type: "public_implementation"
      artifact: "1mckenna/esp32_iGrill @ 45c5f1d30e8b781f1c99640cf8088f95f5ed1719"
      url: "https://github.com/1mckenna/esp32_iGrill"
      obtained_via: "git clone, 2026-09-28"
      description: "Arduino ESP32 client: advertised service matching, just-works bonding setup, key-free handshake, single-byte unit write, propane, and credits for hardware testers on the mini, mini v2, v202 and iGrill 3."
    - type: "public_implementation"
      artifact: "bendikwa/igrill @ e42dba408bc59a2f4ee36546ee92e9e7135ba8d6"
      url: "https://github.com/bendikwa/igrill"
      obtained_via: "git clone, 2026-09-28"
      description: "Python/bluepy MQTT bridge, deprecated in favour of esphome-igrill. Key-free handshake since release 2.0, and bonding advice."
    - type: "public_implementation"
      artifact: "kins-dev/igrill-smoker @ 5dc78b5f2ce323c9aa2145e2b74d1e49c60d20c4"
      url: "https://github.com/kins-dev/igrill-smoker"
      obtained_via: "git clone, 2026-09-28"
      description: "Where the key-free handshake is explained. Signed int16 reads and two-int16 threshold writes."
    - type: "public_implementation"
      artifact: "kvantetore/igrill (master, igrill.py read 2026-09-28)"
      url: "https://github.com/kvantetore/igrill"
      obtained_via: "raw file fetch, 2026-09-28"
      description: "The original keyed client. It checks the decrypted first half of the device challenge against its own challenge, which is where the plaintext layout comes from."
    - type: "vendor_documentation"
      artifact: "Weber iGrill Mini, iGrill 2 and iGrill 3 user manuals (2016); Pulse 2000 owner's guide (US 2022); Pulse 1000/2000 owner's guide (GB 2018)"
      url: "https://digital-assets.weber.com/documents/59365.pdf?fm=pdf"
      obtained_via: "Weber digital-assets host, 2026-09-28"
      description: "Pairing, reset, auto-off, alarm behaviour, fuel gauge and knob lights. The URL is the iGrill 2 manual. The others are listed in helpful_urls."
    - type: "vendor_documentation"
      artifact: "Weber UK PSTI Statement of Compliance, iGrill Wireless Thermometers (2024)"
      url: "https://digital-assets.weber.com/documents/18492_8653986_042524.pdf?fm=pdf"
      obtained_via: "Weber digital-assets host, 2026-09-28"
      description: "Launch dates and security-update end dates (2021) for the iGrill Mini, 2 and 3 and the Pulse 1000 and 2000."
    - type: "firmware_image"
      artifact: "Vendor OTA images for the BLE radio module and the Pulse controller (not named here)"
      obtained_via: "vendor object store, 2026-09-01"
      description: "Examined only to identify the image formats (Intel HEX with 8051-core addressing; raw Cortex-M binaries). Nothing from them is reproduced."

remaining_unknowns:
  - "The exact advertised local name of every model (casing, separator, any suffix). Only 'iGrill_mini' is on record verbatim. The app matches lowercase prefixes (protocol_details.model_identification)."
  - "Which service UUID each hardware revision really carries. The community and the app's dead constants disagree for the mini / mini v2 and the iGrill 2 / v2.2 (protocol_details.model_identification.service_uuid_mapping)."
  - "Whether the Kitchen Thermometer Mini's 38e70000-43bf-4afa-8170-e45548b5205b holds the 06ef characteristic set. It comes from the app only."
  - "Whether the Kitchen Thermometers and Pulse grills advertise their model service UUID, or show it only after connecting."
  - "The keyed handshake has never been captured on the air, and neither has the key-free one. The cipher mode (AES-128-ECB, no padding) comes from the app's code, and the device's plaintext layout from kvantetore/igrill."
  - "Whether the device rejects an unencrypted link with an ATT error or just stays silent, and whether it keeps more than one bond."
  - "Whether a 1-byte write to 06ef0001 (esp32_iGrill's unit write) leaves config bytes 1-4 intact, and what bytes 1, 3 and 4 mean."
  - "Whether the device enforces thresholds on its own with no phone connected. The manuals and esphome-igrill say the unit alarms itself, but the ambient alarm and the Pulse have not been seen doing so."
  - "Which models serve the ambient pair 06ef000a/06ef000b, and what 'ambient' measures on each (grill air, or the Pulse cook-box sensor?)."
  - "The service UUID holding the knob-light characteristics eaef0001/eaef0002, and the meaning of their values."
  - "The service UUID holding the update data characteristic 00060001-f8ce-11e4-abf4-0002a5d5c51b, whether an update reboots the radio into a loader, how a unit advertises mid-update, and whether images are signed. Intentionally unpublished: the update-begin layout."
  - "Whether the Pulse grills serve the battery service."
  - "The original iGrill Classic (dropped from the app) is not covered, and may speak something else entirely. The research notes describe it as a Bluetooth Classic predecessor."
  - "Whether resetting a unit also clears its unit setting and stored thresholds."
  - "No FCC grant has been found for any model (fccid.co holds none under iDevices 2ABDJ or Weber-Stephen 2AHSR), and no manual prints an FCC ID."

