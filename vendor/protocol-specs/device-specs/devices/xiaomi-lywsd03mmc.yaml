  - url: "https://www.home-assistant.io/integrations/xiaomi_ble/"
    title: "Home Assistant Xiaomi BLE integration"
    description: "HA core integration passively decoding LYWSD03MMC advertisements (bindkey for stock firmware; plaintext with ATC custom firmware)."
  - title: "Mi LYWSD03MMC user manual"
    url: "https://www.manualslib.com/manual/2150730/Mi-Lywsd03mmc.html"
    kind: "manual"
    description: >
      Vendor manual for the stock thermometer — the firmware this spec recommends replacing.

remaining_unknowns:
  - "Whether the pvvx Telink Flasher can set a new bindkey on a stock 2.1.1_0159 / new-B1.6 unit without Mi Home registration first; issue #602 says that firmware's first OTA needs Mi Home registration and IDs, and the bindkey-only route was not tested."
  - "Whether a decoding client's bindkey has to be re-entered after the sensor is removed from and re-added to Mi Home following a flasher activation (Home Assistant's documentation implies the Mi Home re-add; the key consequence was not tested)."
  - "Which models the atc1441 alternative flasher can re-key; the Home Assistant documentation calls the set broader than the pvvx five but does not list it."
  - "What the 'signed' list in the flasher's firmware.json (the 2.1.1_0159c original image) means — whose signature, and whether new-B1.6 stock firmware refuses an image without it."
  - "Whether release 5.9 changes any default (advertising format, interval) relative to the hardware-tested 5.8."

