# Xiaomi Mijia LYWSD03MMC BLE Thermometer/Hygrometer
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Xiaomi Mijia LYWSD03MMC Thermometer/Hygrometer"
  manufacturer: "Xiaomi"
  manufacturer_status: "active"
  testing:
    status: verified
    detail: minimally-verified
    notes: >-
      One unit running the pvvx ATC custom firmware v5.8 was scanned and
      connected on 2026-08-22 (Linux/BlueZ, bleak). What was exercised: the
      BTHome v2 advertisement under service data 0xFCD2 (decoded battery
      92 %, 23.81 degrees C, 59.93 % RH) and the connected GATT table
      (Device Information reporting manufacturer miaomiaoce.com, model
      LYWSD03MMC, firmware github.com/pvvx; environmental service 0x181A
      with 2a1f/2a6e/2a6f, whose reads matched the advertised values).
      That is the whole of it — the payload_formats for stock firmware,
      the atc1441 and pvvx-custom advertisement layouts, the comfort/
      config writes and the history buffer were NOT exercised, and the
      other firmware variants in device.variants were not on hand.
  protocol: "ble"
  category: "sensor"
  category_hierarchy: ["measurement", "temperature"]
  notes: >
    Compact BLE thermometer and hygrometer with E-ink display. Telink
    TLSR8251 SoC, CR2032 battery, 6-12 month battery life. $4-6.
    6 hardware versions: B1.4, B1.5, B1.6, B1.7, B1.9, B2.0.

    STOCK FIRMWARE: broadcasts Xiaomi MiBeacon format (service UUID 0xFE95)
    with encrypted payload, decryptable only with the unit's bindkey. Two
    routes to that key: extract the one Mi Home's cloud issued, or set a
    NEW one with the pvvx Telink Flasher's activation, keeping the stock
    firmware. Home Assistant's Xiaomi BLE documentation names exactly five
    models for the pvvx route (LYWSD03MMC, MJWSD05MMC, MHO-C401, CGG1,
    CGDK2) and the atc1441 flasher as an alternative for an unstated wider
    set. After a flasher activation Mi Home no longer recognises the
    sensor; to use Mi Home again, remove and re-add it there. Key length
    follows the MiBeacon version: v2/v3 take a 12-byte key (24 hex
    characters), v4/v5 a 16-byte key (32 hex characters) with
    authenticated encryption — a key of the wrong length for the beacon
    version is the usual import mistake. REPORTED from that documentation;
    no activation or key write was performed by this project.

    CUSTOM FIRMWARE (recommended for local control): the pvvx/ATC_MiThermometer
    project provides OTA-flashable firmware (via web browser at
    https://pvvx.github.io/ATC_MiThermometer/TelinkMiFlasher.html) that:
      - Broadcasts unencrypted temperature/humidity/battery
      - Supports 4 advertisement formats: ATC, Xiaomi, Custom, BTHome v2
      - Has configurable advertising interval and TX power
      - Provides GATT connection mode for configuration
      - Supports encrypted beacons with PIN-code or bindkey
      - Exposes standard Device Information (0x180A) and Battery (0x180F) services
      - Supports BLE 5.0+ LE Long Range (Coded PHY S=8)

    UNENCRYPTED ATC (atc1441) ADVERTISEMENT FORMAT — Service Data UUID 0x181A:
      bytes 0-5: MAC (big-endian)
      bytes 6-7: temperature int16 BE, ×0.1 °C
      byte 8: humidity %
      byte 9: battery %
      bytes 10-11: battery mV (uint16 BE)
      byte 12: advertisement counter

    UNENCRYPTED PVVX CUSTOM ADVERTISEMENT FORMAT — same 0x181A UUID, 13-14 B:
      bytes 0-5: MAC
      bytes 6-7: temperature int16 LE, ×0.01 °C
      bytes 8-9: humidity uint16 LE, ×0.01 %
      bytes 10-11: battery mV (uint16)
      byte 12: battery %
      byte 13: advertisement counter
      byte 14: trigger/status flags
    (custom_beacon.h adv_atc1441_t / adv_custom_t)

    ENCRYPTED ATC/Custom BEACONS: AES-CCM with bindkey (16 bytes), nonce =
    MAC (6 bytes) + header (5 bytes), auth data = 0x11, MAC len = 4. The
    5-byte header is the advertisement's own AD-structure head: length,
    AD type 0x16 (Service Data), UUID16 0x181A as its little-endian bytes
    1a 18, then the frame counter (pvvx/ATC_MiThermometer; reported). The decrypted plaintexts are the
    compact 3-byte (temp=(v/2)-40 °C, hum=v/2 %, battery bits 6-0 + trigger
    bit 7) and 6-byte (temp int16 LE 0.01 °C, humi uint16 LE 0.01 %, battery
    %, flags) layouts in payload_formats below — those two layouts do NOT
    appear on the air unencrypted.

    GATT CONNECTION (custom firmware): device advertises as "ATC_XXXXXX"
    (where XXXXXX are last 3 bytes of MAC). Standard services:
      0x180A — Device Information (manufacturer, model, firmware version)
      0x180F — Battery Service (battery level)
    Configuration is done via proprietary characteristics on the ATC service.
    Set defaults command: write 0x56, disable Long Range: write 0xDD.

    ALSO SUPPORTS: MHO-C401/C401N, MJWSD05MMC, Qingping CGG1-M/CGDK2,
    Tuya TH03/ZTH01/02/05 — all with same custom firmware and Telink SoC.

    CURRENT STATUS (verified 2026-07-31): custom firmware v5.8 defaults to
    the BTHome v2 advertisement format. The same hardware converts to Zigbee
    via pvvx/ZigbeeTLc (Z03MMC). Units sold since 2025-03 with PCB marks
    B1.5*/B1.6* use SPI LCD controllers and cheaper clone sensors, drawing
    more current with a low-contrast display — pvvx currently advises
    against buying LYWSD03MMC (ATC_MiThermometer issue #664). Those boards
    are still supported by the custom firmware (under the internal number
    B1.1, to tell them from the older B1.6), but new B1.6 units ship an
    original firmware (2.1.1_0159) that is incompatible with every older
    hardware version, and their first OTA needs Mi Home registration
    (issue #602). Upstream counts only B1.4, B1.7, B1.9 and B2.0 as normal
    hardware.

    LATEST RELEASE (checked 2026-11-11): pvvx release 5.9 (firmware.json at
    commit b02b5137, 2026-11-02), which fixes an error in the initial OTA
    download at address 0x40000. The hardware-tested unit ran 5.8; whether
    5.9 changes any default was not checked.

    STOCK FIRMWARE DISCOVERY: name "LYWSD03MMC", service UUID 0xFE95
    (MiBeacon), random address (custom firmware uses the public address;
    pvvx, reported). Data is encrypted; decryption requires the bindkey —
    the Mi Home-issued one, or one set by Telink Flasher activation.

    MI HOME APP EVIDENCE (static-analysis audit, 2026-08): the app contains
    NO device-specific code for this model — Mi Home device plugins are
    downloaded from Xiaomi's cloud at pairing time, and "LYWSD03MMC" is
    entirely absent from the app (code and bundled assets alike),
    so the app can only corroborate generic Xiaomi mechanisms, nothing
    model-specific. What it does confirm:
      - MiBeacon service UUID 0xFE95 and the frame-control layout: bytes
        0-1 are a little-endian frame-control field (bit 3 = payload
        encrypted, plus capability/MAC/event/binding flag bits) and the
        version sits in the high nibble of byte 1
        (from its MiBeacon service-data parser).
      - During provisioning the app pushes the cloud-issued bindkey to
        the device via a miio RPC with method "set_bind_key" (params
        carry bind_key plus Wi-Fi credentials)
        (from its provisioning bind-key step).
      - The bundled device catalog (assets/device_config/plugin_config_us-en)
        lists MiOT model "miaomiaoce.sensor_ht.t2" (pd_id 1371, "Mi
        Temperature and Humidity Monitor 2" — this device's retail name),
        its Mi Home/MiOT identity; no plugin or logic for it ships in the
        app itself.
    CONFIDENCE for the app-evidence block: MEDIUM — app-derived, not
    verified on hardware.

    CONFIDENCE: HIGH for custom firmware advertisement formats,
    service UUIDs, and GATT services — sourced from
    github.com/pvvx/ATC_MiThermometer and confirmed by Home Assistant
    Passive BLE Monitor, BTHome, and other integrations. Stock firmware
    MiBeacon format documented by Xiaomi but encrypted payload requires
    a bindkey (cloud-issued, or set by the Telink Flasher). Firmware is
    OTA-flashable and reversible, provided the original image matches the
    hardware generation (see features.firmware_update).

  identification:
    local_name_prefix: "ATC"
    service_uuids:
      - "0000181a-0000-1000-8000-00805f9b34fb"
      # BTHome v2 advertisement format (pvvx firmware default since v5.8):
      # the ADV carries service data under 0xFCD2, and 0x181A only shows up
      # in the connected GATT table (hardware-verified 2026-08-22 on v5.8:
      # GATT table = 181a with 2a1f/2a6e/2a6f). A scanner that matches on
      # advertised service UUIDs therefore needs BOTH. The advertisement
      # layout itself is payload_formats.BTHome_v2 below.
      - "0000fcd2-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "ATC"
          service_uuids:
            - "0000181a-0000-1000-8000-00805f9b34fb"
            - "0000fcd2-0000-1000-8000-00805f9b34fb"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: true
    confidence: "high"
    notes: >
      STOCK FIRMWARE needs a bindkey: either the one Mi Home's cloud issues
      at pairing (extracted afterwards), or a new one set by the pvvx
      Telink Flasher's activation, which Home Assistant documents as an
      alternative to cloud extraction. It leaves Mi Home unable to
      recognise the sensor until it is removed and re-added there, and it
      is not evidence that every hardware revision is account-free: the
      2.1.1_0159 units need Mi Home registration before their first OTA
      (below). CUSTOM FIRMWARE eliminates
      the key entirely — flash via web browser OTA from
      https://pvvx.github.io/ATC_MiThermometer/TelinkMiFlasher.html
      (Chrome/Edge/Opera with Experimental Web Platform features enabled).
      Firmware change is reversible (original firmware images available),
      but only with the original image for the unit's hardware generation:
      1.0.0_0130 covers the older B1.4-B2.0 boards, and new B1.6 units use
      the 2.1.1_0159 line, which is incompatible with older hardware. Let
      the flasher's hardware detection choose, not a filename. The first
      flash from stock firmware always goes through TelinkMiFlasher's
      activation; later updates of a unit already on custom firmware can
      use any Telink OTA client. After flashing, device advertises as
      "ATC_XXXXXX" with unencrypted data.

      Battery must be >40% for reliable OTA flashing on LYWSD03MMC.

      LOCKDOWN CAVEAT: devices shipping stock firmware 2.1.1_0159 require Mi
      Home registration plus an extracted Mi token/bindkey (e.g. via
      Xiaomi-cloud-tokens-extractor) before the TelinkMiFlasher OTA works —
      the unauthenticated stock OTA was closed by Xiaomi, so the cloud-free
      flashing path no longer holds for recent stock (ATC_MiThermometer
      issue #602).
    methods:
      - type: "ble_provisioning"
        name: "Flash custom firmware over Web Bluetooth"
        role: "primary"
        verified: false
        description: >
          Flash custom firmware via web browser OTA to enable direct
          unencrypted BLE advertisement of temperature, humidity, and
          battery without Xiaomi cloud dependency.
        ble:
          pairing_required: false
        steps:
          - action: "Visit TelinkMiFlasher.html in Chrome/Edge/Opera."
            actor: "client"
          - action: "Click 'Connect' and select LYWSD03MMC from the browser BLE chooser."
            actor: "client"
          - action: "Click 'Do Activation' to run the activation and decryption-key step; the first flash from stock firmware cannot skip it."
            actor: "client"
          - action: "Click 'Custom Firmware' and then 'Start Flashing'."
            actor: "client"
            expect: "Device reboots and advertises as ATC_XXXXXX. A transfer takes about four minutes; if it is interrupted the device keeps its old firmware (upstream README)."
      - type: "ble_provisioning"
        name: "Keep stock firmware, set your own bindkey with the Telink Flasher"
        role: "alternative"
        verified: false
        description: >
          Keep the stock MiBeacon firmware but replace its bindkey with a new
          one from the pvvx Telink Flasher's activation, instead of
          extracting the Mi Home-issued key. Home Assistant's Xiaomi BLE
          documentation names this route for LYWSD03MMC, MJWSD05MMC,
          MHO-C401, CGG1 and CGDK2, and the atc1441 flasher as an
          alternative for an unstated wider set (which does not extend the
          explicit five-model list). Reported from that
          documentation; not exercised by this project, and the
          2.1.1_0159 / new-B1.6 case is unconfirmed (remaining_unknowns).
        ble:
          pairing_required: false
        steps:
          - action: "Open TelinkMiFlasher.html in Chrome/Edge/Opera, click 'Connect' and choose the LYWSD03MMC."
            actor: "client"
          - action: "Click 'Do Activation'; record the bindkey the flasher reports, and do not flash any firmware."
            actor: "client"
            expect: "The sensor keeps broadcasting encrypted MiBeacon frames, now under the new key."
          - action: "Enter the key into the decoding client, matching its length to the MiBeacon version (12 bytes for v2/v3, 16 bytes for v4/v5)."
            actor: "user"
          - action: "If Mi Home will be used again, remove the sensor from Mi Home and add it back; the decoding client's key may then need updating."
            actor: "user"
            expect: "Mi Home recognises the sensor again only after it is re-added."
      - type: "cloud_account"
        name: "Keep stock firmware, take the bindkey from Mi Home"
        role: "alternative"
        # The custom-firmware path above is the one this repo documents and
        # exercises; the stock Mi Home route is recorded as the alternative it
        # replaces, not as a flow verified here.
        verified: false
        description: >
          Alternative: pair with Xiaomi Mi Home app to obtain bindkey,
          then use stock firmware with encrypted MiBeacon decryption.
        cloud:
          provider: "Xiaomi Mi Home"
          local_alternative: "Flash custom firmware for fully local control."
    factory_reset:
      confidence: "high"
      effect: "Clears bindkey, PIN, comfort settings, and measurement history. Returns to custom firmware defaults."
      procedures:
        - name: "Send 0x56 command via GATT"
          steps:
            - action: "Connect to ATC_XXXXXX device via GATT."
              actor: "client"
            - action: "Write 0x56 to the configuration characteristic."
              actor: "client"
              expect: "Device resets to defaults."
        - name: "Remove and reinsert battery"
          steps:
            - action: "Remove CR2032 battery for 10+ seconds, then reinsert."
              actor: "user"
              expect: "Device advertises with default settings."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "Custom firmware: scan for ATC_XXXXXX. Stock: requires Mi Home re-pairing."
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Bindkey (stock firmware, for MiBeacon encryption; 12 bytes for MiBeacon v2/v3, 16 bytes for v4/v5)"
        - "PIN code (custom firmware, optional)"
      issued_to_client:
        - "Bindkey (stock firmware, obtained from Xiaomi cloud via Mi Home, or set by Telink Flasher activation)"
      notes: >
        Custom firmware stores no cloud credentials. Optional PIN for GATT
        access control. A bindkey set by the Telink Flasher replaces the Mi
        Home one, and re-adding the sensor to Mi Home afterwards may replace
        it again (reported, not tested here).

  pairing:
    required: false
    confidence: "high"
    security_mode: "none"
    bonding: "none"
    pin:
      source: "vendor_app"
      notes: >
        Stock firmware only, and not a PIN: the MiBeacon bindkey that decrypts
        the broadcast payload, extracted once from the Mi Home app — or,
        instead, a new one written by the pvvx Telink Flasher's activation
        (setup.methods). Per-unit, so no value appears here. Custom firmware
        removes the need for it entirely.
    unpair:
      supported: true
      requires_factory_reset: false
      clears: "The Xiaomi account binding, and with it the validity of the extracted bindkey."
      notes: >
        Removing the thermometer from Mi Home invalidates the bindkey, so a
        local integration that was decoding broadcasts stops decoding them
        with no change on its own side. Re-pairing issues a new one. Flashing
        the custom firmware makes the whole question moot.
    enter_pairing_mode:
      required: false
    notes: >
      Nothing bonds on either firmware — this is a broadcast sensor, and no
      client ever pairs with it at the link layer. What the stock firmware
      requires is a key, not a pairing: its MiBeacon payload is encrypted, and
      the bindkey comes from the Mi Home account the thermometer is registered
      to, or from a Telink Flasher activation that sets a new one. The
      recommended path here is the pvvx/ATC custom firmware, which
      broadcasts unencrypted and has no account, no key and no pairing of any
      kind; the flash is reversible.
  variants:
    - model: "LYWSD03MMC (custom firmware ATC)"
      identification:
        local_name_prefix: "ATC_"
      notes: "Custom firmware. 6 hardware versions. Name format: ATC_XXXXXX — in BTHome format (v5.8 default) the name may arrive only in the scan response, so name-less advertisements are normal; match 0xFCD2 there."
    - model: "LYWSD03MMC (stock firmware)"
      identification:
        local_name_prefix: "LYWSD03MMC"
        service_uuids:
          - "0000fe95-0000-1000-8000-00805f9b34fb"
      notes: "Stock firmware with encrypted MiBeacon. Service UUID 0xFE95."
    - model: "MHO-C401"
      identification:
        local_name_prefix: "MHO_"
      notes: "Custom firmware advertises as MHO_XXXXXX (ble_set_name in ble.c)."
    - model: "MHO-C401N"
      identification:
        local_name_prefix: "MHO_"
      notes: "Custom firmware advertises as MHO_XXXXXX, same prefix as MHO-C401."
    - model: "MJWSD05MMC"
      identification:
        local_name_prefix: "BTH_"
      notes: "Custom firmware advertises as BTH_XXXXXX; English-hardware units use BTE_."
    - model: "CGG1-M (Qingping)"
      identification:
        local_name_prefix: "CGG_"

payload_formats:
  ATC_3byte:
    description: >
      3-byte ATC layout. NOTE: this compact layout exists only as the
      AES-CCM PLAINTEXT of the ENCRYPTED ATC beacon (adv_atc_data_t in
      custom_beacon.h) — it never appears on the air unencrypted. The
      unencrypted on-air ATC format is ATC_atc1441 below.
    fields:
      - index: 0
        name: "temperature_raw"
        description: "Temperature = (value / 2.0) - 40.0 °C."
      - index: 1
        name: "humidity_raw"
        description: "Humidity = value / 2.0 %."
      - index: 2
        name: "battery_and_flags"
        description: "Bits 6-0 = battery %, bit 7 = trigger/status flag."
    example: "6c 64 63"
    parse_rules:
      - "temp = (byte[0] / 2.0) - 40.0"
      - "humidity = byte[1] / 2.0"
      - "battery = byte[2] & 0x7F"
      - "trigger_flag = (byte[2] >> 7) & 1"
  PVVX_6byte:
    description: >
      6-byte Custom layout. NOTE: as with ATC_3byte, this is the AES-CCM
      PLAINTEXT of the ENCRYPTED Custom beacon (adv_cust_data_t in
      custom_beacon.h) — the unencrypted on-air Custom format is
      Custom_unencrypted below.
    fields:
      - index: 0
        name: "temperature"
        description: "Temperature in 0.01°C (int16 LE)."
      - index: 2
        name: "humidity"
        description: "Humidity in 0.01% (uint16 LE)."
      - index: 4
        name: "battery"
        description: "Battery percentage."
      - index: 5
        name: "flags"
        description: "Status/trigger flags."
    example: "ce 08 94 13 64 00"
    parse_rules:
      - "temp = int16_le(bytes[0:2]) / 100.0"
      - "humidity = uint16_le(bytes[2:4]) / 100.0"
      - "battery = byte[4]"
      - "flags = byte[5]"
  ATC_atc1441:
    description: >
      Unencrypted on-air ATC advertisement (adv_atc1441_t in
      custom_beacon.h), Service Data 0x181A.
    fields:
      - index: 0
        name: "mac"
        description: "Device MAC, 6 bytes, big-endian."
      - index: 6
        name: "temperature"
        description: "int16 big-endian, ×0.1 °C."
      - index: 8
        name: "humidity"
        description: "uint8, percent."
      - index: 9
        name: "battery_percent"
        description: "uint8, percent."
      - index: 10
        name: "battery_mv"
        description: "uint16 big-endian, millivolts."
      - index: 12
        name: "counter"
        description: "Advertisement counter."
    parse_rules:
      - "temp = int16_be(bytes[6:8]) / 10.0"
      - "humidity = byte[8]"
      - "battery_percent = byte[9]"
      - "battery_mv = uint16_be(bytes[10:12])"
  Custom_unencrypted:
    description: >
      Unencrypted on-air Custom (pvvx) advertisement (adv_custom_t in
      custom_beacon.h), Service Data 0x181A, 14 bytes.
    fields:
      - index: 0
        name: "mac"
        description: "Device MAC, 6 bytes."
      - index: 6
        name: "temperature"
        description: "int16 LE, ×0.01 °C."
      - index: 8
        name: "humidity"
        description: "uint16 LE, ×0.01 %."
      - index: 10
        name: "battery_mv"
        description: "uint16, millivolts."
      - index: 12
        name: "battery_percent"
        description: "uint8, percent."
      - index: 13
        name: "counter"
        description: "Advertisement counter; a flags byte follows on 15-byte frames."
    parse_rules:
      - "temp = int16_le(bytes[6:8]) / 100.0"
      - "humidity = uint16_le(bytes[8:10]) / 100.0"
      - "battery_mv = uint16_le(bytes[10:12])"
      - "battery_percent = byte[12]"
  BTHome_v2:
    description: >
      BTHome v2 advertisement, the pvvx firmware default since v5.8 and
      so the layout most units are actually broadcasting. Carried as
      Service Data under 0xFCD2, NOT 0x181A — 0x181A appears only in the
      connected GATT table on a BTHome-configured unit. Unlike the four
      layouts above this one is TLV, not fixed: byte 0 is the BTHome
      device-info byte (0x40 = v2, unencrypted) and the rest is a run of
      [object id][value] pairs in ascending id order. The indices below
      are the run this firmware emits; a general decoder should walk the
      ids rather than trust the offsets, because a field the device has
      nothing to report is simply absent. Hardware-verified 2026-08-22 on
      pvvx v5.8 (decoded 92 %, 23.81 °C, 59.93 % RH, matching the values
      read back over GATT in the same session).
    fields:
      - index: 0
        name: "device_info"
        description: "BTHome device-info byte. 0x40 = BTHome v2, unencrypted, no trigger."
      - index: 1
        name: "packet_id_marker"
        description: "Object id 0x00 = packet id."
      - index: 2
        name: "packet_id"
        description: "uint8 advertisement counter."
      - index: 3
        name: "battery_marker"
        description: "Object id 0x01 = battery."
      - index: 4
        name: "battery_percent"
        unit: "%"
        description: "uint8, percent."
      - index: 5
        name: "temperature_marker"
        description: "Object id 0x02 = temperature."
      - index: 6
        name: "temperature"
        unit: "C"
        scale: 0.01
        description: "int16 little-endian, x0.01 degrees C."
      - index: 8
        name: "humidity_marker"
        description: "Object id 0x03 = humidity."
      - index: 9
        name: "humidity"
        unit: "%"
        scale: 0.01
        description: "uint16 little-endian, x0.01 %."
    example: "40 00 ?? 01 5c 02 4d 09 03 69 17"
    parse_rules:
      - "Reject the frame unless byte[0] == 0x40; any other value means a BTHome variant this table does not describe (encrypted, or a different version)."
      - "Walk from byte 1: read an object id, then its value, whose width the id fixes (0x00 packet id = 1 byte, 0x01 battery = 1 byte, 0x02 temperature = 2 bytes, 0x03 humidity = 2 bytes)."
      - "temp = int16_le(bytes[6:8]) / 100.0"
      - "humidity = uint16_le(bytes[9:11]) / 100.0"
      - "battery_percent = byte[4]"
      - "The example is the verified reading (battery 0x5c = 92 %, temp 0x094d = 23.81 C, humidity 0x1769 = 59.93 %) with the packet counter written ?? because it changes every advertisement."

services:
  - uuid: "0000181a-0000-1000-8000-00805f9b34fb"
    name: "Environmental Sensing Service"
    notes: >
      Used in advertisement Service Data for ATC custom firmware beacon
      broadcasts, AND exposed as a real GATT service by the custom firmware
      (app_att.c): Temperature 0x2A6E and Humidity 0x2A6F, both read +
      notify. Data is therefore available either from passive BLE scanning
      of the advertisement payload or over a GATT connection.
    characteristics:
      - uuid: "00002a6e-0000-1000-8000-00805f9b34fb"
        name: "Temperature"
        properties: ["read", "notify"]
        notes: >
          SIG Temperature characteristic as the pvvx custom firmware exposes
          it: int16 little-endian in 0.01 degrees C. HARDWARE: a read of this
          characteristic on a v5.8 unit matched the value the same unit was
          advertising (see device.testing), so the layout is confirmed.
        format:
          - offset: 0
            length: 2
            name: "temperature"
            type: "int16"
            scale: 0.01
            unit: "C"
            device_class: "temperature"
      - uuid: "00002a6f-0000-1000-8000-00805f9b34fb"
        name: "Humidity"
        properties: ["read", "notify"]
        notes: >
          SIG Humidity characteristic: uint16 little-endian in 0.01 percent
          relative humidity. Confirmed the same way as 2a6e — the GATT read
          agreed with the advertised humidity on the tested unit.
        format:
          - offset: 0
            length: 2
            name: "humidity"
            type: "uint16"
            scale: 0.01
            unit: "%"
            device_class: "humidity"

  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    name: "Device Information Service"
    notes: >
      Standard BLE Device Information. Exposed by custom firmware v1.5+
      when connected via GATT. Provides manufacturer name, model number,
      serial number, firmware revision, hardware revision, and software
      revision.
    characteristics:
      - uuid: "00002a29-0000-1000-8000-00805f9b34fb"
        name: "Manufacturer Name String"
        properties: ["read"]
      - uuid: "00002a24-0000-1000-8000-00805f9b34fb"
        name: "Model Number String"
        properties: ["read"]
      - uuid: "00002a26-0000-1000-8000-00805f9b34fb"
        name: "Firmware Revision String"
        properties: ["read"]

  - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
    name: "Battery Service"
    notes: "Standard BLE Battery Service. Exposed by custom firmware."
    characteristics:
      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "Battery Level"
        properties: ["read"]
        notes: >
          SIG Battery Level: one unsigned byte, 0-100 percent. The custom
          firmware also enables notify on it (pvvx/ATC_MiThermometer,
          app_att.c) even though only read was exercised here.
        format:
          - offset: 0
            length: 1
            name: "battery_level"
            type: "uint8"
            unit: "%"
            device_class: "battery"

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["telink_ota"]
      transport: "ble"
      image:
        signing: "unsigned"
        source: "public_url"
        notes: >
          pvvx custom firmware and the original stock images are both
          available through https://pvvx.github.io/ATC_MiThermometer/TelinkMiFlasher.html
          (source at github.com/pvvx/ATC_MiThermometer), which is what makes
          the change reversible. Unsigned in the sense that matters: the
          custom build installs, so nothing verifies a vendor signature.
          Stock firmware 2.1.1_0159 gates the OTA session instead — Mi Home
          registration and an extracted Mi token/bindkey first (ATC_MiThermometer
          issue #602).

          The original image must match the hardware generation: upstream
          ships 1.0.0_0130 for the older B1.4-B2.0 boards and a separate
          2.1.1_0159 line for new B1.6 units, incompatible with older
          hardware. The flasher's manifest (firmware.json, release 5.9) also
          carries a "signed" list naming a 2.1.1_0159c original image; what
          that signature is and whether new-B1.6 stock firmware checks it
          before accepting an image is not established (remaining_unknowns),
          so `signing: unsigned` is asserted for the custom-firmware path,
          not for every stock bootloader. Images larger than 128 KB
          (Ext.OTA) are not supported. Pinned digests of the four public
          images are in evidence.artifacts.
      enter:
        how: "in_place"
        notes: >
          The Telink stack default: the running firmware receives the image
          and reboots into it at the end (firmware-update.md). The flasher
          runs 'Do Activation' before flashing on stock firmware.
      recovery:
        interrupted: "keeps_old_image"
        notes: >
          The Telink stack default (the new image goes to the other flash
          bank and the boot flag switches only on success), and now also
          stated by the upstream README for this firmware: an interrupted
          transfer (about four minutes) leaves the old firmware running. Not
          checked on a unit here. Keep the battery above 40 % for a reliable
          flash.
      verification: "reported"
      notes: >
        From the pvvx/ATC_MiThermometer project and its TelinkMiFlasher page;
        the flash itself was not exercised by this project (the tested unit
        already ran v5.8). The Telink OTA service UUID the flasher uses is in
        registries/dfu-signatures.tsv; it is not recorded in this spec's
        GATT table, so it is not listed under `services`. After flashing the
        device advertises as "ATC_XXXXXX". A unit already running the
        custom firmware can also be updated without a browser by the
        project's utils/ble_ota.py (Python, bleak), which reads the hardware
        and firmware version and flashes the firmware.json release image for
        that hardware only when the unit is older; the first flash from
        stock firmware still needs TelinkMiFlasher's activation (upstream
        README at commit b02b5137).

