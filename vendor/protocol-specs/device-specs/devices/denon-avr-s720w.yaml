# Denon AVR-S720W (KnOS-generation Denon/Marantz AV receivers) — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# A 2016 7.2-channel Denon receiver with four separate local surfaces on one
# address, only one of which the vendor documents:
#
#   * port 80  — the `/goform/` HTTP API, undocumented, and the one route that
#                needs no session and no pairing. Everything a remote control
#                does can be sent through it.
#   * port 23  — the Denon/Marantz AVR Control Protocol (ASCII, CR-terminated).
#                Vendor-published per model, and the ONLY surface that pushes
#                state changes without polling. Exactly one client at a time.
#   * UPnP     — a standard MediaRenderer (AVTransport, RenderingControl,
#                ConnectionManager) behind SERVER `KnOS/3.2 UPnP/1.0 DMP/3.5`.
#                The only way to hand the receiver a media URL to play.
#   * AirPlay 1 + Spotify Connect — streaming sinks, not control surfaces, but
#                their mDNS records are the best identification signal the unit
#                emits.
#
# The control vocabulary is shared: `/goform/formiPhoneAppDirect.xml?<CMD>`
# takes the *same* ASCII commands as port 23, so this spec documents the
# vocabulary once and binds every entity over HTTP. That is deliberate — a
# consumer that can only speak HTTP loses no control, only the event push.
#
# What is NOT here, because this generation does not have it: HEOS. HEOS
# Built-in arrived on the AVR-S750H/X-series H models in 2018; on an S720W the
# HEOS CLI port 1255 is closed, and a generic Denon handler that probes it and
# gives up finds nothing. See `protocol_details.denon_common.absent_surfaces`.

device:
  name: "Denon AVR-S720W AV Receiver"
  manufacturer: "Denon"
  manufacturer_status: "active"
  testing:
    status: untested
    detail: capture-verified
    notes: >
      The discovery half rests on a live LAN scan of a real AVR-S720W
      contributed 2026-08-23 (`evidence.live_lan_scan`): the mDNS service set,
      the AirPlay/RAOP and Spotify Connect TXT records, the SSDP notification
      types and the `KnOS/3.2 UPnP/1.0 DMP/3.5` SERVER string are quoted from
      it. Nothing in the control surface — goform, the ASCII command
      vocabulary, or UPnP — has been driven against hardware by this project;
      those facts are graded `reported` and come from Denon's published
      control-protocol documents and from open-source implementations
      (denonavr, the openHAB denonmarantz binding).
  protocol: "wifi"
  category: "speaker"
  transport: "http"
  admin_url: "http://{address}/"
  notes: >
    Local control of a Denon AVR-S720W needs no account, no pairing and no
    token: anything that can route to the receiver can drive it. Two
    interchangeable command routes carry the same ASCII vocabulary — HTTP GET
    `/goform/formiPhoneAppDirect.xml?<CMD>` on port 80, and a raw TCP session
    on port 23 — plus a set of purpose-built goform form endpoints for power,
    volume and mute, and XML status documents for reading state back. State
    reads are polled: `/goform/formMainZone_MainZoneXmlStatusLite.xml` is the
    cheap one (power, input, volume, mute), the non-Lite document adds the
    per-unit input list, renamed sources and surround mode. Port 23 accepts
    ONE connection at a time and pushes unsolicited state changes; a consumer
    that holds it locks every other client (including the vendor app) out, so
    prefer polling over HTTP unless push is genuinely needed. Everything on
    the LAN goes dark in standby unless Setup > Network > Network Control is
    set to "Always On"; with it off, no LAN request — and no Wake-on-LAN path
    documented for this generation — can bring the unit up. Discovery is
    generic on its face (mDNS `_http._tcp`, `_airplay._tcp`, `_raop._tcp`,
    `_spotify-connect._tcp`; SSDP `MediaRenderer:1`), so identification leans
    on three vendor-shaped details instead: the `KnOS/` SERVER string, the
    Spotify Connect `cpath` of `/goform/spotifyConfig` (the `/goform/` prefix
    is D&M's own namespace), and the D&M `00:05:CD` OUI that appears both in
    the AirPlay `deviceid` and as the node field of the SSDP UDN.
  openness:
    status: "documented_api"
    reverse_engineered: true
    upstream_docs:
      - url: "https://manuals.denon.com/AVRS720W/NA/EN/"
        title: "Denon AVR-S720W owner's manual"
        covers: >
          Front-panel and setup-menu facts this spec depends on: the Network
          Control / network-standby setting that decides whether the LAN
          surface answers in standby, the input source names, the on-screen
          network setup flow, and the factory-reset button combination.
      - url: "https://www.denon.com/en-us/support/"
        title: "Denon support — per-model AV receiver control protocol documents"
        covers: >
          The ASCII command vocabulary (PW/ZM/MV/MU/SI/MS/SLP/PS and the
          per-command query forms) as Denon publishes it per model. This is
          the documented half of the protocol; the goform HTTP endpoints that
          carry the same vocabulary are not in it.
      - url: "https://github.com/ol-iver/denonavr"
        title: "denonavr — Python library (Home Assistant's backend)"
        covers: >
          The undocumented half: the `/goform/` endpoint set, the XML status
          document shapes and element paths, the `AppCommand.xml` POST
          envelope, the `--` reading for minimum volume, and which endpoints
          exist on which receiver generation.
      - url: "https://www.openhab.org/addons/bindings/denonmarantz/"
        title: "openHAB denonmarantz binding"
        covers: >
          An independent second implementation of the same two routes, and the
          single-session constraint on the port 23 telnet surface.
    notes: >
      Denon publishes a control-protocol document per receiver, which is why
      this is `documented_api` rather than `undocumented` — but the published
      document covers the ASCII command vocabulary only. The HTTP transport
      that carries it, the `/goform/` status documents every client actually
      polls, and the `AppCommand.xml` envelope are nowhere in it; those were
      recovered by the community, which is why `reverse_engineered` is true.

  identification:
    # No ssdp_search_targets: this receiver answers `MediaRenderer:1` like
    # every DLNA renderer on the link, and the facts that identify it live in
    # the SSDP *reply* rather than the query — the `KnOS/` SERVER header and
    # the UDN node carrying the 00:05:CD OUI. The schema has no reply-header
    # matcher, so those are recorded as `parse_rules` under
    # `discovery.methods[].ssdp`.
    #
    # The mDNS side CAN be matched, though every service type it advertises
    # is a platform (`_airplay._tcp` is every AirPlay device ever made):
    # `mdns_txt_match` narrows the type to the product, the same contract
    # that keeps `_esphomelib._tcp` honest. The pair below is the cheapest
    # vendor-positive pre-connect signal the unit emits — `cpath` naming a
    # path under `/goform/`, D&M's own web-API namespace. It is family-wide
    # by design: it says "a D&M device", the same claim `mac_prefixes` makes,
    # and the variant is then read from the AirPlay `model` TXT record or
    # `<Model>` in the status document.
    mdns_service_type: "_spotify-connect._tcp.local."
    mdns_txt_match:
      - key: "cpath"
        match: "exact"
        value: "/goform/spotifyConfig"
        description: >
          Spotify's zeroconf TXT record names the config path the device
          serves, and on D&M firmware that path lives under `/goform/` — the
          vendor's own web-API namespace, which no other maker uses. Observed
          verbatim on the live unit. Constant across the whole D&M catalogue,
          so it identifies the family, never the unit — identity comes from
          the SSDP UDN or the AirPlay `deviceid`, not from this record.
    mac_prefixes:
      - prefix: "00:05:CD"
        confidence: "medium"
        notes: >
          IEEE assigns 00:05:CD to D&M Holdings — the block genuinely belongs
          to the manufacturer, but it covers the whole Denon and Marantz
          catalogue (receivers, network players, Heos speakers), so a match
          means "a D&M device", never "an AVR-S720W". Observed on the live
          unit in both the AirPlay `deviceid` TXT record and the node field of
          the SSDP UDN.
    default_port: 80
    identity_keys:
      primary: "udn"
      secondary: "deviceid"
      display: "friendly_name"

  discovery:
    methods:
      # Preferred: the SSDP route reaches the unit whether or not it is
      # streaming, and the UDN is the stable key.
      - type: "ssdp"
        ssdp:
          search_targets:
            - "urn:schemas-upnp-org:device:MediaRenderer:1"
            - "upnp:rootdevice"
          response_mapping:
            location:
              url: "LOCATION"
              action: "fetch_xml"
              parse:
                device_identity:
                  stable_keys:
                    - source: "xml://root/device/UDN"
                      key: "udn"
                    - source: "xml://root/device/serialNumber"
                      key: "serial"
                  display:
                    source: "xml://root/device/friendlyName"
                  variant:
                    source: "xml://root/device/modelName"
                parse_rules:
                  - >
                    Take the description URL verbatim from the LOCATION header
                    and use it for UPnP only. Do not carry its port over to
                    the control surface: goform is always on port 80, whatever
                    port LOCATION names. (The observed scan recorded the
                    services and the SERVER header but not the LOCATION line
                    itself, so this spec states no port for the description
                    document — resolving it from the header is the rule
                    precisely because we cannot name it.)
                  - >
                    The description is standard UPnP with the
                    urn:schemas-upnp-org:device-1-0 namespace; match element
                    local names, not prefixed ones.
                  - >
                    IDENTIFICATION WITHOUT FETCHING: the M-SEARCH reply's
                    SERVER header on this generation reads
                    `KnOS/3.2 UPnP/1.0 DMP/3.5`. A SERVER value containing
                    `KnOS/` is a D&M firmware platform and nothing else uses
                    it, so it promotes a generic MediaRenderer hit to a
                    positive vendor identification before any HTTP request.
                  - >
                    The USN/UDN node field is the device's MAC:
                    `uuid:XXXXXXXX-XXXX-XXXX-XXXX-0005CDAABBCC`. A UDN whose
                    last twelve hex digits begin `0005cd` is a D&M device, so
                    those digits are a second vendor signal available without
                    an HTTP fetch — and the UDN as a whole is this device's
                    stable identity. They are NOT a join key against the
                    AirPlay `deviceid`: a receiver has a wired and a wireless
                    MAC and the two records may carry different ones. Join an
                    SSDP hit to an mDNS hit by address; see `identity.notes`.
                control_endpoints:
                  source: "xml://root/device/serviceList/service"
                  fields:
                    service_type: "serviceType"
                    control_url: "controlURL"
                    event_sub_url: "eventSubURL"
      # AirPlay: present whenever the receiver is on the network, and the one
      # place the model string is machine-readable without an HTTP fetch.
      # `_airplay._tcp` is a platform — every Apple TV and HomePod on the
      # link — so the method carries the TXT condition that narrows it to
      # D&M hardware, per the schema's platform-service-type contract.
      - type: "mdns"
        mdns:
          service_type: "_airplay._tcp.local."
          txt_record_keys: ["deviceid", "features", "flags", "model", "srcvers"]
          txt_match:
            - key: "deviceid"
              match: "prefix"
              value: "00:05:CD"
              case_sensitive: false
              description: >
                The AirPlay device id is the unit's MAC, colon-separated, and
                00:05:CD is IEEE-registered to D&M Holdings — observed on the
                live unit. Family-wide, like `identification.mac_prefixes`:
                it says "a D&M device", and the `model` record then names
                which one. Case-insensitive because hex case here is the mDNS
                stack's formatting choice, not a fact about the device.
          identity_mapping:
            stable_keys:
              - source: "txt:deviceid"
            display:
              source: "name"
      - type: "mdns"
        mdns:
          service_type: "_raop._tcp.local."
          txt_record_keys:
            ["am", "cn", "da", "et", "ft", "fv", "md", "sf", "tp", "vn", "vs"]
          txt_match:
            - key: "am"
              match: "prefix"
              value: "AVR"
              description: >
                `am` is the RAOP model record — `AVRS720W` on the observed
                unit. The prefix narrows the platform type to a Denon AVR
                receiver rather than to this model, deliberately: the family
                shares the surface (AVR-S920W, AVR-X1300W, and siblings this
                project has no evidence for), and the exact model is read
                from the record's full value. Weaker than the `deviceid` and
                `cpath` conditions on the sibling methods — prefer those
                where both were seen.
          identity_mapping:
            stable_keys:
              - source: "name"
            display:
              source: "name"
      # The strongest single mDNS identification, despite being a third
      # party's protocol: `cpath` names a path under `/goform/`, which is
      # D&M's own web-API namespace and no one else's. The same condition is
      # in `identification.mdns_txt_match` as the pre-connect filter; this is
      # its full-evidence twin.
      - type: "mdns"
        mdns:
          service_type: "_spotify-connect._tcp.local."
          port: 80
          txt_record_keys: ["cpath", "version"]
          txt_match:
            - key: "cpath"
              match: "exact"
              value: "/goform/spotifyConfig"
              description: >
                D&M's own web-API namespace inside Spotify's TXT record —
                observed verbatim on the live unit, constant across the D&M
                catalogue. Identifies the family; never the unit.
          identity_mapping:
            # `cpath` is the MATCHER, never the identity: its value is the
            # constant /goform/spotifyConfig on every D&M device, so keying on
            # it would collapse two receivers on one LAN into one entry. The
            # instance name is unique per link by DNS-SD rule, which is enough
            # to keep them apart within a scan; for identity that survives a
            # rename, join to the AirPlay `deviceid` or the SSDP UDN.
            stable_keys:
              - source: "name"
            display:
              source: "name"
      # No `_http._tcp` method, although the receiver does advertise it (see
      # `evidence.live_lan_scan.mdns_services`): the record carries no TXT
      # data to narrow it with, so a method here would claim every web server
      # on the link — the exact platform-service-type mistake `txt_match`
      # exists to prevent. The hostname it would have contributed is
      # model-derived and rename-fragile (see `identity.notes`), and the
      # three matched methods above plus SSDP already cover every state the
      # unit can be in.
    identity:
      stable_keys: ["udn", "mac"]
      display: "friendly_name"
      notes: >
        The default hostname is model-derived — `Denon-AVR-S720W.local` on the
        observed unit — so it identifies the model but not the unit, and it
        changes if the owner renames the receiver. Use the UDN (SSDP) or the
        AirPlay `deviceid` (mDNS) as the stable key.

        Among the mDNS records only `_airplay._tcp`'s `deviceid` is a true
        per-unit key. The `_http._tcp` hostname, the `_raop._tcp` instance
        name and the `_spotify-connect._tcp` instance name are unique on a
        link (DNS-SD guarantees that much, so they will not collide in a
        scan) but they all change when the owner renames the receiver — they
        keep entries apart, they do not survive a rename.

        Whether the UDN's MAC and the AirPlay `deviceid` are the SAME address
        was not established here: the
        contributed scan redacted both below the 00:05:CD OUI before it
        reached this file, and a receiver with both Ethernet and Wi-Fi has two
        MACs. So treat each key as stable WITHIN its transport, and join an
        SSDP hit to an mDNS hit by IP address rather than by assuming the two
        identifiers match.
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      Onboarding happens on the receiver itself, through its setup menu shown
      on the connected TV (or on the front-panel display) — there is no
      app-driven provisioning protocol to reimplement, and the control surface
      needs no pairing once the unit is on the network. The step that matters
      for every consumer of this spec is not the network join but the one
      after it: Setup > Network > Network Control must be set to "Always On",
      or the receiver's entire LAN surface — HTTP, port 23, UPnP and mDNS
      alike — is powered down in standby, and no client can turn it back on.
      The trade-off is real and the user's to make: "Always On" raises idle
      power draw, and Denon ships it off on some model years.
    methods:
      - type: "wired"
        name: "Ethernet — plug in and take a DHCP lease"
        role: "primary"
        verified: false
        description: >
          Ethernet: plug into the NETWORK port and the receiver takes a DHCP
          lease with no menu interaction. This is the reliable option for a
          fixed installation — the Wi-Fi radio on this generation is 2.4/5 GHz
          802.11n and the unit sits inside a metal chassis in a cabinet.
        steps:
          - action: "Connect the NETWORK port to the LAN and power the receiver on."
            actor: "user"
            expect: "Setup > Network shows an IP address; the Wi-Fi radio is disabled automatically when the cable is present."
          - action: "Setup > Network > Network Control > Always On (same reason as above)."
            actor: "user"
      - type: "device_ui"
        name: "Wi-Fi from the receiver's on-screen setup menu"
        role: "alternative"
        verified: false
        description: >
          Wi-Fi join from the receiver's own setup menu: Setup > Network >
          Connection > Wi-Fi > Configuration, then pick the SSID and enter the
          passphrase with the remote. Two shortcuts exist on this generation —
          WPS push-button, and "Share Wi-Fi settings from an iOS device",
          which copies the credentials over the USB cable from a connected
          iPhone. The passphrase never crosses a link a third-party client
          could implement, which is why `credentials` records it as not
          applicable rather than plaintext.
        steps:
          - action: "Connect the receiver's MONITOR OUT to a TV so the setup GUI is visible."
            actor: "user"
            notes: "The front-panel display can drive the same menus, but the on-screen GUI is far easier."
          - action: "Setup > Network > Connection > Wi-Fi, choose the SSID and enter the passphrase (or use WPS)."
            actor: "user"
            expect: "The Network menu shows the assigned IP address."
          - action: "Setup > Network > Network Control > Always On."
            actor: "user"
            notes: >
              Without this the receiver answers nothing on the LAN while in
              standby, so a client can read state and control it only while
              somebody has already switched it on by hand.
          - action: "Confirm the goform surface answers from the LAN."
            actor: "client"
            request:
              protocol: "http"
              action: "GET /goform/formMainZone_MainZoneXmlStatusLite.xml"
            expect: "XML `<item>` document on port 80 carrying Power, InputFuncSelect, MasterVolume and Mute."
    factory_reset:
      confidence: "low"
      effect: >
        Clears network settings, input renames, speaker/Audyssey calibration
        and every menu setting; the receiver returns to its out-of-box state
        and re-runs the setup assistant.
      description: >
        Denon documents two different operations and they are not
        interchangeable. "Reset network settings" (Setup > Network > Reset)
        clears only the network configuration and is what a user wants when
        moving to a new router — the front-panel procedure below is the full
        microprocessor reset and throws away the Audyssey calibration too,
        which is an hour of somebody's afternoon with a measurement
        microphone. Neither procedure has been performed by this project, and
        the front-panel button pair varies across the S-series and across
        model years, so confirm it against the unit's own manual before
        telling a user to hold anything.
      procedures:
        - name: "Reset network settings only (menu)"
          verified: false
          basis: >
            Denon's S-series setup-menu structure as described in the
            AVR-S720W owner's manual; not performed here.
          steps:
            - action: "Setup > Network > Reset (some model years: 'Restore Defaults' inside the Network menu)."
              actor: "user"
              expect: "Network settings return to defaults; other settings and the Audyssey calibration survive."
        - name: "Full microprocessor reset (front panel)"
          verified: false
          basis: >
            The Denon S-series "Resetting factory settings" convention — power
            off, then hold the two TUNER PRESET CH buttons while pressing the
            power button until the display flashes. Recorded because it is the
            first thing to try on a receiver whose menu is unreachable; the
            exact button pair differs by model year and this project has not
            run it.
          indicator: "The front-panel display flashes at roughly one-second intervals."
          steps:
            - action: "Put the receiver into standby with the front-panel power button."
              actor: "user"
            - action: "Press and hold TUNER PRESET CH + and TUNER PRESET CH − together, then press the power button."
              actor: "user"
            - action: "Release both buttons once the display begins flashing."
              actor: "user"
              expect: "The receiver restarts into its out-of-box state and re-runs the setup assistant."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Re-running Setup > Network > Connection changes the network without
        touching anything else, and it does not need the old network to still
        be up — the credentials are entered on the receiver, not handed to it
        by a client. Ethernet takes precedence over Wi-Fi automatically when a
        cable is present, so moving a Wi-Fi-provisioned unit onto a wired
        network needs no menu work at all.
      steps:
        - action: "Setup > Network > Connection > Wi-Fi > Configuration, pick the new SSID, enter the passphrase."
          actor: "user"
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "WiFi credentials"
        - "Spotify Connect user blob, once a Spotify client has added a user"
        - "Input renames, speaker calibration and menu settings"
      issued_to_client: []
      notes: >
        There is no authentication anywhere on the local control surface: no
        pairing, no PIN, no token, no session. Anything that can route to port
        80 or port 23 has full control of the receiver — it can power it on at
        3 a.m. at whatever volume it likes — so network reachability IS the
        access-control model, and a consumer should say so rather than imply a
        credential protects it. The Wi-Fi passphrase is typed on the receiver
        (or copied over USB from an iOS device), so it never crosses a link a
        client of this spec implements.

  variants:
    - model: "AVR-S720W"
      name: "Denon AVR-S720W (2016, 7.2 ch)"
      identification:
        # Matched against <Model>/<ModelName> as the receiver reports it. A
        # prefix because Denon suffixes region codes onto the model string,
        # and because Deviceinfo.xml conventionally prefixes a '*' — strip
        # that before comparing.
        model_prefix: "AVR-S720W"
      characteristics:
        - "The unit this spec was written against; scanned live 2026-08-23."
        - "AirPlay TXT records report the model without the hyphen, as AVRS720W (`am` and `model`)."
        - "Default hostname Denon-AVR-S720W.local, until the owner renames the receiver."
        - "Single zone — the Zone2/Zone3 status documents and the Z2/Z3 command prefixes do not apply."
        - "AirPlay 1 only (srcvers 190.9.p6); no AirPlay 2, no HEOS Built-in, no HEOS CLI on port 1255."
    - model: "AVR-S920W"
      name: "Denon AVR-S920W (2016, 7.2 ch)"
      identification:
        model_prefix: "AVR-S920W"
      characteristics:
        - "Same 2016 KnOS firmware generation and the same goform/telnet surface."
        - "Whether this model exposes a second zone was not established here; probe /goform/formZone2_Zone2XmlStatusLite.xml rather than assuming."
    - model: "AVR-X1300W"
      name: "Denon AVR-X1300W (2016, 7.2 ch)"
      identification:
        model_prefix: "AVR-X1300W"
      characteristics:
        - "X-series sibling of the same generation; same control surface, richer setup menu."
  # The goform + ASCII surface is far wider than these three: it spans Denon
  # and Marantz receivers from roughly 2011 to the present, including the
  # later HEOS Built-in models, which keep every endpoint here and ADD the
  # HEOS CLI on port 1255. Only models this project has evidence for are
  # listed; a consumer should treat the surface as family-wide and probe.

