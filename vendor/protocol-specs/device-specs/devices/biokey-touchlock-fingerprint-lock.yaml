evidence:
  artifacts:
    - type: "static_analysis"
      artifact: "com.champion.lock v2.2.1 (versionCode 114), updated 2023-11-09, developer Keyssmart"
      sha256: "ab6084e6b5c66c7d39ca670837427e8833c16e4cc01dfdba11737f2016990a77"
      obtained_via: "third-party APK mirror, 2026-08 (the Play listing was gone; no official download)"
      description: >
        Static analysis of the OEM Android app for this lock family (2026-08).
        Source of every byte-level fact in this spec: the GATT UUIDs and write
        type from its scan/connect layer, the 20-byte frame layout, opcodes and
        checksum from its command builder, the advertised-name patterns from
        its name matcher, the time-derived password and status-byte layout from
        its crypto helper, and the response codes from its error enum. Its
        settings screen is also where the absence of any upgrade/OTA path was
        confirmed.
    - type: "fcc_filing"
      url: "https://fcc.report/FCC-ID/2AIKJBL"
      description: "FCC ID 2AIKJ-BL, grantee BIO-KEY: TouchLock BT padlocks BL0509 (XS), BL1209 (XL), BS1609 (TSA)"
    - type: "vendor_store_listing"
      url: "https://play.google.com/store/apps/details?id=com.champion.lock"
      description: "Play Store listing (1,000+ installs as of 2026-08) — app identity, version 2.2.1, developer Keyssmart; no sibling apps found"
