protocol_details:
  wire_codec:
    description: >
      Obfuscation applied by the BlueDriver firmware to every stream byte on
      CMD writes and DATA notifications, in both directions. It does not
      apply to the three-byte stream control messages, which travel as-is.
    key: 0x26
    rule: "wire = plain ^ 0x26 for every byte, except 0x0d (CR) and 0x3e ('>'), which are sent unchanged. Decoding applies the same rule to the wire bytes."
    caveats:
      - >
        The mapping is not one-to-one, so two plaintext bytes cannot be
        represented. '+' (0x2b) encodes to 0x0d and 0x18 encodes to 0x3e, so
        both would decode as CR and '>'. Neither appears in ELM327 command or
        reply text, so the collision does not arise in practice. It is
        arithmetic from the rule above, not an observation.
      - >
        CR is the command terminator, and '>' is the end-of-reply prompt. Both
        survive the encoding, so a receiver can find the end of a reply on
        the raw wire bytes without decoding them first.
    test_vectors:
      - plain: "LMI\\r"
        wire: "6a 6b 6f 0d"
      - plain: "LMX0\\r"
        wire: "6a 6b 7e 16 0d"
      - plain: "010C\\r"
        wire: "16 17 16 65 0d"
      - plain: "0F 80 \\r>"
        wire: "16 60 06 1e 16 06 0d 3e"
        notes: "Upstream's example reply to 010C; 0x0f80 / 4 = 992 rpm."
      - plain: "OK\\r>"
        wire: "69 6d 0d 3e"
      - plain: "?\\r>"
        wire: "19 0d 3e"
      - plain: "NO DATA\\r>"
        wire: "68 69 06 62 67 72 67 0d 3e"
  lm_init:
    description: >
      The vendor app's mandatory initialisation, in order, sent over CMD after
      the 00 ff 7f window message on DATA. Wait for '>' after each command.
      The expected replies are upstream's table.
    sequence:
      - { command: "LMI",  reply: "'?' or 'OSAPI v2.60' CR 'OK'", role: "firmware identity probe" }
      - { command: "LMD",  reply: "'OK'", role: "unknown" }
      - { command: "LML0", reply: "'?'", role: "unknown; the '?' is expected" }
      - { command: "LMI",  reply: "'OSAPI v2.60' CR 'OK'", role: "firmware identity probe" }
      - { command: "LMD",  reply: "'OK'", role: "unknown" }
      - { command: "LMDP", reply: "protocol number CR 'OK'", role: "report the auto-detected OBD protocol" }
      - { command: "LMI",  reply: "'OSAPI v2.60' CR 'OK'", role: "firmware identity probe" }
      - { command: "LMX1", reply: "'OK'", role: "exhaustive timing (~200 ms per query)" }
      - { command: "LMX0", reply: "'OK'", role: "fast timing (~45 ms per query); leaves the scanner ready for live polling" }
    resulting_elm_state: "echo off, headers off, linefeeds off, spaces on, automatic protocol selection"
    after_init:
      - "Mode-01 PIDs are sent raw (e.g. 010C + CR). No further setup is needed."
      - "Never send AT commands. ATZ, ATE0 and the rest corrupt the firmware's state and every query returns NO DATA."
      - "ATRV and ATDP return NO DATA. Use PID 0142 and LMDP instead."
      - "LMX1 and LMX0 can be switched at any time. The vendor app uses LMX1 only for its one-time monitor and freeze-frame scans, and LMX0 for live data."
    example_version_string: "OSAPI v2.60 (the product firmware string in LMI replies, as captured upstream)"
  lmdp_protocol_numbers:
    description: "LMDP reply values. They are the ELM327 protocol numbers (see obd2-bluetooth-adapter)."
    values:
      "0": "Automatic"
      "1": "SAE J1850 PWM"
      "2": "SAE J1850 VPW"
      "3": "ISO 9141-2"
      "4": "ISO 14230-4 KWP, 5-baud init"
      "5": "ISO 14230-4 KWP, fast init"
      "6": "ISO 15765-4 CAN, 11-bit ID, 500 kbit/s"
      "7": "ISO 15765-4 CAN, 29-bit ID, 500 kbit/s"
      "8": "ISO 15765-4 CAN, 11-bit ID, 250 kbit/s"
      "9": "ISO 15765-4 CAN, 29-bit ID, 250 kbit/s"
      "A": "SAE J1939 CAN"
  tested_pids:
    description: >
      The mode-01 PIDs upstream ran against a vehicle through this scanner.
      Data bytes are A, B in reply order, and multi-byte values are
      big-endian as J1979 defines them. The formulas agree with the
      obd2-pid-reference spec, which is authoritative for these and every
      other PID.
    pids:
      - { pid: "0C", name: "Engine RPM", bytes: 2, formula: "(A * 256 + B) / 4", unit: "rpm", endianness: "big", scale: 0.25 }
      - { pid: "0D", name: "Vehicle speed", bytes: 1, formula: "A", unit: "km/h", scale: 1 }
      - { pid: "05", name: "Engine coolant temperature", bytes: 1, formula: "A - 40", unit: "C", scale: 1, value_offset: -40 }
      - { pid: "0F", name: "Intake air temperature", bytes: 1, formula: "A - 40", unit: "C", scale: 1, value_offset: -40 }
      - { pid: "04", name: "Calculated engine load", bytes: 1, formula: "A * 100 / 255", unit: "%", scale: 0.392157 }
      - { pid: "11", name: "Throttle position", bytes: 1, formula: "A * 100 / 255", unit: "%", scale: 0.392157 }
      - { pid: "2F", name: "Fuel tank level input", bytes: 1, formula: "A * 100 / 255", unit: "%", scale: 0.392157 }
      - { pid: "0B", name: "Intake manifold absolute pressure", bytes: 1, formula: "A", unit: "kPa", scale: 1 }
      - { pid: "42", name: "Control module voltage", bytes: 2, formula: "(A * 256 + B) / 1000", unit: "V", endianness: "big", scale: 0.001 }
  timing:
    lmx0_per_query_ms: 45
    lmx1_per_query_ms: 200
    serial_poll_per_pid_ms: "40-50"
    six_pid_serial_refresh_s: "0.25-0.3"
    ble_connection_interval_ms: 15
    notes: >
      All observed by upstream. Serial polling at 40-50 ms per PID matched
      the vendor iOS app's refresh rate. The combined six-PID request costs
      one round trip instead of six.
  multi_pid_requests:
    max_pids: 6
    protocols: "ISO 15765-4 (CAN) only; non-CAN vehicles answer incompletely, so fall back to one PID per request"
    reply_layout: "each PID number, then its data bytes, repeated; no leading 41 (see payload_formats.ElmResponse)"
    pipelining: "not supported: a command written while a query is in flight aborts that query"
  encrypted_characteristic:
    uuid: "12e868e7-c926-4906-96c8-a7ee81d4b1b3"
    properties: ["read"]
    security: "encryption required"
    service: "not recorded"
    role: >
      Pairing trigger. Reading it on a host with no bond makes the stack run
      SMP, which completes as LE Secure Connections Just Works (the scanner
      advertises IO capability NoInputNoOutput). It is not one of the BGX
      streaming characteristics. What its value means is not documented.
