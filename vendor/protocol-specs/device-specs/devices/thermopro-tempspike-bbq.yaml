device:
  name: ThermoPro TempSpike / TP9xx BBQ Thermometer
  manufacturer: ThermoPro (Adsmart)
  model: TP9012, TP920, TP940, TP960/962/968 (TempSpike), TP980, TP426 (plain BLE GATT series)
  category: sensor
  type: bbq-thermometer
  transport: ble_gatt
  protocol: ble
  manufacturer_status: active
  testing:
    status: untested
  notes: |
    Extracted from com.thermopro.thermopro v1.21 (48MB, TempPro APKPure XAPK).
    Decompiled: 14,930 classes. Package: cn.com.adsmart.wifibbq.
    Adsmart is the OEM behind ThermoPro's connected devices.

    TRANSPORT IS PLAIN BLE GATT — NOT BLE MESH. The app contains no mesh stack
    (no/nordicsemi/android/ holds only ble/ + support/; no Mesh Proxy 0x1828,
    no PB-GATT, no provisioning anywhere in the sources). Two independent RE
    efforts agree: daniel-corbett/thermopro-cli calls it "a simple BLE
    notification-based protocol", and Bluetooth-Devices/thermopro-ble decodes
    TempSpike probes passively from advertisements with no connection at all.
    An earlier revision of this spec describing BLE Mesh provisioning was
    fabricated.

    THERE IS NO SINGLE UNIVERSAL UUID SET. The app picks one of FIVE
    per-family BLE configs at connect time (MyBleManager.java:103-128,
    ble/config/*Config.java; 16-bit codes expand to
    0000XXXX-0000-1000-8000-00805F9B34FB via UUIDUtil):
    - TP9012 family (deviceType 7/8, TP90XConfig): service
      0B863E05-BA64-4F7A-922D-007FD52DCAA9 — NOT 1086FFF0 — write FFF1,
      notify FFF2.
    - TP922 (deviceType 22, TP922Config): service
      BAAAFFF0-0001-4E6E-886A-57D347C919FE, write BAAAFFF1-…, notify
      BAAAFFF2-….
    - TP940 (deviceType 24) and TempSpike TP960 (deviceTypes 30/31):
      service 93bb7cab-eb14-c5a9-2354-a24f4df9330f with roles REVERSED —
      write = FF02, notify = FF01 — plus a read characteristic FF03.
    - TP426 infrared (deviceType 50): service
      0F86FFF0-63E8-4762-9DFB-7B6FE113376A, write FFF1, notify FFF2.
    - Default (all other deviceTypes, incl. TP920/TP25W and TP980,
      TPBleConfig): service 1086FFF0-3343-4817-8BB2-B32206336CE8, write
      FFF1, notify FFF2.
    Clients must identify the family (advertised name, per ScanConfig.java)
    before choosing a service; 1086FFF0 is the fallback, not the universal
    case.

    WRITE FRAMING IS PER-FAMILY. Only the TP9012 family wraps commands as
    0xAA | payload | checksum | 0xFF, where checksum = sum of the payload
    bytes EXCLUDING the opcode byte, & 0xFF (TP9012Data.getIntCheckSum);
    its notifications mirror this with 0xAA at offset 0 and the opcode at
    offset 1. TP920/TP25W-family frames have NO 0xAA/0xFF wrapper and a
    trailing checksum that INCLUDES the opcode byte
    (TP920Data.getIntCheckSum:247-258); this family additionally expects a
    fixed init handshake write (starting 01 09 8a 7a ...) plus a
    timestamp-sync command 0x28 after connect (thermopro-cli
    create_handshake_command). TP940, TP960 (TempSpike) and TP980 send raw
    opcode-prefixed frames with NO wrapper and NO checksum at all
    (TP940Data/TP960Data/TP980Data build Data straight from the opcode
    bytes).

    Eight device change-utility families are dispatched in the app
    (MyBleManager.notificationDataCallback): TP9012, TP920, TP940, TP960,
    TP962, TP968, TP980 and TP426 (infrared). The TempSpike line
    (TP960/962/968 and TP970-973) is the current retail focus.

    TEMPSPIKE PASSIVE MODE: TP96x/TP97x probes broadcast probe index,
    temperatures and battery voltage in BLE advertisement manufacturer data
    (company id prepended LE by the parser) — fully decodable without
    connecting (Bluetooth-Devices/thermopro-ble parser.py, actively
    maintained). This is the cheapest integration path for those models and
    obviates most of the setup below. TWO DIFFERENT LAYOUTS EXIST — an
    earlier revision of this spec claimed "°F + 54 offset" for all of them,
    which is wrong for TP96x:
    - TP96x / TP970 (7-byte payload; a 13-byte variant appends 6 bytes —
      observed to be the reversed base-station MAC — which are ignored):
      "<BHHH" = probe_index u8, internal_temp u16, battery_voltage u16,
      ambient_temp u16. Temperatures are INTEGER values with a -30 offset
      (raw - 30), NOT °F (parser.py:184-206).
    - TP97x (23-byte payload): "<BHHfffHHH" = probe_index u8, ambient_temp
      u16, battery_voltage u16, then three float32 internal temperatures
      (tip/center/end), three u16 ignored. Only THIS family encodes temps
      as float32 °F with a +54 offset: celsius = (raw - 54 - 32) * 5/9 —
      the same fahrenheit_to_celsius(x - 54) the connected TP980 path uses
      (parser.py:155-182).
    Battery from advertisements uses a fitted tanh curve (mV → %):
    52.317286 * tanh(v/273.624277936 - 8.76485439394) + 51.06925, clamped
    0-100 (tp96_battery).

    FIRMWARE/DFU: the app carries TWO OTA paths (ble/config/DfuConfig.java,
    OtaConfig.java). There is a DFU-mode GATT service 0x1850 (write 0x2C00,
    notify 0x2C01), and two vendor OTA profiles with bundled firmware
    images: ASR560X (service 0917fe11-5d37-816d-8000-00805f9b34fb, write
    09170001-…, notify 09170002-…; bundled res/raw/ast6s53_v25_ota.bin,
    version 2.5, string app-2.5.0-20251011.1000, archived in the research
    store — TempSpike-era hardware is ASR560X-based, not Nordic) and
    Silicon Labs (OTA service 1d14d6ee-fd63-4fa1-bfa4-8f47b42119f0, control
    f7bf3564-fb6d-4e53-88a4-5e37e0326063, write
    984227f3-34fc-4045-a5d0-2c581f81a153; bundled
    res/raw/ota_hpyke25_2101_v117, version 1.17). Images are pushed to
    devices over BLE by OTAUtil/OtaConfig.

    ThermoPro is rebranding to "TempPro" (announced ~April 2026; temppro.com);
    the app already references both buythermopro.com and temppro.com.

  setup:
    required: false
    confidence: medium
    notes: >
      Plain BLE GATT: scan, identify the family (the UUID set and framing
      are per-family — see device.notes), connect, subscribe to the family's
      notify characteristic, run the short init handshake where the family
      requires it, then exchange opcode-prefixed commands. There is no
      provisioning, no pairing and no mesh layer. For TempSpike TP96x/TP97x
      models even the connection is optional — temperatures and battery
      arrive passively in advertisements.

      Confidence is medium: the flows are read from the decompiled app and two
      independent RE projects, but have not been run against a device here.
    methods:
      - type: ble_direct
        description: >
          Scan for the advertised name (TP940R, TP980R, TP960R, Thermopro,
          SmartBBQ, ... per ScanConfig.java), identify the family from the
          name, connect to the family's service (see the five configs in
          device.notes — 1086FFF0-… is only the default for TP920/TP980 and
          others, write FFF1 / notify FFF2; TP940/TP960 use
          93bb7cab-… with write FF02 / notify FF01; TP9012-family uses
          0B863E05-…), enable notifications, and — on the TP920/TP25W/TP904
          family — write the fixed handshake (01 09 8a 7a ...) plus
          timestamp sync (command 0x28) before issuing commands.
        verified: false
        ble:
          pairing_required: false
        steps:
          - action: Power the thermometer on; it advertises immediately.
            actor: user
          - action: Scan for the advertised name and identify the family; the service UUID in the device's own advertisement distinguishes it (1086FFF0 is the default, not the universal case).
            actor: client
          - action: Connect to the family's service, enable notifications on its notify characteristic, and send the family handshake where required.
            actor: client
          - action: Exchange commands in the family's framing (0xAA|payload|checksum|0xFF only on TP9012; checksum-including-opcode on TP920; raw opcodes on TP940/TP960/TP980) — or, on TempSpike models, just parse the advertisements.
            actor: client
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        No factory-reset button sequence was established from the app or any
        public source. Consult the model's manual rather than guessing.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds the thermometer to a BLE client: no keys, no pairing, no
        account. Switching controllers is scanning and connecting from the new
        one. (The WiFi families — TP980 and TP920/TP25W — additionally hold
        WiFi credentials and a vendor-cloud binding for their uplink — that
        binding is between the device and the cloud, not the BLE client.)
    credentials:
      wifi_passphrase_protection: unknown
      stored_on_device:
        - "WiFi families (TP980, TP920/TP25W): WiFi credentials + 18-char device id (did) / cloud binding"
      issued_to_client: []
      notes: >
        No credential protects the BLE link itself — any central can connect
        and exchange commands. WiFi/cloud binding is NOT TP980-only: TP980
        (scan name TP980R, the app's "tempWifi" group) uses notification
        opcodes decimal 80-84 = 0x50-0x54 (an earlier revision of this spec
        wrote "0x80-0x84", confusing decimal with hex) for
        wifiScan/wifiConnect/wifiCheck and cloud binding, returning the WiFi
        MAC, an 18-char device did and boundUser; the TP920/TP25W family has
        the same capability on opcodes 0x60-0x67 (writes: scanWifi 0x60,
        connectWifi 0x62, checkWifi 0x63, unBound 0x64, checkDid 0x66;
        notifications: wifiScanReturn 0x61, wifiConnectReturn 0x63/0x67,
        boundNotification 0x65, checkDidReturn 0x66 — TP920Data.java:193-244,
        TP920DataChangeUtils.java:60). Unlike the TP980 set, no decimal/hex
        confusion applies to these: the decompiled literals are decimal
        96-103, which equal hex 0x60-0x67 exactly as written here. The
        apparent write/notify overlaps are real request/response opcode
        sharing — the device's reply notification echoes the request's
        opcode (checkWifi write 0x63 → wifiConnectReturn notify 0x63,
        checkDid write 0x66 → checkDidReturn notify 0x66; 0x61 and 0x65
        likewise double as the client's ack writes wifiScanReturn(index)
        and returnUnBoundDevice), while 0x67 is a notification-only WiFi
        connect-state variant with no matching write. So a
        WiFi passphrase IS involved for those families, and TP980W is sold as
        a Wi-Fi model. No TP980 cloud broker endpoint is identifiable from
        static code; the binding rides the device did.

services:
  # DEFAULT family config (TPBleConfig) — TP920/TP25W, TP980 and all
  # deviceTypes without a dedicated config. NOT universal: the TP9012,
  # TP922, TP940/TP960 and TP426 families below use different UUIDs.
  - uuid: "1086FFF0-3343-4817-8BB2-B32206336CE8"
    name: ThermoPro Vendor Service (default — TP920/TP25W, TP980, others)
    characteristics:
      - uuid: "1086FFF1-3343-4817-8BB2-B32206336CE8"
        name: Command Write
        properties: ["write"]
        description: >
          Client → device command channel. Framing is per-family: on TP920
          frames carry a trailing checksum that INCLUDES the opcode (no
          0xAA/0xFF wrapper); on TP980 frames are raw opcode bytes with no
          checksum. This is a custom vendor service — NOT the BLE Mesh
          Proxy service (that would be 0x1828); there is no mesh anywhere
          in this product.
      - uuid: "1086FFF2-3343-4817-8BB2-B32206336CE8"
        name: Notification
        properties: ["notify"]
        description: >
          Device → client notifications, opcode at offset 0 for this
          family. (The 0xAA-at-offset-0 / opcode-at-offset-1 layout belongs
          to the TP9012 family only.)

  # TP9012 family (TP90XConfig, deviceType 7/8)
  - uuid: "0B863E05-BA64-4F7A-922D-007FD52DCAA9"
    name: ThermoPro TP9012-Family Service
    characteristics:
      - uuid: "0000FFF1-0000-1000-8000-00805F9B34FB"
        name: Command Write
        properties: ["write"]
        description: >
          Client → device command channel, 0xAA | payload | checksum | 0xFF
          framed (checksum = sum of payload bytes EXCLUDING the opcode, &
          0xFF — TP9012Data.getIntCheckSum). This wrapper is TP9012-only.
      - uuid: "0000FFF2-0000-1000-8000-00805F9B34FB"
        name: Notification
        properties: ["notify"]
        description: "Notifications mirror the write side: 0xAA at offset 0, opcode at offset 1."

  # TP922 (TP922Config, deviceType 22)
  - uuid: "BAAAFFF0-0001-4E6E-886A-57D347C919FE"
    name: ThermoPro TP922 Service
    characteristics:
      - uuid: "BAAAFFF1-0001-4E6E-886A-57D347C919FE"
        name: Command Write
        properties: ["write"]
        description: "Client → device command channel."
      - uuid: "BAAAFFF2-0001-4E6E-886A-57D347C919FE"
        name: Notification
        properties: ["notify"]
        description: "Device → client notifications."

  # TP940 (deviceType 24) and TempSpike TP960 (deviceTypes 30/31) —
  # write/notify roles are REVERSED relative to the other families.
  - uuid: "93bb7cab-eb14-c5a9-2354-a24f4df9330f"
    name: ThermoPro TP940 / TempSpike TP960 Service
    characteristics:
      - uuid: "0000FF02-0000-1000-8000-00805F9B34FB"
        name: Command Write
        properties: ["write"]
        description: "Client → device command channel (raw opcode bytes, no wrapper, no checksum). NOTE: on this service FF02 is the WRITE characteristic."
      - uuid: "0000FF01-0000-1000-8000-00805F9B34FB"
        name: Notification
        properties: ["notify"]
        description: "Device → client notifications, opcode at offset 0. NOTE: on this service FF01 is the NOTIFY characteristic."
      - uuid: "0000FF03-0000-1000-8000-00805F9B34FB"
        name: Read
        properties: ["read"]
        description: "Additional read characteristic (tp960ReadUUID, MyBleManager.java)."

  # TP426 infrared (TP426Config, deviceType 50)
  - uuid: "0F86FFF0-63E8-4762-9DFB-7B6FE113376A"
    name: ThermoPro TP426 Infrared Service
    characteristics:
      - uuid: "0F86FFF1-63E8-4762-9DFB-7B6FE113376A"
        name: Command Write
        properties: ["write"]
        description: "Client → device command channel."
      - uuid: "0F86FFF2-63E8-4762-9DFB-7B6FE113376A"
        name: Notification
        properties: ["notify"]
        description: "Device → client notifications."

  # DFU mode (DfuConfig)
  - uuid: "00001850-0000-1000-8000-00805F9B34FB"
    name: ThermoPro DFU Service
    characteristics:
      - uuid: "00002C00-0000-1000-8000-00805F9B34FB"
        name: DFU Write
        properties: ["write"]
        description: "DFU-mode command write."
      - uuid: "00002C01-0000-1000-8000-00805F9B34FB"
        name: DFU Notification
        properties: ["notify"]
        description: "DFU-mode notifications."

  # Vendor OTA profiles (OtaConfig) — two SoC families with bundled firmware.
  - uuid: "0917fe11-5d37-816d-8000-00805f9b34fb"
    name: ASR560X OTA Service
    characteristics:
      - uuid: "09170001-5d37-816d-8000-00805f9b34fb"
        name: OTA Write
        properties: ["write"]
        description: "ASR560X OTA image write. Bundled firmware: res/raw/ast6s53_v25_ota.bin (version 2.5)."
      - uuid: "09170002-5d37-816d-8000-00805f9b34fb"
        name: OTA Notification
        properties: ["notify"]
        description: "ASR560X OTA notifications."
  - uuid: "1d14d6ee-fd63-4fa1-bfa4-8f47b42119f0"
    name: Silicon Labs OTA Service
    characteristics:
      - uuid: "f7bf3564-fb6d-4e53-88a4-5e37e0326063"
        name: OTA Control
        properties: ["write"]
        description: "Silicon Labs OTA control point — the app writes an OTA_CONTROL_START command here (MyBleManager.java:552,633). Bundled firmware: res/raw/ota_hpyke25_2101_v117 (version 1.17)."
      - uuid: "984227f3-34fc-4045-a5d0-2c581f81a153"
        name: OTA Data Write
        properties: ["write"]
        description: "Silicon Labs OTA data write."

device_families:
  - model: TP9012
    description: Basic 2-probe BBQ thermometer (app code family — "TP9012" may be an internal/OEM designation; no retail page found)
    probe_count: 2
    temperature_encoding: nibbles
    temperature_encoding_detail: "(byteHigh << 4) + byteLow °C — TP9012ChangeUtils.getProTemp, NO /10. Sentinels: 0xFF,0x9C → -999.0; 0xDD,0xDD → -100.0; 0xEE,0xEE → 666.0"
    command_opcodes:
      - code: 0xB0
        name: DEVICE_CHECK
        description: Device discovery/check write and reply (write is {-80})
      - code: 0xB1
        name: SETTING_TEMP
        description: Write per-probe meat/target temp settings (TP9012Data.settingTemp, bArr[0] = 0xB1)
      - code: 0xB2
        name: TEMP_AND_BATTERY_UPLOAD
        description: Temperature and battery status upload
      - code: 0xB3
        name: REMOVE_ALARM
        description: Clear probe alarm (write {-77, 1})
      - code: 0xB5
        name: SETTING_TEMP_UNIT
        description: Write temp unit C/F (TP9012Data.settingTempUnit, bArr[0] = 0xB5)
    data_format:
      temp_upload:
        - byte_offset: 0
          size: 1
          name: frame_header
          value: 0xAA
        - byte_offset: 1
          size: 1
          name: opcode
          value: 0xB2
        - byte_offset: 2
          size: 2
          name: probe1_temp_raw
          description: "(high << 4) + low °C"
        - byte_offset: 4
          size: 2
          name: probe2_temp_raw
          description: "(high << 4) + low °C"
        - byte_offset: 6
          size: 1
          name: battery_raw
          description: "battery percent = 100 - 33 * raw"
        - byte_offset: 7
          size: 1
          name: alarm_flags

  - model: TP940
    description: 4-probe (+ambient slot) BBQ thermometer with meat temperature settings
    probe_count: 4
    temperature_encoding: bcd
    temperature_encoding_detail: >
      BCD: temp = (b1>>4)*100 + (b1&0x0F)*10 + (b2>>4) + (b2&0x0F)*0.1 °C;
      negative when the high nibble of b1 is 0x9 (subtract 1000). Disconnect
      sentinel 0xCC,0xCC → -999.0 (TP940ChangeUtils.getProTemp). The TP920/
      TP25W family uses the same BCD digit layout but DIFFERENT sign/sentinel
      handling — sign = bit 0x80 of b1, sentinels 0xFF,0xFF → -999.0 /
      0xDD,0xDD → -100.0 / 0xEE,0xEE → 666.0 (TP920DataChangeUtils.
      getProTemp:654-665) — which is also the scheme thermopro-cli's
      decode_temperature implements, so the CLI is a valid reference for
      TP920 but NOT for TP940's sign/sentinels. TempSpike TP96x does not
      use BCD at all (u16 LE − 30, see the TP960 family below).
    features:
      - meat_temp_target_setting
      - temp_unit_change (C/F)
      - alarm_per_probe
      - probe_disconnect_detection (-999.0°C sentinel)
    protocol_notes: |
      Per-probe push notifications (tempReturn opcodes 0x61/0x10, probe index
      in byte 1) — there is NO polling state machine on this family; the
      setTemp(0..3) sequential-probing flow belongs to TP980. Other opcodes:
      0x02 unit, 0x04 alarm setting, 0x05 alarm close, 0x06 device close,
      0x67 color. Battery: raw×33 for both probes and box
      (TP940ChangeUtils.java:81,97,117) — note this is the INVERSE of the
      TP9012 formula (100 − 33×raw).

  - model: TP960 (TempSpike)
    description: TempSpike wireless single-probe spike + base station — the current retail focus (scan names TP960R, TP960W, I61, I61W)
    probe_count: 1
    temperature_encoding: u16le_minus_30
    temperature_encoding_detail: >
      Connected mode: u16 LE minus 30 °C (temp = raw - 30;
      TP960ChangeUtils.getProTemp:242+) — the SAME encoding as the TP96x
      passive-advertisement layout, NOT the TP940 BCD scheme. Sentinels:
      0xFF,0xFF → -999.9, and raw - 30 ≤ -30 → -999.9. Passive mode layout
      per TEMPSPIKE PASSIVE MODE in device.notes.
    features:
      - passive_advertisement_decoding (preferred — no connection needed)
      - temperature_history_upload
      - temp_unit_change (C/F)
      - per_probe_alarm
      - probe_color_setting
    protocol_notes: |
      CONNECTED-MODE opcodes (spec previously had no TP96x GATT block despite
      being named "tempspike"). Service 93bb7cab-…, write FF02 / notify FF01,
      raw frames with NO checksum. Notifications (opcode at offset 0,
      TP960ChangeUtils.java:90-91): 0x01 current temp, 0x02 history upload
      first frame, 0x05 low battery upload, 0x06 box battery upload, 0x10
      auto temp return, 0x11 low battery (alt), 0x12 probe connect upload,
      0x13 temp alarm close, 0x14 ambient temp alarm close. Writes
      (TP960Data): 0x01 read temp, 0x02 read temp history, 0x03 auto-
      notification on/off, 0x04 set probe temp alarm (°C and °F variants),
      0x05 read battery state, 0x06 read battery (TP962), 0x15 set ambient
      temperature alarm, 0x19 set temp unit, 0x1A read probe color. Battery:
      u16 LE millivolt bands <2311 → 0%, 2311-2450 → 33%, 2451-2600 → 66%,
      ≥2601 → 100% (TP960ChangeUtils.getBattery:255-263); passive ads use the
      fitted tanh curve instead (see device.notes).

  - model: TP962 / TP968 (TempSpike variants)
    description: TempSpike multi-probe variants (scan names TP962R, TP963, TP965R, TP966R)
    probe_count: 2
    temperature_encoding: u16le_minus_30
    temperature_encoding_detail: "Same u16 LE − 30 °C encoding as TP960 (TP962ChangeUtils.getProTemp, TP968ChangeUtils.getProTempC/getProTemp); sentinel 0xFF,0xFF → -999.9."
    features:
      - passive_advertisement_decoding
      - sequential_multi_probe_read
    protocol_notes: |
      Same service/framing as TP960 but a WIDER notification dispatch
      (TP962ChangeUtils.java:95-115, TP968ChangeUtils.java) adding a
      sequential setTemp-probing state machine: 0x81 readNextProTemp,
      0x04/0x84 setTempReturn, 0x06/0x16 box battery, 0x09/0x89 setUnitReturn,
      plus 0x10 auto temp, 0x12 probe connect, 0x13/0x14 alarm close, 0x17
      charge state change, 0x18 device close, 0x19 temp unit change, 0x1A
      probe color check.

  - model: TP980
    description: Pro-grade 4-probe thermometer with history upload and WiFi uplink (TP980/TP980W sold as Wi-Fi + Bluetooth models)
    probe_count: 4
    temperature_encoding: ieee754_float32
    temperature_encoding_detail: >
      IEEE 754 float32 read LITTLE-ENDIAN (Nordic Data.FORMAT_UINT32) at
      offsets 5/9/13 (tp980TempReturn). The wire value is °F with a +54
      offset: convert via fToC(raw - 54) — the same
      fahrenheit_to_celsius(x - 54) the thermopro-ble parser applies for
      TP97x.
    features:
      - temperature_history_upload
      - temp_unit_change
      - per_probe_target_temp
      - sequential_multi_probe_read
      - wifi_uplink_and_cloud_binding
    protocol_notes: |
      History upload: multi-chunk transfer with a first frame (opcode 0x02)
      and continuation frames, 6 bytes/record. Probe reading uses the
      setTemp(0..3) / readNextProTemp sequential state machine
      (TP980ChangeUtils — an earlier revision of this spec misattributed it
      to TP940). Notification opcodes (TP980ChangeUtils.java:115): 0x11 temp
      return, 0x12 probe connect, 0x13 temp alarm close, 0x14 ambient temp
      alarm close, 0x17 charge state change, 0x18 device close, 0x19 temp
      unit change, 0x1A probe color check, 0x20 temp auto-return, and
      decimal 80-84 = 0x50-0x54 for WiFi scan/connect/check plus cloud
      binding (did, boundUser). Battery: u16 LE millivolt bands <2311 → 0%,
      2311-2450 → 33%, 2451-2600 → 66%, ≥2601 → 100%
      (TP980ChangeUtils.getBattery:477-484).

advertising:
  discovery_method: service_uuid_and_name
  local_name_prefixes:
    - "TP940R"
    - "TP980R"
    - "TP960R"
    - "Thermopro"
    - "SmartBBQ"
  notes: >
    Exact advertised names from ScanConfig.java, grouped as: thermoproNames
    (Thermopro, TP901, TP902, TP922, TP939, TP938, P900, TP903, TP904, TP25,
    TP910, TP920, TP930, TP923, TP924), tempSpike (TP960R, TP962R, I61,
    TP970R, TP960W, I61W, TP971R/972R, TP963, TP971S/972S, TP973R, TP965R,
    TP966R), tp940 (TP940R), tempWifi (TP980R), infrared (P426, P925), plus
