http_endpoints:
  - method: "GET"
    path: "/query/device-info"
    name: "Device Info"
    description: >
      XML device identity, model, user display name, serial, device-id,
      network type, and software version. Roku OS 15.0 adds
      supports-tv-power-control and supports-audio-volume-control on
      streaming players.
    response_body:
      content_type: "application/xml"
  - method: "GET"
    path: "/query/apps"
    name: "Installed Apps"
    description: >
      XML list of installed Roku channels and launchable app IDs. Dropped from
      the current official ECP doc's command table but still live on-device
      (used by python-rokuecp / Home Assistant).
    response_body:
      content_type: "application/xml"
  - method: "GET"
    path: "/query/active-app"
    name: "Active App"
    description: >
      Current foreground app and active media context. Dropped from the
      current official ECP doc's command table but still live on-device.
    response_body:
      content_type: "application/xml"
  - method: "GET"
    path: "/query/media-player"
    name: "Media Player"
    description: "Playback state, position, duration, and media metadata when available."
    response_body:
      content_type: "application/xml"
  - method: "POST"
    path: "/keypress/{key}"
    name: "Keypress"
    description: >
      Send a remote-control key such as Home, Back, Select, Up, Down, Left,
      Right, Play, Rev, or Fwd. TV input switching also lives here:
      InputHDMI1-InputHDMI4, InputTuner, InputAV1. Since Roku OS 14.1 this
      endpoint requires Settings > System > Advanced system settings >
      "Control by mobile apps" = Enabled.
  - method: "POST"
    path: "/launch/{app_id}"
    name: "Launch App"
    description: "Launch an installed Roku app by app ID from /query/apps."
  - method: "POST"
    path: "/search/browse?keyword={keyword}"
    name: "Search Browse"
    status: "sunset"
    description: >
      SUNSET: Roku removed the search ECP command as of Roku OS 12.0 (notice
      in the official ECP doc). It worked on firmware 7.5-11.x only and is
      gone on the observed OS 15.2.4 fleet; retained here for older firmware.
  - method: "POST"
    path: "/input?{name}={value}"
    name: "Custom Input"
    description: >
      Query-string sensor/custom-input channel forwarded to the running app
      (e.g. POST /input?acceleration.x=0.0&acceleration.y=0.0), per the
      official ECP doc. It takes no {source} path segment and does NOT switch
      TV inputs — input switching is POST /keypress/InputHDMI1..4,
      InputTuner, or InputAV1.

entities:
  - platform: "sensor"
    name: "Active App"
    state_topic: "/query/active-app"
  - platform: "sensor"
    name: "Media Player"
    state_topic: "/query/media-player"
  - platform: "select"
    name: "Input Source"
    commands:
      # TV input switching uses keypress keys InputHDMI1-4, InputTuner, InputAV1.
      select_option: "/keypress/{input_key}"

