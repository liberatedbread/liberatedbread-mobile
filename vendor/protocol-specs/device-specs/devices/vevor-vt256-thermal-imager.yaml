evidence:
  artifacts:
    - type: "static_analysis"
      artifact: "com.htimeter.w01 v1.1.4 (versionCode 101004, built 2024-09-04) — store name 'W01' / 'HT-W01'"
      sha256: "219010668b155e5bd125cd7e0c17376ecc8b58d21256b3669c38adfb7183e477"
      obtained_via: "the OEM's own download page — the page Vevor's product QR decodes to, 2026-08"
      description: >
        Static analysis of the OEM's "W01" companion app (2026-08) — the source
        of every protocol fact in this spec. Its W01 configuration gave the
        RTSP URL rtsp://192.168.1.10:654/test.264, the TCP 8080 command port,
        the UDP 8888 thermal stream and the 256x192 / 640x480 frame sizes; its
        generic command-protocol layer gave the frame layout (0xFB magic, LE
        length = total-3, cmdType at byte 5, data unit at offset 23) and the
        CRC-16 (poly 0x1021, init 0x0000, low byte first on the wire); its
        command tables gave the Type/Code/Param sets, the per-parameter GET/SET
        encoders and the palette/range/channel/action enums; and its stream
        processor gave the UDP markers (FB FC / FC FB thermal, FB FE / FE FB
        temperature), the local bind port 8090 and the 49163-byte buffer.
        Network/storage permissions only; no cloud endpoints anywhere in it.
        Example frames in `commands` were generated by re-implementing the
        framing code in a scratch script, so they are internally consistent
        with the app but unverified against hardware.
    - type: "vendor_documentation"
      url: "https://manuals.plus/asin/B0FV77VZP9"
      notes: "Vevor-branded 'HT-W01 Thermal Imager Camera' manual (YXP160/YXP256/VT256): AP SSID HT-W01-*, passphrase 12345678, Wi-Fi connection model. sha256 48b4b1c1f09baa40c63d3e29ba70806a54aa583bcb7d6cee8a712d8e97e7ba6e for the Vevor product-page PDF the app QR was decoded from."
    - type: "vendor_documentation"
      url: "https://hti-instrument.com/products/ht-w01-wifi-thermal-imaging-camera-256-192"
      notes: "OEM hardware specifications (detector class, ranges, visible camera)."
