evidence:
  artifacts:
    - type: "static_analysis"
      artifact: "com.ewavemobile.silkn (Hair Removal – Silk'n) v6.1 (versionCode 38), targetSdk 33"
      sha256: "dba1533c81e9edaad81949b302e9eb4be9dc2c2e49775f1410ae0cca2dfa39da"
      obtained_via: "third-party APK mirror (APKPure via apkeep), 2026-08-29"
      description: >
        Static analysis of the companion app (2026-08). Source of every
        protocol fact here: the exact-match scan filter on the three
        advertised names, the primary service and its five synthetic
        characteristics, both TreatmentDynamicInformation layouts and their
        name-based selection, the DeviceErrors code range, the 2-byte
        lock/unlock semantics and the app's lock-on-disconnect behaviour, the
        every-20-pulses color-sensor poll, the cloud hosts, and the negative
        findings — no bonding or auth anywhere, no write path to flash firing
        or intensity, no billing/paywall code, no OTA/DFU path.
    - type: "not_examined"
      description: >
        No hardware unit, HCI capture or third-party implementation was
        available. The ~40 device user-manual PDFs bundled in the app's
        assets were noted as a manual source but not mined for this spec.
