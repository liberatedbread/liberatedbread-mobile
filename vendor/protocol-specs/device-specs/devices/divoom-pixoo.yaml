device:
  name: Divoom Pixoo WiFi
  manufacturer: Divoom
  manufacturer_status: active
  protocol: wifi
  model: pixoo64_wifi
  notes: "WiFi-connected RGB LED pixel-matrix display. Displays static images, animations\
    \ (GIF-like), scrolling text, clock faces, EQ visualizer, and cloud gallery content.\
    \ Cloud-mediated device discovery: the device registers itself with Divoom's servers;\
    \ the app fetches the device IP from the cloud API, then communicates locally\
    \ via HTTP on port 9000.\nPIXEL ENCODING: Multiple encoding types identified by\
    \ a leading type byte (see pixel_encodings section). 16x16 uses raw or AES-128-CBC\
    \ (hardcoded key — obfuscation, not compression). 64x64 uses per-frame LZO (type\
    \ 25), NDK PixelEncode64 (type 26) or ZSTD (type 37); 128x128 uses NDK\
    \ PixelEncode128 — the NDK algorithm lives in libtimebox.so, not the decompiled\
    \ Java.\nCOMMUNICATION:\
    \ Three channels in priority order:\n  1. Local HTTP (same LAN) → POST http://<ip>:9000/divoom_api\n\
    \  2. MQTT (same LAN, fallback) → topics not fully analyzed\n  3. Remote (cloud\
    \ relay) → POST to Divoom cloud, device polls\n\nThe device also exposes Divoom's\
    \ official documented third-party local API at POST http://<ip>:80/post (no\
    \ LocalToken; docs at docin.divoom-gz.com) — see http_endpoints.\n\nDEVICE TYPES: Pixoo64 (64x64),\
    \ Pixoo16 (16x16), Pixoo Max, Pixoo VJ, LCD 5-panel WiFi, and photo frame variants.\
    \ Pixel matrix dimensions and supported encoding formats vary by model.\nEVIDENCE\
    \ MAP:\n  HttpCommand.java — all API command paths and cloud server URLs\n  OkHttpUtils.java:264-271\
    \ — local HTTP endpoint construction\n  W2/c.java — pixel encoding types, headers,\
    \ compression\n  BaseRequestJson.java — JSON request envelope format\n  DeviceGetListResponse.java\
    \ — device list structure (IP, token, type)\n  Constant.java — device name prefixes,\
    \ supported models\n  DeviceFunction.java — device type enum, feature flags\n\
    \  DesignSendModel.java — send priority, HTTP/MQTT/Remote flow\n\n\nDiscovery:\
    \ No local discovery protocol (no UDP broadcast, mDNS, or BLE scan). Device registers\
    \ with Divoom cloud; app queries Device/GetListV2 to get device IP and metadata.\n"
  identification:
    local_name_prefix: Pixoo16-WiFi,Pixoo16WiFi,Pixoo64,Di-Da
    local_name_contains:
    - PixooLCDWIFI
  setup:
    required: true
    confidence: high
    notes: 'The Pixoo must be provisioned onto WiFi via the Divoom app (BLE or Bluetooth-assisted).
      Once on WiFi, it registers with Divoom cloud. A replacement controller must
      also authenticate with Divoom cloud (UserLogin) to obtain Token/UserId, then
      call Device/GetListV2 to discover the device and its LocalToken. The LocalToken
      is required for all local HTTP commands.

      '
    methods:
    - type: cloud_account
      verified: false
      description: '1. Authenticate with Divoom cloud (UserLogin) to get Token + UserId.
        2. Call Device/GetListV2 to get device IP and LocalToken. 3. Send commands
        to http://<device_ip>:9000/divoom_api with LocalToken.

        '
      cloud:
        provider: Divoom
        local_alternative: >
          Partial. Once provisioned, all commands go to the device directly over
          HTTP on port 9000 — no cloud round-trip per command. But the LocalToken
          those commands carry is only obtainable from Divoom's cloud via
          Device/GetListV2, so the cloud is a one-time dependency, not an
          ongoing one. Cache the LocalToken and local control survives Divoom
          going away; lose it and there is no known way to re-derive it locally.
          WiFi provisioning itself is Bluetooth-assisted through the Divoom app
          and has no documented offline path.
      steps:
      - action: Authenticate with Divoom cloud API to obtain UserId and Token.
        actor: client
        request:
          protocol: http
          url: https://appin.divoom-gz.com/UserLogin
      - action: Call Device/GetListV2 to discover device IP and LocalToken.
        actor: client
        request:
          protocol: http
          url: https://appin.divoom-gz.com/Device/GetListV2
      - action: Send JSON commands to http://<DevicePrivateIP>:9000/divoom_api.
        actor: client
        request:
          protocol: http
          url: http://{DevicePrivateIP}:9000/divoom_api
    factory_reset:
      confidence: medium
      effect: 'Clears WiFi credentials and cloud binding. Device returns to provisioning
        mode (advertises Bluetooth for setup).

        '
      procedures:
      - name: Button reset
        steps:
        - action: Hold the reset/power button for 10+ seconds until LED flashes.
          actor: user
          expect: Device enters provisioning mode.
      - name: Cloud unbind + power cycle
        steps:
        - action: Call Device/Unbind via cloud API, then power-cycle the device.
          actor: client
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: 'Device stays connected to WiFi. A new controller just needs cloud auth
        + Device/GetListV2 to get the current LocalToken. No pairing or bonding required.

        '
    credentials:
      wifi_passphrase_protection: unknown
      stored_on_device:
      - WiFi SSID
      - WiFi passphrase
      issued_to_client:
      - UserId
      - Token
      - LocalToken
      notes: 'Cloud auth (UserId/Token) required to discover device and obtain LocalToken.
        LocalToken is rotated by the cloud and must be current for local HTTP commands.
        WiFi credentials are only stored on device.

        '
  variants:
  - model: pixoo16_wifi
    identification:
      local_name_prefix: Pixoo16-WiFi,Pixoo16WiFi
    notes: 16x16 pixel matrix. Device type >= 200 in cloud API. Current firmware
      200033 (2026-07, via unauthenticated Device/GetUpdateFileV3).
    pixel_width: 16
    pixel_height: 16
    bytes_per_frame: 768
  - model: pixoo64_wifi
    identification:
      local_name_prefix: Pixoo64,Di-Da
    notes: 64x64 pixel matrix. Most common Pixoo WiFi model. Device type < 92.
      Current firmware 90224 (2026-07, via unauthenticated Device/GetUpdateFileV3).
    pixel_width: 64
    pixel_height: 64
    bytes_per_frame: 12288
  - model: pixoo64_wifi_v2
    identification:
      local_name_prefix: Pixoo64
    notes: 64x64 v2. Device type == 92 in cloud API. Current firmware 92079
      (2026-07).
    pixel_width: 64
    pixel_height: 64
  - model: pixoo64_wifi_5g
    identification:
      local_name_prefix: Pixoo64
    notes: 64x64 with 5GHz WiFi. Device type >= 96 in cloud API. Current
      firmware 96022 (2026-07).
    pixel_width: 64
    pixel_height: 64
pixel_encodings:
- type_byte: 1
  name: Pic11
  description: 11x11 static picture, raw RGB data
  dimensions:
  - 11
  - 11
  bytes_per_frame: 363
  compression: none
  header:
  - offset: 0
    length: 1
    name: type
    value: 1
  - offset: 1
    length: 363
    name: pixel_data
    description: 363 bytes raw RGB (11×11×3)
- type_byte: 2
  name: Ani11
  description: 11x11 animation, raw RGB frames
  dimensions:
  - 11
  - 11
  bytes_per_frame: 363
  compression: none
  header:
  - offset: 0
    length: 1
    name: type
    value: 2
  - offset: 1
    length: 1
    name: frame_count
  - offset: 2
    length: 1
    name: speed_hi
  - offset: 3
    length: 1
    name: speed_lo
  - offset: 4
    length: -1
    name: frames
    description: frame_count × 363 bytes raw RGB
  notes: 'Header order corrected 2026-07 (count first, then speed): W2/c.java:80-82,
    app v3.8.22.

    '
- type_byte: 3
  name: Pic16
  description: 16x16 static picture, raw RGB data
  dimensions:
  - 16
  - 16
  bytes_per_frame: 768
  compression: none
  confidence: high
- type_byte: 4
  name: Ani16
  description: 16x16 animation, raw RGB frames (uncompressed)
  dimensions:
  - 16
  - 16
  bytes_per_frame: 768
  compression: none
  header:
  - offset: 0
    length: 1
    name: type
    value: 4
  - offset: 1
    length: 1
    name: frame_count
  - offset: 2
    length: 1
    name: speed_hi
  - offset: 3
    length: 1
    name: speed_lo
  - offset: 4
    length: -1
    name: frames
  notes: 'Header order corrected 2026-07 (count first, then speed): W2/c.java:80-82,
    app v3.8.22.

    '
- type_byte: 8
  name: Pic16AES
  description: 16x16 static picture, AES-128-CBC encrypted (hardcoded key/IV
    compiled into the app — obfuscation, not compression; output is padded to
    a 16-byte multiple). Corrected 2026-07 from "ZSTD" — W2/c.java:864-882
    and W2/a.java, app v3.8.22.
  dimensions:
  - 16
  - 16
  bytes_per_frame: 768
  compression: aes-128-cbc
- type_byte: 9
  name: Ani16AES
  description: 16x16 animation, AES-128-CBC encrypted frames (same hardcoded-key
    mechanism as type 8). Corrected 2026-07 from "ZSTD" — W2/c.java:301-320,
    app v3.8.22.
  dimensions:
  - 16
  - 16
  bytes_per_frame: 768
  compression: aes-128-cbc
- type_byte: 12
  name: Scroll
  description: Scrolling text/image
  dimensions:
  - 16
  - 16
  compression: aes-128-cbc
  header:
  - offset: 0
    length: 1
    name: type
    value: 12
  - offset: 1
    length: 1
    name: scroll_mode
    description: 0=left, 1=right, or ScrollModeEnum value
  - offset: 2
    length: 1
    name: speed_hi
  - offset: 3
    length: 1
    name: speed_lo
  - offset: 4
    length: -1
    name: encrypted_data
    description: AES-128-CBC encrypted scroll bitmap (hardcoded key)
  notes: 'Corrected 2026-07: header order is [12, scroll_mode, speed_hi,
    speed_lo] and the payload is AES-128-CBC, not LZO — W2/c.java:989-1003,
    app v3.8.22.

    '
- type_byte: 25
  name: Pixoo64LZO
  description: 64x64 picture/animation, per-frame LZO compressed
  dimensions:
  - 64
  - 64
  bytes_per_frame: 12288
  compression: lzo
  confidence: high
  header:
  - offset: 0
    length: 1
    name: type
    value: 25
  - offset: 1
    length: 1
    name: frame_count
  - offset: 2
    length: 1
    name: speed_hi
  - offset: 3
    length: 1
    name: speed_lo
  - offset: 4
    length: 1
    name: row_cnt
  - offset: 5
    length: 1
    name: col_cnt
  - offset: 6
    length: -1
    name: frames
    description: 'Each frame: 4-byte LE length prefix + LZO-compressed data'
  notes: 'Corrected 2026-07: types 25/37 were swapped — type 25 is per-frame
    LZO (W2/c.java:491-515, app v3.8.22); the NDK PixelEncode64 encoding
    previously described here belongs to type 26.

    '
- type_byte: 26
  name: Pixoo64Multi
  description: 64x64 multi-frame animation, NDK-encoded
  dimensions:
  - 64
  - 64
  bytes_per_frame: 12288
  compression: ndk_proprietary
  confidence: medium
  header:
  - offset: 0
    length: 1
    name: type
    value: 26
  - offset: 1
    length: 1
    name: frame_count
  - offset: 2
    length: 1
    name: speed_hi
  - offset: 3
    length: 1
    name: speed_lo
  - offset: 4
    length: 1
    name: row_cnt
  - offset: 5
    length: 1
    name: col_cnt
- type_byte: 37
  name: Pixoo64ZSTD
  description: 64x64 picture/animation, ZSTD compressed (single blob)
  dimensions:
  - 64
  - 64
  bytes_per_frame: 12288
  compression: zstd
  confidence: high
  header:
  - offset: 0
    length: 1
    name: type
    value: 37
  - offset: 1
    length: 1
    name: frame_count
  - offset: 2
    length: 1
    name: speed_hi
  - offset: 3
    length: 1
    name: speed_lo
  - offset: 4
    length: 1
    name: row_cnt
  - offset: 5
    length: 1
    name: col_cnt
  - offset: 6
    length: -1
    name: data
    description: 4-byte LE length + single ZSTD-compressed blob + optional
      trailing text block
  notes: 'Corrected 2026-07: types 25/37 were swapped — type 37 is ZSTD
    (W2/c.java:383-426, app v3.8.22; 45 if circular), not LZO.

    '
- type_byte: 42
  name: TempUpload
  description: Temporary upload encoding (ZSTD compressed, 16x16)
  dimensions:
  - 16
  - 16
  compression: zstd
  header:
  - offset: 0
    length: 1
    name: type
    value: 42
  - offset: 1
    length: 1
    name: frame_count
  - offset: 2
    length: 1
    name: speed_hi
  - offset: 3
    length: 1
    name: speed_lo
  - offset: 4
    length: 1
    name: row_cnt
  - offset: 5
    length: 1
    name: col_cnt
  - offset: 6
    length: 4
    name: text_length
    endian: little
  - offset: 10
    length: -1
    name: variable
    description: '[text_data (text_length bytes)] [4-byte LE data_length] [ZSTD-compressed
      pixel data]'
entities:
- platform: light
  name: Pixel Display
  features:
  - brightness
  - effect
  state_endpoint: /divoom_api
  state_command: Channel/GetOnOff
  commands:
    turn_on: screen_on
    turn_off: screen_off
    set_brightness: set_brightness
- platform: sensor
  name: Device IP
  state_endpoint: cloud
  state_command: Device/GetListV2
  state_path: DeviceList[0].DevicePrivateIP
- platform: sensor
  name: WiFi SSID
  state_endpoint: cloud
  state_command: Device/GetListV2
  state_path: DeviceList[0].DeviceSSID
- platform: sensor
  name: Firmware Version
  state_endpoint: cloud
  state_command: Device/GetListV2
  state_path: DeviceList[0].DeviceVersion
http_endpoints:
- path: /divoom_api
  method: POST
  description: Primary local API endpoint for device commands
  name: divoom_api
- path: /post
  method: POST
  description: 'Official documented local API (Divoom third-party docs,
    docin.divoom-gz.com): plain JSON commands, no LocalToken required.
    Covers Channel/OnOffScreen, brightness, tools, Draw/SendHttpGif
    animation upload, Draw/CommandList (fw >= 90102) and Device/PlayTFGif
    (fw >= 90096). A 2026-05 documentation update adds a DeviceToken
    field, so newer firmware may start gating this endpoint.'
  name: post_api
