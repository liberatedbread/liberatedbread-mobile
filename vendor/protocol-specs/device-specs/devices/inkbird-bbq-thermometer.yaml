# Inkbird BLE BBQ Thermometer device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Inkbird BBQ Thermometer (BLE)"
  manufacturer: "Inkbird"
  manufacturer_status: "unsupported"
  protocol: "ble"
  notes: >
    Covers Inkbird BLE BBQ thermometers using direct BLE protocol:
    IBT-2X (BG-BT1X, 1 probe), IBT-4XS (4 probes), IBT-6X (6 probes),
    IBBQ-4BW (4 probes + WiFi via Tuya), and related models.

    Official Android app: com.inkbird.inkbirdapp v2.1.9, decompiled from
    APKPure XAPK. Protocol reverse-engineered from decompiled Java/Kotlin
    sources under com/inkbird/inkbirdapp/device/bbq4bw/ and
    com/inkbird/inkbirdapp/device/bgbt1x/.

    The app uses two BLE stacks: direct BLE (InkBluetoothManager) for BBQ
    thermometers, and Tuya/Thing Smart BLE SDK for newer devices. This spec
    documents the direct BLE protocol.

    All protocol UUIDs use template 0000ffXX-0000-1000-8000-00805f9b34fb.
    Service is 0000ff00. Temperature data is little-endian signed 16-bit
    integers raw in device units; the unit (°F or °C) must be queried
    separately via command 04.

    Error values: 0x7ffe, 0x7fff, 0x8000 indicate probe disconnected/fault.

    Newer firmware advertises different local names: a real 2025-era IBT-2X-B
    advertises "Inkbird@IBT-2X-B" (ble_monitor issue #1443), which none of the
    classic prefixes match — "Inkbird@" is included in the prefix lists.

    Connection requires a handshake: BG-BT1X uses fixed code fea1b2c3e40000
    (an alternate fixed frame fea1b2c3e4f5f5 is written by the config
    activity — BBQ1xBleConfigActivity.java:67); BBQ-4BW uses challenge-response
    whose verify-code algorithm is fully recovered: deterministic sqrt/mod/pow
    math on the 6-byte challenge (no timestamp, no CRC) producing the 12-hex
    response after fc — device/bbq4bw/utils/BBQ4tBwHelper.java:109-132.

    CAVEAT — two incompatible BLE protocol families ship under the same model
    names: IBT-2X / IBT-4XS also exist on the older 0xfff0 "iBBQ/EasyBBQ"
    binary protocol (chars fff1-fff5, fixed-credentials login, s16le temps in
    0.1 °C — uucidl ibbq-thermometer-protocol gist, gleeds/cloudbbq; covered
    by the sibling spec ibbq-meat-thermo, app com.inkbird.ibbtgo). Discovery
    must key on the advertised service UUID (ff00 vs fff0), not the name.

    The ASCII-hex 14-char framing documented here is specific to the BBQ line.
    The INT-12-BW / INT-14-BW variant uses binary <LEN><TYPE>[PAYLOAD] framing
    on ff02 with temps in 0.1 °C and a different auth (01 fb challenge →
    response = LE16 ms + LE32 unix time + two-stage CRC-8) — recovered by
    paul43210/inkbird-bw-ble (17 captured test vectors in auth/python/auth.py).

    No BLE pairing/bonding required; all commands work over unencrypted
    BLE GATT.

    Schema gaps (device-specs/schema.json not modified): no dedicated field
    for byte-order notation, signed vs unsigned field typing, multi-byte
    reverse-endian bitfields, or challenge-response auth flows. These are
    documented in notes and field annotations.

  identification:
    local_name_prefixes: ["BG-BT1X", "IBBQ-4BW", "BBQ-4BW", "IBT-4XS", "IBT-2X", "IBT-24S", "IBT-26S", "Inkbird@"]
    service_uuids:
      - "0000ff00-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            values:
              - "BG-BT1X"
              - "IBBQ-4BW"
              - "BBQ-4BW"
              - "IBT-"
              - "Inkbird@"
          service_uuids:
            - "0000ff00-0000-1000-8000-00805f9b34fb"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning, pairing, or account required for BLE-only operation.
      Simply scan, connect, optionally perform the handshake, and read
      temperature data. WiFi-enabled variants (IBBQ-4BW) also work over
      BLE without WiFi setup.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Scan for the Inkbird device by name prefix, connect, and read
          GATT characteristics directly. Optional handshake varies by model.
        ble:
          pairing_required: false
        steps:
          - action: "Power the thermometer on so it begins advertising."
            actor: user
          - action: "Scan for the Inkbird name prefix and connect to service 0000ff00."
            actor: client
          - action: >
              Perform the model's handshake: BG-BT1X takes the fixed code
              fea1b2c3e40000; IBBQ-4BW uses challenge-response with a
              verify-code calculation.
            actor: client
          - action: >
              Query the unit with command 04 before decoding — temperatures are
              raw little-endian signed 16-bit device units, and the same number
              means °F or °C depending on this setting.
            actor: client
            expect: >
              Temperature readings. 0x7ffe, 0x7fff and 0x8000 mean the probe is
              disconnected or faulty, not a real temperature.
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established. No reset command was recovered from the decompiled app,
        and the BLE side holds no credential or binding that a reset would
        clear — the handshake code is a fixed constant, not per-device state.
        The IBBQ-4BW's WiFi side is provisioned through Tuya and is out of scope
        for this spec, which documents the direct BLE protocol.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        No bond is held: any client may reconnect and repeat the handshake once
        the previous one disconnects. For the IBBQ-4BW, this covers BLE only —
        its WiFi credentials are managed by the Tuya stack.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        No WiFi passphrase crosses the BLE link documented here. The handshake
        codes are fixed constants shared by every unit of a model, not secrets:
        all commands run over unencrypted GATT, readable by anyone in range.
        WiFi provisioning on the IBBQ-4BW goes through the Tuya SDK, which this
        spec does not document.

services:
  - uuid: "0000ff00-0000-1000-8000-00805f9b34fb"
    name: "Inkbird Primary Service"
    characteristics:
      - uuid: "0000ff01-0000-1000-8000-00805f9b34fb"
        name: "temperature_data"
        properties: ["read", "notify"]
        description: "Multi-probe temperature data. Little-endian signed 16-bit integers per probe plus ambient."
        data_format:
          type: "binary"
          byte_order: "little_endian"
          encoding: "s16le"
          fields:
            - name: "probe_1_temp"
              bytes: [0, 1]
              type: "int16"
              signed: true
              description: "Probe 1 temperature in device unit (°C or °F). 0x7ffe/0x7fff/0x8000 = fault."
            - name: "probe_2_temp"
              bytes: [2, 3]
              type: "int16"
              signed: true
              description: "Probe 2 temperature. Fault values same as probe 1."
            - name: "probe_3_temp"
              bytes: [4, 5]
              type: "int16"
              signed: true
              description: "Probe 3 temperature (4+ probe models only)."
            - name: "probe_4_temp"
              bytes: [6, 7]
              type: "int16"
              signed: true
              description: "Probe 4 temperature (4+ probe models only)."
            - name: "probe_5_temp"
              bytes: [8, 9]
              type: "int16"
              signed: true
              description: "Probe 5 temperature (6-probe models only: IBT-6X, IBT-26S)."
            - name: "probe_6_temp"
              bytes: [10, 11]
              type: "int16"
              signed: true
              description: "Probe 6 temperature (6-probe models only: IBT-6X, IBT-26S)."
            - name: "ambient_temp"
              bytes: [-4, -3]  # last 2 bytes before padding: bytes 8-9 for 4-probe, 12-13 for 6-probe
              type: "int16"
              signed: true
              # AUDIT FLAG (2026-08): the [-4,-3] selector only lands on the
              # stated positions if a 2-byte padding trailer exists, but
              # model_variants.ff01_bytes (10 for 4-probe, 14 for 6-probe)
              # leaves no room for padding — which would make [-2,-1]
              # correct. The decompiled app parser slices per-probe 4-hex-char
              # groups and never bounds the frame length or reads ambient, so
              # the evidence cannot decide. Resolve with a real ff01 capture
              # from a 4-probe unit: 10 bytes → use [-2,-1]; 12 bytes →
              # ff01_bytes is wrong. Until then this selector is UNVERIFIED.
              description: "Device ambient temperature in device unit. Position varies by probe count: bytes (N*2, N*2+1) where N=probe_count."
        notes: >
          For 1-probe devices (BG-BT1X), only bytes 0-1 are valid.
          For 4-probe devices, bytes 0-9 (5 × int16: 4 probes + ambient).
          For 6-probe devices, bytes 0-13 (7 × int16: 6 probes + ambient).
          Error values: 0x7ffe, 0x7fff, 0x8000 indicate probe disconnected or fault.
          Raw values are in the device's configured temperature unit.

      - uuid: "0000ff02-0000-1000-8000-00805f9b34fb"
        name: "command_write"
        properties: ["write"]
        description: "Command write channel. All queries and settings are written here as 14-char (7-byte) hex strings."
        data_format:
          type: "hex_string"
          encoding: "ascii_hex"
          length: 14
          description: "7-byte command: 2-char type prefix + 12-char payload."
          commands:
            - name: "handshake_bgbt1x"
              hex: "fea1b2c3e40000"
              description: "Fixed handshake for BG-BT1X (IBT-2X)."
            - name: "handshake_bgbt1x_alt"
              hex: "fea1b2c3e4f5f5"
              description: "Alternate fixed BG-BT1X handshake frame written by the config activity (BBQ1xBleConfigActivity.java:67)."
            - name: "verify_request"
              hex: "fb000000000000"
              description: "Request challenge for BBQ-4BW verify."
            - name: "verify_response"
              hex_pattern: "fcXXXXXXXXXXXX"
              description: "Calculated verify response (12 hex chars after fc). Algorithm recovered: deterministic sqrt/mod/pow math on the 6-byte challenge, no timestamp/CRC (BBQ4tBwHelper.java:109-132)."
            - name: "get_target_temp"
              hex_pattern: "02XX0000000000"
              description: "Query target/alarm temps. XX = 2^(probeNum-1) as hex (01 for probe 1, 02 for probe 2, 04 for probe 3, 08 for probe 4)."
            - name: "get_temp_unit"
              hex: "04000000000000"
              description: "Query temperature unit."
            - name: "get_display_time"
              hex: "08000000000000"
              description: "Query display timer."
            - name: "get_temp_compensation"
              hex: "0a0f0000000000"
              description: "Query per-probe calibration offsets."
            - name: "get_sound_switch"
              hex: "0c000000000000"
              description: "Query sound/buzzer setting."
            - name: "get_firmware_version"
              hex: "0f000000000000"
              description: "Query firmware version."
            - name: "get_alarm_mode"
              hex: "11000000000000"
              description: "Query alarm mode and ring count."
            - name: "get_wifi_switch"
              hex: "13000000000000"
              description: "Query WiFi switch status."
            - name: "get_light_switch"
              hex: "16000000000000"
              description: "Query LCD backlight status."
            - name: "set_light_on"
              hex: "16010000000000"
              description: "Turn LCD backlight on."
            - name: "set_light_off"
              hex: "16000000000000"
              description: "Turn LCD backlight off."
            - name: "get_probe_color"
              hex: "17000000000000"
              description: "Query probe LED colors."
            - name: "set_probe_color"
              hex_pattern: "17XXXXXXXX0000"
              description: "Set probe LED colors (8 hex chars, 2 per probe)."

      - uuid: "0000ff03-0000-1000-8000-00805f9b34fb"
        name: "response_channel_a"
        properties: ["read", "notify"]
        description: "Response/event channel. Command query responses arrive here. 2-char type prefix + variable payload."
        data_format:
          type: "hex_string"
          encoding: "ascii_hex"
          description: "2-char response type prefix + variable-length payload."
          response_types:
            - prefix: "fb"
              description: "Verify challenge (12 hex chars). Triggers verify response calculation."
            - prefix: "fc"
              description: "Device status acknowledgment. Client should re-read ff04 after receiving this."
            - prefix: "01"
              description: "Target temp response (probe-specific). Payload: 2-char bitmask, 2-char mode, 4-char high temp LE, 4-char low temp LE."
            - prefix: "02"
              description: "Target temp response (alternate probe mask). Same payload format as 01."
            - prefix: "03"
              description: "Temp unit response. Payload byte 0: 0x46 = °F, else °C."
            - prefix: "04"
              description: "Temp unit response (alternate). Same as 03."
            - prefix: "07"
              description: "Display time response. Payload bytes 0-1 LE = seconds."
            - prefix: "08"
              description: "Display time response (alternate). Same as 07."
            - prefix: "09"
              description: "Temp compensation response. Per-probe signed byte offsets."
            - prefix: "0a"
              description: "Temp compensation response (alternate). Same as 09."
            - prefix: "0b"
              description: "Sound switch response. Payload: 0x11 = on, 0x5a = off."
            - prefix: "0c"
              description: "Sound switch response (alternate). Same as 0b."
            - prefix: "0f"
              description: "Firmware version response. Payload is ASCII hex."
            - prefix: "10"
              description: "Alarm mode response. Byte 0: 0x01=interval, 0x11=times; Byte 1: ring count."
            - prefix: "11"
              description: "Alarm mode response (alternate). Same as 10."
            - prefix: "12"
              description: "WiFi switch response. 0x01=on, 0x00=off."
            - prefix: "13"
              description: "WiFi switch response (alternate). Same as 12."
            - prefix: "14"
              description: "Light switch response. 0x01=on, 0x00=off."
            - prefix: "15"
              description: "Probe color response. 8 hex chars, 2 per probe."
            - prefix: "16"
              description: "Probe color response (alternate). Same as 15."
            - prefix: "fffe"
              description: "Device power-off notification."

      - uuid: "0000ff04-0000-1000-8000-00805f9b34fb"
        name: "device_status"
        properties: ["read", "notify"]
        description: "Device status bitfield. Multi-byte value; bytes must be reversed before interpreting as a bitfield."
        data_format:
          type: "binary"
          byte_order: "little_endian"  # bytes reversed vs wire order
          description: "Bitfield (after byte reversal)."
          notes: >
            The raw hex string must be byte-reversed before bit interpretation.
            Example: raw "a1b2c3" → reversed bytes "c3b2a1" → interpret bits of resulting integer.
          bitfield:
            - bit: 0
              name: "probe_1_alarm"
              description: "Probe 1 temperature alarm active."
            - bit: 1
              name: "probe_2_alarm"
            - bit: 2
              name: "probe_3_alarm"
            - bit: 3
              name: "probe_4_alarm"
            - bit: 4
              name: "probe_1_high_fault"
              description: "Probe 1 temperature exceeds high threshold."
            - bit: 5
              name: "probe_2_high_fault"
            - bit: 6
              name: "probe_3_high_fault"
            - bit: 7
              name: "probe_4_high_fault"
            - bit: 8
              name: "probe_1_low_fault"
              description: "Probe 1 temperature below low threshold."
            - bit: 9
              name: "probe_2_low_fault"
            - bit: 10
              name: "probe_3_low_fault"
            - bit: 11
              name: "probe_4_low_fault"
            - bit: 12
              name: "probe_1_sensor_fault"
              description: "Probe 1 sensor disconnected or shorted."
            - bit: 13
              name: "probe_2_sensor_fault"
            - bit: 14
              name: "probe_3_sensor_fault"
            - bit: 15
              name: "probe_4_sensor_fault"
            - bit: 16
              name: "device_temp_alarm_high"
              description: "Device ambient temperature high alarm."
            - bit: 17
              name: "device_temp_alarm_low"
              description: "Device ambient temperature low alarm."
            - bit: 18
              name: "charging"
              description: "Device is charging."
            - bit: 19
              name: "backlight"
              description: "LCD backlight is on."
            - bits: [20, 21, 22, 23, 24, 25]
              name: "wifi_status"
              description: "WiFi connection status for dual-mode devices."

      - uuid: "0000ff05-0000-1000-8000-00805f9b34fb"
        name: "response_channel_b"
        properties: ["read", "notify"]
        description: "Secondary response/event channel. Same protocol as ff03."
        data_format:
          type: "hex_string"
          encoding: "ascii_hex"
          description: "Same response format as ff03."

      - uuid: "0000ff06-0000-1000-8000-00805f9b34fb"
        name: "notifications_extra"
        properties: ["notify"]
        description: "Additional notification channel. Used during init sequence for notification enable on BBQ-4BW."

      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "battery_level"
        properties: ["read", "notify"]
        description: "Standard BLE battery level (0-100%)."
        data_format:
          type: "uint8"
          unit: "percent"
          min: 0
          max: 100

ble:
  connection_sequence:
    description: >
      BG-BT1X (1-probe): Connect → discover services → enable notify on ff01, ff03, ff05, 2a19 →
      write fea1b2c3e40000 to ff02 (handshake) → read ff01 for temperatures.

      BBQ-4BW (4-probe): Connect → discover services → enable notify on ff01, ff03, ff04, ff05, ff06 →
      write fb000000000000 to ff02 → receive 12-char challenge on ff03 →
      calculate verify response (recovered algorithm: BBQ4tBwHelper.java:109-132) →
      write fcXXXXXXXXXXXX to ff02 →
      read ff04 (status) → read ff01 (temps) → read 2a19 (battery) →
      query all settings (target temp per probe, unit, display time, compensation,
      sound, firmware, alarm, wifi, light, probe color).

advertising:
  format: "ble_legacy"
  local_name:
    match: "prefix"
    values: ["BG-BT1X", "IBBQ-4BW", "BBQ-4BW", "IBT-", "Inkbird@"]
  service_uuids:
    - "0000ff00-0000-1000-8000-00805f9b34fb"

data_format:
  temperature:
    encoding: "s16le"
    unit: "device_setting"
    fault_values: [0x7ffe, 0x7fff, 0x8000]
    error_strings:
      disconnected: "- -"
      high: "-H-"
      low: "-L-"
  battery:
    encoding: "uint8"
    unit: "percent"
    characteristic: "00002a19"

model_variants:
  - model: "IBT-2X / BG-BT1X"
    probes: 1
    wifi: false
    handshake: "fixed (fea1b2c3e40000)"
    ff01_bytes: 2
    notes: "Basic BLE-only single-probe thermometer."

  - model: "IBT-2X (2-probe mode)"
    probes: 2
    wifi: false
    ff01_bytes: 6
    notes: "Two-probe variant under IBT-2XB name."

  - model: "IBT-4XS"
    probes: 4
    wifi: false
    handshake: "challenge-response"
    ff01_bytes: 10
    notes: "BLE-only 4-probe thermometer."

  - model: "IBBQ-4BW / BBQ-4BW"
    probes: 4
    wifi: true
    handshake: "challenge-response"
    ff01_bytes: 10
    notes: "Dual-mode BLE+WiFi (Tuya platform) 4-probe thermometer."

  - model: "IBT-24S"
    probes: 4
    wifi: false
    ff01_bytes: 10
    notes: "4-probe variant."

  - model: "IBT-26S"
    probes: 6
    wifi: false
    handshake: "challenge-response"
    ff01_bytes: 14
    notes: "6-probe thermometer. Presumed same protocol with extended ff01 data."

  - model: "IBT-6X"
    probes: 6
    wifi: false
    handshake: "challenge-response"
    ff01_bytes: 14
    notes: "6-probe thermometer. Same protocol family."
