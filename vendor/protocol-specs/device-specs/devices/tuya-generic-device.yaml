# Tuya-Based Smart Device (UDP discovery, identify-only) — Device Spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources: Tuya LAN protocol reverse-engineering as published across the open
# ecosystem (tinytuya, localtuya, python-tuya) for the DISCOVERY beacon only —
# frame layout, the fixed broadcast key md5("yGAdlopoPVldABfn"), the gwId/ip/
# version/productKey fields — plus live hardware. No captured packet is
# committed (clean-room); the round-trip test in the Rust core builds its own
# frame. This spec deliberately covers IDENTIFICATION only; it does NOT carry
# the per-device local key that Tuya control requires, and does not describe a
# control surface.

device:
  name: "Tuya-Based Smart Device (Smart Life / white-label IoT)"
  manufacturer: "Various (Tuya IoT platform)"
  manufacturer_status: "active"
  testing:
    status: verified
    detail: minimally-verified
    notes: >
      Tuya discovery verified live 2026-08-16: a real device on the segment
      beaconed the encrypted (6667) datagram every ~10 s; decrypting it with the
      fixed broadcast key md5("yGAdlopoPVldABfn") (AES-128-ECB) yielded the
      self-description {"ip":..., "gwId":"03712560…", "version":"3.3",
      "productKey":"…", "active":2, "encrypt":true}, confirming the frame layout
      (prefix 00 00 55 aa, optional return code, ciphertext, CRC, suffix
      00 00 aa 55) and the field mapping. Identify-only: no control channel is
      opened — the per-device local key is not held — so the app shows a
      pictogram and a "set up in the vendor app" note. The Rust core's Tuya
      decrypt is covered by a round-trip unit test that builds its own frame.
  protocol: "wifi"
  category: "other"
  pictogram: "smart-device"
  transport: "udp"
  integration: "identify_only"
  notes: >
    Tuya is the IoT platform behind an enormous fraction of inexpensive
    white-label smart plugs, bulbs, switches, sensors and IR blasters — sold
    under hundreds of brand names and driven by the "Smart Life" / "Tuya Smart"
    apps. Every Tuya device beacons a small, self-describing UDP datagram to the
    broadcast address roughly every ten seconds: on port 6666 for protocol
    version 3.1 (plaintext JSON) and on port 6667 for 3.2+ (the same JSON under
    AES-128-ECB). It is a discovery beacon, NOT a control channel.

    This project DISCOVERS Tuya devices and identifies them; it does not drive
    them. Local control (the 0x55aa command protocol on TCP 6668) requires the
    device's per-device LOCAL KEY — a secret Tuya issues to the vendor's app via
    its cloud — which this project does not have and does not ask for. So we
    read the beacon, show a generic smart-device pictogram, and tell the user
    the device is set up and controlled through its own app. There is no local
    web admin UI on a Tuya device, so no admin_url is offered.

    THE BEACON. Frame: prefix 00 00 55 aa, u32 sequence, u32 command (0x00 on
    6666, 0x13 on 6667), u32 payload length, then the payload — an optional
    4-byte return code, the data (plaintext JSON on 6666; ciphertext on 6667),
    a u32 CRC32 and the suffix 00 00 aa 55. The 6667 cipher is AES-128-ECB
    under a SINGLE key shared by every Tuya device on earth: md5 of the ASCII
    string "yGAdlopoPVldABfn". That key is published in every open Tuya library
    and is a DISCOVERY key only — it unwraps the beacon a device already
    broadcasts to the whole segment; it is NOT the per-device local key that
    protects control. Useful fields in the JSON: gwId (the stable device id —
    the good identity key, survives a DHCP move), ip (the device's own address),
    version (protocol, e.g. "3.3") and productKey (identifies the firmware
    product, shared across a model). The device's address is the beacon's source
    IP (or the ip field, which the device is authoritative about).

    Because Tuya is a platform, the beacon does not name a device CATEGORY —
    productKey identifies a firmware build, not "plug" vs "bulb" — so the
    pictogram is the generic smart-device glyph rather than a guessed type, and
    the category is "other".
  identification:
    # The strong signal: a device that BEACONED a readable Tuya datagram on
    # 6666/6667. A consumer that received and parsed one tags the device with
    # this token — the same "it spoke the protocol" match Kasa/Ubiquiti use.
    lan_protocols:
      - "tuya-udp"
    default_port: 6667
    identity_keys:
      primary: "gw_id"
      secondary: "ip"
      display: "name"

  discovery:
    methods:
      - type: "udp_broadcast"
        udp_broadcast:
          port: 6667
          broadcast_address: "255.255.255.255"
          # No probe: Tuya devices beacon unsolicited. Listen only.
          passive_ok: true
          response_format: "json_aes"
          identity_mapping:
            stable_keys:
              - source: "json:gwId"
                key: "gw_id"
              - source: "json:ip"
                key: "ip"
            display:
              source: "json:gwId"
      - type: "udp_broadcast"
        udp_broadcast:
          port: 6666
          broadcast_address: "255.255.255.255"
          passive_ok: true
          response_format: "json"
          identity_mapping:
            stable_keys:
              - source: "json:gwId"
                key: "gw_id"
              - source: "json:ip"
                key: "ip"
            display:
              source: "json:gwId"
    identity:
      stable_keys: ["gw_id", "ip"]
      display: "name"
    static_ip_required: false

  setup:
    required: false
    confidence: high
    notes: >
      Nothing to set up for identification: listen on UDP 6666/6667, read (and
      for 6667 decrypt with the fixed key) the beacon, show the smart-device
      pictogram and note that the device is managed in its own app. Confidence
      high: verified live and the frame/key are the published, authoritative
      ecosystem constants.
    methods:
      - type: "wired"
        description: "The device is already on the LAN; discovery is the passive UDP 6666/6667 beacon."
        verified: true
        steps:
          - action: "Listen on UDP 6666 (plaintext) and 6667 (AES-128-ECB under md5(\"yGAdlopoPVldABfn\"))."
            actor: client
            expect: "A beacon carrying gwId, ip, version and productKey; the device's address is the source IP."
          - action: "Show the smart-device pictogram; direct the user to the device's own app for control (no local admin UI, no local key held)."
            actor: client
    factory_reset:
      applicable: false
      confidence: high
      effect: >
        Done at the device (its vendor's reset gesture, typically power-cycling
        or holding a button) and clears the device's own Tuya pairing, not
        anything this app stores. We only identify the device.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Stays discoverable by its UDP beacon wherever it sits on the LAN;
        identity keys on gwId, not IP, so a DHCP move does not lose it.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: >
        Identify-only: no credential crosses to this app. The fixed broadcast
        key that unwraps the 6667 beacon is a published discovery constant, not
        a device secret; the per-device local key that would permit control is
        never obtained or stored.

  local_access:
    status: proprietary
    summary: >
      Locally controllable in principle (the 0x55aa protocol on TCP 6668) but
      ONLY with the device's per-device local key, a secret issued through the
      Tuya cloud to the vendor's app. This project does not hold that key and
      deliberately scopes Tuya to identify-only, handing control to the device's
      own app. Third-party local control (tinytuya, localtuya, ESPHome/
      Tasmota reflashing) exists but is out of scope here.

helpful_urls:
  - url: "https://github.com/jasonacox/tinytuya"
    title: "tinytuya"
    description: "Open Tuya LAN library: the discovery frame layout, the fixed broadcast key, and the gwId/version/productKey fields."
  - url: "https://github.com/codetheweb/tuyapi/blob/master/docs/PROTOCOL.md"
    title: "tuyapi — protocol notes"
    description: "The 0x55aa frame format (prefix/command/length/CRC/suffix) and the 3.1/3.3 protocol versions."
