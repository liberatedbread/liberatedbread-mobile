    description: "Reference implementation (ships in Home Assistant): all UUIDs, advert and GATT structs, history V1/V2, commands, sentinels."
  - url: "https://github.com/Anrijs/Aranet4-Python/blob/master/docs/UUIDs.md"
    title: "Aranet4-Python UUIDs.md"
    description: "Human-readable UUID / format / command tables matching the code."
  - url: "https://github.com/Anrijs/Aranet4-ESP32"
    title: "Anrijs/Aranet4-ESP32"
    description: "Independent C++ implementation; byte-exact offset cross-check and the definitive pairing/firmware statement."
  - url: "https://github.com/SAF-Tehnika-Developer/com.aranet4"
    title: "SAF-Tehnika-Developer/com.aranet4"
    description: "Official SAF Tehnika Homey app — vendor-blessed advert parsing."
