entities:
  - platform: "sensor"
    name: "Internal Temperature"
    device_class: "temperature"
    state_characteristic: "048af000-cd06-4d57-a048-ccd5cb9f8f43"
    notes: >
      Consumes TLV attribute 36 (InternalTemp, float32) from the Probe
      Data notify — attribute ID and type confirmed in the app v5.3.0
      decompile; see that characteristic's notes for the TLV frame layout
      (no fixed offsets — parse the envelope). Unit source is a device
      setting, not fixed: the wire float32 carries no unit (the app applies
      no conversion in the decode path), so read the active unit from the
      9C6FFFC0 Temperature Unit characteristic's temp_unit field
      (unit_reference 9c6fffc0-…-dc5a.temp_unit; unit_values 0 = °F, 1 = °C)
      before rendering. No out-of-box default unit is claimed here because
      none is evidenced — the app writes the setting from the phone locale
      on setup. Consumers that want an unambiguous reading can instead use
      the connectionless advertisement path (int16 LE, 0.1 °C), which is
      always in °C.

  - platform: "sensor"
    name: "Ambient Temperature"
    device_class: "temperature"
    state_characteristic: "048af000-cd06-4d57-a048-ccd5cb9f8f43"
    notes: >
      Consumes TLV attribute 37 (AmbientTemp, float32) from the Probe
      Data notify — same decode path and caveats as Internal Temperature.
      Unit source is a device setting: read the active unit from the
      9C6FFFC0 temp_unit field (unit_reference 9c6fffc0-…-dc5a.temp_unit;
      unit_values 0 = °F, 1 = °C) before rendering; no out-of-box default
      is claimed (none evidenced). The connectionless advertisement path
      (int16 LE, 0.1 °C) remains the unambiguous °C alternative.

  - platform: "sensor"
    name: "Battery"
    device_class: "battery"
    unit: "%"
    state_characteristic: "9c6ff052-0420-41c1-bd98-7a015c45dc5a"

