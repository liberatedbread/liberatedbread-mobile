device:
  name: "Chef iQ Sense"
  manufacturer: "Chefman / Chef iQ"
  manufacturer_status: "unsupported"
  testing:
    status: untested
  protocol: "ble"
  category: "sensor"
  notes: >
    Smart thermometer hub (CQ60) with wireless probes and ESP32-WROVER-E chipset.
    DUAL-INTERFACE: it works LOCALLY over BLE (probe data + Wi-Fi provisioning)
    AND has a network component for REMOTE work — once provisioned it joins the
    LAN (Wi-Fi; the mains-powered base can also sit on wired Ethernet) and
    connects OUTBOUND to Chef iQ's cloud (AWS IoT MQTT) for remote monitoring.
    DISCOVERY: because that network side is an outbound cloud connection, the
    hub advertises NO local service (no mDNS/SSDP/Bonjour observed), so a passive
    LAN scan cannot find it — it is discovered over BLE (manufacturer ID 0x05CD,
    name "CQ60"). If a network capture ever shows a local advertisement, add a
    Wi-Fi discovery method then; the captures on hand are BLE (Bluetooth H4) only.
    Uses BLE for probe communication and Wi-Fi provisioning; Wi-Fi for cloud (AWS IoT MQTT).
    React Native app with Hermes bytecode (v96); protocol logic decompiled via hermes-dec.
    Five BLE UUID families for different device generations and functions.
    BLE manufacturer ID: 0x05CD. Device name: exactly "CQ60".
    Temperatures are IEEE 754 single-precision floats; the unit on the wire is
    NOT determinable from the app code (parseBytesData is a plain readFloatLE
    with no conversion) and is governed by the writable 9C6FFFC0 Temperature
    Unit characteristic.
    Probe data uses TLV (Tag-Length-Value) binary encoding with typed attribute IDs.
    Three command channels: thermometer (048A), system (9C6F), FTP/OTA (F640).
    Cloud: api.chefiq.com (REST), graph.chefiq.com (GraphQL), iot.chefiq.com (MQTT).
    Auth: AWS Cognito. The identity-pool id us-east-1:f95270e2-a024-41dc-bf5e-2d5df159f259
    is a PUBLIC client-side identifier (region:uuid format), NOT a secret credential -- it
    ships in every copy of the app and grants nothing without a valid user login. Retained
    here (and in docs/devices/chef-iq-sense.md) for interoperability; no vendor secret is
    published. No certificate pinning.
    MQTT topics: ciq-v2/dt/thermometer/{cognito_id}~{device_id}/+.
    Wi-Fi provisioning over BLE via Family C (8A71) characteristics, versioned V1/V2/V3.
    ADVERTISEMENT PATH (connectionless, no GATT needed): probes broadcast
    temperatures and battery unauthenticated in manufacturer data 0x05CD -- a
    simpler local integration than the GATT protocol below. Packet type is the
    low nibble of byte 0 (0x0 ASCII name, 0x1 temperature, 0x3 status with
    MAC + battery on newer versions); the remaining nibbles carry a
    major.minor.patch protocol version decoded as major = byte 1 high nibble,
    minor = byte 1 low nibble, patch = byte 0 high nibble (5.0.0 seen on
    current CQ60). Probe payloads are at most 18 bytes; the hub advertises
    under the same manufacturer ID with a longer (>= 20 B) payload -- a clean
    programmatic discriminator from probes. Temperature packet (type 0x1),
    V3 layout (protocol major >= 3; hardware-verified against a live CQ60 at
    5.0.0 by chefiq_ble): ambient [2:4], food [4:6], tip1 [6:8],
    tip2 [8:10], tip3 [10:12], tip4 [12:14], ambient mirror [14:16]. All
    temperatures are signed int16 little-endian in tenths of a degree C; an
    unmeasured ring sends a sentinel >= 0x7FF0 (0x7FFB typical), and
    consumers should drop any decoded temperature outside the plausible
    window -40..600 C rather than surface a sentinel. Status packet
    (type 0x3, V3, min 10 bytes): battery percent byte at [8], SoC
    temperature (raw byte, whole degrees C) at [9], probe MAC in the same
    packet. Older layouts (reconstructed, NOT hardware-verified): V2
    (major == 2) carries battery [2], soc [3], ambient [4:6], food [6:8],
    tip1-3 [8:10]..[12:14], ambient mirror [14:16]; legacy carries
    MAC [2:8], battery [8], soc [9], food [10:12], ambient [12:14],
    ambient mirror [14:16]. Battery scaling is CONTESTED between the cited
    sources: ITSpecialist111 documents the battery byte as 0-255 mapping to
    0-100 %, while chefiq_ble (the hardware-verified implementation) emits
    the raw byte directly as the percent with no scaling -- treat the exact
    scaling as unconfirmed until checked against a probe at a known charge.
    Sources: Invader444/chefiq-ble (PyPI), ble_monitor >= 12.8.0 (added
    CQ60 passive decoding), ITSpecialist111 ChefIQ integration,
    formula97/homeassistant-chefiq.
    FCC IDs: hub 2AC7Z-ESP32WROVERE (modular approval, ESP32-WROVER-E);
    probes 2A2YP-CQ60QPROBE (earlier v1 grant 2A2YP-CQ60PROBE; ISED
    IC 27740-CQ60QPROBE; a 2024-12-18 FCC C2PC adds probe models
    CQ60-PRC-01/02/03/04).
  identification:
    local_name_prefix: "CQ60"
    service_uuids:
      - "048a00ff-cd06-4d57-a048-ccd5cb9f8f43"
      - "9c6f00fc-0420-41c1-bd98-7a015c45dc5a"
      - "8a7100fe-babe-b7ae-074f-86d0c0b50089"
      - "6ac400fb-5bc3-4e99-acb8-f85d442b9ae4"
      - "f64000fd-6f49-4b5b-9bf8-76b3775d4d01"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "CQ60"
          service_uuids:
            - "048a00ff-cd06-4d57-a048-ccd5cb9f8f43"
            - "9c6f00fc-0420-41c1-bd98-7a015c45dc5a"
            - "8a7100fe-babe-b7ae-074f-86d0c0b50089"
            - "6ac400fb-5bc3-4e99-acb8-f85d442b9ae4"
            - "f64000fd-6f49-4b5b-9bf8-76b3775d4d01"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      The CQ60 hub is a BLE device that also needs WiFi, and the two roles are
      cleanly separated: probes and live readings work over BLE with no setup
      at all, while cloud/MQTT features need the WiFi credentials that are
      pushed over the Family C (8A71) provisioning service. A local-first
      client can stop after BLE and never provision WiFi — worth saying out
      loud, because the vendor app treats the account as mandatory.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          For local use, no provisioning is required: scan for the local name
          CQ60, connect, and use the thermometer (048A) and system (9C6F)
          services directly.
        ble:
          advertised_name: "CQ60"
          pairing_required: false
        steps:
          - action: "Scan for a device advertising the local name CQ60 with manufacturer ID 0x05CD and connect."
            actor: "client"
            request:
              protocol: "ble_gatt"
      - type: "ble_provisioning"
        verified: false
        description: >
          WiFi credentials are written over the Family C service. The
          characteristic set is versioned V1/V2/V3 across device generations,
          so read the network-info characteristic first and match the version
          before writing.
        ble:
          service_uuid: "8a7100fe-babe-b7ae-074f-86d0c0b50089"
          write_characteristic: "8a71ffa3-babe-b7ae-074f-86d0c0b50089"
          read_characteristic: "8a71ffa0-babe-b7ae-074f-86d0c0b50089"
          pairing_required: false
        steps:
          - action: "Read the network info characteristic to learn the provisioning version and current state."
            actor: "client"
            request:
              protocol: "ble_gatt"
              service: "8a7100fe-babe-b7ae-074f-86d0c0b50089"
              action: "Read 8a71ffa0 (Network Info)"
          - action: "Read the scanned-network characteristic to enumerate visible access points."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "Read 8a71ffa1 (Scanned Network)"
          - action: "Write the target SSID and passphrase to the set-network characteristic."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "Write 8a71ffa3 (Set Wi-Fi Network)"
            notes: "Payload encoding is version-dependent and has not been replayed against hardware here."
          - action: "Subscribe to the network info characteristic for the join result."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "Notify 8a71ffa0 (Network Info)"
            timeout_seconds: 60
    factory_reset:
      confidence: "low"
      effect: "Removing the stored credential over BLE unprovisions WiFi without touching probe pairings or the account."
      procedures:
        - name: "Remove credential over BLE"
          steps:
            - action: "Write to the remove-credential characteristic 8a71ffa5."
              actor: "client"
              notes: "Protocol-level unprovision; the hardware button sequence for a full reset is not documented here."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        BLE stays available whatever the WiFi state, so a new network is just
        another write to 8a71ffa3 — optionally preceded by a remove-credential
        write to 8a71ffa5. No physical reset needed.
    credentials:
      wifi_passphrase_protection: "plaintext"
      stored_on_device:
        - "WiFi credentials"
        - "AWS IoT device identity for cloud MQTT"
      issued_to_client: []
      notes: >
        BLE writes here are not encrypted or bonded, so the passphrase is
        exposed to anything sniffing the connection event during provisioning.
        Provision in a quiet RF environment or skip WiFi entirely for local use.
services:
  - uuid: "048a00ff-cd06-4d57-a048-ccd5cb9f8f43"
    name: "Thermometer/Probe Service (Family A)"
    characteristics:
      - uuid: "048af000-cd06-4d57-a048-ccd5cb9f8f43"
        name: "Probe Data"
        properties: ["notify"]
        notes: >
          Notifications carry TLV (Tag-Length-Value) records with typed
          attribute IDs; temperatures are IEEE 754 float32 (SingleFloat).
          The app applies NO unit conversion in the decode path
          (parseBytesData is a plain readFloatLE), so the unit on the wire
          is NOT determinable from the code; it is governed by the writable
          9C6FFFC0 Temperature Unit characteristic. TLV frame layout, read directly
          from the app's own parser (processBLEData / parseBytesData in the
          v5.3.0 Hermes bundle decompile; research/chef-iq-sense/app/): a
          sequence of attribute entries, each
          [attr_id uint16 LE][type uint8][length uint8][value length bytes].
          The per-entry type byte (DataTypeEnum: 0 bool, 1-6 signed/unsigned
          8/16/32-bit LE ints, 7 SignedInt64, 8 UnsignedInt64, 9 float32 LE
          rounded to 2 decimals, 10 DoubleFloat, 11 utf8 string,
          12 hex byte array, 13 MAC address, 14 JSON)
          drives decoding. One notification can carry several per-probe
          records: a new record starts when an attribute ID repeats, and
          attribute 16 (probe_address, MAC) is the record delimiter.
          Attribute IDs (AttributeEnum, confirmed in the same decompile):
          0 Timestamp (u32), 16 ProbeAddress (MAC), 17 Type (i8),
          19 HwVersion (str), 20 FwVersion (str), 21 SerialNumber (str),
          22 ServiceConfig (u8), 23 Name (str), 24 Registered (bool),
          25 DockNumber (u8 -- which hub dock slot the probe sits in),
          26 Size, 27 Color, 28 Number, 29 IsIncompatible (bool),
          32 IsActive (bool -- probe docked/charging state), 33 Rssi (i8),
          34 BatteryLevel (uint8), 35 IcTemp (f32),
          36 InternalTemp (f32), 37 AmbientTemp (f32), 38 IsOverheat (bool),
          39 IsSensorFail (bool), 40-43 Tip1-Tip4 temps (f32),
          44 Ext1Temp (f32). The same enum defines session attributes
          48-90 and notification attributes 91-123 -- see 048af001 Session
          Data. Because records are tagged, fields have NO
          fixed byte offsets, so no declarative format block is possible —
          parse the TLV envelope instead. Confidence: confirmed against the
          app's parser code, not yet against hardware. Neither downloaded
          RE implementation (Invader444/chefiq-ble, ble_monitor) decodes
          this GATT characteristic; both document only the connectionless
          advertisement path (manufacturer data 0x05CD, signed int16 LE in
          0.1 °C, sentinel >= 0x7FF0, per-probe slots), which does NOT
          mirror this notify's encoding (int16 0.1 °C vs float32).
          Consumers who just need probe temperatures can also use the
          documented advertisement path in the device notes above.

      - uuid: "048af001-cd06-4d57-a048-ccd5cb9f8f43"
        name: "Session Data"
        properties: ["notify"]
        notes: >
          TLV-encoded like 048af000 Probe Data (same frame layout and
          per-entry DataTypeEnum); records are split on attribute 48
          (SessionId) as the delimiter. Session attribute IDs from the app
          v5.3.0 decompile (AttributeEnum): 48 SessionId (str),
          49 CookingCategory (u8), 50 CookingMethod (u8), 51 PresetId (str),
          56 CookingTime (u32), 57 EstimatedCookingTime (u32),
          59 TargetTemp (f32), 60 RecipeId (str), 61 GuidedId (str),
          62 AutoCancel (bool), 80 RemainingTime (u32),
          81 TotalElapsedTime (u32), 82 ProgressPercent (f32),
          83 FlipStatus (bool), 84 OperatingState (u8),
          85 OperatingWarning (u8), 86 OperatingError (u8),
          88 RemainingCookingTime (u32), 89 SessionInternalTemp (f32),
          90 SessionAmbientTemp (f32). The enum further defines
          notification attributes 91-123 (93 NotificationConditionStatus,
          94 NotificationConditionMetCount, 112 NotificationId,
          113 NotificationCategory, 114 NotificationDescription,
          115 NotificationStepIndex, 116 NotificationReminder,
          117 NotificationTriggerStart, 118 NotificationTimer,
          119 NotificationAudioClips, 120 NotificationCondition,
          121 NotificationEstimatedTime, 122 NotificationTriggerCancel,
          123 IgnoreOnStart) -- these ride in TLV records returned by the
          cooking-state/session notification commands, distinct from the
          plain-JSON payloads of 048af020/21/22. Confidence: confirmed
          against the app's parser code, not yet against hardware.

      - uuid: "048af010-cd06-4d57-a048-ccd5cb9f8f43"
        name: "Docked List"
        properties: ["read", "notify"]

      - uuid: "048af011-cd06-4d57-a048-ccd5cb9f8f43"
        name: "Registered List"
        properties: ["read"]

      - uuid: "048af014-cd06-4d57-a048-ccd5cb9f8f43"
        name: "Session Probe List"
        properties: ["read", "notify"]

      - uuid: "048af020-cd06-4d57-a048-ccd5cb9f8f43"
        name: "System Notification"
        properties: ["notify"]
        notes: >
          Payload is a plain UTF-8 JSON object (JSON.parse of the raw
          bytes) — NOT TLV. Evidence: app v5.3.0 decompile.

      - uuid: "048af021-cd06-4d57-a048-ccd5cb9f8f43"
        name: "Session Notification"
        properties: ["notify"]
        notes: >
          Payload is a plain UTF-8 JSON object (JSON.parse of the raw
          bytes) — NOT TLV. Evidence: app v5.3.0 decompile.

      - uuid: "048af022-cd06-4d57-a048-ccd5cb9f8f43"
        name: "Cooking State Notification"
        properties: ["notify"]
        notes: >
          Payload is a plain UTF-8 JSON object (JSON.parse of the raw
          bytes) — NOT TLV. Evidence: app v5.3.0 decompile.

      - uuid: "048afff0-cd06-4d57-a048-ccd5cb9f8f43"
        name: "Thermometer Command Request"
        properties: ["write"]
        commands:
          get_version:
            description: "Get thermometer firmware version"
            value: [0]
          register_probe:
            description: "Register a probe to the hub"
            value: [16]
          deregister_probe:
            description: "Remove a probe registration"
            value: [17]
          update_probe:
            description: "Update probe settings"
            value: [18]
          start_session:
            description: "Start a cooking session"
            value: [20]
          get_probe_attributes:
            description: "Read probe attribute data"
            value: [21]
          get_session_attributes:
            description: "Read session attribute data"
            value: [22]
          update_session:
            description: "Update running session parameters"
            value: [23]
          cancel_session:
            description: "Cancel a cooking session"
            value: [24]
          end_session:
            description: "End a cooking session"
            value: [25]
          get_cooking_state_notification_ids:
            description: "List cooking state notification IDs"
            value: [32]
          get_cooking_state_notification:
            description: "Read a cooking state notification"
            value: [33]
          set_cooking_state_notification:
            description: "Create a cooking state notification"
            value: [34]
          update_cooking_state_notification:
            description: "Update a cooking state notification"
            value: [35]
          delete_cooking_state_notification:
            description: "Delete a cooking state notification"
            value: [36]
          start_cooking_state_notification:
            description: "Activate a cooking state notification"
            value: [37]
          get_session_notification_ids:
            description: "List session notification IDs"
            value: [48]
          get_session_notification:
            description: "Read a session notification"
            value: [49]
          set_session_notification:
            description: "Create a session notification"
            value: [50]
          update_session_notification:
            description: "Update a session notification"
            value: [51]
          delete_session_notification:
            description: "Delete a session notification"
            value: [52]
          get_session_notification_status:
            description: "Get session notification status"
            value: [58]

      - uuid: "048afff1-cd06-4d57-a048-ccd5cb9f8f43"
        name: "Thermometer Command Response"
        properties: ["notify"]
        notes: >
          Responses carry an 8-byte header: commandId u8 @0, requestId
          u32 LE @1, responseCode int8 @5, size u16 LE @6, followed by
          `size` payload bytes. Attribute-bearing commands (e.g.
          get_probe_attributes, start_session) return payloads in the same
          TLV encoding as 048af000 Probe Data. responseCode values
          (CommandAPIResponse enum in the app's shared constants module,
          consumed by the command error-mapping path): 0 OK, -1 FAIL,
          -2 ERR_INVALID_COMMAND, -3 ERR_HEAP_ALLOC, -4 ERR_MOUNT_POINT,
          -5 ERR_PARTITION, -6 ERR_DIGEST, -7 ERR_SIZE, -8 ERR_WRITE; the
          enum sits beside the FTP command constants and appears shared
          across the command services. Evidence: app v5.3.0
          decompile (processHeaderInfo; CommandAPIResponse at
          bundle.js:~851484, consumed ~2485200-2485255). Confidence:
          app-derived, not hardware-verified.

  - uuid: "9c6f00fc-0420-41c1-bd98-7a015c45dc5a"
    name: "System/Config Service (Family B)"
    characteristics:
      - uuid: "9c6ff050-0420-41c1-bd98-7a015c45dc5a"
        name: "Cloud Status"
        properties: ["read", "notify"]
        format:
          # 4-byte signed little-endian integer (SignedInt32). Corrected from the
          # earlier int8/length-4 mismatch. Evidence: docs/devices/chef-iq-sense.md
          # documents 9C6FF050 as "SignedInt32", and the app's Hermes bundle parses
          # this characteristic with readInt32LE. NOTE: int32 is not yet consumed by
          # the mobile Rust ValueType enum (known 32-bit gap).
          - offset: 0
            length: 4
            name: "cloud_status"
            type: "int32"

      - uuid: "9c6ff051-0420-41c1-bd98-7a015c45dc5a"
        name: "Battery Status"
        properties: ["read", "notify"]
        notes: >
          Charge state enum: 0 = discharging, 1 = charging (BatteryStatus
          enum in the app; an absent value defaults to discharging).
          Evidence: app v5.3.0 Hermes bundle decompile
          (research/chef-iq-sense/app/).
        format:
          - offset: 0
            length: 1
            name: "battery_status"
            type: "uint8"

      - uuid: "9c6ff052-0420-41c1-bd98-7a015c45dc5a"
        name: "Battery Level"
        properties: ["read", "notify"]
        notes: >
          Signed int16 little-endian, no scaling; the app consumes the raw
          value directly as the battery level (0-100 % by usage — no
          explicit range check in code). The app's characteristic registry
          declares read+notify and subscribes to it (the earlier read-only
          listing was wrong). Evidence: app v5.3.0 Hermes bundle decompile
          (research/chef-iq-sense/app/).
        format:
          - offset: 0
            length: 2
            name: "battery_level"
            type: "int16"

      - uuid: "9c6ff054-0420-41c1-bd98-7a015c45dc5a"
        name: "Mute"
        properties: ["read", "write", "notify"]
        format:
          - offset: 0
            length: 1
            name: "muted"
            type: "bool"

      - uuid: "9c6ff055-0420-41c1-bd98-7a015c45dc5a"
        name: "Volume"
        properties: ["read", "write", "notify"]
        format:
          # Signed int16 LE (app registry type SignedInt16, parsed with
          # readInt16LE; stored under audio.volume). Evidence: app v5.3.0
          # Hermes bundle decompile (research/chef-iq-sense/app/).
          - offset: 0
            length: 2
            name: "volume"
            type: "int16"

      - uuid: "9c6fff81-0420-41c1-bd98-7a015c45dc5a"
        name: "Device Name"
        properties: ["read", "write"]
        format:
          - offset: 0
            length: 32
            name: "device_name"
            type: "string"

      - uuid: "9c6fff82-0420-41c1-bd98-7a015c45dc5a"
        name: "Has New Update"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 1
            name: "has_update"
            type: "bool"

      - uuid: "9c6fff84-0420-41c1-bd98-7a015c45dc5a"
        name: "OTA Progress"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 1
            name: "progress_percent"
            type: "uint8"

      - uuid: "9c6fff85-0420-41c1-bd98-7a015c45dc5a"
        name: "Generation"
        properties: ["read"]
        format:
          - offset: 0
            length: 1
            name: "generation"
            type: "uint8"

      - uuid: "9c6fffb0-0420-41c1-bd98-7a015c45dc5a"
        name: "Signature"
        properties: ["read"]

      - uuid: "9c6fffc0-0420-41c1-bd98-7a015c45dc5a"
        name: "Temperature Unit"
        properties: ["read", "write", "notify"]
        commands:
          set_fahrenheit:
            description: "Set temperature unit to Fahrenheit"
            value: [0]
          set_celsius:
            description: "Set temperature unit to Celsius"
            value: [1]
        format:
          - offset: 0
            length: 1
            name: "temp_unit"
            type: "uint8"
            # Decodes the active temperature unit for the connected Probe Data
            # (048AF000) float32 temps, which carry no unit on the wire. Raw
            # value matches the set_fahrenheit (0) / set_celsius (1) commands
            # above. This is the unit_reference target named by the temperature
            # entities.
            unit_values:
              0: "F"
              1: "C"

      - uuid: "9c6fffc1-0420-41c1-bd98-7a015c45dc5a"
        name: "Data Update Interval"
        properties: ["read", "write", "notify"]

      - uuid: "9c6ffff0-0420-41c1-bd98-7a015c45dc5a"
        name: "System Command Request"
        properties: ["write"]
        commands:
          get_version:
            description: "Get firmware version"
            value: [0]
          factory_reset:
            description: "Factory reset the device"
            value: [1]
          app_reboot:
            description: "Reboot the device"
            value: [2]
          set_epoch_time:
            description: "Set the device clock (Unix epoch)"
            value: [3]
          set_timezone:
            description: "Set the device timezone"
            value: [4]
          set_language:
            description: "Set the device language"
            value: [5]
          get_epoch_time:
            description: "Read the device clock"
            value: [6]
          get_timezone:
            description: "Get the device timezone"
            value: [7]
          get_language:
            description: "Get the device language"
            value: [8]

      - uuid: "9c6ffff1-0420-41c1-bd98-7a015c45dc5a"
        name: "System Command Response"
        properties: ["notify"]

  - uuid: "8a7100fe-babe-b7ae-074f-86d0c0b50089"
    name: "Wi-Fi Provisioning Service (Family C)"
    characteristics:
      - uuid: "8a71ffa0-babe-b7ae-074f-86d0c0b50089"
        name: "Network Info"
        properties: ["read", "notify"]

      - uuid: "8a71ffa1-babe-b7ae-074f-86d0c0b50089"
        name: "Scanned Network"
        properties: ["read"]

      - uuid: "8a71ffa2-babe-b7ae-074f-86d0c0b50089"
        name: "Saved Network"
        properties: ["read"]

