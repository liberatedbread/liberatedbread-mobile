device:
  name: "Enphase Envoy"
  manufacturer: "Enphase Energy"
  manufacturer_status: "active"
  testing:
    status: verified
    detail: minimally-verified
    notes: >
      Driven live 2026-08-14 against the real gateway (serial 202234119443,
      firmware D8.3.5427, reached at the address its _enphase-envoy._tcp
      answer resolved to): GET /info and /info.xml returned the documented
      unauthenticated envoy_info XML (sn/pn/software fields, web-tokens
      true), and /production.json, /api/v1/production,
      /api/v1/production/inverters, /ivp/livedata/status and /auth/check_jwt
      all answered 401 with a login.html redirect — the firmware-7+ token
      gate behaving exactly as documented. IMPORTANT transport observation:
      on this firmware port 80 is CLOSED (connection refused) even though
      the mDNS TXT/SRV still advertises port 80 — the API is served on
      HTTPS 443 with a self-signed certificate only. Not exercised:
      everything behind the JWT (no Enlighten cloud credentials were used),
      the AP-mode/BLE commissioning flows, and digest-auth-era behavior.
  protocol: "wifi"
  category: "energy"
  transport: "http"
  notes: >
    Enphase Envoy gateways expose a local REST API on port 80 for solar
    production and inverter telemetry. Some endpoints are readable locally,
    while newer firmware gates selected endpoints behind token-based
    authentication. Discovery uses the Enphase-specific mDNS service and the
    serialnum TXT record is the stable identity.
  identification:
    mdns_service_type: "_enphase-envoy._tcp.local."
    default_port: 443
    port_notes: >
      The mDNS answer still advertises port 80, but firmware 8.x serves the
      API exclusively over HTTPS on 443 with a self-signed certificate —
      port 80 refuses connections outright (live-observed on D8.3.5427,
      2026-08-14). Consumers must ignore the advertised port, connect to
      https://<ip>/ and skip certificate verification (or pin the gateway
      cert).
    identity_keys:
      primary: "serialnum"
      display: "name"

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_enphase-envoy._tcp.local."
          port: 80
          txt_record_keys: ["serialnum", "protovers"]
          identity_mapping:
            stable_keys:
              - source: "txt:serialnum"
                key: "serialnum"
            display:
              source: "name"
    identity:
      stable_keys: ["serialnum"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "low"
    notes: >
      The Envoy is commissioned by an installer rather than unboxed by an
      owner, so its onboarding is a web UI on the gateway itself rather than an
      app protocol. The part that matters for local-first consumers is not the
      WiFi join but the authentication change: firmware 7 and later require a
      JWT obtained from Enphase's entrez service for local endpoints that used
      to be open or digest-authenticated.
    methods:
      - type: "wired"
        verified: false
        description: "Ethernet or Enphase powerline (PLC) to the router; no wireless provisioning needed."
        steps:
          - action: "Connect the gateway to the LAN and power it."
            actor: "user"
            expect: "Gateway answers _enphase-envoy._tcp.local. with TXT serialnum."
            timeout_seconds: 180
      - type: "softap_http"
        verified: false
        description: >
          For wireless installs the gateway hosts a temporary access point and
          serves its own configuration UI, where the installer selects the home
          network. The AP name is derived from the gateway serial. A decompile
          audit of the Android app (2026-08) confirms the gateway address
          172.30.1.1 and shows the app reaching it over HTTPS
          (https://172.30.1.1/) with an Authorization: Bearer JWT when a token
          is available, falling back to plain HTTP with digest auth (user
          'envoy') when it is not — app-derived, not yet exercised on hardware
          (medium confidence).
        softap:
          ssid_prefix: "Envoy_"
          open_network: true
          passphrase_source: "None — the setup AP is an open network (official install manual, p. 26); authentication happens afterwards at the gateway's web UI, not at the WPA layer."
          gateway_ip: "172.30.1.1"
        steps:
          - action: "Press the AP Mode button on the gateway to start the setup AP."
            actor: "user"
            timeout_seconds: 60
          - action: "Join the Envoy_* network and open the gateway's configuration page."
            actor: "user"
            notes: "The AP has no Wi-Fi passphrase; the gateway IP is vendor-documented. Authentication happens at the web UI on 172.30.1.1, not when joining the network."
          - action: "Select the home network and apply."
            actor: "user"
      - type: "ble_provisioning"
        verified: false
        description: >
          The Android app can also commission the gateway over BLE GATT using
          Enphase protobuf messages (commissioning.proto Connectivity): it
          writes the entrez JWT as an EntrezToken message (chunked with a
          CRC32 framing layer), reads EntrezTokenValidationStatus (TOKEN_RCVD,
          then TOKEN_VALID), scans for networks with WiFiAPsScanList /
          WiFiAPInfo, joins with SetWiFiConnection (SSID, passphrase, auth
          mode), and watches WiFiConnectionStatus; a BirthCertificate message
          carries the gateway certificate chain. This exchange rides a vendor
          GATT service based on ed453f0f-8dd9-461c-ae07-723f55d83442. A
          second vendor GATT service based on
          6d1b33f8-0000-11eb-a8b3-0242ac130003 (alongside the standard Device
          Information service 0x180A with serial number 0x2A25) carries
          live-data values. The app bundles the Espressif provisioning stack
          with Sec0/Sec2 session-security support, but the decompile does not
          establish that the Envoy commissioning path uses it, so the session
          security scheme stays an open question. All app-derived; not yet
          exercised against hardware (medium confidence).
        ble:
          protocol: "Enphase Connectivity protobuf (commissioning.proto)"
          service_uuid: "ed453f0f-8dd9-461c-ae07-723f55d83442"
        steps:
          - action: "Connect to the gateway's BLE GATT service and write the entrez JWT as a chunked EntrezToken protobuf message."
            actor: "client"
            notes: "Token comes from Enphase's cloud entrez service, so this path is not cloud-free either."
          - action: "Read EntrezTokenValidationStatus until TOKEN_VALID, then request the Wi-Fi scan list and send SetWiFiConnection."
            actor: "client"
            expect: "WiFiConnectionStatus reports the gateway joined the home network."
            timeout_seconds: 120
    factory_reset:
      confidence: "low"
      effect: "Not documented in this project. Re-provisioning is normally done in place from the gateway's own UI rather than by resetting it. A 2026-08 decompile audit of the Android app likewise found no factory-reset flow in the app, so this stays unresolved."
      procedures:
        - name: "Not verified"
          steps:
            - action: "Consult the model's installation manual; a full reset can de-commission the PV site and should not be done casually."
              actor: "user"
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Network settings can be changed from the gateway's local web UI while
        it is still reachable, which is the supported way to move it to a new
        router.
    credentials:
      wifi_passphrase_protection: "unknown"
      stored_on_device:
        - "Home network credentials"
        - "Enphase site/installer association"
      issued_to_client:
        - "JWT bearer token from the Enphase entrez service (firmware 7+)"
      notes: >
        Older firmware used HTTP digest auth with an installer password derived
        from the serial number; current firmware requires a cloud-issued token
        that expires, which makes even 'local' telemetry cloud-dependent for
        renewal. Cache the token and record its expiry. The pre-JWT scheme was
        the subject of CVE-2020-25752, CVE-2020-25753 and CVE-2020-25754: the
        serial is readable unauthenticated at /info (also /info.xml) and
        default or derived credentials follow from it — the reason Enphase
        moved to JWT in firmware 7. Gateway firmware is distributed OTA-only
        from a CloudFront CDN gated by signed cookies; no freely downloadable
        images exist.

evidence:
  live_lan_probe:
    date: "2026-08-14"
    address: "10.69.163.230"
    serial: "202234119443"
    protovers: "v8.3.5427"
    mdns_service_type: "_enphase-envoy._tcp"
    protocol: >
      REST API on HTTPS 443 (self-signed cert); port 80 refused connections
      despite the mDNS answer advertising it. /info and /info.xml served
      unauthenticated; production/livedata/auth endpoints answered 401 +
      login.html redirect without a JWT. (Earlier probe 2026-07-16 at
      10.69.194.174 recorded the same serial via mDNS — DHCP moved the
      gateway between probes, so serialnum, not address, is the identity.)
  app_static_analysis:
    date: "2026-08-13"
    source: "Enphase Android app, jadx decompile (clean-room audit; derived facts only)"
    confirms:
      - "Discovery: the app browses mDNS service type _enphase-envoy._tcp. and parses the serialnum and protovers TXT keys as gateway identity and firmware version."
      - "AP mode: the app reaches the setup gateway at https://172.30.1.1/ with an Authorization: Bearer JWT, falling back to plain HTTP digest auth (user 'envoy') when no token is available."
      - "Auth: token validity is probed with GET /auth/check_jwt; local requests carry the JWT as a Bearer header."
      - "Local endpoints exercised by the app include /admin/lib/wireless_display.json (GET form, form POST to test and join), /ivp/bluetooth/wireless_scan (GET, plus a form POST carrying the same join fields) and GET /ivp/livedata/status."
      - "A BLE GATT commissioning channel exists alongside AP mode (protobuf Connectivity messages; see setup.methods)."
    confidence: "medium"
    confidence_notes: "Derived from app code, not yet exercised against gateway hardware; live-probe values in this spec remain the hardware-confirmed baseline."

http_endpoints:
  - method: "GET"
    path: "/production.json"
    name: "Production"
    description: "Live solar production and consumption data. Discovery scripts can probe this path after mDNS resolution."
    response_body:
      content_type: "application/json"
  - method: "GET"
    path: "/api/v1/production"
    name: "Production V1"
    description: "Legacy/current production summary endpoint."
    response_body:
      content_type: "application/json"
  - method: "GET"
    path: "/api/v1/production/inverters"
    name: "Inverter Production"
    description: "Per-inverter production telemetry; may require token authentication on newer firmware."
    response_body:
      content_type: "application/json"
  - method: "GET"
    path: "/info"
    name: "Envoy Info"
    description: "Unauthenticated gateway information (firmware, serial, part number). Returns XML with an envoy_info root element, not JSON; historically also reachable as /info.xml. pyenphase parses it with an XML parser."
    response_body:
      content_type: "application/xml"
  - method: "GET"
    path: "/auth/check_jwt"
    name: "JWT Check"
    status: "unverified"
    description: "Firmware-7+ token validation probe: the Android app GETs this path with the entrez JWT as an Authorization: Bearer header to learn whether the gateway accepts the token locally before making further requests. App-derived (decompile audit 2026-08). Hardware-probed 2026-08-14 (D8.3.5427): exists and answers 401 + login.html redirect WITHOUT a token; accept-path behavior still unverified (no token was available)."
  - method: "GET"
    path: "/admin/lib/wireless_display.json"
    name: "Wireless Config"
    status: "unverified"
    description: "Installer wireless-configuration page used during AP-mode setup at 172.30.1.1. A form POST to the same path applies and tests the join with fields essid, bssid, channel, security_mode, wificrypto, password, wps_pbc, fname and a submit field; optional enc_essid/enc_password carry encrypted variants. App-derived (decompile audit 2026-08), not yet probed on hardware."
  - method: "GET"
    path: "/ivp/bluetooth/wireless_scan"
    name: "Wireless Scan"
    status: "unverified"
    description: "Wi-Fi network scan results used by the app's commissioning flow; the app also POSTs a form to this path with the same join fields as /admin/lib/wireless_display.json (essid, password, security_mode, and friends). App-derived (decompile audit 2026-08), not yet probed on hardware."
  - method: "GET"
    path: "/ivp/livedata/status"
    name: "Live Data Status"
    status: "unverified"
    description: "Live-data status polled by the Android app through its dynamic-URL helper. App-derived (decompile audit 2026-08), not yet probed on hardware."

# The invocations entities bind. Each is a plain http GET whose whole
# instruction is its path — the same shape the Roku spec's keypress commands
# use. Auth caveat from device.notes applies to all of them: firmware 7+
# gates selected endpoints behind the entrez JWT, and which endpoints stay
# open varies by firmware; /info is the documented unauthenticated one.
commands:
  get_production_v1:
    description: >
      Production summary as a FLAT JSON object: wattsNow, wattHoursToday,
      wattHoursSevenDays, wattHoursLifetime. This is the state poll the
      sensor entities bind, because its values sit at the top level where a
      dotted-path state_mapping can name them.
    transport: "http"
    method: "GET"
    path: "/api/v1/production"
    verification: "reported"
  get_production_json:
    description: >
      The richer production read: a JSON document whose production ARRAY
      carries per-type entries (inverters, eim) with wNow/whLifetime on
      each. Not entity-bound — a flat dotted path cannot name "the eim
      entry's wNow" — but it is the endpoint metered units report lifetime
      energy on, so consumers that can select array entries should prefer
      it.
    transport: "http"
    method: "GET"
    path: "/production.json"
    verification: "reported"
  get_inverters:
    description: >
      Per-inverter production telemetry (JSON array of serial/watts
      records). May require token authentication on newer firmware.
    transport: "http"
    method: "GET"
    path: "/api/v1/production/inverters"
    verification: "reported"
  get_info:
    description: >
      Unauthenticated gateway information (firmware, serial, part number).
      Returns XML with an envoy_info root element, not JSON; historically
      also reachable as /info.xml.
    transport: "http"
    method: "GET"
    path: "/info"
    verification: "reported"

entities:
  - platform: "sensor"
    name: "Solar Production"
    device_class: "power"
    unit: "W"
    state_command: "get_production_v1"
    state_mapping:
      value: "wattsNow"
    notes: >
      wattsNow exists only in the flat /api/v1/production response. The
      /production.json form returns a production ARRAY of per-type entries
      (inverters, eim) with the power field named wNow on each entry —
      richer, but not addressable by a flat dotted path.
  - platform: "sensor"
    name: "Lifetime Energy"
    device_class: "energy"
    unit: "Wh"
    state_command: "get_production_v1"
    state_mapping:
      value: "wattHoursLifetime"
    notes: >
      wattHoursLifetime is the flat form. On /production.json the same
      figure lives on the array entries as whLifetime (present on the eim
      entry of metered units), not at a top-level production object.
  - platform: "sensor"
    name: "Today's Energy"
    device_class: "energy"
    unit: "Wh"
    state_command: "get_production_v1"
    state_mapping:
      value: "wattHoursToday"

