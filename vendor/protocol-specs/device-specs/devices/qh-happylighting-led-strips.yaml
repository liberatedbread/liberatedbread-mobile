# Qianghe "HappyLighting" (Triones / QHM) BLE LED Strip Controller
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Qianghe HappyLighting (Triones/QHM) BLE LED Strip Controller"
  manufacturer: "Shenzhen Qianghe Technology Co., Ltd. (qh-tek.com)"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Everything here comes from static analysis of the vendor Android app
      ("HappyLighting", 2026-08-19) cross-checked
      against the community-documented "Triones" protocol and the Home
      Assistant led_ble integration. No unit of this family has been driven
      from this spec, and no over-the-air capture exists in this project.
  protocol: "ble"
  category: "light"
  type: "led-strip-controller"
  notes: >
    Cheap BLE RGB(W) LED controllers sold under many listings and driven by
    the vendor "HappyLighting" app (Android and iOS). The reference instance
    documented here is the AliExpress 3256812708626256 4x72-LED USB car
    interior strip kit ("LED LAMP" / "LED Controller" inline box; its QR
    code resolves to the HappyLighting download portal), but the app drives
    the whole advertised-name family. This is the Triones / HappyLighting /
    QHM family — NOT Tuya and NOT the ELK-BLEDOM (duoCo) family documented
    in elk-bledom-led-strip.yaml; the packet formats are unrelated.

    PROTOCOL: short fixed frames, no pairing, no auth, no session. Power on
    CC 23 33, off CC 24 33. Static color 56 R G B W F0 AA (the W byte is
    the white channel; the app scales it with brightness on RGBW hardware)
    with a variant 57 R G B W F0 75. Effect mode BB <mode> <speed> 44.
    Status query EF 01 77; the app parses the reply payload from byte
    offsets 3..9 of the notification value. A mic/music sensitivity frame
    69 00 00 F0 96 is sent on the ffd5/ffd9 layout.

    GATT LAYOUTS: the app supports two. Legacy units expose service
    0xFFE0 with write characteristic 0xFFE1 and notify 0xFFE2. Current app
    builds send commands on service 0xFFD5, write characteristic 0xFFD9.
    Which layout a given controller revision uses could not be confirmed
    without hardware; try 0xFFD5/0xFFD9 first and fall back to
    0xFFE0/0xFFE1. The command frames themselves are the same on both.

    DISCOVERY: advertised local names matched by the app are Dream#,
    Dream~, Dream=, QLAMP, QHM* and Triones~ (name-contains checks, so
    prefixes Dream/QLAMP/QHM/Triones are the practical match).

    CONFIDENCE: MEDIUM-HIGH for the command frames and both UUID sets —
    read straight out of the vendor app and corroborated by the
    community Triones documentation and Home Assistant led_ble. Which
    layout/name a specific unit uses, and the exact status-reply field
    semantics, are unverified against hardware.

  identification:
    local_name_prefixes:
      - "Dream"
      - "QLAMP"
      - "QHM"
      - "Triones"
    service_uuids:
      - "0000ffd5-0000-1000-8000-00805f9b34fb"
      - "0000ffe0-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "regex"
            value: "^(Dream|QLAMP|QHM|Triones)"
          service_uuids:
            - "0000ffd5-0000-1000-8000-00805f9b34fb"
            - "0000ffe0-0000-1000-8000-00805f9b34fb"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      No provisioning. The device advertises when powered; the vendor app
      connects and writes with no account, no bonding and no authentication.
      Confidence is medium rather than high because the flow was read from
      the app's code, not replayed against hardware.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Scan for the advertised names or service UUIDs above, connect,
          and write command frames to 0xFFD9 (service 0xFFD5) or 0xFFE1
          (service 0xFFE0). No initialization handshake is known or needed.
        ble:
          pairing_required: false
        steps:
          - action: "Power the LED controller."
            actor: "user"
            request:
              protocol: "ble_gatt"
          - action: >
              Scan for a Dream*/QLAMP/QHM*/Triones* name or the 0xFFD5 /
              0xFFE0 service UUID and connect.
            actor: "client"
          - action: >
              Write command frames to 0xFFD9 (preferred) or 0xFFE1;
              subscribe to 0xFFE2 on legacy-layout units for status replies.
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        No credential or pairing state is stored on the device, so there is
        nothing meaningful to clear. No dedicated reset procedure is known
        from the app's code; power-cycling returns the controller to its
        default state.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove and reapply power."
              actor: "user"
              expect: "Controller powers on in its default state and resumes advertising."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        No bonding and no owner binding. Any central within range can
        connect and take control.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: "No auth of any kind. Physical proximity is the only access control."

  variants:
    - model: "HappyLighting car interior kit (AliExpress 3256812708626256)"
      notes: >
        4x rigid 5050 RGB bars (18 LEDs each, 72 total), USB 5V, inline
        "LED LAMP" controller whose QR code points at the HappyLighting app
        portal. The advertised name and GATT layout of this specific
        controller revision are unconfirmed — hypothesis: one of the name
        prefixes above with the 0xFFD5/0xFFD9 layout.
    - model: "Triones"
      identification:
        local_name_prefix: "Triones"
    - model: "QHM"
      identification:
        local_name_prefix: "QHM"
    - model: "QLAMP / Dream"
      identification:
        local_name_prefix: "QLAMP"

services:
  - uuid: "0000ffd5-0000-1000-8000-00805f9b34fb"
    name: "Qianghe command service (current app builds)"
    notes: >
      Service the current HappyLighting build writes command frames to.
      Frames are short fixed literals with no length prefix, no checksum
      and no sequence byte; each write is a complete command.
    characteristics:
      - uuid: "0000ffd9-0000-1000-8000-00805f9b34fb"
        name: "Write"
        properties: ["write", "write_without_response"]
        notes: >
          All commands below are also accepted on 0xFFE1 of the legacy
          0xFFE0 layout; the app picks the characteristic by which service
          the connected unit exposes.
        commands:
          set_power_on:
            description: "Turn the light on."
            value: [0xCC, 0x23, 0x33]
            verification: "reported"
          set_power_off:
            description: "Turn the light off."
            value: [0xCC, 0x24, 0x33]
            verification: "reported"
          set_static_color:
            description: >
              Set a static RGB(W) color. Byte 5 (white) is the white
              channel; the app scales it with brightness on RGBW hardware.
              Pass 0x00 for white on RGB-only strips.
            template: [0x56, "{red}", "{green}", "{blue}", "{white}", 0xF0, 0xAA]
            parameters:
              red: { type: "uint8", min: 0, max: 255 }
              green: { type: "uint8", min: 0, max: 255 }
              blue: { type: "uint8", min: 0, max: 255 }
              white: { type: "uint8", min: 0, max: 255, default: 0x00 }
            verification: "reported"
          set_static_color_alt:
            description: >
              Alternate static-color frame emitted on a second app code
              path (same payload layout, 0x57 opcode, 0x75 trailer).
              Purpose of the variant is not established; prefer
              set_static_color.
            template: [0x57, "{red}", "{green}", "{blue}", "{white}", 0xF0, 0x75]
            parameters:
              red: { type: "uint8", min: 0, max: 255 }
              green: { type: "uint8", min: 0, max: 255 }
              blue: { type: "uint8", min: 0, max: 255 }
              white: { type: "uint8", min: 0, max: 255, default: 0x00 }
            verification: "reported"
          set_mode:
            description: >
              Set a dynamic effect mode and its speed. Mode indices map to
              the app's effect list (color jumps, fades, music-reactive
              patterns); the full index table was not extracted.
            template: [0xBB, "{mode}", "{speed}", 0x44]
            parameters:
              mode: { type: "uint8", min: 0, max: 255 }
              speed: { type: "uint8", min: 0, max: 255 }
            verification: "reported"
          get_state:
            description: >
              Query device status. The reply arrives as a notification
              (0xFFE2 on the legacy layout); the app parses state fields
              from byte offsets 3..9 of the value.
            value: [0xEF, 0x01, 0x77]
            verification: "reported"
          set_mic_sensitivity:
            description: >
              Microphone/music sensitivity frame sent by the app on this
              layout. Fixed literal as observed; the sensitivity encoding
              (which byte varies) was not established.
            value: [0x69, 0x00, 0x00, 0xF0, 0x96]
            verification: "hypothesis"

  - uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
    name: "Qianghe legacy service"
    notes: >
      Legacy GATT layout kept by the app for older controller revisions.
      Accepts the same command frames as the 0xFFD5/0xFFD9 pair.
    characteristics:
      - uuid: "0000ffe1-0000-1000-8000-00805f9b34fb"
        name: "Write"
        properties: ["write", "write_without_response"]
        notes: >
          Write the same frames documented on 0xFFD9 (power CC 23 33 /
          CC 24 33, color 56 R G B W F0 AA, mode BB <mode> <speed> 44,
          status query EF 01 77).
      - uuid: "0000ffe2-0000-1000-8000-00805f9b34fb"
        name: "Notify"
        properties: ["notify"]
        notes: >
          Status replies. The app parses the response to the EF 01 77
          query from byte offsets 3..9 of the notification value; exact
          per-field semantics are unverified.

entities:
  # The commands live on the CURRENT layout's write characteristic (0000ffd9);
  # without them a consumer could not turn the strip on at all, despite every
  # frame being documented above.
  - platform: "light"
    name: "LED Strip"
    features: ["color", "effect"]
    commands:
      turn_on: "set_power_on"
      turn_off: "set_power_off"
      set_color: "set_static_color"
      set_effect: "set_mode"
    state_characteristic: "0000ffe2-0000-1000-8000-00805f9b34fb"
    notes: >
      `set_effect` binds set_mode, which carries a speed byte alongside the
      mode index; a consumer that exposes only an effect list should send the
      speed it last used, or 0x00. The mode index table was not extracted, so
      the effect names have to come from the consumer, not from here.

      The state binding is CONDITIONAL, and a consumer that treats it as
      unconditional will fail on current hardware. The app speaks two GATT
      layouts: legacy 0000ffe0 (write 0000ffe1, notify 0000ffe2) and current
      0000ffd5, whose only documented characteristic is the write 0000ffd9 —
      no notify was recovered for it, so where the EF 01 77 reply lands on a
      current-build controller is unknown. The commands above target the
      current layout's write, because without them a consumer could not turn
      the strip on at all; state_characteristic names the legacy layout's
      notify, because that is the only readback anyone has documented. The two
      are mutually exclusive on a given unit, and which layout a controller
      revision speaks could not be established without hardware. So: subscribe
      to 0000ffe2 if discovery finds it, and drive the strip write-only if it
      does not — do not fail the device when the subscribe returns
      characteristic-not-found.

cloud:
  required: false
  vendor_service: "None"
  hosts: []
  failure_mode: >
    None. The device is BLE-local only: the app works with no account and
    no internet connection, and no OTA or firmware-download URLs exist in
    the app (only qh-tek.com privacy/about pages). Ad/analytics
    SDKs are bundled in the app but are not functionally required.
  notes: >
    The only vendor hosts referenced by the app are qh-tek.com
    (documentation pages) and the fonewe.com app-download portal; neither
    participates in device control.

local_access:
  status: "native"
  summary: >
    Full local control over BLE as shipped: power, static color and effect
    modes/speed, with no account, pairing or network. Status query is the one
    caveat — the reply characteristic exists only on the legacy GATT layout,
    so readback is conditional on which layout the controller speaks (see the
    LED Strip entity's notes).
  covers:
    - "power on/off"
    - "static RGB(W) color"
    - "dynamic effect modes and speed"
    - "status query"
  not_covered:
    - "microphone/music-reactive mode details (sensitivity encoding unverified)"
    - "scheduling/timers, if supported by the firmware (not extracted)"

