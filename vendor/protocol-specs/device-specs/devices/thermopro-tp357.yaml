# ThermoPro TP357/TP358/TP359/TP393 BLE Hygrometer device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "ThermoPro TP357/TP358/TP359/TP393 Thermometer-Hygrometer"
  manufacturer: "ThermoPro (Adsmart)"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "ble"
  category: "sensor"
  notes: >
    Battery-powered BLE temperature/humidity sensors that broadcast
    readings in BLE advertisement manufacturer data — no connection
    required. Covers the TP35x/TP39x hygrometer family: TP357, TP357S,
    TP358, TP358S, TP359, TP393 and TP397 (matched by advertised name
    prefix "TP35"/"TP39"). TempSpike BBQ probes (TP96x/TP97x, name
    prefixes "TP96"/"TP97") are a different advertisement family handled
    by the same parser library — see the sibling spec
    thermopro-tempspike-bbq, which also covers the vendor's 1086FFF0
    connected GATT protocol for its BBQ line.

    ADVERTISEMENT QUIRK — no real company ID, same shape as Inkbird's
    IBS-TH: the reading starts inside the two bytes that BLE stacks report
    as the manufacturer company identifier. Byte 0 of the AD content
    varies per unit (0xC2 in most captures, 0x82 also seen) and byte 1 is
    the low byte of the temperature, so every distinct temperature
    surfaces as a distinct "company id" (captured keys cluster around
    0xF1C2, 0xEEC2, ...). Discovery must key on the advertised local
    name, never on a fixed company id.

    ON-AIR MANUFACTURER DATA (6 bytes for TP357/TP358/TP359/TP393, 7 for
    TP357S; offsets from the start of the AD structure content):
      byte 0:     per-unit prefix byte (0xC2 / 0x82 observed)
      bytes 1-2:  temperature, signed int16 LE, /10.0 °C
                  (proven: 82 f1 00 1d 02 2c -> 0x00F1 = 241 -> 24.1 °C,
                  humidity 0x1D = 29 %, thermopro-ble test_tp357_raw)
      byte 3:     humidity, uint8, % RH
      byte 4:     battery level in the low 2 bits: 0 -> 1 %, 1 -> 50 %,
                  2 -> 100 % (verified against a laboratory power supply
                  per the parser comment); upper bits unknown
      byte 5:     0x2C in TP357/TP393 captures
      bytes 5-6:  TP357S carries a 2-byte tail instead (0x0B 0x01 observed)
    Sentinel: temperature+humidity bytes FF FF FF mark an invalid
    reading (emitted by TP357S) — drop the packet.

    NAME FORMAT: "TP357 (2142)", "TP357S (3C62)", "TP393 (9376)" — model
    string, space, then the last two bytes of the device MAC as 4 hex
    chars in parentheses (pytp357s mac_to_name_suffix). No service UUIDs
    are advertised in the captured advertisements.

    CONNECTED MODE (TP357S, pytp357s PROTOCOL.md): the S variant exposes
    a GATT history interface under service
    00010203-0405-0607-0809-0a0b0c0d1910 (fixed across units), write char
    ...2b11, notify char ...2b10. A Nordic DFU service (0xFE59) and an
    ASCII version characteristic also exist but are not used for data.
    Session rules and framing are in the services block below; in short:
    every connection needs an 0xa5 datetime-sync write before history
    commands are answered, live readings also arrive connected as
    0xc2 notifications (c2 00 00 <temp s16 LE x10> <hum u8> <XX>),
    and history streams as 0xcccc-framed, 0x6666-terminated record
    triplets (temp x10 s16 LE + humidity), most-recent-first at 1-minute
    intervals. Record count is a 16-bit LE request field; pasky/tp357
    found counts above 28800 (~20 days of minutes) are silently ignored,
    so that is presumably the buffer size, and a battery pull clears
    stored history.

    CONNECTED MODE (original TP357, non-S): a DIFFERENT history protocol
    using opcodes 0xa6/0xa7/0xa8 (year/week/day modes) per pasky/tp357
    and tpy357; those opcodes on a TP357S only echo a live reading. Not
    documented in detail here — see the referenced projects.

    Sources (no APK teardown used for this spec): the
    Bluetooth-Devices/thermopro-ble parser library (copied from Ernst79's
    bleparser / ble_monitor), whose test suite pins the advertisement
    layout against raw captured packets (e.g. AD content 82 f1 00 1d 02 2c
    decodes to 24.1 °C / 29 % / battery-full in test_tp357_raw);
    giovannipizzi/pytp357s PROTOCOL.md for the TP357S connected mode;
    pasky/tp357 for the original TP357 connected mode and buffer limits.
    Confidence: parser-library-derived for advertisements, single-project
    RE for the connected modes; not re-verified against hardware here.

  identification:
    local_name_prefixes: ["TP357", "TP358", "TP359", "TP393", "TP397"]
    manufacturer_data:
      description: >
        Deliberately NO company_id filter: byte 1 of the temperature
        occupies the company-ID high byte, so the reported manufacturer id
        changes with every reading (observed keys 0xF1C2, 0xEEC2, 0xF9C2,
        ...). Identify by local-name prefix TP35/TP39 and the 6-7 byte
        manufacturer data.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            values: ["TP35", "TP39"]
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning, pairing, bonding or account. The device advertises
      continuously; readings are decoded passively. Confidence high for
      the passive decode: pinned by captured advertisements in the
      thermopro-ble test suite and running in production in Home
      Assistant. Connecting is only needed for on-device history
      (TP357/TP357S, see services block) and requires no pairing either —
      only a per-session 0xa5 datetime-sync write on the TP357S.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Passive scan: match local-name prefix TP35/TP39, take the 6- or
          7-byte manufacturer data, decode temperature, humidity and the
          coarse battery level.
        ble:
          pairing_required: false
        steps:
          - action: "Power the sensor on; it advertises immediately."
            actor: user
          - action: "Scan for a local name starting TP35/TP39 with 6-7 byte manufacturer data."
            actor: client
          - action: "Decode temperature (bytes 1-2, s16 LE, /10), humidity (byte 3), battery (byte 4 & 0x03 -> 1/50/100 %)."
            actor: client
            expect: "Live readings; an FF FF FF temperature/humidity triplet is an invalid-reading sentinel — drop it."
    factory_reset:
      applicable: false
      confidence: medium
      effect: >
        No factory reset exists or is needed: the device holds no credentials,
        bindings or client state. Removing the battery for 10+ seconds is the
        only reset relevant to a BLE client — the device simply resumes
        broadcasting. Note a battery pull appears to clear the stored history
        buffer (pasky/tp357).
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Broadcast-only with no bond: any client can decode the
        advertisements; switching controllers is just scanning from the
        new one.
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: "BLE advertisement broadcast, no auth. No Wi-Fi on this family."

  variants:
    - model: "TP357 / TP358 / TP359 / TP393 / TP397"
      notes: >
        6-byte manufacturer data; trailing byte 0x2C observed. The
        original TP357 (non-S) has a connected history mode using opcodes
        0xa6/0xa7/0xa8 (year/week/day) per pasky/tp357 and tpy357 — a
        different protocol from the TP357S, not detailed here.
    - model: "TP357S / TP358S"
      notes: >
        7-byte manufacturer data (2-byte tail, 0x0B 0x01 observed). Can
        emit the FF FF FF invalid-reading sentinel; drop those packets.
        Connected history via the 00010203-...-1910 service (0xa5
        datetime sync, then 0xcccc-framed requests) — see services.

payload_formats:
  TP35x_Advertisement:
    description: >
      6-7 byte manufacturer-specific AD structure (type 0xFF). Byte 0 is
      the start of the AD content — the pseudo company-ID position that
      partly carries the temperature.
    fields:
      - index: 0
        name: "prefix"
        description: "Per-unit byte; 0xC2 common, 0x82 observed. Not a registered company ID."
      - index: 1
        name: "temperature"
        description: "Bytes 1-2, signed int16 LE, /10.0 °C. Spans the company-ID high byte."
      - index: 3
        name: "humidity"
        description: "uint8, % RH."
      - index: 4
        name: "battery"
        description: "Low 2 bits: 0 -> 1 %, 1 -> 50 %, 2 -> 100 %. Upper bits unknown."
      - index: 5
        name: "tail"
        description: "0x2C on 6-byte models; 2-byte tail (0x0B 0x01 observed) on TP357S."
    example: "82 f1 00 1d 02 2c"
    parse_rules:
      - "temperature = s16le(bytes 1-2) / 10.0  -> 0x00F1 = 24.1 °C"
      - "humidity = byte 3                      -> 0x1D = 29 %"
      - "battery = {0:1, 1:50, 2:100}[byte 4 & 0x03]  -> 2 = 100 %"
      - "bytes 1-3 == FF FF FF means invalid reading; drop the packet"
      - "Do not match or filter on the company-ID position; it is data."

services:
  - uuid: "00010203-0405-0607-0809-0a0b0c0d1910"
    name: "ThermoPro TP357S Data Service"
    notes: >
      TP357S connected mode (pytp357s PROTOCOL.md; UUIDs fixed across
      units). The same 00010203-... UUID family appears on some Govee
      hardware with an unrelated protocol — key on the advertised name,
      not the service UUID. The device also exposes a Nordic DFU service
      (0000fe59-...) and a readable ASCII version characteristic, neither
      used for data retrieval.

      SESSION RULES: enable notifications on ...2b10, then write the
      0xa5 datetime sync — the device ignores history commands until it
      receives one on the current connection. Sync frame:
        a5 YY MM DD HH MM SS DOW CS
      (YY = year-2000; DOW 1=Sunday..7=Saturday; CS = sum(all previous
      bytes) & 0xFF). The device answers with a 0xc2 live reading, then
      an `a5 01 13 5a` acknowledgement. The sync is not persisted —
      repeat it on every connection.

      HISTORY REQUEST: three writes ~200 ms apart —
        cmd1 (fixed):  cc cc 02 01 00 00 01 04 66 66
        cmd2 (offset, ignored by firmware):
                       cc cc 04 00 00 00 00 04 66 66
        cmd3:          cc cc 01 09 00 00 00 YY MM DD HH MM SS NL NH CS 66 66
      NL NH = requested record count, uint16 LE. There is no real
      pagination: the device always returns the N most recent records;
      request a large count to get everything. Counts above 28800
      (~20 days of 1-minute records) are silently ignored (pasky/tp357),
      so that is presumably the buffer size.

      HISTORY RESPONSE: reassemble all notification chunks between the
      `cc cc` prefix and the `66 66` suffix, then:
        cc cc 01 [N2 N1 N0] 00 [R R R]... CS 66 66
      N2 N1 N0 = 3-byte LE, (records_returned * 3) + 1; each record R is
      temperature x10 s16 LE + humidity uint8; most-recent-first,
      stepping back one recording interval (1 minute observed). Transfer
      runs ~1500-2000 records/second. Firmware does not appear to reject
      bad checksums.
    characteristics:
      - uuid: "00010203-0405-0607-0809-0a0b0c0d2b11"
        name: "command_write"
        properties: ["write"]
        notes: "Command channel: 0xa5 datetime sync (required once per connection), then the 0xcccc-framed history commands."
      - uuid: "00010203-0405-0607-0809-0a0b0c0d2b10"
        name: "response_notify"
        properties: ["notify"]
        notes: >
          Live readings and history responses. Live frame:
          c2 00 00 <TL TH> <HH> <XX> — temp x10 s16 LE, humidity uint8,
          XX unknown (0x2C common; suspected battery, formula unconfirmed).
          Example: c2 00 00 ef 00 28 2c -> 23.9 °C, 40 %.

ble:
  connection_sequence:
    description: >
      Passive (normal): scan -> match TP35/TP39 name -> decode the 6-7
      byte manufacturer data. No connection ever required for live data.
      History (TP357S): connect -> start notify on ...2b10 -> write 0xa5
      datetime sync to ...2b11 -> wait for c2 live reading + a5 01 13 5a
      ack -> write the three 0xcccc history commands ~200 ms apart ->
      reassemble notifications until the 66 66 terminator -> disconnect.

advertising:
  format: "ble_legacy"
  local_name:
    match: "prefix"
    values: ["TP35", "TP39"]

entities:
  - platform: "sensor"
    name: "Temperature"
    device_class: "temperature"
    unit: "°C"
  - platform: "sensor"
    name: "Humidity"
    device_class: "humidity"
    unit: "%"
  - platform: "sensor"
    name: "Battery"
    device_class: "battery"
    unit: "%"
    notes: "Coarse 3-level mapping from byte 4 low bits: 1 / 50 / 100 %."

