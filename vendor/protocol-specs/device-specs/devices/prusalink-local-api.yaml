# PrusaLink (local printer API) — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; vendor-documented):
#   - prusa3d/Prusa-Link-Web (spec/openapi.yaml) — the official OpenAPI spec.

device:
  name: "PrusaLink (Prusa MK4 / MK3.9 / XL / Mini)"
  manufacturer: "Prusa Research"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The endpoints and auth are
      from Prusa's own PrusaLink OpenAPI spec.
  protocol: "wifi"
  category: "printer"
  pictogram: "3d-printer"
  transport: "http"
  notes: >
    PrusaLink is Prusa's on-printer web server (MK4, MK3.9, XL, Mini) with a
    published OpenAPI spec. Local HTTP on the printer's LAN IP, no cloud. AUTH is
    HTTP Digest (username `maker` + the printer's password/PIN) and/or an
    X-Api-Key header. A legacy OctoPrint-compatible /api/ surface exists for older
    clients.

    ENDPOINTS:
      GET  /api/version                    API + firmware version
      GET  /api/v1/info                     device info
      GET  /api/v1/status                   real-time printer/job/transfer/storage/
                                            camera telemetry
      GET  /api/v1/job                      current job
      PUT  /api/v1/job/{id}/pause | /resume | /continue
      DELETE /api/v1/job/{id}               stop
      PUT  /api/v1/files/{storage}/{path}   upload G-code
      POST /api/v1/files/{storage}/{path}   start a print of an uploaded file
      HEAD /api/v1/files/{storage}/{path}   check presence
      DELETE /api/v1/files/{storage}/{path} remove

  openness:
    status: "documented_api"
    reverse_engineered: false
    source_code: "https://github.com/prusa3d/Prusa-Link-Web"
    upstream_docs:
      - url: "https://github.com/prusa3d/Prusa-Link-Web/blob/master/spec/openapi.yaml"
        title: "PrusaLink — OpenAPI spec"
        covers: "The /api/v1 endpoints, the auth (Digest maker + X-Api-Key), and the OctoPrint-compatible layer."
    notes: >
      Vendor-provided and documented (open OpenAPI spec; the firmware itself is
      GPL). Upstream is authoritative.

  identification:
    default_port: 80
    mdns_service_type: "_http._tcp.local."

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_http._tcp.local."
          port: 80
          identity_mapping:
            stable_keys:
              - source: "http:/api/v1/info#serial"
                key: "serial"
            display:
              source: "http:/api/v1/info#name"
        notes: >
          The printer serves HTTP on its LAN IP (shown on the printer screen).
          Confirm with GET /api/version or /api/v1/info.
    identity:
      stable_keys: ["serial"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "low"
    notes: >
      Enable PrusaLink in the printer's network settings; the screen shows the API
      key/password and IP. Connect with `maker` + password (Digest) or the API
      key header. No cloud.
    methods:
      - type: "device_ui"
        verified: false
        description: >
          Enable PrusaLink in the printer network settings, note the IP and API
          key/password from the screen, then call /api/v1 over HTTP Digest (maker +
          password) or with the X-Api-Key header.
        steps:
          - action: "Enable PrusaLink in the printer network settings; read the IP and API key/password."
            actor: "user"
          - action: "Call GET /api/v1/status (Digest maker + password, or X-Api-Key)."
            actor: "client"
    factory_reset:
      applicable: true
      confidence: medium
      effect: >
        Resets every saved value on the printer to its default state. Expect
        the network configuration and the PrusaLink API key to go with it, so
        any client holding that key must be given the new one.
      description: >
        Menu-driven rather than a button hold. Note that the button under the
        rotary knob is NOT this: it is a reset in the reboot sense — the
        vendor documents it as equivalent to switching the printer off and on
        — and someone reaching for a factory reset will find it first.
      procedures:
        - name: "Factory Reset from the printer's own menu"
          glyph: "generic/on-screen-menu.svg"
          verified: false
          basis: >
            Prusa's MK4/MK3.9 handbook and MK4S user manual, section 4.13
            Factory Reset.
          power_state: "on"
          steps:
            - action: "On the printer's LCD, open Settings, then System, then Factory Reset."
              actor: "user"
              expect: "All saved values return to their default state."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "Network settings are changed from the printer menu while reachable."
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device:
        - "Wi-Fi credentials"
        - "PrusaLink API key / password"
      issued_to_client:
        - "API key / maker password (read from the printer screen)"
      notes: >
        Local control uses the printer's API key / maker password over HTTP
        Digest. Onboarding is via the printer UI, not this API.
  pairing:
    required: true
    confidence: "medium"
    # HTTP-level credential (Digest or X-Api-Key); no link-layer pairing.
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "device_screen"
      notes: >
        The PrusaLink password, generated by the printer and shown on its own
        display under Settings > Network > PrusaLink, alongside the fixed
        username `maker`. Per-unit, so no value appears here. On current
        firmware the same string also serves as the X-Api-Key value; older
        builds offered only the API key. Every client presents the same
        credential — nothing per-client is issued.
    exclusivity:
      single_bond: false
      recovery: >
        A 401 after a firmware update or reset means the password changed: read
        it off the printer again. PrusaSlicer users moving between Digest and
        API-key authentication see the same 401 and fix it by selecting the
        matching method in the slicer's physical-printer settings.
    unpair:
      supported: "unknown"
      notes: >
        There are no per-client credentials to revoke. Owners report being
        able to have the printer generate a new password, which would lock out
        every client at once, but the menu entry was not confirmed here; a
        factory reset is known to reissue it (see setup.factory_reset). There
        is no way to set your own username or password on the printer.
    enter_pairing_mode:
      required: true
      procedures:
        - name: "Enable PrusaLink and read the credentials from the printer menu"
          verified: false
          basis: >
            Prusa's Wi-Fi and PrusaLink setup guide (help.prusa3d.com) for the
            MK4/MK3.9/XL/MINI, which gives the Settings > Network > PrusaLink
            path, and the PrusaLink OpenAPI spec's digest security scheme.
          power_state: "on"
          glyph: "generic/on-screen-menu.svg"
          steps:
            - action: "On the printer's LCD, open Settings > Network > PrusaLink and switch PrusaLink on."
              actor: "user"
            - action: "Note the username (maker), the password and the printer's IP from that screen."
              actor: "user"
            - action: "Call GET /api/v1/status with HTTP Digest (maker + password) or an X-Api-Key header."
              actor: "client"
              expect: "200 with printer telemetry; 401 means a wrong or stale credential."
      notes: >
        A persistent setting rather than a timed window: once on, PrusaLink
        answers whenever the printer is on the network.
    notes: >
      The gate is a per-printer password the printer makes up itself and
      shows on its own screen; the username is always `maker`. Possession of
      that pair is the whole of local authorisation, over HTTP Digest (or the
      same value as X-Api-Key), and it involves no Prusa account — Prusa
      Connect, the vendor cloud, is a separate opt-in and its death costs
      PrusaLink nothing. See setup method `device_ui` and
      `credentials.issued_to_client`.

http_endpoints:
  - method: "GET"
    path: "/api/version"
    name: "API + firmware version"
    description: "PrusaLink API version and firmware — the identity check."
  - method: "GET"
    path: "/api/v1/status"
    name: "Status"
    description: "Real-time printer/job/transfer/storage/camera telemetry (Digest or X-Api-Key)."
  - method: "GET"
    path: "/api/v1/job"
    name: "Current job"
    description: "The current print job (progress, file, times)."
  - method: "PUT"
    path: "/api/v1/job/{id}/pause"
    name: "Pause job"
    description: "Pause the current job (also /resume, /continue; DELETE /api/v1/job/{id} stops)."
  - method: "PUT"
    path: "/api/v1/files/{storage}/{path}"
    name: "Upload G-code"
    description: "Upload a G-code file to the named storage; POST the same path starts a print of it."

commands:
  pause:
    description: "Pause the current job."
    transport: "http"
    method: "PUT"
    path: "/api/v1/job/{id}/pause"
    parameters:
      id:
        type: "integer"
        description: "Current job id (from GET /api/v1/job)."
    verification: "reported"
  resume:
    description: "Resume the current job."
    transport: "http"
    method: "PUT"
    path: "/api/v1/job/{id}/resume"
    parameters:
      id:
        type: "integer"
        description: "Current job id."
    verification: "reported"

entities:
  - platform: "sensor"
    name: "Printer State"
    state_endpoint: "/api/v1/status"
    notes: "printer.state from /api/v1/status."
  - platform: "sensor"
    name: "Job Progress"
    unit: "%"
    state_endpoint: "/api/v1/status"
    notes: "job.progress from /api/v1/status."

helpful_urls:
  - title: "PrusaLink — OpenAPI spec"
    url: "https://github.com/prusa3d/Prusa-Link-Web/blob/master/spec/openapi.yaml"
    description: "The official /api/v1 endpoints, auth, and OctoPrint-compatible layer."
  - title: "Original Prusa MK4 handbook"
    url: "https://www.manualslib.com/manual/3029382/Prusa-Research-Original-Prusa-Mk4.html"
    kind: "manual"
    description: >
      Vendor handbook; section 4.13 is the factory reset this spec documents.
  - title: "Prusa Knowledge Base: Original Prusa MK4"
    url: "https://help.prusa3d.com/manual/original-prusa-mk4-kit-assembly_1967"
    kind: "vendor_support"
    description: >
      Vendor documentation hub, kept current as firmware changes the menus.
