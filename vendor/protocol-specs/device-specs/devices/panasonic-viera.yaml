# Panasonic Viera Network Remote Control — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Local SOAP/UPnP remote control for Panasonic Viera smart TVs (Viera Cast
# 2011-2014, Firefox OS 2015-2018, My Home Screen 2019+). The whole control
# surface lives on TCP port 55000: the UPnP device description at
# /nrc/ddd.xml, the Network Remote Control (NRC) service at /nrc/control_0,
# and a standard UPnP DMR RenderingControl at /dmr/control_0 for absolute
# volume and mute.
#
# Two TV generations share this port. Older sets accept plain SOAP with no
# authentication at all. Sets from circa 2019 (FZ/GZ/HZ/JZ and later) wrap
# every NRC command in an AES-128-CBC + HMAC-SHA-256 envelope after a
# PIN-on-screen pairing; that flow is documented byte for byte in
# nrc_common.encrypted_session, but it is a TRANSPORT GAP for the reference
# app today — its `soap` transport renders plain envelopes only.
#
# Everything here is verification "reported": the vocabulary and wire format
# come from the panasonic-viera Python library (which Home Assistant's
# panasonic_viera integration drives daily) and from a community Lua port
# whose author confirmed a power toggle against a live set. Nothing in this
# file has been replayed against hardware by this project.

device:
  name: "Panasonic Viera Network Remote Control"
  manufacturer: "Panasonic"
  manufacturer_status: "active"
  protocol: "wifi"
  category: "tv"
  transport: "soap"
  notes: >
    Panasonic Viera smart TVs expose a UPnP-style SOAP API on port 55000 with
    no authentication on pre-2019 sets. Discovery is SSDP M-SEARCH for
    urn:panasonic-com:device:p00RemoteController:1; the LOCATION header points
    at http://<ip>:55000/nrc/ddd.xml, the device description that carries UDN,
    friendlyName and modelNumber. Control is POST /nrc/control_0 with service
    urn:panasonic-com:service:p00NetworkControl:1: X_SendKey takes an
    X_KeyEvent argument of NRC_*-ONOFF key names (one SOAP call per button
    press-and-release), X_GetVectorInfo and X_GetAppList query state, and
    X_LaunchApp starts apps by product_id. Absolute volume and mute live on a
    standard UPnP DMR RenderingControl service at /dmr/control_0. From circa
    2019 the NRC service requires PIN pairing and AES-encrypted commands; the
    sets advertise this by listing X_GetEncryptSessionId in their service
    description at /nrc/sdd_0.xml. Power-on over the network works only from
    network standby — enable it on the TV under Settings > Network > TV Remote
    App Settings ("Powered On By Apps" / "Networked Standby"); otherwise use
    Wake-on-LAN. Several older plasma models on the Home Assistant supported
    list are noted as unable to power on over the network at all.
  openness:
    status: "undocumented"
    reverse_engineered: true
    upstream_docs:
      - url: "https://github.com/florianholzapfel/panasonic-viera"
        title: "panasonic-viera — Python library (Home Assistant's backend)"
        covers: >
          The entire wire protocol: SSDP search target, port 55000, the NRC
          and DMR control URLs, the X_SendKey/X_GetVectorInfo/X_GetAppList/
          X_LaunchApp actions and their arguments, and the full 2019+ PIN
          pairing and AES-CBC-128/HMAC-SHA-256 session encryption.
      - url: "https://www.home-assistant.io/integrations/panasonic_viera/"
        title: "Home Assistant — Panasonic Viera integration"
        covers: >
          Pairing UX (PIN shown on the TV), the "Powered On By Apps" network
          standby setting, the supported-model list including models that
          cannot power on over the network, and the undocumented
          NRC_HDMI1-4 / NRC_NETFLIX / NRC_APPS / NRC_MYAPP key names.
      - url: "https://forum.logicmachine.net/showthread.php?tid=232"
        title: "LogicMachine forum — Panasonic Viera TV IP control"
        covers: >
          Independent Lua re-implementation, including a user-confirmed
          NRC_POWER-ONOFF against a live 2016-era set and a complete port of
          the encrypted pairing/session flow.
    notes: >
      Panasonic never published this API. Every byte documented here was
      recovered by the community — the 2019+ encryption was reverse
      engineered out of the official app's libtvconnect.so (see
      panasonic-viera issue #9) — so nothing upstream is authoritative.

  identification:
    ssdp_search_targets:
      - "urn:panasonic-com:device:p00RemoteController:1"
    # No mdns_service_type: nothing in the community sources shows these sets
    # announcing a uniquely identifying mDNS service.
    default_port: 55000
    identity_keys:
      primary: "udn"
      secondary: "model_number"
      display: "friendly_name"

  discovery:
    methods:
      - type: "ssdp"
        ssdp:
          search_targets: ["urn:panasonic-com:device:p00RemoteController:1"]
          query_path: "/nrc/ddd.xml"
          response_mapping:
            location:
              url: "LOCATION"
              action: "fetch_xml"
              parse:
                device_identity:
                  stable_keys:
                    - source: "xml://root/device/UDN"
                      key: "udn"
                    - source: "xml://root/device/modelNumber"
                      key: "model_number"
                  display:
                    source: "xml://root/device/friendlyName"
                  variant:
                    source: "xml://root/device/modelNumber"
    identity:
      stable_keys: ["udn"]
      display: "friendly_name"
      notes: >
        UDNs observed on Viera sets start "uuid:4D454930-" (4D454930 is
        ASCII "MEI0"); Home Assistant uses the UDN as its unique id, so a
        client should too. The sets also answer ssdp:all and upnp:rootdevice,
        but the p00RemoteController:1 search target is the identifying signal.
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      TV onboarding is entirely on the TV's own screen; there is no
      app-driven provisioning to reimplement. The NRC API itself needs no
      pairing on pre-2019 sets — it is open to every host on the LAN once the
      TV is on the network. On circa-2019-and-later sets a one-time client
      pairing is required instead: the client asks the TV to show a 4-digit
      PIN, submits it, and receives an application id and encryption key it
      must store and reuse (the full flow is in nrc_common.encrypted_session).
      Pairing is per client, not per network: re-pair only if the stored
      credentials are lost or the TV is factory reset.
    methods:
      - type: "device_ui"
        verified: false
        description: >
          First-run setup on the TV with the bundled remote: language,
          network selection (WiFi passphrase entry or Ethernet), then on
          smart models a Viera account prompt that gates app store features,
          not the NRC API. Afterwards confirm network remote control is
          enabled — Settings > Network > TV Remote App Settings — and, if
          power-on-over-LAN is wanted, enable "Powered On By Apps" /
          "Networked Standby" in the same menu (naming varies by model year).
        steps:
          - action: "Power on the TV and complete the on-screen setup with the remote."
            actor: "user"
          - action: "Join the WiFi network (or connect Ethernet) on the TV itself."
            actor: "user"
            expect: "TV reports a successful connection."
          - action: "Enable network remote control under Settings > Network > TV Remote App Settings."
            actor: "user"
            notes: "Naming varies by model year; on some sets this is on by default."
          - action: "Confirm the NRC API is reachable from the LAN."
            actor: "client"
            request:
              protocol: "http"
              action: "GET /nrc/ddd.xml"
            expect: "XML device description on port 55000."
          - action: "On encrypted sets, run the PIN pairing from nrc_common.encrypted_session."
            actor: "client"
            request:
              protocol: "soap"
              action: "X_DisplayPinCode, then X_RequestAuth with the on-screen PIN"
            expect: "Stored X_ApplicationId and X_Keyword (encryption key); TV shows a pairing-complete message."
      - type: "none"
        verified: false
        description: >
          Pre-2019 sets: nothing further — X_SendKey works from any LAN host
          with no credentials. Detect the generation by fetching /nrc/sdd_0.xml
          and looking for the X_GetEncryptSessionId action (its presence means
          pairing is required), which is exactly what the panasonic-viera
          library does.
    factory_reset:
      confidence: "low"
      effect: "Clears network credentials, paired clients, account link, apps and settings; the TV returns to first-run setup."
      procedures:
        - name: "Menu factory reset"
          steps:
            - action: "Menu > Setup > System Menu > Factory Defaults (some model years: 'Shipping Condition')."
              actor: "user"
              notes: >
                Menu path varies by generation and region; taken from
                Panasonic manual conventions, not verified here against a
                specific model's manual.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Re-running the network setup from the TV's settings menu changes only
        the network; a factory reset is never needed just to change routers.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "WiFi credentials"
        - "Paired-client list (encrypted models)"
      issued_to_client:
        - "X_ApplicationId (encrypted models)"
        - "X_Keyword — base64 16-byte key the session AES/HMAC keys derive from (encrypted models)"
      notes: >
        Pre-2019 sets have no access control at all: anything that can route
        to port 55000 can drive the TV. On encrypted models the issued
        X_ApplicationId/X_Keyword pair is the whole credential — store both
        and treat the keyword as a secret.

  variants:
    - model: "TX-42AS650"
      name: "Panasonic Viera TX-42AS650 (2014)"
      identification:
        model_number: "TX-42AS650"
      characteristics:
        - "On Home Assistant's supported list; pre-encryption generation, plain SOAP."
    - model: "TX-55FZ802B"
      name: "Panasonic Viera TX-55FZ802B OLED (2018)"
      identification:
        model_number: "TX-55FZ802B"
      characteristics:
        - "FZ series is the example the panasonic-viera library gives for the 2019-era PIN + AES encrypted generation."
    - model: "TX-65HZ1500"
      name: "Panasonic Viera TX-65HZ1500 OLED (2020)"
      identification:
        model_number: "TX-65HZ1500"
      characteristics:
        - "On Home Assistant's supported list; encrypted generation."
  # The much longer community-maintained list of models reported working
  # (including several that cannot power on over the network) is on the
  # Home Assistant integration page cited in helpful_urls.

helpful_urls:
  - title: "panasonic-viera — Python library (protocol reference implementation)"
    url: "https://github.com/florianholzapfel/panasonic-viera"
  - title: "panasonic-viera keys.py — the full NRC_* key vocabulary"
    url: "https://github.com/florianholzapfel/panasonic-viera/blob/master/panasonic_viera/keys.py"
  - title: "panasonic-viera apps.py — known app product IDs"
    url: "https://github.com/florianholzapfel/panasonic-viera/blob/master/panasonic_viera/apps.py"
  - title: "Home Assistant Panasonic Viera integration (supported models, settings, PIN pairing UX)"
    url: "https://www.home-assistant.io/integrations/panasonic_viera/"
  - title: "Home Assistant panasonic_viera config_flow.py (UDN as unique id, pairing step)"
    url: "https://raw.githubusercontent.com/home-assistant/core/dev/homeassistant/components/panasonic_viera/config_flow.py"
  - title: "Turgon37/panasonic-viera fork — SSDP discover with the p00RemoteController:1 search target"
    url: "https://github.com/Turgon37/panasonic-viera/blob/master/panasonic_viera/remote_control.py"
  - title: "LogicMachine forum thread — independent Lua implementation, live power-toggle confirmation, encrypted flow port"
    url: "https://forum.logicmachine.net/showthread.php?tid=232"
  - title: "uc-intg-panasonicviera — Unfolded Circle integration (second open consumer of this protocol)"
    url: "https://github.com/mase1981/uc-intg-panasonicviera"

# Everything needed to build a Viera NRC request byte for byte, in the role
# soap_common plays for Wemo. The plain-SOAP shape is standard UPnP control;
# the 2019+ encrypted session is where the work is, and it is documented
# below in full because no consumer will find it anywhere but the library
# source.
nrc_common:
  transport: "HTTP POST"
  port: 55000
  content_type: "text/xml; charset=utf-8"
  soapaction_format: "\"urn:<serviceType>#<Action>\""
  request_format:
    description: >
      Everything needed to build a plain (pre-2019) Viera SOAP request byte
      for byte. All NRC actions go to one URL; the action is chosen by the
      SOAPACTION header and the body's action element.
    http:
      method: "POST"
      url: "http://<ip>:55000/nrc/control_0"
      headers:
        Host: "<ip>:55000"
        Content-Type: "text/xml; charset=utf-8"
        SOAPACTION: "\"urn:panasonic-com:service:p00NetworkControl:1#<Action>\"  (literal double quotes are part of the value)"
    argument_qualification: >
      Action arguments are UNQUALIFIED: send <X_KeyEvent>...</X_KeyEvent>,
      with the xmlns:u declared ON THE ACTION ELEMENT. Same convention as
      Wemo, and the same XML-library caveat applies.
    template: |
      <?xml version="1.0" encoding="utf-8"?>
      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
      <s:Body>
      <u:{action} xmlns:u="urn:{serviceType}">
      {arguments}
      </u:{action}>
      </s:Body>
      </s:Envelope>
    example:
      description: "X_SendKey pressing the Home key, as it goes on the wire."
      body: |
        <?xml version="1.0" encoding="utf-8"?>
        <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
        <s:Body>
        <u:X_SendKey xmlns:u="urn:panasonic-com:service:p00NetworkControl:1">
        <X_KeyEvent>NRC_HOME-ONOFF</X_KeyEvent>
        </u:X_SendKey>
        </s:Body>
        </s:Envelope>
  response_format:
    description: >
      Standard UPnP SOAP: the Body's single child is <Action>Response, its
      children the named return values (X_GetVectorInfo answers
      X_NewVectorInfo, X_GetAppList answers X_AppList). A Body child named
      Fault is an error; the TV answers HTTP 500 with an errorCode element
      (600 = invalid PIN during pairing).
    parse_rule: "envelope -> Body -> first child -> {child.tag: child.text}"
    errors:
      http_500_soap_fault: >
        Error responses are HTTP 500 carrying a SOAP Fault with errorCode and
        errorDescription elements — do not treat the HTTP status alone as a
        transport failure.
  services:
    nrc:
      service_type: "urn:panasonic-com:service:p00NetworkControl:1"
      control_url: "/nrc/control_0"
      scpd_url: "/nrc/sdd_0.xml"
      device_description_url: "/nrc/ddd.xml"
      actions:
        - "X_SendKey"
        - "X_RemoteControl"
        - "X_GetVectorInfo"
        - "X_GetAppList"
        - "X_LaunchApp"
        - "X_ConnectApp"
        - "X_GetEncryptSessionId"
        - "X_DisplayPinCode"
        - "X_RequestAuth"
        - "X_EncryptedCommand"
      notes: >
        X_SendKey and X_RemoteControl both take <X_KeyEvent>NRC_*-ONOFF</X_KeyEvent>
        and press a key; different firmware generations expose one, the other,
        or both — the panasonic-viera library sends X_SendKey, older community
        write-ups use X_RemoteControl. Take the real action list from the
        set's own SCPD at /nrc/sdd_0.xml rather than assuming either. The
        X_GetEncryptSessionId/X_DisplayPinCode/X_RequestAuth/X_EncryptedCommand
        quartet appears only on the 2019+ encrypted generation.
    dmr:
      service_type: "urn:schemas-upnp-org:service:RenderingControl:1"
      control_url: "/dmr/control_0"
      actions:
        - "GetVolume"
        - "SetVolume"
        - "GetMute"
        - "SetMute"
      notes: >
        A standard UPnP AV RenderingControl endpoint: absolute volume 0-100
        and boolean mute on InstanceID 0, Channel Master. Useful alongside
        the NRC step keys because it can READ the level back.
  encrypted_session:
    applies_to: >
      Sets whose /nrc/sdd_0.xml actionList contains X_GetEncryptSessionId —
      circa 2019 and later (FZ/GZ/HZ/JZ and onward). Detect at runtime exactly
      this way; do not guess from the model string.
    transport_gap: >
      NOT SUPPORTED by the reference app's `soap` transport today: the
      transport renders plain envelopes, while this generation needs AES-128-CBC
      encryption, HMAC-SHA-256, base64, a persistent sequence counter and
      stored credentials around every NRC command. A consumer must implement
      the flow below as a wrapper around the same SOAP POST; the DMR volume
      service stays plain and works on both generations.
    payload_encoding: >
      Every encrypted argument shares one encoding, used in both directions.
      Plaintext: a 16-byte header (12 random bytes, then the 4-byte big-endian
      length of the following XML fragment) followed by the XML fragment
      itself, zero-padded to a multiple of 16 bytes. Encrypt with AES-128-CBC
      (zero padding, i.e. none added beyond the zero pad). Append the
      HMAC-SHA-256 of the ciphertext, keyed with the HMAC key. Base64 the
      concatenation — that string is what rides inside the XML argument.
      Decryption reverses it: base64-decode, split off the trailing 32-byte
      HMAC, AES-decrypt, skip the 16-byte header, cut at the first NUL.
    pairing:
      description: >
        One-time. Yields the two credentials device.setup.credentials.issued_to_client
        names; store both and never pair again unless they are lost.
      steps:
        - action: >
            Send X_DisplayPinCode with argument <X_DeviceName>{client name}</X_DeviceName>.
            The TV overlays a 4-digit PIN on its screen. Response carries
            X_ChallengeKey, base64 of a 16-byte challenge — this challenge IS
            the pairing IV.
          actor: "client"
        - action: "Read the 4-digit PIN off the TV screen and hand it to the client."
          actor: "user"
        - action: >
            Derive the pairing keys from the challenge IV. AES key: process
            the IV in 4-byte groups, emitting each group REVERSED and with
            each byte bitwise-NOTed (key[4g..4g+3] = ~iv[4g+3], ~iv[4g+2],
            ~iv[4g+1], ~iv[4g]). HMAC key (32 bytes): the constant mask
            15 C9 5A C2 B0 8A A7 EB 4E 22 8F 81 1E 34 D0 4F A5 4B A7 DC AC
            98 79 FA 8A CD A3 FC 24 4F 38 54 XORed against the IV with a
            per-position rotation, exactly as panasonic-viera's
            authorize_pin_code implements it: stepping i by 4, hmac[i] =
            mask[i] XOR iv[(i+2)&0xF], hmac[i+1] = mask[i+1] XOR
            iv[(i+3)&0xF], hmac[i+2] = mask[i+2] XOR iv[i&0xF], hmac[i+3] =
            mask[i+3] XOR iv[(i+1)&0xF]. Encrypt
            "<X_PinCode>{pin}</X_PinCode>" per payload_encoding and send it as
            <X_AuthInfo>{encrypted}</X_AuthInfo> to X_RequestAuth.
          actor: "client"
          expect: "HTTP 500 / errorCode 600 means a wrong PIN."
        - action: >
            Decrypt the X_AuthResult return value with the same pairing keys;
            inside is <X_ApplicationId> and <X_Keyword>. Store both. The
            keyword is base64 of 16 bytes that anchor every later session.
          actor: "client"
    session:
      description: >
        Run once per client process start (credentials already stored).
      steps:
        - action: >
            Derive the session keys from base64-decoded X_Keyword. IV: the
            keyword bytes themselves. AES key: each 4-byte group SWAPPED in
            pairs (key[4g..4g+3] = iv[4g+2], iv[4g+3], iv[4g], iv[4g+1]) — no
            NOT this time; the pairing and session derivations differ and
            mixing them up is the classic implementation bug. HMAC key: the IV
            bytes concatenated twice (32 bytes).
          actor: "client"
        - action: >
            Encrypt "<X_ApplicationId>{app_id}</X_ApplicationId>" with the
            session keys and send X_GetEncryptSessionId with
            <X_ApplicationId>{app_id}</X_ApplicationId><X_EncInfo>{encrypted}</X_EncInfo>.
            Decrypt the X_EncResult reply; inside is <X_SessionId>.
          actor: "client"
        - action: >
            Set a per-session sequence counter to 1. It increments on every
            successful command and rolls nothing back on transport errors
            (panasonic-viera decrements it again if the POST itself fails).
          actor: "client"
    command_envelope:
      description: >
        How every NRC command (X_SendKey, X_GetVectorInfo, X_LaunchApp, ...)
        travels on an encrypted set. The three pairing/session actions above
        are the only ones sent plain.
      template: >
        Build "<X_SessionId>{session_id}</X_SessionId>" +
        "<X_SequenceNumber>{seq as 8-digit zero-padded decimal}</X_SequenceNumber>" +
        "<X_OriginalCommand><u:{action} xmlns:u=\"urn:panasonic-com:service:p00NetworkControl:1\">{arguments}</u:{action}></X_OriginalCommand>",
        encrypt it per payload_encoding with the session keys, then send the
        plain action X_EncryptedCommand with arguments
        <X_ApplicationId>{app_id}</X_ApplicationId><X_EncInfo>{encrypted}</X_EncInfo>.
        The reply's X_EncResult decrypts the same way and contains the
        command's real <Action>Response fragment.
    evidence: "reported — panasonic-viera remote_control.py and the LogicMachine Lua port agree byte for byte; the mask constant comes from the official app's libtvconnect.so (panasonic-viera issue #9)."

# The action catalogue: what exists on the TV, what each takes and returns.
# All POSTs are SOAP to the control URL in `path` (envelope per
# nrc_common.request_format); on 2019+ sets every NRC action below except the
# three pairing/session actions additionally rides inside X_EncryptedCommand
# (nrc_common.encrypted_session). `commands` then names individual
# invocations the entities bind.
http_endpoints:
  - method: "GET"
    path: "/nrc/ddd.xml"
    name: "Device Description"
    description: >
      UPnP device description: deviceType urn:panasonic-com:device:p00RemoteController:1,
      friendlyName, manufacturer, modelName, modelNumber, UDN. This is the
      identity document discovery parses; Home Assistant keys its config
      entry on the UDN. Open on both generations, no auth.
    response_body:
      content_type: "text/xml"
  - method: "GET"
    path: "/nrc/sdd_0.xml"
    name: "NRC Service Description"
    description: >
      SCPD for the NRC service. Its actionList is the generation detector:
      X_GetEncryptSessionId present means the 2019+ PIN + AES pairing is
      required (nrc_common.encrypted_session); absent means plain SOAP.
    response_body:
      content_type: "text/xml"
  - method: "POST"
    path: "/nrc/control_0"
    name: "Send Key"
    description: >
      Action X_SendKey, argument <X_KeyEvent>NRC_*-ONOFF</X_KeyEvent>: one
      press-and-release of a remote key. Some firmware generations expose the
      same function as X_RemoteControl instead — same argument, same effect;
      check /nrc/sdd_0.xml. The `commands` block names one invocation per
      key. Replies are an empty X_SendKeyResponse on success.
  - method: "POST"
    path: "/nrc/control_0"
    name: "Vector Info"
    description: >
      Action X_GetVectorInfo, no arguments; answers X_NewVectorInfo, a
      Panasonic-internal device/node identification string. Kept for
      completeness — discovery gets everything it needs from ddd.xml.
    response_body:
      content_type: "text/xml"
  - method: "POST"
    path: "/nrc/control_0"
    name: "App List"
    description: >
      Action X_GetAppList, no arguments; answers X_AppList, a flat
      quote-delimited string of 'vc_app' entries each carrying
      product_id=<16 hex chars> and a display name (panasonic-viera parses it
      with regex, not XML). Not usable as a select's options_source — the
      options_source contract wants one XML element per option — which is why
      the App entity below carries a static table instead.
    response_body:
      content_type: "text/xml"
  - method: "POST"
    path: "/nrc/control_0"
    name: "Launch App"
    description: >
      Action X_LaunchApp with <X_AppType>vc_app</X_AppType> and
      <X_LaunchKeyword>product_id={product_id}</X_LaunchKeyword> (or
      resource_id={n} for built-in functions — resource_id 1063 opens the web
      browser). Launches an installed app by the product_id the App List
      action returns.
  - method: "POST"
    path: "/nrc/control_0"
    name: "Display PIN Code"
    description: >
      Action X_DisplayPinCode, argument <X_DeviceName>{client name}</X_DeviceName>:
      pairing step 1 on 2019+ sets. TV shows a 4-digit PIN; response carries
      the X_ChallengeKey. See nrc_common.encrypted_session.pairing.
  - method: "POST"
    path: "/nrc/control_0"
    name: "Request Auth"
    description: >
      Action X_RequestAuth, argument <X_AuthInfo>{encrypted PIN}</X_AuthInfo>:
      pairing step 2. Error code 600 = wrong PIN. Success returns X_AuthResult
      holding the X_ApplicationId/X_Keyword credentials.
  - method: "POST"
    path: "/nrc/control_0"
    name: "Get Encrypt Session Id"
    description: >
      Action X_GetEncryptSessionId: opens an encrypted session for stored
      credentials and returns the X_SessionId every X_EncryptedCommand
      needs. See nrc_common.encrypted_session.session.
  - method: "POST"
    path: "/nrc/control_0"
    name: "Encrypted Command"
    description: >
      Action X_EncryptedCommand: the wrapper every other NRC action rides in
      on 2019+ sets, with X_ApplicationId and X_EncInfo arguments. Envelope
      construction is in nrc_common.encrypted_session.command_envelope.
  - method: "POST"
    path: "/dmr/control_0"
    name: "Get Volume"
    description: >
      Standard UPnP RenderingControl GetVolume (InstanceID 0, Channel
      Master); answers CurrentVolume, 0-100. Plain SOAP on BOTH generations —
      the 2019+ encryption wraps only the NRC service.
    response_body:
      content_type: "text/xml"
  - method: "POST"
    path: "/dmr/control_0"
    name: "Set Volume"
    description: >
      RenderingControl SetVolume with DesiredVolume 0-100. Plain SOAP on both
      generations.
  - method: "POST"
    path: "/dmr/control_0"
    name: "Get Mute"
    description: >
      RenderingControl GetMute; answers CurrentMute 0/1. Plain SOAP on both
      generations.
    response_body:
      content_type: "text/xml"
  - method: "POST"
    path: "/dmr/control_0"
    name: "Set Mute"
    description: >
      RenderingControl SetMute with DesiredMute 0/1. Plain SOAP on both
      generations.

# One invocation per remote key, in the shape entities can bind: a `press`
# role needs a command with no caller-supplied blanks, so each key is its own
# command with the NRC_* name already in the arguments — the same
# one-command-per-option convention as the Roku ECP spec, applied to SOAP.
# Every NRC command here is an instance of the Send Key endpoint above; on
# 2019+ sets each additionally rides inside X_EncryptedCommand
# (nrc_common.encrypted_session) — a transport gap for the reference app
# today, since its `soap` transport renders plain envelopes only.
#
# Verification is "reported" throughout: the vocabulary is keys.py from the
# panasonic-viera library, exercised daily by Home Assistant, plus the
# NRC_HDMI1-4 / NRC_NETFLIX / NRC_APPS / NRC_MYAPP names Home Assistant's
# docs call out as undocumented-but-working. Nothing has been replayed
# against hardware here.
commands:
  # -- Power. NRC_POWER is a TOGGLE, not discrete on/off. Powering on over
  #    the network only works from network standby ("Powered On By Apps" /
  #    "Networked Standby" enabled on the TV); several older plasma models on
  #    Home Assistant's supported list cannot power on over the network at
  #    all — use Wake-on-LAN there.
  press_power:
    description: "Power toggle. Network wake needs network standby enabled on the TV (see above)."
    transport: "soap"
    service: "urn:panasonic-com:service:p00NetworkControl:1"
    action: "X_SendKey"
    arguments:
      X_KeyEvent: "NRC_POWER-ONOFF"
    verification: "reported"
    example_body: |
      <?xml version="1.0" encoding="utf-8"?>
      <s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
      <s:Body>
      <u:X_SendKey xmlns:u="urn:panasonic-com:service:p00NetworkControl:1">
      <X_KeyEvent>NRC_POWER-ONOFF</X_KeyEvent>
      </u:X_SendKey>
      </s:Body>
      </s:Envelope>

  # -- Navigation.
  press_home:
    description: "Viera home screen (My Home Screen on 2019+ sets)."
    transport: "soap"
    service: "urn:panasonic-com:service:p00NetworkControl:1"
    action: "X_SendKey"
    arguments:
      X_KeyEvent: "NRC_HOME-ONOFF"
    verification: "reported"
  press_menu:
    description: "Open the TV settings menu."
    transport: "soap"
    service: "urn:panasonic-com:service:p00NetworkControl:1"
    action: "X_SendKey"
    arguments:
      X_KeyEvent: "NRC_MENU-ONOFF"
    verification: "reported"
  press_up:
    description: "D-pad up."
    transport: "soap"
    service: "urn:panasonic-com:service:p00NetworkControl:1"
    action: "X_SendKey"
    arguments:
      X_KeyEvent: "NRC_UP-ONOFF"
    verification: "reported"
  press_down:
    description: "D-pad down."
    transport: "soap"
    service: "urn:panasonic-com:service:p00NetworkControl:1"
    action: "X_SendKey"
    arguments:
