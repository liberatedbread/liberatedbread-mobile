  # -- Apps. The one command here that takes a caller value: which app, by
  #    the product_id the App List action returns. X_LaunchApp's resource_id
  #    form (built-in functions; 1063 = web browser) is not exposed as a
  #    command — the App entity only ever launches by product_id.
  launch_app:
    description: >
      Launch an installed app by 16-hex-character product_id. Ids come from
      the App List action (X_GetAppList); the App entity below carries the
      widely-deployed subset as static options because the action's reply is
      a flat string, not XML elements an options_source could walk.
    transport: "soap"
    service: "urn:panasonic-com:service:p00NetworkControl:1"
    action: "X_LaunchApp"
    arguments:
      X_AppType: "vc_app"
      X_LaunchKeyword: "product_id={product_id}"
    parameters:
      product_id:
        type: "string"
        required: true
        description: "16 hex characters from X_GetAppList, e.g. \"0010000200000001\" for Netflix."
    verification: "reported"

# The remote, as controls. Declaration order follows a Viera remote's own
# layout: power, tuner/input, navigation, playback transport, volume and
# channels, digits, then broadcast extras and inputs.
#
# Buttons are unscoped by generation even though 2019+ sets wrap every NRC
# key in X_EncryptedCommand: the command set is identical on both
# generations, and which wrapper a press needs is a runtime property the
# consumer detects from /nrc/sdd_0.xml (nrc_common.encrypted_session), not
# something a static entity list can express. On the reference app today
# these buttons work only against pre-2019 sets — its `soap` transport
# renders plain envelopes; the encrypted wrapper is the recorded transport
# gap.
entities:
  - platform: "button"
    name: "Power"
    icon: "mdi:power"
    commands:
      press: "press_power"
    notes: "Toggle, not discrete on/off; network wake needs network standby enabled — see commands.press_power."
  - platform: "button"
    name: "TV"
    icon: "mdi:television-classic"
    commands:
      press: "press_input_tuner"
  - platform: "button"
    name: "Input"
    icon: "mdi:video-input-hdmi"
    commands:
      press: "press_input_toggle"
    notes: "Cycles inputs; direct HDMI selection is the HDMI 1-4 buttons below."
  - platform: "button"
    name: "Home"
    icon: "mdi:home"
    commands:
      press: "press_home"
  - platform: "button"
    name: "Menu"
    icon: "mdi:menu"
    commands:
      press: "press_menu"
  - platform: "button"
    name: "Up"
