    action: "X_SendKey"
    arguments:
      X_KeyEvent: "NRC_30S_SKIP-ONOFF"
    verification: "reported"

  # -- Volume. Step keys on the NRC service; absolute set/readback lives on
  #    the DMR RenderingControl service, which is plain SOAP on both
  #    generations.
  press_volume_up:
    description: "Volume up one step."
    transport: "soap"
    service: "urn:panasonic-com:service:p00NetworkControl:1"
    action: "X_SendKey"
    arguments:
      X_KeyEvent: "NRC_VOLUP-ONOFF"
    verification: "reported"
  press_volume_down:
    description: "Volume down one step."
    transport: "soap"
    service: "urn:panasonic-com:service:p00NetworkControl:1"
    action: "X_SendKey"
    arguments:
      X_KeyEvent: "NRC_VOLDOWN-ONOFF"
    verification: "reported"
  press_mute:
    description: "Mute toggle."
    transport: "soap"
    service: "urn:panasonic-com:service:p00NetworkControl:1"
    action: "X_SendKey"
    arguments:
      X_KeyEvent: "NRC_MUTE-ONOFF"
    verification: "reported"
  set_volume:
    description: "Set absolute volume 0-100 via DMR RenderingControl. Plain SOAP on both TV generations."
    transport: "soap"
    service: "urn:schemas-upnp-org:service:RenderingControl:1"
    action: "SetVolume"
    arguments:
      InstanceID: "0"
      Channel: "Master"
      DesiredVolume: "{volume}"
    parameters:
      volume:
        type: "string"
        required: true
        description: "0-100. panasonic-viera rejects values outside that range client-side; the library types it int, rendered here as the XML text."
    verification: "reported"
  set_mute_on:
    description: "Mute via DMR RenderingControl (discrete, unlike the NRC_MUTE toggle key). Plain SOAP on both generations."
    transport: "soap"
    service: "urn:schemas-upnp-org:service:RenderingControl:1"
    action: "SetMute"
    arguments:
      InstanceID: "0"
      Channel: "Master"
      DesiredMute: "1"
    verification: "reported"
  set_mute_off:
    description: "Unmute via DMR RenderingControl. Plain SOAP on both generations."
    transport: "soap"
    service: "urn:schemas-upnp-org:service:RenderingControl:1"
    action: "SetMute"
    arguments:
      InstanceID: "0"
      Channel: "Master"
      DesiredMute: "0"
    verification: "reported"

  # -- Live TV.
  press_channel_up:
    description: "Next tuner channel."
    transport: "soap"
