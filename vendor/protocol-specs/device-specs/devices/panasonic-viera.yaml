  # The app launcher: a select whose options are the widely-deployed
  # product_ids from panasonic-viera's apps.py. X_GetAppList can enumerate a
  # given set's real list at runtime, but its reply is a flat
  # quote-delimited string — not the one-XML-element-per-option shape
  # `options_source` is defined against — so the table lives here and a
  # consumer that can parse the string may replace it. Selecting an option IS
  # launching it; there is no set-without-switch semantics, and no way to
  # read the foreground app back, so the select carries no state source.
  - platform: "select"
    name: "App"
    icon: "mdi:application-outline"
    state_mapping:
      options:
        "0010000200000001": "Netflix"
        "0070000200180001": "YouTube"
        "0010000100180001": "Amazon Prime Video"
        "0020000A00000010": "BBC iPlayer"
        "0387878700000124": "ITVX"
        "0387878700000125": "All 4"
        "0077777700160002": "Web Browser"
        "0387878700000013": "Recorded TV"
    commands:
      select_option: "launch_app"
    notes: >
      Options are the community-known product_ids (panasonic-viera apps.py);
      regional availability varies and absent ids are ignored by the TV.
      Query X_GetAppList for the set's actual list where possible.
