device:
  name: "Elgato Key Light classic HTTP family"
  manufacturer: "Elgato / Corsair"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The cited community protocol
      characterisation exercised a Key Light Air, Key Light Mini and Light
      Strip live; the remaining model coverage is reported, not confirmed.
  protocol: "wifi"
  category: "light"
  transport: "http"
  notes: >
    Local control for classic Elgato lights over unauthenticated HTTP/JSON on
    TCP 9123. Covered are the Key Light, Key Light Air, Key Light MK.2, Key
    Light Neo, Key Light Mini, Ring Light, Light Strip and Light Strip Pro when
    they publish the classic HTTP surface. The Key Light Air MK.2 (board 214)
    is deliberately excluded: it uses mutual-TLS WebSocket JSON-RPC on the same
    port, not this API. A client distinguishes them by the absence of the mDNS
    `tls` TXT key here, never by guessing from the product name.

    No cloud or pairing is needed for control. The HTTP surface is
    unauthenticated and effectively single-threaded: use one keep-alive
    connection per light and do not issue parallel requests. The same surface
    also exposes destructive operations, so only the declared commands should
    be sent. Range handling varies by model and neither rejects nor clamps
    consistently; clamp client-side to the declared ranges.

  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/frenck/python-elgato"
    license: "MIT"
    upstream_docs:
      - url: "https://github.com/passtas/matterbridge-elgato/blob/main/docs/elgato-protocol.md"
        title: "Elgato local HTTP + mDNS protocol"
        covers: "Live-verified mDNS records, CCT/HSV/scene state shapes, partial PUT semantics, ranges, identity and Key Light Mini battery fields."
      - url: "https://github.com/schlarpc/elgato-key-light-mini-firmware-re/blob/main/docs/03-http-api.md"
        title: "Key Light Mini firmware reverse engineering — HTTP API"
        covers: "Classic endpoint surface, firmware-update exchange and status behaviour."
    notes: >
      Only derived protocol facts are recorded here. Vendor application
      internals, proprietary firmware and signing material are not part of this
      specification. The live community results and the independent client
      implementations agree on the control surface below.

  identification:
    default_port: 9123
    mdns_service_type: "_elg._tcp.local."
    mdns_txt_match:
      - key: "mf"
        value: "Elgato"
        description: "Manufacturer TXT value published by the classic lights and the Air MK.2; required first so another _elg._tcp product is not claimed."
      - key: "tls"
        match: "absent"
        description: "Classic firmware publishes no tls TXT key. Air MK.2 publishes tls=CERT_1_VER_EN and speaks mutual-TLS WebSocket rather than HTTP."
    notes: >
      TXT `dt` is a model hint, not a sufficient capability check: select
      white-only (CCT), colour-capable strip and battery support with the
      probes declared in `variants`. TXT `id` is not reliably the MAC address. Use
      accessory-info.serialNumber as the durable identity.

  variants:
    # Variants are fixed per device, not per mode. A Light Strip in white
    # mode answers GET /elgato/lights with on/brightness/temperature and no
    # hue -- exactly a Key Light's shape -- so the lights reply cannot tell a
    # white-only light from a strip. The probes below read settings and
    # accessory info instead; the lights reply then gives the strip's mode.
    - model: "CCT"
      identification:
        state_probe:
          command: "get_light_settings"
          keys_present: ["powerOnTemperature"]
          keys_absent: ["powerOnHue"]
      notes: >
        White-only lights: the Key Light family and Ring Light. `on`,
        `brightness` and white-point `temperature`, 143-344 mireds. Their
        power-on settings carry no hue. Home Assistant's elgato integration
        treats a device as colour-capable when its product name is a Light
        Strip, its settings report a power-on hue, or its state reports a
        hue; this probe uses the settings signal, which needs no model table.
    - model: "Strip"
      identification:
        state_probe:
          command: "get_accessory_info"
          value_contains:
            productName: "Light Strip"
      notes: >
        Light Strip and Light Strip Pro (product names "Elgato Light Strip"
        and "Elgato Light Strip Pro"). Colour-capable: hue/saturation, and
        also a white point limited to 153-285 mireds (about 6500-3500 K),
        narrower than the white-only lights. The GET /elgato/lights reply
        shows the current mode: `hue` present means colour mode;
        `temperature` without `hue` means white mode (this does NOT make it
        a white-only light); `scene` present means a running scene. If a
        strip's settings ever lack powerOnHue it would also satisfy the CCT
        probe; a consumer that sees both match should treat it as Strip,
        whose narrower range is safe on either.
    - model: "Battery"
      identification:
        state_probe:
          command: "get_battery_info"
          keys_present: ["level"]
      notes: >
        Key Light Mini battery surface. Probe once: 200 means present, 404
        means absent; the accessory-info features list does not report it.

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_elg._tcp.local."
          port: 9123
          txt_record_keys: ["pv", "md", "id", "dt", "mf", "tls"]
          txt_match:
            - key: "mf"
              value: "Elgato"
              description: "The manufacturer value shared by this family."
            - key: "tls"
              match: "absent"
              description: "Exclude the mutual-TLS Air MK.2 from this plain-HTTP specification."
          identity_mapping:
            stable_keys:
              - source: "http:/elgato/accessory-info#serialNumber"
                key: "serial_number"
            display:
              source: "http:/elgato/accessory-info#displayName"
        notes: >
          Display name can be empty; fall back to the mDNS instance name in
          that case. TXT `id` is only a pre-HTTP dedupe hint, not a stable key.
    identity:
      stable_keys: ["serial_number"]
      display: "displayName"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      Initial onboarding uses the light's own setup network and the vendor
      Control Center flow. The classic wifi-info payload is obfuscated rather
      than securely encrypted, so the passphrase is effectively plaintext; this spec does not claim an independent
      provisioning implementation. Once onboarded, control needs no account.
    methods:
      - type: "device_ui"
        name: "Control Center onboarding"
        role: "primary"
        verified: false
        description: "Join the light with the vendor Control Center application, then use local HTTP directly."
        steps:
          - action: "Power the light and wait for its setup network or onboarding offer."
            actor: "device"
            expect: "The light is ready to be adopted by Control Center."
            timeout_seconds: 60
          - action: "Follow the Control Center onboarding flow and choose the home Wi-Fi network."
            actor: "user"
          - action: "Wait for the light to join the LAN."
            actor: "device"
            expect: "An _elg._tcp.local. advertisement appears on TCP 9123 without a tls TXT key."
            timeout_seconds: 60
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: >
        Clears the Wi-Fi configuration so the light can be onboarded again.
        The two procedures below are vendor-documented for the named models;
        do not generalise their button location or timing to the whole family.
      procedures:
        - name: "Key Light Mini Wi-Fi reset"
          verified: false
          basis: "Elgato's Key Light Mini — Reset Wi-Fi Configurations support article; not replayed by this project."
          power_state: "on"
          hold_seconds: 10
          indicator: "The light flashes three times."
          steps:
            - action: "Power on the Key Light Mini."
              actor: "user"
            - action: "Hold the recessed Reset button with a small tool for 10 seconds."
              actor: "user"
              expect: "The light flashes three times."
            - action: "Release Reset and wait for the light to restart."
              actor: "device"
              expect: "The light is ready to be onboarded again."
        - name: "Key Light Neo Wi-Fi reset"
          verified: false
          basis: "Elgato's Key Light Neo — Reset Wi-Fi Configuration support article; not replayed by this project."
          power_state: "on"
          hold_seconds: 10
          indicator: "The light flashes three times, then restarts."
          steps:
            - action: "Power on the Key Light Neo."
              actor: "user"
            - action: "Hold the recessed Reset button with a small tool for at least 10 seconds."
              actor: "user"
              expect: "The light flashes three times."
            - action: "Release Reset and wait for the automatic restart."
              actor: "device"
              expect: "The light is ready to be onboarded again."
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: >
        The documented Mini and Neo route to a new network is the Wi-Fi reset
        above. Reset procedures for the other models remain unverified here.
    credentials:
      wifi_passphrase_protection: "plaintext"
      stored_on_device:
        - "Wi-Fi credentials"
        - "Light state and power-on defaults"
      issued_to_client: []
      notes: >
        Classic provisioning uses an obfuscated payload, not encryption with
        a secret, so the passphrase is recorded as effectively plaintext:
        anyone who knows the transform and can see the setup traffic can
        recover it. Steady-state HTTP control itself is unauthenticated.

http_endpoints:
  - method: "GET"
    path: "/elgato/accessory-info"
    name: "Accessory Information"
    description: >
      Product name, board id, serial number, display name, firmware and Wi-Fi
      metadata. Use serialNumber as identity, not mDNS TXT id.
  - method: "GET"
    path: "/elgato/lights"
    name: "Light State"
    description: >
      Returns {numberOfLights, lights:[...]}. Read lights[0]. CCT replies carry
      on/brightness/temperature; direct-colour replies carry
      on/brightness/hue/saturation; scene replies replace those colour fields
      with id/name/scene/numberOfSceneElements.
    response_body:
      content_type: "application/json"
      fields:
        - name: "on"
          type: "int"
          description: "Power state, integer 0 or 1 (never a JSON boolean)."
        - name: "brightness"
          type: "number"
          description: "Brightness percent. Integer in ordinary modes; may be fractional in a scene."
        - name: "temperature"
          type: "int"
          description: "White point in mireds. Present on white-only lights (143-344) and on a Light Strip in white mode (153-285); its presence alone does not mean a white-only light."
        - name: "hue"
          type: "number"
          description: "HSV hue in degrees, 0-360."
        - name: "saturation"
          type: "number"
          description: "HSV saturation percent, 0-100."
  - method: "PUT"
    path: "/elgato/lights"
    name: "Set Light State"
    description: >
      Accepts a partial lights array and preserves unnamed fields. Returns the
      complete new state, so a client can consume the PUT response instead of
      immediately issuing another GET.
    request_body:
      content_type: "application/json"
  - method: "GET"
    path: "/elgato/lights/settings"
    name: "Light Settings"
    description: >
      Power-on behaviour and defaults: powerOnBehavior, powerOnBrightness,
      powerOnTemperature, transition durations, and on colour-capable strips
      powerOnHue and powerOnSaturation. The Key Light Mini adds a battery
      object. Read here only to tell a white-only light from a strip.
  - method: "GET"
    path: "/elgato/battery-info"
    name: "Battery Information"
    description: >
      Key Light Mini only: level (fractional percent), status, powerSource,
      currentBatteryVoltage and inputChargeVoltage (mV), and
      inputChargeCurrent (mA). status, per python-elgato's models.py: 0 not
      charging (draining), 2 charging, 3 charged; 1 is unknown -- the
      library's author never saw it. powerSource, per the same file: 0
      unknown, 1 external power (the library calls it mains), 2 battery. A
      404 means no battery surface.
  - method: "POST"
    path: "/elgato/identify"
    name: "Identify"
    description: "Blink the selected light. Empty request body."
  - method: "PUT"
    path: "/elgato/firmware-update/prepare"
    name: "Firmware Update Prepare"
    advanced: true
    advanced_reason: >
      Erases the inactive firmware slot in preparation for replacement; the
      light answers nothing else while it erases. Only a vendor image for the
      exact board should be supplied. On a battery light, connect power
      first: python-elgato refuses to start an update while the light runs on
      battery below 20%, so an update cannot die halfway.
    description: "Body {\"size\":N} with the complete image length including the 128-byte header. Allow at least 60 seconds."
    request_body:
      content_type: "application/json"
  - method: "PUT"
    path: "/elgato/firmware-update/data?offset={offset}"
    name: "Firmware Update Data"
    advanced: true
    advanced_reason: >
      Writes one 4096-byte firmware chunk. An incorrect or interrupted image
      can leave the light unavailable until recovery. Keep a battery light on
      external power (python-elgato will not start below 20% on battery).
    description: >
      Raw chunk at the byte offset in the query string. Chunks are sent in
      order with Connection: close; an accepted intermediate chunk answers
      202. The last chunk answers 200 only after signature and checksum
      validation. A 400 or 408 means retry that chunk.
    request_body:
      content_type: "application/octet-stream"
  - method: "POST"
    path: "/elgato/firmware-update/execute"
    name: "Firmware Update Execute"
    advanced: true
    advanced_reason: >
      Selects the newly written firmware slot and restarts the light. Do not
      send until every chunk has been acknowledged.
    description: "Empty body; validates and activates the staged image, then restarts."

commands:
  get_lights:
    description: "Read power, brightness and the device's current CCT, HSV or scene state."
    transport: "http"
    method: "GET"
    path: "/elgato/lights"
    verification: "confirmed"
  get_accessory_info:
    description: "Read product name, board type, serial number, display name and firmware version. Used to identify the Strip variant by productName."
    transport: "http"
    method: "GET"
    path: "/elgato/accessory-info"
    verification: "reported"
  get_light_settings:
    description: "Read power-on settings. A powerOnHue key marks a colour-capable strip; used by the CCT variant probe."
    transport: "http"
    method: "GET"
    path: "/elgato/lights/settings"
    verification: "reported"
  get_battery_info:
    description: "Read Key Light Mini battery state; a 404 means this capability is absent."
    transport: "http"
    method: "GET"
    path: "/elgato/battery-info"
    verification: "confirmed"
  turn_on:
    description: "Turn the light on without changing its stored brightness or colour."
    transport: "http"
    method: "PUT"
    path: "/elgato/lights"
    body: '{"lights":[{"on":1}]}'
    example_body: '{"lights":[{"on":1}]}'
    verification: "confirmed"
  turn_off:
    description: "Turn the light off. On a scene-running strip this also discards the scene, so Scene is read-only here."
    transport: "http"
    method: "PUT"
    path: "/elgato/lights"
    body: '{"lights":[{"on":0}]}'
    example_body: '{"lights":[{"on":0}]}'
    verification: "confirmed"
  set_brightness:
    description: >
      Set brightness percent. Zero is legal but leaves on=1 with no visible
      output, so the control starts at 3. On a white-only light this leaves
      the white point alone. On a colour-capable strip in white mode a
      brightness-only write makes it jump back to colour mode, so Home
      Assistant's elgato integration resends the current temperature with
      every brightness write. For that case use set_strip_white_brightness,
      which declares both fields.
    transport: "http"
    method: "PUT"
    path: "/elgato/lights"
    body: '{"lights":[{"brightness":{brightness}}]}'
    example_body: '{"lights":[{"brightness":50}]}'
    parameters:
      brightness:
        type: "integer"
        required: true
        min: 3
        max: 100
        unit: "%"
        description: "Brightness percent; clamp client-side because firmware range behaviour differs."
    verification: "confirmed"
  set_color_temperature:
    description: "Set the white point of a white-only light (CCT variant) in mireds. Do not combine temperature with hue or saturation."
    transport: "http"
    method: "PUT"
    path: "/elgato/lights"
    body: '{"lights":[{"temperature":{mireds}}]}'
    example_body: '{"lights":[{"temperature":221}]}'
    parameters:
      mireds:
        type: "integer"
        required: true
        min: 143
        max: 344
        unit: "mired"
        description: "White point in mireds: 143 is about 7000 K and 344 about 2900 K. Keep native mireds rather than converting through an assumed linear Kelvin curve."
    verification: "confirmed"
  set_strip_color_temperature:
    description: "Switch a Light Strip to white and set its white point in mireds. The strip's range is narrower than a Key Light's. Do not combine temperature with hue or saturation; any running scene ends."
    transport: "http"
    method: "PUT"
    path: "/elgato/lights"
    body: '{"lights":[{"temperature":{mireds}}]}'
    example_body: '{"lights":[{"temperature":200}]}'
    parameters:
      mireds:
        type: "integer"
        required: true
        min: 153
        max: 285
        unit: "mired"
        description: "White point in mireds: 153 is about 6500 K and 285 about 3500 K (Home Assistant's colour-capable range)."
    verification: "reported"
  set_strip_white_brightness:
    description: >
      Set a Light Strip's brightness while it is in white mode, keeping it
      in white mode. A brightness-only write (set_brightness) switches a
      strip in white mode back to colour mode, so Home Assistant's elgato
      integration sends the current temperature with every brightness
      write. Fill `mireds` from lights[0].temperature of the last get_lights
      reply. Use only while that reply has `temperature` and no `hue`.
    transport: "http"
    method: "PUT"
    path: "/elgato/lights"
    body: '{"lights":[{"brightness":{brightness},"temperature":{mireds}}]}'
    example_body: '{"lights":[{"brightness":50,"temperature":200}]}'
    parameters:
      brightness:
        type: "integer"
        required: true
        min: 3
        max: 100
        unit: "%"
        description: "Brightness percent, as set_brightness."
      mireds:
        type: "integer"
        required: true
        min: 153
        max: 285
        unit: "mired"
        description: "The strip's current white point, read back from lights[0].temperature; not a user choice."
    verification: "reported"
  set_hsv:
    description: "Set direct HSV colour on a Light Strip, ending any running scene. Deliberately not bound to the RGB-oriented generic colour role."
    transport: "http"
    method: "PUT"
    path: "/elgato/lights"
    body: '{"lights":[{"hue":{hue},"saturation":{saturation}}]}'
    example_body: '{"lights":[{"hue":200,"saturation":100}]}'
    parameters:
      hue:
        type: "number"
        required: true
        min: 0
        max: 360
        unit: "degree"
        description: "Hue in whole degrees. The device stores 360 rather than folding it to 0."
      saturation:
        type: "number"
        required: true
        min: 0
        max: 100
        unit: "%"
        description: "Saturation in whole percent; fractional values are truncated by current firmware."
    verification: "confirmed"
  identify:
    description: "Blink the selected light so the user can confirm which unit is being controlled."
    transport: "http"
    method: "POST"
    path: "/elgato/identify"
    body: ''
    verification: "reported"

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["http_upload"]
      transport: "http"
      endpoint: "Firmware Update Data"
      image:
        signing: "signed"
        algorithm: "ed25519"
        source: "public_url"
        format: >
          Complete vendor image including its 128-byte little-endian header:
          board type, four u16 version components, payload size/offset,
          signature slot and a 64-byte signature. Signature input is
          SHA-512(header[0:64] || payload), signed with Ed25519.
        notes: >
          Only the vendor image for the exact board id is appropriate. No
          image or signing material is distributed with this spec. Elgato
          runs no separate firmware service: the images ship inside the
          Control Center application, whose current macOS build is announced
          by a public release index at https://gc-updates.elgato.com/ (the
          `cc-mac` entry's downloadURL). python-elgato's catalog.py reads
          that index and pulls the per-board images out of the zip with HTTP
          range requests; its update routine checks the board type before
          uploading.
      enter:
        how: "in_place"
        notes: >
          The running application receives and validates the image through the
          prepare/data/execute endpoints; no separate bootloader mode is
          entered before upload.
      dfu_mode:
        notes: >
          The light stays on its ordinary LAN address while chunks upload.
          No separate update-mode SSID or advertisement is documented.
      recovery:
        interrupted: "keeps_old_image"
        notes: >
          Community firmware analysis describes an inactive-slot update: the
          previous slot remains bootable until execute selects the new image
          after validation. Behaviour at every possible power-loss point has
          not been tested by this project.
      verification: "reported"

entities:
  - platform: "light"
    name: "Key Light"
    variants: ["CCT"]
    features: ["brightness", "color_temp"]
    state_command: "get_lights"
    state_mapping:
      is_on: "lights[0].on"
      on_when: "nonzero"
      brightness: "lights[0].brightness"
      color_temperature: "lights[0].temperature"
    commands:
      turn_on: "turn_on"
      turn_off: "turn_off"
      set_brightness: "set_brightness"
      set_color_temperature: "set_color_temperature"
    notes: >
      Brightness is 3-100 in the control to avoid on=1 at zero output. White
      point stays in native mireds (143-344), not a mislabeled Kelvin slider.
  - platform: "light"
    name: "Light Strip"
    variants: ["Strip"]
    features: ["brightness", "rgb", "color_temp"]
    state_command: "get_lights"
    state_mapping:
      is_on: "lights[0].on"
      on_when: "nonzero"
      brightness: "lights[0].brightness"
      hue: "lights[0].hue"
      saturation: "lights[0].saturation"
      color_temperature: "lights[0].temperature"
    commands:
      turn_on: "turn_on"
      turn_off: "turn_off"
      set_brightness: "set_brightness"
      set_color_temperature: "set_strip_color_temperature"
    notes: >
      Colour mode when the reply has `hue`; white mode when it has
      `temperature` and no `hue`. White point 153-285 mireds. In white mode
      a brightness change must go through set_strip_white_brightness with
      the current temperature; the brightness role is bound to
      set_brightness because the schema has no way to fill a parameter
      from state (GAPS.md), so a generic consumer that only reads the
      binding will knock a white strip into colour mode. `set_hsv` declares the colour write but is not bound:
      the generic set_color role expects red/green/blue channels, not
      hue/saturation. A client with an HSV picker can bind it directly.
      While the reply carries `scene`, any write here ends the running
      scene; the Light Strip Scene entity shows it.
  - platform: "light"
    name: "Light Strip Scene"
    variants: ["Strip"]
    features: ["brightness"]
    state_command: "get_lights"
    state_mapping:
      is_on: "lights[0].on"
      on_when: "nonzero"
      brightness: "lights[0].brightness"
      effect: "lights[0].id"
    notes: >
      Read-only deliberately. Meaningful only while the lights reply carries
      `scene`; otherwise its effect is absent. A bare on/off, brightness,
      temperature or HSV write discards the running scene and there is no
      scene-list endpoint. Cache the full scene object before considering a
      restore command.
  - platform: "sensor"
    name: "Battery"
    variants: ["Battery"]
    device_class: "battery"
    unit: "%"
    state_command: "get_battery_info"
    state_mapping:
      value: "level"
    notes: >
      Fractional percent; expect small fluctuations while charging. Probe the
      endpoint once and treat 404 as a final no-battery answer.
  - platform: "button"
    name: "Identify"
    commands:
      press: "identify"

remaining_unknowns:
  - "Wi-Fi reset procedures for original Key Light, Key Light Air, Key Light MK.2, Ring Light, Light Strip and Light Strip Pro need vendor citations or hardware confirmation."
  - "An independent provisioning client still needs the classic wifi-info key schedule reviewed for clean-room redistribution; steady-state control does not depend on it."
  - "The full scene catalogue is not enumerable from the device. A safe scene-preserving write path should cache complete observed scenes first."
  - "Battery status 1 has no established meaning (python-elgato's author never observed it; an earlier 'pre-charge' label had no cited source), and whether status 2 distinguishes fast from slow charging is unknown. status 0/2/3 and powerSource 0/1/2 follow python-elgato's models.py, not this project's capture."
  - "Strip detection relies on settings carrying powerOnHue (one python-elgato strip fixture and Home Assistant's use of the key) and on the productName containing 'Light Strip'. Whether every strip firmware reports powerOnHue is unconfirmed."
  - "Whether a temperature write to a Light Strip outside 153-285 mireds is rejected, clamped or accepted is not established; Home Assistant simply limits its slider to that range."
  - "Firmware-update recovery at every power-loss point, and whether every classic model uses the same inactive-slot behaviour, remain untested by this project."
  - "Air MK.2 mutual-TLS WebSocket control and BLE onboarding are outside this spec; its client-certificate issuance path is unresolved."

evidence:
  documentation_review: >
    Reviewed 2026-10-31: the public matterbridge-elgato protocol
    characterisation (live Key Light Air, Key Light Mini and Light Strip),
    python-elgato, the Key Light Mini firmware reverse-engineering write-up,
    and the project's clean-room Elgato research notes. The mDNS, JSON field
    shapes, partial-write behaviour and range quirks agree. No vendor source
    symbols, proprietary images, real device identifiers or credentials are
    reproduced. All ordinary control commands are confirmed by the cited live
    community work; broader model coverage and firmware upload remain
    reported.
  open_questions: >
    The remaining work is scoped in remaining_unknowns: per-model reset
