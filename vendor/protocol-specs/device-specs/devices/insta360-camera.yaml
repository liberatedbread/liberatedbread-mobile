# Insta360 360-degree and action cameras (BLE control + camera Wi-Fi) device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room, derived facts only, every table written in
# our own words; no vendor code, .proto file or asset is reproduced):
#   - xaionaro-go/insta360ctl @ f94193ce (Go CLI, 2026): both BLE
#     architectures, the GO-line envelope and CRC, the message-code and
#     notification tables, the camera Wi-Fi TCP protocol. Its author marks
#     only GO 3 flows as hardware-tested.
#   - pchwalek/insta360_ble_esp32 @ 83d4748b (ESP32 sketch, 2023): GPS-remote
#     emulation and the wake advertisement, demonstrated by its author on an
#     X3 and a ONE RS 1-inch.
#   - RigacciOrg/insta360-wifi-api @ 89320e06 and the author's rigacci.org
#     write-up (2023): the TCP/6666 protocol, recovered from app traffic to a
#     ONE RS.
#   - Insta360Develop/Android-SDK README @ d2f910c8 (vendor SDK documentation):
#     connection types, the BLE bandwidth limit, Wi-Fi info and channel calls,
#     the role of the activation credentials, error codes.
#   - A string-level pass over the packed vendor Android app (2.33.0). Its
#     bytecode is encrypted at rest, so nothing here is read from its code;
#     the string pool only cross-checks UUIDs, name prefixes and three
#     constant frames.
#   - FCC grants under grantee code 2AWWH and the two user-manual exhibits.
#
# Scope: phone-direct BLE control (both GATT architectures) plus the camera's
# own Wi-Fi AP / TCP 6666 protocol as a secondary transport. Out of scope:
# USB mass-storage/UVC, the .insv/.insp containers and the gyro/stitching
# pipeline, the SDK's online activation beyond its role, firmware update
# bytes, and the root shell reported on the AP.

device:
  name: "Insta360 360° and action cameras (X3/X4/X5, ONE X/X2/RS/R, Ace/Ace Pro, GO 2/GO 3)"
  manufacturer: "Insta360 (Arashi Vision Inc.)"
  manufacturer_status: "active"
  type: "360-and-action-camera"
  category: "camera"
  protocol: "ble"
  transport: "ble-gatt"
  testing:
    status: untested
    notes: >-
      Nobody on this project has driven an Insta360 camera from this document,
      and the research store holds no capture of one. Every fact is reported
      from the open implementations and the vendor SDK README, or from
      string-level evidence in the packed vendor app. The strongest upstream
      results, none of them ours: insta360ctl's author ran photo, record
      start/stop, mode, battery, storage and GPS injection against a GO 3 over
      direct control (its CLI marks everything else "not tested, yet");
      pchwalek's sketch drove an X3 and a ONE RS 1-inch as a GPS-remote
      emulator, including the wake advertisement; Rigacci drove a ONE RS over
      TCP 6666 from a working remote-control program.
  openness:
    status: "documented_api"
    reverse_engineered: true
    upstream_docs:
      - url: "https://github.com/Insta360Develop/Android-SDK"
        title: "Insta360Develop/Android-SDK README"
        covers: "Connection types (BLE, Wi-Fi, USB), what BLE cannot carry, Wi-Fi info and channel calls, camera activation, error codes. It documents the SDK's API, not the wire protocol."
      - url: "https://insta360develop.github.io/Insta360-Developer_Docs/"
        title: "Insta360 developer documentation"
        covers: "Where the vendor says SDK documentation now lives."
    notes: >-
      Insta360 publishes a camera SDK, but only as binary libraries handed out
      on application, with online camera activation that needs an appId and a
      secretKey issued by Insta360, and (per Rigacci) a licence that forbids
      mixing it with open-source software. The wire protocol under it is not
      published. Everything below the API level was recovered by the
      community (insta360ctl, pchwalek, Rigacci), so this spec is a
      reconstruction and can be wrong.
  security_advisory:
    severity: "reported"
    summary: "The camera's own Wi-Fi access point used the fixed passphrase 88888888 on at least the ONE RS, and a root telnet shell was reported reachable through it."
    detail: >-
      Rigacci's 2023 write-up on a ONE RS reports that the camera's access
      point at 192.168.42.1 comes up with the factory passphrase 88888888,
      that he found no way to disable it or change the passphrase from the
      camera, and that anyone who joins it can telnet into the camera's Linux
      system as root and, in his words, do anything up to damaging the
      camera permanently. insta360ctl
      notes that some firmware versions use a random passphrase instead, and
      the vendor SDK exposes a "password version" beside the passphrase, so
      newer firmware may differ. The passphrase string 88888888 is also in the
      current vendor app's string pool. Which models and firmware versions
      are affected is not established. This spec does not document the shell.
      Keep the camera's Wi-Fi off when you are not using it.
    advisory_url: "https://www.rigacci.org/wiki/doku.php/doc/appunti/hardware/insta360_one_rs_wifi_reverse_engineering"
  notes: >
    Insta360 360-degree and action cameras from Arashi Vision (Shenzhen). One
    spec covers the family because every model speaks one of two BLE
    architectures, and most speak both. Which ones a model speaks is carried
    per model in device.variants and in protocol_details.model_matrix. Picking
    one architecture and generalising would be wrong for half the fleet.

    TRANSPORTS. (1) BLE, for discovery, remote-style control and full direct
    control. (2) The camera's own Wi-Fi access point: gateway 192.168.42.1,
    SSID made of the model name, a space and a six-character serial fragment,
    ending ".OSC" on the ONE RS example Rigacci published. A proprietary TCP
    protocol on port 6666 multiplexes protobuf commands, replies,
    notifications, keep-alives and the live-preview stream. The camera can
    also be moved into station mode on the user's network; the same TCP
    protocol then runs on its DHCP address (protocol_details.wifi_tcp).
    (3) USB mass storage and UVC, out of scope. The SDK says BLE cannot carry
    bulk data: preview, file transfer and firmware updates need Wi-Fi or USB.

    ARCHITECTURE A, GPS-REMOTE EMULATION. The roles are reversed: the HOST is
    the GATT server and advertises as an Insta360 GPS remote, and the camera
    connects to it as a central. The host serves service
    0000ce80-0000-1000-8000-00805f9b34fb (characteristics
    0000ce81-0000-1000-8000-00805f9b34fb that the camera writes,
    0000ce82-0000-1000-8000-00805f9b34fb that the host notifies commands on,
    and 0000ce83-0000-1000-8000-00805f9b34fb, a static read) plus an
    information service 0000d0ff-3c17-d293-8e48-14fe2e4da212. Commands are
    fixed 9-byte frames FC EF FE 86 00 03 01 <action> <param>: shutter, mode
    cycle, screen, power off. A sleeping camera is woken by an
    iBeacon-shaped manufacturer-data advertisement that carries "ORBIT" and a
    six-character camera ID. Because the camera is the client, none of this
    is in `services` (which lists what the camera serves). It is all in
    protocol_details.gps_remote_emulation.

    ARCHITECTURE B, DIRECT CONTROL. The camera is the GATT server. Commands go
    to 0000be81-0000-1000-8000-00805f9b34fb and replies and events come back
    as notifications on 0000be82-0000-1000-8000-00805f9b34fb, both under
    service 0000be80-0000-1000-8000-00805f9b34fb. A message is a 16-byte
    header (7-byte packet head, 9-byte message head) followed by a protobuf
    body. The 16-byte form is byte-for-byte the packet the TCP/6666 protocol
    uses, with its uint32 length prefix. On the GO line the message is wrapped
    in a 5-byte envelope (FF 07 40 + uint16 LE size, or FF 07 41 for sync) and
    a CRC-16/MODBUS trailer, little-endian; packets are at most 500 bytes and
    longer messages arrive over several notifications and are reassembled by
    the size field. The GO 3 also serves a secondary service
    0000b000-0000-1000-8000-00805f9b34fb with four characteristics, but only
    listens on 0000be81-0000-1000-8000-00805f9b34fb. Session setup on the GO
    line: the camera sends a sync frame after the first write and the client
    answers with its own; then CHECK_AUTHORIZATION (0x27); if the camera says
    not authorized, REQUEST_AUTHORIZATION (0x56), which the user approves on
    the camera, the verdict arriving as notification 0x2011. After that the
    client sends message codes from the vendor's table: photo (3), record
    start/stop (4/5), highlight (60), GPS (53), Wi-Fi station hand-off
    SET_WIFI_CONNECTION_INFO (112) whose outcome and new IP address arrive
    as notification 8232 (0x2028).

    FRAMING IS NOT SETTLED FOR THE X, ONE AND ACE MODELS. insta360ctl assumes
    they take the 16-byte header bare, with no envelope, no sync and no
    authorization, and with bytes 0-1 holding the payload length. It never
    ran that path on hardware. Two things argue against it: the vendor's own
    packet convention (TCP and the GO envelope) puts the TOTAL length,
    header included, in bytes 0-3, so the bare form's length field disagrees
    by 16; and the official SDK, which supports only X- and ONE-series
    cameras, reports BLE "sync pack" and "shake hand" errors, so those
    cameras almost certainly sync too. Both candidate forms are declared
    (the `framed_*` and `bare_*` commands) and the question is recorded in
    remaining_unknowns. The GO-line framed form is the one with upstream
    hardware results.

    CLIENT RULES that hold on every source:
      1. Subscribe to 0000be82-0000-1000-8000-00805f9b34fb (and to 0000b002-0000-1000-8000-00805f9b34fb, 0000b003-0000-1000-8000-00805f9b34fb and 0000b004-0000-1000-8000-00805f9b34fb on service 0000b000-0000-1000-8000-00805f9b34fb where it exists) before writing.
      2. Write commands to 0000be81-0000-1000-8000-00805f9b34fb only. The GO 3 ignores the same frames on 0000b001-0000-1000-8000-00805f9b34fb and 0000ae01-0000-1000-8000-00805f9b34fb.
      3. On the GO line, answer the camera's sync frame at once or every later command is silently dropped.
      4. Sequence numbers run 1-254 and wrap; 0 and 255 are reserved. Match replies by sequence. Replies carry an HTTP-style status in the code field (200, 400, 500, 501). Notifications carry codes of 0x2000 and up; dispatch them by code, not by sequence.
      5. Reuse one authorization_id per client. A new one makes the camera ask the user again (inferred from the flow).
      6. Never send a code for a meaning its official name does not have. insta360ctl sends several "legacy" codes on models whose firmware may read them as something else, including 0x0C, which the vendor table names DELETE_FILES, to set the capture mode (protocol_details.direct_control.misattributed_codes).

    SDK CREDENTIALS. The official SDK's camera activation needs an appId and
    secretKey that a developer applies to Insta360 for; activation is an
    online call that the vendor rate-limits and region-checks. That is the
    credentials' whole role here: the community protocol paths in this spec
    need neither, and no key is recorded. Rigacci reports the vendor app was
    needed to activate his ONE RS on first use; whether an un-activated
    camera refuses any of the local protocol is not established.

    CROSS-CHECKS FROM THE VENDOR APP'S STRING POOL (2.33.0). It carries
    0000be80-0000-1000-8000-00805f9b34fb, 0000ce80-0000-1000-8000-00805f9b34fb to 0000ce83-0000-1000-8000-00805f9b34fb,
    0000ffd0-0000-1000-8000-00805f9b34fb to 0000ffd5-0000-1000-8000-00805f9b34fb and
    0000ffd8-0000-1000-8000-00805f9b34fb (all on the Bluetooth base),
    0000d0ff-3c17-d293-8e48-14fe2e4da212 and
    000002fd-3c17-d293-8e48-14fe2e4da212 on the vendor base, the name
    prefixes, "syNceNdinS", 88888888, 192.168.42.1, http://192.168.42.1:80,
    the ten wake-beacon bytes 09 4f 52 42 49 54 09 ff 0f 00, and a complete
    GO-envelope heartbeat frame whose CRC our transcription of the algorithm
    reproduces. An earlier research note that the pool also holds camera
    ports 8080 and 9999 did not survive a re-check
    (protocol_details.wifi_tcp.other_ports).

  identification:
    local_name_prefixes:
      - "X3 "
      - "X4 "
      - "X5 "
      - "ONE X "
      - "ONE X2 "
      - "ONE X3 "
      - "ONE X4 "
      - "ONE RS "
      - "ONE R "
      - "Ace Pro "
      - "Ace "
      - "GO 3 "
      - "GO 3S "
    service_uuids:
      - "0000be80-0000-1000-8000-00805f9b34fb"
    notes: >-
      Cameras advertise "<model prefix><part of the serial number>", e.g.
      "X3 " followed by a serial fragment (insta360ctl's model table; the
      vendor app's string pool carries the same prefixes plus "X4 Air " and
      "Ace Pro 2 ", which the prefixes above also catch). The trailing space
      is part of each prefix and keeps "ONE R " from matching "ONE RS ".
      "X3 " and "Ace " are short enough to collide with unrelated products;
      rank a hit that also serves 0000be80-0000-1000-8000-00805f9b34fb above
      one that does not. insta360ctl also falls back to a bare "ONE " prefix,
      left out here as too generic. The 0000be80-0000-1000-8000-00805f9b34fb service UUID is on the
      Bluetooth base but is not a SIG assignment; the vendor app appears to
      scan with a filter on it (string-level evidence), so cameras probably
      advertise it, which nobody has confirmed. No company ID or OUI is
      documented. GO 2 and X6 name prefixes are unknown.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            values:
              - "X3 "
              - "X4 "
              - "X5 "
              - "ONE X "
              - "ONE X2 "
              - "ONE X3 "
              - "ONE X4 "
              - "ONE RS "
              - "ONE R "
              - "Ace Pro "
              - "Ace "
              - "GO 3 "
              - "GO 3S "
          service_uuids:
            - "0000be80-0000-1000-8000-00805f9b34fb"
        notes: >-
          Name OR service, as ble_scan methods combine them. Identify the
          model by the longest matching prefix (insta360ctl orders its table
          longest first). The models that speak only architecture A (ONE X,
          ONE X2, ONE R) are found by name; what, if anything, they serve to a
          phone is not recorded.
    identity:
      stable_keys: ["local_name", "address"]
      display: "local_name"
      notes: >-
        The local name carries a fragment of the serial number, so it
        survives an address change and is the better identity key. Whether
        the cameras use a public or a rotating address is not recorded; treat
        the address as a connection locator.
    static_ip_required: false

  setup:
    required: false
    confidence: "low"
    notes: >-
      Nothing has to be provisioned for BLE control or for the camera's own
      Wi-Fi AP; the only one-time step is the user approving a new client on
      the camera the first time it asks for authorization (GO line; see
      device.pairing). Station mode is optional provisioning. Confidence is
      low because only the GO 3 direct-control flow has an upstream hardware
      result, the X/ONE/Ace framing is unsettled, and the camera-side steps
      for pairing a remote are not documented anywhere. First-use activation:
      Rigacci reports the vendor app had to activate his new ONE RS; the SDK
      does it online with developer credentials. Whether an un-activated
      camera limits the local protocol is not established.
    methods:
      - type: "ble_direct"
        name: "Direct control on the camera's own GATT service, approved once on the camera"
        role: "primary"
        verified: false
        description: >-
          Connect to the camera as a central, subscribe to its notify
          characteristic, complete the sync (GO line) and the authorization
          exchange, and send commands. The first time a client asks, the user
          approves it on the camera. The vendor app's scanner filters on this
          service (string-level evidence), and insta360ctl's GO 3 results rest
          on it. On the X, ONE
          and Ace models the framing is unsettled (device.notes): try the
          framed form with sync and authorization first, and fall back to
          insta360ctl's bare form.
        ble:
          service_uuid: "0000be80-0000-1000-8000-00805f9b34fb"
          write_characteristic: "0000be81-0000-1000-8000-00805f9b34fb"
          read_characteristic: "0000be82-0000-1000-8000-00805f9b34fb"
          pairing_required: false
        steps:
          - action: "Power the camera on. It advertises '<model prefix><serial fragment>' while on; insta360ctl documents no other preparation."
            actor: user
          - action: "Scan for a name prefix from device.identification, connect, and discover services."
            actor: client
            timeout_seconds: 10
          - action: "Request a larger ATT MTU. The vendor app negotiates 247 (about 244 bytes per write); insta360ctl asks for 517. Without it, framed packets longer than 20 bytes must be split across writes."
            actor: client
          - action: "Enable notifications on 0000be82-0000-1000-8000-00805f9b34fb, and on 0000b002-0000-1000-8000-00805f9b34fb, 0000b003-0000-1000-8000-00805f9b34fb and 0000b004-0000-1000-8000-00805f9b34fb when service 0000b000-0000-1000-8000-00805f9b34fb is present."
            actor: client
            request:
              protocol: "ble_gatt"
              service: "0000be80-0000-1000-8000-00805f9b34fb"
          - action: "Send CHECK_AUTHORIZATION (code 0x27) with a stable authorization_id string for this client (protocol_details.test_vectors.check_authorization)."
            actor: client
            request:
              protocol: "ble_gatt"
              service: "0000be80-0000-1000-8000-00805f9b34fb"
              action: "CHECK_AUTHORIZATION (0x27)"
          - action: "GO line: the camera answers the first write with a sync frame (FF 06 41 ..., body a repeating AB BA). Write the sync reply (command framed_sync_reply: FF 07 41 07 00 + seven zero bytes + CRC) at once."
            actor: client
            expect: "The camera then processes the pending CHECK_AUTHORIZATION and replies with status 200 and an authorization status. Without the sync reply, commands are silently dropped."
          - action: "If the status is 'not authorized', send REQUEST_AUTHORIZATION (code 0x56) with operation type 1 (pair)."
            actor: client
            request:
              protocol: "ble_gatt"
              service: "0000be80-0000-1000-8000-00805f9b34fb"
              action: "REQUEST_AUTHORIZATION (0x56)"
          - action: "Approve the connection on the camera when it asks (screen or button)."
            actor: user
            expect: "Notification 0x2011 (AUTHORIZATION_RESULT) with field 1 true. insta360ctl reads the verdict from the direct reply to 0x56 instead; accept either."
            timeout_seconds: 60
          - action: "Send commands (the framed_* commands on the GO line; see device.notes for the other models), one sequence number per message, 1-254."
            actor: client
        timing:
          sequence_range: "1-254, wrapping; 0 and 255 reserved (insta360ctl)."
          mtu: "Vendor app 247; insta360ctl 517. Framed packets max 500 bytes."
          authorization_prompt_timeout_s: "Not documented. The 60 s above is a client-side choice, not a device constant."
          heartbeat: "The vendor app carries a BLE heartbeat frame (framed_heartbeat). How often it is sent, and whether the camera drops an idle link without it, is not recorded. The TCP equivalent is every 2 s."
        troubleshooting:
          - symptom: "GO 3 accepts the connection but never answers commands."
            causes:
              - "The frames went to 0000b001-0000-1000-8000-00805f9b34fb or 0000ae01-0000-1000-8000-00805f9b34fb. insta360ctl's real-device testing found the GO 3 answers only on 0000be81-0000-1000-8000-00805f9b34fb."
              - "The camera's sync frame was not answered. It arrives after the first write; reply with framed_sync_reply."
              - "Notifications were not enabled before the first write."
          - symptom: "Authorization fails with busy, timeout or denied."
            causes:
              - "Another device is mid-authorization with the camera (the vendor's authorization states include busy)."
              - "Nobody approved the prompt on the camera in time, or it was declined. The SDK reports a refusal as error 4505, 'Bluetooth binding rejected'."
          - symptom: "The camera reports it is occupied, or the connection is refused (SDK errors 4403, 4508)."
            causes:
              - "The vendor app or another client holds the camera. Close the app, disconnect other clients, and retry."
          - symptom: "An X-, ONE- or Ace-series camera ignores every command."
            causes:
              - "Framing unsettled for these models (device.notes). Try the framed form with sync and authorization, then the bare form."
          - symptom: "The capture mode changed, or files may have been touched, after a 'set mode' from a community tool."
            causes:
              - "insta360ctl sets the mode with code 0x0C and a raw mode byte. That works on the GO 3, but the vendor table names 0x0C DELETE_FILES. Do not send it to any other model (protocol_details.direct_control.misattributed_codes)."
      - type: "none"
        name: "Camera Wi-Fi access point, TCP 6666 (nothing to provision)"
        role: "alternative"
        verified: false
        description: >-
          Join the camera's own access point and speak the TCP protocol to
          192.168.42.1:6666. Needs no BLE and no authorization exchange in
          either open implementation, but the host loses its internet
          connection while it is on the camera's network. Rigacci's working
          ONE RS client and the vendor SDK's Wi-Fi connection use this path;
          insta360ctl implements it but marks it untested.
        softap:
          ssid_examples: ["ONE RS XXXXXX.OSC", "GO 3 XXXX"]
          open_network: false
          passphrase_source: "88888888 on older firmware (Rigacci, ONE RS; also in the vendor app's strings). Some firmware uses a random passphrase: read it in the camera's settings, over BLE (the SDK exposes SSID and passphrase once connected), or over TCP with GET_OPTIONS option 36 (payload_formats.Options_Wifi_Info)."
          gateway_ip: "192.168.42.1"
          port: 6666
        steps:
          - action: "Turn the camera's Wi-Fi on (on the camera, or over BLE with OPEN_CAMERA_WIFI, code 33, which the SDK exposes as 'open camera Wi-Fi')."
            actor: user
          - action: "Join the camera's access point (SSID '<model> <6-character serial fragment>', '.OSC' suffix on the ONE RS example) with its passphrase."
            actor: user
          - action: "Open a TCP connection to 192.168.42.1:6666 and send the sync packet 11 00 00 00 06 00 00 73 79 4e 63 65 4e 64 69 6e 53 (length 17, type 06 00 00, ASCII 'syNceNdinS')."
            actor: client
            expect: "The camera echoes the identical packet. insta360ctl treats no echo within 5 s as a failed connection."
            timeout_seconds: 5
          - action: "From now on send the keep-alive 07 00 00 00 05 00 00 whenever the link has been idle for 2 s."
            actor: client
            expect: "The camera drops a client it has heard nothing from for about 10 s."
          - action: "Send commands as TCP message packets (protocol_details.wifi_tcp.message_packet). Rigacci's client first sets the camera's clock (SET_OPTIONS, code 7, local time and time zone)."
            actor: client
        timing:
          sync_echo_timeout_s: 5
          keepalive_interval_s: 2
          idle_disconnect_s: 10
          basis: "insta360ctl doc/protocol.md and Rigacci's client (2 s keep-alive, 10 s receive timeout)."
        troubleshooting:
          - symptom: "The phone or computer has no internet while connected to the camera (a recurring store-review complaint about the vendor app)."
            causes:
              - "The camera AP has no uplink. The SDK FAQ explains the vendor app binds its process to the camera network to reach the socket. Use station mode, or a second network interface, or bind only the camera socket to the camera network."
          - symptom: "Settings changed over TCP do not show on the camera's screen or preview."
            causes:
              - "Rigacci saw this on the ONE RS: white balance, resolution and FOV changes take effect at the next capture but the on-screen labels and live view do not update. Sharpness, prompt sound and indicator LEDs could not be changed at all."
          - symptom: "A focal-length or FOV value read back does not match what was set."
            causes:
              - "Rigacci: with the display asleep, GET_PHOTOGRAPHY_OPTIONS sometimes returns stale values; closing and reopening the socket restores them."
      - type: "ble_direct"
        name: "GPS-remote emulation: the camera connects to the host"
        role: "alternative"
        verified: false
        description: >-
          The host plays an Insta360 GPS remote: it advertises and serves the
          remote's GATT layout, and the camera connects as the central. Only
          shutter, mode cycle, screen and power off are available, plus waking
          a sleeping camera. It is the only BLE route documented for the ONE
          X, ONE X2 and ONE R, and it needs a host that can run a GATT server
          (insta360ctl needs raw HCI on Linux for it; pchwalek uses an
          ESP32). Everything is in protocol_details.gps_remote_emulation.
        steps:
          - action: "Serve service 0000ce80-0000-1000-8000-00805f9b34fb (0000ce81-0000-1000-8000-00805f9b34fb write, 0000ce82-0000-1000-8000-00805f9b34fb notify, 0000ce83-0000-1000-8000-00805f9b34fb read) and service 0000d0ff-3c17-d293-8e48-14fe2e4da212 with the values in protocol_details.gps_remote_emulation.gatt_server."
            actor: client
          - action: "Advertise the name 'Insta360 GPS Remote' with service UUIDs 0000ce80-0000-1000-8000-00805f9b34fb and 0000d0ff-3c17-d293-8e48-14fe2e4da212 and a scan response."
            actor: client
          - action: "Have the camera connect to the remote. No source documents the camera-side steps; the vendor GPS remote is paired from the camera's own menus (hypothesis)."
            actor: user
            expect: "The camera connects and enables notifications on 0000ce82-0000-1000-8000-00805f9b34fb."
          - action: "Notify 9-byte commands on 0000ce82-0000-1000-8000-00805f9b34fb, e.g. FC EF FE 86 00 03 01 02 00 for the shutter."
            actor: client
          - action: "To wake a camera that has powered down, stop normal advertising and advertise the wake manufacturer data (protocol_details.gps_remote_emulation.wake_advertisement) with the camera's six-character ID."
            actor: client
            expect: "A camera that has been paired with the remote powers on and reconnects (pchwalek: X3 and ONE RS 1-inch)."
        troubleshooting:
          - symptom: "The camera never connects to the emulated remote."
            causes:
              - "The camera-side pairing step is not documented; the camera may only connect to a remote it has been paired with."
              - "The host's stack cannot act as a peripheral with these services (bluetoothd-based clients generally cannot; insta360ctl switches to raw HCI)."
      - type: "ble_provisioning"
        name: "Station mode: hand the camera your network (SET_WIFI_CONNECTION_INFO, code 112)"
        role: "alternative"
        verified: false
        description: >-
          Tell the camera to leave its own AP and join an existing network, so
          a client on that LAN can reach TCP 6666 without switching networks.
          The command goes over an authorized BLE session (method 1) or over
          TCP on the camera AP (method 2). insta360ctl implements both and
          marks both untested; its notes say some models or firmware may not
          support station mode. The passphrase travels as a plain protobuf
          string.
        ble:
          service_uuid: "0000be80-0000-1000-8000-00805f9b34fb"
          write_characteristic: "0000be81-0000-1000-8000-00805f9b34fb"
          read_characteristic: "0000be82-0000-1000-8000-00805f9b34fb"
          pairing_required: false
          protocol: "Insta360 message protocol, code 112 (0x70) SET_WIFI_CONNECTION_INFO"
        steps:
          - action: "Open an authorized BLE session (method 1) or a synced TCP session on the camera AP (method 2)."
            actor: client
          - action: "Send SET_WIFI_CONNECTION_INFO (code 112) whose body is field 1 = { field 1 ssid, field 2 bssid (optional), field 3 passphrase } (protocol_details.test_vectors.set_wifi_connection_info)."
            actor: client
            expect: "Status 200: the command was accepted, not that the join worked."
          - action: "Wait for notification 8232 (0x2028): field 1 result (0 success, 1 timeout, 2 connect failed), field 2 the connection info with field 4 = the camera's new IP address."
            actor: device
            expect: "On TCP the notification may arrive before or after the camera drops its AP and the socket; a drop after the 200 usually means the join worked."
            timeout_seconds: 60
          - action: "Connect to <new IP>:6666 and sync as in method 2. If no IP was reported, look the camera up in the router's DHCP leases."
            actor: client
        troubleshooting:
          - symptom: "The camera accepts the command but never appears on the LAN."
            causes:
              - "Wrong passphrase or an unsupported band/security mode: notification 8232 reports 2 (connect failed) or 1 (timeout)."
              - "The model or firmware does not support station mode (insta360ctl's caution)."
          - symptom: "Wi-Fi join via code 0x1A from an older community build does nothing."
            causes:
              - "0x1A is SCAN_BT_PERIPHERAL in the vendor table; insta360ctl's earlier builds misused it. The join is code 112."
    factory_reset:
      applicable: "unknown"
      confidence: "low"
      effect: >-
        Not established. The camera stores its AP credentials, any
        station-mode networks, the IDs of authorized BLE clients and its
        settings; nothing documents which of these a reset clears.
      description: >-
        No source run for this spec documents a factory reset, and the two
        user-manual exhibits (GO 3 quick guide, GO 2 manual) cover only power
        and capture buttons; the GO 2 manual's 6-second hold of the Action
        button is a forced shutdown, not a reset. The vendor message table
        does contain RESTORE_FACTORY_SETTINGS (code 57, 0x39), so a
        protocol-level reset exists, but no open implementation sends it.
        A separate code RESET_WIFI (125, 0x7D) exists; the SDK's matching call
        is documented as restarting the camera's Wi-Fi (off, then on), not as
        erasing credentials.
      procedures:
        - name: "RESTORE_FACTORY_SETTINGS message (code 57, 0x39)"
          verified: false
          basis: "The vendor's message-code table as transcribed by insta360ctl (doc/ble_protocol.md section 9.1). No open implementation sends it and its effect is undocumented."
          power_state: "on"
          steps:
            - action: "Over an authorized BLE session or a synced TCP session, send a message with code 57 and an empty body."
              actor: client
              expect: "Unknown. Presumably status 200 and a restart with default settings."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >-
        Reported, untested: SET_WIFI_CONNECTION_INFO can be sent again over
        BLE at any time, so the camera can be handed a new network without a
        reset. The vendor table also has SET_WIFI_MODE (147; 0 AP, 1 station,
        2 P2P), GET_CONNECTED_WIFI_LIST (149) and DEL_WIFI_HISTORY_INFO (175)
        for returning to AP mode and forgetting saved networks. Moving the
        camera to a new phone needs only a new BLE authorization.
      steps:
        - action: "Over BLE, send SET_WIFI_CONNECTION_INFO (code 112) with the new network, or SET_WIFI_MODE (code 147) with mode 0 to go back to the camera's own AP."
          actor: client
    credentials:
      wifi_passphrase_protection: "plaintext"
      stored_on_device:
        - "The camera AP's SSID and passphrase (88888888 on older firmware; per-unit on some newer firmware)."
        - "Station-mode networks and passphrases handed over with SET_WIFI_CONNECTION_INFO; the camera keeps a list (GET_CONNECTED_WIFI_LIST, DEL_WIFI_HISTORY_INFO)."
        - "The authorization IDs of BLE clients the user approved (inferred: CHECK_AUTHORIZATION answers 'authorized' for a known ID)."
      issued_to_client: []
      notes: >-
        The camera issues nothing to the client. The client chooses its own
        authorization_id and must keep reusing it. The station-mode passphrase
        crosses BLE or TCP as a plain protobuf string with no encryption
        above the link, and the camera AP passphrase can be read back over
        both (SDK Wi-Fi info; GET_OPTIONS option 36 over TCP).

  pairing:
    required: false
    confidence: "medium"
    security_mode: "app_layer"
    bonding: "unknown"
    exclusivity:
      single_connection: "unknown"
      single_bond: "unknown"
      recovery: >-
        Close the vendor app and any other BLE client, then reconnect. If the
        camera still reports it is occupied, power-cycle it (GO 2: hold the
        Action button 6 s to force a shutdown).
      notes: >-
        The authorization flow has a "busy" outcome when another device is
        mid-authorization, and the SDK has "camera is occupied" (4403) and
        "device Bluetooth busy" (4508) errors, so the camera serves one
        controlling client at a time in practice; the link-layer limit is not
        recorded.
    enter_pairing_mode:
      required: false
      notes: >-
        Direct control needs no pairing mode: the camera advertises while on,
        and a new client is admitted by the user approving the
        REQUEST_AUTHORIZATION prompt on the camera. For GPS-remote emulation
        the camera must presumably be told to pair with a remote from its own
        menus; no source documents the steps.
    unpair:
      supported: "unknown"
      notes: >-
        The vendor table has CANCEL_AUTHORIZATION (40, 0x28), which may revoke
        a client's approval; no open implementation sends it (insta360ctl
        misuses 0x28 as a "get device info" code), and no camera-side menu for
        approved clients is documented.
    notes: >-
      No link-layer pairing is demanded: insta360ctl connects to a GO 3
      through bluetoothd without bonding and gets answers. The security lives
      one layer up. CHECK_AUTHORIZATION (0x27) carries a client-chosen
      authorization_id; an unknown ID gets 'not authorized', and
      REQUEST_AUTHORIZATION (0x56) then puts a prompt on the camera that the
      user must accept; the verdict comes back as notification 0x2011. The
      sources disagree on the status numbering (insta360ctl's prose table
      says 1 = not authorized, 3 = authorized; its code, which ran against a
      GO 3, uses 1 = authorized, 2 = not authorized), and on whether the X,
      ONE and Ace models authorize at all (insta360ctl skips it for them).
      Whether the camera also requests a bond when a central offers one is
      not recorded. There is also a separate wake-up authorization frame for
      a sleeping camera (protocol_details.direct_control.wake_up_authorization).

  host_compatibility:
    - stack: bluez
      status: compatible
      verification: reported
      variants: ["GO 3"]
      basis: "insta360ctl's default backend is BlueZ D-Bus (bluetoothd's GATT client, via tinygo bluetooth), and its author reports photo, record, mode, battery, storage and GPS working against a GO 3. Which backend those runs used is not stated."
      notes: >-
        GPS-remote emulation needs the host to be a GATT server; insta360ctl
        requires its raw-HCI backend for that, not bluetoothd.
    - stack: android
      status: compatible
      verification: reported
      basis: "The vendor app and the official Android SDK connect to the cameras over BLE on Android (SDK README, connection module)."

  variants:
    - model: "X3"
      identification:
        local_name_prefix: "X3 "
      notes: >-
        Architectures A and B (insta360ctl's model table). Architecture A
        demonstrated on hardware by pchwalek. Direct-control framing unsettled
        (insta360ctl assumes the bare 16-byte header). Official SDK model.
    - model: "X4"
      identification:
        local_name_prefix: "X4 "
      notes: "Architectures A and B (insta360ctl's table). Framing unsettled. Official SDK model."
    - model: "X4 Air"
      identification:
        local_name_prefix: "X4 Air "
      notes: >-
        Name prefix from the vendor app's string pool only. No source says
        which architecture it speaks; the "X4 " prefix also matches it.
    - model: "X5"
      identification:
        local_name_prefix: "X5 "
      notes: "Architectures A and B (insta360ctl's table). Framing unsettled. Official SDK model; the SDK's shutdown call is documented for X5 and later only."
    - model: "ONE X3"
      identification:
        local_name_prefix: "ONE X3 "
      notes: "Architectures A and B per insta360ctl's table, which lists this name prefix beside 'X3 '. The sources do not tie it to a retail product."
    - model: "ONE X4"
      identification:
        local_name_prefix: "ONE X4 "
      notes: "Architectures A and B per insta360ctl's table, which lists this name prefix beside 'X4 '. The sources do not tie it to a retail product."
    - model: "ONE RS"
      identification:
        local_name_prefix: "ONE RS "
      notes: >-
        Includes the ONE RS 1-inch. Architectures A and B. Architecture A
        demonstrated on the 1-inch by pchwalek; TCP 6666 demonstrated by
        Rigacci. Reported to use an Ambarella H22 SoC (Rigacci). Official SDK
        model.
    - model: "ONE R"
      identification:
        local_name_prefix: "ONE R "
      notes: "Architecture A only (insta360ctl's table)."
    - model: "ONE X2"
      identification:
        local_name_prefix: "ONE X2 "
      notes: >-
        Architecture A only per insta360ctl, yet the official SDK lists ONE X2
        as a BLE-connectable model, so it serves something to a phone over
        BLE; which service is not recorded.
    - model: "ONE X"
      identification:
        local_name_prefix: "ONE X "
      notes: "Architecture A only (insta360ctl). Official SDK model; same open question as ONE X2."
    - model: "Ace Pro"
      identification:
        local_name_prefix: "Ace Pro "
      notes: "Architecture B only (insta360ctl's table). Framing unsettled."
    - model: "Ace Pro 2"
      identification:
        local_name_prefix: "Ace Pro 2 "
      notes: "Name prefix from the vendor app's string pool only; architecture not recorded. The 'Ace Pro ' prefix also matches it."
    - model: "Ace"
      identification:
        local_name_prefix: "Ace "
      notes: "Architecture B only (insta360ctl's table). The 'Ace ' prefix also matches the Ace Pro names, so test the longer prefixes first."
    - model: "GO 3"
      identification:
        local_name_prefix: "GO 3 "
      notes: >-
        FCC ID 2AWWH-CINSABKA (model CINSABKA; the grant's manual is the GO 3
        quick guide). Architecture B with the framed envelope, sync and
        authorization; the one model with upstream hardware results
        (insta360ctl, firmware v1.4.51). Also serves 0000b000-0000-1000-8000-00805f9b34fb and a custom
        128-bit service. Deviates from the vendor table on several codes
        (protocol_details.direct_control.go3_deviations). Not in
        insta360ctl's README table despite being its test camera. 5 GHz
        Wi-Fi (802.11a/n/ac) per the quick guide; its Action Pod case has its
        own Bluetooth radio.
    - model: "GO 3S"
      identification:
        local_name_prefix: "GO 3S "
      notes: "Treated like the GO 3 by insta360ctl's code (framed envelope). No hardware result."
    - model: "GO 2"
      notes: >-
        FCC ID 2AWWH-ING2 (model CING2XX/A per its label exhibit). The
        framed envelope is named after the GO 2 in the vendor's native
        library (per insta360ctl), which suggests it speaks it (hypothesis).
        Its BLE name prefix is not recorded. The GO 2 charge case has its own
        display and Bluetooth.
    - model: "X6"
      notes: >-
        Known only from FCC ID 2AWWH-CINSABXA ("Insta360 X6", granted
        2026-07-03, a DSS Bluetooth grant). No source has tested it, and no
        name prefix or architecture is recorded. Listed as unverified.

initialization:
  - characteristic: "0000be82-0000-1000-8000-00805f9b34fb"
    subscribe: true
    notes: "Replies and notifications arrive only here. Subscribe before the first write."
  - characteristic: "0000be81-0000-1000-8000-00805f9b34fb"
    description: >-
      GO line (and probably every direct-control model): after the first write
      the camera sends a sync frame on 0000be82-0000-1000-8000-00805f9b34fb (FF 06 41, uint16 LE size,
      a repeating AB BA body, CRC). Answer it immediately with
      framed_sync_reply (FF 07 41 07 00, seven zero bytes, CRC 5C 42). A
      client must handle this whenever it arrives; it is event-driven, not a
      fixed write.
  - characteristic: "0000be81-0000-1000-8000-00805f9b34fb"
    description: >-
      Authorization: CHECK_AUTHORIZATION (0x27) with the client's stable
      authorization_id and initiator type 2 (app); if the reply's status is
      not-authorized, REQUEST_AUTHORIZATION (0x56) with operation type 1
      (pair), then wait for the user to approve on the camera and for
      notification 0x2011. The body carries a client-chosen string, so the
      bytes cannot be fixed here; protocol_details.test_vectors gives a
      worked example. insta360ctl performs this only on the GO line.

services:
  - uuid: "0000be80-0000-1000-8000-00805f9b34fb"
    name: "Direct-control service (architecture B)"
    notes: >-
      The camera's control service on every architecture-B model. The 16-bit
      value is on the Bluetooth base but is not a SIG assignment.
      insta360ctl's GATT table also lists Device Information
      (0000180a-0000-1000-8000-00805f9b34fb) and Battery
      (0000180f-0000-1000-8000-00805f9b34fb) without naming models. The GO 3
      additionally exposes 0000b000-0000-1000-8000-00805f9b34fb and
      0000ae00-0000-1000-8000-00805f9b34fb (below) and a custom 128-bit service
      whose full UUIDs are not recorded
      (protocol_details.direct_control.go3_custom_service).
    characteristics:
      - uuid: "0000be81-0000-1000-8000-00805f9b34fb"
        name: "Command write (app to camera)"
        properties: ["read", "write", "write_without_response"]
        role: "command"
        notes: >-
          Every command goes here, on every model; the GO 3 ignores commands
          written anywhere else. insta360ctl writes without response. Two
          command families are declared. The framed_* commands are the
          GO-line form: FF 07 40, uint16 LE inner size, the 16-byte inner
          header (uint32 LE inner size, 04 00 00, uint16 LE code, 02,
          sequence, 00 00, 80, 00 00), the body, then CRC-16/MODBUS
          (poly 0xA001 reflected, init 0xFFFF, no final xor) over everything
          before it, low byte first. The bare_* commands are insta360ctl's
          assumed X/ONE/Ace form: the 16-byte header alone, bytes 0-1 =
          body length (not total), code in byte 7 only, no envelope and no
          CRC; insta360ctl splits messages into 20-byte writes and the camera
          would reassemble by the length field. Only the framed family has
          upstream hardware results. Message bodies are protobuf, and every
          declared command here has an empty or fixed-size body; codes with
          variable bodies (authorization, Wi-Fi, options) are documented with
          worked examples in protocol_details.
        commands:
          framed_take_picture:
            description: "TAKE_PICTURE (code 3), empty body, framed. Reply: status 200 on the same sequence. Tested on a GO 3 by insta360ctl."
            template: [0xFF, 0x07, 0x40, 0x10, 0x00, 0x10, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x03, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00, "{crc}"]
            parameters:
              seq: &seq_param
                type: "uint8"
                auto: "sequence"
                min: 1
                max: 254
                description: "Message sequence number, 1-254 then back to 1 (0 and 255 are reserved). The reply echoes it."
              crc: &crc_param
                type: "uint16"
                auto: "crc16_modbus"
                checksum_start: 0
                endianness: "little"
                description: "CRC-16/MODBUS over every preceding byte of the frame, envelope included, low byte first. With seq 1 this frame ends 6F AC."
            verification: "reported"
            packet_layout:
              "0": "0xFF envelope marker"
              "1": "0x07 app-to-camera (the camera's frames carry 0x06)"
              "2": "0x40 message (0x41 = sync)"
              "3": "inner size, uint16 LE: 16 + body length"
              "5": "inner packet: uint32 LE inner size (same value)"
              "9": "packet type 0x04 = message, then two zero bytes"
              "12": "message code, uint16 LE"
              "14": "content type 0x02 = protobuf"
              "15": "sequence number"
              "18": "0x80 = last fragment, direction app-to-camera"
              "21": "CRC-16/MODBUS, uint16 LE"
          framed_start_recording:
            description: "START_CAPTURE (code 4), empty body, framed. Starts video in the current mode. Tested on a GO 3 by insta360ctl."
            template: [0xFF, 0x07, 0x40, 0x10, 0x00, 0x10, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x04, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00, "{crc}"]
            parameters:
              seq: *seq_param
              crc: *crc_param
            verification: "reported"
          framed_stop_recording:
            description: "STOP_CAPTURE (code 5), empty body, framed. Tested on a GO 3 by insta360ctl."
            template: [0xFF, 0x07, 0x40, 0x10, 0x00, 0x10, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x05, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00, "{crc}"]
            parameters:
              seq: *seq_param
              crc: *crc_param
            verification: "reported"
          framed_start_timelapse:
            description: "START_TIMELAPSE (code 22, 0x16), empty body, framed. The vendor table says it takes a protobuf options body; insta360ctl sends none and marks it verified on a GO 3 in its code table but 'not tested' in its CLI."
            template: [0xFF, 0x07, 0x40, 0x10, 0x00, 0x10, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x16, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00, "{crc}"]
            parameters:
              seq: *seq_param
              crc: *crc_param
            verification: "reported"
          framed_stop_timelapse:
            description: "STOP_TIMELAPSE (code 23, 0x17), empty body, framed. Same caveat as framed_start_timelapse."
            template: [0xFF, 0x07, 0x40, 0x10, 0x00, 0x10, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x17, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00, "{crc}"]
            parameters:
              seq: *seq_param
              crc: *crc_param
            verification: "reported"
          framed_mark_highlight:
            description: "SET_KEY_TIME_POINT (code 60, 0x3C), empty body, framed: marks a highlight in the recording in progress. insta360ctl's code table says verified on GO 3; its CLI says not tested."
            template: [0xFF, 0x07, 0x40, 0x10, 0x00, 0x10, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x3C, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00, "{crc}"]
            parameters:
              seq: *seq_param
              crc: *crc_param
            verification: "reported"
          framed_upload_gps:
            description: >-
              UPLOAD_GPS (code 53, 0x35), framed, with insta360ctl's 24-byte
              body: latitude, longitude (decimal degrees) and altitude
              (metres) as three IEEE-754 float64 values, little-endian.
              insta360ctl reports it working on a GO 3; the vendor table
              lists the code with a protobuf body, so whether the camera
              actually geotags from this raw form, rather than merely
              accepting it, is unconfirmed. Validate latitude within ±90 and
              longitude within ±180 before sending.
            template: [0xFF, 0x07, 0x40, 0x28, 0x00, 0x28, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x35, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00, "{gps_fix}", "{crc}"]
            parameters:
              seq: *seq_param
              gps_fix: &gps_param
                type: "bytes"
                min_length: 24
                max_length: 24
                description: "float64 LE latitude (degrees, -90..90), float64 LE longitude (degrees, -180..180), float64 LE altitude (metres). Example 51.4779, -0.0015, 46.0 = 13 61 c3 d3 2b bd 49 40 fa 7e 6a bc 74 93 58 bf 00 00 00 00 00 00 47 40."
              crc: *crc_param
            verification: "reported"
          framed_get_battery_go3:
            description: >-
              Code 25 (0x19), empty body, framed. On the GO 3 (firmware
              1.4.51) the reply to this code is the battery state: protobuf
              field 1 = level in percent, field 2 = charging (0/1)
              (payload_formats.Go3_Battery_Reply). The vendor table names 25
              CALIBRATE_GYRO, and on firmware that follows the table it starts
              a gyro calibration instead.
            template: [0xFF, 0x07, 0x40, 0x10, 0x00, 0x10, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x19, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00, "{crc}"]
            parameters:
              seq: *seq_param
              crc: *crc_param
            advanced: true
            advanced_reason: >-
              Only the GO 3 is reported to answer this code with its battery
              level. The vendor's table names it CALIBRATE_GYRO; on any other
              model or firmware it may run a gyro calibration, which the SDK
              says must be done with the camera standing level on a stable
              surface, and a calibration taken in the hand can degrade
              stabilisation until it is redone.
            verification: "reported"
          framed_sync_reply:
            description: "The client's sync frame: envelope type 0x41 with seven zero bytes, sent in answer to the camera's sync (FF 06 41 ... with a repeating AB BA body). insta360ctl's GO 3 flow."
            value: [0xFF, 0x07, 0x41, 0x07, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x5C, 0x42]
            verification: "reported"
          framed_heartbeat:
            description: "Heartbeat: the envelope around a bare 7-byte keep-alive packet head (uint32 LE size 7, packet type 0x05). The vendor app's string pool carries this exact frame, and it is the BLE twin of the TCP keep-alive 07 00 00 00 05 00 00. How often the app sends it is not recorded."
            value: [0xFF, 0x07, 0x40, 0x07, 0x00, 0x07, 0x00, 0x00, 0x00, 0x05, 0x00, 0x00, 0x6B, 0x46]
            verification: "reported"
          bare_take_picture:
            description: "TAKE_PICTURE (code 3) in insta360ctl's bare 16-byte form for the X, ONE and Ace models. No source has run it on hardware, and its length field disagrees with the vendor's packet convention (device.notes)."
            template: [0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x03, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00]
            parameters:
              seq: *seq_param
            verification: "hypothesis"
          bare_start_recording:
            description: "START_CAPTURE (code 4), bare form. Same caveat as bare_take_picture."
            template: [0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x04, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00]
            parameters:
              seq: *seq_param
            verification: "hypothesis"
          bare_stop_recording:
            description: "STOP_CAPTURE (code 5), bare form. Same caveat as bare_take_picture."
            template: [0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x05, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00]
            parameters:
              seq: *seq_param
            verification: "hypothesis"
          bare_start_timelapse:
            description: "START_TIMELAPSE (code 22), bare form, empty body. Same caveat as bare_take_picture."
            template: [0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x16, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00]
            parameters:
              seq: *seq_param
            verification: "hypothesis"
          bare_stop_timelapse:
            description: "STOP_TIMELAPSE (code 23), bare form, empty body. Same caveat as bare_take_picture."
            template: [0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x17, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00]
            parameters:
              seq: *seq_param
            verification: "hypothesis"
          bare_mark_highlight:
            description: "SET_KEY_TIME_POINT (code 60), bare form. Same caveat as bare_take_picture."
            template: [0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x3C, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00]
            parameters:
              seq: *seq_param
            verification: "hypothesis"
          bare_upload_gps:
            description: "UPLOAD_GPS (code 53) in the bare form with insta360ctl's 24-byte float64 body; the length field is 0x18 (body only). Same caveats as bare_take_picture and framed_upload_gps."
            template: [0x18, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x35, 0x00, 0x02, "{seq}", 0x00, 0x00, 0x80, 0x00, 0x00, "{gps_fix}"]
            parameters:
              seq: *seq_param
              gps_fix: *gps_param
            verification: "hypothesis"
      - uuid: "0000be82-0000-1000-8000-00805f9b34fb"
        name: "Reply and event notify (camera to app)"
        properties: ["notify"]
        role: "notify"
        notes: >-
          Replies, notifications and (GO line) the camera's sync frames. On
          the GO line each frame is FF 06 40 (message) or FF 06 41 (sync),
          uint16 LE size, inner data, CRC-16/MODBUS; a frame longer than the
          ATT payload spans several notifications, so accumulate until
          5 + size + 2 bytes have arrived, check the CRC, then parse the
          16-byte inner header (payload_formats.Inner_Header). In a reply the
          code field carries a status (payload_formats.Response_Status); in
          a notification it carries a code of 0x2000 or more
          (payload_formats.Notification_Codes). The byte-13 direction bit is
          set on camera-to-app messages (0xC0 for a single-fragment reply).
  - uuid: "0000b000-0000-1000-8000-00805f9b34fb"
    name: "Secondary direct-control service (GO 3)"
    notes: >-
      Seen on the GO 3 by insta360ctl. It subscribes to all three notify
      characteristics as a precaution, but the GO 3 answers commands only on
      0000be81-0000-1000-8000-00805f9b34fb; writes to 0000b001-0000-1000-8000-00805f9b34fb are ignored.
      What the camera sends on the three notify characteristics is not recorded. Not in the
      vendor app's string pool.
    initialization:
      - characteristic: "0000b002-0000-1000-8000-00805f9b34fb"
        subscribe: true
      - characteristic: "0000b003-0000-1000-8000-00805f9b34fb"
        subscribe: true
      - characteristic: "0000b004-0000-1000-8000-00805f9b34fb"
        subscribe: true
    characteristics:
      - uuid: "0000b001-0000-1000-8000-00805f9b34fb"
        name: "Secondary write"
        properties: ["read", "write", "write_without_response"]
        notes: "Do not send commands here; the GO 3 ignores them (insta360ctl real-device finding)."
      - uuid: "0000b002-0000-1000-8000-00805f9b34fb"
        name: "Secondary notify 1"
        properties: ["notify"]
      - uuid: "0000b003-0000-1000-8000-00805f9b34fb"
        name: "Secondary notify 2"
        properties: ["notify"]
      - uuid: "0000b004-0000-1000-8000-00805f9b34fb"
        name: "Secondary notify 3"
        properties: ["notify"]
  - uuid: "0000ae00-0000-1000-8000-00805f9b34fb"
    name: "AE00 service (seen on the GO 3, role unknown)"
    notes: >-
      Listed by insta360ctl "from protocol analysis" for "some models", and
      present in the vendor app's string pool with
      0000ae01-0000-1000-8000-00805f9b34fb and
      0000ae02-0000-1000-8000-00805f9b34fb. The only placement on a model is
      insta360ctl's GO 3 note, which lists 0000ae01-0000-1000-8000-00805f9b34fb
      among the GO 3's write characteristics and reports that the camera
      ignores commands written there. What the service carries is not
      recorded; insta360ctl uses it only as a fallback write target. The same
      16-bit numbers are JieLi's stock RCSP/OTA service on unrelated products,
      so the number alone proves nothing about the silicon. List it
      read-only; do not write to it.
    characteristics:
      - uuid: "0000ae01-0000-1000-8000-00805f9b34fb"
        name: "AE00 write"
        properties: ["write"]
      - uuid: "0000ae02-0000-1000-8000-00805f9b34fb"
        name: "AE00 notify"
        properties: ["notify", "read"]
  - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
    name: "Battery Service"
    notes: >-
      Listed in insta360ctl's GATT table without a model. Which models serve
      it, and whether it reports the camera or a charge case, is not
      recorded, so no entity is bound to it.
    characteristics:
      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "Battery Level"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 1
            name: "battery_level"
            type: "uint8"
            unit: "%"
            device_class: "battery"

payload_formats:
  Framed_Packet:
    description: >-
      The GO-line BLE envelope around one inner packet (vendor native library,
      per insta360ctl; hardware-exercised on a GO 3; the vendor app's string
      pool carries two complete frames whose CRCs check).
    fields:
      - name: "marker"
        description: "Byte 0: 0xFF."
      - name: "direction_type"
        description: "Byte 1: 0x07 on app-to-camera frames; 0x06 on the camera's frames (insta360ctl's constant and the app's 'ff0641'/'ff0640' strings). Other values (0x0C, 0x0D) belong to the short wake-up form."
      - name: "packet_kind"
        description: "Byte 2: 0x40 message, 0x41 sync."
      - name: "inner_size"
        description: "Bytes 3-4: uint16 little-endian, the number of inner bytes that follow (16 + body for a message)."
      - name: "inner"
        description: "Bytes 5 .. 5+inner_size-1: the inner packet (payload_formats.Inner_Header) or sync data."
      - name: "crc"
        description: "Last 2 bytes: CRC-16/MODBUS (reflected poly 0xA001, init 0xFFFF, no final xor) over every earlier byte, little-endian."
    parse_rules:
      - "Accumulate notifications until at least 5 bytes are buffered, read inner_size from bytes 3-4, then keep accumulating until 5 + inner_size + 2 bytes are buffered."
      - "Verify the CRC over bytes 0 .. 5+inner_size-1 before using the frame; drop the frame on a mismatch."
      - "Byte 2 = 0x41 is a sync frame: answer it with framed_sync_reply at once."
      - "Otherwise parse the inner bytes with Inner_Header."
      - "Frames are at most 500 bytes; messages that do not fit are split with the fragment fields of the inner header."
    example: "ff 07 40 10 00 10 00 00 00 04 00 00 03 00 02 01 00 00 80 00 00 6f ac  (TAKE_PICTURE, seq 1)"
  Inner_Header:
    description: >-
      The 16-byte inner header: a 7-byte packet head and a 9-byte message
      head. Identical, byte for byte, to a TCP/6666 packet including its
      length prefix.
    fields:
      - name: "packet_size"
        type: "uint32"
        endianness: "little"
        unit: "B"
        description: "Bytes 0-3: total inner size including these 16 bytes (16 + body). insta360ctl's bare form writes the body length here instead."
      - name: "packet_type"
        description: "Byte 4: 0x04 message, 0x05 keep-alive/heartbeat, 0x06 sync, 0x01 stream (the TCP values; the BLE heartbeat uses 0x05)."
      - name: "packet_flags"
        description: "Bytes 5-6: 0x00 0x00 in every observed message."
      - name: "code"
        type: "uint16"
        endianness: "little"
        description: "Bytes 7-8: message code (app requests), status 200/400/500/501 (replies), or a notification code of 0x2000 and up."
      - name: "content_type"
        description: "Byte 9: 0x02 protobuf (0x00 raw)."
      - name: "sequence"
        description: "Byte 10: sequence number 1-254 (the low byte of a 30-bit fragment offset field that spans bytes 10-13)."
      - name: "fragment_flags"
        description: "Byte 13: bit 7 last fragment, bit 6 direction (1 = camera to app), bits 0-5 upper fragment-offset bits. 0x80 on a single-fragment request, 0xC0 on a single-fragment reply."
      - name: "trailer"
        description: "Bytes 14-15: zero in requests; non-zero values have been seen in replies over TCP (Rigacci), meaning unknown."
    example: "10 00 00 00 04 00 00 03 00 02 01 00 00 80 00 00"
  Response_Status:
    description: "The code field of a reply. The sequence number matches the request."
    values:
      "200": "OK. The body is the reply message for the request's code (often empty)."
      "400": "Bad request: unknown code or invalid parameters. The body may carry an error message (protobuf field 2, string)."
      "500": "Execution error, e.g. 'camera is busy.' or 'msg execute err.' (Rigacci, ONE RS). Body: field 1 error code, field 2 message string."
      "501": "Not implemented on this camera."
  Notification_Codes:
    description: >-
      Unsolicited camera messages, dispatched by code. Names from the vendor
      table as transcribed by insta360ctl; the GO 3 reuses some codes with
      different contents (protocol_details.direct_control.go3_deviations).
      Over TCP their sequence field is arbitrary (Rigacci saw ff 8a 43), so
      never route them by sequence.
    values:
      "8193": "0x2001 firmware upgrade complete"
      "8195": "0x2003 battery update"
      "8196": "0x2004 battery low"
      "8197": "0x2005 shutdown"
      "8198": "0x2006 storage (card) update"
      "8199": "0x2007 storage full"
      "8200": "0x2008 key pressed"
      "8201": "0x2009 capture stopped"
      "8208": "0x2010 current capture status (GO 3: storage fields, see Go3_Capture_Status)"
      "8209": "0x2011 authorization result: field 1 bool authorized"
      "8214": "0x2016 camera temperature"
      "8215": "0x2017 camera Wi-Fi started"
      "8217": "0x2019 charge-box battery update"
      "8222": "0x201E charge-box connect status"
      "8225": "0x2021 GO 3 battery state (not in the vendor table)"
      "8229": "0x2025 GO 3 power state (not in the vendor table)"
      "8230": "0x2026 GO 3 periodic status (not in the vendor table)"
      "8232": "0x2028 Wi-Fi connection result (station-mode join outcome and IP)"
      "8238": "0x202E firmware upgrade status"
      "8247": "0x2037 Wi-Fi mode change"
      "8249": "0x2039 Wi-Fi scan list changed"
  Authorization_Status:
    description: >-
      Field 1 of the reply to CHECK_AUTHORIZATION (0x27). insta360ctl's code,
      which ran against a GO 3, uses the numbering below; its prose table
      disagrees (1 = not authorized, 2 = pending, 3 = authorized). Treat
      anything but 1 as needing REQUEST_AUTHORIZATION until someone checks.
      Field 2 is a Find My pairing status, 0-2.
    values:
      "0": "unknown"
      "1": "authorized"
      "2": "not authorized: send REQUEST_AUTHORIZATION"
      "3": "pending (waiting for the user)"
      "4": "denied"
      "5": "expired"
  Go3_Battery_Reply:
    description: "Body of the status-200 reply to code 25 on the GO 3 (framed_get_battery_go3). Protobuf varints."
    fields:
      - name: "level"
        unit: "%"
        description: "Field 1 (tag 0x08), battery level 0-100."
      - name: "charging"
        description: "Field 2 (tag 0x10), 1 while charging, 0 otherwise."
    example: "08 4b 10 00  (75 %, not charging; constructed from the documented fields)"
  Go3_Capture_Status:
    description: "Body of notification 0x2010 as observed on the GO 3 (insta360ctl). Protobuf varints. Units of the capacity fields are not established."
    fields:
      - name: "capture_state"
        description: "Field 1: 0 idle, 1 post-recording, 4 recording."
      - name: "free_capacity"
        description: "Field 4: free capacity; unit not established (MB or remaining seconds)."
      - name: "file_count"
        description: "Field 5: number of files."
      - name: "total_capacity"
        description: "Field 6: total capacity; unit not established."
  Wifi_Connection_Result:
    description: "Body of notification 8232 (0x2028) after SET_WIFI_CONNECTION_INFO."
    fields:
      - name: "result"
        description: "Field 1: 0 success, 1 timeout, 2 connect failed."
      - name: "connection_info"
        description: "Field 2: field 1 ssid, field 2 bssid, field 3 passphrase, field 4 the camera's new IP address (dotted-quad string, set on success)."
  Options_Wifi_Info:
    description: >-
      Reply to GET_OPTIONS (code 8) asking for option type 36 (Wi-Fi info),
      from Rigacci's published ONE RS exchange. The reply body's field 1
      repeats the option types asked for; field 2 holds one sub-field per
      option whose field number equals the option type (15 serial number,
      36 Wi-Fi info, 48 camera type in Rigacci's example). Inside Wi-Fi info:
      field 1 SSID, field 2 passphrase, field 3 channel, field 4 unknown (0).
      The SDK reads the same information over BLE; that the BLE path uses
      this message is inferred.
    parse_rules:
      - "Request body: field 1 = 36 (0a 01 24 packed, or 08 24; proto3 parsers accept both)."
      - "Reply body: skip field 1; in field 2 find field 36 (key bytes a2 02), and decode its sub-fields."
    example: "request 13 00 00 00 04 00 00 08 00 02 05 00 00 80 00 00 0a 01 24; reply body 08 24 12 25 a2 02 22 0a 11 'ONE RS ABC123.OSC' 12 08 '88888888' 18 95 01 20 00 (serial fragment invented)"
  Remote_Command:
    description: "Architecture A: the 9-byte frame the emulated remote notifies on 0000ce82-0000-1000-8000-00805f9b34fb (pchwalek, insta360ctl)."
    fields:
      - name: "preamble"
        description: "Bytes 0-6: FC EF FE 86 00 03 01, constant."
      - name: "action"
        description: "Byte 7: 0x00 screen/power group, 0x01 mode, 0x02 shutter."
      - name: "param"
        description: "Byte 8: 0x00 normally; with action 0x00, 0x03 = power off (0x00 = screen)."
    example: "fc ef fe 86 00 03 01 02 00  (shutter)"

