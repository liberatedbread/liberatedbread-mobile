remaining_unknowns:
  - "Which framing the X-series, ONE RS and Ace cameras expect on 0000be81-0000-1000-8000-00805f9b34fb: insta360ctl's bare 16-byte header (never run on hardware), the GO-line envelope, or something else; and whether they need the sync and authorization exchange."
  - "The authorization status numbering (the two insta360ctl tables disagree), whether the verdict comes as the reply to 0x56 or as notification 0x2011, and whether the X/ONE/Ace models authorize at all."
  - "How often the BLE heartbeat must be sent, and whether an idle BLE link is dropped without it."
  - "What the ONE X, ONE X2 and ONE R serve to a phone over BLE; the official SDK lists ONE X and ONE X2 as BLE-connectable although insta360ctl says they lack 0000be80-0000-1000-8000-00805f9b34fb."
  - "The camera-side steps for pairing a GPS remote (architecture A), and what the camera writes to 0000ce81-0000-1000-8000-00805f9b34fb."
  - "Which byte order of the 0000ce83-0000-1000-8000-00805f9b34fb, 0000ffd3-0000-1000-8000-00805f9b34fb and 0000ffd4-0000-1000-8000-00805f9b34fb static values the camera checks, if it checks them."
  - "Whether the six-character wake ID is always the tail of the serial number."
  - "Whether UPLOAD_GPS's raw 24-byte float64 body geotags or is merely accepted; the vendor table lists a protobuf body."
  - "What 0000ae00-0000-1000-8000-00805f9b34fb carries and which models besides the GO 3 serve it; which models serve 0000180f-0000-1000-8000-00805f9b34fb; the full UUIDs of the GO 3's custom 128-bit service."
  - "The units of the GO 3's storage fields in notification 0x2010."
  - "Whether station mode (SET_WIFI_CONNECTION_INFO) works, and on which models and firmware."
  - "The HTTP paths on port 80, and whether the camera listens on any port besides 6666 and 80 (the earlier 8080/9999 reading did not survive a re-check)."
  - "Which firmware randomises the AP passphrase, and what the SDK's 'password version' encodes."
  - "Whether an un-activated camera limits any of the local protocol."
  - "The factory-reset procedure and what RESTORE_FACTORY_SETTINGS clears; whether CANCEL_AUTHORIZATION revokes an approved client."
  - "Whether the cameras use public or rotating BLE addresses, and whether they accept more than one central."
  - "The BLE name prefixes of the GO 2 and X6, and which retail models the FCC grants 2AWWH-CINSAAJA, 2AWWH-CINSABMA and 2AWWH-CINSAATA cover."
  - "Most of the protobuf schema: bodies for SET_OPTIONS/GET_OPTIONS beyond Wi-Fi info, capture options, file lists. RigacciOrg ships compiled Python modules for the ONE RS that were not transcribed here."
  - "Firmware update mechanism, image format and signing (not investigated)."

