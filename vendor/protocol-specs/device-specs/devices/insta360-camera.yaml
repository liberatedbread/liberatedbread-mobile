features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["unknown"]
      transport: ["wifi_softap", "usb"]
      image:
        signing: "unknown"
        source: "unknown"
        notes: >-
          The SDK's upgrade call takes a firmware file path from the caller;
          the vendor app fetches images from its cloud. The SDK warns that
          an image for the wrong model can damage the camera (its example:
          a ONE X package on a ONE X2).
      enter:
        how: "unknown"
        notes: "No entry bytes are recorded, and none are wanted here (out of scope)."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >-
        The camera takes firmware updates through the vendor app and the SDK.
        The SDK says BLE cannot carry them, so they go over Wi-Fi or USB, and
        it refuses an upgrade below 12 % battery (error -1002). The message
        table has firmware-status notifications (0x2001, 0x202E) and a
        NOTIFY_OTA_ERROR code (167). The mechanism itself was not
        investigated and no bytes are documented; this entry exists so a
        consumer knows the device updates and keeps away from it.

protocol_details:
  model_matrix:
    description: >-
      Which BLE architecture each model speaks. "A" = GPS-remote emulation
      (host serves 0000ce80-0000-1000-8000-00805f9b34fb), "B" = direct control (camera serves 0000be80-0000-1000-8000-00805f9b34fb).
      Source: insta360ctl's README table and its model code, unless noted.
      Only the GO 3 (B) and the X3 and ONE RS 1-inch (A) have upstream
      hardware results.
    rows:
      - {model: "X3", name_prefix: "X3 ", a: "yes (hardware: pchwalek)", b: "yes", b_framing: "bare per insta360ctl (unconfirmed)"}
      - {model: "X4", name_prefix: "X4 ", a: "yes", b: "yes", b_framing: "bare per insta360ctl (unconfirmed)"}
      - {model: "X4 Air", name_prefix: "X4 Air ", a: "unknown", b: "unknown", b_framing: "unknown", note: "name prefix from the vendor app only"}
      - {model: "X5", name_prefix: "X5 ", a: "yes", b: "yes", b_framing: "bare per insta360ctl (unconfirmed)"}
      - {model: "ONE X3", name_prefix: "ONE X3 ", a: "yes", b: "yes", b_framing: "bare per insta360ctl (unconfirmed)"}
      - {model: "ONE X4", name_prefix: "ONE X4 ", a: "yes", b: "yes", b_framing: "bare per insta360ctl (unconfirmed)"}
      - {model: "ONE RS (incl. 1-inch)", name_prefix: "ONE RS ", a: "yes (hardware: pchwalek, 1-inch)", b: "yes", b_framing: "bare per insta360ctl (unconfirmed)", wifi_tcp: "yes (hardware: Rigacci)"}
      - {model: "ONE R", name_prefix: "ONE R ", a: "yes", b: "no"}
      - {model: "ONE X2", name_prefix: "ONE X2 ", a: "yes", b: "no", note: "the official SDK nevertheless lists it for BLE"}
      - {model: "ONE X", name_prefix: "ONE X ", a: "yes", b: "no", note: "the official SDK nevertheless lists it for BLE"}
      - {model: "Ace Pro", name_prefix: "Ace Pro ", a: "no", b: "yes", b_framing: "bare per insta360ctl (unconfirmed)"}
      - {model: "Ace Pro 2", name_prefix: "Ace Pro 2 ", a: "unknown", b: "unknown", note: "name prefix from the vendor app only"}
      - {model: "Ace", name_prefix: "Ace ", a: "no", b: "yes", b_framing: "bare per insta360ctl (unconfirmed)"}
      - {model: "GO 3", name_prefix: "GO 3 ", a: "not listed", b: "yes (hardware: insta360ctl)", b_framing: "framed, sync, authorization"}
      - {model: "GO 3S", name_prefix: "GO 3S ", a: "not listed", b: "yes (code only)", b_framing: "framed"}
      - {model: "GO 2", name_prefix: "unknown", a: "unknown", b: "probably (hypothesis)", b_framing: "framed (hypothesis: the envelope is named after the GO 2)"}
      - {model: "X6", name_prefix: "unknown", a: "unknown", b: "unknown", note: "FCC grant only; untested by any source"}
    wifi_tcp_note: >-
      TCP 6666 is hardware-demonstrated on the ONE RS only. The official SDK
      connects over Wi-Fi to X5, X4, X3, ONE X2, ONE X, ONE RS and ONE RS
      1-inch, and insta360ctl's examples use a GO 3 AP, so the protocol is
      presumably family-wide (hypothesis).

  gps_remote_emulation:
    description: >-
      Architecture A. The host is a BLE peripheral and GATT server that looks
      like an Insta360 GPS remote; the camera is the central. Sources:
      pchwalek's ESP32 sketch (hardware-demonstrated on an X3 and a ONE RS
      1-inch) and insta360ctl's remote server (untested). Where the two
      disagree, pchwalek's bytes are listed first because they ran against
      hardware; the vendor app's string pool agrees with pchwalek wherever
      it can be checked.
    advertising:
      local_name: "Insta360 GPS Remote"
      service_uuids: ["0000ce80-0000-1000-8000-00805f9b34fb", "0000d0ff-3c17-d293-8e48-14fe2e4da212"]
      scan_response: true
      notes: "pchwalek advertises both service UUIDs with a scan response; insta360ctl advertises the name and 0000ce80-0000-1000-8000-00805f9b34fb only."
    gatt_server:
      - service: "0000ce80-0000-1000-8000-00805f9b34fb"
        characteristics:
          - uuid: "0000ce81-0000-1000-8000-00805f9b34fb"
            properties: ["write"]
            role: "The camera writes to the remote here. What it writes is not recorded; both implementations accept and ignore it."
          - uuid: "0000ce82-0000-1000-8000-00805f9b34fb"
            properties: ["notify"]
            descriptor: "Client Characteristic Configuration (00002902-0000-1000-8000-00805f9b34fb)"
            initial_value: [0x00]
            role: "The remote notifies 9-byte commands here after the camera subscribes."
          - uuid: "0000ce83-0000-1000-8000-00805f9b34fb"
            properties: ["read"]
            value: [0x01, 0x02]
            value_insta360ctl: [0x02, 0x01]
            role: "Static read, apparently a remote protocol version. pchwalek stores the uint16 0x0201 little-endian (bytes 01 02); insta360ctl serves 02 01. Which order the camera checks, if any, is not established."
      - service: "0000d0ff-3c17-d293-8e48-14fe2e4da212"
        notes: >-
          The information service is on the vendor base, but its
          characteristics are 16-bit values on the Bluetooth base in
          pchwalek's sketch and in the vendor app's string pool
          (0000ffd0-0000-1000-8000-00805f9b34fb to 0000ffd5-0000-1000-8000-00805f9b34fb, and
          0000ffd8-0000-1000-8000-00805f9b34fb). insta360ctl puts the first four
          on the vendor base instead (0000ffd1-3c17-d293-8e48-14fe2e4da212 to
          0000ffd4-3c17-d293-8e48-14fe2e4da212), which is probably its mistake.
        characteristics:
          - uuid: "0000ffd1-0000-1000-8000-00805f9b34fb"
            properties: ["write"]
            role: "pchwalek: writable, no value. insta360ctl: readable device name (its own name string)."
          - uuid: "0000ffd2-0000-1000-8000-00805f9b34fb"
            properties: ["read"]
            role: "pchwalek: readable, no value set. insta360ctl: firmware version string ('1.0.0')."
          - uuid: "0000ffd3-0000-1000-8000-00805f9b34fb"
            properties: ["read"]
            value: [0x01, 0x90, 0x1E, 0x30]
            value_insta360ctl: [0x30, 0x1E, 0x90, 0x01]
            role: "Fixed value. pchwalek stores the uint32 0x301e9001 little-endian; insta360ctl serves the big-endian byte order."
          - uuid: "0000ffd4-0000-1000-8000-00805f9b34fb"
            properties: ["read"]
            value: [0x01, 0x20, 0x00, 0x18]
            value_insta360ctl: [0x18, 0x00, 0x20, 0x01]
            role: "Fixed value. pchwalek stores the uint32 0x18002001 little-endian; insta360ctl serves the big-endian byte order."
          - uuid: "0000ffd5-0000-1000-8000-00805f9b34fb"
            properties: ["read"]
            role: "pchwalek only, no value."
          - uuid: "0000ffd8-0000-1000-8000-00805f9b34fb"
            properties: ["write"]
            role: "pchwalek only."
          - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
            properties: ["read"]
            role: "pchwalek only (also in the vendor app's strings)."
          - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
            properties: ["write"]
            role: "pchwalek only (also in the vendor app's strings)."
          - uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
            properties: ["read"]
            role: "pchwalek declares it as a characteristic under this service; role unknown."
    commands:
      description: "Notified on 0000ce82-0000-1000-8000-00805f9b34fb as one 9-byte value each (payload_formats.Remote_Command). pchwalek's sketch uses every one on hardware."
      screen: [0xFC, 0xEF, 0xFE, 0x86, 0x00, 0x03, 0x01, 0x00, 0x00]
      mode_cycle: [0xFC, 0xEF, 0xFE, 0x86, 0x00, 0x03, 0x01, 0x01, 0x00]
      shutter: [0xFC, 0xEF, 0xFE, 0x86, 0x00, 0x03, 0x01, 0x02, 0x00]
      power_off: [0xFC, 0xEF, 0xFE, 0x86, 0x00, 0x03, 0x01, 0x00, 0x03]
      notes: >-
        Shutter takes a photo or starts/stops a recording depending on the
        current mode. Screen wakes the display; pchwalek's sketch sends it
        twice as an off/on toggle. insta360ctl calls it "wake display".
    wake_advertisement:
      description: >-
        Advertise this as manufacturer-specific data (AD type 0xFF) to wake a
        camera that has powered off after being paired with the remote.
        Layout from pchwalek's sketch (hardware-demonstrated); the vendor
        app's string pool carries the same ten bytes 09 4f 52 42 49 54 09 ff
        0f 00.
      manufacturer_data: ["0x4C 0x00 company ID (Apple, little-endian)", "0x02 0x15 iBeacon type and length", "0x09", "'ORBIT' (4f 52 42 49 54)", "0x09 0xFF 0x0F 0x00", "camera ID: 6 ASCII characters", "0x00 0x00 0x00 0x00 (major, minor)", "0xE4 (measured power, -28 dBm)", "0x01"]
      example: "4c 00 02 15 09 4f 52 42 49 54 09 ff 0f 00 41 42 43 31 32 33 00 00 00 00 e4 01  (camera ID 'ABC123', invented)"
      camera_id: >-
        Six ASCII characters that pchwalek reads from the camera's Settings >
        Camera Info. In both of the sketch's examples they are uppercase
        alphanumerics, which fits the last six characters of the serial
        number, the same fragment that ends the camera's SSID (hypothesis).
        Do not publish a real one.
      flags: "pchwalek sets general-discoverable plus the simultaneous LE/BR-EDR flags for this advertisement and stops normal advertising first."
      insta360ctl_variant: >-
        insta360ctl builds a different beacon ('ORBIT' at the start of the
        UUID field, then 0x00, the ID, major 1, minor 1, power 0xC5). It is
        untested and disagrees with both pchwalek and the vendor app's bytes;
        do not use it.

  direct_control:
    envelope:
      description: "GO-line framing (payload_formats.Framed_Packet). Built by the vendor's native protocol library, per insta360ctl."
      app_to_camera_message: "FF 07 40 <size lo> <size hi> <inner> <crc lo> <crc hi>"
      app_to_camera_sync: "FF 07 41 07 00 00 00 00 00 00 00 00 5C 42"
      camera_to_app: "FF 06 40 ... (message), FF 06 41 ... (sync, body a repeating AB BA)"
      crc: "CRC-16/MODBUS: reflected polynomial 0xA001, init 0xFFFF, no final xor, over every byte before the CRC, stored low byte first."
      max_packet_bytes: 500
      max_body_bytes: >-
        insta360ctl states 486 (500 - 5 - 9) in its prose and uses 495 as the
        maximum inner size in code; its arithmetic leaves out the 7-byte
        packet head, so 479 may be the true body limit. Not established.
      fragmentation: >-
        A message longer than one packet is split using the inner header's
        30-bit fragment offset (bytes 10-13) and the last-fragment bit (byte
        13 bit 7); the receiver concatenates fragments in offset order until
        the last one. In single-fragment messages the low byte of the offset
        field is used as the sequence number.
      app_string_frames:
        heartbeat: "ff 07 40 07 00 07 00 00 00 05 00 00 6b 46 (declared as framed_heartbeat; CRC checks)"
        unknown_camera_frame: "ff 06 40 08 00 08 00 00 00 b0 00 00 01 6d 90: a camera-to-app frame with packet type 0xB0 and a one-byte body 01; CRC checks; role unknown"
        prefixes: "ff 06 41 (the camera's sync prefix) and ff 0d 03 (role unknown) also appear in the string pool on their own."
    bare_header16:
      description: >-
        insta360ctl's assumed form for X, ONE and Ace models: the 16-byte
        header written directly to 0000be81-0000-1000-8000-00805f9b34fb, with
        bytes 0-1 = body length (uint16 LE, header excluded), bytes 2-3 zero,
        the code in byte 7 only (byte 8 zero), and messages split into 20-byte
        writes. No sync, heartbeat or authorization. insta360ctl's prose says
        the two header forms produce identical bytes for small bodies; they do
        not (a bare empty-body header starts 00 00, the vendor form 10 00).
        No source ran this form on hardware.
    authorization:
      check_authorization: "Code 39 (0x27). Body: field 1 authorization_id (string), field 2 Find My token (string, optional), field 3 initiator type (0 default, 1 user, 2 app, 3 system, 16 background, 32 auto-reconnect). Reply (status 200): payload_formats.Authorization_Status."
      request_authorization: "Code 86 (0x56). Body: field 1 operation type (0 default, 1 pair, 2 re-pair, 3 unpair per insta360ctl's code; its prose calls 3 'force re-pair'). The camera prompts the user."
      result: "Notification 8209 (0x2011). Body: field 1 bool authorized."
      cancel: "CANCEL_AUTHORIZATION (40, 0x28) and CANCEL_REQUEST_AUTHORIZATION (87, 0x57) exist; no open implementation sends them."
      authorization_id: >-
        A client-chosen string that identifies the client; insta360ctl sends
        the camera's own address string, the vendor's field comment suggests
        the phone's Bluetooth address. Any stable string presumably works;
        reuse it on every connection. Test vectors use the documentation MAC
        00:00:5e:00:53:01.
    wake_up_authorization: >-
      For a camera in low-power sleep the vendor library has a short frame
      that skips sync and protobuf: FF 0C 02, uint16 LE length, the
      authorization_id bytes, CRC-16/MODBUS (insta360ctl, from the native
      library; never sent by it). Separate from the architecture-A wake
      advertisement. How the camera answers is not recorded.
    message_codes:
      description: >-
        App-to-camera codes from the vendor table, as transcribed by
        insta360ctl (the same codes over BLE and TCP). "hw" marks codes
        insta360ctl ran against a GO 3. The table continues to 201; codes
        0x1000 and up are phone-request codes and 0x3000 and up factory codes.
      codes:
        "1": "START_LIVE_STREAM (TCP preview; body StartLiveStream)"
        "2": "STOP_LIVE_STREAM"
        "3": "TAKE_PICTURE (hw)"
        "4": "START_CAPTURE (hw)"
        "5": "STOP_CAPTURE (hw)"
        "6": "CANCEL_CAPTURE"
        "7": "SET_OPTIONS"
        "8": "GET_OPTIONS"
        "9": "SET_PHOTOGRAPHY_OPTIONS"
        "10": "GET_PHOTOGRAPHY_OPTIONS"
        "12": "DELETE_FILES"
        "13": "GET_FILE_LIST"
        "15": "GET_CURRENT_CAPTURE_STATUS"
        "22": "START_TIMELAPSE"
        "23": "STOP_TIMELAPSE"
        "24": "ERASE_SD_CARD"
        "25": "CALIBRATE_GYRO (GO 3: battery reply instead)"
        "26": "SCAN_BT_PERIPHERAL"
        "27": "CONNECT_TO_BT_PERIPHERAL"
        "32": "REBOOT_CAMERA"
        "33": "OPEN_CAMERA_WIFI"
        "34": "CLOSE_CAMERA_WIFI"
        "39": "CHECK_AUTHORIZATION (hw)"
        "40": "CANCEL_AUTHORIZATION"
        "53": "UPLOAD_GPS (hw)"
        "56": "SET_STANDBY_MODE"
        "57": "RESTORE_FACTORY_SETTINGS"
        "60": "SET_KEY_TIME_POINT (highlight)"
        "85": "SET_WIFI_SEIZE_ENABLE (field 1: 1 exclusive, 2 seizable)"
        "86": "REQUEST_AUTHORIZATION (hw)"
        "87": "CANCEL_REQUEST_AUTHORIZATION"
        "112": "SET_WIFI_CONNECTION_INFO"
        "113": "GET_WIFI_CONNECTION_INFO"
        "120": "SET_APP_ID"
        "125": "RESET_WIFI"
        "147": "SET_WIFI_MODE (field 1 placeholder 0, field 2 mode: 0 AP, 1 station, 2 P2P)"
        "148": "GET_WIFI_SCAN_LIST (field 1 interval s, field 2 count; results in notification 8249)"
        "149": "GET_CONNECTED_WIFI_LIST"
        "150": "GET_WIFI_MODE"
        "164": "PAUSE_RECORDING"
        "167": "NOTIFY_OTA_ERROR"
        "175": "DEL_WIFI_HISTORY_INFO"
    misattributed_codes:
      description: >-
        insta360ctl sends these codes for meanings the vendor table does not
        give them, from an earlier guess at the protocol. Some work on the
        GO 3; on a camera that follows the table they mean something else.
        Do not send them outside the model they were observed on.
      "0x0C": "Sent with a raw mode byte (0 photo, 1 video, 2 timelapse, 3 HDR, 4 bullet time) to set the capture mode; works on the GO 3. The vendor table names it DELETE_FILES."
      "0x10": "Sent as 'get storage info' (reply parsed as uint32 LE total MB, free MB, file count, formatted flag). The GO 3 answers 500. The vendor table names it SET_FILE_EXTRA."
      "0x12": "Sent as 'get battery' on non-GO models (reply parsed as level %, uint16 LE millivolts). Untested. The vendor table names it SET_TIMELAPSE_OPTIONS."
      "0x28": "Sent as 'get device info'. The vendor table names it CANCEL_AUTHORIZATION."
      "0x33": "Sent with one byte as 'set HDR'. The vendor table names it START_HDR_CAPTURE."
      "0x37": "Sent as 'power off'. The vendor table names it GET_SYNC_CAPTURE_MODE. Architecture A's power_off frame and the SDK's shutdown call (X5 and later) are the documented routes."
      "0x3D": "Sent as 'get camera state'. The vendor table names it START_TIMESHIFT_CAPTURE."
    go3_deviations:
      firmware: "v1.4.51 (insta360ctl)"
      notes:
        - "Code 25 returns battery level and charging state (declared as framed_get_battery_go3)."
        - "Code 16 returns 500; storage arrives only as notification 0x2010 with storage fields (payload_formats.Go3_Capture_Status)."
        - "Code 12 accepts a mode byte (see misattributed_codes)."
        - "Code 26 returns 200 for any body (no-op); code 27 returns 500."
        - "Notifications 0x2021, 0x2025 and 0x2026 carry battery, power and periodic status and are not in the vendor table; 0x2006 and 0x200A carry capture state and device info."
    go3_custom_service:
      notes: >-
        insta360ctl records a custom 128-bit service on the GO 3 with a
        write/notify/indicate characteristic beginning e3dd50bf, a write-only
        one beginning 92e86c7a and a read-only one beginning 347f7608. Only
        those prefixes are recorded, so the full UUIDs are unknown and nothing
        is declared.
    vendor_base_uuids:
      notes: >-
        Besides 0000d0ff-3c17-d293-8e48-14fe2e4da212 and
        000002fd-3c17-d293-8e48-14fe2e4da212, the vendor app's string pool carries
        00006287-3c17-d293-8e48-14fe2e4da212, 00006387-3c17-d293-8e48-14fe2e4da212,
        00006487-3c17-d293-8e48-14fe2e4da212, 00006587-3c17-d293-8e48-14fe2e4da212 and
        020002fd-3c17-d293-8e48-14fe2e4da212. Their roles are unknown.

  wifi_tcp:
    description: >-
      The secondary transport: the camera's own access point, or the user's
      network after the station-mode hand-off. One TCP connection to port
      6666 carries every command, reply, notification, keep-alive and the
      preview stream. Sources: Rigacci (ONE RS, reverse-engineered from app
      traffic, with a working client), insta360ctl (implemented, marked
      untested), the SDK FAQ (socket for preview and parameters, HTTP for
      the support list and file downloads).
    access_point:
      gateway_ip: "192.168.42.1"
      ssid: "'<model name> <6-character serial fragment>' with '.OSC' appended on Rigacci's ONE RS ('ONE RS XXXXXX.OSC'); insta360ctl's example is 'GO 3 XXXX'. The vendor app's strings include a pattern for six non-space characters followed by '.OSC'."
      passphrase: "88888888 on older firmware; random on some firmware (insta360ctl). Readable over BLE through the SDK and over TCP with GET_OPTIONS option 36."
      band: "5 GHz on the published examples (ONE RS channel 149; the GO 3 quick guide lists 802.11a/n/ac in UNII-1 and UNII-3). The SDK can move the AP to another channel and country code."
      client_address: "DHCP-assigned address on the camera's 192.168.42.0/24 network."
    framing:
      length_prefix: "Every packet starts with a uint32 little-endian length that INCLUDES the 4 prefix bytes."
      packet_types:
        "0x01": "stream (preview video, gyro, timing)"
        "0x04": "message (command, reply or notification)"
        "0x05": "keep-alive (07 00 00 00 05 00 00)"
        "0x06": "sync (11 00 00 00 06 00 00 'syNceNdinS')"
      type_bytes: "Byte 4 is the type; bytes 5-6 are 00 00."
    message_packet:
      layout: "uint32 LE total length | 04 00 00 | uint16 LE code | 02 | uint24 LE sequence | 80 | 00 00 | protobuf body"
      same_as_ble: "This is byte for byte the BLE inner packet (payload_formats.Inner_Header)."
      sequence: "Rigacci starts at 0, insta360ctl at 1; replies echo it. Notifications carry arbitrary values here (Rigacci saw ff 8a 43 with flag byte f4), so dispatch notifications by code."
      replies: "Status 200 or 500 in the code field; a 500 body is field 1 error code, field 2 message."
    session:
      - "Connect to <camera IP>:6666."
      - "Send the sync packet; the camera echoes it (insta360ctl waits up to 5 s). Rigacci sends a keep-alive and a SET_OPTIONS right behind it without waiting."
      - "Send a keep-alive whenever 2 s pass without sending; the camera drops a silent client after about 10 s."
      - "Commands, replies and notifications as message packets; stream packets arrive while a preview runs."
    stream_packet:
      layout: "uint32 LE total length | 01 00 00 | stream type (1 byte) | uint64 LE timestamp in microseconds | payload"
      stream_types:
        "0x20": "video: raw H.264 or H.265 NAL units (the SDK documents H.264 with SPS/PPS; insta360ctl's GO 3 example writes H.265)"
        "0x30": "gyro/IMU: 48-byte samples of six float64 LE (ax, ay, az, gx, gy, gz); units not recorded; out of scope beyond this line"
        "0x40": "timing sync, 32 bytes"
      start_live_stream: >-
        Code 1. Body fields (insta360ctl): 1 enable audio, 2 enable video,
        4 audio sample rate (Hz), 5 audio bitrate, 6 video bitrate (Rigacci and
        insta360ctl send 40; unit not stated), 7 resolution, 8 enable gyro,
        9 second-stream bitrate, 10 second-stream resolution, 11 number of
        preview streams (0 or 1), 12 enable rotate, 13 for external RTMP live.
        Resolution values: 9 = 1440x720 at 30 fps, 18 = 480x240 at 30 fps,
        29 = 1920x1080 at 30 fps, 34 = 424x240 at 15 fps. Rigacci's ONE RS
        preview: video on, bitrate 40, 29, gyro on, second stream 40 and 34,
        one preview stream.
      notes: >-
        The preview is not RTSP, MJPEG or HLS, so this spec has no `camera`
        block; a consumer needs this bespoke stream reader.
    http:
      notes: >-
        The SDK's HTTP prefix for the camera is http://192.168.42.1:80 (its
        documented example), used to initialise the X4-and-later "support
        list" (a JSON of modes and settings) and to download files. Paths are
        not documented here.
    other_ports:
      notes: >-
        The research note for this spec recorded ports 8080 and 9999 in the
        vendor app's strings, apparently disagreeing with 6666. A re-check of
        the string pool did not bear that out: 8080 appears only with a
        private-range development address and a third-party messaging SDK's
        host, 9999 appears in no port-like string, and the camera address
        appears as http://192.168.42.1:80 and as the bare prefix
        http://192.168.42.1: with a port appended at run time. Port numbers
        compiled as integers (6666 among them) are not visible in a string
        pool at all, so this settles nothing either way; no second camera
        port is known. Rigacci found no session on 7878, the port some
        Ambarella cameras use.
    station_mode_handoff:
      notes: >-
        SET_WIFI_CONNECTION_INFO (112) over BLE or TCP, result in notification
        8232 with the new IP; after a successful join the camera drops its AP
        and the old TCP connection. The same protocol then runs on the new
        address. insta360ctl marks the flow untested and warns that some
        models or firmware may not support it. SET_WIFI_SEIZE_ENABLE (85) sets
        whether the current Wi-Fi client holds the camera exclusively (1) or
        can be displaced (2).

  test_vectors:
    description: >-
      Frames computed from the algorithm above with the standard library
      only. Two cross-checks: the heartbeat reproduces the frame the vendor
      app carries, and the unknown FF 06 40 frame from the app has a valid
      CRC under the same algorithm. authorization_id is the documentation MAC
      00:00:5e:00:53:01; the SSID and passphrase are invented.
    framed_take_picture_seq1: "ff 07 40 10 00 10 00 00 00 04 00 00 03 00 02 01 00 00 80 00 00 6f ac"
    framed_start_capture_seq1: "ff 07 40 10 00 10 00 00 00 04 00 00 04 00 02 01 00 00 80 00 00 49 9c"
    framed_stop_capture_seq1: "ff 07 40 10 00 10 00 00 00 04 00 00 05 00 02 01 00 00 80 00 00 44 0c"
    framed_mark_highlight_seq1: "ff 07 40 10 00 10 00 00 00 04 00 00 3c 00 02 01 00 00 80 00 00 7a 5d"
    framed_sync_reply: "ff 07 41 07 00 00 00 00 00 00 00 00 5c 42"
    camera_sync_example: "ff 06 41 0a 00 ab ba ab ba ab ba ab ba ab ba 4e e2 (constructed: ten bytes of AB BA; the real length may differ)"
    framed_heartbeat: "ff 07 40 07 00 07 00 00 00 05 00 00 6b 46"
    check_authorization:
      body: "0a 11 30 30 3a 30 30 3a 35 65 3a 30 30 3a 35 33 3a 30 31 18 02  (field 1 '00:00:5e:00:53:01', field 3 = 2 app)"
      framed_seq1: "ff 07 40 25 00 25 00 00 00 04 00 00 27 00 02 01 00 00 80 00 00 0a 11 30 30 3a 30 30 3a 35 65 3a 30 30 3a 35 33 3a 30 31 18 02 36 69"
    request_authorization_pair:
      body: "08 01"
      framed_seq2: "ff 07 40 12 00 12 00 00 00 04 00 00 56 00 02 02 00 00 80 00 00 08 01 63 0f"
    set_wifi_connection_info:
      body: "0a 23 0a 0a 45 78 61 6d 70 6c 65 4e 65 74 1a 15 63 6f 72 72 65 63 74 20 68 6f 72 73 65 20 62 61 74 74 65 72 79  (ssid 'ExampleNet', passphrase 'correct horse battery')"
      framed_seq3: "ff 07 40 35 00 35 00 00 00 04 00 00 70 00 02 03 00 00 80 00 00 0a 23 0a 0a 45 78 61 6d 70 6c 65 4e 65 74 1a 15 63 6f 72 72 65 63 74 20 68 6f 72 73 65 20 62 61 74 74 65 72 79 88 b7"
      tcp_seq3: "35 00 00 00 04 00 00 70 00 02 03 00 00 80 00 00 0a 23 0a 0a 45 78 61 6d 70 6c 65 4e 65 74 1a 15 63 6f 72 72 65 63 74 20 68 6f 72 73 65 20 62 61 74 74 65 72 79"
    upload_gps:
      body: "13 61 c3 d3 2b bd 49 40 fa 7e 6a bc 74 93 58 bf 00 00 00 00 00 00 47 40  (51.4779, -0.0015, 46.0 as float64 LE)"
      framed_seq4: "ff 07 40 28 00 28 00 00 00 04 00 00 35 00 02 04 00 00 80 00 00 13 61 c3 d3 2b bd 49 40 fa 7e 6a bc 74 93 58 bf 00 00 00 00 00 00 47 40 0c 10"
      bare_seq4: "18 00 00 00 04 00 00 35 00 02 04 00 00 80 00 00 13 61 c3 d3 2b bd 49 40 fa 7e 6a bc 74 93 58 bf 00 00 00 00 00 00 47 40"
    bare_take_picture_seq1: "00 00 00 00 04 00 00 03 00 02 01 00 00 80 00 00"
    tcp_sync: "11 00 00 00 06 00 00 73 79 4e 63 65 4e 64 69 6e 53"
    tcp_keepalive: "07 00 00 00 05 00 00"
    tcp_take_picture_seq1: "10 00 00 00 04 00 00 03 00 02 01 00 00 80 00 00"
    tcp_get_options_wifi_info_seq5: "13 00 00 00 04 00 00 08 00 02 05 00 00 80 00 00 0a 01 24"
    wake_advertisement: "4c 00 02 15 09 4f 52 42 49 54 09 ff 0f 00 41 42 43 31 32 33 00 00 00 00 e4 01"

  conflicts_between_sources:
    x_one_ace_framing: "insta360ctl: bare 16-byte header, no sync or authorization, for every non-GO model (never run on hardware). Against it: the vendor packet convention puts the total length in bytes 0-3, and the official SDK (X and ONE models only) reports BLE sync-pack (4001) and shake-hand (2207) errors."
    authorization_status_numbering: "insta360ctl prose: 1 not authorized, 2 pending, 3 authorized, 4 expired, 5 denied. insta360ctl code (ran on a GO 3): 1 authorized, 2 not authorized, 3 pending, 4 denied, 5 expired."
    authorization_verdict: "insta360ctl prose: the verdict is notification 0x2011. insta360ctl code: it parses the direct reply to 0x56 as the verdict."
    notification_sequence: "insta360ctl: notifications use sequence 0 (TCP) or 255/unmatched (BLE). Rigacci: arbitrary bytes on TCP. Dispatch by code."
    remote_static_values: "Byte order of the 0000ce83-0000-1000-8000-00805f9b34fb, 0000ffd3-0000-1000-8000-00805f9b34fb and 0000ffd4-0000-1000-8000-00805f9b34fb values differs between pchwalek (little-endian stores) and insta360ctl (listed order)."
    remote_info_uuid_base: "The information characteristics 0000ffd1-0000-1000-8000-00805f9b34fb to 0000ffd4-0000-1000-8000-00805f9b34fb are on the Bluetooth base in pchwalek and the vendor app, and on the vendor base 3c17-d293-8e48-14fe2e4da212 in insta360ctl."
    wake_beacon_layout: "pchwalek and the vendor app agree; insta360ctl's layout differs."
    ui_summary_http_json: "An earlier research note guessed an HTTP/JSON control API over Wi-Fi. Every source shows protobuf over TCP 6666 for control, with HTTP only for the support list and file downloads."

  out_of_scope:
    - "USB mass-storage and UVC webcam modes."
    - "The .insv/.insp containers, gyro metadata and stitching."
    - "Firmware update mechanics and bytes (features declares only that updates exist)."
    - "The SDK's online activation beyond the credentials' role; no appId or secretKey is recorded."
    - "The root telnet shell reported on the AP (security_advisory only)."
    - "The GO line's charge case/Action Pod sub-protocol beyond its two notifications (0x2019, 0x201E)."
    - "Bluetooth Classic: the DSS grants (2AWWH-CINSAAJA, 2AWWH-CINSABXA) test BR/EDR modulations, so some cameras also carry a Classic radio (plausibly for headset audio); nothing here uses it."

evidence:
  open_source_review: >-
    xaionaro-go/insta360ctl at f94193ce (README, doc/protocol.md,
    doc/ble_protocol.md, doc/ble_services.md, doc/command_reference.md, and
    the Go sources for the model table, both header encoders, the envelope,
    the CRC, the direct-control session, the remote server and the wake
    beacon). Its CLI help marks photo, record, mode, status, battery, storage
    and GPS "tested: GO 3" and everything else "not tested, yet"; the
    Wi-Fi join and the preview stream are among the untested.
    pchwalek/insta360_ble_esp32 at 83d4748b (Insta_BLE.ino and its modified
    ESP32 advertising code): the GPS-remote GATT server, the four remote
    commands, and the wake advertisement, for an X3 and a ONE RS 1-inch.
    RigacciOrg/insta360-wifi-api at 89320e06 (insta360.py): TCP framing,
    sync and keep-alive timing, message header, error replies, commands used
    against a ONE RS. Its compiled pb2 modules were not transcribed.
  vendor_documentation_review: >-
    Insta360Develop/Android-SDK README at d2f910c8: supported models, BLE /
    Wi-Fi / USB connection types, "no large data over BLE", Wi-Fi info
    (SSID, passphrase, password version, channel, MAC), open/close/restart
    camera Wi-Fi, channel and country code, shutdown (X5 and later),
    activation with appId and secretKey and its error codes, connection and
    firmware-upgrade error codes, the FAQ on socket versus HTTP traffic and
    the H.264 preview format. Rigacci's rigacci.org write-up (last modified
    2023-09-08): AP passphrase, root telnet, port 6666, packet anatomy, a
    worked GET_OPTIONS reply, unsolved settings problems.
  app_static_analysis: >-
    com.arashivision.insta360akiko 2.33.0 (versionCode 506297). The base APK
    has one large dex whose bytecode is packed, so neither jadx nor apktool
    recovers code and nothing here comes from the app's logic. A strings
    pass over the dex found: 0000be80-0000-1000-8000-00805f9b34fb; 0000ce80-0000-1000-8000-00805f9b34fb
    to 0000ce83-0000-1000-8000-00805f9b34fb; 0000ffd0-0000-1000-8000-00805f9b34fb to
    0000ffd5-0000-1000-8000-00805f9b34fb; 0000ffd8-0000-1000-8000-00805f9b34fb;
    0000fff1-0000-1000-8000-00805f9b34fb; 0000fff2-0000-1000-8000-00805f9b34fb;
    0000ae00-0000-1000-8000-00805f9b34fb to 0000ae02-0000-1000-8000-00805f9b34fb;
    0000d0ff-3c17-d293-8e48-14fe2e4da212; 000002fd-3c17-d293-8e48-14fe2e4da212;
    020002fd-3c17-d293-8e48-14fe2e4da212; 00006287-3c17-d293-8e48-14fe2e4da212 to
    00006587-3c17-d293-8e48-14fe2e4da212 (four values); a scan filter string on
    0000be80-0000-1000-8000-00805f9b34fb; name
    prefixes including "X4 Air " and "Ace Pro 2 "; a '.OSC' SSID pattern;
    192.168.42.1, http://192.168.42.1:80 and the bare prefix
    http://192.168.42.1: (8080 appears only with unrelated hosts, 9999 not
    as a port);
    88888888; "syNceNdinS"; the wake-beacon bytes 094f5242495409ff0f00; and
    the complete frames ff07400700070000000500006b46 (heartbeat) and
    ff0640080008000000b00000016d90, whose CRC-16/MODBUS values both check.
    No 0000be81-0000-1000-8000-00805f9b34fb, 0000be82-0000-1000-8000-00805f9b34fb or 0000b000-0000-1000-8000-00805f9b34fb to 0000b004-0000-1000-8000-00805f9b34fb strings were found.
  fcc_review: >-
    fccid.co grants for grantee 2AWWH: ING2 (GO 2, 2021-03-03, DXX; label
    model CING2XX/A; user manual exhibit), CINSABKA (GO 3, 2023-06-26, NII;
    quick-guide exhibit naming model CINSABKA), CINSABXA (Insta360 X6,
    2026-07-03, DSS), and three "Camera" grants whose retail names the
    exhibits do not state: CINSAAJA (2023-11-19, DSS with BR/EDR
    modulations), CINSABMA (2024-04-11, DTS 2.4 GHz), CINSAATA (2024-06-12,
    NII 5.8 GHz). The CINSAAJA label exhibit says the regulatory e-label is
    under the camera's Settings > Certification. Internal photos were not
    read for chipsets.
  capture_review: "None. The research store holds no capture of any Insta360 camera."
  open_questions: >-
    See remaining_unknowns. The first things to settle with hardware: the
    X/ONE/Ace direct-control framing and whether they sync and authorize;
    the authorization status numbering; the camera-side steps to pair a
    GPS remote; and whether station mode works per model.
