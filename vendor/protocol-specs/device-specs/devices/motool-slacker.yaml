# MoTool Slacker device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# GATT UUIDs app-confirmed 2026-08 by static analysis of the vendor's
# "Service Assistant" Flutter app:
#   its string resources    (FFE0 service + FFE1 characteristic, hardcoded)
#   its manifest            (RevenueCat paywall SDK)
# Command construction is AOT-compiled Dart in the app's native snapshot;
# the snapshot's string table exposes the
# command-construction symbols (buildTravelHex, calculateTravel, hexBuilder,
# masterHexValue, writeMTBTravel, writeMTBMode, writeIntroMsgStatus) plus the
# 16-bit UUIDs 0000ffe0/0000ffe1. BLE stack confirmed as flutter_blue
# (pauldemarco): method-channel name "plugins.pauldemarco.com/flutter_blue/methods"
# and package:flutter_blue/* paths are in the same string table.
# Full research write-up kept locally (not committed).

device:
  name: "MoTool Slacker"
  manufacturer: "Slacker LLC (formerly MoTool)"
  manufacturer_status: "active"
  testing:
    status: untested
  protocol: "ble"
  category: "sensor"
  notes: >
    Motorcycle digital suspension sag measurement tool (V4/V5).
    Vendor is active: live Shopify store at getslacker.com, V5 user guide dated
    2025-07-26, and both apps updated April 2026. The company is now "Slacker
    LLC" (getslacker.com); the legacy motool.com domain is dead, though the app
    seller remains "Motool LLC".
    Uses the canonical HM-10/HM-19-style BLE UART module profile
    (CC2541/CC2640 based): service 0xFFE0 with a single serial pass-through
    characteristic 0xFFE1. APP-CONFIRMED, not hardware-tested: the app
    hardcodes both UUIDs as string resources (keys char_uuid_slacker_main /
    char_uuid_slacker_notify), the same 16-bit UUIDs appear in the Dart AOT
    snapshot, and FFE0 is the only service UUID referenced anywhere
    in the app's resources. No public GATT capture exists.
    The companion Flutter app has a "Virtual Remote"
    feature to trigger measurements from the phone. The standalone Slacker
    Virtual Remote app is 100% FREE with full basic control (Reset/Auto
    Zero/display); the subscription only gates Service Assistant cloud/notes
    features (Motool developer reply on the Play listing, 2025-06-22). The
    paywall SDK is RevenueCat, confirmed in the app manifest
    (paywall/customer-center activities).
    All BLE command construction is in AOT-compiled Dart,
    so exact command bytes require HCI snoop capture or AOT disassembly to
    confirm (see FLAG below).
    Known command LABELS from string analysis: "Reset", "Auto Zero", display mode change,
    and travel selection. Sag values are reported as mm or percentage of travel.
    V5 adds a percentage-of-travel display mode requiring fork/shock travel settings;
    the travel value syncs app→device at connect and is WIPED at power-off (the V5
    always boots in MM mode), so a replacement client must re-send travel each session.
    Firebase backend: motool-service-assistant.firebaseio.com (still live
    2026-08-18: /.json returns 401 "Permission denied"). The app's support links
    point at https://motool.co/pages/... which 301-redirects to getslacker.com.

    FLAG (unrecoverable from static analysis): the raw command BYTES sent over
    0xFFE1 are NOT statically readable — the Dart command-construction logic is
    AOT-compiled (no readable bytecode). This spec deliberately
    provides the service/characteristic UUIDs only and defines NO command byte
    sequences; they must be recovered, not inferred — do not invent opcodes.
    Static-recovery attempt (2026-08-18): the snapshot is fully
    position-independent (ELF .dynamic has
    no relocation entries), heap objects in .rodata are serialized clusters,
    and constants are referenced through the string table by index rather than
    by tagged pointer, so mapping object-pool slots to the command strings
    requires reimplementing the Dart cluster deserializer; existing tooling
    (blutter, Doldrums) targets ARM64 only, and this app ships armeabi-v7a
    only. What static analysis DOES establish about the write path: commands
    are assembled as HEX STRINGS (symbols buildTravelHex, hexBuilder,
    masterHexValue; debug logs "Hex Builder Travel Hex String Data" and
    "Wrote Travel Hex String Data"), decoded to bytes with the package:convert
    HexDecoder, and written to FFE1 through flutter_blue; device→app traffic
    arrives as FFE1 notifications parsed into deviceState / mtbMode /
    currentReadingInt (handlers _onReadingChanged/_onReadingChangedV5).
    Practical recovery route: a live HCI snoop log (btsnoop_hci.log) while
    driving the app's Virtual Remote. Evidence: the app's string resources
    (0000ffe0 x1, 0000ffe1 x5; one missed-call key uses an en-dash and is
    malformed in the vendor resources), its manifest (RevenueCat), and the
    Dart snapshot's string table (0000ffe0/0000ffe1 + the symbols above).
    CONFIDENCE: UUIDs APP-CONFIRMED (present both in the app's resources and
    in the AOT snapshot; not hardware-tested — no live capture);
    command bytes UNKNOWN (needs live capture).
  identification:
    service_uuids:
      - "0000ffe0-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "0000ffe0-0000-1000-8000-00805f9b34fb"
    identity:
      stable_keys: ["address"]
      display: "service_uuid"
    static_ip_required: false

  setup:
    required: false
    confidence: "low"
    notes: >
      No provisioning at the BLE layer. The vendor app gates features behind a
      subscription, but that is an app-side check rather than a device-side
      pairing step.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          No provisioning step: the device advertises as soon as it is powered
          on and accepts a connection from any central. There is no account, no
          network credential exchange and no pairing PIN, so a replacement
          client only has to scan, connect and write.
        ble:
          pairing_required: false
        steps:
          - action: "Power the device and scan for its advertisement."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect and run the documented initialization sequence, if the spec defines one."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        No credential state to clear. Power-cycling drops the current
        connection, which is the actual remedy for the common failure mode:
        the device already being connected to another central.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "Device advertises again and accepts a new connection."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds this device to a network or an owner, so switching
        controllers is just connecting from the new one. If the old client is
        an Android or iOS phone, remove the device from the OS Bluetooth list
        as well — a cached bond can keep the phone reconnecting automatically
        and holding the single available link.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        Anything within radio range can connect and issue commands. Physical
        proximity is the only access control.
  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
services:
  - uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
    name: "MoTool Slacker UART Service"
    notes: >
      Canonical HM-10/HM-19 serial pass-through profile; FFE0 is the only
      service UUID referenced anywhere in the app's resources
      (string resources) and AOT snapshot. App-side, FFE1 is exercised as
      notify + write: the app enables notifications on it (the CCCD
      00002902-0000-1000-8000-00805f9b34fb and a notify-state debug log
      appear in the snapshot) and writes commands to it (command-construction
      symbols writeMTBTravel / writeMTBMode / buildTravelHex / hexBuilder in
      the Dart snapshot). The device-side property list below is the
      HM-10-canonical
      set: read and write_without_response are inferred from the module
      profile, not observed from the app. The vendor resources also define
      FFE1 keys for missed-call/catch notifications, but these are
      VESTIGIAL: no code consumes them (the char_uuid_* keys are referenced
      only through generated resource IDs, the app declares no
      NotificationListenerService, and the Dart string table has no
      missed-call/catch symbols), so they are leftover resources, not evidence
      of a phone-alert feature. App-confirmed, not hardware-tested.
    characteristics:
      - uuid: "0000ffe1-0000-1000-8000-00805f9b34fb"
        name: "Serial Data"
        properties: ["read", "write", "write_without_response", "notify"]

entities:
  - platform: "sensor"
    name: "Suspension Sag"
    device_class: "distance"
    unit: "mm"
    state_characteristic: "0000ffe1-0000-1000-8000-00805f9b34fb"

helpful_urls:
  - title: "Motool: Slacker product page and documentation"
    url: "https://getslacker.com/products/slacker"
    kind: "vendor_support"
    description: >
      Vendor page; the full PDF user guide and video guides are distributed through Motool's own service app rather than as a public download.
