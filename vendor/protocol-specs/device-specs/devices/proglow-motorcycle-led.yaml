# ProGLOW / TTCBLE Motorcycle LED Controller device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "ProGLOW Motorcycle LED Controller"
  manufacturer: "ProGLOW / TTCBLE"
  manufacturer_status: "active"
  protocol: "ble"
  category: "light"
  notes: >
    Motorcycle ground-effect LED controller from com.ttcble.proglow static
    analysis (APK v4.7). Normal command sends are unencoded GATT writes to
    characteristic 0x1001. Packets start with header 0x3C; state/response
    parsing expects 0x4D — asynchronous 0x4D state packets arrive as
    notifications on 0x1002. No CRC/checksum was found in the normal command
    builder. FCC ID 2A55N-PG-BTBOX-1: STM32F103 MCU plus a Shengrun
    HY-40R201P BLE module (TI CC2541F256); Shengrun's public TTCBLEManager
    iOS SDK documents the same 0x1000/0x1001 GATT skeleton. The APK bundles an
    optional libhy_api.so traffic-obfuscation layer but the app disables it,
    so command/state traffic is plaintext. Firmware revision is read via DIS
    0x2A26 (observed "V3.3"); no public firmware downloads exist.
  identification:
    local_name_prefix: "Multi_LED"
    service_uuids:
      - "00001000-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "exact"
            value: "Multi_LED"
        notes: >
          The app scans unfiltered and matches the advertised name exactly
          ("Multi_LED"), then parses manufacturer-specific data: byte 6 =
          firmware version, byte 7 = device type, byte 8 = paired flag
          (1 = bound). Whether the device also advertises the 0x1000 service
          UUID is unproven, so name matching is the documented mechanism.
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      No network provisioning, but the controller expects a six-byte password
      command before it accepts lighting commands. The password is a RANDOM
      6-byte per-device secret the app generates at first pairing
      (Data.randomPassword(6)) and stores in its private DeviceDB — not a
      shared default. A wrong password gets a 4D 09 01 reply and the app
      disconnects ("password error"). The vendor limits pairing to one device
      at a time.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          The device advertises as soon as it is powered on and accepts a BLE
          connection without OS-level pairing or a PIN, but lighting commands
          are gated behind the per-device six-byte password (0x09) command —
          a replacement client must know or recover that password, and the
          device pairs to only one controller at a time (see factory_reset
          for moving it to a new phone).
        ble:
          pairing_required: false
        steps:
          - action: "Power the device and scan for its advertisement."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect and run the documented initialization sequence, if the spec defines one."
            actor: "client"
    factory_reset:
      confidence: "medium"
      effect: >
        Clears the controller's pairing state (the per-device password and
        the bound-phone flag advertised in manufacturer data byte 8) so it
        can be paired to a new phone.
      procedures:
        - name: "Blue-wire pairing reset (official)"
          steps:
            - action: "Disconnect the blue battery-monitor wire from the battery."
              actor: "user"
            - action: "Touch the blue battery-monitor wire on/off to the positive battery terminal 15 times."
              actor: "user"
              expect: "LED accessories start flashing and color-cycling; the controller is ready to be paired to a new phone."
        - name: "Power cycle"
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "Device advertises again and accepts a new connection."
              notes: "Only drops the BLE link — the remedy for the 'already connected to another phone' failure mode, not a pairing reset."
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: >
        The device holds pairing state: the per-device random password acts
        as a binding secret, advertisement manufacturer-data byte 8 carries a
        paired flag (and the app tracks isBindOther), and the vendor documents
        the blue-wire 15-touch reset as MANDATORY to pair a new phone.
        Power-cycling alone only drops the current link.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Per-device 6-byte BLE password (random, set at first pairing)"
        - "Paired/bound-phone state (advertised in mfr data byte 8)"
      issued_to_client: []
      notes: >
        The password is generated by the app and kept in its private database;
        without it the device answers 4D 09 01 and the connection is dropped.
        Pairing is limited to one controller at a time.
services:
  - uuid: "00001000-0000-1000-8000-00805f9b34fb"
    name: "ProGLOW BLE Service"
    characteristics:
      - uuid: "00001001-0000-1000-8000-00805f9b34fb"
        name: "Command Write"
        properties: ["write"]
        notes: "All observed ProGLOW commands target this characteristic and start with 0x3C."
        commands:
          password:
            description: "Send six-byte password"
            template: [0x3C, 0x09, "{password}"]
            parameters:
              password:
                type: "bytes"
          sync_time:
            description: "Sync device time and protection settings (12 bytes in the current app; 2023 V3.3-era on-wire captures show a 14-byte frame with 3 extra trailing bytes)"
            template: [0x3C, 0x00, "{second}", "{minute}", "{hour}", "{day}", "{month}", "{year_low}", "{year_high}", "{battery_protection}", "{brake_signal}", "{brake_override}"]
            parameters:
              second:
                type: "uint8"
                min: 0
                max: 59
              minute:
                type: "uint8"
                min: 0
                max: 59
              hour:
                type: "uint8"
                min: 0
                max: 23
              day:
                type: "uint8"
                min: 1
                max: 31
              month:
                type: "uint8"
                min: 1
                max: 12
              year_low:
                type: "uint8"
                min: 0
                max: 255
              year_high:
                type: "uint8"
                min: 0
                max: 255
              battery_protection:
                type: "uint8"
                min: 0
                max: 255
              brake_signal:
                type: "uint8"
                min: 0
                max: 255
              brake_override:
                type: "uint8"
                min: 0
                max: 255
          set_power:
            description: "Set on/off for a channel mask"
            template: [0x3C, 0x01, "{channel_mask}", "{on_off}"]
            channel_masks:
              channel_1: 0x01
              channel_2: 0x02
              channel_3: 0x04
              channel_4: 0x08
              all: 0x07
              all_2: 0x0F
            parameters:
              channel_mask:
                type: "uint8"
                min: 0
                max: 15
              on_off:
                type: "uint8"
                min: 0
                max: 1
          set_effect_mode:
            description: "Set effect mode"
            template: [0x3C, 0x02, "{mode}"]
            parameters:
              mode:
                type: "uint8"
                min: 0
                max: 255
          set_speed:
            description: "Set effect speed; app sends 6 - speed"
            template: [0x3C, 0x03, "{six_minus_speed}"]
            parameters:
              six_minus_speed:
                type: "uint8"
                min: 0
                max: 6
          set_brightness:
            description: "Set brightness"
            template: [0x3C, 0x04, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255
          set_home_multi_color:
            description: "Set home/multi-color mode; 20-byte packet with up to four RGB triples in first packet"
            template: [0x3C, 0x05, "{mode}", "{submode}", "{color_count}", "{channel_mask}", "{packet_index}", "{rgb_triples_padded}"]
            fixed_length: 20
            channel_masks:
              channel_1: 0x01
              channel_2: 0x02
              channel_3: 0x04
              channel_4: 0x08
              all: 0x07
            packet_layout:
              0: "0x3C header"
              1: "0x05 command"
              2: "mode"
              3: "submode"
              4: "color_count"
              5: "channel_mask"
              6: "packet_index"
              7: "RGB triples, up to four colors in first packet; additional colors use second 20-byte packet"
            parameters:
              mode:
                type: "uint8"
                min: 0
                max: 255
              submode:
                type: "uint8"
                min: 0
                max: 255
              color_count:
                type: "uint8"
                min: 1
                max: 8
              channel_mask:
                type: "uint8"
                min: 1
                max: 15
              packet_index:
                type: "uint8"
                min: 0
                max: 1
              rgb_triples_padded:
                type: "bytes"
      - uuid: "00001002-0000-1000-8000-00805f9b34fb"
        name: "State Notify"
        properties: ["read", "notify"]
        notes: >
          Asynchronous 0x4D state packets arrive as notifications here:
          BleService.enableNotification targets CHARACTERS[1] (=0x1002) and the
          on-wire capture shows the CCC write 0x1002/0x2902 = [01 00] followed
          by streaming 0x4D… packets.
      - uuid: "00001003-0000-1000-8000-00805f9b34fb"
        name: "Characteristic 3"
        properties: ["read", "notify"]
      - uuid: "00001004-0000-1000-8000-00805f9b34fb"
        name: "Read"
        properties: ["read", "notify"]
        notes: "Register-read response channel only (readReg writes a register index to 0x1005, then reads 0x1004); not the async state channel."
        format:
          - offset: 0
            length: 1
            name: "response_header"
            type: "uint8"
      - uuid: "00001005-0000-1000-8000-00805f9b34fb"
        name: "Register Write"
        properties: ["write"]

entities:
  - platform: "light"
    name: "ProGLOW LEDs"
    features: ["brightness", "color", "effect"]
    state_characteristic: "00001002-0000-1000-8000-00805f9b34fb"
    commands:
      turn_on: "set_power"
      turn_off: "set_power"
      set_brightness: "set_brightness"
      set_effect: "set_effect_mode"
      set_color: "set_home_multi_color"
