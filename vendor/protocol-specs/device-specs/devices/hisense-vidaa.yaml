  # Absolute volume. State is the broadcast volumechange topic — the TV
  # reports remote-pressed changes there too, so the number tracks the
  # physical remote for free.
  - platform: "number"
    name: "Volume"
    icon: "mdi:volume-high"
    min: 0
    max: 100
    step: 1
    state_topic: "/remoteapp/mobile/broadcast/platform_service/actions/volumechange"
    commands:
      set_value: "set_volume"
    notes: "State arrives as {\"volume_type\": 0, \"volume_value\": N}; read volume_value."

  # Input picker. The option table is fixed by the protocol (unlike Roku's
  # channel list, ids are a constant, so no options_source is needed — and
  # the dynamic half, which inputs the set actually has, is the sourcelist
  # action's JSON reply, which the XML/HTTP-shaped options_source contract
  # cannot express anyway).
  - platform: "select"
    name: "Input"
    icon: "mdi:video-input-hdmi"
    state_topic: "/remoteapp/mobile/broadcast/ui_service/state"
    state_mapping:
      options:
        "0": "TV"
        "1": "AV"
        "2": "Component"
        "3": "HDMI 1"
        "4": "HDMI 2"
        "5": "HDMI 3"
        "6": "HDMI 4"
    commands:
      select_option: "set_source"
    notes: >
      Current input: read statetype from the state topic — "sourceswitch"
      carries sourceid directly; "livetv" is the tuner (sourceid "0");
      anything else (remote_launcher, remote_setting) is an app or menu,
      i.e. no input selected. Filter the static option list against the
      sourcelist reply: a set with three HDMIs still accepts the ids, but
      only offers what sourcelist reported.

  # State surfaces, for a consumer that can subscribe. Not bound to
  # controls: the topic alone identifies the reading, per the state_topic
  # contract.
  - platform: "sensor"
    name: "TV State"
    state_topic: "/remoteapp/mobile/broadcast/ui_service/state"
    notes: "The statetype field (fake_sleep_0 = standby; fake_sleep_1 = waking, NOT asleep; remote_launcher = home; livetv/sourceswitch carry channel/source detail)."
