  # -- Parameterised commands.
  set_volume:
    description: "Set absolute volume, 0-100. The payload is the bare decimal level as a string, NOT JSON."
    transport: "mqtt"
    service: "platform_service"
    action: "changevolume"
    path: "/remoteapp/tv/platform_service/{client_id}/actions/changevolume"
    parameters:
      volume:
        type: "integer"
        required: true
        min: 0
        max: 100
        description: "Absolute volume level; rendered into the payload as the bare decimal string."
    example_body: "50"
    verification: "reported"
  set_source:
    description: "Switch input by numeric id. Ids are the fixed table 0 TV, 1 AV, 2 Component, 3-6 HDMI 1-4; sourcelist reports which of them the set actually has."
    transport: "mqtt"
    service: "ui_service"
    action: "changesource"
    path: "/remoteapp/tv/ui_service/{client_id}/actions/changesource"
    parameters:
      sourceid:
        type: "string"
        required: true
        enum: ["0", "1", "2", "3", "4", "5", "6"]
        description: "Input id as a decimal string."
    example_body: '{"sourceid": "3"}'
    verification: "reported"
  launch_app:
    description: >
      Launch an installed app. On VIDAA sets url is the short store name
      with urlType 37 (netflix, youtube, amazon, disneyplus, plex); on
      Android-TV-based sets url is the Android package name and urlType is
      0. Both forms, with names, come from the applist reply.
    transport: "mqtt"
    service: "ui_service"
    action: "launchapp"
    path: "/remoteapp/tv/ui_service/{client_id}/actions/launchapp"
    arguments:
      name: "{name}"
      url: "{url}"
      urlType: 37
      storeType: 0
    parameters:
      name:
        type: "string"
        required: true
        description: "Display name exactly as applist reports it, e.g. 'Netflix'."
      url:
        type: "string"
        required: true
        description: "VIDAA short name ('netflix') or Android package name ('com.netflix.ninja'); matches the urlType the set expects."
    example_body: '{"name": "Netflix", "urlType": 37, "storeType": 0, "url": "netflix"}'
    verification: "reported"

# The remote, as controls, in remote-layout order: power, navigation,
# volume, live TV, transport, digits, colour buttons, misc. These buttons
# are declarations for an MQTT-capable consumer — the reference app cannot
# execute any of them yet (remoteapp_common.transport_gap).
entities:
  # The stateful Power control (spec-evolution P13). KEY_POWER is a toggle
  # with no discrete pair, so a consumer must establish the state before
  # sending — the ui_service state broadcast is the reading (statetype
  # fake_sleep_0 = standby; anything else = awake enough to be sent the key).
  # The broker being down in standby means the toggle can in practice only
  # turn the set off, but the state gate stays: fake_sleep_1 is a waking set,
  # not an asleep one.
  - platform: "switch"
    name: "Power"
    icon: "mdi:power"
    commands:
      toggle: "press_power"
    state_topic: "/remoteapp/mobile/broadcast/ui_service/state"
    notes: >
      statetype fake_sleep_0 = standby (do not send); anything else the
      broker reports = on. Power-on from standby is Wake-on-LAN — the broker
      is down while off.
  - platform: "button"
    name: "Power"
    icon: "mdi:power"
    commands:
      press: "press_power"
    notes: "Toggle. Turning the TV ON from standby is Wake-on-LAN, not this button — the broker is down while off."
  - platform: "button"
    name: "Up"
    icon: "mdi:chevron-up"
    commands:
      press: "press_up"
  - platform: "button"
    name: "Left"
    icon: "mdi:chevron-left"
    commands:
      press: "press_left"
  - platform: "button"
    name: "OK"
    commands:
      press: "press_ok"
  - platform: "button"
    name: "Right"
    icon: "mdi:chevron-right"
    commands:
      press: "press_right"
  - platform: "button"
    name: "Down"
    icon: "mdi:chevron-down"
    commands:
      press: "press_down"
  - platform: "button"
    name: "Back"
    icon: "mdi:arrow-u-left-top"
    commands:
      press: "press_back"
  - platform: "button"
    name: "Home"
    icon: "mdi:home"
    commands:
      press: "press_home"
  - platform: "button"
    name: "Menu"
    icon: "mdi:menu"
    commands:
      press: "press_menu"
  - platform: "button"
    name: "Exit"
    icon: "mdi:exit-to-app"
    commands:
      press: "press_exit"
  - platform: "button"
    name: "Volume Up"
    icon: "mdi:volume-plus"
    commands:
      press: "press_volume_up"
  - platform: "button"
    name: "Mute"
    icon: "mdi:volume-mute"
    commands:
      press: "press_mute"
