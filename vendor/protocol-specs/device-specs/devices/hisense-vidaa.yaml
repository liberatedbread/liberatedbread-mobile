    action: "sendkey"
    path: "/remoteapp/tv/remote_service/{client_id}/actions/sendkey"
    example_body: "KEY_RIGHT"
    verification: "reported"
  press_ok:
    description: "OK — select the focused item."
    transport: "mqtt"
    service: "remote_service"
    action: "sendkey"
    path: "/remoteapp/tv/remote_service/{client_id}/actions/sendkey"
    example_body: "KEY_OK"
    verification: "reported"
  press_back:
    description: "Back one screen. The wire spelling is KEY_RETURNS."
    transport: "mqtt"
    service: "remote_service"
    action: "sendkey"
    path: "/remoteapp/tv/remote_service/{client_id}/actions/sendkey"
    example_body: "KEY_RETURNS"
    verification: "reported"
  press_home:
    description: "Home screen."
    transport: "mqtt"
    service: "remote_service"
    action: "sendkey"
    path: "/remoteapp/tv/remote_service/{client_id}/actions/sendkey"
    example_body: "KEY_HOME"
