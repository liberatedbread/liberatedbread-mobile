# Example Device Spec: Smart Bulb
# This is a reference example showing the device spec format.
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Example Smart Bulb"
  manufacturer: "Acme Corp"
  manufacturer_status: "abandoned"  # abandoned | shutdown | unsupported
  testing:
    status: untested  # untested | verified; has THIS PROJECT driven hardware from this spec?
    # Optional detail: capture-verified (with untested); minimally-verified |
    # mostly-verified (with verified). Anything above bare untested needs
    # `notes` naming the evidence.
  protocol: "ble"
  category: "light"
  notes: "This is an example spec for documentation purposes."
  identification:
    local_name_prefix: "ACME_"
    service_uuids:
      - "0000fff0-0000-1000-8000-00805f9b34fb"

helpful_urls:
  - title: "Example teardown notes"
    url: "https://example.com/example-smart-bulb-teardown"
    description: "Shows the board revision and radio module markings used to identify this family."

helpful_videos:
  - title: "Example setup walkthrough"
    url: "https://video.example.com/watch/example-smart-bulb-setup"
    description: "Demonstrates the pairing flow and the BLE capture points."

services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "Control Service"
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: "Command"
        properties: ["write"]
        commands:
          power_on:
            description: "Turn the bulb on"
            value: [0x01, 0x01]
          power_off:
            description: "Turn the bulb off"
            value: [0x01, 0x00]
          set_brightness:
            description: "Set brightness (0-100)"
            template: [0x02, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 100
                # Number semantics: what the raw value MEANS. Here raw == %
                # directly; a scaled value would add scale/value_offset, and a
                # temperature would state unit "C" or "F" (or
                # unit_source: device_setting when the device decides).
                unit: "%"
                description: "Brightness as a percentage; raw value is the percentage itself."
          set_color:
            description: "Set RGB color"
            template: [0x03, "{red}", "{green}", "{blue}"]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255

      - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
        name: "Status"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 1
            name: "power_state"
            type: "bool"
          - offset: 1
            length: 1
            name: "brightness"
            type: "uint8"
          - offset: 2
            length: 1
            name: "red"
            type: "uint8"
          - offset: 3
            length: 1
            name: "green"
            type: "uint8"
          - offset: 4
            length: 1
            name: "blue"
            type: "uint8"

  - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
    name: "Battery Service"
    characteristics:
      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "Battery Level"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 1
            name: "battery_percent"
            type: "uint8"

entities:
  - platform: "light"
    name: "Bulb"
    features: ["brightness", "color"]
    state_characteristic: "0000fff2-0000-1000-8000-00805f9b34fb"
    state_mapping:
      is_on: "power_state"
      brightness: "brightness"
      color_rgb:
        red: "red"
        green: "green"
        blue: "blue"
    commands:
      turn_on: "power_on"
      turn_off: "power_off"
      set_brightness: "set_brightness"
      set_color: "set_color"

  - platform: "sensor"
    name: "Battery"
    device_class: "battery"
    unit: "%"
    state_characteristic: "00002a19-0000-1000-8000-00805f9b34fb"
    state_mapping:
      value: "battery_percent"
