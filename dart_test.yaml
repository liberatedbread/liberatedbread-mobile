# NOTE: there is deliberately no top-level `exclude_tags: netdisco` here, even
# though it would make a bare `flutter test` safe. `exclude_tags` in this file
# also beats an explicit `--tags=netdisco` on the command line (exclusion wins
# in package:test), and the escape hatch for that — a preset, `-P netdisco` —
# is not forwarded by `flutter test`, which accepts only `--tags` and
# `--exclude-tags`. Setting it would therefore leave
# `scripts/ci-netdisco-tests.sh` with no way to run the suites it exists to
# run. The exclusion lives in `./scripts/test.sh` and CI instead; CONTRIBUTING
# says so where it tells you which command to use.

tags:
  e2e: {}
  # Local-network discovery against emulated devices on the real multicast
  # groups. Declared here so `flutter test` does not warn about an unknown tag;
  # excluded from the ordinary runs and opted into by
  # scripts/ci-netdisco-tests.sh, which explains why.
  netdisco: {}
  # Smoke tests against REAL hardware over the machine's own BlueZ stack.
  # Doubly guarded: the tag keeps them out of `--exclude-tags` runs, and each
  # test also skips itself unless LB_LIVE_BLE=1, so even a bare `flutter test`
  # on a developer machine cannot start writing to whatever is advertising
  # nearby. Run deliberately, with the device you mean to poke in view.
  live_ble: {}
  # Programming a REAL radio, over its own Bluetooth or a USB cable. Guarded
  # the same way as live_ble -- the tag, plus a self-skip unless
  # LB_LIVE_RADIO=1 -- and the guard matters more here than anywhere else in
  # this file: these tests do not read a sensor, they overwrite a radio's
  # memory. A bare `flutter test` on a developer machine must never be able
  # to start one.
  live_radio: {}
  # The Wi-Fi counterpart: smoke tests against a REAL device on the LAN, over
  # the machine's own network stack. Guarded the same way — the tag, plus a
  # self-skip unless LB_LIVE_ROKU=1 — so a bare `flutter test` on a developer
  # machine cannot start pressing buttons on whatever TV is in earshot. Run
  # deliberately, with the device you mean to drive in view.
  live_wifi: {}
  # integration_test/device_hardware_test.dart: the shipping services against
  # a PHYSICAL phone's radio, Wi-Fi and keychain. Kept out of the CI aggregate
  # and the Linux per-file loop by this tag, and every test in it also skips
  # itself unless the build carries --dart-define=LB_HARDWARE=true, so nothing
  # runs on a Simulator by accident. scripts/run-ios-device-tests.sh runs it.
  hardware: {}
