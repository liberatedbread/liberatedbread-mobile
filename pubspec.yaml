name: liberated_bread_mobile
description: >
  A BLE companion app for Liberated Bread - keeping your IoT devices alive
  and talking, one Bluetooth packet at a time.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: 1.35.4
  flutter_rust_bridge: 2.9.0
  flutter_riverpod: ^2.4.0
  flutter_secure_storage: ^9.2.0
  http: ^1.2.0
  path_provider: ^2.1.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  liberated_bread_core:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/device_specs/
    # IEEE address blocks and Bluetooth SIG assigned numbers, vendored from the
    # protocol-specs repo. ~1.7MB of sorted TSV that compresses to a few hundred
    # KB in the bundle; it is what lets an anonymous device be named at all.
    - assets/registries/
