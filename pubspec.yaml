name: liberated_bread_mobile
description: >
  A BLE companion app for Liberated Bread - keeping your IoT devices alive
  and talking, one Bluetooth packet at a time.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: 1.35.4
  flutter_rust_bridge: 2.9.0
  flutter_riverpod: ^2.4.0
  flutter_secure_storage: ^9.2.0
  http: ^1.2.0
  path_provider: ^2.1.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  liberated_bread_core:
    path: rust_builder
  multicast_dns: ^0.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/device_specs/
    # Bundled straight out of the subtree rather than copied into assets/.
    #
    # assets/device_specs/ exists because vendoring it is a real transform: two
    # upstream directories flattened into one, with a rewritten manifest. The
    # registries need none of that -- they are already flat and already exactly
    # the shape NumberRegistry reads -- so a copy under assets/ would be 1.7MB
    # of byte-identical duplication in the tree, and a second thing to go stale.
    #
    # Listed file by file rather than as a directory so SOURCES.md, which is
    # documentation for people reading the repo, does not ship inside the app.
    - vendor/protocol-specs/registries/ieee-oui.tsv
    - vendor/protocol-specs/registries/ieee-oui28.tsv
    - vendor/protocol-specs/registries/ieee-oui36.tsv
    - vendor/protocol-specs/registries/bluetooth-company-ids.tsv
    - vendor/protocol-specs/registries/bluetooth-service-uuids.tsv
