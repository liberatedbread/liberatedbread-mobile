name: liberated_bread_mobile
description: >
  A BLE companion app for Liberated Bread - keeping your IoT devices alive
  and talking, one Bluetooth packet at a time.
publish_to: 'none'
version: 0.1.0+1

environment:
  # What pubspec.lock and the pinned Flutter 3.44.8 already demand. This is
  # also the package's LANGUAGE version: below 3.7 the lints flutter_lints 6
  # adds were no-ops and `dart format` used the pre-3.7 style. Raising it
  # reformatted every Dart file in the repository, once, in the commit that
  # made this change.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # 1.36.8 is the LAST BSD-3 release: 2.x is a commercial "FlutterBluePlus
  # License" with build-time telemetry, so the ceiling here is a licence
  # boundary, not caution. Exact, because the federated interface below has
  # to match it exactly.
  flutter_blue_plus: 1.36.8
  flutter_rust_bridge: 2.9.0
  flutter_riverpod: ^2.4.0
  flutter_secure_storage: ^9.2.0
  http: ^1.2.0
  # sha256 for the hub TLS trust-on-first-use pin (hub_http_client.dart) and
  # for the ECP2 signed-session handshake (ecp2_control_service.dart).
  crypto: ^3.0.7
  # A test-advanceable clock: hue_pairing_service.dart reads its pairing
  # deadline off clock.now() so widget tests cross the window with pump(),
  # while production stays on DateTime.now(). Already transitive via fake_async.
  clock: ^1.1.1
  path_provider: ^2.1.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  # SOAP/UPnP control of network devices (Wemo): parsing setup.xml and SOAP
  # response envelopes. Already in the tree as a transitive dependency; listed
  # here because lib/ imports it directly.
  xml: ^7.0.1
  liberated_bread_core:
    path: rust_builder
  multicast_dns: ^0.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: fake time for the polled Roomba adapters, whose rule is about
  # what a `Timer.periodic` does when the server answers slower than the
  # interval — real-time waiting would make that a ten-second test. Already
  # transitive via flutter_test; declared because depending on a transitive
  # is how an upstream change breaks a suite for no visible reason.
  fake_async: ^1.3.1
  # Test-only: the live-hardware smoke (test/live/) registers the Linux BlueZ
  # backend by hand, because a test VM has no app startup to do it. Pinned to
  # the exact version flutter_blue_plus 1.35.4 resolves anyway, so this adds
  # no new code — it only makes the transitive dependency importable.
  flutter_blue_plus_linux: 7.0.3
  # Test-only, and pinned exactly like flutter_blue_plus above because it is
  # that package's own federated interface — the two move together and a
  # mismatch is a compile error, not a warning.
  #
  # test/fakes/emulated_ble.dart implements FlutterBluePlusPlatform to stand a
  # virtual BLE controller up in-process, which is what lets RealBleService be
  # tested against the real flutter_blue_plus code with no radio. That interface
  # is NOT re-exported by package:flutter_blue_plus (it exports only
  # DeviceIdentifier, Guid, LogLevel and PhySupport), so it has to be depended
  # on directly rather than reached through the transitive dependency.
  flutter_blue_plus_platform_interface: 7.0.0

flutter:
  # Plugins link through CocoaPods on Apple platforms, not Swift Package
  # Manager. This lives HERE, in the project, rather than in a
  # `flutter config --no-enable-swift-package-manager` on one CI runner,
  # because a machine-global setting is per-machine: the ios-build job set it,
  # the ios-adhoc workflow that produces the installable IPA did not, and a
  # developer Mac has SPM on by default (enabledByDefault on stable). So the
  # linking configuration CI tested was never the one that reached a phone —
  # four plugins (flutter_blue_plus_darwin, permission_handler_apple,
  # shared_preferences_foundation, url_launcher_ios) resolved through SPM
  # there and CocoaPods here.
  #
  # That split is not cosmetic. permission_handler_apple's Package.swift
  # defines PERMISSION_BLUETOOTH=1 when Info.plist carries a Bluetooth usage
  # string, while its podspec leaves the macro at 0 unless the Podfile's
  # post_install adds it — so the same source builds a working Bluetooth
  # permission strategy under SPM and a compiled-out one under CocoaPods.
  # ios/Podfile's post_install comment is the record of that hazard.
  #
  # flutter_tools resolves this key before the global config and before
  # FLUTTER_SWIFT_PACKAGE_MANAGER (flutter_features_config.dart: project level
  # ?? global config, then the environment), so one line here governs every
  # invocation on every machine. Two of the app's own plugins
  # (flutter_secure_storage, and rust_builder/liberated_bread_core, which is a
  # cargokit podspec with no Package.swift) have no SPM support anyway, which
  # is what the "do not support Swift Package Manager" warning on every build
  # is telling us. Revisit when the Rust pod grows a Package.swift.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    # Everything ships straight out of the vendored protocol-specs subtree.
    # There is no copy under assets/: the subtree is the single source of truth,
    # so there is nothing to keep in step and nothing to go stale.
    #
    # index.json by name, not its directory: the directory entry also shipped
    # schema.json (330 KB) and README.md (37 KB), which nothing in the app
    # reads — five percent of the vendored payload, enumerated in the asset
    # manifest on every launch. The locally-rebuilt, gitignored index-temp.json
    # (see device_spec_provider's specManifestTempPath) lives under examples/
    # for exactly this reason: a directory entry is the only way an asset that
    # may or may not exist can ride along, and examples/ is a directory that
    # ships anyway.
    - vendor/protocol-specs/device-specs/index.json
    - vendor/protocol-specs/device-specs/devices/
    - vendor/protocol-specs/device-specs/examples/
    # Registries listed file by file rather than as a directory so SOURCES.md,
    # which is documentation for people reading the repo, does not ship inside
    # the app.
    - vendor/protocol-specs/registries/ieee-oui.tsv
    - vendor/protocol-specs/registries/ieee-oui28.tsv
    - vendor/protocol-specs/registries/ieee-oui36.tsv
    - vendor/protocol-specs/registries/bluetooth-company-ids.tsv
    - vendor/protocol-specs/registries/bluetooth-service-uuids.tsv
