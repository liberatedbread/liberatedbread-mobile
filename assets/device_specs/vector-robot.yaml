device:
  name: "Vector Robot"
  manufacturer: "Anki / Digital Dream Labs"
  manufacturer_status: "shutdown"
  protocol: "wifi"
  notes: >
    Desktop companion robot with primary local control over WiFi using gRPC and
    protobuf 3 over TLS on port 443. Discovery uses mDNS service
    _ankivector._tcp.local. Connections require robot certificate pinning and a
    GUID bearer token obtained during onboarding. BLE onboarding uses Anki RTS
    protocol with CLAD serialization and libsodium encryption (crypto_kx +
    XChaCha20-Poly1305). The anki_vector Python SDK is available under
    Apache 2.0 and documents the ExternalInterface service. DDL is widely
    reported defunct since ~2023 and all official OTA/firmware servers fail
    DNS (tested 2026-07-31), so robots can no longer pull official OTAs; the
    anki.bot support portal remains online and still sells Vector AI
    subscriptions ($11.99/mo or $99.99/yr per robot, verified 2026-08-04 via
    anki.bot and support.anki.bot article 344). Latest official firmware is
    2.0.1.6076 (Vector 2.0 + Gen 1, 2022-09-26); 1.8.1.6051 was the last
    Gen-1 production build. The dominant community path is wire-pod
    (kercre123/wire-pod, MIT, 778 stars at verification 2026-08-04), a full
    local voice server built on DDL's open-sourced vector-cloud that restores
    voice commands on production Vector 1.0/2.0 robots with no DDL
    subscription; production robots take a recovery-mode detour (Web
    Bluetooth flash of DDL's production-signed Escape-Pod-compatible "ep"
    firmware, then a user-data reset, then local authentication). Packaged
    installers ship from the separate kercre123/WirePod releases repo
    (v1.2.18, 2026-05-10: Windows .exe, macOS .dmg, Debian/Ubuntu .deb for
    amd64/arm64/armhf, Android .apk). For unlocked (OSKR/dev) robots, WireOS
    (os-vector/wire-os, 3.0.1.32 at verification time) is the fully open
    firmware option. DDL open-sourced vector-cloud (MIT) and
    vector-bluetooth before disappearing. In September 2024 the Pennsylvania
    AG sued DDL and its CEO over more than $4M in unfulfilled robot orders
    (~14,000 orders Nov 2020-Jan 2024; allegations, not adjudicated). The
    original companion app (com.anki.victor) is no longer fetchable: APKPure
    lists the package id with zero downloadable versions, and APKMirror and
    APKCombo have no copy (checked 2026-08-04) — the Web Bluetooth setup
    pages are the practical onboarding route now.
  identification:
    mdns_service_type: "_ankivector._tcp.local."
    default_port: 443

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_ankivector._tcp.local."
          port: 443
          txt_record_keys: ["serial"]
          identity_mapping:
            stable_keys:
              - source: "txt:serial"
              - source: "hostname"
            display:
              source: "name"
    identity:
      stable_keys: ["serial", "hostname"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "high"
    notes: >
      Vector is the best-documented onboarding flow in this repository because
      the BLE provisioning protocol (RTS) is published under Apache 2.0. WiFi
      credentials never touch a vendor server: they travel over an encrypted
      BLE channel established by a Curve25519 exchange, with a PIN shown on the
      robot's own screen as the proof of physical possession. Only the last
      step — trading a session token for the control GUID — has a cloud
      dependency, and wire-pod replaces it.
    methods:
      - type: "ble_provisioning"
        verified: false
        description: >
          Anki RTS over BLE: handshake, PIN confirmation, WiFi scan, credential
          push, then certificate/GUID retrieval. Versions 2 through 5 of the
          protocol all carry the same WiFi messages.
        ble:
          advertised_name: "Vector-XXXX"
          protocol: "Anki RTS (CLAD over BLE, XChaCha20-Poly1305 after handshake)"
          write_characteristic: "30619f2d-0f54-41bd-a65a-7588d8c85b45"
          read_characteristic: "7d2a4bda-d29b-4152-b725-2491478c5cd7"
          pairing_required: true
          pin_source: "Six-digit PIN rendered on the robot's face display during pairing mode."
        steps:
          - action: "Place the robot on its charger and double-click the backpack button to enter pairing mode."
            actor: "user"
            expect: "Robot advertises as Vector-XXXX and shows a PIN on its screen."
          - action: "Connect and complete the RTS handshake (RtsConnRequest / RtsConnResponse / RtsNonceMessage / RtsChallengeMessage)."
            actor: "client"
            request:
              protocol: "ble_gatt"
              service: "Anki RTS"
              action: "RtsConnRequest"
            expect: "RtsChallengeSuccessMessage; all later traffic is XChaCha20-Poly1305 encrypted."
          - action: "Request a WiFi scan and present the results to the user."
            actor: "client"
            request:
              protocol: "ble_gatt"
              service: "Anki RTS"
              action: "RtsWifiScanRequest"
            expect: "RtsWifiScanResponse listing SSID, signal, auth type, hidden and provisioned flags."
            timeout_seconds: 30
          - action: "Send the selected network's credentials."
            actor: "client"
            request:
              protocol: "ble_gatt"
              service: "Anki RTS"
              action: "RtsWifiConnectRequest"
              arguments:
                - name: "wifi_ssid_hex"
                  type: "string"
                  required: true
                  description: "SSID hex-encoded, not raw text — the field carries the hex string itself."
                - name: "password"
                  type: "string"
                  required: true
                  description: "Passphrase in the clear inside the already-encrypted BLE channel."
                - name: "timeout"
                  type: "uint8"
                  required: true
                  description: "Seconds the robot should spend attempting the join before reporting failure."
                - name: "auth_type"
                  type: "uint8"
                  required: true
                - name: "hidden"
                  type: "bool"
                  required: true
                  description: "Set when joining a hidden (non-broadcast) SSID."
            expect: "RtsWifiConnectResponse carrying the resulting WiFi state and connect result."
            timeout_seconds: 60
          - action: "Read back the assigned address to confirm the join."
            actor: "client"
            request:
              protocol: "ble_gatt"
              service: "Anki RTS"
              action: "RtsWifiIpRequest"
            expect: "RtsWifiIpResponse with an IPv4 address; the robot now answers _ankivector._tcp.local."
          - action: "Exchange a session token for the long-lived control GUID."
            actor: "client"
            request:
              protocol: "ble_gatt"
              service: "Anki RTS"
              action: "RtsCloudSessionRequest"
            expect: "client_token_guid returned; store it with the robot's certificate for gRPC sessions."
            notes: "Only cloud-dependent step. wire-pod issues the token locally instead."
    factory_reset:
      confidence: "high"
      effect: >
        Clear User Data wipes WiFi credentials, the owner/account association,
        enrolled faces and the issued client GUID. The ESN (serial) is
        hardware identity and survives, so the mDNS name and BLE advertisement
        stay the same. Do not confuse the two button procedures: holding the
        backpack button ~15 s boots Firmware Recovery Mode (factory firmware,
        shows anki.com/v, KEEPS user data), while Clear User Data is a
        separate menu path (DDL support articles 383 and 384).
      procedures:
        - name: "Clear User Data menu (double-click backpack button)"
          indicator: "Diagnostics menu appears; after confirming Clear User Data the robot reboots into onboarding (ddl.io/v setup screen)."
          steps:
            - action: "Place the robot on the charger."
              actor: "user"
            - action: "Double-click the backpack button to open the diagnostics menu."
              actor: "user"
            - action: "Navigate the menu with the lift and treads to Clear User Data and confirm."
              actor: "user"
            - action: "Wait for the reboot; the robot returns to BLE pairing mode."
              actor: "device"
              timeout_seconds: 180
        - name: "Firmware Recovery Mode (recovery only, keeps user data)"
          hold_seconds: 15
          indicator: "Screen shows anki.com/v; robot boots the factory recovery firmware without deleting user data."
          steps:
            - action: "Place the robot on the charger."
              actor: "user"
            - action: "Press and hold the backpack button for about 15 seconds until the recovery screen appears."
              actor: "user"
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Moving Vector to a new network never needs a factory reset. Re-enter
        BLE pairing mode and send a fresh RtsWifiConnectRequest;
        RtsWifiForgetRequest drops one stored network or all of them. Because
        BLE works regardless of WiFi state, the robot is recoverable even after
        the old network is gone — the failure mode that strands most WiFi-only
        devices.
      steps:
        - action: "Enter BLE pairing mode and complete the RTS handshake."
          actor: "user"
        - action: "Optionally clear stale networks with RtsWifiForgetRequest."
          actor: "client"
          request:
            protocol: "ble_gatt"
            service: "Anki RTS"
            action: "RtsWifiForgetRequest"
        - action: "Send RtsWifiConnectRequest for the new network."
          actor: "client"
    credentials:
      wifi_passphrase_protection: "device_encrypted"
      stored_on_device:
        - "WiFi credentials for each provisioned network"
        - "Owner/account association"
      issued_to_client:
        - "Robot self-signed TLS certificate (pin it)"
        - "client_token_guid bearer token for gRPC"
      notes: >
        The passphrase is sent as plaintext inside the encrypted BLE session,
        so confidentiality depends on the handshake having been completed with
        the on-screen PIN rather than on the field itself.

protocols:
  wifi_grpc:
    service: "ExternalInterface"
    port: 443
    transport: "HTTP/2 over TLS"
    serialization: "protobuf 3"
    authentication:
      tls: "robot self-signed certificate pinning"
      bearer: "client_token_guid"
    rpc_count: 69
    key_state_rpcs:
      - "BatteryState"
      - "VersionState"
  rest_gateway:
    base_path: "/v1"
    description: >
      gRPC-gateway JSON endpoints for many unary RPCs (49 google.api.http
      annotations in the proto). SetCubeLights and SetMasterVolume carry no
      HTTP annotation and are gRPC-only, so they are absent from the list
      below; the four annotated streaming endpoints
      (/v1/assume_behavior_control, /v1/audio_feed, /v1/camera_feed,
      /v1/nav_map_feed) also exist but are omitted here.
  ble_onboarding:
    name: "RTS"
    serialization: "CLAD"
    encryption: "libsodium crypto_kx (Curve25519) key exchange, PIN mixed into session keys via crypto_generichash, crypto_aead_xchacha20poly1305_ietf (XChaCha20-Poly1305) session cipher"
    read_characteristic: "7d2a4bda-d29b-4152-b725-2491478c5cd7"
    write_characteristic: "30619f2d-0f54-41bd-a65a-7588d8c85b45"
  sdk:
    name: "anki_vector Python"
    license: "Apache-2.0"
    url: "https://github.com/anki/vector-python-sdk"

helpful_urls:
  - title: "WireOS"
    url: "https://github.com/os-vector/wire-os"
    description: "Actively maintained open firmware for unlocked (OSKR/dev) robots; 3.0.1.32 at verification time. The only fully supported path now that official OTA servers are dead."
  - title: "wire-pod"
    url: "https://github.com/kercre123/wire-pod"
    description: "MIT-licensed local voice server (chipper/TMS/jdocs replacement) built on DDL's open-sourced vector-cloud. Restores voice commands on production Vector 1.0/2.0 with no DDL subscription and issues the onboarding GUID/token locally. 778 stars at verification 2026-08-04."
  - title: "wire-pod installation wiki"
    url: "https://github.com/kercre123/wire-pod/wiki/Installation"
    description: "The production-bot flow: recovery mode (hold backpack button ~15 s), Web Bluetooth pairing in Chrome at wpsetup.keriganc.com, flash of DDL's production-signed Escape-Pod-compatible 'ep' firmware (no Escape Pod purchase needed), clear user data, then authenticate against the local wire-pod instance."
  - title: "WirePod releases (packaged installers)"
    url: "https://github.com/kercre123/WirePod/releases"
    description: "Separate releases repo shipping v1.2.18 (2026-05-10): WirePodInstaller .exe for Windows, .dmg for macOS 11+, .deb for amd64/arm64/armhf Debian/Ubuntu, .apk for Android. Installers are unsigned: SmartScreen, unidentified-developer, unknown-sources and Play Protect warnings are expected."
  - title: "vector-wirepod-setup web page"
    url: "https://wpsetup.keriganc.com/"
    description: "Chrome/Chromium Web Bluetooth page that serves both recovery-mode firmware flashes and robot authentication. The Escape-Pod-compatible 'ep' firmware it applies is a DDL production-signed OTA delivered through this page, not a separately distributed image."
  - title: "DDL vector-cloud"
    url: "https://github.com/digital-dream-labs/vector-cloud"
    description: "DDL's MIT-licensed robot cloud/gateway server, open-sourced alongside vector-bluetooth before the company went dark."
  - title: "DDL support portal"
    url: "https://support.anki.bot/"
    description: "Still online; articles 383/384 document Firmware Recovery Mode vs Clear User Data, article 108 the firmware changelog, article 344 the $11.99/mo or $99.99/yr membership pricing."
  - title: "PA AG complaint against Digital Dream Labs"
    url: "https://www.attorneygeneral.gov/wp-content/uploads/2024/09/DDL-Combined-Complaint-for-FIling-1.pdf"
    description: "September 2024 Court of Common Pleas filing: PA AG Henry v. Digital Dream Labs and CEO Hanchar over unfulfilled prepaid robot orders (>$4M in sales, ~14,000 orders Nov 2020-Jan 2024 per the AG's announcement)."

