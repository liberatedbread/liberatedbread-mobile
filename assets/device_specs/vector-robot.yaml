cloud:
  required: false
  vendor_service: "DDL Vector AI Subscription (chipper voice processing, TMS token service, jdocs)"
  failure_mode: >
    Without a paid membership the robot loses cloud-processed voice commands
    ("Hey Vector" intents) and ChatGPT connectivity; DDL also gates the
    onboarding token exchange behind its account system. Local gRPC control
    is unaffected once a GUID has been issued. As of 2026-07-31 the official
    OTA/firmware hosts fail DNS entirely, while anki.bot continues to bill
    subscriptions ($11.99/mo or $99.99/yr per robot, verified 2026-08-04).
  notes: >
    Every cloud-dependent function has a local replacement: wire-pod
    substitutes for chipper (voice intents), TMS (token/GUID issuance) and
    jdocs (settings storage), so `required` is false for an owner willing to
    run it.
  auth:
    type: "other"
    notes: >
      Robot-to-cloud auth uses the client_token_guid issued at onboarding;
      the subscription is an account-level entitlement checked server-side.
      wire-pod issues the GUID locally and never contacts DDL.
    verification: "reported"

local_access:
  status: "native"
  summary: >
    Vector speaks gRPC over TLS on the LAN as shipped; the only vendor-cloud
    steps were voice-intent processing and the onboarding token exchange,
    and wire-pod replaces both. For production robots the wire-pod path
    requires one firmware detour: boot recovery mode, pair over Web
    Bluetooth in Chrome, and accept DDL's production-signed
    Escape-Pod-compatible "ep" OTA (free, no Escape Pod purchase), then
    clear user data and authenticate against the local wire-pod instance.
    Unlocked (OSKR/dev) robots can instead run the fully open WireOS.
  covers:
    - "full gRPC ExternalInterface control (69 RPCs) and REST gateway on the LAN"
    - "voice commands via local wire-pod (Vosk STT by default; no audio leaves the LAN unless a remote STT/LLM plugin is configured)"
    - "onboarding, re-provisioning and GUID issuance without any vendor account"
    - "firmware freedom on unlocked robots via WireOS"
  not_covered:
    - "DDL's ChatGPT integration and any future cloud-only features — tied to the paid membership"
    - "official OTA updates — the vendor OTA hosts no longer resolve; wire-pod/WireOS are the update path"
  notes: >
    Remaining friction on the production path, per the wire-pod wiki:
    Chrome/Chromium-only Web Bluetooth (chrome://flags experimental
    features on some builds; Linux may need the Bluetooth panel actively
    discovering), unsigned installers (SmartScreen, unidentified macOS
    developer, Android unknown-sources/Play Protect), and an authentication
    step that the wiki itself warns may need several ~20-second-spaced
    retries. The original companion app com.anki.victor is no longer
    fetchable from APKPure, APKMirror or APKCombo (checked 2026-08-04), so
    the Web Bluetooth pages are the de facto onboarding client.
