# Gerbing / GYDE ThermoGauge Heated Clothing Controller
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# UUIDs and GATT profile extracted from ThermoGauge.Core.dll via
# ECMA-335 metadata parser + IL disassembler (static analysis).
# All 10 UUIDs authoritatively mapped to field names in Model::.ctor.
# All 4 data formats decoded from IL bytecode.
#
# Source: com.gyde.thermogauge.apk (Xamarin.Forms, built 2020-04-23)
# Report: ~/research/gerbing-thermogauge/UUID_EXTRACTION.md

device:
  name: "Gerbing / GYDE ThermoGauge Heated Clothing Controller"
  manufacturer: "GYDE (Gerbing Heated Clothing)"
  manufacturer_status: "active"
  protocol: "ble"
  model: "coreheat7"
  notes: >
    BLE controller for Gerbing heated clothing. Supports dual-channel
    heat control (2 independent zones) and dual temperature sensor
    inputs depending on hardware variant. Product names "coreheat7"
    (7.4V) and "coreheat12" (12V) — voltage detected from advertised
    name. Xamarin.Forms Android app.

    UUID EXTRACTION: All 10 UUIDs recovered from ThermoGauge.Core.dll
    .NET assembly via IL disassembly. UUIDs are plain string literals
    in the #US heap (UTF-16LE), not binary Guid structs. Earlier
    attempts with `strings` (ASCII) and blob scanning failed because
    the heap is UTF-16LE — `strings -e l` finds them instantly.

    HEAT WRITE FORMAT: 1 byte, (byte)float value, 0-100 percent.
      Channel A: HeatChar1 (90759319-…)
      Channel B: HeatChar2 (80c37f00-…)
      Heat >100: untested, app does not clamp — treat as unsafe.

    TEMP READ FORMAT: 1 byte, unsigned. Display: ceil((raw/2+85)/5)*5.
      Units: inferred °F (raw=0→85, raw=142≈156, raw=255≈215).
      TempControl mode active when 60 <= raw < 142 (~115-155°F).

    BATTERY: 1 byte, 0-100%, standard SIG Battery Level (0x2A19).

    DEVICE TYPE: 1 byte, high nibble = heat outputs, low nibble = temp
      inputs. e.g., 0x21 = 2 outputs, 1 input. Under Device Info
      (0x180A) as custom characteristic 0313fb4e-… (not standard DIS).

    SCAN FILTER: name Contains("Gerbing") || Contains("Gyde").
      Not a prefix match — substring anywhere in advertised name.
      Auto-reconnect on device.ID match.

    BATTERY SAVER: level <=20% triggers heat clamp to max 20 (7.4V only,
      12V exempt). IL set_BatteryLevel: `ldc.i4.s 20; bgt.s end` — the
      equality case clamps too. >=40% deactivates saver.

    SHARED OEM MODULE: the Snooz white-noise machine ships the identical
      custom service 729f0608-… with the same chars 90759319-… (write)
      and 80c37f00-… (read/notify) — live-hardware cross-confirmation of
      this UUID family (HA core snooz integration; pysnooz 0.8.6 writes
      [command_id, …data] frames). Frame semantics are per-product
      firmware (Snooz: 2-byte commands; Thermogauge: raw 1-byte level) —
      do NOT port Snooz command tables to Gerbing hardware.

    CONFIDENCE: HIGH for all UUIDs and data formats — every value
    backed by ldstr→stfld IL pairs (UUIDs) or IL bytecode ops (formats).
    Characteristic *usage* is provable statically (heat chars written +
    read back; temp/battery read); the advertised property bits are
    per-product firmware — the Snooz GATT dump shows the same UUIDs with
    different bits (90759319 write-only, 80c37f00 read+notify), so the
    properties below list proven usage and notify needs a Thermogauge
    GATT dump. Remaining unknowns: actual temp units (inferred °F),
    notify support vs poll-only, firmware heat clamping above 100.

  identification:
    local_name_contains:
      - "Gerbing"
      - "Gyde"
    service_uuids:
      - "ab06bd90-cc16-11e4-8830-0800200c9a66"
      - "729f0608-496a-47fe-a124-3a62aaa3fbc0"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "contains"
            values:
              - "Gerbing"
              - "Gyde"
          service_uuids:
            - "ab06bd90-cc16-11e4-8830-0800200c9a66"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning required. Scan for devices with "Gerbing" or
      "Gyde" in their name. Connect, discover services, read device
      type to determine channel count. No pairing or bonding observed
      in the app source.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Scan for BLE advertisements with name containing "Gerbing"
          or "Gyde". Connect, discover services, read DeviceType to
          determine channel counts. Write 1-byte heat levels to
          HeatChar1/2. Read TempChar1/2 for temperature feedback.
          Read Battery Level (0x2A19) for battery percentage.
        ble:
          pairing_required: false
        steps:
          - action: "Scan for BLE advertisements with name containing Gerbing or Gyde."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect and discover services (0x180A, 0x180F, ab06bd90-…, 729f0608-…)."
            actor: "client"
          - action: "Read DeviceType (0313fb4e-…) to determine channel count."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: "Unknown. No factory reset procedure found in app source."
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Disconnect battery, wait 10+ seconds, reconnect."
              actor: "user"
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: "BLE GATT. No auth or pairing in app source."

  variants:
    - model: "coreheat7"
      notes: "7.4V battery. Subject to battery-saver heat clamp at 20% or below."
    - model: "coreheat12"
      identification:
        local_name_contains:
          - "12V"
      notes: "12V battery. Exempt from battery-saver heat clamp."

services:
  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    name: "Device Information"
    notes: "SIG standard Device Information Service."
    characteristics:
      - uuid: "0313fb4e-198b-4f64-a883-52b218c10ccc"
        name: "Device Type"
        properties: ["read"]
        notes: >
          Custom characteristic under standard DIS. 1 byte: high nibble =
          number of heat output channels, low nibble = number of temperature
          sensor inputs. e.g., 0x21 = 2 outputs, 1 input. Drives single/
          dual-channel UI. Nibbles A-F silently fail to parse (app uses
          int.TryParse per character from X2 format).

  - uuid: "ab06bd90-cc16-11e4-8830-0800200c9a66"
    name: "Temperature Service"
    notes: >
      Custom service. Two temperature sensor channels. UUID family uses
      vendor base cc16-11e4-8830-0800200c9a66 (version-1 timestamp ~2014).
    characteristics:
      - uuid: "ab06bd91-cc16-11e4-8830-0800200c9a66"
        name: "Temperature Channel 1"
        properties: ["read"]
        notes: >
          1 unsigned byte. Display: ceil((raw/2+85)/5)*5, inferred °F.
          Valid control range: 60 <= raw < 142 (~115-155°F).
          Read usage proven statically; the app also registers
          ValueUpdated, so notify is likely — but property bits are
          per-product firmware (see device notes) and need a Thermogauge
          GATT dump to confirm.

      - uuid: "ab06bd92-cc16-11e4-8830-0800200c9a66"
        name: "Temperature Channel 2"
        properties: ["read"]
        notes: >
          Same format as Channel 1. Only active on dual-input devices.
          Same property-bits caveat as Channel 1.

  - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
    name: "Battery Service"
    notes: "SIG standard Battery Service."
    characteristics:
      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "Battery Level"
        properties: ["read"]
        notes: >
          Standard SIG Battery Level. 1 unsigned byte, 0-100%.
          Read usage proven statically; notify unconfirmed (property
          bits are per-product firmware — see device notes).

  - uuid: "729f0608-496a-47fe-a124-3a62aaa3fbc0"
    name: "Heat Control Service"
    notes: >
      Custom service. Two independent heat channels. UUIDs are mutually
      unrelated (not suffixes of a common base) — HeatChar1, HeatChar2,
      and the service itself are three different UUIDs.
    characteristics:
      - uuid: "90759319-1668-44da-9ef3-492d593bd1e5"
        name: "Heat Channel 1"
        properties: ["read", "write"]
        notes: >
          1 byte: (byte)heat_level where heat_level is a float 0-100.
          Write: new byte[1] { (byte)value }. Same byte format for read.
          Labels: <=25=LO, <=50=MED, <=75=HI, >75=EXTRM.
          Write + read-back usage proven statically; notify unconfirmed —
          on the sibling Snooz device this exact UUID is write-only
          (property bits are per-product firmware, see device notes).

      - uuid: "80c37f00-cc16-11e4-8830-0800200c9a66"
        name: "Heat Channel 2"
        properties: ["read", "write"]
        notes: >
          Same format as Channel 1. Only active on dual-output devices.
          Same property-bits caveat as Channel 1 (on Snooz this UUID is
          read+notify — per-product firmware).

payload_formats:
  DeviceType:
    description: "1-byte configuration byte (custom char under 0x180A DIS)."
    fields:
      - index: 0
        name: "channels"
        description: >
          High nibble = heat output channels (1-2). Low nibble = temp sensor
          inputs (1-2). e.g., 0x21 = 2 outputs, 1 input.

  HeatLevel:
    description: "1-byte heat level. Write and read use same format."
    fields:
      - index: 0
        name: "heat_percent"
        description: >
          Single byte, (byte)float_value, 0-100. Values >100 are not clamped
          by the app — firmware behavior untested.

  Temperature:
    description: "1-byte unsigned temperature reading."
    fields:
      - index: 0
        name: "temp_raw"
        description: >
          Unsigned byte 0-255. TempControl valid when 60 <= raw < 142.
          Display formula: ceil((raw/2+85)/5)*5 (inferred °F).

  BatteryLevel:
    description: "Standard SIG Battery Level (0x2A19)."
    fields:
      - index: 0
        name: "battery_percent"
        description: "1 unsigned byte, 0-100 percent."

entities:
  - platform: "number"
    name: "Heat Level 1"
    icon: "mdi:heat-wave"
    min: 0
    max: 100
    step: 1
    state_characteristic: "90759319-1668-44da-9ef3-492d593bd1e5"
    command_characteristic: "90759319-1668-44da-9ef3-492d593bd1e5"

  - platform: "number"
    name: "Heat Level 2"
    icon: "mdi:heat-wave"
    min: 0
    max: 100
    step: 1
    state_characteristic: "80c37f00-cc16-11e4-8830-0800200c9a66"
    command_characteristic: "80c37f00-cc16-11e4-8830-0800200c9a66"

  - platform: "sensor"
    name: "Temperature 1"
    device_class: "temperature"
    unit: "°F"
    state_characteristic: "ab06bd91-cc16-11e4-8830-0800200c9a66"

  - platform: "sensor"
    name: "Temperature 2"
    device_class: "temperature"
    unit: "°F"
    state_characteristic: "ab06bd92-cc16-11e4-8830-0800200c9a66"

  - platform: "sensor"
    name: "Battery Level"
    device_class: "battery"
    unit: "%"
    state_characteristic: "00002a19-0000-1000-8000-00805f9b34fb"
