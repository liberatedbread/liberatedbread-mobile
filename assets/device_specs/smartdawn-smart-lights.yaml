device:
  name: "SmartDawn Smart Lights"
  manufacturer: "Hangzhou Daniao Technology Co., Ltd (SmartDawn/Minetom store brand)"
  manufacturer_status: "active"
  protocol: "ble"
  notes: >
    SmartDawn (smartdawn.com, Shopify storefront linked to the Minetom
    string-lights seller) sells addressable-RGB holiday lighting: RGBIC
    permanent outdoor string lights, icicle/net/curtain lights, meteor-shower
    tubes, cone trees. The products are white-label builds of Hangzhou Daniao
    Technology's "point-controlled color light" platform — the same stack
    behind Daniao's SuperPix (com.daniaokeji.cs) and legacy SmartPixel apps.

    COMPANION APP: "SmartDawn" — Android com.daniaokeji.smartdawn (v1.2.4,
    updated 2026-01-06), iOS id 6749049089. Features: music/mic reactive
    modes, hand-drawn patterns, scrolling text, photo-to-light, groups,
    timers. Local BLE control works without any account or cloud.

    PROTOCOL: custom "DDP/DNX" stack, mapped from decompilation of the
    official SmartDawn.apk v1.2.4 (jadx: com.daniaokeji.libs.bluetooth.
    BleUtils5, com.daniaokeji.libs.udp.*) cross-checked against the app's
    bundled H5 JavaScript (assets/HTML), which implements the same encoders
    a second time. Commands are protobuf messages wrapped in a 20-byte
    extended DDP header, fragmented into BLE writes carrying a 4-byte
    fragment header. Simple commands (power, brightness) need no protobuf
    beyond a single SimpleMessage {i1} value.

    DISCOVERY: advertised local name is 6-8 chars starting with "DN"
    (app-side filter, case-insensitive), and the custom service UUID
    00000074-1972-1925-3022-077119514e44 is advertised and used as the
    app's scan filter. Advertisements also carry a 14-byte manufacturer-data
    record (fw_ver, factory id, product type, width, height, group, vendor,
    run-mode/leader flags).

    WIFI VARIANTS: Daniao's platform also supports Wi-Fi control — same DDP
    framing over UDP port 4048, device presence announcements to app UDP
    port 14040, and AP-mode provisioning (controller AP "DN??????",
    password "00000000"; or phone hotspot named i5g*/I5G* with password
    "00000000"). Whether shipping SmartDawn-branded SKUs enable Wi-Fi is
    unverified; the curtain lights are BLE-per-listing.

    CONFIDENCE: HIGH (code-sourced) for discovery, GATT layout, fragment
    framing, extended-header layout, and the command vocabulary — read from
    two independent implementations inside the vendor's own app. No live
    over-the-air capture exists yet; payload field usage per command
    (SimpleMessage i1/i2/s1 semantics, ranges) follows app call sites and is
    medium confidence. Header shape and UDP port 4048 echo the WLED/xLights
    DDP (Digital Display Protocol), suggesting a derivation, but the DNX
    extended channel is Daniao-specific.

  identification:
    # Advertised local name is 6-8 chars starting with "DN" (the official
    # app's scan filter, case-insensitive) — see the DISCOVERY note above.
    # Declared here as well as per-variant so clients that identify by the
    # device-level block can match before/without service discovery.
    local_name_prefix: "DN"
    service_uuids:
      - "00000074-1972-1925-3022-077119514e44"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "DN"
          service_uuids:
            - "00000074-1972-1925-3022-077119514e44"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      BLE models need no provisioning: power on, scan for the DN-prefixed
      name or the 00000074-... service UUID, connect, subscribe to the DDP
      and BIN notify characteristics, negotiate MTU (app requests 512,
      payload MTU = negotiated - 3, fallback 20), then send a time sync
      (M_TIME_SYNC, mt=2504). No pairing, bonding, or authentication on the
      command path — auth message types exist but serve cloud/sharing
      flows. Confidence medium: flow is from app code, not a live capture.
      Wi-Fi SKUs (if any ship under SmartDawn) would use the AP-mode flow in
      the notes above (low confidence for this brand).
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Scan for a "DN"-prefixed name (6-8 chars) or the
          00000074-1972-1925-3022-077119514e44 service UUID, connect, enable
          notifications on the DDP (01010074-...) and BIN (02010074-...)
          characteristics, request MTU, then send M_TIME_SYNC followed by
          normal commands.
        ble:
          pairing_required: false
        steps:
          - action: "Power the lights; they advertise immediately."
            actor: "user"
            request:
              protocol: "ble_gatt"
          - action: >
              Scan for the DN-prefixed name / 00000074-... service UUID and
              connect; subscribe to both notify characteristics and raise MTU.
            actor: "client"
          - action: >
              Send M_TIME_SYNC (mt=2504, TimeSync protobuf) then command
              packets on the DDP write characteristic.
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        M_FACTORY_RESET (mt=2598) and M_REBOOT (mt=2599) commands exist in
        the protocol. The controller hardware also has a physical mode
        button (per the FCC manual: press to switch mode, hold to turn
        off). No BLE bonding state exists to clear.
      procedures:
        - name: "Software factory reset"
          steps:
            - action: "Send M_FACTORY_RESET (mt=2598) over the DDP channel."
              actor: "client"
              expect: "Device resets to factory state (per app code; not captured on hardware)."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        No bonding. Any central within range can connect and send commands.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        BLE path has no credentials. Wi-Fi provisioning (Wi-Fi SKUs only)
        uses the fixed AP/hotspot passphrase "00000000".

  variants:
    - model: "RGBIC permanent outdoor string lights (50/100/150/200 ft)"
      identification:
        local_name_prefix: "DN"
    - model: "Smart curtain lights (JY25CUT series)"
      identification:
        local_name_prefix: "DN"
    - model: "Smart icicle / net / meteor-shower / cone-tree / firecracker (HL1123) lights"
      identification:
        local_name_prefix: "DN"

helpful_urls:
  - title: "SmartDawn store — smart lights collection"
    url: "https://smartdawn.com/collections/smart-lights"
    description: "Vendor storefront listing the product families this spec covers."
  - title: "SmartDawn on Google Play (com.daniaokeji.smartdawn)"
    url: "https://play.google.com/store/apps/details?id=com.daniaokeji.smartdawn"
    description: "Official companion app; v1.2.4 was the source of this protocol map (jadx decompile)."
  - title: "Hangzhou Daniao Technology (ODM)"
    url: "https://daniaokeji.com/"
    description: "Platform vendor behind SmartDawn/SuperPix/SmartPixel apps and controllers."
  - title: "FCC-hosted SmartDawn curtain-lights manual"
    url: "https://fccid.io/m/03e7be1bfdf844811e2d2cef87f6127da9424fa5c4ea7d89950479b3f244e0c4.pdf"
    description: "User manual for JY25CUT-series curtain lights confirming BLE app control and the physical mode button."

# Consumer-side encoder for the fragment framing + DDP pixel packets below —
# what a client dispatches on to push image/animation frames (the transport
# cannot be expressed as declarative command templates).
protocol_handler: "daniao_ddp"

features:
  - type: "image_upload"
    format: "rgb888"
    # Platform bounds, not a panel size: width and height are u8 fields in
    # the advertisement's manufacturer-data record and in the DeviceInfo
    # protobuf (M_DEVICE_INFO_NOTIFY, mt=2103); each model reports its own
    # resolution at runtime.
    max_width: 255
    max_height: 255
    resolution_source: "device_reported"
    # The vendor app's draw / photo-to-light / music modes stream standard
    # DDP DISPLAY packets (datatype 0x01) to the DDP write characteristic;
    # animations are achieved by streaming frames at the desired rate.
    # Stored multi-frame effects additionally exist via the BIN-channel
    # install flow (mt 29xx), not yet mapped well enough to encode. No
    # documented minimum frame interval — throughput is MTU-bound.
    animation: true

services:
  - uuid: "00000074-1972-1925-3022-077119514e44"
    name: "Daniao DDP Service"
    notes: >
      Single custom GATT service carrying the whole protocol. Two logical
      channels: DDP (commands, DNX extended packets) and BIN (bulk/file
      data such as effect, animation, layout and firmware uploads), plus an
      uploader characteristic used in the firmware-update flow.

      BLE FRAGMENT FRAMING (both channels): each logical packet is split
      into writes of at most the negotiated payload MTU (app requests ATT
      MTU 512, payload = MTU - 3, fallback 20). Every write carries a
      4-byte fragment header: [message serial u8] [total fragments u8]
      [fragments remaining after this one u8, counts down to 0] [0x00],
      followed by up to MTU-4 payload bytes. Reassembly keys on bytes 0-2.

      EXTENDED (DNX) PACKET — the command format, 20-byte header:
      [0]=0xF0 (flag nibble 0xF, version 0), [1]=0x04 (from-role; app
      hardcodes 4=gateway), [2-3]=sn u16 BE, [4-5]=length u16 BE,
      [6-7]=mt (message type) u16 BE, [8-11]=cid u32 BE (0 from app),
      [12-13]=osn u16 BE, [14]=rcode u8 (0), [15]=ts u8 (random),
      [16-17]=csum u16 BE (app sends 0), [18-19]=0x00 0x00, followed by an
      optional protobuf payload. Default payload type is SimpleMessage
      { int32 i1=1; int32 i2=2; string s1=3; string s2=4; int32 i3=5;
      int32 i4=6; }.

      STANDARD DDP PACKET (pixel/display data, datatype != 0xFF), 10-byte
      header: [0]=flag (PUSH=0x01, QUERY=0x02, REPLY=0x04, STORAGE=0x08,
      TIME=0x10, version bits 0xC0), [1]=sn u8, [2]=datatype
      (DISPLAY=0x01, DNX=0xE6, CONFIG=0xFA, STATUS=0xFB), [3]=target
      (app writes 0x01), [4-7]=offset u32 BE, [8-9]=psize u16 BE.
      Note: the app's dead Java Header.getBytes() writes offset
      little-endian while both live encoders (JS and decode path) treat it
      big-endian — BE is canonical.

      Command templates below cover the 20-byte extended header; "{sn}",
      "{len}", "{ts}" and "{payload}" are the variable parts. No-payload
      commands send the header alone (len = 20).
    initialization:
      - characteristic: "01010074-1972-1925-3022-077119514e44"
        subscribe: true
      - characteristic: "02010074-1972-1925-3022-077119514e44"
        subscribe: true
    characteristics:
      - uuid: "01020074-1972-1925-3022-077119514e44"
        name: "DDP Write"
        properties: ["write"]
        notes: >
          Command channel. Writes are BLE fragments (see service notes)
          whose reassembled payload is one DDP packet — usually a 20-byte
          extended (DNX) header plus optional protobuf payload. Responses
          arrive on the DDP notify characteristic.
        commands:
          power_on:
            description: >
              Turn lights on. M_SET_POWERON (mt=2514), extended header only,
              no payload.
            template: [0xF0, 0x04, "{sn}", "{len}", 0x09, 0xD2, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00]
            parameters:
              sn: { type: "uint16", description: "message sequence, big-endian" }
              len: { type: "uint16", default: 20, description: "total packet length, big-endian" }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
          power_off:
            description: >
              Turn lights off. M_SET_POWEROFF (mt=2515), extended header
              only, no payload.
            template: [0xF0, 0x04, "{sn}", "{len}", 0x09, 0xD3, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16", default: 20 }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
          set_brightness:
            description: >
              Set brightness. M_SET_BRIGHTNESS (mt=2509) with protobuf
              SimpleMessage {i1: brightness} payload (app sends a varint;
              range per UI slider, 0-100 — medium confidence).
            template: [0xF0, 0x04, "{sn}", "{len}", 0x09, 0xCD, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00, "{payload}"]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16", description: "20 + protobuf payload length" }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
              payload: { type: "bytes", description: "SimpleMessage {i1: brightness} protobuf" }
          play_next:
            description: "Next effect. M_PLAY_NEXT (mt=2604), no payload."
            template: [0xF0, 0x04, "{sn}", "{len}", 0x0A, 0x2C, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16", default: 20 }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
          play_prev:
            description: "Previous effect. M_PLAY_PREV (mt=2605), no payload."
            template: [0xF0, 0x04, "{sn}", "{len}", 0x0A, 0x2D, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16", default: 20 }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
          play_effect:
            description: >
              Play a specific effect. M_PLAY_EFFECT (mt=2606) with an
              effect reference payload (effect uuid string — the app's
              effect list is fetched with M_EFFECT_LIST mt=2904; effect
              data files download from
              https://cdn.daniaokeji.com/effects/m1/<id/1000>/<id>, cached
              locally as <id>.eff — FileCache.java in the SmartDawn APK).
            template: [0xF0, 0x04, "{sn}", "{len}", 0x0A, 0x2E, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00, "{payload}"]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16" }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
              payload: { type: "bytes", description: "effect reference (uuid string) protobuf" }
          set_play_speed:
            description: "Set effect speed. M_SET_PLAY_SPEED (mt=2523), SimpleMessage {i1: speed}."
            template: [0xF0, 0x04, "{sn}", "{len}", 0x09, 0xDB, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00, "{payload}"]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16" }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
              payload: { type: "bytes", description: "SimpleMessage {i1: speed} protobuf" }
          set_color_mode:
            description: >
              Set color/palette mode. M_SET_COLOR_MODE (mt=2603); related
              commands M_SET_PALETTE (2601) and M_SET_COLOR_EXT (2628) carry
              palette/color payloads.
            template: [0xF0, 0x04, "{sn}", "{len}", 0x0A, 0x2B, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00, "{payload}"]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16" }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
              payload: { type: "bytes" }
          set_mode_loop:
            description: "Loop the effect playlist. M_SET_MODE_LOOP (mt=2507), no payload."
            template: [0xF0, 0x04, "{sn}", "{len}", 0x09, 0xCB, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16", default: 20 }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
          set_mode_single:
            description: "Play a single effect once. M_SET_MODE_SINGLE (mt=2508), no payload."
            template: [0xF0, 0x04, "{sn}", "{len}", 0x09, 0xCC, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16", default: 20 }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
          time_sync:
            description: >
              Sync device clock right after connect. M_TIME_SYNC (mt=2504)
              with TimeSync protobuf {offset, time, dst}.
            template: [0xF0, 0x04, "{sn}", "{len}", 0x09, 0xC8, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00, "{payload}"]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16" }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
              payload: { type: "bytes", description: "TimeSync {offset, time, dst} protobuf" }
          get_running_status:
            description: "Query running state. M_GET_RUNNING_STATUS (mt=2104); device answers with status/device-info notifications."
            template: [0xF0, 0x04, "{sn}", "{len}", 0x08, 0x38, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16", default: 20 }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
          music_start:
            description: "Enter music-reactive mode. M_MUSIC_START (mt=2611); M_MUSIC_STOP = 2612."
            template: [0xF0, 0x04, "{sn}", "{len}", 0x0A, 0x33, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00, "{payload}"]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16" }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
              payload: { type: "bytes" }
          reboot:
            description: "Reboot the controller. M_REBOOT (mt=2599), no payload."
            template: [0xF0, 0x04, "{sn}", "{len}", 0x0A, 0x27, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16", default: 20 }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }
          factory_reset:
            description: "Factory reset. M_FACTORY_RESET (mt=2598), no payload. Not verified on hardware."
            template: [0xF0, 0x04, "{sn}", "{len}", 0x0A, 0x26, "{cid}", "{osn}", 0x00, "{ts}", 0x00, 0x00, 0x00, 0x00]
            parameters:
              sn: { type: "uint16" }
              len: { type: "uint16", default: 20 }
              cid: { type: "uint32", default: 0 }
              osn: { type: "uint16", default: 1 }
              ts: { type: "uint8", default: 0 }

      - uuid: "01010074-1972-1925-3022-077119514e44"
        name: "DDP Notify"
        properties: ["notify"]
        notes: >
          Command responses and state pushes, reassembled with the same
          4-byte fragment header. Notable inbound messages:
          M_DEVICE_INFO_NOTIFY (mt=2103, DeviceInfo protobuf with hardware,
          ports, capacity, colorOrder, chipType, fwVer, effects,
          productType, width, height), M_POWER_STATUS_NOTIFY (mt=2105),
          M_PLAY_INFO_NOTIFY (mt=2610), M_PLAY_PROGRESS_NOTIFY (mt=2630),
          M_NOTIFY_TWINKLE (mt=2597).

      - uuid: "02020074-1972-1925-3022-077119514e44"
        name: "BIN Write"
        properties: ["write"]
        notes: >
          Bulk-data channel (same fragment framing) used to push effects,
          animations, layouts and other file payloads — M_START_INSTALL_*
          (mt 2901/2906/2915/2918/2921), *_PACKET, M_END_INSTALL_* flows.

      - uuid: "02010074-1972-1925-3022-077119514e44"
        name: "BIN Notify"
        properties: ["notify"]
        notes: >
          Responses/progress for the BIN channel (e.g.
          M_INSTALL_EFFECTS_PACKET mt=2016 acknowledgements,
          M_UPLOAD_PROGRESS mt=2933).

      - uuid: "27923001-2072-1925-3022-077119514e44"
        name: "Uploader"
        properties: ["write"]
        notes: >
          Firmware-upload characteristic used by the OTA flow
          (M_START_UPDATE_FIRMWARE mt=2912, M_UPDATE_FIRMWARE_PACKET
          mt=2913, M_END_UPDATE_FIRMWARE mt=2914). Firmware binaries are
          fetched from https://daniaokeji.com/led/ota?<product,fw,...>
          which returns {code, fw:{version, desc, date, url}}.

entities:
  - platform: "light"
    name: "SmartDawn Lights"
    features: ["brightness", "effect", "color"]
    state_characteristic: "01010074-1972-1925-3022-077119514e44"
