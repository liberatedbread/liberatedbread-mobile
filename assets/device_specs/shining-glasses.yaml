device:
  name: "Shining Glasses"
  manufacturer: "Shenzhen Shining Bright Technology"
  manufacturer_status: "active"
  protocol: "ble"
  notes: >
    Bluetooth-controlled LED glasses. Uses identical protocol to Shining Mask
    (same UUIDs, AES encryption, ASCII-based 16-byte command format, DATS/DATCP handshake).
    AES-128-ECB encryption via native libAES.so with a fixed default key —
    the 16-byte key 32672f7974ad43451d9c6c894a0e8764 was recovered verbatim
    from the vendor APK's libAES.so (arm64 .data, file offset 0x3008) and
    matches the published family key (same cdbwsoft codebase as Magic Display).
    Discovery: the vendor app matches manufacturer advertising data
    {0x54, 0x52, 0x00, 0x41} ("TR" + 0x0041), not the service UUID.
    Fixed 36x12 grid (SL-012 manual: 432 lamp beads; hardware captures show
    1,368-byte frames = 72-byte mask + 36x12x3 RGB). FCC ID 2AOLNSL-004
    (grantee 2AOLN, model SL-004 "Funky Glasses").
    No pairing required.
    Vendor is active: app v1.2.7 updated Dec 2025; design-patent judgment won
    Oct 2025. CONFIDENCE: command/UUID mapping and AES key HIGH (public
    decompile of com.icwork.shiningglass v1.2.7,
    Jhan-vasquez-dev/shining-glasses, incl. HCI captures).
    Evidence: com/icwork/shiningglass/base/App.java:21 (keyExpansionDefault);
    model/data/DiyAgreement.java (command framing, REOK ack parsing).
  identification:
    service_uuids:
      - "0000fff0-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          manufacturer_data:
            company_id: 21076
            match: "prefix"
            pattern: "54520041"
            description: >
              Vendor app discovery (BleConfig.matchProduct, ConnectActivity):
              the manufacturer-data (AD type 0xFF) payload must start with
              0x54 0x52 0x00 0x41 ("TR" + 0x0041; company_id 21076 = 0x5254 is
              the "TR" prefix little-endian). The app does not filter on the
              0000fff0 service UUID.
    identity:
      stable_keys: ["address"]
      display: "service_uuid"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      No provisioning. Commands are AES-encrypted with a fixed key, so any
      client that implements the framing can connect straight away.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          No provisioning step: the device advertises as soon as it is powered
          on and accepts a connection from any central. There is no account, no
          network credential exchange and no pairing PIN, so a replacement
          client only has to scan, connect and write.
        ble:
          pairing_required: false
        steps:
          - action: "Power the device and scan for its advertisement."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect and run the documented initialization sequence, if the spec defines one."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        No credential state to clear. Power-cycling drops the current
        connection, which is the actual remedy for the common failure mode:
        the device already being connected to another central.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "Device advertises again and accepts a new connection."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds this device to a network or an owner, so switching
        controllers is just connecting from the new one. If the old client is
        an Android or iOS phone, remove the device from the OS Bluetooth list
        as well — a cached bond can keep the phone reconnecting automatically
        and holding the single available link.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        Anything within radio range can connect and issue commands. Physical
        proximity is the only access control.
# Custom consumer-side handler for the cdbwsoft AES-128-ECB command framing
# (shared with Magic Display). Declarative.
protocol_handler: "cdbwsoft_ecb"

services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "Shining Glasses Service"
    notes: >
      Single primary service holding the four d44bc439 command/transfer
      characteristics (hardware handle table in Jhan-vasquez-dev/shining-glasses
      PROTOCOL.md; the cdbwsoft BleManager binds 0000fff0 as the runtime
      service). There is NO separate d44bc439-...-9600 service and no FFF1
      characteristic on this device.
    characteristics:
      - uuid: "d44bc439-abfd-45a2-b575-925416129600"
        name: "Command"
        properties: ["write"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "static"
          static_key: "32672f7974ad43451d9c6c894a0e8764"
        notes: >
          AES-128-ECB, fixed static key. Key recovered verbatim from the vendor
          APK's libAES.so (arm64 .data at file offset 0x3008, immediately
          followed by the AES S-box); identical to the family key published by
          Jhan-vasquez-dev/shining-glasses, the Staars gist and
          tayred06/shining-mask-controller. Confidence: HIGH.
        commands:
          set_brightness:
            description: "Set brightness (AES encrypted). Plaintext: [0x06, 'L','I',0x47,0x48,'T', brightness]"
            template: [0x06, 0x4C, 0x49, 0x47, 0x48, 0x54, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255
          set_speed:
            description: "Set animation speed. Plaintext: [0x06, 'S','P','E','E',0x44, speed]"
            template: [0x06, 0x53, 0x50, 0x45, 0x45, 0x44, "{speed}"]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
          select_animation:
            description: "Select built-in animation by index. Plaintext: [0x05, 'ANIM', index]"
            template: [0x05, 0x41, 0x4E, 0x49, 0x4D, "{index}"]
            parameters:
              index:
                type: "uint8"
                min: 0
                max: 255
          select_image:
            description: "Select built-in image by index. Plaintext: [0x05, 'IMAG', index]"
            template: [0x05, 0x49, 0x4D, 0x41, 0x47, "{index}"]
            parameters:
              index:
                type: "uint8"
                min: 0
                max: 255
          set_foreground_color:
            description: "Set text foreground color (R,G,B)"
            template: [0x06, 0x46, 0x43, "{flag}", "{red}", "{green}", "{blue}"]
            parameters:
              flag:
                type: "uint8"
                min: 0
                max: 255
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          enter_diy_mode:
            description: "Enter DIY drawing mode (single frame). Plaintext: [0x06, 'SMVEW', 0x01]"
            value: [0x06, 0x53, 0x4D, 0x56, 0x45, 0x57, 0x01]
          exit_diy_mode:
            description: "Exit DIY mode without saving. Plaintext: [0x06, 'SMVEW', 0x00]"
            value: [0x06, 0x53, 0x4D, 0x56, 0x45, 0x57, 0x00]
          exit_diy_save:
            description: "Exit DIY mode and save. Plaintext: [0x06, 'SMVEW', 0x02]"
            value: [0x06, 0x53, 0x4D, 0x56, 0x45, 0x57, 0x02]
          play_diy:
            description: "Play DIY animation"
            value: [0x04, 0x50, 0x4C, 0x41, 0x59]
          stop_rhythm:
            description: "Stop rhythm/audio mode"
            value: [0x04, 0x53, 0x4F, 0x55, 0x54]

      - uuid: "d44bc439-abfd-45a2-b575-925416129601"
        name: "Notification"
        properties: ["notify"]

      - uuid: "d44bc439-abfd-45a2-b575-92541612960a"
        name: "Image Upload"
        properties: ["write"]

      - uuid: "d44bc439-abfd-45a2-b575-92541612960b"
        name: "Audio/DIY Realtime"
        properties: ["write"]

  # OTA firmware update path (Panchip). There is no FFF1 characteristic on
  # this device — that entry was carried over from the magic-display spec.
  - uuid: "0000fd00-0000-1000-8000-00805f9b34fb"
    name: "Panchip OTA Service"
    notes: >
      OTA service with characteristics fd01/fd02 (per
      Jhan-vasquez-dev/shining-glasses). The vendor APK bundles two firmware
      images (TR1906R04-1-10_OTA.bin, TR1906R04-10_OTA.bin) — Panchip OTA
      containers with a 16-byte FileInfo header; payload format not yet
      decoded.

entities:
  - platform: "light"
    name: "Glasses Display"
    features: ["brightness", "color"]
    commands:
      set_brightness: "set_brightness"
