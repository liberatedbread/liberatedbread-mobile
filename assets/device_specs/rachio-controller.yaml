device:
  name: "Rachio Controller"
  manufacturer: "Rachio"
  manufacturer_status: "active"
  protocol: "wifi"
  transport: "homekit"
  notes: >
    The observed Rachio controller advertises HomeKit HAP over mDNS with a
    model string matching Rachio-B68A9A. The HAP accessory ID is stable across
    IP changes and should be used for identity. Port 80 is open on the device,
    but this spec currently documents local discovery rather than a complete
    unauthenticated control protocol.
    Silicon lineage: Gen 1 = Electric Imp platform (BlinkUp optical
    provisioning; cloud end-of-life 2024), Gen 2 = AzureWave CU288 / Marvell
    (FCC ID TLZ-CU288), Gen 3 = Rachio's own FCC ID 2AOTB-ZULWC, dual-band
    Wi-Fi plus a 900 MHz radio for the Wireless Flow Meter. Native HomeKit
    exists only on Rachio 3. In-the-wild firmware build:
    iro3-firmware-hk-5-632 ("hk" = HomeKit). Rachio's 2025 Smart Lighting
    Controller uses Matter/Thread — the vendor is migrating new products away
    from HomeKit.
  identification:
    mdns_service_type: "_hap._tcp.local."
    default_port: 80
    identity_keys:
      primary: "hap_id"
      display: "name"

  discovery:
    methods:
      - type: "mdns"
        mdns:
          service_type: "_hap._tcp.local."
          txt_record_keys: ["id", "md", "c#", "pv"]
          identity_mapping:
            stable_keys:
              - source: "txt:id"
                key: "hap_id"
            display:
              source: "name"
    identity:
      stable_keys: ["hap_id"]
      display: "name"
    static_ip_required: false

  setup:
    required: true
    confidence: "low"
    notes: >
      Gen 2 onboarding is documented from the decompiled vendor app
      (com.rachio.iro v2.8, UCLA ECE209AS): SoftAP provisioning with a
      Curve25519 secure session (see below). What is confirmed from the LAN
      probe is the post-setup state: the controller advertises a HomeKit HAP
      service, and HAP pairing gives cloud-free local control. The HomeKit
      setup code is NOT printed on the device — it is generated and displayed
      in the Rachio app (Controller Settings → HomeKit; reportedly iOS-only),
      so HAP pairing depends on the vendor app at least once.
    methods:
      - type: "softap_http"
        verified: false
        description: >
          Gen 2 flow (decompiled com.rachio.iro v2.8): the phone joins the
          unit's setup AP (SSID prefix "Rachio"; device AP at 192.168.10.1),
          then GET /rachio/iroinfo (device info incl. salt), POST
          /prov/secure-session (Curve25519 ECDH; session key derived from the
          shared secret + device salt + serial number — the serial acts as
          PIN), GET /prov/net-info?session_id=N (scan results, AES-CTR
          encrypted), POST /prov/network?session_id=N (home SSID/passphrase,
          AES-CTR encrypted) and POST /sys/time (epoch sync). The Gen 3
          credential exchange is still uncaptured anywhere public.
        steps:
          - action: 'Join the controller''s setup AP (SSID prefix "Rachio"); the device is at 192.168.10.1.'
            actor: "client"
          - action: "GET /rachio/iroinfo for device info and salt."
            actor: "client"
          - action: "POST /prov/secure-session to establish the Curve25519 ECDH session (serial number as PIN)."
            actor: "client"
          - action: "GET /prov/net-info?session_id=N for scan results (AES-CTR, session-scoped)."
            actor: "client"
          - action: "POST /prov/network?session_id=N with the home Wi-Fi credentials (AES-CTR encrypted)."
            actor: "client"
          - action: "POST /sys/time to sync the epoch."
            actor: "client"
            notes: "Gen 2 verified from the decompiled app; the Gen 3 exchange is not captured anywhere public."
      - type: "button_pairing"
        verified: false
        description: >
          HomeKit pairing using the 8-digit setup code generated and displayed
          in the Rachio app (Controller Settings → HomeKit; reportedly
          iOS-only), which provides cloud-free local control once paired.
        steps:
          - action: "Perform a HAP pair-setup against the advertised _hap._tcp service using the app-displayed setup code."
            actor: "client"
            notes: "Not implemented in this project; the most promising route to local control."
    factory_reset:
      confidence: "medium"
      effect: "Clears WiFi credentials, HomeKit pairings and schedules (vendor-documented procedure)."
      procedures:
        - name: "Stop Button held (Rachio 3)"
          hold_seconds: 10
          indicator: "Light bar fills yellow left-to-right during the hold, then flashes blue all across."
          steps:
            - action: "Press and hold the Stop Button (top of the circular button pad) until the light bar flashes blue all across."
              actor: "user"
        - name: "Unplug + hold Up-Arrow and Select (Gen 1 / Gen 2)"
          steps:
            - action: "Unplug the controller, hold Up-Arrow + Select, and re-power while holding."
              actor: "user"
              notes: "Vendor-documented procedure for Gen 1/Gen 2 units."
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: "Unverified. Assume reset-and-reprovision until the onboarding flow is captured."
    credentials:
      wifi_passphrase_protection: "unknown"
      stored_on_device:
        - "WiFi credentials"
        - "HomeKit pairing keys"
      issued_to_client:
        - "HomeKit long-term public key pair, if HAP pairing is used"

evidence:
  live_lan_probe:
    date: "2026-07-16"
    address: "10.69.195.186"
    hostname: "WICED-hap-B68A9A.local"
    mdns_service_type: "_hap._tcp"
    model_txt: "Rachio-B68A9A"
    port: 80
    hap_id: "0A:01:0A:36:39:1E"

http_endpoints:
  - method: "GET"
    path: "/"
    name: "Device HTTP Root"
    description: "TCP port 80 was observed open. Control path is not yet documented as a complete local unauthenticated REST API."

entities:
  - platform: "switch"
    name: "Irrigation Zone"
    state_topic: "homekit://{hap_id}"
    commands:
      turn_on: "HAP characteristic write"
      turn_off: "HAP characteristic write"

