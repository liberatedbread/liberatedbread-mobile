plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing material, kept out of the repo. android/.gitignore excludes
// key.properties and every *.keystore/*.jks, so this file is absent on CI and
// on a fresh clone — which is the case the release buildType handles below.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "ca.pigscanfly.liberatedbread"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "ca.pigscanfly.liberatedbread"
        // Flutter 3.44's own floor (24) — above flutter_blue_plus's API 21+
        // requirement. Kept as a literal rather than flutter.minSdkVersion:
        // test/platform/android_manifest_test.dart reads this value to check
        // it stays at or below the API 30 ceiling of the legacy
        // BLUETOOTH/BLUETOOTH_ADMIN permission declarations, and a symbolic
        // reference would blind that guard.
        minSdkVersion = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                // Fall back to the debug keys so `flutter run --release` and the
                // CI release smoke build keep working without a keystore — but
                // say so, loudly. A debug-signed APK cannot be published (Play
                // rejects it) and carries the universally-shared Android debug
                // key, so it grants no signing trust at all. This used to be a
                // silent TODO: the build simply succeeded and produced an
                // unpublishable artifact with nothing to indicate it.
                logger.warn(
                    "WARNING: android/key.properties not found - signing the " +
                    "RELEASE build with DEBUG keys. This artifact is not " +
                    "publishable. See https://flutter.dev/to/reference-keystore")
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}
