include: package:flutter_lints/flutter.yaml

analyzer:
  # Three tighter type-checking modes than the default. Two are on; the third
  # is not, and the reason is worth stating so nobody re-litigates it from
  # scratch.
  #
  # strict-inference and strict-raw-types cost twelve annotations across the
  # app and buy the class of bug where a `dynamic` slips through an untyped
  # parameter or a bare `Map` and only fails at runtime — on a device, in a
  # decoder, holding somebody's reply.
  #
  # strict-casts is NOT on: it flags four casts, one of which is inside
  # lib/src/rust/frb_generated.dart, which is generated by
  # flutter_rust_bridge_codegen and must never be hand-edited (CI fails on
  # drift). Turning it on means either excluding the generated bindings from
  # analysis — losing every other check over them — or carrying a permanent
  # ignore comment in a file that gets rewritten. Revisit if FRB's codegen
  # starts emitting strict-cast-clean output.
  language:
    strict-inference: true
    strict-raw-types: true

  exclude:
    # cargokit's build_tool is a self-contained Dart program with its own
    # pubspec/dependencies; it isn't part of the app and its deps aren't
    # resolved by the app's `flutter pub get`, so analyzing it here errors.
    - rust_builder/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    # flutter_lints 5 dropped this from the defaults; keep it alongside the
    # other const lints above.
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
    prefer_single_quotes: true
    cancel_subscriptions: true
    close_sinks: true
    unawaited_futures: true
